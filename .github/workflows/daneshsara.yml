name: Daneshsara — validate & build
on:
  push:
    branches: [main, master]
    paths: ['daneshsara/**', '.github/workflows/daneshsara.yml']
  pull_request:
    paths: ['daneshsara/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install jsonschema
      - name: Validate data (schemas, cross-references, registry)
        run: python3 daneshsara/build/validate.py
      - name: Build wiki readers and the lands map
        run: |
          for w in daneshsara/data/*/; do w=$(basename "$w"); [ "$w" = psy ] || python3 daneshsara/build/reader.py "$w"; done
          python3 daneshsara/build/lands.py
          python3 daneshsara/build/iran_page.py
          python3 daneshsara/build/core_pages.py
          python3 daneshsara/build/review_page.py
