name: Daneshsara — validate & build
on:
  push:
    branches: [main, master]
    paths: ['daneshsara/**', '.github/workflows/daneshsara.yml']
  pull_request:
    paths: ['daneshsara/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install jsonschema
      - name: Validate data (schemas, cross-references, registry)
        run: python3 daneshsara/build/validate.py
      - name: Build wiki readers and the lands map
        run: |
          # فقط پوشه‌هایی که واقعاً ویکی‌اند (پوشهٔ concepts دارند)
          for w in daneshsara/data/*/; do w=$(basename "$w"); [ "$w" = psy ] || [ ! -d "daneshsara/data/$w/concepts" ] || python3 daneshsara/build/reader.py "$w"; done
          # سازنده‌های لایهٔ خصوصی (مثل iran_page.py) در این مخزن نیستند؛ هر کدام نبود رد می‌شود
          for g in tabar_home lands iran_page core_pages review_page; do
            if [ -f "daneshsara/build/$g.py" ]; then python3 "daneshsara/build/$g.py"; else echo "skip $g.py (not in this copy)"; fi
          done
