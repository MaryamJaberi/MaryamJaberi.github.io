name: Check the portfolio's links

# Every Monday morning: open every link on the portfolio and the first page of every hosted project.
# A broken link opens (or updates) one issue; when everything answers again, the issue is closed.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: portfolio-links
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check links on the live site
        id: check
        run: |
          set +e
          python3 tools/check_links.py > report.md
          echo "broken=$?" >> "$GITHUB_OUTPUT"
          cat report.md
      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          BROKEN: ${{ steps.check.outputs.broken }}
        run: |
          title="Broken links on the portfolio"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ "$BROKEN" != "0" ]; then
            if [ -n "$number" ]; then
              gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file report.md
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file report.md
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "All links answer again."
          fi
