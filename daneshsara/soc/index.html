<title>جامعه — دانش‌سرا</title>

<style>
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);min-height:var(--header-h)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--ink)}
.brand svg{width:26px;height:26px;color:var(--primary)}
.crumbs{font-size:var(--small);color:var(--ink-2)}.crumbs a{color:var(--ink-2)}
.lang{display:flex;gap:2px;border:1px solid var(--line-strong);border-radius:var(--r-full);padding:2px}
.lang button{font:inherit;font-size:var(--chip);padding:4px 10px;border:0;border-radius:var(--r-full);background:transparent;color:var(--ink-2);cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
main{padding-block:var(--s6) var(--s16)}
.hero{display:grid;gap:var(--s3);margin-bottom:var(--s6)}
.hero h1{margin:0}
.hero p{color:var(--ink-2);font-size:1.05rem;max-width:70ch;margin:0}
.draft{display:inline-flex;align-items:center;gap:8px;font-size:var(--chip);padding:4px 12px;border-radius:var(--r-full);background:var(--warn-bg,#FBF1D9);color:var(--warn-ink,#6B4E00);border:1px solid var(--warn-line,#E8D39A)}
.search{display:flex;gap:8px;margin:var(--s4) 0}
.search input{font:inherit;flex:1;min-width:0;padding:10px 14px;border-radius:var(--r-md);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink)}
.fields{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:var(--s6)}
.fields button{font:inherit;font-size:var(--small);padding:6px 14px;border-radius:var(--r-full);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer}
.fields button[aria-pressed=true]{background:var(--primary);color:#fff;border-color:var(--primary)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--s4)}
.grid .card{padding:var(--s5);display:grid;gap:8px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.grid .card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.grid h3{margin:0;font-size:var(--h4)}
.grid p{margin:0;color:var(--ink-2);font-size:var(--small);line-height:1.75;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.kick{font-size:var(--chip);color:var(--primary);font-weight:700}
.sub{color:var(--ink-3);font-size:var(--small);direction:ltr;text-align:start;unicode-bidi:isolate}
[dir=rtl] .sub{text-align:right}
.fsec{margin-bottom:var(--s8)} .fsec h2{font-size:var(--h3);margin:0 0 var(--s1)} .fsec>p{margin:0 0 var(--s4);color:var(--ink-2);max-width:70ch}
article.detail{display:grid;gap:var(--s5);max-width:78ch}
article.detail h1{margin:0}
article.detail .lead{font-size:1.1rem;line-height:1.9;margin:0}
.back{font:inherit;font-size:var(--small);border:0;background:transparent;color:var(--primary);cursor:pointer;padding:0;text-align:start}
.pts{display:grid;gap:var(--s3);margin:0;padding:0;list-style:none}
.pts li{padding:var(--s4) var(--s5);border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);line-height:1.85;position:relative}
.pts li .ref{font-size:var(--chip);color:var(--ink-3);display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.flag{font-size:var(--chip);padding:1px 8px;border-radius:var(--r-full);border:1px solid}
.flag.unreplicated{color:#8A2E2E;border-color:#E3B4B4;background:#FBEDED}
.flag.contested{color:#6B4E00;border-color:#E8D39A;background:#FBF1D9}
.flag.dated{color:var(--ink-2);border-color:var(--line-strong)}
.flag.editor-note{color:var(--primary);border-color:var(--primary)}
h2.sec{font-size:var(--small);color:var(--ink-2);font-weight:600;margin:var(--s2) 0 0;text-transform:uppercase;letter-spacing:.04em}
.links{display:grid;gap:6px}
.links a{display:flex;gap:10px;align-items:baseline;padding:8px 12px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--ink)}
.links a:hover{border-color:var(--primary)}
.links .rel{font-size:var(--chip);color:var(--primary);min-width:7em}
.links .nt{font-size:var(--small);color:var(--ink-2)}
.links .ext{font-size:var(--chip);color:var(--ink-3)}
.ppl{display:flex;flex-wrap:wrap;gap:6px}
.ppl span{font-size:var(--small);padding:4px 10px;border-radius:var(--r-full);border:1px solid var(--line-strong);background:var(--surface)}
.ppl small{color:var(--ink-3)}
.iran{border-inline-start:4px solid var(--primary);padding:var(--s4) var(--s5);border-radius:var(--r-md);background:var(--surface);display:grid;gap:8px}
.iran .q{font-weight:700}
.grade{display:inline-block;font-size:var(--chip);padding:1px 8px;border-radius:var(--r-full);background:var(--ink);color:var(--paper)}
ol.src{direction:ltr;text-align:left;padding-inline-start:1.4em;margin:0;display:grid;gap:6px;font-size:var(--small);color:var(--ink-2);line-height:1.7}
ol.src a{color:var(--primary)}
.status{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:var(--small);color:var(--ink-3)}
footer.foot{border-top:1px solid var(--line);padding-block:var(--s8);color:var(--ink-3);font-size:var(--small)}
@media (prefers-color-scheme: dark){:root:not([data-theme=light]) .flag.unreplicated{background:#3A1F1F;color:#F2B8B8;border-color:#6B3A3A} :root:not([data-theme=light]) .flag.contested,:root:not([data-theme=light]) .draft{background:#3A3010;color:#F0D78A;border-color:#6B5A2A}}
:root[data-theme=dark] .flag.unreplicated{background:#3A1F1F;color:#F2B8B8;border-color:#6B3A3A} :root[data-theme=dark] .flag.contested,:root[data-theme=dark] .draft{background:#3A3010;color:#F0D78A;border-color:#6B5A2A}
</style>

<script>
const D = {"wiki": "soc", "order": ["soc:theory", "soc:cohesion", "soc:inequality", "soc:institutions", "soc:collective", "soc:values", "soc:space", "soc:demography"], "concepts": [{"id": "soc:preference-falsification", "kind": "concept", "title": {"fa": "تحریف ترجیحات و غافلگیری انقلاب‌ها", "en": "Preference falsification and the surprise of revolutions", "nl": "Voorkeursvervalsing en de verrassing van revoluties"}, "aliases": [], "parent": "soc:collective", "field": "soc:collective", "summary": {"fa": "وقتی ابراز مخالفت هزینه دارد، مردم در جمع چیزی می‌گویند که باور ندارند؛ پس هیچ‌کس نمی‌داند چند نفر مثل او فکر می‌کنند، حتی حکومت. یک جرقهٔ کوچک می‌تواند آستانه‌های پنهان را پشت سر هم بیندازد و رژیمی که دیروز پایدار می‌نمود امروز فرو بریزد. برای همین انقلاب‌ها، از جمله ۱۳۵۷، همیشه «تصورناپذیر» بوده‌اند.", "en": "When expressing dissent is costly, people say in public what they do not believe; so no one knows how many think like them, not even the regime. A small spark can trip hidden thresholds in a cascade, and a regime that looked stable yesterday collapses today. That is why revolutions, including 1979, were always \"unthinkable\".", "nl": "Wanneer afwijkende meningen uiten kostbaar is, zeggen mensen in het openbaar wat ze niet geloven; dus weet niemand hoeveel anderen zo denken, zelfs het regime niet. Een kleine vonk kan verborgen drempels in een cascade doen omslaan, en een regime dat gisteren stabiel leek, stort vandaag in. Daarom waren revoluties, ook die van 1979, altijd \"ondenkbaar\"."}, "points": [{"text": {"fa": "کوران (۱۹۹۱): هر فرد آستانه‌ای دارد («وقتی این‌قدر نفر بیرون باشند، من هم می‌آیم»)؛ توزیع این آستانه‌ها پنهان است، پس هم ثبات ظاهری و هم فروپاشی ناگهانی هر دو قابل توضیح‌اند و پیش‌بینی ساختاری ناممکن است.", "en": "Kuran (1991): each person has a threshold (\"when this many are out, I join\"); the distribution of thresholds is hidden, so both apparent stability and sudden collapse are explicable and structural prediction is impossible.", "nl": "Kuran (1991): each person has a threshold (\"when this many are out, I join\"); the distribution of thresholds is hidden, so both apparent stability and sudden collapse are explicable and structural prediction is impossible."}, "sources": ["src:8d71ed0d5f"], "flags": []}, {"text": {"fa": "کرزمن (۲۰۰۴): انقلاب ایران را نه ساختارها (اقتصاد، دولت، دین) که «تجربهٔ زیستهٔ» مردم توضیح می‌دهد: تا پاییز ۱۳۵۷ اکثریت انقلاب را ممکن نمی‌دانستند و درست وقتی ممکن شد که مردم دیدند دیگران هم به خیابان آمده‌اند. ناجنبش‌های بیات و آبشار کوران در همین‌جا به هم می‌رسند.", "en": "Kurzman (2004): the Iranian revolution is explained less by structures (economy, state, religion) than by people's \"lived experience\": until autumn 1978 most thought revolution impossible, and it became possible exactly when people saw others in the street. Bayat's nonmovements and Kuran's cascade meet here.", "nl": "Kurzman (2004): the Iranian revolution is explained less by structures (economy, state, religion) than by people's \"lived experience\": until autumn 1978 most thought revolution impossible, and it became possible exactly when people saw others in the street. Bayat's nonmovements and Kuran's cascade meet here."}, "sources": ["src:435917f7dd"], "flags": []}], "links": [{"to": "soc:social-movements", "rel": "explains", "note": {"fa": "پویایی بسیج", "en": "The dynamics of mobilisation", "nl": "The dynamics of mobilisation"}}, {"to": "psy:norm-psychology", "rel": "bridges", "note": {"fa": "روان‌شناسی هنجار و ناآگاهی جمعی", "en": "Norm psychology and pluralistic ignorance", "nl": "Norm psychology and pluralistic ignorance"}}, {"to": "psy:conspiracy", "rel": "see-also", "note": {"fa": "باور و اطلاعات در جامعهٔ بسته", "en": "Belief and information in a closed society", "nl": "Belief and information in a closed society"}}], "people": ["core:timur-kuran", "core:charles-kurzman"], "sources": ["src:435917f7dd", "src:8d71ed0d5f"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:soc", "kind": "root", "title": {"fa": "جامعه", "en": "Society", "nl": "Samenleving"}, "aliases": [], "parent": null, "field": null, "summary": {"fa": "چرا آدم‌ها در جمع طوری رفتار می‌کنند که هیچ‌کدام به‌تنهایی نمی‌کردند؟ این ویکی مفاهیم جامعه‌شناسی را با شواهد پیمایشی و تجربی کنار هم می‌گذارد: اعتماد و سرمایهٔ اجتماعی، نابرابری، نهادها، کنش جمعی، ارزش‌ها و نسل‌ها، شهر و مهاجرت، شبکه‌ها؛ با نگاهی ویژه به داده‌های ایران.", "en": "Why do people in groups behave in ways none of them would alone? This wiki brings sociology's concepts together with survey and experimental evidence: trust and social capital, inequality, institutions, collective action, values and generations, city and migration, networks; with special attention to data on Iran.", "nl": "Waarom gedragen mensen zich in groepen zoals geen van hen alleen zou doen? Deze wiki brengt de concepten van de sociologie samen met survey- en experimenteel bewijs: vertrouwen en sociaal kapitaal, ongelijkheid, instituties, collectieve actie, waarden en generaties, stad en migratie, netwerken; met bijzondere aandacht voor data over Iran."}, "points": [], "links": [{"to": "psy:p-social", "rel": "bridges", "note": {"fa": "روان‌شناسی اجتماعی در ویکی روان", "en": "Social psychology in the psychology wiki", "nl": "Social psychology in the psychology wiki"}}, {"to": "psy:social-capital", "rel": "bridges", "note": {"fa": "سرمایهٔ اجتماعی در ویکی روان", "en": "Social capital in the psychology wiki", "nl": "Social capital in the psychology wiki"}}, {"to": "psy:anomie", "rel": "bridges", "note": {"fa": "آنومی در ویکی روان", "en": "Anomie in the psychology wiki", "nl": "Anomie in the psychology wiki"}}], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:demographic-transition", "kind": "concept", "title": {"fa": "گذار جمعیتی", "en": "The demographic transition", "nl": "De demografische transitie"}, "aliases": [], "parent": "soc:demography", "field": "soc:demography", "summary": {"fa": "همهٔ جوامع از «مرگ‌ومیر بالا، زادوولد بالا» به «هر دو پایین» می‌روند؛ در فاصلهٔ این دو، جمعیت چند برابر می‌شود. اروپا این راه را در دو قرن رفت؛ ایران در دو دهه.", "en": "Every society moves from \"high mortality, high fertility\" to \"both low\"; in between, population multiplies. Europe took two centuries; Iran took two decades.", "nl": "Elke samenleving gaat van \"hoge sterfte, hoge vruchtbaarheid\" naar \"beide laag\"; daartussen vermenigvuldigt de bevolking zich. Europa deed er twee eeuwen over; Iran twee decennia."}, "points": [{"text": {"fa": "لی (۲۰۰۳): از ۱۸۰۰ تا ۲۱۰۰ جمعیت جهان از یک به حدود ده میلیارد می‌رسد و امید به زندگی از حدود ۳۰ به بالای ۸۰ سال؛ گذار با افت مرگ‌ومیر کودکان آغاز می‌شود و افت باروری یک تا دو نسل بعد می‌آید.", "en": "Lee (2003): from 1800 to 2100 world population rises from one to about ten billion and life expectancy from about 30 to over 80; the transition starts with falling child mortality, and fertility falls one or two generations later.", "nl": "Lee (2003): from 1800 to 2100 world population rises from one to about ten billion and life expectancy from about 30 to over 80; the transition starts with falling child mortality, and fertility falls one or two generations later."}, "sources": ["src:78add04b88"], "flags": []}, {"text": {"fa": "«پنجرهٔ جمعیتی»: وقتی باروری افتاده ولی سالمندی هنوز نرسیده، سهم جمعیت در سن کار بیشینه است؛ اگر اشتغال و آموزش فراهم باشد سود جمعیتی می‌دهد، وگرنه بیکاری جوانان. ایران از دههٔ ۱۳۸۰ در این پنجره است.", "en": "The \"demographic window\": when fertility has fallen but ageing has not yet arrived, the working-age share peaks; with jobs and schooling it yields a demographic dividend, otherwise youth unemployment. Iran has been in this window since the 2000s.", "nl": "The \"demographic window\": when fertility has fallen but ageing has not yet arrived, the working-age share peaks; with jobs and schooling it yields a demographic dividend, otherwise youth unemployment. Iran has been in this window since the 2000s."}, "sources": ["src:6f9476e1dd"], "flags": []}], "links": [{"to": "soc:iran-fertility", "rel": "applies-to", "note": {"fa": "نمونهٔ ایران", "en": "The Iranian case", "nl": "The Iranian case"}}, {"to": "tabar:common-ancestors", "rel": "bridges", "note": {"fa": "ریاضی نسل‌ها", "en": "The mathematics of generations", "nl": "The mathematics of generations"}}], "people": [], "sources": ["src:6f9476e1dd", "src:78add04b88"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:malinowski-functionalism", "kind": "concept", "title": {"fa": "کارکردگرایی مالینوفسکی: فرهنگ پاسخ به نیازها", "en": "Malinowski's functionalism: culture as a response to needs", "nl": "Malinowski's functionalisme: cultuur als antwoord op behoeften"}, "aliases": [], "parent": "soc:theory", "field": "soc:theory", "summary": {"fa": "برونیسلاو مالینوفسکی، مردم‌شناس لهستانی‌تبار، با اقامت چندساله در جزایر تروبریاند به این نتیجه رسید که هر آیین، باور یا رسم را باید با این پرسش فهمید که چه نیازی را برآورده می‌کند. به نظر او فرهنگ نظامی است که نیازهای زیستی، نیاز به نظم و نیازهای ذهنی مثل آرامش و معنا را سازمان می‌دهد. این نگاه جای دو مکتب پیشین، یعنی تطورگرایی و اشاعه‌گرایی، را گرفت.", "en": "Bronislaw Malinowski, a Polish-born anthropologist, lived for years in the Trobriand Islands and concluded that every rite, belief or custom should be understood by asking which need it meets. For him culture is a system that organises biological needs, the need for order, and mental needs such as comfort and meaning. This approach displaced the earlier schools of evolutionism and diffusionism.", "nl": "De Poolse antropoloog Bronislaw Malinowski verbleef jarenlang op de Trobriand-eilanden en stelde dat elk ritueel of gebruik begrepen moet worden via de vraag welke behoefte het vervult. Cultuur is volgens hem een systeem dat biologische, ordenende en symbolische behoeften regelt."}, "points": [{"text": {"fa": "مالینوفسکی در جنگ جهانی اول در گینهٔ نو (جزایر تروبریاند) ماند و سال‌ها در میان مردم آنجا زندگی کرد. این «مشاهدهٔ مشارکتی» به الگوی کار میدانی در مردم‌شناسی تبدیل شد.", "en": "Stranded in New Guinea (the Trobriand Islands) during the First World War, Malinowski lived among the islanders for years; this 'participant observation' became the model for anthropological fieldwork.", "nl": "Stranded in New Guinea (the Trobriand Islands) during the First World War, Malinowski lived among the islanders for years; this 'participant observation' became the model for anthropological fieldwork."}, "sources": ["src:ade2795cc7", "src:f59744a41e"], "flags": []}, {"text": {"fa": "او سه دسته نیاز را از هم جدا می‌کرد: نیازهای زیستی (خوراک، سرپناه، سلامت، تولیدمثل)، نیاز به نظم و ابزارهای سازمان‌دهنده که این نیازها را در قالب نهادها برآورده کند، و نیازهای معنایی و هماهنگ‌کننده مانند دین، آرامش و ایدئولوژی. هر عنصر فرهنگ باید به یکی از این‌ها پاسخ دهد.", "en": "He distinguished three layers of need: biological needs (food, shelter, health, reproduction), the need for order and organised means that channel those needs into institutions, and symbolic or integrative needs such as religion, comfort and ideology. Every cultural element is understood by the need it answers.", "nl": "He distinguished three layers of need: biological needs (food, shelter, health, reproduction), the need for order and organised means that channel those needs into institutions, and symbolic or integrative needs such as religion, comfort and ideology. Every cultural element is understood by the need it answers."}, "sources": ["src:ade2795cc7", "src:7726f14048"], "flags": []}, {"text": {"fa": "مثال معروف او در تروبریاند مردی جوان است که با ازدواج با دختر خالهٔ خود قاعدهٔ برون‌همسری طایفه را شکسته بود. وقتی رقیبش او را در جمع به این گناه متهم کرد، او خودکشی کرد. مالینوفسکی نشان می‌دهد که باور جمعی دربارهٔ گناه چنان نیرومند است که می‌تواند بدون پلیس و ارتش فرد را به مرگ برساند. این مثال با تحلیل دورکایم از فشار اجتماعی و خودکشی هم‌خوان است.", "en": "His well-known Trobriand example is a young man who broke the clan's exogamy rule by marrying a maternal cousin; when a rival publicly accused him, he killed himself. Malinowski shows how collective belief about wrongdoing can drive a person to death with no police or army, which echoes Durkheim's analysis of social pressure and suicide.", "nl": "His well-known Trobriand example is a young man who broke the clan's exogamy rule by marrying a maternal cousin; when a rival publicly accused him, he killed himself. Malinowski shows how collective belief about wrongdoing can drive a person to death with no police or army, which echoes Durkheim's analysis of social pressure and suicide."}, "sources": ["src:ade2795cc7", "src:bfd32d153a", "src:59e5290deb"], "flags": []}, {"text": {"fa": "به گفتهٔ سخنران، مالینوفسکی توضیح نمی‌داد چرا فرهنگ‌ها برای یک نیاز واحد پاسخ‌های متفاوت دارند، و راد‌کلیف‌براون این ضعف را با تأکید بر ساختار اجتماعی جبران کرد. این جمع‌بندی در کل درست است اما ساده‌شده: راد‌کلیف‌براون به‌طور کلی «نیاز» را مبنای تحلیل نمی‌دانست و به‌جای آن «کارکرد» را سهم یک رسم در نگه داشتن ساختار جامعه می‌دید.", "en": "Per the lecturer, Malinowski could not explain why cultures give different answers to the same need, and Radcliffe-Brown remedied this by stressing social structure. This is broadly fair but simplified: Radcliffe-Brown rejected 'needs' as the basis and defined function as a custom's contribution to maintaining social structure.", "nl": "Per the lecturer, Malinowski could not explain why cultures give different answers to the same need, and Radcliffe-Brown remedied this by stressing social structure. This is broadly fair but simplified: Radcliffe-Brown rejected 'needs' as the basis and defined function as a custom's contribution to maintaining social structure."}, "sources": ["src:ade2795cc7", "src:155497a797"], "flags": ["editor-note"]}, {"text": {"fa": "تذکر: ادعای «هر پدیده‌ای که کارکرد نداشته باشد از بین می‌رود» در نقد کارکردگرایی تکرارپذیر نیست و تقریباً غیرقابل‌ابطال است، چون برای هر رسم بقاءیافته می‌توان کارکردی ساخت. منتقدان همچنین می‌گویند کارکردگرایی تاریخ، تغییر و تعارض را کم‌اهمیت می‌گیرد. تبیین سخنران از تابوی زنای با محارم (زیان زیستی فرزندان) هم یکی از چند فرضیه است؛ وسترمارک، فروید و لوی‌استروس هر کدام تبیین دیگری داده‌اند و بحث همچنان باز است.", "en": "Caveat: the claim that any phenomenon without a function disappears is close to unfalsifiable, since a function can be found for any surviving custom; critics also say functionalism underplays history, change and conflict. The lecturer's explanation of the incest taboo (harm to offspring) is one hypothesis among several; Westermarck, Freud and Lévi-Strauss offered others, and the debate is open.", "nl": "Caveat: the claim that any phenomenon without a function disappears is close to unfalsifiable, since a function can be found for any surviving custom; critics also say functionalism underplays history, change and conflict. The lecturer's explanation of the incest taboo (harm to offspring) is one hypothesis among several; Westermarck, Freud and Lévi-Strauss offered others, and the debate is open."}, "sources": [], "flags": ["contested", "editor-note"]}, {"text": {"fa": "تذکر: سخنران می‌گوید زنان «۹۲ درصد» تمدن را ساخته‌اند و مردسالاری انتقام مردان بوده است. این ادعا پشتوانهٔ پژوهشی ندارد. جوامع مادرتبار (مثل تروبریاند) وجود دارند اما در آن‌ها هم معمولاً اقتدار با مردان (در اینجا دایی) است، و شواهد باستان‌شناختی برای جامعه‌ای مادرسالار در گذشته قانع‌کننده نیست.", "en": "Caveat: the lecturer says women built '92 percent' of civilisation and that patriarchy was male revenge. No research supports such a figure. Matrilineal societies exist (such as the Trobriand), but authority there typically still rests with men (the maternal uncle), and evidence for a historical matriarchal society is not convincing.", "nl": "Caveat: the lecturer says women built '92 percent' of civilisation and that patriarchy was male revenge. No research supports such a figure. Matrilineal societies exist (such as the Trobriand), but authority there typically still rests with men (the maternal uncle), and evidence for a historical matriarchal society is not convincing."}, "sources": ["src:bee2ccf553"], "flags": ["contested", "editor-note"]}], "links": [{"to": "soc:theory", "rel": "part-of", "note": {"fa": "از شاخه‌های نظریهٔ جامعه‌شناختی", "en": "A strand of sociological theory", "nl": "A strand of sociological theory"}}, {"to": "soc:anomie", "rel": "see-also", "note": {"fa": "پیوند با دورکایم و فشار هنجارها", "en": "Linked to Durkheim and the pressure of norms", "nl": "Linked to Durkheim and the pressure of norms"}}, {"to": "soc:structural-functionalism", "rel": "explains", "note": {"fa": "زمینهٔ کارکردگرایی ساختاری", "en": "Background to structural functionalism", "nl": "Background to structural functionalism"}}, {"to": "soc:custom-changing-functions", "rel": "explains", "note": {"fa": "ابزار تحلیل رسم‌های ایرانی", "en": "A tool for analysing Iranian customs", "nl": "A tool for analysing Iranian customs"}}], "people": ["core:bronislaw-malinowski", "core:alfred-radcliffe-brown", "core:mile-durkheim"], "sources": ["src:155497a797", "src:59e5290deb", "src:7726f14048", "src:ade2795cc7", "src:bee2ccf553", "src:bfd32d153a", "src:f59744a41e"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:functionalism-assumptions", "kind": "concept", "title": {"fa": "کارکردگرایی ساختاری: پیش‌فرض‌ها و نقدها", "en": "Structural functionalism: assumptions and criticisms", "nl": "Structureel functionalisme: aannames en kritiek"}, "aliases": [], "parent": "soc:theory", "field": "soc:theory", "summary": {"fa": "کارکردگرایی ساختاری، که ریشه‌اش به کنت و دورکایم می‌رسد، جامعه را نظامی از اجزای وابسته می‌بیند که هر کدام به نیازی پاسخ می‌دهند و نظم کل را نگه می‌دارند. نهادهایی مانند خانواده، آموزش، اقتصاد، سیاست و دین را با پرسش «چه نیازی را برآورده می‌کنند؟» تحلیل می‌کند. در برابر آن نظریهٔ کشمکش (مارکسی) قرار دارد که نیروی محرک جامعه را تضاد می‌داند.", "en": "Structural functionalism, rooted in Comte and Durkheim, sees society as a system of interdependent parts, each meeting a need and helping keep the whole in order. It analyses institutions such as family, education, economy, politics and religion by asking what need they meet. Its rival is conflict theory (Marxist), which treats conflict as the driving force of society.", "nl": "Structureel functionalisme ziet de samenleving als een systeem van onderling afhankelijke delen die elk aan een behoefte voldoen en de orde van het geheel bewaren. Het tegenpool is de conflicttheorie."}, "points": [{"text": {"fa": "پیش‌فرض‌هایی که سخنران برمی‌شمرد: جامعه نظام است؛ اجزا به هم وابسته‌اند؛ میان آن‌ها رابطهٔ کارکردی هست؛ اجزا وحدت کارکردی دارند (برای ادامهٔ نظام همکاری می‌کنند)؛ کارکرد در همه‌جا عمومیت دارد؛ و پدیده‌ها تا وقتی کارکرد مثبت دارند می‌مانند و با از دست دادن آن جایشان را به چیز دیگری می‌دهند. پس اگر جزئی تغییر کند، اجزای دیگر هم تغییر می‌کنند.", "en": "The assumptions the lecturer lists: society is a system; parts are interdependent; there is a functional relation among them; parts have functional unity (they cooperate to keep the system going); function is universal; and phenomena persist while they have a positive function and give way to something else when they lose it. So if one part changes, others change too.", "nl": "The assumptions the lecturer lists: society is a system; parts are interdependent; there is a functional relation among them; parts have functional unity (they cooperate to keep the system going); function is universal; and phenomena persist while they have a positive function and give way to something else when they lose it. So if one part changes, others change too."}, "sources": ["src:3c8a365a14", "src:920332b9a8"], "flags": []}, {"text": {"fa": "مرتن همین ایده‌ها را در سه «اصل موضوع» نقد کرد: وحدت کارکردی (همهٔ اجزا برای کل کارکرد دارند)، کارکردگرایی عام (هر پدیده‌ای حتماً کارکرد مثبت دارد) و ضرورت (هر نهاد انحصاراً لازم است). او نشان داد این‌ها بی‌پشتوانه‌اند و باید به جایشان از «کارکرد آشکار و پنهان» و «کژکارکرد» (پیامد زیان‌بار) و جایگزین‌های کارکردی سخن گفت.", "en": "Merton criticised these ideas as three postulates: functional unity (all parts serve the whole), universal functionalism (every phenomenon has a positive function) and indispensability (each institution is uniquely necessary). He argued they are unsupported and proposed instead manifest and latent functions, dysfunctions and functional alternatives.", "nl": "Merton criticised these ideas as three postulates: functional unity (all parts serve the whole), universal functionalism (every phenomenon has a positive function) and indispensability (each institution is uniquely necessary). He argued they are unsupported and proposed instead manifest and latent functions, dysfunctions and functional alternatives."}, "sources": ["src:920332b9a8"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "در تحلیل نهادها: خانواده به تولیدمثل، تربیت و مراقبت پاسخ می‌دهد، آموزش به انتقال دانش، اقتصاد به تولید ثروت، سیاست به نظم و دفاع و قانون، و دین به پرسش‌های بنیادین مثل مرگ و معنا. سخنران تأکید می‌کند چنین نگاهی ما را از توضیح «فریب» دور و به پرسش از «نیاز» نزدیک می‌کند (مثلاً پیدایش آپارتمان یا غذای سریع به‌عنوان پاسخ به تغییرات جمعیت و زمان).", "en": "Applied to institutions: family answers reproduction, upbringing and care; education the transfer of knowledge; economy the production of wealth; politics order, defence and law; religion basic questions about death and meaning. The lecturer stresses that this view moves us from explanations by 'deception' to asking about 'need' (for example apartments or fast food as answers to demographic and time pressures).", "nl": "Applied to institutions: family answers reproduction, upbringing and care; education the transfer of knowledge; economy the production of wealth; politics order, defence and law; religion basic questions about death and meaning. The lecturer stresses that this view moves us from explanations by 'deception' to asking about 'need' (for example apartments or fast food as answers to demographic and time pressures)."}, "sources": ["src:3c8a365a14", "src:58a696ccbe"], "flags": ["editor-note"]}, {"text": {"fa": "دو نکتهٔ مقابل: (۱) توضیح «چون هست، حتماً به نیازی پاسخ می‌دهد» ممکن است دور باطل باشد و بدون شواهد مستقل کارکرد را به پدیده نسبت دهد؛ نهادهای زیان‌بار یا ناعادلانه هم می‌توانند از سر عادت و قدرت بمانند. (۲) منتقدانی مانند دارندورف، با پیشینهٔ مارکسی-وبری، گفته‌اند این نظریه به تعادل و وفاق بیش از اندازه بها می‌دهد و تغییر، نابرابری و قدرت را کم می‌بیند؛ تحلیل کشمکش می‌پرسد کارکرد برای چه کسانی؟", "en": "Two counterpoints: (1) the claim 'it exists, so it must meet a need' can be circular and credit a phenomenon with a function without independent evidence; harmful or unjust institutions may persist through habit and power. (2) Critics such as Dahrendorf said the theory overstresses equilibrium and consensus and neglects change, inequality and power; conflict analysis asks 'functional for whom?'", "nl": "Two counterpoints: (1) the claim 'it exists, so it must meet a need' can be circular and credit a phenomenon with a function without independent evidence; harmful or unjust institutions may persist through habit and power. (2) Critics such as Dahrendorf said the theory overstresses equilibrium and consensus and neglects change, inequality and power; conflict analysis asks 'functional for whom?'"}, "sources": ["src:75c33114b1", "src:920332b9a8"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، مثال زنجیره‌ای پزشکی، جمعیت، آپارتمان و بازی‌های رایانه‌ای نشان می‌دهد چطور تغییر یک نهاد بقیه را تغییر می‌دهد. این مثال ساده‌شده است: شهرنشینی و آپارتمان‌سازی علت‌های بسیار دیگری (صنعتی‌شدن، مهاجرت، بازار زمین، سیاست‌های دولت) هم دارد و فقط از پیشرفت پزشکی نمی‌آید.", "en": "Per the lecturer, the chain of medicine, population, apartments and computer games shows how a change in one institution changes the rest. The example is simplified: urbanisation and apartment building have many other causes (industrialisation, migration, land markets, state policy) and do not come from medical progress alone.", "nl": "Per the lecturer, the chain of medicine, population, apartments and computer games shows how a change in one institution changes the rest. The example is simplified: urbanisation and apartment building have many other causes (industrialisation, migration, land markets, state policy) and do not come from medical progress alone."}, "sources": ["src:3c8a365a14"], "flags": ["editor-note", "contested"]}, {"text": {"fa": "تفاوت‌های درون سنت کارکردگرایی: کارکردگرایی مردم‌شناسی مالینوفسکی بیشتر بر نیازهای انسان و فرهنگ مادی تکیه می‌کند، در حالی که روایت دورکایم و پیروانش (رادکلیف-براون، پارسونز، مرتن) بر ساختار اجتماعی و حفظ نظم تأکید دارد. سخنران جلسهٔ بعد را به پارسونز و سپس نظریهٔ کشمکش (دارندورف) اختصاص می‌دهد.", "en": "Differences within the functionalist tradition: Malinowski's anthropological functionalism leans on human needs and material culture, while the Durkheimian line and its heirs (Radcliffe-Brown, Parsons, Merton) stress social structure and the maintenance of order. The lecturer plans to turn next to Parsons and then to conflict theory (Dahrendorf).", "nl": "Differences within the functionalist tradition: Malinowski's anthropological functionalism leans on human needs and material culture, while the Durkheimian line and its heirs (Radcliffe-Brown, Parsons, Merton) stress social structure and the maintenance of order. The lecturer plans to turn next to Parsons and then to conflict theory (Dahrendorf)."}, "sources": ["src:3c8a365a14", "src:7726f14048", "src:58a696ccbe"], "flags": []}], "links": [{"to": "soc:institutions", "rel": "explains", "note": {"fa": "چارچوبی برای فهم کارکرد نهادهای اصلی جامعه.", "en": "A framework for understanding the functions of society's main institutions.", "nl": "A framework for understanding the functions of society's main institutions."}}, {"to": "soc:durkheim-sacred-society", "rel": "part-of", "note": {"fa": "ریشهٔ فکری کارکردگرایی در کار دورکایم دربارهٔ دین و همبستگی است.", "en": "Functionalism's roots lie in Durkheim's work on religion and solidarity.", "nl": "Functionalism's roots lie in Durkheim's work on religion and solidarity."}}, {"to": "soc:cohesion", "rel": "see-also", "note": {"fa": "مسئلهٔ نظم و همبستگی در مرکز کارکردگرایی است.", "en": "Order and solidarity are central to functionalism.", "nl": "Order and solidarity are central to functionalism."}}, {"to": "soc:theory", "rel": "contrasts", "note": {"fa": "در برابر نظریهٔ کشمکش مارکسی.", "en": "Contrasts with Marxist conflict theory.", "nl": "Contrasts with Marxist conflict theory."}}], "people": ["core:robert-k-merton", "core:talcott-parsons", "core:bronis-aw-malinowski", "core:ralf-dahrendorf"], "sources": ["src:3c8a365a14", "src:58a696ccbe", "src:75c33114b1", "src:7726f14048", "src:920332b9a8"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:institutions-inclusive", "kind": "concept", "title": {"fa": "نهادهای فراگیر و بهره‌کش", "en": "Inclusive and extractive institutions", "nl": "Inclusieve en extractieve instituties"}, "aliases": [], "parent": "soc:institutions", "field": "soc:institutions", "summary": {"fa": "چرا ملت‌ها شکست می‌خورند؟ عجم‌اوغلو و رابینسون: نه جغرافیا و نه فرهنگ، بلکه نهادهای سیاسی و اقتصادی. نهاد فراگیر به اکثریت اجازهٔ مشارکت و مالکیت امن می‌دهد؛ نهاد بهره‌کش ثروت را از اکثریت به اقلیت حاکم منتقل می‌کند و نوآوری را، چون قدرت را تهدید می‌کند، سرکوب.", "en": "Why do nations fail? Acemoglu and Robinson: neither geography nor culture, but political and economic institutions. Inclusive institutions let the majority participate and hold property securely; extractive ones move wealth from the majority to a ruling minority and suppress innovation because it threatens power.", "nl": "Waarom falen naties? Acemoglu en Robinson: niet geografie of cultuur, maar politieke en economische instituties. Inclusieve instituties laten de meerderheid deelnemen en veilig bezitten; extractieve verplaatsen rijkdom van de meerderheid naar een heersende minderheid en onderdrukken innovatie omdat ze de macht bedreigt."}, "points": [{"text": {"fa": "نورث (۱۹۹۰): نهادها «قواعد بازی»اند، رسمی و غیررسمی، و با کاهش عدم قطعیت هزینهٔ مبادله را پایین می‌آورند؛ وابستگی به مسیر توضیح می‌دهد چرا نهادهای ناکارآمد دوام می‌آورند.", "en": "North (1990): institutions are the \"rules of the game\", formal and informal, lowering transaction costs by reducing uncertainty; path dependence explains why inefficient institutions persist.", "nl": "North (1990): institutions are the \"rules of the game\", formal and informal, lowering transaction costs by reducing uncertainty; path dependence explains why inefficient institutions persist."}, "sources": ["src:9064c99339"], "flags": []}, {"text": {"fa": "عجم‌اوغلو، جانسون و رابینسون (۲۰۰۱): با مرگ‌ومیر مهاجران اروپایی به‌عنوان متغیر ابزاری نشان دادند مستعمره‌هایی که اروپاییان در آن ساکن شدند نهادهای فراگیر و امروز درآمد بالاتر دارند. مقاله‌ای بنیادین که داده‌های مرگ‌ومیرش را آلبوی (۲۰۱۲) زیر سؤال برد؛ نوبل اقتصاد ۲۰۲۴ به همین پژوهش داده شد.", "en": "Acemoglu, Johnson and Robinson (2001): using European settler mortality as an instrument, showed colonies where Europeans settled got inclusive institutions and higher incomes today. A foundational paper whose mortality data Albouy (2012) questioned; the 2024 Nobel in economics went to this research.", "nl": "Acemoglu, Johnson and Robinson (2001): using European settler mortality as an instrument, showed colonies where Europeans settled got inclusive institutions and higher incomes today. A foundational paper whose mortality data Albouy (2012) questioned; the 2024 Nobel in economics went to this research."}, "sources": ["src:d27c5710a2", "src:2079f7c2a8"], "flags": ["contested"]}, {"text": {"fa": "نفت نمونهٔ کلاسیک «نفرین منابع» است: درآمدی که بی‌نیاز از مالیات شهروندان است، پاسخ‌گویی را کم و نهادهای بهره‌کش را پایدار می‌کند؛ این الگو برای ایران بسیار بحث شده است.", "en": "Oil is the classic \"resource curse\": revenue that needs no taxation of citizens lowers accountability and stabilises extractive institutions; this pattern has been much debated for Iran.", "nl": "Oil is the classic \"resource curse\": revenue that needs no taxation of citizens lowers accountability and stabilises extractive institutions; this pattern has been much debated for Iran."}, "sources": ["src:dc6b74b89e"], "flags": ["editor-note"]}], "links": [{"to": "soc:generalized-trust", "rel": "explains", "note": {"fa": "فساد، نهادها و اعتماد", "en": "Corruption, institutions and trust", "nl": "Corruption, institutions and trust"}}, {"to": "soc:collective-action", "rel": "see-also", "note": {"fa": "چگونه نهادها تغییر می‌کنند", "en": "How institutions change", "nl": "How institutions change"}}, {"to": "psy:human-progress", "rel": "bridges", "note": {"fa": "پیشرفت انسانی در ویکی روان", "en": "Human progress in the psychology wiki", "nl": "Human progress in the psychology wiki"}}], "people": ["core:daron-acemoglu", "core:douglass-north"], "sources": ["src:2079f7c2a8", "src:9064c99339", "src:d27c5710a2", "src:dc6b74b89e"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:industrial-modernity-backdrop", "kind": "concept", "title": {"fa": "انقلاب فرانسه و انقلاب صنعتی: زمینهٔ پیدایش جامعه‌شناسی", "en": "The French and Industrial Revolutions: the backdrop of sociology", "nl": "De Franse en de Industriële Revolutie: de achtergrond van de sociologie"}, "aliases": [], "parent": "soc:theory", "field": "soc:theory", "summary": {"fa": "جامعه‌شناسی در واکنش به دو دگرگونی بزرگ ساخته شد: انقلاب سیاسی فرانسه (۱۷۸۹) و انقلاب صنعتی. این دو، شهر، کار، خانواده، آموزش، دین و سیاست را عوض کردند و مسائل تازه‌ای ساختند که اندیشمندان باید به آن‌ها پاسخ می‌دادند. برای فهم هر نظریه باید دید به کدام یک از این دگرگونی‌ها جواب می‌دهد.", "en": "Sociology arose as a response to two great upheavals: the French political revolution of 1789 and the Industrial Revolution. They reshaped cities, work, family, schooling, religion and politics, and posed new problems that thinkers had to answer. To understand a theory, ask which of these changes it is answering.", "nl": "De sociologie ontstond als reactie op twee grote omwentelingen: de Franse Revolutie en de Industriële Revolutie. Die veranderden stad, werk, gezin, onderwijs, religie en politiek en riepen nieuwe vragen op."}, "points": [{"text": {"fa": "انقلاب فرانسه ایده‌های آزادی و برابری را به سیاست آورد و مردم را از «رعیت» به «شهروند صاحب حق» تبدیل کرد؛ دوران وحشت و گیوتین پس از آن، در بسیاری از اندیشمندان بدبینی به انقلاب‌های خشونت‌بار ساخت.", "en": "The French Revolution brought liberty and equality into politics and turned subjects into citizens with rights; the Terror that followed made many thinkers distrustful of violent revolutions.", "nl": "The French Revolution brought liberty and equality into politics and turned subjects into citizens with rights; the Terror that followed made many thinkers distrustful of violent revolutions."}, "sources": ["src:9d7e993f4f", "src:49b40e4a31"], "flags": []}, {"text": {"fa": "با کارخانه‌ها، کارگاه‌های کوچک خانگی و روستایی ورشکست شدند؛ بیکارشدگان به شهر کوچ کردند، نیروی کار فراوان دستمزد را پایین آورد و کار زنان و کودکان بیشتر شد. همزمان، با پیشرفت پزشکی جمعیت اروپا به‌سرعت بالا رفت و انباشت سرمایه و شکاف طبقاتی بزرگ‌تر شد. نیاز به فروش تولید فراوان هم تبلیغات و مصرف‌گرایی را مهم کرد.", "en": "With factories, small household and village workshops collapsed; the jobless moved to cities, abundant labour pushed wages down, and women's and children's work grew. Medicine helped the European population rise quickly, capital accumulated and class gaps widened. The need to sell mass output made advertising and consumerism important.", "nl": "With factories, small household and village workshops collapsed; the jobless moved to cities, abundant labour pushed wages down, and women's and children's work grew. Medicine helped the European population rise quickly, capital accumulated and class gaps widened. The need to sell mass output made advertising and consumerism important."}, "sources": ["src:9d7e993f4f", "src:49b40e4a31"], "flags": []}, {"text": {"fa": "نهادها عوض شدند: خانوادهٔ گسترده کم‌کم جای خود را به خانوادهٔ هسته‌ای داد؛ ساخت آپارتمان‌ها حریم خصوصی را کم کرد؛ آموزش مکتب‌خانه‌ای جای خود را به آموزش نظام‌مند داد؛ دین بیشتر به حوزهٔ خصوصی رفت. به گفتهٔ سخنران، اثر چنین دگرگونی‌هایی در جامعه‌ای دیگر (مثلاً ایران) ممکن است با تأخیر چندده‌ساله یا چندصدساله دیده شود.", "en": "Institutions changed: the extended family gave way to the nuclear family, apartment building reduced privacy, traditional schooling gave way to systematic schooling, and religion moved more into private life. Per the lecturer, the effects of such changes may show up in another society (e.g. Iran) after a delay of decades or even centuries.", "nl": "Institutions changed: the extended family gave way to the nuclear family, apartment building reduced privacy, traditional schooling gave way to systematic schooling, and religion moved more into private life. Per the lecturer, the effects of such changes may show up in another society (e.g. Iran) after a delay of decades or even centuries."}, "sources": ["src:9d7e993f4f"], "flags": ["editor-note"]}, {"text": {"fa": "نکتهٔ علمی دربارهٔ بخش اقتصادی و خانوادگی: تاریخ‌پژوهان نشان داده‌اند خانوارهای هسته‌ای در شمال‌غرب اروپا پیش از صنعتی‌شدن هم رایج بودند، پس «گسترده به هسته‌ای به‌خاطر صنعت» ساده‌شده است. بیشتر مورخان انقلاب صنعتی را از حدود ۱۷۶۰ در بریتانیا می‌دانند؛ وات ماشین بخار را بهبود داد و آن را از صفر نساخت. مالتوس جنگ را «راه‌حل» نمی‌دانست و از جمله پیشنهادش تأخیر ازدواج بود؛ جنگ و قحطی را فقط از موانع جمعیت می‌شمرد. شهر یونانی هم بازار داشت و تقابل «شهر سیاسی و شهر بازاری» ساده‌شده است.", "en": "Scholarly caveats: historians show nuclear households were already common in north-western Europe before industrialisation, so 'extended to nuclear because of industry' is simplified. Most historians date the Industrial Revolution from about 1760 in Britain; Watt improved the steam engine rather than inventing it. Malthus did not present war as a solution; he listed war and famine among checks on population and urged delayed marriage. Greek cities also had markets, so the polis-versus-market-city contrast is a simplification.", "nl": "Scholarly caveats: historians show nuclear households were already common in north-western Europe before industrialisation, so 'extended to nuclear because of industry' is simplified. Most historians date the Industrial Revolution from about 1760 in Britain; Watt improved the steam engine rather than inventing it. Malthus did not present war as a solution; he listed war and famine among checks on population and urged delayed marriage. Greek cities also had markets, so the polis-versus-market-city contrast is a simplification."}, "sources": ["src:b2d3f422b7", "src:49b40e4a31", "src:6b6570c31d"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "چند ادعای تاریخی سخنران دقیق نیست: جملهٔ «انقلاب فرزندان خود را می‌خورد» معمولاً به سال‌های ۱۷۹۳ و سخن ورنیو نسبت داده می‌شود نه به اعدام روبسپیر (۱۷۹۴). «خدا مرده است» جملهٔ نیچه است (۱۸۸۲) و ولتر چنین سخنی نگفته است؛ ولتر به لزوم «ساختن» خدا برای نظم اجتماعی اشاره کرده بود. تفاوت «امت» و «ملت» هم ساده‌شده است: «امت» جامعهٔ دینی است و لزوماً به معنای رعیت ساکت نیست.", "en": "Some of the lecturer's historical claims are imprecise: 'the revolution devours its children' is usually traced to 1793 and the Girondin Vergniaud, not to Robespierre's execution (1794). 'God is dead' is Nietzsche's line (1882), not Voltaire's; Voltaire rather said that if God did not exist it would be necessary to invent him. The umma/nation contrast is also simplified: umma is a religious community, not necessarily a passive crowd of subjects.", "nl": "Some of the lecturer's historical claims are imprecise: 'the revolution devours its children' is usually traced to 1793 and the Girondin Vergniaud, not to Robespierre's execution (1794). 'God is dead' is Nietzsche's line (1882), not Voltaire's; Voltaire rather said that if God did not exist it would be necessary to invent him. The umma/nation contrast is also simplified: umma is a religious community, not necessarily a passive crowd of subjects."}, "sources": ["src:17c39e84bb"], "flags": ["contested", "editor-note"]}], "links": [{"to": "soc:enlightenment-break", "rel": "part-of", "note": {"fa": "ادامهٔ زمینهٔ تاریخی روشنگری و گسست از حکمت مدرسی", "en": "Continues the Enlightenment and scholastic-break background", "nl": "Continues the Enlightenment and scholastic-break background"}}, {"to": "soc:urbanism", "rel": "see-also", "note": {"fa": "شهرنشینی به‌مثابه شیوهٔ زندگی", "en": "Urbanism as a way of life", "nl": "Urbanism as a way of life"}}, {"to": "soc:demographic-transition", "rel": "see-also", "note": {"fa": "گذار جمعیتی و رشد جمعیت اروپا", "en": "Demographic transition and European population growth", "nl": "Demographic transition and European population growth"}}, {"to": "soc:comte-three-stages", "rel": "explains", "note": {"fa": "زمینهٔ ظهور کنت و جامعه‌شناسی", "en": "Context for the rise of Comte and sociology", "nl": "Context for the rise of Comte and sociology"}}], "people": ["core:joseph-de-maistre", "core:louis-de-bonald", "core:thomas-malthus"], "sources": ["src:17c39e84bb", "src:49b40e4a31", "src:6b6570c31d", "src:9d7e993f4f", "src:b2d3f422b7"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:magic-religion-malinowski", "kind": "concept", "title": {"fa": "جادو، دین و علم نزد مالینوفسکی (و نقد دورکیم)", "en": "Magic, religion and science in Malinowski (and his critique of Durkheim)", "nl": "Magie, religie en wetenschap bij Malinowski"}, "aliases": [], "parent": "soc:values", "field": "soc:values", "summary": {"fa": "مالینوفسکی در جزایر تروبریاند دید مردم در کار روزمره (کشاورزی، ماهیگیری سالم) به جادو رو نمی‌آورند و فقط در لحظه‌های ناامیدی و نااطمینانی سراغ آن می‌روند. او به دورکیم هم ایراد گرفت که تجربهٔ فردی دینی را نادیده گرفته است. سخنران این‌ها را به بحث نیازهای انسان و «حضور» ایدهٔ خدا در نظم اجتماعی پیوند می‌دهد.", "en": "In the Trobriand Islands Malinowski saw that people did not resort to magic in ordinary, controllable work and turned to it mainly where outcomes were uncertain or hopeless. He also criticised Durkheim for neglecting individual religious experience. The lecturer links this to human needs and to the way the idea of God keeps ordering social life.", "nl": "Malinowski zag dat mensen op de Trobriand-eilanden vooral naar magie grepen bij onzekerheid en onmacht. Hij bekritiseerde Durkheim omdat die de individuele religieuze ervaring negeerde."}, "points": [{"text": {"fa": "دورکیم دین را پدیده‌ای اجتماعی با کارکرد می‌دانست: اگر فقط دروغ بود، با آشکار شدن آن از میان می‌رفت. مالینوفسکی (در کتاب جادو، علم و دین) ایراد گرفت که دورکیم فقط سازمان جمعی دین را دیده و تجربهٔ تنهایی و شخصی دینی را نه.", "en": "Durkheim treated religion as a social phenomenon with functions: if it were simply false it would vanish once exposed. Malinowski objected that Durkheim saw only the collective organisation of religion, not the solitary, personal religious experience.", "nl": "Durkheim treated religion as a social phenomenon with functions: if it were simply false it would vanish once exposed. Malinowski objected that Durkheim saw only the collective organisation of religion, not the solitary, personal religious experience."}, "sources": ["src:e15b78d569", "src:366ff5ffce", "src:b8c219a76c"], "flags": []}, {"text": {"fa": "مالینوفسکی در میدان دید که جادو همیشه در دسترس نیست. مردم تروبریاند در کارهای قابل‌کنترل به دانش و تجربهٔ جمعی خود تکیه می‌کنند و فقط در موقعیت‌های پرخطر یا ناامیدکننده (بیماری سخت، سفر دریایی دور) به جادو پناه می‌برند.", "en": "In the field Malinowski found that magic is not always at hand. Trobriand islanders rely on knowledge and collective experience for controllable tasks and turn to magic only in risky or hopeless situations, such as serious illness or dangerous sea voyages.", "nl": "In the field Malinowski found that magic is not always at hand. Trobriand islanders rely on knowledge and collective experience for controllable tasks and turn to magic only in risky or hopeless situations, such as serious illness or dangerous sea voyages."}, "sources": ["src:366ff5ffce", "src:6506e94ee3"], "flags": []}, {"text": {"fa": "به گفتهٔ سخنران، دین شکل مهارشده و عقلانی‌شدهٔ جادوست: انسان وقتی ناتوانی‌اش را بپذیرد، به نیروهای بزرگ‌تر و نظم کلان‌تر پناه می‌برد و معجزه «جادوی محقق‌شده» است. علم هم آهسته جای دین را در پاسخ به نیازها می‌گیرد.", "en": "Per the lecturer, religion is a managed, rationalised form of magic: once people admit their powerlessness they turn to greater forces and a larger order, and a miracle is 'magic come true'. Science slowly takes over religion's place in meeting needs.", "nl": "Per the lecturer, religion is a managed, rationalised form of magic: once people admit their powerlessness they turn to greater forces and a larger order, and a miracle is 'magic come true'. Science slowly takes over religion's place in meeting needs."}, "sources": ["src:e15b78d569"], "flags": ["editor-note"]}, {"text": {"fa": "این روایت ساده‌شده است. مالینوفسکی جادو و دین را دو حوزهٔ هم‌زمان با کارکردهای متفاوت می‌دانست و ترتیب تاریخی «اول جادو، بعد دین» بیشتر به فریزر (۱۸۹۰) مربوط است که امروز منسوخ شمرده می‌شود. نظریهٔ رؤیا و روح برای منشأ دین از تایلور (۱۸۷۱) است، نه رابرتسون اسمیت. جادو و دین هم مرز قطعی ندارند و بحثشان در مردم‌شناسی ادامه دارد.", "en": "This is simplified. Malinowski treated magic and religion as coexisting domains with different functions; the 'magic first, then religion' sequence belongs rather to Frazer (1890) and is now widely rejected. The dream-and-soul theory of religion's origin is Tylor's (1871), not Robertson Smith's. The magic/religion boundary is itself disputed in anthropology.", "nl": "This is simplified. Malinowski treated magic and religion as coexisting domains with different functions; the 'magic first, then religion' sequence belongs rather to Frazer (1890) and is now widely rejected. The dream-and-soul theory of religion's origin is Tylor's (1871), not Robertson Smith's. The magic/religion boundary is itself disputed in anthropology."}, "sources": ["src:f8200a8d03", "src:e06a2ed077"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، در جامعه‌شناسی پرسش اصلی «وجود» خدا نیست بلکه «حضور» ایدهٔ او در نظم زندگی است: هفته، تبریک گفتن، تسلیت و قوانین از آن می‌آیند و حتی بی‌دین هم در تعامل با آن‌ها رفتار می‌کند. او می‌گوید آنچه در دین مهم است نقش سامان‌دهی است، نه خالق بودن.", "en": "Per the lecturer, the sociological question is not whether God 'exists' but whether the idea is 'present' in the order of everyday life: the week, congratulations, condolences and laws all carry it, and even non-believers act within it. He says its organising role matters more than being a creator.", "nl": "Per the lecturer, the sociological question is not whether God 'exists' but whether the idea is 'present' in the order of everyday life: the week, congratulations, condolences and laws all carry it, and even non-believers act within it. He says its organising role matters more than being a creator."}, "sources": ["src:e15b78d569"], "flags": ["editor-note"]}, {"text": {"fa": "این ادعا که همهٔ نظم اجتماعی (حتی واحدهای اندازه‌گیری یا ریاضی) ریشه در «ایدهٔ خدا» دارد، اغراق‌آمیز است و مثال‌هایش (مثل هفتهٔ هفت‌روزه که ریشهٔ بابلی دارد، یا تخفیف فصلی) قابل‌تفسیر دیگرند. نظریه‌های سکولارشدن نشان می‌دهند اثر دین در بسیاری جوامع واقعاً کم می‌شود، هرچند ردپای فرهنگی‌اش می‌ماند.", "en": "The claim that all social order, even units of measurement or mathematics, derives from the 'idea of God' is overstated, and its examples (the seven-day week, which has Babylonian roots, or seasonal discounts) admit other explanations. Secularisation research shows religion's influence genuinely declines in many societies, although cultural traces remain.", "nl": "The claim that all social order, even units of measurement or mathematics, derives from the 'idea of God' is overstated, and its examples (the seven-day week, which has Babylonian roots, or seasonal discounts) admit other explanations. Secularisation research shows religion's influence genuinely declines in many societies, although cultural traces remain."}, "sources": ["src:546ed25de5"], "flags": ["contested", "editor-note"]}], "links": [{"to": "soc:secularization", "rel": "contrasts", "note": {"fa": "آیا نیاز به دین می‌ماند یا کم می‌شود", "en": "Does the need for religion persist or fade?", "nl": "Does the need for religion persist or fade?"}}, {"to": "soc:social-construction", "rel": "see-also", "note": {"fa": "نظم نمادین ساخته‌شدهٔ اجتماعی", "en": "Socially constructed symbolic order", "nl": "Socially constructed symbolic order"}}, {"to": "soc:mauss-gift-sacrifice", "rel": "see-also", "note": {"fa": "مردم‌شناسی هدیه و قربانی", "en": "Anthropology of gift and sacrifice", "nl": "Anthropology of gift and sacrifice"}}, {"to": "soc:values", "rel": "part-of", "note": {"fa": "ارزش‌ها و دین", "en": "Values and religion", "nl": "Values and religion"}}], "people": ["core:bronis-aw-malinowski", "core:mile-durkheim", "core:james-g-frazer", "core:edward-b-tylor"], "sources": ["src:366ff5ffce", "src:546ed25de5", "src:6506e94ee3", "src:b8c219a76c", "src:e06a2ed077", "src:e15b78d569", "src:f8200a8d03"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:cohesion", "kind": "field", "title": {"fa": "انسجام، اعتماد و سرمایهٔ اجتماعی", "en": "Cohesion, trust & social capital", "nl": "Cohesie, vertrouwen & sociaal kapitaal"}, "aliases": [], "parent": "soc:soc", "field": null, "summary": {"fa": "چه چیزی جامعه را کنار هم نگه می‌دارد و وقتی می‌شکند چه می‌شود؟", "en": "What holds a society together, and what happens when it breaks?", "nl": "Wat houdt een samenleving bijeen, en wat gebeurt er als het breekt?"}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:theory", "kind": "field", "title": {"fa": "نظریهٔ اجتماعی", "en": "Social theory", "nl": "Sociale theorie"}, "aliases": [], "parent": "soc:soc", "field": null, "summary": {"fa": "ابزارهای فکری پایه: از بینش جامعه‌شناختی تا ساخت اجتماعی واقعیت و نمایش خود.", "en": "The basic thinking tools: from the sociological imagination to the social construction of reality and the presentation of self.", "nl": "De basisdenkgereedschappen: van de sociologische verbeelding tot de sociale constructie van de werkelijkheid en de presentatie van het zelf."}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:social-movements", "kind": "concept", "title": {"fa": "جنبش‌های اجتماعی و سیاست اعتراضی", "en": "Social movements and contentious politics", "nl": "Sociale bewegingen en contentieuze politiek"}, "aliases": [], "parent": "soc:collective", "field": "soc:collective", "summary": {"fa": "جنبش، کارزاری پایدار با نمایش «ارزشمندی، وحدت، تعداد و تعهد» است. چه چیزی جنبش می‌سازد؟ نارضایتی همیشه هست؛ فرق را منابع، فرصت‌های سیاسی و «قاب‌بندی» می‌گذارند. و شواهد کمّی می‌گویند مقاومت بی‌خشونت تاریخاً بیش از مسلحانه به نتیجه رسیده، هرچند نرخ موفقیتش در دههٔ اخیر افت کرده.", "en": "A movement is a sustained campaign displaying \"worthiness, unity, numbers and commitment\". What makes one? Grievance is always there; resources, political opportunities and \"framing\" make the difference. And the quantitative evidence says nonviolent resistance has historically succeeded more often than armed struggle, though its success rate has fallen in the last decade.", "nl": "Een beweging is een volgehouden campagne die \"waardigheid, eenheid, aantallen en toewijding\" toont. Wat maakt haar? Grieven zijn er altijd; middelen, politieke kansen en \"framing\" maken het verschil. En het kwantitatieve bewijs zegt dat geweldloos verzet historisch vaker slaagde dan gewapende strijd, al is het slagingspercentage het laatste decennium gedaald."}, "points": [{"text": {"fa": "تیلی (۲۰۰۴) و تارو (۲۰۱۱): «رپرتوار اعتراض» (تظاهرات، اعتصاب، طومار) اختراع مدرن است و با دولت ملی و رسانه رشد کرد؛ چرخه‌های اعتراض با باز شدن فرصت سیاسی اوج می‌گیرند و با سرکوب یا نهادینه شدن فرو می‌نشینند.", "en": "Tilly (2004) and Tarrow (2011): the \"repertoire of contention\" (demonstration, strike, petition) is a modern invention that grew with the nation-state and media; cycles of protest peak as political opportunity opens and subside with repression or institutionalisation.", "nl": "Tilly (2004) and Tarrow (2011): the \"repertoire of contention\" (demonstration, strike, petition) is a modern invention that grew with the nation-state and media; cycles of protest peak as political opportunity opens and subside with repression or institutionalisation."}, "sources": ["src:b59a77572e", "src:cebd699d72"], "flags": []}, {"text": {"fa": "چنووت و استفان (۲۰۱۱، ۳۲۳ کارزار ۱۹۰۰–۲۰۰۶): کارزارهای بی‌خشونت ۵۳ درصد و مسلحانه ۲۶ درصد موفق بودند؛ هیچ کارزاری با مشارکت فعال ۳٫۵ درصد جمعیت شکست نخورد. چنووت (۲۰۲۱): از ۲۰۱۰ نرخ موفقیت بی‌خشونت به زیر ۳۵ درصد افتاده؛ «قاعدهٔ ۳٫۵ درصد» توصیفی است نه تضمین.", "en": "Chenoweth and Stephan (2011, 323 campaigns 1900–2006): nonviolent campaigns succeeded 53 percent of the time, armed ones 26 percent; no campaign with active participation of 3.5 percent of the population failed. Chenoweth (2021): since 2010 nonviolent success has fallen below 35 percent; the \"3.5 percent rule\" is descriptive, not a guarantee.", "nl": "Chenoweth and Stephan (2011, 323 campaigns 1900–2006): nonviolent campaigns succeeded 53 percent of the time, armed ones 26 percent; no campaign with active participation of 3.5 percent of the population failed. Chenoweth (2021): since 2010 nonviolent success has fallen below 35 percent; the \"3.5 percent rule\" is descriptive, not a guarantee."}, "sources": ["src:41c1e6a2e7", "src:040033aaf5"], "flags": ["contested"]}, {"text": {"fa": "بیات (۲۰۱۰) برای خاورمیانه مفهوم «ناجنبش» را ساخت: تغییر آرام و پراکندهٔ زندگی روزمره توسط میلیون‌ها نفر معمولی (پوشش، کار غیررسمی، حضور زنان در فضای عمومی) که رهبر و سازمان ندارد ولی مرزها را جابه‌جا می‌کند؛ «پیشروی آرام مردم عادی».", "en": "Bayat (2010) coined \"nonmovements\" for the Middle East: the quiet, dispersed change of everyday life by millions of ordinary people (dress, informal work, women's presence in public space) with no leader or organisation, yet shifting boundaries; \"the quiet encroachment of the ordinary\".", "nl": "Bayat (2010) coined \"nonmovements\" for the Middle East: the quiet, dispersed change of everyday life by millions of ordinary people (dress, informal work, women's presence in public space) with no leader or organisation, yet shifting boundaries; \"the quiet encroachment of the ordinary\"."}, "sources": ["src:248ed932c7"], "flags": []}], "links": [{"to": "soc:preference-falsification", "rel": "explains", "note": {"fa": "چرا بسیج ناگهانی است", "en": "Why mobilisation is sudden", "nl": "Why mobilisation is sudden"}}, {"to": "soc:collective-action", "rel": "prerequisite", "note": {"fa": "مسئلهٔ کنش جمعی", "en": "The collective action problem", "nl": "The collective action problem"}}, {"to": "psy:polarization", "rel": "bridges", "note": {"fa": "قطبی شدن در ویکی روان", "en": "Polarization in the psychology wiki", "nl": "Polarization in the psychology wiki"}}], "people": ["core:charles-tilly", "core:erica-chenoweth", "core:asef-bayat"], "sources": ["src:040033aaf5", "src:248ed932c7", "src:41c1e6a2e7", "src:b59a77572e", "src:cebd699d72"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:generalized-trust", "kind": "concept", "title": {"fa": "اعتماد تعمیم‌یافته", "en": "Generalised trust", "nl": "Gegeneraliseerd vertrouwen"}, "aliases": [], "parent": "soc:cohesion", "field": "soc:cohesion", "summary": {"fa": "پاسخ به یک سؤال ساده: «به‌طور کلی می‌شود به بیشتر مردم اعتماد کرد یا باید خیلی مراقب بود؟» این عدد میان کشورها از زیر ۱۰ تا بالای ۶۰ درصد فرق می‌کند، دهه‌ها پایدار می‌ماند، و با رشد اقتصادی، سلامت و کیفیت حکمرانی همبسته است. در ایران پایین است.", "en": "The answer to one simple question: \"Generally speaking, can most people be trusted, or must one be very careful?\" It ranges from under 10 to over 60 percent across countries, stays stable for decades, and correlates with growth, health and quality of government. In Iran it is low.", "nl": "Het antwoord op één eenvoudige vraag: \"Kunnen de meeste mensen over het algemeen worden vertrouwd, of moet men heel voorzichtig zijn?\" Het loopt tussen landen van onder de 10 tot boven de 60 procent, blijft decennialang stabiel en hangt samen met groei, gezondheid en bestuurskwaliteit. In Iran is het laag."}, "points": [{"text": {"fa": "روتشتاین و اوسلانر (۲۰۰۵): برابری (اقتصادی و فرصتی) و نبود فساد قوی‌ترین پیش‌بینی‌کننده‌های اعتماد تعمیم‌یافته‌اند؛ نابرابری اعتماد را می‌خورد و بی‌اعتمادی سیاست‌های برابرساز را ناممکن می‌کند: تلهٔ اجتماعی.", "en": "Rothstein and Uslaner (2005): equality (economic and of opportunity) and absence of corruption are the strongest predictors of generalised trust; inequality eats trust and distrust makes equalising policies impossible: a social trap.", "nl": "Rothstein and Uslaner (2005): equality (economic and of opportunity) and absence of corruption are the strongest predictors of generalised trust; inequality eats trust and distrust makes equalising policies impossible: a social trap."}, "sources": ["src:d4458872cb"], "flags": []}, {"text": {"fa": "آلگان و کاهوک (۲۰۱۰): با اعتماد ارثی مهاجران آمریکایی (بر حسب کشور مبدأ) نشان دادند اعتماد علّتِ رشد است نه فقط معلولش؛ اگر اعتماد آفریقا در سطح سوئد بود، درآمد سرانه‌اش چند برابر بود.", "en": "Algan and Cahuc (2010): using the inherited trust of US immigrants (by country of origin) they showed trust causes growth, not only follows it; had Africa Sweden's trust level, its income per head would be several times higher.", "nl": "Algan and Cahuc (2010): using the inherited trust of US immigrants (by country of origin) they showed trust causes growth, not only follows it; had Africa Sweden's trust level, its income per head would be several times higher."}, "sources": ["src:196ab6bdb8"], "flags": ["contested"]}, {"text": {"fa": "در پیمایش جهانی ارزش‌ها، اعتماد تعمیم‌یافتهٔ ایرانیان در موج‌های اخیر در حدود ۱۰ تا ۱۵ درصد و در ردهٔ کشورهای کم‌اعتماد است؛ در پیمایش ملی ارزش‌ها و نگرش‌ها نیز اعتماد به «مردم» از موج اول تا سوم کاهش نشان می‌دهد.", "en": "In the World Values Survey, Iranians' generalised trust in recent waves is around 10 to 15 percent, among the low-trust countries; the national Values and Attitudes survey also shows trust in \"people\" falling from the first to the third wave.", "nl": "In the World Values Survey, Iranians' generalised trust in recent waves is around 10 to 15 percent, among the low-trust countries; the national Values and Attitudes survey also shows trust in \"people\" falling from the first to the third wave."}, "sources": ["src:4a310ccbde", "src:95287955fe"], "flags": []}], "links": [{"to": "psy:social-trust", "rel": "same-as", "note": {"fa": "اعتماد اجتماعی در ویکی روان (درس اعتماد)", "en": "Social trust in the psychology wiki (the trust lecture)", "nl": "Social trust in the psychology wiki (the trust lecture)"}}, {"to": "soc:inequality-health", "rel": "explains", "note": {"fa": "نابرابری چگونه اعتماد را می‌خورد", "en": "How inequality eats trust", "nl": "How inequality eats trust"}}, {"to": "soc:institutions-inclusive", "rel": "see-also", "note": {"fa": "فساد و نهادها", "en": "Corruption and institutions", "nl": "Corruption and institutions"}}], "people": [], "sources": ["src:196ab6bdb8", "src:4a310ccbde", "src:95287955fe", "src:d4458872cb"], "booklets": [], "origin": null, "iran": "iran:social-trust", "wikidata": null, "status": "draft"}, {"id": "soc:inequality-health", "kind": "concept", "title": {"fa": "نابرابری و سلامت جامعه", "en": "Inequality and the health of society", "nl": "Ongelijkheid en de gezondheid van de samenleving"}, "aliases": [], "parent": "soc:inequality", "field": "soc:inequality", "summary": {"fa": "ویلکینسون و پیکت ادعا کردند در کشورهای ثروتمند، نه ثروت که نابرابری است که با امید به زندگی، اعتماد، جرم، سلامت روان و چاقی همبسته است. تز پرنفوذی که داده‌هایش را منتقدان جدی به چالش کشیده‌اند؛ همبستگی هست، علیت و اندازه محل بحث است.", "en": "Wilkinson and Pickett claimed that among rich countries it is inequality, not wealth, that correlates with life expectancy, trust, crime, mental health and obesity. An influential thesis whose data serious critics have challenged; the correlation exists, causation and magnitude are debated.", "nl": "Wilkinson en Pickett stelden dat onder rijke landen niet rijkdom maar ongelijkheid samenhangt met levensverwachting, vertrouwen, criminaliteit, mentale gezondheid en obesitas. Een invloedrijke these waarvan serieuze critici de data hebben aangevochten; de correlatie bestaat, causaliteit en omvang zijn omstreden."}, "points": [{"text": {"fa": "«تراز روح» (۲۰۰۹): در ۲۳ کشور ثروتمند و ۵۰ ایالت آمریکا، شاخص ترکیبی مشکلات اجتماعی با نابرابری همبستگی قوی و با درآمد سرانه همبستگی ناچیز دارد؛ سازوکار پیشنهادی: استرس مقایسه و منزلت.", "en": "\"The Spirit Level\" (2009): across 23 rich countries and 50 US states, a composite index of social problems correlates strongly with inequality and barely with income per head; the proposed mechanism is status and comparison stress.", "nl": "\"The Spirit Level\" (2009): across 23 rich countries and 50 US states, a composite index of social problems correlates strongly with inequality and barely with income per head; the proposed mechanism is status and comparison stress."}, "sources": ["src:cbebbd48aa"], "flags": []}, {"text": {"fa": "نقد (ساندرز ۲۰۱۰ و دیگران): انتخاب کشورها و شاخص‌ها نتیجه را عوض می‌کند، چند همبستگی با حذف یکی دو کشور پرت از بین می‌رود، و فرهنگ و تاریخ به‌عنوان متغیر سوم کنترل نشده‌اند. فراتحلیل‌های بعدی اثر نابرابری بر سلامت را «کوچک ولی واقعی» برآورد کرده‌اند.", "en": "Critique (Saunders 2010 and others): the choice of countries and indices changes the result, several correlations vanish when one or two outliers are dropped, and culture and history are uncontrolled third variables. Later meta-analyses estimate the effect of inequality on health as \"small but real\".", "nl": "Critique (Saunders 2010 and others): the choice of countries and indices changes the result, several correlations vanish when one or two outliers are dropped, and culture and history are uncontrolled third variables. Later meta-analyses estimate the effect of inequality on health as \"small but real\"."}, "sources": ["src:9ff749e8d1"], "flags": ["contested", "editor-note"]}], "links": [{"to": "soc:generalized-trust", "rel": "explains", "note": {"fa": "نابرابری و اعتماد", "en": "Inequality and trust", "nl": "Inequality and trust"}}, {"to": "psy:n-stress", "rel": "bridges", "note": {"fa": "استرس منزلت در بدن", "en": "Status stress in the body", "nl": "Status stress in the body"}}, {"to": "soc:gini-inequality", "rel": "prerequisite", "note": {"fa": "اندازه‌گیری نابرابری", "en": "Measuring inequality", "nl": "Measuring inequality"}}], "people": ["core:richard-wilkinson"], "sources": ["src:9ff749e8d1", "src:cbebbd48aa"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:parsons-action-theory", "kind": "concept", "title": {"fa": "نظریهٔ کنش پارسونز: واحد کنشی و اراده‌گرایی", "en": "Parsons's action theory: the unit act and voluntarism", "nl": "Parsons' actietheorie: de eenheidsactie en voluntarisme"}, "aliases": [], "parent": "soc:theory", "field": "soc:theory", "summary": {"fa": "تالکوت پارسونز (۱۹۰۲–۱۹۷۹) می‌خواست برای جامعه‌شناسی یک چارچوب مفهومی عمومی بسازد. نقطهٔ شروع او «کنش» است: رفتاری آگاهانه و هدف‌دار که در یک موقعیت و زیر تأثیر ارزش‌ها و هنجارها انجام می‌شود. در کتاب «ساختار کنش اجتماعی» (۱۹۳۷) استدلال کرد که مارشال، پارتو، دورکیم و وبر با همهٔ تفاوت‌ها به یک نتیجه می‌رسند: کنش انسان را نمی‌شود فقط با سود شخصی توضیح داد. سخنران این بحث را مقدمه‌ای برای فهم نظریه‌های سیستمی می‌داند.", "en": "Talcott Parsons (1902-1979) set out to build a general conceptual framework for sociology. His starting point is 'action': conscious, goal-directed behaviour carried out in a situation and shaped by values and norms. In The Structure of Social Action (1937) he argued that Marshall, Pareto, Durkheim and Weber, despite their differences, converge on one conclusion: human action cannot be explained by self-interest alone. The lecturer presents this as an entry point to systems theory.", "nl": "Talcott Parsons (1902-1979) wilde een algemeen begrippenkader voor de sociologie bouwen. Zijn uitgangspunt is 'handelen': bewust, doelgericht gedrag in een situatie, gevormd door waarden en normen. Hij betoogde dat Marshall, Pareto, Durkheim en Weber samenkomen in de conclusie dat handelen niet alleen uit eigenbelang te verklaren is."}, "points": [{"text": {"fa": "سخنران پارسونز را در یک سنت قرار می‌دهد: او نخستین مترجم وبر به انگلیسی بود و دورکیم را برای جامعه‌شناسی آمریکا بازخوانی کرد. به گفتهٔ سخنران، دورکیم در آمریکا بد فهمیده شده بود؛ مثلاً «وجدان جمعی» را «روح گروهی» ترجمه کرده بودند و او را فیلسوف می‌شمردند، نه جامعه‌شناس. مسیر او: زیست‌شناسی و فلسفه در کالج، یک سال در مدرسهٔ اقتصاد لندن (آشنایی با مالینوفسکی) و آلمان، و در ۱۹۳۷ کتاب «ساختار کنش اجتماعی».", "en": "The lecturer places Parsons in a lineage: he was Weber's first English translator and re-read Durkheim for American sociology. Per the lecturer, Durkheim had been misunderstood in America, e.g. 'collective conscience' rendered as 'group mind', so he was dismissed as a philosopher rather than a sociologist. His path: biology and philosophy at college, a year at the LSE (meeting Malinowski) and Germany, then The Structure of Social Action in 1937.", "nl": "The lecturer places Parsons in a lineage: he was Weber's first English translator and re-read Durkheim for American sociology. Per the lecturer, Durkheim had been misunderstood in America, e.g. 'collective conscience' rendered as 'group mind', so he was dismissed as a philosopher rather than a sociologist. His path: biology and philosophy at college, a year at the LSE (meeting Malinowski) and Germany, then The Structure of Social Action in 1937."}, "sources": ["src:f83c54cd83", "src:708b1af302"], "flags": ["editor-note"]}, {"text": {"fa": "واحد کنشی چهار عنصر دارد: کنشگر؛ هدفی در آینده؛ موقعیتی با دو بخش، یعنی «شرایط» که کنشگر بر آن‌ها کنترل ندارد و «وسایل» که می‌تواند انتخاب کند؛ و هنجارها و ارزش‌هایی که انتخاب وسایل را جهت می‌دهند. به همین دلیل «کنش» با «رفتار» فرق دارد: کنش آگاهانه و هدف‌دار است، نه واکنش مکانیکی.", "en": "The unit act has four elements: an actor; a future goal; a situation with two parts, 'conditions' the actor cannot control and 'means' the actor can choose; and norms and values that steer the choice of means. Hence 'action' differs from 'behaviour': it is conscious and goal-directed, not a mechanical reaction.", "nl": "The unit act has four elements: an actor; a future goal; a situation with two parts, 'conditions' the actor cannot control and 'means' the actor can choose; and norms and values that steer the choice of means. Hence 'action' differs from 'behaviour': it is conscious and goal-directed, not a mechanical reaction."}, "sources": ["src:f83c54cd83", "src:708b1af302", "src:9803cc6139"], "flags": []}, {"text": {"fa": "فرضیهٔ همگرایی: پارسونز معتقد بود مارشال، پارتو، دورکیم و وبر از راه‌های جدا فهمیده‌اند که تحلیل فایده‌گرایانه، که انسان را فقط در پی سود شخصی می‌بیند، کافی نیست. پارتو با «کنش غیرعقلانی»، دورکیم با هنجارهای مشترک و وبر با معنا و ارزش به این نتیجه کمک کردند. پارسونز نتیجه گرفت که سرمایه‌داری را نمی‌توان فقط با اقتصاد توضیح داد و ارزش‌ها و باورها هم باید دیده شوند.", "en": "The convergence thesis: Parsons held that Marshall, Pareto, Durkheim and Weber, by separate routes, found utilitarian accounts (humans as pursuers of private gain) inadequate. Pareto contributed non-logical action, Durkheim shared norms, Weber meaning and values. Parsons concluded that capitalism cannot be explained by economics alone; values and beliefs must be included.", "nl": "The convergence thesis: Parsons held that Marshall, Pareto, Durkheim and Weber, by separate routes, found utilitarian accounts (humans as pursuers of private gain) inadequate. Pareto contributed non-logical action, Durkheim shared norms, Weber meaning and values. Parsons concluded that capitalism cannot be explained by economics alone; values and beliefs must be included."}, "sources": ["src:f83c54cd83", "src:708b1af302"], "flags": []}, {"text": {"fa": "به گفتهٔ سخنران، پارسونز در آغاز به «اراده‌گرایی» نزدیک بود (کنشگر انتخاب می‌کند) ولی در آثار پایانی‌اش بیشتر بر ساختار تکیه کرد و شرایط فرهنگی و اجتماعی را چنان سفت دید که کنشگر پیش از تغییر دادنشان تحت فشار آن‌ها قرار می‌گیرد. او همچنین نقل می‌کند که پارسونز در پاسخ به یک منتقد پذیرفت میان نظریهٔ کنش و کنش متقابل نمادین (مید) همپوشانی قابل توجهی هست، هرچند این دو یکی نیستند.", "en": "Per the lecturer, Parsons began close to voluntarism (the actor chooses) but in his late work leaned on structure, treating cultural and social conditions as so rigid that actors are overwhelmed before they can change them. He also reports that Parsons, answering a critic, accepted that action theory and symbolic interactionism (Mead) overlap considerably but are not the same.", "nl": "Per the lecturer, Parsons began close to voluntarism (the actor chooses) but in his late work leaned on structure, treating cultural and social conditions as so rigid that actors are overwhelmed before they can change them. He also reports that Parsons, answering a critic, accepted that action theory and symbolic interactionism (Mead) overlap considerably but are not the same."}, "sources": ["src:f83c54cd83"], "flags": ["editor-note"]}, {"text": {"fa": "توضیح علمی: سخنران می‌گوید پارسونز علیه کمّی‌گرایی و تجربه‌گرایی آمریکایی شورید. این ساده‌سازی است: پارسونز با تجربه‌گرایی بدون نظریه مخالف بود، نه با آمار و پژوهش تجربی به‌طور کلی. این‌که او از اراده‌گرایی به ساختارگرایی رفت هم محل بحث است؛ بسیاری از شارحان او را در همهٔ دوره‌ها هم‌زمان به انتخاب کنشگر و هم به نظم هنجاری توجه‌کننده می‌دانند. منتقدانی مثل دنیس رانگ هم گفته‌اند که او انسان را بیش از حد «اجتماعی‌شده» تصویر می‌کند.", "en": "Scholarly caveat: the lecturer says Parsons rebelled against American quantification and empiricism. That simplifies: he opposed atheoretical empiricism, not statistics or empirical research as such. The claim that he moved from voluntarism to structural determinism is also disputed; many commentators see continuous attention to both actor choice and normative order. Critics such as Dennis Wrong argued instead that his picture of people is over-socialised.", "nl": "Scholarly caveat: the lecturer says Parsons rebelled against American quantification and empiricism. That simplifies: he opposed atheoretical empiricism, not statistics or empirical research as such. The claim that he moved from voluntarism to structural determinism is also disputed; many commentators see continuous attention to both actor choice and normative order. Critics such as Dennis Wrong argued instead that his picture of people is over-socialised."}, "sources": ["src:fc4b91b0d7", "src:708b1af302"], "flags": ["contested", "editor-note"]}], "links": [{"to": "soc:protestant-ethic", "rel": "see-also", "note": {"fa": "وبر و نقش ارزش‌ها در اقتصاد", "en": "Weber and the role of values in economic life", "nl": "Weber and the role of values in economic life"}}, {"to": "soc:anomie", "rel": "see-also", "note": {"fa": "دورکیم و نقش هنجارهای مشترک", "en": "Durkheim and shared norms", "nl": "Durkheim and shared norms"}}, {"to": "soc:presentation-of-self", "rel": "contrasts", "note": {"fa": "کنش متقابل نمادین (مید، گافمن) در برابر نگاه سیستمی", "en": "Symbolic interactionism versus the systems view", "nl": "Symbolic interactionism versus the systems view"}}, {"to": "soc:parsons-social-system", "rel": "part-of", "note": {"fa": "نظریهٔ کنش پایهٔ مفهوم نظام اجتماعی است", "en": "Action theory underlies the social-system concept", "nl": "Action theory underlies the social-system concept"}}], "people": ["core:talcott-parsons", "core:max-weber", "core:mile-durkheim", "core:vilfredo-pareto", "core:alfred-marshall", "core:dennis-h-wrong"], "sources": ["src:708b1af302", "src:9803cc6139", "src:f83c54cd83", "src:fc4b91b0d7"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:gini-inequality", "kind": "concept", "title": {"fa": "اندازه‌گیری نابرابری: ضریب جینی و فراتر از آن", "en": "Measuring inequality: the Gini and beyond", "nl": "Ongelijkheid meten: de Gini en verder"}, "aliases": [], "parent": "soc:inequality", "field": "soc:inequality", "summary": {"fa": "جینی صفر یعنی همه برابر، یک یعنی همه‌چیز دست یک نفر. ایران در دههٔ اخیر حدود ۰٫۴۰ است: بالاتر از اروپا، نزدیک ترکیه و آمریکا، پایین‌تر از آمریکای لاتین. ولی جینی سهم «یک درصد بالا» و ثروت (نه درآمد) را پنهان می‌کند.", "en": "A Gini of zero means everyone equal, one means everything in one hand. Iran in the last decade is about 0.40: higher than Europe, near Turkey and the US, lower than Latin America. But the Gini hides the \"top one percent\" share and wealth (as opposed to income).", "nl": "Een Gini van nul betekent iedereen gelijk, één betekent alles in één hand. Iran zit het laatste decennium rond 0,40: hoger dan Europa, dicht bij Turkije en de VS, lager dan Latijns-Amerika. Maar de Gini verbergt het aandeel van de \"top één procent\" en vermogen (tegenover inkomen)."}, "points": [{"text": {"fa": "بانک جهانی: جینی درآمدی ایران در سال‌های اخیر در بازهٔ ۳۸ تا ۴۲ گزارش شده؛ مرکز آمار ایران ارقام مشابهی می‌دهد و در سال‌های تورم بالا افزایش دیده می‌شود.", "en": "World Bank: Iran's income Gini in recent years is reported in the 38 to 42 range; the Statistical Centre of Iran gives similar figures, rising in high-inflation years.", "nl": "World Bank: Iran's income Gini in recent years is reported in the 38 to 42 range; the Statistical Centre of Iran gives similar figures, rising in high-inflation years."}, "sources": ["src:8a3dd521dc"], "flags": []}, {"text": {"fa": "پیکتی (۲۰۱۴): وقتی بازده سرمایه از رشد اقتصاد بیشتر باشد (r > g)، ثروت موروثی نسبت به درآمد کار بزرگ می‌شود؛ نابرابری ثروت همه‌جا بسیار بیشتر از نابرابری درآمد است.", "en": "Piketty (2014): when the return on capital exceeds economic growth (r > g), inherited wealth grows relative to earned income; wealth inequality is everywhere far larger than income inequality.", "nl": "Piketty (2014): when the return on capital exceeds economic growth (r > g), inherited wealth grows relative to earned income; wealth inequality is everywhere far larger than income inequality."}, "sources": ["src:6c0c807f94"], "flags": ["contested"]}], "links": [{"to": "soc:mobility", "rel": "see-also", "note": {"fa": "نابرابری فرصت در برابر نابرابری نتیجه", "en": "Inequality of opportunity versus of outcome", "nl": "Inequality of opportunity versus of outcome"}}, {"to": "soc:inequality-health", "rel": "see-also", "note": {"fa": "پیامدهای نابرابری", "en": "The consequences of inequality", "nl": "The consequences of inequality"}}], "people": ["core:thomas-piketty"], "sources": ["src:6c0c807f94", "src:8a3dd521dc"], "booklets": [], "origin": null, "iran": "iran:gini", "wikidata": null, "status": "draft"}, {"id": "soc:frankfurt-critical-theory", "kind": "concept", "title": {"fa": "مکتب فرانکفورت و نظریهٔ انتقادی", "en": "The Frankfurt School and critical theory", "nl": "De Frankfurter Schule en de kritische theorie"}, "aliases": [], "parent": "soc:theory", "field": "soc:theory", "summary": {"fa": "مکتب فرانکفورت گروهی از متفک
