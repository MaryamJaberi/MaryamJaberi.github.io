wie achterblijft."}, "points": [{"text": {"fa": "کاستلز (۱۹۹۶): شبکه شکل سازمانی غالب می‌شود چون انعطاف‌پذیر، مقیاس‌پذیر و بقاپذیر است؛ اما منطقش «دوگانه» است: یا درون شبکه‌ای یا بی‌ارزش. این تز پیش از شبکه‌های اجتماعی نوشته شد و بسیاری از پیش‌بینی‌هایش را آن‌ها تأیید کردند.", "en": "Castells (1996): the network becomes the dominant organisational form because it is flexible, scalable and survivable; but its logic is \"binary\": either you are in the network or you are worthless. The thesis was written before social media and many of its predictions were borne out by them.", "nl": "Castells (1996): the network becomes the dominant organisational form because it is flexible, scalable and survivable; but its logic is \"binary\": either you are in the network or you are worthless. The thesis was written before social media and many of its predictions were borne out by them."}, "sources": ["src:7af26b32fe"], "flags": []}], "links": [{"to": "soc:weak-ties", "rel": "prerequisite", "note": {"fa": "ساختار شبکه", "en": "Network structure", "nl": "Network structure"}}, {"to": "psy:polarization", "rel": "bridges", "note": {"fa": "قطبی شدن در شبکه‌ها", "en": "Polarization in networks", "nl": "Polarization in networks"}}, {"to": "soc:social-movements", "rel": "see-also", "note": {"fa": "جنبش‌های شبکه‌ای", "en": "Networked movements", "nl": "Networked movements"}}], "people": ["core:manuel-castells"], "sources": ["src:7af26b32fe"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:durkheim-religion-society", "kind": "concept", "title": {"fa": "دورکیم و دین به‌مثابه جامعه", "en": "Durkheim and religion as society", "nl": "Durkheim en religie als samenleving"}, "aliases": [], "parent": "soc:cohesion", "field": "soc:cohesion", "summary": {"fa": "دورکیم در «صورت‌های بنیانی حیات دینی» می‌پرسد آیا یک نهاد بزرگ مثل دین می‌تواند فقط بر پایهٔ فریب و دروغ دوام بیاورد. پاسخ او منفی است: دین چیزی واقعی را بیان می‌کند و آن خود جامعه و نیروی جمعی آن است. او برای رسیدن به این نتیجه سراغ ساده‌ترین شکل دین رفت و پدیده‌های اجتماعی را مثل چیزهایی بیرونی و قابل بررسی دید. مناسک جمعی، چه دینی و چه غیردینی، افراد را به هم پیوند می‌دهد و به آن‌ها نیرو می‌بخشد.", "en": "In The Elementary Forms of Religious Life, Durkheim asks whether a major institution such as religion could survive on deception alone. He answers no: religion expresses something real, namely society and its collective force. To reach this he studied the simplest known form of religion and treated social phenomena as external, observable things. Collective rituals, religious or secular, bind people together and give them energy.", "nl": "In Les formes élémentaires de la vie religieuse vraagt Durkheim of een instituut als religie kan voortbestaan op bedrog alleen. Zijn antwoord is nee: religie drukt de samenleving en haar collectieve kracht uit. Gemeenschappelijke rituelen, religieus of seculier, verbinden mensen."}, "points": [{"text": {"fa": "سخنران می‌گوید مسئلهٔ اصلی دورکیم این است: در دورانی که بسیاری از دانشمندان دین را فریب کشیشان می‌دانستند، آیا یک نظام اجتماعی می‌تواند فقط روی دروغ بنا شود؟ اگر نه، پس دین چیزی واقعی را بیان می‌کند و باید ببینیم چه چیزی.", "en": "The lecturer presents Durkheim's central question: in an age when many scholars saw religion as priestly deception, can a social system rest on lies alone? If not, religion must express something real, and we must ask what.", "nl": "The lecturer presents Durkheim's central question: in an age when many scholars saw religion as priestly deception, can a social system rest on lies alone? If not, religion must express something real, and we must ask what."}, "sources": ["src:358e9ed202", "src:deee0beaa4"], "flags": []}, {"text": {"fa": "روش دورکیم این است که تا حد ممکن به ساده‌ترین و ابتدایی‌ترین شکل پدیده برگردیم تا به هسته‌اش برسیم، و پدیده‌های اجتماعی را مثل «چیز» بیرونی و قابل مشاهده بررسی کنیم، نه صرفاً ایدهٔ ذهنی. به همین دلیل او دین را طوری تعریف می‌کند که خدا و اسطورهٔ آفرینش را لازم نداند، چون برخی دین‌ها آن‌ها را ندارند.", "en": "Durkheim's method is to go back to the simplest form of a phenomenon to find its core, and to study social facts as external, observable things rather than mere ideas. Hence his definition of religion does not require a god or a creation myth, since some religions lack them.", "nl": "Durkheim's method is to go back to the simplest form of a phenomenon to find its core, and to study social facts as external, observable things rather than mere ideas. Hence his definition of religion does not require a god or a creation myth, since some religions lack them."}, "sources": ["src:358e9ed202", "src:deee0beaa4", "src:68f3ac9016"], "flags": []}, {"text": {"fa": "پاسخ دورکیم این است که در مناسک دینی مردم در واقع نیروی جمعی خودشان را می‌ستایند. مناسک گروه را به هم پیوند می‌دهد و حس نیرو و شفا می‌دهد. سخنران همین منطق را در مناسک غیردینی امروز می‌بیند: جشنوارهٔ موسیقی، کارناوال و گروه‌درمانی.", "en": "Durkheim's answer is that in religious ritual people in effect celebrate their own collective power. Ritual binds the group and gives a sense of strength and healing. The lecturer sees the same logic in modern secular gatherings such as music festivals, carnivals and group therapy.", "nl": "Durkheim's answer is that in religious ritual people in effect celebrate their own collective power. Ritual binds the group and gives a sense of strength and healing. The lecturer sees the same logic in modern secular gatherings such as music festivals, carnivals and group therapy."}, "sources": ["src:358e9ed202", "src:deee0beaa4"], "flags": []}, {"text": {"fa": "به گفتهٔ سخنران، مفهوم «راز» و «فوق‌طبیعی» در نظر دورکیم مفهومی دیرپدید است و برای انسان ابتدایی همه‌چیز طبیعی بوده؛ راز وقتی پدید آمد که علم به‌عنوان رقیب فهم جهان ظاهر شد. سخنران همچنین تأکید می‌کند که پیش از نقد هر پدیده باید آن را فهمید، و این نگاه پژوهشگر است نه شهروند.", "en": "Per the lecturer, Durkheim saw the idea of 'mystery' and the 'supernatural' as a late notion: for early peoples the world was simply natural, and mystery appeared once science arose as a rival way of understanding. The lecturer adds that a phenomenon should be understood before it is criticised, which is the stance of a researcher rather than a citizen.", "nl": "Per the lecturer, Durkheim saw the idea of 'mystery' and the 'supernatural' as a late notion: for early peoples the world was simply natural, and mystery appeared once science arose as a rival way of understanding. The lecturer adds that a phenomenon should be understood before it is criticised, which is the stance of a researcher rather than a citizen."}, "sources": ["src:358e9ed202", "src:deee0beaa4"], "flags": ["editor-note"]}, {"text": {"fa": "نکتهٔ احتیاط: دورکیم خودش کار میدانی نکرد و دادهٔ او دربارهٔ توتم‌پرستی بومیان استرالیا از گزارش‌های دیگران آمده بود؛ بسیاری از مردم‌شناسان بعدی این نمونه را برای نتیجه‌گیری دربارهٔ همهٔ ادیان کافی نمی‌دانند. «ساده‌ترین» دین هم لزوماً «قدیمی‌ترین» نیست. همچنین این‌که دین فقط ستایش جامعه باشد یک تعبیر جامعه‌شناختی است و تجربهٔ فردی و معنوی دین را کامل توضیح نمی‌دهد.", "en": "Caveat: Durkheim did no fieldwork himself and his data on Aboriginal Australian totemism came second-hand; many later anthropologists consider this too narrow a base for conclusions about all religions. The 'simplest' religion is not necessarily the earliest. And 'religion is society worshipping itself' is one sociological reading that does not fully explain individual or spiritual experience.", "nl": "Caveat: Durkheim did no fieldwork himself and his data on Aboriginal Australian totemism came second-hand; many later anthropologists consider this too narrow a base for conclusions about all religions. The 'simplest' religion is not necessarily the earliest. And 'religion is society worshipping itself' is one sociological reading that does not fully explain individual or spiritual experience."}, "sources": [], "flags": ["contested", "editor-note"]}], "links": [{"to": "soc:cohesion", "rel": "explains", "note": {"fa": "مناسک جمعی منبع انسجام گروه است", "en": "Collective ritual is a source of group cohesion", "nl": "Collective ritual is a source of group cohesion"}}, {"to": "soc:secularization", "rel": "see-also", "note": {"fa": "مناسک سکولار امروز و تغییر جایگاه دین", "en": "Modern secular rituals and the changing place of religion", "nl": "Modern secular rituals and the changing place of religion"}}, {"to": "soc:functionalism-needs", "rel": "part-of", "note": {"fa": "تحلیل دین نمونه‌ای از روش کارکردگرایانه است", "en": "The analysis of religion is an instance of the functionalist method", "nl": "The analysis of religion is an instance of the functionalist method"}}], "people": ["core:mile-durkheim", "core:bronis-aw-malinowski"], "sources": ["src:358e9ed202", "src:68f3ac9016", "src:deee0beaa4"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:parsons-social-system", "kind": "concept", "title": {"fa": "نظام اجتماعی نزد پارسونز و نقد «محافظه‌کاری»", "en": "Parsons's social system and the charge of conservatism", "nl": "Parsons' sociale systeem en het verwijt van conservatisme"}, "aliases": [], "parent": "soc:theory", "field": "soc:theory", "summary": {"fa": "پارسونز جامعه را «نظام» می‌بیند: مجموعه‌ای از اجزای وابسته به هم با مرزهای مشخص که نظم درونی دارد و با وجود تغییر افراد دوام می‌آورد. دانشگاه نمونه است: استاد و دانشجو عوض می‌شوند ولی نهاد می‌ماند. او نظام‌های اجتماعی را با موجودات زنده مقایسه می‌کند ولی چهار تفاوت می‌شمارد. سخنران از این منطق برای هشدار دربارهٔ مهندسی اجتماعی استفاده می‌کند و می‌گوید نقد «محافظه‌کاری» همیشه وارد نیست.", "en": "Parsons sees society as a system: interdependent parts with defined boundaries and an inner order that persists while individuals come and go. A university is the example: staff and students change, the institution continues. He compares social systems with living organisms but lists four differences. The lecturer uses this logic to warn against social engineering and argues the 'conservative' charge does not always hit the mark.", "nl": "Parsons ziet de samenleving als een systeem: onderling afhankelijke delen met een eigen orde die blijft bestaan terwijl individuen wisselen. Hij vergelijkt sociale systemen met levende organismen, maar noemt vier verschillen. De docent gebruikt deze logica als waarschuwing tegen sociale engineering."}, "points": [{"text": {"fa": "تعریف: نظام یک واحد پیچیده با مرزهای مشخص است که اجزایش با هم در ارتباطند. نظام اجتماعی همان نظم میان اجزا است که با تغییر برخی عناصر باز هم ادامه می‌یابد؛ پس افراد جایگزین‌پذیرند و سازمان‌ها طوری ساخته می‌شوند که کارکردشان با رفت‌وآمد افراد حفظ شود. ویژگی‌های عمومی: نظم و وابستگی متقابل اجزا، گرایش به تعادل، و تغییر آهسته و سنجیده. اختلال در یک زیرنظام ممکن است کل نظام را آشفته کند.", "en": "Definition: a system is a complex unit with defined boundaries whose parts relate to each other. A social system is the order among its parts, which persists while some elements change; individuals are therefore replaceable and organisations are built to keep functioning as people come and go. General features: order and interdependence of parts, a tendency towards equilibrium, and slow, measured change. Disturbance in one subsystem can disturb the whole.", "nl": "Definition: a system is a complex unit with defined boundaries whose parts relate to each other. A social system is the order among its parts, which persists while some elements change; individuals are therefore replaceable and organisations are built to keep functioning as people come and go. General features: order and interdependence of parts, a tendency towards equilibrium, and slow, measured change. Disturbance in one subsystem can disturb the whole."}, "sources": ["src:f83c54cd83", "src:33ab816b0c"], "flags": []}, {"text": {"fa": "چهار تفاوت با نظام زیستی، به روایت سخنران: رشد (موجود زنده تا حدی رشد می‌کند و می‌ایستد، نظام اجتماعی می‌تواند مدت‌ها ایستا بماند یا دیرزمانی رشد کند)؛ مکان (بدن مرز روشنی دارد، نظام اجتماعی مثل نفوذ یک کشور یا یک جنبش اجتماعی از مرز آغازینش فراتر می‌رود)؛ زمان (موجود زنده می‌میرد، دولت‌ها و ادیان سده‌ها اثر می‌گذارند)؛ اجزا (خرابی یک عضو می‌تواند موجود زنده را بکشد، ولی در نظام اجتماعی اجزا قابل تعویض‌اند، مثل ستارهٔ ورزشی که می‌رود و لیگ ادامه می‌یابد).", "en": "Four differences from biological systems, as told in the lecture: growth (an organism grows to a limit and stops; a social system may stay static for long or grow for long); space (a body has clear limits; a social system, like a country's influence or a social movement, spills over its original borders); time (organisms die; states and religions leave traces for centuries); parts (one failed organ can kill an organism, but social-system parts are replaceable, like a sports star leaving while the league goes on).", "nl": "Four differences from biological systems, as told in the lecture: growth (an organism grows to a limit and stops; a social system may stay static for long or grow for long); space (a body has clear limits; a social system, like a country's influence or a social movement, spills over its original borders); time (organisms die; states and religions leave traces for centuries); parts (one failed organ can kill an organism, but social-system parts are replaceable, like a sports star leaving while the league goes on)."}, "sources": ["src:f83c54cd83", "src:33ab816b0c"], "flags": []}, {"text": {"fa": "سخنران چهار سطح نظام را هم نام می‌برد: نظام اجتماعی (کنش متقابل کنشگران و نقش‌ها)، شخصیتی، فرهنگی (معنا، نماد و ارزش‌ها) و رفتاری (زیستی-عصبی). بحث را عمدتاً روی نظام اجتماعی و فرهنگی نگه می‌دارد.", "en": "The lecturer also names four system levels: the social system (interaction of actors and roles), personality, culture (meanings, symbols, values) and behavioural (biological-neural). He dwells mainly on the social and cultural levels.", "nl": "The lecturer also names four system levels: the social system (interaction of actors and roles), personality, culture (meanings, symbols, values) and behavioural (biological-neural). He dwells mainly on the social and cultural levels."}, "sources": ["src:f83c54cd83", "src:33ab816b0c"], "flags": []}, {"text": {"fa": "به گفتهٔ سخنران، نقد رایج که کارکردگرایی «محافظه‌کار» است چون گفته می‌شود دست‌زدن به یک جزء کل را تغییر می‌دهد، چندان وارد نیست، زیرا این ویژگی توصیفی نظام است. او با استناد به همین منطق از «کارکرد پنهان» (پیامدهای پیش‌بینی‌نشده) حرف می‌زند و مثال ایران را می‌آورد: سیاست‌های جمعیتی ضد و نقیض، مثل دورهٔ «فرزند کمتر، زندگی بهتر» و بعد سیاست‌های فرزندآوری و محدودکردن خدمات پزشکی، به نظر او خطر رانت، فساد و بازار زیرزمینی پزشکی را به همراه دارند.", "en": "Per the lecturer, the common charge that functionalism is 'conservative' (touching one part changes the whole) is not very telling, since this is a descriptive feature of systems. Using this logic he speaks of 'latent functions' (unforeseen consequences) and gives an Iranian example: shifting population policies, from 'fewer children, better life' to pro-birth incentives and restrictions on medical services, which he thinks risk rents, corruption and an underground medical market.", "nl": "Per the lecturer, the common charge that functionalism is 'conservative' (touching one part changes the whole) is not very telling, since this is a descriptive feature of systems. Using this logic he speaks of 'latent functions' (unforeseen consequences) and gives an Iranian example: shifting population policies, from 'fewer children, better life' to pro-birth incentives and restrictions on medical services, which he thinks risk rents, corruption and an underground medical market."}, "sources": ["src:f83c54cd83"], "flags": ["editor-note"]}, {"text": {"fa": "توضیح علمی و دیدگاه مخالف: واژه‌های «کارکرد آشکار» و «کارکرد پنهان» از رابرت مرتون است، نه پارسونز. نقد محافظه‌کاری هم جدی گرفته شده است: منتقدانی مثل سی. رایت میلز (که به «نظریهٔ کلان» حمله کرد، نه فقط به کمّی‌گرایی) و آلوین گولدنر گفتند که تکیه بر تعادل و نظم هنجاری تعارض و تغییر را کم‌اهمیت می‌کند. از سوی دیگر، همهٔ سیاست‌های جمعیتی شکست نمی‌خورند و ارزیابی‌های تجربی نشان می‌دهد برخی مداخلات اثر قابل سنجش داشته‌اند؛ پس «دخالت نکنیم» تنها نتیجهٔ ممکن نیست. ادعای سخنران دربارهٔ پیامدهای سیاست‌های ایران نیاز به شواهد جداگانه دارد.", "en": "Scholarly caveat and opposing view: the terms 'manifest' and 'latent' functions come from Robert Merton, not Parsons. The conservatism charge has been taken seriously: critics such as C. Wright Mills (who attacked 'grand theory', not merely quantification) and Alvin Gouldner argued that stress on equilibrium and normative order downplays conflict and change. On the other side, not every population policy fails and empirical evaluations show some interventions have measurable effects, so 'do not intervene' is not the only possible lesson. The lecturer's claims about the consequences of Iranian policies need separate evidence.", "nl": "Scholarly caveat and opposing view: the terms 'manifest' and 'latent' functions come from Robert Merton, not Parsons. The conservatism charge has been taken seriously: critics such as C. Wright Mills (who attacked 'grand theory', not merely quantification) and Alvin Gouldner argued that stress on equilibrium and normative order downplays conflict and change. On the other side, not every population policy fails and empirical evaluations show some interventions have measurable effects, so 'do not intervene' is not the only possible lesson. The lecturer's claims about the consequences of Iranian policies need separate evidence."}, "sources": ["src:668816e479", "src:edede1b101", "src:57f04fa1df"], "flags": ["contested", "editor-note"]}], "links": [{"to": "soc:parsons-action-theory", "rel": "see-also", "note": {"fa": "از کنش تا نظام", "en": "From action to system", "nl": "From action to system"}}, {"to": "soc:sociological-imagination", "rel": "critiques", "note": {"fa": "میلز در این کتاب به نظریهٔ کلان پارسونز حمله می‌کند", "en": "Mills attacks Parsons's grand theory in this book", "nl": "Mills attacks Parsons's grand theory in this book"}}, {"to": "soc:iran-fertility", "rel": "see-also", "note": {"fa": "نمونهٔ سیاست جمعیتی ایران", "en": "The Iranian population-policy case", "nl": "The Iranian population-policy case"}}, {"to": "soc:institutions", "rel": "see-also", "note": {"fa": "نهادها و دولت", "en": "Institutions and the state", "nl": "Institutions and the state"}}], "people": ["core:talcott-parsons", "core:robert-k-merton", "core:c-wright-mills", "core:alvin-w-gouldner"], "sources": ["src:33ab816b0c", "src:57f04fa1df", "src:668816e479", "src:edede1b101", "src:f83c54cd83"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:marx-censorship-1842", "kind": "concept", "title": {"fa": "مارکس و دستورالعمل سانسور پروس (۱۸۴۲): نقد قانون از درون", "en": "Marx and the Prussian censorship instruction (1842): criticising law from within", "nl": "Marx en de Pruisische censuurinstructie (1842): kritiek van binnenuit"}, "aliases": [], "parent": "soc:theory", "field": "soc:theory", "summary": {"fa": "مارکس جوان در نوشته‌ای دربارهٔ دستورالعمل تازهٔ سانسور پروس نشان می‌دهد این قانون با ادعای حمایت از اخلاق و دین، خودش را نقض می‌کند و در عمل ابزار محدودکردن اندیشه است. این نمونهٔ خوبی از «نقد درونی» است: نشان بدهیم چیزی خلاف هدفی که ادعا می‌کند عمل می‌کند. در این نوشته مارکس هنوز از آزادی و قانون به شکلی کلی و فلسفی حرف می‌زند، نه طبقاتی.", "en": "In a text on Prussia's new censorship instruction, the young Marx shows that a law claiming to protect morality and religion contradicts itself and in practice limits thought. It is a good example of immanent critique: showing that something works against its own stated aim. Here Marx still speaks of freedom and law in a general, philosophical way, not in class terms.", "nl": "In zijn tekst over de nieuwe Pruisische censuurinstructie laat de jonge Marx zien dat een wet die zedelijkheid en godsdienst zegt te beschermen zichzelf tegenspreekt. Dit is interne kritiek; hij spreekt hier nog niet in klassentermen."}, "points": [{"text": {"fa": "زمینه: پس از مرگ پادشاه پروس، لایحهٔ قدیمی کنار گذاشته شد و دستورالعمل جدید نوشته شد. مارکس (حدود ۲۳ سال) در پاسخ نوشت. متن به دلیل سانسور در روزنامه چاپ نشد و بعداً در سوئیس منتشر شد.", "en": "Background: after the Prussian king's death the old text was replaced by a new instruction, and Marx (about 23) wrote a reply. Because of censorship it could not appear in the newspaper and was later published in Switzerland.", "nl": "Background: after the Prussian king's death the old text was replaced by a new instruction, and Marx (about 23) wrote a reply. Because of censorship it could not appear in the newspaper and was later published in Switzerland."}, "sources": ["src:0ce7ee12f9", "src:e953aff958"], "flags": []}, {"text": {"fa": "استدلال اصلی: دستورالعمل حمله به دین را فقط وقتی ممنوع می‌کند که «سبک‌سرانه» یا «خصمانه» باشد. مارکس می‌پرسد معیار این دو واژه چیست. به نظر او واژه‌ها طوری انتخاب شده‌اند که در ظاهر معقول باشند اما در عمل هر نقد جدی را ممنوع کنند: حملهٔ سطحی «سبک‌سرانه» است و حملهٔ ریشه‌ای «خصمانه»، پس هر نوع حمله‌ای می‌تواند ممنوع شود. به گفتهٔ سخنران، این همان نقد کانتی است: نشان بدهیم قانون خلاف خودش عمل می‌کند.", "en": "Main argument: the instruction bans attacks on religion only if they are 'frivolous' or 'hostile'. Marx asks what these words measure. In his view they are chosen to look reasonable while banning any serious criticism: a shallow attack is 'frivolous' and a fundamental one 'hostile', so every kind of attack can be banned. As the lecturer puts it, this is Kantian critique: show that a law works against itself.", "nl": "Main argument: the instruction bans attacks on religion only if they are 'frivolous' or 'hostile'. Marx asks what these words measure. In his view they are chosen to look reasonable while banning any serious criticism: a shallow attack is 'frivolous' and a fundamental one 'hostile', so every kind of attack can be banned. As the lecturer puts it, this is Kantian critique: show that a law works against itself."}, "sources": ["src:0ce7ee12f9", "src:e953aff958"], "flags": []}, {"text": {"fa": "مارکس همچنین نشان می‌دهد که قانون اخلاق و دین را یکی گرفته است، در حالی که اخلاق بر خودآیینی اندیشهٔ انسان بنا شده و دین بر اتکا به مرجعی بیرونی. با این معیار حتی کانت، فیشته و اسپینوزا هم باید «غیراخلاقی» اعلام شوند. او با طعنه می‌گوید سانسورچیان باید همه‌چیزدان باشند، و گرنه چگونه می‌توانند دربارهٔ فلسفه و ادبیات حکم کنند؟", "en": "Marx also shows that the law fuses morality and religion, although morality rests on the autonomy of human thought and religion on an external authority. By this standard even Kant, Fichte and Spinoza would count as 'immoral'. With irony he asks whether censors must know everything, since otherwise how could they rule on philosophy and literature.", "nl": "Marx also shows that the law fuses morality and religion, although morality rests on the autonomy of human thought and religion on an external authority. By this standard even Kant, Fichte and Spinoza would count as 'immoral'. With irony he asks whether censors must know everything, since otherwise how could they rule on philosophy and literature."}, "sources": ["src:0ce7ee12f9", "src:e953aff958"], "flags": []}, {"text": {"fa": "به گفتهٔ سخنران، این نوشته هنوز از هگل، فویرباخ و اسپینوزا اثر می‌پذیرد: مارکس هنوز آزادی را مفهومی عام می‌داند و قانون را مشکل «طبقه‌ها» نمی‌بیند. سخنران ادعا می‌کند دولت‌هایی که به مارکس تکیه کرده‌اند هیچ‌گاه به این آثار اولیه رجوع نکرده‌اند.", "en": "Per the lecturer, the text still bears the mark of Hegel, Feuerbach and Spinoza: Marx treats freedom as a general concept and does not yet see law as a matter of classes. The lecturer claims that states invoking Marx have never turned to these early works.", "nl": "Per the lecturer, the text still bears the mark of Hegel, Feuerbach and Spinoza: Marx treats freedom as a general concept and does not yet see law as a matter of classes. The lecturer claims that states invoking Marx have never turned to these early works."}, "sources": ["src:0ce7ee12f9"], "flags": ["editor-note"]}, {"text": {"fa": "توضیح تکمیلی: ادعای اینکه هیچ دولت مارکسیستی به آثار اولیه رجوع نکرده درست نیست؛ پس از ۱۹۵۶ بسیاری از مارکسیست‌های «انسان‌گرا» در اروپای شرقی و غربی دقیقاً بر مارکس جوان تکیه کردند. همچنین بحث دربارهٔ آزادی مطبوعات دو سوی جدی دارد: لیبرال‌ها آزادی بیان را حق بنیادین می‌دانند و بعضی (مثلاً در سنت لیبرال) محدودیت را فقط برای آسیب مستقیم؛ در سوی دیگر برخی بر ضرورت محدودیت‌هایی برای حمایت از گروه‌های آسیب‌پذیر یا نظم عمومی تأکید دارند. مارکس این بحث را در ۱۸۴۲ از زاویهٔ آزادی نقد و اندیشه طرح کرد.", "en": "Caveat: the claim that no Marxist state has consulted the early works is incorrect; after 1956 many humanist Marxists in East and West relied precisely on the young Marx. The debate over press freedom also has two serious sides: liberals treat free expression as a basic right, limiting it only for direct harm; others stress limits to protect vulnerable groups or public order. In 1842 Marx raised the issue from the standpoint of freedom of criticism and thought.", "nl": "Caveat: the claim that no Marxist state has consulted the early works is incorrect; after 1956 many humanist Marxists in East and West relied precisely on the young Marx. The debate over press freedom also has two serious sides: liberals treat free expression as a basic right, limiting it only for direct harm; others stress limits to protect vulnerable groups or public order. In 1842 Marx raised the issue from the standpoint of freedom of criticism and thought."}, "sources": ["src:e953aff958"], "flags": ["contested", "editor-note"]}], "links": [{"to": "soc:marx-young-hegelian-roots", "rel": "part-of", "note": {"fa": "مارکس جوان و میراث هگل", "en": "The young Marx and Hegel's legacy", "nl": "The young Marx and Hegel's legacy"}}, {"to": "phil:bastiat-law-state", "rel": "contrasts", "note": {"fa": "باستیا: دیدگاه لیبرال کلاسیک دربارهٔ قانون", "en": "Bastiat: the classical-liberal view of law", "nl": "Bastiat: the classical-liberal view of law"}}, {"to": "phil:two-liberties", "rel": "see-also", "note": {"fa": "دو مفهوم آزادی", "en": "Two concepts of liberty", "nl": "Two concepts of liberty"}}], "people": ["core:karl-marx", "core:baruch-spinoza"], "sources": ["src:0ce7ee12f9", "src:e953aff958"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:weak-ties", "kind": "concept", "title": {"fa": "قدرت پیوندهای ضعیف", "en": "The strength of weak ties", "nl": "De kracht van zwakke banden"}, "aliases": [], "parent": "soc:cohesion", "field": "soc:cohesion", "summary": {"fa": "شغل‌ها، ایده‌ها و اخبار تازه بیشتر از آشنایان دور می‌رسند تا دوستان نزدیک، چون دوستان نزدیک همان چیزهایی را می‌دانند که ما می‌دانیم. پیوند ضعیف پلِ میان خوشه‌هاست.", "en": "Jobs, ideas and news arrive more often through acquaintances than close friends, because close friends know what we know. The weak tie is the bridge between clusters.", "nl": "Banen, ideeën en nieuws komen vaker via kennissen dan via goede vrienden, omdat goede vrienden weten wat wij weten. De zwakke band is de brug tussen clusters."}, "points": [{"text": {"fa": "گرانووتر (۱۹۷۳): از کسانی که از راه آشنا شغل پیدا کرده بودند، بیشترشان آن آشنا را «گاه‌به‌گاه» یا «به‌ندرت» می‌دیدند، نه «اغلب».", "en": "Granovetter (1973): of those who found a job through a contact, most saw that contact \"occasionally\" or \"rarely\", not \"often\".", "nl": "Granovetter (1973): of those who found a job through a contact, most saw that contact \"occasionally\" or \"rarely\", not \"often\"."}, "sources": ["src:91ed9b7316"], "flags": []}, {"text": {"fa": "سنتولا (۲۰۱۰): اما رفتارهای پرهزینه (ترک سیگار، پیوستن به جنبش) برعکس از راه پیوندهای قوی و پرتکرار پخش می‌شوند: «سرایت پیچیده» به تأیید چند منبع نیاز دارد.", "en": "Centola (2010): but costly behaviours (quitting smoking, joining a movement) spread instead through strong, redundant ties: \"complex contagion\" needs confirmation from several sources.", "nl": "Centola (2010): but costly behaviours (quitting smoking, joining a movement) spread instead through strong, redundant ties: \"complex contagion\" needs confirmation from several sources."}, "sources": ["src:9021d6ca27"], "flags": []}], "links": [{"to": "psy:complex-contagion", "rel": "same-as", "note": {"fa": "سرایت پیچیده در ویکی روان", "en": "Complex contagion in the psychology wiki", "nl": "Complex contagion in the psychology wiki"}}, {"to": "soc:social-capital", "rel": "part-of", "note": {"fa": "سازوکار سرمایهٔ پل‌زننده", "en": "The mechanism of bridging capital", "nl": "The mechanism of bridging capital"}}], "people": ["core:mark-granovetter", "core:damon-centola"], "sources": ["src:9021d6ca27", "src:91ed9b7316"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:anomie", "kind": "concept", "title": {"fa": "آنومی (بی‌هنجاری)", "en": "Anomie", "nl": "Anomie"}, "aliases": [], "parent": "soc:cohesion", "field": "soc:cohesion", "summary": {"fa": "وقتی قواعد مشترک سست می‌شوند یا میان هدف‌های تبلیغ‌شده و راه‌های مجاز رسیدن به آن‌ها شکاف می‌افتد؛ دورکیم آن را با خودکشی، مرتون با کج‌روی پیوند زد.", "en": "When shared rules loosen, or a gap opens between advertised goals and the legitimate means of reaching them; Durkheim tied it to suicide, Merton to deviance.", "nl": "Wanneer gedeelde regels verslappen, of een kloof ontstaat tussen de aangeprezen doelen en de legitieme middelen om ze te bereiken; Durkheim verbond het met zelfdoding, Merton met deviantie."}, "points": [{"text": {"fa": "دورکیم (۱۸۹۷): نرخ خودکشی واقعیتی اجتماعی است، نه جمع تصمیم‌های فردی؛ در دوره‌های تغییر تند اقتصادی (هم رونق، هم رکود) بالا می‌رود چون معیارهای «کافی» گم می‌شوند.", "en": "Durkheim (1897): the suicide rate is a social fact, not the sum of individual decisions; it rises in periods of rapid economic change (boom as much as bust) because the standards of \"enough\" are lost.", "nl": "Durkheim (1897): the suicide rate is a social fact, not the sum of individual decisions; it rises in periods of rapid economic change (boom as much as bust) because the standards of \"enough\" are lost."}, "sources": ["src:4f2939bd32"], "flags": []}, {"text": {"fa": "مرتون (۱۹۳۸): وقتی فرهنگ همه را به هدف واحدی (ثروت) می‌خواند ولی ساختار راه مشروع را برای همه باز نمی‌گذارد، پنج پاسخ پدید می‌آید: همنوایی، نوآوری (کج‌روی)، مناسک‌گرایی، انزوا، شورش.", "en": "Merton (1938): when culture calls everyone to the same goal (wealth) but structure keeps legitimate paths closed to many, five adaptations appear: conformity, innovation (deviance), ritualism, retreatism, rebellion.", "nl": "Merton (1938): when culture calls everyone to the same goal (wealth) but structure keeps legitimate paths closed to many, five adaptations appear: conformity, innovation (deviance), ritualism, retreatism, rebellion."}, "sources": ["src:b67c05b1c8"], "flags": []}], "links": [{"to": "psy:anomie", "rel": "same-as", "note": {"fa": "همین مفهوم در ویکی روان، با تأکید روانی", "en": "The same concept in the psychology wiki, with the psychological emphasis", "nl": "The same concept in the psychology wiki, with the psychological emphasis"}}, {"to": "soc:inequality-health", "rel": "see-also", "note": {"fa": "نابرابری و سلامت", "en": "Inequality and health", "nl": "Inequality and health"}}], "people": ["core:emile-durkheim", "core:robert-k-merton"], "sources": ["src:4f2939bd32", "src:b67c05b1c8"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:mobility", "kind": "concept", "title": {"fa": "تحرک بین‌نسلی", "en": "Intergenerational mobility", "nl": "Intergenerationele mobiliteit"}, "aliases": [], "parent": "soc:inequality", "field": "soc:inequality", "summary": {"fa": "چقدر درآمد و جایگاه فرزند به والدینش بسته است؟ در کشورهای اسکاندیناوی کم، در آمریکا و بریتانیا زیاد، و بر خلاف تصور، «رؤیای آمریکایی» در کانادا و دانمارک دست‌یافتنی‌تر است تا در آمریکا.", "en": "How much does a child's income and standing depend on the parents'? Little in Scandinavia, much in the US and Britain, and contrary to the myth, the \"American dream\" is more attainable in Canada and Denmark than in America.", "nl": "Hoezeer hangen inkomen en positie van een kind af van de ouders? Weinig in Scandinavië, veel in de VS en Groot-Brittannië, en anders dan de mythe wil, is de \"American dream\" beter haalbaar in Canada en Denemarken dan in Amerika."}, "points": [{"text": {"fa": "چتی و همکاران (۲۰۱۴، داده‌های مالیاتی ۴۰ میلیون نفر): تحرک در آمریکا از شهری به شهر دیگر دو تا سه برابر فرق می‌کند؛ پنج همبستهٔ قوی: تفکیک نژادی و فضایی کمتر، نابرابری کمتر، مدارس بهتر، سرمایهٔ اجتماعی بیشتر، و خانواده‌های دووالده بیشتر.", "en": "Chetty et al. (2014, tax data on 40 million people): mobility in the US varies two- to threefold between cities; five strong correlates: less racial and spatial segregation, less inequality, better schools, more social capital, and more two-parent families.", "nl": "Chetty et al. (2014, tax data on 40 million people): mobility in the US varies two- to threefold between cities; five strong correlates: less racial and spatial segregation, less inequality, better schools, more social capital, and more two-parent families."}, "sources": ["src:9570a0451f"], "flags": []}, {"text": {"fa": "«منحنی گتسبی بزرگ»: کشورهای نابرابرتر تحرک کمتری دارند؛ نابرابری نتیجه، نابرابری فرصت نسل بعد می‌شود.", "en": "The \"Great Gatsby curve\": more unequal countries have less mobility; inequality of outcome becomes the next generation's inequality of opportunity.", "nl": "The \"Great Gatsby curve\": more unequal countries have less mobility; inequality of outcome becomes the next generation's inequality of opportunity."}, "sources": ["src:9570a0451f", "src:6c0c807f94"], "flags": []}], "links": [{"to": "tabar:gwas-polygenic", "rel": "bridges", "note": {"fa": "سهم ژن و خانواده در تحصیلات", "en": "The share of genes and family in education", "nl": "The share of genes and family in education"}}, {"to": "soc:gini-inequality", "rel": "prerequisite", "note": {"fa": "اندازه‌گیری نابرابری", "en": "Measuring inequality", "nl": "Measuring inequality"}}], "people": ["core:raj-chetty"], "sources": ["src:6c0c807f94", "src:9570a0451f"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:institutions", "kind": "field", "title": {"fa": "نهادها و دولت", "en": "Institutions & the state", "nl": "Instituties & de staat"}, "aliases": [], "parent": "soc:soc", "field": null, "summary": {"fa": "قواعد بازی، فراگیر یا بهره‌کش، چگونه سرنوشت ملت‌ها را شکل می‌دهند؟", "en": "How do the rules of the game, inclusive or extractive, shape nations' fates?", "nl": "Hoe vormen de spelregels, inclusief of extractief, het lot van naties?"}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:culture-industry-false-needs", "kind": "concept", "title": {"fa": "صنعت فرهنگ و نیازهای کاذب", "en": "The culture industry and false needs", "nl": "De cultuurindustrie en valse behoeften"}, "aliases": [], "parent": "soc:values", "field": "soc:values", "summary": {"fa": "نظریه‌پردازان فرانکفورتی می‌گفتند سرمایه‌داری مدرن فقط کالا تولید نمی‌کند، فرهنگ هم تولید می‌کند. رسانه، تبلیغات، موسیقی و ورزش عمومی به نظر آن‌ها نیازهای ساختگی می‌سازند و مردم را سرگرم و آرام نگه می‌دارند. مارکوزه فناوری را هم بخشی از این سازوکار کنترل می‌دانست.", "en": "Frankfurt thinkers argued that modern capitalism produces not only goods but culture. In their view media, advertising, popular music and mass sport create manufactured needs and keep people entertained and docile. Marcuse treated technology as part of this system of control.", "nl": "Frankfurter denkers stelden dat modern kapitalisme niet alleen goederen maar ook cultuur produceert: media en reclame scheppen kunstmatige behoeften en houden mensen gedwee. Marcuse zag technologie als onderdeel van deze controle."}, "points": [{"text": {"fa": "«صنعت فرهنگ» (هورکهایمر و آدورنو، «دیالکتیک روشنگری») یعنی تولید انبوه و استاندارد فرهنگ مثل کالا. به نظر آن‌ها این فرهنگ از پیش بسته‌بندی شده، غیرخودجوش و ساختگی است و مردم را به جای بیدار کردن، ساکت و منفعل می‌کند.", "en": "The 'culture industry' (Horkheimer and Adorno, Dialectic of Enlightenment) means the mass, standardised production of culture like a commodity. They saw it as pre-packaged and inauthentic, soothing and pacifying people instead of awakening them.", "nl": "The 'culture industry' (Horkheimer and Adorno, Dialectic of Enlightenment) means the mass, standardised production of culture like a commodity. They saw it as pre-packaged and inauthentic, soothing and pacifying people instead of awakening them."}, "sources": ["src:1d8f79952a", "src:daf9fec011"], "flags": []}, {"text": {"fa": "«نیاز کاذب» (مارکوزه): نیازهایی که از بیرون و با تبلیغ و فشار اجتماعی ساخته می‌شوند، مثل ارتقای مداوم تلویزیون یا گوشی. به عقیدهٔ او وقتی کارگر و کارفرما هر دو همان برنامه و همان کالاها را مصرف می‌کنند، این فقط ظاهر برابری است و شکاف طبقاتی را پنهان می‌کند. «انسان تک‌ساحتی» (۱۹۶۴) تصویر انسانی است که جز در چارچوب مصرف نمی‌اندیشد.", "en": "'False needs' (Marcuse): needs imposed from outside through advertising and social pressure, such as endlessly upgrading a television or phone. He argued that when worker and employer consume the same programmes and goods, the similarity is only apparent equality that masks class division. One-Dimensional Man (1964) pictures a person who thinks only within the frame of consumption.", "nl": "'False needs' (Marcuse): needs imposed from outside through advertising and social pressure, such as endlessly upgrading a television or phone. He argued that when worker and employer consume the same programmes and goods, the similarity is only apparent equality that masks class division. One-Dimensional Man (1964) pictures a person who thinks only within the frame of consumption."}, "sources": ["src:1d8f79952a", "src:e080869c0c"], "flags": []}, {"text": {"fa": "به گفتهٔ سخنران، این مکتب فناوری را ابزار سرکوب می‌داند و موسیقی و فرهنگ مردم‌پسند را «مبتذل» می‌شمارد؛ به نظر او این رویکرد گاهی به تحقیر مردمی می‌انجامد که قرار است از آن‌ها دفاع شود. او از طرف دیگر تأکید می‌کند که اصل نظریه ارزشمند است و باید فقط نقاط ضعفش را نشان داد.", "en": "Per the lecturer, the school treats technology as an instrument of repression and dismisses popular music and culture as 'trashy'; he argues this can slide into contempt for the very people it claims to defend. He also stresses that the theory is valuable and only its weak spots should be pointed out.", "nl": "Per the lecturer, the school treats technology as an instrument of repression and dismisses popular music and culture as 'trashy'; he argues this can slide into contempt for the very people it claims to defend. He also stresses that the theory is valuable and only its weak spots should be pointed out."}, "sources": ["src:1d8f79952a"], "flags": ["editor-note"]}, {"text": {"fa": "نقدهای رایج به این نظریه: (۱) مخاطب را منفعل و فریب‌خورده فرض می‌کند، در حالی که مطالعات فرهنگی (مثل استوارت هال) نشان داد مردم پیام‌ها را فعالانه تفسیر می‌کنند یا در برابرشان می‌ایستند. (۲) «نیاز کاذب» مستلزم آن است که کسی بتواند نیاز «واقعی» را تعیین کند و این خطر پدرسالاری دارد. (۳) والتر بنیامین (۱۹۳۶) دربارهٔ بازتولید فنی هنر دیدگاه امیدوارانه‌تری داشت. (۴) برداشت لیبرال این است که فناوری و رسانه‌های فراگیر می‌توانند دسترسی به دانش و هنر را دموکراتیک کنند.", "en": "Common objections: (1) it assumes a passive, duped audience, whereas cultural studies (e.g. Stuart Hall) showed people interpret and resist messages actively. (2) 'False need' presupposes someone who can define 'true' needs, risking paternalism. (3) Walter Benjamin (1936) was more hopeful about technical reproduction of art. (4) The liberal view holds that technology and mass media can democratise access to knowledge and art.", "nl": "Common objections: (1) it assumes a passive, duped audience, whereas cultural studies (e.g. Stuart Hall) showed people interpret and resist messages actively. (2) 'False need' presupposes someone who can define 'true' needs, risking paternalism. (3) Walter Benjamin (1936) was more hopeful about technical reproduction of art. (4) The liberal view holds that technology and mass media can democratise access to knowledge and art."}, "sources": [], "flags": ["contested", "editor-note"]}, {"text": {"fa": "سخنران ادعا می‌کند رسانه‌های بزرگ آمریکا امروز در دست چپ است؛ این برداشتی سیاسی و مناقشه‌برانگیز است. مالکیت رسانه‌ها عمدتاً شرکتی است و پژوهش‌ها در این باره نتایج متفاوت می‌دهند، پس نمی‌توان آن را واقعیتی مسلم گرفت.", "en": "The lecturer claims major US media are today controlled by the left. This is a contested political claim; media ownership is largely corporate and empirical studies of bias give mixed results, so it cannot be taken as settled fact.", "nl": "The lecturer claims major US media are today controlled by the left. This is a contested political claim; media ownership is largely corporate and empirical studies of bias give mixed results, so it cannot be taken as settled fact."}, "sources": ["src:1d8f79952a"], "flags": ["contested", "editor-note"]}], "links": [{"to": "soc:frankfurt-critical-theory", "rel": "part-of", "note": {"fa": "بخشی از نظریهٔ انتقادی", "en": "Part of critical theory", "nl": "Part of critical theory"}}, {"to": "soc:formal-vs-substantive-rationality", "rel": "see-also", "note": {"fa": "پیوند با نقد عقلانیت ابزاری", "en": "Linked to the critique of instrumental reason", "nl": "Linked to the critique of instrumental reason"}}, {"to": "psy:narcissism-culture", "rel": "see-also", "note": {"fa": "نقد دیگر فرهنگ مصرفی", "en": "Another critique of consumer culture", "nl": "Another critique of consumer culture"}}, {"to": "soc:social-construction", "rel": "bridges", "note": {"fa": "ساختن نیازها و واقعیت به دست جامعه", "en": "Needs and reality as socially constructed", "nl": "Needs and reality as socially constructed"}}], "people": ["core:herbert-marcuse", "core:theodor-w-adorno", "core:max-horkheimer", "core:walter-benjamin"], "sources": ["src:1d8f79952a", "src:daf9fec011", "src:e080869c0c"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:parsons-pattern-variables-evolution", "kind": "concept", "title": {"fa": "متغیرهای الگویی و تکامل جوامع نزد پارسونز", "en": "Parsons's pattern variables and societal evolution", "nl": "Parsons' patroonvariabelen en maatschappelijke evolutie"}, "aliases": [], "parent": "soc:theory", "field": "soc:theory", "summary": {"fa": "پارسونز برای مقایسهٔ جامعهٔ سنتی و مدرن «متغیرهای الگویی» را پیشنهاد کرد، جفت‌هایی مثل انتساب در برابر اکتساب. در نظریهٔ تکاملی‌اش جوامع را از ساده به میانه و مدرن می‌برد و معیار پیشرفت را «تفکیک و تمایز» نهادها می‌داند. به این شرط که ارزش‌های بنیادین میان نهادهای جدا هم مشترک بماند تا انسجام حفظ شود. سخنران از این چارچوب برای نقد وضع ایران استفاده می‌کند.", "en": "To compare traditional and modern societies Parsons proposed 'pattern variables', paired alternatives such as ascription versus achievement. In his evolutionary theory societies move from simple through intermediate to modern, with institutional differentiation as the measure of progress, on condition that basic values are shared across the separated institutions so that integration holds. The lecturer uses this framework to criticise the state of Iran.", "nl": "Om traditionele en moderne samenlevingen te vergelijken stelde Parsons 'patroonvariabelen' voor, paren als toeschrijving versus prestatie. In zijn evolutietheorie gaan samenlevingen van eenvoudig via tussenvorm naar modern, met institutionele differentiatie als maatstaf voor vooruitgang, mits basiswaarden gedeeld blijven."}, "points": [{"text": {"fa": "پنج جفت متغیر الگویی به روایت سخنران، برای تمایز جهان سنت و نو: روابط شخصی در برابر غیرشخصی؛ خاص‌گرایی (معاشرت با اعضای درون‌گروه) در برابر عام‌گرایی (کار با غریبه‌ها)؛ جهت‌گیری جمعی (فدا کردن منافع فردی برای خانواده و قبیله) در برابر خویشتن‌گرایی؛ انتساب (منزلت از خانواده) در برابر اکتساب (استخدام بر پایهٔ صلاحیت و سابقه)؛ آمیختگی نقش‌ها (یک نفر هم کشاورز، هم معلم، هم نگهبان) در برابر اختصاصی‌بودن نقش‌ها.", "en": "The five pattern-variable pairs as the lecturer gives them, distinguishing traditional from modern worlds: personal versus impersonal relations; particularism (dealing with in-group members) versus universalism (dealing with strangers); collectivity-orientation (sacrificing self-interest for family and tribe) versus self-orientation; ascription (status from family) versus achievement (hiring by merit and record); diffuse roles (one person as farmer, teacher and guard) versus specific roles.", "nl": "The five pattern-variable pairs as the lecturer gives them, distinguishing traditional from modern worlds: personal versus impersonal relations; particularism (dealing with in-group members) versus universalism (dealing with strangers); collectivity-orientation (sacrificing self-interest for family and tribe) versus self-orientation; ascription (status from family) versus achievement (hiring by merit and record); diffuse roles (one person as farmer, teacher and guard) versus specific roles."}, "sources": ["src:f83c54cd83", "src:33ab816b0c"], "flags": []}, {"text": {"fa": "در نظریهٔ تکاملی، پارسونز سه مرحله می‌شمارد: جامعهٔ ساده (خرده‌نظام‌ها هنوز جدا نشده‌اند و مثلاً خانواده هم تربیت، هم آموزش، هم اقتصاد و دین را انجام می‌دهد)، جامعهٔ میانه (تفکیک تا حدی آغاز شده) و جامعهٔ مدرن (تفکیک کامل). معیار پیشرفت در این نگاه میزان تفکیک و تمایز نهادها و کارکردهای آن‌هاست.", "en": "In his evolutionary theory Parsons counts three stages: simple society (subsystems not yet separated; the family does upbringing, education, economy and religion at once), intermediate society (differentiation partly begun) and modern society (full differentiation). The measure of progress in this view is the degree of differentiation of institutions and their functions.", "nl": "In his evolutionary theory Parsons counts three stages: simple society (subsystems not yet separated; the family does upbringing, education, economy and religion at once), intermediate society (differentiation partly begun) and modern society (full differentiation). The measure of progress in this view is the degree of differentiation of institutions and their functions."}, "sources": ["src:f83c54cd83", "src:8795dccc2f", "src:b8ffe5b95f"], "flags": []}, {"text": {"fa": "فرایند تکامل از دید سخنران سه گام دارد: خرده‌نظام‌ها جدا می‌شوند؛ هر کدام کارکرد خودش را خوب انجام می‌دهد؛ و ارزش‌های بنیادین مشترکی میان آن‌ها پخش می‌شود تا انسجام پیدا کنند. اگر خانواده، مدرسه، رسانه، اقتصاد و دین ارزش‌های ناسازگار بدهند، فرد باید در هر میدان رفتار دیگری داشته باشد و این به آشفتگی می‌انجامد.", "en": "The evolutionary process in the lecturer's telling has three steps: subsystems separate; each performs its function well; and shared basic values spread across them so that they integrate. If family, school, media, economy and religion convey incompatible values, individuals must behave differently in each field, which leads to disorder.", "nl": "The evolutionary process in the lecturer's telling has three steps: subsystems separate; each performs its function well; and shared basic values spread across them so that they integrate. If family, school, media, economy and religion convey incompatible values, individuals must behave differently in each field, which leads to disorder."}, "sources": ["src:f83c54cd83", "src:8795dccc2f", "src:b8ffe5b95f"], "flags": []}, {"text": {"fa": "به گفتهٔ سخنران، جامعه‌ای که در آن یک نهاد بر نهادهای دیگر چیره است یا ارزش‌های نهادها با هم فرق دارند (مثلاً خانواده راستگویی می‌آموزد ولی بیرون دروغ و فریب رایج است) «آشفته» و در سطح میانی گیر کرده است. این کاربرد را او به ایران می‌دهد؛ خود پارسونز چنین حکمی دربارهٔ ایران نداده است.", "en": "Per the lecturer, a society where one institution dominates the others, or where institutional values clash (e.g. family teaches honesty while deceit is common outside), is 'disordered' and stuck at the intermediate level. He applies this to Iran; Parsons himself made no such judgement about Iran.", "nl": "Per the lecturer, a society where one institution dominates the others, or where institutional values clash (e.g. family teaches honesty while deceit is common outside), is 'disordered' and stuck at the intermediate level. He applies this to Iran; Parsons himself made no such judgement about Iran."}, "sources": ["src:f83c54cd83"], "flags": ["editor-note"]}, {"text": {"fa": "توضیح علمی: تکامل‌گرایی پارسونزی (کتاب‌های ۱۹۶۶ و ۱۹۷۱) معمولاً چهار سازوکار را می‌شمارد: تمایز، ارتقای انطباقی، شمول و تعمیم ارزش‌ها؛ توصیف سخنران ساده‌شده است. این نظریه را بسیاری «غرب‌محور» و غایت‌انگار می‌دانند، چون مدرنیتهٔ آمریکایی را نقطهٔ پایان می‌گذارد. نگاه‌های دیگر (مثلاً «مدرنیته‌های چندگانه») می‌گویند جوامع می‌توانند بدون یکسان‌بودن ارزش‌ها در همه‌جا مدرن و کارا باشند، و تعارض ارزش‌ها میان نهادها در همهٔ جوامع، حتی ثروتمند، دیده می‌شود. متغیرهای الگویی هم دوگانه‌های بیش از حد شسته‌رفته‌اند و سنت و مدرنیته در عمل درهم‌آمیخته‌اند.", "en": "Scholarly caveat: Parsonian evolutionism (1966, 1971 books) usually lists four mechanisms: differentiation, adaptive upgrading, inclusion and value generalisation; the lecturer's account is simplified. Many consider the theory Western-centric and teleological, since it treats American modernity as the end point. Other views (e.g. 'multiple modernities') hold that societies can be modern and effective without uniform values everywhere, and value clashes between institutions occur in all societies, including rich ones. The pattern variables are also tidy dichotomies, while tradition and modernity are mixed in practice.", "nl": "Scholarly caveat: Parsonian evolutionism (1966, 1971 books) usually lists four mechanisms: differentiation, adaptive upgrading, inclusion and value generalisation; the lecturer's account is simplified. Many consider the theory Western-centric and teleological, since it treats American modernity as the end point. Other views (e.g. 'multiple modernities') hold that societies can be modern and effective without uniform values everywhere, and value clashes between institutions occur in all societies, including rich ones. The pattern variables are also tidy dichotomies, while tradition and modernity are mixed in practice."}, "sources": ["src:8795dccc2f", "src:b8ffe5b95f"], "flags": ["contested", "editor-note"]}], "links": [{"to": "soc:parsons-social-system", "rel": "part-of", "note": {"fa": "تفکیک نهادها، بخشی از تحلیل نظام", "en": "Institutional differentiation as part of the systems analysis", "nl": "Institutional differentiation as part of the systems analysis"}}, {"to": "soc:value-change", "rel": "see-also", "note": {"fa": "تغییر ارزش‌ها و مدرنیزاسیون", "en": "Value change and modernisation", "nl": "Value change and modernisation"}}, {"to": "soc:institutions", "rel": "see-also", "note": {"fa": "نهادها و دولت", "en": "Institutions and the state", "nl": "Institutions and the state"}}, {"to": "soc:demographic-transition", "rel": "see-also", "note": {"fa": "گذار جمعیتی در برابر مراحل تکامل", "en": "Demographic transition compared with evolutionary stages", "nl": "Demographic transition compared with evolutionary stages"}}], "people": ["core:talcott-parsons", "core:bronis-aw-malinowski", "core:pitirim-sorokin"], "sources": ["src:33ab816b0c", "src:8795dccc2f", "src:b8ffe5b95f", "src:f83c54cd83"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:culture-roles-social-control", "kind": "concept", "title": {"fa": "فرهنگ، نقش اجتماعی، هویت و کنترل اجتماعی", "en": "Culture, social roles, identity and social control", "nl": "Cultuur, sociale rollen, identiteit en sociale controle"}, "aliases": [], "parent": "soc:values", "field": "soc:values", "summary": {"fa": "فرهنگ هم دنیای ذهنی ارزش‌ها و باورهاست و هم دنیای اشیایی که آن‌ها را نشان می‌دهند. این جلسه نشان می‌دهد فرهنگ چگونه برای ما «مسیر زندگی» و نقش‌های آماده می‌سازد، هویت اجتماعی ما را شکل می‌دهد و با سازوکارهایی مثل غیبت، برچسب و طرد از آن نگهبانی می‌کند. نگاه سخنران این است که حتی افتخارها و احساس «خودِ من» هم ریشهٔ اجتماعی دارند.", "en": "Culture has an inner world of values and beliefs and an outer world of objects that express them. The lecture shows how culture lays out a ready-made life path and roles, shapes social identity, and is guarded by gossip, labelling and exclusion. The lecturer's stance is that even our pride and our sense of a personal self have social roots.", "nl": "Cultuur heeft een innerlijke kant (waarden, overtuigingen) en een materiële kant (voorwerpen). Ze bepaalt levenspaden, rollen en identiteit en wordt bewaakt door roddel, stigma en uitsluiting."}, "points": [{"text": {"fa": "به گفتهٔ سخنران، فرهنگ دو بخش دارد: بخش ذهنی (ارزش‌ها، باورها، تصویرها و آیین‌ها) و بخش مادی (اشیا و ساخته‌هایی که این‌ها را نمایش می‌دهند، مثل عبادتگاه یا مهر نماز). هر ارزشی ضدارزشی هم دارد و هر آیینی مقدس یا نامقدس شمرده می‌شود.", "en": "Per the lecturer, culture has a mental part (values, beliefs, images, rituals) and a material part (objects that display them, such as a place of worship). Every value comes with a counter-value, and rituals are sorted into sacred and profane.", "nl": "Per the lecturer, culture has a mental part (values, beliefs, images, rituals) and a material part (objects that display them, such as a place of worship). Every value comes with a counter-value, and rituals are sorted into sacred and profane."}, "sources": ["src:d50f6ac9b8"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، فرهنگ برای هر کس «زندگی‌نامهٔ فرهنگی» می‌نویسد: مدرسه، دانشگاه، خدمت سربازی، ازدواج، فرزند، نوه. کسی که از این مسیر بیرون می‌رود ناقص به نظر می‌آید و دیگران با سؤال و زمزمه او را برمی‌گردانند. فرهنگ خود را «طبیعی» و «مقدس» معرفی می‌کند؛ مثلاً رنج مادری را مقدس می‌شمارد تا زنان نقش مادر را بپذیرند، و فرزندان با احساس بدهکاری بزرگ می‌شوند.", "en": "Per the lecturer, culture writes a 'cultural biography' for everyone: school, university, military service, marriage, children, grandchildren. People who step off it look incomplete and others nudge them back with questions and whispers. Culture presents itself as natural and sacred; for example it sanctifies a mother's suffering so that women accept the role, and children grow up with a sense of debt.", "nl": "Per the lecturer, culture writes a 'cultural biography' for everyone: school, university, military service, marriage, children, grandchildren. People who step off it look incomplete and others nudge them back with questions and whispers. Culture presents itself as natural and sacred; for example it sanctifies a mother's suffering so that women accept the role, and children grow up with a sense of debt."}, "sources": ["src:d50f6ac9b8"], "flags": ["editor-note"]}, {"text": {"fa": "نقش اجتماعی یعنی انتظاری که دیگران از کسی در یک جایگاه دارند (مادر، معلم، پزشک). هویت اجتماعی پاسخ به «من کیستم؟» است، مثلاً آنچه در عکس نمایه نشان می‌دهیم. به گفتهٔ سخنران، هویتِ کاملاً شخصی و ناب وجود ندارد، چون هر چه به آن افتخار می‌کنیم (شجاعت، خانواده‌دوستی) ارزشی است که جامعه در تاریخ پذیرفته است.", "en": "A social role is what others expect of someone in a given position (mother, teacher, doctor). Social identity is the answer to 'who am I?', for instance what we show in a profile picture. Per the lecturer, a purely personal identity does not exist, because whatever we take pride in (courage, loyalty to family) is a value that society has historically accepted.", "nl": "A social role is what others expect of someone in a given position (mother, teacher, doctor). Social identity is the answer to 'who am I?', for instance what we show in a profile picture. Per the lecturer, a purely personal identity does not exist, because whatever we take pride in (courage, loyalty to family) is a value that society has historically accepted."}, "sources": ["src:d50f6ac9b8"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، جامعه سه مرحله برای کنترل رفتار دارد که به‌ترتیب تندتر می‌شوند: اول غیبت و زمزمه دربارهٔ فرد؛ بعد صدور برچسب جمعی (انگ) وقتی گروه به نتیجهٔ مشترک برسد؛ و در پایان طرد اجتماعی. او حرم/«خرم» یهودی را نمونه‌ای از طرد شدید می‌داند. این‌ها شکل‌های ابتدایی کنترل‌اند و بعدها به قانون و جرم تبدیل می‌شوند.", "en": "Per the lecturer, society controls behaviour in three escalating steps: first gossip and whispering about the person; then a collective label (stigma) once the group agrees; finally social exclusion. He gives the Jewish herem as an example of severe exclusion. These are primitive forms of control that later turn into law and crime.", "nl": "Per the lecturer, society controls behaviour in three escalating steps: first gossip and whispering about the person; then a collective label (stigma) once the group agrees; finally social exclusion. He gives the Jewish herem as an example of severe exclusion. These are primitive forms of control that later turn into law and crime."}, "sources": ["src:d50f6ac9b8"], "flags": ["editor-note"]}, {"text": {"fa": "توضیح علمی تکمیلی: گروه‌های نمادین-کنش‌متقابل این‌که «خود» در آینهٔ نگاه دیگران ساخته می‌شود را از کولی و مید می‌گیرند، نه از وبر. ایدهٔ «خود واقعی/اصیل» هم فقط یک موضع است و در روان‌شناسی و فلسفه هنوز محل بحث است. همچنین این ادعا که انسان تنها جانداری است که رنج می‌کشد پذیرفته نیست؛ شواهد علمی نشان می‌دهد بسیاری از حیوانات درد و پریشانی را تجربه می‌کنند.", "en": "Editor's caveat: the idea that the self is formed in the mirror of others' views comes from Cooley and Mead (symbolic interactionism), not from Weber. The notion of an authentic 'real self' is only one position and is still debated in psychology and philosophy. The claim that only humans suffer is not accepted; evidence indicates many animals experience pain and distress.", "nl": "Editor's caveat: the idea that the self is formed in the mirror of others' views comes from Cooley and Mead (symbolic interactionism), not from Weber. The notion of an authentic 'real self' is only one position and is still debated in psychology and philosophy. The claim that only humans suffer is not accepted; evidence indicates many animals experience pain and distress."}, "sources": ["src:86ed18a6d5", "src:8728add9be"], "flags": ["contested", "editor-note"]}], "links": [{"to": "soc:presentation-of-self", "rel": "see-also", "note": {"fa": "نمایش خود و هویت اجتماعی در زندگی روزمره", "en": "Self-presentation and social identity in everyday life", "nl": "Self-presentation and social identity in everyday life"}}, {"to": "psy:stigma", "rel": "explains", "note": {"fa": "انگ به‌عنوان مرحلهٔ دوم کنترل اجتماعی", "en": "Stigma as the second stage of social control", "nl": "Stigma as the second stage of social control"}}, {"to": "soc:social-construction", "rel": "part-of", "note": {"fa": "بخشی از ساخت اجتماعی واقعیت", "en": "Part of the social construction of reality", "nl": "Part of the social construction of reality"}}, {"to": "soc:cultural-lag", "rel": "see-also", "note": {"fa": "ناهماهنگی بخش مادی و ذهنی فرهنگ", "en": "Mismatch between material and non-material culture", "nl": "Mismatch between material and non-material culture"}}], "people": ["core:charles-horton-cooley", "core:george-herbert-mead", "core:ralph-linton", "core:erving-goffman"], "sources": ["src:86ed18a6d5", "src:8728add9be", "src:d50f6ac9b8"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:social-construction", "kind": "concept", "title": {"fa": "ساخت اجتماعی واقعیت", "en": "The social construction of reality", "nl": "De sociale constructie van de werkelijkheid"}, "aliases": [], "parent": "soc:theory", "field": "soc:theory", "summary": {"fa": "پول، ازدواج، مرز، «نوجوانی»: چیزهایی که فقط چون همه باور دارند وجود دارند و با این حال کاملاً واقعی‌اند. ساخت اجتماعی یعنی «ساخته‌شده»، نه «خیالی».", "en": "Money, marriage, borders, \"adolescence\": things that exist only because everyone believes in them, and are nonetheless entirely real. Socially constructed means \"made\", not \"imaginary\".", "nl": "Geld, huwelijk, grenzen, \"adolescentie\": dingen die alleen bestaan omdat iedereen erin gelooft, en toch volkomen echt zijn. Sociaal geconstrueerd betekent \"gemaakt\", niet \"ingebeeld\"."}, "points": [{"text": {"fa": "برگر و لاکمن (۱۹۶۶): واقعیت اجتماعی در سه حرکت ساخته می‌شود: برونی‌سازی (آدم‌ها عادت می‌سازند)، عینیت‌یافتگی (عادت به نهاد تبدیل می‌شود و «همیشه همین‌طور بوده») و درونی‌سازی (نسل بعد آن را طبیعی می‌بیند).", "en": "Berger and Luckmann (1966): social reality is built in three moves: externalisation (people make habits), objectivation (the habit becomes an institution that \"was always so\") and internalisation (the next generation sees it as natural).", "nl": "Berger and Luckmann (1966): social reality is built in three moves: externalisation (people make habits), objectivation (the habit becomes an institution that \"was always so\") and internalisation (the next generation sees it as natural)."}, "sources": ["src:f5c4df1661"], "flags": []}, {"text": {"fa": "هکینگ (۱۹۹۹): گفتن «X ساخت اجتماعی است» وقتی معنادار است که X اجتناب‌ناپذیر فرض شده باشد؛ و بعضی ساخته‌ها «نوع‌های تعاملی»اند: برچسب، رفتار برچسب‌خورده را عوض می‌کند (اثر حلقه‌ای).", "en": "Hacking (1999): saying \"X is socially constructed\" is meaningful when X was assumed inevitable; and some constructs are \"interactive kinds\": the label changes the behaviour of the labelled (the looping effect).", "nl": "Hacking (1999): saying \"X is socially constructed\" is meaningful when X was assumed inevitable; and some constructs are \"interactive kinds\": the label changes the behaviour of the labelled (the looping effect)."}, "sources": ["src:2e8dc6a169"], "flags": []}], "links": [{"to": "psy:dx", "rel": "bridges", "note": {"fa": "تشخیص روان‌پزشکی به‌عنوان نوع تعاملی", "en": "Psychiatric diagnosis as an interactive kind", "nl": "Psychiatric diagnosis as an interactive kind"}}, {"to": "tabar:race-biology", "rel": "bridges", "note": {"fa": "نژاد: ساخت اجتماعی با پیامد واقعی", "en": "Race: a social construct with real consequences", "nl": "Race: a social construct with real consequences"}}], "people": [], "sources": ["src:2e8dc6a169", "src:f5c4df1661"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:functionalism-needs", "kind": "concept", "title": {"fa": "کارکردگرایی: هر نهاد به نیازی پاسخ می‌دهد", "en": "Functionalism: every institution answers a need", "nl": "Functionalisme: elk instituut beantwoordt een behoefte"}, "aliases": [], "parent": "soc:theory", "field": "soc:theory", "summary": {"fa": "کارکردگرایی جامعه را مثل یک پیکر زنده می‌بیند که بخش‌هایش با هم برای ثبات و بقای کل کار می‌کنند. پرسش آن دربارهٔ هر پدیده این است که چه نیازی را برآورده می‌کند. دورکیم و مالینوفسکی دو چهرهٔ اصلی این رویکردند. این نگاه معمولاً محتاط است، چون تغییر در یک بخش بخش‌های دیگر را هم تکان می‌دهد؛ منتقدان آن را محافظه‌کار و ناتوان در توضیح تعارض و تغییر می‌دانند.", "en": "Functionalism sees society as a living body whose parts work together for the stability and survival of the whole. For any phenomenon it asks which need it meets. Durkheim and Malinowski are its main figures. The approach tends toward caution, since change in one part ripples through the others; critics call it conservative and weak at explaining conflict and change.", "nl": "Het functionalisme ziet de samenleving als een levend geheel waarvan de delen samenwerken voor stabiliteit. Bij elk verschijnsel vraagt het welke behoefte het vervult. Critici noemen het conservatief en zwak in het verklaren van conflict en verandering."}, "points": [{"text": {"fa": "در این نگاه جامعه مثل ارگانیسم است و هر بخش آن کارکردی در بقای کل دارد. پس تحلیل‌گر نخست می‌پرسد این پدیده چه نیازی را پاسخ می‌دهد، و فقط پس از فهم آن سراغ نقد می‌رود. نقد کارکردی یعنی نشان دادن این‌که یک نهاد کارکرد خود را از دست داده و چیز دیگری جای آن را گرفته است.", "en": "Here society is like an organism and each part has a function for the survival of the whole. So the analyst first asks which need a phenomenon meets, and criticises only after understanding. Functional critique means showing that an institution has lost its function and something else has taken its place.", "nl": "Here society is like an organism and each part has a function for the survival of the whole. So the analyst first asks which need a phenomenon meets, and criticises only after understanding. Functional critique means showing that an institution has lost its function and something else has taken its place."}, "sources": ["src:358e9ed202", "src:7726f14048"], "flags": []}, {"text": {"fa": "مالینوفسکی تأکید می‌کرد هیچ اختراع یا تغییر اجتماعی بدون پدید آمدن نیازهای تازه رخ نمی‌دهد و هر فناوری یا ایدهٔ نو باید درون یک نهاد جا بیفتد تا دوام بیاورد. سخنران از این نتیجه می‌گیرد که تغییر فرهنگی یعنی تغییر نهادی.", "en": "Malinowski stressed that no invention or social change happens without new needs, and any new technique or idea must be absorbed into an institution to last. The lecturer concludes that cultural change is institutional change.", "nl": "Malinowski stressed that no invention or social change happens without new needs, and any new technique or idea must be absorbed into an institution to last. The lecturer concludes that cultural change is institutional change."}, "sources": ["src:358e9ed202", "src:7726f14048"], "flags": []}, {"text": {"fa": "دورکیم جرم را تا نرخ معینی پدیده‌ای عادی می‌دانست و می‌گفت جامعه از آن می‌تواند ضعف قوانین و واکنش وجدان جمعی را بشناسد. او قانون را دو نوع می‌دید: قانون تنبیهی که بیشتر در جوامع سنتی است و قانون ترمیمی که در جوامع مدرن غالب می‌شود و به جبران و اصلاح روابط می‌پردازد.", "en": "Durkheim held crime to be normal up to a certain rate and useful for a society to spot weak laws and the reaction of the collective conscience. He distinguished repressive (punitive) law, more typical of traditional societies, from restitutive law, which dominates in modern societies and aims at repair.", "nl": "Durkheim held crime to be normal up to a certain rate and useful for a society to spot weak laws and the reaction of the collective conscience. He distinguished repressive (punitive) law, more typical of traditional societies, from restitutive law, which dominates in modern societies and aims at repair."}, "sources": ["src:358e9ed202", "src:8b2df1e0b2", "src:68f3ac9016"], "flags": []}, {"text": {"fa": "به گفتهٔ سخنران، از این نگاه نتیجه می‌شود که دولت نباید با شتاب در بازار و قانون و عرف دست ببرد؛ قانون باید با عرف هماهنگ بماند؛ و نیاز سرکوب‌شده از میان نمی‌رود و به شکل دیگری، مثلاً آسیب‌های پیوسته به هم، بازمی‌گردد. او مثال‌هایی از مهاجرت، اعتیاد و سیاست‌های کشاورزی می‌آورد و می‌گوید باید برای مصرف‌های کم‌خطر جا گذاشت. این‌ها برداشت و مثال‌های خود سخنران است، نه نتیجهٔ اجماع پژوهشی.", "en": "Per the lecturer, this view implies the state should not rush to intervene in markets, law or custom; law should stay in step with custom; and a suppressed need does not vanish but resurfaces in other forms, such as linked social harms. He gives examples from migration, addiction and agricultural policy and argues for leaving room for low-risk substance use. These are the lecturer's readings and examples, not research consensus.", "nl": "Per the lecturer, this view implies the state should not rush to intervene in markets, law or custom; law should stay in step with custom; and a suppressed need does not vanish but resurfaces in other forms, such as linked social harms. He gives examples from migration, addiction and agricultural policy and argues for leaving room for low-risk substance use. These are the lecturer's readings and examples, not research consensus."}, "sources": ["src:358e9ed202"], "flags": ["editor-note"]}, {"text": {"fa": "نکتهٔ احتیاط و دیدگاه مخالف: منتقدان می‌گویند توضیح «برای فلان نیاز وجود دارد» اغلب غایت‌گرایانه است و ثابت‌شدنی نیست، و این‌که نهاد برای چه کسی کارکرد دارد را پنهان می‌کند. نظریهٔ تضاد (پیرو مارکس) نهادها را میدان منافع و سلطهٔ گروه‌ها می‌بیند و تغییر و نابرابری را بهتر توضیح می‌دهد. مرتن میان کارکرد آشکار و پنهان فرق گذاشت تا کارکردگرایی را دقیق‌تر کند. ادعای سخنران دربارهٔ ممنوعیت الکل در آمریکا هم ساده‌شده است: مصرف در آغاز کاهش یافت و بعد تا حدی بازگشت، و رشد جرم سازمان‌یافته از پیامدهای روشن‌تر آن بود.", "en": "Caveat and opposing view: critics say 'it exists to meet need X' is often teleological and unprovable, and hides for whom an institution functions. Conflict theory (following Marx) sees institutions as arenas of interest and domination and explains change and inequality better. Merton distinguished manifest from latent functions to sharpen functionalism. The lecturer's remark on US Prohibition is also simplified: consumption fell at first and then partly recovered, and the growth of organised crime is the clearer consequence.", "nl": "Caveat and opposing view: critics say 'it exists to meet need X' is often teleological and unprovable, and hides for whom an institution functions. Conflict theory (following Marx) sees institutions as arenas of interest and domination and explains change and inequality better. Merton distinguished manifest from latent functions to sharpen functionalism. The lecturer's remark on US Prohibition is also simplified: consumption fell at first and then partly recovered, and the growth of organised crime is the clearer consequence."}, "sources": ["src:920332b9a8"], "flags": ["contested", "editor-note"]}], "links": [{"to": "soc:institutions", "rel": "explains", "note": {"fa": "پرسش اصلی کارکردگرایی دربارهٔ نهادهاست", "en": "Functionalism's central question concerns institutions", "nl": "Functionalism's central question concerns institutions"}}, {"to": "soc:anomie", "rel": "see-also", "note": {"fa": "دورکیم بی‌هنجاری را نشانهٔ بدکارکردی می‌دید", "en": "Durkheim read anomie as a sign of dysfunction", "nl": "Durkheim read anomie as a sign of dysfunction"}}, {"to": "soc:durkheim-religion-society", "rel": "see-also", "note": {"fa": "تحلیل دین نمونهٔ روش کارکردی است", "en": "The analysis of religion exemplifies the functional method", "nl": "The analysis of religion exemplifies the functional method"}}, {"to": "soc:theory", "rel": "part-of", "note": {"fa": "یکی از رویکردهای بزرگ نظریهٔ اجتماعی", "en": "One of the major approaches in social theory", "nl": "One of the major approaches in social theory"}}], "people": ["core:mile-durkheim", "core:bronis-aw-malinowski", "core:robert-k-merton"], "sources": ["src:358e9ed202", "src:68f3ac9016", "src:7726f14048", "src:8b2df1e0b2", "src:920332b9a8"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:enlightenment-break", "kind": "concept", "title": {"fa": "از حکمت مدرسی تا روشنگری: زمینهٔ تاریخی نظریهٔ اجتماعی", "en": "From scholasticism to the Enlightenment: the backdrop of social theory", "nl": "Van scholastiek naar Verlichting: de achtergrond van de sociale theorie"}, "aliases": [], "parent": "soc:theory", "field": "soc:theory", "summary": {"fa": "نظریهٔ اجتماعی مدرن در پاسخ به جهانی پدید آمد که در آن پرسش از اصول دیگر ممنوع نبود. این مدخل خلاصهٔ تصویری است که یک سخنرانی درسی از گذار «حکمت مدرسی» (اسکولاستیک، سدهٔ یازدهم تا پانزدهم) به روشنگری می‌دهد؛ تصویری ساده‌شده که نکته‌های تاریخ‌نگارانه‌اش پایین آمده است.", "en": "Modern social theory arose in a world where questioning first principles was no longer forbidden. This entry summarises the picture a lecture course gives of the passage from \"scholasticism\" (11th–15th centuries) to the Enlightenment; it is a simplified picture, and the historians' caveats are listed below.", "nl": "Moderne sociale theorie ontstond in een wereld waarin vragen naar eerste beginselen niet langer verboden was. Dit lemma vat het beeld samen dat een collegereeks schetst van de overgang van \"scholastiek\" (11e–15e eeuw) naar de Verlichting; het is een vereenvoudigd beeld, de kanttekeningen van historici staan hieronder."}, "points": [{"text": {"fa": "سخنران چهار ویژگی را برای حکمت مدرسی می‌شمارد: پژوهش برای استوارکردن اصول دین نه کشف تازه؛ پیشی ایمان بر عقل؛ نبود استقلال فکری و آزادی رأی در برابر گفتمان غالب؛ و رونق مناظره بر سر مسائل جزئی دینی. مثال‌هایش: بحث دربارهٔ تعداد فرشته‌ها بر سر یک سوزن و شمار دندان‌های اسب.", "en": "The lecturer lists four features of scholastic thought: research to secure doctrine rather than find new things; faith ahead of reason; no intellectual independence against the dominant discourse; and lively debate over small doctrinal questions. His examples: how many angels fit on a needle-point, and how many teeth a horse has.", "nl": "The lecturer lists four features of scholastic thought: research to secure doctrine rather than find new things; faith ahead of reason; no intellectual independence against the dominant discourse; and lively debate over small doctrinal questions. His examples: how many angels fit on a needle-point, and how many teeth a horse has."}, "sources": ["src:c97a389f84"], "flags": ["editor-note"]}, {"text": {"fa": "نکتهٔ تاریخ‌نگارانه: این تصویر کاریکاتوری است. اسکولاستیک‌ها (مثل توماس آکویناس) ایمان و عقل را همکار می‌دانستند و دانشگاه‌ها و منطق مدرن بخشی از میراث همین دوره‌اند. داستان «فرشته‌ها و سوزن» و «دندان‌های اسب» هم روایت‌های بعدی و بی‌منبع محکم‌اند، نه گزارش مناظرات واقعی.", "en": "Historiographical caveat: this picture is a caricature. Scholastics such as Thomas Aquinas saw faith and reason as partners, and universities and formal logic are part of that era's legacy. The \"angels on a needle\" and \"horse's teeth\" tales are later, poorly sourced stories, not reports of real debates.", "nl": "Historiographical caveat: this picture is a caricature. Scholastics such as Thomas Aquinas saw faith and reason as partners, and universities and formal logic are part of that era's legacy. The \"angels on a needle\" and \"horse's teeth\" tales are later, poorly sourced stories, not reports of real debates."}, "sources": [], "flags": ["contested", "editor-note"]}, {"text": {"fa": "چهار عامل «ترک» در گفتمان پیشین به گفتهٔ سخنران: فتح قسطنطنیه و کوچ دانشمندان یونانی، اختراع چاپ، کشف آمریکا و مهاجرت پروتستان‌ها، و کشفیات علمی (کوپرنیک، کپلر، گالیله). او تأکید می‌کند گسست فکری هیچ‌وقت در یک سال مشخص رخ نمی‌دهد و با شکست‌های کوچک آغاز می‌شود.", "en": "Four causes of \"cracks\" in the old discourse, per the lecturer: the fall of Constantinople and the migration of Greek scholars, the invention of printing, the discovery of America and Protestant emigration, and scientific discoveries (Copernicus, Kepler, Galileo). He stresses that an intellectual break never happens in one year but begins with small failures.", "nl": "Four causes of \"cracks\" in the old discourse, per the lecturer: the fall of Constantinople and the migration of Greek scholars, the invention of printing, the discovery of America and Protestant emigration, and scientific discoveries (Copernicus, Kepler, Galileo). He stresses that an intellectual break never happens in one year but begins with small failures."}, "sources": ["src:c97a389f84"], "flags": ["contested"]}, {"text": {"fa": "نکتهٔ تاریخ‌نگارانه: اثر کوچ دانشمندان یونانی پس از ۱۴۵۳ را بسیاری از مورخان اغراق‌شده می‌دانند، چون انتقال متون یونانی به ایتالیا پیش‌تر آغاز شده بود. گالیله در ۱۶۳۳ در دادگاه کلیسا مجبور به انکار نظر خود شد و تا پایان عمر در حبس خانگی ماند؛ «سوزاندن» او روایت ساده‌شده است.", "en": "Historiographical caveat: many historians think the effect of Greek scholars' migration after 1453 is overstated, since the transfer of Greek texts to Italy had begun earlier. Galileo was forced to recant by a Church court in 1633 and spent the rest of his life under house arrest; \"burning\" him is a simplified retelling.", "nl": "Historiographical caveat: many historians think the effect of Greek scholars' migration after 1453 is overstated, since the transfer of Greek texts to Italy had begun earlier. Galileo was forced to recant by a Church court in 1633 and spent the rest of his life under house arrest; \"burning\" him is a simplified retelling."}, "sources": [], "flags": ["contested", "editor-note"]}, {"text": {"fa": "کانت (۱۷۸۴): روشنگری «بیرون آمدن انسان از نابالغیِ خودخواسته» است: جرئت کردن به استفاده از فهم خود بی‌هدایت دیگری. سخنران این متن را اعلام آغاز عصری می‌خواند که انقلاب‌های سیاسی و صنعتی را در پی آورد. وبر (۱۹۰۵) نقش اخلاق پروتستانی در سرمایه‌داری را نشان می‌دهد؛ این تز شواهد مختلط دارد.", "en": "Kant (1784): Enlightenment is \"man's emergence from his self-incurred immaturity\": daring to use one's own understanding without another's guidance. The lecturer reads this text as the start of an age that brought political and industrial revolutions. Weber (1905) shows the role of the Protestant ethic in capitalism; that thesis has mixed evidence.", "nl": "Kant (1784): Enlightenment is \"man's emergence from his self-incurred immaturity\": daring to use one's own understanding without another's guidance. The lecturer reads this text as the start of an age that brought political and industrial revolutions. Weber (1905) shows the role of the Protestant ethic in capitalism; that thesis has mixed evidence."}, "sources": ["src:079f5798c4", "src:44db2d1cb1", "src:c97a389f84"], "flags": []}, {"text": {"fa": "منبع خواندنی که سخنران برای فهم این دوره معرفی می‌کند: «سیر حکمت در اروپا» از محمدعلی فروغی، به‌ویژه فصل حکمت اسکولاستیک.", "en": "Reading the lecturer recommends for this period: Mohammad-Ali Foroughi's \"Seyr-e Hekmat dar Orupa\" (The course of philosophy in Europe), especially the chapter on scholastic philosophy.", "nl": "Reading the lecturer recommends for this period: Mohammad-Ali Foroughi's \"Seyr-e Hekmat dar Orupa\" (The course of philosophy in Europe), especially the chapter on scholastic philosophy."}, "sources": ["src:1274113306"], "flags": []}], "links": [{"to": "soc:protestant-ethic", "rel": "explains", "note": {"fa": "وبر و اخلاق پروتستانی", "en": "Weber and the Protestant ethic", "nl": "Weber and the Protestant ethic"}}, {"to": "soc:secularization", "rel": "see-also", "note": {"fa": "سکولار شدن", "en": "Secularization", "nl": "Secularization"}}, {"to": "phil:epistemology", "rel": "see-also", "note": {"fa": "دانستن و باور موجه", "en": "Knowledge and justified belief", "nl": "Knowledge and justified belief"}}], "people": ["core:max-weber", "core:kant"], "sources": ["src:079f5798c4", "src:1274113306", "src:44db2d1cb1", "src:c97a389f84"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:marx-religion-alienation", "kind": "concept", "title": {"fa": "مارکس و دین: «آه موجود ستمدیده» و ریشهٔ از‌خودبیگانگی", "en": "Marx on religion: the sigh of the oppressed and the root of alienation", "nl": "Marx over religie: de zucht van de onderdrukte en de wortel van vervreemding"}, "aliases": [], "parent": "soc:values", "field": "soc:values", "summary": {"fa": "در آلمان قرن نوزدهم دولت پروس خود را با دین پیوند زده بود، پس نقد دین عملاً نقدی سیاسی بود. فوئرباخ دین را عامل از‌خودبیگانگی می‌دانست، اما مارکس گفت ریشهٔ بیگانگی در مالکیت و شیوهٔ تولید است و دین نشانهٔ رنج واقعی است. به همین دلیل نگاه مارکس به دین بیشتر جامعه‌شناختی است تا صرفاً ضددینی.", "en": "In nineteenth-century Germany the Prussian state tied itself to religion, so criticising religion was in effect political criticism. Feuerbach held religion to be the cause of alienation; Marx replied that the root lies in property and the mode of production, and religion is a sign of real suffering. His view is therefore more sociological than simply anti-religious.", "nl": "In het Duitsland van de 19e eeuw was religie met de staat verweven, dus religiekritiek was politieke kritiek. Marx zag religie als symptoom van reëel lijden, met de wortel van vervreemding in eigendom en productie."}, "points": [{"text": {"fa": "به گفتهٔ سخنران، در پروس سلطنت خود را با دیانت و کلیسا تعریف می‌کرد؛ برای همین فیلسوفان آلمانی (کانت، هگل، شلینگ، فوئرباخ) بسیار دربارهٔ دین می‌نوشتند و نقد مسیحیت عملاً پایه‌های معرفتی سلطنت را سست می‌کرد. او یادآور می‌شود که هگل، شلینگ و هلدرلین هم‌اتاق و دانشجوی الهیات بودند.", "en": "Per the lecturer, in Prussia the monar
