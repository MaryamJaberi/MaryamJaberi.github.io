ران چپ آلمانی بود که از دههٔ ۱۹۲۰ می‌خواستند مارکس را برای جهان تازه بازخوانی کنند. آن‌ها دیدند طبقهٔ کارگر در اروپا به انقلاب نرفته و فاشیسم رشد کرده است، پس فقط اقتصاد برای توضیح کافی نیست. سه نقد اصلی داشتند: به جبرگرایی مارکسیستی، به اثبات‌گرایی و به جامعه‌شناسی‌ای که وضع موجود را می‌پذیرد.", "en": "The Frankfurt School was a circle of German left-wing thinkers who, from the 1920s, set out to re-read Marx for a changed world. The expected workers' revolution had not come and fascism was rising, so economics alone seemed insufficient. Their three main criticisms targeted Marxist determinism, positivism, and a mainstream sociology that accepts the status quo.", "nl": "De Frankfurter Schule was een kring van Duitse linkse denkers die Marx sinds de jaren twintig opnieuw wilde lezen voor een veranderde wereld. Ze richtten kritiek op deterministisch marxisme, positivisme en een sociologie die de bestaande orde aanvaardt."}, "points": [{"text": {"fa": "پس از مرگ مارکس، انقلاب‌های کارگری در اروپا شکست خورد، فاشیسم و نازیسم رشد کرد و سرمایه‌داری فرو نریخت. بخشی از مارکسیست‌ها (مثل لوکاچ در «تاریخ و آگاهی طبقاتی»، ۱۹۲۳) نتیجه گرفتند که باید بر ذهن، آگاهی و فرهنگ هم تکیه کرد، نه فقط بر اقتصاد. این جریان را «مارکسیسم غربی» یا نئومارکسیسم می‌نامند.", "en": "After Marx's death the workers' revolutions in Europe failed, fascism grew, and capitalism did not collapse. Some Marxists (Lukács in History and Class Consciousness, 1923) concluded that consciousness and culture matter as much as the economy. This current is called Western Marxism or neo-Marxism.", "nl": "After Marx's death the workers' revolutions in Europe failed, fascism grew, and capitalism did not collapse. Some Marxists (Lukács in History and Class Consciousness, 1923) concluded that consciousness and culture matter as much as the economy. This current is called Western Marxism or neo-Marxism."}, "sources": ["src:1d8f79952a", "src:810b9364fb"], "flags": []}, {"text": {"fa": "«مؤسسهٔ پژوهش اجتماعی» در دانشگاه فرانکفورت در ۱۹۲۳ با پشتیبانی مالی فلیکس وایل تأسیس شد. هورکهایمر، آدورنو، فروم، مارکوزه و بنیامین در کنار هم کار می‌کردند؛ با روی کار آمدن نازی‌ها بیشترشان که یهودی‌تبار بودند به تبعید رفتند.", "en": "The Institute for Social Research was founded at Frankfurt University in 1923 with funding from Felix Weil. Horkheimer, Adorno, Fromm, Marcuse and Benjamin worked in its orbit; most were of Jewish descent and went into exile when the Nazis took power.", "nl": "The Institute for Social Research was founded at Frankfurt University in 1923 with funding from Felix Weil. Horkheimer, Adorno, Fromm, Marcuse and Benjamin worked in its orbit; most were of Jewish descent and went into exile when the Nazis took power."}, "sources": ["src:1d8f79952a", "src:0bb2637044", "src:f230d7b5d2"], "flags": []}, {"text": {"fa": "سه نقد اصلی: (۱) جبرگرایی: اگر تاریخ خودکار به سوی سرمایه‌داری‌ستیزی می‌رود، جایی برای کنش انسان نمی‌ماند، و عوامل غیراقتصادی نادیده گرفته می‌شوند. (۲) اثبات‌گرایی: علم را بی‌طرف می‌داند و همهٔ پدیده‌ها را به عدد تبدیل می‌کند، در حالی که علوم اجتماعی با انسان و ارزش‌ها سروکار دارد. (۳) جامعه‌شناسی رایج: به گفتهٔ آن‌ها با تکیه بر آمار و ساختارهای کلی، رنج و تجربهٔ آدم‌ها را از دید پنهان می‌کند و تغییر جهان را رها می‌کند. آدورنو حتی از پیش‌بینی «بهشت پایانی» پرهیز داشت و تنها نقد مداوم را پذیرفت.", "en": "Three main criticisms: (1) Determinism: if history automatically heads toward the end of capitalism there is no room for human action and non-economic factors are ignored. (2) Positivism: it treats science as value-neutral and turns phenomena into numbers, though social science deals with people and values. (3) Mainstream sociology: by relying on statistics and big structures it hides lived suffering and gives up on changing the world. Adorno also refused to predict a final utopia and accepted only continuous critique.", "nl": "Three main criticisms: (1) Determinism: if history automatically heads toward the end of capitalism there is no room for human action and non-economic factors are ignored. (2) Positivism: it treats science as value-neutral and turns phenomena into numbers, though social science deals with people and values. (3) Mainstream sociology: by relying on statistics and big structures it hides lived suffering and gives up on changing the world. Adorno also refused to predict a final utopia and accepted only continuous critique."}, "sources": ["src:1d8f79952a", "src:8b4be4363d", "src:277be0423a"], "flags": []}, {"text": {"fa": "اصلاحیه‌ها و توضیحات لازم دربارهٔ گفتهٔ سخنران: هورکهایمر مدیر مؤسسه از ۱۹۳۰ بود نه ۱۹۳۳؛ مؤسسه پس از تبعید بیشتر به دانشگاه کلمبیا در نیویورک رفت، نه شیکاگو؛ کتاب «موسی و یکتاپرستی» فروید مربوط به ۱۹۳۹ است. نوربرت الیاس معمولاً عضو مکتب فرانکفورت شمرده نمی‌شود. همچنین عملکرد اقتصادی رایش سوم (کاهش بیکاری) عمدتاً بر بازتسلیحات، سرکوب و بدهی پنهان تکیه داشت و نباید «قابل دفاع» تلقی شود. نقش مارکوزه در جنبش ۱۹۶۸ هم الهام‌بخشی بود نه رهبری.", "en": "Corrections to the lecture: Horkheimer became director in 1930, not 1933; the Institute relocated mainly to Columbia University in New York, not Chicago; Freud's Moses and Monotheism dates from 1939. Norbert Elias is not normally counted as a Frankfurt School member. The Third Reich's economic record (falling unemployment) rested largely on rearmament, repression and hidden debt, so it is not 'defensible' in any simple sense. Marcuse inspired the 1968 movements but did not lead them.", "nl": "Corrections to the lecture: Horkheimer became director in 1930, not 1933; the Institute relocated mainly to Columbia University in New York, not Chicago; Freud's Moses and Monotheism dates from 1939. Norbert Elias is not normally counted as a Frankfurt School member. The Third Reich's economic record (falling unemployment) rested largely on rearmament, repression and hidden debt, so it is not 'defensible' in any simple sense. Marcuse inspired the 1968 movements but did not lead them."}, "sources": [], "flags": ["contested", "editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، مکتب فرانکفورت به‌رغم ارزش بالایش در برخی نقدها گرفتار بدبینی و تحقیر مردم عادی است. نقد مقابل: کارل پوپر و پیروان «خردگرایی انتقادی» در «مناقشهٔ اثبات‌گرایی» (۱۹۶۱) گفتند که علم خودش نقادانه و اصلاح‌پذیر است و لزومی ندارد اثبات‌گرا باشد تا بی‌طرف‌ترین کوشش را بکند. هابرماس، نسل بعدی مکتب، هم نظریهٔ بدبینانهٔ آدورنو را تعدیل کرد و بر گفت‌وگوی عقلانی تکیه کرد.", "en": "Per the lecturer, despite its value the school tends toward pessimism and contempt for ordinary people. Counter-view: Karl Popper and critical rationalists in the 1961 'positivism dispute' argued that science is itself critical and self-correcting, and one need not be a positivist to pursue impartial inquiry. Habermas, of the next generation, softened Adorno's pessimism and put rational dialogue at the centre.", "nl": "Per the lecturer, despite its value the school tends toward pessimism and contempt for ordinary people. Counter-view: Karl Popper and critical rationalists in the 1961 'positivism dispute' argued that science is itself critical and self-correcting, and one need not be a positivist to pursue impartial inquiry. Habermas, of the next generation, softened Adorno's pessimism and put rational dialogue at the centre."}, "sources": ["src:1d8f79952a", "src:1dcea968b4"], "flags": ["contested", "editor-note"]}], "links": [{"to": "soc:theory", "rel": "part-of", "note": {"fa": "از نظریه‌های اجتماعی پس از مارکس", "en": "One of the post-Marx social theories", "nl": "One of the post-Marx social theories"}}, {"to": "soc:culture-industry-false-needs", "rel": "explains", "note": {"fa": "نقد فرهنگ و نیازهای کاذب از همین مکتب می‌آید", "en": "Its critique of culture and false needs", "nl": "Its critique of culture and false needs"}}, {"to": "soc:formal-vs-substantive-rationality", "rel": "see-also", "note": {"fa": "بر پایهٔ برداشت از وبر دربارهٔ عقلانیت", "en": "Built on a reading of Weber on rationality", "nl": "Built on a reading of Weber on rationality"}}, {"to": "phil:falsification", "rel": "contrasts", "note": {"fa": "دیدگاه پوپر دربارهٔ علم در برابر نقد فرانکفورتی‌ها", "en": "Popper's view of science versus the critical theorists", "nl": "Popper's view of science versus the critical theorists"}}], "people": ["core:max-horkheimer", "core:theodor-w-adorno", "core:herbert-marcuse", "core:erich-fromm", "core:walter-benjamin", "core:georg-luk-cs", "core:felix-weil", "core:j-rgen-habermas", "core:karl-popper"], "sources": ["src:0bb2637044", "src:1d8f79952a", "src:1dcea968b4", "src:277be0423a", "src:810b9364fb", "src:8b4be4363d", "src:f230d7b5d2"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:manifesto-property-family-nation", "kind": "concept", "title": {"fa": "مالکیت، فرهنگ، خانواده و ملیت در «مانیفست کمونیست»", "en": "Property, culture, family and nation in the Communist Manifesto", "nl": "Eigendom, cultuur, gezin en natie in het Communistisch Manifest"}, "aliases": [], "parent": "soc:institutions", "field": "soc:institutions", "summary": {"fa": "بخش دوم «مانیفست» به اتهام‌هایی که به کمونیست‌ها زده می‌شد پاسخ می‌دهد: لغو مالکیت، فرهنگ، خانواده و ملیت. مارکس آزادی و فرهنگ را در زمینهٔ طبقه می‌خواند و می‌گوید کارگر «کشور ندارد». سخنران این استدلال‌ها را هم جالب و تأثیرگذار می‌داند و هم در بخش‌هایی سبک و جدلی.", "en": "The second part of the Manifesto answers accusations against communists: abolishing property, culture, family and nation. Marx reads freedom and culture through class, and says workers 'have no country'. The lecturer finds these arguments both influential and, in places, flippant and polemical.", "nl": "Deel twee van het Manifest beantwoordt beschuldigingen over eigendom, cultuur, gezin en natie. Marx leest vrijheid en cultuur door de lens van klasse."}, "points": [{"text": {"fa": "مارکس می‌گوید هدفش لغو مالکیت خصوصی بورژوایی است، نه مالکیت خرده‌پای کارگر یا دهقان که خود سرمایه‌داری در حال نابودی‌اش است. او استدلال می‌کند که کار مزدی برای کارگر مالکیت نمی‌سازد، بلکه سرمایه می‌سازد و بنابراین دفاع از «آزادی مالکیت» عملاً دفاع از یک طبقه است.", "en": "Marx says the aim is to abolish bourgeois private property, not the small property of the artisan or peasant, which capitalism is already destroying. He argues wage labour creates capital, not property for the worker, so defending 'freedom of property' means defending one class.", "nl": "Marx says the aim is to abolish bourgeois private property, not the small property of the artisan or peasant, which capitalism is already destroying. He argues wage labour creates capital, not property for the worker, so defending 'freedom of property' means defending one class."}, "sources": ["src:4d1925ef85", "src:a8f809b841"], "flags": []}, {"text": {"fa": "سخنران می‌گوید این پاسخ را ضعیف می‌داند، چون مارکس به‌جای رد استدلال لاک، اسمیت و هگل (که مالکیت را پایهٔ آزادی می‌دانند) عبارت «آزادی بورژوایی» را برچسب می‌زند و نیت مخالف را می‌خواند. او مارکس را یک نمونه از جدل برچسب‌زنی می‌داند. این داوری سخنران است؛ مدافعان مارکس می‌گویند نقد او به آزادی صوری که فقط برای صاحب مال واقعی است، نکته‌ای جدی دربارهٔ نابرابری شرایط آزادی است.", "en": "Per the lecturer, this answer is weak, because instead of rebutting Locke, Smith and Hegel (who see property as a basis of freedom) Marx labels it 'bourgeois freedom' and reads the opponent's intent. He treats it as an example of polemic by labelling. That is his judgement; defenders of Marx say the critique of a formal freedom real only for owners raises a serious point about unequal conditions of freedom.", "nl": "Per the lecturer, this answer is weak, because instead of rebutting Locke, Smith and Hegel (who see property as a basis of freedom) Marx labels it 'bourgeois freedom' and reads the opponent's intent. He treats it as an example of polemic by labelling. That is his judgement; defenders of Marx say the critique of a formal freedom real only for owners raises a serious point about unequal conditions of freedom."}, "sources": ["src:4d1925ef85"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "مارکس معتقد است فرهنگ و حقوق هم بازتاب اراده و منافع طبقهٔ حاکم‌اند. سخنران می‌گوید این ایده بعدها در کار وبلن («نظریهٔ طبقهٔ تن‌آسا»، ۱۸۹۹)، بوردیو («تمایز»، ۱۹۷۹) و حتی نوربرت الیاس دیده می‌شود. هشدار: وبلن و الیاس مارکسیست نبودند و بوردیو مفهوم «سرمایهٔ فرهنگی» را فراتر از مارکس ساخت؛ پس این‌ها وارث بخشی از ایدهٔ مارکس‌اند، نه مارکسیسم کامل.", "en": "Marx holds that culture and law reflect the will and interests of the ruling class. The lecturer says this idea resurfaces in Veblen (The Theory of the Leisure Class, 1899), Bourdieu (Distinction, 1979) and even Norbert Elias. Caution: Veblen and Elias were not Marxists and Bourdieu built 'cultural capital' beyond Marx, so they inherit part of the idea, not Marxism whole.", "nl": "Marx holds that culture and law reflect the will and interests of the ruling class. The lecturer says this idea resurfaces in Veblen (The Theory of the Leisure Class, 1899), Bourdieu (Distinction, 1979) and even Norbert Elias. Caution: Veblen and Elias were not Marxists and Bourdieu built 'cultural capital' beyond Marx, so they inherit part of the idea, not Marxism whole."}, "sources": ["src:4d1925ef85", "src:96497584d9", "src:c7022bdc65"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "در بحث خانواده، مارکس می‌گوید خانوادهٔ بورژوایی بر سرمایه و نفع شخصی بنا شده و با فحشا و فروپاشی خانوادهٔ پرولتری همراه است؛ و ادعای «اشتراک زنان» را ریاکارانه می‌خواند. سخنران لحن مارکس را بدبینانه و خام می‌داند و می‌گوید مارکس جوان بود. دربارهٔ تحلیل کالاشدن زن در سرمایه‌داری هم می‌گوید در ایران نقش فقه، قانون و سنت در سرکوب زنان نادیده گرفته می‌شود؛ این نظر شخصی اوست.", "en": "On the family, Marx says the bourgeois family rests on capital and private gain and goes with prostitution and the break-up of proletarian families; he calls the charge of 'community of women' hypocritical. The lecturer finds Marx's tone cynical and crude and notes Marx was young. On the 'commodification of women' he argues that in Iran the roles of religious law, statute and tradition are overlooked. This is his own view.", "nl": "On the family, Marx says the bourgeois family rests on capital and private gain and goes with prostitution and the break-up of proletarian families; he calls the charge of 'community of women' hypocritical. The lecturer finds Marx's tone cynical and crude and notes Marx was young. On the 'commodification of women' he argues that in Iran the roles of religious law, statute and tradition are overlooked. This is his own view."}, "sources": ["src:4d1925ef85"], "flags": ["editor-note"]}, {"text": {"fa": "مارکس می‌گوید کارگران «کشور ندارند» و دشمنی ملی با رشد بازار جهانی و پایان استثمار محو می‌شود؛ سخنران می‌گوید این نگاه بخشی از چپ، از جمله در ایران، را به انکار هویت ملی کشانده است. دیدگاه مخالف: همبستگی ملی و زبان مشترک می‌توانند پایهٔ اعتماد و نهادهای عادلانه باشند، و پیش‌بینی مارکس دربارهٔ از میان رفتن ملی‌گرایی درست از آب درنیامد. سخنران همچنین پیش‌بینی انقلاب پرولتری فوری پس از انقلاب بورژوایی آلمان را ناموفق می‌خواند.", "en": "Marx says workers 'have no country' and that national hostility fades with the world market and the end of exploitation; the lecturer says this led part of the left, including in Iran, to deny national identity. The opposing view: national solidarity and a shared language can underpin trust and fair institutions, and Marx's prediction that nationalism would fade did not come true. The lecturer also notes that the expected proletarian revolution right after a German bourgeois one never happened.", "nl": "Marx says workers 'have no country' and that national hostility fades with the world market and the end of exploitation; the lecturer says this led part of the left, including in Iran, to deny national identity. The opposing view: national solidarity and a shared language can underpin trust and fair institutions, and Marx's prediction that nationalism would fade did not come true. The lecturer also notes that the expected proletarian revolution right after a German bourgeois one never happened."}, "sources": ["src:4d1925ef85"], "flags": ["contested", "editor-note"]}], "links": [{"to": "soc:marx-historical-materialism", "rel": "part-of", "note": {"fa": "بنیاد نظری این استدلال‌ها.", "en": "The theoretical basis of these arguments.", "nl": "The theoretical basis of these arguments."}}, {"to": "phil:two-liberties", "rel": "contrasts", "note": {"fa": "آزادی منفی و مثبت در برابر نقد مارکس از آزادی بورژوایی.", "en": "Negative and positive liberty versus Marx's critique of bourgeois freedom.", "nl": "Negative and positive liberty versus Marx's critique of bourgeois freedom."}}, {"to": "soc:institutions", "rel": "see-also", "note": {"fa": "خانواده و مالکیت به‌مثابه نهاد.", "en": "Family and property as institutions.", "nl": "Family and property as institutions."}}], "people": ["core:karl-marx", "core:pierre-joseph-proudhon", "core:pierre-bourdieu"], "sources": ["src:4d1925ef85", "src:96497584d9", "src:a8f809b841", "src:c7022bdc65"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:culture-concept-functions", "kind": "concept", "title": {"fa": "مفهوم فرهنگ: تعریف تیلور، فرهنگ مادی و معنوی و کارکردها", "en": "The concept of culture: Tylor's definition, material and non-material sides, and functions", "nl": "Het begrip cultuur: Tylors definitie, materiële en immateriële kant en functies"}, "aliases": [], "parent": "soc:values", "field": "soc:values", "summary": {"fa": "سخنران فرهنگ را گسترده‌ترین مفهوم علوم انسانی می‌داند و با تعریف تیلور آغاز می‌کند: کلیتی از دانش، باور، هنر، اخلاق، قانون و عادت که انسان در جامعه می‌آموزد، نه از راه وراثت. فرهنگ دو سو دارد، مادی (کالاها و نمادها) و معنوی (ارزش‌ها و تصورها). کارکرد اصلی آن ایجاد نظم، پیش‌بینی‌پذیری و پاسخ به نیازها از راه نهادهاست. او تأکید می‌کند فرهنگ پویاست؛ برخی ادعاهای او دربارهٔ آلمانی و شمار تعریف‌ها نیاز به احتیاط دارد.", "en": "The lecturer treats culture as the broadest concept in the humanities and starts from Tylor: a complex whole of knowledge, belief, art, morals, law and custom learned by people as members of society, not inherited. It has a material side (goods, symbols) and a non-material side (values, ideas). Its main functions are order, predictability and meeting needs through institutions. He stresses it is dynamic; some of his side claims (German usage, number of definitions) need care.", "nl": "Cultuur is het brede geheel van kennis, geloof, kunst, normen en gewoonten dat mensen als lid van een samenleving aanleren. Het geeft orde, voorspelbaarheid en antwoorden op behoeften via instituties."}, "points": [{"text": {"fa": "ادوارد تیلور (۱۸۷۱) فرهنگ را کلیتی پیچیده شامل دانش، باور، هنر، اخلاق، قانون، آداب و هر توانایی دیگری می‌داند که انسان به‌عنوان عضو جامعه به‌دست می‌آورد. سخنران بر دو نکته تأکید می‌کند: فرهنگ آموختنی است نه ارثی، و با تغییر جامعه تغییر می‌کند. به همین دلیل خرده‌فرهنگ‌ها زیرمجموعهٔ فرهنگ‌اند و عباراتی مثل «فرهنگ رانندگی» را او اصطلاحی نادقیق می‌داند.", "en": "Edward Tylor (1871) defined culture as a complex whole including knowledge, belief, art, morals, law, custom and any other capabilities acquired by a person as a member of society. The lecturer stresses that culture is learned, not inherited, and changes as society changes. Subcultures sit inside culture, and he regards phrases like 'driving culture' as imprecise usage.", "nl": "Edward Tylor (1871) defined culture as a complex whole including knowledge, belief, art, morals, law, custom and any other capabilities acquired by a person as a member of society. The lecturer stresses that culture is learned, not inherited, and changes as society changes. Subcultures sit inside culture, and he regards phrases like 'driving culture' as imprecise usage."}, "sources": ["src:ce2a70df17", "src:e06a2ed077"], "flags": []}, {"text": {"fa": "فرهنگ دو سو دارد: سوی مادی (کوزه، پرچم، ابزار و هر کالای ساخته‌شده) و سوی معنوی (ارزش‌ها و تصورها). به گفتهٔ سخنران، چیزی که ساخته می‌شود پیش‌تر در ذهن معنا و ارزش گرفته است؛ مثلاً نقش اسطوره‌ای روی ظرف آب نیاز دومی را برآورده می‌کند، یعنی معنا دادن. او سوی مادی را با «تمدن» نزدیک می‌داند.", "en": "Culture has a material side (a jug, a flag, tools, any made good) and a non-material side (values and ideas). Per the lecturer, whatever is made has first received meaning and value in the mind; for example, a mythic design on a water vessel meets a secondary need, that of giving meaning. He sees the material side as close to 'civilisation'.", "nl": "Culture has a material side (a jug, a flag, tools, any made good) and a non-material side (values and ideas). Per the lecturer, whatever is made has first received meaning and value in the mind; for example, a mythic design on a water vessel meets a secondary need, that of giving meaning. He sees the material side as close to 'civilisation'."}, "sources": ["src:ce2a70df17"], "flags": ["editor-note"]}, {"text": {"fa": "کارکرد فرهنگ در بیان سخنران: نظم می‌دهد (مناسک و الگو برای خواستگاری، عروسی، نام‌گذاری و غیره)، جهان را پیش‌بینی‌پذیر و برای ذهن امن می‌کند و از راه نهادها (خانواده، آموزش، دین، اقتصاد) به نیازها پاسخ می‌دهد. این نگاه به کارکردگرایی مالینوفسکی نزدیک است.", "en": "As the lecturer describes it, culture gives order (rituals and scripts for courtship, weddings, naming and more), makes the world predictable and so mentally safe, and answers needs through institutions (family, education, religion, economy). This is close to Malinowski's functionalism.", "nl": "As the lecturer describes it, culture gives order (rituals and scripts for courtship, weddings, naming and more), makes the world predictable and so mentally safe, and answers needs through institutions (family, education, religion, economy). This is close to Malinowski's functionalism."}, "sources": ["src:ce2a70df17", "src:60e65d2def"], "flags": []}, {"text": {"fa": "به گفتهٔ سخنران، فرهنگ پویاست و برای بقا خود را با تغییر جامعه هماهنگ می‌کند. نگه‌داشتن عنصری که کارکردش را از دست داده، مثلاً پوشاک کوچ‌نشینان در تهران، به نظر او ضدفرهنگی است و «نگهبانانی» که فرهنگ را منجمد می‌کنند در واقع دشمن آن‌اند. راه‌حل او بازآفرینی عناصر سنتی در طراحی مدرن و استفادهٔ مناسبتی است.", "en": "Per the lecturer, culture is dynamic and adapts to social change in order to survive. Keeping an element whose function is gone, such as nomadic dress in Tehran, is in his view anti-cultural, and self-styled guardians who freeze culture are in fact its enemies. His proposed way out is to reuse traditional elements in modern design and on ceremonial occasions.", "nl": "Per the lecturer, culture is dynamic and adapts to social change in order to survive. Keeping an element whose function is gone, such as nomadic dress in Tehran, is in his view anti-cultural, and self-styled guardians who freeze culture are in fact its enemies. His proposed way out is to reuse traditional elements in modern design and on ceremonial occasions."}, "sources": ["src:ce2a70df17"], "flags": ["editor-note"]}, {"text": {"fa": "احتیاط‌ها: (۱) کروبر و کلاکهان (۱۹۵۲) حدود ۱۶۰ تعریف گردآوری کردند؛ رقم چندهزارتایی سخنران تأیید نشد. (۲) ادعای اینکه آلمانی‌ها میان فرهنگ و تمدن فرقی نمی‌گذاشتند با گزارش استاندارد نوربرت الیاس نمی‌خواند، چون در آلمان «Kultur» اغلب در برابر «Zivilisation» قرار می‌گرفت (در ترجمهٔ فروید نیز بحث ادامه دارد). (۳) کارکردگرایی نقد شده است: هر رسمی به نیاز نمی‌خورد و فرهنگ می‌تواند قدرت و فشار همنوایی هم باشد؛ برای اقلیت‌ها نیز حفظ آداب بخشی از هویت و حق است، نه فقط عادت بی‌کارکرد.", "en": "Caveats: (1) Kroeber and Kluckhohn (1952) collected about 160 definitions; the lecturer's figure of several thousand is unverified. (2) The claim that Germans did not distinguish culture from civilisation does not match Norbert Elias's standard account, in which German 'Kultur' was often set against 'Zivilisation' (the translation of Freud's title is still debated). (3) Functionalism has been criticised: not every custom meets a need, and culture can also be power and pressure to conform; for minorities, keeping customs is part of identity and rights, not only a leftover habit.", "nl": "Caveats: (1) Kroeber and Kluckhohn (1952) collected about 160 definitions; the lecturer's figure of several thousand is unverified. (2) The claim that Germans did not distinguish culture from civilisation does not match Norbert Elias's standard account, in which German 'Kultur' was often set against 'Zivilisation' (the translation of Freud's title is still debated). (3) Functionalism has been criticised: not every custom meets a need, and culture can also be power and pressure to conform; for minorities, keeping customs is part of identity and rights, not only a leftover habit."}, "sources": ["src:4b4ce851d1", "src:3fb9c016ba", "src:3f77fef00c"], "flags": ["contested", "editor-note"]}], "links": [{"to": "soc:institutions", "rel": "part-of", "note": {"fa": "نهادها شکل سازمان‌یافتهٔ پاسخ فرهنگ به نیازها هستند.", "en": "Institutions are the organised form of culture's answer to needs.", "nl": "Institutions are the organised form of culture's answer to needs."}}, {"to": "soc:value-change", "rel": "see-also", "note": {"fa": "تغییر ارزش‌ها نمونه‌ای از پویایی فرهنگ است.", "en": "Value change is an example of cultural dynamics.", "nl": "Value change is an example of cultural dynamics."}}, {"to": "soc:presentation-of-self", "rel": "see-also", "note": {"fa": "نقش‌ها و تیپ‌ها در زندگی روزمره.", "en": "Roles and types in everyday life.", "nl": "Roles and types in everyday life."}}], "people": ["core:edward-b-tylor", "core:bronis-aw-malinowski", "core:norbert-elias", "core:sigmund-freud"], "sources": ["src:3f77fef00c", "src:3fb9c016ba", "src:4b4ce851d1", "src:60e65d2def", "src:ce2a70df17", "src:e06a2ed077"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:institutions-needs-order", "kind": "concept", "title": {"fa": "نهادهای اصلی، نیازها و مرز میان نهادها", "en": "The main institutions, needs and boundaries between institutions", "nl": "De vijf hoofdinstituties, behoeften en grenzen tussen instituties"}, "aliases": [], "parent": "soc:institutions", "field": "soc:institutions", "summary": {"fa": "جامعه‌شناسی پنج نهاد اصلی را برمی‌شمارد: خانواده، آموزش، سیاست، اقتصاد و دین. هر نهاد نظمی می‌سازد و به نیازهایی پاسخ می‌دهد. سخنران می‌گوید هر نهاد زمان و مکان خودش را دارد و اگر نهادی به قلمرو نهاد دیگر وارد شود هر دو آسیب می‌بینند.", "en": "Sociology names five main institutions: family, education, politics, economy and religion. Each creates order and answers certain needs. The lecturer argues that each has its own time and place, and that when one invades another's territory both are damaged.", "nl": "De sociologie onderscheidt vijf hoofdinstituties: gezin, onderwijs, politiek, economie en religie. Elk schept orde en vervult behoeften; vermenging van domeinen schaadt volgens de spreker beide."}, "points": [{"text": {"fa": "پنج نهاد اصلی: خانواده (نیاز جنسی، فرزندآوری، عاطفه)، آموزش (انتقال دانش و آماده‌کردن برای کار)، دین (پاسخ به پرسش‌های بنیادین و آرامش)، سیاست (امنیت و قدرت) و اقتصاد (نیازهای مادی). نهادهای فرعی مثل اوقات فراغت هم هستند. دو کارکرد مشترک همهٔ آن‌ها تولید نظم و پاسخ به نیاز است.", "en": "The five main institutions: family (sexual needs, child-bearing, affection), education (transmitting knowledge, preparing for work), religion (answers to ultimate questions, solace), politics (security and power) and economy (material needs). There are also minor ones such as leisure. Their shared functions are producing order and meeting needs.", "nl": "The five main institutions: family (sexual needs, child-bearing, affection), education (transmitting knowledge, preparing for work), religion (answers to ultimate questions, solace), politics (security and power) and economy (material needs). There are also minor ones such as leisure. Their shared functions are producing order and meeting needs."}, "sources": ["src:d50f6ac9b8"], "flags": []}, {"text": {"fa": "به گفتهٔ سخنران، هر نهاد زمان و مکان ویژهٔ خود دارد (خانواده خصوصی، دین مقدس، اقتصاد بازار) و نهادها با هم مبادله دارند؛ مثلاً آموزش به خانواده و اقتصاد کمک می‌کند. او خانواده را بنیان فرهنگ می‌داند و می‌گوید جامعه‌ای پیدا نمی‌شود که خانواده‌اش فروپاشیده ولی اقتصاد یا آموزشش شکوفا باشد.", "en": "Per the lecturer, each institution has its own time and place (family private, religion sacred, economy the market) and they exchange help; education, for instance, supports family and economy. He treats the family as the base of culture and says no society has a collapsed family yet a flourishing economy or school system.", "nl": "Per the lecturer, each institution has its own time and place (family private, religion sacred, economy the market) and they exchange help; education, for instance, supports family and economy. He treats the family as the base of culture and says no society has a collapsed family yet a flourishing economy or school system."}, "sources": ["src:d50f6ac9b8"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، کج‌کارکردی وقتی پدید می‌آید که یک نهاد نهادهای دیگر را تصرف کند، مثل آوردن کار اقتصادی به خانواده یا گسترش دین به ورزش، آموزش و رسانه. به نظر او حکومت دینی که همهٔ نهادها را دینی می‌کند هم دیگر نهادها را فرسوده می‌کند و هم به شأن خود دین لطمه می‌زند؛ پس جدایی دین از سیاست (سکولاریسم) در واقع از دین محافظت می‌کند.", "en": "Per the lecturer, dysfunction arises when one institution takes over others, such as bringing economic work into the family or extending religion into sport, schooling and media. He argues a religious state that makes every institution religious wears down the others and damages religion's own dignity, so separating religion from politics (secularism) actually protects religion.", "nl": "Per the lecturer, dysfunction arises when one institution takes over others, such as bringing economic work into the family or extending religion into sport, schooling and media. He argues a religious state that makes every institution religious wears down the others and damages religion's own dignity, so separating religion from politics (secularism) actually protects religion."}, "sources": ["src:d50f6ac9b8"], "flags": ["editor-note"]}, {"text": {"fa": "توضیح علمی تکمیلی: نظریهٔ نیاز به مالینوفسکی (۱۹۴۴) برمی‌گردد. اینکه فرهنگ از «عقدهٔ ادیپ» آغاز شود دیدگاه فروید است و خود مالینوفسکی در پژوهش جزایر تروبریاند جهانی‌بودن آن را نقد کرد؛ پس هر دو را همراه نمی‌توان شمرد. ادعای «هیچ جامعه‌ای نیست که یک نهادش فروپاشد و دیگری بالا باشد» هم بیش‌ازحد قطعی است: آسموگلو و رابینسون نشان می‌دهند نهادهای بهره‌کش گاه رشد اقتصادی کوتاه‌مدت دارند.", "en": "Editor's caveat: need-based functionalism goes back to Malinowski (1944). Culture beginning with the Oedipus complex is Freud's view, and Malinowski himself, from his Trobriand research, challenged its universality, so the two cannot be bundled together. The claim that no society has one collapsed institution beside a thriving one is too absolute: Acemoglu and Robinson show extractive institutions can coexist with short-run economic growth.", "nl": "Editor's caveat: need-based functionalism goes back to Malinowski (1944). Culture beginning with the Oedipus complex is Freud's view, and Malinowski himself, from his Trobriand research, challenged its universality, so the two cannot be bundled together. The claim that no society has one collapsed institution beside a thriving one is too absolute: Acemoglu and Robinson show extractive institutions can coexist with short-run economic growth."}, "sources": ["src:60e65d2def", "src:7d3f6b178e", "src:aa1ac5c476"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "نظر مخالف دربارهٔ دین و سیاست: بسیاری از جامعه‌شناسان دین (مثل خوزه کازانوا) نشان داده‌اند دین در جوامع مدرن نقش عمومی دارد و جداسازی کامل آن لازم یا شدنی نیست، و برخی مؤمنان خود حضور سیاسی دین را حق می‌دانند. «سکولاریسم» هم معانی مختلف دارد (بی‌طرفی دولت، یا حذف دین از عرصهٔ عمومی) و آنچه سخنران می‌گوید فقط یک تفسیر است.", "en": "Opposing view on religion and politics: many sociologists of religion (such as José Casanova) show religion keeps a public role in modern societies, so full separation is neither necessary nor always feasible, and some believers claim a political voice as a right. 'Secularism' also has several meanings (state neutrality versus removing religion from public life); the lecturer's is one interpretation.", "nl": "Opposing view on religion and politics: many sociologists of religion (such as José Casanova) show religion keeps a public role in modern societies, so full separation is neither necessary nor always feasible, and some believers claim a political voice as a right. 'Secularism' also has several meanings (state neutrality versus removing religion from public life); the lecturer's is one interpretation."}, "sources": ["src:8c29671760"], "flags": ["contested", "editor-note"]}], "links": [{"to": "soc:institutions", "rel": "part-of", "note": {"fa": "زمینهٔ نهادها و دولت", "en": "Part of institutions and the state", "nl": "Part of institutions and the state"}}, {"to": "soc:institutions-inclusive", "rel": "contrasts", "note": {"fa": "نهادهای بهره‌کش و رشد", "en": "Extractive institutions and growth", "nl": "Extractive institutions and growth"}}, {"to": "soc:secularization", "rel": "see-also", "note": {"fa": "سکولار شدن و دین", "en": "Secularisation and religion", "nl": "Secularisation and religion"}}], "people": ["core:bronis-aw-malinowski", "core:sigmund-freud", "core:jos-casanova"], "sources": ["src:60e65d2def", "src:7d3f6b178e", "src:8c29671760", "src:aa1ac5c476", "src:d50f6ac9b8"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:collective", "kind": "field", "title": {"fa": "کنش جمعی و جنبش‌ها", "en": "Collective action & movements", "nl": "Collectieve actie & bewegingen"}, "aliases": [], "parent": "soc:soc", "field": null, "summary": {"fa": "چرا مردم گاهی با هم حرکت می‌کنند و بیشتر وقت‌ها نه؛ و چرا انقلاب‌ها همیشه غافلگیر می‌کنند؟", "en": "Why people sometimes move together and mostly do not; and why revolutions always surprise.", "nl": "Waarom mensen soms samen in beweging komen en meestal niet; en waarom revoluties altijd verrassen."}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:collective-action", "kind": "concept", "title": {"fa": "مسئلهٔ کنش جمعی و سواری مجانی", "en": "The collective action problem and free-riding", "nl": "Het collectieve-actieprobleem en meeliften"}, "aliases": [], "parent": "soc:collective", "field": "soc:collective", "summary": {"fa": "اگر همه از نتیجه سود می‌برند چه شرکت کنند چه نکنند، عقلانی است که کسی هزینه ندهد؛ پس کالاهای عمومی کمتر از نیاز تولید می‌شوند و گروه‌های بزرگ سخت‌تر از گروه‌های کوچک بسیج می‌شوند. استروم نشان داد اجتماعات محلی این مسئله را قرن‌ها بدون دولت و بدون بازار حل کرده‌اند.", "en": "If everyone benefits from the outcome whether or not they take part, it is rational for no one to bear the cost; so public goods are under-produced and large groups mobilise with more difficulty than small ones. Ostrom showed local communities have solved this for centuries without state or market.", "nl": "Als iedereen van de uitkomst profiteert, of hij nu meedoet of niet, is het rationeel dat niemand de kosten draagt; dus worden publieke goederen te weinig geproduceerd en mobiliseren grote groepen moeilijker dan kleine. Ostrom toonde dat lokale gemeenschappen dit eeuwenlang hebben opgelost zonder staat of markt."}, "points": [{"text": {"fa": "اولسون (۱۹۶۵): گروه‌های کوچک با منافع متمرکز (یک صنف) بر گروه‌های بزرگ با منافع پراکنده (مصرف‌کنندگان) پیروز می‌شوند؛ از همین رو سیاست‌گذاری به سمت لابی‌های کوچک کج می‌شود.", "en": "Olson (1965): small groups with concentrated interests (a trade lobby) beat large groups with diffuse interests (consumers); hence policy tilts toward small lobbies.", "nl": "Olson (1965): small groups with concentrated interests (a trade lobby) beat large groups with diffuse interests (consumers); hence policy tilts toward small lobbies."}, "sources": ["src:a659e764c0"], "flags": []}, {"text": {"fa": "استروم (۱۹۹۰): در ده‌ها نمونهٔ مرتع، آبیاری و شیلات، اجتماعات محلی با هشت اصل طراحی (مرز روشن، قواعد متناسب با محل، مشارکت در قاعده‌گذاری، پایش، مجازات پلکانی، حل اختلاف ارزان، به رسمیت شناخته شدن، لایه‌بندی) منابع مشترک را پایدار نگه داشتند. قنات‌های ایران از نمونه‌های کلاسیک این ادبیات‌اند.", "en": "Ostrom (1990): in dozens of pasture, irrigation and fishery cases, local communities kept commons sustainable with eight design principles (clear boundaries, locally fitted rules, participation in rule-making, monitoring, graduated sanctions, cheap conflict resolution, recognition, nesting). Iran's qanats are classic cases in this literature.", "nl": "Ostrom (1990): in dozens of pasture, irrigation and fishery cases, local communities kept commons sustainable with eight design principles (clear boundaries, locally fitted rules, participation in rule-making, monitoring, graduated sanctions, cheap conflict resolution, recognition, nesting). Iran's qanats are classic cases in this literature."}, "sources": ["src:286dec0d93"], "flags": []}], "links": [{"to": "psy:cooperation-competition", "rel": "bridges", "note": {"fa": "همکاری در ویکی روان", "en": "Cooperation in the psychology wiki", "nl": "Cooperation in the psychology wiki"}}, {"to": "psy:fairness", "rel": "bridges", "note": {"fa": "انصاف و تنبیه نوع‌دوستانه", "en": "Fairness and altruistic punishment", "nl": "Fairness and altruistic punishment"}}, {"to": "soc:social-movements", "rel": "prerequisite", "note": {"fa": "جنبش‌ها به‌عنوان حل مسئلهٔ کنش جمعی", "en": "Movements as solutions to the collective action problem", "nl": "Movements as solutions to the collective action problem"}}], "people": ["core:mancur-olson", "core:elinor-ostrom"], "sources": ["src:286dec0d93", "src:a659e764c0"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:discourse-subject-genealogy", "kind": "concept", "title": {"fa": "نگاه تاریخی، تبارشناسی و ساخته‌شدن سوژه‌ها در گفتمان‌ها", "en": "Historical view, genealogy and the making of subjects within discourses", "nl": "Historisch perspectief, genealogie en het ontstaan van subjecten in discoursen"}, "aliases": [], "parent": "soc:theory", "field": "soc:theory", "summary": {"fa": "سخنران می‌گوید برای فهم هر پدیده باید تاریخ آن و گفتمان‌هایی را که از آن‌ها گذشته بشناسیم و برای این کار «تاریخ‌های مرجع» مانند رنسانس، انقلاب فرانسه و صنعتی، جنگ‌های جهانی و فروپاشی بلوک شرق را به یاد داشته باشیم. با الهام از فوکو، می‌گوید گفتمان‌ها جایگاه‌هایی برای «سوژه» می‌سازند و نام‌گذاری‌ها (زن، محیط زیست، همجنس‌گرا) نحوهٔ دیده‌شدن آدم‌ها را عوض می‌کنند. مثال‌های ایرانی او تفسیر شخصی است و برخی ادعاهایش ساده‌سازی است.", "en": "The lecturer says that to understand any phenomenon one must know its history and the discourses it passed through, keeping in mind landmark dates such as the Renaissance, the French and industrial revolutions, the world wars and the fall of the Eastern bloc. Following Foucault, he argues that discourses create positions for 'subjects' and that naming (woman, environment, gay) changes how people are seen. His Iranian examples are personal interpretation and some claims are simplified.", "nl": "Om een verschijnsel te begrijpen moet je zijn geschiedenis en de discoursen waarin het stond kennen. Volgens Foucault scheppen discoursen posities voor subjecten, en namen veranderen hoe mensen gezien worden."}, "points": [{"text": {"fa": "سخنران تأکید می‌کند هر معرفتی را باید تاریخی آموخت و تاریخ‌های مرجع آن را شناخت. برای جامعه‌شناسی این‌ها را برمی‌شمارد: رنسانس، انقلاب کبیر فرانسه (۱۷۸۹)، انقلاب صنعتی قرن نوزدهم، دو جنگ جهانی و فروپاشی دیوار برلین و شوروی. به نظر او این رویدادها گفتمان‌ها و «نوع انسان» را عوض کرده‌اند و اندیشهٔ کهن برای فهم جهان جدید کافی نبود.", "en": "The lecturer insists that any field of knowledge should be learned historically with its reference dates. For sociology he lists the Renaissance, the French Revolution (1789), the nineteenth-century industrial revolution, the two world wars and the fall of the Berlin Wall and the USSR. In his view these changed discourses and the kind of person that exists, and older thought could no longer explain the new world.", "nl": "The lecturer insists that any field of knowledge should be learned historically with its reference dates. For sociology he lists the Renaissance, the French Revolution (1789), the nineteenth-century industrial revolution, the two world wars and the fall of the Berlin Wall and the USSR. In his view these changed discourses and the kind of person that exists, and older thought could no longer explain the new world."}, "sources": ["src:ce2a70df17"], "flags": []}, {"text": {"fa": "به گفتهٔ سخنران، فوکو با «تبارشناسی» می‌گوید باید مسیر گفتمانی یک پدیده را دنبال کرد و گفتمان‌ها سوژه می‌سازند. مثال او گفتمان‌های مربوط به زن در ایران از مشروطه تا امروز است که جایگاه‌هایی چون «ضعیفه»، «زن متجدد» و «مادر شهید» ساخته‌اند. او می‌خواهد نشان دهد بخش بزرگی از تاریخ معاصر را می‌توان از راه سوژه‌شدن یا ابژه‌ماندن زن خواند.", "en": "Per the lecturer, Foucault's 'genealogy' means tracing a phenomenon's path through discourses, and discourses produce subjects. His example is discourse on women in Iran from the Constitutional era to today, which produced positions such as the 'weak one', the 'modern woman' and the 'mother of a martyr'. He suggests that much of contemporary Iranian history can be read through women being made subjects or kept as objects.", "nl": "Per the lecturer, Foucault's 'genealogy' means tracing a phenomenon's path through discourses, and discourses produce subjects. His example is discourse on women in Iran from the Constitutional era to today, which produced positions such as the 'weak one', the 'modern woman' and the 'mother of a martyr'. He suggests that much of contemporary Iranian history can be read through women being made subjects or kept as objects."}, "sources": ["src:ce2a70df17"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، محیط زیست و حیوانات در ایران کمتر از دو دهه است که از «ابژه» به «سوژه» گفتمان تبدیل شده‌اند. او همچنین می‌گوید تغییر اجتماعی ناگهانی نیست: خواست‌های مربوط به زنان دهه‌ها پیش از رضاشاه مطرح بوده و روشنفکران آن‌ها را به بحث می‌گذاشتند، اما جوامع محتاط‌اند و امر تازه را در ابتدا غریبه و حتی شیطانی می‌بینند چون نمی‌دانند جایگزین نظم قدیم چیست.", "en": "Per the lecturer, the environment and animals in Iran turned from 'objects' into 'subjects' of discourse within less than two decades. He also says social change is not sudden: demands about women's status predate Reza Shah by decades and intellectuals debated them, but societies are cautious and first see the new as strange or even evil, because they cannot tell what would replace the old order.", "nl": "Per the lecturer, the environment and animals in Iran turned from 'objects' into 'subjects' of discourse within less than two decades. He also says social change is not sudden: demands about women's status predate Reza Shah by decades and intellectuals debated them, but societies are cautious and first see the new as strange or even evil, because they cannot tell what would replace the old order."}, "sources": ["src:ce2a70df17"], "flags": ["editor-note"]}, {"text": {"fa": "احتیاط دربارهٔ مثال همجنس‌گرایی: ادعای سخنران که «گی» تا بیست سال پیش در ذهنیت ایرانی وجود نداشت ساده‌سازی است. فوکو (۱۹۷۶) گفت «همجنس‌گرا» به‌عنوان یک نوع آدم در اروپای قرن نوزدهم رواج یافت، نه اینکه میل یا رفتار همجنس‌خواهانه پیش‌تر نبود. تحقیق نجم‌آبادی (۲۰۰۵) نشان می‌دهد در ایران پیشامدرن نیز همجنس‌خواهی با دسته‌بندی‌ها و واژه‌های دیگری دیده و بیان می‌شد و این دسته‌ها در دورهٔ مدرن، به‌ویژه در قاجار و پهلوی، تغییر کردند. گفتمان‌ها سوژه می‌سازند، اما نمی‌توان از آن نتیجه گرفت که خود پدیده‌ها وجود نداشتند.", "en": "Caveat on the homosexuality example: the claim that 'gay' did not exist in the Iranian mind twenty years ago is a simplification. Foucault (1976) argued that 'the homosexual' as a type of person spread in nineteenth-century Europe, not that same-sex desire or acts were absent before. Najmabadi's research (2005) shows that in premodern Iran same-sex desire was seen and expressed through other categories and words, and that these changed in the modern period, especially under the Qajars and Pahlavis. Discourses shape subjects, but this does not mean the phenomena themselves did not exist.", "nl": "Caveat on the homosexuality example: the claim that 'gay' did not exist in the Iranian mind twenty years ago is a simplification. Foucault (1976) argued that 'the homosexual' as a type of person spread in nineteenth-century Europe, not that same-sex desire or acts were absent before. Najmabadi's research (2005) shows that in premodern Iran same-sex desire was seen and expressed through other categories and words, and that these changed in the modern period, especially under the Qajars and Pahlavis. Discourses shape subjects, but this does not mean the phenomena themselves did not exist."}, "sources": ["src:e5b7ab52eb", "src:bc3b21a1d2"], "flags": ["contested", "editor-note"]}], "links": [{"to": "soc:enlightenment-break", "rel": "part-of", "note": {"fa": "یکی از «تاریخ‌های مرجع» که سخنران یاد می‌کند.", "en": "One of the reference breaks the lecturer mentions.", "nl": "One of the reference breaks the lecturer mentions."}}, {"to": "soc:social-construction", "rel": "see-also", "note": {"fa": "هر دو می‌گویند آنچه طبیعی به نظر می‌رسد ساخته‌شدهٔ اجتماعی است.", "en": "Both say what seems natural is socially constructed.", "nl": "Both say what seems natural is socially constructed."}}, {"to": "soc:epistemic-distance", "rel": "see-also", "note": {"fa": "همان فاصله‌گرفتن معرفتی از پدیده‌ها.", "en": "The same epistemic distance from phenomena.", "nl": "The same epistemic distance from phenomena."}}], "people": ["core:michel-foucault", "core:afsaneh-najmabadi"], "sources": ["src:bc3b21a1d2", "src:ce2a70df17", "src:e5b7ab52eb"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:class-consciousness", "kind": "concept", "title": {"fa": "آگاهی طبقاتی و آگاهی کاذب نزد لوکاچ", "en": "Class consciousness and false consciousness in Lukács", "nl": "Klassenbewustzijn en vals bewustzijn"}, "aliases": [], "parent": "soc:inequality", "field": "soc:inequality", "summary": {"fa": "لوکاچ می‌گوید آگاهی طبقاتی نه جمع نظر افراد است و نه میانگین آن‌ها، بلکه نگاهی است که با جایگاه یک طبقه در تولید جور درمی‌آید و جامعه را به‌عنوان یک کل می‌فهمد. در سرمایه‌داری طبقات معمولاً منافع خود را درست نمی‌شناسند (آگاهی کاذب)، اما پرولتاریا می‌تواند از «طبقه در خود» به «طبقه برای خود» برسد. این نگاه به آگاهی و کنش انسان‌ها در تغییر تاریخ جای واقعی می‌دهد.", "en": "Lukács holds that class consciousness is neither the sum nor the average of individuals' opinions, but the outlook that fits a class's position in production and grasps society as a whole. Under capitalism classes usually misjudge their interests (false consciousness), yet the proletariat can move from a class 'in itself' to a class 'for itself'. This gives awareness and action a real role in historical change.", "nl": "Voor Lukács is klassenbewustzijn geen gemiddelde van meningen, maar inzicht in de samenleving als geheel vanuit een klassenpositie."}, "points": [{"text": {"fa": "در سنت مارکسی، طبقه‌ای که تنها ساختهٔ شرایط اقتصادی است «طبقهٔ در خود» نام دارد. وقتی اعضایش از جایگاه و رسالت خود آگاه می‌شوند و برای تغییر دست به کار می‌شوند، «طبقهٔ برای خود» می‌شود.", "en": "In the Marxian tradition a class that is merely a product of economic conditions is a class 'in itself'. When its members become aware of their position and task and act to change it, it becomes a class 'for itself'.", "nl": "In the Marxian tradition a class that is merely a product of economic conditions is a class 'in itself'. When its members become aware of their position and task and act to change it, it becomes a class 'for itself'."}, "sources": ["src:f16bb683da"], "flags": []}, {"text": {"fa": "به گفتهٔ سخنران، لوکاچ آگاهی طبقاتی را نه مجموعهٔ باورهای فردی و نه میانگین آن‌ها می‌داند، بلکه ویژگی گروهی از مردم که جایگاه مشابهی در تولید دارند. فهمیدن آن مستلزم نگاه به کلیت جامعه است و در همان حال به محدودیتی که جایگاه طبقاتی ایجاد می‌کند وابسته است.", "en": "Per the lecturer, Lukács defines class consciousness not as a collection or average of individual beliefs but as a trait of a group occupying a similar position in production. Grasping it requires seeing society as a whole, while remaining tied to the limits set by class position.", "nl": "Per the lecturer, Lukács defines class consciousness not as a collection or average of individual beliefs but as a trait of a group occupying a similar position in production. Grasping it requires seeing society as a whole, while remaining tied to the limits set by class position."}, "sources": ["src:f16bb683da", "src:fea88c93a4"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، لوکاچ آگاهی کاذب را نتیجهٔ طبیعی ساختار سرمایه‌داری می‌داند و نه فقط خطای ذهنی. نمونه: دستمزد طوری دیده می‌شود که انگار همهٔ کار پرداخت شده است. او می‌گوید در سرمایه‌داری پایهٔ اقتصادی روشن‌تر از جوامع پیشاسرمایه‌داری است، چون در آن‌ها دولت و منزلت، طبقه را پنهان می‌کردند. پس رسیدن به آگاهی راستین در آن ممکن‌تر است.", "en": "Per the lecturer, Lukács sees false consciousness as a natural result of capitalist structure, not merely a mental mistake: for example, a wage looks as if it pays for all the labour. He says capitalism's economic basis is clearer than in pre-capitalist societies, where state and status masked class, so true consciousness is more reachable there.", "nl": "Per the lecturer, Lukács sees false consciousness as a natural result of capitalist structure, not merely a mental mistake: for example, a wage looks as if it pays for all the labour. He says capitalism's economic basis is clearer than in pre-capitalist societies, where state and status masked class, so true consciousness is more reachable there."}, "sources": ["src:f16bb683da", "src:fea88c93a4"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، لوکاچ خرده‌بورژوازی و دهقانان را به‌خاطر ریشه‌داشتن در بقایای جامعهٔ فئودالی ناتوان از آگاهی طبقاتی کامل می‌داند. بورژوازی رشد سرمایه‌داری را مثل قانونی بیرونی تجربه می‌کند. فقط پرولتاریا می‌تواند مسیر کل جامعه را بفهمد و با این فهم موقعیت خود را تغییر دهد.", "en": "Per the lecturer, Lukács judges the petty bourgeoisie and peasants unable to develop full class consciousness because they are rooted in remnants of feudal society. The bourgeoisie experiences capitalism's growth as an external law. Only the proletariat can grasp the direction of society as a whole and change its own position through that understanding.", "nl": "Per the lecturer, Lukács judges the petty bourgeoisie and peasants unable to develop full class consciousness because they are rooted in remnants of feudal society. The bourgeoisie experiences capitalism's growth as an external law. Only the proletariat can grasp the direction of society as a whole and change its own position through that understanding."}, "sources": ["src:f16bb683da", "src:fea88c93a4"], "flags": ["editor-note"]}, {"text": {"fa": "نکتهٔ نقد: ادعای لوکاچ بر این است که پرولتاریا جایگاه ویژهٔ شناختی دارد؛ منتقدان می‌گویند نظر واقعی کارگران بسیار متنوع است و این ایده می‌تواند به ادعای «ما بهتر از خود کارگران منافع آن‌ها را می‌دانیم» (حزب پیشرو) تبدیل شود. تاریخ‌نگارانی مثل ای. پی. تامپسون هم نشان داده‌اند آگاهی طبقاتی در دوره‌های پیش از سرمایه‌داری صنعتی نیز شکل می‌گرفت. اصطلاح «آگاهی کاذب» هم در اصل از انگلس است، نه مارکس.", "en": "Critical note: Lukács's claim rests on the proletariat's privileged standpoint of knowledge; critics say workers' actual views are diverse and that the idea can slide into a vanguard party claiming to know workers' interests better than they do. Historians such as E. P. Thompson also show that class awareness formed before industrial capitalism. The phrase 'false consciousness' itself comes from Engels, not Marx.", "nl": "Critical note: Lukács's claim rests on the proletariat's privileged standpoint of knowledge; critics say workers' actual views are diverse and that the idea can slide into a vanguard party claiming to know workers' interests better than they do. Historians such as E. P. Thompson also show that class awareness formed before industrial capitalism. The phrase 'false consciousness' itself comes from Engels, not Marx."}, "sources": ["src:f79417dcb3"], "flags": ["contested", "editor-note"]}], "links": [{"to": "soc:reification", "rel": "contrasts", "note": {"fa": "چیزوارگی؛ وضعیتی که آگاهی طبقاتی باید از آن عبور کند", "en": "Reification: the condition class consciousness must overcome", "nl": "Reification: the condition class consciousness must overcome"}}, {"to": "soc:western-marxism", "rel": "part-of", "note": {"fa": "بخشی از مارکسیسم هگلی", "en": "Part of Hegelian Marxism", "nl": "Part of Hegelian Marxism"}}, {"to": "soc:inequality", "rel": "see-also", "note": {"fa": "نابرابری و تحرک", "en": "Inequality and mobility", "nl": "Inequality and mobility"}}], "people": ["core:georg-luk-cs", "core:e-p-thompson"], "sources": ["src:f16bb683da", "src:f79417dcb3", "src:fea88c93a4"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:marxism-revisions-and-limits", "kind": "concept", "title": {"fa": "اصلاح مارکسیسم و حدود اصلاح یک نظریه", "en": "Revising Marxism and the limits of revising a theory", "nl": "Het herzien van het marxisme en de grenzen van theoriecorrectie"}, "aliases": [], "parent": "soc:theory", "field": "soc:theory", "summary": {"fa": "این جلسه رشته‌ای از اصلاحات مارکسیسم را جمع‌بندی می‌کند: لوکاچ، مکتب فرانکفورت و آلتوسر هر کدام کوشیدند با بازگشت به ذهن، فرهنگ یا ساختار به شکست‌ها و رویدادهای قرن بیستم پاسخ دهند. سخنران استدلال می‌کند اصلاح‌های پی‌درپی ستون‌های نظریه را برمی‌دارد و آن را با روشنفکری دینی در ایران قیاس می‌کند. این استدلال یک دیدگاه است و مخالفان جدی دارد.", "en": "The lecture sums up a series of revisions of Marxism: Lukács, the Frankfurt School and Althusser each tried to answer the events and failures of the twentieth century by returning to the mind, culture or structure. The lecturer argues that repeated revision removes the theory's pillars and compares this with religious intellectualism in Iran. This is one position and it has serious opponents.", "nl": "De les vat een reeks herzieningen van het marxisme samen: Lukács, de Frankfurter Schule en Althusser. De docent stelt dat voortdurende herziening de pijlers van een theorie wegneemt en vergelijkt dit met religieus intellectualisme in Iran; dat is één standpunt met serieuze tegenstanders."}, "points": [{"text": {"fa": "به روایت سخنران، مارکسیست‌ها پس از مارکس مجبور شدند به پرسش‌های تازه (جنگ‌ها، فاشیسم، تجربهٔ شوروی که فقر و فساد و نابرابری را از میان نبرد) پاسخ دهند. لوکاچ با تأکید بر ریشه‌های هگلی و ذهن شروع کرد؛ مکتب فرانکفورت فرهنگ و رسانه را وارد کرد؛ آلتوسر ساختارهای پنهان و ایدئولوژی را. نقطهٔ مشترکشان نقد اقتصادگرایی و تک‌عاملی دیدن جامعه و تقسیم ساده به زیربنا و روبنا بود.", "en": "Per the lecturer, post-Marx Marxists had to answer new questions (wars, fascism, the Soviet experience that did not abolish poverty, corruption and inequality). Lukács began by stressing Hegelian roots and the mind; the Frankfurt School brought in culture and media; Althusser brought hidden structures and ideology. What they shared was a critique of economism, of single-factor explanation and of the simple base/superstructure split.", "nl": "Per the lecturer, post-Marx Marxists had to answer new questions (wars, fascism, the Soviet experience that did not abolish poverty, corruption and inequality). Lukács began by stressing Hegelian roots and the mind; the Frankfurt School brought in culture and media; Althusser brought hidden structures and ideology. What they shared was a critique of economism, of single-factor explanation and of the simple base/superstructure split."}, "sources": ["src:7c5fc6c369"], "flags": ["editor-note"]}, {"text": {"fa": "استدلال سخنران: هر بار یک «ستون» برداشته شد (ماده‌گرایی محض، زیربنا و روبنا، طبقهٔ کارگر به‌عنوان نیروی انقلابی، ثابت نبودن طبیعت انسان) و پرسش این است که با برداشتن این ستون‌ها ساختمان نظریه هنوز سرِ پاست یا نه. او اصلاح‌های متأخر مثل «چپ داروینی» پیتر سینگر را هم همین‌گونه می‌خواند. این برداشت شخصی اوست.", "en": "The lecturer's argument: each time a 'pillar' was removed (pure materialism, base/superstructure, the working class as revolutionary force, the changeability of human nature), and the question is whether the building of the theory still stands. He reads later revisions such as Peter Singer's 'Darwinian left' the same way. This is his personal reading.", "nl": "The lecturer's argument: each time a 'pillar' was removed (pure materialism, base/superstructure, the working class as revolutionary force, the changeability of human nature), and the question is whether the building of the theory still stands. He reads later revisions such as Peter Singer's 'Darwinian left' the same way. This is his personal reading."}, "sources": ["src:7c5fc6c369", "src:3bf41fb380"], "flags": ["editor-note"]}, {"text": {"fa": "نقد این استدلال: در فلسفهٔ علم، لاکاتوش نشان داد برنامه‌های پژوهشی معمولاً «هستهٔ سخت» و لایه‌ای از فرضیه‌های کمکی دارند و اصلاح لایهٔ بیرونی در پاسخ به شواهد تازه سالم و رایج است؛ مسئله این است که تغییرها بارور باشند یا صرفاً برای نجات نظریه. همچنین بسیاری از مارکسیست‌ها می‌گویند «غربی» یا «ساختاری» شدن مارکسیسم رشد آن بوده نه تضعیفش. دربارهٔ طبیعت انسان هم مارکس نوشته انسان «مجموعهٔ روابط اجتماعی» است اما از «سرشت نوعی» انسان هم سخن گفته، پس «مارکس ثابت‌نبودن را قبول داشت» ساده‌سازی است.", "en": "A counterpoint: in philosophy of science, Lakatos showed that research programmes typically have a 'hard core' and a belt of auxiliary hypotheses, and revising the outer belt in response to new evidence is normal and healthy; the question is whether the changes are fruitful or merely rescue the theory. Many Marxists also hold that the 'Western' or 'structural' turn developed Marxism rather than weakened it. On human nature, Marx wrote that the human essence is the 'ensemble of social relations' but also spoke of a species-being, so saying 'Marx held human nature to be changeable' is a simplification.", "nl": "A counterpoint: in philosophy of science, Lakatos showed that research programmes typically have a 'hard core' and a belt of auxiliary hypotheses, and revising the outer belt in response to new evidence is normal and healthy; the question is whether the changes are fruitful or merely rescue the theory. Many Marxists also hold that the 'Western' or 'structural' turn developed Marxism rather than weakened it. On human nature, Marx wrote that the human essence is the 'ensemble of social relations' but also spoke of a species-being, so saying 'Marx held human nature to be changeable' is a simplification."}, "sources": ["src:dbb318c707"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "سخنران همین الگو را به روشنفکری دینی در ایران تعمیم می‌دهد و می‌پرسد خط قرمز اصلاح کجاست و چه چیزی از معرفت می‌ماند اگر ارکانش پی‌درپی فدا شود. این قیاس دیدگاه خود اوست و مخالفانش دارند: روشنفکران دینی می‌گویند اصلاح تفسیر دین با تغییر زمانه مشروع است و فقط دفاع از نظام فکری ثابت نیست؛ و میان یک نظریهٔ علمی-اجتماعی و یک باور دینی تفاوت‌های بنیادی هست که قیاس مستقیم را دشوار می‌کند.", "en": "The lecturer extends this pattern to religious intellectualism in Iran and asks where the red line of reform lies and what is left of a body of knowledge if its pillars are sacrificed one by one. This analogy is his own view and has opponents: religious intellectuals argue that reinterpreting religion as times change is legitimate rather than a retreat from a fixed system, and that a social-scientific theory and a religious belief differ so fundamentally that a direct comparison is difficult.", "nl": "The lecturer extends this pattern to religious intellectualism in Iran and asks where the red line of reform lies and what is left of a body of knowledge if its pillars are sacrificed one by one. This analogy is his own view and has opponents: religious intellectuals argue that reinterpreting religion as times change is legitimate rather than a retreat from a fixed system, and that a social-scientific theory and a religious belief differ so fundamentally that a direct comparison is difficult."}, "sources": ["src:7c5fc6c369"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "سخنران در پایان جلسه پیشنهاد می‌کند ادامهٔ درس به دورکیم و کارکردگرایی برود و نظم و تضاد را دو پاسخ متفاوت به جامعهٔ مدرن بداند: مارکس بر تضاد تأکید داشت و دورکیم بر نظم و همبستگی. این تقسیم‌بندی رایج اما سادهٔ نظریه‌های اجتماعی است.", "en": "At the end of the lecture the lecturer proposes moving on to Durkheim and functionalism and treats order and conflict as two different answers to modern society: Marx stressed conflict, Durkheim order and solidarity. This is a common but simple way of dividing social theories.", "nl": "At the end of the lecture the lecturer proposes moving on to Durkheim and functionalism and treats order and conflict as two different answers to modern society: Marx stressed conflict, Durkheim order and solidarity. This is a common but simple way of dividing social theories."}, "sources": ["src:7c5fc6c369"], "flags": ["editor-note"]}], "links": [{"to": "soc:theory", "rel": "part-of", "note": {"fa": "نظریهٔ اجتماعی", "en": "Social theory", "nl": "Social theory"}}, {"to": "soc:frankfurt-critical-theory", "rel": "see-also", "note": {"fa": "یکی از اصلاحات اصلی", "en": "One of the main revisions", "nl": "One of the main revisions"}}, {"to": "soc:anomie", "rel": "contrasts", "note": {"fa": "نظم و همبستگی در برابر تضاد (دورکیم)", "en": "Order and solidarity versus conflict (Durkheim)", "nl": "Order and solidarity versus conflict (Durkheim)"}}, {"to": "phil:paradigms", "rel": "see-also", "note": {"fa": "تغییر نظریه در فلسفهٔ علم", "en": "Theory change in philosophy of science", "nl": "Theory change in philosophy of science"}}], "people": ["core:georg-luk-cs", "core:imre-lakatos", "core:peter-singer"], "sources": ["src:3bf41fb380", "src:7c5fc6c369", "src:dbb318c707"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:reification", "kind": "concept", "title": {"fa": "چیزوارگی (شیءوارگی): از بت‌وارگی کالا تا زندگی روزمره", "en": "Reification: from commodity fetishism to everyday life", "nl": "Verdinglijking"}, "aliases": [], "parent": "soc:theory", "field": "soc:theory", "summary": {"fa": "مارکس نشان داد در بازار مردم ارزش کالاها را قانونی بیرونی و مستقل از خود می‌بینند، در حالی که حاصل کار و رابطهٔ خود آن‌هاست. لوکاچ این ایده را گسترش داد و گفت چنین «چیزی‌شدن» روابط انسانی فقط در اقتصاد نیست و حقوق، دولت، فرهنگ و حتی شیوهٔ فکر کردن را هم فرا می‌گیرد. او برای این کار از مفهوم عقلانی‌شدن ماکس وبر و تحلیل‌های زیمل از پول و زندگی روزمره بهره برد.", "en": "Marx showed that in markets people treat the value of goods as an outside law independent of them, though it comes from their own labour and relations. Lukács widened this: the 'thing-ification' of human relations is not limited to the economy but spreads to law, the state, culture and even habits of thought. He drew on Weber's rationalization and Simmel's analyses of money and daily life.", "nl": "Lukács verbreedde Marx' warenfetisjisme tot verdinglijking: menselijke verhoudingen verschijnen als dingen, in economie, recht en cultuur."}, "points": [{"text": {"fa": "در «سرمایه»، مارکس توضیح می‌دهد که مردم در جامعهٔ سرمایه‌داری فراموش می‌کنند کالا و ارزش آن ساختهٔ کار و روابط خودشان است. کالا مثل چیزی مستقل و تقریباً مقدس دیده می‌شود، و این همان «بت‌وارگی کالا» است.", "en": "In Capital Marx explains that people in capitalist society forget that goods and their value come from their own labour and relations. The commodity looks independent and almost sacred, which is 'commodity fetishism'.", "nl": "In Capital Marx explains that people in capitalist society forget that goods and their value come from their own labour and relations. The commodity looks independent and almost sacred, which is 'commodity fetishism'."}, "sources": ["src:f16bb683da", "src:46394d97d8"], "flags": []}, {"text": {"fa": "به گفتهٔ سخنران، لوکاچ این مفهوم را به «چیزوارگی» بسط می‌دهد: رابطه میان انسان‌ها به شکل رابطه میان چیزها درمی‌آید و این فقط در اقتصاد نیست، بلکه در قانون، دولت، دین و فرهنگ هم دیده می‌شود. انسان خود را تماشاگر قوانینی می‌بیند که خودش ساخته است، نه سازندهٔ آن‌ها.", "en": "Per the lecturer, Lukács extends the idea into 'reification': relations between people take the form of relations between things, not only in the economy but in law, the state, religion and culture. People see themselves as spectators of laws they themselves made, not as their makers.", "nl": "Per the lecturer, Lukács extends the idea into 'reification': relations between people take the form of relations between things, not only in the economy but in law, the state, religion and culture. People see themselves as spectators of laws they themselves made, not as their makers."}, "sources": ["src:f16bb683da", "src:fea88c93a4"], "flags": ["editor-note"]}, {"text": {"fa": "طبق تحلیل لوکاچ، «عقلانی‌شدن» یعنی محاسبه‌پذیر کردن کار؛ برای این کار محصول و کار باید به قطعه‌های تخصصی خرد شود. کارگر به جزئی از ماشین تبدیل می‌شود، زمان به مقدار قابل‌اندازه‌گیری (ساعت) تبدیل می‌شود و کیفیت جای خود را به کمیت می‌دهد. نتیجه این است که همبستگی طبیعی میان کارگران هم از هم می‌پاشد.", "en": "In Lukács's analysis, 'rationalization' means making work calculable, which requires breaking products and labour into specialized fragments. The worker becomes a part of the machine, time becomes a measurable quantity (the clock hour) and quality gives way to quantity. The natural solidarity among workers also fragments.", "nl": "In Lukács's analysis, 'rationalization' means making work calculable, which requires breaking products and labour into specialized fragments. The worker becomes a part of the machine, time becomes a measurable quantity (the clock hour) and quality gives way to quantity. The natural solidarity among workers also fragments."}, "sources": ["src:f16bb683da", "src:fea88c93a4"], "flags": []}, {"text": {"fa": "به گفتهٔ سخنران، لوکاچ از وبر (عقلانی‌شدن و «قفس آهنین») و از زیمل (جامعه‌شناسی خرد؛ پول، مبادله و روابط روزمره در «فلسفهٔ پول») تأثیر گرفت. زیمل به او نشان داد سلطه و از‌خودبیگانگی را می‌توان در تعامل‌های روزمره هم دید، نه فقط در ساختار کلان اقتصادی.", "en": "Per the lecturer, Lukács was influenced by Weber (rationalization and the 'iron cage') and by Simmel (micro-sociology of money, exchange and daily interaction in The Philosophy of Money). Simmel showed him that domination and alienation can be traced in everyday interaction, not only in macro-level economic structure.", "nl": "Per the lecturer, Lukács was influenced by Weber (rationalization and the 'iron cage') and by Simmel (micro-sociology of money, exchange and daily interaction in The Philosophy of Money). Simmel showed him that domination and alienation can be traced in everyday interaction, not only in macro-level economic structure."}, "sources": ["src:f16bb683da", "src:89af2a0a01"], "flags": ["editor-note"]}, {"text": {"fa": "نکتهٔ نقد: لوکاچ در پیشگفتار ۱۹۶۷ بر چاپ جدید کتابش پذیرفت که «عینی‌شدن» (برون‌ریزی کار در محصول) در هر جامعه‌ای لازم است و نباید با «بیگانگی» یکی گرفته شود. منتقدان هم می‌گویند این مفهوم می‌تواند هر سازمان عقلانی را به سلطه تعبیر کند و مرز میان آنچه واقعاً ناعادلانه است و آنچه صرفاً کارآمدسازی است مبهم می‌ماند.", "en": "Critical note: in his 1967 preface to a new edition Lukács conceded that 'objectification' (labour embodied in products) is necessary in any society and should not be equated with alienation. Critics add that the concept can read any rational organisation as domination, blurring the line between genuine injustice and mere efficiency.", "nl": "Critical note: in his 1967 preface to a new edition Lukács conceded that 'objectification' (labour embodied in products) is necessary in any society and should not be equated with alienation. Critics add that the concept can read any rational organisation as domination, blurring the line between genuine injustice and mere efficiency."}, "sources": [], "flags": ["contested", "editor-note"]}], "links": [{"to": "soc:western-marxism", "rel": "part-of", "note": {"fa": "بخشی از مارکسیسم هگلی", "en": "Part of Hegelian Marxism", "nl": "Part of Hegelian Marxism"}}, {"to": "soc:protestant-ethic", "rel": "see-also", "note": {"fa": "عقلانی‌شدن نزد وبر", "en": "Rationalization in Weber", "nl": "Rationalization in Weber"}}, {"to": "soc:presentation-of-self", "rel": "see-also", "note": {"fa": "جامعه‌شناسی خرد زندگی روزمره", "en": "Micro-sociology of everyday life", "nl": "Micro-sociology of everyday life"}}, {"to": "soc:class-consciousness", "rel": "see-also", "note": {"fa": "آگاهی طبقاتی؛ راه عبور از چیزوارگی", "en": "Class consciousness as the way beyond reification", "nl": "Class consciousness as the way beyond reification"}}], "people": ["core:georg-luk-cs", "core:karl-marx", "core:georg-simmel", "core:max-weber"], "sources": ["src:46394d97d8", "src:89af2a0a01", "src:f16bb683da", "src:fea88c93a4"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:hegemony-culture-industry", "kind": "concept", "title": {"fa": "هژمونی فرهنگی گرامشی و پیوند آن با نقد صنعت فرهنگ", "en": "Gramsci's cultural hegemony and the link to the culture-industry critique", "nl": "Culturele hegemonie en cultuurindustrie"}, "aliases": [], "parent": "soc:theory", "field": "soc:theory", "summary": {"fa": "گرامشی با تفسیر مکانیکی و اقتصادی از مارکس مخالف بود و «هژمونی» را مطرح کرد: طبقهٔ حاکم تنها با زور حکومت نمی‌کند، بلکه با رهبری فرهنگی و اخلاقی و پذیرش نسبی مردم حکم می‌راند. اندیشمندان مکتب فرانکفورت، به‌ویژه آدورنو، و بعدها آلتوسر این توجه به فرهنگ، رسانه و نهادهایی مثل مدرسه را ادامه دادند. این دیدگاه‌ها مورد انتقاد هم هستند.", "en": "Gramsci opposed mechanical, economic readings of Marx and developed 'hegemony': the ruling class governs not by force alone but through cultural and moral leadership and a measure of popular consent. Frankfurt School thinkers, especially Adorno, and later Althusser continued this focus on culture, media and institutions such as schools. These views are also contested.", "nl": "Gramsci stelde dat heersers regeren via culturele leiding en instemming, niet alleen via dwang; de Frankfurter Schule ging hierop door."}, "points": [{"text": {"fa": "گرامشی در مقالهٔ «انقلاب علیه سرمایه» (۱۹۱۷) گفت انقلاب بلشویکی نشان داد اراده و کنش سیاسی می‌تواند مسیر تاریخ را عوض کند و نباید مارکس را به قوانین اقتصادی خشک تقلیل داد.", "en": "In 'The Revolution against Capital' (1917) Gramsci argued that the Bolshevik revolution showed political will and action can change history's course, and that Marx should not be reduced to rigid economic laws.", "nl": "In 'The Revolution against Capital' (1917) Gramsci argued that the Bolshevik revolution showed political will and action can change history's course, and that Marx should not be reduced to rigid economic laws."}, "sources": ["src:f16bb683da", "src:f52abdd0f4"], "flags": []}, {"text": {"fa": "به گفتهٔ سخنران، هژمونی یعنی رهبری فرهنگی طبقهٔ حاکم؛ این رهبری بیشتر غیرمستقیم و از راه گفتمان‌ها و ایده‌های فرهنگی اعمال می‌شود تا با پلیس و قانون.", "en": "Per the lecturer, hegemony means the cultural leadership of the ruling class, exercised mostly indirectly through discourses and cultural ideas rather than through police and law.", "nl": "Per the lecturer, hegemony means the cultural leadership of the ruling class, exercised mostly indirectly through discourses and cultural ideas rather than through police and law."}, "sources": ["src:f16bb683da", "src:f52abdd0f4"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، گرامشی می‌گفت پس از انقلاب کارگری حزب و روشنفکران باید علاوه بر اقتصاد و دولت، رهبری فرهنگی جامعه را هم به دست بگیرند. نکتهٔ تصحیحی: در «دفترهای زندان» گرامشی بیشتر بر این تأکید داشت که یک طبقه باید پیش از تصرف دولت در جامعهٔ مدنی هژمونی بسازد («جنگ موضعی»). همچنین واژهٔ هژمونی پیش از او در مارکسیسم روسی به کار رفته بود.", "en": "Per the lecturer, Gramsci held that after a workers' revolution the party and intellectuals must also take the cultural leadership of society, besides the economy and the state. Corrective note: in the Prison Notebooks Gramsci mostly stressed that a class must build hegemony in civil society before seizing the state (a 'war of position'). The word hegemony was also used in Russian Marxism before him.", "nl": "Per the lecturer, Gramsci held that after a workers' revolution the party and intellectuals must also take the cultural leadership of society, besides the economy and the state. Corrective note: in the Prison Notebooks Gramsci mostly stressed that a class must build hegemony in civil society before seizing the state (a 'war of position'). The word hegemony was also used in Russian Marxism before him."}, "sources": ["src:f16bb683da", "src:f52abdd0f4"], "flags": ["editor-note", "contested"]}, {"text": {"fa": "به گفتهٔ سخنران، متفکران مکتب فرانکفورت نشان دادند چیزوارگی فقط در اقتصاد نیست و رسانه، هنر، موسیقی و سرگرمی هم ابزار «آگاهی دروغین» شده‌اند. نمونه‌اش جملهٔ آدورنو است که (به گفتهٔ سخنران) می‌گوید امروز مردم بیشتر سرگرم می‌شوند تا سرکوب. او همین نگاه را دربارهٔ آلتوسر و نقش مدرسه و دیگر نهادها در بازتولید نظام هم می‌آورد.", "en": "Per the lecturer, Frankfurt School thinkers showed that reification is not limited to the economy: media, art, music and entertainment became tools of 'false consciousness'. His example is Adorno's remark (as he reports it) that people today are entertained rather than repressed. He applies the same view to Althusser's account of schools and other institutions reproducing the system.", "nl": "Per the lecturer, Frankfurt School thinkers showed that reification is not limited to the economy: media, art, music and entertainment became tools of 'false consciousness'. His example is Adorno's remark (as he reports it) that people today are entertained rather than repressed. He applies the same view to Althusser's account of schools and other institutions reproducing the system."}, "sources": ["src:f16bb683da", "src:0bc2da68cc"], "flags": ["editor-note"]}, {"text": {"fa": "نکتهٔ نقد: آلتوسر خوانش هگلی را رد می‌کرد و ساختارگرا بود، پس او را نمی‌توان ادامهٔ لوکاچ دانست. نقد صنعت فرهنگ را هم گاهی نخبه‌گرایانه خوانده‌اند؛ مطالعات فرهنگی (مثلاً استوارت هال) نشان می‌دهد مخاطبان معمولاً فعال‌اند و پیام را متفاوت تفسیر می‌کنند. منتقدان لیبرال نیز می‌گویند بازار فرهنگ بازتاب ترجیحات واقعی مردم است. روایت سخنران از پژوهش‌های آدورنو دربارهٔ تلویزیون آمریکا هم ساده‌شده است.", "en": "Critical note: Althusser rejected the Hegelian reading and was a structuralist, so he cannot simply be placed in Lukács's line. The culture-industry critique has also been called elitist; cultural studies (e.g. Stuart Hall) shows audiences are often active and read messages differently. Liberal critics add that cultural markets reflect real preferences. The lecturer's account of Adorno's research on American television is also simplified.", "nl": "Critical note: Althusser rejected the Hegelian reading and was a structuralist, so he cannot simply be placed in Lukács's line. The culture-industry critique has also been called elitist; cultural studies (e.g. Stuart Hall) shows audiences are often active and read messages differently. Liberal critics add that cultural markets reflect real preferences. The lecturer's account of Adorno's research on American television is also simplified."}, "sources": ["src:8151e96d6a"], "flags": ["contested", "editor-note"]}], "links": [{"to": "soc:western-marxism", "rel": "part-of", "note": {"fa": "بخشی از مارکسیسم هگلی", "en": "Part of Hegelian Marxism", "nl": "Part of Hegelian Marxism"}}, {"to": "soc:reification", "rel": "bridges", "note": {"fa": "پل از چیزوارگی به نقد فرهنگ", "en": "Bridge from reification to cultural critique", "nl": "Bridge from reification to cultural critique"}}, {"to": "soc:social-construction", "rel": "see-also", "note": {"fa": "ساخت اجتماعی واقعیت", "en": "Social construction of reality", "nl": "Social construction of reality"}}, {"to": "phil:political", "rel": "see-also", "note": {"fa": "فلسفهٔ سیاسی", "en": "Political philosophy", "nl": "Political philosophy"}}], "people": ["core:antonio-gramsci", "core:theodor-w-adorno", "core:louis-althusser", "core:stuart-hall"], "sources": ["src:0bc2da68cc", "src:8151e96d6a", "src:f16bb683da", "src:f52abdd0f4"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:sociological-imagination", "kind": "concept", "title": {"fa": "بینش جامعه‌شناختی", "en": "The sociological imagination", "nl": "De sociologische verbeelding"}, "aliases": [], "parent": "soc:theory", "field": "soc:theory", "summary": {"fa": "توان دیدن پیوند میان «گرفتاری‌های شخصی» و «مسائل عمومی»: بیکاری یک نفر مشکل اوست؛ بیکاری یک‌پنجم جامعه مسئله‌ای ساختاری است که با نصیحت فردی حل نمی‌شود.", "en": "The capacity to see the link between \"personal troubles\" and \"public issues\": one person's unemployment is their trouble; a fifth of society unemployed is a structural issue no individual advice will fix.", "nl": "Het vermogen om het verband te zien tussen \"persoonlijke moeilijkheden\" en \"publieke kwesties\": de werkloosheid van één persoon is diens probleem; een vijfde van de samenleving werkloos is een structurele kwestie die geen individueel advies oplost."}, "points": [{"text": {"fa": "میلز (۱۹۵۹): جامعه‌شناسی یعنی پیوند زدن زندگی‌نامه و تاریخ؛ هر مشکل فردی را باید پرسید در چه ساختاری و در چه دوره‌ای پدید آمده.", "en": "Mills (1959): sociology means connecting biography and history; of every personal problem ask in what structure and what era it arose.", "nl": "Mills (1959): sociology means connecting biography and history; of every personal problem ask in what structure and what era it arose."}, "sources": ["src:accf4bea5e"], "flags": []}, {"text": {"fa": "این نگاه پادزهر «روان‌شناسی‌زدگی» است: تبدیل مسائل ساختاری (مسکن، اشتغال) به ضعف اراده یا شخصیت افراد.", "en": "This view is the antidote to \"psychologism\": turning structural problems (housing, jobs) into individuals' failures of will or character.", "nl": "This view is the antidote to \"psychologism\": turning structural problems (housing, jobs) into individuals' failures of will or character."}, "sources": ["src:accf4bea5e"], "flags": []}], "links": [{"to": "psy:medicalization", "rel": "bridges", "note": {"fa": "پزشکی‌سازی در ویکی روان", "en": "Medicalization in the psychology wiki", "nl": "Medicalization in the psychology wiki"}}, {"to": "soc:social-construction", "rel": "see-also", "note": {"fa": "ساخت اجتماعی واقعیت", "en": "The social construction of reality", "nl": "The social construction of reality"}}], "people": ["core:c-wright-mills"], "sources": ["src:accf4bea5e"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:network-society", "kind": "concept", "title": {"fa": "جامعهٔ شبکه‌ای", "en": "The network society", "nl": "De netwerkmaatschappij"}, "aliases": [], "parent": "soc:space", "field": "soc:space", "summary": {"fa": "کاستلز: در عصر اطلاعات، قدرت و ثروت در «فضای جریان‌ها» (شبکه‌های مالی، رسانه‌ای، فنی) جابه‌جا می‌شود و از «فضای مکان‌ها» (شهر، کشور) جدا می‌افتد؛ هویت‌های مقاومت (ملی، دینی، محلی) پاسخِ آدم‌های جامانده‌اند.", "en": "Castells: in the information age, power and wealth move in the \"space of flows\" (financial, media, technical networks) and come loose from the \"space of places\" (city, country); resistance identities (national, religious, local) are the response of those left behind.", "nl": "Castells: in het informatietijdperk bewegen macht en rijkdom in de \"ruimte van stromen\" (financiële, media-, technische netwerken) en raken los van de \"ruimte van plaatsen\" (stad, land); verzetsidentiteiten (nationaal, religieus, lokaal) zijn het antwoord van
