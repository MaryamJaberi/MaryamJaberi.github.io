chy defined itself through religion and the church, which is why German philosophers (Kant, Hegel, Schelling, Feuerbach) wrote so much on religion and why criticising Christianity weakened the monarchy's intellectual foundations. He notes that Hegel, Schelling and Hölderlin were theology students who shared rooms.", "nl": "Per the lecturer, in Prussia the monarchy defined itself through religion and the church, which is why German philosophers (Kant, Hegel, Schelling, Feuerbach) wrote so much on religion and why criticising Christianity weakened the monarchy's intellectual foundations. He notes that Hegel, Schelling and Hölderlin were theology students who shared rooms."}, "sources": ["src:f6708143e0"], "flags": ["editor-note"]}, {"text": {"fa": "مارکس نوشت انسان دین را می‌سازد، نه دین انسان را؛ و رنج دینی هم بیان رنج واقعی است و هم اعتراض به آن، «آه موجود ستمدیده» و «قلب جهانی بی‌قلب». او افیون بودن دین را در کنار نیاز به خوشبختی واقعی می‌گذارد و می‌گوید نقد دین در واقع نقد جهانی است که دین «عطر معنوی» آن است.", "en": "Marx wrote that man makes religion, not religion man; religious suffering is both an expression of real suffering and a protest against it, 'the sigh of the oppressed creature', 'the heart of a heartless world'. Calling religion the opium of the people goes with the demand for real happiness, and criticising religion is criticising the world whose spiritual aroma it is.", "nl": "Marx wrote that man makes religion, not religion man; religious suffering is both an expression of real suffering and a protest against it, 'the sigh of the oppressed creature', 'the heart of a heartless world'. Calling religion the opium of the people goes with the demand for real happiness, and criticising religion is criticising the world whose spiritual aroma it is."}, "sources": ["src:f6708143e0", "src:a5148443c8"], "flags": []}, {"text": {"fa": "سخنران می‌گوید برخلاف تصویر رایج در ایران که مارکس را «ضددین» می‌شناسد، مارکس می‌خواست از نقد انتزاعی دین عبور کند و به شرایط مادی بپردازد، و این نگاه به دین به‌عنوان نهادی اجتماعی با کارکردهای متعدد به دورکیم نزدیک است. این تفسیر از مارکس نظر خود سخنران است.", "en": "Per the lecturer, contrary to the common Iranian image of Marx as simply anti-religion, Marx wanted to move past abstract criticism of religion to material conditions, and this treatment of religion as a social institution with many functions is close to Durkheim. This reading of Marx is the lecturer's own.", "nl": "Per the lecturer, contrary to the common Iranian image of Marx as simply anti-religion, Marx wanted to move past abstract criticism of religion to material conditions, and this treatment of religion as a social institution with many functions is close to Durkheim. This reading of Marx is the lecturer's own."}, "sources": ["src:f6708143e0", "src:687918f638"], "flags": ["editor-note"]}, {"text": {"fa": "تصحیح: سخنران ابتدا جملهٔ «دین افیون توده‌هاست» را به «ایدئولوژی آلمانی» نسبت می‌دهد، ولی این جمله از «مقدمهٔ نقد فلسفهٔ حق هگل» (۱۸۴۳-۱۸۴۴) است. همچنین مارکس به‌طور کلی دین را توهمی می‌دانست که باید با از میان رفتن شرایط نیازمند آن کنار برود؛ بنابراین «غیر ضددینی بودن» او تنها تا حدی درست است و او در عمل منتقد دین و فعالان مارکسیست بعدی اغلب ضددین بودند.", "en": "Correction: the lecturer first attributes the 'opium of the people' line to The German Ideology, but it comes from the 'Introduction to a Contribution to the Critique of Hegel's Philosophy of Right' (1843-44). Marx also regarded religion as an illusion that should fade once the conditions that need it are gone, so describing him as not anti-religious is only partly right; he was a critic of religion and many later Marxists were openly hostile to it.", "nl": "Correction: the lecturer first attributes the 'opium of the people' line to The German Ideology, but it comes from the 'Introduction to a Contribution to the Critique of Hegel's Philosophy of Right' (1843-44). Marx also regarded religion as an illusion that should fade once the conditions that need it are gone, so describing him as not anti-religious is only partly right; he was a critic of religion and many later Marxists were openly hostile to it."}, "sources": [], "flags": ["contested", "editor-note"]}], "links": [{"to": "soc:marx-break-from-hegel", "rel": "part-of", "note": {"fa": "گسست مارکس از هگل", "en": "Marx's break from Hegel", "nl": "Marx's break from Hegel"}}, {"to": "soc:secularization", "rel": "see-also", "note": {"fa": "سکولار شدن", "en": "Secularisation", "nl": "Secularisation"}}, {"to": "soc:anomie", "rel": "contrasts", "note": {"fa": "بیگانگی نزد مارکس در برابر آنومی نزد دورکیم", "en": "Marx's alienation versus Durkheim's anomie", "nl": "Marx's alienation versus Durkheim's anomie"}}], "people": ["core:ludwig-feuerbach", "core:david-friedrich-strauss", "core:mile-durkheim"], "sources": ["src:687918f638", "src:a5148443c8", "src:f6708143e0"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:comte-social-physics", "kind": "concept", "title": {"fa": "فیزیک اجتماعی کنت: کل‌نگری، ایستایی و پویایی، پیوند خرد و کلان", "en": "Comte's social physics: holism, statics and dynamics, linking micro and macro", "nl": "Comtes sociale fysica: holisme, statica en dynamica, micro en macro"}, "aliases": [], "parent": "soc:theory", "field": "soc:theory", "summary": {"fa": "کنت می‌خواست جامعه را با روش علوم طبیعی بررسی کند و نخست نامش را «فیزیک اجتماعی» گذاشت. او می‌گفت فرد را باید در بستر خانواده، جامعه و تاریخ فهمید، و جامعه‌شناسی را به دو بخش ایستا و پویا تقسیم می‌کرد. سخنران از این ایده‌ها نتیجه می‌گیرد که پژوهش دربارهٔ رفتار روزمره باید به نهادها و فرهنگ بزرگ‌تر وصل شود.", "en": "Comte wanted to study society with the methods of the natural sciences and first called it 'social physics'. He held that individuals must be understood within family, society and history, and divided sociology into statics and dynamics. The lecturer draws the lesson that research on everyday behaviour must be linked to larger institutions and culture.", "nl": "Comte wilde de samenleving met natuurwetenschappelijke methoden bestuderen en noemde dit eerst 'sociale fysica'. Hij zag het individu als product van gezin, samenleving en geschiedenis."}, "points": [{"text": {"fa": "کنت از آشفتگی پس از انقلاب فرانسه ناراضی بود؛ نه مثل سنت‌گرایانی چون دو میستر خواهان بازگشت به قرون وسطا بود و نه طرفدار انقلاب سیاسی. او اصلاح و «انقلاب در تفکر» را راه می‌دانست و شعار او نظم و پیشرفت بود.", "en": "Comte was dismayed by the disorder after the French Revolution; unlike traditionalists such as de Maistre he did not want a return to the Middle Ages, nor did he favour political revolution. He saw reform and a 'revolution in thought' as the way, under the banner of order and progress.", "nl": "Comte was dismayed by the disorder after the French Revolution; unlike traditionalists such as de Maistre he did not want a return to the Middle Ages, nor did he favour political revolution. He saw reform and a 'revolution in thought' as the way, under the banner of order and progress."}, "sources": ["src:9d7e993f4f", "src:5f4bccd5d0"], "flags": []}, {"text": {"fa": "به‌جای آغاز از فرد، باید از کل بزرگ‌تر شروع کرد: فرد محصول خانواده است، خانواده محصول جامعه و فرهنگ، و جامعه محصول تاریخ. سخنران می‌گوید این نگاه بعدها به کارکردگرایان ساختاری کمک کرد که جامعه را نظامی به‌هم‌پیوسته می‌دیدند.", "en": "Rather than starting from the individual, start from the larger whole: the individual is a product of the family, the family of society and culture, and society of history. The lecturer says this outlook later served structural functionalists, who saw society as an interconnected system.", "nl": "Rather than starting from the individual, start from the larger whole: the individual is a product of the family, the family of society and culture, and society of history. The lecturer says this outlook later served structural functionalists, who saw society as an interconnected system."}, "sources": ["src:9d7e993f4f", "src:5f4bccd5d0"], "flags": ["editor-note"]}, {"text": {"fa": "جامعه‌شناسی ایستا سازمان‌ها و نهادهای نسبتاً پایدار را بررسی می‌کند و جامعه‌شناسی پویا تغییرات اجتماعی را. سخنران می‌گوید کنت بخش پویا را مهم‌تر می‌دانست.", "en": "Static sociology studies relatively stable organisations and institutions; dynamic sociology studies social change. The lecturer says Comte valued the dynamic part more.", "nl": "Static sociology studies relatively stable organisations and institutions; dynamic sociology studies social change. The lecturer says Comte valued the dynamic part more."}, "sources": ["src:9d7e993f4f", "src:5f4bccd5d0"], "flags": []}, {"text": {"fa": "به گفتهٔ سخنران، کنت می‌خواست پژوهشگر یافته‌های سطح خرد (رفتار روزمره، زبان، تعامل) را به سطح کلان (نهادها و فرهنگ) وصل کند، وگرنه کار ناقص می‌ماند. او نتیجه می‌گیرد که بسیاری از دغدغه‌ها و مشکلات به‌ظاهر شخصی منطق اجتماعی دارند و فرهنگ (مثلاً شرم) گاهی مانع دیده‌شدن آن‌ها می‌شود.", "en": "Per the lecturer, Comte wanted researchers to connect micro-level findings (daily behaviour, language, interaction) with macro-level ones (institutions, culture), or the work stays incomplete. He concludes that many seemingly personal worries have a social logic, and that culture (e.g. shame) sometimes hides this.", "nl": "Per the lecturer, Comte wanted researchers to connect micro-level findings (daily behaviour, language, interaction) with macro-level ones (institutions, culture), or the work stays incomplete. He concludes that many seemingly personal worries have a social logic, and that culture (e.g. shame) sometimes hides this."}, "sources": ["src:9d7e993f4f", "src:d845d0f14f"], "flags": ["editor-note"]}, {"text": {"fa": "این تفسیر سخنران است نه نظر خود کنت: واژه‌های خرد و کلان در قرن بیستم رایج شدند و کنت دو سطح تحلیلی را با این نام‌ها نمی‌شناخت. کنت هر دو بخش ایستا و پویا را لازم می‌دانست و شعارش «نظم و پیشرفت» بود. باور به اینکه جامعه را می‌شود با روش فیزیک بررسی کرد هم محل مناقشه است؛ جامعه‌شناسانی چون وبر بر فهم معنای کنش تأکید کردند. فهرست پیشینیان (مثلاً لاک و روسو) در سخنرانی بسیار فشرده است و دقیق نیست.", "en": "This is the lecturer's reading, not Comte's own: the terms micro and macro became common in the 20th century and Comte did not use them for two analytic levels. Comte regarded both statics and dynamics as necessary, under the motto 'order and progress'. The idea that society can be studied by the methods of physics is also disputed; Weber and others stressed understanding the meaning of action. The lecture's quick sketch of Locke, Rousseau and Hobbes is also too compressed to be accurate.", "nl": "This is the lecturer's reading, not Comte's own: the terms micro and macro became common in the 20th century and Comte did not use them for two analytic levels. Comte regarded both statics and dynamics as necessary, under the motto 'order and progress'. The idea that society can be studied by the methods of physics is also disputed; Weber and others stressed understanding the meaning of action. The lecture's quick sketch of Locke, Rousseau and Hobbes is also too compressed to be accurate."}, "sources": ["src:5f4bccd5d0"], "flags": ["contested", "editor-note"]}], "links": [{"to": "soc:comte-three-stages", "rel": "part-of", "note": {"fa": "مراحل سه‌گانهٔ اندیشه در نظر کنت", "en": "Comte's three stages of thought", "nl": "Comte's three stages of thought"}}, {"to": "soc:sociological-imagination", "rel": "see-also", "note": {"fa": "پیوند مسئلهٔ شخصی و ساختار اجتماعی", "en": "Linking personal troubles and social structure", "nl": "Linking personal troubles and social structure"}}, {"to": "soc:industrial-modernity-backdrop", "rel": "see-also", "note": {"fa": "زمینهٔ تاریخی پاسخ کنت", "en": "The historical backdrop to Comte's response", "nl": "The historical backdrop to Comte's response"}}], "people": ["core:auguste-comte", "core:mile-durkheim"], "sources": ["src:5f4bccd5d0", "src:9d7e993f4f", "src:d845d0f14f"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:comte-three-stages", "kind": "concept", "title": {"fa": "آگوست کنت و قانون سه مرحله‌ای اندیشه", "en": "Auguste Comte and the law of three stages", "nl": "Auguste Comte en de wet van de drie stadia"}, "aliases": [], "parent": "soc:theory", "field": "soc:theory", "summary": {"fa": "آگوست کنت (۱۷۹۸–۱۸۵۷) واژهٔ «جامعه‌شناسی» را ساخت و گفت اندیشهٔ بشر سه مرحله را می‌گذراند: الهیاتی، مابعدالطبیعی و اثباتی. در مرحلهٔ اثباتی دیگر از ریشه و آغاز جهان نمی‌پرسیم، بلکه قانون‌های پدیده‌ها را از راه مشاهده و مقایسه می‌جوییم. کنت جامعه‌شناسی را تاج علوم می‌دانست.", "en": "Auguste Comte (1798-1857) coined the word 'sociology' and held that human thought passes through three stages: theological, metaphysical and positive. In the positive stage we stop asking about ultimate origins and look for the laws of phenomena through observation and comparison. He regarded sociology as the crown of the sciences.", "nl": "Auguste Comte (1798-1857) bedacht het woord 'sociologie' en zag het denken drie stadia doorlopen: theologisch, metafysisch en positief. In het positieve stadium zoekt men wetten via waarneming en vergelijking."}, "points": [{"text": {"fa": "کنت منشی و همکار سن‌سیمون بود، بعد از او جدا شد، و شش‌جلدی «درس‌های فلسفهٔ اثباتی» را نوشت. به گفتهٔ سخنران، نداشتن جایگاه دانشگاهی مانع شد او جامعه‌شناسی را وارد دانشگاه کند؛ دورکیم بعدها آن را رشتهٔ دانشگاهی کرد.", "en": "Comte was Saint-Simon's secretary and collaborator, later broke with him, and wrote the six-volume Course of Positive Philosophy. Per the lecturer, his lack of an academic position kept him from bringing sociology into the university; Durkheim later made it an academic discipline.", "nl": "Comte was Saint-Simon's secretary and collaborator, later broke with him, and wrote the six-volume Course of Positive Philosophy. Per the lecturer, his lack of an academic position kept him from bringing sociology into the university; Durkheim later made it an academic discipline."}, "sources": ["src:9d7e993f4f", "src:5f4bccd5d0"], "flags": ["editor-note"]}, {"text": {"fa": "مرحلهٔ الهیاتی: رویدادها را به خواست خدایان نسبت می‌دهیم. مرحلهٔ مابعدالطبیعی: به جای خدایان، نیروهای انتزاعی مثل «طبیعت» را علت می‌گیریم. مرحلهٔ اثباتی: به‌جای پرسش از علت نهایی، قانون‌های پدیده‌ها را می‌شناسیم. سخنران تاریخ‌های تقریبی ۱۳۰۰ و ۱۸۰۰ را برای مرزها می‌آورد.", "en": "Theological stage: events are put down to the will of gods. Metaphysical stage: abstract forces such as 'nature' replace the gods as causes. Positive stage: instead of asking about ultimate causes we identify the laws of phenomena. The lecturer gives rough dates of about 1300 and 1800 for the boundaries.", "nl": "Theological stage: events are put down to the will of gods. Metaphysical stage: abstract forces such as 'nature' replace the gods as causes. Positive stage: instead of asking about ultimate causes we identify the laws of phenomena. The lecturer gives rough dates of about 1300 and 1800 for the boundaries."}, "sources": ["src:9d7e993f4f", "src:5f4bccd5d0"], "flags": []}, {"text": {"fa": "روش علمی در این روایت سه ستون دارد: مشاهده، مقایسه و تکرارپذیری. سخنران می‌افزاید که گزارهٔ علمی باید ابطال‌پذیر باشد، یعنی بشود در اصل نادرستی‌اش را نشان داد.", "en": "The scientific method in this account rests on observation, comparison and repeatability. The lecturer adds that a scientific claim must be falsifiable, i.e. one must be able in principle to show it wrong.", "nl": "The scientific method in this account rests on observation, comparison and repeatability. The lecturer adds that a scientific claim must be falsifiable, i.e. one must be able in principle to show it wrong."}, "sources": ["src:9d7e993f4f"], "flags": []}, {"text": {"fa": "به گفتهٔ سخنران، مهم‌ترین تغییر جهان صنعتی این بود که دانشمندان جای کشیشان را به‌عنوان پاسخ‌دهندگان به پرسش‌های بزرگ گرفتند و امروز مردم پرسش‌هایشان را از علم و فناوری می‌پرسند؛ او این را به هشدار نیل پستمن دربارهٔ اتکای بیش از حد به فناوری پیوند می‌زند.", "en": "Per the lecturer, the key shift of the industrial world is that scientists replaced priests as the answerers of big questions, and people now bring their questions to science and technology; he ties this to Neil Postman's warning about over-reliance on technology.", "nl": "Per the lecturer, the key shift of the industrial world is that scientists replaced priests as the answerers of big questions, and people now bring their questions to science and technology; he ties this to Neil Postman's warning about over-reliance on technology."}, "sources": ["src:9d7e993f4f"], "flags": ["editor-note"]}, {"text": {"fa": "قانون سه مرحله‌ای امروز بیشتر به‌عنوان طرحی خطی و تاریخ‌محور و اروپا‌محور نقد می‌شود: جامعه‌ها همیشه از این مراحل نمی‌گذرند و مراحل با هم هم‌زمان دیده می‌شوند. همچنین اثبات‌گرایی کنت با ابطال‌پذیری پوپر یکی نیست؛ پوپر درست‌نمایی تجربی را معیار نمی‌دانست و اثبات‌گرایی را نقد کرد. کنت خودش در پایان عمر «دین انسانیت» را پیشنهاد داد که با تصویر او از دین‌زدایی ناسازگار به نظر می‌رسد.", "en": "The law of three stages is now widely criticised as linear, teleological and Eurocentric: societies do not always pass through the stages, and modes of thought coexist. Comte's positivism is also not the same as Popper's falsifiability; Popper criticised positivist verificationism. Late in life Comte proposed a 'Religion of Humanity', which sits oddly with his story of religion being outgrown.", "nl": "The law of three stages is now widely criticised as linear, teleological and Eurocentric: societies do not always pass through the stages, and modes of thought coexist. Comte's positivism is also not the same as Popper's falsifiability; Popper criticised positivist verificationism. Late in life Comte proposed a 'Religion of Humanity', which sits oddly with his story of religion being outgrown."}, "sources": ["src:5f4bccd5d0", "src:13f4975a5d"], "flags": ["contested", "editor-note"]}], "links": [{"to": "phil:falsification", "rel": "contrasts", "note": {"fa": "ابطال‌پذیری پوپر در برابر اثبات‌گرایی کنت", "en": "Popper's falsifiability versus Comte's positivism", "nl": "Popper's falsifiability versus Comte's positivism"}}, {"to": "soc:secularization", "rel": "see-also", "note": {"fa": "جایگزینی دین با علم و سکولارشدن", "en": "Replacement of religion by science; secularisation", "nl": "Replacement of religion by science; secularisation"}}, {"to": "soc:comte-social-physics", "rel": "part-of", "note": {"fa": "روش و فیزیک اجتماعی کنت", "en": "Comte's method and social physics", "nl": "Comte's method and social physics"}}], "people": ["core:auguste-comte", "core:henri-de-saint-simon", "core:karl-popper", "core:neil-postman"], "sources": ["src:13f4975a5d", "src:5f4bccd5d0", "src:9d7e993f4f"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:marx-historical-materialism", "kind": "concept", "title": {"fa": "ماتریالیسم تاریخی و مبارزهٔ طبقاتی نزد مارکس", "en": "Marx's historical materialism and class struggle", "nl": "Het historisch materialisme en de klassenstrijd bij Marx"}, "aliases": [], "parent": "soc:theory", "field": "soc:theory", "summary": {"fa": "مارکس در «ایدئولوژی آلمانی» و «مانیفست» تاریخ را نه حاصل حرکت ایده‌ها، بلکه حاصل شیوهٔ تولید و کشمکش طبقات می‌داند. به‌نظر او آگاهی انسان از شرایط زندگی مادی‌اش برمی‌خیزد و فلسفهٔ جدا از تاریخ واقعی معنایی ندارد. این دیدگاه پایهٔ نظریه‌های تضاد در جامعه‌شناسی شد، اما از همان آغاز دربارهٔ دوگانه‌انگاری و پایان تاریخ نقد شده است.", "en": "In The German Ideology and the Manifesto, Marx explains history through the way societies produce things and through conflict between classes, not through the movement of ideas. Human consciousness grows out of material life, and philosophy cut off from real history means little. This became the root of conflict theory in sociology, but it has been criticised from the start for its two-camp picture and its end-of-history hope.", "nl": "Marx verklaart de geschiedenis uit de productiewijze en de klassenstrijd, niet uit ideeën. Het bewustzijn volgt uit het materiële leven. Dit werd de wortel van de conflicttheorie, maar het is ook sterk bekritiseerd."}, "points": [{"text": {"fa": "به گفتهٔ سخنران، مارکس حدود ۱۸۴۷–۱۸۴۸ از فیلسوفی جوان به جامعه‌شناس، اقتصاددان و کنشگر انقلابی تبدیل شد و نقطهٔ شروعش را از «انتزاع» به «کنش انسانی» برد؛ سخنران این دیدگاه را از ریمون آرون می‌گیرد.", "en": "Per the lecturer (following Aron), around 1847-48 Marx moved from young philosopher to sociologist, economist and revolutionary, starting from human practice instead of abstraction.", "nl": "Per the lecturer (following Aron), around 1847-48 Marx moved from young philosopher to sociologist, economist and revolutionary, starting from human practice instead of abstraction."}, "sources": ["src:4d1925ef85", "src:451d51da9a"], "flags": ["editor-note"]}, {"text": {"fa": "در «ایدئولوژی آلمانی» (۱۸۴۵–۱۸۴۶) مارکس و انگلس می‌نویسند که ایده‌ها و آگاهی در دل کار و داد‌وستد مادی مردم ساخته می‌شوند و این زندگی است که آگاهی را شکل می‌دهد، نه برعکس. نقد اصلی متوجه هگل است که تاریخ را حرکت «روح» یا آگاهی کلی می‌دید. مارکس ایدئولوژی را مثل تصویر وارونه در دوربین تاریک توصیف می‌کند.", "en": "In The German Ideology (1845-46) Marx and Engels argue that ideas and consciousness are formed inside people's material activity and exchange: life shapes consciousness, not the reverse. The target is Hegel, who read history as the movement of Spirit. Ideology is compared to an inverted image in a camera obscura.", "nl": "In The German Ideology (1845-46) Marx and Engels argue that ideas and consciousness are formed inside people's material activity and exchange: life shapes consciousness, not the reverse. The target is Hegel, who read history as the movement of Spirit. Ideology is compared to an inverted image in a camera obscura."}, "sources": ["src:4d1925ef85", "src:f327aa1c7e"], "flags": []}, {"text": {"fa": "در «مانیفست» تاریخ جوامع پیشین «تاریخ مبارزهٔ طبقاتی» نامیده می‌شود: آزاد و برده، ارباب و رعیت، استادکار و شاگرد. ماتریالیسم در اینجا یعنی عامل دگرگونی تاریخ نیروهای تولید است، نه ایده‌ها؛ نه این‌که جهان از «ماده» ساخته شده است. به همین دلیل مارکس با نگاه ایده‌محور هگل و کنت دربارهٔ مراحل تاریخ فاصله می‌گیرد.", "en": "In the Manifesto, the history of earlier societies is called a history of class struggle: freeman and slave, lord and serf, master and journeyman. Materialism here means that changing forces of production drive history, not ideas; it is not a claim that the world is made of matter. This separates Marx from the idea-centred stage theories of Hegel and Comte.", "nl": "In the Manifesto, the history of earlier societies is called a history of class struggle: freeman and slave, lord and serf, master and journeyman. Materialism here means that changing forces of production drive history, not ideas; it is not a claim that the world is made of matter. This separates Marx from the idea-centred stage theories of Hegel and Comte."}, "sources": ["src:4d1925ef85", "src:a8f809b841"], "flags": []}, {"text": {"fa": "به گفتهٔ سخنران، تصویر مارکس از جهان اجتماعی دوقطبی است (ستمگر/ستمدیده، بورژوا/پرولتر) و طبقات میانی را بی‌نقش تاریخی می‌داند. او همین دوقطبی و باور به «بهشتی» در پایان تاریخ را شبیه ساختار اسطوره‌ای و دینی خیر و شر می‌بیند و آن را نقطهٔ ضعف می‌داند. سخنران همچنین می‌گوید این نگاه الهام‌بخش «تضادگرایی» شد؛ در تضادگرایی هر آسیب اجتماعی از استثمار یک گروه به دست گروه دیگر توضیح داده می‌شود.", "en": "Per the lecturer, Marx pictures the social world as two camps (oppressor/oppressed, bourgeoisie/proletariat), gives middle strata no historical role, and he compares this two-sided struggle and the hope of a final paradise to mythic and religious good-versus-evil patterns, which he treats as a weakness. He adds that it inspired conflict theory, where social problems are explained by one group exploiting another.", "nl": "Per the lecturer, Marx pictures the social world as two camps (oppressor/oppressed, bourgeoisie/proletariat), gives middle strata no historical role, and he compares this two-sided struggle and the hope of a final paradise to mythic and religious good-versus-evil patterns, which he treats as a weakness. He adds that it inspired conflict theory, where social problems are explained by one group exploiting another."}, "sources": ["src:4d1925ef85"], "flags": ["editor-note"]}, {"text": {"fa": "نکات احتیاطی: (۱) «تز–آنتی‌تز–سنتز» بیشتر به فیشته و برداشت‌های بعدی از هگل برمی‌گردد و خود مارکس کمتر آن را به کار برد. (۲) این‌که مارکس پس از ۱۸۴۸ دیگر فلسفه نمی‌ورزید مورد مناقشه است؛ کسانی مانند لوکاچ و مارکوزه بین مارکس جوان و پیر پیوستگی می‌بینند، و آلتوسر برعکس از «گسست معرفتی» گفت. (۳) این‌که مارکس پایان تاریخ را «بهشت» دیده باشد ساده‌سازی است؛ او از پایان «پیش‌تاریخ» و مبارزهٔ طبقاتی می‌گفت و معلوم نیست آیندهٔ بی‌طبقه را بی‌تغییر می‌دید. (۴) مارکس در «تزهایی دربارهٔ فویرباخ» ذات انسان را «مجموعهٔ مناسبات اجتماعی» می‌نامد و این با ادعای «انسان ذات ندارد» یکی نیست؛ نورمن جراس از وجود یک مفهوم ثابت از طبیعت انسان نزد او دفاع کرده است.", "en": "Cautions: (1) 'thesis-antithesis-synthesis' comes mostly from Fichte and later readings of Hegel; Marx rarely used it. (2) Whether Marx stopped doing philosophy after 1848 is disputed: Lukacs and Marcuse see continuity, Althusser proposed an 'epistemological break'. (3) Calling the end of history a 'paradise' simplifies Marx, who spoke of the end of the 'prehistory' of class struggle. (4) In the Theses on Feuerbach human essence is 'the ensemble of social relations', which is not the same as 'humans have no nature'; Norman Geras argued Marx kept a notion of human nature.", "nl": "Cautions: (1) 'thesis-antithesis-synthesis' comes mostly from Fichte and later readings of Hegel; Marx rarely used it. (2) Whether Marx stopped doing philosophy after 1848 is disputed: Lukacs and Marcuse see continuity, Althusser proposed an 'epistemological break'. (3) Calling the end of history a 'paradise' simplifies Marx, who spoke of the end of the 'prehistory' of class struggle. (4) In the Theses on Feuerbach human essence is 'the ensemble of social relations', which is not the same as 'humans have no nature'; Norman Geras argued Marx kept a notion of human nature."}, "sources": [], "flags": ["contested", "editor-note"]}], "links": [{"to": "soc:social-construction", "rel": "see-also", "note": {"fa": "جمله‌ی «زندگی آگاهی را تعیین می‌کند» به جامعه‌شناسی شناخت و کتاب برگر و لاکمن می‌رسد.", "en": "'Life determines consciousness' leads to the sociology of knowledge and Berger and Luckmann.", "nl": "'Life determines consciousness' leads to the sociology of knowledge and Berger and Luckmann."}}, {"to": "soc:marx-capitalism-dynamics", "rel": "see-also", "note": {"fa": "ادامهٔ بحث: سازوکار سرمایه‌داری و بحران.", "en": "Continues with the mechanics of capitalism and crisis.", "nl": "Continues with the mechanics of capitalism and crisis."}}, {"to": "soc:inequality", "rel": "see-also", "note": {"fa": "طبقه و نابرابری.", "en": "Class and inequality.", "nl": "Class and inequality."}}], "people": ["core:karl-marx", "core:friedrich-engels", "core:raymond-aron"], "sources": ["src:451d51da9a", "src:4d1925ef85", "src:a8f809b841", "src:f327aa1c7e"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:western-marxism", "kind": "concept", "title": {"fa": "مارکسیسم هگلی (غربی): بازخوانی مارکس پس از مارکس", "en": "Hegelian (Western) Marxism: rereading Marx after Marx", "nl": "Hegeliaans (westers) marxisme"}, "aliases": [], "parent": "soc:theory", "field": "soc:theory", "summary": {"fa": "پس از مرگ مارکس، تفسیر غالب در میان پیروانش این بود که اقتصاد همه‌چیز را تعیین می‌کند و فروپاشی سرمایه‌داری ناگزیر است. گروهی از اندیشمندان، با لوکاچ و گرامشی در صدر، این برداشت را بیش از حد مکانیکی دانستند. آن‌ها آگاهی، فرهنگ و کنش انسان‌ها را به مرکز نظریه برگرداندند و از ریشه‌های هگلی اندیشهٔ مارکس کمک گرفتند. این جریان بعدها بر مکتب فرانکفورت اثر گذاشت.", "en": "After Marx's death the dominant reading among his followers held that the economy determines everything and that capitalism's collapse is inevitable. A group of thinkers led by Lukács and Gramsci judged this too mechanical. They put consciousness, culture and human action back at the centre, drawing on Marx's Hegelian roots. The current later influenced the Frankfurt School.", "nl": "Na Marx' dood zagen veel volgelingen de economie als allesbepalend. Denkers als Lukács en Gramsci brachten bewustzijn, cultuur en menselijk handelen terug in het marxisme."}, "points": [{"text": {"fa": "به گفتهٔ سخنران، از حدود ۱۸۸۹ تا ۱۹۱۴ خوانش غالب از مارکس «جبرگرایی اقتصادی» بود: اقتصاد زیربناست و سیاست، دین و اندیشه از آن پیروی می‌کنند. در این دوره بیشتر آثار مارکس بالغ خوانده می‌شد و نوشته‌های جوانی او کمتر دیده می‌شد.", "en": "Per the lecturer, from about 1889 to 1914 the dominant reading of Marx was economic determinism: the economy is the base and politics, religion and ideas follow it. Marx's mature works were read far more than his youthful writings.", "nl": "Per the lecturer, from about 1889 to 1914 the dominant reading of Marx was economic determinism: the economy is the base and politics, religion and ideas follow it. Marx's mature works were read far more than his youthful writings."}, "sources": ["src:f16bb683da"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، جنگ جهانی اول، انقلاب ۱۹۱۷ روسیه و ناامیدی پس از جنگ فضایی ساخت که در آن هم شور تغییر بنیادین بود و هم یأس. او این فضا را زمینهٔ بازاندیشی در مارکسیسم می‌داند.", "en": "Per the lecturer, the First World War, the 1917 Russian Revolution and the despair after the war created an atmosphere of both revolutionary hope and disillusion, which he sees as the setting for rethinking Marxism.", "nl": "Per the lecturer, the First World War, the 1917 Russian Revolution and the despair after the war created an atmosphere of both revolutionary hope and disillusion, which he sees as the setting for rethinking Marxism."}, "sources": ["src:f16bb683da"], "flags": ["editor-note"]}, {"text": {"fa": "اعتراض مارکسیست‌های هگلی این بود: اگر سقوط سرمایه‌داری ناگزیر باشد، کنش و آگاهی افراد بی‌اهمیت می‌شود و نظریهٔ انقلابی به انتظار نشستن تبدیل می‌شود. اگر هم تاریخ دیالکتیکی است، باید میان اجزایی مثل آگاهی، کنش انسانی و ساختار اقتصادی برهم‌کنش باشد، نه فقط حرکت خودکار ساختار.", "en": " The Hegelian Marxists objected that if capitalism's collapse is inevitable, individual action and consciousness stop mattering and a revolutionary theory turns into passive waiting. If history is dialectical, there must be interaction between consciousness, human action and economic structure, not just the automatic movement of structure.", "nl": " The Hegelian Marxists objected that if capitalism's collapse is inevitable, individual action and consciousness stop mattering and a revolutionary theory turns into passive waiting. If history is dialectical, there must be interaction between consciousness, human action and economic structure, not just the automatic movement of structure."}, "sources": ["src:f16bb683da"], "flags": []}, {"text": {"fa": "به گفتهٔ سخنران، لوکاچ می‌پرسد چه چیزی از مارکس باقی می‌ماند که حتی اگر برخی ادعاهای او رد شود هنوز بتوان مارکسیست ماند. پاسخ لوکاچ «روش» است: دیالکتیک و نگاه به جامعه به‌عنوان یک کل، نه مجموعه‌ای از گزاره‌های ثابت.", "en": "Per the lecturer, Lukács asks what remains of Marx even if some of his claims are refuted, so that one is still a Marxist. Lukács's answer is method: dialectics and viewing society as a totality rather than a fixed set of propositions.", "nl": "Per the lecturer, Lukács asks what remains of Marx even if some of his claims are refuted, so that one is still a Marxist. Lukács's answer is method: dialectics and viewing society as a totality rather than a fixed set of propositions."}, "sources": ["src:f16bb683da", "src:fea88c93a4"], "flags": ["editor-note"]}, {"text": {"fa": "نکتهٔ تصحیحی: «تاریخ و آگاهی طبقاتی» در سال ۱۹۲۳ منتشر شد (در رونوشت ۱۹۲۰ آمده). «دست‌نوشته‌های اقتصادی و فلسفی ۱۸۴۴» مارکس واقعاً تا ۱۹۳۲ چاپ نشد، پس لوکاچ بیشتر از «سرمایه» و هگل بهره می‌گرفت. اینکه خود مارکس جبرگرای خام بود محل بحث است: انگلس در نامه‌های پایانی نوشت اقتصاد فقط «در نهایت» تعیین‌کننده است. همچنین آلتوسر خوانش هگلی را کاملاً رد می‌کرد، پس «مارکسیسم غربی» یک جریان یکدست نیست.", "en": "Corrective note: History and Class Consciousness appeared in 1923 (the transcript says 1920). Marx's 1844 manuscripts were indeed not published until 1932, so Lukács drew mainly on Capital and Hegel. Whether Marx himself was a crude determinist is debated: Engels's late letters say the economy is decisive only 'in the last instance'. Althusser also rejected the Hegelian reading outright, so 'Western Marxism' is not one uniform school.", "nl": "Corrective note: History and Class Consciousness appeared in 1923 (the transcript says 1920). Marx's 1844 manuscripts were indeed not published until 1932, so Lukács drew mainly on Capital and Hegel. Whether Marx himself was a crude determinist is debated: Engels's late letters say the economy is decisive only 'in the last instance'. Althusser also rejected the Hegelian reading outright, so 'Western Marxism' is not one uniform school."}, "sources": [], "flags": ["contested", "editor-note"]}], "links": [{"to": "soc:reification", "rel": "explains", "note": {"fa": "چیزوارگی، مفهوم مرکزی لوکاچ", "en": "Reification, Lukács's central concept", "nl": "Reification, Lukács's central concept"}}, {"to": "soc:class-consciousness", "rel": "explains", "note": {"fa": "آگاهی طبقاتی در نگاه لوکاچ", "en": "Class consciousness in Lukács", "nl": "Class consciousness in Lukács"}}, {"to": "soc:hegemony-culture-industry", "rel": "see-also", "note": {"fa": "هژمونی فرهنگی و صنعت فرهنگ", "en": "Cultural hegemony and the culture industry", "nl": "Cultural hegemony and the culture industry"}}, {"to": "soc:theory", "rel": "part-of", "note": {"fa": "نظریه‌های جامعه‌شناسی", "en": "Sociological theory", "nl": "Sociological theory"}}], "people": ["core:georg-luk-cs", "core:antonio-gramsci", "core:friedrich-engels", "core:raymond-aron"], "sources": ["src:f16bb683da", "src:fea88c93a4"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:marx-break-from-hegel", "kind": "concept", "title": {"fa": "گسست مارکس از هگل: از «روح» به شیوهٔ تولید", "en": "Marx's break from Hegel: from Spirit to the mode of production", "nl": "Marx' breuk met Hegel: van Geest naar productiewijze"}, "aliases": [], "parent": "soc:theory", "field": "soc:theory", "summary": {"fa": "مارکس جوان در فضای فلسفهٔ آلمانی و دغدغهٔ آزادی و سانسور رشد کرد، اما کم‌کم به این نتیجه رسید که هگل و فیلسوفان آلمانی بیش از حد دربارهٔ ذهن و آگاهی می‌گویند. او به‌جای «روح» (Geist) شرایط مادی و شیوهٔ تولید را موتور تاریخ دانست. از این نگاه، حقوق، سیاست و جامعهٔ مدنی مستقل از اقتصاد نیستند و تاریخ در چند دورهٔ بزرگ پیش می‌رود.", "en": "The young Marx grew up in German philosophy, concerned with freedom and censorship, but came to think Hegel and his heirs dwelt too much on mind and consciousness. He replaced Spirit with material conditions and the mode of production as history's engine. On this view law, politics and civil society are not independent of the economy, and history moves through a series of large epochs.", "nl": "Marx groeide op in de Duitse filosofie, maar verving Hegels 'Geest' door materiële omstandigheden en de productiewijze als motor van de geschiedenis. Recht, politiek en burgerlijke samenleving zijn volgens hem niet los te zien van de economie."}, "points": [{"text": {"fa": "به گفتهٔ سخنران، مارکس در سال‌های حدود ۱۸۴۲ تا ۱۸۴۷ هنوز به آزادی و قانون با نگاه هگلی و کانتی می‌نگریست و نوشته‌هایش دربارهٔ سانسور مطبوعات و قانون مجازات «دزدی چوب» دهقانان به مسائل روز آلمان می‌پرداخت. به گفتهٔ او همین نوشته‌ها و تعطیل شدن مجلهٔ راین مارکس را به نقش اقتصاد در سیاست و دین متوجه کرد.", "en": "Per the lecturer, around 1842-47 Marx still approached freedom and law in a Hegelian-Kantian way, and his journalism on press censorship and the peasants' wood-theft law dealt with live German issues; he says these pieces, and the closing of the Rheinische Zeitung, pushed Marx toward seeing the role of economics behind politics and religion.", "nl": "Per the lecturer, around 1842-47 Marx still approached freedom and law in a Hegelian-Kantian way, and his journalism on press censorship and the peasants' wood-theft law dealt with live German issues; he says these pieces, and the closing of the Rheinische Zeitung, pushed Marx toward seeing the role of economics behind politics and religion."}, "sources": ["src:f6708143e0"], "flags": ["editor-note"]}, {"text": {"fa": "سخنران می‌گوید مارکس در نقد فلسفهٔ حق هگل می‌خواست به‌جای «روح»، شرایط مادی را بنشاند: حقوق و سیاست حوزه‌هایی مستقل نیستند و با تغییر پایهٔ مادی جامعه تغییر می‌کنند. همچنین مفهوم «جامعهٔ مدنی» نزد هگل حوزه‌ای پیچیده از حقوق و سیاست و اقتصاد بود، ولی مارکس آن را زیر مناسبات اقتصادی می‌فهمید.", "en": "The lecturer says that in his critique of Hegel's philosophy of right Marx wanted to put material conditions in place of Spirit: law and politics are not autonomous spheres and shift when the material base shifts. Hegel's 'civil society' was a complex sphere of law, politics and economy, whereas Marx read it as subordinate to economic relations.", "nl": "The lecturer says that in his critique of Hegel's philosophy of right Marx wanted to put material conditions in place of Spirit: law and politics are not autonomous spheres and shift when the material base shifts. Hegel's 'civil society' was a complex sphere of law, politics and economy, whereas Marx read it as subordinate to economic relations."}, "sources": ["src:f6708143e0", "src:a5148443c8", "src:7dcb46cf36"], "flags": []}, {"text": {"fa": "تاریخ نزد مارکس به چند دورهٔ بزرگ تقسیم می‌شود (جوامع اولیه، برده‌داری، فئودالیسم، سرمایه‌داری و در پایان جامعه‌ای کارگری/بی‌طبقه) و عامل گذار از یک دوره به دوره‌ٔ بعد تغییر شیوهٔ تولید است، نه آگاهی بشر. سخنران این را در برابر الگوی سه‌مرحله‌ای آگوست کنت (اسطوره، دین، علم) می‌گذارد که به باور او باز هم ذهن را محور می‌گیرد.", "en": "For Marx history divides into large epochs (early communal societies, slavery, feudalism, capitalism, and finally a workers' or classless society), and the shift between them is driven by changes in the mode of production, not by human consciousness. The lecturer contrasts this with Comte's three stages (myth, religion, science), which he says still put the mind first.", "nl": "For Marx history divides into large epochs (early communal societies, slavery, feudalism, capitalism, and finally a workers' or classless society), and the shift between them is driven by changes in the mode of production, not by human consciousness. The lecturer contrasts this with Comte's three stages (myth, religion, science), which he says still put the mind first."}, "sources": ["src:f6708143e0", "src:7dcb46cf36"], "flags": []}, {"text": {"fa": "مارکس در «تزهای فوئرباخ» نوشت فیلسوفان تاکنون جهان را فقط تفسیر کرده‌اند و کار اصلی تغییر آن است. سخنران می‌گوید این جمله نشان‌دهندهٔ گسست مارکس از فلسفهٔ پیش از خود و دغدغهٔ او برای پیوند نظریه و عمل (پراکسیس) است.", "en": "In the 'Theses on Feuerbach' Marx wrote that philosophers have only interpreted the world and the point is to change it. The lecturer reads this as marking Marx's break with earlier philosophy and his concern to join theory and practice (praxis).", "nl": "In the 'Theses on Feuerbach' Marx wrote that philosophers have only interpreted the world and the point is to change it. The lecturer reads this as marking Marx's break with earlier philosophy and his concern to join theory and practice (praxis)."}, "sources": ["src:f6708143e0", "src:03e92aed62"], "flags": []}, {"text": {"fa": "توضیح علمی لازم: تقسیم‌بندی «پنج مرحله‌ای» تاریخ بیشتر محصول مارکسیسم بعدی (به‌ویژه شکل شوروی) است و خود مارکس طرح ثابتی نداد؛ او گاهی از «شیوهٔ تولید آسیایی» هم نوشت. همچنین «دیکتاتوری پرولتاریا» در نوشته‌های مارکس مرحلهٔ گذار است و با «جامعهٔ بی‌طبقه» یکی نیست. گسست مارکس از هگل هم در میان محققان بحث‌برانگیز است: برخی (مثل آلتوسر) گسستی قاطع و برخی استمرار دیالکتیک را می‌بینند.", "en": "Scholarly caveat: the tidy five-stage scheme owes more to later Marxism (especially the Soviet version) than to Marx himself, who gave no fixed schedule and also wrote of an 'Asiatic' mode; the 'dictatorship of the proletariat' is a transitional phase, not the classless society itself. How sharp Marx's break from Hegel was is also disputed: Althusser saw a clean rupture, others stress continuity of the dialectic.", "nl": "Scholarly caveat: the tidy five-stage scheme owes more to later Marxism (especially the Soviet version) than to Marx himself, who gave no fixed schedule and also wrote of an 'Asiatic' mode; the 'dictatorship of the proletariat' is a transitional phase, not the classless society itself. How sharp Marx's break from Hegel was is also disputed: Althusser saw a clean rupture, others stress continuity of the dialectic."}, "sources": [], "flags": ["contested", "editor-note"]}], "links": [{"to": "soc:enlightenment-break", "rel": "part-of", "note": {"fa": "پیش‌زمینهٔ روشنگری و ایده‌آلیسم آلمانی", "en": "Background in the Enlightenment and German idealism", "nl": "Background in the Enlightenment and German idealism"}}, {"to": "soc:marx-religion-alienation", "rel": "see-also", "note": {"fa": "نگاه مارکس به دین", "en": "Marx on religion", "nl": "Marx on religion"}}, {"to": "soc:inequality", "rel": "see-also", "note": {"fa": "طبقه و نابرابری", "en": "Class and inequality", "nl": "Class and inequality"}}], "people": ["core:karl-marx", "core:georg-wilhelm-friedrich-hegel", "core:ludwig-feuerbach", "core:auguste-comte", "core:friedrich-engels"], "sources": ["src:03e92aed62", "src:7dcb46cf36", "src:a5148443c8", "src:f6708143e0"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:berger-humor-authoritarian", "kind": "concept", "title": {"fa": "برگر و شوخی: جوک، ناهمخوانی و رؤیا در جامعهٔ استبدادزده", "en": "Berger on humour: jokes, incongruity and dreams under authoritarian rule", "nl": "Berger over humor: grappen, incongruentie en dromen onder autoritair bewind"}, "aliases": [], "parent": "soc:theory", "field": "soc:theory", "summary": {"fa": "پیتر برگر در «خنده‌ی رهایی‌بخش» شوخی را یکی از راه‌های گریز موقت از زندگی روزمره می‌داند. او خنده را ناشی از ناهمخوانی میان انتظار ما و واقعیت می‌بیند. سخنران این ایده را دنبال می‌کند و می‌گوید در جامعه‌های استبدادی جوک زیاد ساخته می‌شود، اما این به معنای شادابیِ جامعه نیست. او جوک را مثل رؤیایی جمعی می‌بیند که چیزهای سرکوب‌شده در آن بیان می‌شود.", "en": "In Redeeming Laughter, Peter Berger treats humour as one way of temporarily escaping everyday life, and sees laughter as arising from incongruity between expectation and reality. The lecturer follows this and says authoritarian societies produce many jokes, which does not mean the society is cheerful. He reads jokes as a kind of collective dream in which repressed things are voiced.", "nl": "Peter Berger ziet humor als een tijdelijke ontsnapping aan het dagelijks leven, voortkomend uit de kloof tussen verwachting en werkelijkheid. De docent leest grappen onder autoritair bewind als een soort collectieve droom."}, "points": [{"text": {"fa": "برگر امر کمیک (خنده‌دار) را قلمروی جدا از زندگی روزمره می‌داند که بر ناهمخوانی استوار است: چیزی جای چیز دیگر می‌نشیند و دو منطق ناسازگار کنار هم قرار می‌گیرند. جوک ما را لحظه‌ای از جدیتِ روزمره بیرون می‌برد و حتی ممکن است روزمره را قابل تحمل‌تر یا کار مشترک را روان‌تر کند.", "en": "Berger sees the comic as a realm apart from everyday life, built on incongruity: one thing takes the place of another and two incompatible logics meet. A joke lifts us briefly out of daily seriousness and can even make daily life easier to bear or joint work smoother.", "nl": "Berger sees the comic as a realm apart from everyday life, built on incongruity: one thing takes the place of another and two incompatible logics meet. A joke lifts us briefly out of daily seriousness and can even make daily life easier to bear or joint work smoother."}, "sources": ["src:26a4a26b1b", "src:e3c9fdace6"], "flags": []}, {"text": {"fa": "به گفتهٔ سخنران، جامعه‌هایی که زیر حکومت استبدادی‌اند جوک و طنز فراوان می‌سازند، چون فاصلهٔ میان چیزی که از جهان انتظار می‌رود و آنچه هست بزرگ است. او هشدار می‌دهد که فراوانی جوک را نباید نشانهٔ شادی یا سرزندگی گرفت؛ خنده می‌تواند عصبی و هیستریک باشد.", "en": "Per the lecturer, societies under authoritarian rule produce many jokes because the gap between what is expected of the world and what exists is wide. He warns that an abundance of jokes should not be read as a sign of happiness or vitality; laughter can be nervous or hysterical.", "nl": "Per the lecturer, societies under authoritarian rule produce many jokes because the gap between what is expected of the world and what exists is wide. He warns that an abundance of jokes should not be read as a sign of happiness or vitality; laughter can be nervous or hysterical."}, "sources": ["src:26a4a26b1b", "src:e3c9fdace6"], "flags": ["editor-note"]}, {"text": {"fa": "برگر جوک و رؤیا را مقایسه می‌کند: هر دو جهانی بسته‌اند که قواعد زندگی روزمره در آن معلق است؛ مثلاً در جوکی آدم می‌تواند با خورشید حرف بزند و رهبر را مسخره کند. به گفتهٔ سخنران می‌توان با نگاه فرویدی گفت که جوک، خواست‌های سرکوب‌شدهٔ جمعی را بیان می‌کند.", "en": "Berger compares joke and dream: both are closed worlds in which the rules of daily life are suspended; in one joke a person can talk to the sun and mock the leader. Per the lecturer, a Freudian reading would say the joke voices collective repressed wishes.", "nl": "Berger compares joke and dream: both are closed worlds in which the rules of daily life are suspended; in one joke a person can talk to the sun and mock the leader. Per the lecturer, a Freudian reading would say the joke voices collective repressed wishes."}, "sources": ["src:26a4a26b1b", "src:e3c9fdace6", "src:b437d7cc52"], "flags": ["editor-note"]}, {"text": {"fa": "توضیح: پژوهشگرانی مانند کریستی دیویس (دربارهٔ جوک‌های کمونیستی) معتقدند بیشتر جوک‌ها سرگرمی‌اند و نه نشانهٔ مقاومت یا عامل تغییر سیاسی. در مقابل جیمز اسکات جوک و طنز را بخشی از «متن پنهان» مردمِ زیردست می‌داند، یعنی مقاومتی کوچک و بی‌خطر. بنابراین رابطهٔ جوک و استبداد ساده نیست.", "en": "Caveat: scholars such as Christie Davies (on jokes under communism) argue that most jokes are entertainment rather than a sign of resistance or a cause of political change. James C. Scott by contrast treats humour as part of the subordinate's hidden transcript, a small and low-risk form of resistance. The link between jokes and tyranny is therefore not simple.", "nl": "Caveat: scholars such as Christie Davies (on jokes under communism) argue that most jokes are entertainment rather than a sign of resistance or a cause of political change. James C. Scott by contrast treats humour as part of the subordinate's hidden transcript, a small and low-risk form of resistance. The link between jokes and tyranny is therefore not simple."}, "sources": ["src:6a43c4faed", "src:90d6ea45a3"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "سخنران پیشنهاد می‌کند دانشجویان جوک‌های ساخته‌شده پس از رویدادهای بزرگ را بررسی کنند و حتی بپرسند آیا خواب‌های مردم پس از یک بحران الگوی مشترکی دارد. این پیشنهاد پژوهشی خود اوست و تا آنجا که او می‌داند هنوز انجام نشده است. همچنین دیدگاه فروید که رؤیا ارضای آرزوهای سرکوب‌شده است، امروز فقط یکی از نظریه‌های بحث‌برانگیز دربارهٔ رؤیاست.", "en": "The lecturer suggests students study jokes made after major events, and even ask whether people's dreams after a crisis share patterns. This is his own research suggestion and, as far as he knows, untested. Freud's view that dreams fulfil repressed wishes is today only one contested theory of dreaming.", "nl": "The lecturer suggests students study jokes made after major events, and even ask whether people's dreams after a crisis share patterns. This is his own research suggestion and, as far as he knows, untested. Freud's view that dreams fulfil repressed wishes is today only one contested theory of dreaming."}, "sources": ["src:26a4a26b1b", "src:b437d7cc52"], "flags": ["editor-note", "contested"]}], "links": [{"to": "soc:schutz-finite-provinces", "rel": "part-of", "note": {"fa": "شوخی یکی از پرانتزهای زندگی روزمره است.", "en": "Humour is one of the brackets of everyday life.", "nl": "Humour is one of the brackets of everyday life."}}, {"to": "soc:preference-falsification", "rel": "see-also", "note": {"fa": "در استبداد مردم نظر واقعی را پنهان می‌کنند و جوک یکی از راه‌های بیانِ غیرمستقیم است.", "en": "Under tyranny people hide their real views; jokes are one indirect outlet.", "nl": "Under tyranny people hide their real views; jokes are one indirect outlet."}}, {"to": "psy:catharsis", "rel": "contrasts", "note": {"fa": "ایدهٔ تخلیهٔ هیجان در نظریه‌های کاتارسیس و شوخی.", "en": "The idea of emotional release in catharsis theories and humour.", "nl": "The idea of emotional release in catharsis theories and humour."}}], "people": ["core:peter-l-berger", "core:sigmund-freud", "core:christie-davies", "core:james-c-scott"], "sources": ["src:26a4a26b1b", "src:6a43c4faed", "src:90d6ea45a3", "src:b437d7cc52", "src:e3c9fdace6"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:teleology-paradise-hegel-marx", "kind": "concept", "title": {"fa": "غایت تاریخ در هگل و مارکس: «بهشت» و «برزخ» و خطر سیاسی آن", "en": "History's end-goal in Hegel and Marx: 'paradise', 'purgatory' and the political risk", "nl": "Het einddoel van de geschiedenis bij Hegel en Marx: 'paradijs' en 'vagevuur'"}, "aliases": [], "parent": "soc:theory", "field": "soc:theory", "summary": {"fa": "سخنران می‌گوید هگل و مارکس هر دو تاریخ را فرایندی دیالکتیکی با هدفی مشخص و جامعه‌ای بدون تعارض می‌دانند؛ هگل با «معرفت مطلق» و مارکس با پایان نبرد طبقاتی. به نظر او این شبیه یک وعدهٔ بهشت در ادبیات دینی است و جامعهٔ موجود را «برزخ» می‌کند. او این را به لحن تند و رسالت‌گرایانهٔ بخشی از چپ ایرانی پیش از انقلاب ربط می‌دهد؛ این تفسیر بحث‌برانگیز است و ادعاهای سیاسی او در این باره باید با دیدگاه مخالف سنجیده شود.", "en": "The lecturer says Hegel and Marx both treat history as a dialectical process with a definite goal, a society without conflict: for Hegel via absolute knowledge, for Marx via the end of class struggle. He compares this to promises of paradise in religious language, which turns the present into a kind of purgatory. He links this to the fervent, mission-driven tone of part of the pre-revolution Iranian left; the reading is contested and his political claims need weighing against the opposing view.", "nl": "Volgens de docent delen Hegel en Marx een teleologische kijk op de geschiedenis met een conflictvrij einddoel, wat hij vergelijkt met religieuze beloften van een paradijs. Deze lezing is omstreden."}, "points": [{"text": {"fa": "به گفتهٔ سخنران، هگل و مارکس چهار چیز مشترک دارند: واقعیت فرایندی تاریخی است، این فرایند دیالکتیکی است، دیالکتیک هدف و غایتی دارد، و این هدف جامعه‌ای بدون تعارض است. نزد هگل غایت رسیدن «روح» به معرفت مطلق است و نزد مارکس پایان تضاد طبقاتی.", "en": "Per the lecturer, Hegel and Marx share four things: reality is a historical process, the process is dialectical, the dialectic has an aim, and that aim is a society without conflict. For Hegel the goal is Spirit reaching absolute knowledge; for Marx, the end of class conflict.", "nl": "Per the lecturer, Hegel and Marx share four things: reality is a historical process, the process is dialectical, the dialectic has an aim, and that aim is a society without conflict. For Hegel the goal is Spirit reaching absolute knowledge; for Marx, the end of class conflict."}, "sources": ["src:f6708143e0", "src:9a1c8505be"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، تا رسیدن به آن غایت جامعه در حالت بیگانگی می‌ماند، و او این را «برزخ» و مقصد را «بهشت موعود» می‌خواند؛ از این نظر فلسفه هم مثل دین می‌تواند وعدهٔ بهشت بدهد و کسانی که مانع رسیدن به آن‌اند به‌عنوان دشمن دیده شوند. او همین را توضیحی برای خشم کلامی و رسالت‌گرایی بخشی از چپ ایرانی پیش از انقلاب می‌داند و به شباهتش با ادبیات اسلام‌گرا در دههٔ ۴۰ اشاره می‌کند.", "en": "Per the lecturer, until that goal is reached society stays in alienation, which he calls 'purgatory', with a 'promised paradise' at the end; so philosophy, like religion, can promise paradise and treat those who block it as enemies. He uses this to explain the verbal anger and sense of mission of part of the pre-revolution Iranian left and notes its resemblance to Islamist literature of the 1960s.", "nl": "Per the lecturer, until that goal is reached society stays in alienation, which he calls 'purgatory', with a 'promised paradise' at the end; so philosophy, like religion, can promise paradise and treat those who block it as enemies. He uses this to explain the verbal anger and sense of mission of part of the pre-revolution Iranian left and notes its resemblance to Islamist literature of the 1960s."}, "sources": ["src:f6708143e0"], "flags": ["editor-note"]}, {"text": {"fa": "سخنران ذکر می‌کند که منتقدان هگل او را در شکل‌گیری دولت متمرکز و نازیسم مقصر دانسته‌اند، و کتاب فلسفهٔ حق را شاهد می‌آورند. او خودش این را تفسیرهایی می‌داند که از هر متفکر دوپهلویی ممکن است بیرون بیاید و در همان زمان هگلی‌های چپ و راست هم دربارهٔ او اختلاف داشتند.", "en": "The lecturer mentions critics who blame Hegel for the centralised state and Nazism, citing the Philosophy of Right, though he notes such readings can be drawn from any ambiguous thinker and that left and right Hegelians already disagreed over him.", "nl": "The lecturer mentions critics who blame Hegel for the centralised state and Nazism, citing the Philosophy of Right, though he notes such readings can be drawn from any ambiguous thinker and that left and right Hegelians already disagreed over him."}, "sources": ["src:f6708143e0"], "flags": []}, {"text": {"fa": "دیدگاه مخالف و توضیح علمی: انتساب نازیسم به هگل (مثلاً در کتاب کارل پوپر) بسیار مورد مناقشه است؛ بسیاری از پژوهشگران هگل را مدافع دولت قانون‌مند و نهادهای مدنی می‌دانند و نازی‌ها خود هگل را چندان از آن خود نمی‌دانستند. دربارهٔ مارکس هم مدافعان می‌گویند او هدف را رهایی و غنای زندگی انسان می‌دانست و فجایع حکومت‌های مدعی مارکسیسم را نمی‌توان مستقیم به او نسبت داد؛ منتقدان از جمله پوپر برعکس می‌گویند تاریخ‌گرایی (historicism) خود راه را برای کنترل اجتماعی باز می‌کند. هر دو سو استدلال جدی دارند.", "en": "Opposing view and caveat: tracing Nazism to Hegel (for instance in Karl Popper's book) is heavily disputed; many scholars see Hegel as a defender of a constitutional state and civil institutions, and the Nazis did not embrace him as a forebear. As for Marx, defenders say his aim was human emancipation and that the atrocities of regimes calling themselves Marxist cannot simply be put on him, whereas critics such as Popper argue that historicism itself opens the way to social control. Both sides have serious arguments.", "nl": "Opposing view and caveat: tracing Nazism to Hegel (for instance in Karl Popper's book) is heavily disputed; many scholars see Hegel as a defender of a constitutional state and civil institutions, and the Nazis did not embrace him as a forebear. As for Marx, defenders say his aim was human emancipation and that the atrocities of regimes calling themselves Marxist cannot simply be put on him, whereas critics such as Popper argue that historicism itself opens the way to social control. Both sides have serious arguments."}, "sources": ["src:4395470e0e"], "flags": ["contested", "editor-note"]}], "links": [{"to": "soc:marx-break-from-hegel", "rel": "see-also", "note": {"fa": "گسست مارکس از هگل", "en": "Marx's break from Hegel", "nl": "Marx's break from Hegel"}}, {"to": "phil:political", "rel": "see-also", "note": {"fa": "فلسفهٔ سیاسی", "en": "Political philosophy", "nl": "Political philosophy"}}, {"to": "phil:two-liberties", "rel": "contrasts", "note": {"fa": "دو مفهوم آزادی", "en": "Two concepts of liberty", "nl": "Two concepts of liberty"}}], "people": ["core:georg-wilhelm-friedrich-hegel", "core:karl-marx", "core:karl-popper"], "sources": ["src:4395470e0e", "src:9a1c8505be", "src:f6708143e0"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:cultural-lag", "kind": "concept", "title": {"fa": "تأخر فرهنگی و پیوندش با آنومی", "en": "Cultural lag and its link to anomie", "nl": "Culturele vertraging (cultural lag) en anomie"}, "aliases": [], "parent": "soc:values", "field": "soc:values", "summary": {"fa": "تأخر فرهنگی یعنی بخش مادی فرهنگ (فناوری و اشیای تازه) سریع‌تر از بخش ذهنی آن (ارزش‌ها و قاعده‌ها) تغییر کند. در این فاصله مردم نمی‌دانند با چیز تازه چه کنند. سخنران می‌گوید اگر شکاف طولانی شود به بی‌هنجاری می‌رسد و ارزش‌های کهنه به شعار تبدیل می‌شوند.", "en": "Cultural lag means the material side of culture (technology, new objects) changes faster than the non-material side (values, rules). In the gap, people do not know what to do with the new thing. The lecturer says a long gap leads to normlessness and turns old values into slogans.", "nl": "Culturele vertraging: materiële cultuur (technologie) verandert sneller dan waarden en normen. Een langdurige kloof kan tot normloosheid (anomie) leiden."}, "points": [{"text": {"fa": "تأخر فرهنگی یعنی ناهماهنگی میان بخش مادی و ذهنی فرهنگ: چیزی تازه وارد جامعه می‌شود ولی هنوز برایش ارزش، قاعده و جایگاه ساخته نشده است. سخنران گوشی موبایل را مثال می‌زند که مدتی همه نمی‌دانستند کجا نگهش دارند، و می‌گوید با ایده‌های مدرن مثل دولت، ملت، آزادی و دموکراسی هم همین سردرگمی پیش می‌آید.", "en": "Cultural lag is a mismatch between the material and non-material sides of culture: something new enters society before any value, rule or place for it has been created. The lecturer uses the mobile phone, which people for a while did not know where to carry, and says modern ideas such as the state, nation, freedom and democracy cause the same confusion.", "nl": "Cultural lag is a mismatch between the material and non-material sides of culture: something new enters society before any value, rule or place for it has been created. The lecturer uses the mobile phone, which people for a while did not know where to carry, and says modern ideas such as the state, nation, freedom and democracy cause the same confusion."}, "sources": ["src:d50f6ac9b8"], "flags": []}, {"text": {"fa": "به گفتهٔ سخنران، اگر این شکاف دراز بماند «آنومی» (بی‌هنجاری) پدید می‌آید: ارزش‌های پیشین اعتبار خود را از دست داده‌اند و ارزش تازه‌ای ساخته نشده است. او آن را مثل دو پا می‌بیند که یکی در سنت و دیگری در دنیای مدرن است؛ پای سنت بعد از هر انتخاب مدرن آدم را سرزنش می‌کند و یک نسل می‌تواند از این سردرگمی آسیب ببیند.", "en": "Per the lecturer, if the gap persists it produces anomie: earlier values have lost their authority and no new ones exist. He pictures two feet, one in tradition and one in the modern world; after each modern choice the traditional foot scolds the person, and a whole generation can be harmed by this confusion.", "nl": "Per the lecturer, if the gap persists it produces anomie: earlier values have lost their authority and no new ones exist. He pictures two feet, one in tradition and one in the modern world; after each modern choice the traditional foot scolds the person, and a whole generation can be harmed by this confusion."}, "sources": ["src:d50f6ac9b8"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، ارزش‌ها زمانی اعتبار می‌بازند که دیگر به نیازهای زندگی پاسخ نمی‌دهند و با واقعیت روزمره جور نیستند؛ آن‌وقت احساس می‌کنیم ارزش به «شعار» بدل شده است. راهِ او برای مقابله این است که به جای ترسیدن از چیز تازه، از کودکی فرزندان را با روح دنیای مدرن آشنا کنیم و برای شرایط تازه الگوهای تازهٔ زندگی بسازیم.", "en": "Per the lecturer, values lose authority when they stop answering life's needs and no longer fit everyday reality; then we feel the value has become a slogan. His remedy is to introduce children early to the spirit of the modern world and to create new ways of living for new conditions instead of fearing the new.", "nl": "Per the lecturer, values lose authority when they stop answering life's needs and no longer fit everyday reality; then we feel the value has become a slogan. His remedy is to introduce children early to the spirit of the modern world and to create new ways of living for new conditions instead of fearing the new."}, "sources": ["src:d50f6ac9b8"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، «تهاجم فرهنگی» مفهومی غلط است؛ آنچه هست رواج و تبادل فرهنگی است، و یک عنصر خارجی فقط وقتی جا می‌افتد که مردم بپذیرند و به کارشان بیاید. او پیدایش غذای سریع، آپارتمان‌نشینی و جاروی رباتیک را پاسخ آدم‌های امروز به کمبود وقت و زمین می‌داند.", "en": "Per the lecturer, 'cultural invasion' is a wrong concept; what exists is cultural diffusion and exchange, and an outside element takes root only if people accept it and find it useful. He sees fast food, apartment living and robot vacuums as answers to modern shortages of time and land.", "nl": "Per the lecturer, 'cultural invasion' is a wrong concept; what exists is cultural diffusion and exchange, and an outside element takes root only if people accept it and find it useful. He sees fast food, apartment living and robot vacuums as answers to modern shortages of time and land."}, "sources": ["src:d50f6ac9b8"], "flags": ["editor-note"]}, {"text": {"fa": "توضیح علمی تکمیلی: مفهوم تأخر فرهنگی از ویلیام اوگبرن (۱۹۲۲) است و منتقدان آن را تا حدی جبرگرایی فناورانه می‌دانند. آنومی نزد دورکیم بیشتر یعنی نبودِ تنظیم اخلاقی در دوران تغییر سریع (و در «خودکشی» ۱۸۹۷ با آمار خودکشی پیوند خورده)، پس تعریف «ارزش کهنه مرده، ارزش نو نیامده» ساده‌شده است. دربارهٔ «تهاجم فرهنگی» نیز نظریهٔ امپریالیسم فرهنگی می‌گوید نابرابری قدرت و رسانه میان کشورها انتشار فرهنگ را یک‌طرفه می‌کند؛ پس مسئله کاملاً بی‌پایه نیست.", "en": "Editor's caveat: the concept of cultural lag comes from William Ogburn (1922) and critics call it somewhat technologically deterministic. Durkheim's anomie is closer to a lack of moral regulation during rapid change (linked to suicide rates in Suicide, 1897), so 'old values dead, new ones not yet born' is a simplification. On 'cultural invasion', cultural-imperialism theorists argue that unequal power and media reach make diffusion one-sided, so the worry is not wholly baseless.", "nl": "Editor's caveat: the concept of cultural lag comes from William Ogburn (1922) and critics call it somewhat technologically deterministic. Durkheim's anomie is closer to a lack of moral regulation during rapid change (linked to suicide rates in Suicide, 1897), so 'old values dead, new ones not yet born' is a simplification. On 'cultural invasion', cultural-imperialism theorists argue that unequal power and media reach make diffusion one-sided, so the worry is not wholly baseless."}, "sources": ["src:70aaa9199a", "src:fe1630b046"], "flags": ["contested", "editor-note"]}], "links": [{"to": "soc:anomie", "rel": "explains", "note": {"fa": "تأخر طولانی می‌تواند به آنومی برسد", "en": "Prolonged lag can lead to anomie", "nl": "Prolonged lag can lead to anomie"}}, {"to": "soc:value-change", "rel": "see-also", "note": {"fa": "تغییر ارزش‌ها در دوران مدرن", "en": "Value change in modern times", "nl": "Value change in modern times"}}, {"to": "soc:network-society", "rel": "see-also", "note": {"fa": "فناوری‌های تازه و جامعه", "en": "New technologies and society", "nl": "New technologies and society"}}, {"to": "soc:culture-roles-social-control", "rel": "part-of", "note": {"fa": "نظریهٔ دو بخش فرهنگ", "en": "The two-sided theory of culture", "nl": "The two-sided theory of culture"}}], "people": ["core:william-f-ogburn", "core:mile-durkheim"], "sources": ["src:70aaa9199a", "src:d50f6ac9b8", "src:fe1630b046"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:schutz-finite-provinces", "kind": "concept", "title": {"fa": "شوتس: واقعیت‌های چندگانه و «پرانتزهای» زندگی روزمره", "en": "Schutz: multiple realities and the finite provinces of meaning", "nl": "Schutz: meervoudige werkelijkheden en afgebakende betekenisgebieden"}, "aliases": [], "parent": "soc:theory", "field": "soc:theory", "summary": {"fa": "آلفرد شوتس می‌گوید زندگی روزمره‌ای که همه در آن شریکیم، واقعیتِ اصلی و تعیین‌کنندهٔ انسان است. رؤیا، هنر، دین و بازی «حوزه‌های معنایی محدودی»اند که ما موقتاً واردشان می‌شویم و دوباره به روزمره برمی‌گردیم. هر بار که از آن‌ها بیرون می‌آییم، واقعیت روزمره را دوباره می‌شناسیم. پیتر برگر و توماس لوکمان این ایده را در نظریهٔ ساخت اجتماعی واقعیت به کار بردند.", "en": "Alfred Schutz holds that the shared world of everyday life is the paramount reality for humans. Dreams, art, religion and play are limited provinces of meaning that we enter temporarily before returning to routine life. Each return makes us recognise everyday reality anew. Berger and Luckmann carried this idea into their theory of the social construction of reality.", "nl": "Alfred Schutz stelt dat het gedeelde dagelijks leven de bepalende werkelijkheid van de mens is. Droom, kunst, religie en spel zijn afgebakende betekenisgebieden waar we tijdelijk in stappen voordat we terugkeren naar de routine."}, "points": [{"text": {"fa": "زندگی روزمره پر از رفتارهای تکراری است که طبیعی به نظر می‌آیند، اما فرهنگی‌اند. مارسل موس نشان داد که حتی شیوهٔ خوابیدن و استراحت کردن میان جامعه‌ها فرق دارد و آموخته می‌شود. به همین دلیل مطالعهٔ کارهای ریز روزمره می‌تواند نهادها و فرهنگِ پشت آن‌ها را آشکار کند.", "en": "Everyday life is full of repeated behaviours that seem natural but are cultural. Marcel Mauss showed that even how people sleep and rest differs between societies and is learned. Studying small daily acts can therefore reveal the institutions and culture behind them.", "nl": "Everyday life is full of repeated behaviours that seem natural but are cultural. Marcel Mauss showed that even how people sleep and rest differs between societies and is learned. Studying small daily acts can therefore reveal the institutions and culture behind them."}, "sources": ["src:26a4a26b1b", "src:e73477f663"], "flags": []}, {"text": {"fa": "شوتس می‌گوید غیر از زندگی روزمره، قلمروهای دیگری از معنا هم هست، مانند رؤیا، هنر، تجربهٔ دینی و بازی. ورود به آن‌ها با یک جابه‌جایی همراه است؛ مثلاً وقتی پردهٔ تئاتر بالا می‌رود، زمان و مکانِ دیگری آغاز می‌شود و با بسته شدن پرده، زندگی روزمره دوباره سر جایش می‌آید. سخنران این قلمروها را «پرانتز» می‌نامد و (با تکیه بر برگر) شوخی را هم به آن‌ها می‌افزاید.", "en": "Besides everyday life, Schutz describes other realms of meaning such as dream, art, religious experience and play. Entering them involves a shift: when a theatre curtain rises a different time and place begins, and when it falls everyday life resumes. The lecturer calls these realms parentheses and, following Berger, adds humour to the list.", "nl": "Besides everyday life, Schutz describes other realms of meaning such as dream, art, religious experience and play. Entering them involves a shift: when a theatre curtain rises a different time and place begins, and when it falls everyday life resumes. The lecturer calls these realms parentheses and, following Berger, adds humour to the list."}, "sources": ["src:26a4a26b1b", "src:2204f8317c", "src:6788e0e480"], "flags": []}, {"text": {"fa": "به گفتهٔ سخنران، این پرانتزها باید بسته شوند. اگر کسی بیشتر عمرش را در آن‌ها بماند، جدیتِ زندگی روزمره را از دست می‌دهد. نشانه‌اش این است که هر چیزی که ما را به زندگی روزمره یادآوری کند (مثلاً «سبزی نداریم») آن حالت را می‌شکند. او مثال می‌زند که هنگام نماز یا تماشای بازی، آدم بی‌توجه به ساعت و محیط می‌شود.", "en": "Per the lecturer, these parentheses must close; someone who stays inside them for most of life loses the seriousness that everyday life demands. As a sign, any reminder of daily life (for example, a remark about groceries) breaks the spell. He gives examples such as prayer or watching a match, where people stop noticing the clock and their surroundings.", "nl": "Per the lecturer, these parentheses must close; someone who stays inside them for most of life loses the seriousness that everyday life demands. As a sign, any reminder of daily life (for example, a remark about groceries) breaks the spell. He gives examples such as prayer or watching a match, where people stop noticing the clock and their surroundings."}, "sources": ["src:26a4a26b1b"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، مرگِ عزیزان روتین زندگی را از هم می‌پاشد و پرسشِ پوچی پیش می‌آید. او معتقد است اسطوره‌ها و آیین‌های سوگ به آدم کمک می‌کنند به زندگی برگردد، و دفاع از آن‌ها دفاع از ادامهٔ زندگی است. این نزدیک به نظر برگر در «سایبان مقدس» است که دین را پناهی در برابر بی‌معنایی و مرگ می‌بیند.", "en": "Per the lecturer, the death of a loved one shatters daily routine and raises the question of meaninglessness. He argues that myths and mourning rituals help people return to life, so defending them means defending life going on. This is close to Berger's view in The Sacred Canopy that religion shelters people from meaninglessness and death.", "nl": "Per the lecturer, the death of a loved one shatters daily routine and raises the question of meaninglessness. He argues that myths and mourning rituals help people return to life, so defending them means defending life going on. This is close to Berger's view in The Sacred Canopy that religion shelters people from meaninglessness and death."}, "sources": ["src:26a4a26b1b", "src:971ae510a9"], "flags": ["editor-note"]}, {"text": {"fa": "توضیح مهم: اینکه یک باور یا آیین برای ادامهٔ زندگی مفید است، دربارهٔ درستی آن چیزی نمی‌گوید؛ منتقدان فرق «کارکرد» و «حقیقت» را یادآوری می‌کنند. همچنین ادعای سخنران که کسی که زندگی‌اش بیشتر هنر، عشق یا دین است «جدیت زندگی» را ندارد، نظر شخصی اوست؛ شوتس چنین حکمی نداده و بسیاری از آدم‌ها کارِ روزمره و تعهد دینی یا هنری را با هم دارند.", "en": "Caveat: that a belief or ritual helps people carry on says nothing about whether it is true; critics stress the difference between function and truth. The lecturer's claim that someone whose life is mostly art, love or religion lacks seriousness is his own opinion, not Schutz's; many people combine daily work with artistic or religious commitment.", "nl": "Caveat: that a belief or ritual helps people carry on says nothing about whether it is true; critics stress the difference between function and truth. The lecturer's claim that someone whose life is mostly art, love or religion lacks seriousness is his own opinion, not Schutz's; many people combine daily work with artistic or religious commitment."}, "sources": [], "flags": ["contested", "editor-note"]}], "links": [{"to": "soc:social-construction", "rel": "part-of", "note": {"fa": "ایدهٔ واقعیتِ اصلیِ روزمره پایهٔ نظریهٔ ساخت اجتماعی واقعیت است.", "en": "The idea of everyday life as paramount reality underlies the social construction of reality.", "nl": "The idea of everyday life as paramount reality underlies the social construction of reality."}}, {"to": "phil:absurd-meaning", "rel": "see-also", "note": {"fa": "پرسش پوچی و معنا در برابر مرگ.", "en": "The question of absurdity and meaning in the face of death.", "nl": "The question of absurdity and meaning in the face of death."}}, {"to": "soc:secularization", "rel": "see-also", "note": {"fa": "نقش دین در پناه دادن به آدم‌ها در برابر مرگ و ناامنی.", "en": "Religion's role in sheltering people from death and insecurity.", "nl": "Religion's role in sheltering people from death and insecurity."}}, {"to": "soc:berger-humor-authoritarian", "rel": "see-also", "note": {"fa": "شوخی به‌عنوان یکی از همین پرانتزها.", "en": "Humour as one such bracket.", "nl": "Humour as one such bracket."}}], "people": ["core:alfred-schutz", "core:peter-l-berger", "core:thomas-luckmann", "core:marcel-mauss"], "sources": ["src:2204f8317c", "src:26a4a26b1b", "src:6788e0e480", "src:971ae510a9", "src:e73477f663"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:culture-time-freedom", "kind": "concept", "title": {"fa": "فرهنگ، زمان و آزادی: جامعه ما را نگاه می‌کند", "en": "Culture, time and freedom: society looks back at us", "nl": "Cultuur, tijd en vrijheid: de samenleving kijkt mee"}, "aliases": [], "parent": "soc:values", "field": "soc:values", "summary": {"fa": "سخنران نشان می‌دهد فرهنگ چرخه‌ای از درونی‌کردن و بیرونی‌کردن است: ما جهان را می‌پذیریم و دوباره با کنش جمعی آن را تغییر می‌دهیم. او پیشنهاد می‌کند که حتی زمان، فاصله و درد را بخشی فرهنگی-اجتماعی بدانیم و می‌گوید تشخیص آزادی واقعی در فرهنگ‌های بسته دشوار است. این‌ها ایده‌ها و تأملات سخنران هستند و بعضی را باید با احتیاط خواند.", "en": "The lecturer presents culture as a cycle of internalising and externalising: we absorb the world and then reshape it through collective action. He suggests that even time, distance and pain have a socio-cultural side, and that real freedom is hard to identify in closed cultures. These are the lecturer's reflections, and some need cautious reading.", "nl": "De docent beschrijft cultuur als een cyclus van internaliseren en externaliseren. Hij stelt dat zelfs tijd, afstand en pijn een sociaal-culturele kant hebben en dat vrijheid in gesloten culturen moeilijk te herkennen is."}, "points": [{"text": {"fa": "فرهنگ هم درونی است و هم بیرونی: ما محیط و هنجارها را می‌بینیم و می‌پذیریم، سپس آن‌ها را تغییر می‌دهیم و دوباره به جامعه برمی‌گردانیم و نسل بعد دوباره درونی‌شان می‌کند. سخنران پوشش را نمونه می‌آورد که با تصمیم‌های جمعی آرام‌آرام تغییر می‌کند. این همان چرخه‌ای است که برگر و لاکمن شرح داده‌اند.", "en": "Culture is both internal and external: we see and accept the environment and its norms, then change them and return them to society, and the next generation internalises them again. The lecturer cites dress norms shifting gradually through collective decisions. This is the cycle Berger and Luckmann described.", "nl": "Culture is both internal and external: we see and accept the environment and its norms, then change them and return them to society, and the next generation internalises them again. The lecturer cites dress norms shifting gradually through collective decisions. This is the cycle Berger and Luckmann described."}, "sources": ["src:358e9ed202", "src:e197013822"], "flags": []}, {"text": {"fa": "به گفتهٔ سخنران، زمان را می‌توان با تغییر برابر گرفت. جامعه‌ای که مدتی طولانی تغییر نکند «بی‌تاریخ» می‌شود، و سرعت تغییر اجتماعی بر حس گذر زمان اثر دارد. او پیشنهاد می‌کند فاصله و زمان هم مثل دوری و نزدیکی برای ساکن شهر بزرگ و روستا امری تجربی-اجتماعی باشد. این فرضیهٔ خود اوست.", "en": "Per the lecturer, time can be equated with change: a society that does not change for a long time becomes 'historyless', and the pace of social change affects the felt passage of time. He suggests distance and time, like 'far' and 'near' for a big-city versus a village dweller, are partly social experiences. This is his own hypothesis.", "nl": "Per the lecturer, time can be equated with change: a society that does not change for a long time becomes 'historyless', and the pace of social change affects the felt passage of time. He suggests distance and time, like 'far' and 'near' for a big-city versus a village dweller, are partly social experiences. This is his own hypothesis."}, "sources": ["src:358e9ed202", "src:255b0ded7e"], "flags": ["editor-note"]}, {"text": {"fa": "درد هم فقط حس فیزیولوژیک نیست و معنای فرهنگی دارد. سخنران نمونه‌هایی می‌آورد که در آن درد را عبادت یا هزینه‌ای مقدس می‌بینند، و حکایتی از بیماری روستایی که پس از قرار گرفتن کنار دستگاه رادیولوژی بهبودی حس کرد. این حکایت است و شاهد پژوهشی نیست، ولی با پژوهش‌های مردم‌شناختی دربارهٔ تفاوت فرهنگی در بیان و تجربهٔ درد و با اثر انتظار هم‌خوان است.", "en": "Pain too is not only a physiological sensation and carries cultural meaning. The lecturer gives cases where pain is seen as worship or a sacred cost, and an anecdote of a rural patient who felt better after being near an X-ray machine. This is an anecdote, not research evidence, but it fits anthropological work on cultural differences in expressing and experiencing pain, and expectation effects.", "nl": "Pain too is not only a physiological sensation and carries cultural meaning. The lecturer gives cases where pain is seen as worship or a sacred cost, and an anecdote of a rural patient who felt better after being near an X-ray machine. This is an anecdote, not research evidence, but it fits anthropological work on cultural differences in expressing and experiencing pain, and expectation effects."}, "sources": ["src:358e9ed202", "src:e08b284a4f"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، فرهنگ حتی وقتی نادیده‌اش بگیریم همچنان ما را «می‌نگرد» و ارزش‌ها ما را می‌خوانند؛ در جهان مدرن دعوت‌های گوناگون بیشتر است و در فرهنگ‌های بسته کمتر. او به فروید ارجاع می‌دهد که فرهنگ را مهارکنندهٔ غریزه می‌دانست. به باور او در جوامع بسته تشخیص این‌که انتخاب فرد آزاد بوده یا فرهنگی تقریباً ناممکن است، مثلاً این‌که مادرش پس از مرگ همسر ازدواج نکرد چون خواست یا چون فرهنگ اجازه نمی‌داد.", "en": "Per the lecturer, culture keeps 'looking at us' even when we ignore it, and values call to us; the modern world offers more such invitations, closed cultures fewer. He refers to Freud, who saw culture as restraining instinct. He argues that in closed societies it is almost impossible to tell whether a choice was free or cultural, as with his mother's choice not to remarry after being widowed.", "nl": "Per the lecturer, culture keeps 'looking at us' even when we ignore it, and values call to us; the modern world offers more such invitations, closed cultures fewer. He refers to Freud, who saw culture as restraining instinct. He argues that in closed societies it is almost impossible to tell whether a choice was free or cultural, as with his mother's choice not to remarry after being widowed."}, "sources": ["src:358e9ed202", "src:c3dfddaab2"], "flags": ["editor-note"]}, {"text": {"fa": "نکتهٔ احتیاط: این‌که جامعهٔ بی‌تغییر «بی‌زمان» یا «عقب‌مانده» است مورد مناقشه است؛ مردم‌شناسانی مثل لوی‌استروس از جوامع «سرد» سخن گفته‌اند که عمداً تغییر را کند نگه می‌دارند، و چارچوب «عقب‌ماندگی» را منتقدان استعمارگرایانه می‌دانند. حس تندتر گذشتن زمان با افزایش سن هم دلیل‌های روان‌شناختی و عصب‌شناختی دارد و فقط اجتماعی نیست. ایدهٔ ارتباط شتاب تغییر و حس زمان را روزا (شتاب اجتماعی) جدی‌تر بررسی کرده است.", "en": "Caveat: that an unchanging society is 'timeless' or 'backward' is disputed; anthropologists such as Lévi-Strauss spoke of 'cold' societies that deliberately keep change slow, and critics see the 'backwardness' frame as colonial. The feeling that time speeds up with age also has psychological and neurological explanations and is not only social. The link between accelerating change and felt time is studied more rigorously by Rosa (social acceleration).", "nl": "Caveat: that an unchanging society is 'timeless' or 'backward' is disputed; anthropologists such as Lévi-Strauss spoke of 'cold' societies that deliberately keep change slow, and critics see the 'backwardness' frame as colonial. The feeling that time speeds up with age also has psychological and neurological explanations and is not only social. The link between accelerating change and felt time is studied more rigorously by Rosa (social acceleration)."}, "sources": ["src:255b0ded7e"], "flags": ["contested", "editor-note"]}], "links": [{"to": "soc:social-construction", "rel": "explains", "note": {"fa": "چرخهٔ درونی‌کردن و بیرونی‌کردن فرهنگ", "en": "The internalising and externalising cycle of culture", "nl": "The internalising and externalising cycle of culture"}}, {"to": "soc:value-change", "rel": "see-also", "note": {"fa": "تغییر ارزش‌ها و پذیرش گزینه‌های تازه", "en": "Value change and acceptance of new options", "nl": "Value change and acceptance of new options"}}, {"to": "soc:sociological-imagination", "rel": "see-also", "note": {"fa": "دیدن اثر ساختار اجتماعی بر انتخاب‌های فردی", "en": "Seeing the effect of social structure on individual choices", "nl": "Seeing the effect of social structure on individual choices"}}], "people": ["core:sigmund-freud", "core:peter-l-berger", "core:hartmut-rosa"], "sources": ["src:255b0ded7e", "src:358e9ed202", "src:c3dfddaab2", "src:e08b284a4f", "src:e197013822"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "d
