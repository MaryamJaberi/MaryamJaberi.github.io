ull, "wikidata": null, "status": "draft"}, {"id": "soc:values", "kind": "field", "title": {"fa": "ارزش‌ها، دین و نسل‌ها", "en": "Values, religion & generations", "nl": "Waarden, religie & generaties"}, "aliases": [], "parent": "soc:soc", "field": null, "summary": {"fa": "ارزش‌ها چگونه با توسعه عوض می‌شوند، دین چه می‌شود و نسل‌ها از کجا متفاوت می‌شوند؟", "en": "How values shift with development, what happens to religion, and where generations diverge.", "nl": "Hoe waarden verschuiven met ontwikkeling, wat er met religie gebeurt en waar generaties uiteenlopen."}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:migration-theories", "kind": "concept", "title": {"fa": "نظریه‌های مهاجرت", "en": "Theories of migration", "nl": "Migratietheorieën"}, "aliases": [], "parent": "soc:space", "field": "soc:space", "summary": {"fa": "چرا مردم مهاجرت می‌کنند و چرا ادامه می‌دهند؟ اقتصاد نئوکلاسیک می‌گوید اختلاف دستمزد؛ «اقتصاد نوین مهاجرت» می‌گوید خانواده برای پراکندن ریسک یک نفر را می‌فرستد؛ نظریهٔ شبکه می‌گوید هر مهاجر هزینهٔ مهاجرت بعدی را کم می‌کند، برای همین مهاجرت خودتداوم‌بخش است.", "en": "Why do people migrate and why does it continue? Neoclassical economics says wage gaps; the \"new economics of migration\" says the household sends one member to spread risk; network theory says each migrant lowers the cost of the next, which is why migration sustains itself.", "nl": "Waarom migreren mensen en waarom gaat het door? De neoklassieke economie zegt loonverschillen; de \"nieuwe migratie-economie\" zegt dat het huishouden één lid stuurt om risico te spreiden; de netwerktheorie zegt dat elke migrant de kosten voor de volgende verlaagt, waardoor migratie zichzelf in stand houdt."}, "points": [{"text": {"fa": "مسی و همکاران (۱۹۹۳): نظریه‌ها رقیب نیستند، لایه‌های مختلف یک پدیده‌اند: آغاز مهاجرت را عوامل ساختاری و اقتصادی توضیح می‌دهند، تداومش را شبکه‌ها و نهادها («علیت انباشتی»).", "en": "Massey et al. (1993): the theories are not rivals but layers of one phenomenon: structural and economic factors explain the start of migration, networks and institutions its continuation (\"cumulative causation\").", "nl": "Massey et al. (1993): the theories are not rivals but layers of one phenomenon: structural and economic factors explain the start of migration, networks and institutions its continuation (\"cumulative causation\")."}, "sources": ["src:7712b264c9"], "flags": []}, {"text": {"fa": "برای ایران، مهاجرت تحصیل‌کردگان («فرار مغزها») و مهاجرت از افغانستان به ایران دو جریان بزرگ‌اند که هر دو با نظریهٔ شبکه بهتر از اختلاف دستمزد توضیح داده می‌شوند؛ آمار دقیق مهاجرت خروجی ایران رسماً منتشر نمی‌شود و برآوردها پراکنده‌اند.", "en": "For Iran, the emigration of the educated (\"brain drain\") and migration from Afghanistan into Iran are the two large flows, both better explained by network theory than by wage gaps; precise statistics on emigration from Iran are not officially published and estimates vary widely.", "nl": "For Iran, the emigration of the educated (\"brain drain\") and migration from Afghanistan into Iran are the two large flows, both better explained by network theory than by wage gaps; precise statistics on emigration from Iran are not officially published and estimates vary widely."}, "sources": ["src:7712b264c9"], "flags": ["editor-note"]}], "links": [{"to": "soc:weak-ties", "rel": "explains", "note": {"fa": "شبکه‌ها در مهاجرت", "en": "Networks in migration", "nl": "Networks in migration"}}, {"to": "tabar:ancient-dna", "rel": "bridges", "note": {"fa": "مهاجرت در مقیاس هزاره‌ها", "en": "Migration on the scale of millennia", "nl": "Migration on the scale of millennia"}}, {"to": "soc:urbanism", "rel": "see-also", "note": {"fa": "شهر مقصد", "en": "The destination city", "nl": "The destination city"}}], "people": [], "sources": ["src:7712b264c9"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:urbanism", "kind": "concept", "title": {"fa": "شهرنشینی به‌مثابه شیوهٔ زندگی", "en": "Urbanism as a way of life", "nl": "Urbanisme als levenswijze"}, "aliases": [], "parent": "soc:space", "field": "soc:space", "summary": {"fa": "ورث گفت اندازه، تراکم و ناهمگونی شهر روابط را سطحی، نقش‌ها را تکه‌تکه و کنترل اجتماعی غیررسمی را ضعیف می‌کند. سه‌چهارم ایرانیان اکنون شهرنشین‌اند؛ جابه‌جایی‌ای که در یک نسل رخ داد و بسیاری از تنش‌های ارزشی امروز را توضیح می‌دهد.", "en": "Wirth argued that a city's size, density and heterogeneity make relations superficial, roles fragmented and informal social control weak. Three-quarters of Iranians now live in cities; a shift that happened within one generation and explains many of today's value tensions.", "nl": "Wirth stelde dat omvang, dichtheid en heterogeniteit van de stad relaties oppervlakkig, rollen gefragmenteerd en informele sociale controle zwak maken. Driekwart van de Iraniërs woont nu in steden; een verschuiving binnen één generatie die veel van de huidige waardespanningen verklaart."}, "points": [{"text": {"fa": "ورث (۱۹۳۸): تعریف جامعه‌شناختی شهر: سکونت‌گاه بزرگ، متراکم و دائمیِ افراد ناهمگون؛ پیامدها: روابط ثانویه و ابزاری، تخصصی شدن، تحمل تفاوت، و در عین حال بی‌نامی و آنومی.", "en": "Wirth (1938): the sociological definition of a city: a large, dense, permanent settlement of heterogeneous individuals; consequences: secondary and instrumental relations, specialisation, tolerance of difference, and also anonymity and anomie.", "nl": "Wirth (1938): the sociological definition of a city: a large, dense, permanent settlement of heterogeneous individuals; consequences: secondary and instrumental relations, specialisation, tolerance of difference, and also anonymity and anomie."}, "sources": ["src:0fd2854ccd"], "flags": []}, {"text": {"fa": "سرشماری ۱۳۹۵: ۷۴ درصد جمعیت ایران شهرنشین است، در برابر حدود ۳۱ درصد در ۱۳۳۵؛ تهران و حاشیه‌اش بیش از ۱۵ میلیون نفر. نقدِ ورث: روستاییان مهاجر در شهر اغلب «روستای درون شهر» می‌سازند و پیوندهای قوی را حفظ می‌کنند.", "en": "The 2016 census: 74 percent of Iran's population is urban, against about 31 percent in 1956; Tehran and its periphery exceed 15 million. The critique of Wirth: rural migrants in the city often build a \"village in the city\" and keep strong ties.", "nl": "The 2016 census: 74 percent of Iran's population is urban, against about 31 percent in 1956; Tehran and its periphery exceed 15 million. The critique of Wirth: rural migrants in the city often build a \"village in the city\" and keep strong ties."}, "sources": ["src:1f3b6b5f19"], "flags": []}], "links": [{"to": "soc:migration-theories", "rel": "see-also", "note": {"fa": "مهاجرت", "en": "Migration", "nl": "Migration"}}, {"to": "soc:anomie", "rel": "explains", "note": {"fa": "آنومی شهری", "en": "Urban anomie", "nl": "Urban anomie"}}, {"to": "psy:belonging", "rel": "bridges", "note": {"fa": "تعلق در ویکی روان", "en": "Belonging in the psychology wiki", "nl": "Belonging in the psychology wiki"}}], "people": [], "sources": ["src:0fd2854ccd", "src:1f3b6b5f19"], "booklets": [], "origin": null, "iran": "iran:urbanization", "wikidata": null, "status": "draft"}, {"id": "soc:iran-fertility", "kind": "concept", "title": {"fa": "گذار باروری ایران: از ۶٫۵ به زیر ۲", "en": "Iran's fertility transition: from 6.5 to below 2", "nl": "De Iraanse vruchtbaarheidstransitie: van 6,5 naar onder de 2"}, "aliases": [], "parent": "soc:demography", "field": "soc:demography", "summary": {"fa": "یکی از سریع‌ترین افت‌های باروری ثبت‌شده در جهان: میانگین فرزند هر زن از حدود ۶٫۵ در اوایل دههٔ ۱۳۶۰ به حدود ۲ در ۱۳۷۹ و زیر ۲ پس از آن رسید؛ با سواد زنان، شهرنشینی، شبکهٔ بهداشت روستایی و برنامهٔ تنظیم خانواده. سیاست‌های تشویقی دههٔ ۱۳۹۰ روند را برنگرداندند.", "en": "One of the fastest fertility declines ever recorded: children per woman fell from about 6.5 in the early 1980s to about 2 in 2000 and below 2 after; driven by women's literacy, urbanisation, the rural health network and the family planning programme. Pronatalist policies of the 2010s did not reverse the trend.", "nl": "Een van de snelste vruchtbaarheidsdalingen ooit geregistreerd: kinderen per vrouw daalde van zo'n 6,5 begin jaren tachtig naar ongeveer 2 in 2000 en daaronder nadien; gedreven door alfabetisering van vrouwen, verstedelijking, het rurale gezondheidsnetwerk en het gezinsplanningsprogramma. Pronatalistisch beleid in de jaren 2010 keerde de trend niet."}, "points": [{"text": {"fa": "عباسی‌شوازی، مک‌دونالد و حسینی‌چاووشی (۲۰۰۹): افت باروری در همهٔ استان‌ها، شهر و روستا و همهٔ سطوح سواد رخ داد؛ عامل کلیدی، تغییر «ایده‌آل خانواده» و دسترسی به وسایل پیشگیری از راه خانه‌های بهداشت بود، نه فقط توسعهٔ اقتصادی.", "en": "Abbasi-Shavazi, McDonald and Hosseini-Chavoshi (2009): fertility fell in every province, in cities and villages and at all literacy levels; the key factors were a changed \"family ideal\" and access to contraception through rural health houses, not economic development alone.", "nl": "Abbasi-Shavazi, McDonald and Hosseini-Chavoshi (2009): fertility fell in every province, in cities and villages and at all literacy levels; the key factors were a changed \"family ideal\" and access to contraception through rural health houses, not economic development alone."}, "sources": ["src:cded26c9f1"], "flags": []}, {"text": {"fa": "سازمان ملل (۲۰۲۴): نرخ باروری کل ایران حدود ۱٫۷؛ جمعیت در میانهٔ قرن به اوج می‌رسد و سپس سالمند می‌شود. همین الگو در ترکیه، تونس و بسیاری از کشورهای اسلامی دیده می‌شود و «استثنای فرهنگی» را رد می‌کند.", "en": "United Nations (2024): Iran's total fertility rate about 1.7; population peaks mid-century and then ages. The same pattern appears in Turkey, Tunisia and many other Muslim countries, refuting a \"cultural exception\".", "nl": "United Nations (2024): Iran's total fertility rate about 1.7; population peaks mid-century and then ages. The same pattern appears in Turkey, Tunisia and many other Muslim countries, refuting a \"cultural exception\"."}, "sources": ["src:67de606631"], "flags": []}], "links": [{"to": "soc:demographic-transition", "rel": "part-of", "note": {"fa": "نمونه‌ای از گذار جمعیتی", "en": "A case of demographic transition", "nl": "A case of demographic transition"}}, {"to": "soc:value-change", "rel": "explains", "note": {"fa": "تغییر ایده‌آل خانواده", "en": "The changed family ideal", "nl": "The changed family ideal"}}, {"to": "soc:urbanism", "rel": "see-also", "note": {"fa": "شهرنشینی", "en": "Urbanisation", "nl": "Urbanisation"}}], "people": ["core:mohammad-jalal-abbasi-shavazi"], "sources": ["src:67de606631", "src:cded26c9f1"], "booklets": [], "origin": null, "iran": "iran:fertility", "wikidata": null, "status": "draft"}, {"id": "soc:generations", "kind": "concept", "title": {"fa": "نسل‌ها: مسئلهٔ مانهایم", "en": "Generations: Mannheim's problem", "nl": "Generaties: het probleem van Mannheim"}, "aliases": [], "parent": "soc:values", "field": "soc:values", "summary": {"fa": "هم‌سن بودن نسل نمی‌سازد؛ تجربهٔ مشترک رویدادهای بزرگ در سال‌های شکل‌گیری (۱۷ تا ۲۵ سالگی) نسل می‌سازد. برچسب‌های «دههٔ شصتی، هشتادی» تا جایی معنا دارند که به چنین تجربهٔ مشترکی اشاره کنند؛ وگرنه سن، دوره و نسل را قاطی می‌کنند.", "en": "Being the same age does not make a generation; the shared experience of great events in the formative years (17 to 25) does. Labels like \"the sixties-born, the eighties-born\" are meaningful insofar as they point to such shared experience; otherwise they confuse age, period and cohort.", "nl": "Even oud zijn maakt geen generatie; de gedeelde ervaring van grote gebeurtenissen in de vormende jaren (17 tot 25) wel. Labels als \"de jaren-zestig-geborenen\" zijn betekenisvol voor zover ze naar zo'n gedeelde ervaring verwijzen; anders verwarren ze leeftijd, periode en cohort."}, "points": [{"text": {"fa": "مانهایم (۱۹۲۸): «موقعیت نسلی» (هم‌زمانی تولد) تنها امکان است؛ «نسل بالفعل» وقتی پدید می‌آید که هم‌سالان در جریان تاریخی مشترکی درگیر شوند، و درون آن «واحدهای نسلی» متفاوت و حتی متخاصم شکل می‌گیرند.", "en": "Mannheim (1928): \"generational location\" (being born together) is only a possibility; an \"actual generation\" arises when age-peers are caught up in a shared historical current, and within it different, even hostile, \"generation units\" form.", "nl": "Mannheim (1928): \"generational location\" (being born together) is only a possibility; an \"actual generation\" arises when age-peers are caught up in a shared historical current, and within it different, even hostile, \"generation units\" form."}, "sources": ["src:18b66d31f0"], "flags": []}, {"text": {"fa": "مسئلهٔ روش‌شناختی: هر تفاوت مشاهده‌شده میان جوانان و پیران می‌تواند اثر سن (همه با پیری محافظه‌کارتر می‌شوند)، اثر دوره (همه در یک بحران تغییر می‌کنند) یا اثر نسل باشد؛ جدا کردن این سه با داده‌های مقطعی ناممکن است و نیاز به پیمایش‌های تکرارشونده دارد.", "en": "The methodological problem: any observed difference between young and old may be an age effect (everyone grows more conservative), a period effect (everyone changes in a crisis) or a cohort effect; separating the three is impossible with cross-sectional data and needs repeated surveys.", "nl": "The methodological problem: any observed difference between young and old may be an age effect (everyone grows more conservative), a period effect (everyone changes in a crisis) or a cohort effect; separating the three is impossible with cross-sectional data and needs repeated surveys."}, "sources": ["src:8f0d6ab822"], "flags": ["editor-note"]}], "links": [{"to": "soc:value-change", "rel": "explains", "note": {"fa": "تغییر ارزش‌ها از راه جایگزینی نسل‌ها", "en": "Value change through generational replacement", "nl": "Value change through generational replacement"}}, {"to": "psy:adolescence", "rel": "bridges", "note": {"fa": "نوجوانی و سال‌های شکل‌گیری", "en": "Adolescence and the formative years", "nl": "Adolescence and the formative years"}}], "people": ["core:karl-mannheim"], "sources": ["src:18b66d31f0", "src:8f0d6ab822"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:value-change", "kind": "concept", "title": {"fa": "تغییر ارزش‌ها: از بقا به ابراز خود", "en": "Value change: from survival to self-expression", "nl": "Waardeverandering: van overleving naar zelfexpressie"}, "aliases": [], "parent": "soc:values", "field": "soc:values", "summary": {"fa": "اینگلهارت با پنجاه سال پیمایش در صد کشور نشان داد با امنیت اقتصادی و وجودی، ارزش‌ها از «بقا» (نظم، سنت، دین) به «ابراز خود» (آزادی، برابری جنسیتی، تحمل تفاوت) می‌چرخند؛ تغییر بیشتر از راه جایگزینی نسل‌هاست تا تغییر عقیدهٔ افراد. ایران روی این نقشه حرکت کرده است.", "en": "Inglehart, with fifty years of surveys in a hundred countries, showed that with economic and existential security values turn from \"survival\" (order, tradition, religion) to \"self-expression\" (freedom, gender equality, tolerance of difference); change comes more through generational replacement than individuals changing their minds. Iran has moved on this map.", "nl": "Inglehart toonde met vijftig jaar surveys in honderd landen dat waarden met economische en existentiële zekerheid verschuiven van \"overleving\" (orde, traditie, religie) naar \"zelfexpressie\" (vrijheid, gendergelijkheid, tolerantie); verandering komt meer door generatiewisseling dan doordat individuen van mening veranderen. Iran heeft zich op deze kaart bewogen."}, "points": [{"text": {"fa": "اینگلهارت و ولزل (۲۰۰۵): دو محور «سنتی–سکولارعقلانی» و «بقا–ابراز خود» بیشتر واریانس ارزش‌های جهان را می‌گیرند؛ توسعه کشورها را روی هر دو به جلو می‌راند، ولی میراث فرهنگی (مسیحی، اسلامی، کنفوسیوسی…) جای شروع را تعیین می‌کند.", "en": "Inglehart and Welzel (2005): two axes, \"traditional–secular-rational\" and \"survival–self-expression\", capture most of the world's variance in values; development pushes countries forward on both, but cultural heritage (Christian, Islamic, Confucian…) sets the starting point.", "nl": "Inglehart and Welzel (2005): two axes, \"traditional–secular-rational\" and \"survival–self-expression\", capture most of the world's variance in values; development pushes countries forward on both, but cultural heritage (Christian, Islamic, Confucian…) sets the starting point."}, "sources": ["src:d7a317cebe"], "flags": []}, {"text": {"fa": "اینگلهارت (۲۰۱۸): تغییر ارزش‌ها نسلی است و زمانی خودش را در سیاست نشان می‌دهد که نسل جدید اکثریت شود؛ ناامنی تازه (بحران اقتصادی، مهاجرت) می‌تواند واکنش «اقتدارگرایانه» بسازد، اما روند بلندمدت را برنگردانده است.", "en": "Inglehart (2018): value change is generational and shows up in politics when the new cohort becomes the majority; new insecurity (economic crisis, migration) can produce an \"authoritarian reflex\", but has not reversed the long-run trend.", "nl": "Inglehart (2018): value change is generational and shows up in politics when the new cohort becomes the majority; new insecurity (economic crisis, migration) can produce an \"authoritarian reflex\", but has not reversed the long-run trend."}, "sources": ["src:8f0d6ab822"], "flags": ["contested"]}, {"text": {"fa": "در سه موج پیمایش ملی ارزش‌ها و نگرش‌های ایرانیان (۱۳۷۹، ۱۳۸۲، ۱۳۹۴) و موج‌های پیمایش جهانی ارزش‌ها، ایران روی محور بقا–ابراز خود جابه‌جا شده: افزایش اهمیت آزادی فردی و برابری جنسیتی، به‌ویژه در نسل‌های جوان‌تر و شهرها.", "en": "Across the three waves of the national Iranian Values and Attitudes survey (2000, 2003, 2015) and the World Values Survey waves, Iran has moved on the survival–self-expression axis: rising weight of individual freedom and gender equality, especially among younger cohorts and in cities.", "nl": "Across the three waves of the national Iranian Values and Attitudes survey (2000, 2003, 2015) and the World Values Survey waves, Iran has moved on the survival–self-expression axis: rising weight of individual freedom and gender equality, especially among younger cohorts and in cities."}, "sources": ["src:95287955fe", "src:4a310ccbde"], "flags": []}], "links": [{"to": "soc:generations", "rel": "explains", "note": {"fa": "سازوکار نسلی تغییر", "en": "The generational mechanism of change", "nl": "The generational mechanism of change"}}, {"to": "soc:secularization", "rel": "see-also", "note": {"fa": "دین", "en": "Religion", "nl": "Religion"}}, {"to": "psy:p-personality", "rel": "bridges", "note": {"fa": "ارزش‌ها در روان‌شناسی", "en": "Values in psychology", "nl": "Values in psychology"}}], "people": ["core:ronald-inglehart"], "sources": ["src:4a310ccbde", "src:8f0d6ab822", "src:95287955fe", "src:d7a317cebe"], "booklets": [], "origin": null, "iran": "iran:values-shift", "wikidata": null, "status": "draft"}], "people": {"core:james-coleman": {"id": "core:james-coleman", "name": {"fa": "جیمز کلمن", "en": "James Coleman", "nl": "James Coleman"}, "years": "", "note": {"fa": ""}, "wikidata": "Q123668416", "wikis": ["psy"]}, "core:erving-goffman": {"id": "core:erving-goffman", "name": {"fa": "اروینگ گافمن", "en": "Erving Goffman", "nl": "Erving Goffman"}, "years": "", "note": {"fa": ""}, "wikidata": "Q314471", "wikis": ["psy"]}, "core:robert-k-merton": {"id": "core:robert-k-merton", "name": {"fa": "رابرت مرتون", "en": "Robert K. Merton", "nl": "Robert K. Merton"}, "years": "1910–2003", "note": {"fa": "ساختار اجتماعی و آنومی؛ کارکرد پنهان"}, "wikidata": "Q312843", "wikis": ["soc"]}, "core:karl-mannheim": {"id": "core:karl-mannheim", "name": {"fa": "کارل مانهایم", "en": "Karl Mannheim", "nl": "Karl Mannheim"}, "years": "1893–1947", "note": {"fa": "جامعه‌شناسی معرفت؛ مسئلهٔ نسل‌ها"}, "wikidata": "Q76823", "wikis": ["soc"]}, "core:kant": {"id": "core:kant", "name": {"fa": "کانت", "en": "Kant", "nl": "Kant"}, "years": "", "note": {"fa": ""}, "wikidata": "Q9312", "wikis": ["psy"]}, "core:erica-chenoweth": {"id": "core:erica-chenoweth", "name": {"fa": "اریکا چنووت", "en": "Erica Chenoweth", "nl": "Erica Chenoweth"}, "years": "", "note": {"fa": "مقاومت مدنی؛ قاعدهٔ ۳٫۵ درصد"}, "wikidata": "Q5387865", "wikis": ["soc"]}, "core:charles-kurzman": {"id": "core:charles-kurzman", "name": {"fa": "چارلز کرزمن", "en": "Charles Kurzman", "nl aisal. Population and Development Review, 19(3), 431–466.", "year": 1993, "tier": 1, "wikis": ["soc"], "url": "https://doi.org/10.2307/2938462"}, "src:ec182152dc": {"id": "src:ec182152dc", "cite": "Coleman, J. S. (1988). Social capital in the creation of human capital. American Journal of Sociology, 94, S95–S120.", "year": 1988, "tier": 1, "wikis": ["soc"], "url": "https://doi.org/10.1086/228943"}, "src:18b66d31f0": {"id": "src:18b66d31f0", "cite": "Mannheim, K. (1928/1952). The problem of generations. In Essays on the Sociology of Knowledge (pp. 276–322). Routledge.", "year": null, "tier": 2, "wikis": ["soc"]}, "src:fcce5dbd78": {"id": "src:fcce5dbd78", "cite": "Durkheim, É. (1893). De la division du travail social. Alcan.", "year": 1893, "tier": 2, "wikis": ["soc"]}, "src:0fd2854ccd": {"id": "src:0fd2854ccd", "cite": "Wirth, L. (1938). Urbanism as a way of life. American Journal of Sociology, 44(1), 1–24.", "year": 1938, "tier": 1, "wikis": ["soc"], "url": "https://doi.org/10.1086/217913"}, "src:4a310ccbde": {"id": "src:4a310ccbde", "cite": "Haerpfer, C., Inglehart, R., Moreno, A., Welzel, C., et al. (Eds.) (2022). World Values Survey Wave 7 (2017–2022) Cross-National Data-Set. WVSA Secretariat.", "year": 2022, "tier": 1, "wikis": ["soc"], "url": "https://www.worldvaluessurvey.org/WVSDocumentationWV7.jsp"}}, "iran": {"iran:fertility": {"id": "iran:fertility", "domain": "soc", "question": {"fa": "باروری در ایران چقدر و چگونه افت کرد؟", "en": "How far and how did fertility fall in Iran?"}, "finding": {"fa": "از حدود ۶٫۵ فرزند به ازای هر زن در اوایل دههٔ ۱۳۶۰ به حدود ۲ در ۱۳۷۹ و حدود ۱٫۷ در دههٔ ۱۴۰۰؛ افت در همهٔ استان‌ها و سطوح سواد. سیاست‌های تشویقی اخیر روند را برنگردانده‌اند.", "en": "From about 6.5 children per woman in the early 1980s to about 2 in 2000 and about 1.7 in the 2020s; the decline occurred in all provinces and literacy levels. Recent pronatalist policies have not reversed it."}, "year": 2024, "method": "census and DHS-type surveys; UN estimates", "grade": "A", "contested": false, "source": [{"title": "Abbasi-Shavazi, M. J., McDonald, P., & Hosseini-Chavoshi, M. (2009). The Fertility Transition in Iran: Revolution and Reproduction. Springer.", "url": "https://doi.org/10.1007/978-90-481-3198-3"}, {"title": "United Nations, Department of Economic and Social Affairs, Population Division (2024). World Population Prospects 2024.", "url": "https://population.un.org/wpp/"}], "fields": [], "concepts": ["soc:iran-fertility"], "capability": [2, 10]}, "iran:urbanization": {"id": "iran:urbanization", "domain": "soc", "question": {"fa": "شهرنشینی در ایران چقدر و چقدر سریع بوده است؟", "en": "How urban is Iran, and how fast did it get there?"}, "finding": {"fa": "سرشماری ۱۳۹۵: ۷۴ درصد شهرنشین (از حدود ۳۱ درصد در ۱۳۳۵)؛ تهران و حومه بیش از ۱۵ میلیون نفر.", "en": "2016 census: 74 percent urban (from about 31 percent in 1956); Tehran and periphery over 15 million."}, "year": 2016, "method": "national census", "grade": "A", "contested": false, "source": [{"title": "مرکز آمار ایران (۱۳۹۵). نتایج سرشماری عمومی نفوس و مسکن ۱۳۹۵.", "url": "https://www.amar.org.ir"}], "fields": [], "concepts": ["soc:urbanism"], "capability": [10]}, "iran:values-shift": {"id": "iran:values-shift", "domain": "soc", "question": {"fa": "ارزش‌های ایرانیان در دو دههٔ اخیر چگونه تغییر کرده؟", "en": "How have Iranians' values changed over two decades?"}, "finding": {"fa": "سه موج پیمایش ملی (۱۳۷۹، ۱۳۸۲، ۱۳۹۴) و موج‌های WVS: افزایش اهمیت آزادی فردی، برابری جنسیتی و تحمل تفاوت، به‌ویژه در جوانان و شهرها؛ کاهش اعتماد اجتماعی و اعتماد نهادی؛ پایداری اهمیت خانواده.", "en": "Three national waves (2000, 2003, 2015) and WVS waves: rising weight of individual freedom, gender equality and tolerance, especially among the young and in cities; falling social and institutional trust; stable importance of family."}, "year": 2015, "method": "repeated national surveys", "grade": "B", "contested": false, "source": [{"title": "وزارت فرهنگ و ارشاد اسلامی، دفتر طرح‌های ملی (۱۳۷۹، ۱۳۸۲، ۱۳۹۴). پیمایش ملی ارزش‌ها و نگرش‌های ایرانیان، موج‌های اول تا سوم.", "url": ""}, {"title": "Haerpfer, C., Inglehart, R., Moreno, A., Welzel, C., et al. (Eds.) (2022). World Values Survey Wave 7 (2017–2022) Cross-National Data-Set. WVSA Secretariat.", "url": "https://www.worldvaluessurvey.org/WVSDocumentationWV7.jsp"}], "fields": [], "concepts": ["soc:value-change"], "capability": [4, 7], "critique": "فاصلهٔ موج‌ها نامنظم و پرسش‌ها کاملاً یکسان نیست؛ مقایسهٔ دقیق نیاز به هماهنگ‌سازی دارد."}, "iran:social-trust": {"id": "iran:social-trust", "domain": "soc", "question": {"fa": "اعتماد تعمیم‌یافتهٔ ایرانیان چقدر است؟", "en": "How high is Iranians' generalised trust?"}, "finding": {"fa": "در پیمایش جهانی ارزش‌ها حدود ۱۰ تا ۱۵ درصد می‌گویند «به بیشتر مردم می‌شود اعتماد کرد» (ردهٔ کشورهای کم‌اعتماد)؛ پیمایش ملی ارزش‌ها و نگرش‌ها نیز کاهش اعتماد به مردم را از موج اول (۱۳۷۹) تا سوم (۱۳۹۴) نشان می‌دهد. رقم دقیق به موج و شیوهٔ نمونه‌گیری وابسته است.", "en": "In the World Values Survey about 10 to 15 percent say \"most people can be trusted\" (a low-trust country); the national Values and Attitudes survey also shows trust in people falling from wave 1 (2000) to wave 3 (2015). Exact figures depend on wave and sampling."}, "year": 2020, "method": "national probability surveys (WVS; IVAS)", "grade": "B", "contested": false, "source": [{"title": "Haerpfer, C., Inglehart, R., Moreno, A., Welzel, C., et al. (Eds.) (2022). World Values Survey Wave 7 (2017–2022) Cross-National Data-Set. WVSA Secretariat.", "url": "https://www.worldvaluessurvey.org/WVSDocumentationWV7.jsp"}, {"title": "وزارت فرهنگ و ارشاد اسلامی، دفتر طرح‌های ملی (۱۳۷۹، ۱۳۸۲، ۱۳۹۴). پیمایش ملی ارزش‌ها و نگرش‌های ایرانیان، موج‌های اول تا سوم.", "url": ""}], "fields": [], "concepts": ["soc:generalized-trust"], "capability": [7], "critique": "سؤال واحد و ترجمه‌اش در ایران بحث‌برانگیز است؛ اعتماد «خاص» (به خانواده و آشنایان) بالا و «عام» پایین است و باید جدا گزارش شود."}, "iran:gini": {"id": "iran:gini", "domain": "s
