ch as Norman Geras argue Marx held a concept of human nature. Foucault and Baudrillard also cannot simply be called analysts of capitalism; Foucault built an independent theory of power-knowledge and was critical of Marxism. The claimed Marxian influence on structural functionalism is weak, since that school owes more to Durkheim and Weber; conflict theory is the more Marxian line."}, "sources": ["src:212637666a", "src:c62ab3e353"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "توضیح تکمیلی: برخی جزئیات تاریخی در این جلسه ساده‌شده است. مارکس در ۱۸۴۳ (نه ۱۸۴۲) با ینی فون وستفالن ازدواج کرد. «گسست معرفتی» را آلتوسر نزدیک ۱۸۴۵ می‌داند، نه ۱۸۴۸. اصطلاح «دیکتاتوری پرولتاریا» را مارکس کم به کار برد و معنایش حکومتِ طبقهٔ کارگر در دورهٔ گذار بود؛ معادل‌گرفتنش با حزبِ واحد بیشتر تفسیر لنینی است. دست‌نوشته‌های ۱۸۴۴ هم نخستین بار در ۱۹۳۲ منتشر شد.", "en": "Caveat: some historical details in the lecture are simplified. Marx married Jenny von Westphalen in 1843, not 1842. Althusser dates the epistemological break near 1845, not 1848. Marx used 'dictatorship of the proletariat' rarely and meant working-class rule in a transitional period; equating it with a single party is more a Leninist interpretation. The 1844 Manuscripts were first published in 1932.", "nl": "Caveat: some historical details in the lecture are simplified. Marx married Jenny von Westphalen in 1843, not 1842. Althusser dates the epistemological break near 1845, not 1848. Marx used 'dictatorship of the proletariat' rarely and meant working-class rule in a transitional period; equating it with a single party is more a Leninist interpretation. The 1844 Manuscripts were first published in 1932."}, "sources": ["src:787ee63642", "src:212637666a"], "flags": ["contested", "editor-note"]}], "links": [{"to": "phil:hegel-phenomenology-spirit", "rel": "part-of", "note": {"fa": "اندیشهٔ هگل که مارکس بر آن بنا کرد", "en": "The Hegelian thought Marx built on", "nl": "The Hegelian thought Marx built on"}}, {"to": "soc:marx-censorship-1842", "rel": "see-also", "note": {"fa": "نخستین نوشتهٔ مهم مارکس جوان دربارهٔ سانسور", "en": "Marx's early essay on censorship", "nl": "Marx's early essay on censorship"}}, {"to": "soc:protestant-ethic", "rel": "contrasts", "note": {"fa": "وبر: نقش اندیشه‌ها در شکل‌دادن به اقتصاد، در برابر تعیین مادی مارکس", "en": "Weber: ideas shaping the economy, versus Marx's material determination", "nl": "Weber: ideas shaping the economy, versus Marx's material determination"}}, {"to": "soc:social-construction", "rel": "see-also", "note": {"fa": "ساخت اجتماعی واقعیت و وابستگی آگاهی به جامعه", "en": "Social construction of reality and the dependence of consciousness on society", "nl": "Social construction of reality and the dependence of consciousness on society"}}], "people": ["core:karl-marx", "core:ludwig-feuerbach", "core:friedrich-engels", "core:erich-fromm"], "sources": ["src:04afb1ed45", "src:0ce7ee12f9", "src:212637666a", "src:6696432109", "src:787ee63642", "src:79ffa6a4a3", "src:c62ab3e353"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:religion-ideology-iran-debate", "kind": "concept", "title": {"fa": "آیا دین مسئلهٔ ایران است؟ دیدگاه سخنران و نقدهای آن", "en": "Is religion Iran's problem? The lecturer's view and its critics", "nl": "Is religie het probleem van Iran? Het standpunt van de spreker en kritiek erop"}, "aliases": [], "parent": "soc:theory", "field": "soc:theory", "summary": {"fa": "سخنران برخلاف روایت رایج روشنفکری می‌گوید مسئلهٔ ایران دین نیست، بلکه ابهام در مفاهیمی چون آزادی و اندازه و نقش دولت است. او چپ مارکسیستی را «دین دنیوی» می‌داند و از جامعه‌شناسی دین حمایت می‌کند. این بخش دیدگاه یک لیبرال کلاسیک است و موضوعی مناقشه‌برانگیز؛ نقدها و دیدگاه‌های مقابل در پایین آمده‌اند.", "en": "Against a common narrative among intellectuals, the lecturer argues that Iran's problem is not religion but vagueness about concepts such as freedom and the size and role of the state. He calls the Marxist left a 'worldly religion'. This section is the view of a classical liberal on a contested topic; critiques and opposing views are given below.", "nl": "De spreker stelt dat niet religie, maar onduidelijkheid over vrijheid en de rol van de staat het probleem van Iran is, en noemt het marxisme een wereldlijke religie. Dit is een omstreden standpunt; tegenargumenten staan erbij."}, "points": [{"text": {"fa": "به گفتهٔ سخنران، روایت «مسئلهٔ انسان ایرانی دین یا خرافه است» ژستی روشنفکری است. به نظر او مسئلهٔ اصلی این است که روشنفکران نسبت خود با آزادی و با اندازهٔ دولت را روشن نکرده‌اند. او برای تشبیه، به فرانسه اشاره می‌کند که پس از انقلاب ۱۷۸۹ میان جمهوری و سلطنت دور می‌زد، و می‌گوید باستیا مسئله را در ایده‌های مبهم دربارهٔ دولت و آزادی می‌دید.", "en": "Per the lecturer, the narrative that the Iranian's problem is religion or superstition is an intellectual pose. He thinks the real problem is that intellectuals have not clarified their stance on freedom and on the size of the state. As an analogy he points to France after 1789, cycling between republic and monarchy, and says Bastiat located the problem in vague ideas about state and freedom.", "nl": "Per the lecturer, the narrative that the Iranian's problem is religion or superstition is an intellectual pose. He thinks the real problem is that intellectuals have not clarified their stance on freedom and on the size of the state. As an analogy he points to France after 1789, cycling between republic and monarchy, and says Bastiat located the problem in vague ideas about state and freedom."}, "sources": ["src:ce2a70df17"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، سکولاریسم یعنی جدایی دین از سیاست و تفکیک نهادهای اجتماعی، نه نبود دین‌داری؛ در اروپا و آمریکا کاتولیک‌های بسیاری به کلیسا می‌روند. او همچنین می‌گوید مارکسیسم ساختاری شبیه دین دارد (پایان تاریخ، بهشت زمینی، «پیامبران») و می‌تواند جای دین سنتی را بگیرد، و برخی مناسک اسلامی در ایران ریشه‌ای چندهزارساله دارند.", "en": "Per the lecturer, secularism means separating religion from politics and differentiating social institutions, not the absence of piety; many Catholics in Europe and America still go to church. He also says Marxism has a religion-like structure (an end of history, an earthly paradise, 'prophets') and can replace traditional religion, and that some Islamic rituals in Iran have roots thousands of years old.", "nl": "Per the lecturer, secularism means separating religion from politics and differentiating social institutions, not the absence of piety; many Catholics in Europe and America still go to church. He also says Marxism has a religion-like structure (an end of history, an earthly paradise, 'prophets') and can replace traditional religion, and that some Islamic rituals in Iran have roots thousands of years old."}, "sources": ["src:ce2a70df17"], "flags": ["editor-note"]}, {"text": {"fa": "نقد: تشبیه مارکسیسم به دین سابقهٔ جدی دارد (ریمون آرون، ۱۹۵۵)، اما مخالفان می‌گویند مارکسیسم تحلیل مادی و تجربی از جامعه ارائه می‌کند و امر فراطبیعی ندارد، و این تشبیه استعاره‌ای است که می‌تواند هر ایدئولوژی از جمله لیبرالیسم و روایت پیشرفت آن را هم «دین» بنامد. دربارهٔ تداوم مناسک پیش از اسلام نیز پژوهشگران محتاط‌اند و شواهد برای هر مورد جدا بررسی می‌شود.", "en": "Critique: comparing Marxism to a religion has a serious pedigree (Raymond Aron, 1955), but opponents say Marxism offers a material, empirical analysis of society with nothing supernatural, and that the comparison is a metaphor which could label any ideology, liberalism and its progress narrative included, as a 'religion'. Scholars are also cautious about continuity of pre-Islamic rituals, which must be assessed case by case.", "nl": "Critique: comparing Marxism to a religion has a serious pedigree (Raymond Aron, 1955), but opponents say Marxism offers a material, empirical analysis of society with nothing supernatural, and that the comparison is a metaphor which could label any ideology, liberalism and its progress narrative included, as a 'religion'. Scholars are also cautious about continuity of pre-Islamic rituals, which must be assessed case by case."}, "sources": ["src:80146069df"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "دیدگاه مقابل: بسیاری از پژوهشگران و منتقدان ایرانی، اعم از سکولار و دین‌پژوه اصلاح‌طلب، می‌گویند در هم‌تنیدگی دین و دولت مانعی واقعی برای حقوق و کثرت‌گرایی است، و آزادی و دین دو گزینهٔ رقیب نیستند. توضیح تک‌علتی برای مشکلات تاریخی ایران هم مورد مناقشه است؛ پژوهش‌هایی بر عوامل چندگانه‌ای چون ساختار نهادها، نفت و رقابت قدرت‌های خارجی تأکید دارند.", "en": "Opposing view: many Iranian scholars and critics, secular as well as reformist religious thinkers, argue that the entanglement of religion and state is a real obstacle to rights and pluralism, and that freedom and religion are not rival choices. Single-cause explanations of Iran's historical troubles are themselves contested; studies stress several factors such as institutional structure, oil and great-power competition.", "nl": "Opposing view: many Iranian scholars and critics, secular as well as reformist religious thinkers, argue that the entanglement of religion and state is a real obstacle to rights and pluralism, and that freedom and religion are not rival choices. Single-cause explanations of Iran's historical troubles are themselves contested; studies stress several factors such as institutional structure, oil and great-power competition."}, "sources": ["src:3c12f4366b", "src:c1dddba7c8"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "دقت تاریخی: فردریک باستیا در ۱۸۵۰ درگذشت، پس نمی‌توانست دربارهٔ ناپلئون سوم (امپراتوری از ۱۸۵۲) نظر داده باشد؛ نقل سخنران در این بخش دقیق نیست و ممکن است برداشت آزاد او باشد. خلاصهٔ او از چرخهٔ انقلاب و رژیم‌های فرانسه (۱۷۸۹–۱۸۷۰) و اعدام لاووازیه (۱۷۹۴) در کلیات درست است. دیدگاه باستیا دربارهٔ قانون و دولت در مدخل جداگانه آمده است.", "en": "Historical accuracy: Frédéric Bastiat died in 1850, so he could not have commented on Napoleon III (emperor from 1852); the lecturer's attribution here is imprecise and may be loose paraphrase. His outline of France's cycle of revolutions and regimes (1789–1870) and Lavoisier's execution (1794) is correct in general. Bastiat's actual views on law and the state are in a separate entry.", "nl": "Historical accuracy: Frédéric Bastiat died in 1850, so he could not have commented on Napoleon III (emperor from 1852); the lecturer's attribution here is imprecise and may be loose paraphrase. His outline of France's cycle of revolutions and regimes (1789–1870) and Lavoisier's execution (1794) is correct in general. Bastiat's actual views on law and the state are in a separate entry."}, "sources": [], "flags": ["contested", "editor-note"]}], "links": [{"to": "phil:bastiat-law-state", "rel": "see-also", "note": {"fa": "دیدگاه خود باستیا دربارهٔ قانون و دولت.", "en": "Bastiat's own views on law and the state.", "nl": "Bastiat's own views on law and the state."}}, {"to": "soc:secularization", "rel": "explains", "note": {"fa": "بحث سکولار شدن و رابطهٔ دین و نهادها.", "en": "Secularization and the relation of religion and institutions.", "nl": "Secularization and the relation of religion and institutions."}}, {"to": "soc:institutions-inclusive", "rel": "contrasts", "note": {"fa": "تبیین نهادی چندعاملی در برابر علت واحد.", "en": "A multi-factor institutional explanation against a single cause.", "nl": "A multi-factor institutional explanation against a single cause."}}, {"to": "phil:two-liberties", "rel": "see-also", "note": {"fa": "مفهوم آزادی که سخنران آن را مبهم می‌داند.", "en": "The concept of liberty the lecturer calls unclear.", "nl": "The concept of liberty the lecturer calls unclear."}}], "people": ["core:fr-d-ric-bastiat", "core:raymond-aron"], "sources": ["src:3c12f4366b", "src:80146069df", "src:c1dddba7c8", "src:ce2a70df17"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:macro-micro-levels", "kind": "concept", "title": {"fa": "سطح کلان و خرد در جامعه‌شناسی", "en": "Macro and micro levels in sociology", "nl": "Macro- en microniveau in de sociologie"}, "aliases": [], "parent": "soc:theory", "field": "soc:theory", "summary": {"fa": "سخنران جامعه‌شناسی را دو سطح تحلیل می‌داند. در سطح کلان نهادها، سازمان‌ها و فرهنگ بررسی می‌شوند و در سطح خرد زندگی روزمره و تعامل چهره‌به‌چهره. او گافمن و وبر را در سطح خرد و مارکس را در سطح کلان می‌گذارد و می‌گوید تحلیل خرد در نهایت باید به فرهنگ و نهاد وصل شود.", "en": "The lecturer presents two levels of sociological analysis: macro (institutions, organisations, culture) and micro (everyday life and face-to-face interaction). He places Goffman and Weber at the micro end and Marx at the macro end, and says micro studies must finally be tied back to culture and institutions.", "nl": "Sociologie kent een macroniveau (instituties, cultuur) en een microniveau (dagelijkse interactie). Goede microstudies moeten uiteindelijk weer aan de grotere context worden gekoppeld."}, "points": [{"text": {"fa": "به گفتهٔ سخنران، در سطح کلان واحد پژوهش بزرگ است (دین، خانواده، ورزش، سیاست) و هدف یافتن روح یا منطق حاکم بر آن‌هاست. در سطح خرد از مشاهدهٔ رفتار روزمره (مثل یک مسابقهٔ فوتبال) می‌توان به نظم بزرگ‌تر پی برد.", "en": "Per the lecturer, the macro level studies large units (religion, family, sport, politics) to find the logic governing them, while the micro level starts from everyday behaviour, for instance a football match, to read the larger order.", "nl": "Per the lecturer, the macro level studies large units (religion, family, sport, politics) to find the logic governing them, while the micro level starts from everyday behaviour, for instance a football match, to read the larger order."}, "sources": ["src:e15b78d569"], "flags": ["editor-note"]}, {"text": {"fa": "گافمن در «نمایش خود در زندگی روزمره» (۱۹۵۹) تعامل را مانند اجرای نمایشی می‌بیند. سخنران مثال می‌زند که صدا زدن با نام کوچک، راهِ بازگشتی باز می‌گذارد، چون اگر پذیرفته نشود می‌توان آن را سوءتفاهم نامید.", "en": "Goffman's Presentation of Self in Everyday Life (1959) treats interaction as performance. The lecturer's example is that switching to a first name tests a boundary while leaving an escape route if it is rejected.", "nl": "Goffman's Presentation of Self in Everyday Life (1959) treats interaction as performance. The lecturer's example is that switching to a first name tests a boundary while leaving an escape route if it is rejected."}, "sources": ["src:087a0d1883", "src:e15b78d569"], "flags": []}, {"text": {"fa": "مفهوم «فهم همدلانه» (Verstehen) از وبر یعنی پژوهشگر باید با قرار گرفتن در جای کنشگر، معنای ذهنی کنش او را بفهمد. مثال فاصلهٔ شخصی (حدود یک متر در غرب و نیم متر در شرق) به پژوهش‌های ادوارد هال دربارهٔ فضای شخصی برمی‌گردد.", "en": "Weber's Verstehen means the researcher understands the subjective meaning of an action by putting themselves in the actor's place. The personal-distance example (about 1 m in the West, 0.5 m in the East) goes back to Edward Hall's work on proxemics.", "nl": "Weber's Verstehen means the researcher understands the subjective meaning of an action by putting themselves in the actor's place. The personal-distance example (about 1 m in the West, 0.5 m in the East) goes back to Edward Hall's work on proxemics."}, "sources": ["src:cd4e63d940", "src:71aa4ed86e"], "flags": []}, {"text": {"fa": "تقسیم‌بندی سخنران ساده‌شده است. وبر آثار کلان هم دارد (اقتصاد و جامعه، اخلاق پروتستانی) و تنها خرد‌نگر نیست؛ اعداد فاصلهٔ شخصی هم تقریبی‌اند و بسته به فرهنگ، جنسیت و موقعیت بسیار فرق می‌کنند و تعمیم «غرب/شرق» آن را بیش از حد کلی می‌کند. ضمناً گافمن را معمولاً کنش‌متقابل‌گرای نمادین و خرد‌نگر می‌دانند ولی او خود نظم تعامل را سطحی مستقل می‌نامید.", "en": "The lecturer's division is simplified. Weber also wrote macro-level work (Economy and Society, the Protestant ethic), so he is not merely a micro theorist. Personal-distance figures are rough and vary by culture, gender and context, and 'West/East' over-generalises. Goffman is usually classed as a micro interactionist, though he called the interaction order a domain in its own right.", "nl": "The lecturer's division is simplified. Weber also wrote macro-level work (Economy and Society, the Protestant ethic), so he is not merely a micro theorist. Personal-distance figures are rough and vary by culture, gender and context, and 'West/East' over-generalises. Goffman is usually classed as a micro interactionist, though he called the interaction order a domain in its own right."}, "sources": ["src:cd4e63d940", "src:71aa4ed86e"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، مطالعهٔ خرد نباید در هوا بماند و باید در نهایت با تحلیل گفتمان و فرهنگ و نهادها پیوند بخورد. این همان دغدغهٔ پیوند خرد و کلان در نظریهٔ اجتماعی است.", "en": "Per the lecturer, micro studies must not hang in the air and must connect to discourse, culture and institutions. This is the familiar micro-macro linkage problem in social theory.", "nl": "Per the lecturer, micro studies must not hang in the air and must connect to discourse, culture and institutions. This is the familiar micro-macro linkage problem in social theory."}, "sources": ["src:e15b78d569"], "flags": ["editor-note"]}], "links": [{"to": "soc:presentation-of-self", "rel": "explains", "note": {"fa": "نمونهٔ سطح خرد", "en": "A micro-level example", "nl": "A micro-level example"}}, {"to": "soc:theory", "rel": "part-of", "note": {"fa": "نظریهٔ اجتماعی", "en": "Social theory", "nl": "Social theory"}}, {"to": "soc:sociological-imagination", "rel": "see-also", "note": {"fa": "پیوند زندگی فردی و ساختار", "en": "Linking personal life and structure", "nl": "Linking personal life and structure"}}, {"to": "soc:institutions", "rel": "contrasts", "note": {"fa": "تحلیل نهادی در سطح کلان", "en": "Institutional analysis at the macro level", "nl": "Institutional analysis at the macro level"}}], "people": ["core:erving-goffman", "core:max-weber", "core:edward-t-hall"], "sources": ["src:087a0d1883", "src:71aa4ed86e", "src:cd4e63d940", "src:e15b78d569"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:mauss-gift-sacrifice", "kind": "concept", "title": {"fa": "موس: هدیه، قربانی و جادو", "en": "Mauss on the gift, sacrifice and magic", "nl": "Mauss over de gift, het offer en magie"}, "aliases": [], "parent": "soc:cohesion", "field": "soc:cohesion", "summary": {"fa": "مارسل موس، برادرزادهٔ دورکیم، با مطالعهٔ متن‌ها و گزارش‌های دیگران (نه کار میدانی) نشان داد هدیه دادن در جوامع بسیار تعهدی اجتماعی است و چرخهٔ دادن، گرفتن و پس‌دادن پیوندها را می‌سازد. او همراه هوبر دربارهٔ قربانی و جادو هم نوشت. سخنران بخش‌هایی از ترجمهٔ فارسی «پیشکش» را می‌خواند و آن‌ها را به نمادهای فرهنگی و دینی پیوند می‌دهد.", "en": "Marcel Mauss, Durkheim's nephew, worked from texts and others' reports rather than fieldwork. He showed that gift-giving in many societies is a social obligation, and that the cycle of giving, receiving and returning builds social bonds. With Hubert he also wrote on sacrifice and magic. The lecturer reads from the Persian translation and links the material to cultural and religious symbolism.", "nl": "Marcel Mauss toonde aan dat geven in veel samenlevingen een sociale verplichting is: geven, ontvangen en teruggeven vormen banden. Samen met Hubert schreef hij ook over offer en magie."}, "points": [{"text": {"fa": "در «جستار دربارهٔ هدیه» (۱۹۲۵) موس نشان می‌دهد هدیه به‌ظاهر آزاد در واقع با سه تعهد همراه است: دادن، پذیرفتن و پس‌دادن. این چرخه جامعه را به هم پیوند می‌دهد.", "en": "In his Essay on the Gift (1925) Mauss shows that the seemingly free gift carries three obligations: to give, to receive, and to reciprocate. This cycle binds a society together.", "nl": "In his Essay on the Gift (1925) Mauss shows that the seemingly free gift carries three obligations: to give, to receive, and to reciprocate. This cycle binds a society together."}, "sources": ["src:d9479913c0"], "flags": []}, {"text": {"fa": "سخنران بخشی از کتاب را می‌خواند که در آن هدیه به خدا یا فقیر (صدقه) برگشتی در این دنیا و جهان دیگر دارد. به گفتهٔ او، صدقه شبیه «رشوه‌ای» است که انسان به خدا می‌دهد تا کارش راه بیفتد، و در سنت‌های دینی مختلف نمونه دارد.", "en": "The lecturer reads a passage in which gifts to gods or the poor come back to the giver in this world and the next. Per the lecturer, almsgiving is like a 'bribe' paid to God to get a problem solved, and similar ideas appear across religious traditions.", "nl": "The lecturer reads a passage in which gifts to gods or the poor come back to the giver in this world and the next. Per the lecturer, almsgiving is like a 'bribe' paid to God to get a problem solved, and similar ideas appear across religious traditions."}, "sources": ["src:e15b78d569"], "flags": ["editor-note"]}, {"text": {"fa": "موس و هوبر در جستار قربانی (۱۸۹۹) قربانی را راهی برای ارتباط میان انسان و امر مقدس از طریق یک واسطه می‌دانند. سخنران برداشت خود را می‌افزاید که داستان ابراهیم را می‌توان نشانهٔ گذار نمادین از قربانی انسان به حیوان خواند و مسیح را قربانی‌شدن پسرِ خدا.", "en": "Hubert and Mauss's essay on sacrifice (1899) treats sacrifice as a way of linking humans and the sacred through an intermediary victim. The lecturer adds his own reading that Abraham's story can symbolise a shift from human to animal sacrifice, and Christ's death a sacrifice of God's son.", "nl": "Hubert and Mauss's essay on sacrifice (1899) treats sacrifice as a way of linking humans and the sacred through an intermediary victim. The lecturer adds his own reading that Abraham's story can symbolise a shift from human to animal sacrifice, and Christ's death a sacrifice of God's son."}, "sources": ["src:5cb6c5c2e6", "src:e15b78d569"], "flags": ["editor-note"]}, {"text": {"fa": "تفسیر ابراهیم و مسیح دیدگاه سخنران است و نظر اجماعی نیست؛ ادعای «گذار از قربانی انسان» برای این روایت شواهد تاریخی قطعی ندارد و نظریه‌پردازان دیگر (مثل رنه ژیرار) تفسیرهای متفاوتی داده‌اند.", "en": "The Abraham and Christ readings are the lecturer's view, not a consensus; there is no firm historical evidence for a literal 'shift away from human sacrifice' in that story, and other theorists (such as René Girard) offer different interpretations.", "nl": "The Abraham and Christ readings are the lecturer's view, not a consensus; there is no firm historical evidence for a literal 'shift away from human sacrifice' in that story, and other theorists (such as René Girard) offer different interpretations."}, "sources": [], "flags": ["contested", "editor-note"]}, {"text": {"fa": "موس با هوبر در «طرح نظریهٔ عمومی جادو» (۱۹۰۴) جادو را هم پدیده‌ای اجتماعی دانست که بر باور جمعی تکیه دارد، نه صرفاً خیال فردی.", "en": "With Hubert, in the Outline of a General Theory of Magic (1904), Mauss treated magic too as a social phenomenon resting on collective belief, not merely individual fantasy.", "nl": "With Hubert, in the Outline of a General Theory of Magic (1904), Mauss treated magic too as a social phenomenon resting on collective belief, not merely individual fantasy."}, "sources": ["src:4a5b59c1df"], "flags": []}], "links": [{"to": "soc:magic-religion-malinowski", "rel": "see-also", "note": {"fa": "جادو و دین نزد مالینوفسکی", "en": "Magic and religion in Malinowski", "nl": "Magic and religion in Malinowski"}}, {"to": "soc:social-capital", "rel": "see-also", "note": {"fa": "پیوند از راه دادوستد متقابل", "en": "Bonds built through reciprocity", "nl": "Bonds built through reciprocity"}}, {"to": "soc:cohesion", "rel": "part-of", "note": {"fa": "انسجام اجتماعی", "en": "Social cohesion", "nl": "Social cohesion"}}], "people": ["core:marcel-mauss", "core:henri-hubert"], "sources": ["src:4a5b59c1df", "src:5cb6c5c2e6", "src:d9479913c0", "src:e15b78d569"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:urbanism", "kind": "concept", "title": {"fa": "شهرنشینی به‌مثابه شیوهٔ زندگی", "en": "Urbanism as a way of life", "nl": "Urbanisme als levenswijze"}, "aliases": [], "parent": "soc:space", "field": "soc:space", "summary": {"fa": "ورث گفت اندازه، تراکم و ناهمگونی شهر روابط را سطحی، نقش‌ها را تکه‌تکه و کنترل اجتماعی غیررسمی را ضعیف می‌کند. سه‌چهارم ایرانیان اکنون شهرنشین‌اند؛ جابه‌جایی‌ای که در یک نسل رخ داد و بسیاری از تنش‌های ارزشی امروز را توضیح می‌دهد.", "en": "Wirth argued that a city's size, density and heterogeneity make relations superficial, roles fragmented and informal social control weak. Three-quarters of Iranians now live in cities; a shift that happened within one generation and explains many of today's value tensions.", "nl": "Wirth stelde dat omvang, dichtheid en heterogeniteit van de stad relaties oppervlakkig, rollen gefragmenteerd en informele sociale controle zwak maken. Driekwart van de Iraniërs woont nu in steden; een verschuiving binnen één generatie die veel van de huidige waardespanningen verklaart."}, "points": [{"text": {"fa": "ورث (۱۹۳۸): تعریف جامعه‌شناختی شهر: سکونت‌گاه بزرگ، متراکم و دائمیِ افراد ناهمگون؛ پیامدها: روابط ثانویه و ابزاری، تخصصی شدن، تحمل تفاوت، و در عین حال بی‌نامی و آنومی.", "en": "Wirth (1938): the sociological definition of a city: a large, dense, permanent settlement of heterogeneous individuals; consequences: secondary and instrumental relations, specialisation, tolerance of difference, and also anonymity and anomie.", "nl": "Wirth (1938): the sociological definition of a city: a large, dense, permanent settlement of heterogeneous individuals; consequences: secondary and instrumental relations, specialisation, tolerance of difference, and also anonymity and anomie."}, "sources": ["src:0fd2854ccd"], "flags": []}, {"text": {"fa": "سرشماری ۱۳۹۵: ۷۴ درصد جمعیت ایران شهرنشین است، در برابر حدود ۳۱ درصد در ۱۳۳۵؛ تهران و حاشیه‌اش بیش از ۱۵ میلیون نفر. نقدِ ورث: روستاییان مهاجر در شهر اغلب «روستای درون شهر» می‌سازند و پیوندهای قوی را حفظ می‌کنند.", "en": "The 2016 census: 74 percent of Iran's population is urban, against about 31 percent in 1956; Tehran and its periphery exceed 15 million. The critique of Wirth: rural migrants in the city often build a \"village in the city\" and keep strong ties.", "nl": "The 2016 census: 74 percent of Iran's population is urban, against about 31 percent in 1956; Tehran and its periphery exceed 15 million. The critique of Wirth: rural migrants in the city often build a \"village in the city\" and keep strong ties."}, "sources": ["src:1f3b6b5f19"], "flags": []}], "links": [{"to": "soc:migration-theories", "rel": "see-also", "note": {"fa": "مهاجرت", "en": "Migration", "nl": "Migration"}}, {"to": "soc:anomie", "rel": "explains", "note": {"fa": "آنومی شهری", "en": "Urban anomie", "nl": "Urban anomie"}}, {"to": "psy:belonging", "rel": "bridges", "note": {"fa": "تعلق در ویکی روان", "en": "Belonging in the psychology wiki", "nl": "Belonging in the psychology wiki"}}], "people": [], "sources": ["src:0fd2854ccd", "src:1f3b6b5f19"], "booklets": [], "origin": null, "iran": "iran:urbanization", "wikidata": null, "status": "draft"}, {"id": "soc:liberty-before-democracy-iran", "kind": "concept", "title": {"fa": "تقدم آزادی‌های مدنی بر دموکراسی و نوسازی از بالا در ایران", "en": "Liberty before democracy and top-down modernisation in Iran", "nl": "Vrijheid vóór democratie en modernisering van bovenaf in Iran"}, "aliases": [], "parent": "soc:theory", "field": "soc:theory", "summary": {"fa": "سخنران استدلال می‌کند که در کشورهای در حال توسعه، حفاظت از آزادی‌های مدنی و اقتصادی باید پیش از رقابت دموکراتیک بیاید، و دولت‌سازی رضاشاه را پاسخی به هرج‌ومرج پس از مشروطه می‌داند. این دیدگاه به نظریهٔ نوسازی دههٔ ۶۰ و کتاب فرید زکریا تکیه دارد. اما منتقدان بسیاری آن را رد می‌کنند و استبداد را هزینه‌ای می‌دانند که لزوماً به آزادی نمی‌رسد.", "en": "The lecturer argues that in developing countries civil and economic liberties should precede democratic competition, and sees Reza Shah's state-building as a response to the chaos after the Constitutional Revolution. This draws on 1960s modernisation theory and Fareed Zakaria. Many critics reject it, holding that authoritarian rule does not reliably lead to liberty.", "nl": "De spreker betoogt dat burgerlijke vrijheden in ontwikkelingslanden vóór democratische competitie moeten komen en ziet Reza Sjahs staatsvorming als antwoord op de chaos na de Constitutionele Revolutie. Critici wijzen dit sterk af."}, "points": [{"text": {"fa": "به گفتهٔ سخنران، پس از مشروطه دولت‌های بسیار کوتاه‌عمر و ناامنی و بیماری فراگیر بود و خود روشنفکران خواهان دولت مرکزی قوی بودند؛ رضاشاه را نتیجهٔ همین شکست مشروطه می‌داند و مدرسه و دانشگاه را نیازمند اجبار از بالا. او شمار دولت‌ها را حدود ۵۰ در ۱۵ سال می‌گوید که دقیق نیست و فقط بیان کلی بی‌ثباتی است.", "en": "Per the lecturer, after the Constitutional Revolution there were very short-lived cabinets, insecurity and epidemics, and intellectuals themselves called for a strong central state; he sees Reza Shah as a product of constitutionalism's failure and holds that schools and universities needed enforcement from above. His figure of about 50 governments in 15 years is imprecise and only conveys general instability.", "nl": "Per the lecturer, after the Constitutional Revolution there were very short-lived cabinets, insecurity and epidemics, and intellectuals themselves called for a strong central state; he sees Reza Shah as a product of constitutionalism's failure and holds that schools and universities needed enforcement from above. His figure of about 50 governments in 15 years is imprecise and only conveys general instability."}, "sources": ["src:626c053b8a"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، در دههٔ ۶۰ نظریهٔ غالب توسعه می‌گفت کشورهای در حال توسعه نخست به رشد اقتصادی و اجتماعی بپردازند و آزادی سیاسی را به تأخیر بیندازند. هانتینگتون در «نظم سیاسی در جوامع در حال تغییر» (۱۹۶۸) این خط را تقویت کرد (نام در رونوشت مخدوش است و این انطباق تخمین ماست). این نظریه بعدها به‌شدت نقد شد.", "en": "Per the lecturer, in the 1960s the dominant development theory said developing countries should focus on economic and social growth and postpone political freedom. Huntington's Political Order in Changing Societies (1968) strengthened this line (the name is garbled in the transcript; this match is our inference). The theory was later heavily criticised.", "nl": "Per the lecturer, in the 1960s the dominant development theory said developing countries should focus on economic and social growth and postpone political freedom. Huntington's Political Order in Changing Societies (1968) strengthened this line (the name is garbled in the transcript; this match is our inference). The theory was later heavily criticised."}, "sources": ["src:626c053b8a", "src:114e7b2abc"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، فرید زکریا در «آیندهٔ آزادی» می‌گوید لیبرالیسم (حقوق فردی و قانون) باید بر دموکراسی تقدم داشته باشد و رأی‌گیری بدون پشتوانهٔ لیبرال می‌تواند به «دموکراسی غیرلیبرال» بینجامد. هرچند عنوان کتاب در رونوشت مخدوش است، محتوای آن با اثر زکریا (۲۰۰۳) همخوان است.", "en": "Per the lecturer, Fareed Zakaria's The Future of Freedom argues that liberalism (individual rights and rule of law) should precede democracy, since elections without liberal foundations can yield 'illiberal democracy'. The title is garbled in the transcript, but the content matches Zakaria (2003).", "nl": "Per the lecturer, Fareed Zakaria's The Future of Freedom argues that liberalism (individual rights and rule of law) should precede democracy, since elections without liberal foundations can yield 'illiberal democracy'. The title is garbled in the transcript, but the content matches Zakaria (2003)."}, "sources": ["src:626c053b8a", "src:1c29505bcc"], "flags": ["editor-note"]}, {"text": {"fa": "دیدگاه مخالف: آمارتیا سن می‌گوید آزادی‌های سیاسی و حق رأی خود بخشی از توسعه و ابزار پیشگیری از فجایعی مثل قحطی است، نه چیزی که بشود به تعویق انداخت. پژوهش‌هایی هم نشان می‌دهند نوسازیِ استبدادی نتایج ناهمگون دارد و نهادهای فراگیر سیاسی برای رشد پایدار حیاتی‌اند. همچنین نقش سرکوب سیاسی و وابستگی به ارادهٔ فرد در حکومت پهلوی و نیز ارزیابی‌های متفاوت مورخان از مشروطه و رضاشاه محل مناقشه است.", "en": "Opposing view: Amartya Sen argues that political freedoms and the vote are part of development itself and a safeguard against disasters such as famine, not something to defer. Research also shows authoritarian modernisation has mixed results and inclusive political institutions matter for lasting growth. Historians also assess the Constitutional Revolution, Reza Shah and Pahlavi repression very differently.", "nl": "Opposing view: Amartya Sen argues that political freedoms and the vote are part of development itself and a safeguard against disasters such as famine, not something to defer. Research also shows authoritarian modernisation has mixed results and inclusive political institutions matter for lasting growth. Historians also assess the Constitutional Revolution, Reza Shah and Pahlavi repression very differently."}, "sources": ["src:07ff5d7215"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، مفاهیمی مانند «آزادی» را همه می‌گویند ولی تعریف‌ها و ابزارهایشان فرق دارد (از گروه‌های چپ مسلح تا لیبرال‌ها)، پس صرف رها کردن فعالیت سیاسی لزوماً به آزادی نمی‌رسد؛ همچنین به گفتهٔ او حفاظت از حقوق فردی را باید به رأی عمومی نسپرد. این استدلال را می‌شود با نگرانی از «استبداد اکثریت» توضیح داد، اما مخالفان می‌گویند همین استدلال را هر حکومتی برای محدودکردن آزادی‌ها به کار می‌برد.", "en": "Per the lecturer, everyone invokes 'freedom' but definitions and means differ widely (from armed left groups to liberals), so simply allowing political activity does not guarantee liberty; he also holds that basic individual rights should not be put to a popular vote. This can be framed as concern about the 'tyranny of the majority', but opponents say any regime can use the same argument to restrict freedoms.", "nl": "Per the lecturer, everyone invokes 'freedom' but definitions and means differ widely (from armed left groups to liberals), so simply allowing political activity does not guarantee liberty; he also holds that basic individual rights should not be put to a popular vote. This can be framed as concern about the 'tyranny of the majority', but opponents say any regime can use the same argument to restrict freedoms."}, "sources": ["src:626c053b8a"], "flags": ["contested", "editor-note"]}], "links": [{"to": "phil:two-liberties", "rel": "see-also", "note": {"fa": "آزادی منفی و مثبت و مسئلهٔ تقدم آزادی‌ها", "en": "Negative and positive liberty and the priority of liberties", "nl": "Negative and positive liberty and the priority of liberties"}}, {"to": "soc:institutions-inclusive", "rel": "critiques", "note": {"fa": "نهادهای فراگیر در برابر نوسازی استبدادی", "en": "Inclusive institutions as a challenge to authoritarian modernisation", "nl": "Inclusive institutions as a challenge to authoritarian modernisation"}}, {"to": "phil:political", "rel": "part-of", "note": {"fa": "بحث فلسفهٔ سیاسی دموکراسی و لیبرالیسم", "en": "Political philosophy of democracy and liberalism", "nl": "Political philosophy of democracy and liberalism"}}], "people": ["core:fareed-zakaria", "core:samuel-p-huntington", "core:amartya-sen"], "sources": ["src:07ff5d7215", "src:114e7b2abc", "src:1c29505bcc", "src:626c053b8a"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:iran-fertility", "kind": "concept", "title": {"fa": "گذار باروری ایران: از ۶٫۵ به زیر ۲", "en": "Iran's fertility transition: from 6.5 to below 2", "nl": "De Iraanse vruchtbaarheidstransitie: van 6,5 naar onder de 2"}, "aliases": [], "parent": "soc:demography", "field": "soc:demography", "summary": {"fa": "یکی از سریع‌ترین افت‌های باروری ثبت‌شده در جهان: میانگین فرزند هر زن از حدود ۶٫۵ در اوایل دههٔ ۱۳۶۰ به حدود ۲ در ۱۳۷۹ و زیر ۲ پس از آن رسید؛ با سواد زنان، شهرنشینی، شبکهٔ بهداشت روستایی و برنامهٔ تنظیم خانواده. سیاست‌های تشویقی دههٔ ۱۳۹۰ روند را برنگرداندند.", "en": "One of the fastest fertility declines ever recorded: children per woman fell from about 6.5 in the early 1980s to about 2 in 2000 and below 2 after; driven by women's literacy, urbanisation, the rural health network and the family planning programme. Pronatalist policies of the 2010s did not reverse the trend.", "nl": "Een van de snelste vruchtbaarheidsdalingen ooit geregistreerd: kinderen per vrouw daalde van zo'n 6,5 begin jaren tachtig naar ongeveer 2 in 2000 en daaronder nadien; gedreven door alfabetisering van vrouwen, verstedelijking, het rurale gezondheidsnetwerk en het gezinsplanningsprogramma. Pronatalistisch beleid in de jaren 2010 keerde de trend niet."}, "points": [{"text": {"fa": "عباسی‌شوازی، مک‌دونالد و حسینی‌چاووشی (۲۰۰۹): افت باروری در همهٔ استان‌ها، شهر و روستا و همهٔ سطوح سواد رخ داد؛ عامل کلیدی، تغییر «ایده‌آل خانواده» و دسترسی به وسایل پیشگیری از راه خانه‌های بهداشت بود، نه فقط توسعهٔ اقتصادی.", "en": "Abbasi-Shavazi, McDonald and Hosseini-Chavoshi (2009): fertility fell in every province, in cities and villages and at all literacy levels; the key factors were a changed \"family ideal\" and access to contraception through rural health houses, not economic development alone.", "nl": "Abbasi-Shavazi, McDonald and Hosseini-Chavoshi (2009): fertility fell in every province, in cities and villages and at all literacy levels; the key factors were a changed \"family ideal\" and access to contraception through rural health houses, not economic development alone."}, "sources": ["src:cded26c9f1"], "flags": []}, {"text": {"fa": "سازمان ملل (۲۰۲۴): نرخ باروری کل ایران حدود ۱٫۷؛ جمعیت در میانهٔ قرن به اوج می‌رسد و سپس سالمند می‌شود. همین الگو در ترکیه، تونس و بسیاری از کشورهای اسلامی دیده می‌شود و «استثنای فرهنگی» را رد می‌کند.", "en": "United Nations (2024): Iran's total fertility rate about 1.7; population peaks mid-century and then ages. The same pattern appears in Turkey, Tunisia and many other Muslim countries, refuting a \"cultural exception\".", "nl": "United Nations (2024): Iran's total fertility rate about 1.7; population peaks mid-century and then ages. The same pattern appears in Turkey, Tunisia and many other Muslim countries, refuting a \"cultural exception\"."}, "sources": ["src:67de606631"], "flags": []}], "links": [{"to": "soc:demographic-transition", "rel": "part-of", "note": {"fa": "نمونه‌ای از گذار جمعیتی", "en": "A case of demographic transition", "nl": "A case of demographic transition"}}, {"to": "soc:value-change", "rel": "explains", "note": {"fa": "تغییر ایده‌آل خانواده", "en": "The changed family ideal", "nl": "The changed family ideal"}}, {"to": "soc:urbanism", "rel": "see-also", "note": {"fa": "شهرنشینی", "en": "Urbanisation", "nl": "Urbanisation"}}], "people": ["core:mohammad-jalal-abbasi-shavazi"], "sources": ["src:67de606631", "src:cded26c9f1"], "booklets": [], "origin": null, "iran": "iran:fertility", "wikidata": null, "status": "draft"}, {"id": "soc:society-in-the-individual", "kind": "concept", "title": {"fa": "جامعه در انسان، انسان در جامعه: ساختار، کنش و سه خطِ زندگی", "en": "Society in the individual: structure, agency and three timelines", "nl": "De samenleving in het individu: structuur, handelen en drie tijdlijnen"}, "aliases": [], "parent": "soc:theory", "field": "soc:theory", "summary": {"fa": "پیتر برگر نشان می‌دهد فرهنگ پیش از تولد ما را احاطه کرده و بی‌آنکه حس کنیم رفتارمان را شکل می‌دهد، و جامعه با درونی‌شدن در ما زندگی می‌کند. پرسش این است که پس اختیار فرد کجاست. سخنران جامعه‌شناسی را به سوی جبر ساختاری متمایل می‌داند، اما اختیار را کاملاً انکار نمی‌کند. او برای فهم زندگی فردی، سه خط را پیشنهاد می‌کند: تاریخ فردی، تاریخ اجتماعی و تاریخ تمدنی.", "en": "Peter Berger shows that culture surrounds us before birth and shapes conduct without our noticing, and that society lives inside us through internalisation. This raises the question of individual freedom. The lecturer leans towards structural determinism without denying agency, and proposes reading a life along three lines: personal, social and civilisational history.", "nl": "Peter Berger laat zien dat cultuur ons al voor de geboorte omringt en ons gedrag ongemerkt vormt. De spreker neigt naar structureel determinisme zonder handelingsvrijheid te ontkennen en stelt drie tijdlijnen voor: persoonlijk, sociaal en beschavingshistorisch."}, "points": [{"text": {"fa": "به گفتهٔ سخنران، بر اساس فصل‌های «انسان در جامعه» و «جامعه در انسان» کتاب دعوت به جامعه‌شناسی، فشار اجتماعی معمولاً مستقیم و آمرانه نیست؛ ما آن را به شکل «توافق» و نظم عادی می‌پذیریم. از نام و جنسیت و وسایل نوزاد گرفته تا مراسم پس از مرگ، فرهنگ پیش از تولد و پس از مرگ هم در کار است.", "en": "Per the lecturer, following chapters 'Man in Society' and 'Society in Man' of Invitation to Sociology, social pressure is usually not direct coercion; we experience it as agreement and normal order. From names, gender and baby items to funeral rites, culture operates before birth and after death.", "nl": "Per the lecturer, following chapters 'Man in Society' and 'Society in Man' of Invitation to Sociology, social pressure is usually not direct coercion; we experience it as agreement and normal order. From names, gender and baby items to funeral rites, culture operates before birth and after death."}, "sources": ["src:626c053b8a", "src:e46f08847e"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، جامعه با درونی‌شدن در فرد زندگی می‌کند؛ بیگانه‌ای با نیم‌ساعت گفت‌وگو از زبان و لباس و ارزش‌های ما می‌فهمد از کجا آمده‌ایم. او همچنین می‌گوید فقط انسان حاضر است برای یک ایده بمیرد یا بکشد؛ این ادعا ساده‌شده است، چون ازخودگذشتگی حیوانات (مثلاً در حشرات اجتماعی) هم در زیست‌شناسی ثبت شده، هرچند «برای ایده» نیست.", "en": "Per the lecturer, society lives in us by internalisation; a stranger can place us after half an hour of talk. He also says only humans die or kill for an idea; this is simplified, since self-sacrificial behaviour in animals (e.g. social insects) is documented, though not 'for an idea'.", "nl": "Per the lecturer, society lives in us by internalisation; a stranger can place us after half an hour of talk. He also says only humans die or kill for an idea; this is simplified, since self-sacrificial behaviour in animals (e.g. social insects) is documented, though not 'for an idea'."}, "sources": ["src:e46f08847e"], "flags": ["editor-note", "contested"]}, {"text": {"fa": "به گفتهٔ سخنران، دوگانهٔ ساختار و کنش را نمی‌شود حل کرد، فقط باید تعیین کرد «علامت بزرگتر» را به کدام سو گذاشت؛ او برای جامعه‌شناسی آن را به سمت جبر فرهنگی و تاریخی می‌گذارد و نقش شانس را هم بزرگ می‌داند. گیدنز در نظریهٔ ساختاریابی می‌گوید ساختار و کنش مکمل‌اند و هیچ‌کدام بر دیگری تقدم ندارد؛ بنابراین جبرگرایی سخنران یک موضع از چند موضع مشروع است.", "en": "Per the lecturer, the structure-agency dilemma is a matter of where to put the 'greater-than sign'; for sociology he puts it on cultural and historical determinism and stresses chance. Giddens' structuration theory holds that structure and agency are mutually constitutive, so the lecturer's determinism is one legitimate position among several.", "nl": "Per the lecturer, the structure-agency dilemma is a matter of where to put the 'greater-than sign'; for sociology he puts it on cultural and historical determinism and stresses chance. Giddens' structuration theory holds that structure and agency are mutually constitutive, so the lecturer's determinism is one legitimate position among several."}, "sources": ["src:626c053b8a", "src:b6adb077c6"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، به نقل از هگل «قهرمان تاریخی» کسی است که دربارهٔ ایده‌ای که به آینده وصل است اجماع می‌سازد و به گذشته برنمی‌گردد. در خوانش هگل، «فرد جهانی‌تاریخی» ابزار روح زمانه است، نه مدیر آگاه آن؛ تعبیر سخنران ساده‌شده است.", "en": "Per the lecturer, citing Hegel, the 'historical hero' builds consensus around an idea tied to the future rather than returning to the past. In Hegel's own account the world-historical individual is an instrument of the spirit of the age rather than its conscious manager; the lecturer's rendering is simplified.", "nl": "Per the lecturer, citing Hegel, the 'historical hero' builds consensus around an idea tied to the future rather than returning to the past. In Hegel's own account the world-historical individual is an instrument of the spirit of the age rather than its conscious manager; the lecturer's rendering is simplified."}, "sources": ["src:626c053b8a", "src:4782be2781"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، افزون بر تاریخ فردی (خانواده و کودکی) و تاریخ اجتماعی (جنگ، انقلاب)، «خط سوم» تاریخ تمدنی است: نسل ما نخستین نسلی است که با فناوری‌ها و انقلاب معرفتی تازه کنار می‌آید و بخشی از سردرگمی‌ها از همین جاست. او همچنین می‌گوید تجربهٔ یک وضعیت با شناخت آن برابر نیست، چون اغلب برای نام‌گذاری دقیق تجربه واژه نداریم. این چارچوب پیشنهاد خود سخنران است و نه نظریهٔ تثبیت‌شده؛ نباید جای ارزیابی بالینی را بگیرد.", "en": "Per the lecturer, beyond personal history (family, childhood) and social history (war, revolution) there is a 'third line', civilisational history: our generation is the first to cope with new technologies and an epistemic upheaval. He adds that living a situation is not knowing it, as we often lack words to name experience. This is his own framework, not an established theory, and should not replace clinical assessment.", "nl": "Per the lecturer, beyond personal history (family, childhood) and social history (war, revolution) there is a 'third line', civilisational history: our generation is the first to cope with new technologies and an epistemic upheaval. He adds that living a situation is not knowing it, as we often lack words to name experience. This is his own framework, not an established theory, and should not replace clinical assessment."}, "sources": ["src:626c053b8a"], "flags": ["editor-note"]}], "links": [{"to": "soc:social-construction", "rel": "see-also", "note": {"fa": "درونی‌شدن واقعیت اجتماعی بخشی از ساخت اجتماعی واقعیت است", "en": "Internalisation of social reality is part of social construction", "nl": "Internalisation of social reality is part of social construction"}}, {"to": "soc:sociological-imagination", "rel": "bridges", "note": {"fa": "پیوند زندگی فردی و تاریخ، همسو با تخیل جامعه‌شناختی", "en": "Linking biography and history, in line with the sociological imagination", "nl": "Linking biography and history, in line with the sociological imagination"}}, {"to": "soc:presentation-of-self", "rel": "see-also", "note": {"fa": "نقش‌ها و نمایش خود در زندگی روزمره", "en": "Roles and self-presentation in daily life", "nl": "Roles and self-presentation in daily life"}}], "people": ["core:peter-l-berger", "core:anthony-giddens", "core:g-w-f-hegel"], "sources": ["src:4782be2781", "src:626c053b8a", "src:b6adb077c6", "src:e46f08847e"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:saussure-structuralism-origins", "kind": "concept", "title": {"fa": "سوسور، ساختارگرایی و انتقال آن به علوم اجتماعی", "en": "Saussure, structuralism and its spread to the social sciences", "nl": "Saussure, structuralisme en de doorwerking in de sociale wetenschappen"}, "aliases": [], "parent": "soc:theory", "field": "soc:theory", "summary": {"fa": "فردینان دو سوسور زبان را نظامی از نشانه‌ها دید که معنایشان از تفاوت با نشانه‌های دیگر پدید می‌آید، نه از تاریخچه‌شان. این روش «ساختاری» را کلود لوی‌استروس به مردم‌شناسی و اسطوره آورد و آلتوسر به نظریهٔ مارکسیستی. سخنران این را نمونه‌ای می‌داند از اینکه یک کشف بزرگ در یک رشته به رشته‌های دیگر هم سرایت می‌کند.", "en": "Ferdinand de Saussure saw language as a system of signs whose meaning arises from their differences from other signs, not from their history. Claude Lévi-Strauss carried this 'structural' method into anthropology and myth, and Althusser into Marxist theory. The lecturer treats it as an example of how a major discovery in one field spreads to others.", "nl": "Ferdinand de Saussure zag taal als een stelsel van tekens waarvan de betekenis voortkomt uit hun verschillen met andere tekens, niet uit hun geschiedenis. Claude Lévi-Strauss bracht deze structurele methode naar de antropologie en Althusser naar de marxistische theorie."}, "points": [{"text": {"fa": "پیش از سوسور، زبان‌شناسان بیشتر تاریخی کار می‌کردند: می‌پرسیدند زبان‌ها چگونه در گذر زمان تغییر کرده و از کجا آمده‌اند. سوسور پیشنهاد کرد زبان را در یک مقطع و به‌عنوان نظامی درونی بررسی کنیم. «درس زبان‌شناسی عمومی» (۱۹۱۶) را شاگردانش از روی یادداشت‌های کلاس‌هایش پس از مرگ او منتشر کردند.", "en": "Before Saussure, linguists mostly worked historically, asking how languages changed over time and where they came from. Saussure proposed studying language at one point in time as an internal system. His Course in General Linguistics (1916) was put together and published after his death by students from lecture notes.", "nl": "Before Saussure, linguists mostly worked historically, asking how languages changed over time and where they came from. Saussure proposed studying language at one point in time as an internal system. His Course in General Linguistics (1916) was put together and published after his death by students from lecture notes."}, "sources": ["src:7c5fc6c369", "src:00ed5e6aef"], "flags": []}, {"text": {"fa": "نشانه دو روی دارد: صورت (دال) و معنا (مدلول)، و پیوند این دو قراردادی است. معنای هر نشانه از تفاوتش با نشانه‌های دیگر می‌آید. سخنران چراغ راهنمایی را مثال می‌زند: قرمز بدون سبز معنایی ندارد، همان‌طور که «لیوان» فقط در برابر «درخت» یا «کتاب» در برابر «دفتر» معنا می‌یابد.", "en": "A sign has two sides: form (signifier) and meaning (signified), and the link between them is arbitrary. The meaning of each sign comes from its difference from other signs. The lecturer uses a traffic light as an example: red means nothing without green, just as 'glass' has meaning only in contrast to other words such as 'tree', or 'book' against 'notebook'.", "nl": "A sign has two sides: form (signifier) and meaning (signified), and the link between them is arbitrary. The meaning of each sign comes from its difference from other signs. The lecturer uses a traffic light as an example: red means nothing without green, just as 'glass' has meaning only in contrast to other words such as 'tree', or 'book' against 'notebook'."}, "sources": ["src:7c5fc6c369", "src:00ed5e6aef"], "flags": []}, {"text": {"fa": "کلود لوی‌استروس (مردم‌شناس فرانسوی) این روش را به اسطوره برد و گفت اجزای یک اسطوره را باید در ارتباط با هم خواند. از نظر او آنچه اهمیت دارد روابط ساختاری میان عناصر است، نه تک‌تک عناصر. آلتوسر از همین الگو الهام گرفت و گفت جامعه نیز ساختارهای پنهانی دارد که باید کشف شوند.", "en": "Claude Lévi-Strauss, the French anthropologist, applied this method to myth and held that the parts of a myth must be read in relation to one another. What matters, in his view, are the structural relations among elements rather than the elements alone. Althusser drew on this model and said society too has hidden structures that must be uncovered.", "nl": "Claude Lévi-Strauss, the French anthropologist, applied this method to myth and held that the parts of a myth must be read in relation to one another. What matters, in his view, are the structural relations among elements rather than the elements alone. Althusser drew on this model and said society too has hidden structures that must be uncovered."}, "sources": ["src:7c5fc6c369", "src:d32029128c"], "flags": []}, {"text": {"fa": "به گفتهٔ سخنران، ورود این روش از زبان‌شناسی به رشته‌های دیگر نمونهٔ الگویی است که کشف انقلابی مثل نظریهٔ تکامل داروین هم داشت و از زیست‌شناسی به جامعه‌شناسی و فلسفه رسید. این برداشت او از تاریخ اندیشه است و نه یک قانون.", "en": "Per the lecturer, the spread of this method from linguistics to other disciplines follows a pattern also seen with a revolutionary discovery such as Darwin's theory of evolution, which moved from biology into sociology and philosophy. This is his reading of the history of ideas rather than a general law.", "nl": "Per the lecturer, the spread of this method from linguistics to other disciplines follows a pattern also seen with a revolutionary discovery such as Darwin's theory of evolution, which moved from biology into sociology and philosophy. This is his reading of the history of ideas rather than a general law."}, "sources": ["src:7c5fc6c369"], "flags": ["editor-note"]}, {"text": {"fa": "نکتهٔ تکمیلی: سخنران می‌گوید لوی‌استروس اسطوره‌های شرق و غرب را با هم مقایسه نمی‌کرد و هر اسطوره را فقط درون خودش می‌خواند. در واقع کار لوی‌استروس («اسطوره‌شناسی‌ها») بر مقایسهٔ گستردهٔ اسطوره‌ها در فرهنگ‌های مختلف، به‌ویژه سرخ‌پوستان قاره‌های آمریکا، استوار بود و او ساختارهای مشترک ذهن را جست‌وجو می‌کرد. ساختارگرایی را بعدها پساساختارگرایان (مانند دریدا و فوکو) به‌خاطر نادیده گرفتن تغییر و قدرت نقد کردند.", "en": "Added caveat: the lecturer says Lévi-Strauss did not compare Eastern and Western myths and read each myth only within itself. In fact his Mythologiques rests on wide comparison of myths across cultures, especially of the Americas, in search of shared structures of the mind. Structuralism was later criticised by post-structuralists (such as Derrida and Foucault) for neglecting change and power.", "nl": "Added caveat: the lecturer says Lévi-Strauss did not compare Eastern and Western myths and read each myth only within itself. In fact his Mythologiques rests on wide comparison of myths across cultures, especially of the Americas, in search of shared structures of the mind. Structuralism was later criticised by post-structuralists (such as Derrida and Foucault) for neglecting change and power."}, "sources": ["src:d32029128c"], "flags": ["contested", "editor-note"]}], "links": [{"to": "soc:althusser-structural-marxism", "rel": "explains", "note": {"fa": "ریشهٔ روش آلتوسر", "en": "The methodological root of Althusser's approach", "nl": "The methodological root of Althusser's approach"}}, {"to": "phil:language-games", "rel": "contrasts", "note": {"fa": "نگاه دیگر به معنا: معنا به‌مثابهٔ کاربرد", "en": "Another view of meaning: meaning as use", "nl": "Another view of meaning: meaning as use"}}, {"to": "soc:social-construction", "rel": "see-also", "note": {"fa": "ساخت اجتماعی معنا و واقعیت", "en": "Social construction of meaning and reality", "nl": "Social construction of meaning and reality"}}], "people": ["core:ferdinand-de-saussure", "core:claude-l-vi-strauss"], "sources": ["src:00ed5e6aef", "src:7c5fc6c369", "src:d32029128c"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:generations", "kind": "concept", "title": {"fa": "نسل‌ها: مسئلهٔ مانهایم", "en": "Generations: Mannheim's problem", "nl": "Generaties: het probleem van Mannheim"}, "aliases": [], "parent": "soc:values", "field": "soc:values", "summary": {"fa": "هم‌سن بودن نسل نمی‌سازد؛ تجربهٔ مشترک رویدادهای بزرگ در سال‌های شکل‌گیری (۱۷ تا ۲۵ سالگی) نسل می‌سازد. برچسب‌های «دههٔ شصتی، هشتادی» تا جایی معنا دارند که به چنین تجربهٔ مشترکی اشاره کنند؛ وگرنه سن، دوره و نسل را قاطی می‌کنند.", "en": "Being the same age does not make a generation; the shared experience of great events in the formative years (17 to 25) does. Labels like \"the sixties-born, the eighties-born\" are meaningful insofar as they point to such shared experience; otherwise they confuse age, period and cohort.", "nl": "Even oud zijn maakt geen generatie; de gedeelde ervaring van grote gebeurtenissen in de vormende jaren (17 tot 25) wel. Labels als \"de jaren-zestig-geborenen\" zijn betekenisvol voor zover ze naar zo'n gedeelde ervaring verwijzen; anders verwarren ze leeftijd, periode en cohort."}, "points": [{"text": {"fa": "مانهایم (۱۹۲۸): «موقعیت نسلی» (هم‌زمانی تولد) تنها امکان است؛ «نسل بالفعل» وقتی پدید می‌آید که هم‌سالان در جریان تاریخی مشترکی درگیر شوند، و درون آن «واحدهای نسلی» متفاوت و حتی متخاصم شکل می‌گیرند.", "en": "Mannheim (1928): \"generational location\" (being born together) is only a possibility; an \"actual generation\" arises when age-peers are caught up in a shared historical current, and within it different, even hostile, \"generation units\" form.", "nl": "Mannheim (1928): \"generational location\" (being born together) is only a possibility; an \"actual generation\" arises when age-peers are caught up in a shared historical current, and within it different, even hostile, \"generation units\" form."}, "sources": ["src:18b66d31f0"], "flags": []}, {"text": {"fa": "مسئلهٔ روش‌شناختی: هر تفاوت مشاهده‌شده میان جوانان و پیران می‌تواند اثر سن (همه با پیری محافظه‌کارتر می‌شوند)، اثر دوره (همه در یک بحران تغییر می‌کنند) یا اثر نسل باشد؛ جدا کردن این سه با داده‌های مقطعی ناممکن است و نیاز به پیمایش‌های تکرارشونده دارد.", "en": "The methodological problem: any observed difference between young and old may be an age effect (everyone grows more conservative), a period effect (everyone changes in a crisis) or a cohort effect; separating the three is impossible with cross-sectional data and needs repeated surveys.", "nl": "The methodological problem: any observed difference between young and old may be an age effect (everyone grows more conservative), a period effect (everyone changes in a crisis) or a cohort effect; separating the three is impossible with cross-sectional data and needs repeated surveys."}, "sources": ["src:8f0d6ab822"], "flags": ["editor-note"]}], "links": [{"to": "soc:value-change", "rel": "explains", "note": {"fa": "تغییر ارزش‌ها از راه جایگزینی نسل‌ها", "en": "Value change through generational replacement", "nl": "Value change through generational replacement"}}, {"to": "psy:adolescence", "rel": "bridges", "note": {"fa": "نوجوانی و سال‌های شکل‌گیری", "en": "Adolescence and the formative years", "nl": "Adolescence and the formative years"}}], "people": ["core:karl-mannheim"], "sources": ["src:18b66d31f0", "src:8f0d6ab822"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:value-change", "kind": "concept", "title": {"fa": "تغییر ارزش‌ها: از بقا به ابراز خود", "en": "Value change: from survival to self-expression", "nl": "Waardeverandering: van overleving naar zelfexpressie"}, "aliases": [], "parent": "soc:values", "field": "soc:values", "summary": {"fa": "اینگلهارت با پنجاه سال پیمایش در صد کشور نشان داد با امنیت اقتصادی و وجودی، ارزش‌ها از «بقا» (نظم، سنت، دین) به «ابراز خود» (آزادی، برابری جنسیتی، تحمل تفاوت) می‌چرخند؛ تغییر بیشتر از راه جایگزینی نسل‌هاست تا تغییر عقیدهٔ افراد. ایران روی این نقشه حرکت کرده است.", "en": "Inglehart, with fifty years of surveys in a hundred countries, showed that with economic and existential security values turn from \"survival\" (order, tradition, religion) to \"self-expression\" (freedom, gender equality, tolerance of difference); change comes more through generational replacement than individuals changing their minds. Iran has moved on this map.", "nl": "Inglehart toonde met vijftig jaar surveys in honderd landen dat waarden met economische en existentiële zekerheid verschuiven van \"overleving\" (orde, traditie, religie) naar \"zelfexpressie\" (vrijheid, gendergelijkheid, tolerantie); verandering komt meer door generatiewisseling dan doordat individuen van mening veranderen. Iran heeft zich op deze kaart bewogen."}, "points": [{"text": {"fa": "اینگلهارت و ولزل (۲۰۰۵): دو محور «سنتی–سکولارعقلانی» و «بقا–ابراز خود» بیشتر واریانس ارزش‌های جهان را می‌گیرند؛ توسعه کشورها را روی هر دو به جلو می‌راند، ولی میراث فرهنگی (مسیحی، اسلامی، کنفوسیوسی…) جای شروع را تعیین می‌کند.", "en": "Inglehart and Welzel (2005): two axes, \"traditional–secular-rational\" and \"survival–self-expression\", capture most of the world's variance in values; development pushes countries forward on both, but cultural heritage (Christian, Islamic, Confucian…) sets the starting point.", "nl": "Inglehart and Welzel (2005): two axes, \"traditional–secular-rational\" and \"survival–self-expression\", capture most of the world's variance in values; development pushes countries forward on both, but cultural heritage (Christian, Islamic, Confucian…) sets the starting point."}, "sources": ["src:d7a317cebe"], "flags": []}, {"text": {"fa": "اینگلهارت (۲۰۱۸): تغییر ارزش‌ها نسلی است و زمانی خودش را در سیاست نشان می‌دهد که نسل جدید اکثریت شود؛ ناامنی تازه (بحران اقتصادی، مهاجرت) می‌تواند واکنش «اقتدارگرایانه» بسازد، اما روند بلندمدت را برنگردانده است.", "en": "Inglehart (2018): value change is generational and shows up in politics when the new cohort becomes the majority; new insecurity (economic crisis, migration) can produce an \"authoritarian reflex\", but has not reversed the long-run trend.", "nl": "Inglehart (2018): value change is generational and shows up in politics when the new cohort becomes the majority; new insecurity (economic crisis, migration) can produce an \"authoritarian reflex\", but has not reversed the long-run trend."}, "sources": ["src:8f0d6ab822"], "flags": ["contested"]}, {"text": {"fa": "در سه موج پیمایش ملی ارزش‌ها و نگرش‌های ایرانیان (۱۳۷۹، ۱۳۸۲، ۱۳۹۴) و موج‌های پیمایش جهانی ارزش‌ها، ایران روی محور بقا–ابراز خود جابه‌جا شده: افزایش اهمیت آزادی فردی و برابری جنسیتی، به‌ویژه در نسل‌های جوان‌تر و شهرها.", "en": "Across the three waves of the national Iranian Values and Attitudes survey (2000, 2003, 2015) and the World Values Survey waves, Iran has moved on the survival–self-expression axis: rising weight of individual freedom and gender equality, especially among younger cohorts and in cities.", "nl": "Across the three waves of the national Iranian Values and Attitudes survey (2000, 2003, 2015) and the World Values Survey waves, Iran has moved on the survival–self-expression axis: rising weight of individual freedom and gender equality, especially among younger cohorts and in cities."}, "sources": ["src:95287955fe", "src:4a310ccbde"], "flags": []}], "links": [{"to": "soc:generations", "rel": "explains", "note": {"fa": "سازوکار نسلی تغییر", "en": "The generational mechanism of change", "nl": "The generational mechanism of change"}}, {"to": "soc:secularization", "rel": "see-also", "note": {"fa": "دین", "en": "Religion", "nl": "Religion"}}, {"to": "psy:p-personality", "rel": "bridges", "note": {"fa": "ارزش‌ها در روان‌شناسی", "en": "Values in psychology", "nl": "Values in psychology"}}], "people": ["core:ronald-inglehart"], "sources": ["src:4a310ccbde", "src:8f0d6ab822", "src:95287955fe", "src:d7a317cebe"], "booklets": [], "origin": null, "iran": "iran:values-shift", "wikidata": null, "status": "draft"}], "people": {"core:afsaneh-najmabadi": {"id": "core:afsaneh-najmabadi", "name": {"fa": "افسانه نجم‌آبادی", "en": "Afsaneh Najmabadi", "nl": "Afsaneh Najmabadi"}, "years": "", "note": {"fa": "مورخ ایرانی‌آمریکایی که جنسیت و میل را در ایران قاجار و پهلوی بررسی کرده است."}, "wikidata": null, "wikis": ["soc"]}, "core:e-p-thompson": {"id": "core:e-p-thompson", "name": {"fa": "ای. پی. تامپسون", "en": "E. P. Thompson", "nl": "E. P. Thompson"}, "years": "1924–1993", "note": {"fa": "تاریخ‌نگار بریتانیایی؛ نویسندهٔ «شکل‌گیری طبقهٔ کارگر انگلیس»."}, "wikidata": null, "wikis": ["soc"]}, "core:charles-horton-cooley": {"id": "core:charles-horton-cooley", "name": {"fa": "چارلز هورتن کولی", "en": "Charles Horton Cooley", "nl": "Charles Horton Cooley"}, "years": "1864–1929", "note": {"fa": "طرح «خودِ آینه‌ای»؛ هویت از نگاه دیگران ساخته می‌شود."}, "wikidata": null, "wikis": ["soc"]}, "core:baldwin-spencer-and-francis-gillen": {"id": "core:baldwin-spencer-and-francis-gillen", "name": {"fa": "بالدوین اسپنسر و فرانسیس گیلن", "en": "Baldwin Spencer and Francis Gillen", "nl": "Baldwin Spencer and Francis Gillen"}, "years": "1860–1929 / 1855–1912", "note": {"fa": "پژوهشگران گزارش‌های میدانی دربارهٔ بومیان مرکز استرالیا؛ منبع اصلی داده‌های دورکایم."}, "wikidata": null, "wikis": ["soc"]}, "core:georg-wilhelm-friedrich-hegel": {"id": "core:georg-wilhelm-friedrich-hegel", "name": {"fa": "گئورگ ویلهلم فریدریش هگل", "en": "Georg Wilhelm Friedrich Hegel", "nl": "Georg Wilhelm Friedrich Hegel"}, "years": "1770–1831", "note": {"fa": "فیلسوف آلمانی؛ نویسندهٔ پدیدارشناسی روح و فلسفهٔ حق؛ تاریخ را حرکت آگاهی به‌سوی آزادی می‌دید."}, "wikidata": null, "wikis": ["phil", "soc"]}, "core:fr-d-ric-bastiat": {"id": "core:fr-d-ric-bastiat", "name": {"fa": "فردریک باستیا", "en": "Frédéri  and Cooperation. Weidenfeld & Nicolson.", "year": 1999, "tier": 2, "wikis": ["soc"]}}, "iran": {"iran:urbanization": {"id": "iran:urbanization", "domain": "soc", "question": {"fa": "شهرنشینی در ایران چقدر و چقدر سریع بوده است؟", "en": "How urban is Iran, and how fast did it get there?"}, "finding": {"fa": "سرشماری ۱۳۹۵: ۷۴ درصد شهرنشین (از حدود ۳۱ درصد در ۱۳۳۵)؛ تهران و حومه بیش از ۱۵ میلیون نفر.", "en": "2016 census: 74 percent urban (from about 31 percent in 1956); Tehran and periphery over 15 million."}, "year": 2016, "method": "national census", "grade": "A", "contested": false, "source": [{"title": "مرکز آمار ایران (۱۳۹۵). نتایج سرشماری عمومی نفوس و مسکن ۱۳۹۵.", "url": "https://www.amar.org.ir"}], "fields": [], "concepts": ["soc:urbanism"], "capability": [10]}, "iran:social-trust": {"id": "iran:social-trust", "domain": "soc", "question": {"fa": "اعتماد تعمیم‌یافتهٔ ایرانیان چقدر است؟", "en": "How high is Iranians' generalised trust?"}, "finding": {"fa": "در پیمایش جهانی ارزش‌ها حدود ۱۰ تا ۱۵ درصد می‌گویند «به بیشتر مردم می‌شود اعتماد کرد» (ردهٔ کشورهای کم‌اعتماد)؛ پیمایش ملی ارزش‌ها و نگرش‌ها نیز کاهش اعتماد به مردم را از موج اول (۱۳۷۹) تا سوم (۱۳۹۴) نشان می‌دهد. رقم دقیق به موج و شیوهٔ نمونه‌گیری وابسته است.", "en": "In the World Values Survey about 10 to 15 percent say \"most people can be trusted\" (a low-trust country); the national Values and Attitudes survey also shows trust in people falling from wave 1 (2000) to wave 3 (2015). Exact figures depend on wave and sampling."}, "year": 2020, "method": "national probability surveys (WVS; IVAS)", "grade": "B", "contested": false, "source": [{"title": "Haerpfer, C., Inglehart, R., Moreno, A., Welzel, C., et al. (Eds.) (2022). World Values Survey Wave 7 (2017–2022) Cross-National Data-Set. WVSA Secretariat.", "url": "https://www.worldvaluessurvey.org/WVSDocumentationWV7.jsp"}, {"title": "وزارت فرهنگ و ارشاد اسلامی، دفتر طرح‌های ملی (۱۳۷۹، ۱۳۸۲، ۱۳۹۴). پیمایش ملی ارزش‌ها و نگرش‌های ایرانیان، موج‌های اول تا سوم.", "url": ""}], "fields": [], "concepts": ["soc:generalized-trust"], "capability": [7], "critique": "سؤال واحد و ترجمه‌اش در ایران بحث‌برانگیز است؛ اعتماد «خاص» (به خانواده و آشنایان) بالا و «عام» پایین است و باید جدا گزارش شود."}, "iran:gini": {"id": "iran:gini", "domain": "soc", "question": {"fa": "نابرابری درآمد در ایران چقدر است؟", "en": "How unequal is income in Iran?"}, "finding": {"fa": "ضریب جینی در دههٔ اخیر حدود ۳۸ تا ۴۲ (بانک جهانی و مرکز آمار)؛ پس از ۱۳۹۰ کمی کاهش و در سال‌های تورم بالا دوباره افزایش. نابرابری ثروت اندازه‌گیری رسمی ندارد.", "en": "The Gini has been about 38 to 42 in the last decade (World Bank and Statistical Centre); a slight fall after 2011 and renewed rise in high-inflation years. Wealth inequality has no official measurement."}, "year": 2022, "method": "household budget surveys", "grade": "B", "contested": false, "source": [{"title": "World Bank (2024). Gini index — Iran, Islamic Rep. World Development Indicators.", "url": "https://data.worldbank.org/indicator/SI.POV.GINI?locations=IR"}], "fields": [], "concepts": ["soc:gini-inequality"], "capability": [10]}, "iran:religiosity": {"id": "iran:religiosity", "domain": "soc", "question": {"fa": "دین‌داری در ایران چقدر تغییر کرده است؟", "en": "How much has religiosity in Iran changed?"}, "finding": {"fa": "پیمایش ملی: افت نسلی مناسک جمعی همراه با پایداری باور شخصی. پیمایش آنلاین گمان (۲۰۲۰): سهم بالای بی‌دینی/معنویت بدون دین، اما نمونهٔ غیراحتمالی اینترنتی. نتیجهٔ محتاطانه: کاهش دین‌داری نهادی قطعی، اندازهٔ دقیقش نامعلوم.", "en": "National survey: generational fall in collective ritual with stable personal belief. Online GAMAAN survey (2020): high share of non-religion/spirituality without religion, but a non-probability internet sample. Cautious conclusion: a fall in institutional religiosity is certain, its exact size unknown."}, "year": 2020, "method": "national survey + online non-probability survey", "grade": "C", "contested": true, "source": [{"title": "وزارت فرهنگ و ارشاد اسلامی، دفتر طرح‌های ملی (۱۳۷۹، ۱۳۸۲، ۱۳۹۴). پیمایش ملی ارزش‌ها و نگرش‌های ایرانیان، موج‌های اول تا سوم.", "url": ""}, {"title": "GAMAAN — Maleki, A., & Arab, P. T. (2020). Iranians' Attitudes Toward Religion: A 2020 Survey Report. Group for Analyzing and Measuring Attitudes in Iran.", "url": "https://gamaan.org/2020/09/25/iranians-attitudes-toward-religion-a-2020-survey-report/"}], "fields": [], "concepts": ["soc:secularization"], "capability": [4, 7], "critique": "پیمایش آنلاین با نمونهٔ خودگزین را نمی‌توان به کل جمعیت تعمیم داد؛ پیمایش ملی نیز در موضوع دین با سوگیری «پاسخ مطلوب اجتماعی» روبه‌روست."}, "iran:fertility": {"id": "iran:fertility", "domain": "soc", "question": {"fa": "باروری در ایران چقدر و چگونه افت کرد؟", "en": "How far and how did fertility fall in Iran?"}, "finding": {"fa": "از حدود ۶٫۵ فرزند به ازای هر زن در اوایل دههٔ ۱۳۶۰ به حدود ۲ در ۱۳۷۹ و حدود ۱٫۷ در دههٔ ۱۴۰۰؛ افت در همهٔ استان‌ها و سطوح سواد. سیاست‌های تشویقی اخیر روند را برنگردانده‌اند.", "en": "From about 6.5 children per woman in the early 1980s to about 2 in 2000 and about 1.7 in the 2020s; the decline occurred in all provinces and literacy levels. Recent pronatalist policies have not reversed it."}, "year": 2024, "method": "census and DHS-type surveys; UN estimates", "grade": "A", "contested": false, "source": [{"title": "Abbasi-Shavazi, M. J., McDonald, P., & Hosseini-Chavoshi, M. (2009). The Fertility Transition in Iran: Revolution and Reproduction. Springer.", "url": "https://doi.org/10.1007/978-90-481-3198-3"}, {"title": "United Nations, Department of Economic and Social Affairs, Population Division (2024). World Population Prospects 2024.", "url": "https://population.un.org/wpp/"}], "fields": [], "concepts": ["soc:iran-fertility"], "capability": [2, 10]}, "iran:values-shift": {"id": "iran:values-shift", "domain": "soc", "question": {"fa": "ارزش‌های ایرانیان در دو دههٔ اخیر چگونه تغییر کرده؟", "en": "How have Iranians' values changed over two decades?"}, "finding": {"fa": "سه موج پیمایش ملی (
