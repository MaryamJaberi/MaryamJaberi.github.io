lict theory) argue that imbalance and group rivalry are themselves engines of change, and uneven development is widely observed in practice."}, "sources": [], "flags": ["contested", "editor-note"]}], "links": [{"to": "soc:institutions", "rel": "part-of", "note": {"fa": "زیرمجموعهٔ بحث نهادها و دولت", "en": "Part of institutions and the state", "nl": "Part of institutions and the state"}}, {"to": "soc:institutions-inclusive", "rel": "contrasts", "note": {"fa": "تبیین رقیب دربارهٔ نقش نهادها در توسعه", "en": "A rival account of institutions in development", "nl": "A rival account of institutions in development"}}, {"to": "soc:structural-functionalism", "rel": "see-also", "note": {"fa": "پایهٔ نظری این نگاه", "en": "The theoretical basis of this view", "nl": "The theoretical basis of this view"}}], "people": ["core:talcott-parsons", "core:ralf-dahrendorf"], "sources": ["src:58a696ccbe", "src:61f4ee0e09", "src:ade2795cc7"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:demography", "kind": "field", "title": {"fa": "جمعیت", "en": "Population", "nl": "Bevolking"}, "aliases": [], "parent": "soc:soc", "field": null, "summary": {"fa": "گذار جمعیتی، افت باروری و سالمندی: آرام‌ترین و بزرگ‌ترین تغییر اجتماعی قرن.", "en": "Demographic transition, fertility decline and ageing: the quietest and largest social change of the century.", "nl": "Demografische transitie, dalende vruchtbaarheid en vergrijzing: de stilste en grootste sociale verandering van de eeuw."}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:epistemic-distance", "kind": "concept", "title": {"fa": "فاصلهٔ معرفتی و موانع تفکر جامعه‌شناختی", "en": "Epistemic distance and the obstacles to sociological thinking", "nl": "Epistemische afstand en de obstakels voor sociologisch denken"}, "aliases": [], "parent": "soc:theory", "field": "soc:theory", "summary": {"fa": "برای فهمیدن یک پدیده، پژوهشگر باید از رابطهٔ عاطفی و ارزشی‌اش با آن فاصله بگیرد و به‌جای «خوب است یا بد؟» بپرسد «چرا این‌گونه است؟». چیزهای آشنا باید دوباره غریب و پرسش‌برانگیز شوند. سخنران سه مانع را نام می‌برد: بدیهیات روزمره، مفروضات تک‌خطی و امور مقدس. این نگاه با ایدهٔ برگر دربارهٔ «ظاهر فریبندهٔ چیزها» و با اصل بی‌طرفی ارزشی وبر هم‌خانواده است.", "en": "To understand a phenomenon, the researcher must step back from emotional and moral attachment to it and ask why it is as it is, not whether it is good or bad. Familiar things have to be made strange again. The lecturer names three obstacles: everyday taken-for-granted routines, one-line assumptions, and sacred matters. The approach resembles Berger's point that things are not what they seem and Weber's value-neutrality ideal.", "nl": "Om een verschijnsel te begrijpen moet de onderzoeker afstand nemen van zijn gevoelens en waardeoordelen en vragen waarom iets zo is. Vanzelfsprekendheden, simpele aannames en heilige zaken staan dit denken in de weg."}, "points": [{"text": {"fa": "به گفتهٔ سخنران، نزدیک‌شدن فهمیدنی به یک چیز با دور شدن از آن شروع می‌شود: پژوهشگر نسبت ارزشی خود با موضوع (عشق، نفرت، تقدس) را کنار می‌گذارد و فقط می‌خواهد توضیح و تفسیر بدهد. حتی زبان پژوهشی باید فاصله را حفظ کند.", "en": "Per the lecturer, understanding a thing begins by moving away from it: the researcher sets aside their moral and emotional relation to the topic and aims only to explain and interpret. Even the language of research should keep a respectful distance.", "nl": "Per the lecturer, understanding a thing begins by moving away from it: the researcher sets aside their moral and emotional relation to the topic and aims only to explain and interpret. Even the language of research should keep a respectful distance."}, "sources": ["src:ce2a70df17"], "flags": ["editor-note"]}, {"text": {"fa": "غریب‌سازی: جهان باید طوری دیده شود که انگار بار اول است. نمونهٔ سخنران نشستن جداگانهٔ زنان و مردان در کلاس است، بی‌آنکه کسی دستور داده باشد. چنین نظم‌هایی (ساخت اجتماعی) تا وقتی کسی نپرسد «چرا؟» دیده نمی‌شوند. این با جملهٔ پیتر برگر هم‌خوان است که چیزها آن‌گونه که به نظر می‌آیند نیستند.", "en": "Defamiliarisation: the world should be looked at as if for the first time. The lecturer's example is women and men sitting separately in a class without anyone ordering it. Such unspoken orders stay invisible until someone asks why. This fits Peter Berger's remark that things are not what they seem.", "nl": "Defamiliarisation: the world should be looked at as if for the first time. The lecturer's example is women and men sitting separately in a class without anyone ordering it. Such unspoken orders stay invisible until someone asks why. This fits Peter Berger's remark that things are not what they seem."}, "sources": ["src:ce2a70df17", "src:7f2358a691"], "flags": []}, {"text": {"fa": "سه مانع تفکر از دید سخنران: (۱) بدیهیات زندگی روزمره که جهان را بی‌نیاز از فکر کردن می‌کنند و در قالب نقش‌ها و تیپ‌ها (مثلاً «مادر ایرانی») شبیه هم می‌سازند؛ (۲) مفروضات تک‌خطی که ذهن را عجول و دچار همان‌پنداری می‌کنند، مثل «هر دیکتاتوری یکی است»؛ (۳) مقدسات که تحلیل را ناممکن می‌کنند.", "en": "The lecturer's three obstacles to thinking: (1) everyday taken-for-granted routines, which spare us from thinking and make people alike through roles and stereotypes (for example, 'the Iranian mother'); (2) one-line assumptions, which make the mind hasty and prone to treating different things as identical, such as 'all dictatorships are the same'; (3) sacred matters, which put analysis out of bounds.", "nl": "The lecturer's three obstacles to thinking: (1) everyday taken-for-granted routines, which spare us from thinking and make people alike through roles and stereotypes (for example, 'the Iranian mother'); (2) one-line assumptions, which make the mind hasty and prone to treating different things as identical, such as 'all dictatorships are the same'; (3) sacred matters, which put analysis out of bounds."}, "sources": ["src:ce2a70df17"], "flags": []}, {"text": {"fa": "به گفتهٔ سخنران، این مسیر ابتدا گیج‌کننده است و بسیاری آن را رها می‌کنند، اما کسی که ادامه دهد به نگاهی گسترده‌تر و نوعی شجاعت فکری (به یاد کانت) می‌رسد و حتی فقر یا خیانت را موضوع فهم می‌کند. او همچنین می‌گوید ذهن علمی ادعاهایش را بدون تعصب و آمادهٔ اصلاح نگه می‌دارد، برخلاف تعصب دینی.", "en": "Per the lecturer, this path is first confusing and many give up, but those who persist gain a wider view and a kind of intellectual courage (recalling Kant), and can even turn poverty or betrayal into objects of understanding. He also says the scientific mind holds its claims without fanaticism and ready for revision, unlike religious zeal.", "nl": "Per the lecturer, this path is first confusing and many give up, but those who persist gain a wider view and a kind of intellectual courage (recalling Kant), and can even turn poverty or betrayal into objects of understanding. He also says the scientific mind holds its claims without fanaticism and ready for revision, unlike religious zeal."}, "sources": ["src:ce2a70df17", "src:9f5a46df56"], "flags": ["editor-note"]}, {"text": {"fa": "نکتهٔ تکمیلی: بی‌طرفی ارزشی وبر به این معنا نیست که پژوهشگر بی‌ارزش است. انتخاب موضوع به ارزش‌ها وابسته است و منتقدان (مثل بوردیو با «بازاندیشی» و پژوهشگران فمینیست) می‌گویند بی‌طرفی کامل ممکن نیست؛ باید پیش‌فرض‌های خود را آشکار و بررسی کرد. همچنین تعلیق داوری روش است، نه نسبی‌گرایی اخلاقی. تصویر «دانشمند بی‌تعصب و دین‌دار متعصب» هم ساده‌شده است: دانشمندان نیز به چارچوب‌های رایج پایبندند (کوهن) و دین‌داران بسیار متنوع‌اند.", "en": "Caveat: Weber's value-neutrality does not mean the researcher has no values. Choice of topic is value-laden, and critics (for example Bourdieu's reflexivity, feminist standpoint scholars) argue complete neutrality is impossible, so one should expose and examine one's own assumptions. Suspending judgement is a method, not moral relativism. The contrast of an open-minded scientist and a dogmatic believer is also simplified: scientists too are committed to shared frameworks (Kuhn), and believers vary widely.", "nl": "Caveat: Weber's value-neutrality does not mean the researcher has no values. Choice of topic is value-laden, and critics (for example Bourdieu's reflexivity, feminist standpoint scholars) argue complete neutrality is impossible, so one should expose and examine one's own assumptions. Suspending judgement is a method, not moral relativism. The contrast of an open-minded scientist and a dogmatic believer is also simplified: scientists too are committed to shared frameworks (Kuhn), and believers vary widely."}, "sources": ["src:45d0ff665a", "src:9b2c2abd9b"], "flags": ["contested", "editor-note"]}], "links": [{"to": "soc:sociological-imagination", "rel": "see-also", "note": {"fa": "بینش جامعه‌شناختی نیز پیوند زندگی شخصی و ساختار را از فاصله می‌بیند.", "en": "The sociological imagination also views personal life from a distance.", "nl": "The sociological imagination also views personal life from a distance."}}, {"to": "soc:social-construction", "rel": "explains", "note": {"fa": "نظم‌های بدیهی همان واقعیت‌های ساخته‌شدهٔ اجتماعی‌اند.", "en": "Taken-for-granted orders are socially constructed realities.", "nl": "Taken-for-granted orders are socially constructed realities."}}, {"to": "phil:paradigms", "rel": "contrasts", "note": {"fa": "کوهن نشان می‌دهد علم هم بر چارچوب‌های پذیرفته‌شده تکیه دارد.", "en": "Kuhn shows science also rests on accepted frameworks.", "nl": "Kuhn shows science also rests on accepted frameworks."}}, {"to": "soc:discourse-subject-genealogy", "rel": "see-also", "note": {"fa": "ادامه: نگاه تاریخی و گفتمانی به پدیده‌ها.", "en": "Next: the historical and discursive view of phenomena.", "nl": "Next: the historical and discursive view of phenomena."}}], "people": ["core:peter-l-berger", "core:max-weber", "core:immanuel-kant"], "sources": ["src:45d0ff665a", "src:7f2358a691", "src:9b2c2abd9b", "src:9f5a46df56", "src:ce2a70df17"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:revolution-or-reform", "kind": "concept", "title": {"fa": "انقلاب یا اصلاح؟ مناظرهٔ مارکوزه و پوپر", "en": "Revolution or reform? The Marcuse-Popper debate", "nl": "Revolutie of hervorming? Het debat Marcuse-Popper"}, "aliases": [], "parent": "soc:theory", "field": "soc:theory", "summary": {"fa": "مارکس در «مانیفست» هدف کمونیست‌ها را سرنگونی قهرآمیز نظم موجود اعلام می‌کند. مارکوزه با دیدن ادغام طبقهٔ کارگر در جامعهٔ مصرفی، امید انقلاب را به دانشجویان و حاشیه‌نشینان منتقل می‌کند و پوپر در برابر او از اصلاح تدریجی دفاع می‌کند. سخنران بیشتر به پوپر نزدیک است.", "en": "In the Manifesto Marx declares that communist aims can be reached only by forcible overthrow of the existing order. Marcuse, seeing the working class absorbed into consumer society, moves his hope to students and outsiders, while Popper defends gradual reform. The lecturer leans toward Popper.", "nl": "Marx kondigt in het Manifest een gewelddadige omverwerping aan. Marcuse zoekt de revolutie bij studenten en buitenstaanders, Popper verdedigt geleidelijke hervorming."}, "points": [{"text": {"fa": "«مانیفست» با ستایش از هر جنبش انقلابی علیه نظم موجود پایان می‌یابد، مسئلهٔ مالکیت را محور همهٔ جنبش‌ها می‌داند و می‌گوید اهداف تنها با سرنگونی قهرآمیز تحقق می‌یابند. سخنران نتیجه می‌گیرد که نگاه مارکسیستی برای اصلاح جایی قائل نیست.", "en": "The Manifesto ends by backing every revolutionary movement against the existing order, makes property the central question, and says its aims can only be reached by forcible overthrow. The lecturer concludes the Marxist view leaves no room for reform.", "nl": "The Manifesto ends by backing every revolutionary movement against the existing order, makes property the central question, and says its aims can only be reached by forcible overthrow. The lecturer concludes the Marxist view leaves no room for reform."}, "sources": ["src:4d1925ef85", "src:a8f809b841"], "flags": []}, {"text": {"fa": "مارکوزه می‌گوید جامعهٔ سرمایه‌داری امروز ثروتمندترین جامعهٔ تاریخ است و امکان صلح و آزادی را هم می‌دهد و هم به‌شدت سرکوب می‌کند، پس فقط دگرگونی ریشه‌ای کارساز است. او در کارهای دیگرش (مثل «انسان تک‌ساحتی»، ۱۹۶۴) می‌گوید طبقهٔ کارگر به نظام وصل شده و باید به دانشجویان، اقلیت‌ها و برون‌ماندگان توجه کرد. سخنران این را دلیل می‌داند که نئومارکسیست‌ها حتی با شکست پیش‌بینی مارکس درباره طبقهٔ کارگر دست از انقلاب برنمی‌دارند.", "en": "Marcuse says today's capitalist society is the richest in history and both offers and strongly represses the chance of peace and freedom, so only a root-and-branch change works. In his other work (One-Dimensional Man, 1964) he argues the working class is integrated into the system and attention should turn to students, minorities and outsiders. The lecturer reads this as neo-Marxists keeping revolution alive even after Marx's prediction about the working class failed.", "nl": "Marcuse says today's capitalist society is the richest in history and both offers and strongly represses the chance of peace and freedom, so only a root-and-branch change works. In his other work (One-Dimensional Man, 1964) he argues the working class is integrated into the system and attention should turn to students, minorities and outsiders. The lecturer reads this as neo-Marxists keeping revolution alive even after Marx's prediction about the working class failed."}, "sources": ["src:4d1925ef85", "src:de1708eeb2", "src:9980d98384"], "flags": ["editor-note"]}, {"text": {"fa": "پوپر پاسخ می‌دهد که در همهٔ نظم‌های شناخته‌شده بی‌عدالتی و فقر بوده و دموکراسی‌های غربی، با همهٔ نقص، از بقیه کمتر دچار آن‌اند. او از اصلاح گام‌به‌گام و قابل‌اصلاح دفاع می‌کند و می‌گوید تلاش برای ساختن بهشت روی زمین بارها جهنم ساخته است. این بخشی از نقد گستردهٔ پوپر به تاریخ‌باوری در «جامعهٔ باز و دشمنانش» (۱۹۴۵) است.", "en": "Popper replies that injustice and poverty have existed in every known order and that Western democracies, flawed as they are, have less of them than the others. He defends step-by-step, correctable reform and says efforts to build heaven on earth have repeatedly built hell. This belongs to his wider critique of historicism in The Open Society and Its Enemies (1945).", "nl": "Popper replies that injustice and poverty have existed in every known order and that Western democracies, flawed as they are, have less of them than the others. He defends step-by-step, correctable reform and says efforts to build heaven on earth have repeatedly built hell. This belongs to his wider critique of historicism in The Open Society and Its Enemies (1945)."}, "sources": ["src:4d1925ef85", "src:7de66f5253", "src:9980d98384"], "flags": []}, {"text": {"fa": "به گفتهٔ سخنران، باور مارکس به جامعه‌ای بی‌طبقه و جهان دوقطبی شبیه ساختار دینی است. این قیاس را ریمون آرون در «افیون روشنفکران» (۱۹۵۵) و کارل لووی‌ت در «معنا در تاریخ» (۱۹۴۹) نیز به شکل‌هایی مطرح کرده‌اند، اما هواداران مارکس آن را تقلیل‌گرا می‌دانند.", "en": "Per the lecturer, Marx's faith in a classless society and a two-sided world resembles a religious structure. Raymond Aron (The Opium of the Intellectuals, 1955) and Karl Lowith (Meaning in History, 1949) draw related comparisons in their own ways, but Marx's defenders call it reductive.", "nl": "Per the lecturer, Marx's faith in a classless society and a two-sided world resembles a religious structure. Raymond Aron (The Opium of the Intellectuals, 1955) and Karl Lowith (Meaning in History, 1949) draw related comparisons in their own ways, but Marx's defenders call it reductive."}, "sources": ["src:4d1925ef85", "src:eb9ea2fbe9"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "تصویر «مارکس ضد اصلاح» ساده‌شده است: او از قانون ده‌ساعته و قوانین کارخانه حمایت کرد، و در سخنرانی ۱۸۷۲ آمستردام گفت در کشورهایی مانند انگلستان، آمریکا و هلند ممکن است کارگران از راه مسالمت‌آمیز به قدرت برسند. در برابر، نقد رادیکال‌ها این است که اصلاح می‌تواند ریشه‌های بی‌عدالتی را دست‌نخورده بگذارد؛ مناقشه هنوز باز است.", "en": "The picture of an 'anti-reform Marx' is simplified: he backed the Ten Hours Act and factory laws, and in his 1872 Amsterdam speech said workers might reach power by peaceful means in countries such as England, America and Holland. The radicals' counter-argument is that reform can leave the roots of injustice untouched; the dispute is still open.", "nl": "The picture of an 'anti-reform Marx' is simplified: he backed the Ten Hours Act and factory laws, and in his 1872 Amsterdam speech said workers might reach power by peaceful means in countries such as England, America and Holland. The radicals' counter-argument is that reform can leave the roots of injustice untouched; the dispute is still open."}, "sources": [], "flags": ["contested", "editor-note"]}], "links": [{"to": "soc:marx-capitalism-dynamics", "rel": "contrasts", "note": {"fa": "پیش‌بینی‌های مارکس دربارهٔ طبقهٔ کارگر و بحران.", "en": "Marx's predictions about the working class and crisis.", "nl": "Marx's predictions about the working class and crisis."}}, {"to": "phil:political", "rel": "part-of", "note": {"fa": "فلسفهٔ سیاسی.", "en": "Political philosophy.", "nl": "Political philosophy."}}, {"to": "phil:falsification", "rel": "see-also", "note": {"fa": "پوپر و ابطال‌پذیری.", "en": "Popper and falsifiability.", "nl": "Popper and falsifiability."}}], "people": ["core:herbert-marcuse", "core:karl-popper"], "sources": ["src:4d1925ef85", "src:7de66f5253", "src:9980d98384", "src:a8f809b841", "src:de1708eeb2", "src:eb9ea2fbe9"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:functionalism-vs-conflict-culture", "kind": "concept", "title": {"fa": "کارکردگرایی در برابر نظریهٔ تضاد: فرهنگ از کجا می‌آید؟", "en": "Functionalism versus conflict theory: where does culture come from?", "nl": "Functionalisme versus conflicttheorie: waar komt cultuur vandaan?"}, "aliases": [], "parent": "soc:theory", "field": "soc:theory", "summary": {"fa": "سخنران دو خوانش را برابر هم می‌گذارد: کارکردگرایان فرهنگ را محصول توافق و همبستگی می‌دانند و با دخالت دولت مخالف‌اند؛ نظریهٔ تضاد (مارکسیستی و فمینیستی) آن را محصول سلطه می‌داند. او خودش به خوانش اول نزدیک است و انقلاب خشونت‌آمیز را نمی‌پذیرد. این نوشته هر دو سو را با نقدهایشان می‌آورد.", "en": "The lecturer sets two readings side by side: functionalists see culture as the product of agreement and solidarity and oppose state meddling; conflict theory (Marxist and feminist) sees it as the product of domination. He leans to the first and rejects violent revolution. This entry gives both sides with their critiques.", "nl": "Twee lezingen van cultuur: functionalisme (cultuur ontstaat uit consensus en solidariteit) tegenover conflicttheorie (cultuur ontstaat uit overheersing). De spreker neigt naar de eerste en wijst gewelddadige revolutie af."}, "points": [{"text": {"fa": "خوانش کارکردگرا به روایت سخنران: جامعه مجموعه‌ای هماهنگ از بخش‌هاست؛ فرهنگ خودجوش است و از توافق و همبستگی می‌آید، پس دولت نباید فرهنگ، اقتصاد یا خانواده را دستوری اداره کند. او این خوانش را به لیبرال‌ها نسبت می‌دهد. تقسیم کار و سلسله‌مراتب قدرت را هم برای هر جامعه‌ای ناگزیر می‌داند و با مثال بازماندگان یک کشتی‌شکسته در جزیره توضیح می‌دهد.", "en": "The functionalist reading as the lecturer presents it: society is a harmonious set of parts; culture is spontaneous and comes from agreement and solidarity, so the state should not run culture, economy or family by command. He ascribes this reading to liberals. He also treats division of labour and a power hierarchy as unavoidable in any society, illustrating it with shipwreck survivors on an island.", "nl": "The functionalist reading as the lecturer presents it: society is a harmonious set of parts; culture is spontaneous and comes from agreement and solidarity, so the state should not run culture, economy or family by command. He ascribes this reading to liberals. He also treats division of labour and a power hierarchy as unavoidable in any society, illustrating it with shipwreck survivors on an island."}, "sources": ["src:d50f6ac9b8"], "flags": ["editor-note"]}, {"text": {"fa": "خوانش تضاد به روایت سخنران: ارزش‌های فرهنگی روزی با زور برقرار شده‌اند و تاریخ نبرد ستمگر و ستم‌دیده است؛ فمینیسم چپ تقسیم جنسیتی را ساختهٔ زور مردانه می‌بیند. چون فرهنگ را دستوری می‌داند، سخنران می‌گوید چپ به تغییر آن با دستور و اقتصاد دستوری روی می‌آورد، و «آگاهی کاذب» را هر آگاهی می‌داند که به مبارزه خدمت نکند.", "en": "The conflict reading as the lecturer presents it: cultural values were once imposed by force and history is a struggle between oppressor and oppressed; left feminism sees gender divisions as made by male power. Since it treats culture as imposed, he says the left turns to changing it by command and a command economy, and defines 'false consciousness' as any awareness that does not serve the struggle.", "nl": "The conflict reading as the lecturer presents it: cultural values were once imposed by force and history is a struggle between oppressor and oppressed; left feminism sees gender divisions as made by male power. Since it treats culture as imposed, he says the left turns to changing it by command and a command economy, and defines 'false consciousness' as any awareness that does not serve the struggle."}, "sources": ["src:d50f6ac9b8"], "flags": ["editor-note"]}, {"text": {"fa": "سخنران قانون مدرن را چیزی می‌داند که جامعه به‌تدریج «کشف» می‌کند و دولت سپس آن را اجرا می‌کند، و قانون را دو دست می‌داند که یکی زور است (در تأیید هابز دربارهٔ لزوم دولت). او با تشویق به خشونت انقلابی مخالف است و انقلاب فرانسه را مثال می‌آورد، اما می‌گوید «راهی جز انقلاب نیست و ته خشونت معلوم نیست» را یک تناقض تاریخی حل‌نشده می‌داند.", "en": "The lecturer holds that modern law is 'discovered' gradually by society and then enforced by the state, and that law has a hand of force (supporting Hobbes on the need for a state). He opposes encouraging revolutionary violence, citing the French Revolution, while admitting that 'no way but revolution, yet violence ends who knows where' is an unresolved historical paradox.", "nl": "The lecturer holds that modern law is 'discovered' gradually by society and then enforced by the state, and that law has a hand of force (supporting Hobbes on the need for a state). He opposes encouraging revolutionary violence, citing the French Revolution, while admitting that 'no way but revolution, yet violence ends who knows where' is an unresolved historical paradox."}, "sources": ["src:d50f6ac9b8"], "flags": ["editor-note"]}, {"text": {"fa": "نقد دو خوانش: کارکردگرایی با لیبرالیسم یکی نیست (دورکیم و پارسونز لیبرال سیاسی در معنای او نبودند) و منتقدان می‌گویند «توافق خودجوش» می‌تواند نابرابری را پنهان کند؛ مدل دیویس–مور دربارهٔ لزوم سلسله‌مراتب را تومین نقد کرد و مردم‌شناسی جمع‌آورندگان برابری‌خواه را نشان می‌دهد. از سوی دیگر، مارکسیسم هم ساده‌تر از روایت سخنران است: گرامشی بر «هژمونی» یعنی سلطه از راه رضایت تأکید داشت نه فقط زور، و اصطلاح «آگاهی کاذب» از انگلس (نامهٔ ۱۸۹۳) است.", "en": "Critique of both readings: functionalism is not the same as liberalism (Durkheim and Parsons were not political liberals in his sense), and critics say 'spontaneous agreement' can hide inequality; the Davis–Moore claim that hierarchy is necessary was criticised by Tumin, and anthropology records egalitarian foragers. Marxism is likewise richer than presented: Gramsci stressed hegemony, rule through consent and not only force, and the phrase 'false consciousness' comes from Engels (1893 letter).", "nl": "Critique of both readings: functionalism is not the same as liberalism (Durkheim and Parsons were not political liberals in his sense), and critics say 'spontaneous agreement' can hide inequality; the Davis–Moore claim that hierarchy is necessary was criticised by Tumin, and anthropology records egalitarian foragers. Marxism is likewise richer than presented: Gramsci stressed hegemony, rule through consent and not only force, and the phrase 'false consciousness' comes from Engels (1893 letter)."}, "sources": ["src:364f92d499", "src:8a3559c7f8", "src:2577464657", "src:b7f97f11e5"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "نقد تکمیلی: لاووازیه را به‌خاطر نقشش در نظام مالیات‌گیری پیش از انقلاب (فرم ژنرال) در دورهٔ ترور ۱۷۹۴ گیوتین کردند، نه برای یک جزوه. همچنین پژوهش چنووت و استفان نشان می‌دهد در قرن بیستم کارزارهای مقاومت بدون خشونت بیش از شورش‌های مسلحانه به هدف رسیده‌اند. از دید پوزیتیویسم حقوقی، قانون «ساخته» می‌شود نه «کشف»، و دولت‌ها گاه پیش از جامعه اصلاح می‌کنند.", "en": "Further caveat: Lavoisier was guillotined in 1794, during the Terror, for his role in the pre-revolutionary tax-farming system (Ferme générale), not for a pamphlet. Chenoweth and Stephan's research finds that nonviolent resistance campaigns in the twentieth century succeeded more often than armed uprisings. Legal positivists add that law is made, not discovered, and states sometimes reform ahead of society.", "nl": "Further caveat: Lavoisier was guillotined in 1794, during the Terror, for his role in the pre-revolutionary tax-farming system (Ferme générale), not for a pamphlet. Chenoweth and Stephan's research finds that nonviolent resistance campaigns in the twentieth century succeeded more often than armed uprisings. Legal positivists add that law is made, not discovered, and states sometimes reform ahead of society."}, "sources": ["src:1a767d9a85", "src:c5f931261d", "src:19fa7566dc"], "flags": ["contested", "editor-note"]}], "links": [{"to": "soc:theory", "rel": "part-of", "note": {"fa": "از مناقشه‌های بنیادین نظریهٔ اجتماعی", "en": "A founding dispute in social theory", "nl": "A founding dispute in social theory"}}, {"to": "soc:social-movements", "rel": "see-also", "note": {"fa": "جنبش‌ها و روش‌های مبارزه", "en": "Movements and methods of struggle", "nl": "Movements and methods of struggle"}}, {"to": "soc:preference-falsification", "rel": "see-also", "note": {"fa": "غافلگیری انقلاب‌ها", "en": "The surprise of revolutions", "nl": "The surprise of revolutions"}}, {"to": "phil:bastiat-law-state", "rel": "contrasts", "note": {"fa": "نقش قانون و دولت در سنت لیبرال", "en": "Law and state in the liberal tradition", "nl": "Law and state in the liberal tradition"}}], "people": ["core:antonio-gramsci", "core:thomas-hobbes", "core:antoine-lavoisier", "core:erica-chenoweth"], "sources": ["src:19fa7566dc", "src:1a767d9a85", "src:2577464657", "src:364f92d499", "src:8a3559c7f8", "src:b7f97f11e5", "src:c5f931261d", "src:d50f6ac9b8"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:durkheim-sacred-society", "kind": "concept", "title": {"fa": "دورکایم و دین: مقدس، توتم و پرستش جامعه", "en": "Durkheim on religion: the sacred, the totem and the worship of society", "nl": "Durkheim over religie: het heilige, de totem en de verering van de samenleving"}, "aliases": [], "parent": "soc:values", "field": "soc:values", "summary": {"fa": "دورکایم در «صورت‌های بنیادین حیات دینی» (۱۹۱۲) می‌پرسد دین در ساده‌ترین شکلش چیست و چرا در همهٔ جامعه‌ها هست. او دین را نه باور به خدا، بلکه نظامی از باورها و آیین‌ها دربارهٔ امر «مقدس» می‌داند که مؤمنان را در یک اجتماع اخلاقی گرد هم می‌آورد. به نظر او نیروی پشت امر مقدس در واقع خود جامعه است که در نماد (مثلاً توتم) جلوه می‌کند. این نظریه دین را «وهم» نمی‌داند و برای آن کارکردی اجتماعی قائل است.", "en": "In The Elementary Forms of Religious Life (1912) Durkheim asks what religion is in its simplest form and why it appears in every society. He defines it not as belief in gods but as a system of beliefs and practices about the 'sacred' that unites believers in one moral community. In his view the force behind the sacred is society itself, shown through symbols such as the totem. The theory treats religion as neither illusion nor fraud, but as socially useful.", "nl": "In Les formes élémentaires de la vie religieuse (1912) vraagt Durkheim wat religie in haar eenvoudigste vorm is. Hij definieert haar als een stelsel van overtuigingen en praktijken rond het 'heilige' dat gelovigen in één morele gemeenschap verenigt, en ziet in het heilige uiteindelijk de samenleving zelf."}, "points": [{"text": {"fa": "روش کار: دورکایم پیش از هر بحث، پدیده را تعریف می‌کند و تعریف‌های رایج (دین یعنی جان‌باوری، طبیعت‌پرستی، باور به خدا یا به امر فراطبیعی) را رد می‌کند، چون هر تعریفی که برخی دین‌ها (مثلاً بودایی) را بیرون بگذارد ناقص است. سپس سراغ ساده‌ترین نمونهٔ ممکن می‌رود تا هستهٔ مشترک دین را پیدا کند.", "en": "Method: before arguing, Durkheim defines the phenomenon and rejects the usual definitions (animism, nature worship, belief in gods or the supernatural), because any definition that excludes some religions, such as Buddhism, is inadequate. He then looks at the simplest available case to find the common core of religion.", "nl": "Method: before arguing, Durkheim defines the phenomenon and rejects the usual definitions (animism, nature worship, belief in gods or the supernatural), because any definition that excludes some religions, such as Buddhism, is inadequate. He then looks at the simplest available case to find the common core of religion."}, "sources": ["src:3c8a365a14", "src:e16c79b314", "src:68f3ac9016"], "flags": []}, {"text": {"fa": "تعریف خودش: دین نظامی به‌هم‌پیوسته از باورها و اعمال دربارهٔ چیزهای مقدس، یعنی چیزهای جداشده و ممنوع، است که همهٔ پیروان را در یک اجتماع اخلاقی واحد (که «کلیسا» می‌نامد) متحد می‌کند. جهان به دو بخش «مقدس» و «غیرمقدس (روزمره)» تقسیم می‌شود. «مقدس» در اینجا یعنی جدا و ممنوع، نه لزوماً الهیاتی.", "en": "His own definition: religion is a unified system of beliefs and practices relative to sacred things, meaning things set apart and forbidden, which unites all adherents in one moral community he calls a 'church'. The world divides into the sacred and the profane (everyday). 'Sacred' here means set apart and forbidden, not necessarily theological.", "nl": "His own definition: religion is a unified system of beliefs and practices relative to sacred things, meaning things set apart and forbidden, which unites all adherents in one moral community he calls a 'church'. The world divides into the sacred and the profane (everyday). 'Sacred' here means set apart and forbidden, not necessarily theological."}, "sources": ["src:e16c79b314"], "flags": []}, {"text": {"fa": "توتم و تابو: توتم گیاه، حیوان یا نشانی است که یک طایفه آن را نماد خود و مقدس می‌داند. به نظر دورکایم توتم درست نماد خود طایفه است و نیرویی بی‌نام و غیرشخصی را نشان می‌دهد که میان همهٔ اعضا مشترک است و از تک‌تک افراد بادوام‌تر است. تابو یعنی پرهیز از کارهایی که با امر مقدس ناسازگار است.", "en": "Totem and taboo: a totem is a plant, animal or sign that a clan treats as its emblem and as sacred. For Durkheim the totem is a symbol of the clan itself and stands for an impersonal force shared by all members and outlasting any individual. A taboo is the avoidance of acts incompatible with the sacred.", "nl": "Totem and taboo: a totem is a plant, animal or sign that a clan treats as its emblem and as sacred. For Durkheim the totem is a symbol of the clan itself and stands for an impersonal force shared by all members and outlasting any individual. A taboo is the avoidance of acts incompatible with the sacred."}, "sources": ["src:e16c79b314"], "flags": []}, {"text": {"fa": "نتیجهٔ اصلی: جامعه بر افراد اقتدار اخلاقی دارد و آن‌ها را به فداکاری و پیروی از قواعدی وامی‌دارد که خودشان نساخته‌اند؛ این احساس احترام و وابستگی همان است که در دین نسبت به خدا دیده می‌شود. پس دین «پرستش جامعه در لباس نماد» است. به گفتهٔ سخنران، اگر دین بازتاب واقعیت اجتماعی باشد، با تغییر جامعه می‌توان انتظار داشت اشکال تازه‌ای از دین یا اسطوره پدید آید.", "en": "Main conclusion: society holds moral authority over individuals and makes them accept sacrifice and rules they did not make; the respect and dependence felt toward it is what believers feel toward God. So religion is 'the worship of society in symbolic dress'. Per the lecturer, if religion reflects social reality, new forms of religion or myth can be expected as societies change.", "nl": "Main conclusion: society holds moral authority over individuals and makes them accept sacrifice and rules they did not make; the respect and dependence felt toward it is what believers feel toward God. So religion is 'the worship of society in symbolic dress'. Per the lecturer, if religion reflects social reality, new forms of religion or myth can be expected as societies change."}, "sources": ["src:3c8a365a14", "src:e16c79b314"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، نگاه دورکایم با تحلیل «دین ابزار فریب روحانیان و صاحبان قدرت است» فرق دارد و تقلیل دین به فریب را نمی‌پذیرد؛ باید به جای نیت‌ها به کارکرد پدیده نگاه کرد. توجه: تحلیل انتقادی (مارکس، گرامشی) هم دین را جدی می‌گیرد، اما می‌پرسد این کارکرد به سود چه کسانی است؛ این دو نگاه الزاماً ناسازگار نیستند و بسیاری از پژوهشگران هر دو را با هم به کار می‌برند.", "en": "Per the lecturer, Durkheim's view differs from the idea that religion is a trick of priests and the powerful, and refuses to reduce it to deception; one should look at function rather than intent. Note: critical analysis (Marx, Gramsci) also takes religion seriously but asks whom the function benefits; the two views are not necessarily incompatible and many scholars use both.", "nl": "Per the lecturer, Durkheim's view differs from the idea that religion is a trick of priests and the powerful, and refuses to reduce it to deception; one should look at function rather than intent. Note: critical analysis (Marx, Gramsci) also takes religion seriously but asks whom the function benefits; the two views are not necessarily incompatible and many scholars use both."}, "sources": ["src:3c8a365a14", "src:913c088179"], "flags": ["editor-note", "contested"]}, {"text": {"fa": "نقدهای مهم: (۱) داده‌های دورکایم دست‌دوم بود و از گزارش‌های اسپنسر و گیلن دربارهٔ قبایل بومی استرالیا آمده؛ بعدها مردم‌شناسان در تعمیم آن‌ها تردید کردند. (۲) این‌که توتم‌پرستی «ابتدایی‌ترین» دین باشد فرض تکامل‌گرایانهٔ قرن نوزدهم است و امروز پذیرفته نیست؛ لوی‌استروس حتی گفت «توتمیسم» مقوله‌ای ساختگی است. (۳) ریمون آرون و دیگران گفته‌اند تقلیل امر مقدس به جامعه تجربهٔ دینی و ادعای فراطبیعی را توضیح نمی‌دهد.", "en": "Key criticisms: (1) Durkheim's data were second-hand, drawn from Spencer and Gillen's reports on Aboriginal Australians, and anthropologists later doubted how far they generalise. (2) That totemism is the 'most primitive' religion is a nineteenth-century evolutionist assumption no longer accepted; Lévi-Strauss argued 'totemism' is an artificial category. (3) Raymond Aron and others argued that reducing the sacred to society does not explain religious experience or claims about the transcendent.", "nl": "Key criticisms: (1) Durkheim's data were second-hand, drawn from Spencer and Gillen's reports on Aboriginal Australians, and anthropologists later doubted how far they generalise. (2) That totemism is the 'most primitive' religion is a nineteenth-century evolutionist assumption no longer accepted; Lévi-Strauss argued 'totemism' is an artificial category. (3) Raymond Aron and others argued that reducing the sacred to society does not explain religious experience or claims about the transcendent."}, "sources": ["src:b8144c2c0e", "src:6ac780faf7", "src:666b2c4160"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، توتم‌ها را زنان پدید آوردند، توتم هویت «خودی/غیرخودی» ساخت و پیش از آن آدم‌ها همدیگر را می‌کشتند، و توتم‌های گوناگون در یک «بت» مشترک جمع شدند. این روایت‌ها در پژوهش‌های معتبر پشتوانهٔ روشنی ندارند و بیشتر حدس‌اند؛ نظریهٔ دورکایم هم چنین ادعاهایی نمی‌کند.", "en": "Per the lecturer, women created totems, totems produced an in-group/out-group identity after a time when people killed one another on sight, and many totems merged into one common 'idol'. These stories have no clear support in the scholarly literature and are speculation; Durkheim's theory makes no such claims.", "nl": "Per the lecturer, women created totems, totems produced an in-group/out-group identity after a time when people killed one another on sight, and many totems merged into one common 'idol'. These stories have no clear support in the scholarly literature and are speculation; Durkheim's theory makes no such claims."}, "sources": ["src:3c8a365a14"], "flags": ["editor-note", "contested"]}], "links": [{"to": "soc:collective-effervescence-ritual", "rel": "part-of", "note": {"fa": "غلیان جمعی و آیین‌ها بخشی از همین نظریهٔ دین است.", "en": "Collective effervescence and ritual are part of this theory of religion.", "nl": "Collective effervescence and ritual are part of this theory of religion."}}, {"to": "soc:secularization", "rel": "see-also", "note": {"fa": "اگر دین نیروی پیوند جامعه باشد، سکولار شدن چه پیامدی دارد؟", "en": "If religion binds society, what follows from secularisation?", "nl": "If religion binds society, what follows from secularisation?"}}, {"to": "soc:cohesion", "rel": "explains", "note": {"fa": "توضیحی دربارهٔ منبع همبستگی اخلاقی.", "en": "An account of the source of moral solidarity.", "nl": "An account of the source of moral solidarity."}}, {"to": "soc:anomie", "rel": "see-also", "note": {"fa": "دورکایم نگران ضعف اجماع اخلاقی در جامعهٔ فردگرا بود.", "en": "Durkheim worried about weakening moral consensus in an individualist society.", "nl": "Durkheim worried about weakening moral consensus in an individualist society."}}], "people": ["core:mile-durkheim", "core:raymond-aron", "core:claude-l-vi-strauss"], "sources": ["src:3c8a365a14", "src:666b2c4160", "src:68f3ac9016", "src:6ac780faf7", "src:913c088179", "src:b8144c2c0e", "src:e16c79b314"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:secularization", "kind": "concept", "title": {"fa": "سکولار شدن: امنیت وجودی و دین", "en": "Secularization: existential security and religion", "nl": "Secularisering: existentiële zekerheid en religie"}, "aliases": [], "parent": "soc:values", "field": "soc:values", "summary": {"fa": "نظریهٔ کلاسیک می‌گفت مدرنیته دین را کم‌رنگ می‌کند؛ آمریکا و جهان اسلام استثنا به نظر می‌رسیدند. نوریس و اینگلهارت پاسخ دادند: متغیر اصلی «امنیت وجودی» است؛ هرجا زندگی امن و پیش‌بینی‌پذیر شود، دین‌داری افت می‌کند، و چون جمعیت کشورهای دین‌دار سریع‌تر رشد می‌کند، جهان در کل سکولار نمی‌شود.", "en": "The classic theory said modernity fades religion; America and the Muslim world looked like exceptions. Norris and Inglehart replied: the key variable is \"existential security\"; wherever life becomes safe and predictable religiosity falls, and because religious countries' populations grow faster, the world as a whole does not secularise.", "nl": "De klassieke theorie zei dat moderniteit religie doet verbleken; Amerika en de islamitische wereld leken uitzonderingen. Norris en Inglehart antwoordden: de sleutelvariabele is \"existentiële zekerheid\"; waar het leven veilig en voorspelbaar wordt, daalt religiositeit, en omdat de bevolking van religieuze landen sneller groeit, seculariseert de wereld als geheel niet."}, "points": [{"text": {"fa": "نوریس و اینگلهارت (۲۰۱۱): دین‌داری با آسیب‌پذیری (فقر، بیماری، ناامنی) همبستگی قوی دارد؛ در کشورهای ثروتمندِ با دولت رفاه قوی، حضور در عبادتگاه و اهمیت خدا در زندگی پایین‌ترین است. آمریکا با نابرابری و ناامنی بالاترش تا حدی توضیح داده می‌شود.", "en": "Norris and Inglehart (2011): religiosity correlates strongly with vulnerability (poverty, illness, insecurity); in rich countries with strong welfare states, attendance and the importance of God in life are lowest. America is partly explained by its higher inequality and insecurity.", "nl": "Norris and Inglehart (2011): religiosity correlates strongly with vulnerability (poverty, illness, insecurity); in rich countries with strong welfare states, attendance and the importance of God in life are lowest. America is partly explained by its higher inequality and insecurity."}, "sources": ["src:782cc6ae73"], "flags": []}, {"text": {"fa": "دادهٔ ایران: پیمایش ملی ارزش‌ها و نگرش‌ها افت نسلی در مناسک جمعی (نماز جماعت، مسجد) همراه با پایداری باورهای شخصی را نشان می‌دهد؛ پیمایش آنلاین گمان (۲۰۲۰، حدود ۵۰ هزار پاسخ‌گو) سهم بالایی از «بی‌دین» یا «معنوی بدون دین» گزارش کرد، اما نمونه‌اش غیراحتمالی و اینترنتی است و نباید با پیمایش ملی یکی گرفته شود.", "en": "Iranian data: the national Values and Attitudes survey shows a generational fall in collective ritual (congregational prayer, mosque) alongside stable personal belief; the online GAMAAN survey (2020, about 50,000 respondents) reported a high share of \"non-religious\" or \"spiritual but not religious\", but its sample is non-probability and internet-based and must not be equated with a national survey.", "nl": "Iranian data: the national Values and Attitudes survey shows a generational fall in collective ritual (congregational prayer, mosque) alongside stable personal belief; the online GAMAAN survey (2020, about 50,000 respondents) reported a high share of \"non-religious\" or \"spiritual but not religious\", but its sample is non-probability and internet-based and must not be equated with a national survey."}, "sources": ["src:95287955fe", "src:6d79b4e77e"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "دورکیم: کارکرد دین پیش از هر چیز انسجام جمعی است («جامعه خودش را می‌پرستد»)؛ از این رو با افول مناسک، نهادهای جایگزینِ هم‌بستگی (ورزش، ملی‌گرایی، جنبش‌ها) پر می‌شوند.", "en": "Durkheim: religion's function is first of all collective cohesion (\"society worships itself\"); hence as ritual declines, substitute institutions of solidarity (sport, nationalism, movements) fill the space.", "nl": "Durkheim: religion's function is first of all collective cohesion (\"society worships itself\"); hence as ritual declines, substitute institutions of solidarity (sport, nationalism, movements) fill the space."}, "sources": ["src:fcce5dbd78"], "flags": []}], "links": [{"to": "soc:value-change", "rel": "part-of", "note": {"fa": "بخشی از تغییر ارزش‌ها", "en": "Part of value change", "nl": "Part of value change"}}, {"to": "psy:meaning-making", "rel": "bridges", "note": {"fa": "معناسازی در ویکی روان", "en": "Meaning-making in the psychology wiki", "nl": "Meaning-making in the psychology wiki"}}, {"to": "soc:protestant-ethic", "rel": "see-also", "note": {"fa": "دین و اقتصاد", "en": "Religion and economy", "nl": "Religion and economy"}}], "people": ["core:ronald-inglehart", "core:emile-durkheim"], "sources": ["src:6d79b4e77e", "src:782cc6ae73", "src:95287955fe", "src:fcce5dbd78"], "booklets": [], "origin": null, "iran": "iran:religiosity", "wikidata": null, "status": "draft"}, {"id": "soc:protestant-ethic", "kind": "concept", "title": {"fa": "اخلاق پروتستانی و روح سرمایه‌داری", "en": "The Protestant ethic and the spirit of capitalism", "nl": "De protestantse ethiek en de geest van het kapitalisme"}, "aliases": [], "parent": "soc:institutions", "field": "soc:institutions", "summary": {"fa": "وبر پرسید چرا سرمایه‌داری عقلانی اول در اروپای پروتستان شکوفا شد و پاسخ داد: کار سخت و ریاضت‌کشانه به‌عنوان نشانهٔ رستگاری، پس‌انداز به جای مصرف، و حساب‌گری روزمره. تز پرنفوذی که شواهد تجربی‌اش مختلط است.", "en": "Weber asked why rational capitalism first flourished in Protestant Europe and answered: ascetic hard work as a sign of salvation, saving over consumption, and everyday calculation. An influential thesis with mixed empirical evidence.", "nl": "Weber vroeg waarom het rationele kapitalisme eerst in protestants Europa opbloeide en antwoordde: ascetisch hard werken als teken van verlossing, sparen boven consumeren, en alledaagse berekening. Een invloedrijke these met gemengd empirisch bewijs."}, "points": [{"text": {"fa": "وبر (۱۹۰۵): هدف نشان دادن «قرابت انتخابی» میان یک اخلاق دینی و یک نظام اقتصادی بود، نه علیت یک‌طرفه؛ خودش هشدار داد که «قفس آهنین» سرمایه‌داری دیگر به روح دینی نیازی ندارد.", "en": "Weber (1905): the aim was to show an \"elective affinity\" between a religious ethic and an economic system, not one-way causation; he himself warned that capitalism's \"iron cage\" no longer needs the religious spirit.", "nl": "Weber (1905): the aim was to show an \"elective affinity\" between a religious ethic and an economic system, not one-way causation; he himself warned that capitalism's \"iron cage\" no longer needs the religious spirit."}, "sources": ["src:44db2d1cb1"], "flags": []}, {"text": {"fa": "هنریک (۲۰۲۰) روایت جایگزین می‌دهد: ممنوعیت‌های کلیسای غربی بر ازدواج خویشاوندی خانواده‌های گسترده را شکست و روان‌شناسی «فردگرا، غیرشخصی و تحلیلی» ساخت که بعدها بازار و دموکراسی روی آن سوار شد؛ پروتستانتیسم بیشتر سوادآموزی را بالا برد تا اخلاق کار.", "en": "Henrich (2020) offers an alternative account: the Western Church's bans on cousin marriage broke extended kin groups and produced an \"individualist, impersonal, analytic\" psychology on which markets and democracy later rode; Protestantism raised literacy more than the work ethic.", "nl": "Henrich (2020) offers an alternative account: the Western Church's bans on cousin marriage broke extended kin groups and produced an \"individualist, impersonal, analytic\" psychology on which markets and democracy later rode; Protestantism raised literacy more than the work ethic."}, "sources": ["src:6858037a34"], "flags": ["contested"]}], "links": [{"to": "tabar:consanguinity", "rel": "bridges", "note": {"fa": "ازدواج خویشاوندی و ساختار خانواده", "en": "Cousin marriage and family structure", "nl": "Cousin marriage and family structure"}}, {"to": "psy:cultural-evolution", "rel": "bridges", "note": {"fa": "تکامل فرهنگی", "en": "Cultural evolution", "nl": "Cultural evolution"}}, {"to": "soc:secularization", "rel": "see-also", "note": {"fa": "دین در جامعهٔ مدرن", "en": "Religion in modern society", "nl": "Religion in modern society"}}], "people": ["core:max-weber", "core:joseph-henrich"], "sources": ["src:44db2d1cb1", "src:6858037a34"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:values", "kind": "field", "title": {"fa": "ارزش‌ها، دین و نسل‌ها", "en": "Values, religion & generations", "nl": "Waarden, religie & generaties"}, "aliases": [], "parent": "soc:soc", "field": null, "summary": {"fa": "ارزش‌ها چگونه با توسعه عوض می‌شوند، دین چه می‌شود و نسل‌ها از کجا متفاوت می‌شوند؟", "en": "How values shift with development, what happens to religion, and where generations diverge.", "nl": "Hoe waarden verschuiven met ontwikkeling, wat er met religie gebeurt en waar generaties uiteenlopen."}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:migration-theories", "kind": "concept", "title": {"fa": "نظریه‌های مهاجرت", "en": "Theories of migration", "nl": "Migratietheorieën"}, "aliases": [], "parent": "soc:space", "field": "soc:space", "summary": {"fa": "چرا مردم مهاجرت می‌کنند و چرا ادامه می‌دهند؟ اقتصاد نئوکلاسیک می‌گوید اختلاف دستمزد؛ «اقتصاد نوین مهاجرت» می‌گوید خانواده برای پراکندن ریسک یک نفر را می‌فرستد؛ نظریهٔ شبکه می‌گوید هر مهاجر هزینهٔ مهاجرت بعدی را کم می‌کند، برای همین مهاجرت خودتداوم‌بخش است.", "en": "Why do people migrate and why does it continue? Neoclassical economics says wage gaps; the \"new economics of migration\" says the household sends one member to spread risk; network theory says each migrant lowers the cost of the next, which is why migration sustains itself.", "nl": "Waarom migreren mensen en waarom gaat het door? De neoklassieke economie zegt loonverschillen; de \"nieuwe migratie-economie\" zegt dat het huishouden één lid stuurt om risico te spreiden; de netwerktheorie zegt dat elke migrant de kosten voor de volgende verlaagt, waardoor migratie zichzelf in stand houdt."}, "points": [{"text": {"fa": "مسی و همکاران (۱۹۹۳): نظریه‌ها رقیب نیستند، لایه‌های مختلف یک پدیده‌اند: آغاز مهاجرت را عوامل ساختاری و اقتصادی توضیح می‌دهند، تداومش را شبکه‌ها و نهادها («علیت انباشتی»).", "en": "Massey et al. (1993): the theories are not rivals but layers of one phenomenon: structural and economic factors explain the start of migration, networks and institutions its continuation (\"cumulative causation\").", "nl": "Massey et al. (1993): the theories are not rivals but layers of one phenomenon: structural and economic factors explain the start of migration, networks and institutions its continuation (\"cumulative causation\")."}, "sources": ["src:7712b264c9"], "flags": []}, {"text": {"fa": "برای ایران، مهاجرت تحصیل‌کردگان («فرار مغزها») و مهاجرت از افغانستان به ایران دو جریان بزرگ‌اند که هر دو با نظریهٔ شبکه بهتر از اختلاف دستمزد توضیح داده می‌شوند؛ آمار دقیق مهاجرت خروجی ایران رسماً منتشر نمی‌شود و برآوردها پراکنده‌اند.", "en": "For Iran, the emigration of the educated (\"brain drain\") and migration from Afghanistan into Iran are the two large flows, both better explained by network theory than by wage gaps; precise statistics on emigration from Iran are not officially published and estimates vary widely.", "nl": "For Iran, the emigration of the educated (\"brain drain\") and migration from Afghanistan into Iran are the two large flows, both better explained by network theory than by wage gaps; precise statistics on emigration from Iran are not officially published and estimates vary widely."}, "sources": ["src:7712b264c9"], "flags": ["editor-note"]}], "links": [{"to": "soc:weak-ties", "rel": "explains", "note": {"fa": "شبکه‌ها در مهاجرت", "en": "Networks in migration", "nl": "Networks in migration"}}, {"to": "tabar:ancient-dna", "rel": "bridges", "note": {"fa": "مهاجرت در مقیاس هزاره‌ها", "en": "Migration on the scale of millennia", "nl": "Migration on the scale of millennia"}}, {"to": "soc:urbanism", "rel": "see-also", "note": {"fa": "شهر مقصد", "en": "The destination city", "nl": "The destination city"}}], "people": [], "sources": ["src:7712b264c9"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:althusser-structural-marxism", "kind": "concept", "title": {"fa": "آلتوسر و مارکسیسم ساختاری", "en": "Althusser and structural Marxism", "nl": "Althusser en het structurele marxisme"}, "aliases": [], "parent": "soc:theory", "field": "soc:theory", "summary": {"fa": "لویی آلتوسر فیلسوف فرانسوی بود که کوشید مارکس را «درست بخواند» و جامعه را شبکه‌ای از ساختارهای پنهان بداند که رفتار آدم‌ها را شکل می‌دهند. او با تقلیل همه‌چیز به اقتصاد مخالف بود و مفاهیمی مانند «پروبلماتیک»، «خوانش نشانه‌ای» و «سازوبرگ‌های ایدئولوژیک دولت» را پیش کشید. نظریه‌اش به انسان کمتر نقش فعال می‌دهد و به همین دلیل مورد مناقشه است.", "en": "Louis Althusser was a French philosopher who tried to 'read Marx correctly' and treated society as a network of hidden structures that shape people's behaviour. He opposed reducing everything to the economy and introduced concepts such as the 'problematic', 'symptomatic reading' and 'ideological state apparatuses'. His theory gives human agents little active role, which is why it is disputed.", "nl": "Louis Althusser was een Franse filosoof die Marx 'correct wilde lezen' en de samenleving zag als een netwerk van verborgen structuren die het gedrag van mensen vormen. Hij verzette zich tegen het terugbrengen van alles tot de economie en introduceerde begrippen als 'problematiek' en 'ideologische staatsapparaten'."}, "points": [{"text": {"fa": "به روایت سخنران، آلتوسر با اقتصادگرایی و تک‌عاملی دیدن جامعه مخالف بود و کار جامعه‌شناس را کشف و افشای ساختارهای پنهانی می‌دانست که نهادهایی مثل آموزش، رسانه و ورزش را به هم پیوند می‌دهند. این نهادها با هم مرتبط‌اند اما هر کدام استقلال نسبی دارند، و رفتار شهروندان بیش از آنکه از آنچه آشکار است برآید، از این ساختارها جهت می‌گیرد.", "en": "Per the lecturer, Althusser opposed economism and single-factor explanations, and saw the sociologist's task as uncovering the hidden structures that link institutions such as education, media and sport. These institutions are connected but each has relative autonomy, and citizens' behaviour is directed by such structures more than by what is visible on the surface.", "nl": "Per the lecturer, Althusser opposed economism and single-factor explanations, and saw the sociologist's task as uncovering the hidden structures that link institutions such as education, media and sport. These institutions are connected but each has relative autonomy, and citizens' behaviour is directed by such structures more than by what is visible on the surface."}, "sources": ["src:7c5fc6c369", "src:af7cb6cbec"], "flags": []}, {"text": {"fa": "«پروبلماتیک» به گفتهٔ آلتوسر نظامی از پرسش‌هاست که پاسخ را جهت می‌دهد. مثال سخنران: پرسش «با توجه به شورشی بودن دانشجویان چگونه با آن‌ها رفتار کنیم؟» پاسخ سرکوب را از پیش در خود دارد، اما همین پرسش با پیش‌فرض «جوان مترقی و خواهان آزادی» پاسخ دیگری می‌دهد. آلتوسر باور داشت مارکس پیش از حدود ۱۸۴۵ درون پروبلماتیک فویرباخ می‌اندیشید و بعد با «گسست معرفتی» پروبلماتیک تازه‌ای ساخت.", "en": "A 'problematic', in Althusser's sense, is a system of questions that steers the answers. The lecturer's example: the question 'given that students are rebellious, how should we treat them?' already contains a repressive answer, while a question presupposing 'progressive youth who want freedom' yields a different one. Althusser held that before about 1845 Marx thought inside Feuerbach's problematic and then, through an 'epistemological break', built a new one.", "nl": "A 'problematic', in Althusser's sense, is a system of questions that steers the answers. The lecturer's example: the question 'given that students are rebellious, how should we treat them?' already contains a repressive answer, while a question presupposing 'progressive youth who want freedom' yields a different one. Althusser held that before about 1845 Marx thought inside Feuerbach's problematic and then, through an 'epistemological break', built a new one."}, "sources": ["src:7c5fc6c369", "src:af7cb6cbec"], "flags": []}, {"text": {"fa": "«خوانش نشانه‌ای» روشی است برای خواندن مارکس (و دیگران) که به خلأها، سکوت‌ها و پرسش‌هایی توجه می‌کند که متن نتوانسته بپرسد. سخنران مثال کلاسیک را می‌آورد: مارکس می‌پرسد چرا اقتصاددانان کلاسیک مانند اسمیت تمایز میان کار و نیروی کار را نیافتند، و آلتوسر پاسخ می‌دهد که چارچوب مفهومی زمانه اجازهٔ طرح آن را نمی‌داد.", "en": "'Symptomatic reading' is a way of reading Marx (and others) that attends to gaps, silences and the questions a text could not pose. The lecturer gives the classic example: Marx asks why classical economists such as Smith did not distinguish labour from labour-power, and Althusser answers that the conceptual framework of the age did not allow the question.", "nl": "'Symptomatic reading' is a way of reading Marx (and others) that attends to gaps, silences and the questions a text could not pose. The lecturer gives the classic example: Marx asks why classical economists such as Smith did not distinguish labour from labour-power, and Althusser answers that the conceptual framework of the age did not allow the question."}, "sources": ["src:7c5fc6c369", "src:cab2b481d2"], "flags": []}, {"text": {"fa": "در مقالهٔ «ایدئولوژی و سازوبرگ‌های ایدئولوژیک دولت» (۱۹۷۰) آلتوسر می‌پرسد نظام سرمایه‌داری چگونه خود را بازتولید می‌کند. پاسخ او: افزون بر سازوبرگ سرکوب (ارتش، پلیس)، نهادهایی مثل مدرسه، دین، خانواده و رسانه با تولید ایدئولوژی نظم را بازتولید می‌کنند. او مخالف خوانش انسان‌گرایانهٔ مارکس بود، مثلاً خوانشی که اریک فروم عرضه کرد.", "en": "In the essay 'Ideology and Ideological State Apparatuses' (1970) Althusser asks how the capitalist order reproduces itself. His answer: besides the repressive apparatus (army, police), institutions such as school, religion, family and media reproduce the order by producing ideology. He rejected humanist readings of Marx, such as the one Erich Fromm offered.", "nl": "In the essay 'Ideology and Ideological State Apparatuses' (1970) Althusser asks how the capitalist order reproduces itself. His answer: besides the repressive apparatus (army, police), institutions such as school, religion, family and media reproduce the order by producing ideology. He rejected humanist readings of Marx, such as the one Erich Fromm offered."}, "sources": ["src:f31f7e394b", "src:ed603da1b4", "src:7c5fc6c369"], "flags": []}, {"text": {"fa": "نکتهٔ تکمیلی: سخنران می‌گوید مارکس دولت را نهادی مستقل می‌دانست و آلتوسر آن را «دستگاه» کرد. این درست نیست: مارکس و لنین دولت را ابزار طبقهٔ حاکم می‌دیدند و آلتوسر نظریهٔ مارکسیستی دولت را با افزودن سازوبرگ‌های ایدئولوژیک گسترش داد. «خوانش نشانه‌ای» هم بیشتر در «خواندن سرمایه» (۱۹۶۵) آمده تا «برای مارکس»، و اعدادی مثل «کتاب ۷۰ صفحه‌ای» تقریبی‌اند. منتقدان (مثلاً ای. پی. تامپسون) نظریهٔ او را به‌خاطر حذف کنش انسانی و جبرگرایی نقد کرده‌اند.", "en": "Added caveat: the lecturer says Marx saw the state as an independent institution and that Althusser recast it as an 'apparatus'. This is not accurate: Marx and Lenin saw the state as an instrument of the ruling class, and Althusser extended the Marxist theory of the state by adding ideological apparatuses. 'Symptomatic reading' is also developed mainly in Reading Capital (1965) rather than For Marx. Critics (for example E. P. Thompson) have attacked his theory for removing human agency and for determinism.", "nl": "Added caveat: the lecturer says Marx saw the state as an independent institution and that Althusser recast it as an 'apparatus'. This is not accurate: Marx and Lenin saw the state as an instrument of the ruling class, and Althusser extended the Marxist theory of the state by adding ideological apparatuses. 'Symptomatic reading' is also developed mainly in Reading Capital (1965) rather than For Marx. Critics (for example E. P. Thompson) have attacked his theory for removing human agency and for determinism."}, "sources": ["src:cab2b481d2", "src:f31f7e394b"], "flags": ["contested", "editor-note"]}], "links": [{"to": "soc:saussure-structuralism-origins", "rel": "part-of", "note": {"fa": "ریشهٔ روشی در ساختارگرایی زبانی", "en": "Methodological root in linguistic structuralism", "nl": "Methodological root in linguistic structuralism"}}, {"to": "soc:frankfurt-critical-theory", "rel": "contrasts", "note": {"fa": "پاسخ دیگر به همان بحران مارکسیسم", "en": "A different response to the same crisis of Marxism", "nl": "A different response to the same crisis of Marxism"}}, {"to": "soc:social-construction", "rel": "contrasts", "note": {"fa": "در برابر تأکید بر کنش و ساخت‌دهی به واقعیت", "en": "Contrast with emphasis on agency and the making of reality", "nl": "Contrast with emphasis on agency and the making of reality"}}, {"to": "phil:paradigms", "rel": "see-also", "note": {"fa": "«گسست معرفتی» و انقلاب‌های علمی", "en": "'Epistemological break' and scientific revolutions", "nl": "'Epistemological break' and scientific revolutions"}}], "people": ["core:louis-althusser", "core:erich-fromm"], "sources": ["src:7c5fc6c369", "src:af7cb6cbec", "src:cab2b481d2", "src:ed603da1b4", "src:f31f7e394b"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:marx-bakunin-human-nature", "kind": "concept", "title": {"fa": "سرشت انسان و دولت: اختلاف مارکس و باکونین", "en": "Human nature and the state: the Marx-Bakunin dispute", "nl": "Menselijke natuur en de staat: het geschil tussen Marx en Bakoenin"}, "aliases": [], "parent": "soc:theory", "field": "soc:theory", "summary": {"fa": "مارکس معتقد بود سرشت انسان ثابت نیست و با تغییر شیوهٔ تولید تغییر می‌کند؛ پس حکومت کارگری می‌تواند به جامعه‌ای بی‌تعارض برسد. باکونین، آنارشیست روس، می‌گفت هر حکومتی حاکمانی جدا از طبقهٔ خود می‌سازد و باید اصلاً دولت را برداشت. سخنران با استناد به پیتر سینگر باکونین را نزدیک‌تر به واقعیت می‌داند، اما این یک موضع است نه اجماع.", "en": "Marx held that human nature is not fixed but changes with the mode of production, so a workers' government could reach a conflict-free society. Bakunin, the Russian anarchist, argued that any government creates rulers separate from their class and that the state itself should go. The lecturer, following Peter Singer, finds Bakunin closer to the truth, but that is a position, not a consensus.", "nl": "Marx dacht dat de menselijke natuur verandert met de productiewijze; de anarchist Bakoenin vreesde dat elke staat nieuwe heersers voortbrengt. De docent volgt Singer in zijn voorkeur voor Bakoenin; dat is geen consensus."}, "points": [{"text": {"fa": "به گفتهٔ سخنران، بر اساس نقد پیتر سینگر، مارکس باور داشت با برداشتن ساختار اقتصادی رقابتی، تضاد منافع فرد و جامعه از میان می‌رود. سینگر استدلال می‌کند که با تغییر اقتصاد، شکاف میان عقل و خواهش‌ها و رقابت بر سر قدرت و مقام باقی می‌ماند و جامعه‌های استالینی این را نشان داد.", "en": "Per the lecturer, following Peter Singer's critique, Marx believed that removing the competitive economic structure would end the conflict between individual and social interests. Singer argues that changing the economy does not remove the gap between reason and desire or competition for power and rank, as Stalinist societies showed.", "nl": "Per the lecturer, following Peter Singer's critique, Marx believed that removing the competitive economic structure would end the conflict between individual and social interests. Singer argues that changing the economy does not remove the gap between reason and desire or competition for power and rank, as Stalinist societies showed."}, "sources": ["src:f6708143e0", "src:e9f95a45bb"], "flags": ["editor-note"]}, {"text": {"fa": "مارکس و باکونین هر دو سرشت انسان را محور بحث می‌دیدند: مارکس می‌گفت سرشت قابل تغییر است و حکومت کارگران به سود همه کار می‌کند؛ باکونین می‌گفت کارگرانی که حکومت را به دست بگیرند حاکم می‌شوند و از منافع حاکمان پیروی می‌کنند، پس باید اصلاً به دولت نرسید.", "en": "Marx and Bakunin both saw human nature as the heart of the dispute: Marx said it is changeable and a workers' government would serve everyone; Bakunin said workers who take power become rulers and follow rulers' interests, so one should not aim at the state at all.", "nl": "Marx and Bakunin both saw human nature as the heart of the dispute: Marx said it is changeable and a workers' government would serve everyone; Bakunin said workers who take power become rulers and follow rulers' interests, so one should not aim at the state at all."}, "sources": ["src:f6708143e0", "src:c9523fae69"], "flags": []}, {"text": {"fa": "سخنران همچنین می‌گوید لیبرال‌ها برای انسان سرشت «داروینی» (رقابتی و ثابت) فرض می‌کنند. این تعمیم ساده‌سازی است: لیبرالیسم کلاسیک و نظریه‌ٔ داروین یکی نیستند، و «داروینیسم اجتماعی» نسبت دادنی به داروین نیست.", "en": "The lecturer also says liberals assume a 'Darwinian' (competitive, fixed) human nature. This is a simplification: classical liberalism and Darwin's theory are not the same thing, and 'social Darwinism' is not Darwin's own doctrine.", "nl": "The lecturer also says liberals assume a 'Darwinian' (competitive, fixed) human nature. This is a simplification: classical liberalism and Darwin's theory are not the same thing, and 'social Darwinism' is not Darwin's own doctrine."}, "sources": [], "flags": ["contested", "editor-note"]}, {"text": {"fa": "سخنران نقل می‌کند که مارکس خواست «سرمایه» را به داروین تقدیم کند و داروین نپذیرفت. توضیح علمی: این روایت امروز اشتباه شناخته می‌شود؛ مارکس نسخه‌ای از «سرمایه» را برای داروین فرستاد و داروین سپاسگزاری کرد، اما نامهٔ درخواست تقدیم متعلق به ادوارد اولینگ برای کتاب خودش بود، نه مارکس (پژوهش مارگارت فی، ۱۹۷۸).", "en": "The lecturer repeats the story that Marx asked to dedicate Capital to Darwin and Darwin declined. Caveat: this account is now considered mistaken; Marx sent Darwin a copy of Capital and Darwin thanked him, but the dedication request came from Edward Aveling for his own book, not from Marx (Margaret Fay's 1978 study).", "nl": "The lecturer repeats the story that Marx asked to dedicate Capital to Darwin and Darwin declined. Caveat: this account is now considered mistaken; Marx sent Darwin a copy of Capital and Darwin thanked him, but the dedication request came from Edward Aveling for his own book, not from Marx (Margaret Fay's 1978 study)."}, "sources": ["src:08a2467c32"], "flags": ["contested", "editor-note"]}], "links": [{"to": "soc:teleology-paradise-hegel-marx", "rel": "see-also", "note": {"fa": "غایت تاریخ نزد هگل و مارکس", "en": "History's end-goal in Hegel and Marx", "nl": "History's end-goal in Hegel and Marx"}}, {"to": "soc:marx-break-from-hegel", "rel": "see-also", "note": {"fa": "گسست مارکس از هگل", "en": "Marx's break from Hegel", "nl": "Marx's break from Hegel"}}, {"to": "phil:two-liberties", "rel": "see-also", "note": {"fa": "آزادی و دولت", "en": "Liberty and the state", "nl": "Liberty and the state"}}], "people": ["core:mikhail-bakunin", "core:peter-singer", "core:charles-darwin"], "sources": ["src:08a2467c32", "src:c9523fae69", "src:e9f95a45bb", "src:f6708143e0"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:goffman-regions-intimacy", "kind": "concept", "title": {"fa": "گافمن: جلوی صحنه، پشت صحنه و صمیمیت", "en": "Goffman: front stage, back stage and intimacy", "nl": "Goffman: voorpodium, achterpodium en intimiteit"}, "aliases": [], "parent": "soc:theory", "field": "soc:theory", "summary": {"fa": "اروین گافمن زندگی اجتماعی را با زبان تئاتر شرح می‌دهد: در جلوی صحنه نقش اجتماعی بازی می‌کنیم و در پشت صحنه آماده می‌شویم. سخنران این چارچوب را ادامه می‌دهد: لو رفتن پشت صحنه آبرو را به خطر می‌اندازد، صمیمیت یعنی راه دادن کسی به پشت صحنه، و قضاوت اجتماعی را نمی‌توان کنار گذاشت. بخشی از برداشت‌های او از خودِ گافمن فاصله دارد.", "en": "Erving Goffman describes social life in theatre terms: we play social roles front stage and prepare back stage. The lecturer extends this framework: a leaked backstage endangers reputation, intimacy means letting someone backstage, and social judgment cannot be abolished. Some of his readings go beyond Goffman himself.", "nl": "Erving Goffman beschrijft sociaal leven in theatertermen: voorop spelen we rollen, achter de schermen bereiden we ons voor. De docent breidt dit uit naar intimiteit en sociaal oordeel; sommige lezingen gaan verder dan Goffman zelf."}, "points": [{"text": {"fa": "گافمن می‌گوید ما در زندگی روزمره نقش‌هایی مثل مادر، استاد، دانشجو یا همسر را برای مخاطب اجرا می‌کنیم. جایی که نقش را به مخاطب نشان می‌دهیم «جلوی صحنه» و جایی که برای آن آماده می‌شویم و تمرین می‌کنیم «پشت صحنه» است. به گفتهٔ سخنران، کسی که پشت صحنهٔ قوی‌تری دارد جلوی صحنهٔ بهتری هم دارد.", "en": "Goffman says that in daily life we perform roles such as mother, teacher, student or spouse for an audience. The place where we show the role is the front region, and the place where we prepare and rehearse is the back region. Per the lecturer, someone with a stronger backstage also has a better front stage.", "nl": "Goffman says that in daily life we perform roles such as mother, teacher, student or spouse for an audience. The place where we show the role is the front region, and the place where we prepare and rehearse is the back region. Per the lecturer, someone with a stronger backstage also has a better front stage."}, "sources": ["src:26a4a26b1b", "src:087a0d1883"], "flags": []}, {"text": {"fa": "پشت صحنه نباید دیده شود، چون اگر مخاطب آن را ببیند اعتبار نقش آسیب می‌بیند. سخنران مثال می‌زند از میهمانی که زودتر از موعد می‌رسد و ما هنوز آماده نیستیم، یا شوخی خصوصی ورزشکاری که ناگهان روی دوربین پخش می‌شود. چنین لو رفتنی می‌تواند اعتبار فرد و حتی تیم را بشکند.", "en": "The back region should not be seen, because if the audience sees it the credibility of the role suffers. The lecturer gives examples such as a guest arriving before we are ready, or an athlete's private joke suddenly broadcast on camera. Such a leak can damage the reputation of the person and even the team.", "nl": "The back region should not be seen, because if the audience sees it the credibility of the role suffers. The lecturer gives examples such as a guest arriving before we are ready, or an athlete's private joke suddenly broadcast on camera. Such a leak can damage the reputation of the person and even the team."}, "sources": ["src:26a4a26b1b", "src:087a0d1883"], "flags": []}, {"text": {"fa": "به گفتهٔ سخنران، صمیمیت یعنی راه دادن کسی به پشت صحنهٔ خود و به همین دلیل زمان می‌برد: اول جلوی صحنه را نشان می‌دهیم و وقتی مطمئن شدیم، پشت صحنه را باز می‌کنیم. او نمایش دادنِ خود را به‌خودیِ خود بد نمی‌داند. او همین منطق را در خانواده هم می‌بیند، مثلاً والدی که سختی مالی یا ناتوانی‌اش را از فرزند پنهان می‌کند تا نقش پدری یا مادری آسیب نبیند.", "en": "Per the lecturer, intimacy means admitting someone to your back region, which is why it takes time: first we show the front, and once reassured we open the back. He does not regard self-presentation as bad in itself. He sees the same logic in families, for example a parent hiding money trouble or helplessness from a child so the parental role is not damaged.", "nl": "Per the lecturer, intimacy means admitting someone to your back region, which is why it takes time: first we show the front, and once reassured we open the back. He does not regard self-presentation as bad in itself. He sees the same logic in families, for example a parent hiding money trouble or helplessness from a child so the parental role is not damaged."}, "sources": ["src:26a4a26b1b"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، ناحیهٔ سوم «خارج از صحنه» جایی است که آدم تنهاست و به هیچ نمایشی فکر نمی‌کند. توضیح: در کتاب گافمن ناحیهٔ سوم «بیرون» است، یعنی جایی که کسانی هستند که مخاطب آن اجرا نیستند، و نه تنهاییِ فرد؛ پس این بخش تفسیر سخنران است. همچنین گافمن خودش یادآوری کرد که تشبیه تئاتر یک ابزار بیان است و نه ادعا که زندگی فقط نمایش است.", "en": "Per the lecturer, a third zone, off stage, is where a person is alone and thinks of no performance at all. Caveat: in Goffman's book the third region is the outside, meaning places for people who are not the audience of that performance, not an individual's solitude, so this is the lecturer's interpretation. Goffman himself also stressed that the theatre comparison is a device of presentation and not a claim that life is only a show.", "nl": "Per the lecturer, a third zone, off stage, is where a person is alone and thinks of no performance at all. Caveat: in Goffman's book the third region is the outside, meaning places for people who are not the audience of that performance, not an individual's solitude, so this is the lecturer's interpretation. Goffman himself also stressed that the theatre comparison is a device of presentation and not a claim that life is only a show."}, "sources": ["src:087a0d1883"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، قضاوت اجتماعی را نمی‌توان از میان برد: ما با سنجیدن دیگران فاصلهٔ خود را با الگوها می‌سنجیم و تصمیم‌های زندگی‌مان بر قضاوت استوار است. بنابراین هنجارها وقتی تغییر می‌کنند که رابطهٔ میان نشانه و معنای آن (مثلاً یک پوشش و ارزیابی اخلاقی آن) از نظر اکثریت زیر سؤال برود. این نظر او دربارهٔ تغییر فرهنگ است و مورد اجماع نیست.", "en": "Per the lecturer, social judgment cannot be abolished: by judging others we gauge our distance from models, and our life decisions rest on judgment. Norms therefore change when the link between a sign and its meaning (for example a style of dress and its moral evaluation) is questioned by most people. This is his view of cultural change and not a consensus position.", "nl": "Per the lecturer, social judgment cannot be abolished: by judging others we gauge our distance from models, and our life decisions rest on judgment. Norms therefore change when the link between a sign and its meaning (for example a style of dress and its moral evaluation) is questioned by most people. This is his view of cultural change and not a consensus position."}, "sources": ["src:26a4a26b1b"], "flags": ["editor-note"]}], "links": [{"to": "soc:presentation-of-self", "rel": "part-of", "note": {"fa": "جلوی صحنه و پشت صحنه از مفهوم‌های نظریهٔ نمایش خود هستند.", "en": "Front and back region belong to the theory of the presentation of self.", "nl": "Front and back region belong to the theory of the presentation of self."}}, {"to": "psy:stigma", "rel": "see-also", "note": {"fa": "گافمن دربارهٔ انگ و مدیریت تصویر هم نوشته است.", "en": "Goffman also wrote on stigma and impression management.", "nl": "Goffman also wrote on stigma and impression management."}}, {"to": "psy:solitude", "rel": "contrasts", "note": {"fa": "تنهایی و خلوت بخشی از روان‌شناسی است و با «ناحیهٔ بیرون» گافمن یکی نیست.", "en": "Solitude is a topic in psychology and is not the same as Goffman's outside region.", "nl": "Solitude is a topic in psychology and is not the same as Goffman's outside region."}}, {"to": "soc:schutz-finite-provinces", "rel": "see-also", "note": {"fa": "تئاتر نمونهٔ مشترک شوتس و گافمن است.", "en": "Theatre is a shared example for Schutz and Goffman.", "nl": "Theatre is a shared example for Schutz and Goffman."}}], "people": ["core:erving-goffman"], "sources": ["src:087a0d1883", "src:26a4a26b1b"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:marx-young-hegelian-roots", "kind": "concept", "title": {"fa": "مارکس جوان و وام او به هگل", "en": "The young Marx and his debt to Hegel", "nl": "De jonge Marx en zijn schuld aan Hegel"}, "aliases": [], "parent": "soc:theory", "field": "soc:theory", "summary": {"fa": "مارکس سیاست را از تجربهٔ فرانسه، فلسفه را از آلمان (هگل و فویرباخ) و اقتصاد را از انگلستان می‌گیرد و آن‌ها را به هم می‌پیوندد. در دانشگاه برلین که او در آن درس خواند، هگل بر فضای فکری حاکم بود. از هگل سه ایده به مارکس رسید: واقعیت یک فرایند تاریخی است، این فرایند دیالکتیکی است، و بیگانگی نقش مرکزی دارد. مارکس هر سه را از دنیای ایده‌ها به دنیای تولید و طبقه منتقل کرد.", "en": "Marx draws politics from French experience, philosophy from Germany (Hegel, Feuerbach) and economics from Britain, and fuses them. At the University of Berlin, where he studied, Hegel dominated the intellectual climate. Three Hegelian ideas reached Marx: reality is a historical process, that process is dialectical, and alienation is central. Marx moved all three from the realm of ideas to production and class.", "nl": "Marx haalt zijn politiek uit Frankrijk, zijn filosofie uit Duitsland (Hegel, Feuerbach) en zijn economie uit Engeland. Van Hegel erft hij drie ideeën: geschiedenis als proces, dialectiek en vervreemding, die hij van ideeën naar productie en klasse verplaatst."}, "points": [{"text": {"fa": "سخنران بین «مارکس جوان» (پیش از حدود ۱۸۴۸، هنوز بی‌سرمایه و بی‌سوسیالیسم صریح) و مارکس پخته (نویسندهٔ سرمایه) فرق می‌گذارد و می‌گوید مارکسیسمی که امروز می‌شناسیم محصول دورهٔ دوم است. مارکس برای هگل‌گرایان جوان هم‌فکر بود، اما بعدتر از هگل، فویرباخ و هگلی‌های جوان فاصله گرفت.", "en": "The lecturer separates the young Marx (before roughly 1848, before Capital and an explicit socialism) from the mature Marx and says today's Marxism is the product of the second period. Marx began close to the Young Hegelians but later broke with Hegel, Feuerbach and the Young Hegelians.", "nl": "The lecturer separates the young Marx (before roughly 1848, before Capital and an explicit socialism) from the mature Marx and says today's Marxism is the product of the second period. Marx began close to the Young Hegelians but later broke with Hegel, Feuerbach and the Young Hegelians."}, "sources": ["src:0ce7ee12f9"], "flags": []}, {"text": {"fa": "سه ایدهٔ اصلی که به روایت سخنران از هگل به مارکس می‌رسد: (۱) واقعیت فرایندی تاریخی است و تغییر می‌کند؛ (۲) این فرایند دیالکتیکی است؛ (۳) بیگانگی. هگل بیگانگی را به آگاهی و دین گره می‌زد، اما مارکس آن را در برابر نظام مالکیت و شیوهٔ تولید سرمایه‌داری تعریف می‌کند و به‌جای «وجدان فردی» از «آگاهی طبقاتی» حرف می‌زند.", "en": "The three main ideas passing from Hegel to Marx, as the lecturer tells it: (1) reality is a historical, changing process; (2) that process is dialectical; (3) alienation. Hegel tied alienation to consciousness and religion, while Marx redefines it against property relations and the capitalist mode of production, and speaks of class consciousness instead of individual conscience.", "nl": "The three main ideas passing from Hegel to Marx, as the lecturer tells it: (1) reality is a historical, changing process; (2) that process is dialectical; (3) alienation. Hegel tied alienation to consciousness and religion, while Marx redefines it against property relations and the capitalist mode of production, and speaks of class consciousness instead of individual conscience."}, "sources": ["src:0ce7ee12f9", "src:212637666a", "src:04afb1ed45"], "flags": []}, {"text": {"fa": "ایدهٔ مرکزی که از هگل به مارکس رسید این است که آگاهی اجتماعی به شرایط ساختاری وابسته است: انسان «ذات ثابت» ندارد، نه ذاتاً خوب (روسو) و نه گرگ (هابز)، و با تغییر جامعه (برای مارکس: شیوهٔ تولید) آگاهی هم تغییر می‌کند. مارکس این را بعدها چنین خلاصه کرد که هستی اجتماعی آگاهی را تعیین می‌کند.", "en": "The core idea passed from Hegel to Marx is that social consciousness depends on structural conditions: people have no fixed essence, neither naturally good (Rousseau) nor wolves (Hobbes), and as society changes (for Marx, the mode of production) consciousness changes. Marx later summed this up by saying social being determines consciousness.", "nl": "The core idea passed from Hegel to Marx is that social consciousness depends on structural conditions: people have no fixed essence, neither naturally good (Rousseau) nor wolves (Hobbes), and as society changes (for Marx, the mode of production) consciousness changes. Marx later summed this up by saying social being determines consciousness."}, "sources": ["src:0ce7ee12f9", "src:79ffa6a4a3"], "flags": []}, {"text": {"fa": "به گفتهٔ سخنران، چنین دیدگاهی کاهش‌گرایانه است: بسیاری از پیروان مارکس، از مکتب فرانکفورت تا باومن و گیدنز، هر پدیده را (حتی عشق و خیانت) به سرمایه‌داری برمی‌گردانند و ذات زیستی انسان را فراموش می‌کنند. او دربارهٔ «چپ داروینی» پیتر سینگر هم می‌گوید این پروژه با مبانی مارکسی ناسازگار است. نظر او همچنین بر این تکیه دارد که اگر ساختارها همه‌چیز را تعیین کنند، انتخاب فردی بی‌معنا می‌شود.", "en": "Per the lecturer, this stance is reductionist: many followers of Marx, from the Frankfurt School to Bauman and Giddens, trace every phenomenon (even love and infidelity) back to capitalism and forget humans' biological nature. He adds that Peter Singer's 'Darwinian Left' project clashes with Marxian foundations, and that if structures determine everything, individual choice loses its meaning.", "nl": "Per the lecturer, this stance is reductionist: many followers of Marx, from the Frankfurt School to Bauman and Giddens, trace every phenomenon (even love and infidelity) back to capitalism and forget humans' biological nature. He adds that Peter Singer's 'Darwinian Left' project clashes with Marxian foundations, and that if structures determine everything, individual choice loses its meaning."}, "sources": ["src:0ce7ee12f9", "src:6696432109"], "flags": ["editor-note", "contested"]}, {"text": {"fa": "توضیح تکمیلی: «مارکس نظریهٔ ذات انسان ندارد» جمع‌بندی ساده‌شده است. مارکس در دست‌نوشته‌های ۱۸۴۴ از «وجود نوعی» انسان (کار آفریننده و اجتماعی بودن) حرف می‌زند و در «سرمایه» از «سرشت انسانی به‌طور کلی» و تغییرپذیری‌اش در تاریخ؛ برخی شارحان (مثلاً نورمن گراس) استدلال می‌کنند او به یک سرشت انسانی باور داشت. همچنین فوکو و بودریار را نمی‌توان فقط «تحلیل‌گر سرمایه‌داری» نامید؛ فوکو دربارهٔ قدرت و دانش نظریه‌ای مستقل ساخت و با مارکسیسم رابطهٔ انتقادی داشت. ادعای تأثیر مارکس بر کارکردگرایی ساختاری هم سست است، چون آن مکتب بیشتر وامدار دورکیم و وبر است؛ نظریهٔ کشمکش ریشهٔ مارکسی‌تری دارد.", "en": "Caveat: 'Marx has no theory of human nature' is a simplification. In the 1844 Manuscripts he speaks of humans' species-being (creative labour, sociality) and in Capital of 'human nature in general' as historically modified; scholars such as Norman Geras argue Marx held a concept of human nature. Foucault and Baudrillard also cannot simply be called analysts of capitalism; Foucault built an independent theory of power-knowledge and was critical of Marxism. The claimed Marxian influence on structural functionalism is weak, since that school owes more to Durkheim and Weber; conflict theory is the more Marxian line.", "nl": "Caveat: 'Marx has no theory of human nature' is a simplification. In the 1844 Manuscripts he speaks of humans' species-being (creative labour, sociality) and in Capital of 'human nature in general' as historically modified; scholars su
