raft"}, {"id": "soc:marx-capitalism-dynamics", "kind": "concept", "title": {"fa": "پویایی سرمایه‌داری، ارزش اضافی و بحران نزد مارکس", "en": "Marx on the dynamics of capitalism, surplus value and crisis", "nl": "Marx over de dynamiek van het kapitalisme, meerwaarde en crisis"}, "aliases": [], "parent": "soc:inequality", "field": "soc:inequality", "summary": {"fa": "مارکس در «مانیفست» و «سرمایه» می‌گوید سرمایه‌داری ناگزیر ابزار تولید را مدام نو می‌کند، بازار را جهانی می‌کند و در عین حال شکاف طبقاتی و بحران می‌سازد. ریمون آرون استدلال می‌کند که مارکس نظریهٔ کامل بحران و فقر فزایندهٔ کارگران را ثابت نکرد. تاریخ بعدی نشان داد دستمزدها و رفاه کارگران در کشورهای ثروتمند بالا رفته‌اند.", "en": "In the Manifesto and Capital, Marx says capitalism must keep revolutionising its tools of production, makes markets global, and at the same time produces class gaps and crises. Raymond Aron argues Marx never proved a complete theory of crisis or of the growing poverty of workers. Later history showed rising wages and welfare for workers in rich countries.", "nl": "Marx stelt dat het kapitalisme voortdurend de productiemiddelen vernieuwt, markten globaliseert en tegelijk klassenverschillen en crises voortbrengt. Aron stelt dat Marx dit niet sluitend bewees."}, "points": [{"text": {"fa": "در «مانیفست»، سرمایه‌داری را نیرویی می‌بینند که روابط سنتی و فئودالی را کنار می‌زند و روابط انسان‌ها را به منفعت و پرداخت نقدی تقلیل می‌دهد. وجه تمایزش «انقلاب دائمی» در ابزار تولید است. بازار جهانی هم می‌سازد: کالای ارزان مرزها را می‌شکند و از ادبیات ملی «ادبیات جهانی» بیرون می‌آید. به گفتهٔ سخنران، این پیش‌بینی جهانی‌شدن تقریباً درست از آب درآمد.", "en": "In the Manifesto, capitalism dissolves feudal and traditional ties, reducing relations between people to self-interest and cash payment. Its mark is constant revolution in the tools of production. It also builds a world market: cheap goods break borders and a 'world literature' emerges from national ones.", "nl": "In the Manifesto, capitalism dissolves feudal and traditional ties, reducing relations between people to self-interest and cash payment. Its mark is constant revolution in the tools of production. It also builds a world market: cheap goods break borders and a 'world literature' emerges from national ones."}, "sources": ["src:4d1925ef85", "src:a8f809b841"], "flags": []}, {"text": {"fa": "در تصویر مارکس، رشد فنی سرمایه‌داری مانند ساحره‌ای است که نیروهایی را فراخوانده که دیگر نمی‌تواند مهار کند. «بحران‌های اضافه‌تولید» جامعه را ناگهان نیازمند نشان می‌دهد، در حالی که کالا و صنعت زیاد است. سخنران می‌گوید مارکس در جلد دوم و سوم «سرمایه» می‌خواهد نشان دهد گردش سرمایه هم آن را بازتولید می‌کند و هم زیر پایش را خالی می‌کند.", "en": "Marx pictures capitalism as a sorcerer who has called up powers he can no longer control. Crises of overproduction make society suddenly look poor although goods and industry abound. The lecturer says volumes 2 and 3 of Capital aim to show that the circulation of capital both reproduces the system and undermines it.", "nl": "Marx pictures capitalism as a sorcerer who has called up powers he can no longer control. Crises of overproduction make society suddenly look poor although goods and industry abound. The lecturer says volumes 2 and 3 of Capital aim to show that the circulation of capital both reproduces the system and undermines it."}, "sources": ["src:4d1925ef85", "src:a8f809b841", "src:b5149be9f7"], "flags": []}, {"text": {"fa": "سخنران توضیح می‌دهد که ارزش اضافی را کارفرما از فروش کالا بالاتر از «ارزش واقعی‌اش» می‌برد. این توضیح ساده‌شده است: در «سرمایه» مارکس می‌گوید ارزش اضافی حتی با مبادلهٔ کالا به ارزش آن پدید می‌آید، چون نیروی کار در یک روز بیش از ارزش دستمزد خود تولید می‌کند. همچنین اندازه‌گیری «کار اجتماعاً لازم» (مثلاً مقایسهٔ کار ماهر و غیرماهر) مشکل نظری شناخته‌شده‌ای است و بوم‌باورک و دیگران آن را نقد کرده‌اند.", "en": "The lecturer explains surplus value as sellers pricing goods above their 'real value'. This is a simplification: in Capital Marx says surplus value arises even when goods exchange at their value, because labour-power produces more in a day than its wage is worth. Measuring 'socially necessary labour' (e.g. skilled versus unskilled work) is a known theoretical problem, criticised by Bohm-Bawerk and others.", "nl": "The lecturer explains surplus value as sellers pricing goods above their 'real value'. This is a simplification: in Capital Marx says surplus value arises even when goods exchange at their value, because labour-power produces more in a day than its wage is worth. Measuring 'socially necessary labour' (e.g. skilled versus unskilled work) is a known theoretical problem, criticised by Bohm-Bawerk and others."}, "sources": ["src:b5149be9f7", "src:9e09a32d20"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "آرون در نقد خود می‌گوید در «سرمایه» نظریهٔ کامل بحران نیست، بیشتر اشاره‌های پراکنده است. او همچنین می‌گوید «فقر فزاینده» ثابت نشده است و تنها با سازوکار «ارتش ذخیرهٔ بیکاران» که دستمزدها را پایین نگه می‌دارد قابل توجیه است. به‌گفتهٔ سخنران، سطح زندگی کارگران عملاً بالا رفت. مارکوزه هم دید که طبقهٔ کارگر در جوامع غربی خود را با کارفرما همسو کرده است.", "en": "In his critique Aron says Capital contains no complete theory of crisis, only scattered hints. He also says 'growing misery' was not proven and could only be supported through the 'reserve army' of unemployed holding wages down. Per the lecturer, workers' living standards actually rose, and Marcuse saw the working class in Western societies aligning with employers.", "nl": "In his critique Aron says Capital contains no complete theory of crisis, only scattered hints. He also says 'growing misery' was not proven and could only be supported through the 'reserve army' of unemployed holding wages down. Per the lecturer, workers' living standards actually rose, and Marcuse saw the working class in Western societies aligning with employers."}, "sources": ["src:4d1925ef85", "src:451d51da9a"], "flags": ["editor-note"]}, {"text": {"fa": "نقد آرون یک ارزیابی است نه اجماع: مارکسیست‌ها در جلد سوم «سرمایه» نظریه‌هایی دربارهٔ بحران پیدا می‌کنند (مانند گرایش نرخ سود به کاهش و کم‌مصرفی) و دربارهٔ این‌که «فقر» مطلق بوده یا نسبی بحث دارند. همچنین مارکس خود از قوانین کارخانه و کاهش ساعت کار حمایت کرد؛ پس رد مطلق اصلاح در کار او ساده‌سازی است.", "en": "Aron's critique is one assessment, not a consensus: Marxists find crisis theories in volume 3 (such as the tendency of the profit rate to fall, and underconsumption) and debate whether the 'misery' was absolute or relative. Marx himself backed factory laws and shorter working days, so 'no reform' is a simplification of his work.", "nl": "Aron's critique is one assessment, not a consensus: Marxists find crisis theories in volume 3 (such as the tendency of the profit rate to fall, and underconsumption) and debate whether the 'misery' was absolute or relative. Marx himself backed factory laws and shorter working days, so 'no reform' is a simplification of his work."}, "sources": [], "flags": ["contested", "editor-note"]}], "links": [{"to": "soc:marx-historical-materialism", "rel": "part-of", "note": {"fa": "چارچوب نظری مارکس.", "en": "Marx's theoretical framework.", "nl": "Marx's theoretical framework."}}, {"to": "soc:gini-inequality", "rel": "see-also", "note": {"fa": "اندازه‌گیری نابرابری امروز.", "en": "Measuring inequality today.", "nl": "Measuring inequality today."}}, {"to": "soc:revolution-or-reform", "rel": "see-also", "note": {"fa": "آیا باید انقلاب کرد یا اصلاح؟", "en": "Revolution or reform?", "nl": "Revolution or reform?"}}], "people": ["core:karl-marx", "core:raymond-aron", "core:herbert-marcuse", "core:eugen-von-b-hm-bawerk"], "sources": ["src:451d51da9a", "src:4d1925ef85", "src:9e09a32d20", "src:a8f809b841", "src:b5149be9f7"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:presentation-of-self", "kind": "concept", "title": {"fa": "نمایش خود در زندگی روزمره", "en": "The presentation of self", "nl": "De presentatie van het zelf"}, "aliases": [], "parent": "soc:theory", "field": "soc:theory", "summary": {"fa": "گافمن زندگی اجتماعی را صحنهٔ تئاتر می‌بیند: «جلوی صحنه» نقش بازی می‌کنیم، «پشت صحنه» استراحت؛ و آبرو (face) چیزی است که همه در حفظش همکاری می‌کنند.", "en": "Goffman sees social life as theatre: \"front stage\" we perform, \"backstage\" we rest; and face is something everyone cooperates to protect.", "nl": "Goffman ziet het sociale leven als theater: \"op het toneel\" spelen we, \"achter de schermen\" rusten we; en gezicht is iets dat iedereen samen beschermt."}, "points": [{"text": {"fa": "گافمن (۱۹۵۹): مدیریت تأثیر امری همگانی و نه ریاکارانه است؛ بدون آن تعامل روزمره ممکن نیست. شبکه‌های اجتماعی «جلوی صحنه»ای دائمی ساخته‌اند و پشت صحنه را کوچک کرده‌اند.", "en": "Goffman (1959): impression management is universal, not hypocrisy; everyday interaction is impossible without it. Social media have built a permanent front stage and shrunk the backstage.", "nl": "Goffman (1959): impression management is universal, not hypocrisy; everyday interaction is impossible without it. Social media have built a permanent front stage and shrunk the backstage."}, "sources": ["src:8474622142"], "flags": []}], "links": [{"to": "psy:narcissism-culture", "rel": "bridges", "note": {"fa": "فرهنگ خودشیفتگی در ویکی روان", "en": "Narcissism culture in the psychology wiki", "nl": "Narcissism culture in the psychology wiki"}}, {"to": "psy:emotional-labor", "rel": "bridges", "note": {"fa": "کار هیجانی", "en": "Emotional labour", "nl": "Emotional labour"}}], "people": ["core:erving-goffman"], "sources": ["src:8474622142"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:shadow-institutions", "kind": "concept", "title": {"fa": "نهادهای سایه: چگونه نهادها آرام تغییر می‌کنند", "en": "Shadow institutions: how institutions change slowly", "nl": "Schaduwinstituties: hoe instituties langzaam veranderen"}, "aliases": [], "parent": "soc:institutions", "field": "soc:institutions", "summary": {"fa": "نهاد مجموعه‌ای از آیین‌ها و رفتارهای جاافتاده است که به نیازی پاسخ می‌دهد. وقتی جامعه و نیازها عوض می‌شود، شکل‌های تازهٔ زندگی اول به چشم انحراف و بدنامی دیده می‌شوند. اگر پیروان کافی پیدا کنند، به‌تدریج به نهاد رسمی راه می‌یابند و آن را تغییر می‌دهند. سخنران برای این روند عبارت «نهاد سایه» را به کار می‌برد و زندگی مشترک بدون ازدواج رسمی را نمونه می‌آورد.", "en": "An institution is a bundle of settled rituals and routines that answers some social need. When society and its needs change, new ways of living are first seen as deviance. If they gain enough followers they gradually seep into the official institution and reshape it. The lecturer calls this process the work of 'shadow institutions', using unmarried cohabitation as his example.", "nl": "Een instituut is een bundel vaste gebruiken die op een maatschappelijke behoefte antwoordt. Nieuwe leefvormen gelden eerst als afwijking en veranderen het officiële instituut pas langzaam, als genoeg mensen ze volgen."}, "points": [{"text": {"fa": "به گفتهٔ سخنران، نهادها ناگهانی تغییر نمی‌کنند. جامعه معمولاً محافظه‌کار است و در برابر تغییر مقاومت می‌کند تا مطمئن شود شکل تازه واقعاً نیازش را برآورده می‌کند.", "en": "Per the lecturer, institutions do not change suddenly. Society is typically conservative and resists change until it is persuaded that the new form really meets its needs.", "nl": "Per the lecturer, institutions do not change suddenly. Society is typically conservative and resists change until it is persuaded that the new form really meets its needs."}, "sources": ["src:e15b78d569"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، هر شکل تازه ابتدا انحراف یا بدنامی به حساب می‌آید. وقتی سازمان‌یافته شود و دنبال‌کننده بیابد، به هنجار تبدیل می‌شود. او شعر نیمایی را مثال می‌زند که اول انحراف از شعر کلاسیک بود.", "en": "Per the lecturer, every new form is first labelled deviance. Once it becomes organised and gains followers it turns into a norm; he gives Nima Yushij's modern Persian poetry as an example.", "nl": "Per the lecturer, every new form is first labelled deviance. Once it becomes organised and gains followers it turns into a norm; he gives Nima Yushij's modern Persian poetry as an example."}, "sources": ["src:e15b78d569"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، در زیر نهاد خانوادهٔ رسمی «سایه‌ای» شکل می‌گیرد، مثل زندگی مشترک بدون ازدواج. این سایه اول در حد زمزمه و شایعه است، بعد جرئت پیدا می‌کند و نهاد اصلی را مجبور می‌کند بخشی از آن را بپذیرد تا بازنده نشود. نسل‌های نخست معمولاً هزینه می‌دهند، مثلاً در اجارهٔ خانه، هتل یا حمایت قانونی و درمانی.", "en": "Per the lecturer, a 'shadow' forms beneath the official family institution, such as unmarried cohabitation. It starts as whispers and gossip, grows bolder, and eventually forces the main institution to absorb parts of it so as not to lose out. The first generations usually pay a price, for example in renting, hotels, or legal and medical recognition.", "nl": "Per the lecturer, a 'shadow' forms beneath the official family institution, such as unmarried cohabitation. It starts as whispers and gossip, grows bolder, and eventually forces the main institution to absorb parts of it so as not to lose out. The first generations usually pay a price, for example in renting, hotels, or legal and medical recognition."}, "sources": ["src:e15b78d569"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، نوگرایی اغلب با کالاها (ماشین، پوشاک) می‌رسد و ایده‌ها بعد می‌آیند؛ کشورهای پیرامونی ایده‌ها را وارد می‌کنند چون در جای دیگری تولید شده‌اند.", "en": "Per the lecturer, modernity often arrives first through goods (cars, clothing) with ideas following; peripheral countries import ideas that were produced elsewhere.", "nl": "Per the lecturer, modernity often arrives first through goods (cars, clothing) with ideas following; peripheral countries import ideas that were produced elsewhere."}, "sources": ["src:e15b78d569"], "flags": ["editor-note"]}, {"text": {"fa": "این تصویر ساده‌شده است. پژوهش‌ها نشان می‌دهند ایده‌ها و نهادها هم می‌توانند پیش از کالاها حرکت کنند و همه‌چیز یک‌طرفه از غرب به شرق نمی‌رود. مفهوم «انحراف» هم در جامعه‌شناسی نسبی است: برچسب‌زنی بخشی از فرایند است و هر انحرافی به هنجار تازه تبدیل نمی‌شود. اصطلاح «نهاد سایه» اصطلاح خود سخنران است و مفهوم استاندارد نیست.", "en": "This picture is simplified. Ideas and institutions can also travel before goods, and the flow is not simply West to East. In sociology 'deviance' is relative and partly a matter of labelling, and not every deviation becomes a norm. 'Shadow institution' is the lecturer's own term, not a standard concept.", "nl": "This picture is simplified. Ideas and institutions can also travel before goods, and the flow is not simply West to East. In sociology 'deviance' is relative and partly a matter of labelling, and not every deviation becomes a norm. 'Shadow institution' is the lecturer's own term, not a standard concept."}, "sources": ["src:42cb52a733"], "flags": ["contested", "editor-note"]}], "links": [{"to": "soc:institutions", "rel": "part-of", "note": {"fa": "نمونه‌ای از تغییر نهادی", "en": "An instance of institutional change", "nl": "An instance of institutional change"}}, {"to": "soc:anomie", "rel": "see-also", "note": {"fa": "بی‌هنجاری هنگام گذار", "en": "Normlessness during transitions", "nl": "Normlessness during transitions"}}, {"to": "soc:generations", "rel": "see-also", "note": {"fa": "نسل‌های پیشرو و دنباله‌رو", "en": "Pioneering and following generations", "nl": "Pioneering and following generations"}}], "people": ["core:howard-s-becker"], "sources": ["src:42cb52a733", "src:e15b78d569"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:formal-vs-substantive-rationality", "kind": "concept", "title": {"fa": "عقلانیت صوری و ذاتی: وبر در مکتب فرانکفورت", "en": "Formal vs substantive rationality: Weber in the Frankfurt School", "nl": "Formele en substantiële rationaliteit: Weber bij de Frankfurter Schule"}, "aliases": [], "parent": "soc:theory", "field": "soc:theory", "summary": {"fa": "مکتب فرانکفورت از ماکس وبر دو چیز گرفت: ایدهٔ «افسون‌زدایی» از جهان و تمایز میان عقلانیت صوری (کارآمدی ابزار) و عقلانیت ذاتی (خردمندی هدف‌ها). نتیجهٔ آن‌ها این بود که جامعهٔ مدرن در روش‌ها بسیار منطقی است ولی در کل می‌تواند غیرخردمندانه باشد.", "en": "The Frankfurt School took two things from Max Weber: the idea of 'disenchantment' and the distinction between formal rationality (efficiency of means) and substantive rationality (the reasonableness of ends). Their conclusion was that modern society is highly rational in its methods yet can be irrational as a whole.", "nl": "De Frankfurter Schule nam van Max Weber de ontgoocheling van de wereld en het onderscheid tussen formele rationaliteit (efficiënte middelen) en substantiële rationaliteit (redelijke doelen) over."}, "points": [{"text": {"fa": "وبر مدرنیته را «افسون‌زدایی» می‌دانست: توضیح‌های اسطوره‌ای و دینی جای خود را به محاسبه و عقل داده‌اند. تصویر «قفس آهنین» او نشان می‌دهد که نظم عقلانی و بوروکراتیک می‌تواند برای آدم‌ها به چارچوبی بسته تبدیل شود.", "en": "Weber saw modernity as 'disenchantment': mythical and religious explanations give way to calculation and reason. His 'iron cage' image suggests that rational, bureaucratic order can become a closed frame for people.", "nl": "Weber saw modernity as 'disenchantment': mythical and religious explanations give way to calculation and reason. His 'iron cage' image suggests that rational, bureaucratic order can become a closed frame for people."}, "sources": ["src:1d8f79952a", "src:17902c8179"], "flags": []}, {"text": {"fa": "عقلانیت صوری یعنی انتخاب کارآمدترین راه برای رسیدن به هر هدف، بدون پرسش از ارزش خود هدف. عقلانیت ذاتی یعنی سنجیدن اهداف با ارزش‌هایی مثل عدالت، صلح و شادی انسان‌ها. هورکهایمر همین تمایز را به شکل «عقل ابزاری» در برابر «عقل عینی» پرورانده است.", "en": "Formal rationality means choosing the most efficient means to any goal without questioning the goal. Substantive rationality judges goals against values like justice, peace and human flourishing. Horkheimer developed this contrast as 'instrumental reason' versus 'objective reason'.", "nl": "Formal rationality means choosing the most efficient means to any goal without questioning the goal. Substantive rationality judges goals against values like justice, peace and human flourishing. Horkheimer developed this contrast as 'instrumental reason' versus 'objective reason'."}, "sources": ["src:1d8f79952a", "src:5214b08537"], "flags": []}, {"text": {"fa": "به گفتهٔ سخنران، نظریه‌پردازان انتقادی آشویتس را نمونهٔ عقلانیت ابزاری در جنگ با خرد می‌دانند: جایی بسیار سازمان‌یافته و منطقی، اما غیرخردمندانه. او همچنین جملهٔ معروف آدورنو را یادآوری می‌کند که شعر گفتن پس از آشویتس بربرانه است (۱۹۴۹).", "en": "Per the lecturer, critical theorists see Auschwitz as an example of instrumental rationality at war with reason: highly organised and logical, yet unreasonable. He also recalls Adorno's well-known remark that writing poetry after Auschwitz is barbaric (1949).", "nl": "Per the lecturer, critical theorists see Auschwitz as an example of instrumental rationality at war with reason: highly organised and logical, yet unreasonable. He also recalls Adorno's well-known remark that writing poetry after Auschwitz is barbaric (1949)."}, "sources": ["src:1d8f79952a"], "flags": ["editor-note"]}, {"text": {"fa": "نکات احتیاطی: (۱) سخنران چهار نوع عقلانیت را «عملی، نظری، صوری و ذاتی» می‌شمارد؛ این تقسیم برداشتی از آثار وبر است (مثلاً در خوانش کالبرگ). تقسیم مشهورتر وبر چهار نوع کنش است: ابزاری، ارزشی، عاطفی و سنتی. (۲) تز اینکه هولوکاست پیامد مستقیم عقلانیت بوروکراتیک مدرن است را باومن (۱۹۸۹) پرورانده، اما مورخان تأکید می‌کنند که ایدئولوژی نژادپرستانه و باورهای هذیانی هم نقشی اساسی داشت و فقط با «عقل ابزاری» توضیح داده نمی‌شود.", "en": "Caveats: (1) The lecturer lists four rationalities as practical, theoretical, formal and substantive; that scheme is one reading of Weber (e.g. Kalberg). Weber's best-known typology is of four types of social action: instrumental, value-rational, affectual and traditional. (2) The thesis that the Holocaust flowed from modern bureaucratic rationality was developed by Bauman (1989), but historians stress that racist ideology and delusional beliefs played a central role and cannot be explained by instrumental reason alone.", "nl": "Caveats: (1) The lecturer lists four rationalities as practical, theoretical, formal and substantive; that scheme is one reading of Weber (e.g. Kalberg). Weber's best-known typology is of four types of social action: instrumental, value-rational, affectual and traditional. (2) The thesis that the Holocaust flowed from modern bureaucratic rationality was developed by Bauman (1989), but historians stress that racist ideology and delusional beliefs played a central role and cannot be explained by instrumental reason alone."}, "sources": ["src:1d8f79952a", "src:17902c8179"], "flags": ["contested", "editor-note"]}], "links": [{"to": "soc:protestant-ethic", "rel": "see-also", "note": {"fa": "ریشهٔ قفس آهنین در کار وبر", "en": "Origin of the iron cage in Weber's work", "nl": "Origin of the iron cage in Weber's work"}}, {"to": "soc:enlightenment-break", "rel": "see-also", "note": {"fa": "زمینهٔ عقلانیت مدرن و افسون‌زدایی", "en": "Background of modern rationality and disenchantment", "nl": "Background of modern rationality and disenchantment"}}, {"to": "soc:frankfurt-critical-theory", "rel": "part-of", "note": {"fa": "مفهومی در نظریهٔ انتقادی", "en": "A concept within critical theory", "nl": "A concept within critical theory"}}], "people": ["core:max-weber", "core:max-horkheimer", "core:theodor-w-adorno", "core:zygmunt-bauman"], "sources": ["src:17902c8179", "src:1d8f79952a", "src:5214b08537"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:collective-effervescence-ritual", "kind": "concept", "title": {"fa": "غلیان جمعی، آیین و جشن‌های انقلابی", "en": "Collective effervescence, ritual and revolutionary festivals", "nl": "Collectieve opwinding, ritueel en revolutionaire feesten"}, "aliases": [], "parent": "soc:collective", "field": "soc:collective", "summary": {"fa": "به نظر دورکایم آیین‌ها و جشن‌های دسته‌جمعی جایی هستند که تجربهٔ «مقدس» ساخته می‌شود: وقتی آدم‌ها گرد هم می‌آیند، شور و هیجانی پدید می‌آید که فرد را فراتر از زندگی روزمره می‌برد و باور به دو جهان را در او زنده می‌کند. دورکایم همین منطق را در سال‌های نخست انقلاب فرانسه می‌بیند. از این دید، آیین بیش از آن‌که برای رسیدن به هدفی بیرونی باشد، برای تازه نگه‌داشتن پیوند گروه است.", "en": "For Durkheim, collective rituals and festivals are where the experience of the 'sacred' is produced: when people gather, a shared excitement lifts the individual beyond everyday life and revives belief in two worlds. He sees the same logic in the first years of the French Revolution. On this view ritual serves less to reach an outside goal than to keep the group's bond fresh.", "nl": "Volgens Durkheim ontstaat de ervaring van het 'heilige' in collectieve rituelen en feesten: de gedeelde opwinding tilt het individu boven het dagelijks leven uit. Hij ziet dezelfde logica in de eerste jaren van de Franse Revolutie."}, "points": [{"text": {"fa": "غلیان جمعی: در اجتماع‌های بزرگ با رقص، آواز و هیجان مشترک، فرد حس می‌کند نیرویی بیرون از خودش او را به شکلی دیگر می‌اندیشاند و عمل می‌کند. دورکایم برای نمونه صحنه‌ای از مراسم شبانهٔ قبایل استرالیایی را از گزارش اسپنسر و گیلن نقل می‌کند. تکرار چنین تجربه‌هایی باور به وجود دو جهان (روزمرهٔ ملال‌آور و جهان پرشور مقدس) را در فرد تثبیت می‌کند.", "en": "Collective effervescence: in large gatherings with dance, song and shared excitement, the individual feels an outside force making him think and act differently. As an example Durkheim quotes a night ceremony of Australian groups from Spencer and Gillen's reports. Repeated experiences like this fix the belief in two worlds: the dull everyday one and the intense sacred one.", "nl": "Collective effervescence: in large gatherings with dance, song and shared excitement, the individual feels an outside force making him think and act differently. As an example Durkheim quotes a night ceremony of Australian groups from Spencer and Gillen's reports. Repeated experiences like this fix the belief in two worlds: the dull everyday one and the intense sacred one."}, "sources": ["src:e16c79b314", "src:3c8a365a14"], "flags": []}, {"text": {"fa": "سه دستهٔ آیین: آیین‌های منفی (ممنوعیت‌ها و پرهیزها مثل روزه و دست‌نزدن)، آیین‌های مثبت (کارهایی مثل دعا و مراسمی که به باروری و خیر جمع کمک می‌کند) و آیین‌های نیایشی/سوگوارانه (دربارهٔ اندوه و جبران). سخنران آیین‌های نیایشی را نذر و دعا برای حل مشکل توضیح می‌دهد؛ تقسیم‌بندی دقیق دورکایم این است که آیین مثبت و منفی و آیین «ترمیمی/سوگ» را جدا می‌کند.", "en": "Three kinds of rite: negative rites (prohibitions and abstentions, such as fasting or not touching), positive rites (acts like prayer and ceremonies for fertility and the common good), and piacular rites (about grief and atonement). The lecturer describes the third kind as vows and prayers made to solve a problem; Durkheim's own term refers to rites of mourning and expiation.", "nl": "Three kinds of rite: negative rites (prohibitions and abstentions, such as fasting or not touching), positive rites (acts like prayer and ceremonies for fertility and the common good), and piacular rites (about grief and atonement). The lecturer describes the third kind as vows and prayers made to solve a problem; Durkheim's own term refers to rites of mourning and expiation."}, "sources": ["src:3c8a365a14", "src:e16c79b314"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، از نگاه جامعه‌شناختی و مردم‌شناختی نباید آیینی مثل دعای باران، نذر یا پختن آش را «خرافه» دانست و با معیار «آیا به هدف رسید؟» سنجید؛ کارکرد اصلی آن دورهم‌بودن، امید و تجدید حس تعلق است. این نکته با تحلیل دورکایم و ریمون آرون دربارهٔ وظیفهٔ اجتماعی آیین سازگار است، اما برای دین‌داران خود آیین معمولاً معنایی فراتر از دورهمی دارد و نگاه کارکردی تمام معنای آن را نمی‌گیرد.", "en": "Per the lecturer, from a sociological and anthropological view a rite such as a rain prayer, a vow or cooking a communal pot should not be dismissed as superstition or judged by whether it reaches its goal; its main function is gathering, hope and renewed belonging. This fits Durkheim's and Aron's remarks on the social role of ritual, but for believers the rite usually means more than the gathering, and a functional reading does not exhaust its meaning.", "nl": "Per the lecturer, from a sociological and anthropological view a rite such as a rain prayer, a vow or cooking a communal pot should not be dismissed as superstition or judged by whether it reaches its goal; its main function is gathering, hope and renewed belonging. This fits Durkheim's and Aron's remarks on the social role of ritual, but for believers the rite usually means more than the gathering, and a functional reading does not exhaust its meaning."}, "sources": ["src:3c8a365a14", "src:666b2c4160"], "flags": ["editor-note"]}, {"text": {"fa": "انقلاب فرانسه: دورکایم می‌نویسد در نخستین سال‌های پس از ۱۷۸۹ چیزهایی کاملاً این‌جهانی مانند میهن، آزادی و عقل به امر مقدس بدل شد و دینی خودانگیخته با نماد، محراب و جشن‌های خود پدید آمد (از جمله ستایش «عقل» و «موجود برتر»). او می‌گوید این دین دوام نیاورد چون شور میهنی فروکش کرد، اما مثالی گویا از ساخته‌شدن امر مقدس از دل شور جمعی است.", "en": "French Revolution: Durkheim writes that in the first years after 1789 wholly this-worldly things such as fatherland, liberty and reason became sacred, and a spontaneous religion with symbols, altars and festivals appeared (including the cults of Reason and the Supreme Being). He says it did not last because patriotic enthusiasm faded, yet it is a vivid case of the sacred being made from shared fervour.", "nl": "French Revolution: Durkheim writes that in the first years after 1789 wholly this-worldly things such as fatherland, liberty and reason became sacred, and a spontaneous religion with symbols, altars and festivals appeared (including the cults of Reason and the Supreme Being). He says it did not last because patriotic enthusiasm faded, yet it is a vivid case of the sacred being made from shared fervour."}, "sources": ["src:e16c79b314", "src:63d4cc2871"], "flags": []}, {"text": {"fa": "به گفتهٔ سخنران، ثبت یک انقلاب در تقویم و جشن‌های سالانه (مثل ۲۲ بهمن در ایران) نمونهٔ ساخته‌شدن «دین جدید» با کنش سیاسی است. این برداشت خود سخنران از دورکایم است. دیدگاه مقابل: پژوهشگرانی مانند هابزبام و رنجر نشان داده‌اند که بسیاری از آیین‌ها و «سنت‌ها»ی ملی را دولت‌ها و نخبگان آگاهانه و برای مشروعیت و بسیج ساخته‌اند، پس جشن‌های رسمی فقط شور خودجوش مردم نیستند و ممکن است ابزار قدرت هم باشند.", "en": "Per the lecturer, recording a revolution in the calendar with yearly celebrations (such as 22 Bahman in Iran) is an example of a 'new religion' being built through political action. This is the lecturer's own reading of Durkheim. Opposing view: Hobsbawm, Ranger and others showed that many national rituals and 'traditions' were deliberately built by states and elites for legitimacy and mobilisation, so official festivals are not only spontaneous popular fervour and may also be tools of power.", "nl": "Per the lecturer, recording a revolution in the calendar with yearly celebrations (such as 22 Bahman in Iran) is an example of a 'new religion' being built through political action. This is the lecturer's own reading of Durkheim. Opposing view: Hobsbawm, Ranger and others showed that many national rituals and 'traditions' were deliberately built by states and elites for legitimacy and mobilisation, so official festivals are not only spontaneous popular fervour and may also be tools of power."}, "sources": ["src:3c8a365a14", "src:84c581902a"], "flags": ["editor-note", "contested"]}, {"text": {"fa": "به گفتهٔ سخنران، جامعه‌های کشاورزی چون زمان را چرخه‌ای و تکراری می‌دیدند و تاریخ را غایتمند نمی‌دانستند، بیشتر به جشن و دورهمی روی می‌آوردند. این تعمیم گمانه‌ای است و بر پایهٔ شواهد روشن نیست؛ جشن‌های بزرگ در جامعه‌های شکارگر و صنعتی هم فراوان است و برخی جامعه‌های کشاورزی دیدگاه‌های خطی و غایتمند هم داشته‌اند.", "en": "Per the lecturer, farming societies saw time as cyclical and history as lacking a goal, so they leaned toward festivals and gatherings. This generalisation is speculative and not clearly supported; large festivals are common among hunter-gatherer and industrial societies too, and some agrarian societies held linear, goal-directed views of history.", "nl": "Per the lecturer, farming societies saw time as cyclical and history as lacking a goal, so they leaned toward festivals and gatherings. This generalisation is speculative and not clearly supported; large festivals are common among hunter-gatherer and industrial societies too, and some agrarian societies held linear, goal-directed views of history."}, "sources": ["src:3c8a365a14"], "flags": ["editor-note", "contested"]}], "links": [{"to": "soc:durkheim-sacred-society", "rel": "part-of", "note": {"fa": "بخشی از نظریهٔ دین دورکایم.", "en": "Part of Durkheim's theory of religion.", "nl": "Part of Durkheim's theory of religion."}}, {"to": "soc:social-movements", "rel": "see-also", "note": {"fa": "شور و نمادهای جمعی در جنبش‌ها.", "en": "Collective fervour and symbols in movements.", "nl": "Collective fervour and symbols in movements."}}, {"to": "soc:cohesion", "rel": "explains", "note": {"fa": "آیین‌ها همبستگی و تعلق را تازه نگه می‌دارند.", "en": "Rituals keep solidarity and belonging fresh.", "nl": "Rituals keep solidarity and belonging fresh."}}], "people": ["core:mile-durkheim", "core:baldwin-spencer-and-francis-gillen", "core:mona-ozouf"], "sources": ["src:3c8a365a14", "src:63d4cc2871", "src:666b2c4160", "src:84c581902a", "src:e16c79b314"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:dynamic-culture-shadow-institutions", "kind": "concept", "title": {"fa": "فرهنگ پویا، بازتعریف مفاهیم و نهادهای سایه", "en": "Dynamic culture, redefinition of concepts and shadow institutions", "nl": "Dynamische cultuur, herdefiniëring van begrippen en schaduwinstituties"}, "aliases": [], "parent": "soc:institutions", "field": "soc:institutions", "summary": {"fa": "سخنران فرهنگ «پویا» را فرهنگی می‌داند که تنوع بیشتری را در خود جا دهد و اجازهٔ بازتعریف مفاهیمی مثل عشق و ازدواج را بدهد. اگر نهادی (خانواده، دانشگاه) کارکردش را از دست بدهد، به گفتهٔ او مردم «نهاد سایه» می‌سازند. او از دید کارکردگرایانه، نهاد ناکارآمد را باید اصلاح و در نهایت جایگزین کرد. بخشی از بحث دربارهٔ گرایش جنسی و هویت جنسیتی نظر شخصی اوست و با شواهد علمی رایج فاصله دارد.", "en": "The lecturer calls a culture 'dynamic' when it accommodates more diversity and allows concepts such as love and marriage to be redefined. When an institution (family, university) stops working, people build 'shadow institutions'. From a functionalist angle a failing institution should be reformed and ultimately replaced. Part of the discussion on sexual orientation and gender identity is his personal view and departs from mainstream evidence.", "nl": "De spreker noemt een cultuur dynamisch als zij meer diversiteit toelaat en begrippen als liefde en huwelijk herdefinieert. Als een instelling niet meer werkt, ontstaan volgens hem schaduwinstituties. Zijn opmerkingen over seksuele oriëntatie wijken af van de gangbare wetenschap."}, "points": [{"text": {"fa": "به گفتهٔ سخنران، فرهنگ‌های ابتدایی جهان را دوگانه (خوب/بد) می‌بینند؛ فرهنگ پویا یعنی دایرهٔ پذیرش را وسیع‌تر کند و تنوع را جا دهد، که در لیبرالیسم قرن هجدهم به «مدارا» رسید. او می‌گوید تنوع باید پذیرفته شود نه ساختگی تولید شود.", "en": "Per the lecturer, early cultures see the world in binaries (good/bad); a dynamic culture widens its circle of acceptance, which in eighteenth-century liberalism became 'toleration'. He says diversity should be accepted, not manufactured.", "nl": "Per the lecturer, early cultures see the world in binaries (good/bad); a dynamic culture widens its circle of acceptance, which in eighteenth-century liberalism became 'toleration'. He says diversity should be accepted, not manufactured."}, "sources": ["src:626c053b8a"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، نشانهٔ فرهنگ بسته آن است که مفاهیم را یک بار برای همیشه تعریف می‌کند؛ مثلاً اگر «عشق» فقط معطوف به یک نفر تعریف شده باشد، کسی که تجربه‌اش متفاوت است خود را منحرف و تنها می‌بیند. مثال او برای روشن‌کردن بحث است، نه یافته‌ای تجربی.", "en": "Per the lecturer, a closed culture defines concepts once and for all; if 'love' is defined as directed at one person, someone whose experience differs sees themselves as deviant and isolated. His example is illustrative, not an empirical finding.", "nl": "Per the lecturer, a closed culture defines concepts once and for all; if 'love' is defined as directed at one person, someone whose experience differs sees themselves as deviant and isolated. His example is illustrative, not an empirical finding."}, "sources": ["src:626c053b8a"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، وقتی نهادی مثل ازدواج یا دانشگاه نیازها را پاسخ نمی‌دهد ولی جبر فرهنگی پابرجاست، کنشگران «نهاد سایه» می‌سازند (مثل ازدواج سفید یا حلقه‌های روشنفکری خارج از دانشگاه). او از نگاه کارکردگرا می‌گوید نهاد ناکارآمد را باید اصلاح و در صورت نیاز جایگزین کرد، و نقد نهاد خانواده می‌تواند نقدی کارکردی و غیرچپ باشد. «نهاد سایه» اصطلاح خود سخنران است و به مفهوم نهادهای غیررسمی در جامعه‌شناسی نزدیک است.", "en": "Per the lecturer, when an institution such as marriage or the university fails to meet needs while cultural constraint persists, actors build 'shadow institutions' (e.g. unregistered cohabitation, intellectual circles outside the university). From a functionalist view a failing institution should be reformed and, if needed, replaced, and criticism of the family can be functional rather than left-wing. 'Shadow institution' is his own term, close to the sociological notion of informal institutions.", "nl": "Per the lecturer, when an institution such as marriage or the university fails to meet needs while cultural constraint persists, actors build 'shadow institutions' (e.g. unregistered cohabitation, intellectual circles outside the university). From a functionalist view a failing institution should be reformed and, if needed, replaced, and criticism of the family can be functional rather than left-wing. 'Shadow institution' is his own term, close to the sociological notion of informal institutions."}, "sources": ["src:626c053b8a"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، هم‌جنس‌گرایی و فرانجنسی (ترنس) را باید با سازوکار «نظم اجتماعی» (مثل تفکیک جنسیتی مدارس و موج‌های روشنفکری) توضیح داد، و بخشی از آن‌ها را اختلال می‌داند که نباید «طبیعی» جلوه داده شود. این بخش بر مشاهدات و مصاحبه‌های شخصی او تکیه دارد و با اجماع علمی همخوان نیست.", "en": "Per the lecturer, same-sex attraction and transgender identity should be explained through 'social order' mechanisms (gender segregation in schools, intellectual fashions), and some cases he regards as disorders that should not be presented as natural. This rests on his own interviews and observations and does not match the scientific consensus.", "nl": "Per the lecturer, same-sex attraction and transgender identity should be explained through 'social order' mechanisms (gender segregation in schools, intellectual fashions), and some cases he regards as disorders that should not be presented as natural. This rests on his own interviews and observations and does not match the scientific consensus."}, "sources": ["src:626c053b8a"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "نکتهٔ علمی: انجمن روان‌پزشکی آمریکا هم‌جنس‌گرایی را سال ۱۹۷۳ پس از بازنگری شواهد و بحث حرفه‌ای از فهرست اختلالات حذف کرد و سازمان جهانی بهداشت نیز در ICD-11 «ناهمخوانی جنسیتی» را از فصل اختلالات روانی بیرون آورد؛ پژوهش‌ها هم‌جنس‌گرایی را در جوامع و دوره‌های متعدد و در گونه‌های جانوری گزارش کرده‌اند. زمینهٔ اجتماعی بر بیان و برچسب‌زنی اثر دارد، اما شواهد نشان نمی‌دهد گرایش جنسی عمدتاً انتخاب یا مد باشد. این تغییرات را نباید صرفاً نتیجهٔ فشار یک گفتمان سیاسی دانست.", "en": "Scientific note: the American Psychiatric Association removed homosexuality from its list of disorders in 1973 after reviewing evidence and professional debate, and the WHO's ICD-11 moved 'gender incongruence' out of the mental-disorders chapter; same-sex behaviour is documented across many societies, periods and animal species. Social context affects expression and labelling, but evidence does not show orientation to be mainly a choice or a fashion, and these changes should not be reduced to political-discourse pressure.", "nl": "Scientific note: the American Psychiatric Association removed homosexuality from its list of disorders in 1973 after reviewing evidence and professional debate, and the WHO's ICD-11 moved 'gender incongruence' out of the mental-disorders chapter; same-sex behaviour is documented across many societies, periods and animal species. Social context affects expression and labelling, but evidence does not show orientation to be mainly a choice or a fashion, and these changes should not be reduced to political-discourse pressure."}, "sources": ["src:2001e7d83f", "src:d2b8e9eaab"], "flags": ["contested", "editor-note"]}], "links": [{"to": "soc:institutions", "rel": "part-of", "note": {"fa": "بحث کارکرد و جایگزینی نهادها", "en": "On the function and replacement of institutions", "nl": "On the function and replacement of institutions"}}, {"to": "soc:sacred-and-taboo", "rel": "contrasts", "note": {"fa": "فرهنگ پویا در برابر جامعهٔ مقدس", "en": "Dynamic culture against sacred society", "nl": "Dynamic culture against sacred society"}}, {"to": "soc:value-change", "rel": "see-also", "note": {"fa": "تغییر ارزش‌ها و پذیرش تنوع", "en": "Value change and acceptance of diversity", "nl": "Value change and acceptance of diversity"}}], "people": ["core:peter-l-berger", "core:jack-drescher"], "sources": ["src:2001e7d83f", "src:626c053b8a", "src:d2b8e9eaab"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:social-capital", "kind": "concept", "title": {"fa": "سرمایهٔ اجتماعی: پیوندی و پل‌زننده", "en": "Social capital: bonding and bridging", "nl": "Sociaal kapitaal: bindend en overbruggend"}, "aliases": [], "parent": "soc:cohesion", "field": "soc:cohesion", "summary": {"fa": "شبکه‌ها، هنجارهای متقابل و اعتمادی که همکاری را ممکن می‌کنند. سرمایهٔ «پیوندی» درون گروه (خانواده، قوم) گرم و محافظ است؛ سرمایهٔ «پل‌زننده» میان گروه‌ها فرصت و اطلاعات می‌آورد. جامعه‌ای که اولی را زیاد و دومی را کم دارد، محفلی و بی‌اعتماد می‌شود.", "en": "The networks, norms of reciprocity and trust that make cooperation possible. \"Bonding\" capital within a group (family, clan) is warm and protective; \"bridging\" capital between groups brings opportunity and information. A society rich in the first and poor in the second becomes cliquish and distrustful.", "nl": "De netwerken, wederkerigheidsnormen en het vertrouwen die samenwerking mogelijk maken. \"Bindend\" kapitaal binnen een groep (familie, clan) is warm en beschermend; \"overbruggend\" kapitaal tussen groepen brengt kansen en informatie. Een samenleving rijk aan het eerste en arm aan het tweede wordt kliekerig en wantrouwig."}, "points": [{"text": {"fa": "پاتنم (۱۹۹۳): تفاوت کارایی حکومت‌های محلی شمال و جنوب ایتالیا را به سنت‌های مدنی چندصدساله (انجمن‌ها، همسرایی‌ها، تعاونی‌ها) برگرداند؛ یکی از پرارجاع‌ترین و پرمناقشه‌ترین مطالعات علوم اجتماعی.", "en": "Putnam (1993): traced the difference in local-government performance between northern and southern Italy to centuries-old civic traditions (associations, choirs, cooperatives); one of social science's most cited and most contested studies.", "nl": "Putnam (1993): traced the difference in local-government performance between northern and southern Italy to centuries-old civic traditions (associations, choirs, cooperatives); one of social science's most cited and most contested studies."}, "sources": ["src:0676792d21"], "flags": ["contested"]}, {"text": {"fa": "کلمن (۱۹۸۸): سرمایهٔ اجتماعی در ساختار روابط است، نه در افراد؛ شبکهٔ «بسته» (والدینی که همدیگر را می‌شناسند) هنجارها را اجراپذیر می‌کند و افت تحصیلی را کم.", "en": "Coleman (1988): social capital lies in the structure of relations, not in individuals; a \"closed\" network (parents who know each other) makes norms enforceable and cuts school dropout.", "nl": "Coleman (1988): social capital lies in the structure of relations, not in individuals; a \"closed\" network (parents who know each other) makes norms enforceable and cuts school dropout."}, "sources": ["src:ec182152dc"], "flags": []}, {"text": {"fa": "بوردیو (۱۹۸۶): سرمایهٔ اجتماعی مثل سرمایهٔ اقتصادی و فرهنگی نابرابر توزیع شده و ابزار بازتولید امتیاز است؛ «پارتی» نام محلی همین پدیده است.", "en": "Bourdieu (1986): social capital, like economic and cultural capital, is unequally distributed and a tool for reproducing privilege; \"connections\" is the everyday name of the same phenomenon.", "nl": "Bourdieu (1986): social capital, like economic and cultural capital, is unequally distributed and a tool for reproducing privilege; \"connections\" is the everyday name of the same phenomenon."}, "sources": ["src:ef764a2065"], "flags": []}], "links": [{"to": "psy:social-capital", "rel": "same-as", "note": {"fa": "سرمایهٔ اجتماعی در ویکی روان", "en": "Social capital in the psychology wiki", "nl": "Social capital in the psychology wiki"}}, {"to": "soc:weak-ties", "rel": "explains", "note": {"fa": "چرا پیوندهای ضعیف پل می‌زنند", "en": "Why weak ties bridge", "nl": "Why weak ties bridge"}}, {"to": "soc:generalized-trust", "rel": "part-of", "note": {"fa": "اعتماد تعمیم‌یافته، هستهٔ سرمایهٔ پل‌زننده", "en": "Generalised trust, the core of bridging capital", "nl": "Generalised trust, the core of bridging capital"}}], "people": ["core:robert-putnam", "core:james-coleman", "core:pierre-bourdieu"], "sources": ["src:0676792d21", "src:ec182152dc", "src:ef764a2065"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:custom-changing-functions", "kind": "concept", "title": {"fa": "رسم‌ها و کارکردهای متغیر: نوروز، چهارشنبه‌سوری، محرم", "en": "Customs and their changing functions: Nowruz, Chaharshanbe Suri, Muharram", "nl": "Gebruiken en hun veranderende functies"}, "aliases": [], "parent": "soc:values", "field": "soc:values", "summary": {"fa": "با ابزار کارکردگرایی می‌توان پرسید چرا رسم‌های کهن دوام آورده‌اند: سخنران می‌گوید یک رسم در طول تاریخ کارکرد خود را عوض می‌کند و تا زمانی می‌ماند که پاسخی به نیازی جدید بدهد. او با نمونه‌های ایرانی نشان می‌دهد که معنای آتش‌افروزی یا سفرهٔ هفت‌سین امروز با گذشته فرق دارد. برخی ادعاهای تاریخی او مناقشه‌برانگیزند.", "en": "Using the functionalist tool, one can ask why ancient customs survive: the lecturer says a custom changes its function over time and endures only while it answers some current need. With Iranian examples he shows that the meaning of fire-lighting or the haft-sin table today differs from the past. Several of his historical claims are contested.", "nl": "Met functionalistische middelen kun je vragen waarom oude gebruiken blijven bestaan: volgens de spreker verandert een gebruik van functie en overleeft het alleen als het op een actuele behoefte antwoordt."}, "points": [{"text": {"fa": "قاعدهٔ تحلیلی: هر رسم پایدار باید دست‌کم یک کارکرد فعلی داشته باشد، ولی لازم نیست همان کارکرد اصلی باشد. رسم‌ها با ساختن کارکردهای تازه زنده می‌مانند، و اگر کارکردشان را از دست بدهند محو یا به آیین دیگری تبدیل می‌شوند. این با ایدهٔ مرتون دربارهٔ کارکردهای پنهان و با پژوهش دربارهٔ «ابداع سنت» هم‌خوان است.", "en": "Analytic rule: any lasting custom must have some present function, though not its original one. Customs survive by acquiring new functions, and if they lose them they fade or turn into another rite. This fits Merton's latent functions and research on the 'invention of tradition'.", "nl": "Analytic rule: any lasting custom must have some present function, though not its original one. Customs survive by acquiring new functions, and if they lose them they fade or turn into another rite. This fits Merton's latent functions and research on the 'invention of tradition'."}, "sources": ["src:ade2795cc7", "src:013201f878", "src:84c581902a"], "flags": []}, {"text": {"fa": "به گفتهٔ سخنران، امروزه چهارشنبه‌سوری ممکن است بهانهٔ دورهمی، تفریح یا اعتراض غیرمستقیم به سیاست باشد، و نوروز کارکردهای ذهنی و خانوادگی گسترده‌ای دارد؛ و مناسک عزاداری هم با تغییر ذائقهٔ اجتماعی (مثلاً سبک موسیقی) خود را تطبیق می‌دهند. این تفسیرها ایدهٔ کارکردگرایانهٔ خود اوست و پژوهش میدانی ندارند.", "en": "Per the lecturer, Chaharshanbe Suri may now serve as a pretext for gatherings, fun or indirect protest against policy, Nowruz has broad mental and family functions, and mourning rituals adapt to social taste (for instance musical style). These readings are his functionalist interpretation, not field findings.", "nl": "Per the lecturer, Chaharshanbe Suri may now serve as a pretext for gatherings, fun or indirect protest against policy, Nowruz has broad mental and family functions, and mourning rituals adapt to social taste (for instance musical style). These readings are his functionalist interpretation, not field findings."}, "sources": ["src:ade2795cc7"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، مخالفت سیاسی با رسم‌هایی مثل نوروز به جایی نمی‌رسد چون رسم‌ها به نیازهای واقعی پاسخ می‌دهند. تذکر: این تعمیم اغراق‌آمیز است؛ دولت‌ها گاه توانسته‌اند رسم‌ها را سرکوب یا تغییر دهند (مثلاً در شوروی یا در انقلاب فرهنگی چین). درست‌تر این است که بگوییم سرکوب رسم‌های ریشه‌دار پرهزینه و اغلب ناقص است.", "en": "Per the lecturer, political opposition to customs such as Nowruz fails because customs meet real needs. Caveat: this generalisation is overstated; states have sometimes suppressed or reshaped customs (in the Soviet Union or China's Cultural Revolution, for example). It is fairer to say that suppressing rooted customs is costly and often incomplete.", "nl": "Per the lecturer, political opposition to customs such as Nowruz fails because customs meet real needs. Caveat: this generalisation is overstated; states have sometimes suppressed or reshaped customs (in the Soviet Union or China's Cultural Revolution, for example). It is fairer to say that suppressing rooted customs is costly and often incomplete."}, "sources": [], "flags": ["contested", "editor-note"]}, {"text": {"fa": "تذکر: سخنران کارکرد آغازین آتش چهارشنبه‌سوری را فراخواندن ارواح نیاکان و هفت‌سین را پیش‌بینی محصول می‌داند. این‌ها فرضیه‌اند و سرچشمهٔ این رسم‌ها در منابع تاریخی روشن و مورد توافق نیست. همچنین پیوند کارناوال‌های اروپایی با موکب‌های تازیانه‌زنی قرون وسطی تردیدآمیز است، چون کارناوال بیشتر از جشن‌های پیش از روزهٔ مسیحی می‌آید.", "en": "Caveat: the lecturer takes the original function of Chaharshanbe Suri fire as summoning ancestral spirits and of haft-sin as crop forecasting. These are hypotheses; the origins of these customs are not clearly documented or agreed. His link between European carnivals and medieval flagellant processions is also doubtful, since carnival derives mainly from pre-Lenten festivities.", "nl": "Caveat: the lecturer takes the original function of Chaharshanbe Suri fire as summoning ancestral spirits and of haft-sin as crop forecasting. These are hypotheses; the origins of these customs are not clearly documented or agreed. His link between European carnivals and medieval flagellant processions is also doubtful, since carnival derives mainly from pre-Lenten festivities."}, "sources": [], "flags": ["contested", "editor-note"]}, {"text": {"fa": "سخنران از نیاز به «اعتراف» و گفتن تجربهٔ شخصی در جمع برای شفای جامعه می‌گوید و آن را تبدیل رنج فردی به مسئلهٔ مشترک می‌داند. این برداشتی شخصی و تأملی است و ادعای تجربی دربارهٔ اثر آن ندارد.", "en": "The lecturer also argues that sharing personal experience openly, a kind of 'confession', can heal a society by turning private pain into a shared problem. This is a reflective personal view, not an empirical claim about effects.", "nl": "The lecturer also argues that sharing personal experience openly, a kind of 'confession', can heal a society by turning private pain into a shared problem. This is a reflective personal view, not an empirical claim about effects."}, "sources": ["src:ade2795cc7"], "flags": ["editor-note"]}], "links": [{"to": "soc:malinowski-functionalism", "rel": "part-of", "note": {"fa": "کاربرد روش مالینوفسکی", "en": "Application of Malinowski's method", "nl": "Application of Malinowski's method"}}, {"to": "soc:secularization", "rel": "see-also", "note": {"fa": "دین و جامعهٔ در حال تغییر", "en": "Religion in a changing society", "nl": "Religion in a changing society"}}, {"to": "soc:social-construction", "rel": "see-also", "note": {"fa": "معنا چگونه ساخته می‌شود", "en": "How meaning is constructed", "nl": "How meaning is constructed"}}], "people": ["core:bronislaw-malinowski", "core:robert-k-merton", "core:eric-hobsbawm"], "sources": ["src:013201f878", "src:84c581902a", "src:ade2795cc7"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:inequality", "kind": "field", "title": {"fa": "نابرابری و تحرک", "en": "Inequality & mobility", "nl": "Ongelijkheid & mobiliteit"}, "aliases": [], "parent": "soc:soc", "field": null, "summary": {"fa": "چقدر فاصله هست، چقدر می‌شود از آن بالا رفت، و نابرابری با جامعه چه می‌کند؟", "en": "How wide is the gap, how climbable is it, and what does inequality do to a society?", "nl": "Hoe groot is de kloof, hoe beklimbaar is ze, en wat doet ongelijkheid met een samenleving?"}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:sacred-and-taboo", "kind": "concept", "title": {"fa": "امر مقدس و تابو به‌مثابه سازندهٔ ارزش‌ها", "en": "The sacred and the taboo as value-makers", "nl": "Het heilige en het taboe als waardenmakers"}, "aliases": [], "parent": "soc:values", "field": "soc:values", "summary": {"fa": "در جامعه‌شناسی دین، «مقدس» چیزی است که از پرسش و دست‌کاری کنار گذاشته می‌شود و گروه گرد آن متحد می‌شود. «تابو» رویِ دیگرِ همین سازوکار است: چیزهایی که نباید به آن‌ها نزدیک شد. هر دو مرز ارزش‌ها را می‌کشند و به انسجام گروه کمک می‌کنند. اما هرچه جامعه بیشتر چیزها را مقدس کند، انعطاف و بازنگری در آن کمتر می‌شود.", "en": "In the sociology of religion the sacred is what a group sets apart from questioning and handling, and rallies around. The taboo is the mirror image: what must not be approached. Both draw the boundaries of values and support group cohesion, but the more a society sanctifies, the less room it leaves for revision.", "nl": "In de godsdienstsociologie is het heilige wat een groep aan vragen en aanraking onttrekt en waaromheen zij samenkomt. Het taboe is het spiegelbeeld ervan. Beide trekken grenzen voor waarden en versterken de groepscohesie."}, "points": [{"text": {"fa": "به گفتهٔ سخنران، چیزی که «مقدس» شود مثل چیزی که در جعبهٔ ضدگلوله گذاشته‌اند از دسترس نقد و پرسش بیرون می‌رود و ادعا می‌کند در همهٔ زمان‌ها و مکان‌ها معتبر است؛ تابو و امر «شیطانی» هم همین کارکرد را دارند، یعنی کارگزاران اجتماعی هم از نزدیک‌شدن به مقدس و هم به ممنوع دور می‌مانند.", "en": "Per the lecturer, whatever becomes sacred is placed beyond questioning and claims validity for all times and places; the taboo or 'demonic' works the same way, keeping people from approaching either the sacred or the forbidden.", "nl": "Per the lecturer, whatever becomes sacred is placed beyond questioning and claims validity for all times and places; the taboo or 'demonic' works the same way, keeping people from approaching either the sacred or the forbidden."}, "sources": ["src:626c053b8a"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، توضیح جامعه‌شناختی این است که گروه‌ها باورها و پنداره‌هایی را که برای بقا و انسجام خود لازم می‌دیدند مقدس کردند تا از آسیب زمان و نقد در امان بمانند؛ بنابراین باید پرسید هر ایدهٔ دینی (مثل معاد یا نبوت) چه نیازی را در جامعه پاسخ می‌داده است. این روایت با خوانش کارکردی دورکیم از دین هم‌سو است.", "en": "Per the lecturer, the sociological explanation is that groups sanctified beliefs they felt necessary for survival and cohesion, so one should ask what social need each religious idea (afterlife, prophecy) answered. This matches Durkheim's functional reading of religion.", "nl": "Per the lecturer, the sociological explanation is that groups sanctified beliefs they felt necessary for survival and cohesion, so one should ask what social need each religious idea (afterlife, prophecy) answered. This matches Durkheim's functional reading of religion."}, "sources": ["src:626c053b8a", "src:59e5290deb"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، یکتاپرستی را می‌توان تلاشی برای جمع‌کردن خدایانِ پراکندهٔ قبیله‌ها در یک نماد واحد و در نتیجه یک عامل همبستگی دانست. این تفسیر حدسی است؛ پیدایش یکتاپرستی (مثلاً در اسرائیل باستان یا ایران) میان پژوهشگران محل بحث است و توضیح کارکردی تنها یکی از فرضیه‌هاست.", "en": "Per the lecturer, monotheism can be read as an attempt to merge many tribal gods into one unifying symbol. This is speculative; the origins of monotheism are debated among scholars and the functional account is only one hypothesis.", "nl": "Per the lecturer, monotheism can be read as an attempt to merge many tribal gods into one unifying symbol. This is speculative; the origins of monotheism are debated among scholars and the functional account is only one hypothesis."}, "sources": ["src:626c053b8a"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "هاوارد بکر (جامعه‌شناس آمریکایی) میان جامعهٔ «مقدس» و «سکولار» فرق می‌گذارد. به گفتهٔ سخنران، در جامعهٔ بسیار مقدس حتی نُرم‌های زندگی (مثلاً مقدس‌بودن مادر یا خانواده) تغییرناپذیر می‌شوند و فرد را در بند نگه می‌دارند، حتی تا حد گره‌های روانی.", "en": "Howard Becker distinguishes 'sacred' from 'secular' societies. Per the lecturer, in a highly sacred society even everyday norms (the sanctity of the mother or family) become unchangeable and can bind individuals, even psychologically.", "nl": "Howard Becker distinguishes 'sacred' from 'secular' societies. Per the lecturer, in a highly sacred society even everyday norms (the sanctity of the mother or family) become unchangeable and can bind individuals, even psychologically."}, "sources": ["src:626c053b8a", "src:17da54cb29"], "flags": ["editor-note"]}, {"text": {"fa": "دورکیم مقدس را نه ویژگی ذاتی یک شیء، بلکه برچسبی می‌دانست که جامعه می‌زند و گروه را حول آن متحد می‌کند. مفهوم تابو هم از انسان‌شناسی (پولینزی) آمده و همهٔ تابوها کارکرد انسجام‌بخش یا «ارزشی» ندارند؛ بعضی فقط ترس یا آیین‌اند.", "en": "Durkheim treated the sacred not as an intrinsic property of objects but as a label society attaches, around which the group unites. The notion of taboo comes from Polynesian ethnography, and not every taboo has a cohesive or value-bearing function; some are simply fear or ritual.", "nl": "Durkheim treated the sacred not as an intrinsic property of objects but as a label society attaches, around which the group unites. The notion of taboo comes from Polynesian ethnography, and not every taboo has a cohesive or value-bearing function; some are simply fear or ritual."}, "sources": ["src:59e5290deb"], "flags": ["contested", "editor-note"]}], "links": [{"to": "soc:values", "rel": "part-of", "note": {"fa": "مقدس و تابو سازوکار شکل‌گیری ارزش‌هاست", "en": "The sacred and taboo are mechanisms of value formation", "nl": "The sacred and taboo are mechanisms of value formation"}}, {"to": "soc:cohesion", "rel": "explains", "note": {"fa": "توضیح می‌دهد چرا مقدسات انسجام گروه را نگه می‌دارند", "en": "Explains why sanctities hold groups together", "nl": "Explains why sanctities hold groups together"}}, {"to": "soc:dynamic-culture-shadow-institutions", "rel": "contrasts", "note": {"fa": "جامعهٔ مقدس در برابر فرهنگ پویا", "en": "Sacred society versus dynamic culture", "nl": "Sacred society versus dynamic culture"}}], "people": ["core:mile-durkheim", "core:howard-p-becker"], "sources": ["src:17da54cb29", "src:59e5290deb", "src:626c053b8a"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:play-games-culture-trust", "kind": "concept", "title": {"fa": "بازی، قاعده‌های توافقی و ساخت فرهنگ و اعتماد", "en": "Play, agreed rules, and the making of culture and trust", "nl": "Spel, afgesproken regels en het ontstaan van cultuur en vertrouwen"}, "aliases": [], "parent": "soc:values", "field": "soc:values", "summary": {"fa": "بازی‌ها زمان و مکانِ جدایی می‌سازند که قواعدشان را بازیکنان خودشان توافق کرده‌اند. کودکان با بازی نقش‌های اجتماعی را تمرین می‌کنند. سخنران می‌گوید بازی‌های دسته‌جمعی نشان می‌دهند فرهنگ از جنس توافق اجتماعی است و همدستی در بازی می‌تواند اعتماد بسازد. این بخش بیشتر برداشت خود سخنران است و باید با احتیاط خوانده شود.", "en": "Games create a separate time and place whose rules the players agree on themselves. Children rehearse social roles through play. The lecturer argues that group games reveal that culture is a social agreement, and that complicity in a game can create trust. Much of this is the lecturer's own interpretation and should be read with caution.", "nl": "Spellen scheppen een eigen tijd en ruimte met onderling afgesproken regels. Kinderen oefenen sociale rollen door spel. De docent leest groepsspellen als een inkijk in cultuur als sociale afspraak; dit is zijn eigen interpretatie."}, "points": [{"text": {"fa": "در بازی، زمان و مکان معمولی کنار می‌رود. تماشاگر فوتبال یا بازیکن کارت چنان در بازی فرو می‌رود که اگر ساعت را بپرسند، دقیقهٔ بازی را می‌گوید. تعهد به قاعده‌های بازی گاهی چنان شدید است که بیرونی‌ها تعجب می‌کنند و ممکن است در بازی شرط‌بندی‌شده، نسبت‌های واقعی آدم‌ها (مثلاً خواهر و برادر) موقتاً فراموش شود.", "en": "In play, ordinary time and place fall away. A football spectator or a card player is so absorbed that asked the time they give the minute of the match. Commitment to the game's rules can be so intense that outsiders are surprised, and in a game with stakes real relationships (for example between siblings) may be briefly forgotten.", "nl": "In play, ordinary time and place fall away. A football spectator or a card player is so absorbed that asked the time they give the minute of the match. Commitment to the game's rules can be so intense that outsiders are surprised, and in a game with stakes real relationships (for example between siblings) may be briefly forgotten."}, "sources": ["src:26a4a26b1b", "src:23e16fb6e8"], "flags": []}, {"text": {"fa": "کودکان با بازی نقش‌های اجتماعی را تمرین می‌کنند: پسربچه ادای پدر را درمی‌آورد و دخترک با عروسک نقش مادر را بازی می‌کند. به این ترتیب بازی راهی برای انتقال فرهنگ و آماده شدن برای بزرگسالی است. این ایده به جرج هربرت مید نزدیک است که بازی کودکان را مرحلهٔ یادگیری گرفتن نقشِ دیگران می‌داند.", "en": "Children rehearse social roles through play: a small boy imitates a father and a girl plays mother with a doll. Play is thus a way of transmitting culture and preparing for adulthood. This is close to George Herbert Mead, who saw children's play as a stage of learning to take the role of others.", "nl": "Children rehearse social roles through play: a small boy imitates a father and a girl plays mother with a doll. Play is thus a way of transmitting culture and preparing for adulthood. This is close to George Herbert Mead, who saw children's play as a stage of learning to take the role of others."}, "sources": ["src:26a4a26b1b", "src:8728add9be"], "flags": []}, {"text": {"fa": "به گفتهٔ سخنران، در بازی‌های جمعی مثل بازی با بطری، همه توافق می‌کنند که برای مدتی داوری‌های معمول اجتماعی را کنار بگذارند. چون همه همدست‌اند، کسی دیگری را قضاوت نمی‌کند و انتظار می‌رود حرف‌های آن جمع بیرون نرود؛ بنابراین همدستی می‌تواند اعتماد بسازد. او از اینجا نتیجه می‌گیرد که بازی‌ها فرمول ساخت فرهنگ، یعنی توافقِ جمعی، را به ما نشان می‌دهند.", "en": "Per the lecturer, in group games such as the bottle game everyone agrees to set aside ordinary social judgments for a while. Because all are complicit, nobody judges anyone, and what happens is expected to stay in the group, so complicity can build trust. From this he concludes that games reveal the formula by which culture is made: collective agreement.", "nl": "Per the lecturer, in group games such as the bottle game everyone agrees to set aside ordinary social judgments for a while. Because all are complicit, nobody judges anyone, and what happens is expected to stay in the group, so complicity can build trust. From this he concludes that games reveal the formula by which culture is made: collective agreement."}, "sources": ["src:26a4a26b1b"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، فشار برای «همدست شدن» (رقصیدن در عروسی، کشیدن سیگار در جمع نوجوانان) آزمونی برای تعلق است: کسی که شرکت نمی‌کند مشکوک به نظر می‌آید و کسی که یک بار شرکت کند دیگر مورد سؤال نیست. این تحلیل شخصی او است و نه یافتهٔ پژوهشی.", "en": "Per the lecturer, pressure to join in (dancing at a wedding, smoking among teenagers) works as a test of belonging: someone who abstains seems suspect, and someone who joins once is no longer questioned. This is his personal analysis, not a research finding.", "nl": "Per the lecturer, pressure to join in (dancing at a wedding, smoking among teenagers) works as a test of belonging: someone who abstains seems suspect, and someone who joins once is no longer questioned. This is his personal analysis, not a research finding."}, "sources": ["src:26a4a26b1b"], "flags": ["editor-note"]}, {"text": {"fa": "توضیح: یوهان هویزینگا هم استدلال کرده که فرهنگ از دل بازی پدید می‌آید و بازی «دایره‌ای» جدا با قاعدهٔ خودش دارد، اما این نظر بحث‌برانگیز و حدسی است؛ دربارهٔ آغاز فرهنگ بیشتر باید به شواهد باستان‌شناسی و انسان‌شناسی رجوع کرد. همچنین همدستی همیشه به اعتماد نمی‌انجامد و گاهی راز بازی بیرون می‌رود، چنان که خود سخنران هم اشاره می‌کند.", "en": "Caveat: Johan Huizinga also argued that culture arises from play and that play forms a separate circle with its own rules, but this view is speculative and debated; evidence on the origins of culture comes mainly from archaeology and anthropology. Complicity also does not always produce trust and secrets sometimes leak, as the lecturer himself notes.", "nl": "Caveat: Johan Huizinga also argued that culture arises from play and that play forms a separate circle with its own rules, but this view is speculative and debated; evidence on the origins of culture comes mainly from archaeology and anthropology. Complicity also does not always produce trust and secrets sometimes leak, as the lecturer himself notes."}, "sources": ["src:23e16fb6e8"], "flags": ["contested", "editor-note"]}], "links": [{"to": "soc:schutz-finite-provinces", "rel": "part-of", "note": {"fa": "بازی یکی از حوزه‌های معنایی محدود در نظر شوتس است.", "en": "Play is one of Schutz's finite provinces of meaning.", "nl": "Play is one of Schutz's finite provinces of meaning."}}, {"to": "psy:flow", "rel": "see-also", "note": {"fa": "غرق شدن در بازی و فراموشی زمان.", "en": "Absorption in play and loss of time awareness.", "nl": "Absorption in play and loss of time awareness."}}, {"to": "soc:generalized-trust", "rel": "see-also", "note": {"fa": "اعتماد و همدستی در گروه‌های کوچک.", "en": "Trust and complicity in small groups.", "nl": "Trust and complicity in small groups."}}, {"to": "psy:norm-psychology", "rel": "see-also", "note": {"fa": "هنجارها و فشار هم‌نوایی.", "en": "Norms and conformity pressure.", "nl": "Norms and conformity pressure."}}], "people": ["core:johan-huizinga", "core:george-herbert-mead"], "sources": ["src:23e16fb6e8", "src:26a4a26b1b", "src:8728add9be"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:structural-functionalism", "kind": "concept", "title": {"fa": "کارکردگرایی ساختاری: راد‌کلیف‌براون، پارسونز و مرتون", "en": "Structural functionalism: Radcliffe-Brown, Parsons and Merton", "nl": "Structureel functionalisme: Radcliffe-Brown, Parsons en Merton"}, "aliases": [], "parent": "soc:theory", "field": "soc:theory", "summary": {"fa": "کارکردگرایی ساختاری جامعه را نظامی از بخش‌های وابسته می‌بیند که هر کدام برای دوام کل کاری انجام می‌دهد. تالکوت پارسونز آن را در آمریکا به نظریهٔ فراگیر تبدیل کرد و رابرت مرتون با مفاهیمی چون کارکرد پنهان و کژکارکرد آن را دقیق‌تر ساخت. تا دههٔ ۱۹۶۰ این رویکرد در جامعه‌شناسی غالب بود و بعد منتقدانی مثل دارندورف به آن تاختند.", "en": "Structural functionalism sees society as a system of interdependent parts, each contributing to the survival of the whole. Talcott Parsons made it the dominant theory in the United States, and Robert Merton refined it with ideas such as latent functions and dysfunctions. It dominated sociology until the 1960s, after which critics such as Dahrendorf attacked it.", "nl": "Structureel functionalisme ziet de samenleving als een stelsel van onderling afhankelijke delen. Parsons maakte het dominant in de VS; Merton verfijnde het met begrippen als latente functie en disfunctie."}, "points": [{"text": {"fa": "پارسونز (زادهٔ ۱۹۰۲) ابتدا زیست‌شناسی می‌خواند، با درسی جامعه‌شناختی به این رشته علاقه‌مند شد، در مدرسهٔ اقتصاد لندن نزد مالینوفسکی درس خواند و دکترایش را در هایدلبرگ دربارهٔ اندیشهٔ وبر و سرمایه‌داری گرفت. وبر و دورکایم دو منبع اصلی نظریهٔ او شدند.", "en": "Parsons (born 1902) first studied biology, was drawn to sociology by a course, studied under Malinowski at the London School of Economics, and took his doctorate at Heidelberg on ideas about capitalism by Weber and others. Weber and Durkheim became two main sources of his theory.", "nl": "Parsons (born 1902) first studied biology, was drawn to sociology by a course, studied under Malinowski at the London School of Economics, and took his doctorate at Heidelberg on ideas about capitalism by Weber and others. Weber and Durkheim became two main sources of his theory."}, "sources": ["src:ade2795cc7", "src:901aaf4f96"], "flags": []}, {"text": {"fa": "نام «ساختاری–کارکردی» از آن‌جاست که هم به کارکرد (چه کاری برای دوام نظام انجام می‌شود) و هم به ساختار (الگوهای پایدار نقش‌ها و هنجارها، هم‌ذهنی و هم عینی) توجه می‌کند. سخنران از این برای توضیح تفاوت راه‌های رسیدن به هدف در جوامع مختلف استفاده می‌کند.", "en": "The name 'structural-functional' reflects attention both to function (what is done to keep a system going) and to structure (stable patterns of roles and norms, both mental and material). The lecturer uses this to explain why societies reach goals by different routes.", "nl": "The name 'structural-functional' reflects attention both to function (what is done to keep a system going) and to structure (stable patterns of roles and norms, both mental and material). The lecturer uses this to explain why societies reach goals by different routes."}, "sources": ["src:ade2795cc7", "src:58a696ccbe"], "flags": []}, {"text": {"fa": "پارسونز بین «کنش» و صرف «رفتار» تفاوت می‌گذارد: کنش نیت و معنا دارد. این را از وبر (فهم معنای ذهنی کنشگر) گرفته است. به گفتهٔ سخنران، مقصود پارسونز از کنش، کنش انسان‌ها در گروه‌هاست، و برای فهم یک رفتار جمعی (مثل هجوم برای خرید در بحران) باید تاریخ و تجربهٔ جمعی آن جامعه، مثلاً حافظهٔ قحطی و ناامنی، را دید.", "en": "Parsons distinguishes 'action', which has intention and meaning, from mere 'behaviour', a distinction he took from Weber's focus on the actor's subjective meaning. Per the lecturer, this means action in groups, and understanding collective behaviour such as panic buying requires a society's history and shared experience of insecurity.", "nl": "Parsons distinguishes 'action', which has intention and meaning, from mere 'behaviour', a distinction he took from Weber's focus on the actor's subjective meaning. Per the lecturer, this means action in groups, and understanding collective behaviour such as panic buying requires a society's history and shared experience of insecurity."}, "sources": ["src:ade2795cc7", "src:901aaf4f96", "src:58a696ccbe"], "flags": ["editor-note"]}, {"text": {"fa": "مرتون، که با پارسونز آشنا بود و از او تأثیر گرفت، مفاهیمی افزود که در کار پارسونز نبود، از جمله کارکرد آشکار در برابر کارکرد پنهان و کژکارکرد. این مفاهیم تحلیل را از این فرض ساده که هر چیز برای نظام خوب است دور می‌کند.", "en": "Merton, who learned from Parsons, added ideas absent from Parsons's work, including manifest versus latent functions and dysfunctions. These moved the analysis away from the simple assumption that everything serves the system well.", "nl": "Merton, who learned from Parsons, added ideas absent from Parsons's work, including manifest versus latent functions and dysfunctions. These moved the analysis away from the simple assumption that everything serves the system well."}, "sources": ["src:ade2795cc7", "src:013201f878"], "flags": []}, {"text": {"fa": "تذکر: سخنران می‌گوید پارسونز در پایان عمر به «جبرگرایی سخت» رسید و می‌گوید انسان اراده‌ای ندارد. این برداشت بحث‌انگیز است: پارسونز خود نظریه‌اش را «ارادی‌گرا» می‌نامید، اما منتقدان (مثلاً دنیس رانگ) گفته‌اند که او انسان را بیش از حد مطیع هنجارها می‌بیند. همچنین ادعای اینکه این رویکرد کاملاً «تاریخی نیست» و مخالفان سیاسی را می‌پوشاند، با انتقادهای دیگری مثل بی‌توجهی به تعارض و قدرت توضیح داده می‌شود.", "en": "Caveat: the lecturer says Parsons ended in 'hard determinism' denying human will. This is contested: Parsons called his theory 'voluntaristic', though critics such as Dennis Wrong argued he portrayed people as over-socialised and too obedient to norms. The wider criticism of functionalism is that it neglects history, conflict and power.", "nl": "Caveat: the lecturer says Parsons ended in 'hard determinism' denying human will. This is contested: Parsons called his theory 'voluntaristic', though critics such as Dennis Wrong argued he portrayed people as over-socialised and too obedient to norms. The wider criticism of functionalism is that it neglects history, conflict and power."}, "sources": ["src:eb66293f96"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، پارسونز می‌تواند ما را از سرزنش‌کردن مردم برحذر کند و ببیند که رفتارها از ساختار و تاریخ می‌آیند، و او نظریه‌های خودیاری را در مقابل آن می‌گذارد. این نظر شخصی سخنران است و دربارهٔ اینکه تحلیل ساختاری تا چه حد مسئولیت فردی را کنار می‌گذارد، دیدگاه مخالف هم وجود دارد.", "en": "Per the lecturer, Parsons-style thinking guards against blaming ordinary people by showing behaviour arises from structure and history, in contrast to self-help writing. This is the lecturer's own view; others argue structural explanation should not erase individual responsibility.", "nl": "Per the lecturer, Parsons-style thinking guards against blaming ordinary people by showing behaviour arises from structure and history, in contrast to self-help writing. This is the lecturer's own view; others argue structural explanation should not erase individual responsibility."}, "sources": ["src:ade2795cc7"], "flags": ["editor-note"]}], "links": [{"to": "soc:malinowski-functionalism", "rel": "part-of", "note": {"fa": "ادامهٔ کارکردگرایی مالینوفسکی", "en": "Continues Malinowski's functionalism", "nl": "Continues Malinowski's functionalism"}}, {"to": "soc:protestant-ethic", "rel": "see-also", "note": {"fa": "تأثیر وبر بر پارسونز", "en": "Weber's influence on Parsons", "nl": "Weber's influence on Parsons"}}, {"to": "soc:institutions-interdependence", "rel": "explains", "note": {"fa": "نگاه به نهادها به‌عنوان یک نظام", "en": "Seeing institutions as one system", "nl": "Seeing institutions as one system"}}, {"to": "soc:theory", "rel": "part-of", "note": {"fa": "در نظریهٔ جامعه‌شناختی", "en": "Within sociological theory", "nl": "Within sociological theory"}}], "people": ["core:talcott-parsons", "core:robert-k-merton", "core:alfred-radcliffe-brown", "core:ralf-dahrendorf"], "sources": ["src:013201f878", "src:58a696ccbe", "src:901aaf4f96", "src:ade2795cc7", "src:eb66293f96"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:space", "kind": "field", "title": {"fa": "شهر، مهاجرت و شبکه", "en": "City, migration & networks", "nl": "Stad, migratie & netwerken"}, "aliases": [], "parent": "soc:soc", "field": null, "summary": {"fa": "زندگی شهری، حرکت مردم و شبکه‌هایی که ایده‌ها و رفتارها در آن پخش می‌شوند.", "en": "Urban life, the movement of people and the networks through which ideas and behaviours spread.", "nl": "Stedelijk leven, de beweging van mensen en de netwerken waarlangs ideeën en gedrag zich verspreiden."}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:institutions-interdependence", "kind": "concept", "title": {"fa": "وابستگی متقابل نهادهای اجتماعی و توسعه", "en": "The interdependence of social institutions and development", "nl": "Onderlinge afhankelijkheid van sociale instituties en ontwikkeling"}, "aliases": [], "parent": "soc:institutions", "field": "soc:institutions", "summary": {"fa": "از نگاه کارکردگرایانه، خانواده، آموزش، اقتصاد، سیاست، دین، رسانه و ورزش تکه‌های یک نظام‌اند و هیچ‌کدام به‌تنهایی نمی‌تواند بسیار جلوتر یا عقب‌تر از بقیه بماند. سخنران از این نتیجه می‌گیرد که برنامه‌های توسعهٔ بخشی که بقیه را نادیده بگیرند شکست می‌خورند و آموزش را مهم‌ترین نهاد می‌داند. این نتیجه یک فرضیهٔ قابل‌بحث است نه قانون.", "en": "From a functionalist viewpoint, family, education, economy, politics, religion, media and sport are parts of one system, so none can race far ahead of or lag far behind the rest. The lecturer concludes that sector-by-sector development plans fail and names education as the most important institution. This is a debatable hypothesis, not a law.", "nl": "Vanuit functionalistisch perspectief vormen gezin, onderwijs, economie, politiek, religie, media en sport één stelsel; ontwikkeling in één sector zonder de rest slaagt volgens de spreker niet. Dit is een discutabele stelling, geen wet."}, "points": [{"text": {"fa": "ایدهٔ اصلی: نهادها «روی یک خط» قرار دارند و به هم وابسته‌اند. سیاست یا اقتصاد قوی همراه با خانوادهٔ فروپاشیده یا آموزش ضعیف پایدار نیست، چون نهادها از هم نیرو می‌گیرند.", "en": "Core idea: institutions are interlinked, and a strong politics or economy alongside a collapsed family system or weak education is unsustainable, because institutions draw support from one another.", "nl": "Core idea: institutions are interlinked, and a strong politics or economy alongside a collapsed family system or weak education is unsustainable, because institutions draw support from one another."}, "sources": ["src:ade2795cc7", "src:58a696ccbe"], "flags": []}, {"text": {"fa": "به گفتهٔ سخنران، یکی از علل شکست برنامه‌های توسعه در ایران این است که کارشناسان هر حوزه (ورزش، اقتصاد، خانواده) آن را جدا از بقیه برنامه‌ریزی می‌کنند، و باید همه با هم بالا بروند.", "en": "Per the lecturer, one reason development plans in Iran fail is that experts in each field (sport, economy, family) plan in isolation, whereas all should improve together.", "nl": "Per the lecturer, one reason development plans in Iran fail is that experts in each field (sport, economy, family) plan in isolation, whereas all should improve together."}, "sources": ["src:ade2795cc7"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، آموزش مهم‌ترین نهاد است چون می‌تواند در بقیه نهادها پخش شود و آن‌ها را هماهنگ کند. این نظر شخصی اوست؛ دیدگاه‌های رقیب اقتصاد یا نهادهای سیاسی را اولویت می‌دهند، مثلاً تحلیل نهادهای فراگیر و بهره‌کش.", "en": "Per the lecturer, education is the most important institution because it can spread into the others and coordinate them. This is his own view; rival accounts prioritise the economy or political institutions, such as the inclusive-versus-extractive institutions argument.", "nl": "Per the lecturer, education is the most important institution because it can spread into the others and coordinate them. This is his own view; rival accounts prioritise the economy or political institutions, such as the inclusive-versus-extractive institutions argument."}, "sources": ["src:ade2795cc7"], "flags": ["editor-note"]}, {"text": {"fa": "تذکر: مثال المپیک (کشورهای ثروتمند و پیشرفته مدال می‌برند، پس ورزش نشان اقتصاد و آموزش است) ساده‌شده است. پژوهش‌ها نشان می‌دهد موفقیت المپیکی بیشتر با جمعیت و درآمد کشور، میزبانی و سرمایه‌گذاری دولتی در ورزش مرتبط است. کشورهایی مانند آلمان شرقی و شوروی در ورزش بسیار موفق بودند بی‌آنکه اقتصاد یا سطح رفاه برجسته‌ای داشته باشند، که با ادعای «همه با هم بالا می‌روند» جور نیست.", "en": "Caveat: the Olympic example (rich, developed states win medals, so sport mirrors economy and education) is simplified. Research ties Olympic success mainly to population, income, hosting and state investment in sport, and East Germany and the Soviet Union excelled at sport without matching prosperity, which fits poorly with 'everything rises together'. The claim that interest rates explain a country's sporting weakness is a rhetorical flourish, not a finding.", "nl": "Caveat: the Olympic example (rich, developed states win medals, so sport mirrors economy and education) is simplified. Research ties Olympic success mainly to population, income, hosting and state investment in sport, and East Germany and the Soviet Union excelled at sport without matching prosperity, which fits poorly with 'everything rises together'. The claim that interest rates explain a country's sporting weakness is a rhetorical flourish, not a finding."}, "sources": ["src:61f4ee0e09"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "تذکر: نگاه کل‌گرایانه به نهادها می‌تواند به سکون نظام و بی‌توجهی به تعارض منتهی شود؛ منتقدان (دارندورف، نظریهٔ کشمکش) می‌گویند عدم‌توازن و رقابت گروه‌ها خود موتور تغییر است و توسعهٔ ناهمگون در عمل بسیار دیده شده است.", "en": "Caveat: a holistic view of institutions can slide into stasis and ignore conflict; critics (Dahrendorf, conflict theory) argue that imbalance and group rivalry are themselves engines of change, and uneven development is widely observed in practice.", "nl": "Caveat: a holistic view of institutions can slide into stasis and ignore conflict; critics (Dahrendorf, conf
