<!doctype html>
<html lang="fa" dir="rtl">
<head>

<title>جامعه — دانش‌سرا</title>
<link rel="stylesheet" href="../core/design/tokens.css">
<style>
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);min-height:var(--header-h)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--ink)}
.brand svg{width:26px;height:26px;color:var(--primary)}
.crumbs{font-size:var(--small);color:var(--ink-2)}.crumbs a{color:var(--ink-2)}
.lang{display:flex;gap:2px;border:1px solid var(--line-strong);border-radius:var(--r-full);padding:2px}
.lang button{font:inherit;font-size:var(--chip);padding:4px 10px;border:0;border-radius:var(--r-full);background:transparent;color:var(--ink-2);cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
main{padding-block:var(--s6) var(--s16)}
.hero{display:grid;gap:var(--s3);margin-bottom:var(--s6)}
.hero h1{margin:0}
.hero p{color:var(--ink-2);font-size:1.05rem;max-width:70ch;margin:0}
.draft{display:inline-flex;align-items:center;gap:8px;font-size:var(--chip);padding:4px 12px;border-radius:var(--r-full);background:var(--warn-bg,#FBF1D9);color:var(--warn-ink,#6B4E00);border:1px solid var(--warn-line,#E8D39A)}
.search{display:flex;gap:8px;margin:var(--s4) 0}
.search input{font:inherit;flex:1;min-width:0;padding:10px 14px;border-radius:var(--r-md);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink)}
.fields{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:var(--s6)}
.fields button{font:inherit;font-size:var(--small);padding:6px 14px;border-radius:var(--r-full);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer}
.fields button[aria-pressed=true]{background:var(--primary);color:#fff;border-color:var(--primary)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--s4)}
.grid .card{padding:var(--s5);display:grid;gap:8px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.grid .card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.grid h3{margin:0;font-size:var(--h4)}
.grid p{margin:0;color:var(--ink-2);font-size:var(--small);line-height:1.75;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.kick{font-size:var(--chip);color:var(--primary);font-weight:700}
.sub{color:var(--ink-3);font-size:var(--small);direction:ltr;text-align:start;unicode-bidi:isolate}
[dir=rtl] .sub{text-align:right}
.fsec{margin-bottom:var(--s8)} .fsec h2{font-size:var(--h3);margin:0 0 var(--s1)} .fsec>p{margin:0 0 var(--s4);color:var(--ink-2);max-width:70ch}
article.detail{display:grid;gap:var(--s5);max-width:78ch}
article.detail h1{margin:0}
article.detail .lead{font-size:1.1rem;line-height:1.9;margin:0}
.back{font:inherit;font-size:var(--small);border:0;background:transparent;color:var(--primary);cursor:pointer;padding:0;text-align:start}
.pts{display:grid;gap:var(--s3);margin:0;padding:0;list-style:none}
.pts li{padding:var(--s4) var(--s5);border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);line-height:1.85;position:relative}
.pts li .ref{font-size:var(--chip);color:var(--ink-3);display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.flag{font-size:var(--chip);padding:1px 8px;border-radius:var(--r-full);border:1px solid}
.flag.unreplicated{color:#8A2E2E;border-color:#E3B4B4;background:#FBEDED}
.flag.contested{color:#6B4E00;border-color:#E8D39A;background:#FBF1D9}
.flag.dated{color:var(--ink-2);border-color:var(--line-strong)}
.flag.editor-note{color:var(--primary);border-color:var(--primary)}
h2.sec{font-size:var(--small);color:var(--ink-2);font-weight:600;margin:var(--s2) 0 0;text-transform:uppercase;letter-spacing:.04em}
.links{display:grid;gap:6px}
.links a{display:flex;gap:10px;align-items:baseline;padding:8px 12px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--ink)}
.links a:hover{border-color:var(--primary)}
.links .rel{font-size:var(--chip);color:var(--primary);min-width:7em}
.links .nt{font-size:var(--small);color:var(--ink-2)}
.links .ext{font-size:var(--chip);color:var(--ink-3)}
.ppl{display:flex;flex-wrap:wrap;gap:6px}
.ppl span{font-size:var(--small);padding:4px 10px;border-radius:var(--r-full);border:1px solid var(--line-strong);background:var(--surface)}
.ppl small{color:var(--ink-3)}
.iran{border-inline-start:4px solid var(--primary);padding:var(--s4) var(--s5);border-radius:var(--r-md);background:var(--surface);display:grid;gap:8px}
.iran .q{font-weight:700}
.grade{display:inline-block;font-size:var(--chip);padding:1px 8px;border-radius:var(--r-full);background:var(--ink);color:var(--paper)}
ol.src{direction:ltr;text-align:left;padding-inline-start:1.4em;margin:0;display:grid;gap:6px;font-size:var(--small);color:var(--ink-2);line-height:1.7}
ol.src a{color:var(--primary)}
.status{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:var(--small);color:var(--ink-3)}
footer.foot{border-top:1px solid var(--line);padding-block:var(--s8);color:var(--ink-3);font-size:var(--small)}
@media (prefers-color-scheme: dark){:root:not([data-theme=light]) .flag.unreplicated{background:#3A1F1F;color:#F2B8B8;border-color:#6B3A3A} :root:not([data-theme=light]) .flag.contested,:root:not([data-theme=light]) .draft{background:#3A3010;color:#F0D78A;border-color:#6B5A2A}}
:root[data-theme=dark] .flag.unreplicated{background:#3A1F1F;color:#F2B8B8;border-color:#6B3A3A} :root[data-theme=dark] .flag.contested,:root[data-theme=dark] .draft{background:#3A3010;color:#F0D78A;border-color:#6B5A2A}
</style>

<script>
const D = {"wiki": "soc", "order": ["soc:theory", "soc:cohesion", "soc:inequality", "soc:institutions", "soc:collective", "soc:values", "soc:space", "soc:demography"], "concepts": [{"id": "soc:preference-falsification", "kind": "concept", "title": {"fa": "تحریف ترجیحات و غافلگیری انقلاب‌ها", "en": "Preference falsification and the surprise of revolutions", "nl": "Voorkeursvervalsing en de verrassing van revoluties"}, "aliases": [], "parent": "soc:collective", "field": "soc:collective", "summary": {"fa": "وقتی ابراز مخالفت هزینه دارد، مردم در جمع چیزی می‌گویند که باور ندارند؛ پس هیچ‌کس نمی‌داند چند نفر مثل او فکر می‌کنند، حتی حکومت. یک جرقهٔ کوچک می‌تواند آستانه‌های پنهان را پشت سر هم بیندازد و رژیمی که دیروز پایدار می‌نمود امروز فرو بریزد. برای همین انقلاب‌ها، از جمله ۱۳۵۷، همیشه «تصورناپذیر» بوده‌اند.", "en": "When expressing dissent is costly, people say in public what they do not believe; so no one knows how many think like them, not even the regime. A small spark can trip hidden thresholds in a cascade, and a regime that looked stable yesterday collapses today. That is why revolutions, including 1979, were always \"unthinkable\".", "nl": "Wanneer afwijkende meningen uiten kostbaar is, zeggen mensen in het openbaar wat ze niet geloven; dus weet niemand hoeveel anderen zo denken, zelfs het regime niet. Een kleine vonk kan verborgen drempels in een cascade doen omslaan, en een regime dat gisteren stabiel leek, stort vandaag in. Daarom waren revoluties, ook die van 1979, altijd \"ondenkbaar\"."}, "points": [{"text": {"fa": "کوران (۱۹۹۱): هر فرد آستانه‌ای دارد («وقتی این‌قدر نفر بیرون باشند، من هم می‌آیم»)؛ توزیع این آستانه‌ها پنهان است، پس هم ثبات ظاهری و هم فروپاشی ناگهانی هر دو قابل توضیح‌اند و پیش‌بینی ساختاری ناممکن است.", "en": "Kuran (1991): each person has a threshold (\"when this many are out, I join\"); the distribution of thresholds is hidden, so both apparent stability and sudden collapse are explicable and structural prediction is impossible.", "nl": "Kuran (1991): each person has a threshold (\"when this many are out, I join\"); the distribution of thresholds is hidden, so both apparent stability and sudden collapse are explicable and structural prediction is impossible."}, "sources": ["src:8d71ed0d5f"], "flags": []}, {"text": {"fa": "کرزمن (۲۰۰۴): انقلاب ایران را نه ساختارها (اقتصاد، دولت، دین) که «تجربهٔ زیستهٔ» مردم توضیح می‌دهد: تا پاییز ۱۳۵۷ اکثریت انقلاب را ممکن نمی‌دانستند و درست وقتی ممکن شد که مردم دیدند دیگران هم به خیابان آمده‌اند. ناجنبش‌های بیات و آبشار کوران در همین‌جا به هم می‌رسند.", "en": "Kurzman (2004): the Iranian revolution is explained less by structures (economy, state, religion) than by people's \"lived experience\": until autumn 1978 most thought revolution impossible, and it became possible exactly when people saw others in the street. Bayat's nonmovements and Kuran's cascade meet here.", "nl": "Kurzman (2004): the Iranian revolution is explained less by structures (economy, state, religion) than by people's \"lived experience\": until autumn 1978 most thought revolution impossible, and it became possible exactly when people saw others in the street. Bayat's nonmovements and Kuran's cascade meet here."}, "sources": ["src:435917f7dd"], "flags": []}], "links": [{"to": "soc:social-movements", "rel": "explains", "note": {"fa": "پویایی بسیج", "en": "The dynamics of mobilisation", "nl": "The dynamics of mobilisation"}}, {"to": "psy:norm-psychology", "rel": "bridges", "note": {"fa": "روان‌شناسی هنجار و ناآگاهی جمعی", "en": "Norm psychology and pluralistic ignorance", "nl": "Norm psychology and pluralistic ignorance"}}, {"to": "psy:conspiracy", "rel": "see-also", "note": {"fa": "باور و اطلاعات در جامعهٔ بسته", "en": "Belief and information in a closed society", "nl": "Belief and information in a closed society"}}], "people": ["core:timur-kuran", "core:charles-kurzman"], "sources": ["src:435917f7dd", "src:8d71ed0d5f"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:soc", "kind": "root", "title": {"fa": "جامعه", "en": "Society", "nl": "Samenleving"}, "aliases": [], "parent": null, "field": null, "summary": {"fa": "چرا آدم‌ها در جمع طوری رفتار می‌کنند که هیچ‌کدام به‌تنهایی نمی‌کردند؟ این ویکی مفاهیم جامعه‌شناسی را با شواهد پیمایشی و تجربی کنار هم می‌گذارد: اعتماد و سرمایهٔ اجتماعی، نابرابری، نهادها، کنش جمعی، ارزش‌ها و نسل‌ها، شهر و مهاجرت، شبکه‌ها؛ با نگاهی ویژه به داده‌های ایران.", "en": "Why do people in groups behave in ways none of them would alone? This wiki brings sociology's concepts together with survey and experimental evidence: trust and social capital, inequality, institutions, collective action, values and generations, city and migration, networks; with special attention to data on Iran.", "nl": "Waarom gedragen mensen zich in groepen zoals geen van hen alleen zou doen? Deze wiki brengt de concepten van de sociologie samen met survey- en experimenteel bewijs: vertrouwen en sociaal kapitaal, ongelijkheid, instituties, collectieve actie, waarden en generaties, stad en migratie, netwerken; met bijzondere aandacht voor data over Iran."}, "points": [], "links": [{"to": "psy:p-social", "rel": "bridges", "note": {"fa": "روان‌شناسی اجتماعی در ویکی روان", "en": "Social psychology in the psychology wiki", "nl": "Social psychology in the psychology wiki"}}, {"to": "psy:social-capital", "rel": "bridges", "note": {"fa": "سرمایهٔ اجتماعی در ویکی روان", "en": "Social capital in the psychology wiki", "nl": "Social capital in the psychology wiki"}}, {"to": "psy:anomie", "rel": "bridges", "note": {"fa": "آنومی در ویکی روان", "en": "Anomie in the psychology wiki", "nl": "Anomie in the psychology wiki"}}], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:demographic-transition", "kind": "concept", "title": {"fa": "گذار جمعیتی", "en": "The demographic transition", "nl": "De demografische transitie"}, "aliases": [], "parent": "soc:demography", "field": "soc:demography", "summary": {"fa": "همهٔ جوامع از «مرگ‌ومیر بالا، زادوولد بالا» به «هر دو پایین» می‌روند؛ در فاصلهٔ این دو، جمعیت چند برابر می‌شود. اروپا این راه را در دو قرن رفت؛ ایران در دو دهه.", "en": "Every society moves from \"high mortality, high fertility\" to \"both low\"; in between, population multiplies. Europe took two centuries; Iran took two decades.", "nl": "Elke samenleving gaat van \"hoge sterfte, hoge vruchtbaarheid\" naar \"beide laag\"; daartussen vermenigvuldigt de bevolking zich. Europa deed er twee eeuwen over; Iran twee decennia."}, "points": [{"text": {"fa": "لی (۲۰۰۳): از ۱۸۰۰ تا ۲۱۰۰ جمعیت جهان از یک به حدود ده میلیارد می‌رسد و امید به زندگی از حدود ۳۰ به بالای ۸۰ سال؛ گذار با افت مرگ‌ومیر کودکان آغاز می‌شود و افت باروری یک تا دو نسل بعد می‌آید.", "en": "Lee (2003): from 1800 to 2100 world population rises from one to about ten billion and life expectancy from about 30 to over 80; the transition starts with falling child mortality, and fertility falls one or two generations later.", "nl": "Lee (2003): from 1800 to 2100 world population rises from one to about ten billion and life expectancy from about 30 to over 80; the transition starts with falling child mortality, and fertility falls one or two generations later."}, "sources": ["src:78add04b88"], "flags": []}, {"text": {"fa": "«پنجرهٔ جمعیتی»: وقتی باروری افتاده ولی سالمندی هنوز نرسیده، سهم جمعیت در سن کار بیشینه است؛ اگر اشتغال و آموزش فراهم باشد سود جمعیتی می‌دهد، وگرنه بیکاری جوانان. ایران از دههٔ ۱۳۸۰ در این پنجره است.", "en": "The \"demographic window\": when fertility has fallen but ageing has not yet arrived, the working-age share peaks; with jobs and schooling it yields a demographic dividend, otherwise youth unemployment. Iran has been in this window since the 2000s.", "nl": "The \"demographic window\": when fertility has fallen but ageing has not yet arrived, the working-age share peaks; with jobs and schooling it yields a demographic dividend, otherwise youth unemployment. Iran has been in this window since the 2000s."}, "sources": ["src:6f9476e1dd"], "flags": []}], "links": [{"to": "soc:iran-fertility", "rel": "applies-to", "note": {"fa": "نمونهٔ ایران", "en": "The Iranian case", "nl": "The Iranian case"}}, {"to": "tabar:common-ancestors", "rel": "bridges", "note": {"fa": "ریاضی نسل‌ها", "en": "The mathematics of generations", "nl": "The mathematics of generations"}}], "people": [], "sources": ["src:6f9476e1dd", "src:78add04b88"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:institutions-inclusive", "kind": "concept", "title": {"fa": "نهادهای فراگیر و بهره‌کش", "en": "Inclusive and extractive institutions", "nl": "Inclusieve en extractieve instituties"}, "aliases": [], "parent": "soc:institutions", "field": "soc:institutions", "summary": {"fa": "چرا ملت‌ها شکست می‌خورند؟ عجم‌اوغلو و رابینسون: نه جغرافیا و نه فرهنگ، بلکه نهادهای سیاسی و اقتصادی. نهاد فراگیر به اکثریت اجازهٔ مشارکت و مالکیت امن می‌دهد؛ نهاد بهره‌کش ثروت را از اکثریت به اقلیت حاکم منتقل می‌کند و نوآوری را، چون قدرت را تهدید می‌کند، سرکوب.", "en": "Why do nations fail? Acemoglu and Robinson: neither geography nor culture, but political and economic institutions. Inclusive institutions let the majority participate and hold property securely; extractive ones move wealth from the majority to a ruling minority and suppress innovation because it threatens power.", "nl": "Waarom falen naties? Acemoglu en Robinson: niet geografie of cultuur, maar politieke en economische instituties. Inclusieve instituties laten de meerderheid deelnemen en veilig bezitten; extractieve verplaatsen rijkdom van de meerderheid naar een heersende minderheid en onderdrukken innovatie omdat ze de macht bedreigt."}, "points": [{"text": {"fa": "نورث (۱۹۹۰): نهادها «قواعد بازی»اند، رسمی و غیررسمی، و با کاهش عدم قطعیت هزینهٔ مبادله را پایین می‌آورند؛ وابستگی به مسیر توضیح می‌دهد چرا نهادهای ناکارآمد دوام می‌آورند.", "en": "North (1990): institutions are the \"rules of the game\", formal and informal, lowering transaction costs by reducing uncertainty; path dependence explains why inefficient institutions persist.", "nl": "North (1990): institutions are the \"rules of the game\", formal and informal, lowering transaction costs by reducing uncertainty; path dependence explains why inefficient institutions persist."}, "sources": ["src:9064c99339"], "flags": []}, {"text": {"fa": "عجم‌اوغلو، جانسون و رابینسون (۲۰۰۱): با مرگ‌ومیر مهاجران اروپایی به‌عنوان متغیر ابزاری نشان دادند مستعمره‌هایی که اروپاییان در آن ساکن شدند نهادهای فراگیر و امروز درآمد بالاتر دارند. مقاله‌ای بنیادین که داده‌های مرگ‌ومیرش را آلبوی (۲۰۱۲) زیر سؤال برد؛ نوبل اقتصاد ۲۰۲۴ به همین پژوهش داده شد.", "en": "Acemoglu, Johnson and Robinson (2001): using European settler mortality as an instrument, showed colonies where Europeans settled got inclusive institutions and higher incomes today. A foundational paper whose mortality data Albouy (2012) questioned; the 2024 Nobel in economics went to this research.", "nl": "Acemoglu, Johnson and Robinson (2001): using European settler mortality as an instrument, showed colonies where Europeans settled got inclusive institutions and higher incomes today. A foundational paper whose mortality data Albouy (2012) questioned; the 2024 Nobel in economics went to this research."}, "sources": ["src:d27c5710a2", "src:2079f7c2a8"], "flags": ["contested"]}, {"text": {"fa": "نفت نمونهٔ کلاسیک «نفرین منابع» است: درآمدی که بی‌نیاز از مالیات شهروندان است، پاسخ‌گویی را کم و نهادهای بهره‌کش را پایدار می‌کند؛ این الگو برای ایران بسیار بحث شده است.", "en": "Oil is the classic \"resource curse\": revenue that needs no taxation of citizens lowers accountability and stabilises extractive institutions; this pattern has been much debated for Iran.", "nl": "Oil is the classic \"resource curse\": revenue that needs no taxation of citizens lowers accountability and stabilises extractive institutions; this pattern has been much debated for Iran."}, "sources": ["src:dc6b74b89e"], "flags": ["editor-note"]}], "links": [{"to": "soc:generalized-trust", "rel": "explains", "note": {"fa": "فساد، نهادها و اعتماد", "en": "Corruption, institutions and trust", "nl": "Corruption, institutions and trust"}}, {"to": "soc:collective-action", "rel": "see-also", "note": {"fa": "چگونه نهادها تغییر می‌کنند", "en": "How institutions change", "nl": "How institutions change"}}, {"to": "psy:human-progress", "rel": "bridges", "note": {"fa": "پیشرفت انسانی در ویکی روان", "en": "Human progress in the psychology wiki", "nl": "Human progress in the psychology wiki"}}], "people": ["core:daron-acemoglu", "core:douglass-north"], "sources": ["src:2079f7c2a8", "src:9064c99339", "src:d27c5710a2", "src:dc6b74b89e"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:cohesion", "kind": "field", "title": {"fa": "انسجام، اعتماد و سرمایهٔ اجتماعی", "en": "Cohesion, trust & social capital", "nl": "Cohesie, vertrouwen & sociaal kapitaal"}, "aliases": [], "parent": "soc:soc", "field": null, "summary": {"fa": "چه چیزی جامعه را کنار هم نگه می‌دارد و وقتی می‌شکند چه می‌شود؟", "en": "What holds a society together, and what happens when it breaks?", "nl": "Wat houdt een samenleving bijeen, en wat gebeurt er als het breekt?"}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:theory", "kind": "field", "title": {"fa": "نظریهٔ اجتماعی", "en": "Social theory", "nl": "Sociale theorie"}, "aliases": [], "parent": "soc:soc", "field": null, "summary": {"fa": "ابزارهای فکری پایه: از بینش جامعه‌شناختی تا ساخت اجتماعی واقعیت و نمایش خود.", "en": "The basic thinking tools: from the sociological imagination to the social construction of reality and the presentation of self.", "nl": "De basisdenkgereedschappen: van de sociologische verbeelding tot de sociale constructie van de werkelijkheid en de presentatie van het zelf."}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:social-movements", "kind": "concept", "title": {"fa": "جنبش‌های اجتماعی و سیاست اعتراضی", "en": "Social movements and contentious politics", "nl": "Sociale bewegingen en contentieuze politiek"}, "aliases": [], "parent": "soc:collective", "field": "soc:collective", "summary": {"fa": "جنبش، کارزاری پایدار با نمایش «ارزشمندی، وحدت، تعداد و تعهد» است. چه چیزی جنبش می‌سازد؟ نارضایتی همیشه هست؛ فرق را منابع، فرصت‌های سیاسی و «قاب‌بندی» می‌گذارند. و شواهد کمّی می‌گویند مقاومت بی‌خشونت تاریخاً بیش از مسلحانه به نتیجه رسیده، هرچند نرخ موفقیتش در دههٔ اخیر افت کرده.", "en": "A movement is a sustained campaign displaying \"worthiness, unity, numbers and commitment\". What makes one? Grievance is always there; resources, political opportunities and \"framing\" make the difference. And the quantitative evidence says nonviolent resistance has historically succeeded more often than armed struggle, though its success rate has fallen in the last decade.", "nl": "Een beweging is een volgehouden campagne die \"waardigheid, eenheid, aantallen en toewijding\" toont. Wat maakt haar? Grieven zijn er altijd; middelen, politieke kansen en \"framing\" maken het verschil. En het kwantitatieve bewijs zegt dat geweldloos verzet historisch vaker slaagde dan gewapende strijd, al is het slagingspercentage het laatste decennium gedaald."}, "points": [{"text": {"fa": "تیلی (۲۰۰۴) و تارو (۲۰۱۱): «رپرتوار اعتراض» (تظاهرات، اعتصاب، طومار) اختراع مدرن است و با دولت ملی و رسانه رشد کرد؛ چرخه‌های اعتراض با باز شدن فرصت سیاسی اوج می‌گیرند و با سرکوب یا نهادینه شدن فرو می‌نشینند.", "en": "Tilly (2004) and Tarrow (2011): the \"repertoire of contention\" (demonstration, strike, petition) is a modern invention that grew with the nation-state and media; cycles of protest peak as political opportunity opens and subside with repression or institutionalisation.", "nl": "Tilly (2004) and Tarrow (2011): the \"repertoire of contention\" (demonstration, strike, petition) is a modern invention that grew with the nation-state and media; cycles of protest peak as political opportunity opens and subside with repression or institutionalisation."}, "sources": ["src:b59a77572e", "src:cebd699d72"], "flags": []}, {"text": {"fa": "چنووت و استفان (۲۰۱۱، ۳۲۳ کارزار ۱۹۰۰–۲۰۰۶): کارزارهای بی‌خشونت ۵۳ درصد و مسلحانه ۲۶ درصد موفق بودند؛ هیچ کارزاری با مشارکت فعال ۳٫۵ درصد جمعیت شکست نخورد. چنووت (۲۰۲۱): از ۲۰۱۰ نرخ موفقیت بی‌خشونت به زیر ۳۵ درصد افتاده؛ «قاعدهٔ ۳٫۵ درصد» توصیفی است نه تضمین.", "en": "Chenoweth and Stephan (2011, 323 campaigns 1900–2006): nonviolent campaigns succeeded 53 percent of the time, armed ones 26 percent; no campaign with active participation of 3.5 percent of the population failed. Chenoweth (2021): since 2010 nonviolent success has fallen below 35 percent; the \"3.5 percent rule\" is descriptive, not a guarantee.", "nl": "Chenoweth and Stephan (2011, 323 campaigns 1900–2006): nonviolent campaigns succeeded 53 percent of the time, armed ones 26 percent; no campaign with active participation of 3.5 percent of the population failed. Chenoweth (2021): since 2010 nonviolent success has fallen below 35 percent; the \"3.5 percent rule\" is descriptive, not a guarantee."}, "sources": ["src:41c1e6a2e7", "src:040033aaf5"], "flags": ["contested"]}, {"text": {"fa": "بیات (۲۰۱۰) برای خاورمیانه مفهوم «ناجنبش» را ساخت: تغییر آرام و پراکندهٔ زندگی روزمره توسط میلیون‌ها نفر معمولی (پوشش، کار غیررسمی، حضور زنان در فضای عمومی) که رهبر و سازمان ندارد ولی مرزها را جابه‌جا می‌کند؛ «پیشروی آرام مردم عادی».", "en": "Bayat (2010) coined \"nonmovements\" for the Middle East: the quiet, dispersed change of everyday life by millions of ordinary people (dress, informal work, women's presence in public space) with no leader or organisation, yet shifting boundaries; \"the quiet encroachment of the ordinary\".", "nl": "Bayat (2010) coined \"nonmovements\" for the Middle East: the quiet, dispersed change of everyday life by millions of ordinary people (dress, informal work, women's presence in public space) with no leader or organisation, yet shifting boundaries; \"the quiet encroachment of the ordinary\"."}, "sources": ["src:248ed932c7"], "flags": []}], "links": [{"to": "soc:preference-falsification", "rel": "explains", "note": {"fa": "چرا بسیج ناگهانی است", "en": "Why mobilisation is sudden", "nl": "Why mobilisation is sudden"}}, {"to": "soc:collective-action", "rel": "prerequisite", "note": {"fa": "مسئلهٔ کنش جمعی", "en": "The collective action problem", "nl": "The collective action problem"}}, {"to": "psy:polarization", "rel": "bridges", "note": {"fa": "قطبی شدن در ویکی روان", "en": "Polarization in the psychology wiki", "nl": "Polarization in the psychology wiki"}}], "people": ["core:charles-tilly", "core:erica-chenoweth", "core:asef-bayat"], "sources": ["src:040033aaf5", "src:248ed932c7", "src:41c1e6a2e7", "src:b59a77572e", "src:cebd699d72"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:generalized-trust", "kind": "concept", "title": {"fa": "اعتماد تعمیم‌یافته", "en": "Generalised trust", "nl": "Gegeneraliseerd vertrouwen"}, "aliases": [], "parent": "soc:cohesion", "field": "soc:cohesion", "summary": {"fa": "پاسخ به یک سؤال ساده: «به‌طور کلی می‌شود به بیشتر مردم اعتماد کرد یا باید خیلی مراقب بود؟» این عدد میان کشورها از زیر ۱۰ تا بالای ۶۰ درصد فرق می‌کند، دهه‌ها پایدار می‌ماند، و با رشد اقتصادی، سلامت و کیفیت حکمرانی همبسته است. در ایران پایین است.", "en": "The answer to one simple question: \"Generally speaking, can most people be trusted, or must one be very careful?\" It ranges from under 10 to over 60 percent across countries, stays stable for decades, and correlates with growth, health and quality of government. In Iran it is low.", "nl": "Het antwoord op één eenvoudige vraag: \"Kunnen de meeste mensen over het algemeen worden vertrouwd, of moet men heel voorzichtig zijn?\" Het loopt tussen landen van onder de 10 tot boven de 60 procent, blijft decennialang stabiel en hangt samen met groei, gezondheid en bestuurskwaliteit. In Iran is het laag."}, "points": [{"text": {"fa": "روتشتاین و اوسلانر (۲۰۰۵): برابری (اقتصادی و فرصتی) و نبود فساد قوی‌ترین پیش‌بینی‌کننده‌های اعتماد تعمیم‌یافته‌اند؛ نابرابری اعتماد را می‌خورد و بی‌اعتمادی سیاست‌های برابرساز را ناممکن می‌کند: تلهٔ اجتماعی.", "en": "Rothstein and Uslaner (2005): equality (economic and of opportunity) and absence of corruption are the strongest predictors of generalised trust; inequality eats trust and distrust makes equalising policies impossible: a social trap.", "nl": "Rothstein and Uslaner (2005): equality (economic and of opportunity) and absence of corruption are the strongest predictors of generalised trust; inequality eats trust and distrust makes equalising policies impossible: a social trap."}, "sources": ["src:d4458872cb"], "flags": []}, {"text": {"fa": "آلگان و کاهوک (۲۰۱۰): با اعتماد ارثی مهاجران آمریکایی (بر حسب کشور مبدأ) نشان دادند اعتماد علّتِ رشد است نه فقط معلولش؛ اگر اعتماد آفریقا در سطح سوئد بود، درآمد سرانه‌اش چند برابر بود.", "en": "Algan and Cahuc (2010): using the inherited trust of US immigrants (by country of origin) they showed trust causes growth, not only follows it; had Africa Sweden's trust level, its income per head would be several times higher.", "nl": "Algan and Cahuc (2010): using the inherited trust of US immigrants (by country of origin) they showed trust causes growth, not only follows it; had Africa Sweden's trust level, its income per head would be several times higher."}, "sources": ["src:196ab6bdb8"], "flags": ["contested"]}, {"text": {"fa": "در پیمایش جهانی ارزش‌ها، اعتماد تعمیم‌یافتهٔ ایرانیان در موج‌های اخیر در حدود ۱۰ تا ۱۵ درصد و در ردهٔ کشورهای کم‌اعتماد است؛ در پیمایش ملی ارزش‌ها و نگرش‌ها نیز اعتماد به «مردم» از موج اول تا سوم کاهش نشان می‌دهد.", "en": "In the World Values Survey, Iranians' generalised trust in recent waves is around 10 to 15 percent, among the low-trust countries; the national Values and Attitudes survey also shows trust in \"people\" falling from the first to the third wave.", "nl": "In the World Values Survey, Iranians' generalised trust in recent waves is around 10 to 15 percent, among the low-trust countries; the national Values and Attitudes survey also shows trust in \"people\" falling from the first to the third wave."}, "sources": ["src:4a310ccbde", "src:95287955fe"], "flags": []}], "links": [{"to": "psy:social-trust", "rel": "same-as", "note": {"fa": "اعتماد اجتماعی در ویکی روان (درس اعتماد)", "en": "Social trust in the psychology wiki (the trust lecture)", "nl": "Social trust in the psychology wiki (the trust lecture)"}}, {"to": "soc:inequality-health", "rel": "explains", "note": {"fa": "نابرابری چگونه اعتماد را می‌خورد", "en": "How inequality eats trust", "nl": "How inequality eats trust"}}, {"to": "soc:institutions-inclusive", "rel": "see-also", "note": {"fa": "فساد و نهادها", "en": "Corruption and institutions", "nl": "Corruption and institutions"}}], "people": [], "sources": ["src:196ab6bdb8", "src:4a310ccbde", "src:95287955fe", "src:d4458872cb"], "booklets": [], "origin": null, "iran": "iran:social-trust", "wikidata": null, "status": "draft"}, {"id": "soc:inequality-health", "kind": "concept", "title": {"fa": "نابرابری و سلامت جامعه", "en": "Inequality and the health of society", "nl": "Ongelijkheid en de gezondheid van de samenleving"}, "aliases": [], "parent": "soc:inequality", "field": "soc:inequality", "summary": {"fa": "ویلکینسون و پیکت ادعا کردند در کشورهای ثروتمند، نه ثروت که نابرابری است که با امید به زندگی، اعتماد، جرم، سلامت روان و چاقی همبسته است. تز پرنفوذی که داده‌هایش را منتقدان جدی به چالش کشیده‌اند؛ همبستگی هست، علیت و اندازه محل بحث است.", "en": "Wilkinson and Pickett claimed that among rich countries it is inequality, not wealth, that correlates with life expectancy, trust, crime, mental health and obesity. An influential thesis whose data serious critics have challenged; the correlation exists, causation and magnitude are debated.", "nl": "Wilkinson en Pickett stelden dat onder rijke landen niet rijkdom maar ongelijkheid samenhangt met levensverwachting, vertrouwen, criminaliteit, mentale gezondheid en obesitas. Een invloedrijke these waarvan serieuze critici de data hebben aangevochten; de correlatie bestaat, causaliteit en omvang zijn omstreden."}, "points": [{"text": {"fa": "«تراز روح» (۲۰۰۹): در ۲۳ کشور ثروتمند و ۵۰ ایالت آمریکا، شاخص ترکیبی مشکلات اجتماعی با نابرابری همبستگی قوی و با درآمد سرانه همبستگی ناچیز دارد؛ سازوکار پیشنهادی: استرس مقایسه و منزلت.", "en": "\"The Spirit Level\" (2009): across 23 rich countries and 50 US states, a composite index of social problems correlates strongly with inequality and barely with income per head; the proposed mechanism is status and comparison stress.", "nl": "\"The Spirit Level\" (2009): across 23 rich countries and 50 US states, a composite index of social problems correlates strongly with inequality and barely with income per head; the proposed mechanism is status and comparison stress."}, "sources": ["src:cbebbd48aa"], "flags": []}, {"text": {"fa": "نقد (ساندرز ۲۰۱۰ و دیگران): انتخاب کشورها و شاخص‌ها نتیجه را عوض می‌کند، چند همبستگی با حذف یکی دو کشور پرت از بین می‌رود، و فرهنگ و تاریخ به‌عنوان متغیر سوم کنترل نشده‌اند. فراتحلیل‌های بعدی اثر نابرابری بر سلامت را «کوچک ولی واقعی» برآورد کرده‌اند.", "en": "Critique (Saunders 2010 and others): the choice of countries and indices changes the result, several correlations vanish when one or two outliers are dropped, and culture and history are uncontrolled third variables. Later meta-analyses estimate the effect of inequality on health as \"small but real\".", "nl": "Critique (Saunders 2010 and others): the choice of countries and indices changes the result, several correlations vanish when one or two outliers are dropped, and culture and history are uncontrolled third variables. Later meta-analyses estimate the effect of inequality on health as \"small but real\"."}, "sources": ["src:9ff749e8d1"], "flags": ["contested", "editor-note"]}], "links": [{"to": "soc:generalized-trust", "rel": "explains", "note": {"fa": "نابرابری و اعتماد", "en": "Inequality and trust", "nl": "Inequality and trust"}}, {"to": "psy:n-stress", "rel": "bridges", "note": {"fa": "استرس منزلت در بدن", "en": "Status stress in the body", "nl": "Status stress in the body"}}, {"to": "soc:gini-inequality", "rel": "prerequisite", "note": {"fa": "اندازه‌گیری نابرابری", "en": "Measuring inequality", "nl": "Measuring inequality"}}], "people": ["core:richard-wilkinson"], "sources": ["src:9ff749e8d1", "src:cbebbd48aa"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:gini-inequality", "kind": "concept", "title": {"fa": "اندازه‌گیری نابرابری: ضریب جینی و فراتر از آن", "en": "Measuring inequality: the Gini and beyond", "nl": "Ongelijkheid meten: de Gini en verder"}, "aliases": [], "parent": "soc:inequality", "field": "soc:inequality", "summary": {"fa": "جینی صفر یعنی همه برابر، یک یعنی همه‌چیز دست یک نفر. ایران در دههٔ اخیر حدود ۰٫۴۰ است: بالاتر از اروپا، نزدیک ترکیه و آمریکا، پایین‌تر از آمریکای لاتین. ولی جینی سهم «یک درصد بالا» و ثروت (نه درآمد) را پنهان می‌کند.", "en": "A Gini of zero means everyone equal, one means everything in one hand. Iran in the last decade is about 0.40: higher than Europe, near Turkey and the US, lower than Latin America. But the Gini hides the \"top one percent\" share and wealth (as opposed to income).", "nl": "Een Gini van nul betekent iedereen gelijk, één betekent alles in één hand. Iran zit het laatste decennium rond 0,40: hoger dan Europa, dicht bij Turkije en de VS, lager dan Latijns-Amerika. Maar de Gini verbergt het aandeel van de \"top één procent\" en vermogen (tegenover inkomen)."}, "points": [{"text": {"fa": "بانک جهانی: جینی درآمدی ایران در سال‌های اخیر در بازهٔ ۳۸ تا ۴۲ گزارش شده؛ مرکز آمار ایران ارقام مشابهی می‌دهد و در سال‌های تورم بالا افزایش دیده می‌شود.", "en": "World Bank: Iran's income Gini in recent years is reported in the 38 to 42 range; the Statistical Centre of Iran gives similar figures, rising in high-inflation years.", "nl": "World Bank: Iran's income Gini in recent years is reported in the 38 to 42 range; the Statistical Centre of Iran gives similar figures, rising in high-inflation years."}, "sources": ["src:8a3dd521dc"], "flags": []}, {"text": {"fa": "پیکتی (۲۰۱۴): وقتی بازده سرمایه از رشد اقتصاد بیشتر باشد (r > g)، ثروت موروثی نسبت به درآمد کار بزرگ می‌شود؛ نابرابری ثروت همه‌جا بسیار بیشتر از نابرابری درآمد است.", "en": "Piketty (2014): when the return on capital exceeds economic growth (r > g), inherited wealth grows relative to earned income; wealth inequality is everywhere far larger than income inequality.", "nl": "Piketty (2014): when the return on capital exceeds economic growth (r > g), inherited wealth grows relative to earned income; wealth inequality is everywhere far larger than income inequality."}, "sources": ["src:6c0c807f94"], "flags": ["contested"]}], "links": [{"to": "soc:mobility", "rel": "see-also", "note": {"fa": "نابرابری فرصت در برابر نابرابری نتیجه", "en": "Inequality of opportunity versus of outcome", "nl": "Inequality of opportunity versus of outcome"}}, {"to": "soc:inequality-health", "rel": "see-also", "note": {"fa": "پیامدهای نابرابری", "en": "The consequences of inequality", "nl": "The consequences of inequality"}}], "people": ["core:thomas-piketty"], "sources": ["src:6c0c807f94", "src:8a3dd521dc"], "booklets": [], "origin": null, "iran": "iran:gini", "wikidata": null, "status": "draft"}, {"id": "soc:collective", "kind": "field", "title": {"fa": "کنش جمعی و جنبش‌ها", "en": "Collective action & movements", "nl": "Collectieve actie & bewegingen"}, "aliases": [], "parent": "soc:soc", "field": null, "summary": {"fa": "چرا مردم گاهی با هم حرکت می‌کنند و بیشتر وقت‌ها نه؛ و چرا انقلاب‌ها همیشه غافلگیر می‌کنند؟", "en": "Why people sometimes move together and mostly do not; and why revolutions always surprise.", "nl": "Waarom mensen soms samen in beweging komen en meestal niet; en waarom revoluties altijd verrassen."}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:collective-action", "kind": "concept", "title": {"fa": "مسئلهٔ کنش جمعی و سواری مجانی", "en": "The collective action problem and free-riding", "nl": "Het collectieve-actieprobleem en meeliften"}, "aliases": [], "parent": "soc:collective", "field": "soc:collective", "summary": {"fa": "اگر همه از نتیجه سود می‌برند چه شرکت کنند چه نکنند، عقلانی است که کسی هزینه ندهد؛ پس کالاهای عمومی کمتر از نیاز تولید می‌شوند و گروه‌های بزرگ سخت‌تر از گروه‌های کوچک بسیج می‌شوند. استروم نشان داد اجتماعات محلی این مسئله را قرن‌ها بدون دولت و بدون بازار حل کرده‌اند.", "en": "If everyone benefits from the outcome whether or not they take part, it is rational for no one to bear the cost; so public goods are under-produced and large groups mobilise with more difficulty than small ones. Ostrom showed local communities have solved this for centuries without state or market.", "nl": "Als iedereen van de uitkomst profiteert, of hij nu meedoet of niet, is het rationeel dat niemand de kosten draagt; dus worden publieke goederen te weinig geproduceerd en mobiliseren grote groepen moeilijker dan kleine. Ostrom toonde dat lokale gemeenschappen dit eeuwenlang hebben opgelost zonder staat of markt."}, "points": [{"text": {"fa": "اولسون (۱۹۶۵): گروه‌های کوچک با منافع متمرکز (یک صنف) بر گروه‌های بزرگ با منافع پراکنده (مصرف‌کنندگان) پیروز می‌شوند؛ از همین رو سیاست‌گذاری به سمت لابی‌های کوچک کج می‌شود.", "en": "Olson (1965): small groups with concentrated interests (a trade lobby) beat large groups with diffuse interests (consumers); hence policy tilts toward small lobbies.", "nl": "Olson (1965): small groups with concentrated interests (a trade lobby) beat large groups with diffuse interests (consumers); hence policy tilts toward small lobbies."}, "sources": ["src:a659e764c0"], "flags": []}, {"text": {"fa": "استروم (۱۹۹۰): در ده‌ها نمونهٔ مرتع، آبیاری و شیلات، اجتماعات محلی با هشت اصل طراحی (مرز روشن، قواعد متناسب با محل، مشارکت در قاعده‌گذاری، پایش، مجازات پلکانی، حل اختلاف ارزان، به رسمیت شناخته شدن، لایه‌بندی) منابع مشترک را پایدار نگه داشتند. قنات‌های ایران از نمونه‌های کلاسیک این ادبیات‌اند.", "en": "Ostrom (1990): in dozens of pasture, irrigation and fishery cases, local communities kept commons sustainable with eight design principles (clear boundaries, locally fitted rules, participation in rule-making, monitoring, graduated sanctions, cheap conflict resolution, recognition, nesting). Iran's qanats are classic cases in this literature.", "nl": "Ostrom (1990): in dozens of pasture, irrigation and fishery cases, local communities kept commons sustainable with eight design principles (clear boundaries, locally fitted rules, participation in rule-making, monitoring, graduated sanctions, cheap conflict resolution, recognition, nesting). Iran's qanats are classic cases in this literature."}, "sources": ["src:286dec0d93"], "flags": []}], "links": [{"to": "psy:cooperation-competition", "rel": "bridges", "note": {"fa": "همکاری در ویکی روان", "en": "Cooperation in the psychology wiki", "nl": "Cooperation in the psychology wiki"}}, {"to": "psy:fairness", "rel": "bridges", "note": {"fa": "انصاف و تنبیه نوع‌دوستانه", "en": "Fairness and altruistic punishment", "nl": "Fairness and altruistic punishment"}}, {"to": "soc:social-movements", "rel": "prerequisite", "note": {"fa": "جنبش‌ها به‌عنوان حل مسئلهٔ کنش جمعی", "en": "Movements as solutions to the collective action problem", "nl": "Movements as solutions to the collective action problem"}}], "people": ["core:mancur-olson", "core:elinor-ostrom"], "sources": ["src:286dec0d93", "src:a659e764c0"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:sociological-imagination", "kind": "concept", "title": {"fa": "بینش جامعه‌شناختی", "en": "The sociological imagination", "nl": "De sociologische verbeelding"}, "aliases": [], "parent": "soc:theory", "field": "soc:theory", "summary": {"fa": "توان دیدن پیوند میان «گرفتاری‌های شخصی» و «مسائل عمومی»: بیکاری یک نفر مشکل اوست؛ بیکاری یک‌پنجم جامعه مسئله‌ای ساختاری است که با نصیحت فردی حل نمی‌شود.", "en": "The capacity to see the link between \"personal troubles\" and \"public issues\": one person's unemployment is their trouble; a fifth of society unemployed is a structural issue no individual advice will fix.", "nl": "Het vermogen om het verband te zien tussen \"persoonlijke moeilijkheden\" en \"publieke kwesties\": de werkloosheid van één persoon is diens probleem; een vijfde van de samenleving werkloos is een structurele kwestie die geen individueel advies oplost."}, "points": [{"text": {"fa": "میلز (۱۹۵۹): جامعه‌شناسی یعنی پیوند زدن زندگی‌نامه و تاریخ؛ هر مشکل فردی را باید پرسید در چه ساختاری و در چه دوره‌ای پدید آمده.", "en": "Mills (1959): sociology means connecting biography and history; of every personal problem ask in what structure and what era it arose.", "nl": "Mills (1959): sociology means connecting biography and history; of every personal problem ask in what structure and what era it arose."}, "sources": ["src:accf4bea5e"], "flags": []}, {"text": {"fa": "این نگاه پادزهر «روان‌شناسی‌زدگی» است: تبدیل مسائل ساختاری (مسکن، اشتغال) به ضعف اراده یا شخصیت افراد.", "en": "This view is the antidote to \"psychologism\": turning structural problems (housing, jobs) into individuals' failures of will or character.", "nl": "This view is the antidote to \"psychologism\": turning structural problems (housing, jobs) into individuals' failures of will or character."}, "sources": ["src:accf4bea5e"], "flags": []}], "links": [{"to": "psy:medicalization", "rel": "bridges", "note": {"fa": "پزشکی‌سازی در ویکی روان", "en": "Medicalization in the psychology wiki", "nl": "Medicalization in the psychology wiki"}}, {"to": "soc:social-construction", "rel": "see-also", "note": {"fa": "ساخت اجتماعی واقعیت", "en": "The social construction of reality", "nl": "The social construction of reality"}}], "people": ["core:c-wright-mills"], "sources": ["src:accf4bea5e"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:network-society", "kind": "concept", "title": {"fa": "جامعهٔ شبکه‌ای", "en": "The network society", "nl": "De netwerkmaatschappij"}, "aliases": [], "parent": "soc:space", "field": "soc:space", "summary": {"fa": "کاستلز: در عصر اطلاعات، قدرت و ثروت در «فضای جریان‌ها» (شبکه‌های مالی، رسانه‌ای، فنی) جابه‌جا می‌شود و از «فضای مکان‌ها» (شهر، کشور) جدا می‌افتد؛ هویت‌های مقاومت (ملی، دینی، محلی) پاسخِ آدم‌های جامانده‌اند.", "en": "Castells: in the information age, power and wealth move in the \"space of flows\" (financial, media, technical networks) and come loose from the \"space of places\" (city, country); resistance identities (national, religious, local) are the response of those left behind.", "nl": "Castells: in het informatietijdperk bewegen macht en rijkdom in de \"ruimte van stromen\" (financiële, media-, technische netwerken) en raken los van de \"ruimte van plaatsen\" (stad, land); verzetsidentiteiten (nationaal, religieus, lokaal) zijn het antwoord van wie achterblijft."}, "points": [{"text": {"fa": "کاستلز (۱۹۹۶): شبکه شکل سازمانی غالب می‌شود چون انعطاف‌پذیر، مقیاس‌پذیر و بقاپذیر است؛ اما منطقش «دوگانه» است: یا درون شبکه‌ای یا بی‌ارزش. این تز پیش از شبکه‌های اجتماعی نوشته شد و بسیاری از پیش‌بینی‌هایش را آن‌ها تأیید کردند.", "en": "Castells (1996): the network becomes the dominant organisational form because it is flexible, scalable and survivable; but its logic is \"binary\": either you are in the network or you are worthless. The thesis was written before social media and many of its predictions were borne out by them.", "nl": "Castells (1996): the network becomes the dominant organisational form because it is flexible, scalable and survivable; but its logic is \"binary\": either you are in the network or you are worthless. The thesis was written before social media and many of its predictions were borne out by them."}, "sources": ["src:7af26b32fe"], "flags": []}], "links": [{"to": "soc:weak-ties", "rel": "prerequisite", "note": {"fa": "ساختار شبکه", "en": "Network structure", "nl": "Network structure"}}, {"to": "psy:polarization", "rel": "bridges", "note": {"fa": "قطبی شدن در شبکه‌ها", "en": "Polarization in networks", "nl": "Polarization in networks"}}, {"to": "soc:social-movements", "rel": "see-also", "note": {"fa": "جنبش‌های شبکه‌ای", "en": "Networked movements", "nl": "Networked movements"}}], "people": ["core:manuel-castells"], "sources": ["src:7af26b32fe"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:weak-ties", "kind": "concept", "title": {"fa": "قدرت پیوندهای ضعیف", "en": "The strength of weak ties", "nl": "De kracht van zwakke banden"}, "aliases": [], "parent": "soc:cohesion", "field": "soc:cohesion", "summary": {"fa": "شغل‌ها، ایده‌ها و اخبار تازه بیشتر از آشنایان دور می‌رسند تا دوستان نزدیک، چون دوستان نزدیک همان چیزهایی را می‌دانند که ما می‌دانیم. پیوند ضعیف پلِ میان خوشه‌هاست.", "en": "Jobs, ideas and news arrive more often through acquaintances than close friends, because close friends know what we know. The weak tie is the bridge between clusters.", "nl": "Banen, ideeën en nieuws komen vaker via kennissen dan via goede vrienden, omdat goede vrienden weten wat wij weten. De zwakke band is de brug tussen clusters."}, "points": [{"text": {"fa": "گرانووتر (۱۹۷۳): از کسانی که از راه آشنا شغل پیدا کرده بودند، بیشترشان آن آشنا را «گاه‌به‌گاه» یا «به‌ندرت» می‌دیدند، نه «اغلب».", "en": "Granovetter (1973): of those who found a job through a contact, most saw that contact \"occasionally\" or \"rarely\", not \"often\".", "nl": "Granovetter (1973): of those who found a job through a contact, most saw that contact \"occasionally\" or \"rarely\", not \"often\"."}, "sources": ["src:91ed9b7316"], "flags": []}, {"text": {"fa": "سنتولا (۲۰۱۰): اما رفتارهای پرهزینه (ترک سیگار، پیوستن به جنبش) برعکس از راه پیوندهای قوی و پرتکرار پخش می‌شوند: «سرایت پیچیده» به تأیید چند منبع نیاز دارد.", "en": "Centola (2010): but costly behaviours (quitting smoking, joining a movement) spread instead through strong, redundant ties: \"complex contagion\" needs confirmation from several sources.", "nl": "Centola (2010): but costly behaviours (quitting smoking, joining a movement) spread instead through strong, redundant ties: \"complex contagion\" needs confirmation from several sources."}, "sources": ["src:9021d6ca27"], "flags": []}], "links": [{"to": "psy:complex-contagion", "rel": "same-as", "note": {"fa": "سرایت پیچیده در ویکی روان", "en": "Complex contagion in the psychology wiki", "nl": "Complex contagion in the psychology wiki"}}, {"to": "soc:social-capital", "rel": "part-of", "note": {"fa": "سازوکار سرمایهٔ پل‌زننده", "en": "The mechanism of bridging capital", "nl": "The mechanism of bridging capital"}}], "people": ["core:mark-granovetter", "core:damon-centola"], "sources": ["src:9021d6ca27", "src:91ed9b7316"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:anomie", "kind": "concept", "title": {"fa": "آنومی (بی‌هنجاری)", "en": "Anomie", "nl": "Anomie"}, "aliases": [], "parent": "soc:cohesion", "field": "soc:cohesion", "summary": {"fa": "وقتی قواعد مشترک سست می‌شوند یا میان هدف‌های تبلیغ‌شده و راه‌های مجاز رسیدن به آن‌ها شکاف می‌افتد؛ دورکیم آن را با خودکشی، مرتون با کج‌روی پیوند زد.", "en": "When shared rules loosen, or a gap opens between advertised goals and the legitimate means of reaching them; Durkheim tied it to suicide, Merton to deviance.", "nl": "Wanneer gedeelde regels verslappen, of een kloof ontstaat tussen de aangeprezen doelen en de legitieme middelen om ze te bereiken; Durkheim verbond het met zelfdoding, Merton met deviantie."}, "points": [{"text": {"fa": "دورکیم (۱۸۹۷): نرخ خودکشی واقعیتی اجتماعی است، نه جمع تصمیم‌های فردی؛ در دوره‌های تغییر تند اقتصادی (هم رونق، هم رکود) بالا می‌رود چون معیارهای «کافی» گم می‌شوند.", "en": "Durkheim (1897): the suicide rate is a social fact, not the sum of individual decisions; it rises in periods of rapid economic change (boom as much as bust) because the standards of \"enough\" are lost.", "nl": "Durkheim (1897): the suicide rate is a social fact, not the sum of individual decisions; it rises in periods of rapid economic change (boom as much as bust) because the standards of \"enough\" are lost."}, "sources": ["src:4f2939bd32"], "flags": []}, {"text": {"fa": "مرتون (۱۹۳۸): وقتی فرهنگ همه را به هدف واحدی (ثروت) می‌خواند ولی ساختار راه مشروع را برای همه باز نمی‌گذارد، پنج پاسخ پدید می‌آید: همنوایی، نوآوری (کج‌روی)، مناسک‌گرایی، انزوا، شورش.", "en": "Merton (1938): when culture calls everyone to the same goal (wealth) but structure keeps legitimate paths closed to many, five adaptations appear: conformity, innovation (deviance), ritualism, retreatism, rebellion.", "nl": "Merton (1938): when culture calls everyone to the same goal (wealth) but structure keeps legitimate paths closed to many, five adaptations appear: conformity, innovation (deviance), ritualism, retreatism, rebellion."}, "sources": ["src:b67c05b1c8"], "flags": []}], "links": [{"to": "psy:anomie", "rel": "same-as", "note": {"fa": "همین مفهوم در ویکی روان، با تأکید روانی", "en": "The same concept in the psychology wiki, with the psychological emphasis", "nl": "The same concept in the psychology wiki, with the psychological emphasis"}}, {"to": "soc:inequality-health", "rel": "see-also", "note": {"fa": "نابرابری و سلامت", "en": "Inequality and health", "nl": "Inequality and health"}}], "people": ["core:emile-durkheim", "core:robert-k-merton"], "sources": ["src:4f2939bd32", "src:b67c05b1c8"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:mobility", "kind": "concept", "title": {"fa": "تحرک بین‌نسلی", "en": "Intergenerational mobility", "nl": "Intergenerationele mobiliteit"}, "aliases": [], "parent": "soc:inequality", "field": "soc:inequality", "summary": {"fa": "چقدر درآمد و جایگاه فرزند به والدینش بسته است؟ در کشورهای اسکاندیناوی کم، در آمریکا و بریتانیا زیاد، و بر خلاف تصور، «رؤیای آمریکایی» در کانادا و دانمارک دست‌یافتنی‌تر است تا در آمریکا.", "en": "How much does a child's income and standing depend on the parents'? Little in Scandinavia, much in the US and Britain, and contrary to the myth, the \"American dream\" is more attainable in Canada and Denmark than in America.", "nl": "Hoezeer hangen inkomen en positie van een kind af van de ouders? Weinig in Scandinavië, veel in de VS en Groot-Brittannië, en anders dan de mythe wil, is de \"American dream\" beter haalbaar in Canada en Denemarken dan in Amerika."}, "points": [{"text": {"fa": "چتی و همکاران (۲۰۱۴، داده‌های مالیاتی ۴۰ میلیون نفر): تحرک در آمریکا از شهری به شهر دیگر دو تا سه برابر فرق می‌کند؛ پنج همبستهٔ قوی: تفکیک نژادی و فضایی کمتر، نابرابری کمتر، مدارس بهتر، سرمایهٔ اجتماعی بیشتر، و خانواده‌های دووالده بیشتر.", "en": "Chetty et al. (2014, tax data on 40 million people): mobility in the US varies two- to threefold between cities; five strong correlates: less racial and spatial segregation, less inequality, better schools, more social capital, and more two-parent families.", "nl": "Chetty et al. (2014, tax data on 40 million people): mobility in the US varies two- to threefold between cities; five strong correlates: less racial and spatial segregation, less inequality, better schools, more social capital, and more two-parent families."}, "sources": ["src:9570a0451f"], "flags": []}, {"text": {"fa": "«منحنی گتسبی بزرگ»: کشورهای نابرابرتر تحرک کمتری دارند؛ نابرابری نتیجه، نابرابری فرصت نسل بعد می‌شود.", "en": "The \"Great Gatsby curve\": more unequal countries have less mobility; inequality of outcome becomes the next generation's inequality of opportunity.", "nl": "The \"Great Gatsby curve\": more unequal countries have less mobility; inequality of outcome becomes the next generation's inequality of opportunity."}, "sources": ["src:9570a0451f", "src:6c0c807f94"], "flags": []}], "links": [{"to": "tabar:gwas-polygenic", "rel": "bridges", "note": {"fa": "سهم ژن و خانواده در تحصیلات", "en": "The share of genes and family in education", "nl": "The share of genes and family in education"}}, {"to": "soc:gini-inequality", "rel": "prerequisite", "note": {"fa": "اندازه‌گیری نابرابری", "en": "Measuring inequality", "nl": "Measuring inequality"}}], "people": ["core:raj-chetty"], "sources": ["src:6c0c807f94", "src:9570a0451f"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:institutions", "kind": "field", "title": {"fa": "نهادها و دولت", "en": "Institutions & the state", "nl": "Instituties & de staat"}, "aliases": [], "parent": "soc:soc", "field": null, "summary": {"fa": "قواعد بازی، فراگیر یا بهره‌کش، چگونه سرنوشت ملت‌ها را شکل می‌دهند؟", "en": "How do the rules of the game, inclusive or extractive, shape nations' fates?", "nl": "Hoe vormen de spelregels, inclusief of extractief, het lot van naties?"}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:social-construction", "kind": "concept", "title": {"fa": "ساخت اجتماعی واقعیت", "en": "The social construction of reality", "nl": "De sociale constructie van de werkelijkheid"}, "aliases": [], "parent": "soc:theory", "field": "soc:theory", "summary": {"fa": "پول، ازدواج، مرز، «نوجوانی»: چیزهایی که فقط چون همه باور دارند وجود دارند و با این حال کاملاً واقعی‌اند. ساخت اجتماعی یعنی «ساخته‌شده»، نه «خیالی».", "en": "Money, marriage, borders, \"adolescence\": things that exist only because everyone believes in them, and are nonetheless entirely real. Socially constructed means \"made\", not \"imaginary\".", "nl": "Geld, huwelijk, grenzen, \"adolescentie\": dingen die alleen bestaan omdat iedereen erin gelooft, en toch volkomen echt zijn. Sociaal geconstrueerd betekent \"gemaakt\", niet \"ingebeeld\"."}, "points": [{"text": {"fa": "برگر و لاکمن (۱۹۶۶): واقعیت اجتماعی در سه حرکت ساخته می‌شود: برونی‌سازی (آدم‌ها عادت می‌سازند)، عینیت‌یافتگی (عادت به نهاد تبدیل می‌شود و «همیشه همین‌طور بوده») و درونی‌سازی (نسل بعد آن را طبیعی می‌بیند).", "en": "Berger and Luckmann (1966): social reality is built in three moves: externalisation (people make habits), objectivation (the habit becomes an institution that \"was always so\") and internalisation (the next generation sees it as natural).", "nl": "Berger and Luckmann (1966): social reality is built in three moves: externalisation (people make habits), objectivation (the habit becomes an institution that \"was always so\") and internalisation (the next generation sees it as natural)."}, "sources": ["src:f5c4df1661"], "flags": []}, {"text": {"fa": "هکینگ (۱۹۹۹): گفتن «X ساخت اجتماعی است» وقتی معنادار است که X اجتناب‌ناپذیر فرض شده باشد؛ و بعضی ساخته‌ها «نوع‌های تعاملی»اند: برچسب، رفتار برچسب‌خورده را عوض می‌کند (اثر حلقه‌ای).", "en": "Hacking (1999): saying \"X is socially constructed\" is meaningful when X was assumed inevitable; and some constructs are \"interactive kinds\": the label changes the behaviour of the labelled (the looping effect).", "nl": "Hacking (1999): saying \"X is socially constructed\" is meaningful when X was assumed inevitable; and some constructs are \"interactive kinds\": the label changes the behaviour of the labelled (the looping effect)."}, "sources": ["src:2e8dc6a169"], "flags": []}], "links": [{"to": "psy:dx", "rel": "bridges", "note": {"fa": "تشخیص روان‌پزشکی به‌عنوان نوع تعاملی", "en": "Psychiatric diagnosis as an interactive kind", "nl": "Psychiatric diagnosis as an interactive kind"}}, {"to": "tabar:race-biology", "rel": "bridges", "note": {"fa": "نژاد: ساخت اجتماعی با پیامد واقعی", "en": "Race: a social construct with real consequences", "nl": "Race: a social construct with real consequences"}}], "people": [], "sources": ["src:2e8dc6a169", "src:f5c4df1661"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:enlightenment-break", "kind": "concept", "title": {"fa": "از حکمت مدرسی تا روشنگری: زمینهٔ تاریخی نظریهٔ اجتماعی", "en": "From scholasticism to the Enlightenment: the backdrop of social theory", "nl": "Van scholastiek naar Verlichting: de achtergrond van de sociale theorie"}, "aliases": [], "parent": "soc:theory", "field": "soc:theory", "summary": {"fa": "نظریهٔ اجتماعی مدرن در پاسخ به جهانی پدید آمد که در آن پرسش از اصول دیگر ممنوع نبود. این مدخل خلاصهٔ تصویری است که یک سخنرانی درسی از گذار «حکمت مدرسی» (اسکولاستیک، سدهٔ یازدهم تا پانزدهم) به روشنگری می‌دهد؛ تصویری ساده‌شده که نکته‌های تاریخ‌نگارانه‌اش پایین آمده است.", "en": "Modern social theory arose in a world where questioning first principles was no longer forbidden. This entry summarises the picture a lecture course gives of the passage from \"scholasticism\" (11th–15th centuries) to the Enlightenment; it is a simplified picture, and the historians' caveats are listed below.", "nl": "Moderne sociale theorie ontstond in een wereld waarin vragen naar eerste beginselen niet langer verboden was. Dit lemma vat het beeld samen dat een collegereeks schetst van de overgang van \"scholastiek\" (11e–15e eeuw) naar de Verlichting; het is een vereenvoudigd beeld, de kanttekeningen van historici staan hieronder."}, "points": [{"text": {"fa": "سخنران چهار ویژگی را برای حکمت مدرسی می‌شمارد: پژوهش برای استوارکردن اصول دین نه کشف تازه؛ پیشی ایمان بر عقل؛ نبود استقلال فکری و آزادی رأی در برابر گفتمان غالب؛ و رونق مناظره بر سر مسائل جزئی دینی. مثال‌هایش: بحث دربارهٔ تعداد فرشته‌ها بر سر یک سوزن و شمار دندان‌های اسب.", "en": "The lecturer lists four features of scholastic thought: research to secure doctrine rather than find new things; faith ahead of reason; no intellectual independence against the dominant discourse; and lively debate over small doctrinal questions. His examples: how many angels fit on a needle-point, and how many teeth a horse has.", "nl": "The lecturer lists four features of scholastic thought: research to secure doctrine rather than find new things; faith ahead of reason; no intellectual independence against the dominant discourse; and lively debate over small doctrinal questions. His examples: how many angels fit on a needle-point, and how many teeth a horse has."}, "sources": ["src:c97a389f84"], "flags": ["editor-note"]}, {"text": {"fa": "نکتهٔ تاریخ‌نگارانه: این تصویر کاریکاتوری است. اسکولاستیک‌ها (مثل توماس آکویناس) ایمان و عقل را همکار می‌دانستند و دانشگاه‌ها و منطق مدرن بخشی از میراث همین دوره‌اند. داستان «فرشته‌ها و سوزن» و «دندان‌های اسب» هم روایت‌های بعدی و بی‌منبع محکم‌اند، نه گزارش مناظرات واقعی.", "en": "Historiographical caveat: this picture is a caricature. Scholastics such as Thomas Aquinas saw faith and reason as partners, and universities and formal logic are part of that era's legacy. The \"angels on a needle\" and \"horse's teeth\" tales are later, poorly sourced stories, not reports of real debates.", "nl": "Historiographical caveat: this picture is a caricature. Scholastics such as Thomas Aquinas saw faith and reason as partners, and universities and formal logic are part of that era's legacy. The \"angels on a needle\" and \"horse's teeth\" tales are later, poorly sourced stories, not reports of real debates."}, "sources": [], "flags": ["contested", "editor-note"]}, {"text": {"fa": "چهار عامل «ترک» در گفتمان پیشین به گفتهٔ سخنران: فتح قسطنطنیه و کوچ دانشمندان یونانی، اختراع چاپ، کشف آمریکا و مهاجرت پروتستان‌ها، و کشفیات علمی (کوپرنیک، کپلر، گالیله). او تأکید می‌کند گسست فکری هیچ‌وقت در یک سال مشخص رخ نمی‌دهد و با شکست‌های کوچک آغاز می‌شود.", "en": "Four causes of \"cracks\" in the old discourse, per the lecturer: the fall of Constantinople and the migration of Greek scholars, the invention of printing, the discovery of America and Protestant emigration, and scientific discoveries (Copernicus, Kepler, Galileo). He stresses that an intellectual break never happens in one year but begins with small failures.", "nl": "Four causes of \"cracks\" in the old discourse, per the lecturer: the fall of Constantinople and the migration of Greek scholars, the invention of printing, the discovery of America and Protestant emigration, and scientific discoveries (Copernicus, Kepler, Galileo). He stresses that an intellectual break never happens in one year but begins with small failures."}, "sources": ["src:c97a389f84"], "flags": ["contested"]}, {"text": {"fa": "نکتهٔ تاریخ‌نگارانه: اثر کوچ دانشمندان یونانی پس از ۱۴۵۳ را بسیاری از مورخان اغراق‌شده می‌دانند، چون انتقال متون یونانی به ایتالیا پیش‌تر آغاز شده بود. گالیله در ۱۶۳۳ در دادگاه کلیسا مجبور به انکار نظر خود شد و تا پایان عمر در حبس خانگی ماند؛ «سوزاندن» او روایت ساده‌شده است.", "en": "Historiographical caveat: many historians think the effect of Greek scholars' migration after 1453 is overstated, since the transfer of Greek texts to Italy had begun earlier. Galileo was forced to recant by a Church court in 1633 and spent the rest of his life under house arrest; \"burning\" him is a simplified retelling.", "nl": "Historiographical caveat: many historians think the effect of Greek scholars' migration after 1453 is overstated, since the transfer of Greek texts to Italy had begun earlier. Galileo was forced to recant by a Church court in 1633 and spent the rest of his life under house arrest; \"burning\" him is a simplified retelling."}, "sources": [], "flags": ["contested", "editor-note"]}, {"text": {"fa": "کانت (۱۷۸۴): روشنگری «بیرون آمدن انسان از نابالغیِ خودخواسته» است: جرئت کردن به استفاده از فهم خود بی‌هدایت دیگری. سخنران این متن را اعلام آغاز عصری می‌خواند که انقلاب‌های سیاسی و صنعتی را در پی آورد. وبر (۱۹۰۵) نقش اخلاق پروتستانی در سرمایه‌داری را نشان می‌دهد؛ این تز شواهد مختلط دارد.", "en": "Kant (1784): Enlightenment is \"man's emergence from his self-incurred immaturity\": daring to use one's own understanding without another's guidance. The lecturer reads this text as the start of an age that brought political and industrial revolutions. Weber (1905) shows the role of the Protestant ethic in capitalism; that thesis has mixed evidence.", "nl": "Kant (1784): Enlightenment is \"man's emergence from his self-incurred immaturity\": daring to use one's own understanding without another's guidance. The lecturer reads this text as the start of an age that brought political and industrial revolutions. Weber (1905) shows the role of the Protestant ethic in capitalism; that thesis has mixed evidence."}, "sources": ["src:079f5798c4", "src:44db2d1cb1", "src:c97a389f84"], "flags": []}, {"text": {"fa": "منبع خواندنی که سخنران برای فهم این دوره معرفی می‌کند: «سیر حکمت در اروپا» از محمدعلی فروغی، به‌ویژه فصل حکمت اسکولاستیک.", "en": "Reading the lecturer recommends for this period: Mohammad-Ali Foroughi's \"Seyr-e Hekmat dar Orupa\" (The course of philosophy in Europe), especially the chapter on scholastic philosophy.", "nl": "Reading the lecturer recommends for this period: Mohammad-Ali Foroughi's \"Seyr-e Hekmat dar Orupa\" (The course of philosophy in Europe), especially the chapter on scholastic philosophy."}, "sources": ["src:1274113306"], "flags": []}], "links": [{"to": "soc:protestant-ethic", "rel": "explains", "note": {"fa": "وبر و اخلاق پروتستانی", "en": "Weber and the Protestant ethic", "nl": "Weber and the Protestant ethic"}}, {"to": "soc:secularization", "rel": "see-also", "note": {"fa": "سکولار شدن", "en": "Secularization", "nl": "Secularization"}}, {"to": "phil:epistemology", "rel": "see-also", "note": {"fa": "دانستن و باور موجه", "en": "Knowledge and justified belief", "nl": "Knowledge and justified belief"}}], "people": ["core:max-weber", "core:kant"], "sources": ["src:079f5798c4", "src:1274113306", "src:44db2d1cb1", "src:c97a389f84"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:presentation-of-self", "kind": "concept", "title": {"fa": "نمایش خود در زندگی روزمره", "en": "The presentation of self", "nl": "De presentatie van het zelf"}, "aliases": [], "parent": "soc:theory", "field": "soc:theory", "summary": {"fa": "گافمن زندگی اجتماعی را صحنهٔ تئاتر می‌بیند: «جلوی صحنه» نقش بازی می‌کنیم، «پشت صحنه» استراحت؛ و آبرو (face) چیزی است که همه در حفظش همکاری می‌کنند.", "en": "Goffman sees social life as theatre: \"front stage\" we perform, \"backstage\" we rest; and face is something everyone cooperates to protect.", "nl": "Goffman ziet het sociale leven als theater: \"op het toneel\" spelen we, \"achter de schermen\" rusten we; en gezicht is iets dat iedereen samen beschermt."}, "points": [{"text": {"fa": "گافمن (۱۹۵۹): مدیریت تأثیر امری همگانی و نه ریاکارانه است؛ بدون آن تعامل روزمره ممکن نیست. شبکه‌های اجتماعی «جلوی صحنه»ای دائمی ساخته‌اند و پشت صحنه را کوچک کرده‌اند.", "en": "Goffman (1959): impression management is universal, not hypocrisy; everyday interaction is impossible without it. Social media have built a permanent front stage and shrunk the backstage.", "nl": "Goffman (1959): impression management is universal, not hypocrisy; everyday interaction is impossible without it. Social media have built a permanent front stage and shrunk the backstage."}, "sources": ["src:8474622142"], "flags": []}], "links": [{"to": "psy:narcissism-culture", "rel": "bridges", "note": {"fa": "فرهنگ خودشیفتگی در ویکی روان", "en": "Narcissism culture in the psychology wiki", "nl": "Narcissism culture in the psychology wiki"}}, {"to": "psy:emotional-labor", "rel": "bridges", "note": {"fa": "کار هیجانی", "en": "Emotional labour", "nl": "Emotional labour"}}], "people": ["core:erving-goffman"], "sources": ["src:8474622142"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:social-capital", "kind": "concept", "title": {"fa": "سرمایهٔ اجتماعی: پیوندی و پل‌زننده", "en": "Social capital: bonding and bridging", "nl": "Sociaal kapitaal: bindend en overbruggend"}, "aliases": [], "parent": "soc:cohesion", "field": "soc:cohesion", "summary": {"fa": "شبکه‌ها، هنجارهای متقابل و اعتمادی که همکاری را ممکن می‌کنند. سرمایهٔ «پیوندی» درون گروه (خانواده، قوم) گرم و محافظ است؛ سرمایهٔ «پل‌زننده» میان گروه‌ها فرصت و اطلاعات می‌آورد. جامعه‌ای که اولی را زیاد و دومی را کم دارد، محفلی و بی‌اعتماد می‌شود.", "en": "The networks, norms of reciprocity and trust that make cooperation possible. \"Bonding\" capital within a group (family, clan) is warm and protective; \"bridging\" capital between groups brings opportunity and information. A society rich in the first and poor in the second becomes cliquish and distrustful.", "nl": "De netwerken, wederkerigheidsnormen en het vertrouwen die samenwerking mogelijk maken. \"Bindend\" kapitaal binnen een groep (familie, clan) is warm en beschermend; \"overbruggend\" kapitaal tussen groepen brengt kansen en informatie. Een samenleving rijk aan het eerste en arm aan het tweede wordt kliekerig en wantrouwig."}, "points": [{"text": {"fa": "پاتنم (۱۹۹۳): تفاوت کارایی حکومت‌های محلی شمال و جنوب ایتالیا را به سنت‌های مدنی چندصدساله (انجمن‌ها، همسرایی‌ها، تعاونی‌ها) برگرداند؛ یکی از پرارجاع‌ترین و پرمناقشه‌ترین مطالعات علوم اجتماعی.", "en": "Putnam (1993): traced the difference in local-government performance between northern and southern Italy to centuries-old civic traditions (associations, choirs, cooperatives); one of social science's most cited and most contested studies.", "nl": "Putnam (1993): traced the difference in local-government performance between northern and southern Italy to centuries-old civic traditions (associations, choirs, cooperatives); one of social science's most cited and most contested studies."}, "sources": ["src:0676792d21"], "flags": ["contested"]}, {"text": {"fa": "کلمن (۱۹۸۸): سرمایهٔ اجتماعی در ساختار روابط است، نه در افراد؛ شبکهٔ «بسته» (والدینی که همدیگر را می‌شناسند) هنجارها را اجراپذیر می‌کند و افت تحصیلی را کم.", "en": "Coleman (1988): social capital lies in the structure of relations, not in individuals; a \"closed\" network (parents who know each other) makes norms enforceable and cuts school dropout.", "nl": "Coleman (1988): social capital lies in the structure of relations, not in individuals; a \"closed\" network (parents who know each other) makes norms enforceable and cuts school dropout."}, "sources": ["src:ec182152dc"], "flags": []}, {"text": {"fa": "بوردیو (۱۹۸۶): سرمایهٔ اجتماعی مثل سرمایهٔ اقتصادی و فرهنگی نابرابر توزیع شده و ابزار بازتولید امتیاز است؛ «پارتی» نام محلی همین پدیده است.", "en": "Bourdieu (1986): social capital, like economic and cultural capital, is unequally distributed and a tool for reproducing privilege; \"connections\" is the everyday name of the same phenomenon.", "nl": "Bourdieu (1986): social capital, like economic and cultural capital, is unequally distributed and a tool for reproducing privilege; \"connections\" is the everyday name of the same phenomenon."}, "sources": ["src:ef764a2065"], "flags": []}], "links": [{"to": "psy:social-capital", "rel": "same-as", "note": {"fa": "سرمایهٔ اجتماعی در ویکی روان", "en": "Social capital in the psychology wiki", "nl": "Social capital in the psychology wiki"}}, {"to": "soc:weak-ties", "rel": "explains", "note": {"fa": "چرا پیوندهای ضعیف پل می‌زنند", "en": "Why weak ties bridge", "nl": "Why weak ties bridge"}}, {"to": "soc:generalized-trust", "rel": "part-of", "note": {"fa": "اعتماد تعمیم‌یافته، هستهٔ سرمایهٔ پل‌زننده", "en": "Generalised trust, the core of bridging capital", "nl": "Generalised trust, the core of bridging capital"}}], "people": ["core:robert-putnam", "core:james-coleman", "core:pierre-bourdieu"], "sources": ["src:0676792d21", "src:ec182152dc", "src:ef764a2065"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:inequality", "kind": "field", "title": {"fa": "نابرابری و تحرک", "en": "Inequality & mobility", "nl": "Ongelijkheid & mobiliteit"}, "aliases": [], "parent": "soc:soc", "field": null, "summary": {"fa": "چقدر فاصله هست، چقدر می‌شود از آن بالا رفت، و نابرابری با جامعه چه می‌کند؟", "en": "How wide is the gap, how climbable is it, and what does inequality do to a society?", "nl": "Hoe groot is de kloof, hoe beklimbaar is ze, en wat doet ongelijkheid met een samenleving?"}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:space", "kind": "field", "title": {"fa": "شهر، مهاجرت و شبکه", "en": "City, migration & networks", "nl": "Stad, migratie & netwerken"}, "aliases": [], "parent": "soc:soc", "field": null, "summary": {"fa": "زندگی شهری، حرکت مردم و شبکه‌هایی که ایده‌ها و رفتارها در آن پخش می‌شوند.", "en": "Urban life, the movement of people and the networks through which ideas and behaviours spread.", "nl": "Stedelijk leven, de beweging van mensen en de netwerken waarlangs ideeën en gedrag zich verspreiden."}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:demography", "kind": "field", "title": {"fa": "جمعیت", "en": "Population", "nl": "Bevolking"}, "aliases": [], "parent": "soc:soc", "field": null, "summary": {"fa": "گذار جمعیتی، افت باروری و سالمندی: آرام‌ترین و بزرگ‌ترین تغییر اجتماعی قرن.", "en": "Demographic transition, fertility decline and ageing: the quietest and largest social change of the century.", "nl": "Demografische transitie, dalende vruchtbaarheid en vergrijzing: de stilste en grootste sociale verandering van de eeuw."}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "soc:secularization", "kind": "concept", "title": {"fa": "سکولار شدن: امنیت وجودی و دین", "en": "Secularization: existential security and religion", "nl": "Secularisering: existentiële zekerheid en religie"}, "aliases": [], "parent": "soc:values", "field": "soc:values", "summary": {"fa": "نظریهٔ کلاسیک می‌گفت مدرنیته دین را کم‌رنگ می‌کند؛ آمریکا و جهان اسلام استثنا به نظر می‌رسیدند. نوریس و اینگلهارت پاسخ دادند: متغیر اصلی «امنیت وجودی» است؛ هرجا زندگی امن و پیش‌بینی‌پذیر شود، دین‌داری افت می‌کند، و چون جمعیت کشورهای دین‌دار سریع‌تر رشد می‌کند، جهان در کل سکولار نمی‌شود.", "en": "The classic theory said modernity fades religion; America and the Muslim world looked like exceptions. Norris and Inglehart replied: the key variable is \"existential security\"; wherever life becomes safe and predictable religiosity falls, and because religious countries' populations grow faster, the world as a whole does not secularise.", "nl": "De klassieke theorie zei dat moderniteit religie doet verbleken; Amerika en de islamitische wereld leken uitzonderingen. Norris en Inglehart antwoordden: de sleutelvariabele is \"existentiële zekerheid\"; waar het leven veilig en voorspelbaar wordt, daalt religiositeit, en omdat de bevolking van religieuze landen sneller groeit, seculariseert de wereld als geheel niet."}, "points": [{"text": {"fa": "نوریس و اینگلهارت (۲۰۱۱): دین‌داری با آسیب‌پذیری (فقر، بیماری، ناامنی) همبستگی قوی دارد؛ در کشورهای ثروتمندِ با دولت رفاه قوی، حضور در عبادتگاه و اهمیت خدا در زندگی پایین‌ترین است. آمریکا با نابرابری و ناامنی بالاترش تا حدی توضیح داده می‌شود.", "en": "Norris and Inglehart (2011): religiosity correlates strongly with vulnerability (poverty, illness, insecurity); in rich countries with strong welfare states, attendance and the importance of God in life are lowest. America is partly explained by its higher inequality and insecurity.", "nl": "Norris and Inglehart (2011): religiosity correlates strongly with vulnerability (poverty, illness, insecurity); in rich countries with strong welfare states, attendance and the importance of God in life are lowest. America is partly explained by its higher inequality and insecurity."}, "sources": ["src:782cc6ae73"], "flags": []}, {"text": {"fa": "دادهٔ ایران: پیمایش ملی ارزش‌ها و نگرش‌ها افت نسلی در مناسک جمعی (نماز جماعت، مسجد) همراه با پایداری باورهای شخصی را نشان می‌دهد؛ پیمایش آنلاین گمان (۲۰۲۰، حدود ۵۰ هزار پاسخ‌گو) سهم بالایی از «بی‌دین» یا «معنوی بدون دین» گزارش کرد، اما نمونه‌اش غیراحتمالی و اینترنتی است و نباید با پیمایش ملی یکی گرفته شود.", "en": "Iranian data: the national Values and Attitudes survey shows a generational fall in collective ritual (congregational prayer, mosque) alongside stable personal belief; the online GAMAAN survey (2020, about 50,000 respondents) reported a high share of \"non-religious\" or \"spiritual but not religious\", but its sample is non-probability and internet-based and must not be equated with a national survey.", "nl": "Iranian data: the national Values and Attitudes survey shows a generational fall in collective ritual (congregational prayer, mosque) alongside stable personal belief; the online GAMAAN survey (2020, about 50,000 respondents) reported a high share of \"non-religious\" or \"spiritual but not religious\", but its sample is non-probability and internet-based and must not be equated with a national survey."}, "sources": ["src:95287955fe", "src:6d79b4e77e"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "دورکیم: کارکرد دین پیش از هر چیز انسجام جمعی است («جامعه خودش را می‌پرستد»)؛ از این رو با افول مناسک، نهادهای جایگزینِ هم‌بستگی (ورزش، ملی‌گرایی، جنبش‌ها) پر می‌شوند.", "en": "Durkheim: religion's function is first of all collective cohesion (\"society worships itself\"); hence as ritual declines, substitute institutions of solidarity (sport, nationalism, movements) fill the space.", "nl": "Durkheim: religion's function is first of all collective cohesion (\"society worships itself\"); hence as ritual declines, substitute institutions of solidarity (sport, nationalism, movements) fill the space."}, "sources": ["src:fcce5dbd78"], "flags": []}], "links": [{"to": "soc:value-change", "rel": "part-of", "note": {"fa": "بخشی از تغییر ارزش‌ها", "en": "Part of value change", "nl": "Part of value change"}}, {"to": "psy:meaning-making", "rel": "bridges", "note": {"fa": "معناسازی در ویکی روان", "en": "Meaning-making in the psychology wiki", "nl": "Meaning-making in the psychology wiki"}}, {"to": "soc:protestant-ethic", "rel": "see-also", "note": {"fa": "دین و اقتصاد", "en": "Religion and economy", "nl": "Religion and economy"}}], "people": ["core:ronald-inglehart", "core:emile-durkheim"], "sources": ["src:6d79b4e77e", "src:782cc6ae73", "src:95287955fe", "src:fcce5dbd78"], "booklets": [], "origin": null, "iran": "iran:religiosity", "wikidata": null, "status": "draft"}, {"id": "soc:protestant-ethic", "kind": "concept", "title": {"fa": "اخلاق پروتستانی و روح سرمایه‌داری", "en": "The Protestant ethic and the spirit of capitalism", "nl": "De protestantse ethiek en de geest van het kapitalisme"}, "aliases": [], "parent": "soc:institutions", "field": "soc:institutions", "summary": {"fa": "وبر پرسید چرا سرمایه‌داری عقلانی اول در اروپای پروتستان شکوفا شد و پاسخ داد: کار سخت و ریاضت‌کشانه به‌عنوان نشانهٔ رستگاری، پس‌انداز به جای مصرف، و حساب‌گری روزمره. تز پرنفوذی که شواهد تجربی‌اش مختلط است.", "en": "Weber asked why rational capitalism first flourished in Protestant Europe and answered: ascetic hard work as a sign of salvation, saving over consumption, and everyday calculation. An influential thesis with mixed empirical evidence.", "nl": "Weber vroeg waarom het rationele kapitalisme eerst in protestants Europa opbloeide en antwoordde: ascetisch hard werken als teken van verlossing, sparen boven consumeren, en alledaagse berekening. Een invloedrijke these met gemengd empirisch bewijs."}, "points": [{"text": {"fa": "وبر (۱۹۰۵): هدف نشان دادن «قرابت انتخابی» میان یک اخلاق دینی و یک نظام اقتصادی بود، نه علیت یک‌طرفه؛ خودش هشدار داد که «قفس آهنین» سرمایه‌داری دیگر به روح دینی نیازی ندارد.", "en": "Weber (1905): the aim was to show an \"elective affinity\" between a religious ethic and an economic system, not one-way causation; he himself warned that capitalism's \"iron cage\" no longer needs the religious spirit.", "nl": "Weber (1905): the aim was to show an \"elective affinity\" between a religious ethic and an economic system, not one-way causation; he himself warned that capitalism's \"iron cage\" no longer needs the religious spirit."}, "sources": ["src:44db2d1cb1"], "flags": []}, {"text": {"fa": "هنریک (۲۰۲۰) روایت جایگزین می‌دهد: ممنوعیت‌های کلیسای غربی بر ازدواج خویشاوندی خانواده‌های گسترده را شکست و روان‌شناسی «فردگرا، غیرشخصی و تحلیلی» ساخت که بعدها بازار و دموکراسی روی آن سوار شد؛ پروتستانتیسم بیشتر سوادآموزی را بالا برد تا اخلاق کار.", "en": "Henrich (2020) offers an alternative account: the Western Church's bans on cousin marriage broke extended kin groups and produced an \"individualist, impersonal, analytic\" psychology on which markets and democracy later rode; Protestantism raised literacy more than the work ethic.", "nl": "Henrich (2020) offers an alternative account: the Western Church's bans on cousin marriage broke extended kin groups and produced an \"individualist, impersonal, analytic\" psychology on which markets and democracy later rode; Protestantism raised literacy more than the work ethic."}, "sources": ["src:6858037a34"], "flags": ["contested"]}], "links": [{"to": "tabar:consanguinity", "rel": "bridges", "note": {"fa": "ازدواج خویشاوندی و ساختار خانواده", "en": "Cousin marriage and family structure", "nl": "Cousin marriage and family structure"}}, {"to": "psy:cultural-evolution", "rel": "bridges", "note": {"fa": "تکامل فرهنگی", "en": "Cultural evolution", "nl": "Cultural evolution"}}, {"to": "soc:secularization", "rel": "see-also", "note": {"fa": "دین در جامعهٔ مدرن", "en": "Religion in modern society", "nl": "Religion in modern society"}}], "people": ["core:max-weber", "core:joseph-henrich"], "sources": ["src:44db2d1cb1", "src:6858037a34"], "booklets": [], "origin": null, "iran": n
