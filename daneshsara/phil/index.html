g that competes with mystical ones.", "nl": "De spreker ziet de rend bij Hafez als alternatief voor wie deugd claimt: iemand die niets verbergt en niet over anderen oordeelt. Het contrast gaat volgens hem over oprechtheid tegenover schijnheiligheid, niet over geloof tegenover ongeloof."}, "points": [{"text": {"fa": "به گفتهٔ سخنران، زاهد و رند هر دو در پی زندگی خوب‌اند، اما انگیزه و شیوه فرق دارد: زاهد با غرور فضیلتش را نمایش می‌دهد و مدام ظاهر خود را با دیگران می‌سنجد؛ رند سفری درونی می‌کند و نمی‌خواهد چیزی را به کسی ثابت کند.", "en": "Per the lecturer, ascetic and rend both seek a good life, but differ in motive and manner: the ascetic displays virtue out of pride and keeps comparing his appearance with others; the rend makes an inner journey and has nothing to prove.", "nl": "Per the lecturer, ascetic and rend both seek a good life, but differ in motive and manner: the ascetic displays virtue out of pride and keeps comparing his appearance with others; the rend makes an inner journey and has nothing to prove."}, "sources": ["src:97e4c77b3a"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، ویژگی نخست رند صداقت است: خود را آشکارا همان‌طور که هست معرفی می‌کند و چهرهٔ مقدس نمی‌سازد. بهایش تنهایی است؛ در جامعه‌ای که ظاهر ارزش شده، رند معمولاً بی‌پناه می‌ماند و حاضر نیست برای مصلحت‌اندیشی صداقتش را معامله کند.", "en": "Per the lecturer, the rend's first trait is sincerity: he presents himself openly and builds no sacred image. The price is loneliness; where appearance is prized the rend is often unprotected and refuses to trade honesty for expediency.", "nl": "Per the lecturer, the rend's first trait is sincerity: he presents himself openly and builds no sacred image. The price is loneliness; where appearance is prized the rend is often unprotected and refuses to trade honesty for expediency."}, "sources": ["src:97e4c77b3a"], "flags": ["editor-note"]}, {"text": {"fa": "سخنران تأکید می‌کند که حافظ نه فسق‌فروشی را تأیید می‌کند و نه زهدفروشی را؛ مشکل او با «نمایش» است، چه نمایش گناه و چه نمایش تقوا. ریا از جایی شروع می‌شود که فضیلت دیگر شیوهٔ زیستن نیست و چیزی برای عرضه و برتری‌جویی می‌شود.", "en": "The lecturer stresses that Hafez endorses neither the showing-off of sin nor the selling of piety; his target is display itself. Hypocrisy begins when virtue stops being a way of living and becomes something to show off or gain status with.", "nl": "The lecturer stresses that Hafez endorses neither the showing-off of sin nor the selling of piety; his target is display itself. Hypocrisy begins when virtue stops being a way of living and becomes something to show off or gain status with."}, "sources": ["src:97e4c77b3a"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، حافظ بر خلاف قدرتمندان دینی، واعظ را مردی با جایگاه نمی‌بیند که ممنوع از پرسش باشد: به جای حکم، می‌پرسد چرا کسانی که مردم را به توبه می‌خوانند خودشان کمتر توبه می‌کنند. توبه برای چنین کسی اعتراف به نقص است و اقتدارش را سست می‌کند.", "en": "Per the lecturer, Hafez does not simply condemn: he asks why those who call others to repentance repent so little themselves. For a self-appointed moral authority, repentance would admit imperfection and so weaken authority.", "nl": "Per the lecturer, Hafez does not simply condemn: he asks why those who call others to repentance repent so little themselves. For a self-appointed moral authority, repentance would admit imperfection and so weaken authority."}, "sources": ["src:97e4c77b3a"], "flags": ["editor-note"]}, {"text": {"fa": "رند در سنت ادبی فارسی معمولاً چهره‌ای چندلایه است: هم می‌تواند شخصیتی ملامتی و عارف‌مسلک باشد که عمداً بدنامی را می‌پذیرد تا از ریا دور بماند، و هم شخصیتی اجتماعی و شاد. نسبت دادن او به «آزادی فردی» به معنای مدرن ممکن است زمان‌پریشی باشد، و تقابل میخانه و مسجد را بسیاری استعارهٔ عرفانی می‌دانند نه صرفاً اعتراض اجتماعی.", "en": "In the Persian literary tradition the rend is a layered figure: he can be a malamati, mystically inclined type who accepts disrepute to avoid display, as well as a convivial social figure. Reading him as an icon of individual freedom in the modern sense may be anachronistic, and many scholars take the tavern-versus-mosque contrast as mystical metaphor rather than only social protest.", "nl": "In the Persian literary tradition the rend is a layered figure: he can be a malamati, mystically inclined type who accepts disrepute to avoid display, as well as a convivial social figure. Reading him as an icon of individual freedom in the modern sense may be anachronistic, and many scholars take the tavern-versus-mosque contrast as mystical metaphor rather than only social protest."}, "sources": ["src:5d11ebe051"], "flags": ["contested", "editor-note"]}], "links": [{"to": "phil:hafez-monopoly-truth-virtue", "rel": "contrasts", "note": {"fa": "منطق مدعیان حقیقت و فضیلت که رند در برابرش می‌ایستد", "en": "The claimants' logic the rend stands against", "nl": "The claimants' logic the rend stands against"}}, {"to": "phil:ethics", "rel": "part-of", "note": {"fa": "اخلاق", "en": "Ethics", "nl": "Ethics"}}, {"to": "phil:iranian", "rel": "see-also", "note": {"fa": "فلسفه و اندیشهٔ ایرانی", "en": "Iranian thought", "nl": "Iranian thought"}}, {"to": "phil:stoicism", "rel": "see-also", "note": {"fa": "تمرکز بر درون و آنچه در اختیار ماست", "en": "Focus on the inner life and what is up to us", "nl": "Focus on the inner life and what is up to us"}}], "people": ["core:hafez-of-shiraz"], "sources": ["src:5d11ebe051", "src:97e4c77b3a"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:james-pragmatic-truth", "kind": "concept", "title": {"fa": "ویلیام جیمز و نظریهٔ پراگماتیستی صدق", "en": "William James and the pragmatic theory of truth", "nl": "William James en de pragmatische waarheidstheorie"}, "aliases": [], "parent": "phil:epistemology", "field": "phil:epistemology", "summary": {"fa": "ویلیام جیمز (۱۸۴۲–۱۹۱۰) روان‌شناس و فیلسوف آمریکایی بود و در کتاب «پراگماتیسم» (۱۹۰۷) باورها را به پیامد عملی‌شان می‌سنجید. سخنران نظر او را چنین خلاصه می‌کند: باور درست یعنی باور سودمند و باورها ابزارند. این خلاصه بخش مهمی از اندیشهٔ جیمز را می‌گیرد، اما قیدهای او را نمی‌آورد و منتقدان مهمی دارد.", "en": "William James (1842-1910), American psychologist and philosopher, judged beliefs by their practical consequences in his book Pragmatism (1907). The lecturer sums him up as: a true belief is a useful belief, and beliefs are tools. This captures a major strand of James but omits his qualifications, and it has serious critics.", "nl": "William James (1842-1910), Amerikaans psycholoog en filosoof, beoordeelde overtuigingen op hun praktische gevolgen in Pragmatism (1907). De spreker vat het samen als: een ware overtuiging is een nuttige overtuiging."}, "points": [{"text": {"fa": "به گفتهٔ سخنران، داستان فیلم «اتاق» نشان می‌دهد باوری که با واقعیت نمی‌خواند (جهان فقط همین اتاق است) برای کودک سال‌ها محافظ بوده و وقتی فرصت فرار پیش آمد به مانع تبدیل شده؛ پس ارزش باور به شرایط بستگی دارد و باید به پیامدش نگاه کرد، نه فقط به مطابقتش با واقعیت.", "en": "Per the lecturer, the film Room shows a belief that does not match reality (the world is only this room) protecting a child for years and then becoming an obstacle once escape became possible; so a belief's value depends on circumstances and should be judged by its consequences, not only by whether it matches reality.", "nl": "Per the lecturer, the film Room shows a belief that does not match reality (the world is only this room) protecting a child for years and then becoming an obstacle once escape became possible; so a belief's value depends on circumstances and should be judged by its consequences, not only by whether it matches reality."}, "sources": ["src:64d205371b"], "flags": ["editor-note"]}, {"text": {"fa": "جیمز در «پراگماتیسم» (۱۹۰۷) می‌گوید ایده‌ای درست است که در تجربه ما «کار می‌کند»، یعنی ما را به شکل رضایت‌بخش با بقیهٔ تجربه‌هایمان پیوند می‌دهد. او حقیقت را جدا از تجربهٔ انسانی نمی‌دانست و باورها را ابزار حل مسئله می‌دید (تشبیه چکش و پیچ از سخنران است).", "en": "In Pragmatism (1907) James says an idea is true if it 'works' in experience, that is, if it connects us satisfactorily with the rest of our experience. He did not treat truth as detached from human experience and saw beliefs as tools for solving problems (the hammer-and-screw analogy is the lecturer's).", "nl": "In Pragmatism (1907) James says an idea is true if it 'works' in experience, that is, if it connects us satisfactorily with the rest of our experience. He did not treat truth as detached from human experience and saw beliefs as tools for solving problems (the hammer-and-screw analogy is the lecturer's)."}, "sources": ["src:22499fe9b0"], "flags": []}, {"text": {"fa": "سخنران نظر جیمز را در حد «سودمند یعنی درست، زیان‌بار یعنی نادرست» خلاصه می‌کند. این ساده‌سازی است: جیمز تأکید داشت باور درست باید در درازمدت و در کل با تجربه‌ها و باورهای دیگر سازگار باشد و صرفاً دلخواه یا آرامش‌بخش نباشد. منتقدانی مثل برتراند راسل و جی. ای. مور بر این تکیه کردند که باور می‌تواند سودمند و نادرست باشد (مثلاً باور تسلی‌بخش به چیزی که وجود ندارد) و «سودمند» با «درست» یکی نیست.", "en": "The lecturer reduces James to 'useful means true, harmful means false'. This is a simplification: James insisted that a true belief must fit, in the long run and on the whole, with experience and other beliefs, and not be merely arbitrary or comforting. Critics such as Bertrand Russell and G. E. Moore stressed that a belief can be useful yet false (for example comforting faith in something that does not exist), so 'useful' and 'true' are not the same.", "nl": "The lecturer reduces James to 'useful means true, harmful means false'. This is a simplification: James insisted that a true belief must fit, in the long run and on the whole, with experience and other beliefs, and not be merely arbitrary or comforting. Critics such as Bertrand Russell and G. E. Moore stressed that a belief can be useful yet false (for example comforting faith in something that does not exist), so 'useful' and 'true' are not the same."}, "sources": ["src:9bddcba3d3"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "جیمز در ۱۸۹۰ کتاب «اصول روان‌شناسی» را منتشر کرد که در آن آگاهی را مانند جریانی پیوسته (مفهوم «جریان آگاهی») توصیف می‌کند؛ این اثر بر روان‌شناسی و ادبیات تأثیر گذاشت. سخنران این را درست آورده، اما شمار صفحات کتاب در ترجمهٔ خودکار مبهم است.", "en": "In 1890 James published The Principles of Psychology, which describes consciousness as a continuous flow (the 'stream of consciousness'); the work influenced psychology and literature. The lecturer reports this correctly, although the page count is garbled in the transcript.", "nl": "In 1890 James published The Principles of Psychology, which describes consciousness as a continuous flow (the 'stream of consciousness'); the work influenced psychology and literature. The lecturer reports this correctly, although the page count is garbled in the transcript."}, "sources": ["src:67f9e4b5fd"], "flags": []}], "links": [{"to": "phil:epistemology", "rel": "part-of", "note": {"fa": "نظریه‌ای دربارهٔ معنای صدق و ارزش باور", "en": "A theory of what truth is and what makes belief valuable", "nl": "A theory of what truth is and what makes belief valuable"}}, {"to": "phil:gettier", "rel": "contrasts", "note": {"fa": "دیدگاه سنتی صدق و توجیه در برابر معیار عملی جیمز", "en": "The classical truth-and-justification view versus James's practical test", "nl": "The classical truth-and-justification view versus James's practical test"}}, {"to": "phil:falsification", "rel": "contrasts", "note": {"fa": "پوپر معیار علمی بودن را آزمون‌پذیری می‌داند، نه سودمندی", "en": "Popper judges science by testability, not usefulness", "nl": "Popper judges science by testability, not usefulness"}}, {"to": "phil:james-will-to-believe", "rel": "see-also", "note": {"fa": "کاربرد این نگاه در باور به اختیار", "en": "How James applied this view to belief in free will", "nl": "How James applied this view to belief in free will"}}], "people": ["core:william-james", "core:bertrand-russell", "core:g-e-moore"], "sources": ["src:22499fe9b0", "src:64d205371b", "src:67f9e4b5fd", "src:9bddcba3d3"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:worldview-as-window", "kind": "concept", "title": {"fa": "کلان‌ایده به‌مثابه پنجره: چارچوب حقیقت و تأییدطلبی", "en": "Grand ideas as windows: frames of truth and confirmation", "nl": "Grote ideeën als vensters: waarheidskaders en bevestiging"}, "aliases": [], "parent": "phil:epistemology", "field": "phil:epistemology", "summary": {"fa": "سخنران کلان‌ایده‌ها (جهان‌بینی‌های بزرگ) را به پنجره یا عینک تشبیه می‌کند: هر کس از پشت یکی از آن‌ها به جهان نگاه می‌کند و رخدادها را در همان چارچوب معنا می‌کند. یک مثال او این است که یک جهان‌بینی هر اتفاق را نشانه می‌داند و جهان‌بینی مقابل آن را تصادفی و بی‌معنا. به گفتهٔ او ذهن به‌دنبال شواهد تأییدکننده می‌گردد و شواهد مخالف را نادیده می‌گیرد.", "en": "The lecturer likens grand worldviews to windows or glasses: each person sees the world through one and interprets events inside that frame. One worldview reads every event as a sign, its opposite as pure chance and meaninglessness. He argues the mind hunts for confirming evidence and ignores what contradicts it.", "nl": "Wereldbeelden zijn als vensters: ieder interpreteert gebeurtenissen binnen zijn eigen kader en zoekt vooral bevestigende signalen."}, "points": [{"text": {"fa": "به گفتهٔ سخنران، هر کلان‌ایده یک «چارچوب حقیقت» می‌سازد و هر رخداد (بیماری، تصادف، مرگ) پیش از رسیدن به ادراک ما در همین چارچوب ترجمه می‌شود.", "en": "Per the lecturer, each grand idea builds a 'frame of truth', and every event (illness, accident, death) is translated in that frame before it reaches our perception.", "nl": "Per the lecturer, each grand idea builds a 'frame of truth', and every event (illness, accident, death) is translated in that frame before it reaches our perception."}, "sources": ["src:1160293cd8"], "flags": ["editor-note"]}, {"text": {"fa": "او دو قطب را نشان می‌دهد: نگاهی که همه‌چیز را هدفمند و نشانه‌دار می‌بیند و نگاهی پوچ‌انگار که همه‌چیز را اتفاقی می‌داند؛ و می‌گوید هر دو از درون خود «درست» کار می‌کنند چون همیشه گزاره‌ای برای تأیید خود پیدا می‌کنند.", "en": "He contrasts a view that sees everything as purposeful and sign-laden with a nihilistic view that sees everything as accident, and says each 'works' from within because it can always find confirming statements.", "nl": "He contrasts a view that sees everything as purposeful and sign-laden with a nihilistic view that sees everything as accident, and says each 'works' from within because it can always find confirming statements."}, "sources": ["src:1160293cd8"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، ذهنِ معنابخش دنبال نشانه‌هایی می‌گردد که چارچوبش را تأیید کنند و آنچه آن را رد می‌کند نادیده می‌گیرد؛ نتیجه‌اش «جنگ حقیقت» میان کلان‌ایده‌ها در تاریخ است.", "en": "Per the lecturer, the meaning-making mind seeks signs that confirm its frame and ignores what would refute it, producing a 'war of truths' between grand ideas through history.", "nl": "Per the lecturer, the meaning-making mind seeks signs that confirm its frame and ignores what would refute it, producing a 'war of truths' between grand ideas through history."}, "sources": ["src:1160293cd8"], "flags": ["editor-note"]}, {"text": {"fa": "این بخش با یافته‌های روان‌شناسی دربارهٔ «سوگیری تأییدی» سازگار است، یعنی گرایش به جست‌وجو و تفسیر اطلاعات به‌نفع باورهای پیشین. اما از «هر دو درست‌اند» نمی‌توان نتیجه گرفت که همهٔ چارچوب‌ها از نظر شواهد برابرند؛ این نتیجه نسبی‌گرایانه است و بحث‌برانگیز.", "en": "This fits psychological findings on confirmation bias, the tendency to search for and read information in favour of prior beliefs. But 'both are right' does not imply all frames are equal in evidential support; that step is relativist and contested.", "nl": "This fits psychological findings on confirmation bias, the tendency to search for and read information in favour of prior beliefs. But 'both are right' does not imply all frames are equal in evidential support; that step is relativist and contested."}, "sources": ["src:3cb1c6a606"], "flags": ["contested", "editor-note"]}], "links": [{"to": "psy:ideological-brain", "rel": "see-also", "note": {"fa": "پردازش اطلاعات در مغز ایدئولوژیک", "en": "Information processing in the ideological brain", "nl": "Information processing in the ideological brain"}}, {"to": "phil:paradigms", "rel": "see-also", "note": {"fa": "پارادایم‌ها چارچوب‌هایی مشابه‌اند", "en": "Paradigms are a comparable kind of frame", "nl": "Paradigms are a comparable kind of frame"}}, {"to": "soc:three-homes-of-ideas", "rel": "part-of", "note": {"fa": "ادامهٔ بحث خانهٔ ایده‌ها", "en": "Continues the 'homes of ideas' discussion", "nl": "Continues the 'homes of ideas' discussion"}}], "people": ["core:raymond-s-nickerson"], "sources": ["src:1160293cd8", "src:3cb1c6a606"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:binary-thinking-in-politics", "kind": "concept", "title": {"fa": "تفکر صفر و یکی در سیاست و مهندسی", "en": "Binary thinking in politics versus engineering", "nl": "Binair denken in politiek en techniek"}, "aliases": [], "parent": "phil:epistemology", "field": "phil:epistemology", "summary": {"fa": "یکی از مجری‌ها می‌گوید دانش فنی ناگزیر به‌صورت «درست یا غلط» فکر می‌کند، اما سیاست طیفی از حالت‌هاست؛ آوردن ذهنیت صفر و یکی به سیاست به گفتهٔ او به تندروی می‌انجامد. این مدخل ایده را همراه با محدودیت‌هایش بررسی می‌کند.", "en": "One host says technical fields must think in true/false terms, whereas politics has a spectrum of positions, and importing binary thinking into politics, in his view, leads to extremism. The entry examines the idea and its limits.", "nl": "Een presentator stelt dat technische vakken in waar/onwaar denken, terwijl politiek een spectrum is; binair denken in de politiek leidt volgens hem tot extremisme."}, "points": [{"text": {"fa": "به گفتهٔ مجری، مهندس و پزشک باید حدود مشخصی را رعایت کنند و در سیاست حالت‌های میانی بسیار است؛ او می‌گوید وقتی همان نگاه دوحالتی در سیاست به کار رود، سازش و میانه‌روی ناممکن می‌شود.", "en": "Per the host, engineers and doctors must work within sharp limits while politics has many intermediate states; he says that applying the same two-state view in politics makes compromise and moderation impossible.", "nl": "Per the host, engineers and doctors must work within sharp limits while politics has many intermediate states; he says that applying the same two-state view in politics makes compromise and moderation impossible."}, "sources": ["src:9433492748"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ مجری، ایده‌هایی مانند «یک و بی‌نهایت صفر» را به شعر نزدیک‌تر می‌داند تا نظریهٔ سیاسی. او آن را نمونه‌ای می‌داند که ایدهٔ دوقطبی را به تحلیل سیاسی کشانده است؛ این برداشت از آثار آن نویسنده بحث‌برانگیز است.", "en": "Per the host, ideas like 'one with endless zeros' read more like poetry than political theory. He treats it as an example of dualism entering political analysis; this reading of that author's work is contested.", "nl": "Per the host, ideas like 'one with endless zeros' read more like poetry than political theory. He treats it as an example of dualism entering political analysis; this reading of that author's work is contested."}, "sources": ["src:9433492748"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "نکتهٔ علمی: مهندسی و پزشکی هم کاملاً دوحالتی نیستند؛ تلرانس، احتمال و ریسک در آن‌ها اهمیت دارند. پس تقابل «علوم دقیق صفر و یکی، سیاست طیفی» خود ساده‌سازی است.", "en": "Scholarly caveat: engineering and medicine are not purely binary either; tolerance, probability and risk matter in them, so the contrast 'exact sciences binary, politics a spectrum' is itself a simplification.", "nl": "Scholarly caveat: engineering and medicine are not purely binary either; tolerance, probability and risk matter in them, so the contrast 'exact sciences binary, politics a spectrum' is itself a simplification."}, "sources": ["src:9433492748"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "پژوهش‌هایی دربارهٔ مهندسان در جنبش‌های اسلام‌گرا نشان داده‌اند که مهندسان در برخی گروه‌ها بیش از سهم خود حضور دارند، اما علت آن بحث‌برانگیز است و تعمیم دادن به همهٔ مهندسان درست نیست.", "en": "Studies of engineers in Islamist movements found them over-represented in some groups, but the cause is debated and it would be wrong to generalise to all engineers.", "nl": "Studies of engineers in Islamist movements found them over-represented in some groups, but the cause is debated and it would be wrong to generalise to all engineers."}, "sources": ["src:03eb13a160"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "پوپر در «جامعهٔ باز و دشمنانش» (۱۹۴۵) از اصلاح تدریجی و آزمون‌پذیر در برابر طرح‌های کامل و یکباره دفاع می‌کرد؛ این دیدگاه به ایدهٔ میانه‌روی مجری نزدیک است، هرچند خودِ پوپر هم نقدهایی دارد.", "en": "In The Open Society and Its Enemies (1945) Popper argued for piecemeal, testable reform against total blueprints; this is close to the host's idea of moderation, though Popper too has critics.", "nl": "In The Open Society and Its Enemies (1945) Popper argued for piecemeal, testable reform against total blueprints; this is close to the host's idea of moderation, though Popper too has critics."}, "sources": ["src:c6e52f18f3"], "flags": ["editor-note"]}], "links": [{"to": "phil:fallacies", "rel": "explains", "note": {"fa": "دوقطبی‌سازی کاذب از مغالطه‌های رایج است", "en": "False dichotomy is a common fallacy", "nl": "False dichotomy is a common fallacy"}}, {"to": "soc:revolution-or-reform", "rel": "see-also", "note": {"fa": "انقلاب یا اصلاح", "en": "Revolution or reform", "nl": "Revolution or reform"}}, {"to": "soc:student-movement-embassy-1979-debate", "rel": "see-also", "note": {"fa": "نمونه‌ای که مجری با این ایده تحلیل می‌کند", "en": "The case the host analyses with this idea", "nl": "The case the host analyses with this idea"}}], "people": ["core:karl-popper"], "sources": ["src:03eb13a160", "src:9433492748", "src:c6e52f18f3"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:epoche-theoretical-frame", "kind": "concept", "title": {"fa": "شک دکارتی، اپوخه و چارچوب نظری در مطالعهٔ جهان اجتماعی", "en": "Cartesian doubt, epoché and the theoretical frame in studying the social world", "nl": "Cartesiaanse twijfel, epoché en het theoretisch kader"}, "aliases": [], "parent": "phil:epistemology", "field": "phil:epistemology", "summary": {"fa": "سخنران در پاسخ به پرسش شنوندگان روشی برای مطالعهٔ پدیده‌ها پیشنهاد می‌کند: ابتدا مثل متفکر، باورها و ارزش‌های آماده را موقتاً «در پرانتز» بگذاریم (شک دکارتی و اپوخهٔ هوسرل)، سپس از چند وجه نگاه کنیم و چارچوب نظری خود را بشناسیم. او می‌گوید علوم اجتماعی فرمول نهایی ندارد، چون انسان دگرگون‌شونده است و هر پاسخ هستی‌شناختی معرفت‌شناسی را شکل می‌دهد. چند ادعای او ساده‌شده است و در متن قید شده.", "en": "Answering listeners' questions, the lecturer proposes a method: first, like a thinker, put ready-made beliefs and values temporarily 'in brackets' (Cartesian doubt, Husserl's epoché), then look at a phenomenon from several sides and know one's theoretical frame. He says social science has no final formula because humans keep changing, and each ontological answer shapes epistemology. Several of his claims are simplified, as noted.", "nl": "De spreker pleit voor tijdelijk 'haken om' vooronderstellingen (epoché), meerdere perspectieven en een bewust theoretisch kader; sommige beweringen zijn vereenvoudigd."}, "points": [{"text": {"fa": "دکارت برای رسیدن به پایهٔ محکم دانش، همه‌چیز را موقتاً به شک می‌گیرد. هوسرل در پدیدارشناسی این را به «اپوخه» تبدیل کرد: داوری‌های پیشین (علمی، اخلاقی، گفتمانی) را موقتاً کنار می‌گذاریم تا چیز را آن‌گونه که تجربه می‌شود ببینیم. سخنران می‌گوید این قطع ارتباط فقط در لحظهٔ پژوهش ممکن است و پرانتز دوباره بسته می‌شود، چون زندگی بدون معنا و ارزش ادامه نمی‌یابد؛ فایدهاش دیدن دوبارهٔ جهان بدون لباس معنای آماده است.", "en": "Descartes provisionally doubts everything to find a firm base for knowledge. Husserl turned this into the phenomenological 'epoché': set aside prior judgments (scientific, moral, discursive) temporarily so the thing can be seen as it is experienced. The lecturer stresses that such detachment is possible only during inquiry and the bracket closes again, since life cannot go on without meaning and values; the benefit is seeing the world once without its ready-made 'clothing'.", "nl": "Descartes provisionally doubts everything to find a firm base for knowledge. Husserl turned this into the phenomenological 'epoché': set aside prior judgments (scientific, moral, discursive) temporarily so the thing can be seen as it is experienced. The lecturer stresses that such detachment is possible only during inquiry and the bracket closes again, since life cannot go on without meaning and values; the benefit is seeing the world once without its ready-made 'clothing'."}, "sources": ["src:139cbeab63", "src:4d48b90f11"], "flags": []}, {"text": {"fa": "به گفتهٔ سخنران، هر پاسخ هستی‌شناختی (انسان و جامعه چیست؟) معرفت‌شناسی و طراحی نهادها را شکل می‌دهد. او به کانت اشاره می‌کند که جهان به پرسش‌های ما پاسخ می‌دهد، و مثال می‌زند که قانون‌نویسی برای انسان مهربان با قانون‌نویسی برای انسان «گرگِ انسان» (هابز) فرق دارد. این تعبیر برداشت سخنران از کانت است؛ جملهٔ کانت در دیباچهٔ «سنجش خرد ناب» می‌گوید عقل فقط آنچه را بر طبق طرح خودش پدید آورده می‌فهمد.", "en": "Per the lecturer, each ontological answer (what are humans and society?) shapes epistemology and the design of institutions. He cites Kant to say the world answers the questions we put, and notes that writing law for gentle humans differs from writing it for Hobbes's 'wolf to man'. This is the lecturer's reading of Kant; Kant's own line in the Critique's preface says reason understands only what it produces according to its own plan.", "nl": "Per the lecturer, each ontological answer (what are humans and society?) shapes epistemology and the design of institutions. He cites Kant to say the world answers the questions we put, and notes that writing law for gentle humans differs from writing it for Hobbes's 'wolf to man'. This is the lecturer's reading of Kant; Kant's own line in the Critique's preface says reason understands only what it produces according to its own plan."}, "sources": ["src:139cbeab63", "src:dfc39000ce", "src:0eb3eded8f"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، چارچوب نظری «امضای» پژوهشگر است: کسی که نظم را مبنا بگیرد (او این را «لیبرال» می‌نامد) به مطالعهٔ سازوکار نظم می‌پردازد و می‌پرسد چرا پدیده‌ای با وجود بی‌نظمی ادامه می‌دهد؛ کسی که تضاد را مبنا بگیرد (مارکسیست) به بی‌نظمی می‌پردازد و، به تعبیر او، به‌جای زیستن درون جهان از بالا گله می‌کند و آرمان‌شهر می‌خواهد. این توصیه‌ها بیشتر ارزیابی خود سخنران است.", "en": "Per the lecturer, a theoretical frame is the researcher's 'signature': someone who takes order as the starting point (he labels this 'liberal') studies how order works and asks why a phenomenon continues despite disorder; someone who takes conflict as the starting point (Marxist) studies disorder and, in his words, complains from above and wants a utopia instead of living inside the world. These are largely the lecturer's own judgments.", "nl": "Per the lecturer, a theoretical frame is the researcher's 'signature': someone who takes order as the starting point (he labels this 'liberal') studies how order works and asks why a phenomenon continues despite disorder; someone who takes conflict as the starting point (Marxist) studies disorder and, in his words, complains from above and wants a utopia instead of living inside the world. These are largely the lecturer's own judgments."}, "sources": ["src:139cbeab63"], "flags": ["editor-note"]}, {"text": {"fa": "نکتهٔ احتیاطی: این دوقطبی ساده‌شده است. تحلیل تضاد لزوماً آرمان‌شهری نیست (داهرندورف تضاد را بخشی عادی و حتی مفید جامعه می‌دانست)، و تأکید بر نظم لزوماً لیبرال نیست (کارکردگرایی پارسونز محافظه‌کارانه هم خوانده شده). بیشتر پژوهشگران امروز هر دو چارچوب را برای دیدن وجه‌های متفاوت پدیده به کار می‌برند.", "en": "Caveat: this dichotomy is simplified. Conflict analysis is not necessarily utopian (Dahrendorf treated conflict as a normal and even useful part of society), and an order focus is not necessarily liberal (Parsonian functionalism has also been read as conservative). Most researchers today use both frames to see different facets of a phenomenon.", "nl": "Caveat: this dichotomy is simplified. Conflict analysis is not necessarily utopian (Dahrendorf treated conflict as a normal and even useful part of society), and an order focus is not necessarily liberal (Parsonian functionalism has also been read as conservative). Most researchers today use both frames to see different facets of a phenomenon."}, "sources": ["src:c4522b65ed"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "سخنران می‌گوید برنامهٔ «فیزیک اجتماعی» کنت شکست خورد چون جهان اجتماعی فرمول‌پذیر نیست: انسان‌ها دگرگون می‌شوند و زیست، فرهنگ و تاریخ بر آن‌ها اثر دارد، و تاریخ نظریه‌های اجتماعی هم عمدتاً نام‌گذاری متفاوت وضعیت‌هاست (او سوفیست‌ها را مثال می‌زند که حقیقت را رتوریک می‌دانستند). نکتهٔ احتیاطی: «شکست» اغراق‌آمیز است؛ جامعه‌شناسی کمّی قانون‌مندی‌های احتمالی و جزئی می‌یابد، هرچند فرمول جهان‌شمول ندارد. تصویر سوفیست‌ها هم بیشتر از افلاطون می‌آید و آنان یکدست نبودند.", "en": "The lecturer says Comte's 'social physics' programme failed because the social world cannot be formularised: humans change, shaped by biology, culture and history, and the history of social theory is largely different ways of naming situations (he cites the sophists, who treated truth as rhetoric). Caveat: 'failed' is an overstatement; quantitative sociology finds partial, probabilistic regularities though not universal formulas. The picture of the sophists comes mostly from Plato, and they were not a uniform school.", "nl": "The lecturer says Comte's 'social physics' programme failed because the social world cannot be formularised: humans change, shaped by biology, culture and history, and the history of social theory is largely different ways of naming situations (he cites the sophists, who treated truth as rhetoric). Caveat: 'failed' is an overstatement; quantitative sociology finds partial, probabilistic regularities though not universal formulas. The picture of the sophists comes mostly from Plato, and they were not a uniform school."}, "sources": ["src:139cbeab63", "src:98594852ed"], "flags": ["contested", "editor-note"]}], "links": [{"to": "soc:comte-social-physics", "rel": "critiques", "note": {"fa": "ادعای فرمول‌پذیری جامعه نزد کنت", "en": "Comte's claim that society can be formularised", "nl": "Comte's claim that society can be formularised"}}, {"to": "phil:free-will", "rel": "see-also", "note": {"fa": "جبر و اختیار که جلسهٔ قبل مطرح شد", "en": "Free will and determinism from the previous session", "nl": "Free will and determinism from the previous session"}}, {"to": "soc:revolution-or-reform", "rel": "see-also", "note": {"fa": "نقد آرمان‌شهر نزد پوپر", "en": "Critique of utopianism in Popper", "nl": "Critique of utopianism in Popper"}}], "people": ["core:ren-descartes", "core:edmund-husserl", "core:immanuel-kant", "core:thomas-hobbes", "core:auguste-comte"], "sources": ["src:0eb3eded8f", "src:139cbeab63", "src:4d48b90f11", "src:98594852ed", "src:c4522b65ed", "src:dfc39000ce"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:fallacies", "kind": "concept", "title": {"fa": "مغالطه‌ها و استدلال غیررسمی", "en": "Fallacies and informal reasoning", "nl": "Drogredenen en informeel redeneren"}, "aliases": [], "parent": "phil:epistemology", "field": "phil:epistemology", "summary": {"fa": "حمله به شخص به جای استدلال، مرد پوشالی، شیب لغزنده، توسل به طبیعت یا سنت، دوگانهٔ کاذب، مصادره به مطلوب. دانستن نام مغالطه‌ها مفید است، ولی والتون هشدار می‌دهد: بسیاری از این الگوها در بافت مناسب استدلال‌های معقولی‌اند؛ «مغالطه» بودن به بافت گفت‌وگو بستگی دارد نه به شکل.", "en": "Attacking the person instead of the argument, straw man, slippery slope, appeal to nature or tradition, false dilemma, begging the question. Knowing the names is useful, but Walton warns: many of these patterns are reasonable arguments in the right context; being a \"fallacy\" depends on the dialogue context, not the form.", "nl": "De persoon aanvallen in plaats van het argument, stroman, hellend vlak, beroep op natuur of traditie, vals dilemma, cirkelredenering. De namen kennen is nuttig, maar Walton waarschuwt: veel van deze patronen zijn in de juiste context redelijke argumenten; \"drogreden\" zijn hangt af van de gesprekscontext, niet van de vorm."}, "points": [{"text": {"fa": "والتون (۲۰۰۸): «توسل به مرجع» وقتی مرجع واقعاً متخصص موضوع است استدلال معتبری است؛ «شیب لغزنده» وقتی سازوکار لغزش نشان داده شود معقول است. فهرست مغالطه‌ها را باید به‌عنوان پرسش‌های انتقادی خواند، نه برچسب‌های خاتمه‌دهندهٔ بحث.", "en": "Walton (2008): \"appeal to authority\" is a valid argument when the authority is actually expert on the matter; \"slippery slope\" is reasonable when the mechanism of slipping is shown. Read the list of fallacies as critical questions, not as debate-ending labels.", "nl": "Walton (2008): \"appeal to authority\" is a valid argument when the authority is actually expert on the matter; \"slippery slope\" is reasonable when the mechanism of slipping is shown. Read the list of fallacies as critical questions, not as debate-ending labels."}, "sources": ["src:c3b2b1faf9"], "flags": []}, {"text": {"fa": "شایع‌ترین مغالطه در بحث‌های عمومی، «مغالطهٔ مغالطه» است: تصور اینکه چون استدلالِ کسی معیوب است، نتیجه‌اش غلط است.", "en": "The commonest fallacy in public debate is the \"fallacy fallacy\": assuming that because someone's argument is flawed, their conclusion is false.", "nl": "The commonest fallacy in public debate is the \"fallacy fallacy\": assuming that because someone's argument is flawed, their conclusion is false."}, "sources": ["src:c3b2b1faf9"], "flags": []}], "links": [{"to": "psy:critical-thinking", "rel": "same-as", "note": {"fa": "تفکر نقادانه در ویکی روان", "en": "Critical thinking in the psychology wiki", "nl": "Critical thinking in the psychology wiki"}}, {"to": "psy:bullshit", "rel": "bridges", "note": {"fa": "حرف مفت", "en": "Bullshit", "nl": "Bullshit"}}, {"to": "psy:conspiracy", "rel": "bridges", "note": {"fa": "توطئه‌باوری", "en": "Conspiracy beliefs", "nl": "Conspiracy beliefs"}}], "people": [], "sources": ["src:c3b2b1faf9"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:capabilities", "kind": "concept", "title": {"fa": "رویکرد قابلیت‌ها", "en": "The capabilities approach", "nl": "De capabilities-benadering"}, "aliases": [], "parent": "phil:political", "field": "phil:political", "summary": {"fa": "سن و نوسبام: توسعه و عدالت را نه با درآمد یا رضایت، که با «قابلیت‌ها» بسنجید: آنچه آدم‌ها واقعاً می‌توانند باشند و بکنند (سالم زیستن، آموختن، مشارکت، ابراز خود). دو نفر با درآمد برابر می‌توانند قابلیت‌های بسیار نابرابر داشته باشند. فهرست ده‌گانهٔ نوسبام پایهٔ لایهٔ «برای ایران» در دانش‌سراست.", "en": "Sen and Nussbaum: measure development and justice not by income or satisfaction but by \"capabilities\": what people can actually be and do (live healthily, learn, participate, express themselves). Two people with equal incomes can have very unequal capabilities. Nussbaum's list of ten underlies Daneshsara's \"for Iran\" layer.", "nl": "Sen en Nussbaum: meet ontwikkeling en rechtvaardigheid niet aan inkomen of tevredenheid maar aan \"capabilities\": wat mensen werkelijk kunnen zijn en doen (gezond leven, leren, deelnemen, zich uiten). Twee mensen met gelijk inkomen kunnen zeer ongelijke capabilities hebben. Nussbaums lijst van tien ligt ten grondslag aan de laag \"voor Iran\" in Daneshsara."}, "points": [{"text": {"fa": "سن (۱۹۹۹): آزادی هم هدف توسعه است هم وسیله‌اش؛ قحطی در دموکراسی‌های دارای مطبوعات آزاد رخ نداده است. شاخص توسعهٔ انسانی سازمان ملل از همین رویکرد زاده شد.", "en": "Sen (1999): freedom is both the end and the means of development; no famine has occurred in a democracy with a free press. The UN Human Development Index was born of this approach.", "nl": "Sen (1999): freedom is both the end and the means of development; no famine has occurred in a democracy with a free press. The UN Human Development Index was born of this approach."}, "sources": ["src:8dcb40e0c8"], "flags": []}, {"text": {"fa": "نوسبام (۲۰۱۱): ده قابلیت مرکزی: زندگی؛ سلامت بدنی؛ یکپارچگی بدنی؛ حس و تخیل و اندیشه؛ عواطف؛ عقل عملی؛ پیوستگی (با دیگران و احترام)؛ دیگر گونه‌ها؛ بازی؛ کنترل بر محیط سیاسی و مادی. هر جامعه باید «آستانه‌ای» از هر یک را برای همه تضمین کند.", "en": "Nussbaum (2011): ten central capabilities: life; bodily health; bodily integrity; senses, imagination and thought; emotions; practical reason; affiliation (with others and respect); other species; play; control over one's political and material environment. Every society should guarantee a \"threshold\" of each for all.", "nl": "Nussbaum (2011): ten central capabilities: life; bodily health; bodily integrity; senses, imagination and thought; emotions; practical reason; affiliation (with others and respect); other species; play; control over one's political and material environment. Every society should guarantee a \"threshold\" of each for all."}, "sources": ["src:4d85b3dee0"], "flags": []}, {"text": {"fa": "نقد: فهرست «پدرسالارانه» و غربی خوانده شده؛ سن عمداً فهرست نمی‌دهد و آن را به گفت‌وگوی عمومی هر جامعه می‌سپارد. اندازه‌گیری قابلیت‌ها دشوارتر از اندازه‌گیری درآمد است.", "en": "Critique: the list has been called \"paternalistic\" and Western; Sen deliberately gives no list, leaving it to each society's public deliberation. Measuring capabilities is harder than measuring income.", "nl": "Critique: the list has been called \"paternalistic\" and Western; Sen deliberately gives no list, leaving it to each society's public deliberation. Measuring capabilities is harder than measuring income."}, "sources": ["src:8dcb40e0c8"], "flags": ["editor-note"]}], "links": [{"to": "phil:veil-of-ignorance", "rel": "critiques", "note": {"fa": "رالز و «کالاهای اولیه»", "en": "Rawls and \"primary goods\"", "nl": "Rawls and \"primary goods\""}}, {"to": "soc:mobility", "rel": "bridges", "note": {"fa": "نابرابری فرصت", "en": "Inequality of opportunity", "nl": "Inequality of opportunity"}}, {"to": "psy:autonomy", "rel": "bridges", "note": {"fa": "خودمختاری در روان‌شناسی", "en": "Autonomy in psychology", "nl": "Autonomy in psychology"}}], "people": ["core:amartya-sen", "core:martha-nussbaum"], "sources": ["src:4d85b3dee0", "src:8dcb40e0c8"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:language-games", "kind": "concept", "title": {"fa": "بازی‌های زبانی و معنا به‌مثابهٔ کاربرد", "en": "Language games and meaning as use", "nl": "Taalspelen en betekenis als gebruik"}, "aliases": [], "parent": "phil:epistemology", "field": "phil:epistemology", "summary": {"fa": "ویتگنشتاینِ متأخر: معنای واژه، شیء یا تصویری در ذهن نیست؛ کاربرد آن در یک «بازی زبانی» و شکل زندگی است. بسیاری از مسئله‌های فلسفی («ذهن چیست؟») از بیرون کشیدن واژه از بازی‌اش پدید می‌آیند. استدلال زبان خصوصی می‌گوید زبانی که فقط برای یک نفر معنا داشته باشد ممکن نیست.", "en": "The later Wittgenstein: a word's meaning is not an object or a picture in the mind but its use within a \"language game\" and a form of life. Many philosophical problems (\"what is mind?\") arise from pulling a word out of its game. The private language argument says a language meaningful to only one person is impossible.", "nl": "De latere Wittgenstein: de betekenis van een woord is geen object of beeld in de geest, maar zijn gebruik binnen een \"taalspel\" en een levensvorm. Veel filosofische problemen (\"wat is geest?\") ontstaan door een woord uit zijn spel te trekken. Het privétaalargument zegt dat een taal die slechts voor één persoon betekenis heeft, onmogelijk is."}, "points": [{"text": {"fa": "ویتگنشتاین (۱۹۵۳): «بازی» را نمی‌شود با یک تعریف مشترک تعریف کرد؛ بازی‌ها «شباهت خانوادگی» دارند. این مفهوم به روان‌شناسی مقوله‌بندی (نمونه‌های اولیهٔ راش) و به بحث «اختلال روانی چیست» راه یافت: شاید اختلال‌ها هم فقط شباهت خانوادگی داشته باشند.", "en": "Wittgenstein (1953): \"game\" cannot be defined by one shared feature; games bear \"family resemblances\". The idea passed into the psychology of categorisation (Rosch's prototypes) and into the debate on \"what is a mental disorder\": perhaps disorders too only share family resemblances.", "nl": "Wittgenstein (1953): \"game\" cannot be defined by one shared feature; games bear \"family resemblances\". The idea passed into the psychology of categorisation (Rosch's prototypes) and into the debate on \"what is a mental disorder\": perhaps disorders too only share family resemblances."}, "sources": ["src:0755e72be8"], "flags": []}, {"text": {"fa": "پیامد برای روان‌شناسی: «چرا می‌ترسی؟» را نباید همیشه با جست‌وجوی یک حالت درونی پاسخ داد؛ بخشی از معنای واژه‌های ذهنی در رفتار و بافت است. از این‌جا تا رفتارگرایی منطقی یک قدم است، که ویتگنشتاین خودش برنداشت.", "en": "A consequence for psychology: \"why are you afraid?\" need not always be answered by seeking an inner state; part of the meaning of mental words lies in behaviour and context. From here to logical behaviourism is one step, which Wittgenstein himself did not take.", "nl": "A consequence for psychology: \"why are you afraid?\" need not always be answered by seeking an inner state; part of the meaning of mental words lies in behaviour and context. From here to logical behaviourism is one step, which Wittgenstein himself did not take."}, "sources": ["src:0755e72be8"], "flags": []}], "links": [{"to": "psy:phil-psychiatry", "rel": "bridges", "note": {"fa": "اختلال چیست؟", "en": "What is a disorder?", "nl": "What is a disorder?"}}, {"to": "psy:dx", "rel": "bridges", "note": {"fa": "تشخیص و شباهت خانوادگی", "en": "Diagnosis and family resemblance", "nl": "Diagnosis and family resemblance"}}, {"to": "phil:hard-problem", "rel": "contrasts", "note": {"fa": "ویتگنشتاین «مسئلهٔ دشوار» را سردرگمی زبانی می‌دانست", "en": "Wittgenstein would call the \"hard problem\" a linguistic confusion", "nl": "Wittgenstein would call the \"hard problem\" a linguistic confusion"}}], "people": ["core:ludwig-wittgenstein"], "sources": ["src:0755e72be8"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:kant-duty-ethics-universal-law", "kind": "concept", "title": {"fa": "اخلاق وظیفه‌گرای کانت: قانون همگانی، نیت پاک و انسان به‌مثابه غایت", "en": "Kant's duty ethics: universal law, good will and humanity as an end", "nl": "Kants plichtethiek: algemene wet, goede wil en de mens als doel"}, "aliases": [], "parent": "phil:ethics", "field": "phil:ethics", "summary": {"fa": "کانت، فیلسوف آلمانی عصر روشنگری، اخلاق را بر عقل بنا می‌کند و آن را وظیفه‌محور می‌داند: درستی عمل به پیامدهایش بسته نیست، بلکه به این بستگی دارد که از سر وظیفه انجام شود. معیار او این است که ببینیم اگر همه چنین کنند چه می‌شود، و اینکه هیچ انسانی را فقط ابزار خود نکنیم. سخنران پس از شرح این ایده‌ها، ایرادهای مشهور به آن را نیز می‌شمارد.", "en": "Kant, the German Enlightenment philosopher, grounds ethics in reason and makes it duty-based: an act's rightness does not depend on its consequences but on being done from duty. His tests are whether the maxim could hold for everyone, and never treating a person merely as a tool. The lecturer then lists well-known objections.", "nl": "Kant, Duitse verlichtingsfilosoof, grondt ethiek in de rede en maakt haar plichtgericht: of een daad juist is hangt niet van de gevolgen af, maar van het handelen uit plicht. Zijn toetsen: kan de regel voor iedereen gelden, en gebruik nooit iemand louter als middel."}, "points": [{"text": {"fa": "به گفتهٔ سخنران، در فلسفه اخلاق دو مکتب بزرگ هست: وظیفه‌گرایی (درستی عمل فی‌نفسه) و غایت‌گرایی یا پیامدگرایی (درستی بر پایهٔ نتیجه). کانت وظیفه‌گرا است؛ از نظر او وظیفهٔ عقل‌ورز آن است که درست را انجام دهد، حتی اگر برخلاف تمایل‌هایش باشد.", "en": "Per the lecturer, ethics has two big schools: deontology (acts right in themselves) and consequentialism (right by results). Kant is a deontologist; a rational being must do right even against inclination.", "nl": "Per the lecturer, ethics has two big schools: deontology (acts right in themselves) and consequentialism (right by results). Kant is a deontologist; a rational being must do right even against inclination."}, "sources": ["src:a81ae2997d"], "flags": ["editor-note"]}, {"text": {"fa": "آزمون همگانی‌سازی: اگر قاعدهٔ عمل من را همه رعایت کنند، آیا جهان پایدار می‌ماند؟ مثلاً اگر همه تقلب کنند، نمره و شایسته‌سالاری بی‌معنا می‌شود، پس تقلب نادرست است. این صورت‌بندی مرتبط با «امر مطلق» کانت است.", "en": "The universalization test: if everyone followed my rule, would the practice survive? If all cheated, grades and merit would lose meaning, so cheating is wrong. This corresponds to Kant's categorical imperative.", "nl": "The universalization test: if everyone followed my rule, would the practice survive? If all cheated, grades and merit would lose meaning, so cheating is wrong. This corresponds to Kant's categorical imperative."}, "sources": ["src:a81ae2997d", "src:2f25133bc5"], "flags": []}, {"text": {"fa": "نیت مهم است: کانت میان عمل «مطابق وظیفه» و عمل «از سر وظیفه» فرق می‌گذارد. پس‌دادن کیف پول پیداشده از ترس دوربین یا برای آبرو، با اینکه نتیجه درست است، از نظر اخلاقی ارزش ندارد؛ انگیزه باید فقط درست‌بودن عمل باشد.", "en": "Motive matters: Kant distinguishes acting in accordance with duty from acting from duty. Returning a found wallet out of fear of cameras or for reputation lacks moral worth; the motive must be rightness itself.", "nl": "Motive matters: Kant distinguishes acting in accordance with duty from acting from duty. Returning a found wallet out of fear of cameras or for reputation lacks moral worth; the motive must be rightness itself."}, "sources": ["src:a81ae2997d", "src:2f25133bc5"], "flags": []}, {"text": {"fa": "انسان هدف است، نه ابزار: دیگران هم هدف‌های خود را دارند و نباید فقط وسیلهٔ هدف من باشند. در هر معامله باید حق و خواستهٔ طرف مقابل محترم بماند؛ شکستن قول یا فریب برای رسیدن به هدف خود، استفادهٔ ابزاری از اوست.", "en": "Humanity as an end: others have their own ends and may not be used merely as means. Breaking a promise or deceiving someone to reach my goal treats them instrumentally.", "nl": "Humanity as an end: others have their own ends and may not be used merely as means. Breaking a promise or deceiving someone to reach my goal treats them instrumentally."}, "sources": ["src:a81ae2997d", "src:2f25133bc5"], "flags": []}, {"text": {"fa": "به گفتهٔ سخنران، از دید کانت حتی پرهیز از بدی به امید بهشت، از ترس جهنم، به باور کارما و یا از عشق به خدا نیت اخلاقی ناب نیست. این تفسیر ساده‌شده است: کانت در «نقد عقل عملی» (۱۷۸۸) خدا و جاودانگی را «فروض» عقل عملی می‌داند و ایمان دینی خودش را کنار نمی‌گذاشت؛ نکتهٔ او این است که اخلاق نباید فقط ابزار پاداش باشد.", "en": "Per the lecturer, for Kant even avoiding wrong from hope of heaven, fear of hell, karma or love of God lacks pure moral motive. This is simplified: in the Critique of Practical Reason (1788) Kant treats God and immortality as postulates of practical reason and kept his religious faith; his point is that morality must not be a mere means to reward.", "nl": "Per the lecturer, for Kant even avoiding wrong from hope of heaven, fear of hell, karma or love of God lacks pure moral motive. This is simplified: in the Critique of Practical Reason (1788) Kant treats God and immortality as postulates of practical reason and kept his religious faith; his point is that morality must not be a mere means to reward."}, "sources": ["src:a81ae2997d", "src:c5ae2d8ab8"], "flags": ["editor-note", "contested"]}, {"text": {"fa": "ایرادهای رایج، که سخنران هم می‌آورد: اگر پناهنده‌ای را در خانه پنهان کرده‌اید و پلیس مخفی می‌پرسد، آیا دروغ نگفتن درست است؟ خود کانت در مقالهٔ «دربارهٔ حق مفروض دروغ‌گفتن از سر انسان‌دوستی» (۱۷۹۷) پاسخ سخت‌گیرانه داد که پژوهشگران بعدی تعدیلش کرده‌اند. موارد خاکستری مثل مرگ خودخواسته و اعدام نیز نشان می‌دهند که قاعدهٔ مطلق همیشه کافی نیست و غایت‌گرایی هم سهمی دارد.", "en": "Common objections, which the lecturer also raises: the murderer-at-the-door case (Kant himself replied strictly in his 1797 essay, which later Kantians have softened), and grey cases such as euthanasia or capital punishment, which suggest absolute rules alone are not enough and consequences also matter.", "nl": "Common objections, which the lecturer also raises: the murderer-at-the-door case (Kant himself replied strictly in his 1797 essay, which later Kantians have softened), and grey cases such as euthanasia or capital punishment, which suggest absolute rules alone are not enough and consequences also matter."}, "sources": ["src:a81ae2997d", "src:3b5af2b053"], "flags": ["contested"]}, {"text": {"fa": "نظر سخنران دربارهٔ اسکاندیناوی (جامعهٔ کم‌دین ولی درستکار) به‌عنوان شاهدی برای آنکه اخلاق بدون ترس از جهنم ممکن است، تنها یک نمونهٔ همبستگی است و علت‌ها (نهادها، رفاه، اعتماد) پیچیده‌اند؛ این نکته باید با داده‌های جامعه‌شناختی سنجیده شود.", "en": "The lecturer's Scandinavia example (secular yet honest societies) as evidence that ethics needs no hell is only a correlation; institutions, welfare and trust also matter and should be weighed with sociological data.", "nl": "The lecturer's Scandinavia example (secular yet honest societies) as evidence that ethics needs no hell is only a correlation; institutions, welfare and trust also matter and should be weighed with sociological data."}, "sources": ["src:a81ae2997d"], "flags": ["contested", "editor-note"]}], "links": [{"to": "phil:three-theories", "rel": "part-of", "note": {"fa": "کانت نماینده نظریهٔ وظیفه‌گرایی در سه نظریهٔ بزرگ اخلاق", "en": "Kant represents deontology among the three great moral theories", "nl": "Kant represents deontology among the three great moral theories"}}, {"to": "phil:ethics", "rel": "part-of", "note": {"fa": "اخلاق", "en": "Ethics", "nl": "Ethics"}}, {"to": "phil:trolley", "rel": "contrasts", "note": {"fa": "مسئلهٔ تراموا تعارض وظیفه‌گرایی و پیامدگرایی را نشان می‌دهد", "en": "The trolley problem exposes the clash of duty and consequences", "nl": "The trolley problem exposes the clash of duty and consequences"}}, {"to": "phil:moral-luck", "rel": "see-also", "note": {"fa": "بخت اخلاقی: ارزش اخلاقی و پیامدهای تصادفی", "en": "Moral luck: moral worth and chance outcomes", "nl": "Moral luck: moral worth and chance outcomes"}}], "people": ["core:immanuel-kant"], "sources": ["src:2f25133bc5", "src:3b5af2b053", "src:a81ae2997d", "src:c5ae2d8ab8"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:uncritical-thinking-traits", "kind": "concept", "title": {"fa": "هشت نشانهٔ تفکر غیرنقادانه در برابر تفکر نقادانه", "en": "Eight marks of uncritical thinking versus critical thinking", "nl": "Acht kenmerken van onkritisch denken"}, "aliases": [], "parent": "phil:epistemology", "field": "phil:epistemology", "summary": {"fa": "سخنران برای مقایسهٔ اندیشمند نقاد و غیرنقاد هشت جفت ویژگی می‌شمارد: بی‌تفاوتی در برابر کنجکاوی، ذهن بسته در برابر ذهن باز، حقیقت‌گریزی در برابر حقیقت‌جویی، بی‌انصافی در برابر انصاف، کتره‌اندیشی در برابر تحلیل‌گری، پریشان‌فکری در برابر انتظام فکری، بی‌اعتمادی به خود در برابر اعتماد به خود، و نابالغی در برابر خردمندی. هر جفت یک عادت ذهنی را نشان می‌دهد که می‌توان آن را در خود و دیگران شناخت. این فهرست جمع‌بندی خود سخنران است و فهرست رسمی یا استاندارد پژوهشی نیست، اما با ایده‌های رایج دربارهٔ «گرایش‌های تفکر نقادانه» هم‌پوشانی دارد.", "en": "The lecturer contrasts the uncritical and the critical thinker through eight pairs: indifference vs curiosity, closed vs open mind, truth-evasion vs truth-seeking, unfairness vs fairness, haphazard thinking vs analysis, scattered thinking vs orderly thinking, self-distrust vs self-trust, and immaturity vs wisdom. Each pair names a mental habit one can spot in oneself and others. The list is the lecturer's own synthesis, not a standard research taxonomy, though it overlaps with common accounts of critical-thinking dispositions.", "nl": "De docent zet de onkritische en de kritische denker tegenover elkaar aan de hand van acht tegenstellingen, zoals onverschilligheid versus nieuwsgierigheid en gesloten versus open geest."}, "points": [{"text": {"fa": "بی‌تفاوتی دو سطح دارد: بی‌توجهی به آنچه بر خود آدم می‌گذرد (مثلاً تسلیم شدن به «تقدیر» به جای تحلیل) و بی‌توجهی به آنچه بر دیگران می‌گذرد. جملهٔ «من سیاسی نیستم» نمونهٔ آن است. به گفتهٔ سخنران، بی‌تفاوتی گاهی سپر دفاعی آدم در برابر فشار است، اما اندیشه‌ورز نمی‌تواند برای همیشه از تحلیل شرایط کنار بکشد و باید دوباره به آن بازگردد.", "en": "Indifference has two levels: ignoring what happens to oneself (for example surrendering to fate instead of analysing) and ignoring what happens to others. The phrase 'I am not political' is an example. Per the lecturer, indifference can be a self-protective shield, but a person who thinks cannot withdraw from analysing conditions for good.", "nl": "Indifference has two levels: ignoring what happens to oneself (for example surrendering to fate instead of analysing) and ignoring what happens to others. The phrase 'I am not political' is an example. Per the lecturer, indifference can be a self-protective shield, but a person who thinks cannot withdraw from analysing conditions for good."}, "sources": ["src:e5f1685e69"], "flags": ["editor-note"]}, {"text": {"fa": "ذهن بسته در این روایت ذهنی است که چارچوب‌های از پیش ساخته را نگه می‌دارد و هر داده یا توضیح تازه را تهدید می‌بیند؛ نشانه‌هایش خشم، تمسخر و اتهام توطئه است و حس «پایان راه رسیدن» می‌دهد. در برابرش ذهن باز قرار دارد. سخنران کتاب «جامعهٔ باز و دشمنانش» پوپر را به عنوان مثالی برای ذهن باز می‌آورد.", "en": "A closed mind keeps ready-made frameworks and treats any new datum or explanation as a threat. Signs are anger, mockery and accusations of conspiracy, plus a feeling of having reached the end of inquiry. The open mind is the opposite. The lecturer points to Popper's The Open Society and Its Enemies as an example of open-mindedness.", "nl": "A closed mind keeps ready-made frameworks and treats any new datum or explanation as a threat. Signs are anger, mockery and accusations of conspiracy, plus a feeling of having reached the end of inquiry. The open mind is the opposite. The lecturer points to Popper's The Open Society and Its Enemies as an example of open-mindedness."}, "sources": ["src:e5f1685e69", "src:7de66f5253"], "flags": ["editor-note"]}, {"text": {"fa": "بی‌انصافی یعنی برخورد نابرابر با نظر مخالف، وقتی که احساسات یا منافع شخصی و گروهی در میان است: آدم از گروه و خرده‌فرهنگ خود پاسبانی می‌کند و چشم بر داده‌هایی می‌بندد که باورهای مقدسش را زیر سؤال می‌برد. سخنران آن را نوعی خودفریبی می‌داند. این همان چیزی است که در روان‌شناسی «سوگیری تأییدی» و استدلال انگیزه‌دار نامیده می‌شود.", "en": "Unfairness means treating opposing views unequally when feelings or personal and group interests are at stake: people guard their group and subculture and shut their eyes to data that challenge their cherished beliefs. The lecturer calls this a kind of self-deception. Psychology studies the same pattern as confirmation bias and motivated reasoning.", "nl": "Unfairness means treating opposing views unequally when feelings or personal and group interests are at stake: people guard their group and subculture and shut their eyes to data that challenge their cherished beliefs. The lecturer calls this a kind of self-deception. Psychology studies the same pattern as confirmation bias and motivated reasoning."}, "sources": ["src:e5f1685e69"], "flags": ["editor-note"]}, {"text": {"fa": "کتره‌اندیشی یعنی اندیشیدن بدون پایه و دلیل: ساده‌سازی بیش از حد، ناتوانی در دیدن علت‌ها، نگاه غیرتاریخی که هر چیز را رخدادی لحظه‌ای می‌بیند، ارجاع به خود («حدس من این است» یا «دلم روشن است») و پیش‌بینی آینده بی‌مدرک. پریشان‌فکری نقطهٔ مقابل تمرکز است: تداعی‌های آزاد که موضوع را عوض می‌کنند و متن یا سخنرانی را بی‌نتیجه و بی‌ساختار می‌گذارند. بی‌اعتمادی به خود با شعار کانت در پاسخ به «روشنگری چیست؟» (جرئت کن از فهم خود بهره بگیری) سنجیده می‌شود و به شکل پناه بردن به نقل‌قول‌های فراوان و مرجع‌باوری دیده می‌شود.", "en": "Haphazard thinking means reasoning without grounds: oversimplifying, missing causes, ahistorical thinking that treats everything as an isolated event, pointing to oneself ('my hunch', 'my heart is clear') and predicting the future without evidence. Scattered thinking is the opposite of focus: free association that shifts topic and leaves a text or talk without structure or conclusion. Self-distrust is measured against Kant's answer to 'What is Enlightenment?' (dare to use your own understanding) and shows up as sheltering behind piles of quotations and deference to authority.", "nl": "Haphazard thinking means reasoning without grounds: oversimplifying, missing causes, ahistorical thinking that treats everything as an isolated event, pointing to oneself ('my hunch', 'my heart is clear') and predicting the future without evidence. Scattered thinking is the opposite of focus: free association that shifts topic and leaves a text or talk without structure or conclusion. Self-distrust is measured against Kant's answer to 'What is Enlightenment?' (dare to use your own understanding) and shows up as sheltering behind piles of quotations and deference to authority."}, "sources": ["src:e5f1685e69", "src:9f5a46df56"], "flags": ["editor-note"]}, {"text": {"fa": "بحث دربارهٔ حقیقت‌گریزی: به گفتهٔ سخنران، جامعهٔ زیر استبداد ریاکاری را ترویج می‌کند و ریا مثل خاکی است که روی چهرهٔ حقیقت ریخته می‌شود. او میان «امر واقع» (قطعی و عملی) و «حقیقت اجتماعی» (که در قلمرو اندیشه همیشه قطعیت کامل ندارد) فرق می‌گذارد و می‌گوید بعضی با ایجاد تردید در امر واقع می‌خواهند راه حقیقت‌یابی را ببندند.", "en": "On truth-evasion: per the lecturer, a society under despotism encourages hypocrisy, which works like dust thrown on the face of truth. He distinguishes between a 'fact' (settled, practical) and 'social truth' (which in the realm of ideas never has complete certainty) and says some people sow doubt about the fact itself in order to block the path to finding the truth.", "nl": "On truth-evasion: per the lecturer, a society under despotism encourages hypocrisy, which works like dust thrown on the face of truth. He distinguishes between a 'fact' (settled, practical) and 'social truth' (which in the realm of ideas never has complete certainty) and says some people sow doubt about the fact itself in order to block the path to finding the truth."}, "sources": ["src:e5f1685e69"], "flags": ["editor-note"]}, {"text": {"fa": "نکتهٔ احتیاطی: شک‌ورزی دربارهٔ گزارش‌های اولیهٔ یک رویداد، به‌ویژه وقتی شواهد هنوز کم است، خودش بخشی از تفکر نقادانه است و هر شک‌ورزی را نمی‌توان ترفند سیاسی دانست. مرز کار در این است که شک بر پایهٔ شواهد و روش باشد یا برای فرار از بحث. این بخش از سخنرانی به رویدادهای سیاسی روز اشاره دارد که در این مدخل بررسی نمی‌شود.", "en": "Caveat: doubting early reports of an event, especially while evidence is thin, is itself part of critical thinking, so not every doubt can be dismissed as a political trick. The line is whether the doubt rests on evidence and method or serves to dodge the discussion. This part of the talk refers to current political events, which this entry does not assess.", "nl": "Caveat: doubting early reports of an event, especially while evidence is thin, is itself part of critical thinking, so not every doubt can be dismissed as a political trick. The line is whether the doubt rests on evidence and method or serves to dodge the discussion. This part of the talk refers to current political events, which this entry does not assess."}, "sources": ["src:e5f1685e69"], "flags": ["contested", "editor-note"]}], "links": [{"to": "phil:epistemology", "rel": "part-of", "note": {"fa": "این ویژگی‌ها به فضیلت‌های معرفتی و روش درست باور ساختن مربوط‌اند.", "en": "These traits belong to epistemic virtues and to forming beliefs well.", "nl": "These traits belong to epistemic virtues and to forming beliefs well."}}, {"to": "psy:cognitive-biases", "rel": "see-also", "note": {"fa": "بی‌انصافی و ذهن بسته با سوگیری‌های شناختی هم‌پوشانی دارند.", "en": "Unfairness and closed-mindedness overlap with cognitive biases.", "nl": "Unfairness and closed-mindedness overlap with cognitive biases."}}, {"to": "phil:fallacies", "rel": "see-also", "note": {"fa": "ادامهٔ همین جلسه فهرستی از مغالطه‌ها را می‌آورد.", "en": "The same session continues with a list of fallacies.", "nl": "The same session continues with a list of fallacies."}}, {"to": "phil:falsification", "rel": "see-also", "note": {"fa": "پوپر و ذهن باز با روحیهٔ ابطال‌پذیری پیوند دارند.", "en": "Popper's open-mindedness ties to the spirit of falsifiability.", "nl": "Popper's open-mindedness ties to the spirit of falsifiability."}}], "people": ["core:immanuel-kant", "core:karl-popper"], "sources": ["src:7de66f5253", "src:9f5a46df56", "src:e5f1685e69"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:myth-legend-fairytale-cassirer", "kind": "concept", "title": {"fa": "اسطوره، افسانه، قصهٔ پریان و تاریخ؛ زبان و اسطوره نزد کاسیرر", "en": "Myth, legend, fairy tale and history; language and myth in Cassirer", "nl": "Mythe, legende, sprookje en geschiedenis; taal en mythe bij Cassirer"}, "aliases": [], "parent": "phil:life", "field": "phil:life", "summary": {"fa": "سخنران بین اسطوره (خیالی)، افسانه یا لجند (واقعیت به‌همراه افزوده‌ها) و تاریخ (آنچه رخ داده) فرق می‌گذارد و برای قصهٔ پریان هم ویژگی‌هایی می‌شمارد. سپس به کتاب «زبان و اسطوره» کاسیرر و به کانت اشاره می‌کند تا نشان دهد واقعیت از صافی زبان و ادراک می‌گذرد. او از اسطوره‌ها برای فهم موقعیت‌های زندگی هم استفاده می‌کند، ولی آن را بازی فکری می‌داند نه علم.", "en": "The lecturer separates myth (imaginary), legend (a real event plus later additions) and history (what happened), and lists traits of the fairy tale. He then points to Cassirer's Language and Myth and to Kant to argue that reality passes through the filter of language and perception. He also uses myths to read life situations, calling it an intellectual game rather than science.", "nl": "De spreker onderscheidt mythe, legende en geschiedenis en noemt kenmerken van het sprookje. Hij verwijst naar Cassirer en Kant om te laten zien dat de werkelijkheid door taal en waarneming gefilterd wordt."}, "points": [{"text": {"fa": "به گفتهٔ سخنران: «اسطوره» کاملاً خیالی است، «افسانه/لجند» برگرفته از یک واقعیت است که در تاریخ چیزهایی به آن افزوده شده، و «تاریخ» آنچه واقعاً رخ داده. او می‌گوید اسطوره از زمان پیش از آفرینش جهان می‌گوید و مجازات و سرنوشت تراژیک دارد (مانند اطلس یا اسطورهٔ زروان)، افسانه پس از آفرینش رخ می‌دهد، و قصهٔ پریان («یکی بود یکی نبود») دنیایی بازیگوش و کودکانه با پایان خوش دارد. خودش می‌گوید مرز اسطوره و افسانه بسیار ظریف است.", "en": "Per the lecturer: 'myth' is wholly imaginary, 'legend' derives from a real event to which later additions were attached, and 'history' is what actually happened. He says myth speaks of a time before creation and carries punishment and tragic fate (Atlas, or the Zurvan myth), legend occurs after creation, and the fairy tale ('once upon a time') is a playful, childlike world with a happy ending. He admits the line between myth and legend is very fine.", "nl": "Per the lecturer: 'myth' is wholly imaginary, 'legend' derives from a real event to which later additions were attached, and 'history' is what actually happened. He says myth speaks of a time before creation and carries punishment and tragic fate (Atlas, or the Zurvan myth), legend occurs after creation, and the fairy tale ('once upon a time') is a playful, childlike world with a happy ending. He admits the line between myth and legend is very fine."}, "sources": ["src:131af1a2fa", "src:1ceef98895"], "flags": ["editor-note"]}, {"text": {"fa": "نکتهٔ علمی: تعریف این اصطلاحات نزد پژوهشگران فرق می‌کند و تقسیم «پیش از آفرینش/پس از آفرینش» فقط یکی از ملاک‌هاست (فولکلورشناسان بیشتر به باور و زمان و مکان روایت توجه می‌کنند). روایت زروان که دو دوقلوی نیکی و بدی در زهدان او بودند در منابع زروانی و نوشته‌های ارمنی آمده، اما زروانگرایی سنتی حاشیه‌ای یا بحث‌برانگیز در دین زرتشتی است و نمایندهٔ کل آن نیست.", "en": "Scholarly caveat: scholars define these terms differently and the 'before/after creation' split is only one criterion (folklorists often look at belief, time and setting of the tale). The Zurvan story of twin good and evil in his womb is attested in Zurvanite and Armenian sources, but Zurvanism is a debated, minority strand of Zoroastrianism and does not represent the whole religion.", "nl": "Scholarly caveat: scholars define these terms differently and the 'before/after creation' split is only one criterion (folklorists often look at belief, time and setting of the tale). The Zurvan story of twin good and evil in his womb is attested in Zurvanite and Armenian sources, but Zurvanism is a debated, minority strand of Zoroastrianism and does not represent the whole religion."}, "sources": ["src:5b9e48036b", "src:1ceef98895"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، کاسیرر در «زبان و اسطوره» نشان می‌دهد که چگونه زبان در دین کار می‌کند و تک‌خدایی چگونه در زبان ریشه دارد: یک واژه می‌تواند همهٔ صفت‌های پیشین را، حتی متناقض‌هایشان را، در خود جمع کند. او نتیجه می‌گیرد واقعیت همیشه از صافی کلمه می‌گذرد و بازروایتِ هر رویداد، رویداد تازه‌ای می‌سازد. (این بازگویی سخنران است؛ برای ادعای دقیق کاسیرر باید به خود کتاب رجوع کرد.)", "en": "Per the lecturer, Cassirer's Language and Myth shows how language works in religion and how monotheism is rooted in language: a single word can absorb all earlier attributes, even contradictory ones. He concludes that reality always passes through the filter of words and that retelling an event creates a new event. (This is the lecturer's account; consult the book for Cassirer's exact claim.)", "nl": "Per the lecturer, Cassirer's Language and Myth shows how language works in religion and how monotheism is rooted in language: a single word can absorb all earlier attributes, even contradictory ones. He concludes that reality always passes through the filter of words and that retelling an event creates a new event. (This is the lecturer's account; consult the book for Cassirer's exact claim.)"}, "sources": ["src:131af1a2fa", "src:a3a55d7013"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، کانت میان نومن (شیء فی‌نفسه) و فنومن (پدیدار) فرق گذاشت و ما فقط به پدیدار دسترسی داریم؛ پدیدارشناسی از این‌جا می‌آید و می‌گوید «واقعیت همان است که ادراک می‌کنی». او از اینجا نتیجه می‌گیرد که بهتر است در «ناتمام ماندن» پرسش‌هایی مانند اینکه پدر واقعاً به آمریکا رفته یا نه، کنجکاوی را کنار بگذاریم.", "en": "Per the lecturer, Kant distinguished noumenon (thing-in-itself) from phenomenon (appearance), and we only reach appearances; phenomenology follows from this and says 'reality is what you perceive'. From this he suggests dropping the curiosity about unresolved questions such as whether the father really went to America.", "nl": "Per the lecturer, Kant distinguished noumenon (thing-in-itself) from phenomenon (appearance), and we only reach appearances; phenomenology follows from this and says 'reality is what you perceive'. From this he suggests dropping the curiosity about unresolved questions such as whether the father really went to America."}, "sources": ["src:131af1a2fa", "src:b033dc49f5"], "flags": ["editor-note"]}, {"text": {"fa": "نکتهٔ علمی: کانت منکر وجود شیء فی‌نفسه نبود و فقط می‌گفت شناخت ما به آن نمی‌رسد؛ و پدیدارشناسی هوسرل هم ساده‌شده‌اش «واقعیت همان ادراک توست» نیست. همچنین نادیده‌گرفتن پرسش واقعیت برای تحلیل ادبی قصه رواست، اما در تاریخ یا حقوق تفاوت «اتفاق افتاده» و «روایت شده» مهم می‌ماند.", "en": "Scholarly caveat: Kant did not deny that things-in-themselves exist, only that we can know them, and Husserl's phenomenology is not simply 'reality equals your perception'. Setting aside the factual question is fine for literary analysis of a tale, but in history or law the difference between 'happened' and 'narrated' still matters.", "nl": "Scholarly caveat: Kant did not deny that things-in-themselves exist, only that we can know them, and Husserl's phenomenology is not simply 'reality equals your perception'. Setting aside the factual question is fine for literary analysis of a tale, but in history or law the difference between 'happened' and 'narrated' still matters."}, "sources": ["src:b033dc49f5"], "flags": ["contested", "editor-note"]}], "links": [{"to": "phil:language-games", "rel": "see-also", "note": {"fa": "زبان و معنا", "en": "Language and meaning", "nl": "Language and meaning"}}, {"to": "phil:cave", "rel": "bridges", "note": {"fa": "ادراک و واقعیت", "en": "Perception and reality", "nl": "Perception and reality"}}, {"to": "soc:sacred-and-taboo", "rel": "see-also", "note": {"fa": "اسطوره و امر قدسی", "en": "Myth and the sacred", "nl": "Myth and the sacred"}}, {"to": "phil:stories-memory-lying-fantasy", "rel": "see-also", "note": {"fa": "قصه و زندگی", "en": "Story and life", "nl": "Story and life"}}], "people": ["core:ernst-cassirer", "core:immanuel-kant"], "sources": ["src:131af1a2fa", "src:1ceef98895", "src:5b9e48036b", "src:a3a55d7013", "src:b033dc49f5"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:sharia-politics-pluralism-reconciliation", "kind": "concept", "title": {"fa": "شریعت و دولت، انشقاق اجتماعی و آشتی: دیدگاه برهانی دربارهٔ گذار", "en": "Sharia and the state, social division and reconciliation: Borhani's view on transition", "nl": "Sharia en staat, maatschappelijke verdeeldheid en verzoening: Borhani's visie op overgang"}, "aliases": [], "parent": "phil:political", "field": "phil:political", "summary": {"fa": "برهانی می‌گوید باید «فقه» را از «دغدغه‌های متشرعان» جدا کرد: بسیاری از سیاست‌هایی که به نام اسلام اجرا می‌شود (فیلترینگ، گزینش، نظارت استصوابی) ریشهٔ فقهی ندارد. او «انشقاق اجتماعی» را خط قرمز می‌داند، به آشتی مثل نمونهٔ آفریقای جنوبی اشاره می‌کند و هر دو طرف را به نرمش و فهرست‌کردن مسائل واقعی دعوت می‌کند. این‌ها نظر و امید او است و بخشی از ادعاهای تاریخی‌اش محل بحث است.", "en": "Borhani says 'fiqh' must be separated from the 'concerns of the devout': many state policies carried out in Islam's name (internet filtering, screening of candidates, approbatory vetting) have no juristic basis. He treats social division as a red line, points to reconciliation as in South Africa, and urges both sides to be flexible and to list the real problems. These are his views and hopes, and some of his historical claims are disputed.", "nl": "Borhani scheidt fiqh van de zorgen van gelovigen: veel beleid in naam van de islam heeft geen juridische basis. Hij ziet maatschappelijke splitsing als rode lijn en pleit voor verzoening en het opstellen van concrete problemen."}, "points": [{"text": {"fa": "به گفتهٔ سخنران، سیاست‌هایی مثل فیلترینگ، سخت‌گیری در پوشش، گزینش بر پایهٔ اعتقاد یا نسب و جرم «تبلیغ علیه نظام» از فقه نیامده‌اند؛ او مثال می‌زند که مولا علی (ع) زیاد بن ابیه را که نسب نامعلوم داشت والی فارس کرد. مسئلهٔ تاریخی: انتصاب زیاد در منابع کهن آمده، اما سخنران آن را برای نتیجه‌گیری دربارهٔ گزینش امروز به کار می‌برد که یک استدلال سیاسی است نه حکم فقهی قطعی.", "en": "Per the lecturer, policies such as filtering, strict dress rules, screening by belief or lineage, and the offence of 'propaganda against the system' do not come from fiqh; he notes that Imam Ali appointed Ziyad ibn Abihi, whose paternity was unknown, as governor of Fars. Note: the appointment is in early sources, but the lecturer uses it to draw conclusions about present-day vetting, which is a political argument rather than a settled juristic ruling.", "nl": "Per the lecturer, policies such as filtering, strict dress rules, screening by belief or lineage, and the offence of 'propaganda against the system' do not come from fiqh; he notes that Imam Ali appointed Ziyad ibn Abihi, whose paternity was unknown, as governor of Fars. Note: the appointment is in early sources, but the lecturer uses it to draw conclusions about present-day vetting, which is a political argument rather than a settled juristic ruling."}, "sources": ["src:8d9faff0ab"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، وقتی شورای نگهبان قانون‌های مجلس را به رأی چهار فقیه از شش فقیه متوقف می‌کند، رأی اقلیتی از فقیهان جای رأی نمایندگان را می‌گیرد؛ او می‌گوید ملت مقلد این چهار نفر نیستند. نظر مقابل: در قانون اساسی، تطبیق مصوبات با شرع به عهدهٔ فقهای شورای نگهبان است و حامیان آن آن را ضامن اسلامی‌بودن نظام می‌دانند، و برخی منتقدان نیز به جای حذف آن، اصلاح سازوکار را پیشنهاد می‌کنند.", "en": "Per the lecturer, when the Guardian Council blocks parliamentary bills by the vote of four of its six jurists, a minority of jurists replaces the elected deputies, and he says the nation does not follow those four as a religious authority. Opposing view: the constitution assigns checking bills against sharia to the council's jurists, and supporters see this as the guarantee of the system's Islamic character; some critics propose reforming the mechanism rather than abolishing it.", "nl": "Per the lecturer, when the Guardian Council blocks parliamentary bills by the vote of four of its six jurists, a minority of jurists replaces the elected deputies, and he says the nation does not follow those four as a religious authority. Opposing view: the constitution assigns checking bills against sharia to the council's jurists, and supporters see this as the guarantee of the system's Islamic character; some critics propose reforming the mechanism rather than abolishing it."}, "sources": ["src:8d9faff0ab"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، بر پایهٔ قرآن (ماجرای هارون و گوساله) و سیرهٔ امام علی، «پیشگیری از انشقاق و جنگ مردم با مردم» خط قرمز است و حتی تعطیل‌کردن بعضی احکام را موجه می‌کند. این برداشت او از متن‌ها است: در سنت اسلامی دربارهٔ اولویت وحدت و حفظ حق و حقیقت اختلاف نظر هست و روایت‌های مورد اشاره باید در منابع حدیثی بررسی شوند. او همچنین جمله‌ای از پیامبر (خون‌های جاهلیت زیر پای من) را در فتح مکه نقل می‌کند؛ در منابع رایج این جمله به خطبهٔ حجة‌الوداع نسبت داده می‌شود.", "en": "Per the lecturer, on the basis of the Quran (the story of Aaron and the calf) and Imam Ali's conduct, preventing division and people fighting people is a red line that can justify suspending certain rulings. This is his reading of the texts: Islamic tradition disagrees about how to weigh unity against truth and right, and the narrations cited should be checked in hadith sources. He also quotes the Prophet's 'blood of the Jahiliyya is under my feet' at the conquest of Mecca; in common sources this statement is attributed to the Farewell Pilgrimage sermon.", "nl": "Per the lecturer, on the basis of the Quran (the story of Aaron and the calf) and Imam Ali's conduct, preventing division and people fighting people is a red line that can justify suspending certain rulings. This is his reading of the texts: Islamic tradition disagrees about how to weigh unity against truth and right, and the narrations cited should be checked in hadith sources. He also quotes the Prophet's 'blood of the Jahiliyya is under my feet' at the conquest of Mecca; in common sources this statement is attributed to the Farewell Pilgrimage sermon."}, "sources": ["src:8d9faff0ab"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، آشتی و گذشتن از زخم‌های گذشته (مثل آفریقای جنوبی ماندلا) بهتر از محاکمه و انتقام است و کسانی که زخم خورده‌اند باید گام اول را بردارند. نظر مقابل: در آفریقای جنوبی «کمیسیون حقیقت و آشتی» عفو را به اعتراف و بیان حقیقت مشروط کرد و منتقدان معتقدند در بسیاری از جاها بی‌کیفری عدالت را قربانی می‌کند. پس انتخاب میان آشتی و پاسخ‌گویی ساده نیست.", "en": "Per the lecturer, reconciliation and moving past old wounds (as in Mandela's South Africa) is better than trials and revenge, and those who were wounded should take the first step. Opposing view: South Africa's Truth and Reconciliation Commission tied amnesty to confession and disclosure, and critics argue that impunity in many places sacrifices justice. The choice between reconciliation and accountability is not simple.", "nl": "Per the lecturer, reconciliation and moving past old wounds (as in Mandela's South Africa) is better than trials and revenge, and those who were wounded should take the first step. Opposing view: South Africa's Truth and Reconciliation Commission tied amnesty to confession and disclosure, and critics argue that impunity in many places sacrifices justice. The choice between reconciliation and accountability is not simple."}, "sources": ["src:8d9faff0ab"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، راه عملی این است که مسائل واقعی (حقوق شهروندی، نظر مردم در حکمرانی، حقوق زنان و اقلیت‌ها) فهرست شوند و دو طرف، به‌ویژه قدرت حاکم، نرمش نشان دهد و آزادی بیان زمینهٔ گفتگوی نخبگان باشد. او خوش‌بین است که گشایش سیاسی تازه ادامه می‌یابد؛ این پیش‌بینی او است و پایه‌ای مستقل ندارد.", "en": "Per the lecturer, the practical path is to list the real problems (citizens' rights, public voice in governance, rights of women and minorities), for both sides, especially those in power, to show flexibility, and for free speech to underpin elite dialogue. He is optimistic that the recent political opening will continue; this is his prediction and has no independent support here.", "nl": "Per the lecturer, the practical path is to list the real problems (citizens' rights, public voice in governance, rights of women and minorities), for both sides, especially those in power, to show flexibility, and for free speech to underpin elite dialogue. He is optimistic that the recent political opening will continue; this is his prediction and has no independent support here."}, "sources": ["src:8d9faff0ab"], "flags": ["editor-note"]}], "links": [{"to": "soc:religion-ideology-iran-debate", "rel": "see-also", "note": {"fa": "بحث دیگر دربارهٔ دین و ایدئولوژی در ایران", "en": "Another debate on religion and ideology in Iran", "nl": "Another debate on religion and ideology in Iran"}}, {"to": "soc:fiqh-minimal-vs-totalizing", "rel": "see-also", "note": {"fa": "ادامهٔ بحث تمامیت‌خواهی دو طرف", "en": "Continuation of the 'both camps' argument", "nl": "Continuation of the 'both camps' argument"}}, {"to": "phil:two-liberties", "rel": "see-also", "note": {"fa": "پیوند با دو مفهوم آزادی", "en": "Link to two concepts of liberty", "nl": "Link to two concepts of liberty"}}, {"to": "soc:revolution-or-reform", "rel": "bridges", "note": {"fa": "پیوند با بحث انقلاب یا اصلاح", "en": "Link to the revolution-or-reform debate", "nl": "Link to the revolution-or-reform debate"}}], "people": ["core:mohsen-borhani", "core:nelson-mandela"], "sources": ["src:8d9faff0ab"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:science", "kind": "field", "title": {"fa": "فلسفهٔ علم", "en": "Philosophy of science", "nl": "Wetenschapsfilosofie"}, "aliases": [], "parent": "phil:phil", "field": null, "summary": {"fa": "علم چه فرقی با غیرعلم دارد، چگونه عوض می‌شود، و آیا می‌تواند از ارزش‌ها خالی باشد؟", "en": "How does science differ from non-science, how does it change, and can it be free of values?", "nl": "Hoe verschilt wetenschap van niet-wetenschap, hoe verandert ze, en kan ze vrij van waarden zijn?"}, "points": [], "links": [{"to": "psy:phil-science", "rel": "same-as", "note": {"fa": "فلسفهٔ علم در ویکی روان", "en": "Philosophy of science in the psychology wiki", "nl": "Philosophy of science in the psychology wiki"}}], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:flying-man", "kind": "concept", "title": {"fa": "انسان معلق ابن سینا", "en": "Avicenna's floating man", "nl": "Avicenna's zwevende mens"}, "aliases": ["انسان پرنده", "Flying man", "
