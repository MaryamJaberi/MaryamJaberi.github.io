il:ethics", "field": "phil:ethics", "summary": {"fa": "پیامدگرایی (میل): کار درست آن است که بیشترین خیر را برای بیشترین افراد بیاورد. وظیفه‌گرایی (کانت): طوری عمل کن که بتوانی بخواهی قاعده‌ات قانون همگانی شود، و انسان را هرگز صرفاً وسیله قرار نده. اخلاق فضیلت (ارسطو): بپرس آدم خوب در این موقعیت چه می‌کرد. هر سه در جایی شکست می‌خورند و همین است که بحث زنده مانده.", "en": "Consequentialism (Mill): the right act brings the greatest good to the greatest number. Deontology (Kant): act so you could will your maxim to be universal law, and never treat a person merely as a means. Virtue ethics (Aristotle): ask what a good person would do here. Each fails somewhere, which is why the debate lives.", "nl": "Consequentialisme (Mill): de juiste daad brengt het grootste goed voor de meesten. Plichtethiek (Kant): handel zo dat je kunt willen dat je maxime een algemene wet wordt, en behandel een mens nooit louter als middel. Deugdethiek (Aristoteles): vraag wat een goed mens hier zou doen. Elk faalt ergens, en daarom leeft het debat."}, "points": [{"text": {"fa": "میل (۱۸۶۱): فایده را با کیفیت لذت‌ها می‌سنجد («سقراط ناراضی بهتر از خوک راضی»)؛ ایراد کلاسیک: اگر قربانی کردن یک بی‌گناه خوشبختی کل را بیشتر کند، پیامدگرایی ساده آن را تجویز می‌کند.", "en": "Mill (1861): weighs utility by the quality of pleasures (\"better Socrates dissatisfied than a pig satisfied\"); the classic objection: if sacrificing an innocent raises total happiness, simple consequentialism prescribes it.", "nl": "Mill (1861): weighs utility by the quality of pleasures (\"better Socrates dissatisfied than a pig satisfied\"); the classic objection: if sacrificing an innocent raises total happiness, simple consequentialism prescribes it."}, "sources": ["src:b73de9ad07"], "flags": []}, {"text": {"fa": "کانت (۱۷۸۵): ارزش اخلاقی در نیت و از روی وظیفه عمل کردن است، نه نتیجه؛ ایراد کلاسیک: دروغ نگفتن حتی به قاتلی که سراغ دوستت را می‌گیرد.", "en": "Kant (1785): moral worth lies in the will and acting from duty, not in outcomes; the classic objection: not lying even to the murderer asking where your friend is.", "nl": "Kant (1785): moral worth lies in the will and acting from duty, not in outcomes; the classic objection: not lying even to the murderer asking where your friend is."}, "sources": ["src:d6e60b5165"], "flags": []}, {"text": {"fa": "ارسطو: فضیلت حد وسط میان دو رذیلت است (شجاعت میان ترسویی و بی‌باکی) و با عادت و تمرین به دست می‌آید؛ ایراد: برای تصمیم‌های تازه راهنمای روشنی نمی‌دهد. روان‌شناسی مثبت و «نقاط قوت شخصیت» از این سنت می‌آیند.", "en": "Aristotle: virtue is the mean between two vices (courage between cowardice and recklessness) and is acquired by habit and practice; objection: it gives little clear guidance for novel decisions. Positive psychology and \"character strengths\" come from this tradition.", "nl": "Aristotle: virtue is the mean between two vices (courage between cowardice and recklessness) and is acquired by habit and practice; objection: it gives little clear guidance for novel decisions. Positive psychology and \"character strengths\" come from this tradition."}, "sources": ["src:ca301d84b7"], "flags": []}, {"text": {"fa": "سینگر (۱۹۷۲): اگر می‌توانی جلوی بدی بزرگی را بگیری بی‌آنکه چیزی با اهمیت اخلاقی مشابه را از دست بدهی، باید بگیری؛ کودکی که در برکه غرق می‌شود با کودکی در قاره‌ای دیگر فرقی ندارد. استدلالی که جنبش «نوع‌دوستی مؤثر» را ساخت.", "en": "Singer (1972): if you can prevent something very bad without sacrificing anything of comparable moral importance, you ought to; a child drowning in a pond is no different from a child on another continent. The argument that built the \"effective altruism\" movement.", "nl": "Singer (1972): if you can prevent something very bad without sacrificing anything of comparable moral importance, you ought to; a child drowning in a pond is no different from a child on another continent. The argument that built the \"effective altruism\" movement."}, "sources": ["src:b8f9ac2eac"], "flags": ["contested"]}], "links": [{"to": "phil:trolley", "rel": "applies-to", "note": {"fa": "آزمون نظریه‌ها با معماها", "en": "Testing the theories with dilemmas", "nl": "Testing the theories with dilemmas"}}, {"to": "psy:p-positive", "rel": "bridges", "note": {"fa": "روان‌شناسی مثبت و فضیلت", "en": "Positive psychology and virtue", "nl": "Positive psychology and virtue"}}, {"to": "phil:moral-luck", "rel": "critiques", "note": {"fa": "بخت اخلاقی هر سه را به چالش می‌کشد", "en": "Moral luck challenges all three", "nl": "Moral luck challenges all three"}}], "people": ["core:john-stuart-mill", "core:kant", "core:aristotle"], "sources": ["src:b73de9ad07", "src:b8f9ac2eac", "src:ca301d84b7", "src:d6e60b5165"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:skepticism-cogito", "kind": "concept", "title": {"fa": "شک دکارتی و «می‌اندیشم»", "en": "Cartesian doubt and the cogito", "nl": "Cartesiaanse twijfel en het cogito"}, "aliases": [], "parent": "phil:epistemology", "field": "phil:epistemology", "summary": {"fa": "دکارت برای یافتن چیزی تردیدناپذیر در همه‌چیز شک کرد: حواس، ریاضی، حتی وجود جهان (شاید شیطانی فریبم می‌دهد). یک چیز ماند: اینکه شک می‌کنم. از این‌جا دوگانگی ذهن و بدن زاده شد که فلسفهٔ ذهن هنوز با آن درگیر است.", "en": "To find something indubitable Descartes doubted everything: the senses, mathematics, even the world's existence (perhaps a demon deceives me). One thing remained: that I doubt. From here mind–body dualism was born, with which philosophy of mind still wrestles.", "nl": "Om iets onbetwijfelbaars te vinden betwijfelde Descartes alles: de zintuigen, de wiskunde, zelfs het bestaan van de wereld (misschien bedriegt een demon mij). Eén ding bleef: dat ik twijfel. Hieruit werd het lichaam-geestdualisme geboren, waarmee de filosofie van de geest nog worstelt."}, "points": [{"text": {"fa": "دکارت (۱۶۴۱): «می‌اندیشم، پس هستم» نه یک استدلال، که یک شهود است: هر بار که به آن فکر کنم، صادق است. از همین نقطه می‌خواست خدا، جهان و علم را دوباره بسازد؛ منتقدان گفتند از «اندیشه‌ای هست» به «منی هست» پریده است.", "en": "Descartes (1641): \"I think, therefore I am\" is not an argument but an intuition: each time I think it, it is true. From this point he wanted to rebuild God, world and science; critics said he jumped from \"there is thinking\" to \"there is an I\".", "nl": "Descartes (1641): \"I think, therefore I am\" is not an argument but an intuition: each time I think it, it is true. From this point he wanted to rebuild God, world and science; critics said he jumped from \"there is thinking\" to \"there is an I\"."}, "sources": ["src:cf48c80531"], "flags": []}, {"text": {"fa": "هیوم (۱۷۴۸): شک معتدل‌تر و ماندگارتر: علیت را هرگز مشاهده نمی‌کنیم، فقط توالی را؛ استقرا (فردا هم خورشید طلوع می‌کند) هیچ توجیه عقلی ندارد و فقط «عادت» است. علم روی این شکاف بنا شده و پوپر پاسخش را با ابطال‌پذیری داد.", "en": "Hume (1748): a milder, more lasting scepticism: we never observe causation, only succession; induction (the sun will rise tomorrow) has no rational justification and is mere \"custom\". Science is built over this gap, and Popper answered it with falsifiability.", "nl": "Hume (1748): a milder, more lasting scepticism: we never observe causation, only succession; induction (the sun will rise tomorrow) has no rational justification and is mere \"custom\". Science is built over this gap, and Popper answered it with falsifiability."}, "sources": ["src:25045a0b50"], "flags": []}, {"text": {"fa": "شش قرن پیش از دکارت، ابن سینا با «انسان معلق» استدلال مشابهی کرده بود: ببینید مدخل انسان معلق.", "en": "Six centuries before Descartes, Avicenna had made a similar argument with the \"floating man\": see that entry.", "nl": "Six centuries before Descartes, Avicenna had made a similar argument with the \"floating man\": see that entry."}, "sources": ["src:fceff29ae7"], "flags": []}], "links": [{"to": "phil:flying-man", "rel": "see-also", "note": {"fa": "پیشینهٔ ایرانی", "en": "The Iranian precedent", "nl": "The Iranian precedent"}}, {"to": "phil:falsification", "rel": "see-also", "note": {"fa": "پاسخ پوپر به مسئلهٔ استقرا", "en": "Popper's answer to the problem of induction", "nl": "Popper's answer to the problem of induction"}}, {"to": "phil:hard-problem", "rel": "explains", "note": {"fa": "ریشهٔ دوگانگی ذهن و بدن", "en": "The root of mind–body dualism", "nl": "The root of mind–body dualism"}}], "people": ["core:descartes", "core:david-hume", "core:avicenna"], "sources": ["src:25045a0b50", "src:cf48c80531", "src:fceff29ae7"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:personal-identity", "kind": "concept", "title": {"fa": "هویت شخصی: من کیستم که همان می‌مانم؟", "en": "Personal identity", "nl": "Persoonlijke identiteit"}, "aliases": [], "parent": "phil:mind", "field": "phil:mind", "summary": {"fa": "هر سلول بدن عوض می‌شود، خاطرات محو می‌شوند، شخصیت تغییر می‌کند؛ چه چیزی «من» بیست‌ساله را با من شصت‌ساله یکی می‌کند؟ پارفیت با آزمایش‌های فکری (دورنوردی، تقسیم مغز) نتیجه گرفت هویت آن چیزی نیست که مهم است؛ پیوستگی روانی است، و درجه‌پذیر.", "en": "Every cell is replaced, memories fade, character changes; what makes the twenty-year-old \"me\" the same as the sixty-year-old? Parfit, with thought experiments (teleportation, brain splitting), concluded identity is not what matters; psychological continuity is, and it comes in degrees.", "nl": "Elke cel wordt vervangen, herinneringen vervagen, karakter verandert; wat maakt de twintigjarige \"ik\" dezelfde als de zestigjarige? Parfit concludeerde met gedachte-experimenten (teleportatie, hersensplitsing) dat identiteit niet is wat ertoe doet; psychologische continuïteit wel, en die kent gradaties."}, "points": [{"text": {"fa": "پارفیت (۱۹۸۴): اگر هر نیم‌کرهٔ مغز من به بدنی دیگر پیوند زده شود، کدام یک «من» است؟ هیچ پاسخی بهتر از دیگری نیست؛ پس پرسش هویت پاسخ تعین‌یافته ندارد و باید جایش را به پرسش «چقدر پیوستگی» بدهد.", "en": "Parfit (1984): if each hemisphere of my brain were transplanted into another body, which is \"me\"? No answer is better than another; so the identity question has no determinate answer and should give way to \"how much continuity\".", "nl": "Parfit (1984): if each hemisphere of my brain were transplanted into another body, which is \"me\"? No answer is better than another; so the identity question has no determinate answer and should give way to \"how much continuity\"."}, "sources": ["src:3adcfbbaf4"], "flags": []}, {"text": {"fa": "پیامد اخلاقی که پارفیت می‌گیرد: مرز میان من و دیگران کم‌رنگ‌تر از آن است که فکر می‌کنیم؛ خودِ آینده‌ام کمی شبیه یک «دیگری» است، و این هم خودخواهی را سست می‌کند هم ترس از مرگ را.", "en": "The ethical consequence Parfit draws: the boundary between me and others is thinner than we think; my future self is a little like \"someone else\", which loosens both selfishness and the fear of death.", "nl": "The ethical consequence Parfit draws: the boundary between me and others is thinner than we think; my future self is a little like \"someone else\", which loosens both selfishness and the fear of death."}, "sources": ["src:3adcfbbaf4"], "flags": []}], "links": [{"to": "psy:delay-gratification", "rel": "bridges", "note": {"fa": "خودِ آینده و تعویق لذت", "en": "The future self and delayed gratification", "nl": "The future self and delayed gratification"}}, {"to": "phil:substantial-motion", "rel": "see-also", "note": {"fa": "حرکت جوهری: نفسی که دائم می‌شود", "en": "Substantial motion: a self in constant becoming", "nl": "Substantial motion: a self in constant becoming"}}, {"to": "psy:depersonalization", "rel": "bridges", "note": {"fa": "مسخ شخصیت", "en": "Depersonalization", "nl": "Depersonalization"}}], "people": ["core:derek-parfit"], "sources": ["src:3adcfbbaf4"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:falsification", "kind": "concept", "title": {"fa": "ابطال‌پذیری", "en": "Falsifiability", "nl": "Falsifieerbaarheid"}, "aliases": [], "parent": "phil:science", "field": "phil:science", "summary": {"fa": "پوپر: علم با اثبات پیش نمی‌رود، با رد شدن. نظریه‌ای علمی است که بگوید چه مشاهده‌ای آن را غلط می‌کند؛ نظریه‌ای که همه‌چیز را توضیح می‌دهد (طالع‌بینی، و به گفتهٔ پوپر روان‌کاوی و مارکسیسم) چیزی نمی‌گوید. معیاری قدرتمند که خودش هم ایرادهای جدی دارد.", "en": "Popper: science advances not by proof but by refutation. A theory is scientific if it says what observation would make it false; a theory that explains everything (astrology, and in Popper's view psychoanalysis and Marxism) says nothing. A powerful criterion that itself has serious problems.", "nl": "Popper: wetenschap gaat vooruit niet door bewijs maar door weerlegging. Een theorie is wetenschappelijk als ze zegt welke waarneming haar onwaar zou maken; een theorie die alles verklaart (astrologie, en volgens Popper psychoanalyse en marxisme) zegt niets. Een krachtig criterium dat zelf ook ernstige problemen kent."}, "points": [{"text": {"fa": "پوپر (۱۹۳۴/۱۹۵۹): هزار قوی سفید «همهٔ قوها سفیدند» را اثبات نمی‌کند، یک قوی سیاه آن را رد می‌کند؛ پس پاسخ هیوم به استقرا این است که علم اصلاً استقرایی نیست: حدس‌های جسورانه و تلاش برای ابطالشان.", "en": "Popper (1934/1959): a thousand white swans do not prove \"all swans are white\", one black swan refutes it; so the answer to Hume on induction is that science is not inductive at all: bold conjectures and attempts to refute them.", "nl": "Popper (1934/1959): a thousand white swans do not prove \"all swans are white\", one black swan refutes it; so the answer to Hume on induction is that science is not inductive at all: bold conjectures and attempts to refute them."}, "sources": ["src:78f5fd2e09"], "flags": []}, {"text": {"fa": "کواین (۱۹۵۱) و تز دوئم: هیچ فرضیه‌ای تنها آزمایش نمی‌شود؛ همیشه با فرض‌های کمکی (ابزار، شرایط) همراه است، پس یک مشاهدهٔ ناقض می‌گوید «جایی اشتباه است» نه «کجا». دانشمندان در عمل نظریهٔ خوب را با یک ناهنجاری رها نمی‌کنند، و حق دارند.", "en": "Quine (1951) and the Duhem thesis: no hypothesis is tested alone; it always comes with auxiliary assumptions (instruments, conditions), so a refuting observation says \"something is wrong\" not \"where\". In practice scientists do not drop a good theory over one anomaly, and rightly so.", "nl": "Quine (1951) and the Duhem thesis: no hypothesis is tested alone; it always comes with auxiliary assumptions (instruments, conditions), so a refuting observation says \"something is wrong\" not \"where\". In practice scientists do not drop a good theory over one anomaly, and rightly so."}, "sources": ["src:3215a4a8ec"], "flags": []}, {"text": {"fa": "کاربرد امروزی: پیش‌ثبت فرضیه‌ها در پاسخ به بحران تکرارپذیری، در واقع ابطال‌پذیری را دوباره الزامی می‌کند: پیش از دیدن داده بگو چه نتیجه‌ای فرضیه‌ات را رد می‌کند.", "en": "Current use: preregistration of hypotheses in response to the replication crisis effectively makes falsifiability obligatory again: before seeing the data, say what result would refute your hypothesis.", "nl": "Current use: preregistration of hypotheses in response to the replication crisis effectively makes falsifiability obligatory again: before seeing the data, say what result would refute your hypothesis."}, "sources": ["src:78f5fd2e09"], "flags": []}], "links": [{"to": "psy:phil-science", "rel": "same-as", "note": {"fa": "فلسفهٔ علم در ویکی روان", "en": "Philosophy of science in the psychology wiki", "nl": "Philosophy of science in the psychology wiki"}}, {"to": "psy:replication-crisis", "rel": "bridges", "note": {"fa": "بحران تکرارپذیری", "en": "The replication crisis", "nl": "The replication crisis"}}, {"to": "phil:paradigms", "rel": "contrasts", "note": {"fa": "کوهن: علم عادی ابطال نمی‌کند", "en": "Kuhn: normal science does not refute", "nl": "Kuhn: normal science does not refute"}}], "people": ["core:karl-popper", "core:w-v-o-quine"], "sources": ["src:3215a4a8ec", "src:78f5fd2e09"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:political", "kind": "field", "title": {"fa": "فلسفهٔ سیاسی", "en": "Political philosophy", "nl": "Politieke filosofie"}, "aliases": [], "parent": "phil:phil", "field": null, "summary": {"fa": "عدالت، آزادی، قابلیت و شر: جامعهٔ خوب را با چه معیاری بسنجیم؟", "en": "Justice, liberty, capability and evil: by what standard do we judge a good society?", "nl": "Rechtvaardigheid, vrijheid, vermogen en kwaad: aan welke maatstaf meten we een goede samenleving?"}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:stoicism", "kind": "concept", "title": {"fa": "رواقی‌گری: آنچه در اختیار ماست", "en": "Stoicism: what is up to us", "nl": "Stoïcisme: wat in onze macht ligt"}, "aliases": [], "parent": "phil:life", "field": "phil:life", "summary": {"fa": "اپیکتتوس: بعضی چیزها در اختیار ماست (داوری‌ها، خواسته‌ها، کنش‌ها) و بعضی نه (بدن، شهرت، دیگران). رنج از این می‌آید که دومی را بخواهیم کنترل کنیم. «آدم‌ها را نه چیزها، که داوری‌شان دربارهٔ چیزها آزار می‌دهد»؛ جمله‌ای که درمان شناختی‌رفتاری مستقیماً از آن زاده شد.", "en": "Epictetus: some things are up to us (judgements, desires, actions) and some are not (body, reputation, others). Suffering comes from trying to control the latter. \"People are disturbed not by things but by their judgements about things\"; a sentence from which cognitive-behavioural therapy directly descends.", "nl": "Epictetus: sommige dingen liggen in onze macht (oordelen, verlangens, handelingen) en sommige niet (lichaam, reputatie, anderen). Lijden komt van het willen beheersen van het tweede. \"Mensen worden niet verstoord door de dingen, maar door hun oordelen over de dingen\"; een zin waaruit de cognitieve gedragstherapie rechtstreeks voortkomt."}, "points": [{"text": {"fa": "رابرتسون (۲۰۱۰): الیس و بک، بنیان‌گذاران درمان شناختی، صراحتاً اپیکتتوس و مارکوس اورلیوس را منبع خود نامیده‌اند؛ «دوگانهٔ کنترل»، «تمرین پیش‌اندیشیِ بدی‌ها» و «نگاه از بالا» معادل‌های مستقیم در CBT دارند.", "en": "Robertson (2010): Ellis and Beck, founders of cognitive therapy, explicitly named Epictetus and Marcus Aurelius as their source; the \"dichotomy of control\", \"premeditation of adversity\" and the \"view from above\" have direct equivalents in CBT.", "nl": "Robertson (2010): Ellis and Beck, founders of cognitive therapy, explicitly named Epictetus and Marcus Aurelius as their source; the \"dichotomy of control\", \"premeditation of adversity\" and the \"view from above\" have direct equivalents in CBT."}, "sources": ["src:c8cffc9694"], "flags": []}, {"text": {"fa": "آدو (۱۹۹۵): فلسفهٔ باستان پیش از آنکه نظریه باشد «تمرین معنوی» و شیوهٔ زندگی بود؛ متن‌ها دفترچهٔ تمرین‌اند نه رساله. رواقی‌گری عامه‌پسند امروز گاهی این بُعد اجتماعی و اخلاقی (عدالت، خویشاوندی همهٔ انسان‌ها) را حذف می‌کند و به «خودیاری» تقلیلش می‌دهد.", "en": "Hadot (1995): ancient philosophy was a \"spiritual exercise\" and way of life before it was theory; the texts are practice notebooks, not treatises. Today's popular Stoicism sometimes drops this social and ethical dimension (justice, the kinship of all humans) and reduces it to \"self-help\".", "nl": "Hadot (1995): ancient philosophy was a \"spiritual exercise\" and way of life before it was theory; the texts are practice notebooks, not treatises. Today's popular Stoicism sometimes drops this social and ethical dimension (justice, the kinship of all humans) and reduces it to \"self-help\"."}, "sources": ["src:5834d9b57d", "src:c039c6c9c6"], "flags": ["editor-note"]}], "links": [{"to": "psy:reappraisal", "rel": "bridges", "note": {"fa": "بازارزیابی شناختی", "en": "Cognitive reappraisal", "nl": "Cognitive reappraisal"}}, {"to": "psy:psychotherapy", "rel": "bridges", "note": {"fa": "روان‌درمانی", "en": "Psychotherapy", "nl": "Psychotherapy"}}, {"to": "phil:absurd-meaning", "rel": "contrasts", "note": {"fa": "اگزیستانسیالیسم: معنا ساخته می‌شود", "en": "Existentialism: meaning is made", "nl": "Existentialism: meaning is made"}}], "people": ["core:epictetus", "core:pierre-hadot"], "sources": ["src:5834d9b57d", "src:c039c6c9c6", "src:c8cffc9694"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:moral-luck", "kind": "concept", "title": {"fa": "بخت اخلاقی", "en": "Moral luck", "nl": "Moreel geluk"}, "aliases": [], "parent": "phil:ethics", "field": "phil:ethics", "summary": {"fa": "دو راننده با یک بی‌احتیاطی: جلوی یکی کودکی می‌پرد و می‌میرد، جلوی دیگری نه. اولی قاتل است و دومی فقط بی‌احتیاط؛ اما تنها فرقشان شانس بود. اگر فقط آنچه در کنترل ماست اخلاقاً مهم است، پس تقریباً هیچ‌چیز مهم نیست: شخصیت، موقعیت و نتیجه همه تا حد زیادی بخت‌اند.", "en": "Two drivers equally careless: a child runs in front of one and dies, not the other. The first is a killer, the second merely careless; yet the only difference was luck. If only what is in our control matters morally, almost nothing matters: character, circumstance and outcome are all largely luck.", "nl": "Twee even onvoorzichtige bestuurders: voor de een rent een kind de weg op en sterft, voor de ander niet. De eerste is een doder, de tweede slechts onvoorzichtig; toch was het enige verschil geluk. Als alleen wat in onze macht ligt moreel telt, telt bijna niets: karakter, omstandigheid en uitkomst zijn grotendeels geluk."}, "points": [{"text": {"fa": "ویلیامز (۱۹۸۱) و نیگل (۱۹۷۹): چهار نوع بخت اخلاقی: نتیجه، موقعیت (آلمانی ۱۹۳۳ در برابر آلمانی مهاجر به آرژانتین)، سرشت (مزاجی که با آن به دنیا آمده‌ای) و علّی. شهود «فقط کنترل مهم است» با شهودهای روزمرهٔ سرزنش ناسازگار است و این تناقض حل نشده است.", "en": "Williams (1981) and Nagel (1979): four kinds of moral luck: resultant, circumstantial (a German in 1933 versus one who emigrated to Argentina), constitutive (the temperament you were born with) and causal. The intuition \"only control matters\" conflicts with our everyday intuitions of blame, and the paradox is unresolved.", "nl": "Williams (1981) and Nagel (1979): four kinds of moral luck: resultant, circumstantial (a German in 1933 versus one who emigrated to Argentina), constitutive (the temperament you were born with) and causal. The intuition \"only control matters\" conflicts with our everyday intuitions of blame, and the paradox is unresolved."}, "sources": ["src:3ad423b7df", "src:be9c4483b2"], "flags": []}, {"text": {"fa": "پیوند با ژنتیک و جامعه: اگر خویشتن‌داری و هوش تا حدی وراثتی و طبقه تا حدی ارثی است، «شایستگی» بیش از آنچه می‌پنداریم بخت است؛ استدلالی که هاردن و رالز هر دو به‌کار گرفته‌اند.", "en": "Link to genetics and society: if self-control and intelligence are partly heritable and class partly inherited, \"merit\" is more luck than we assume; an argument used by both Harden and Rawls.", "nl": "Link to genetics and society: if self-control and intelligence are partly heritable and class partly inherited, \"merit\" is more luck than we assume; an argument used by both Harden and Rawls."}, "sources": ["src:3ad423b7df"], "flags": []}], "links": [{"to": "tabar:heritability", "rel": "bridges", "note": {"fa": "بخت سرشتی و وراثت‌پذیری", "en": "Constitutive luck and heritability", "nl": "Constitutive luck and heritability"}}, {"to": "phil:veil-of-ignorance", "rel": "see-also", "note": {"fa": "رالز: استعدادها دارایی مشترک‌اند", "en": "Rawls: talents as a common asset", "nl": "Rawls: talents as a common asset"}}, {"to": "psy:learned-helplessness", "rel": "bridges", "note": {"fa": "کنترل و درماندگی", "en": "Control and helplessness", "nl": "Control and helplessness"}}], "people": ["core:bernard-williams", "core:thomas-nagel"], "sources": ["src:3ad423b7df", "src:be9c4483b2"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}], "people": {"core:hannah-arendt": {"id": "core:hannah-arendt", "name": {"fa": "هانا آرنت", "en": "Hannah Arendt", "nl": "Hannah Arendt"}, "years": "1906–1975", "note": {"fa": "ابتذال شر"}, "wikidata": null, "wikis": ["phil"]}, "core:jonathan-haidt": {"id": "core:jonathan-haidt", "name": {"fa": "جاناتان هایت", "en": "Jonathan Haidt", "nl": "Jonatha
