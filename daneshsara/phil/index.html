<title>فلسفه — دانش‌سرا</title>

<style>
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);min-height:var(--header-h)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--ink)}
.brand svg{width:26px;height:26px;color:var(--primary)}
.crumbs{font-size:var(--small);color:var(--ink-2)}.crumbs a{color:var(--ink-2)}
.lang{display:flex;gap:2px;border:1px solid var(--line-strong);border-radius:var(--r-full);padding:2px}
.lang button{font:inherit;font-size:var(--chip);padding:4px 10px;border:0;border-radius:var(--r-full);background:transparent;color:var(--ink-2);cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
main{padding-block:var(--s6) var(--s16)}
.hero{display:grid;gap:var(--s3);margin-bottom:var(--s6)}
.hero h1{margin:0}
.hero p{color:var(--ink-2);font-size:1.05rem;max-width:70ch;margin:0}
.draft{display:inline-flex;align-items:center;gap:8px;font-size:var(--chip);padding:4px 12px;border-radius:var(--r-full);background:var(--warn-bg,#FBF1D9);color:var(--warn-ink,#6B4E00);border:1px solid var(--warn-line,#E8D39A)}
.search{display:flex;gap:8px;margin:var(--s4) 0}
.search input{font:inherit;flex:1;min-width:0;padding:10px 14px;border-radius:var(--r-md);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink)}
.fields{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:var(--s6)}
.fields button{font:inherit;font-size:var(--small);padding:6px 14px;border-radius:var(--r-full);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer}
.fields button[aria-pressed=true]{background:var(--primary);color:#fff;border-color:var(--primary)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--s4)}
.grid .card{padding:var(--s5);display:grid;gap:8px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.grid .card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.grid h3{margin:0;font-size:var(--h4)}
.grid p{margin:0;color:var(--ink-2);font-size:var(--small);line-height:1.75;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.kick{font-size:var(--chip);color:var(--primary);font-weight:700}
.sub{color:var(--ink-3);font-size:var(--small);direction:ltr;text-align:start;unicode-bidi:isolate}
[dir=rtl] .sub{text-align:right}
.fsec{margin-bottom:var(--s8)} .fsec h2{font-size:var(--h3);margin:0 0 var(--s1)} .fsec>p{margin:0 0 var(--s4);color:var(--ink-2);max-width:70ch}
article.detail{display:grid;gap:var(--s5);max-width:78ch}
article.detail h1{margin:0}
article.detail .lead{font-size:1.1rem;line-height:1.9;margin:0}
.back{font:inherit;font-size:var(--small);border:0;background:transparent;color:var(--primary);cursor:pointer;padding:0;text-align:start}
.pts{display:grid;gap:var(--s3);margin:0;padding:0;list-style:none}
.pts li{padding:var(--s4) var(--s5);border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);line-height:1.85;position:relative}
.pts li .ref{font-size:var(--chip);color:var(--ink-3);display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.flag{font-size:var(--chip);padding:1px 8px;border-radius:var(--r-full);border:1px solid}
.flag.unreplicated{color:#8A2E2E;border-color:#E3B4B4;background:#FBEDED}
.flag.contested{color:#6B4E00;border-color:#E8D39A;background:#FBF1D9}
.flag.dated{color:var(--ink-2);border-color:var(--line-strong)}
.flag.editor-note{color:var(--primary);border-color:var(--primary)}
h2.sec{font-size:var(--small);color:var(--ink-2);font-weight:600;margin:var(--s2) 0 0;text-transform:uppercase;letter-spacing:.04em}
.links{display:grid;gap:6px}
.links a{display:flex;gap:10px;align-items:baseline;padding:8px 12px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--ink)}
.links a:hover{border-color:var(--primary)}
.links .rel{font-size:var(--chip);color:var(--primary);min-width:7em}
.links .nt{font-size:var(--small);color:var(--ink-2)}
.links .ext{font-size:var(--chip);color:var(--ink-3)}
.ppl{display:flex;flex-wrap:wrap;gap:6px}
.ppl span{font-size:var(--small);padding:4px 10px;border-radius:var(--r-full);border:1px solid var(--line-strong);background:var(--surface)}
.ppl small{color:var(--ink-3)}
.iran{border-inline-start:4px solid var(--primary);padding:var(--s4) var(--s5);border-radius:var(--r-md);background:var(--surface);display:grid;gap:8px}
.iran .q{font-weight:700}
.grade{display:inline-block;font-size:var(--chip);padding:1px 8px;border-radius:var(--r-full);background:var(--ink);color:var(--paper)}
ol.src{direction:ltr;text-align:left;padding-inline-start:1.4em;margin:0;display:grid;gap:6px;font-size:var(--small);color:var(--ink-2);line-height:1.7}
ol.src a{color:var(--primary)}
.status{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:var(--small);color:var(--ink-3)}
footer.foot{border-top:1px solid var(--line);padding-block:var(--s8);color:var(--ink-3);font-size:var(--small)}
@media (prefers-color-scheme: dark){:root:not([data-theme=light]) .flag.unreplicated{background:#3A1F1F;color:#F2B8B8;border-color:#6B3A3A} :root:not([data-theme=light]) .flag.contested,:root:not([data-theme=light]) .draft{background:#3A3010;color:#F0D78A;border-color:#6B5A2A}}
:root[data-theme=dark] .flag.unreplicated{background:#3A1F1F;color:#F2B8B8;border-color:#6B3A3A} :root[data-theme=dark] .flag.contested,:root[data-theme=dark] .draft{background:#3A3010;color:#F0D78A;border-color:#6B5A2A}
</style>

<script>
const D = {"wiki": "phil", "order": ["phil:epistemology", "phil:mind", "phil:ethics", "phil:science", "phil:political", "phil:iranian", "phil:life"], "concepts": [{"id": "phil:cave", "kind": "concept", "title": {"fa": "تمثیل غار", "en": "The allegory of the cave", "nl": "De allegorie van de grot"}, "aliases": [], "parent": "phil:epistemology", "field": "phil:epistemology", "summary": {"fa": "زندانیانی که از کودکی رو به دیوار بسته‌اند، سایه‌ها را واقعیت می‌پندارند؛ کسی که آزاد می‌شود و خورشید را می‌بیند، وقتی برمی‌گردد باور نمی‌شود و حتی تهدید می‌شود. افلاطون این را دربارهٔ آموزش و فیلسوف‌پادشاه گفت؛ امروز استعارهٔ هر حباب اطلاعاتی و هر «بیداری» است.", "en": "Prisoners chained since childhood facing a wall take shadows for reality; one who is freed and sees the sun is disbelieved, even threatened, when he returns. Plato told it about education and the philosopher-king; today it is the metaphor for every information bubble and every \"awakening\".", "nl": "Gevangenen die sinds hun kindertijd geketend naar een muur kijken, houden schaduwen voor werkelijkheid; wie bevrijd wordt en de zon ziet, wordt bij terugkeer niet geloofd, zelfs bedreigd. Plato vertelde het over opvoeding en de filosoof-koning; vandaag is het de metafoor voor elke informatiebubbel en elk \"ontwaken\"."}, "points": [{"text": {"fa": "افلاطون (جمهور، کتاب هفتم): آموزش «ریختن دانش در روح» نیست، چرخاندن کل روح از سایه به نور است؛ و کسی که دیده، وظیفه دارد به غار برگردد، هرچند به زیانش باشد.", "en": "Plato (Republic, Book VII): education is not \"pouring knowledge into the soul\" but turning the whole soul from shadow to light; and the one who has seen has a duty to go back down into the cave, even at his own cost.", "nl": "Plato (Republic, Book VII): education is not \"pouring knowledge into the soul\" but turning the whole soul from shadow to light; and the one who has seen has a duty to go back down into the cave, even at his own cost."}, "sources": ["src:cb319b234e"], "flags": []}, {"text": {"fa": "خوانش انتقادی: تمثیل به‌راحتی ابزار نخبه‌گرایی می‌شود («ما نور را دیده‌ایم، شما سایه را»)؛ هر گروهی که خود را بیرون غار می‌داند، باید بپرسد سایه‌های خودش کدام‌اند. سهروردی و روایت‌های اشراقی همین تصویر را با نور بازنوشتند.", "en": "A critical reading: the allegory easily becomes a tool of elitism (\"we have seen the light, you the shadows\"); any group that places itself outside the cave should ask which shadows are its own. Suhrawardi and the Illuminationist narratives rewrote the same image with light.", "nl": "A critical reading: the allegory easily becomes a tool of elitism (\"we have seen the light, you the shadows\"); any group that places itself outside the cave should ask which shadows are its own. Suhrawardi and the Illuminationist narratives rewrote the same image with light."}, "sources": ["src:cb319b234e"], "flags": ["editor-note"]}], "links": [{"to": "psy:conspiracy", "rel": "bridges", "note": {"fa": "توطئه‌باوری و «بیداری»", "en": "Conspiracy belief and \"awakening\"", "nl": "Conspiracy belief and \"awakening\""}}, {"to": "phil:illumination", "rel": "see-also", "note": {"fa": "اشراق", "en": "Illumination", "nl": "Illumination"}}, {"to": "soc:preference-falsification", "rel": "bridges", "note": {"fa": "آنچه همه می‌بینند و نمی‌گویند", "en": "What everyone sees and no one says", "nl": "What everyone sees and no one says"}}], "people": ["core:plato"], "sources": ["src:cb319b234e"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:trolley", "kind": "concept", "title": {"fa": "مسئلهٔ تراموا و دو نظام داوری اخلاقی", "en": "The trolley problem and two systems of moral judgment", "nl": "Het trolleyprobleem en twee systemen van moreel oordeel"}, "aliases": [], "parent": "phil:ethics", "field": "phil:ethics", "summary": {"fa": "تراموایی پنج نفر را می‌کشد؛ با کشیدن اهرم یک نفر می‌میرد. اکثریت اهرم را می‌کشند. اگر برای نجات پنج نفر باید یک نفر را از روی پل هل دهید، اکثریت نمی‌کنند. چرا؟ گرین نشان داد نسخهٔ دوم مناطق هیجانی مغز را درگیر می‌کند؛ اخلاق ما دو موتور دارد که همیشه با هم نمی‌خوانند.", "en": "A trolley will kill five; pulling a lever kills one instead. Most pull. If saving five requires pushing one man off a bridge, most refuse. Why? Greene showed the second version engages emotional brain regions; our morality has two engines that do not always agree.", "nl": "Een tram zal vijf mensen doden; een hendel overhalen doodt in plaats daarvan één. De meesten halen over. Als je om vijf te redden één man van een brug moet duwen, weigeren de meesten. Waarom? Greene toonde dat de tweede versie emotionele hersengebieden aanspreekt; onze moraal heeft twee motoren die niet altijd samengaan."}, "points": [{"text": {"fa": "فوت (۱۹۶۷) و تامسون (۱۹۸۵): مسئله برای آزمودن «اصل اثر دوگانه» ساخته شد: فرق هست میان کشتن به‌عنوان وسیله (هل دادن) و مرگ به‌عنوان پیامد پیش‌بینی‌شده (اهرم).", "en": "Foot (1967) and Thomson (1985): the problem was built to test the \"doctrine of double effect\": there is a difference between killing as a means (pushing) and death as a foreseen side effect (the lever).", "nl": "Foot (1967) and Thomson (1985): the problem was built to test the \"doctrine of double effect\": there is a difference between killing as a means (pushing) and death as a foreseen side effect (the lever)."}, "sources": ["src:97a4e96aa0", "src:c224580718"], "flags": []}, {"text": {"fa": "گرین و همکاران (۲۰۰۱): معماهای «شخصی» (هل دادن) مناطق هیجانی و معماهای «غیرشخصی» (اهرم) مناطق کنترل شناختی را بیشتر فعال می‌کنند؛ «نظریهٔ دوفرایندی» داوری اخلاقی. تکرارها اصل الگو را تأیید و جزئیات آناتومیک را تعدیل کرده‌اند.", "en": "Greene et al. (2001): \"personal\" dilemmas (pushing) activate emotional regions more, \"impersonal\" ones (the lever) cognitive-control regions; the \"dual-process theory\" of moral judgment. Replications have confirmed the broad pattern and revised the anatomical details.", "nl": "Greene et al. (2001): \"personal\" dilemmas (pushing) activate emotional regions more, \"impersonal\" ones (the lever) cognitive-control regions; the \"dual-process theory\" of moral judgment. Replications have confirmed the broad pattern and revised the anatomical details."}, "sources": ["src:2a1a13399f"], "flags": ["contested"]}, {"text": {"fa": "هایت (۲۰۰۱): داوری اخلاقی بیشتر شهودی و سریع است و استدلال بعداً برای توجیه می‌آید («سگ هیجانی و دم عقلانی‌اش»)؛ وقتی توجیهی پیدا نمی‌کنیم و باز هم بر داوری می‌مانیم، «لال شدن اخلاقی» رخ می‌دهد.", "en": "Haidt (2001): moral judgment is mostly fast and intuitive, with reasoning arriving afterwards to justify (\"the emotional dog and its rational tail\"); when we find no justification yet hold the judgment, \"moral dumbfounding\" occurs.", "nl": "Haidt (2001): moral judgment is mostly fast and intuitive, with reasoning arriving afterwards to justify (\"the emotional dog and its rational tail\"); when we find no justification yet hold the judgment, \"moral dumbfounding\" occurs."}, "sources": ["src:11a1bafc17"], "flags": []}], "links": [{"to": "psy:phil-ethics", "rel": "same-as", "note": {"fa": "اخلاق در ویکی روان", "en": "Ethics in the psychology wiki", "nl": "Ethics in the psychology wiki"}}, {"to": "psy:moral-hypocrisy", "rel": "bridges", "note": {"fa": "ریاکاری اخلاقی", "en": "Moral hypocrisy", "nl": "Moral hypocrisy"}}, {"to": "phil:three-theories", "rel": "prerequisite", "note": {"fa": "سه نظریهٔ اخلاقی", "en": "The three moral theories", "nl": "The three moral theories"}}], "people": ["core:philippa-foot", "core:joshua-greene", "core:jonathan-haidt"], "sources": ["src:11a1bafc17", "src:2a1a13399f", "src:97a4e96aa0", "src:c224580718"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:epistemology", "kind": "field", "title": {"fa": "معرفت‌شناسی", "en": "Epistemology", "nl": "Kennistheorie"}, "aliases": [], "parent": "phil:phil", "field": null, "summary": {"fa": "دانستن چیست، کِی باور موجه است، و چه کسی شنیده می‌شود؟", "en": "What is knowing, when is belief justified, and who gets heard?", "nl": "Wat is weten, wanneer is een overtuiging gerechtvaardigd, en wie wordt gehoord?"}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:life", "kind": "field", "title": {"fa": "فلسفهٔ زندگی", "en": "Philosophy of life", "nl": "Levensfilosofie"}, "aliases": [], "parent": "phil:phil", "field": null, "summary": {"fa": "رواقیان، اگزیستانسیالیست‌ها و معنا: فلسفه به‌عنوان تمرین، نه فقط نظریه.", "en": "Stoics, existentialists and meaning: philosophy as practice, not only theory.", "nl": "Stoïcijnen, existentialisten en zin: filosofie als oefening, niet alleen theorie."}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:free-will", "kind": "concept", "title": {"fa": "ارادهٔ آزاد: لیبت، فرانکفورت و سازگارگرایی", "en": "Free will: Libet, Frankfurt and compatibilism", "nl": "Vrije wil: Libet, Frankfurt en compatibilisme"}, "aliases": [], "parent": "phil:mind", "field": "phil:mind", "summary": {"fa": "اگر هر تصمیم را حالت قبلی مغز تعیین می‌کند، آزادی کجاست؟ آزمایش لیبت نشان داد فعالیت مغز پیش از «احساس تصمیم» شروع می‌شود، اما تفسیرش محل بحث است. سازگارگرایان می‌گویند آزادی یعنی عمل کردن بر اساس خواسته‌هایی که خودت تأییدشان می‌کنی، نه رهایی از علیت.", "en": "If every decision is fixed by the prior state of the brain, where is freedom? Libet's experiment showed brain activity begins before the \"feeling of deciding\", but its interpretation is disputed. Compatibilists say freedom means acting on desires you yourself endorse, not escaping causation.", "nl": "Als elke beslissing wordt bepaald door de vorige toestand van het brein, waar is dan de vrijheid? Libets experiment toonde dat hersenactiviteit begint vóór het \"gevoel van beslissen\", maar de interpretatie is omstreden. Compatibilisten zeggen dat vrijheid betekent handelen naar verlangens die je zelf onderschrijft, niet ontsnappen aan causaliteit."}, "points": [{"text": {"fa": "لیبت (۱۹۸۳): «پتانسیل آمادگی» حدود ۳۵۰ میلی‌ثانیه پیش از آنکه آزمودنی گزارش کند «تصمیم گرفتم» آغاز می‌شود؛ خود لیبت نتیجه گرفت آگاهی حق «وتو» دارد.", "en": "Libet (1983): the \"readiness potential\" begins about 350 milliseconds before the subject reports \"I decided\"; Libet himself concluded consciousness retains a \"veto\".", "nl": "Libet (1983): the \"readiness potential\" begins about 350 milliseconds before the subject reports \"I decided\"; Libet himself concluded consciousness retains a \"veto\"."}, "sources": ["src:15efed7dc1"], "flags": []}, {"text": {"fa": "شورگر و همکاران (۲۰۱۲): پتانسیل آمادگی ممکن است نه «تصمیم ناخودآگاه»، که نوسان تصادفی فعالیت باشد که وقتی از آستانه بگذرد حرکت را می‌اندازد؛ یعنی آزمایش لیبت دربارهٔ ارادهٔ آزاد کمتر از آنچه مشهور شد می‌گوید.", "en": "Schurger et al. (2012): the readiness potential may be not an \"unconscious decision\" but random fluctuation of activity that triggers movement when it crosses a threshold; so Libet's experiment says less about free will than its fame suggests.", "nl": "Schurger et al. (2012): the readiness potential may be not an \"unconscious decision\" but random fluctuation of activity that triggers movement when it crosses a threshold; so Libet's experiment says less about free will than its fame suggests."}, "sources": ["src:c758d9c037"], "flags": ["contested"]}, {"text": {"fa": "فرانکفورت (۱۹۷۱): شخص بودن یعنی داشتن «خواسته‌های مرتبهٔ دوم»: معتادی که می‌خواهد نخواهد، با معتادی که از اعتیادش راضی است فرق دارد؛ آزادی اراده یعنی هماهنگی خواسته‌ها با این مرتبهٔ بالاتر، فارغ از جبر فیزیکی.", "en": "Frankfurt (1971): being a person means having \"second-order desires\": the addict who wishes not to want differs from the addict content with addiction; freedom of the will is the fit between desires and this higher order, regardless of physical determinism.", "nl": "Frankfurt (1971): being a person means having \"second-order desires\": the addict who wishes not to want differs from the addict content with addiction; freedom of the will is the fit between desires and this higher order, regardless of physical determinism."}, "sources": ["src:2c51e9c7e5"], "flags": []}], "links": [{"to": "psy:akrasia", "rel": "bridges", "note": {"fa": "ضعف اراده در ویکی روان", "en": "Weakness of will in the psychology wiki", "nl": "Weakness of will in the psychology wiki"}}, {"to": "psy:addiction", "rel": "bridges", "note": {"fa": "اعتیاد و خواسته‌های مرتبهٔ دوم", "en": "Addiction and second-order desires", "nl": "Addiction and second-order desires"}}, {"to": "tabar:genetic-essentialism", "rel": "bridges", "note": {"fa": "جبر ژنتیکی", "en": "Genetic determinism", "nl": "Genetic determinism"}}], "people": ["core:harry-frankfurt", "core:daniel-dennett"], "sources": ["src:15efed7dc1", "src:2c51e9c7e5", "src:c758d9c037"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:absurd-meaning", "kind": "concept", "title": {"fa": "پوچی و معنا: کامو و فرانکل", "en": "Absurdity and meaning: Camus and Frankl", "nl": "Absurditeit en zin: Camus en Frankl"}, "aliases": [], "parent": "phil:life", "field": "phil:life", "summary": {"fa": "کامو: پوچی برخورد میل انسان به معنا با سکوت جهان است؛ پاسخ نه خودکشی است نه ایمانِ جهشی، بلکه شورش آگاهانه: «باید سیزیف را خوشبخت تصور کرد». فرانکل، از دل اردوگاه مرگ: انسان حتی در بدترین شرایط آزادی انتخاب نگرش را دارد و معنا را نه می‌سازد نه می‌یابد، بلکه «کشف» می‌کند: در کار، در عشق، و در رنجی که نمی‌شود تغییرش داد.", "en": "Camus: the absurd is the clash of the human longing for meaning with the silence of the world; the answer is neither suicide nor a leap of faith but conscious revolt: \"one must imagine Sisyphus happy\". Frankl, out of the death camp: even in the worst conditions a person retains the freedom to choose an attitude, and meaning is neither made nor found but \"discovered\": in work, in love, and in suffering that cannot be changed.", "nl": "Camus: het absurde is de botsing van het menselijk verlangen naar zin met het zwijgen van de wereld; het antwoord is noch zelfmoord noch een geloofssprong, maar bewuste opstand: \"men moet zich Sisyphus gelukkig voorstellen\". Frankl, vanuit het vernietigingskamp: zelfs onder de ergste omstandigheden behoudt een mens de vrijheid een houding te kiezen, en zin wordt noch gemaakt noch gevonden maar \"ontdekt\": in werk, in liefde, en in lijden dat niet veranderd kan worden."}, "points": [{"text": {"fa": "کامو (۱۹۴۲): «تنها یک مسئلهٔ فلسفی واقعاً جدی وجود دارد و آن خودکشی است»؛ کتاب استدلال می‌کند که پوچی دلیل مرگ نیست، دلیل زیستنِ بی‌امید و پرشور است. (این متن دربارهٔ خودکشی به‌عنوان مسئلهٔ فلسفی است؛ اگر خودتان درگیر چنین افکاری هستید، با کسی حرف بزنید.)", "en": "Camus (1942): \"there is but one truly serious philosophical problem, and that is suicide\"; the book argues that the absurd is a reason not for death but for living passionately without hope. (This text treats suicide as a philosophical problem; if you are struggling with such thoughts yourself, talk to someone.)", "nl": "Camus (1942): \"there is but one truly serious philosophical problem, and that is suicide\"; the book argues that the absurd is a reason not for death but for living passionately without hope. (This text treats suicide as a philosophical problem; if you are struggling with such thoughts yourself, talk to someone.)"}, "sources": ["src:21e863680c"], "flags": ["editor-note"]}, {"text": {"fa": "فرانکل (۱۹۴۶): «کسی که چرایی برای زیستن دارد، تقریباً با هر چگونه‌ای کنار می‌آید» (نقل از نیچه)؛ لوگوتراپی معنا را نیاز بنیادی می‌داند و «خلأ وجودی» را ریشهٔ بسیاری از افسردگی‌ها و اعتیادها. شواهد تجربی برای رابطهٔ معنا و سلامت روان قوی است؛ برای خودِ لوگوتراپی به‌عنوان درمان، محدود.", "en": "Frankl (1946): \"he who has a why to live can bear almost any how\" (quoting Nietzsche); logotherapy treats meaning as a basic need and the \"existential vacuum\" as the root of many depressions and addictions. Empirical evidence for the link between meaning and mental health is strong; for logotherapy itself as a treatment, limited.", "nl": "Frankl (1946): \"he who has a why to live can bear almost any how\" (quoting Nietzsche); logotherapy treats meaning as a basic need and the \"existential vacuum\" as the root of many depressions and addictions. Empirical evidence for the link between meaning and mental health is strong; for logotherapy itself as a treatment, limited."}, "sources": ["src:cb0447f889"], "flags": ["editor-note"]}, {"text": {"fa": "کیرکگور و سارتر دو سر طیف‌اند: کیرکگور پوچی را با «جهش ایمان» پاسخ می‌دهد؛ سارتر می‌گوید «وجود بر ماهیت مقدم است» و ما محکوم به آزادی و ساختن معنای خودیم. کامو میان این دو می‌ایستد و هر دو را «خودکشی فلسفی» می‌خواند.", "en": "Kierkegaard and Sartre are two ends of the spectrum: Kierkegaard answers absurdity with the \"leap of faith\"; Sartre says \"existence precedes essence\" and we are condemned to freedom and to making our own meaning. Camus stands between them and calls both \"philosophical suicide\".", "nl": "Kierkegaard and Sartre are two ends of the spectrum: Kierkegaard answers absurdity with the \"leap of faith\"; Sartre says \"existence precedes essence\" and we are condemned to freedom and to making our own meaning. Camus stands between them and calls both \"philosophical suicide\"."}, "sources": ["src:21e863680c"], "flags": []}], "links": [{"to": "psy:existentialism", "rel": "same-as", "note": {"fa": "فلسفهٔ وجودی در ویکی روان", "en": "Existential philosophy in the psychology wiki", "nl": "Existential philosophy in the psychology wiki"}}, {"to": "psy:meaning-making", "rel": "bridges", "note": {"fa": "معناسازی", "en": "Meaning-making", "nl": "Meaning-making"}}, {"to": "soc:secularization", "rel": "bridges", "note": {"fa": "معنا پس از دین", "en": "Meaning after religion", "nl": "Meaning after religion"}}], "people": ["core:albert-camus", "core:viktor-frankl", "core:sartre", "core:kierkegaard"], "sources": ["src:21e863680c", "src:cb0447f889"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:iranian", "kind": "field", "title": {"fa": "فلسفهٔ ایرانی‌اسلامی", "en": "Iranian-Islamic philosophy", "nl": "Iraans-islamitische filosofie"}, "aliases": [], "parent": "phil:phil", "field": null, "summary": {"fa": "از ابن سینا تا ملاصدرا: استدلال‌هایی که هنوز در فلسفهٔ ذهن و متافیزیک زنده‌اند.", "en": "From Avicenna to Mulla Sadra: arguments still alive in philosophy of mind and metaphysics.", "nl": "Van Avicenna tot Mulla Sadra: argumenten die nog leven in de filosofie van de geest en de metafysica."}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:two-liberties", "kind": "concept", "title": {"fa": "دو مفهوم آزادی", "en": "Two concepts of liberty", "nl": "Twee begrippen van vrijheid"}, "aliases": [], "parent": "phil:political", "field": "phil:political", "summary": {"fa": "برلین: آزادی «منفی» یعنی نبودن مانع بیرونی (کسی جلویم را نگیرد)؛ آزادی «مثبت» یعنی ارباب خود بودن و تحقق «خودِ واقعی». او هشدار داد مفهوم دوم به‌راحتی به استبداد می‌انجامد: کسی که ادعا می‌کند «خودِ واقعی» تو را بهتر از تو می‌شناسد، به نام آزادی‌ات تو را مجبور می‌کند.", "en": "Berlin: \"negative\" liberty is the absence of external obstacles (no one stops me); \"positive\" liberty is being one's own master and realising the \"true self\". He warned that the second easily turns to tyranny: whoever claims to know your \"true self\" better than you will coerce you in the name of your freedom.", "nl": "Berlin: \"negatieve\" vrijheid is de afwezigheid van uiterlijke belemmeringen (niemand houdt me tegen); \"positieve\" vrijheid is meester over zichzelf zijn en het \"ware zelf\" verwezenlijken. Hij waarschuwde dat het tweede gemakkelijk in tirannie omslaat: wie beweert jouw \"ware zelf\" beter te kennen dan jij, zal je dwingen in naam van jouw vrijheid."}, "points": [{"text": {"fa": "برلین (۱۹۵۸): ارزش‌های انسانی «کثرت‌گرا» و گاه ناسازگارند (آزادی و برابری، عدالت و رحمت)؛ هیچ نظام واحدی همه را با هم تحقق نمی‌دهد و ادعای چنین نظامی خطرناک است. از این‌جا دفاع او از کثرت‌گرایی لیبرال می‌آید.", "en": "Berlin (1958): human values are \"plural\" and sometimes incompatible (liberty and equality, justice and mercy); no single system realises them all, and claiming such a system is dangerous. Hence his defence of liberal pluralism.", "nl": "Berlin (1958): human values are \"plural\" and sometimes incompatible (liberty and equality, justice and mercy); no single system realises them all, and claiming such a system is dangerous. Hence his defence of liberal pluralism."}, "sources": ["src:3f08753416"], "flags": []}, {"text": {"fa": "آرنت (۱۹۶۳): «ابتذال شر»: آیشمن نه هیولا که کارمندی بی‌فکر بود که وظیفه انجام می‌داد؛ شر بزرگ از ناتوانی در اندیشیدن از منظر دیگری برمی‌آید. پیوند با آزمایش میلگرام و روان‌شناسی اطاعت. نقدها: شواهد بعدی نشان داد آیشمن ایدئولوژیک‌تر از تصویر آرنت بود.", "en": "Arendt (1963): the \"banality of evil\": Eichmann was not a monster but a thoughtless functionary doing his job; great evil arises from the inability to think from another's standpoint. Links to Milgram and the psychology of obedience. Critiques: later evidence showed Eichmann more ideological than Arendt's portrait.", "nl": "Arendt (1963): the \"banality of evil\": Eichmann was not a monster but a thoughtless functionary doing his job; great evil arises from the inability to think from another's standpoint. Links to Milgram and the psychology of obedience. Critiques: later evidence showed Eichmann more ideological than Arendt's portrait."}, "sources": ["src:0053354674"], "flags": ["contested"]}], "links": [{"to": "psy:autonomy", "rel": "bridges", "note": {"fa": "خودمختاری", "en": "Autonomy", "nl": "Autonomy"}}, {"to": "psy:dehumanization", "rel": "bridges", "note": {"fa": "انسان‌زدایی و اطاعت", "en": "Dehumanization and obedience", "nl": "Dehumanization and obedience"}}, {"to": "phil:capabilities", "rel": "see-also", "note": {"fa": "قابلیت به‌عنوان آزادی مثبت سنجش‌پذیر", "en": "Capability as measurable positive liberty", "nl": "Capability as measurable positive liberty"}}], "people": ["core:isaiah-berlin", "core:hannah-arendt"], "sources": ["src:0053354674", "src:3f08753416"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:paradigms", "kind": "concept", "title": {"fa": "پارادایم‌ها و انقلاب‌های علمی", "en": "Paradigms and scientific revolutions", "nl": "Paradigma's en wetenschappelijke revoluties"}, "aliases": [], "parent": "phil:science", "field": "phil:science", "summary": {"fa": "کوهن با نگاه تاریخی نشان داد علم بیشتر وقت‌ها «عادی» است: حل معما درون یک پارادایم (مجموعه‌ای از فرض‌ها، روش‌ها و نمونه‌های الگو). ناهنجاری‌ها انباشته می‌شوند تا بحران و سپس انقلاب: پارادایم تازه‌ای که با قبلی «قیاس‌ناپذیر» است. پیشرفت علم خطی و انباشتی نیست.", "en": "Kuhn, looking at history, showed science is mostly \"normal\": puzzle-solving within a paradigm (a set of assumptions, methods and exemplars). Anomalies accumulate until crisis and then revolution: a new paradigm \"incommensurable\" with the old. Scientific progress is not linear and cumulative.", "nl": "Kuhn toonde historisch dat wetenschap meestal \"normaal\" is: puzzels oplossen binnen een paradigma (een geheel van aannames, methoden en voorbeelden). Anomalieën stapelen zich op tot crisis en dan revolutie: een nieuw paradigma dat \"incommensurabel\" is met het oude. Wetenschappelijke vooruitgang is niet lineair en cumulatief."}, "points": [{"text": {"fa": "کوهن (۱۹۶۲): دانشمندانِ پارادایم‌های رقیب تا حدی «در جهان‌های متفاوت» کار می‌کنند و حتی داده را متفاوت می‌بینند؛ گذار به پارادایم تازه شبیه «تغییر گشتالت» است و با دلیل صرف انجام نمی‌شود. منتقدان این را نسبی‌گرایی خواندند؛ کوهن انکار کرد.", "en": "Kuhn (1962): scientists of rival paradigms work partly \"in different worlds\" and even see data differently; the shift to a new paradigm resembles a \"gestalt switch\" and is not made by argument alone. Critics called this relativism; Kuhn denied it.", "nl": "Kuhn (1962): scientists of rival paradigms work partly \"in different worlds\" and even see data differently; the shift to a new paradigm resembles a \"gestalt switch\" and is not made by argument alone. Critics called this relativism; Kuhn denied it."}, "sources": ["src:1d46a7c051"], "flags": ["contested"]}, {"text": {"fa": "داگلاس (۲۰۰۹): آرمان «علمِ خالی از ارزش» ناممکن است، چون هر پذیرش فرضیه خطر خطا دارد و اینکه چقدر شاهد «کافی» است به پیامدهای خطا (ارزش‌ها) بستگی دارد؛ ارزش‌ها نقش مشروع ولی غیرمستقیم دارند.", "en": "Douglas (2009): the ideal of \"value-free science\" is impossible, because accepting any hypothesis risks error, and how much evidence is \"enough\" depends on the consequences of error (values); values have a legitimate but indirect role.", "nl": "Douglas (2009): the ideal of \"value-free science\" is impossible, because accepting any hypothesis risks error, and how much evidence is \"enough\" depends on the consequences of error (values); values have a legitimate but indirect role."}, "sources": ["src:c6bde39ef4"], "flags": []}, {"text": {"fa": "روان‌شناسی و روان‌پزشکی نمونهٔ خوبی از «علم چندپارادایمی»اند: روان‌کاوی، رفتارگرایی، شناخت‌گرایی و عصب‌زیست‌شناسی هم‌زمان زیسته‌اند؛ بحث «نظام تشخیص» (DSM در برابر ابعادی) جدال پارادایمی زنده است.", "en": "Psychology and psychiatry are good examples of a \"multi-paradigm science\": psychoanalysis, behaviourism, cognitivism and neurobiology have coexisted; the \"diagnostic system\" debate (DSM versus dimensional) is a live paradigm struggle.", "nl": "Psychology and psychiatry are good examples of a \"multi-paradigm science\": psychoanalysis, behaviourism, cognitivism and neurobiology have coexisted; the \"diagnostic system\" debate (DSM versus dimensional) is a live paradigm struggle."}, "sources": ["src:1d46a7c051"], "flags": []}], "links": [{"to": "phil:falsification", "rel": "contrasts", "note": {"fa": "پوپر", "en": "Popper", "nl": "Popper"}}, {"to": "psy:dimensional-dx", "rel": "bridges", "note": {"fa": "تشخیص ابعادی در برابر مقوله‌ای", "en": "Dimensional versus categorical diagnosis", "nl": "Dimensional versus categorical diagnosis"}}, {"to": "psy:p-history", "rel": "bridges", "note": {"fa": "تاریخ روان‌شناسی", "en": "The history of psychology", "nl": "The history of psychology"}}], "people": ["core:thomas-kuhn", "core:heather-douglas"], "sources": ["src:1d46a7c051", "src:c6bde39ef4"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:gettier", "kind": "concept", "title": {"fa": "مسئلهٔ گتیه: دانستن فقط باور صادق موجه نیست", "en": "The Gettier problem", "nl": "Het Gettier-probleem"}, "aliases": [], "parent": "phil:epistemology", "field": "phil:epistemology", "summary": {"fa": "دو هزار سال تعریف دانش «باور صادقِ موجه» بود. گتیه در سه صفحه نشان داد می‌شود باوری موجه و صادق داشت که از روی شانس درست درآمده و دانش نیست. از آن پس معرفت‌شناسی دنبال «جزء چهارم» است.", "en": "For two thousand years knowledge was defined as \"justified true belief\". In three pages Gettier showed one can have a belief that is justified and true but right by luck, and not knowledge. Epistemology has sought the \"fourth condition\" ever since.", "nl": "Tweeduizend jaar lang was kennis \"gerechtvaardigde ware overtuiging\". In drie pagina's toonde Gettier dat men een overtuiging kan hebben die gerechtvaardigd en waar is, maar door toeval klopt, en geen kennis is. Sindsdien zoekt de kennistheorie de \"vierde voorwaarde\"."}, "points": [{"text": {"fa": "گتیه (۱۹۶۳): اسمیت شواهد قوی دارد که جونز شغل را می‌گیرد و ده سکه در جیب دارد؛ نتیجه می‌گیرد «کسی که شغل را می‌گیرد ده سکه در جیب دارد». شغل را خودش می‌گیرد و اتفاقاً ده سکه در جیب دارد. باورش صادق و موجه است، اما دانش نیست.", "en": "Gettier (1963): Smith has strong evidence that Jones will get the job and has ten coins in his pocket; he infers \"the man who gets the job has ten coins in his pocket\". Smith himself gets the job and happens to have ten coins. His belief is true and justified, but not knowledge.", "nl": "Gettier (1963): Smith has strong evidence that Jones will get the job and has ten coins in his pocket; he infers \"the man who gets the job has ten coins in his pocket\". Smith himself gets the job and happens to have ten coins. His belief is true and justified, but not knowledge."}, "sources": ["src:7cf7e49835"], "flags": []}, {"text": {"fa": "کاربرد روزمره: درست درآمدنِ یک پیش‌بینی ثابت نمی‌کند پیش‌بینی‌کننده می‌دانست؛ باید پرسید آیا راهی که به باور رسید با صدقش پیوند داشت یا شانسی بود (مسئلهٔ «پیش‌گوهای موفق» و «تحلیل‌گران بورس»).", "en": "Everyday use: a prediction coming true does not show the predictor knew; ask whether the route to the belief was connected to its truth or lucky (the problem of \"successful seers\" and \"stock analysts\").", "nl": "Everyday use: a prediction coming true does not show the predictor knew; ask whether the route to the belief was connected to its truth or lucky (the problem of \"successful seers\" and \"stock analysts\")."}, "sources": ["src:7cf7e49835"], "flags": []}], "links": [{"to": "psy:epistemology", "rel": "bridges", "note": {"fa": "معرفت‌شناسی و شک‌ورزی در ویکی روان", "en": "Epistemology and scepticism in the psychology wiki", "nl": "Epistemology and scepticism in the psychology wiki"}}, {"to": "psy:critical-thinking", "rel": "bridges", "note": {"fa": "تفکر نقادانه", "en": "Critical thinking", "nl": "Critical thinking"}}, {"to": "phil:epistemic-injustice", "rel": "see-also", "note": {"fa": "بعد اجتماعی دانستن", "en": "The social dimension of knowing", "nl": "The social dimension of knowing"}}], "people": ["core:edmund-gettier", "core:plato"], "sources": ["src:7cf7e49835"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:illumination", "kind": "concept", "title": {"fa": "حکمت اشراق و علم حضوری", "en": "Illuminationism and knowledge by presence", "nl": "Illuminationisme en kennis door aanwezigheid"}, "aliases": ["Ishraq", "اشراق"], "parent": "phil:iranian", "field": "phil:iranian", "summary": {"fa": "سهروردی دو نوع دانستن را جدا کرد: «علم حصولی» که از راه مفهوم و صورت به چیزی می‌رسد، و «علم حضوری» که بی‌واسطه است: دانستنِ خود، دردِ خود، حالتِ خود. نور استعارهٔ مرکزی اوست: واقعیت درجاتی از نور است و آگاهی خودِ روشنی. امروز این تمایز را با «دانش اول‌شخص» در فلسفهٔ ذهن مقایسه می‌کنند.", "en": "Suhrawardi separated two kinds of knowing: \"knowledge by acquisition\", reaching a thing through concept and form, and \"knowledge by presence\", which is immediate: knowing oneself, one's pain, one's state. Light is his central metaphor: reality is degrees of light and consciousness is luminosity itself. Today the distinction is compared with \"first-person knowledge\" in philosophy of mind.", "nl": "Suhrawardi scheidde twee soorten weten: \"kennis door verwerving\", die een ding bereikt via begrip en vorm, en \"kennis door aanwezigheid\", die onmiddellijk is: zichzelf, zijn pijn, zijn toestand kennen. Licht is zijn centrale metafoor: de werkelijkheid bestaat uit graden van licht en bewustzijn is lichtendheid zelf. Vandaag wordt het onderscheid vergeleken met \"eerstepersoonskennis\" in de filosofie van de geest."}, "points": [{"text": {"fa": "والبریج (۲۰۰۰): سهروردی خود را احیاگر حکمت ایران باستان و افلاطون می‌دانست و در برابر مشائیان (ابن سینا) ایستاد؛ نقد او بر «تعریف» ارسطویی (هر تعریف به مفاهیمی نیاز دارد که خود تعریف‌ناشده‌اند) پیش‌درآمد بحث‌های مدرن است. در ۳۸ سالگی در حلب به حکم صلاح‌الدین کشته شد.", "en": "Walbridge (2000): Suhrawardi saw himself as reviver of ancient Persian wisdom and of Plato, against the Peripatetics (Avicenna); his critique of Aristotelian \"definition\" (every definition needs concepts that are themselves undefined) anticipates modern debates. He was executed in Aleppo at 38 on Saladin's order.", "nl": "Walbridge (2000): Suhrawardi saw himself as reviver of ancient Persian wisdom and of Plato, against the Peripatetics (Avicenna); his critique of Aristotelian \"definition\" (every definition needs concepts that are themselves undefined) anticipates modern debates. He was executed in Aleppo at 38 on Saladin's order."}, "sources": ["src:48c1bb6626"], "flags": []}, {"text": {"fa": "تمثیل غار افلاطون و نورشناسی سهروردی یک خانواده‌اند: دانستن همچون دیدن در نور. این سنت از راه ملاصدرا تا امروز در حوزه‌های ایران تدریس می‌شود.", "en": "Plato's cave and Suhrawardi's optics of light belong to one family: knowing as seeing in light. Through Mulla Sadra this tradition is taught in Iran's seminaries to this day.", "nl": "Plato's cave and Suhrawardi's optics of light belong to one family: knowing as seeing in light. Through Mulla Sadra this tradition is taught in Iran's seminaries to this day."}, "sources": ["src:cb319b234e", "src:48c1bb6626"], "flags": []}], "links": [{"to": "phil:hard-problem", "rel": "bridges", "note": {"fa": "دانش اول‌شخص و مسئلهٔ دشوار", "en": "First-person knowledge and the hard problem", "nl": "First-person knowledge and the hard problem"}}, {"to": "phil:substantial-motion", "rel": "see-also", "note": {"fa": "ملاصدرا، وارث اشراق", "en": "Mulla Sadra, heir of Illumination", "nl": "Mulla Sadra, heir of Illumination"}}, {"to": "phil:flying-man", "rel": "see-also", "note": {"fa": "ابن سینا", "en": "Avicenna", "nl": "Avicenna"}}], "people": ["core:suhrawardi"], "sources": ["src:48c1bb6626", "src:cb319b234e"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:hard-problem", "kind": "concept", "title": {"fa": "مسئلهٔ دشوار آگاهی", "en": "The hard problem of consciousness", "nl": "Het moeilijke probleem van bewustzijn"}, "aliases": [], "parent": "phil:mind", "field": "phil:mind", "summary": {"fa": "توضیح اینکه مغز چگونه اطلاعات را پردازش می‌کند «مسئلهٔ آسان» است؛ مسئلهٔ دشوار این است که چرا این پردازش با تجربهٔ درونی همراه است: چرا دیدن قرمز «حسی» دارد؟ نیگل پرسید «خفاش بودن چگونه است؟» و گفت علم عینی به این «چگونگی» دسترسی ندارد.", "en": "Explaining how the brain processes information is the \"easy problem\"; the hard problem is why that processing is accompanied by inner experience: why does seeing red \"feel\" like something? Nagel asked \"what is it like to be a bat?\" and said objective science has no access to that \"what it is like\".", "nl": "Verklaren hoe het brein informatie verwerkt is het \"gemakkelijke probleem\"; het moeilijke probleem is waarom die verwerking gepaard gaat met innerlijke ervaring: waarom \"voelt\" rood zien als iets? Nagel vroeg \"hoe is het om een vleermuis te zijn?\" en zei dat objectieve wetenschap geen toegang heeft tot dat \"hoe het is\"."}, "points": [{"text": {"fa": "چالمرز (۱۹۹۵): حتی وقتی همهٔ کارکردها (توجه، گزارش، تمایز) توضیح داده شوند، این پرسش می‌ماند که چرا با تجربه همراه‌اند؛ پیشنهاد جنجالی‌اش: آگاهی ویژگی بنیادی طبیعت است (نوعی دوگانگی ویژگی‌ها).", "en": "Chalmers (1995): even when all functions (attention, report, discrimination) are explained, the question remains why they are accompanied by experience; his controversial proposal: consciousness is a fundamental feature of nature (a kind of property dualism).", "nl": "Chalmers (1995): even when all functions (attention, report, discrimination) are explained, the question remains why they are accompanied by experience; his controversial proposal: consciousness is a fundamental feature of nature (a kind of property dualism)."}, "sources": ["src:01f21f4eb5"], "flags": ["contested"]}, {"text": {"fa": "دنت (۱۹۹۱) مخالف است: «مسئلهٔ دشوار» توهمی است که از شهودهای ما دربارهٔ تجربه می‌آید؛ وقتی همهٔ مسئله‌های آسان حل شوند، چیزی باقی نمی‌ماند. این اختلاف، چهل سال است که حل نشده.", "en": "Dennett (1991) disagrees: the \"hard problem\" is an illusion arising from our intuitions about experience; once all the easy problems are solved, nothing remains. The disagreement has stood unresolved for forty years.", "nl": "Dennett (1991) disagrees: the \"hard problem\" is an illusion arising from our intuitions about experience; once all the easy problems are solved, nothing remains. The disagreement has stood unresolved for forty years."}, "sources": ["src:7ac7a18d33"], "flags": ["contested"]}, {"text": {"fa": "نیگل (۱۹۷۴): هرقدر دربارهٔ پژواک‌یابی خفاش بدانیم، نمی‌دانیم خفاش بودن از درون چگونه است؛ واقعیت‌های ذهنی به دیدگاه گره خورده‌اند و تقلیل‌گرایی فیزیکی آن‌ها را جا می‌اندازد.", "en": "Nagel (1974): however much we know about bat echolocation, we do not know what being a bat is like from inside; mental facts are tied to a point of view, and physical reductionism leaves them out.", "nl": "Nagel (1974): however much we know about bat echolocation, we do not know what being a bat is like from inside; mental facts are tied to a point of view, and physical reductionism leaves them out."}, "sources": ["src:379d80380f"], "flags": []}], "links": [{"to": "psy:phil-mind", "rel": "same-as", "note": {"fa": "فلسفهٔ ذهن در ویکی روان", "en": "Philosophy of mind in the psychology wiki", "nl": "Philosophy of mind in the psychology wiki"}}, {"to": "psy:consciousness", "rel": "bridges", "note": {"fa": "هشیاری در روان‌پزشکی", "en": "Consciousness in psychiatry", "nl": "Consciousness in psychiatry"}}, {"to": "phil:flying-man", "rel": "see-also", "note": {"fa": "خودآگاهی بدون بدن نزد ابن سینا", "en": "Self-awareness without body in Avicenna", "nl": "Self-awareness without body in Avicenna"}}], "people": ["core:david-chalmers", "core:thomas-nagel", "core:daniel-dennett"], "sources": ["src:01f21f4eb5", "src:379d80380f", "src:7ac7a18d33"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:substantial-motion", "kind": "concept", "title": {"fa": "حرکت جوهری ملاصدرا", "en": "Mulla Sadra's substantial motion", "nl": "Mulla Sadra's substantiële beweging"}, "aliases": ["حکمت متعالیه", "Transcendent philosophy"], "parent": "phil:iranian", "field": "phil:iranian", "summary": {"fa": "ارسطوییان می‌گفتند حرکت فقط در عَرَض‌هاست (رنگ، جا، اندازه) و جوهر ثابت می‌ماند. ملاصدرا گفت خود جوهر دائم در حرکت و «شدن» است؛ هستی اصیل و درجه‌پذیر است («تشکیک وجود») و نفس انسان «جسمانیة الحدوث، روحانیة البقاء»: از بدن برمی‌خیزد و در سیر خود مجرد می‌شود. تصویری پویا از خود که با هویت شخصی پارفیت و نوروپلاستیسیته گفت‌وگو می‌کند.", "en": "Aristotelians held that motion occurs only in accidents (colour, place, size) while substance stays fixed. Mulla Sadra said substance itself is in constant motion and \"becoming\"; existence is primary and graded (\"modulation of being\"), and the human soul is \"bodily in origin, spiritual in survival\": it arises from the body and becomes immaterial along its journey. A dynamic picture of the self in dialogue with Parfit's personal identity and neuroplasticity.", "nl": "Aristotelici meenden dat beweging alleen in accidenten plaatsvindt (kleur, plaats, grootte) terwijl de substantie vast blijft. Mulla Sadra zei dat de substantie zelf voortdurend in beweging en \"wording\" is; het zijn is primair en gradueel (\"modulatie van het zijn\"), en de menselijke ziel is \"lichamelijk in oorsprong, geestelijk in voortbestaan\": ze ontstaat uit het lichaam en wordt onderweg immaterieel. Een dynamisch beeld van het zelf dat in gesprek is met Parfits persoonlijke identiteit en neuroplasticiteit."}, "points": [{"text": {"fa": "ریزوی (۲۰۰۹): «اصالت وجود» ملاصدرا یعنی آنچه واقعی است وجود است نه ماهیت، و وجود یک حقیقت واحد با شدت و ضعف است؛ این متافیزیک به او اجازه داد تغییر پیوستهٔ جوهر را بی‌تناقض بیندیشد.", "en": "Rizvi (2009): Sadra's \"primacy of existence\" means what is real is existence not essence, and existence is one reality with intensity and weakness; this metaphysics let him think continuous substantial change without contradiction.", "nl": "Rizvi (2009): Sadra's \"primacy of existence\" means what is real is existence not essence, and existence is one reality with intensity and weakness; this metaphysics let him think continuous substantial change without contradiction."}, "sources": ["src:60f242a8cf"], "flags": []}, {"text": {"fa": "حکمت متعالیه برنامهٔ درسی فلسفهٔ اسلامی در ایران معاصر را شکل داده (از طباطبایی و مطهری تا امروز)؛ خواندن انتقادی آن در کنار فلسفهٔ ذهن تحلیلی، پروژه‌ای است که تازه آغاز شده.", "en": "The Transcendent Philosophy has shaped the curriculum of Islamic philosophy in contemporary Iran (from Tabataba'i and Motahhari to today); reading it critically alongside analytic philosophy of mind is a project only just begun.", "nl": "The Transcendent Philosophy has shaped the curriculum of Islamic philosophy in contemporary Iran (from Tabataba'i and Motahhari to today); reading it critically alongside analytic philosophy of mind is a project only just begun."}, "sources": ["src:60f242a8cf"], "flags": ["editor-note"]}], "links": [{"to": "phil:personal-identity", "rel": "bridges", "note": {"fa": "هویت شخصی و پیوستگی", "en": "Personal identity and continuity", "nl": "Personal identity and continuity"}}, {"to": "psy:n-plasticity", "rel": "bridges", "note": {"fa": "انعطاف‌پذیری مغز", "en": "Neuroplasticity", "nl": "Neuroplasticity"}}, {"to": "phil:illumination", "rel": "prerequisite", "note": {"fa": "اشراق", "en": "Illumination", "nl": "Illumination"}}], "people": ["core:mulla-sadra"], "sources": ["src:60f242a8cf"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:ghazali-causation", "kind": "concept", "title": {"fa": "غزالی، ابن رشد و مسئلهٔ علیت", "en": "Al-Ghazali, Averroes and the problem of causation", "nl": "Al-Ghazali, Averroes en het probleem van causaliteit"}, "aliases": [], "parent": "phil:iranian", "field": "phil:iranian", "summary": {"fa": "غزالی در «تهافت الفلاسفه» گفت پیوند آتش و سوختن ضروری نیست: فقط «عادت» است و خدا می‌تواند آن را نشکند؛ هفت قرن پیش از هیوم. ابن رشد پاسخ داد که بدون علیت ضروری، علم و حتی زبان فرو می‌ریزد. این مناظره دربارهٔ اینکه آیا علم می‌تواند بدون متافیزیکِ علیت کار کند، امروز هم زنده است.", "en": "In the \"Incoherence of the Philosophers\" al-Ghazali said the link between fire and burning is not necessary: it is mere \"habit\", and God could break it; seven centuries before Hume. Averroes replied that without necessary causation, science and even language collapse. The debate over whether science can work without a metaphysics of causation is alive today.", "nl": "In de \"Incoherentie van de filosofen\" zei al-Ghazali dat de band tussen vuur en verbranden niet noodzakelijk is: het is louter \"gewoonte\", en God kan die verbreken; zeven eeuwen vóór Hume. Averroes antwoordde dat zonder noodzakelijke causaliteit wetenschap en zelfs taal instorten. Het debat of wetenschap kan werken zonder een metafysica van causaliteit leeft vandaag nog."}, "points": [{"text": {"fa": "گریفل (۲۰۰۹): برخلاف تصویر رایج، غزالی دشمن عقل و علم نبود؛ منطق و ریاضی را می‌پذیرفت و نقدش بر فلاسفه متوجه ادعاهای برهان‌ناپذیر متافیزیکی بود. روایت «غزالی علم اسلامی را کشت» را مورخان کنار گذاشته‌اند.", "en": "Griffel (2009): contrary to the common picture, al-Ghazali was no enemy of reason or science; he accepted logic and mathematics, and his critique of the philosophers targeted indemonstrable metaphysical claims. Historians have abandoned the story that \"al-Ghazali killed Islamic science\".", "nl": "Griffel (2009): contrary to the common picture, al-Ghazali was no enemy of reason or science; he accepted logic and mathematics, and his critique of the philosophers targeted indemonstrable metaphysical claims. Historians have abandoned the story that \"al-Ghazali killed Islamic science\"."}, "sources": ["src:aabff6f260"], "flags": ["contested"]}, {"text": {"fa": "آدامسون (۲۰۲۱): محمد زکریای رازی، پزشک و فیلسوف ری، یک قرن پیش از ابن سینا موضعی رادیکال‌تر داشت: عقل برای همهٔ انسان‌ها کافی است و نیازی به مرجعیت نیست؛ تجربه‌گرایی بالینی‌اش (ثبت موردها، آزمودن درمان) او را پیشگام روش علمی در پزشکی می‌کند.", "en": "Adamson (2021): Muhammad ibn Zakariya al-Razi, physician and philosopher of Rayy, held a more radical position a century before Avicenna: reason suffices for all humans and no authority is needed; his clinical empiricism (case records, testing treatments) makes him a pioneer of scientific method in medicine.", "nl": "Adamson (2021): Muhammad ibn Zakariya al-Razi, physician and philosopher of Rayy, held a more radical position a century before Avicenna: reason suffices for all humans and no authority is needed; his clinical empiricism (case records, testing treatments) makes him a pioneer of scientific method in medicine."}, "sources": ["src:407de84392"], "flags": []}], "links": [{"to": "phil:skepticism-cogito", "rel": "see-also", "note": {"fa": "هیوم و علیت", "en": "Hume and causation", "nl": "Hume and causation"}}, {"to": "phil:falsification", "rel": "bridges", "note": {"fa": "علم بدون یقین", "en": "Science without certainty", "nl": "Science without certainty"}}, {"to": "psy:psychiatry-history", "rel": "bridges", "note": {"fa": "رازی در تاریخ پزشکی و روان‌پزشکی", "en": "Razi in the history of medicine and psychiatry", "nl": "Razi in the history of medicine and psychiatry"}}], "people": ["core:al-ghazali", "core:averroes", "core:david-hume"], "sources": ["src:407de84392", "src:aabff6f260"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:epistemic-injustice", "kind": "concept", "title": {"fa": "بی‌عدالتی معرفتی", "en": "Epistemic injustice", "nl": "Epistemisch onrecht"}, "aliases": [], "parent": "phil:epistemology", "field": "phil:epistemology", "summary": {"fa": "وقتی به حرف کسی به‌خاطر هویتش (زن، جوان، مهاجر، بیمار روانی) کمتر اعتماد می‌شود (بی‌عدالتی شهادتی) یا جامعه هنوز مفهومی برای بیان تجربه‌اش ندارد (بی‌عدالتی هرمنوتیکی؛ مثل «آزار جنسی» پیش از نام‌گذاری‌اش). فریکر دانستن را امری اخلاقی و اجتماعی کرد.", "en": "When someone's word is trusted less because of their identity (woman, young, migrant, psychiatric patient) (testimonial injustice), or society lacks the concept to articulate their experience (hermeneutical injustice; like \"sexual harassment\" before it was named). Fricker made knowing an ethical and social matter.", "nl": "Wanneer iemands woord minder wordt vertrouwd vanwege diens identiteit (vrouw, jong, migrant, psychiatrisch patiënt) (getuigenisonrecht), of de samenleving het begrip mist om diens ervaring te verwoorden (hermeneutisch onrecht; zoals \"seksuele intimidatie\" vóór die naam bestond). Fricker maakte van weten een ethische en sociale zaak."}, "points": [{"text": {"fa": "فریکر (۲۰۰۷): بی‌عدالتی شهادتی هم به شنونده آسیب می‌زند (دانشی را از دست می‌دهد) هم به گوینده (در مقام دانندهٔ انسانی تحقیر می‌شود)؛ فضیلت لازم «عدالت شهادتی» است: اصلاح آگاهانهٔ پیش‌داوری در باورپذیری.", "en": "Fricker (2007): testimonial injustice harms the hearer (who loses knowledge) and the speaker (demeaned as a human knower); the needed virtue is \"testimonial justice\": consciously correcting prejudice in credibility.", "nl": "Fricker (2007): testimonial injustice harms the hearer (who loses knowledge) and the speaker (demeaned as a human knower); the needed virtue is \"testimonial justice\": consciously correcting prejudice in credibility."}, "sources": ["src:24f7ea1e01"], "flags": []}, {"text": {"fa": "کاربرد بالینی: گزارش درد و علائم بیماران زن و بیماران روان‌پزشکی به‌طور نظام‌مند کمتر جدی گرفته می‌شود؛ این مفهوم در اخلاق پزشکی و روان‌پزشکی پرکاربرد شده است.", "en": "Clinical use: women's and psychiatric patients' reports of pain and symptoms are systematically taken less seriously; the concept has become widely used in medical and psychiatric ethics.", "nl": "Clinical use: women's and psychiatric patients' reports of pain and symptoms are systematically taken less seriously; the concept has become widely used in medical and psychiatric ethics."}, "sources": ["src:24f7ea1e01"], "flags": []}], "links": [{"to": "psy:dehumanization", "rel": "bridges", "note": {"fa": "انسان‌زدایی", "en": "Dehumanization", "nl": "Dehumanization"}}, {"to": "psy:phil-psychiatry", "rel": "bridges", "note": {"fa": "فلسفهٔ روان‌پزشکی", "en": "Philosophy of psychiatry", "nl": "Philosophy of psychiatry"}}, {"to": "soc:social-construction", "rel": "bridges", "note": {"fa": "مفاهیمی که جامعه می‌سازد", "en": "Concepts a society makes", "nl": "Concepts a society makes"}}], "people": ["core:miranda-fricker"], "sources": ["src:24f7ea1e01"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:ethics", "kind": "field", "title": {"fa": "اخلاق", "en": "Ethics", "nl": "Ethiek"}, "aliases": [], "parent": "phil:phil", "field": null, "summary": {"fa": "چه باید کرد و چرا؛ و چرا شهود اخلاقی‌مان با نظریه‌هایمان نمی‌خواند.", "en": "What to do and why; and why our moral intuitions disagree with our theories.", "nl": "Wat te doen en waarom; en waarom onze morele intuïties niet stroken met onze theorieën."}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:veil-of-ignorance", "kind": "concept", "title": {"fa": "پردهٔ بی‌خبری و عدالت به‌مثابهٔ انصاف", "en": "The veil of ignorance and justice as fairness", "nl": "De sluier van onwetendheid en rechtvaardigheid als billijkheid"}, "aliases": [], "parent": "phil:political", "field": "phil:political", "summary": {"fa": "رالز: اصول عدالت آن‌هایی‌اند که اگر نمی‌دانستید در جامعه کجا به دنیا می‌آیید (ثروتمند یا فقیر، زن یا مرد، باهوش یا نه) انتخاب می‌کردید. نتیجه: آزادی‌های برابر برای همه، و نابرابری فقط اگر به سود کم‌بهره‌ترین‌ها باشد. نوزیک پاسخ داد: عدالت در روند مالکیت است نه در الگوی توزیع.", "en": "Rawls: the principles of justice are those you would choose if you did not know where in society you would be born (rich or poor, woman or man, clever or not). Result: equal liberties for all, and inequality only if it benefits the least advantaged. Nozick replied: justice lies in the process of acquisition, not in the pattern of distribution.", "nl": "Rawls: de beginselen van rechtvaardigheid zijn die welke je zou kiezen als je niet wist waar in de samenleving je geboren wordt (rijk of arm, vrouw of man, slim of niet). Resultaat: gelijke vrijheden voor allen, en ongelijkheid alleen als ze de minstbedeelden ten goede komt. Nozick antwoordde: rechtvaardigheid zit in het proces van verwerving, niet in het verdelingspatroon."}, "points": [{"text": {"fa": "رالز (۱۹۷۱): در «وضع نخستین» افراد عقلانی و ریسک‌گریز اصل «بیشینه‌کردن کمینه» را برمی‌گزینند؛ استعدادهای طبیعی از نظر اخلاقی «دل‌بخواهی»اند و جامعه حق دارد ثمره‌شان را به‌عنوان دارایی مشترک ببیند.", "en": "Rawls (1971): in the \"original position\" rational, risk-averse people choose the \"maximin\" principle; natural talents are morally \"arbitrary\" and society may treat their fruits as a common asset.", "nl": "Rawls (1971): in the \"original position\" rational, risk-averse people choose the \"maximin\" principle; natural talents are morally \"arbitrary\" and society may treat their fruits as a common asset."}, "sources": ["src:830f23ad61"], "flags": []}, {"text": {"fa": "نوزیک (۱۹۷۴): اگر هر کس دارایی‌اش را عادلانه به دست آورده و داوطلبانه مبادله کرده، توزیعِ حاصل عادلانه است هرقدر نابرابر؛ بازتوزیع اجباری «کار اجباری» است. آزمایش فکری ویلت چمبرلین. این دو کتاب هنوز دو قطب بحث عدالت‌اند.", "en": "Nozick (1974): if everyone acquired holdings justly and exchanged voluntarily, the resulting distribution is just however unequal; forced redistribution is \"forced labour\". The Wilt Chamberlain thought experiment. The two books remain the two poles of the justice debate.", "nl": "Nozick (1974): if everyone acquired holdings justly and exchanged voluntarily, the resulting distribution is just however unequal; forced redistribution is \"forced labour\". The Wilt Chamberlain thought experiment. The two books remain the two poles of the justice debate."}, "sources": ["src:009cb937f3"], "flags": ["contested"]}], "links": [{"to": "soc:gini-inequality", "rel": "bridges", "note": {"fa": "اندازه‌گیری نابرابری", "en": "Measuring inequality", "nl": "Measuring inequality"}}, {"to": "phil:moral-luck", "rel": "prerequisite", "note": {"fa": "بخت اخلاقی", "en": "Moral luck", "nl": "Moral luck"}}, {"to": "phil:capabilities", "rel": "see-also", "note": {"fa": "نقد سن و نوسبام بر رالز", "en": "Sen and Nussbaum's critique of Rawls", "nl": "Sen and Nussbaum's critique of Rawls"}}], "people": ["core:john-rawls", "core:robert-nozick"], "sources": ["src:009cb937f3", "src:830f23ad61"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:mind", "kind": "field", "title": {"fa": "فلسفهٔ ذهن", "en": "Philosophy of mind", "nl": "Filosofie van de geest"}, "aliases": [], "parent": "phil:phil", "field": null, "summary": {"fa": "آگاهی از کجا می‌آید، اراده آزاد است، و «من» کیست که در طول زمان همان می‌ماند؟", "en": "Where does consciousness come from, is the will free, and who is the \"I\" that stays the same over time?", "nl": "Waar komt bewustzijn vandaan, is de wil vrij, en wie is het \"ik\" dat door de tijd hetzelfde blijft?"}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:phil", "kind": "root", "title": {"fa": "فلسفه", "en": "Philosophy", "nl": "Filosofie"}, "aliases": [], "parent": null, "field": null, "summary": {"fa": "پرسش‌هایی که آزمایش به‌تنهایی جوابشان را نمی‌دهد: چه می‌دانیم، آگاهی چیست، چه باید کرد، علم چگونه پیش می‌رود، جامعهٔ عادلانه چه شکلی است، و زندگی خوب کدام است. این ویکی سنت یونانی، سنت ایرانی‌اسلامی و فلسفهٔ معاصر را کنار هم و در پیوند با روان‌شناسی و جامعه‌شناسی می‌گذارد.", "en": "Questions experiment alone cannot answer: what we know, what consciousness is, what we ought to do, how science progresses, what a just society looks like, and what a good life is. This wiki sets the Greek tradition, the Iranian-Islamic tradition and contemporary philosophy side by side, in connection with psychology and sociology.", "nl": "Vragen die een experiment alleen niet beantwoordt: wat we weten, wat bewustzijn is, wat we behoren te doen, hoe wetenschap vooruitgaat, hoe een rechtvaardige samenleving eruitziet en wat een goed leven is. Deze wiki zet de Griekse traditie, de Iraans-islamitische traditie en de hedendaagse filosofie naast elkaar, in verband met psychologie en sociologie."}, "points": [], "links": [{"to": "psy:philosophy", "rel": "same-as", "note": {"fa": "فلسفه در ویکی روان", "en": "Philosophy in the psychology wiki", "nl": "Philosophy in the psychology wiki"}}, {"to": "atlas:xphi", "rel": "bridges", "note": {"fa": "پل فلسفهٔ تجربی", "en": "The experimental philosophy bridge", "nl": "The experimental philosophy bridge"}}, {"to": "atlas:philsocsci", "rel": "bridges", "note": {"fa": "پل فلسفهٔ علوم اجتماعی", "en": "The philosophy of social science bridge", "nl": "The philosophy of social science bridge"}}], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:fallacies", "kind": "concept", "title": {"fa": "مغالطه‌ها و استدلال غیررسمی", "en": "Fallacies and informal reasoning", "nl": "Drogredenen en informeel redeneren"}, "aliases": [], "parent": "phil:epistemology", "field": "phil:epistemology", "summary": {"fa": "حمله به شخص به جای استدلال، مرد پوشالی، شیب لغزنده، توسل به طبیعت یا سنت، دوگانهٔ کاذب، مصادره به مطلوب. دانستن نام مغالطه‌ها مفید است، ولی والتون هشدار می‌دهد: بسیاری از این الگوها در بافت مناسب استدلال‌های معقولی‌اند؛ «مغالطه» بودن به بافت گفت‌وگو بستگی دارد نه به شکل.", "en": "Attacking the person instead of the argument, straw man, slippery slope, appeal to nature or tradition, false dilemma, begging the question. Knowing the names is useful, but Walton warns: many of these patterns are reasonable arguments in the right context; being a \"fallacy\" depends on the dialogue context, not the form.", "nl": "De persoon aanvallen in plaats van het argument, stroman, hellend vlak, beroep op natuur of traditie, vals dilemma, cirkelredenering. De namen kennen is nuttig, maar Walton waarschuwt: veel van deze patronen zijn in de juiste context redelijke argumenten; \"drogreden\" zijn hangt af van de gesprekscontext, niet van de vorm."}, "points": [{"text": {"fa": "والتون (۲۰۰۸): «توسل به مرجع» وقتی مرجع واقعاً متخصص موضوع است استدلال معتبری است؛ «شیب لغزنده» وقتی سازوکار لغزش نشان داده شود معقول است. فهرست مغالطه‌ها را باید به‌عنوان پرسش‌های انتقادی خواند، نه برچسب‌های خاتمه‌دهندهٔ بحث.", "en": "Walton (2008): \"appeal to authority\" is a valid argument when the authority is actually expert on the matter; \"slippery slope\" is reasonable when the mechanism of slipping is shown. Read the list of fallacies as critical questions, not as debate-ending labels.", "nl": "Walton (2008): \"appeal to authority\" is a valid argument when the authority is actually expert on the matter; \"slippery slope\" is reasonable when the mechanism of slipping is shown. Read the list of fallacies as critical questions, not as debate-ending labels."}, "sources": ["src:c3b2b1faf9"], "flags": []}, {"text": {"fa": "شایع‌ترین مغالطه در بحث‌های عمومی، «مغالطهٔ مغالطه» است: تصور اینکه چون استدلالِ کسی معیوب است، نتیجه‌اش غلط است.", "en": "The commonest fallacy in public debate is the \"fallacy fallacy\": assuming that because someone's argument is flawed, their conclusion is false.", "nl": "The commonest fallacy in public debate is the \"fallacy fallacy\": assuming that because someone's argument is flawed, their conclusion is false."}, "sources": ["src:c3b2b1faf9"], "flags": []}], "links": [{"to": "psy:critical-thinking", "rel": "same-as", "note": {"fa": "تفکر نقادانه در ویکی روان", "en": "Critical thinking in the psychology wiki", "nl": "Critical thinking in the psychology wiki"}}, {"to": "psy:bullshit", "rel": "bridges", "note": {"fa": "حرف مفت", "en": "Bullshit", "nl": "Bullshit"}}, {"to": "psy:conspiracy", "rel": "bridges", "note": {"fa": "توطئه‌باوری", "en": "Conspiracy beliefs", "nl": "Conspiracy beliefs"}}], "people": [], "sources": ["src:c3b2b1faf9"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:capabilities", "kind": "concept", "title": {"fa": "رویکرد قابلیت‌ها", "en": "The capabilities approach", "nl": "De capabilities-benadering"}, "aliases": [], "parent": "phil:political", "field": "phil:political", "summary": {"fa": "سن و نوسبام: توسعه و عدالت را نه با درآمد یا رضایت، که با «قابلیت‌ها» بسنجید: آنچه آدم‌ها واقعاً می‌توانند باشند و بکنند (سالم زیستن، آموختن، مشارکت، ابراز خود). دو نفر با درآمد برابر می‌توانند قابلیت‌های بسیار نابرابر داشته باشند. فهرست ده‌گانهٔ نوسبام پایهٔ لایهٔ «برای ایران» در دانش‌سراست.", "en": "Sen and Nussbaum: measure development and justice not by income or satisfaction but by \"capabilities\": what people can actually be and do (live healthily, learn, participate, express themselves). Two people with equal incomes can have very unequal capabilities. Nussbaum's list of ten underlies Daneshsara's \"for Iran\" layer.", "nl": "Sen en Nussbaum: meet ontwikkeling en rechtvaardigheid niet aan inkomen of tevredenheid maar aan \"capabilities\": wat mensen werkelijk kunnen zijn en doen (gezond leven, leren, deelnemen, zich uiten). Twee mensen met gelijk inkomen kunnen zeer ongelijke capabilities hebben. Nussbaums lijst van tien ligt ten grondslag aan de laag \"voor Iran\" in Daneshsara."}, "points": [{"text": {"fa": "سن (۱۹۹۹): آزادی هم هدف توسعه است هم وسیله‌اش؛ قحطی در دموکراسی‌های دارای مطبوعات آزاد رخ نداده است. شاخص توسعهٔ انسانی سازمان ملل از همین رویکرد زاده شد.", "en": "Sen (1999): freedom is both the end and the means of development; no famine has occurred in a democracy with a free press. The UN Human Development Index was born of this approach.", "nl": "Sen (1999): freedom is both the end and the means of development; no famine has occurred in a democracy with a free press. The UN Human Development Index was born of this approach."}, "sources": ["src:8dcb40e0c8"], "flags": []}, {"text": {"fa": "نوسبام (۲۰۱۱): ده قابلیت مرکزی: زندگی؛ سلامت بدنی؛ یکپارچگی بدنی؛ حس و تخیل و اندیشه؛ عواطف؛ عقل عملی؛ پیوستگی (با دیگران و احترام)؛ دیگر گونه‌ها؛ بازی؛ کنترل بر محیط سیاسی و مادی. هر جامعه باید «آستانه‌ای» از هر یک را برای همه تضمین کند.", "en": "Nussbaum (2011): ten central capabilities: life; bodily health; bodily integrity; senses, imagination and thought; emotions; practical reason; affiliation (with others and respect); other species; play; control over one's political and material environment. Every society should guarantee a \"threshold\" of each for all.", "nl": "Nussbaum (2011): ten central capabilities: life; bodily health; bodily integrity; senses, imagination and thought; emotions; practical reason; affiliation (with others and respect); other species; play; control over one's political and material environment. Every society should guarantee a \"threshold\" of each for all."}, "sources": ["src:4d85b3dee0"], "flags": []}, {"text": {"fa": "نقد: فهرست «پدرسالارانه» و غربی خوانده شده؛ سن عمداً فهرست نمی‌دهد و آن را به گفت‌وگوی عمومی هر جامعه می‌سپارد. اندازه‌گیری قابلیت‌ها دشوارتر از اندازه‌گیری درآمد است.", "en": "Critique: the list has been called \"paternalistic\" and Western; Sen deliberately gives no list, leaving it to each society's public deliberation. Measuring capabilities is harder than measuring income.", "nl": "Critique: the list has been called \"paternalistic\" and Western; Sen deliberately gives no list, leaving it to each society's public deliberation. Measuring capabilities is harder than measuring income."}, "sources": ["src:8dcb40e0c8"], "flags": ["editor-note"]}], "links": [{"to": "phil:veil-of-ignorance", "rel": "critiques", "note": {"fa": "رالز و «کالاهای اولیه»", "en": "Rawls and \"primary goods\"", "nl": "Rawls and \"primary goods\""}}, {"to": "soc:mobility", "rel": "bridges", "note": {"fa": "نابرابری فرصت", "en": "Inequality of opportunity", "nl": "Inequality of opportunity"}}, {"to": "psy:autonomy", "rel": "bridges", "note": {"fa": "خودمختاری در روان‌شناسی", "en": "Autonomy in psychology", "nl": "Autonomy in psychology"}}], "people": ["core:amartya-sen", "core:martha-nussbaum"], "sources": ["src:4d85b3dee0", "src:8dcb40e0c8"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:language-games", "kind": "concept", "title": {"fa": "بازی‌های زبانی و معنا به‌مثابهٔ کاربرد", "en": "Language games and meaning as use", "nl": "Taalspelen en betekenis als gebruik"}, "aliases": [], "parent": "phil:epistemology", "field": "phil:epistemology", "summary": {"fa": "ویتگنشتاینِ متأخر: معنای واژه، شیء یا تصویری در ذهن نیست؛ کاربرد آن در یک «بازی زبانی» و شکل زندگی است. بسیاری از مسئله‌های فلسفی («ذهن چیست؟») از بیرون کشیدن واژه از بازی‌اش پدید می‌آیند. استدلال زبان خصوصی می‌گوید زبانی که فقط برای یک نفر معنا داشته باشد ممکن نیست.", "en": "The later Wittgenstein: a word's meaning is not an object or a picture in the mind but its use within a \"language game\" and a form of life. Many philosophical problems (\"what is mind?\") arise from pulling a word out of its game. The private language argument says a language meaningful to only one person is impossible.", "nl": "De latere Wittgenstein: de betekenis van een woord is geen object of beeld in de geest, maar zijn gebruik binnen een \"taalspel\" en een levensvorm. Veel filosofische problemen (\"wat is geest?\") ontstaan door een woord uit zijn spel te trekken. Het privétaalargument zegt dat een taal die slechts voor één persoon betekenis heeft, onmogelijk is."}, "points": [{"text": {"fa": "ویتگنشتاین (۱۹۵۳): «بازی» را نمی‌شود با یک تعریف مشترک تعریف کرد؛ بازی‌ها «شباهت خانوادگی» دارند. این مفهوم به روان‌شناسی مقوله‌بندی (نمونه‌های اولیهٔ راش) و به بحث «اختلال روانی چیست» راه یافت: شاید اختلال‌ها هم فقط شباهت خانوادگی داشته باشند.", "en": "Wittgenstein (1953): \"game\" cannot be defined by one shared feature; games bear \"family resemblances\". The idea passed into the psychology of categorisation (Rosch's prototypes) and into the debate on \"what is a mental disorder\": perhaps disorders too only share family resemblances.", "nl": "Wittgenstein (1953): \"game\" cannot be defined by one shared feature; games bear \"family resemblances\". The idea passed into the psychology of categorisation (Rosch's prototypes) and into the debate on \"what is a mental disorder\": perhaps disorders too only share family resemblances."}, "sources": ["src:0755e72be8"], "flags": []}, {"text": {"fa": "پیامد برای روان‌شناسی: «چرا می‌ترسی؟» را نباید همیشه با جست‌وجوی یک حالت درونی پاسخ داد؛ بخشی از معنای واژه‌های ذهنی در رفتار و بافت است. از این‌جا تا رفتارگرایی منطقی یک قدم است، که ویتگنشتاین خودش برنداشت.", "en": "A consequence for psychology: \"why are you afraid?\" need not always be answered by seeking an inner state; part of the meaning of mental words lies in behaviour and context. From here to logical behaviourism is one step, which Wittgenstein himself did not take.", "nl": "A consequence for psychology: \"why are you afraid?\" need not always be answered by seeking an inner state; part of the meaning of mental words lies in behaviour and context. From here to logical behaviourism is one step, which Wittgenstein himself did not take."}, "sources": ["src:0755e72be8"], "flags": []}], "links": [{"to": "psy:phil-psychiatry", "rel": "bridges", "note": {"fa": "اختلال چیست؟", "en": "What is a disorder?", "nl": "What is a disorder?"}}, {"to": "psy:dx", "rel": "bridges", "note": {"fa": "تشخیص و شباهت خانوادگی", "en": "Diagnosis and family resemblance", "nl": "Diagnosis and family resemblance"}}, {"to": "phil:hard-problem", "rel": "contrasts", "note": {"fa": "ویتگنشتاین «مسئلهٔ دشوار» را سردرگمی زبانی می‌دانست", "en": "Wittgenstein would call the \"hard problem\" a linguistic confusion", "nl": "Wittgenstein would call the \"hard problem\" a linguistic confusion"}}], "people": ["core:ludwig-wittgenstein"], "sources": ["src:0755e72be8"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:science", "kind": "field", "title": {"fa": "فلسفهٔ علم", "en": "Philosophy of science", "nl": "Wetenschapsfilosofie"}, "aliases": [], "parent": "phil:phil", "field": null, "summary": {"fa": "علم چه فرقی با غیرعلم دارد، چگونه عوض می‌شود، و آیا می‌تواند از ارزش‌ها خالی باشد؟", "en": "How does science differ from non-science, how does it change, and can it be free of values?", "nl": "Hoe verschilt wetenschap van niet-wetenschap, hoe verandert ze, en kan ze vrij van waarden zijn?"}, "points": [], "links": [{"to": "psy:phil-science", "rel": "same-as", "note": {"fa": "فلسفهٔ علم در ویکی روان", "en": "Philosophy of science in the psychology wiki", "nl": "Philosophy of science in the psychology wiki"}}], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:flying-man", "kind": "concept", "title": {"fa": "انسان معلق ابن سینا", "en": "Avicenna's floating man", "nl": "Avicenna's zwevende mens"}, "aliases": ["انسان پرنده", "Flying man", "Floating man"], "parent": "phil:iranian", "field": "phil:iranian", "summary": {"fa": "تصور کن ناگهان آفریده شده‌ای، معلق در هوا، چشم بسته، بی‌هیچ حسی از بدن. ابن سینا می‌گوید حتی در این حال از وجود «خود» آگاهی. پس خودآگاهی به بدن و حواس وابسته نیست و نفس چیزی غیر از بدن است. این آزمایش فکری قرن یازدهم هنوز در فلسفهٔ ذهن نقل می‌شود.", "en": "Imagine you were created suddenly, floating in air, eyes closed, with no sensation of your body. Avicenna says that even so you would be aware of your \"self\". Hence self-awareness does not depend on body or senses, and the soul is something other than the body. This eleventh-century thought experiment is still cited in philosophy of mind.", "nl": "Stel je voor dat je plotseling werd geschapen, zwevend in de lucht, ogen dicht, zonder enig lichaamsgevoel. Avicenna zegt dat je ook dan je van je \"zelf\" bewust zou zijn. Dus hangt zelfbewustzijn niet af van lichaam of zintuigen, en is de ziel iets anders dan het lichaam. Dit gedachte-experiment uit de elfde eeuw wordt nog steeds aangehaald in de filosofie van de geest."}, "points": [{"text": {"fa": "مرمورا (۱۹۸۶): استدلال در «شفا» و «اشارات» آمده و بیش از آنکه برهان باشد، «تنبیه» (یادآوری) است: توجه دادن به اینکه آگاهی از خود، پیش از هر ادراکی، همیشه حاضر است. شباهت و تفاوتش با کوگیتوی دکارت موضوع بحثی زنده است.", "en": "Marmura (1986): the argument appears in the \"Shifa\" and the \"Isharat\" and is less a proof than a \"pointer\" (tanbih): drawing attention to the fact that self-awareness, before any perception, is always present. Its likeness to and difference from Descartes' cogito is a live debate.", "nl": "Marmura (1986): the argument appears in the \"Shifa\" and the \"Isharat\" and is less a proof than a \"pointer\" (tanbih): drawing attention to the fact that self-awareness, before any perception, is always present. Its likeness to and difference from Descartes' cogito is a live debate."}, "sources": ["src:fceff29ae7"], "flags": []}, {"text": {"fa": "آدامسون (۲۰۱۶): ابن سینا نظریهٔ نفس ارسطو را با استدلال‌های تازه به سمت جوهر مستقل برد و فلسفهٔ ذهن قرون وسطای لاتین (از جمله توماس آکویناس) را عمیقاً شکل داد.", "en": "Adamson (2016): Avicenna pushed Aristotle's theory of soul toward an independent substance with new arguments and deeply shaped Latin medieval philosophy of mind (including Thomas Aquinas).", "nl": "Adamson (2016): Avicenna pushed Aristotle's theory of soul toward an independent substance with new arguments and deeply shaped Latin medieval philosophy of mind (including Thomas Aquinas)."}, "sources": ["src:67b0ad90cf"], "flags": []}], "links": [{"to": "phil:skepticism-cogito", "rel": "see-also", "note": {"fa": "کوگیتوی دکارت", "en": "Descartes' cogito", "nl": "Descartes' cogito"}}, {"to": "phil:hard-problem", "rel": "see-also", "note": {"fa": "آگاهی و بدن", "en": "Consciousness and body", "nl": "Consciousness and body"}}, {"to": "phil:illumination", "rel": "see-also", "note": {"fa": "علم حضوری سهروردی", "en": "Suhrawardi's knowledge by presence", "nl": "Suhrawardi's knowledge by presence"}}], "people": ["core:avicenna"], "sources": ["src:67b0ad90cf", "src:fceff29ae7"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:knobe-effect", "kind": "concept", "title": {"fa": "فلسفهٔ تجربی و اثر نوب", "en": "Experimental philosophy and the Knobe effect", "nl": "Experimentele filosofie en het Knobe-effect"}, "aliases": [], "parent": "phil:epistemology", "field": "phil:epistemology", "summary": {"fa": "مدیری برنامه‌ای را تصویب می‌کند که سود دارد و «اتفاقاً» به محیط زیست آسیب می‌زند؛ اکثریت می‌گویند عمداً آسیب زد. همان داستان با «اتفاقاً» به محیط زیست کمک می‌کند؛ اکثریت می‌گویند عمداً کمک نکرد. داوری اخلاقی ما مفهوم «قصد» را عوض می‌کند. فلسفهٔ تجربی به جای تکیه بر شهود فیلسوف در اتاقش، شهود مردم را می‌سنجد.", "en": "A chairman approves a programme that makes profit and \"incidentally\" harms the environment; most say he harmed it intentionally. Same story but it incidentally helps the environment; most say he did not help intentionally. Our moral judgement changes the concept of \"intention\". Experimental philosophy measures people's intuitions instead of relying on the philosopher's intuition in his armchair.", "nl": "Een bestuursvoorzitter keurt een programma goed dat winst maakt en \"toevallig\" het milieu schaadt; de meesten zeggen dat hij het opzettelijk schaadde. Hetzelfde verhaal maar het helpt toevallig het milieu; de meesten zeggen dat hij niet opzettelijk hielp. Ons morele oordeel verandert het begrip \"opzet\". Experimentele filosofie meet de intuïties van mensen in plaats van te vertrouwen op de intuïtie van de filosoof in zijn leunstoel."}, "points": [{"text": {"fa": "نوب (۲۰۰۳): ۸۲ درصد در سناریوی آسیب گفتند «عمدی» و فقط ۲۳ درصد در سناریوی کمک؛ یافته‌ای که ده‌ها بار و در فرهنگ‌های مختلف تکرار شده و نشان می‌دهد مفاهیم «توصیفی» ما از ارزش‌داوری جدا نیستند.", "en": "Knobe (2003): 82 percent in the harm scenario said \"intentionally\", only 23 percent in the help scenario; a finding replicated dozens of times across cultures, showing our \"descriptive\" concepts are not separate from evaluation.", "nl": "Knobe (2003): 82 percent in the harm scenario said \"intentionally\", only 23 percent in the help scenario; a finding replicated dozens of times across cultures, showing our \"descriptive\" concepts are not separate from evaluation."}, "sources": ["src:0fb6d8f626"], "flags": []}, {"text": {"fa": "فلسفهٔ تجربی (x-phi) از ۲۰۰۰ به بعد روش‌های روان‌شناسی را به پرسش‌های فلسفی آورد: آیا شهود دربارهٔ دانش، ارادهٔ آزاد یا هویت در فرهنگ‌های مختلف فرق می‌کند؟ پاسخ: کمتر از آنچه اول گمان می‌رفت، ولی نه هیچ.", "en": "Experimental philosophy (x-phi) from 2000 on brought psychology's methods to philosophical questions: do intuitions about knowledge, free will or identity differ across cultures? Answer: less than first thought, but not nil.", "nl": "Experimental philosophy (x-phi) from 2000 on brought psychology's methods to philosophical questions: do intuitions about knowledge, free will or identity differ across cultures? Answer: less than first thought, but not nil."}, "sources": ["src:0fb6d8f626"], "flags": []}], "links": [{"to": "atlas:xphi", "rel": "part-of", "note": {"fa": "پل فلسفهٔ تجربی", "en": "The experimental philosophy bridge", "nl": "The experimental philosophy bridge"}}, {"to": "phil:trolley", "rel": "see-also", "note": {"fa": "شهودهای اخلاقی", "en": "Moral intuitions", "nl": "Moral intuitions"}}, {"to": "psy:cognitive-biases", "rel": "bridges", "note": {"fa": "سوگیری‌های شناختی", "en": "Cognitive biases", "nl": "Cognitive biases"}}], "people": ["core:joshua-knobe"], "sources": ["src:0fb6d8f626"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:three-theories", "kind": "concept", "title": {"fa": "سه نظریهٔ بزرگ اخلاق", "en": "The three great moral theories", "nl": "De drie grote morele theorieën"}, "aliases": [], "parent": "ph
