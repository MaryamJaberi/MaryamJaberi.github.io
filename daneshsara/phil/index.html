 was a political trial in which he was treated as an intellectual leader of the Qarmatians, and he supposedly wrote a letter urging the destruction of the Kaaba and the abolition of the pilgrimage. He adds that a court faction removed him after a coup.", "nl": "Per the lecturer, Hallaj was not executed for 'ana al-Haqq' (Bayazid had earlier said comparable things); it was a political trial in which he was treated as an intellectual leader of the Qarmatians, and he supposedly wrote a letter urging the destruction of the Kaaba and the abolition of the pilgrimage. He adds that a court faction removed him after a coup."}, "sources": ["src:13520836c4"], "flags": ["editor-note", "contested"]}, {"text": {"fa": "نظر پژوهشگران: ماسینیون (۱۹۲۲) بر پایهٔ اخبار الحلاج و منابع دیگر، حلاج را عارفی می‌شناسد که در بغداد در سال ۳۰۹ هجری (۹۲۲ میلادی) در زمان المقتدر و وزارت حامد بن عباس اعدام شد. اتهام‌ها شامل ادعای الوهیت یا حلول، تعلیم جایگزینی حج با آیین خانگی، و گمان ارتباط با قرمطیان بود؛ ارتباط واقعی با قرمطیان اثبات‌شده نیست. شیمل و ارنست همین روایت را (با تفاوت‌های جزئی) ادامه داده‌اند. حملهٔ قرمطیان به مکه و بردن حجرالاسود در ۹۳۰ میلادی یعنی هشت سال پس از اعدام او رخ داد، پس نمی‌توان آن را مستقیم به او نسبت داد. حمایت مادر خلیفه و حاجب درباری (نصر قشوری) از حلاج هم در منابع آمده است.", "en": "Scholarly view: Massignon (1922), drawing on the Akhbar al-Hallaj and other sources, presents Hallaj as a mystic executed in Baghdad in 309 AH (922 CE) under al-Muqtadir with the vizier Hamid ibn al-Abbas. The charges included claiming divinity or indwelling, teaching that pilgrimage could be replaced by a domestic rite, and suspected Qarmatian links; real Qarmatian ties are unproven. Schimmel and Ernst continue this account with variations. The Qarmatian sack of Mecca and removal of the Black Stone happened in 930 CE, eight years after his death, so it cannot be tied to him directly. The sources also mention the caliph's mother and the chamberlain Nasr al-Qushuri as sympathisers.", "nl": "Scholarly view: Massignon (1922), drawing on the Akhbar al-Hallaj and other sources, presents Hallaj as a mystic executed in Baghdad in 309 AH (922 CE) under al-Muqtadir with the vizier Hamid ibn al-Abbas. The charges included claiming divinity or indwelling, teaching that pilgrimage could be replaced by a domestic rite, and suspected Qarmatian links; real Qarmatian ties are unproven. Schimmel and Ernst continue this account with variations. The Qarmatian sack of Mecca and removal of the Black Stone happened in 930 CE, eight years after his death, so it cannot be tied to him directly. The sources also mention the caliph's mother and the chamberlain Nasr al-Qushuri as sympathisers."}, "sources": ["src:8f08da16c2", "src:ebb6a6fa6e", "src:c51bd42bb7"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، حلاج نمایش‌هایی از کرامات (مثل آوردن شیرینی یا ماهی تازه) اجرا می‌کرد و خودش هم در محاکمه آن‌ها را توضیح عقلانی می‌داد، و به نظر او رازآمیزی عمدی «حربه» بود. گزارش‌های کرامات و اتهام فریب بیشتر از منابع دشمن یا گزارش دادگاه آمده و درستی هر مورد را نمی‌توان ثابت کرد. در متن حلاج، ایدهٔ «نور محمدی» پیش از آفرینش آدم هست؛ سخنران آن را به «فروهر» زرتشتی ربط می‌دهد، که فرضیه‌ای حدسی است و در پژوهش اصلی ثابت نشده.", "en": "Per the lecturer, Hallaj staged miracle-like displays (bringing sweets or fresh fish) and in court explained them in rational terms, and he sees deliberate mystery as a 'tool'. Reports of miracles and of fraud come mostly from hostile sources or trial records, and no single case can be proven. Hallaj's texts contain the idea of a pre-existent 'Muhammadan light'; the lecturer links this to the Zoroastrian fravashi, which is a speculative hypothesis not established in the main research.", "nl": "Per the lecturer, Hallaj staged miracle-like displays (bringing sweets or fresh fish) and in court explained them in rational terms, and he sees deliberate mystery as a 'tool'. Reports of miracles and of fraud come mostly from hostile sources or trial records, and no single case can be proven. Hallaj's texts contain the idea of a pre-existent 'Muhammadan light'; the lecturer links this to the Zoroastrian fravashi, which is a speculative hypothesis not established in the main research."}, "sources": ["src:13520836c4"], "flags": ["editor-note", "contested"]}], "links": [{"to": "phil:iranian", "rel": "see-also", "note": {"fa": "فلسفهٔ ایرانی‌اسلامی", "en": "Iranian-Islamic philosophy", "nl": "Iranian-Islamic philosophy"}}, {"to": "soc:early-islamic-iran-continuity-debate", "rel": "part-of", "note": {"fa": "زمینهٔ تاریخی دورهٔ حلاج", "en": "The historical setting of Hallaj's period", "nl": "The historical setting of Hallaj's period"}}, {"to": "phil:ethics-first-zoroaster-kalam-origins", "rel": "see-also", "note": {"fa": "اخلاق، کلام و جبر در همان دوره", "en": "Ethics, theology and determinism in the same period", "nl": "Ethics, theology and determinism in the same period"}}], "people": ["core:al-husayn-ibn-mansur-al-hallaj", "core:louis-massignon", "core:annemarie-schimmel", "core:carl-w-ernst", "core:abu-yazid-al-bistami"], "sources": ["src:13520836c4", "src:8f08da16c2", "src:c51bd42bb7", "src:ebb6a6fa6e"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:illumination", "kind": "concept", "title": {"fa": "حکمت اشراق و علم حضوری", "en": "Illuminationism and knowledge by presence", "nl": "Illuminationisme en kennis door aanwezigheid"}, "aliases": ["Ishraq", "اشراق"], "parent": "phil:iranian", "field": "phil:iranian", "summary": {"fa": "سهروردی دو نوع دانستن را جدا کرد: «علم حصولی» که از راه مفهوم و صورت به چیزی می‌رسد، و «علم حضوری» که بی‌واسطه است: دانستنِ خود، دردِ خود، حالتِ خود. نور استعارهٔ مرکزی اوست: واقعیت درجاتی از نور است و آگاهی خودِ روشنی. امروز این تمایز را با «دانش اول‌شخص» در فلسفهٔ ذهن مقایسه می‌کنند.", "en": "Suhrawardi separated two kinds of knowing: \"knowledge by acquisition\", reaching a thing through concept and form, and \"knowledge by presence\", which is immediate: knowing oneself, one's pain, one's state. Light is his central metaphor: reality is degrees of light and consciousness is luminosity itself. Today the distinction is compared with \"first-person knowledge\" in philosophy of mind.", "nl": "Suhrawardi scheidde twee soorten weten: \"kennis door verwerving\", die een ding bereikt via begrip en vorm, en \"kennis door aanwezigheid\", die onmiddellijk is: zichzelf, zijn pijn, zijn toestand kennen. Licht is zijn centrale metafoor: de werkelijkheid bestaat uit graden van licht en bewustzijn is lichtendheid zelf. Vandaag wordt het onderscheid vergeleken met \"eerstepersoonskennis\" in de filosofie van de geest."}, "points": [{"text": {"fa": "والبریج (۲۰۰۰): سهروردی خود را احیاگر حکمت ایران باستان و افلاطون می‌دانست و در برابر مشائیان (ابن سینا) ایستاد؛ نقد او بر «تعریف» ارسطویی (هر تعریف به مفاهیمی نیاز دارد که خود تعریف‌ناشده‌اند) پیش‌درآمد بحث‌های مدرن است. در ۳۸ سالگی در حلب به حکم صلاح‌الدین کشته شد.", "en": "Walbridge (2000): Suhrawardi saw himself as reviver of ancient Persian wisdom and of Plato, against the Peripatetics (Avicenna); his critique of Aristotelian \"definition\" (every definition needs concepts that are themselves undefined) anticipates modern debates. He was executed in Aleppo at 38 on Saladin's order.", "nl": "Walbridge (2000): Suhrawardi saw himself as reviver of ancient Persian wisdom and of Plato, against the Peripatetics (Avicenna); his critique of Aristotelian \"definition\" (every definition needs concepts that are themselves undefined) anticipates modern debates. He was executed in Aleppo at 38 on Saladin's order."}, "sources": ["src:48c1bb6626"], "flags": []}, {"text": {"fa": "تمثیل غار افلاطون و نورشناسی سهروردی یک خانواده‌اند: دانستن همچون دیدن در نور. این سنت از راه ملاصدرا تا امروز در حوزه‌های ایران تدریس می‌شود.", "en": "Plato's cave and Suhrawardi's optics of light belong to one family: knowing as seeing in light. Through Mulla Sadra this tradition is taught in Iran's seminaries to this day.", "nl": "Plato's cave and Suhrawardi's optics of light belong to one family: knowing as seeing in light. Through Mulla Sadra this tradition is taught in Iran's seminaries to this day."}, "sources": ["src:cb319b234e", "src:48c1bb6626"], "flags": []}], "links": [{"to": "phil:hard-problem", "rel": "bridges", "note": {"fa": "دانش اول‌شخص و مسئلهٔ دشوار", "en": "First-person knowledge and the hard problem", "nl": "First-person knowledge and the hard problem"}}, {"to": "phil:substantial-motion", "rel": "see-also", "note": {"fa": "ملاصدرا، وارث اشراق", "en": "Mulla Sadra, heir of Illumination", "nl": "Mulla Sadra, heir of Illumination"}}, {"to": "phil:flying-man", "rel": "see-also", "note": {"fa": "ابن سینا", "en": "Avicenna", "nl": "Avicenna"}}], "people": ["core:suhrawardi"], "sources": ["src:48c1bb6626", "src:cb319b234e"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:will-to-power-compilation", "kind": "concept", "title": {"fa": "«ارادهٔ معطوف به قدرت»: کتابی که نیچه ننوشت", "en": "'The Will to Power': a book Nietzsche did not write", "nl": "'De wil tot macht': een boek dat Nietzsche niet schreef"}, "aliases": [], "parent": "phil:epistemology", "field": "phil:epistemology", "summary": {"fa": "«ارادهٔ معطوف به قدرت» (۱۹۰۱ و ۱۹۰۶) مجموعه‌ای از یادداشت‌های نیچه است که ناشران پس از مرگش گزین و چیده‌اند، نه کتابی که او خود تمام یا تأیید کرده باشد. پژوهش‌های مونتیناری نشان داد ساختار کتاب ساختهٔ ویراستاران است. اما ادعای سخنران که الیزابت «کل کتاب را جعل کرد» و نیچه به‌علت بیماری نمی‌توانست آن را بنویسد، دقیق نیست.", "en": "The Will to Power (1901, 1906) is a collection of Nietzsche's notes selected and arranged by editors after his death, not a book he finished or approved. Montinari's research showed that its structure is the editors' creation. The lecturer's claims that Elisabeth 'forged the whole book' and that Nietzsche could not have written it because of illness are not accurate.", "nl": "De wil tot macht (1901, 1906) is een door redacteuren na zijn dood geselecteerde en geordende verzameling aantekeningen van Nietzsche, geen boek dat hij zelf voltooide of goedkeurde. Montinari toonde aan dat de opbouw van de redacteuren komt. De bewering van de docent dat Elisabeth 'het hele boek vervalste' is echter niet juist."}, "points": [{"text": {"fa": "به گفتهٔ سخنران، الیزابت پس از مرگ برادر از یادداشت‌های پراکندهٔ او کتابی ساخت، صفحاتی را عوض یا کاملاً جعل کرد، اندیشه‌های یهودستیز و ملی‌گرای خودش را وارد کرد، و نازی‌ها از آن برای مشروعیت‌بخشی استفاده کردند.", "en": "Per the lecturer, after her brother's death Elisabeth built a book from his scattered notes, altered or entirely forged pages, inserted her own antisemitic and nationalist ideas, and the Nazis used it to legitimate themselves.", "nl": "Per the lecturer, after her brother's death Elisabeth built a book from his scattered notes, altered or entirely forged pages, inserted her own antisemitic and nationalist ideas, and the Nazis used it to legitimate themselves."}, "sources": ["src:873416a5d1"], "flags": ["editor-note"]}, {"text": {"fa": "بخش درست ماجرا: این کتاب را نیچه خود به‌عنوان کتاب منتشر نکرد. یادداشت‌ها بیشتر مربوط به ۱۸۸۳ تا ۱۸۸۸ است؛ او در دوره‌ای طرح کتابی با این عنوان داشت، اما در پایان ۱۸۸۸ آن را رها کرد و به «ارزیابی دوبارهٔ همهٔ ارزش‌ها» و «دجال» پرداخت. چاپ ۱۹۰۱ (حدود ۴۸۳ بند) و چاپ گسترده‌تر ۱۹۰۶ (۱۰۶۷ بند) را آرشیو، با نقش پررنگ پتر گاست، چید. مونتیناری نتیجه گرفت که «کتابی با این عنوان» از نیچه وجود ندارد.", "en": "What is correct: Nietzsche did not publish this as a book. The notes mostly date from 1883-1888; he once planned a book of this title but dropped it in late 1888 for the Revaluation of All Values and The Antichrist. The 1901 edition (about 483 aphorisms) and the larger 1906 edition (1067 aphorisms) were arranged by the Archive, with Peter Gast playing a major part. Montinari concluded that no such book by Nietzsche exists.", "nl": "What is correct: Nietzsche did not publish this as a book. The notes mostly date from 1883-1888; he once planned a book of this title but dropped it in late 1888 for the Revaluation of All Values and The Antichrist. The 1901 edition (about 483 aphorisms) and the larger 1906 edition (1067 aphorisms) were arranged by the Archive, with Peter Gast playing a major part. Montinari concluded that no such book by Nietzsche exists."}, "sources": ["src:ea00f6ec13", "src:477ffc6fa2", "src:afae93d162"], "flags": ["editor-note"]}, {"text": {"fa": "اما تصویر «جعل کامل» و «نیچه توان نوشتن نداشت» گمراه‌کننده است. بیشتر بندها یادداشت‌های واقعی نیچه‌اند که در سال‌های سالم او نوشته شدند، نه پس از فروپاشی؛ مشکل اصلی گزینش، ترتیب، برش و ساختن این برداشت است که اثری نظام‌مند و نهایی در دست داریم، به‌علاوهٔ خطاهای رونویسی. سندهای معتبرتر دربارهٔ دست‌کاری الیزابت بیشتر به نامه‌ها و زندگی‌نامه برمی‌گردد، و ویرایش اصلی را گاست انجام داد.", "en": "But the picture of 'total forgery' and 'Nietzsche could not write it' is misleading. Most aphorisms are genuine notes written during his healthy years, not after the collapse; the main problems are selection, ordering, truncation and the false impression of a systematic final work, plus transcription errors. The better-documented tampering by Elisabeth concerns letters and biography, and Gast did much of the actual editing.", "nl": "But the picture of 'total forgery' and 'Nietzsche could not write it' is misleading. Most aphorisms are genuine notes written during his healthy years, not after the collapse; the main problems are selection, ordering, truncation and the false impression of a systematic final work, plus transcription errors. The better-documented tampering by Elisabeth concerns letters and biography, and Gast did much of the actual editing."}, "sources": ["src:ea00f6ec13", "src:b7c909410d"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "دربارهٔ هیتلر و نازی‌ها: شاهد معتبری نیست که هیتلر این کتاب را «مهم‌ترین اثر فلسفی عصر جدید» خوانده باشد. ایدئولوگ‌های نازی (مثل آلفرد بویملر) از یادداشت‌های به‌جامانده و بخشی از آثار نیچه گزینشی استفاده کردند. بازدیدهای هیتلر از آرشیو در اوایل دههٔ ۱۹۳۰ (از جمله دیدار معروف ۱۹۳۴) و حضورش در مراسم خاکسپاری الیزابت در نوامبر ۱۹۳۵ مستند است، ولی شمار «هشت بار در چهارده ماه» تأیید نشد. متن‌های نیچه خود ناسیونالیسم آلمانی و یهودستیزی را رد می‌کنند.", "en": "On Hitler and the Nazis: there is no reliable evidence that Hitler called this book 'the most important philosophical work of the modern age'. Nazi ideologues such as Alfred Baeumler used the posthumous notes and parts of Nietzsche's work selectively. Hitler's visits to the Archive in the early 1930s (including the well-known 1934 visit) and his attendance at Elisabeth's funeral in November 1935 are documented, but the count of 'eight times in fourteen months' could not be verified. Nietzsche's own texts reject German nationalism and antisemitism.", "nl": "On Hitler and the Nazis: there is no reliable evidence that Hitler called this book 'the most important philosophical work of the modern age'. Nazi ideologues such as Alfred Baeumler used the posthumous notes and parts of Nietzsche's work selectively. Hitler's visits to the Archive in the early 1930s (including the well-known 1934 visit) and his attendance at Elisabeth's funeral in November 1935 are documented, but the count of 'eight times in fourteen months' could not be verified. Nietzsche's own texts reject German nationalism and antisemitism."}, "sources": ["src:b7c909410d", "src:4c1bd28e95"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "درس روش‌شناختی: جمله‌های مجزای نیچه که ادبی و استعاری‌اند، بیرون از بافتشان به‌آسانی بد خوانده می‌شوند. برای خواندن مطمئن‌تر باید ویرایش انتقادی کولی و مونتیناری (از ۱۹۶۷) را معیار گرفت؛ ترجمهٔ کافمن از ۱۹۶۷ هم مفید است ولی با توجه به همین محدودیت‌ها.", "en": "Methodological lesson: Nietzsche's isolated, literary and metaphorical sentences are easily misread outside their context. The critical edition by Colli and Montinari (from 1967) is the reliable standard; Kaufmann's 1967 translation is useful but should be read with these limits in mind.", "nl": "Methodological lesson: Nietzsche's isolated, literary and metaphorical sentences are easily misread outside their context. The critical edition by Colli and Montinari (from 1967) is the reliable standard; Kaufmann's 1967 translation is useful but should be read with these limits in mind."}, "sources": ["src:ea00f6ec13", "src:477ffc6fa2"], "flags": ["editor-note"]}], "links": [{"to": "phil:nietzsche-collapse-and-estate", "rel": "part-of", "note": {"fa": "فروپاشی نیچه و سرنوشت میراث او", "en": "Nietzsche's collapse and the fate of his papers", "nl": "Nietzsche's collapse and the fate of his papers"}}, {"to": "psy:forgery", "rel": "see-also", "note": {"fa": "اصالت و جعل", "en": "Authenticity and forgery", "nl": "Authenticity and forgery"}}, {"to": "phil:epistemology", "rel": "bridges", "note": {"fa": "معرفت‌شناسی: اعتبار منبع و متن", "en": "Epistemology: reliability of sources and texts", "nl": "Epistemology: reliability of sources and texts"}}], "people": ["core:mazzino-montinari", "core:giorgio-colli", "core:peter-gast-heinrich-k-selitz", "core:walter-kaufmann", "core:elisabeth-f-rster-nietzsche"], "sources": ["src:477ffc6fa2", "src:4c1bd28e95", "src:873416a5d1", "src:afae93d162", "src:b7c909410d", "src:ea00f6ec13"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:hard-problem", "kind": "concept", "title": {"fa": "مسئلهٔ دشوار آگاهی", "en": "The hard problem of consciousness", "nl": "Het moeilijke probleem van bewustzijn"}, "aliases": [], "parent": "phil:mind", "field": "phil:mind", "summary": {"fa": "توضیح اینکه مغز چگونه اطلاعات را پردازش می‌کند «مسئلهٔ آسان» است؛ مسئلهٔ دشوار این است که چرا این پردازش با تجربهٔ درونی همراه است: چرا دیدن قرمز «حسی» دارد؟ نیگل پرسید «خفاش بودن چگونه است؟» و گفت علم عینی به این «چگونگی» دسترسی ندارد.", "en": "Explaining how the brain processes information is the \"easy problem\"; the hard problem is why that processing is accompanied by inner experience: why does seeing red \"feel\" like something? Nagel asked \"what is it like to be a bat?\" and said objective science has no access to that \"what it is like\".", "nl": "Verklaren hoe het brein informatie verwerkt is het \"gemakkelijke probleem\"; het moeilijke probleem is waarom die verwerking gepaard gaat met innerlijke ervaring: waarom \"voelt\" rood zien als iets? Nagel vroeg \"hoe is het om een vleermuis te zijn?\" en zei dat objectieve wetenschap geen toegang heeft tot dat \"hoe het is\"."}, "points": [{"text": {"fa": "چالمرز (۱۹۹۵): حتی وقتی همهٔ کارکردها (توجه، گزارش، تمایز) توضیح داده شوند، این پرسش می‌ماند که چرا با تجربه همراه‌اند؛ پیشنهاد جنجالی‌اش: آگاهی ویژگی بنیادی طبیعت است (نوعی دوگانگی ویژگی‌ها).", "en": "Chalmers (1995): even when all functions (attention, report, discrimination) are explained, the question remains why they are accompanied by experience; his controversial proposal: consciousness is a fundamental feature of nature (a kind of property dualism).", "nl": "Chalmers (1995): even when all functions (attention, report, discrimination) are explained, the question remains why they are accompanied by experience; his controversial proposal: consciousness is a fundamental feature of nature (a kind of property dualism)."}, "sources": ["src:01f21f4eb5"], "flags": ["contested"]}, {"text": {"fa": "دنت (۱۹۹۱) مخالف است: «مسئلهٔ دشوار» توهمی است که از شهودهای ما دربارهٔ تجربه می‌آید؛ وقتی همهٔ مسئله‌های آسان حل شوند، چیزی باقی نمی‌ماند. این اختلاف، چهل سال است که حل نشده.", "en": "Dennett (1991) disagrees: the \"hard problem\" is an illusion arising from our intuitions about experience; once all the easy problems are solved, nothing remains. The disagreement has stood unresolved for forty years.", "nl": "Dennett (1991) disagrees: the \"hard problem\" is an illusion arising from our intuitions about experience; once all the easy problems are solved, nothing remains. The disagreement has stood unresolved for forty years."}, "sources": ["src:7ac7a18d33"], "flags": ["contested"]}, {"text": {"fa": "نیگل (۱۹۷۴): هرقدر دربارهٔ پژواک‌یابی خفاش بدانیم، نمی‌دانیم خفاش بودن از درون چگونه است؛ واقعیت‌های ذهنی به دیدگاه گره خورده‌اند و تقلیل‌گرایی فیزیکی آن‌ها را جا می‌اندازد.", "en": "Nagel (1974): however much we know about bat echolocation, we do not know what being a bat is like from inside; mental facts are tied to a point of view, and physical reductionism leaves them out.", "nl": "Nagel (1974): however much we know about bat echolocation, we do not know what being a bat is like from inside; mental facts are tied to a point of view, and physical reductionism leaves them out."}, "sources": ["src:379d80380f"], "flags": []}], "links": [{"to": "psy:phil-mind", "rel": "same-as", "note": {"fa": "فلسفهٔ ذهن در ویکی روان", "en": "Philosophy of mind in the psychology wiki", "nl": "Philosophy of mind in the psychology wiki"}}, {"to": "psy:consciousness", "rel": "bridges", "note": {"fa": "هشیاری در روان‌پزشکی", "en": "Consciousness in psychiatry", "nl": "Consciousness in psychiatry"}}, {"to": "phil:flying-man", "rel": "see-also", "note": {"fa": "خودآگاهی بدون بدن نزد ابن سینا", "en": "Self-awareness without body in Avicenna", "nl": "Self-awareness without body in Avicenna"}}], "people": ["core:david-chalmers", "core:thomas-nagel", "core:daniel-dennett"], "sources": ["src:01f21f4eb5", "src:379d80380f", "src:7ac7a18d33"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:substantial-motion", "kind": "concept", "title": {"fa": "حرکت جوهری ملاصدرا", "en": "Mulla Sadra's substantial motion", "nl": "Mulla Sadra's substantiële beweging"}, "aliases": ["حکمت متعالیه", "Transcendent philosophy"], "parent": "phil:iranian", "field": "phil:iranian", "summary": {"fa": "ارسطوییان می‌گفتند حرکت فقط در عَرَض‌هاست (رنگ، جا، اندازه) و جوهر ثابت می‌ماند. ملاصدرا گفت خود جوهر دائم در حرکت و «شدن» است؛ هستی اصیل و درجه‌پذیر است («تشکیک وجود») و نفس انسان «جسمانیة الحدوث، روحانیة البقاء»: از بدن برمی‌خیزد و در سیر خود مجرد می‌شود. تصویری پویا از خود که با هویت شخصی پارفیت و نوروپلاستیسیته گفت‌وگو می‌کند.", "en": "Aristotelians held that motion occurs only in accidents (colour, place, size) while substance stays fixed. Mulla Sadra said substance itself is in constant motion and \"becoming\"; existence is primary and graded (\"modulation of being\"), and the human soul is \"bodily in origin, spiritual in survival\": it arises from the body and becomes immaterial along its journey. A dynamic picture of the self in dialogue with Parfit's personal identity and neuroplasticity.", "nl": "Aristotelici meenden dat beweging alleen in accidenten plaatsvindt (kleur, plaats, grootte) terwijl de substantie vast blijft. Mulla Sadra zei dat de substantie zelf voortdurend in beweging en \"wording\" is; het zijn is primair en gradueel (\"modulatie van het zijn\"), en de menselijke ziel is \"lichamelijk in oorsprong, geestelijk in voortbestaan\": ze ontstaat uit het lichaam en wordt onderweg immaterieel. Een dynamisch beeld van het zelf dat in gesprek is met Parfits persoonlijke identiteit en neuroplasticiteit."}, "points": [{"text": {"fa": "ریزوی (۲۰۰۹): «اصالت وجود» ملاصدرا یعنی آنچه واقعی است وجود است نه ماهیت، و وجود یک حقیقت واحد با شدت و ضعف است؛ این متافیزیک به او اجازه داد تغییر پیوستهٔ جوهر را بی‌تناقض بیندیشد.", "en": "Rizvi (2009): Sadra's \"primacy of existence\" means what is real is existence not essence, and existence is one reality with intensity and weakness; this metaphysics let him think continuous substantial change without contradiction.", "nl": "Rizvi (2009): Sadra's \"primacy of existence\" means what is real is existence not essence, and existence is one reality with intensity and weakness; this metaphysics let him think continuous substantial change without contradiction."}, "sources": ["src:60f242a8cf"], "flags": []}, {"text": {"fa": "حکمت متعالیه برنامهٔ درسی فلسفهٔ اسلامی در ایران معاصر را شکل داده (از طباطبایی و مطهری تا امروز)؛ خواندن انتقادی آن در کنار فلسفهٔ ذهن تحلیلی، پروژه‌ای است که تازه آغاز شده.", "en": "The Transcendent Philosophy has shaped the curriculum of Islamic philosophy in contemporary Iran (from Tabataba'i and Motahhari to today); reading it critically alongside analytic philosophy of mind is a project only just begun.", "nl": "The Transcendent Philosophy has shaped the curriculum of Islamic philosophy in contemporary Iran (from Tabataba'i and Motahhari to today); reading it critically alongside analytic philosophy of mind is a project only just begun."}, "sources": ["src:60f242a8cf"], "flags": ["editor-note"]}], "links": [{"to": "phil:personal-identity", "rel": "bridges", "note": {"fa": "هویت شخصی و پیوستگی", "en": "Personal identity and continuity", "nl": "Personal identity and continuity"}}, {"to": "psy:n-plasticity", "rel": "bridges", "note": {"fa": "انعطاف‌پذیری مغز", "en": "Neuroplasticity", "nl": "Neuroplasticity"}}, {"to": "phil:illumination", "rel": "prerequisite", "note": {"fa": "اشراق", "en": "Illumination", "nl": "Illumination"}}], "people": ["core:mulla-sadra"], "sources": ["src:60f242a8cf"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:ghazali-causation", "kind": "concept", "title": {"fa": "غزالی، ابن رشد و مسئلهٔ علیت", "en": "Al-Ghazali, Averroes and the problem of causation", "nl": "Al-Ghazali, Averroes en het probleem van causaliteit"}, "aliases": [], "parent": "phil:iranian", "field": "phil:iranian", "summary": {"fa": "غزالی در «تهافت الفلاسفه» گفت پیوند آتش و سوختن ضروری نیست: فقط «عادت» است و خدا می‌تواند آن را نشکند؛ هفت قرن پیش از هیوم. ابن رشد پاسخ داد که بدون علیت ضروری، علم و حتی زبان فرو می‌ریزد. این مناظره دربارهٔ اینکه آیا علم می‌تواند بدون متافیزیکِ علیت کار کند، امروز هم زنده است.", "en": "In the \"Incoherence of the Philosophers\" al-Ghazali said the link between fire and burning is not necessary: it is mere \"habit\", and God could break it; seven centuries before Hume. Averroes replied that without necessary causation, science and even language collapse. The debate over whether science can work without a metaphysics of causation is alive today.", "nl": "In de \"Incoherentie van de filosofen\" zei al-Ghazali dat de band tussen vuur en verbranden niet noodzakelijk is: het is louter \"gewoonte\", en God kan die verbreken; zeven eeuwen vóór Hume. Averroes antwoordde dat zonder noodzakelijke causaliteit wetenschap en zelfs taal instorten. Het debat of wetenschap kan werken zonder een metafysica van causaliteit leeft vandaag nog."}, "points": [{"text": {"fa": "گریفل (۲۰۰۹): برخلاف تصویر رایج، غزالی دشمن عقل و علم نبود؛ منطق و ریاضی را می‌پذیرفت و نقدش بر فلاسفه متوجه ادعاهای برهان‌ناپذیر متافیزیکی بود. روایت «غزالی علم اسلامی را کشت» را مورخان کنار گذاشته‌اند.", "en": "Griffel (2009): contrary to the common picture, al-Ghazali was no enemy of reason or science; he accepted logic and mathematics, and his critique of the philosophers targeted indemonstrable metaphysical claims. Historians have abandoned the story that \"al-Ghazali killed Islamic science\".", "nl": "Griffel (2009): contrary to the common picture, al-Ghazali was no enemy of reason or science; he accepted logic and mathematics, and his critique of the philosophers targeted indemonstrable metaphysical claims. Historians have abandoned the story that \"al-Ghazali killed Islamic science\"."}, "sources": ["src:aabff6f260"], "flags": ["contested"]}, {"text": {"fa": "آدامسون (۲۰۲۱): محمد زکریای رازی، پزشک و فیلسوف ری، یک قرن پیش از ابن سینا موضعی رادیکال‌تر داشت: عقل برای همهٔ انسان‌ها کافی است و نیازی به مرجعیت نیست؛ تجربه‌گرایی بالینی‌اش (ثبت موردها، آزمودن درمان) او را پیشگام روش علمی در پزشکی می‌کند.", "en": "Adamson (2021): Muhammad ibn Zakariya al-Razi, physician and philosopher of Rayy, held a more radical position a century before Avicenna: reason suffices for all humans and no authority is needed; his clinical empiricism (case records, testing treatments) makes him a pioneer of scientific method in medicine.", "nl": "Adamson (2021): Muhammad ibn Zakariya al-Razi, physician and philosopher of Rayy, held a more radical position a century before Avicenna: reason suffices for all humans and no authority is needed; his clinical empiricism (case records, testing treatments) makes him a pioneer of scientific method in medicine."}, "sources": ["src:407de84392"], "flags": []}], "links": [{"to": "phil:skepticism-cogito", "rel": "see-also", "note": {"fa": "هیوم و علیت", "en": "Hume and causation", "nl": "Hume and causation"}}, {"to": "phil:falsification", "rel": "bridges", "note": {"fa": "علم بدون یقین", "en": "Science without certainty", "nl": "Science without certainty"}}, {"to": "psy:psychiatry-history", "rel": "bridges", "note": {"fa": "رازی در تاریخ پزشکی و روان‌پزشکی", "en": "Razi in the history of medicine and psychiatry", "nl": "Razi in the history of medicine and psychiatry"}}], "people": ["core:al-ghazali", "core:averroes", "core:david-hume"], "sources": ["src:407de84392", "src:aabff6f260"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:sophists-protagoras-gorgias", "kind": "concept", "title": {"fa": "سوفیست‌ها: پروتاگوراس و گورگیاس در رساله‌های افلاطون", "en": "The sophists: Protagoras and Gorgias in Plato's dialogues", "nl": "De sofisten: Protagoras en Gorgias bij Plato"}, "aliases": [], "parent": "phil:epistemology", "field": "phil:epistemology", "summary": {"fa": "سخنران برای فهم فلسفی «سفسطه» خواندن رساله‌های پروتاگوراس و گورگیاس افلاطون را پیشنهاد می‌کند. او می‌گوید واژهٔ «سوفیست» در اصل به معنای دانشمند و معلم دوره‌گرد بود و بار منفی امروزش بعدتر آمد. دیدگاه‌های پروتاگوراس («انسان معیار همه چیز») و روش سقراط در بحث از نظر او قابل بررسی‌اند.", "en": "The lecturer recommends Plato's Protagoras and Gorgias for grasping 'sophistry' philosophically. He says 'sophist' originally meant a learned person and itinerant teacher, and its negative sense came later. He examines Protagoras's 'man is the measure' and Socrates's own manner of arguing.", "nl": "De docent beveelt Plato's dialogen Protagoras en Gorgias aan om sofisterij te begrijpen en bespreekt 'de mens is de maat van alle dingen'."}, "points": [{"text": {"fa": "سوفیست در یونان باستان به معنای «دانا/استاد» بود و گروهی از معلمان حرفه‌ای را می‌نامید که از شهری به شهر دیگر می‌رفتند و در برابر دستمزد فضیلت، سخنوری و فن خطابه می‌آموختند. سخنران این را به تصویر منفی امروز از سفسطه (استدلال ظاهراً معتبر با نتیجهٔ غلط) پیوند می‌دهد. بار منفی واژه بیش از همه از روایت افلاطون و ارسطو آمده است.", "en": "In ancient Greece 'sophist' meant 'wise/skilled person' and named professional teachers who travelled between cities and taught virtue, rhetoric and oratory for pay. The lecturer links this with today's negative image of sophistry (an apparently valid argument with a wrong conclusion). The negative sense comes largely from Plato's and Aristotle's portrayal.", "nl": "In ancient Greece 'sophist' meant 'wise/skilled person' and named professional teachers who travelled between cities and taught virtue, rhetoric and oratory for pay. The lecturer links this with today's negative image of sophistry (an apparently valid argument with a wrong conclusion). The negative sense comes largely from Plato's and Aristotle's portrayal."}, "sources": ["src:e5f1685e69", "src:aede463a1f"], "flags": []}, {"text": {"fa": "سخنران از قول پروتاگوراس نقل می‌کند «انسان معیار همه چیز است» و آن را چنین می‌فهمد که جهان همان‌گونه که دریافت می‌شود وابسته به ادراک ماست و حقیقت مطلق فلسفی وجود ندارد. او می‌گوید از پروتاگوراس اثر مکتوبی نمانده و آرایش به شکل غیرمستقیم به ما رسیده است. همچنین به جملهٔ پروتاگوراس اشاره می‌کند که مجازات باید جلوگیری از تکرار جرم باشد، نه انتقام.", "en": "The lecturer cites Protagoras's 'man is the measure of all things' and reads it as meaning the world as perceived depends on our perception and no absolute philosophical truth exists. He notes that no written work of Protagoras survives and his views reach us indirectly. He also mentions the line that punishment should prevent repeat offences, not take revenge.", "nl": "The lecturer cites Protagoras's 'man is the measure of all things' and reads it as meaning the world as perceived depends on our perception and no absolute philosophical truth exists. He notes that no written work of Protagoras survives and his views reach us indirectly. He also mentions the line that punishment should prevent repeat offences, not take revenge."}, "sources": ["src:e5f1685e69", "src:05260a30ed", "src:2400b494e0"], "flags": ["editor-note"]}, {"text": {"fa": "ملاحظه: این خوانش نسبی‌گرایانه رایج‌ترین خوانش است (از طریق «تئایتتوس» افلاطون)، اما پژوهشگران دربارهٔ دامنهٔ آن اختلاف دارند: بعضی آن را نسبی‌گرایی تمام‌عیار می‌دانند و بعضی خوانشی معتدل‌تر دارند. برای دقت: پروتاگوراس حدود ۴۹۰ تا ۴۲۰ پیش از میلاد می‌زیست. عبارت‌های او را افلاطون و نویسندگان بعدی نقل کرده‌اند و اصل نوشته‌هایش به جز پاره‌هایی از میان رفته است. دربارهٔ مجازات هم سخن در رسالهٔ پروتاگوراس از زبان شخصیت پروتاگوراس در اسطوره‌ای آمده و تفکیک دقیق نظر تاریخی او از قلم افلاطون دشوار است.", "en": "Note: the relativist reading is the usual one (via Plato's Theaetetus), but scholars disagree on its scope; some take it as full relativism, others read it more moderately. For accuracy: Protagoras lived roughly 490 to 420 BCE, and apart from fragments his own writings are lost; his sayings are preserved by Plato and later writers. The remark on punishment appears in Plato's Protagoras in a speech by the character Protagoras, so separating his historical view from Plato's pen is difficult.", "nl": "Note: the relativist reading is the usual one (via Plato's Theaetetus), but scholars disagree on its scope; some take it as full relativism, others read it more moderately. For accuracy: Protagoras lived roughly 490 to 420 BCE, and apart from fragments his own writings are lost; his sayings are preserved by Plato and later writers. The remark on punishment appears in Plato's Protagoras in a speech by the character Protagoras, so separating his historical view from Plato's pen is difficult."}, "sources": ["src:05260a30ed", "src:2400b494e0"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "سخنران می‌گوید در گورگیاس و پروتاگوراس سقراط از مخاطب می‌خواهد کوتاه و با «بله/نه» جواب بدهد تا سلاح سخنوری از او گرفته شود، و در نتیجه سقراط خودش هم از حیله‌های زبانی استفاده می‌کند. این برداشت شخصی اوست؛ بسیاری از پژوهشگران روش پرسش‌وپاسخ سقراط (الِنخوس) را از جدل‌ورزی سوفیستی متمایز می‌دانند، هرچند سقراط در گفت‌وگوها گاه ظاهراً مغالطه‌آمیز استدلال می‌کند و دربارهٔ طنز و نیت او اختلاف است.", "en": "The lecturer says that in the Gorgias and Protagoras Socrates asks his partner to answer briefly with yes or no in order to strip away the rhetorician's weapon, and that Socrates thereby uses linguistic tricks himself. This is his personal reading. Many scholars distinguish Socrates's question-and-answer method (the elenchus) from sophistic eristic, although Socrates sometimes argues in apparently fallacious ways and his irony and intent are debated.", "nl": "The lecturer says that in the Gorgias and Protagoras Socrates asks his partner to answer briefly with yes or no in order to strip away the rhetorician's weapon, and that Socrates thereby uses linguistic tricks himself. This is his personal reading. Many scholars distinguish Socrates's question-and-answer method (the elenchus) from sophistic eristic, although Socrates sometimes argues in apparently fallacious ways and his irony and intent are debated."}, "sources": ["src:e5f1685e69", "src:05260a30ed", "src:2400b494e0"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "سخنران به یک چرخش در رسالهٔ پروتاگوراس اشاره می‌کند: سقراط که پیشتر می‌گفت فضیلت آموختنی نیست، در پایان به استدلالی می‌رسد که فضیلت را دانش و در نتیجه آموختنی می‌شمارد، و پروتاگوراس هم موضعش را تعدیل می‌کند. او این را نمونهٔ گفت‌وگوی اصلاح‌پذیر و منصفانه می‌بیند. پژوهشگران این پایان را ظاهراً وارونه و طنزآمیز می‌دانند و دربارهٔ معنایش اتفاق نظر ندارند.", "en": "The lecturer notes a reversal in Plato's Protagoras: Socrates, who earlier said virtue cannot be taught, ends with an argument that virtue is knowledge and hence teachable, and Protagoras too softens his position. He sees this as a model of fair, self-correcting dialogue. Scholars read the ending as an ironic reversal and do not agree on its meaning.", "nl": "The lecturer notes a reversal in Plato's Protagoras: Socrates, who earlier said virtue cannot be taught, ends with an argument that virtue is knowledge and hence teachable, and Protagoras too softens his position. He sees this as a model of fair, self-correcting dialogue. Scholars read the ending as an ironic reversal and do not agree on its meaning."}, "sources": ["src:e5f1685e69", "src:05260a30ed"], "flags": ["contested", "editor-note"]}], "links": [{"to": "phil:fallacies", "rel": "see-also", "note": {"fa": "سفسطه در معنای امروزی با مغالطه پیوند دارد.", "en": "Sophistry in its modern sense is tied to fallacy.", "nl": "Sophistry in its modern sense is tied to fallacy."}}, {"to": "phil:cave", "rel": "see-also", "note": {"fa": "افلاطون در تمثیل غار هم به تفاوت دانش و ظاهر می‌پردازد.", "en": "Plato's cave also deals with knowledge versus appearance.", "nl": "Plato's cave also deals with knowledge versus appearance."}}, {"to": "phil:epistemology", "rel": "part-of", "note": {"fa": "بحث نسبی‌گرایی و حقیقت در معرفت‌شناسی.", "en": "The debate on relativism and truth in epistemology.", "nl": "The debate on relativism and truth in epistemology."}}], "people": ["core:protagoras", "core:gorgias", "core:socrates"], "sources": ["src:05260a30ed", "src:2400b494e0", "src:aede463a1f", "src:e5f1685e69"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:epistemic-injustice", "kind": "concept", "title": {"fa": "بی‌عدالتی معرفتی", "en": "Epistemic injustice", "nl": "Epistemisch onrecht"}, "aliases": [], "parent": "phil:epistemology", "field": "phil:epistemology", "summary": {"fa": "وقتی به حرف کسی به‌خاطر هویتش (زن، جوان، مهاجر، بیمار روانی) کمتر اعتماد می‌شود (بی‌عدالتی شهادتی) یا جامعه هنوز مفهومی برای بیان تجربه‌اش ندارد (بی‌عدالتی هرمنوتیکی؛ مثل «آزار جنسی» پیش از نام‌گذاری‌اش). فریکر دانستن را امری اخلاقی و اجتماعی کرد.", "en": "When someone's word is trusted less because of their identity (woman, young, migrant, psychiatric patient) (testimonial injustice), or society lacks the concept to articulate their experience (hermeneutical injustice; like \"sexual harassment\" before it was named). Fricker made knowing an ethical and social matter.", "nl": "Wanneer iemands woord minder wordt vertrouwd vanwege diens identiteit (vrouw, jong, migrant, psychiatrisch patiënt) (getuigenisonrecht), of de samenleving het begrip mist om diens ervaring te verwoorden (hermeneutisch onrecht; zoals \"seksuele intimidatie\" vóór die naam bestond). Fricker maakte van weten een ethische en sociale zaak."}, "points": [{"text": {"fa": "فریکر (۲۰۰۷): بی‌عدالتی شهادتی هم به شنونده آسیب می‌زند (دانشی را از دست می‌دهد) هم به گوینده (در مقام دانندهٔ انسانی تحقیر می‌شود)؛ فضیلت لازم «عدالت شهادتی» است: اصلاح آگاهانهٔ پیش‌داوری در باورپذیری.", "en": "Fricker (2007): testimonial injustice harms the hearer (who loses knowledge) and the speaker (demeaned as a human knower); the needed virtue is \"testimonial justice\": consciously correcting prejudice in credibility.", "nl": "Fricker (2007): testimonial injustice harms the hearer (who loses knowledge) and the speaker (demeaned as a human knower); the needed virtue is \"testimonial justice\": consciously correcting prejudice in credibility."}, "sources": ["src:24f7ea1e01"], "flags": []}, {"text": {"fa": "کاربرد بالینی: گزارش درد و علائم بیماران زن و بیماران روان‌پزشکی به‌طور نظام‌مند کمتر جدی گرفته می‌شود؛ این مفهوم در اخلاق پزشکی و روان‌پزشکی پرکاربرد شده است.", "en": "Clinical use: women's and psychiatric patients' reports of pain and symptoms are systematically taken less seriously; the concept has become widely used in medical and psychiatric ethics.", "nl": "Clinical use: women's and psychiatric patients' reports of pain and symptoms are systematically taken less seriously; the concept has become widely used in medical and psychiatric ethics."}, "sources": ["src:24f7ea1e01"], "flags": []}], "links": [{"to": "psy:dehumanization", "rel": "bridges", "note": {"fa": "انسان‌زدایی", "en": "Dehumanization", "nl": "Dehumanization"}}, {"to": "psy:phil-psychiatry", "rel": "bridges", "note": {"fa": "فلسفهٔ روان‌پزشکی", "en": "Philosophy of psychiatry", "nl": "Philosophy of psychiatry"}}, {"to": "soc:social-construction", "rel": "bridges", "note": {"fa": "مفاهیمی که جامعه می‌سازد", "en": "Concepts a society makes", "nl": "Concepts a society makes"}}], "people": ["core:miranda-fricker"], "sources": ["src:24f7ea1e01"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:nietzsche-collapse-and-estate", "kind": "concept", "title": {"fa": "فروپاشی روانی نیچه و سرنوشت میراث نوشتاری‌اش", "en": "Nietzsche's mental collapse and the fate of his papers", "nl": "Nietzsches geestelijke instorting en het lot van zijn nalatenschap"}, "aliases": [], "parent": "phil:life", "field": "phil:life", "summary": {"fa": "نیچه در ژانویهٔ ۱۸۸۹ در تورین فروپاشید و تا مرگش در ۱۹۰۰ دیگر اثری ننوشت. خواهرش الیزابت از دههٔ ۱۸۹۰ مدیریت آرشیو و میراث او را به دست گرفت. سخنران این ماجرا را با قاطعیت روایت می‌کند، اما برخی جزئیات (تاریخ‌ها، علت بیماری، «ناتوانی کامل») ساده‌شده یا نادرست‌اند.", "en": "Nietzsche collapsed in Turin in January 1889 and wrote nothing further before his death in 1900. His sister Elisabeth took over management of his archive and legacy during the 1890s. The lecturer tells the story with great certainty, but several details (dates, cause of illness, 'total incapacity') are simplified or inaccurate.", "nl": "Nietzsche stortte in januari 1889 in Turijn in en schreef tot zijn dood in 1900 niets meer. Zijn zus Elisabeth nam in de jaren 1890 het beheer van zijn archief en nalatenschap over. De docent vertelt dit stellig, maar enkele details (data, oorzaak, 'volledige onmacht') zijn vereenvoudigd of onjuist."}, "points": [{"text": {"fa": "به گفتهٔ سخنران، پس از سخنان پایانی نیچه در ژانویهٔ ۱۸۸۹ حدود ده سال بیماری و زندگی «نباتی» آغاز شد؛ او در بیمارستان روانی بستری شد، بهبودناپذیر شناخته شد و خواهرش الیزابت از او پرستاری کرد تا در ۱۹۰۰ مرد.", "en": "Per the lecturer, after Nietzsche's final words in January 1889 came about ten years of illness and a 'vegetative' existence; he was committed to a mental hospital, declared incurable, and nursed by his sister Elisabeth until his death in 1900.", "nl": "Per the lecturer, after Nietzsche's final words in January 1889 came about ten years of illness and a 'vegetative' existence; he was committed to a mental hospital, declared incurable, and nursed by his sister Elisabeth until his death in 1900."}, "sources": ["src:873416a5d1"], "flags": ["editor-note"]}, {"text": {"fa": "روایت دقیق‌تر: فروپاشی حدود ۳ ژانویهٔ ۱۸۸۹ در تورین رخ داد و «نامه‌های جنون» در همان روزها نوشته شد. اورباک او را به بازل برد، سپس در کلینیکی در یِنا بستری شد. در ۱۸۹۰ به مراقبت مادرش در ناومبورگ رفت و تا مرگ مادر در ۱۸۹۷ آنجا ماند؛ فقط پس از آن الیزابت او را به وایمار برد. جملهٔ «سرنوشتم را می‌دانم…» هم از «اینک این انسان» است که پاییز ۱۸۸۸ نوشته شد، نه آخرین سخن او. نیچه ۲۵ اوت ۱۹۰۰ درگذشت.", "en": "More precise account: the collapse occurred around 3 January 1889 in Turin, and the 'madness letters' were written in those days. Overbeck took him to Basel, then he was committed to a clinic in Jena. In 1890 he went into his mother's care in Naumburg and stayed there until her death in 1897; only then did Elisabeth take him to Weimar. The sentence 'I know my fate...' comes from Ecce Homo, written in autumn 1888, and is not his last words. He died on 25 August 1900.", "nl": "More precise account: the collapse occurred around 3 January 1889 in Turin, and the 'madness letters' were written in those days. Overbeck took him to Basel, then he was committed to a clinic in Jena. In 1890 he went into his mother's care in Naumburg and stayed there until her death in 1897; only then did Elisabeth take him to Weimar. The sentence 'I know my fate...' comes from Ecce Homo, written in autumn 1888, and is not his last words. He died on 25 August 1900."}, "sources": ["src:afae93d162", "src:4c1bd28e95"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "علت بیماری قطعی نیست. روایت رایج سیفلیس پیشرفته است، اما پزشکان و پژوهشگران بعدی توضیح‌های دیگری (تومور مغزی، انواع زوال عقل، بیماری‌های عروقی مغز، اختلال خلقی) پیشنهاد کرده‌اند. باید آن را مسئله‌ای باز دانست.", "en": "The cause of the illness is not settled. The traditional account is advanced syphilis, but later physicians and scholars have proposed other explanations (brain tumour, dementias, cerebrovascular disease, mood disorder). It should be treated as an open question.", "nl": "The cause of the illness is not settled. The traditional account is advanced syphilis, but later physicians and scholars have proposed other explanations (brain tumour, dementias, cerebrovascular disease, mood disorder). It should be treated as an open question."}, "sources": ["src:873416a5d1"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "ادعای سخنران که نیچه «دیگر حتی نمی‌توانست حرف بزند» و سال‌ها در کما بود برای کل دورهٔ بیماری درست نیست. پس از ۱۸۸۹ او نوشتن پیوسته را کنار گذاشت و حالش به‌تدریج بدتر شد (سکته‌هایی در ۱۸۹۸-۱۸۹۹)، اما سال‌ها حرف می‌زد، پیانو می‌نواخت و به دیگران واکنش نشان می‌داد.", "en": "The lecturer's claim that Nietzsche could 'not even speak' and lay in a coma for years is not true of the whole period. After 1889 he gave up sustained writing and declined gradually (strokes in 1898-1899), but for years he could speak, play the piano and respond to people.", "nl": "The lecturer's claim that Nietzsche could 'not even speak' and lay in a coma for years is not true of the whole period. After 1889 he gave up sustained writing and declined gradually (strokes in 1898-1899), but for years he could speak, play the piano and respond to people."}, "sources": ["src:afae93d162"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "الیزابت پس از بازگشت از پاراگوئه (۱۸۹۳) کنترل میراث را به دست گرفت: آرشیو نیچه را ۱۸۹۴ در ناومبورگ بنیاد گذاشت و حدود ۱۸۹۶-۱۸۹۷ به وایمار برد. شواهد معتبر نشان می‌دهد او بازدیدکنندگان را به دیدار برادرِ بیمار می‌آورد و در نامه‌ها و زندگی‌نامه دست می‌برد تا تصویر رابطه‌ای نزدیک بسازد. جزئیات ویژه‌ای مانند نامه‌های سوخته یا تغییر یک «مادر» به «خواهر» در این منابع تأیید‌شده نیست و باید با احتیاط پذیرفت.", "en": "After returning from Paraguay (1893) Elisabeth took control of the legacy: she founded the Nietzsche Archive in Naumburg in 1894 and moved it to Weimar around 1896-1897. Reliable scholarship shows she brought visitors to see her ailing brother and tampered with letters and biography to build a picture of a close relationship. Specific details such as burned letters or changing 'mother' to 'sister' are not confirmed in the sources used here and should be treated with caution.", "nl": "After returning from Paraguay (1893) Elisabeth took control of the legacy: she founded the Nietzsche Archive in Naumburg in 1894 and moved it to Weimar around 1896-1897. Reliable scholarship shows she brought visitors to see her ailing brother and tampered with letters and biography to build a picture of a close relationship. Specific details such as burned letters or changing 'mother' to 'sister' are not confirmed in the sources used here and should be treated with caution."}, "sources": ["src:ea00f6ec13", "src:b7c909410d", "src:4c1bd28e95"], "flags": ["contested", "editor-note"]}], "links": [{"to": "phil:will-to-power-compilation", "rel": "explains", "note": {"fa": "چگونگی تدوین «ارادهٔ معطوف به قدرت»", "en": "How The Will to Power was compiled", "nl": "How The Will to Power was compiled"}}, {"to": "psy:forgery", "rel": "see-also", "note": {"fa": "اصالت و جعل", "en": "Authenticity and forgery", "nl": "Authenticity and forgery"}}, {"to": "phil:personal-identity", "rel": "see-also", "note": {"fa": "هویت شخصی و تداوم خود", "en": "Personal identity and continuity of the self", "nl": "Personal identity and continuity of the self"}}], "people": ["core:friedrich-nietzsche", "core:elisabeth-f-rster-nietzsche", "core:franz-overbeck"], "sources": ["src:4c1bd28e95", "src:873416a5d1", "src:afae93d162", "src:b7c909410d", "src:ea00f6ec13"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:fallacy-dodging-burden-of-proof", "kind": "concept", "title": {"fa": "ترفندهای طفره از دلیل آوردن: بستن راه استدلال، مسموم کردن چاه و طلب برهان از مخالف", "en": "Dodging the burden of proof: closing the argument, poisoning the well, shifting the burden", "nl": "Het ontlopen van bewijslast: argument afsluiten, de put vergiftigen, bewijslast omkeren"}, "aliases": [], "parent": "phil:epistemology", "field": "phil:epistemology", "summary": {"fa": "به‌جز گزاره‌های بدیهی، هر ادعایی به دلیل نیاز دارد و بار اثبات بر دوش مدعی است. سخنران چند ترفند را معرفی می‌کند که گوینده با آن‌ها از آوردن دلیل فرار می‌کند یا مخاطب را پیشاپیش خلع‌سلاح می‌کند: ادعا را طوری می‌گوید که نقدناپذیر شود، مخالفان را از قبل تحقیر می‌کند، موافقان را تحسین می‌کند، تکرار می‌کند یا از مخالف می‌خواهد خلافش را ثابت کند. این بخش هفت ترفند از فهرست نوزده‌تایی سخنران را گرد می‌آورد.", "en": "Apart from self-evident statements, every claim needs a reason, and the burden of proof lies on the claimant. The lecturer presents several tricks used to avoid giving reasons or to disarm the listener in advance: making a claim unfalsifiable, belittling opponents beforehand, flattering supporters, repeating the claim, or demanding that opponents disprove it. This entry groups seven items from his list of nineteen.", "nl": "Behalve vanzelfsprekende uitspraken heeft elke bewering een reden nodig; de bewijslast ligt bij wie iets beweert. De spreker behandelt trucs om geen argument te hoeven geven: de bewering onweerlegbaar maken, tegenstanders vooraf kleineren, aanhangers vleien, herhalen of de ander laten bewijzen dat het niet zo is."}, "points": [{"text": {"fa": "بستن راه استدلال: گوینده ادعایی می‌کند و همزمان چیزی می‌گوید که هیچ پاسخ و نقدی را ممکن نکند؛ مثلاً هر دو نتیجهٔ دعا (برآورده شدن یا نشدن) را دلیل درستی حرف خودش می‌داند، یا می‌گوید «عقل در این باره راه‌گشا نیست، دلتان را باز کنید».", "en": "Closing the path of argument: the speaker makes a claim and adds a move that makes any rebuttal impossible, e.g. treating both outcomes of a prayer as proof, or saying reason cannot help here and one must 'open the heart'.", "nl": "Closing the path of argument: the speaker makes a claim and adds a move that makes any rebuttal impossible, e.g. treating both outcomes of a prayer as proof, or saying reason cannot help here and one must 'open the heart'."}, "sources": ["src:a81ae2997d"], "flags": []}, {"text": {"fa": "مسموم کردن چاه: به‌جای دلیل، پیشاپیش به مخالفان ادعا صفتی ناپسند می‌چسبانند («همه، جز خائنان…»)، تا کسی جرئت مخالفت نکند. نام آن از این است که گفتن «آب چاه مسموم است» بدون آزمایش، مردم را از نوشیدن باز می‌دارد؛ سخنران قصهٔ «لباس نامرئی پادشاه» را مثال می‌زند.", "en": "Poisoning the well: instead of reasons, a nasty label is attached in advance to anyone who might disagree, so that people fear to object. The lecturer illustrates it with the tale of the king's invisible clothes.", "nl": "Poisoning the well: instead of reasons, a nasty label is attached in advance to anyone who might disagree, so that people fear to object. The lecturer illustrates it with the tale of the king's invisible clothes."}, "sources": ["src:a81ae2997d"], "flags": []}, {"text": {"fa": "پیشاپیش تعریف کردن از موافقان (تملق): می‌گویند «بچهٔ خوب حرف پدر و مادرش را بی‌چون‌وچرا می‌پذیرد» یا «آدم باانصاف حقانیت این کتاب را می‌پذیرد»، تا شنونده برای اینکه خود را در آن گروه خوب جا بزند، ادعا را بپذیرد.", "en": "Flattering supporters in advance: 'a good child obeys without question'; the listener accepts the claim to be counted among the praised group.", "nl": "Flattering supporters in advance: 'a good child obeys without question'; the listener accepts the claim to be counted among the praised group."}, "sources": ["src:a81ae2997d"], "flags": []}, {"text": {"fa": "طلب برهان از مخالف (وارونه کردن بار اثبات): «ثابت کن زندگی پس از مرگ وجود ندارد». بار اثبات با کسی است که ادعا می‌کند، نه با کسی که نمی‌پذیرد؛ نتوانستن مخالف در رد ادعا، دلیل درستی آن نیست.", "en": "Shifting the burden of proof: 'prove there is no afterlife'. The burden stays with the claimant; the opponent's failure to refute is not evidence for the claim.", "nl": "Shifting the burden of proof: 'prove there is no afterlife'. The burden stays with the claimant; the opponent's failure to refute is not evidence for the claim."}, "sources": ["src:a81ae2997d"], "flags": []}, {"text": {"fa": "دوراهی کاذب: وانمود می‌شود فقط دو راه هست («یا قانون را بپذیر یا برو») و راه سوم وجود ندارد. تکرار: به‌جای دلیل، همان ادعا بارها و با واژه‌های درشت‌تر گفته می‌شود تا اثری کاذب بگذارد. «هر بچه‌مدرسه‌ای می‌داند…» نیز ادعای ناروشن را بدیهی جلوه می‌دهد و منتقد را شرمنده می‌کند.", "en": "False dilemma, repetition and 'everyone knows': pretending only two options exist, repeating the claim in stronger words instead of arguing, or labelling a non-obvious claim as obvious so the critic feels ashamed.", "nl": "False dilemma, repetition and 'everyone knows': pretending only two options exist, repeating the claim in stronger words instead of arguing, or labelling a non-obvious claim as obvious so the critic feels ashamed."}, "sources": ["src:a81ae2997d"], "flags": []}, {"text": {"fa": "به گفتهٔ سخنران، نمونه‌های سیاسی و دینی (مثلاً دربارهٔ حجاب اجباری یا مرجع قرار دادن یک رهبر) نمونهٔ این ترفندهاست. این داوری‌ها دیدگاه خود اوست و دربارهٔ هر کدام باید جداگانه استدلال شود؛ برچسب «مغالطه» نشان نمی‌دهد که نتیجهٔ آن ادعا نادرست است، فقط نشان می‌دهد این استدلال کافی نیست.", "en": "Per the lecturer, political and religious examples illustrate these tricks. These are his judgments; each case needs its own argument, and calling an argument fallacious shows only that it is insufficient, not that its conclusion is false.", "nl": "Per the lecturer, political and religious examples illustrate these tricks. These are his judgments; each case needs its own argument, and calling an argument fallacious shows only that it is insufficient, not that its conclusion is false."}, "sources": ["src:a81ae2997d"], "flags": ["editor-note", "contested"]}, {"text": {"fa": "در منطق غیررسمی، «مسموم کردن چاه» و «بار اثبات» ریشه در بحث‌های کلاسیک دارد و پژوهشگران معاصر مغالطه‌ها را وابسته به بافت گفت‌وگو می‌دانند: همیشه هر نوع «طلب دلیل از مخالف» مغالطه نیست (مثلاً در دادگاه یا در بحث‌های پیش‌فرض‌ها بار اثبات به طرف دیگر می‌رود).", "en": "In informal logic, contemporary scholars (Hamblin, Walton) treat fallacies as context-dependent; asking the opponent for reasons is not always a fallacy, and burdens can legitimately shift (e.g. presumptions, legal settings).", "nl": "In informal logic, contemporary scholars (Hamblin, Walton) treat fallacies as context-dependent; asking the opponent for reasons is not always a fallacy, and burdens can legitimately shift (e.g. presumptions, legal settings)."}, "sources": ["src:06a4d503e5", "src:05d15fe653"], "flags": ["contested", "editor-note"]}], "links": [{"to": "phil:fallacies", "rel": "part-of", "note": {"fa": "از خانوادهٔ مغالطه‌ها و استدلال غیررسمی", "en": "Part of the family of fallacies and informal reasoning", "nl": "Part of the family of fallacies and informal reasoning"}}, {"to": "phil:falsification", "rel": "see-also", "note": {"fa": "ادعای نقدناپذیر با ابطال‌پذیری رابطه دارد", "en": "Unfalsifiable claims relate to falsifiability", "nl": "Unfalsifiable claims relate to falsifiability"}}, {"to": "phil:epistemology", "rel": "part-of", "note": {"fa": "معرفت‌شناسی", "en": "Epistemology", "nl": "Epistemology"}}, {"to": "phil:fallacy-appeals-to-feeling-and-force", "rel": "see-also", "note": {"fa": "ترفندهای فشار و احساس", "en": "Tricks of pressure and emotion", "nl": "Tricks of pressure and emotion"}}], "people": ["core:charles-l-hamblin", "core:douglas-walton"], "sources": ["src:05d15fe653", "src:06a4d503e5", "src:a81ae2997d"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:ethics", "kind": "field", "title": {"fa": "اخلاق", "en": "Ethics", "nl": "Ethiek"}, "aliases": [], "parent": "phil:phil", "field": null, "summary": {"fa": "چه باید کرد و چرا؛ و چرا شهود اخلاقی‌مان با نظریه‌هایمان نمی‌خواند.", "en": "What to do and why; and why our moral intuitions disagree with our theories.", "nl": "Wat te doen en waarom; en waarom onze morele intuïties niet stroken met onze theorieën."}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:veil-of-ignorance", "kind": "concept", "title": {"fa": "پردهٔ بی‌خبری و عدالت به‌مثابهٔ انصاف", "en": "The veil of ignorance and justice as fairness", "nl": "De sluier van onwetendheid en rechtvaardigheid als billijkheid"}, "aliases": [], "parent": "phil:political", "field": "phil:political", "summary": {"fa": "رالز: اصول عدالت آن‌هایی‌اند که اگر نمی‌دانستید در جامعه کجا به دنیا می‌آیید (ثروتمند یا فقیر، زن یا مرد، باهوش یا نه) انتخاب می‌کردید. نتیجه: آزادی‌های برابر برای همه، و نابرابری فقط اگر به سود کم‌بهره‌ترین‌ها باشد. نوزیک پاسخ داد: عدالت در روند مالکیت است نه در الگوی توزیع.", "en": "Rawls: the principles of justice are those you would choose if you did not know where in society you would be born (rich or poor, woman or man, clever or not). Result: equal liberties for all, and inequality only if it benefits the least advantaged. Nozick replied: justice lies in the process of acquisition, not in the pattern of distribution.", "nl": "Rawls: de beginselen van rechtvaardigheid zijn die welke je zou kiezen als je niet wist waar in de samenleving je geboren wordt (rijk of arm, vrouw of man, slim of niet). Resultaat: gelijke vrijheden voor allen, en ongelijkheid alleen als ze de minstbedeelden ten goede komt. Nozick antwoordde: rechtvaardigheid zit in het proces van verwerving, niet in het verdelingspatroon."}, "points": [{"text": {"fa": "رالز (۱۹۷۱): در «وضع نخستین» افراد عقلانی و ریسک‌گریز اصل «بیشینه‌کردن کمینه» را برمی‌گزینند؛ استعدادهای طبیعی از نظر اخلاقی «دل‌بخواهی»اند و جامعه حق دارد ثمره‌شان را به‌عنوان دارایی مشترک ببیند.", "en": "Rawls (1971): in the \"original position\" rational, risk-averse people choose the \"maximin\" principle; natural talents are morally \"arbitrary\" and society may treat their fruits as a common asset.", "nl": "Rawls (1971): in the \"original position\" rational, risk-averse people choose the \"maximin\" principle; natural talents are morally \"arbitrary\" and society may treat their fruits as a common asset."}, "sources": ["src:830f23ad61"], "flags": []}, {"text": {"fa": "نوزیک (۱۹۷۴): اگر هر کس دارایی‌اش را عادلانه به دست آورده و داوطلبانه مبادله کرده، توزیعِ حاصل عادلانه است هرقدر نابرابر؛ بازتوزیع اجباری «کار اجباری» است. آزمایش فکری ویلت چمبرلین. این دو کتاب هنوز دو قطب بحث عدالت‌اند.", "en": "Nozick (1974): if everyone acquired holdings justly and exchanged voluntarily, the resulting distribution is just however unequal; forced redistribution is \"forced labour\". The Wilt Chamberlain thought experiment. The two books remain the two poles of the justice debate.", "nl": "Nozick (1974): if everyone acquired holdings justly and exchanged voluntarily, the resulting distribution is just however unequal; forced redistribution is \"forced labour\". The Wilt Chamberlain thought experiment. The two books remain the two poles of the justice debate."}, "sources": ["src:009cb937f3"], "flags": ["contested"]}], "links": [{"to": "soc:gini-inequality", "rel": "bridges", "note": {"fa": "اندازه‌گیری نابرابری", "en": "Measuring inequality", "nl": "Measuring inequality"}}, {"to": "phil:moral-luck", "rel": "prerequisite", "note": {"fa": "بخت اخلاقی", "en": "Moral luck", "nl": "Moral luck"}}, {"to": "phil:capabilities", "rel": "see-also", "note": {"fa": "نقد سن و نوسبام بر رالز", "en": "Sen and Nussbaum's critique of Rawls", "nl": "Sen and Nussbaum's critique of Rawls"}}], "people": ["core:john-rawls", "core:robert-nozick"], "sources": ["src:009cb937f3", "src:830f23ad61"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:perceptual-interface-theory", "kind": "concept", "title": {"fa": "ادراک به‌مثابه رابط: واقعیت و حقیقت در دید سخنران", "en": "Perception as an interface: the lecturer's 'reality versus truth'", "nl": "Waarneming als interface: 'werkelijkheid versus waarheid' bij de spreker"}, "aliases": [], "parent": "phil:epistemology", "field": "phil:epistemology", "summary": {"fa": "سخنران می‌گوید آنچه ما «واقعیت» می‌نامیم رابط کاربری‌ای است که تکامل برای بقا ساخته، مثل پوشهٔ زرد روی رومیزی کامپیوتر که با سخت‌افزار و صفر و یک‌های داخل آن تفاوت دارد. این ایده با نظریهٔ مدرن «رابط ادراک» (دونالد هافمن) نزدیک است، نه با برکلی. شواهد برخی نمونه‌ها (رنگ) محکم و برخی ادعاها (نبودن فضا-زمان) فرضی است.", "en": "The lecturer argues that what we call 'reality' is a user interface that evolution built for survival, like the yellow folder on a desktop that differs from the hardware and binary code underneath. This is close to the modern 'interface theory of perception' (Donald Hoffman), not to Berkeley. Some of his examples (colour) are well founded, while other claims (that space-time does not exist) are speculative.", "nl": "De spreker stelt dat wat we 'werkelijkheid' noemen een door de evolutie gebouwde gebruikersinterface is, zoals een gele map op het bureaublad. Dit staat dicht bij de moderne interfacetheorie van waarneming (Donald Hoffman), niet bij Berkeley."}, "points": [{"text": {"fa": "به گفتهٔ سخنران، «حقیقت» ماهیت اصلی جهان است و «واقعیت» تصویری که ذهن از آن می‌سازد. مثال‌هایش: نوزادی که از کودکی عینک قرمز دارد جهان را قرمز می‌بیند، و رنگ در طبیعت وجود ندارد بلکه نور با طول‌موج‌های گوناگون است که مغز آن را رنگ می‌کند.", "en": "Per the lecturer, 'truth' is the underlying nature of the world and 'reality' is the picture the mind builds of it. His examples: an infant who always wears red glasses would see a red world, and colour does not exist in nature as such, only light of different wavelengths that the brain turns into colour.", "nl": "Per the lecturer, 'truth' is the underlying nature of the world and 'reality' is the picture the mind builds of it. His examples: an infant who always wears red glasses would see a red world, and colour does not exist in nature as such, only light of different wavelengths that the brain turns into colour."}, "sources": ["src:64d205371b"], "flags": ["editor-note"]}, {"text": {"fa": "بخش رنگ در سنت فلسفی و علمی پذیرفته است: فرق «کیفیت‌های اولیه و ثانویه» (لاک) و نقش مغز در ساختن تجربهٔ رنگ. اما ادعای او دربارهٔ «حیوانی که جهان را سیاه‌وسفید می‌بیند» ساده‌شده است؛ بسیاری از پستانداران (مثل سگ) رنگ‌های محدود می‌بینند و تصویر «تک‌رنگ» فقط برای برخی گونه‌هاست.", "en": "The colour point is well accepted in philosophy and science: Locke's primary versus secondary qualities and the brain's role in constructing colour experience. His remark about animals that see 'only black and white' is simplified, though: many mammals such as dogs see a limited range of colours, and true monochromacy is limited to some species.", "nl": "The colour point is well accepted in philosophy and science: Locke's primary versus secondary qualities and the brain's role in constructing colour experience. His remark about animals that see 'only black and white' is simplified, though: many mammals such as dogs see a limited range of colours, and true monochromacy is limited to some species."}, "sources": ["src:cf38963db3"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "سخنران با تشبیه رومیزی کامپیوتر استدلال می‌کند که رابط برای استفاده سودمند است نه برای بازنمایی درست درونِ ماشین؛ تکامل ادراک را چنان شکل داده که بقا و تولیدمثل را ممکن کند، نه اینکه ساختار حقیقی جهان را نشان دهد. این همان ایدهٔ «رابط ادراک» در کار دونالد هافمن است؛ هافمن حتی استدلال می‌کند در مدل‌های نظریهٔ بازی تکاملی، ادراک دقیق معمولاً بر ادراک سودمند برتری ندارد.", "en": "Using the desktop analogy, the lecturer argues that an interface is useful for operating the machine, not for correctly depicting its insides, and that evolution shaped perception for survival and reproduction rather than for showing the true structure of the world. This is the 'interface theory of perception' in the work of Donald Hoffman, who also argues, with evolutionary game-theory models, that accurate perception usually does not beat fitness-tuned perception.", "nl": "Using the desktop analogy, the lecturer argues that an interface is useful for operating the machine, not for correctly depicting its insides, and that evolution shaped perception for survival and reproduction rather than for showing the true structure of the world. This is the 'interface theory of perception' in the work of Donald Hoffman, who also argues, with evolutionary game-theory models, that accurate perception usually does not beat fitness-tuned perception."}, "sources": ["src:2d10bce7b1", "src:06d59ed6d6"], "flags": []}, {"text": {"fa": "تفاوت با برکلی: برکلی ایدئالیست دینی بود و ادراک را آیینهٔ جهانِ پنهان نمی‌دانست؛ تمثیل «رابط/حقیقت پنهان» بیشتر به واقع‌گرایی غیرمستقیم، کانت (پدیدار و شیء فی‌نفسه)، و نظریهٔ ادراک تکاملی هافمن مربوط است. سخنران این دو را در هم گذاشته است.", "en": "Difference from Berkeley: Berkeley was a religious idealist who did not see perception as a mirror of a hidden world; the 'interface/hidden truth' picture belongs more to indirect realism, to Kant (phenomena versus thing-in-itself) and to Hoffman's evolutionary theory of perception. The lecturer merges these.", "nl": "Difference from Berkeley: Berkeley was a religious idealist who did not see perception as a mirror of a hidden world; the 'interface/hidden truth' picture belongs more to indirect realism, to Kant (phenomena versus thing-in-itself) and to Hoffman's evolutionary theory of perception. The lecturer merges these."}, "sources": ["src:64d205371b"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "چند ادعای علمی او ساده یا مناقشه‌برانگیزند: «۹۹ درصد اتم خالی است» تصویر عامه‌پسند ولی گمراه‌کننده‌ای از ابر الکترونی و نیروهای کوانتومی است؛ و اینکه «اگر ثابت شود فضا-زمان وجود ندارد» فقط یک فرض است، چون بعضی نظریه‌های گرانش کوانتومی آن را پدیداری و نه بنیادی می‌دانند، اما اثبات یا اجماعی در کار نیست. نظریهٔ هافمن هم هنوز در جامعهٔ علمی مورد بحث و انتقاد است (برای نمونه از نظر تجربی ثابت‌شده نیست).", "en": "Several of his scientific claims are simplified or contested: 'atoms are 99 percent empty' is a popular but misleading picture of electron clouds and quantum forces; and 'if it is proved that space-time does not exist' is only a hypothesis, since some approaches to quantum gravity treat space-time as emergent rather than fundamental, but there is no proof or consensus. Hoffman's theory itself is still debated and criticised in the scientific community and is not empirically established.", "nl": "Several of his scientific claims are simplified or contested: 'atoms are 99 percent empty' is a popular but misleading picture of electron clouds and quantum forces; and 'if it is proved that space-time does not exist' is only a hypothesis, since some approaches to quantum gravity treat space-time as emergent rather than fundamental, but there is no proof or consensus. Hoffman's theory itself is still debated and criticised in the scientific community and is not empirically established."}, "sources": ["src:2d10bce7b1"], "flags": ["contested", "unreplicated", "editor-note"]}], "links": [{"to": "phil:berkeley-idealism", "rel": "contrasts", "note": {"fa": "برکلی چنین شکاف واقعیت/حقیقت را قبول نداشت", "en": "Berkeley did not accept this reality/truth gap", "nl": "Berkeley did not accept this reality/truth gap"}}, {"to": "phil:cave", "rel": "see-also", "note": {"fa": "تمثیل غار: تصویر در برابر حقیقت", "en": "The cave: image versus truth", "nl": "The cave: image versus truth"}}, {"to": "phil:hard-problem", "rel": "see-also", "note": {"fa": "پرسش از اینکه تجربهٔ ذهنی چگونه با جهان فیزیکی ربط دارد", "en": "How subjective experience relates to the physical world", "nl": "How subjective experience relates to the physical world"}}, {"to": "phil:epistemology", "rel": "part-of", "note": {"fa": "پرسش از اعتبار شناخت حسی", "en": "A question about the reliability of sensory knowledge", "nl": "A question about the reliability of sensory knowledge"}}], "people": ["core:donald-d-hoffman", "core:immanuel-kant"], "sources": ["src:06d59ed6d6", "src:2d10bce7b1", "src:64d205371b", "src:cf38963db3"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:mind", "kind": "field", "title": {"fa": "فلسفهٔ ذهن", "en": "Philosophy of mind", "nl": "Filosofie van de geest"}, "aliases": [], "parent": "phil:phil", "field": null, "summary": {"fa": "آگاهی از کجا می‌آید، اراده آزاد است، و «من» کیست که در طول زمان همان می‌ماند؟", "en": "Where does consciousness come from, is the will free, and who is the \"I\" that stays the same over time?", "nl": "Waar komt bewustzijn vandaan, is de wil vrij, en wie is het \"ik\" dat door de tijd hetzelfde blijft?"}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:stories-memory-lying-fantasy", "kind": "concept", "title": {"fa": "انسان و قصه‌هایش: خاطره، دروغ و رویاپردازی (ماهی بزرگ)", "en": "Humans and their stories: memory, lying and fantasy (Big Fish)", "nl": "De mens en zijn verhalen: herinnering, leugen en fantasie"}, "aliases": [], "parent": "phil:life", "field": "phil:life", "summary": {"fa": "فیلم «ماهی بزرگ» (۲۰۰۳) پدری را نشان می‌دهد که زندگی‌اش را همیشه به شکل قصه‌ای خیالی تعریف می‌کند و پسری که دنبال «واقعیت» است. سخنران از این فیلم برای این پرسش استفاده می‌کند که انسان چرا به خاطره‌هایش قصه اضافه می‌کند و فرق دروغ با رویاپردازی چیست. او می‌گوید ما بیشتر همان بخش‌هایی از زندگی را «زندگی کرده‌ایم» که می‌توانیم روایت کنیم. چند ادعای او فرضیه است و پژوهش تجربی ندارد.", "en": "The film Big Fish (2003) shows a father who always narrates his life as fantasy and a son who wants the plain facts. The lecturer uses it to ask why people add story elements to memories and how lying differs from dreaming. He suggests we have mostly 'lived' what we can narrate. Several of his claims are hypotheses without empirical backing.", "nl": "Big Fish toont een vader die zijn leven altijd als fantasieverhaal vertelt en een zoon die de feiten wil. De spreker vraagt waarom mensen verhalen aan herinneringen toevoegen en hoe liegen verschilt van dromen."}, "points": [{"text": {"fa": "به گفتهٔ سخنران، دروغ تلاشی پنهانی و عمدی برای دستکاری واقعیت است، اما رویاپردازی یا اغراقی که همه می‌فهمند خیالی است، چیزی به زندگی می‌افزاید تا تحمل‌پذیرتر شود. او پدر فیلم را از گروه دوم می‌داند: کسی که زندگی روزمره را برای روایت کم‌جذبه می‌بیند و با قصه آن را غنی می‌کند.", "en": "Per the lecturer, lying is a hidden, deliberate manipulation of facts, whereas dreaming or openly fantastical exaggeration adds something to life to make it bearable. He places the film's father in the second group: someone who finds ordinary life too thin to narrate and enriches it with story.", "nl": "Per the lecturer, lying is a hidden, deliberate manipulation of facts, whereas dreaming or openly fantastical exaggeration adds something to life to make it bearable. He places the film's father in the second group: someone who finds ordinary life too thin to narrate and enriches it with story."}, "sources": ["src:131af1a2fa", "src:3fd83578a4"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، به‌قول مارکز آدم‌ها در واقع فقط آن لحظه‌هایی را زندگی کرده‌اند که به یاد می‌آورند و می‌توانند بازگو کنند. او می‌گوید به همین دلیل سالمندان قصه‌های کمی را بارها تکرار می‌کنند، حسرت‌ها بیشتر دربارهٔ کارهای نکرده‌اند و خاطره‌ها معمولاً عنصر نمایشی اضافه می‌گیرند.", "en": "Per the lecturer, echoing García Márquez, people have really lived only the moments they remember and can retell. He says this is why the old repeat a few stories, why regrets mostly concern things not done, and why memories usually pick up dramatic additions.", "nl": "Per the lecturer, echoing García Márquez, people have really lived only the moments they remember and can retell. He says this is why the old repeat a few stories, why regrets mostly concern things not done, and why memories usually pick up dramatic additions."}, "sources": ["src:131af1a2fa", "src:f8a43e3f04"], "flags": ["editor-note"]}, {"text": {"fa": "نکتهٔ علمی: روان‌شناسی حافظه نشان داده حافظه بازسازی‌کننده است و ناخودآگاه جزئیات تازه می‌افزاید (بارتلت، ۱۹۳۲)، پس بخش «افزوده‌شدن» درست است. اما تکرار قصه‌ها در سالمندان دلایل دیگری هم دارد، از جمله افت حافظه و نیاز به پیوند اجتماعی. جملهٔ «فقط روایت‌شده‌ها زندگی شده‌اند» تعبیر ادبی است نه یافتهٔ علمی.", "en": "Scholarly caveat: memory research shows memory is reconstructive and unconsciously adds details (Bartlett, 1932), so the 'additions' point stands. But repeated stories in old age have other causes too, such as memory decline and the need for social connection. 'Only the narrated is lived' is a literary formulation, not a finding.", "nl": "Scholarly caveat: memory research shows memory is reconstructive and unconsciously adds details (Bartlett, 1932), so the 'additions' point stands. But repeated stories in old age have other causes too, such as memory decline and the need for social connection. 'Only the narrated is lived' is a literary formulation, not a finding."}, "sources": ["src:a9641d1f40"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، در یادداشتی دربارهٔ فیلم می‌نویسد حقیقتی واحد وجود ندارد و روایت‌ها در «جنگ روایت‌ها» با هم رقابت می‌کنند؛ هر روایتی که رقبا را کنار بزند «حقیقت» نام می‌گیرد. او همچنین حدس می‌زند که محرومیت جای خالی واقعیت را با رویا پر می‌کند و مثلاً علاقهٔ مردم مناطق محروم به فوتبال یا قصه‌گویی مردم جنوب ایران از همین‌جاست، اما می‌گوید خودش تحقیق نکرده است.", "en": "Per the lecturer, in an essay on the film he writes that there is no single truth and that narratives compete in a 'war of narratives'; whichever beats its rivals is called truth. He also guesses that deprivation fills gaps in reality with dreams, citing football in poor regions or storytelling in southern Iran, while admitting he has not researched it.", "nl": "Per the lecturer, in an essay on the film he writes that there is no single truth and that narratives compete in a 'war of narratives'; whichever beats its rivals is called truth. He also guesses that deprivation fills gaps in reality with dreams, citing football in poor regions or storytelling in southern Iran, while admitting he has not researched it."}, "sources": ["src:131af1a2fa"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "نکتهٔ علمی: «حقیقتی وجود ندارد» موضع فلسفی بحث‌برانگیزی است و بسیاری از فیلسوفان و دانشمندان می‌گویند روایت‌ها را می‌توان با شواهد سنجید. ربط محرومیت به رویاپردازی یا ویژگی‌های «منطقه‌ای» قصه‌گویی هم هنوز فرضیه‌ای آزمون‌نشده و کلی‌گویی دربارهٔ مردم یک منطقه است.", "en": "Scholarly caveat: 'there is no truth' is a contested philosophical stance, and many philosophers and scientists hold that narratives can be tested against evidence. The link between deprivation and fantasy, or regional traits of storytelling, remains an untested hypothesis and a generalisation about a population.", "nl": "Scholarly caveat: 'there is no truth' is a contested philosophical stance, and many philosophers and scientists hold that narratives can be tested against evidence. The link between deprivation and fantasy, or regional traits of storytelling, remains an untested hypothesis and a generalisation about a population."}, "sources": ["src:131af1a2fa"], "flags": ["contested", "editor-note", "unreplicated"]}], "links": [{"to": "psy:self-narrative", "rel": "see-also", "note": {"fa": "روایت خود در روان‌شناسی", "en": "Self-narrative in psychology", "nl": "Self-narrative in psychology"}}, {"to": "phil:personal-identity", "rel": "see-also", "note": {"fa": "هویت شخصی و حافظه", "en": "Personal identity and memory", "nl": "Personal identity and memory"}}, {"to": "phil:absurd-meaning", "rel": "bridges", "note": {"fa": "معنا دادن به زندگی با قصه", "en": "Making life meaningful through story", "nl": "Making life meaningful through story"}}, {"to": "phil:omniscient-narrator-god-gambling", "rel": "see-also", "note": {"fa": "راوی دانای کل و میل به روایت‌شدن", "en": "The omniscient narrator and the wish to be narrated", "nl": "The omniscient narrator and the wish to be narrated"}}], "people": ["core:gabriel-garc-a-m-rquez"], "sources": ["src:131af1a2fa", "src:3fd83578a4", "src:a9641d1f40", "src:f8a43e3f04"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:phil", "kind": "root", "title": {"fa": "فلسفه", "en": "Philosophy", "nl": "Filosofie"}, "aliases": [], "parent": null, "field": null, "summary": {"fa": "پرسش‌هایی که آزمایش به‌تنهایی جوابشان را نمی‌دهد: چه می‌دانیم، آگاهی چیست، چه باید کرد، علم چگونه پیش می‌رود، جامعهٔ عادلانه چه شکلی است، و زندگی خوب کدام است. این ویکی سنت یونانی، سنت ایرانی‌اسلامی و فلسفهٔ معاصر را کنار هم و در پیوند با روان‌شناسی و جامعه‌شناسی می‌گذارد.", "en": "Questions experiment alone cannot answer: what we know, what consciousness is, what we ought to do, how science progresses, what a just society looks like, and what a good life is. This wiki sets the Greek tradition, the Iranian-Islamic tradition and contemporary philosophy side by side, in connection with psychology and sociology.", "nl": "Vragen die een experiment alleen niet beantwoordt: wat we weten, wat bewustzijn is, wat we behoren te doen, hoe wetenschap vooruitgaat, hoe een rechtvaardige samenleving eruitziet en wat een goed leven is. Deze wiki zet de Griekse traditie, de Iraans-islamitische traditie en de hedendaagse filosofie naast elkaar, in verband met psychologie en sociologie."}, "points": [], "links": [{"to": "psy:philosophy", "rel": "same-as", "note": {"fa": "فلسفه در ویکی روان", "en": "Philosophy in the psychology wiki", "nl": "Philosophy in the psychology wiki"}}, {"to": "atlas:xphi", "rel": "bridges", "note": {"fa": "پل فلسفهٔ تجربی", "en": "The experimental philosophy bridge", "nl": "The experimental philosophy bridge"}}, {"to": "atlas:philsocsci", "rel": "bridges", "note": {"fa": "پل فلسفهٔ علوم اجتماعی", "en": "The philosophy of social science bridge", "nl": "The philosophy of social science bridge"}}], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:hafez-rend-sincerity-vs-display", "kind": "concept", "title": {"fa": "رند در برابر زاهد: صداقت و فروتنی در برابر نمایش فضیلت", "en": "The rend versus the ascetic: sincerity and humility against displayed virtue", "nl": "De rend tegenover de asceet: oprechtheid tegenover vertoonde deugd"}, "aliases": [], "parent": "phil:life", "field": "phil:life", "summary": {"fa": "سخنران رند را در دیوان حافظ بدیلی برای مدعیان فضیلت می‌داند: کسی که چیزی را پنهان نمی‌کند، خود را معیار پاکی نمی‌شمارد و دیگران را داوری اخلاقی نمی‌کند. به گفتهٔ او تقابل رند و زاهد، یا میخانه و مسجد، تقابل ایمان و بی‌ایمانی نیست، بلکه تقابل صداقت و ریاست. این خوانشی ادبی-فلسفی است و با خوانش‌های عرفانی رقابت دارد.", "en": "The lecturer sees the rend in Hafez as the alternative to the claimants of virtue: someone who hides nothing, does not treat himself as the standard of purity and does not pass moral judgement on others. In his view the rend-versus-ascetic (or tavern-versus-mosque) contrast is not faith versus unbelief but sincerity versus hypocrisy. This is a literary-philosophical readin
