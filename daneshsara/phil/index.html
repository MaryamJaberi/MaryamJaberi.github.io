Floating man"], "parent": "phil:iranian", "field": "phil:iranian", "summary": {"fa": "تصور کن ناگهان آفریده شده‌ای، معلق در هوا، چشم بسته، بی‌هیچ حسی از بدن. ابن سینا می‌گوید حتی در این حال از وجود «خود» آگاهی. پس خودآگاهی به بدن و حواس وابسته نیست و نفس چیزی غیر از بدن است. این آزمایش فکری قرن یازدهم هنوز در فلسفهٔ ذهن نقل می‌شود.", "en": "Imagine you were created suddenly, floating in air, eyes closed, with no sensation of your body. Avicenna says that even so you would be aware of your \"self\". Hence self-awareness does not depend on body or senses, and the soul is something other than the body. This eleventh-century thought experiment is still cited in philosophy of mind.", "nl": "Stel je voor dat je plotseling werd geschapen, zwevend in de lucht, ogen dicht, zonder enig lichaamsgevoel. Avicenna zegt dat je ook dan je van je \"zelf\" bewust zou zijn. Dus hangt zelfbewustzijn niet af van lichaam of zintuigen, en is de ziel iets anders dan het lichaam. Dit gedachte-experiment uit de elfde eeuw wordt nog steeds aangehaald in de filosofie van de geest."}, "points": [{"text": {"fa": "مرمورا (۱۹۸۶): استدلال در «شفا» و «اشارات» آمده و بیش از آنکه برهان باشد، «تنبیه» (یادآوری) است: توجه دادن به اینکه آگاهی از خود، پیش از هر ادراکی، همیشه حاضر است. شباهت و تفاوتش با کوگیتوی دکارت موضوع بحثی زنده است.", "en": "Marmura (1986): the argument appears in the \"Shifa\" and the \"Isharat\" and is less a proof than a \"pointer\" (tanbih): drawing attention to the fact that self-awareness, before any perception, is always present. Its likeness to and difference from Descartes' cogito is a live debate.", "nl": "Marmura (1986): the argument appears in the \"Shifa\" and the \"Isharat\" and is less a proof than a \"pointer\" (tanbih): drawing attention to the fact that self-awareness, before any perception, is always present. Its likeness to and difference from Descartes' cogito is a live debate."}, "sources": ["src:fceff29ae7"], "flags": []}, {"text": {"fa": "آدامسون (۲۰۱۶): ابن سینا نظریهٔ نفس ارسطو را با استدلال‌های تازه به سمت جوهر مستقل برد و فلسفهٔ ذهن قرون وسطای لاتین (از جمله توماس آکویناس) را عمیقاً شکل داد.", "en": "Adamson (2016): Avicenna pushed Aristotle's theory of soul toward an independent substance with new arguments and deeply shaped Latin medieval philosophy of mind (including Thomas Aquinas).", "nl": "Adamson (2016): Avicenna pushed Aristotle's theory of soul toward an independent substance with new arguments and deeply shaped Latin medieval philosophy of mind (including Thomas Aquinas)."}, "sources": ["src:67b0ad90cf"], "flags": []}], "links": [{"to": "phil:skepticism-cogito", "rel": "see-also", "note": {"fa": "کوگیتوی دکارت", "en": "Descartes' cogito", "nl": "Descartes' cogito"}}, {"to": "phil:hard-problem", "rel": "see-also", "note": {"fa": "آگاهی و بدن", "en": "Consciousness and body", "nl": "Consciousness and body"}}, {"to": "phil:illumination", "rel": "see-also", "note": {"fa": "علم حضوری سهروردی", "en": "Suhrawardi's knowledge by presence", "nl": "Suhrawardi's knowledge by presence"}}], "people": ["core:avicenna"], "sources": ["src:67b0ad90cf", "src:fceff29ae7"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:soviet-terror-and-marx-link-debate", "kind": "concept", "title": {"fa": "آیا خشونت شوروی از اندیشهٔ مارکس برمی‌خیزد؟", "en": "Does Soviet violence follow from Marx's ideas?", "nl": "Volgt Sovjetgeweld uit de ideeën van Marx?"}, "aliases": [], "parent": "phil:political", "field": "phil:political", "summary": {"fa": "مهمان برنامه استدلال می‌کند ترور استالینی و کشتارهای کامبوج و چین ریشه در خود اندیشهٔ مارکس دارند، نه انحراف از آن. این دیدگاه یک سوی بحثی قدیمی است؛ سوی دیگر، مارکس را از رفتار حکومت‌های بعدی جدا می‌داند.", "en": "The guest argues that Stalinist terror and the killings in Cambodia and China grow from Marx's own thought rather than from a deviation. This is one side of an old debate; the other side separates Marx from later regimes.", "nl": "De gast betoogt dat stalinistische terreur en massamoorden uit Marx' eigen denken voortkomen. Dit is één kant van een oud debat."}, "points": [{"text": {"fa": "به گفتهٔ طهماسبی، سه مضمون در مارکس راه را باز می‌کند: یگانگی کامل فرد با جامعه، انسان بی‌حد و مرز که هرچه بخواهد می‌شود، و آزادی به معنای شکوفایی همهٔ استعدادها نه حق انتخاب. او از «کار برای کار» در نقد مارکس بر سیسموندی هم برای نشان دادن بی‌اعتنایی به رنج فردی یاد می‌کند.", "en": "Per Tahmasebi, three themes in Marx open the door: full unity of individual and society, a limitless human who can become anything, and freedom as unfolding of all talents rather than right of choice. He also cites Marx's remarks on production for its own sake as showing indifference to individual suffering.", "nl": "Per Tahmasebi, three themes in Marx open the door: full unity of individual and society, a limitless human who can become anything, and freedom as unfolding of all talents rather than right of choice. He also cites Marx's remarks on production for its own sake as showing indifference to individual suffering."}, "sources": ["src:d8b9e96f0a"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "به گفتهٔ او «نقد برنامهٔ گوتا» (۱۸۷۵) که دورهٔ گذار و «دیکتاتوری پرولتاریا» را مطرح می‌کند، الگوی ساختاری شوروی شد. او می‌گوید لنین و تروتسکی چون در آثار مارکس راهنمای دیگری نیافتند، به همین متن تکیه کردند و کار اجباری و ملی‌کردن را از آن گرفتند.", "en": "He says the 'Critique of the Gotha Programme' (1875), with its transition period and 'dictatorship of the proletariat', became the template for the Soviet structure. Lacking other guidance in Marx, Lenin and Trotsky leaned on it, taking compulsory labour and nationalisation from it.", "nl": "He says the 'Critique of the Gotha Programme' (1875), with its transition period and 'dictatorship of the proletariat', became the template for the Soviet structure. Lacking other guidance in Marx, Lenin and Trotsky leaned on it, taking compulsory labour and nationalisation from it."}, "sources": ["src:d8b9e96f0a"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "سخنران از ترور سرخ، گروگان‌گیری، تصفیه‌های ۱۹۳۷–۱۹۳۸، گولاگ و قحطی دههٔ ۱۹۳۰ به‌عنوان نمونه‌های بی‌رحمی نظام نام می‌برد و می‌گوید قربانیان تصفیه‌ها حتی وفاداران حزب بودند. این رویدادها در پژوهش تاریخی مستند هستند، هرچند تعداد دقیق قربانیان محل بحث است.", "en": "The speaker cites the Red Terror, hostage-taking, the 1937-38 purges, the Gulag and the 1930s famine as examples of the system's brutality, noting that even loyal party members were victims. These events are well documented; exact victim counts remain debated.", "nl": "The speaker cites the Red Terror, hostage-taking, the 1937-38 purges, the Gulag and the 1930s famine as examples of the system's brutality, noting that even loyal party members were victims. These events are well documented; exact victim counts remain debated."}, "sources": ["src:d8b9e96f0a", "src:d3c4f9ce84"], "flags": ["editor-note"]}, {"text": {"fa": "نقد این دیدگاه: بسیاری از پژوهشگران، از جمله کولاکوفسکی که خودش مارکسیسم را منتقد بود، میان نیروی ایده‌ها و نقش شرایط جنگ، جنگ داخلی، حزب لنینی و تصمیم‌های استالین فرق می‌گذارند. مارکسیست‌های غربی و سوسیال‌دموکرات‌ها مارکس را مدافع آزادی شکوفایی فردی می‌دانند و استالینیسم را انحراف. خواندن «فرد و جامعه یکی می‌شوند» به‌عنوان نفی فرد، خود تفسیری مناقشه‌برانگیز است. خمر سرخ نیز تحت تأثیر عوامل ملی و محلی بود، و رقم «دو پنجم جمعیت» بالاتر از برآوردهای رایج، یعنی حدود یک‌پنجم تا یک‌چهارم، است.", "en": "Counterview: many scholars, including Kolakowski, a critic of Marxism, distinguish the force of ideas from war conditions, civil war, Leninist party structure and Stalin's choices. Western Marxists and social democrats read Marx as defending the free development of individuals and Stalinism as a perversion. Reading 'individual and society become one' as negating the individual is itself contested. The Khmer Rouge also reflected national and local factors, and the 'two-fifths of the population' figure exceeds usual estimates of roughly one fifth to one quarter.", "nl": "Counterview: many scholars, including Kolakowski, a critic of Marxism, distinguish the force of ideas from war conditions, civil war, Leninist party structure and Stalin's choices. Western Marxists and social democrats read Marx as defending the free development of individuals and Stalinism as a perversion. Reading 'individual and society become one' as negating the individual is itself contested. The Khmer Rouge also reflected national and local factors, and the 'two-fifths of the population' figure exceeds usual estimates of roughly one fifth to one quarter."}, "sources": ["src:bead6f9c63", "src:5ce193c41f"], "flags": ["contested", "editor-note"]}], "links": [{"to": "soc:marx-historical-materialism", "rel": "see-also", "note": {"fa": "ماتریالیسم تاریخی مارکس", "en": "Marx's historical materialism", "nl": "Marx's historical materialism"}}, {"to": "soc:marxism-revisions-and-limits", "rel": "contrasts", "note": {"fa": "اصلاح مارکسیسم", "en": "Revising Marxism", "nl": "Revising Marxism"}}, {"to": "phil:two-liberties", "rel": "bridges", "note": {"fa": "دو مفهوم آزادی", "en": "Two concepts of liberty", "nl": "Two concepts of liberty"}}, {"to": "soc:teleology-paradise-hegel-marx", "rel": "see-also", "note": {"fa": "غایت تاریخ نزد هگل و مارکس", "en": "History's end-goal in Hegel and Marx", "nl": "History's end-goal in Hegel and Marx"}}], "people": ["core:karl-marx", "core:leszek-kolakowski", "core:eduard-bernstein"], "sources": ["src:5ce193c41f", "src:bead6f9c63", "src:d3c4f9ce84", "src:d8b9e96f0a"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:knobe-effect", "kind": "concept", "title": {"fa": "فلسفهٔ تجربی و اثر نوب", "en": "Experimental philosophy and the Knobe effect", "nl": "Experimentele filosofie en het Knobe-effect"}, "aliases": [], "parent": "phil:epistemology", "field": "phil:epistemology", "summary": {"fa": "مدیری برنامه‌ای را تصویب می‌کند که سود دارد و «اتفاقاً» به محیط زیست آسیب می‌زند؛ اکثریت می‌گویند عمداً آسیب زد. همان داستان با «اتفاقاً» به محیط زیست کمک می‌کند؛ اکثریت می‌گویند عمداً کمک نکرد. داوری اخلاقی ما مفهوم «قصد» را عوض می‌کند. فلسفهٔ تجربی به جای تکیه بر شهود فیلسوف در اتاقش، شهود مردم را می‌سنجد.", "en": "A chairman approves a programme that makes profit and \"incidentally\" harms the environment; most say he harmed it intentionally. Same story but it incidentally helps the environment; most say he did not help intentionally. Our moral judgement changes the concept of \"intention\". Experimental philosophy measures people's intuitions instead of relying on the philosopher's intuition in his armchair.", "nl": "Een bestuursvoorzitter keurt een programma goed dat winst maakt en \"toevallig\" het milieu schaadt; de meesten zeggen dat hij het opzettelijk schaadde. Hetzelfde verhaal maar het helpt toevallig het milieu; de meesten zeggen dat hij niet opzettelijk hielp. Ons morele oordeel verandert het begrip \"opzet\". Experimentele filosofie meet de intuïties van mensen in plaats van te vertrouwen op de intuïtie van de filosoof in zijn leunstoel."}, "points": [{"text": {"fa": "نوب (۲۰۰۳): ۸۲ درصد در سناریوی آسیب گفتند «عمدی» و فقط ۲۳ درصد در سناریوی کمک؛ یافته‌ای که ده‌ها بار و در فرهنگ‌های مختلف تکرار شده و نشان می‌دهد مفاهیم «توصیفی» ما از ارزش‌داوری جدا نیستند.", "en": "Knobe (2003): 82 percent in the harm scenario said \"intentionally\", only 23 percent in the help scenario; a finding replicated dozens of times across cultures, showing our \"descriptive\" concepts are not separate from evaluation.", "nl": "Knobe (2003): 82 percent in the harm scenario said \"intentionally\", only 23 percent in the help scenario; a finding replicated dozens of times across cultures, showing our \"descriptive\" concepts are not separate from evaluation."}, "sources": ["src:0fb6d8f626"], "flags": []}, {"text": {"fa": "فلسفهٔ تجربی (x-phi) از ۲۰۰۰ به بعد روش‌های روان‌شناسی را به پرسش‌های فلسفی آورد: آیا شهود دربارهٔ دانش، ارادهٔ آزاد یا هویت در فرهنگ‌های مختلف فرق می‌کند؟ پاسخ: کمتر از آنچه اول گمان می‌رفت، ولی نه هیچ.", "en": "Experimental philosophy (x-phi) from 2000 on brought psychology's methods to philosophical questions: do intuitions about knowledge, free will or identity differ across cultures? Answer: less than first thought, but not nil.", "nl": "Experimental philosophy (x-phi) from 2000 on brought psychology's methods to philosophical questions: do intuitions about knowledge, free will or identity differ across cultures? Answer: less than first thought, but not nil."}, "sources": ["src:0fb6d8f626"], "flags": []}], "links": [{"to": "atlas:xphi", "rel": "part-of", "note": {"fa": "پل فلسفهٔ تجربی", "en": "The experimental philosophy bridge", "nl": "The experimental philosophy bridge"}}, {"to": "phil:trolley", "rel": "see-also", "note": {"fa": "شهودهای اخلاقی", "en": "Moral intuitions", "nl": "Moral intuitions"}}, {"to": "psy:cognitive-biases", "rel": "bridges", "note": {"fa": "سوگیری‌های شناختی", "en": "Cognitive biases", "nl": "Cognitive biases"}}], "people": ["core:joshua-knobe"], "sources": ["src:0fb6d8f626"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:three-theories", "kind": "concept", "title": {"fa": "سه نظریهٔ بزرگ اخلاق", "en": "The three great moral theories", "nl": "De drie grote morele theorieën"}, "aliases": [], "parent": "phil:ethics", "field": "phil:ethics", "summary": {"fa": "پیامدگرایی (میل): کار درست آن است که بیشترین خیر را برای بیشترین افراد بیاورد. وظیفه‌گرایی (کانت): طوری عمل کن که بتوانی بخواهی قاعده‌ات قانون همگانی شود، و انسان را هرگز صرفاً وسیله قرار نده. اخلاق فضیلت (ارسطو): بپرس آدم خوب در این موقعیت چه می‌کرد. هر سه در جایی شکست می‌خورند و همین است که بحث زنده مانده.", "en": "Consequentialism (Mill): the right act brings the greatest good to the greatest number. Deontology (Kant): act so you could will your maxim to be universal law, and never treat a person merely as a means. Virtue ethics (Aristotle): ask what a good person would do here. Each fails somewhere, which is why the debate lives.", "nl": "Consequentialisme (Mill): de juiste daad brengt het grootste goed voor de meesten. Plichtethiek (Kant): handel zo dat je kunt willen dat je maxime een algemene wet wordt, en behandel een mens nooit louter als middel. Deugdethiek (Aristoteles): vraag wat een goed mens hier zou doen. Elk faalt ergens, en daarom leeft het debat."}, "points": [{"text": {"fa": "میل (۱۸۶۱): فایده را با کیفیت لذت‌ها می‌سنجد («سقراط ناراضی بهتر از خوک راضی»)؛ ایراد کلاسیک: اگر قربانی کردن یک بی‌گناه خوشبختی کل را بیشتر کند، پیامدگرایی ساده آن را تجویز می‌کند.", "en": "Mill (1861): weighs utility by the quality of pleasures (\"better Socrates dissatisfied than a pig satisfied\"); the classic objection: if sacrificing an innocent raises total happiness, simple consequentialism prescribes it.", "nl": "Mill (1861): weighs utility by the quality of pleasures (\"better Socrates dissatisfied than a pig satisfied\"); the classic objection: if sacrificing an innocent raises total happiness, simple consequentialism prescribes it."}, "sources": ["src:b73de9ad07"], "flags": []}, {"text": {"fa": "کانت (۱۷۸۵): ارزش اخلاقی در نیت و از روی وظیفه عمل کردن است، نه نتیجه؛ ایراد کلاسیک: دروغ نگفتن حتی به قاتلی که سراغ دوستت را می‌گیرد.", "en": "Kant (1785): moral worth lies in the will and acting from duty, not in outcomes; the classic objection: not lying even to the murderer asking where your friend is.", "nl": "Kant (1785): moral worth lies in the will and acting from duty, not in outcomes; the classic objection: not lying even to the murderer asking where your friend is."}, "sources": ["src:d6e60b5165"], "flags": []}, {"text": {"fa": "ارسطو: فضیلت حد وسط میان دو رذیلت است (شجاعت میان ترسویی و بی‌باکی) و با عادت و تمرین به دست می‌آید؛ ایراد: برای تصمیم‌های تازه راهنمای روشنی نمی‌دهد. روان‌شناسی مثبت و «نقاط قوت شخصیت» از این سنت می‌آیند.", "en": "Aristotle: virtue is the mean between two vices (courage between cowardice and recklessness) and is acquired by habit and practice; objection: it gives little clear guidance for novel decisions. Positive psychology and \"character strengths\" come from this tradition.", "nl": "Aristotle: virtue is the mean between two vices (courage between cowardice and recklessness) and is acquired by habit and practice; objection: it gives little clear guidance for novel decisions. Positive psychology and \"character strengths\" come from this tradition."}, "sources": ["src:ca301d84b7"], "flags": []}, {"text": {"fa": "سینگر (۱۹۷۲): اگر می‌توانی جلوی بدی بزرگی را بگیری بی‌آنکه چیزی با اهمیت اخلاقی مشابه را از دست بدهی، باید بگیری؛ کودکی که در برکه غرق می‌شود با کودکی در قاره‌ای دیگر فرقی ندارد. استدلالی که جنبش «نوع‌دوستی مؤثر» را ساخت.", "en": "Singer (1972): if you can prevent something very bad without sacrificing anything of comparable moral importance, you ought to; a child drowning in a pond is no different from a child on another continent. The argument that built the \"effective altruism\" movement.", "nl": "Singer (1972): if you can prevent something very bad without sacrificing anything of comparable moral importance, you ought to; a child drowning in a pond is no different from a child on another continent. The argument that built the \"effective altruism\" movement."}, "sources": ["src:b8f9ac2eac"], "flags": ["contested"]}], "links": [{"to": "phil:trolley", "rel": "applies-to", "note": {"fa": "آزمون نظریه‌ها با معماها", "en": "Testing the theories with dilemmas", "nl": "Testing the theories with dilemmas"}}, {"to": "psy:p-positive", "rel": "bridges", "note": {"fa": "روان‌شناسی مثبت و فضیلت", "en": "Positive psychology and virtue", "nl": "Positive psychology and virtue"}}, {"to": "phil:moral-luck", "rel": "critiques", "note": {"fa": "بخت اخلاقی هر سه را به چالش می‌کشد", "en": "Moral luck challenges all three", "nl": "Moral luck challenges all three"}}], "people": ["core:john-stuart-mill", "core:kant", "core:aristotle"], "sources": ["src:b73de9ad07", "src:b8f9ac2eac", "src:ca301d84b7", "src:d6e60b5165"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:nietzsche-wagner-forster-antisemitism", "kind": "concept", "title": {"fa": "نیچه، واگنر، فورستر و یهودستیزی", "en": "Nietzsche, Wagner, Förster and antisemitism", "nl": "Nietzsche, Wagner, Förster en antisemitisme"}, "aliases": [], "parent": "phil:life", "field": "phil:life", "summary": {"fa": "نیچه ابتدا دوست و هوادار واگنر بود و بعد با او گسست؛ خواهرش الیزابت به حلقهٔ واگنر نزدیک شد و با برنهارد فورستر، فعال یهودستیز، ازدواج کرد. نیچه فورستر و یهودستیزان آلمانی را آشکارا نکوهش می‌کرد. اما دیدگاه او دربارهٔ یهودیت یک‌دست دوستانه نبود و روایت سخنران در چند نکته ساده یا نادرست است.", "en": "Nietzsche was first Wagner's friend and champion, then broke with him; his sister Elisabeth moved into Wagner's circle and married Bernhard Förster, an antisemitic activist. Nietzsche openly condemned Förster and German antisemites. His view of Judaism, however, was not uniformly friendly, and the lecturer's account is simplified or wrong on several points.", "nl": "Nietzsche was eerst Wagners vriend en pleitbezorger en brak later met hem; zijn zus Elisabeth kwam in Wagners kring terecht en trouwde met de antisemitische activist Bernhard Förster. Nietzsche veroordeelde Förster en Duitse antisemieten openlijk, maar zijn kijk op het jodendom was niet eenduidig vriendelijk."}, "points": [{"text": {"fa": "به گفتهٔ سخنران، نیچه در افتتاح بایرویت (۱۸۷۶) از پروژهٔ واگنر کنار کشید چون واگنر رنگ دینی و ملی‌گرایی افراطی و یهودستیزی گرفت؛ الیزابت عاشق این حلقه بود و با فورستر ازدواج کرد و کلنی «آریایی» در پاراگوئه ساخت، و نیچه از هر دو بیزار بود.", "en": "Per the lecturer, Nietzsche withdrew from Wagner's project at the 1876 Bayreuth opening because Wagner turned religious, extremely nationalist and antisemitic; Elisabeth loved this circle, married Förster and built an 'Aryan' colony in Paraguay, and Nietzsche despised both.", "nl": "Per the lecturer, Nietzsche withdrew from Wagner's project at the 1876 Bayreuth opening because Wagner turned religious, extremely nationalist and antisemitic; Elisabeth loved this circle, married Förster and built an 'Aryan' colony in Paraguay, and Nietzsche despised both."}, "sources": ["src:873416a5d1"], "flags": ["editor-note"]}, {"text": {"fa": "دقیق‌تر: نیچه از ۱۸۶۸ با واگنر دوست شد و بارها نزد او رفت. او در افتتاح ۱۸۷۶ حاضر شد ولی زود رفت. گسست تدریجی بود و در «انسانی، زیاده انسانی» (۱۸۷۸) و بعدها «مورد واگنر» (۱۸۸۸) آشکار شد؛ «پارسیفال» (۱۸۸۲) با نمادهای مسیحی او را ناامید کرد. دلایل او هنری و فلسفی بود و فقط به یهودستیزی خلاصه نمی‌شود. یهودستیزی واگنر هم تازه نبود: مقالهٔ «یهودیت در موسیقی» به ۱۸۵۰ برمی‌گردد.", "en": "More precisely: Nietzsche befriended Wagner from 1868 and visited him often. He attended the 1876 opening but left early. The break was gradual and became public in Human, All Too Human (1878) and later The Case of Wagner (1888); Parsifal (1882), with its Christian symbolism, disappointed him. His reasons were artistic and philosophical and not reducible to antisemitism. Wagner's antisemitism was not new either: his essay 'Judaism in Music' dates from 1850.", "nl": "More precisely: Nietzsche befriended Wagner from 1868 and visited him often. He attended the 1876 opening but left early. The break was gradual and became public in Human, All Too Human (1878) and later The Case of Wagner (1888); Parsifal (1882), with its Christian symbolism, disappointed him. His reasons were artistic and philosophical and not reducible to antisemitism. Wagner's antisemitism was not new either: his essay 'Judaism in Music' dates from 1850."}, "sources": ["src:afae93d162", "src:de6dc25901"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "برنهارد فورستر فعال یهودستیز بود و ۱۸۸۵ با الیزابت ازدواج کرد؛ نیچه در مراسم نبود و در نامه‌ای در پایان ۱۸۸۷ پیوند خواهرش با او را به‌تندی نکوهید. کلنی «نوئوا ژرمانیا» ۱۸۸۷ در پاراگوئه بنیاد شد. فورستر ژوئن ۱۸۸۹ مرد و روایت رایج، خودکشی با سم است؛ گفتهٔ سخنران که خود را «دار زد» با این روایت جور درنمی‌آید. الیزابت در ۱۸۹۳ به آلمان برگشت.", "en": "Bernhard Förster was an antisemitic activist who married Elisabeth in 1885; Nietzsche stayed away from the wedding and in a letter of late 1887 sharply condemned her association with him. The colony 'Nueva Germania' was founded in Paraguay in 1887. Förster died in June 1889, commonly reported as suicide by poison; the lecturer's statement that he hanged himself does not match that account. Elisabeth returned to Germany in 1893.", "nl": "Bernhard Förster was an antisemitic activist who married Elisabeth in 1885; Nietzsche stayed away from the wedding and in a letter of late 1887 sharply condemned her association with him. The colony 'Nueva Germania' was founded in Paraguay in 1887. Förster died in June 1889, commonly reported as suicide by poison; the lecturer's statement that he hanged himself does not match that account. Elisabeth returned to Germany in 1893."}, "sources": ["src:b7c909410d", "src:4c1bd28e95"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "نیچه بارها یهودستیزان آلمانی را ریشخند کرد و آن را به کینه و رشک نسبت داد (نامه‌ها، «فراسوی نیک و بد» بند ۲۵۱، «تبارشناسی» بخش سوم). با این حال در متن‌هایش دربارهٔ «کاهنان یهودی» و منشأ «اخلاق بردگان» جملات تند هم هست، پس موضعش پیچیده و دوپهلوست و نمی‌توان او را ساده «دوست‌دار یهودیان» خواند. این‌که او نوشته باشد «روح آلمان بدون یهودیت ناقص است» با همین عبارت تأیید نشد.", "en": "Nietzsche repeatedly ridiculed German antisemites and ascribed antisemitism to resentment and envy (letters, Beyond Good and Evil 251, Genealogy III). Yet his texts also contain harsh passages about 'Jewish priests' and the origin of 'slave morality', so his position is complex and ambivalent and cannot simply be called philosemitic. The claim that he wrote 'the German spirit is incomplete without Judaism' could not be verified in that wording.", "nl": "Nietzsche repeatedly ridiculed German antisemites and ascribed antisemitism to resentment and envy (letters, Beyond Good and Evil 251, Genealogy III). Yet his texts also contain harsh passages about 'Jewish priests' and the origin of 'slave morality', so his position is complex and ambivalent and cannot simply be called philosemitic. The claim that he wrote 'the German spirit is incomplete without Judaism' could not be verified in that wording."}, "sources": ["src:3368519066", "src:afae93d162"], "flags": ["contested", "editor-note"]}], "links": [{"to": "phil:nietzsche-collapse-and-estate", "rel": "see-also", "note": {"fa": "فروپاشی نیچه و میراث او", "en": "Nietzsche's collapse and legacy", "nl": "Nietzsche's collapse and legacy"}}, {"to": "phil:will-to-power-compilation", "rel": "see-also", "note": {"fa": "«ارادهٔ معطوف به قدرت»", "en": "The Will to Power", "nl": "The Will to Power"}}, {"to": "phil:nietzsche-god-is-dead-nihilism", "rel": "see-also", "note": {"fa": "نیچه و مرگ خدا", "en": "Nietzsche and the death of God", "nl": "Nietzsche and the death of God"}}], "people": ["core:richard-wagner", "core:bernhard-f-rster", "core:elisabeth-f-rster-nietzsche", "core:friedrich-nietzsche"], "sources": ["src:3368519066", "src:4c1bd28e95", "src:873416a5d1", "src:afae93d162", "src:b7c909410d", "src:de6dc25901"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:skepticism-cogito", "kind": "concept", "title": {"fa": "شک دکارتی و «می‌اندیشم»", "en": "Cartesian doubt and the cogito", "nl": "Cartesiaanse twijfel en het cogito"}, "aliases": [], "parent": "phil:epistemology", "field": "phil:epistemology", "summary": {"fa": "دکارت برای یافتن چیزی تردیدناپذیر در همه‌چیز شک کرد: حواس، ریاضی، حتی وجود جهان (شاید شیطانی فریبم می‌دهد). یک چیز ماند: اینکه شک می‌کنم. از این‌جا دوگانگی ذهن و بدن زاده شد که فلسفهٔ ذهن هنوز با آن درگیر است.", "en": "To find something indubitable Descartes doubted everything: the senses, mathematics, even the world's existence (perhaps a demon deceives me). One thing remained: that I doubt. From here mind–body dualism was born, with which philosophy of mind still wrestles.", "nl": "Om iets onbetwijfelbaars te vinden betwijfelde Descartes alles: de zintuigen, de wiskunde, zelfs het bestaan van de wereld (misschien bedriegt een demon mij). Eén ding bleef: dat ik twijfel. Hieruit werd het lichaam-geestdualisme geboren, waarmee de filosofie van de geest nog worstelt."}, "points": [{"text": {"fa": "دکارت (۱۶۴۱): «می‌اندیشم، پس هستم» نه یک استدلال، که یک شهود است: هر بار که به آن فکر کنم، صادق است. از همین نقطه می‌خواست خدا، جهان و علم را دوباره بسازد؛ منتقدان گفتند از «اندیشه‌ای هست» به «منی هست» پریده است.", "en": "Descartes (1641): \"I think, therefore I am\" is not an argument but an intuition: each time I think it, it is true. From this point he wanted to rebuild God, world and science; critics said he jumped from \"there is thinking\" to \"there is an I\".", "nl": "Descartes (1641): \"I think, therefore I am\" is not an argument but an intuition: each time I think it, it is true. From this point he wanted to rebuild God, world and science; critics said he jumped from \"there is thinking\" to \"there is an I\"."}, "sources": ["src:cf48c80531"], "flags": []}, {"text": {"fa": "هیوم (۱۷۴۸): شک معتدل‌تر و ماندگارتر: علیت را هرگز مشاهده نمی‌کنیم، فقط توالی را؛ استقرا (فردا هم خورشید طلوع می‌کند) هیچ توجیه عقلی ندارد و فقط «عادت» است. علم روی این شکاف بنا شده و پوپر پاسخش را با ابطال‌پذیری داد.", "en": "Hume (1748): a milder, more lasting scepticism: we never observe causation, only succession; induction (the sun will rise tomorrow) has no rational justification and is mere \"custom\". Science is built over this gap, and Popper answered it with falsifiability.", "nl": "Hume (1748): a milder, more lasting scepticism: we never observe causation, only succession; induction (the sun will rise tomorrow) has no rational justification and is mere \"custom\". Science is built over this gap, and Popper answered it with falsifiability."}, "sources": ["src:25045a0b50"], "flags": []}, {"text": {"fa": "شش قرن پیش از دکارت، ابن سینا با «انسان معلق» استدلال مشابهی کرده بود: ببینید مدخل انسان معلق.", "en": "Six centuries before Descartes, Avicenna had made a similar argument with the \"floating man\": see that entry.", "nl": "Six centuries before Descartes, Avicenna had made a similar argument with the \"floating man\": see that entry."}, "sources": ["src:fceff29ae7"], "flags": []}], "links": [{"to": "phil:flying-man", "rel": "see-also", "note": {"fa": "پیشینهٔ ایرانی", "en": "The Iranian precedent", "nl": "The Iranian precedent"}}, {"to": "phil:falsification", "rel": "see-also", "note": {"fa": "پاسخ پوپر به مسئلهٔ استقرا", "en": "Popper's answer to the problem of induction", "nl": "Popper's answer to the problem of induction"}}, {"to": "phil:hard-problem", "rel": "explains", "note": {"fa": "ریشهٔ دوگانگی ذهن و بدن", "en": "The root of mind–body dualism", "nl": "The root of mind–body dualism"}}], "people": ["core:descartes", "core:david-hume", "core:avicenna"], "sources": ["src:25045a0b50", "src:cf48c80531", "src:fceff29ae7"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:personal-identity", "kind": "concept", "title": {"fa": "هویت شخصی: من کیستم که همان می‌مانم؟", "en": "Personal identity", "nl": "Persoonlijke identiteit"}, "aliases": [], "parent": "phil:mind", "field": "phil:mind", "summary": {"fa": "هر سلول بدن عوض می‌شود، خاطرات محو می‌شوند، شخصیت تغییر می‌کند؛ چه چیزی «من» بیست‌ساله را با من شصت‌ساله یکی می‌کند؟ پارفیت با آزمایش‌های فکری (دورنوردی، تقسیم مغز) نتیجه گرفت هویت آن چیزی نیست که مهم است؛ پیوستگی روانی است، و درجه‌پذیر.", "en": "Every cell is replaced, memories fade, character changes; what makes the twenty-year-old \"me\" the same as the sixty-year-old? Parfit, with thought experiments (teleportation, brain splitting), concluded identity is not what matters; psychological continuity is, and it comes in degrees.", "nl": "Elke cel wordt vervangen, herinneringen vervagen, karakter verandert; wat maakt de twintigjarige \"ik\" dezelfde als de zestigjarige? Parfit concludeerde met gedachte-experimenten (teleportatie, hersensplitsing) dat identiteit niet is wat ertoe doet; psychologische continuïteit wel, en die kent gradaties."}, "points": [{"text": {"fa": "پارفیت (۱۹۸۴): اگر هر نیم‌کرهٔ مغز من به بدنی دیگر پیوند زده شود، کدام یک «من» است؟ هیچ پاسخی بهتر از دیگری نیست؛ پس پرسش هویت پاسخ تعین‌یافته ندارد و باید جایش را به پرسش «چقدر پیوستگی» بدهد.", "en": "Parfit (1984): if each hemisphere of my brain were transplanted into another body, which is \"me\"? No answer is better than another; so the identity question has no determinate answer and should give way to \"how much continuity\".", "nl": "Parfit (1984): if each hemisphere of my brain were transplanted into another body, which is \"me\"? No answer is better than another; so the identity question has no determinate answer and should give way to \"how much continuity\"."}, "sources": ["src:3adcfbbaf4"], "flags": []}, {"text": {"fa": "پیامد اخلاقی که پارفیت می‌گیرد: مرز میان من و دیگران کم‌رنگ‌تر از آن است که فکر می‌کنیم؛ خودِ آینده‌ام کمی شبیه یک «دیگری» است، و این هم خودخواهی را سست می‌کند هم ترس از مرگ را.", "en": "The ethical consequence Parfit draws: the boundary between me and others is thinner than we think; my future self is a little like \"someone else\", which loosens both selfishness and the fear of death.", "nl": "The ethical consequence Parfit draws: the boundary between me and others is thinner than we think; my future self is a little like \"someone else\", which loosens both selfishness and the fear of death."}, "sources": ["src:3adcfbbaf4"], "flags": []}], "links": [{"to": "psy:delay-gratification", "rel": "bridges", "note": {"fa": "خودِ آینده و تعویق لذت", "en": "The future self and delayed gratification", "nl": "The future self and delayed gratification"}}, {"to": "phil:substantial-motion", "rel": "see-also", "note": {"fa": "حرکت جوهری: نفسی که دائم می‌شود", "en": "Substantial motion: a self in constant becoming", "nl": "Substantial motion: a self in constant becoming"}}, {"to": "psy:depersonalization", "rel": "bridges", "note": {"fa": "مسخ شخصیت", "en": "Depersonalization", "nl": "Depersonalization"}}], "people": ["core:derek-parfit"], "sources": ["src:3adcfbbaf4"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:epistemic-fields-package", "kind": "concept", "title": {"fa": "میدان‌های معرفتی به‌مثابهٔ بسته: نمی‌شود گزینشی برداشت", "en": "Epistemic fields as packages: you cannot cherry-pick", "nl": "Kennisvelden als pakket: niet te cherry-picken"}, "aliases": [], "parent": "phil:epistemology", "field": "phil:epistemology", "summary": {"fa": "سخنران می‌گوید ایده‌ها و میدان‌های معرفتی مثل بازار میوه نیستند که هر بخش را جدا برداریم؛ هر مجموعهٔ فکری اجزای به‌هم‌بافته دارد و پذیرفتن یک بخش یعنی بقیه هم همراه می‌آید. او این را دربارهٔ ایدئولوژی‌ها و دربارهٔ امر مدرن و فناوری هم می‌گوید. این دیدگاه بصیرتی دربارهٔ پیامدهای پنهان باورها دارد، اما به صورت مطلق قابل بحث است.", "en": "The lecturer says ideas and epistemic fields are not like a fruit market where you pick parts at will: a body of thought has interwoven parts, and accepting one part brings the rest. He applies this to ideologies and to modernity and technology. The view captures hidden consequences of beliefs, but stated in absolute form it is debatable.", "nl": "De docent stelt dat ideeën en kennisvelden een pakket vormen: wie één onderdeel aanneemt, krijgt de rest erbij. Dit is een stelling van de spreker en niet onomstreden."}, "points": [{"text": {"fa": "به گفتهٔ سخنران، انسان‌ها اغلب نمی‌دانند در کدام میدان معرفتی زندگی می‌کنند و این میدان‌ها پنهانی بر باورها و داوری‌هایشان فرمان می‌رانند. چنین میدان‌هایی آدم را از «به پرسش گرفتن» معاف می‌کنند، چون درون آن‌ها قرار گرفتن چیزی است که معافیت را می‌سازد.", "en": "Per the lecturer, people often do not know which epistemic field they live in, and such fields quietly steer their beliefs and judgments. Such fields exempt a person from questioning, because being inside them is what produces the exemption.", "nl": "Per the lecturer, people often do not know which epistemic field they live in, and such fields quietly steer their beliefs and judgments. Such fields exempt a person from questioning, because being inside them is what produces the exemption."}, "sources": ["src:e5f1685e69"], "flags": ["editor-note"]}, {"text": {"fa": "استعارهٔ اصلی: ایده‌ها «بسته» هستند، نه میوه‌های جدا. او می‌گوید نمی‌شود بخشی را که خوشایند یا آرامش‌بخش است برداشت و بخش دیگر را کنار گذاشت؛ همهٔ اجزا مثل نخی نامرئی به هم وصل‌اند و باید بقیه را هم «به خانه برد». این را به عنوان یک ادعای هستی‌شناختی دربارهٔ ایده‌ها مطرح می‌کند.", "en": "His main metaphor: ideas come as a package, not as separate fruit. You cannot take the pleasant or comforting part and leave the rest; the parts are tied by an invisible thread, and you must carry the rest home too. He presents this as an ontological claim about ideas.", "nl": "His main metaphor: ideas come as a package, not as separate fruit. You cannot take the pleasant or comforting part and leave the rest; the parts are tied by an invisible thread, and you must carry the rest home too. He presents this as an ontological claim about ideas."}, "sources": ["src:e5f1685e69"], "flags": ["editor-note"]}, {"text": {"fa": "سخنران همین منطق را دربارهٔ امر مدرن و فناوری می‌آورد: نمی‌شود خودرو را خواست و تصادف را نخواست، یا گوشی را خواست و شبکه‌های اجتماعی را رد کرد. می‌گوید از دید او این خبر بدی نیست، چون ما را به آگاهی از هزینه‌ها می‌رساند.", "en": "He applies the same logic to modernity and technology: you cannot want the car and refuse road accidents, or want the phone and reject social networks. He says this is not bad news in his view, since it brings us to awareness of costs.", "nl": "He applies the same logic to modernity and technology: you cannot want the car and refuse road accidents, or want the phone and reject social networks. He says this is not bad news in his view, since it brings us to awareness of costs."}, "sources": ["src:e5f1685e69"], "flags": ["editor-note"]}, {"text": {"fa": "ملاحظهٔ منتقدان: این ادعا در شکل مطلقش بیش از حد قوی است. در عمل جوامع و افراد عناصر یک چارچوب را جدا کرده و بازترکیب می‌کنند (مثلاً پذیرش یک فناوری با قوانین تنظیم‌گر یا با ارزش‌های بومی)، و پژوهش‌های فلسفهٔ فناوری و جامعه‌شناسی علم نشان می‌دهند فناوری‌ها اغلب شکل‌پذیر و قابل بازطراحی‌اند. با این حال بخش معتبر ادعا این است که انتخاب‌ها اغلب پیامدهای همراه دارند و باید آن‌ها را سنجید.", "en": "Critics' point: stated absolutely, the claim is too strong. In practice societies and individuals detach and recombine elements of a framework (adopting a technology under regulation or with local values), and work in the philosophy of technology and the sociology of science shows that technologies are often malleable and redesignable. The valid core is that choices often carry side-effects that should be weighed.", "nl": "Critics' point: stated absolutely, the claim is too strong. In practice societies and individuals detach and recombine elements of a framework (adopting a technology under regulation or with local values), and work in the philosophy of technology and the sociology of science shows that technologies are often malleable and redesignable. The valid core is that choices often carry side-effects that should be weighed."}, "sources": ["src:ae5905aa3c"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "سخنران می‌گوید ایده‌های آرامش‌بخش و انتزاعی اگر روزی به قدرت برسند ممکن است جهانی بسازند که خود حاملانشان از آن می‌گریزند. این را با مثال کلی پناهندگان از رژیم‌های ایدئولوژیک نشان می‌دهد و ادعا می‌کند مصاحبهٔ کیفی نشان می‌دهد این گریزندگان هنوز بخشی از همان ایده‌ها را در سر دارند. این ادعای تجربی را او بدون ارجاع به پژوهش خاصی می‌گوید و در این مدخل تأیید نشده است.", "en": "The lecturer says comforting, abstract ideas may, if they reach power, build a world their own carriers flee from. He illustrates with refugees from ideological regimes and claims that qualitative interviews would show they still carry some of the same ideas. He gives no specific study for this empirical claim, and it is not verified here.", "nl": "The lecturer says comforting, abstract ideas may, if they reach power, build a world their own carriers flee from. He illustrates with refugees from ideological regimes and claims that qualitative interviews would show they still carry some of the same ideas. He gives no specific study for this empirical claim, and it is not verified here."}, "sources": ["src:e5f1685e69"], "flags": ["contested", "editor-note"]}], "links": [{"to": "soc:epistemic-distance", "rel": "see-also", "note": {"fa": "دربارهٔ اینکه چرا از درون یک میدان دشوار است آن را از بیرون دید.", "en": "On why it is hard to see a field from within it.", "nl": "On why it is hard to see a field from within it."}}, {"to": "phil:paradigms", "rel": "see-also", "note": {"fa": "پارادایم‌ها هم مجموعه‌هایی به‌هم‌بافته از باور و روش‌اند.", "en": "Paradigms are likewise interwoven sets of belief and method.", "nl": "Paradigms are likewise interwoven sets of belief and method."}}, {"to": "phil:epistemology", "rel": "part-of", "note": {"fa": "بخشی از بحث معرفت‌شناسی دربارهٔ چارچوب‌های باور.", "en": "Part of the epistemology of belief frameworks.", "nl": "Part of the epistemology of belief frameworks."}}], "people": [], "sources": ["src:ae5905aa3c", "src:e5f1685e69"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:fallacy-appeals-to-feeling-and-force", "kind": "concept", "title": {"fa": "ترفندهای فشار و احساس: تهدید، تطمیع، ترحم، آرزواندیشی و عوام‌فریبی", "en": "Appeals to feeling and force: threat, bribe, pity, wishful thinking, demagoguery", "nl": "Beroep op gevoel en dwang: dreiging, omkoping, medelijden, wishful thinking, demagogie"}, "aliases": [], "parent": "phil:epistemology", "field": "phil:epistemology", "summary": {"fa": "در این بخش از گفتار، سخنران ترفندهایی را برمی‌شمارد که به‌جای دلیل بر ترس، طمع، دلسوزی یا هیجان جمعی تکیه می‌کنند. مشترک همه این است که چیزی دربارهٔ درستی ادعا نمی‌گویند و فقط تمایل شنونده به پذیرفتن را دستکاری می‌کنند. او برای آن‌ها در سیاست و زندگی روزمره مثال می‌آورد.", "en": "Here the lecturer lists tricks that rely on fear, greed, pity or crowd emotion instead of reasons. What they share is that they say nothing about whether the claim is true; they only manipulate the listener's willingness to accept it. He gives examples from politics and everyday life.", "nl": "Hier noemt de spreker trucs die op angst, hebzucht, medelijden of groepsemotie steunen in plaats van op argumenten. Ze zeggen niets over de waarheid van de bewering, maar sturen de bereidheid van de luisteraar."}, "points": [{"text": {"fa": "توسل به احساسات: شخص برای قانع کردن، احساس مخاطب را برمی‌انگیزد (مثلاً نشان دادن تصاویر کودکان جنگ‌زده) و دلیل نمی‌آورد که چرا باید همهٔ مردم یک کشور همان سیاست را دنبال کنند.", "en": "Appeal to emotion: stirring feelings (e.g. images of suffering children) instead of explaining why a given policy should follow.", "nl": "Appeal to emotion: stirring feelings (e.g. images of suffering children) instead of explaining why a given policy should follow."}, "sources": ["src:a81ae2997d"], "flags": []}, {"text": {"fa": "تهدید: «سبزی‌ات را بخور وگرنه بازی نمی‌روی». به‌جای آنکه بگویند سبزی چه فایده‌ای دارد، مجازات را دلیل می‌کنند. تطمیع: «به پروژهٔ من رأی بدهید، پاداش می‌گیرید»؛ سودآوری یا شدنی بودن پروژه نشان داده نمی‌شود.", "en": "Threat and bribe: punishment or reward is offered instead of showing why the claim or project is sound.", "nl": "Threat and bribe: punishment or reward is offered instead of showing why the claim or project is sound."}, "sources": ["src:a81ae2997d"], "flags": []}, {"text": {"fa": "توسل به ترحم: متهم می‌گوید زن و بچه دارد و اگر زندانی شود بی‌سرپرست می‌مانند؛ این ممکن است دلیل ملاحظه باشد، اما دربارهٔ بی‌گناهی یا گناه او چیزی نمی‌گوید.", "en": "Appeal to pity: the defendant points to his dependants; this may call for compassion but says nothing about guilt or innocence.", "nl": "Appeal to pity: the defendant points to his dependants; this may call for compassion but says nothing about guilt or innocence."}, "sources": ["src:a81ae2997d"], "flags": []}, {"text": {"fa": "آرزواندیشی: آنچه دلخواه است جای واقعیت گذاشته می‌شود؛ سخنران پیش‌بینی ناموفق یک مقام دربارهٔ «زمستان سخت اروپا» را مثال می‌زند.", "en": "Wishful thinking: what one wishes is taken as what is; the lecturer cites a failed official prediction about a 'hard European winter'.", "nl": "Wishful thinking: what one wishes is taken as what is; the lecturer cites a failed official prediction about a 'hard European winter'."}, "sources": ["src:a81ae2997d"], "flags": []}, {"text": {"fa": "عوام‌فریبی: برانگیختن هیجان جمعی و بهره‌گیری از فضای جامعه برای متقاعد کردن، که او تبلیغات نازی علیه یهودیان را نمونهٔ فاجعه‌بار آن می‌داند.", "en": "Demagoguery: exploiting collective emotion and the mood of a society; the lecturer points to Nazi propaganda against Jews as a catastrophic case.", "nl": "Demagoguery: exploiting collective emotion and the mood of a society; the lecturer points to Nazi propaganda against Jews as a catastrophic case."}, "sources": ["src:a81ae2997d"], "flags": []}, {"text": {"fa": "به گفتهٔ سخنران، باور به آخرت هم نوعی آرزواندیشی است، چون آدم زندگی ابدی و عدالت کامل می‌خواهد و جهانی تصور می‌کند که این‌ها را دارد. این دیدگاه شخصی اوست و جزو مدعای مورد اجماع نیست.", "en": "Per the lecturer, belief in an afterlife is itself wishful thinking. This is his personal view, not a consensus claim.", "nl": "Per the lecturer, belief in an afterlife is itself wishful thinking. This is his personal view, not a consensus claim."}, "sources": ["src:a81ae2997d"], "flags": ["editor-note", "contested"]}, {"text": {"fa": "نکتهٔ مقابل: منشأ روانی یک باور (دلخواه بودنش) به‌تنهایی نادرستی آن را ثابت نمی‌کند؛ این خودش «مغالطهٔ منشأ» است. فیلسوفان دین و منتقدانشان دربارهٔ آخرت استدلال‌های جداگانه‌ای دارند که باید به‌طور مستقل سنجید.", "en": "Counterpoint: the psychological origin of a belief (that it is wished for) does not by itself show it false (the genetic fallacy). Arguments for and against an afterlife must be judged on their own merits.", "nl": "Counterpoint: the psychological origin of a belief (that it is wished for) does not by itself show it false (the genetic fallacy). Arguments for and against an afterlife must be judged on their own merits."}, "sources": ["src:a81ae2997d"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "جملهٔ منسوب به هیتلر دربارهٔ «دروغ بزرگ» که سخنران نقل می‌کند، در واقع در «نبرد من» (۱۹۲۵) آمده و او آن را به یهودیان نسبت می‌داد؛ مورخان دیگر آن را توصیف روش تبلیغات نازی‌ها دانسته‌اند. سخنران نسخهٔ ساده‌شده‌ای از آن را آورده است.", "en": "The 'big lie' idea the lecturer attributes to Hitler comes from Mein Kampf (1925), where Hitler ascribed it to Jews; historians use it to describe Nazi propaganda technique. The lecturer gives a simplified version.", "nl": "The 'big lie' idea the lecturer attributes to Hitler comes from Mein Kampf (1925), where Hitler ascribed it to Jews; historians use it to describe Nazi propaganda technique. The lecturer gives a simplified version."}, "sources": ["src:a81ae2997d"], "flags": ["contested", "editor-note"]}], "links": [{"to": "phil:fallacies", "rel": "part-of", "note": {"fa": "از خانوادهٔ مغالطه‌ها", "en": "Part of the family of fallacies", "nl": "Part of the family of fallacies"}}, {"to": "phil:fallacy-dodging-burden-of-proof", "rel": "see-also", "note": {"fa": "ترفندهای طفره از دلیل", "en": "Dodging the burden of proof", "nl": "Dodging the burden of proof"}}, {"to": "phil:fallacy-language-and-false-authority", "rel": "see-also", "note": {"fa": "ترفندهای زبانی و مرجع کاذب", "en": "Language tricks and false authority", "nl": "Language tricks and false authority"}}, {"to": "phil:epistemology", "rel": "part-of", "note": {"fa": "معرفت‌شناسی", "en": "Epistemology", "nl": "Epistemology"}}], "people": [], "sources": ["src:a81ae2997d"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:falsification", "kind": "concept", "title": {"fa": "ابطال‌پذیری", "en": "Falsifiability", "nl": "Falsifieerbaarheid"}, "aliases": [], "parent": "phil:science", "field": "phil:science", "summary": {"fa": "پوپر: علم با اثبات پیش نمی‌رود، با رد شدن. نظریه‌ای علمی است که بگوید چه مشاهده‌ای آن را غلط می‌کند؛ نظریه‌ای که همه‌چیز را توضیح می‌دهد (طالع‌بینی، و به گفتهٔ پوپر روان‌کاوی و مارکسیسم) چیزی نمی‌گوید. معیاری قدرتمند که خودش هم ایرادهای جدی دارد.", "en": "Popper: science advances not by proof but by refutation. A theory is scientific if it says what observation would make it false; a theory that explains everything (astrology, and in Popper's view psychoanalysis and Marxism) says nothing. A powerful criterion that itself has serious problems.", "nl": "Popper: wetenschap gaat vooruit niet door bewijs maar door weerlegging. Een theorie is wetenschappelijk als ze zegt welke waarneming haar onwaar zou maken; een theorie die alles verklaart (astrologie, en volgens Popper psychoanalyse en marxisme) zegt niets. Een krachtig criterium dat zelf ook ernstige problemen kent."}, "points": [{"text": {"fa": "پوپر (۱۹۳۴/۱۹۵۹): هزار قوی سفید «همهٔ قوها سفیدند» را اثبات نمی‌کند، یک قوی سیاه آن را رد می‌کند؛ پس پاسخ هیوم به استقرا این است که علم اصلاً استقرایی نیست: حدس‌های جسورانه و تلاش برای ابطالشان.", "en": "Popper (1934/1959): a thousand white swans do not prove \"all swans are white\", one black swan refutes it; so the answer to Hume on induction is that science is not inductive at all: bold conjectures and attempts to refute them.", "nl": "Popper (1934/1959): a thousand white swans do not prove \"all swans are white\", one black swan refutes it; so the answer to Hume on induction is that science is not inductive at all: bold conjectures and attempts to refute them."}, "sources": ["src:78f5fd2e09"], "flags": []}, {"text": {"fa": "کواین (۱۹۵۱) و تز دوئم: هیچ فرضیه‌ای تنها آزمایش نمی‌شود؛ همیشه با فرض‌های کمکی (ابزار، شرایط) همراه است، پس یک مشاهدهٔ ناقض می‌گوید «جایی اشتباه است» نه «کجا». دانشمندان در عمل نظریهٔ خوب را با یک ناهنجاری رها نمی‌کنند، و حق دارند.", "en": "Quine (1951) and the Duhem thesis: no hypothesis is tested alone; it always comes with auxiliary assumptions (instruments, conditions), so a refuting observation says \"something is wrong\" not \"where\". In practice scientists do not drop a good theory over one anomaly, and rightly so.", "nl": "Quine (1951) and the Duhem thesis: no hypothesis is tested alone; it always comes with auxiliary assumptions (instruments, conditions), so a refuting observation says \"something is wrong\" not \"where\". In practice scientists do not drop a good theory over one anomaly, and rightly so."}, "sources": ["src:3215a4a8ec"], "flags": []}, {"text": {"fa": "کاربرد امروزی: پیش‌ثبت فرضیه‌ها در پاسخ به بحران تکرارپذیری، در واقع ابطال‌پذیری را دوباره الزامی می‌کند: پیش از دیدن داده بگو چه نتیجه‌ای فرضیه‌ات را رد می‌کند.", "en": "Current use: preregistration of hypotheses in response to the replication crisis effectively makes falsifiability obligatory again: before seeing the data, say what result would refute your hypothesis.", "nl": "Current use: preregistration of hypotheses in response to the replication crisis effectively makes falsifiability obligatory again: before seeing the data, say what result would refute your hypothesis."}, "sources": ["src:78f5fd2e09"], "flags": []}], "links": [{"to": "psy:phil-science", "rel": "same-as", "note": {"fa": "فلسفهٔ علم در ویکی روان", "en": "Philosophy of science in the psychology wiki", "nl": "Philosophy of science in the psychology wiki"}}, {"to": "psy:replication-crisis", "rel": "bridges", "note": {"fa": "بحران تکرارپذیری", "en": "The replication crisis", "nl": "The replication crisis"}}, {"to": "phil:paradigms", "rel": "contrasts", "note": {"fa": "کوهن: علم عادی ابطال نمی‌کند", "en": "Kuhn: normal science does not refute", "nl": "Kuhn: normal science does not refute"}}], "people": ["core:karl-popper", "core:w-v-o-quine"], "sources": ["src:3215a4a8ec", "src:78f5fd2e09"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:political", "kind": "field", "title": {"fa": "فلسفهٔ سیاسی", "en": "Political philosophy", "nl": "Politieke filosofie"}, "aliases": [], "parent": "phil:phil", "field": null, "summary": {"fa": "عدالت، آزادی، قابلیت و شر: جامعهٔ خوب را با چه معیاری بسنجیم؟", "en": "Justice, liberty, capability and evil: by what standard do we judge a good society?", "nl": "Rechtvaardigheid, vrijheid, vermogen en kwaad: aan welke maatstaf meten we een goede samenleving?"}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:fixed-vs-malleable-human-nature-left", "kind": "concept", "title": {"fa": "سرشت ثابت یا دگرگون‌شدنی انسان و چپ داروینی", "en": "Fixed or malleable human nature, and the Darwinian left", "nl": "Vaste of vormbare menselijke natuur en het darwinistische links"}, "aliases": [], "parent": "phil:political", "field": "phil:political", "summary": {"fa": "سخنران می‌گوید مرز اصلی چپ و راست این است که آیا انسان سرشتی ثابت و سودجو دارد یا سرشتش با روابط تولید عوض می‌شود. او با تکیه بر کتاب پیتر سینگر استدلال می‌کند چپ با پذیرش سرشت ثابت فرو می‌ریزد و دین را «افیون» دانستن راه‌میان‌بر ذهنی است. اغلب شارحان مارکس این تصویر را ساده‌شده می‌دانند.", "en": "The lecturer says the key dividing line is whether humans have a fixed, self-interested nature or one shaped by production relations. Citing Peter Singer's book, he argues the left collapses if it accepts a fixed nature, and that calling religion an 'opium' is a mental shortcut. Most Marx scholars find this picture simplified.", "nl": "De spreker stelt dat het verschil draait om een vaste of vormbare menselijke natuur; veel Marx-onderzoekers vinden zijn voorstelling te simpel."}, "points": [{"text": {"fa": "به گفتهٔ سخنران، نظام بازار بر انسانی با سرشت ثابت و منفعت‌جو (به گفتهٔ او «داروینی») بنا شده، اما مارکس سرشت انسان را وابسته به روابط تولید می‌داند و اگر این را کنار بگذاریم کل «سرمایه» و «ایدئولوژی آلمانی» بی‌معنا می‌شود. او می‌گوید چپ جدید باید نتیجه را بپذیرد و کلاً کنار برود.", "en": "Per the lecturer, market systems assume a fixed, self-interested ('Darwinian') human nature, while Marx makes human nature depend on production relations; drop that and Capital and The German Ideology fall apart. He says the new left should accept the consequence and step aside.", "nl": "Per the lecturer, market systems assume a fixed, self-interested ('Darwinian') human nature, while Marx makes human nature depend on production relations; drop that and Capital and The German Ideology fall apart. He says the new left should accept the consequence and step aside."}, "sources": ["src:d825bcc909"], "flags": ["editor-note"]}, {"text": {"fa": "نکتهٔ مخالف: خود مارکس سرشت انسان را کاملاً بی‌ثبات نمی‌دانست. در «تزهایی دربارهٔ فویرباخ» سرشت انسان را مجموع روابط اجتماعی می‌خواند، اما در جاهای دیگر از «سرشت نوعی» و نیازهای بنیادین (کار، خلاقیت) حرف می‌زند. نورمن گراس استدلال کرد که تصور «مارکس منکر سرشت انسانی» یک افسانه است. یعنی استدلال سخنران که با پذیرش سرشت ثابت مارکسیسم «پودر می‌شود» محل بحث جدی است.", "en": "Counter-view: Marx himself did not treat human nature as wholly unstable. In the Theses on Feuerbach he calls the human essence the ensemble of social relations, yet elsewhere he speaks of a species-being and basic needs (work, creativity). Norman Geras argued that 'Marx denied human nature' is a legend. So the lecturer's claim that accepting a fixed nature 'pulverises' Marxism is seriously disputed.", "nl": "Counter-view: Marx himself did not treat human nature as wholly unstable. In the Theses on Feuerbach he calls the human essence the ensemble of social relations, yet elsewhere he speaks of a species-being and basic needs (work, creativity). Norman Geras argued that 'Marx denied human nature' is a legend. So the lecturer's claim that accepting a fixed nature 'pulverises' Marxism is seriously disputed."}, "sources": ["src:22dddbbafe", "src:98c465baee"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "پیتر سینگر در «چپ داروینی» (۱۹۹۹) استدلال می‌کند چپ باید یافته‌های تکامل را بپذیرد، از جمله اینکه آدمیان هم خودخواه‌اند و هم همکار و دگرخواه، و با این حال می‌شود به برابری و کمک به ضعیفان متعهد ماند. یعنی نتیجه‌ای که سخنران می‌گیرد (چپ باید بریزد) نتیجهٔ خود سینگر نیست.", "en": "In A Darwinian Left (1999) Peter Singer argues the left should accept findings from evolution, including that humans are both selfish and cooperative or altruistic, and can still stay committed to equality and helping the weak. So the lecturer's conclusion (the left should quit) is not Singer's own.", "nl": "In A Darwinian Left (1999) Peter Singer argues the left should accept findings from evolution, including that humans are both selfish and cooperative or altruistic, and can still stay committed to equality and helping the weak. So the lecturer's conclusion (the left should quit) is not Singer's own."}, "sources": ["src:d37da4be6e"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، «دین افیون توده‌هاست» به جوان چپ اجازه می‌دهد از مطالعهٔ جدی دین فرار کند، در حالی که فهم دین سال‌ها کار می‌خواهد. نکتهٔ مخالف: جمله در متن مارکس (۱۸۴۳–۴۴) بخشی از عبارتی است که دین را هم «آه موجود ستمدیده» و هم تسلی می‌خواند، نه صرفاً یک تحقیر. بسیاری از چپ‌ها (مثل وبر در جامعه‌شناسی، یا الهیات رهایی‌بخش) به دین جدی پرداخته‌اند. نقد او به آموزش سطحی منصفانه است، ولی تعمیمش به همهٔ چپ نه.", "en": "Per the lecturer, 'religion is the opium of the people' lets young leftists skip serious study of religion, which takes years. Counter-view: in Marx's text (1843–44) the phrase sits within a sentence that also calls religion the sigh of the oppressed creature, not mere contempt. Many on the left took religion seriously (liberation theology, and Weber as a sociologist). His complaint about shallow teaching is fair, but generalising it to the whole left is not.", "nl": "Per the lecturer, 'religion is the opium of the people' lets young leftists skip serious study of religion, which takes years. Counter-view: in Marx's text (1843–44) the phrase sits within a sentence that also calls religion the sigh of the oppressed creature, not mere contempt. Many on the left took religion seriously (liberation theology, and Weber as a sociologist). His complaint about shallow teaching is fair, but generalising it to the whole left is not."}, "sources": ["src:d825bcc909", "src:913c088179"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، ثروت و مصرف‌گرایی در فرهنگ ایرانی انگ می‌خورد و این تأثیر ادبیات چپ و عرفانِ دنیاگریز است؛ مصرف انبوه کالا را ارزان می‌کند. بخش اقتصادی (صرفه‌جویی ناشی از مقیاس) درست است، اما نقد مصرف‌گرایی فقط ریشه چپ ندارد: مکتب فرانکفورت و نقدهای محیط‌زیستی و روان‌شناختی (مثل پیامدهای تبلیغات) هم آن را مطرح کرده‌اند. دلیل فرهنگی او یک تفسیر شخصی است.", "en": "Per the lecturer, wealth and consumerism are stigmatised in Iranian culture because of left literature and world-renouncing mysticism, while mass consumption makes goods cheaper. The economies-of-scale part is right, but criticism of consumerism has more than left roots: the Frankfurt School and environmental and psychological critiques raise it too. His cultural explanation is a personal interpretation.", "nl": "Per the lecturer, wealth and consumerism are stigmatised in Iranian culture because of left literature and world-renouncing mysticism, while mass consumption makes goods cheaper. The economies-of-scale part is right, but criticism of consumerism has more than left roots: the Frankfurt School and environmental and psychological critiques raise it too. His cultural explanation is a personal interpretation."}, "sources": ["src:d825bcc909"], "flags": ["contested", "editor-note"]}], "links": [{"to": "soc:marx-bakunin-human-nature", "rel": "see-also", "note": {"fa": "سرشت انسان: مارکس و باکونین", "en": "Human nature: Marx and Bakunin", "nl": "Human nature: Marx and Bakunin"}}, {"to": "soc:marx-religion-alienation", "rel": "see-also", "note": {"fa": "مارکس و دین", "en": "Marx on religion", "nl": "Marx on religion"}}, {"to": "tabar:nature-of-nurture", "rel": "bridges", "note": {"fa": "طبیعت و تربیت", "en": "Nature and nurture", "nl": "Nature and nurture"}}, {"to": "soc:religion-ideology-iran-debate", "rel": "see-also", "note": {"fa": "دین و ایدئولوژی در بحث ایران", "en": "Religion and ideology in the Iran debate", "nl": "Religion and ideology in the Iran debate"}}], "people": ["core:peter-singer", "core:norman-geras", "core:karl-marx"], "sources": ["src:22dddbbafe", "src:913c088179", "src:98c465baee", "src:d37da4be6e", "src:d825bcc909"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:conservatism-as-evolving-tradition", "kind": "concept", "title": {"fa": "محافظه‌کاری یعنی نگهداری سنتِ در حال تحول (دیدگاه غنی‌نژاد)", "en": "Conservatism as the keeping of an evolving tradition (Ghani-Nejad's view)", "nl": "Conservatisme als behoud van een zich ontwikkelende traditie"}, "aliases": [], "parent": "phil:political", "field": "phil:political", "summary": {"fa": "غنی‌نژاد محافظه‌کاری را ارتجاع نمی‌داند و آن را حفظ سنت و عرفی می‌داند که خودش تغییر می‌کند. به گفتهٔ او سنتِ منجمد به زوال می‌انجامد و مشروطه ادامهٔ سنت بود، نه گسست از آن. او برای این نگاه از سید جواد طباطبایی هم نام می‌برد. دیگر دیدگاه‌ها محافظه‌کاری را وابسته به قدرت یا ضد اصلاح می‌دانند.", "en": "Ghani-Nejad rejects the equation of conservatism with reaction; for him it means preserving a tradition and custom that itself keeps evolving. A frozen tradition decays, and the Constitutional movement was a continuation of tradition, not a break. Critics see conservatism as defending power or blocking reform.", "nl": "Ghani-Nejad ziet conservatisme als behoud van een traditie die zelf verandert, niet als reactie."}, "points": [{"text": {"fa": "به گفتهٔ غنی‌نژاد، محافظه‌کاری یعنی نگه‌داشتن سنت‌هایی که خود در حال دگرگونی‌اند. او عرف را همین بخش زندهٔ سنت می‌داند و می‌گوید حتی مراجع دینی می‌گویند مسلمان باید با عرف زمانه سازگار شود.", "en": "Per Ghani-Nejad, conservatism means keeping traditions that are themselves in motion; he treats custom (urf) as this living part of tradition and notes that even religious authorities say Muslims should adapt to the custom of their time.", "nl": "Per Ghani-Nejad, conservatism means keeping traditions that are themselves in motion; he treats custom (urf) as this living part of tradition and notes that even religious authorities say Muslims should adapt to the custom of their time."}, "sources": ["src:dff68962be"], "flags": ["editor-note"]}, {"text": {"fa": "او حجاب را نمونهٔ عرف می‌گیرد: رفتاری که در یک دوره عادی بود در دورهٔ دیگر عادی نیست، و به باور او اجبار قانونی جلوی تغییر طبیعی عرف می‌ایستد. این استدلال دربارهٔ یک مسئلهٔ سیاسی داغ است و موافقان و مخالفان جدی دارد؛ مدافعان پوشش اجباری آن را حکم دینی می‌دانند، نه صرفاً عرف.", "en": "He uses the headscarf as an example of custom: conduct that was normal in one era is not in another, and in his view legal compulsion fights the natural drift of custom. This is a hot political issue; defenders of mandatory dress call it a religious ruling, not mere custom.", "nl": "He uses the headscarf as an example of custom: conduct that was normal in one era is not in another, and in his view legal compulsion fights the natural drift of custom. This is a hot political issue; defenders of mandatory dress call it a religious ruling, not mere custom."}, "sources": ["src:dff68962be"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "او از سید جواد طباطبایی نقل می‌کند که سنتِ منجمد مایهٔ زوال اندیشه است و مشروطه ادامهٔ سنت بود و برای همین نخبگان، حتی دینی، آن را پذیرفتند. دیگران، از جمله بسیاری از روشن‌فکران دینی و مورخان، مشروطه را بیشتر پدیده‌ای با الهام از اروپا یا حاصل کشاکش گروه‌های گوناگون می‌دانند و علمای مشروطه‌خواه و مشروعه‌خواه را در برابر هم می‌بینند.", "en": "He cites Javad Tabatabai: a frozen tradition causes intellectual decline, and the Constitutional movement was a continuation of tradition, which is why even religious elites accepted it. Many other scholars see it as strongly shaped by European ideas and by conflict between rival camps, including constitutionalist and anti-constitutionalist clerics.", "nl": "He cites Javad Tabatabai: a frozen tradition causes intellectual decline, and the Constitutional movement was a continuation of tradition, which is why even religious elites accepted it. Many other scholars see it as strongly shaped by European ideas and by conflict between rival camps, including constitutionalist and anti-constitutionalist clerics."}, "sources": ["src:44eed7320d"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "پشتوانهٔ نظری این نگاه در اندیشهٔ ادموند برک و مایکل اوکشات است که تغییر تدریجی را بر طرح‌های کلانِ انقلابی ترجیح می‌دادند. اما هایک، که غنی‌نژاد از او الهام می‌گیرد، خودش در نوشته‌ای معروف گفته است که لیبرال محافظه‌کار نیست، چون محافظه‌کاری راهی برای تغییر نشان نمی‌دهد. پس هم‌ردیف کردن لیبرالیسم و محافظه‌کاری کاملاً بی‌اختلاف نیست.", "en": "The theoretical backing is Edmund Burke and Michael Oakeshott, who preferred gradual change to grand revolutionary schemes. Yet Hayek, an inspiration for Ghani-Nejad, famously wrote that he was not a conservative because conservatism offers no direction for change, so merging liberalism and conservatism is not uncontroversial.", "nl": "The theoretical backing is Edmund Burke and Michael Oakeshott, who preferred gradual change to grand revolutionary schemes. Yet Hayek, an inspiration for Ghani-Nejad, famously wrote that he was not a conservative because conservatism offers no direction for change, so merging liberalism and conservatism is not uncontroversial."}, "sources": ["src:19546601e0", "src:4030b18d69", "src:31b70b2e41"], "flags": ["contested", "editor-note"]}], "links": [{"to": "soc:shadow-institutions", "rel": "see-also", "note": {"fa": "نهادهای سایه و تغییر آرام نهادها", "en": "Shadow institutions and slow change", "nl": "Shadow institutions and slow change"}}, {"to": "soc:parsons-social-system", "rel": "contrasts", "note": {"fa": "نقد «محافظه‌کاری» در نظریهٔ پارسونز", "en": "The 'conservatism' charge against Parsons", "nl": "The 'conservatism' charge against Parsons"}}, {"to": "phil:two-liberties", "rel": "see-also", "note": {"fa": "دو مفهوم آزادی", "en": "Two concepts of liberty", "nl": "Two concepts of liberty"}}], "people": ["core:javad-tabatabai", "core:edmund-burke", "core:michael-oakeshott", "core:friedrich-hayek"], "sources": ["src:19546601e0", "src:31b70b2e41", "src:4030b18d69", "src:44eed7320d", "src:dff68962be"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:james-will-to-believe", "kind": "concept", "title": {"fa": "جیمز: بحران جوانی، اراده آزاد و «اراده به باور»", "en": "James: the youthful crisis, free will and 'the will to believe'", "nl": "James: jeugdcrisis, vrije wil en 'de wil om te geloven'"}, "aliases": [], "parent": "phil:epistemology", "field": "phil:epistemology", "summary": {"fa": "سخنران می‌گوید جیمز در جوانی از این اندیشه که جهان ماشین است و اختیار توهم، دچار بحران شد و تصمیم گرفت پرسد «اگر به اراده آزاد باور داشته باشم زندگی‌ام چه می‌شود؟». این تصویر با زندگی‌نامهٔ جیمز هماهنگ است. اما اینکه از آن نتیجه بگیریم باور به اختیار «درست است چون مفید است»، مناقشه‌برانگیز است و جیمز خودش با شرط‌های دقیق‌تری از آن دفاع می‌کرد.", "en": "The lecturer says James was caught in a youthful crisis over the thought that the world is a machine and freedom an illusion, and decided to ask 'how would my life change if I believed in free will?'. This matches James's biography. But concluding that belief in free will is 'true because it is useful' is contested, and James defended it with more careful conditions.", "nl": "De spreker vertelt dat James als jongeman een crisis doormaakte over determinisme en besloot te vragen wat geloof in vrije wil zijn leven zou veranderen. Dat het geloof 'waar is omdat het nuttig is', is omstreden."}, "points": [{"text": {"fa": "به گفتهٔ سخنران، جیمز (متولد ۱۸۴۲ نیویورک) پس از آنکه میان نقاشی، زیست‌شناسی، پزشکی و روان‌شناسی گشت، در جوانی دچار افسردگی و بحران وجودی شد و جهان را ماشینی بی‌اختیار دید؛ بحران را با تغییر پرسش از «آیا اختیار ثابت می‌شود؟» به «باور به اختیار چه می‌کند؟» پشت سر گذاشت.", "en": "Per the lecturer, James (born in New York in 1842), after moving between painting, biology, medicine and psychology, fell into depression and an existential crisis as a young man and saw the world as a machine without freedom; he overcame it by shifting the question from 'can freedom be proved?' to 'what does believing in freedom do?'.", "nl": "Per the lecturer, James (born in New York in 1842), after moving between painting, biology, medicine and psychology, fell into depression and an existential crisis as a young man and saw the world as a machine without freedom; he overcame it by shifting the question from 'can freedom be proved?' to 'what does believing in freedom do?'."}, "sources": ["src:64d205371b"], "flags": ["editor-note"]}, {"text": {"fa": "این روایت با تاریخ شناخته‌شدهٔ زندگی جیمز سازگار است: بحران سال‌های ۱۸۷۰ و تصمیم او به اینکه نخستین عمل ارادی‌اش باور به اراده آزاد باشد. سخنران جزئیات دقیق خاطرات را نیاورده و برخی عبارت‌ها در متن خودکار مبهم است.", "en": "This account is consistent with the known history of James's life: the crisis around 1870 and his resolve that his first act of free will would be to believe in free will. The lecturer gives no precise details from James's own writings and some phrases are unclear in the transcript.", "nl": "This account is consistent with the known history of James's life: the crisis around 1870 and his resolve that his first act of free will would be to believe in free will. The lecturer gives no precise details from James's own writings and some phrases are unclear in the transcript."}, "sources": ["src:2bfc96aee8"], "flags": []}, {"text": {"fa": "جیمز در مقالهٔ «اراده به باور» (۱۸۹۶) استدلال می‌کند که در برخی انتخاب‌های واقعی، حیاتی و اجتناب‌ناپذیر که شواهد برای تصمیم کافی نیست، حق داریم بر پایهٔ نیازهای عاطفی‌مان باور را برگزینیم. این چارچوب محدود است و با ادعای «هر باور مفیدی درست است» یکی نیست.", "en": "In 'The Will to Believe' (1896) James argues that in some genuine, momentous and unavoidable choices where the evidence cannot settle the matter, we are entitled to choose a belief on the basis of our emotional needs. This framework is narrow and is not the same as the claim that any useful belief is true.", "nl": "In 'The Will to Believe' (1896) James argues that in some genuine, momentous and unavoidable choices where the evidence cannot settle the matter, we are entitled to choose a belief on the basis of our emotional needs. This framework is narrow and is not the same as the claim that any useful belief is true."}, "sources": ["src:11f7237798"], "flags": []}, {"text": {"fa": "مخالفت اصلی: ویلیام کینگدون کلیفورد در «اخلاق باور» (۱۸۷۷) می‌گفت باور بدون شواهد کافی همیشه و برای همه نادرست (از نظر اخلاقی) است. همچنین بحث اراده آزاد را نمی‌توان با مفید بودن باور حل کرد: اینکه باور به اختیار دلگرم‌کننده باشد به ما نمی‌گوید جبرگرایی یا سازگارگرایی نادرست است.", "en": "The main opposing view: William Kingdon Clifford in 'The Ethics of Belief' (1877) held that believing without sufficient evidence is always and for everyone wrong (morally). Also, the free-will debate cannot be settled by the usefulness of a belief: that believing in freedom is encouraging does not show that determinism or compatibilism is false.", "nl": "The main opposing view: William Kingdon Clifford in 'The Ethics of Belief' (1877) held that believing without sufficient evidence is always and for everyone wrong (morally). Also, the free-will debate cannot be settled by the usefulness of a belief: that believing in freedom is encouraging does not show that determinism or compatibilism is false."}, "sources": ["src:be42d2b5eb"], "flags": ["contested", "editor-note"]}], "links": [{"to": "phil:free-will", "rel": "see-also", "note": {"fa": "بحث عمومی جبر و اختیار", "en": "The wider debate on determinism and free will", "nl": "The wider debate on determinism and free will"}}, {"to": "phil:james-pragmatic-truth", "rel": "part-of", "note": {"fa": "کاربرد نظریهٔ صدق پراگماتیستی", "en": "An application of the pragmatic theory of truth", "nl": "An application of the pragmatic theory of truth"}}, {"to": "phil:epistemology", "rel": "part-of", "note": {"fa": "اخلاق باور و حدود توجیه", "en": "The ethics of belief and the limits of justification", "nl": "The ethics of belief and the limits of justification"}}], "people": ["core:william-james", "core:william-kingdon-clifford"], "sources": ["src:11f7237798", "src:2bfc96aee8", "src:64d205371b", "src:be42d2b5eb"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:stoicism", "kind": "concept", "title": {"fa": "رواقی‌گری: آنچه در اختیار ماست", "en": "Stoicism: what is up to us", "nl": "Stoïcisme: wat in onze macht ligt"}, "aliases": [], "parent": "phil:life", "field": "phil:life", "summary": {"fa": "اپیکتتوس: بعضی چیزها در اختیار ماست (داوری‌ها، خواسته‌ها، کنش‌ها) و بعضی نه (بدن، شهرت، دیگران). رنج از این می‌آید که دومی را بخواهیم کنترل کنیم. «آدم‌ها را نه چیزها، که داوری‌شان دربارهٔ چیزها آزار می‌دهد»؛ جمله‌ای که درمان شناختی‌رفتاری مستقیماً از آن زاده شد.", "en": "Epictetus: some things are up to us (judgements, desires, actions) and some are not (body, reputation, others). Suffering comes from trying to control the latter. \"People are disturbed not by things but by their judgements about things\"; a sentence from which cognitive-behavioural therapy directly descends.", "nl": "Epictetus: sommige dingen liggen in onze macht (oordelen, verlangens, handelingen) en sommige niet (lichaam, reputatie, anderen). Lijden komt van het willen beheersen van het tweede. \"Mensen worden niet verstoord door de dingen, maar door hun oordelen over de dingen\"; een zin waaruit de cognitieve gedragstherapie rechtstreeks voortkomt."}, "points": [{"text": {"fa": "رابرتسون (۲۰۱۰): الیس و بک، بنیان‌گذاران درمان شناختی، صراحتاً اپیکتتوس و مارکوس اورلیوس را منبع خود نامیده‌اند؛ «دوگانهٔ کنترل»، «تمرین پیش‌اندیشیِ بدی‌ها» و «نگاه از بالا» معادل‌های مستقیم در CBT دارند.", "en": "Robertson (2010): Ellis and Beck, founders of cognitive therapy, explicitly named Epictetus and Marcus Aurelius as their source; the \"dichotomy of control\", \"premeditation of adversity\" and the \"view from above\" have direct equivalents in CBT.", "nl": "Robertson (2010): Ellis and Beck, founders of cognitive therapy, explicitly named Epictetus and Marcus Aurelius as their source; the \"dichotomy of control\", \"premeditation of adversity\" and the \"view from above\" have direct equivalents in CBT."}, "sources": ["src:c8cffc9694"], "flags": []}, {"text": {"fa": "آدو (۱۹۹۵): فلسفهٔ باستان پیش از آنکه نظریه باشد «تمرین معنوی» و شیوهٔ زندگی بود؛ متن‌ها دفترچهٔ تمرین‌اند نه رساله. رواقی‌گری عامه‌پسند امروز گاهی این بُعد اجتماعی و اخلاقی (عدالت، خویشاوندی همهٔ انسان‌ها) را حذف می‌کند و به «خودیاری» تقلیلش می‌دهد.", "en": "Hadot (1995): ancient philosophy was a \"spiritual exercise\" and way of life before it was theory; the texts are practice notebooks, not treatises. Today's popular Stoicism sometimes drops this social and ethical dimension (justice, the kinship of all humans) and reduces it to \"self-help\".", "nl": "Hadot (1995): ancient philosophy was a \"spiritual exercise\" and way of life before it was theory; the texts are practice notebooks, not treatises. Today's popular Stoicism sometimes drops this social and ethical dimension (justice, the kinship of all humans) and reduces it to \"self-help\"."}, "sources": ["src:5834d9b57d", "src:c039c6c9c6"], "flags": ["editor-note"]}], "links": [{"to": "psy:reappraisal", "rel": "bridges", "note": {"fa": "بازارزیابی شناختی", "en": "Cognitive reappraisal", "nl": "Cognitive reappraisal"}}, {"to": "psy:psychotherapy", "rel": "bridges", "note": {"fa": "روان‌درمانی", "en": "Psychotherapy", "nl": "Psychotherapy"}}, {"to": "phil:absurd-meaning", "rel": "contrasts", "note": {"fa": "اگزیستانسیالیسم: معنا ساخته می‌شود", "en": "Existentialism: meaning is made", "nl": "Existentialism: meaning is made"}}], "people": ["core:epictetus", "core:pierre-hadot"], "sources": ["src:5834d9b57d", "src:c039c6c9c6", "src:c8cffc9694"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:gathas-first-unbelief-claim", "kind": "concept", "title": {"fa": "گاهان و ادعای «نخستین کفر» در برابر خدایان باستان", "en": "The Gathas and the claim of the first 'unbelief'", "nl": "De Gatha's en de bewering van het eerste 'ongeloof'"}, "aliases": [], "parent": "phil:iranian", "field": "phil:iranian", "summary": {"fa": "به گفتهٔ مهمان، خدایان جهان باستان، از انکی سومری تا کرونوس و یهوه، خردمند و اخلاقی نبودند، اما در گاهان ناگهان از خدایی یگانه سخن می‌رود و خدایان پیشین دروغین خوانده می‌شوند. او زرتشت را «اولین کافر» می‌نامد و این را با نقد لوسین فبور دربارهٔ ناممکن بودن بی‌ایمانی در اروپای سدهٔ شانزدهم مقایسه می‌کند. این برداشت جذاب است اما ساده‌سازی شده و بحث‌برانگیز است.", "en": "Per the guest, ancient gods from Enki to Cronus and Yahweh were capricious and not ethical, whereas the Gathas suddenly speak of one wise god and call earlier gods false. He calls Zoroaster the 'first unbeliever' and contrasts this with Lucien Febvre's argument that unbelief was nearly impossible in 16th-century Europe. This is an appealing but simplified, contested reading.", "nl": "Volgens de gast waren oude goden grillig, terwijl de Gatha's één wijze god verkondigen en oudere goden verwerpen. Hij noemt Zoroaster de 'eerste ongelovige'; dit is een aantrekkelijke maar omstreden vereenvoudiging."}, "points": [{"text": {"fa": "به گفتهٔ مهمان، خدایان کهن اغلب نامعقول و خشن‌اند: انکی مست می‌شود و الواح را از دست می‌دهد، تیامت فرزندان را می‌کشد، کرونوس فرزندانش را می‌بلعد و یهوه خود را «حسود» می‌خواند. به گفتهٔ او گاهان در برابر اینها خدایی یگانه و پر از مهر و خرد معرفی می‌کند.", "en": "Per the guest, ancient gods are irrational and violent (Enki drunk, Tiamat killing, Cronus devouring, Yahweh 'jealous'), while the Gathas present one wise, loving god.", "nl": "Per the guest, ancient gods are irrational and violent (Enki drunk, Tiamat killing, Cronus devouring, Yahweh 'jealous'), while the Gathas present one wise, loving god."}, "sources": ["src:75325e8f83"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ مهمان، در گاهان همهٔ خدایان پیشین دروغین‌اند و واژهٔ «دئوه» که روزی خدا معنا می‌داد به دیو و نمایندهٔ دروغ بدل می‌شود. او می‌گوید به این معنا زرتشت اولین کافر تاریخ است. ولی پژوهشگران معمولاً این را نه ایمانِ بی‌چون‌وچرای یکتاگرایی، بلکه دگرگونی دینی در میان مردم هندوایرانی می‌دانند: در اوستا دیوان رانده می‌شوند ولی اهورامزدا در کنار اَمشاسپندان و ایزدان دیگر آمده و گاهان را گاه «دوگانه‌گرایی اخلاقی» یا یکتاپرستی نسبی می‌نامند.", "en": "Per the guest, the Gathas declare all former gods false and the word daeva turns into 'demon', making Zoroaster the first 'unbeliever'. Scholars generally see a religious reform within the Indo-Iranian tradition; the Gathas are described variously as ethical dualism or qualified monotheism, with Ahura Mazda alongside the Amesha Spentas.", "nl": "Per the guest, the Gathas declare all former gods false and the word daeva turns into 'demon', making Zoroaster the first 'unbeliever'. Scholars generally see a religious reform within the Indo-Iranian tradition; the Gathas are described variously as ethical dualism or qualified monotheism, with Ahura Mazda alongside the Amesha Spentas."}, "sources": ["src:75325e8f83", "src:7d8cfd1cf4"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "مهمان کتابی از لوسین فبور (مورخ فرانسوی مکتب آنال) دربارهٔ رابله را مثال می‌زند. فبور در آن استدلال کرد که در سدهٔ شانزدهم اروپا بی‌ایمانی کامل «از نظر ذهنی» ناممکن بود. مهمان نتیجه می‌گیرد که در گاهان کفر برای نخستین بار ممکن شده است. مقایسه از خود مهمان است؛ فبور چنین ادعایی دربارهٔ زرتشت نکرده.", "en": "The guest cites Lucien Febvre's study of Rabelais, which argued that outright unbelief was mentally unavailable in 16th-century Europe, and concludes that unbelief first became possible in the Gathas. The comparison is the guest's own; Febvre made no claim about Zoroaster.", "nl": "The guest cites Lucien Febvre's study of Rabelais, which argued that outright unbelief was mentally unavailable in 16th-century Europe, and concludes that unbelief first became possible in the Gathas. The comparison is the guest's own; Febvre made no claim about Zoroaster."}, "sources": ["src:4505c21c79"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "به گفتهٔ مهمان، در شخصیت اهورامزدا ردپای مهر (دوستی، پیمان و جنگاوری) دیده می‌شود. در عین حال خود مهر در آیین‌ها کم‌تر نمود دارد. این رابطه حدس مهمان است و در متن گاهان تأیید روشنی ندارد.", "en": "Per the guest, Ahura Mazda carries traces of Mithra (friendship, contract, warrior traits). This is speculation without clear support in the Gathic text.", "nl": "Per the guest, Ahura Mazda carries traces of Mithra (friendship, contract, warrior traits). This is speculation without clear support in the Gathic text."}, "sources": ["src:75325e8f83"], "flags": ["contested", "editor-note"]}], "links": [{"to": "soc:gathas-ritual-reduction-debate", "rel": "see-also", "note": {"fa": "گاهان و بازگشت مناسک", "en": "The Gathas and the return of ritual", "nl": "The Gathas and the return of ritual"}}, {"to": "soc:religion-ideology-iran-debate", "rel": "see-also", "note": {"fa": "بحث دین و ایران", "en": "Debate on religion and Iran", "nl": "Debate on religion and Iran"}}, {"to": "soc:sacred-and-taboo", "rel": "contrasts", "note": {"fa": "امر قدسی در دین‌های باستانی", "en": "
