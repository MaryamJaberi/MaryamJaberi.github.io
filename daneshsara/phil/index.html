<style>
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);min-height:var(--header-h)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--ink)}
.brand svg{width:26px;height:26px;color:var(--primary)}
.crumbs{font-size:var(--small);color:var(--ink-2)}.crumbs a{color:var(--ink-2)}
.lang{display:flex;gap:2px;border:1px solid var(--line-strong);border-radius:var(--r-full);padding:2px}
.lang button{font:inherit;font-size:var(--chip);padding:4px 10px;border:0;border-radius:var(--r-full);background:transparent;color:var(--ink-2);cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
main{padding-block:var(--s6) var(--s16)}
.hero{display:grid;gap:var(--s3);margin-bottom:var(--s6)}
.hero h1{margin:0}
.hero p{color:var(--ink-2);font-size:1.05rem;max-width:70ch;margin:0}
.draft{display:inline-flex;align-items:center;gap:8px;font-size:var(--chip);padding:4px 12px;border-radius:var(--r-full);background:var(--warn-bg,#FBF1D9);color:var(--warn-ink,#6B4E00);border:1px solid var(--warn-line,#E8D39A)}
.search{display:flex;gap:8px;margin:var(--s4) 0}
.search input{font:inherit;flex:1;min-width:0;padding:10px 14px;border-radius:var(--r-md);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink)}
.fields{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:var(--s6)}
.fields button{font:inherit;font-size:var(--small);padding:6px 14px;border-radius:var(--r-full);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer}
.fields button[aria-pressed=true]{background:var(--primary);color:#fff;border-color:var(--primary)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--s4)}
.grid .card{padding:var(--s5);display:grid;gap:8px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.grid .card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.grid h3{margin:0;font-size:var(--h4)}
.grid p{margin:0;color:var(--ink-2);font-size:var(--small);line-height:1.75;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.kick{font-size:var(--chip);color:var(--primary);font-weight:700}
.sub{color:var(--ink-3);font-size:var(--small);direction:ltr;text-align:start;unicode-bidi:isolate}
[dir=rtl] .sub{text-align:right}
.fsec{margin-bottom:var(--s8)} .fsec h2{font-size:var(--h3);margin:0 0 var(--s1)} .fsec>p{margin:0 0 var(--s4);color:var(--ink-2);max-width:70ch}
article.detail{display:grid;gap:var(--s5);max-width:78ch}
article.detail h1{margin:0}
article.detail .lead{font-size:1.1rem;line-height:1.9;margin:0}
.back{font:inherit;font-size:var(--small);border:0;background:transparent;color:var(--primary);cursor:pointer;padding:0;text-align:start}
.pts{display:grid;gap:var(--s3);margin:0;padding:0;list-style:none}
.pts li{padding:var(--s4) var(--s5);border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);line-height:1.85;position:relative}
.pts li .ref{font-size:var(--chip);color:var(--ink-3);display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.flag{font-size:var(--chip);padding:1px 8px;border-radius:var(--r-full);border:1px solid}
.flag.unreplicated{color:#8A2E2E;border-color:#E3B4B4;background:#FBEDED}
.flag.contested{color:#6B4E00;border-color:#E8D39A;background:#FBF1D9}
.flag.dated{color:var(--ink-2);border-color:var(--line-strong)}
.flag.editor-note{color:var(--primary);border-color:var(--primary)}
h2.sec{font-size:var(--small);color:var(--ink-2);font-weight:600;margin:var(--s2) 0 0;text-transform:uppercase;letter-spacing:.04em}
.links{display:grid;gap:6px}
.links a{display:flex;gap:10px;align-items:baseline;padding:8px 12px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--ink)}
.links a:hover{border-color:var(--primary)}
.links .rel{font-size:var(--chip);color:var(--primary);min-width:7em}
.links .nt{font-size:var(--small);color:var(--ink-2)}
.links .ext{font-size:var(--chip);color:var(--ink-3)}
.ppl{display:flex;flex-wrap:wrap;gap:6px}
.ppl span{font-size:var(--small);padding:4px 10px;border-radius:var(--r-full);border:1px solid var(--line-strong);background:var(--surface)}
.ppl small{color:var(--ink-3)}
.iran{border-inline-start:4px solid var(--primary);padding:var(--s4) var(--s5);border-radius:var(--r-md);background:var(--surface);display:grid;gap:8px}
.iran .q{font-weight:700}
.grade{display:inline-block;font-size:var(--chip);padding:1px 8px;border-radius:var(--r-full);background:var(--ink);color:var(--paper)}
ol.src{direction:ltr;text-align:left;padding-inline-start:1.4em;margin:0;display:grid;gap:6px;font-size:var(--small);color:var(--ink-2);line-height:1.7}
ol.src a{color:var(--primary)}
.status{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:var(--small);color:var(--ink-3)}
footer.foot{border-top:1px solid var(--line);padding-block:var(--s8);color:var(--ink-3);font-size:var(--small)}
@media (prefers-color-scheme: dark){:root:not([data-theme=light]) .flag.unreplicated{background:#3A1F1F;color:#F2B8B8;border-color:#6B3A3A} :root:not([data-theme=light]) .flag.contested,:root:not([data-theme=light]) .draft{background:#3A3010;color:#F0D78A;border-color:#6B5A2A}}
:root[data-theme=dark] .flag.unreplicated{background:#3A1F1F;color:#F2B8B8;border-color:#6B3A3A} :root[data-theme=dark] .flag.contested,:root[data-theme=dark] .draft{background:#3A3010;color:#F0D78A;border-color:#6B5A2A}
</style>

<script>
const D = {"wiki": "phil", "order": ["phil:epistemology", "phil:mind", "phil:ethics", "phil:science", "phil:political", "phil:iranian", "phil:life"], "concepts": [{"id": "phil:iranian-qualitative-worldview-thesis", "kind": "concept", "title": {"fa": "تز «نگاه کیفی و مهرمحور ایرانی» به جهان", "en": "The thesis of a qualitative, love-centred Iranian worldview", "nl": "De these van een kwalitatieve, liefdegerichte Iraanse wereldvisie"}, "aliases": [], "parent": "phil:iranian", "field": "phil:iranian", "summary": {"fa": "سخنران ادعا می‌کند فرهنگ ایرانی جهان را کیفی می‌بیند، عناصر را مادر و دوست‌دار نور می‌داند و برخلاف نگاه سلسله‌مراتبی، زمین را پست نمی‌شمرد. او این را به سهروردی، جشن‌ها، تعارف و منطق فازی گره می‌زند. این یک تز فرهنگی است و تعمیم دربارهٔ «ملت» ریسک ذات‌گرایی دارد.", "en": "The lecturer claims Iranian culture sees the world qualitatively, treating the elements as mother-like and in love with light, unlike hierarchical views that scorn earth. He links this to Suhrawardi, festivals, taarof and fuzzy logic. It is a cultural thesis, and generalising about a 'nation' risks essentialism.", "nl": "De spreker stelt dat de Iraanse cultuur de wereld kwalitatief ziet en de aarde niet minacht; hij verbindt dit met Soehrawardi, feesten en fuzzy logic. Het is een culturele these met risico op essentialisme."}, "points": [{"text": {"fa": "به گفتهٔ سخنران، در سنت‌های ابراهیمی و یونانی چهار عنصر سلسله‌مراتبی‌اند (خاک پایین، آتش بالا، چنان‌که در داستان سرپیچی ابلیس)، ولی در نگاه ایرانی زمین مادر و گهواره است، در جایگاه بالا نور است نه آتش، و عنصرهای پایین عاشق نورند.", "en": "Per the lecturer, in Abrahamic and Greek traditions the four elements are hierarchical (earth low, fire high, as in the story of Iblis), whereas in the Iranian view earth is a mother and cradle, light rather than fire sits on top, and lower elements love light.", "nl": "Per the lecturer, in Abrahamic and Greek traditions the four elements are hierarchical (earth low, fire high, as in the story of Iblis), whereas in the Iranian view earth is a mother and cradle, light rather than fire sits on top, and lower elements love light."}, "sources": ["src:f1f94e6d61"], "flags": ["editor-note"]}, {"text": {"fa": "او می‌گوید در آیین زرتشتی پاک نگه داشتن آب و خاک وظیفه است و سهروردی (فلسفهٔ اشراق) این نگاه را با زبان زمان خود بازآفرینی کرد. سهروردی خود را وارث حکمت ایران باستان می‌دانست، اما پژوهشگران اشراق را در سنت نوافلاطونی-اسلامی نیز می‌گذارند و میزان پیوستگی مستقیم با ایران باستان محل بحث است.", "en": "He says that in Zoroastrianism keeping water and earth clean is a duty and that Suhrawardi (Illuminationism) revived this outlook in the language of his day. Suhrawardi saw himself as heir to ancient Persian wisdom, but scholars also place Illuminationism in the Neoplatonic-Islamic tradition, and the degree of direct continuity with ancient Iran is debated.", "nl": "He says that in Zoroastrianism keeping water and earth clean is a duty and that Suhrawardi (Illuminationism) revived this outlook in the language of his day. Suhrawardi saw himself as heir to ancient Persian wisdom, but scholars also place Illuminationism in the Neoplatonic-Islamic tradition, and the degree of direct continuity with ancient Iran is debated."}, "sources": ["src:94a29a68a8"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "سخنران منطق فازی لطفی‌زاده را مثال «نگاه کیفی ایرانی» می‌داند. لطفی‌زاده (۱۹۲۱–۲۰۱۷) در باکو زاده شد، در تهران تحصیل کرد و مقالهٔ مجموعه‌های فازی را در ۱۹۶۵ نوشت؛ ایدهٔ او از مهندسی و نظریهٔ سامانه‌ها آمد و خودش آن را بیان فرهنگ ایرانی نخوانده است. کاربرد صنعتی آن (مثلاً قطار، دوربین و ماشین لباسشویی) در ژاپن گسترش یافت؛ اینکه ترمز ABS بر پایهٔ آن است ادعایی نادقیق است.", "en": "The lecturer treats Zadeh's fuzzy logic as an example of the 'Iranian qualitative view'. Zadeh (1921–2017) was born in Baku, studied in Tehran and published 'Fuzzy sets' in 1965; his idea came from engineering and systems theory, and he did not present it as an expression of Iranian culture. Industrial uses (trains, cameras, washing machines) spread through Japan; the claim that ABS brakes rest on it is imprecise.", "nl": "The lecturer treats Zadeh's fuzzy logic as an example of the 'Iranian qualitative view'. Zadeh (1921–2017) was born in Baku, studied in Tehran and published 'Fuzzy sets' in 1965; his idea came from engineering and systems theory, and he did not present it as an expression of Iranian culture. Industrial uses (trains, cameras, washing machines) spread through Japan; the claim that ABS brakes rest on it is imprecise."}, "sources": ["src:0814fd7714"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "او نتیجه می‌گیرد ایرانیان «بیش از آنکه کمّی باشند کیفی‌اند» و مثال‌هایی مثل شب یلدا، تعارف و مهمان‌نوازی می‌آورد. مقایسه‌ای با خصلت ملی‌های دیگر (مثلاً آلمانی‌ها) بر روایت‌های شخصی بنا شده است. گفتن اینکه یک ملت ذاتاً چنین یا چنان می‌اندیشد با علوم اجتماعی نمی‌خواند، چون هر جامعه‌ای تنوع و تغییر دارد و آداب مشابه در فرهنگ‌های دیگر هم دیده می‌شود.", "en": "He concludes that Iranians are 'more qualitative than quantitative', citing Yalda, taarof and hospitality. His comparisons with other nations rest on personal anecdotes. Saying a nation inherently thinks one way conflicts with social science, since every society is diverse and changing and similar customs exist elsewhere.", "nl": "He concludes that Iranians are 'more qualitative than quantitative', citing Yalda, taarof and hospitality. His comparisons with other nations rest on personal anecdotes. Saying a nation inherently thinks one way conflicts with social science, since every society is diverse and changing and similar customs exist elsewhere."}, "sources": ["src:f1f94e6d61"], "flags": ["contested", "editor-note"]}], "links": [{"to": "phil:illumination", "rel": "explains", "note": {"fa": "حکمت اشراق و علم حضوری", "en": "Illuminationism and knowledge by presence", "nl": "Illuminationism and knowledge by presence"}}, {"to": "phil:iranian", "rel": "part-of", "note": {"fa": "فلسفهٔ ایرانی-اسلامی", "en": "Iranian-Islamic philosophy", "nl": "Iranian-Islamic philosophy"}}], "people": ["core:shihab-al-din-suhrawardi", "core:lotfi-a-zadeh", "core:jean-chardin"], "sources": ["src:0814fd7714", "src:94a29a68a8", "src:f1f94e6d61"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:cave", "kind": "concept", "title": {"fa": "تمثیل غار", "en": "The allegory of the cave", "nl": "De allegorie van de grot"}, "aliases": [], "parent": "phil:epistemology", "field": "phil:epistemology", "summary": {"fa": "زندانیانی که از کودکی رو به دیوار بسته‌اند، سایه‌ها را واقعیت می‌پندارند؛ کسی که آزاد می‌شود و خورشید را می‌بیند، وقتی برمی‌گردد باور نمی‌شود و حتی تهدید می‌شود. افلاطون این را دربارهٔ آموزش و فیلسوف‌پادشاه گفت؛ امروز استعارهٔ هر حباب اطلاعاتی و هر «بیداری» است.", "en": "Prisoners chained since childhood facing a wall take shadows for reality; one who is freed and sees the sun is disbelieved, even threatened, when he returns. Plato told it about education and the philosopher-king; today it is the metaphor for every information bubble and every \"awakening\".", "nl": "Gevangenen die sinds hun kindertijd geketend naar een muur kijken, houden schaduwen voor werkelijkheid; wie bevrijd wordt en de zon ziet, wordt bij terugkeer niet geloofd, zelfs bedreigd. Plato vertelde het over opvoeding en de filosoof-koning; vandaag is het de metafoor voor elke informatiebubbel en elk \"ontwaken\"."}, "points": [{"text": {"fa": "افلاطون (جمهور، کتاب هفتم): آموزش «ریختن دانش در روح» نیست، چرخاندن کل روح از سایه به نور است؛ و کسی که دیده، وظیفه دارد به غار برگردد، هرچند به زیانش باشد.", "en": "Plato (Republic, Book VII): education is not \"pouring knowledge into the soul\" but turning the whole soul from shadow to light; and the one who has seen has a duty to go back down into the cave, even at his own cost.", "nl": "Plato (Republic, Book VII): education is not \"pouring knowledge into the soul\" but turning the whole soul from shadow to light; and the one who has seen has a duty to go back down into the cave, even at his own cost."}, "sources": ["src:cb319b234e"], "flags": []}, {"text": {"fa": "خوانش انتقادی: تمثیل به‌راحتی ابزار نخبه‌گرایی می‌شود («ما نور را دیده‌ایم، شما سایه را»)؛ هر گروهی که خود را بیرون غار می‌داند، باید بپرسد سایه‌های خودش کدام‌اند. سهروردی و روایت‌های اشراقی همین تصویر را با نور بازنوشتند.", "en": "A critical reading: the allegory easily becomes a tool of elitism (\"we have seen the light, you the shadows\"); any group that places itself outside the cave should ask which shadows are its own. Suhrawardi and the Illuminationist narratives rewrote the same image with light.", "nl": "A critical reading: the allegory easily becomes a tool of elitism (\"we have seen the light, you the shadows\"); any group that places itself outside the cave should ask which shadows are its own. Suhrawardi and the Illuminationist narratives rewrote the same image with light."}, "sources": ["src:cb319b234e"], "flags": ["editor-note"]}], "links": [{"to": "psy:conspiracy", "rel": "bridges", "note": {"fa": "توطئه‌باوری و «بیداری»", "en": "Conspiracy belief and \"awakening\"", "nl": "Conspiracy belief and \"awakening\""}}, {"to": "phil:illumination", "rel": "see-also", "note": {"fa": "اشراق", "en": "Illumination", "nl": "Illumination"}}, {"to": "soc:preference-falsification", "rel": "bridges", "note": {"fa": "آنچه همه می‌بینند و نمی‌گویند", "en": "What everyone sees and no one says", "nl": "What everyone sees and no one says"}}], "people": ["core:plato"], "sources": ["src:cb319b234e"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:iranian-world-aesthetics-inner-outer", "kind": "concept", "title": {"fa": "«جهان ایرانی» و زیبایی: درون و بیرون، نور و سایه", "en": "The \"Iranian world\" and beauty: inside and outside, light and shadow", "nl": "De \"Iraanse wereld\" en schoonheid: binnen en buiten, licht en schaduw"}, "aliases": [], "parent": "phil:iranian", "field": "phil:iranian", "summary": {"fa": "سجاد فتاحی می‌گوید در بناهای تاریخی، خط، موسیقی و شعر فارسی حسی مشترک از مهر و آرامش هست که آن را نشانهٔ یک «جهان ایرانی» می‌داند. به نظر او این بناها از بیرون ساده‌اند و درونشان آدم را می‌کشند و پرده‌پرده رازشان را نشان می‌دهند. او نور و تاریکی را هم دو روی یک چیز می‌بیند. این یک تفسیر زیبایی‌شناسانهٔ شخصی است و برداشت همهٔ بازدیدکنندگان یا پژوهشگران نیست.", "en": "Sociologist Sajjad Fattahi says that architecture, calligraphy, music and Persian poetry share a felt quality of warmth and calm, which he takes as the mark of an \"Iranian world\". In his account these buildings are plain outside and draw you in, revealing their secrets step by step, and light and darkness are two faces of one thing. This is a personal aesthetic interpretation, not a consensus view.", "nl": "De socioloog Sajjad Fattahi stelt dat architectuur, kalligrafie, muziek en Perzische poëzie een gedeeld gevoel van warmte en rust oproepen, wat hij als kenmerk van een \"Iraanse wereld\" ziet. Dit is zijn persoonlijke esthetische duiding, geen consensus."}, "points": [{"text": {"fa": "به گفتهٔ سخنران (فتاحی)، وقتی در فضاهایی مثل مسجد شیخ‌لطف‌الله، کاروانسرای سعدالسلطنه، آتشکدهٔ آذرگشسب یا کلیسای جلفا قدم می‌گذاری، حسی از مهر و آرامش به تو منتقل می‌شود. او این حس را با دو واژهٔ «مهر» و «عشق» توصیف می‌کند و می‌گوید به یک دین یا گروه خاص هم وابسته نیست.", "en": "Per the lecturer (Fattahi), entering spaces such as the Sheikh Lotfollah Mosque, the Saad al-Saltaneh caravanserai, the Azargoshnasp fire temple or the Armenian church in Jolfa gives a feeling of warmth and calm, which he describes with the words \"affection\" and \"love\" and says is not tied to any one religion.", "nl": "Per the lecturer (Fattahi), entering spaces such as the Sheikh Lotfollah Mosque, the Saad al-Saltaneh caravanserai, the Azargoshnasp fire temple or the Armenian church in Jolfa gives a feeling of warmth and calm, which he describes with the words \"affection\" and \"love\" and says is not tied to any one religion."}, "sources": ["src:d7a70608b6"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، این بناها از بیرون ساده‌اند ولی از درون آدم را نگه می‌دارند. ستون‌های فراوان مسجدها گوشه و سایه می‌سازند و جلوی نگاه را می‌گیرند، یعنی همه‌چیز یکجا دیده نمی‌شود و باید قدم‌به‌قدم پیش رفت. او این را با ایدهٔ «رازداری» و محرم و نامحرم در عرفان پیوند می‌دهد و می‌گوید نور بدون تاریکی دیده نمی‌شود.", "en": "Per the lecturer, these buildings are plain outside but hold you from within. The many columns of mosques create corners and shade and block the view, so nothing is seen all at once and one must move step by step. He links this to the mystical idea of secrecy (insider and outsider), and says light cannot be seen without darkness.", "nl": "Per the lecturer, these buildings are plain outside but hold you from within. The many columns of mosques create corners and shade and block the view, so nothing is seen all at once and one must move step by step. He links this to the mystical idea of secrecy (insider and outsider), and says light cannot be seen without darkness."}, "sources": ["src:d7a70608b6"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، در گنبد مسجدها نقش‌های بسیار زیاد در یک نقطه به وحدت می‌رسند و نمی‌شود فهمید که این وحدت حاصل آن کثرت است یا کثرت از آن وحدت پراکنده شده. برای همین او به‌جای واژهٔ «نسبیت» واژهٔ «پیچیدگی» را برای خوب و بد، اهورا و اهریمن و فرشته و شیطان ترجیح می‌دهد: جایگاه این مفاهیم با ژرف‌تر شدن فهم عوض می‌شود. او برج آزادی (شهیاد) اثر حسین امانت را مثال نو می‌زند و می‌گوید یک عکاس آن را شبیه سیمرغ دیده است.", "en": "Per the lecturer, in a mosque dome countless patterns converge on one point, and one cannot tell whether the unity results from the multiplicity or the multiplicity spreads out from the unity. So instead of \"relativity\" he prefers the word \"complexity\" for good and evil, Ahura Mazda and Ahriman, angel and devil: their place shifts as understanding deepens. As a modern example he names the Azadi (Shahyad) Tower by Hossein Amanat, which a photographer friend saw as a Simurgh.", "nl": "Per the lecturer, in a mosque dome countless patterns converge on one point, and one cannot tell whether the unity results from the multiplicity or the multiplicity spreads out from the unity. So instead of \"relativity\" he prefers the word \"complexity\" for good and evil, Ahura Mazda and Ahriman, angel and devil: their place shifts as understanding deepens. As a modern example he names the Azadi (Shahyad) Tower by Hossein Amanat, which a photographer friend saw as a Simurgh."}, "sources": ["src:d7a70608b6"], "flags": ["editor-note"]}, {"text": {"fa": "نکتهٔ احتیاطی: حس زیبایی ذهنی و فردی است و ادعای حس مشترک همهٔ آدم‌ها (حتی غیرایرانی‌ها) در این گفتگو بیشتر تجربهٔ شخصی و شنیده‌هاست، نه پژوهش تجربی. شیخ‌لطف‌الله در دورهٔ صفوی، در آغاز سدهٔ هفدهم میلادی، ساخته شده و آن را نمونهٔ یک «جهان» ایرانی بی‌زمان دیدن، یک تفسیر است. همچنین زروانیسم (که خدایان نیک و بد را فرزند یک زمان بی‌کران می‌داند) شاخه‌ای خاص و مورد بحث در دین ایران باستان بود؛ دربارهٔ جایگاه و قدمت آن بین پژوهشگران اختلاف است و آیین زرتشتی رایج اهریمن را کاملاً بد می‌داند. پس برداشت «خوب و بد از یک ریشه‌اند» تفسیر سخنران است نه آموزهٔ همهٔ سنت‌ها. ادعای ساخته‌شدن آتشکده‌ها بر مهرکده‌ها هم فرضیه است و سند قطعی ندارد.", "en": "Caveat: the sense of beauty is subjective, and the claim that everyone (even non-Iranians) shares this feeling rests in the talk on personal experience and hearsay, not empirical research. The Sheikh Lotfollah Mosque was built under the Safavids in the early 17th century, and reading it as an expression of a timeless Iranian \"world\" is an interpretation. Zurvanism (which makes the good and evil gods sons of one infinite Time) was a particular and debated current in ancient Iranian religion; scholars disagree about its standing and age, and mainstream Zoroastrianism treats Ahriman as wholly evil, so \"good and evil share one root\" is the lecturer's reading, not the doctrine of all traditions. The claim that fire temples were built over Mithra shrines is a hypothesis without firm evidence.", "nl": "Caveat: the sense of beauty is subjective, and the claim that everyone (even non-Iranians) shares this feeling rests in the talk on personal experience and hearsay, not empirical research. The Sheikh Lotfollah Mosque was built under the Safavids in the early 17th century, and reading it as an expression of a timeless Iranian \"world\" is an interpretation. Zurvanism (which makes the good and evil gods sons of one infinite Time) was a particular and debated current in ancient Iranian religion; scholars disagree about its standing and age, and mainstream Zoroastrianism treats Ahriman as wholly evil, so \"good and evil share one root\" is the lecturer's reading, not the doctrine of all traditions. The claim that fire temples were built over Mithra shrines is a hypothesis without firm evidence."}, "sources": ["src:7601475ecc"], "flags": ["contested", "editor-note"]}], "links": [{"to": "phil:iranian", "rel": "part-of", "note": {"fa": "در چارچوب بحث فلسفهٔ ایرانی-اسلامی", "en": "Within the broader topic of Iranian-Islamic philosophy", "nl": "Within the broader topic of Iranian-Islamic philosophy"}}, {"to": "psy:p-aesthetics", "rel": "see-also", "note": {"fa": "دربارهٔ تجربهٔ زیبایی‌شناختی در روان‌شناسی", "en": "On aesthetic experience in psychology", "nl": "On aesthetic experience in psychology"}}, {"to": "phil:iranian-irfan-single-line", "rel": "explains", "note": {"fa": "بنیان عرفانی که سخنران پشت این زیبایی می‌بیند", "en": "The mystical basis the lecturer sees behind this beauty", "nl": "The mystical basis the lecturer sees behind this beauty"}}], "people": ["core:sajjad-fattahi", "core:hossein-amanat", "core:herbert-karimi-photographer-name-as-heard"], "sources": ["src:7601475ecc", "src:d7a70608b6"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:nietzsche-god-is-dead-nihilism", "kind": "concept", "title": {"fa": "نیچه: «خدا مرده است» و خطر پوچ‌گرایی", "en": "Nietzsche: 'God is dead' and the danger of nihilism", "nl": "Nietzsche: 'God is dood' en het gevaar van nihilisme"}, "aliases": [], "parent": "phil:life", "field": "phil:life", "summary": {"fa": "نیچه در «دانش شادان» می‌گوید باور به خدای مسیحی در اروپای مدرن دیگر باورکردنی نیست و پایه‌های اخلاق و معنای سنتی را با خود می‌برد. این جمله بیشتر تشخیص یک بحران فرهنگی است تا جشن گرفتن. سخنران دو آیندهٔ ممکن را از آن می‌خواند: سقوط در پوچی، یا فرصتی برای ساختن ارزش‌های تازه.", "en": "In The Gay Science Nietzsche says belief in the Christian God has become unbelievable in modern Europe, and that this undermines the foundations of traditional morality and meaning. The phrase is mainly a diagnosis of a cultural crisis, not a celebration. The lecturer reads two possible futures in it: a slide into emptiness, or a chance to create new values.", "nl": "In De vrolijke wetenschap stelt Nietzsche dat het geloof in de christelijke God in het moderne Europa ongeloofwaardig is geworden en dat daarmee de grondslagen van de traditionele moraal en zingeving wankelen. De uitspraak is vooral een diagnose van een culturele crisis. De docent leest er twee mogelijke toekomsten in: leegte of de kans op nieuwe waarden."}, "points": [{"text": {"fa": "به گفتهٔ سخنران، نیچه محو شدن دین در جهان مدرن را اجتناب‌ناپذیر می‌داند و دو واکنش ممکن می‌بیند: یا تراژدی (از دست رفتن اخلاق و معنا و سقوط در پوچی، به‌ویژه اگر خلأ فقط با مصرف‌گرایی و شبکه‌های اجتماعی پر شود)، یا فرصتی برای آفریدن ارزش‌های تازهٔ خودآگاهانه.", "en": "Per the lecturer, Nietzsche sees the fading of religion as unavoidable and sees two possible responses: tragedy (loss of morality and meaning, a slide into nihilism, especially if the void is filled only by consumerism and social media) or an opportunity to create new, self-aware values.", "nl": "Per the lecturer, Nietzsche sees the fading of religion as unavoidable and sees two possible responses: tragedy (loss of morality and meaning, a slide into nihilism, especially if the void is filled only by consumerism and social media) or an opportunity to create new, self-aware values."}, "sources": ["src:873416a5d1"], "flags": ["editor-note"]}, {"text": {"fa": "عبارت از بخش ۱۲۵ «دانش شادان» (سخن «مرد دیوانه») می‌آید که در آن می‌گوید «ما او را کشته‌ایم». معنای آن این است که اعتبار فرهنگی باور مسیحی فرو ریخته؛ این جمله اثبات علمی نبودن خدا نیست و نیچه در همان متن از پیامدهای سنگین و هراس‌آور آن سخن می‌گوید.", "en": "The phrase comes from section 125 of The Gay Science (the 'madman' passage), where it is said 'we have killed him'. It means the cultural authority of Christian belief has collapsed; it is not a proof that God does not exist, and the same text speaks of the heavy, frightening consequences.", "nl": "The phrase comes from section 125 of The Gay Science (the 'madman' passage), where it is said 'we have killed him'. It means the cultural authority of Christian belief has collapsed; it is not a proof that God does not exist, and the same text speaks of the heavy, frightening consequences."}, "sources": ["src:5da9a8e07a"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "پاسخ نیچه به این بحران همان «حکمتِ عقلانی و اخلاق مبتنی بر عقل» که سخنران می‌گوید نیست. نیچه در «تبارشناسی اخلاق» اخلاق همگانی (از جمله اخلاق عقل‌محور کانتی) را هم نقد می‌کند و به‌جایش از «ارزیابی دوبارهٔ ارزش‌ها»، خودآفرینی و پذیرش سرنوشت سخن می‌گوید. او همچنین از «واپسین انسان» (آدم راحت‌طلبِ بی‌آرمان) هشدار می‌دهد.", "en": "Nietzsche's own answer is not the 'rational wisdom and reason-based ethics' the lecturer proposes. In the Genealogy he criticises universal morality, Kantian rationalist ethics included, and speaks instead of a revaluation of values, self-creation and acceptance of fate. He also warns against the 'last man', the comfort-seeking person without ideals.", "nl": "Nietzsche's own answer is not the 'rational wisdom and reason-based ethics' the lecturer proposes. In the Genealogy he criticises universal morality, Kantian rationalist ethics included, and speaks instead of a revaluation of values, self-creation and acceptance of fate. He also warns against the 'last man', the comfort-seeking person without ideals."}, "sources": ["src:be246c9f9b", "src:3368519066"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "«ابرانسان» در «چنین گفت زرتشت» نمادی از خودفراروی و آفرینش ارزش است، نه یک کمال اخلاقی ثابت. مفسران دربارهٔ معنای دقیقش اختلاف دارند (مثلاً کافمن آن را تسلط و پالایش خویشتن می‌خواند)، پس تعبیر سخنران یک خوانش ممکن است نه تنها خوانش.", "en": "The 'overman' in Thus Spoke Zarathustra is a symbol of self-overcoming and value-creation, not a fixed moral perfection. Interpreters disagree on its exact sense (Kaufmann, for instance, reads it as self-mastery and sublimation), so the lecturer's reading is one possible reading among several.", "nl": "The 'overman' in Thus Spoke Zarathustra is a symbol of self-overcoming and value-creation, not a fixed moral perfection. Interpreters disagree on its exact sense (Kaufmann, for instance, reads it as self-mastery and sublimation), so the lecturer's reading is one possible reading among several."}, "sources": ["src:be246c9f9b", "src:afae93d162"], "flags": ["contested", "editor-note"]}], "links": [{"to": "phil:absurd-meaning", "rel": "see-also", "note": {"fa": "پوچی و معنا در کامو و فرانکل", "en": "Absurdity and meaning in Camus and Frankl", "nl": "Absurdity and meaning in Camus and Frankl"}}, {"to": "soc:secularization", "rel": "see-also", "note": {"fa": "سکولار شدن و دین در جامعهٔ مدرن", "en": "Secularization and religion in modern society", "nl": "Secularization and religion in modern society"}}, {"to": "psy:meaning-making", "rel": "bridges", "note": {"fa": "معنا در روان‌شناسی وجودی", "en": "Meaning in existential psychology", "nl": "Meaning in existential psychology"}}, {"to": "phil:wisdom-good-pleasant-meaningful", "rel": "contrasts", "note": {"fa": "چارچوب مثلث سخنران برای زندگی مطلوب", "en": "The lecturer's triangle for a good life", "nl": "The lecturer's triangle for a good life"}}], "people": ["core:friedrich-nietzsche", "core:walter-kaufmann"], "sources": ["src:3368519066", "src:5da9a8e07a", "src:873416a5d1", "src:afae93d162", "src:be246c9f9b"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:trolley", "kind": "concept", "title": {"fa": "مسئلهٔ تراموا و دو نظام داوری اخلاقی", "en": "The trolley problem and two systems of moral judgment", "nl": "Het trolleyprobleem en twee systemen van moreel oordeel"}, "aliases": [], "parent": "phil:ethics", "field": "phil:ethics", "summary": {"fa": "تراموایی پنج نفر را می‌کشد؛ با کشیدن اهرم یک نفر می‌میرد. اکثریت اهرم را می‌کشند. اگر برای نجات پنج نفر باید یک نفر را از روی پل هل دهید، اکثریت نمی‌کنند. چرا؟ گرین نشان داد نسخهٔ دوم مناطق هیجانی مغز را درگیر می‌کند؛ اخلاق ما دو موتور دارد که همیشه با هم نمی‌خوانند.", "en": "A trolley will kill five; pulling a lever kills one instead. Most pull. If saving five requires pushing one man off a bridge, most refuse. Why? Greene showed the second version engages emotional brain regions; our morality has two engines that do not always agree.", "nl": "Een tram zal vijf mensen doden; een hendel overhalen doodt in plaats daarvan één. De meesten halen over. Als je om vijf te redden één man van een brug moet duwen, weigeren de meesten. Waarom? Greene toonde dat de tweede versie emotionele hersengebieden aanspreekt; onze moraal heeft twee motoren die niet altijd samengaan."}, "points": [{"text": {"fa": "فوت (۱۹۶۷) و تامسون (۱۹۸۵): مسئله برای آزمودن «اصل اثر دوگانه» ساخته شد: فرق هست میان کشتن به‌عنوان وسیله (هل دادن) و مرگ به‌عنوان پیامد پیش‌بینی‌شده (اهرم).", "en": "Foot (1967) and Thomson (1985): the problem was built to test the \"doctrine of double effect\": there is a difference between killing as a means (pushing) and death as a foreseen side effect (the lever).", "nl": "Foot (1967) and Thomson (1985): the problem was built to test the \"doctrine of double effect\": there is a difference between killing as a means (pushing) and death as a foreseen side effect (the lever)."}, "sources": ["src:97a4e96aa0", "src:c224580718"], "flags": []}, {"text": {"fa": "گرین و همکاران (۲۰۰۱): معماهای «شخصی» (هل دادن) مناطق هیجانی و معماهای «غیرشخصی» (اهرم) مناطق کنترل شناختی را بیشتر فعال می‌کنند؛ «نظریهٔ دوفرایندی» داوری اخلاقی. تکرارها اصل الگو را تأیید و جزئیات آناتومیک را تعدیل کرده‌اند.", "en": "Greene et al. (2001): \"personal\" dilemmas (pushing) activate emotional regions more, \"impersonal\" ones (the lever) cognitive-control regions; the \"dual-process theory\" of moral judgment. Replications have confirmed the broad pattern and revised the anatomical details.", "nl": "Greene et al. (2001): \"personal\" dilemmas (pushing) activate emotional regions more, \"impersonal\" ones (the lever) cognitive-control regions; the \"dual-process theory\" of moral judgment. Replications have confirmed the broad pattern and revised the anatomical details."}, "sources": ["src:2a1a13399f"], "flags": ["contested"]}, {"text": {"fa": "هایت (۲۰۰۱): داوری اخلاقی بیشتر شهودی و سریع است و استدلال بعداً برای توجیه می‌آید («سگ هیجانی و دم عقلانی‌اش»)؛ وقتی توجیهی پیدا نمی‌کنیم و باز هم بر داوری می‌مانیم، «لال شدن اخلاقی» رخ می‌دهد.", "en": "Haidt (2001): moral judgment is mostly fast and intuitive, with reasoning arriving afterwards to justify (\"the emotional dog and its rational tail\"); when we find no justification yet hold the judgment, \"moral dumbfounding\" occurs.", "nl": "Haidt (2001): moral judgment is mostly fast and intuitive, with reasoning arriving afterwards to justify (\"the emotional dog and its rational tail\"); when we find no justification yet hold the judgment, \"moral dumbfounding\" occurs."}, "sources": ["src:11a1bafc17"], "flags": []}], "links": [{"to": "psy:phil-ethics", "rel": "same-as", "note": {"fa": "اخلاق در ویکی روان", "en": "Ethics in the psychology wiki", "nl": "Ethics in the psychology wiki"}}, {"to": "psy:moral-hypocrisy", "rel": "bridges", "note": {"fa": "ریاکاری اخلاقی", "en": "Moral hypocrisy", "nl": "Moral hypocrisy"}}, {"to": "phil:three-theories", "rel": "prerequisite", "note": {"fa": "سه نظریهٔ اخلاقی", "en": "The three moral theories", "nl": "The three moral theories"}}], "people": ["core:philippa-foot", "core:joshua-greene", "core:jonathan-haidt"], "sources": ["src:11a1bafc17", "src:2a1a13399f", "src:97a4e96aa0", "src:c224580718"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:hafez-monopoly-truth-virtue", "kind": "concept", "title": {"fa": "حافظ و منطق انحصار حقیقت و فضیلت: از موعظه تا دخالت", "en": "Hafez and the logic of claimed monopolies on truth and virtue", "nl": "Hafez en de logica van het claimen van waarheid en deugd"}, "aliases": [], "parent": "phil:political", "field": "phil:political", "summary": {"fa": "در این خوانش، شخصیت‌های تکرارشونده در دیوان حافظ (واعظ، زاهد، شیخ، مفتی، فقیه، محتسب، صوفی) یک منطق مشترک دارند: ادعای مالکیت حقیقت و ادعای مالکیت فضیلت. از این دو ادعا حق قضاوت دربارهٔ دیگران و بعد حق دخالت در زندگی آنان بیرون می‌آید. چون این تصویر پاک با واقعیت انسانی نمی‌خواند، ریا برای بقای چنین جایگاهی لازم می‌شود. این تفسیر نظر سخنران است و یکی از خوانش‌های ممکن از حافظ است.", "en": "In this reading, the recurring figures of Hafez's Divan (preacher, ascetic, sheikh, mufti, jurist, market-inspector, Sufi) share one logic: a claim to own truth and a claim to own virtue. From these two claims comes a right to judge others and then a right to interfere in their lives. Because the pure image cannot match human reality, hypocrisy becomes necessary to keep the position. This is the lecturer's interpretation, one of several possible readings of Hafez.", "nl": "In deze lezing delen de terugkerende figuren in Hafez' Divan (predikant, asceet, sjeik, moefti, jurist, marktinspecteur) één logica: een aanspraak op waarheid en op deugd, die leidt tot oordelen over en ingrijpen in andermans leven. Dit is de interpretatie van de spreker."}, "points": [{"text": {"fa": "به گفتهٔ سخنران، دو ادعای بنیادین در پشت این شخصیت‌ها هست: ادعای انحصار حقیقت (من بهتر از همه حقیقت را می‌شناسم و حق تفسیرش با من است) و ادعای انحصار فضیلت (من پاک‌تر و باتقواتر از دیگرانم). این دو یکدیگر را تأیید می‌کنند.", "en": "Per the lecturer, two founding claims lie behind these figures: a monopoly on truth (I know it best and may interpret it) and a monopoly on virtue (I am purer than others). The two reinforce each other.", "nl": "Per the lecturer, two founding claims lie behind these figures: a monopoly on truth (I know it best and may interpret it) and a monopoly on virtue (I am purer than others). The two reinforce each other."}, "sources": ["src:97e4c77b3a"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، زنجیره چنین پیش می‌رود: ادعای حقیقت و فضیلت، حق قضاوت دربارهٔ دیگران، حق تصمیم‌گیری دربارهٔ شیوهٔ زندگی آنان (نوشیدن، خوردن، کتاب، موسیقی، پوشش، عبادت)، و در نهایت نصیحت به حکم، حکم به فتوا و فتوا به نظارت و قدرت تبدیل می‌شود.", "en": "Per the lecturer, the chain runs: claim of truth and virtue, right to judge others, right to decide how they live (drink, food, books, music, dress, worship), until advice becomes command, command becomes ruling and ruling becomes surveillance and power.", "nl": "Per the lecturer, the chain runs: claim of truth and virtue, right to judge others, right to decide how they live (drink, food, books, music, dress, worship), until advice becomes command, command becomes ruling and ruling becomes surveillance and power."}, "sources": ["src:97e4c77b3a"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، چون صاحب این جایگاه باید همیشه بی‌لغزش دیده شود، ناچار تصویری آرمانی از خودش می‌سازد. فاصلهٔ این تصویر با واقعیت انسانی همان چیزی است که حافظ «تزویر و ریا» می‌نامد؛ پس ریا در این خوانش یک ضعف شخصی نیست، بلکه شرط بقای جایگاه است.", "en": "Per the lecturer, since the holder of such a position must always look flawless, he must build an ideal image of himself. The gap between that image and human reality is what Hafez calls hypocrisy; so hypocrisy is not a personal weakness here but a condition for the position's survival.", "nl": "Per the lecturer, since the holder of such a position must always look flawless, he must build an ideal image of himself. The gap between that image and human reality is what Hafez calls hypocrisy; so hypocrisy is not a personal weakness here but a condition for the position's survival."}, "sources": ["src:97e4c77b3a"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، مسئلهٔ حافظ خودِ گناه نیست، چون همهٔ آدم‌ها خطاکارند؛ مسئله ادعای بی‌گناهی و برتری اخلاقی است. شاهدش این است که حافظ در یک بیت مشهور خودش را هم در کنار شیخ و مفتی و محتسب می‌گذارد و برتری اخلاقی برای خود نمی‌خواهد. سخنران می‌گوید ممکن است این کار احتیاط شاعرانه هم بوده باشد.", "en": "Per the lecturer, Hafez's problem is not sin itself, since all people err, but the claim to innocence and moral superiority. As evidence he points to a famous line where Hafez includes himself among the sheikh, mufti and inspector. He adds that this may also be poetic caution.", "nl": "Per the lecturer, Hafez's problem is not sin itself, since all people err, but the claim to innocence and moral superiority. As evidence he points to a famous line where Hafez includes himself among the sheikh, mufti and inspector. He adds that this may also be poetic caution."}, "sources": ["src:97e4c77b3a"], "flags": ["editor-note"]}, {"text": {"fa": "خوانش سیاسی-اجتماعیِ سخنران تنها خوانش ممکن نیست. بسیاری از پژوهشگران حافظ، ریاکاری‌نمایی و رندی را در سنت عرفانی و ملامتی و در بافت دربار و شهر شیراز می‌فهمند، و تفسیرهای عرفانی، اجتماعی و ادبی کنار هم دوام آورده‌اند. همچنین متن ابیات در تصحیح‌های گوناگون دیوان کمی فرق دارد و نتیجه‌گیری از یک بیت منفرد باید با احتیاط باشد.", "en": "The lecturer's socio-political reading is not the only one. Many Hafez scholars place the hypocrisy theme and the figure of the rend within Sufi and malamati traditions and the court and city life of Shiraz; mystical, social and literary readings coexist. Verse wording also varies between critical editions, so conclusions from a single line need care.", "nl": "The lecturer's socio-political reading is not the only one. Many Hafez scholars place the hypocrisy theme and the figure of the rend within Sufi and malamati traditions and the court and city life of Shiraz; mystical, social and literary readings coexist. Verse wording also varies between critical editions, so conclusions from a single line need care."}, "sources": ["src:5d11ebe051", "src:16e730f547"], "flags": ["contested", "editor-note"]}], "links": [{"to": "psy:moral-hypocrisy", "rel": "see-also", "note": {"fa": "ریاکاری اخلاقی در روان‌شناسی: قضاوت سخت‌گیرانه‌تر دربارهٔ دیگران", "en": "Moral hypocrisy in psychology: judging others more harshly than oneself", "nl": "Moral hypocrisy in psychology: judging others more harshly than oneself"}}, {"to": "phil:two-liberties", "rel": "bridges", "note": {"fa": "آزادی منفی و دخالت در شیوهٔ زندگی دیگران", "en": "Negative liberty and interference in how others live", "nl": "Negative liberty and interference in how others live"}}, {"to": "phil:hafez-rend-sincerity-vs-display", "rel": "contrasts", "note": {"fa": "رند به‌عنوان بدیل صداقت", "en": "The rend as the alternative of sincerity", "nl": "The rend as the alternative of sincerity"}}, {"to": "phil:political", "rel": "part-of", "note": {"fa": "فلسفهٔ سیاسی", "en": "Political philosophy", "nl": "Political philosophy"}}], "people": ["core:hafez-of-shiraz-shams-al-din-muhammad-hafez", "core:darwin-sabouri"], "sources": ["src:16e730f547", "src:5d11ebe051", "src:97e4c77b3a"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:epistemology", "kind": "field", "title": {"fa": "معرفت‌شناسی", "en": "Epistemology", "nl": "Kennistheorie"}, "aliases": [], "parent": "phil:phil", "field": null, "summary": {"fa": "دانستن چیست، کِی باور موجه است، و چه کسی شنیده می‌شود؟", "en": "What is knowing, when is belief justified, and who gets heard?", "nl": "Wat is weten, wanneer is een overtuiging gerechtvaardigd, en wie wordt gehoord?"}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:life", "kind": "field", "title": {"fa": "فلسفهٔ زندگی", "en": "Philosophy of life", "nl": "Levensfilosofie"}, "aliases": [], "parent": "phil:phil", "field": null, "summary": {"fa": "رواقیان، اگزیستانسیالیست‌ها و معنا: فلسفه به‌عنوان تمرین، نه فقط نظریه.", "en": "Stoics, existentialists and meaning: philosophy as practice, not only theory.", "nl": "Stoïcijnen, existentialisten en zin: filosofie als oefening, niet alleen theorie."}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:free-will", "kind": "concept", "title": {"fa": "ارادهٔ آزاد: لیبت، فرانکفورت و سازگارگرایی", "en": "Free will: Libet, Frankfurt and compatibilism", "nl": "Vrije wil: Libet, Frankfurt en compatibilisme"}, "aliases": [], "parent": "phil:mind", "field": "phil:mind", "summary": {"fa": "اگر هر تصمیم را حالت قبلی مغز تعیین می‌کند، آزادی کجاست؟ آزمایش لیبت نشان داد فعالیت مغز پیش از «احساس تصمیم» شروع می‌شود، اما تفسیرش محل بحث است. سازگارگرایان می‌گویند آزادی یعنی عمل کردن بر اساس خواسته‌هایی که خودت تأییدشان می‌کنی، نه رهایی از علیت.", "en": "If every decision is fixed by the prior state of the brain, where is freedom? Libet's experiment showed brain activity begins before the \"feeling of deciding\", but its interpretation is disputed. Compatibilists say freedom means acting on desires you yourself endorse, not escaping causation.", "nl": "Als elke beslissing wordt bepaald door de vorige toestand van het brein, waar is dan de vrijheid? Libets experiment toonde dat hersenactiviteit begint vóór het \"gevoel van beslissen\", maar de interpretatie is omstreden. Compatibilisten zeggen dat vrijheid betekent handelen naar verlangens die je zelf onderschrijft, niet ontsnappen aan causaliteit."}, "points": [{"text": {"fa": "لیبت (۱۹۸۳): «پتانسیل آمادگی» حدود ۳۵۰ میلی‌ثانیه پیش از آنکه آزمودنی گزارش کند «تصمیم گرفتم» آغاز می‌شود؛ خود لیبت نتیجه گرفت آگاهی حق «وتو» دارد.", "en": "Libet (1983): the \"readiness potential\" begins about 350 milliseconds before the subject reports \"I decided\"; Libet himself concluded consciousness retains a \"veto\".", "nl": "Libet (1983): the \"readiness potential\" begins about 350 milliseconds before the subject reports \"I decided\"; Libet himself concluded consciousness retains a \"veto\"."}, "sources": ["src:15efed7dc1"], "flags": []}, {"text": {"fa": "شورگر و همکاران (۲۰۱۲): پتانسیل آمادگی ممکن است نه «تصمیم ناخودآگاه»، که نوسان تصادفی فعالیت باشد که وقتی از آستانه بگذرد حرکت را می‌اندازد؛ یعنی آزمایش لیبت دربارهٔ ارادهٔ آزاد کمتر از آنچه مشهور شد می‌گوید.", "en": "Schurger et al. (2012): the readiness potential may be not an \"unconscious decision\" but random fluctuation of activity that triggers movement when it crosses a threshold; so Libet's experiment says less about free will than its fame suggests.", "nl": "Schurger et al. (2012): the readiness potential may be not an \"unconscious decision\" but random fluctuation of activity that triggers movement when it crosses a threshold; so Libet's experiment says less about free will than its fame suggests."}, "sources": ["src:c758d9c037"], "flags": ["contested"]}, {"text": {"fa": "فرانکفورت (۱۹۷۱): شخص بودن یعنی داشتن «خواسته‌های مرتبهٔ دوم»: معتادی که می‌خواهد نخواهد، با معتادی که از اعتیادش راضی است فرق دارد؛ آزادی اراده یعنی هماهنگی خواسته‌ها با این مرتبهٔ بالاتر، فارغ از جبر فیزیکی.", "en": "Frankfurt (1971): being a person means having \"second-order desires\": the addict who wishes not to want differs from the addict content with addiction; freedom of the will is the fit between desires and this higher order, regardless of physical determinism.", "nl": "Frankfurt (1971): being a person means having \"second-order desires\": the addict who wishes not to want differs from the addict content with addiction; freedom of the will is the fit between desires and this higher order, regardless of physical determinism."}, "sources": ["src:2c51e9c7e5"], "flags": []}], "links": [{"to": "psy:akrasia", "rel": "bridges", "note": {"fa": "ضعف اراده در ویکی روان", "en": "Weakness of will in the psychology wiki", "nl": "Weakness of will in the psychology wiki"}}, {"to": "psy:addiction", "rel": "bridges", "note": {"fa": "اعتیاد و خواسته‌های مرتبهٔ دوم", "en": "Addiction and second-order desires", "nl": "Addiction and second-order desires"}}, {"to": "tabar:genetic-essentialism", "rel": "bridges", "note": {"fa": "جبر ژنتیکی", "en": "Genetic determinism", "nl": "Genetic determinism"}}], "people": ["core:harry-frankfurt", "core:daniel-dennett"], "sources": ["src:15efed7dc1", "src:2c51e9c7e5", "src:c758d9c037"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:meaning-identity-uprooting-jozani", "kind": "concept", "title": {"fa": "معنا، هویت و دوری از وطن: انسان در پیوند با فرهنگ و اسطوره", "en": "Meaning, identity and uprooting: the person embedded in culture and myth", "nl": "Betekenis, identiteit en ontworteling: de mens ingebed in cultuur en mythe"}, "aliases": [], "parent": "phil:life", "field": "phil:life", "summary": {"fa": "به گفتهٔ جعفری جوزانی هیچ چیز به‌تنهایی معنا ندارد؛ هر چیز با پیرامونش و گذشته‌اش معنا می‌یابد. او انسان ایرانی را جدا از اسطوره و تاریخش نمی‌داند، بخش بزرگی از زندگی را جبر (خانواده، طبقه، محل تولد) می‌شمارد و می‌گوید دوری از وطن به او امکان داد خود و فرهنگش را از بیرون ببیند و بیشتر دوست بدارد. اخلاق را هم در شرم‌ساری از کار بد و امکان رستگاری می‌بیند.", "en": "Per Jafari Jozani, nothing has meaning alone; things gain meaning from their surroundings and past. He sees the Iranian person as inseparable from myth and history, counts much of life as given (family, class, birthplace), and says distance from home let him see himself and his culture from outside and love it more. He locates ethics in shame at wrongdoing and the possibility of redemption.", "nl": "Volgens Jafari Jozani heeft niets op zichzelf betekenis; alles krijgt die uit zijn omgeving en verleden. Hij ziet de Iraanse mens als onlosmakelijk van mythe en geschiedenis, noemt veel van het leven gegeven (gezin, klasse, geboorteplaats) en zegt dat afstand van huis hem liet zien en liefhebben wat hij achterliet. Ethiek ziet hij in schaamte over fout gedrag en de kans op verlossing."}, "points": [{"text": {"fa": "به گفتهٔ سخنران، یک درخت «به‌خودی‌خود» وجود ندارد؛ معنایش از بالا و پایین و کنارش می‌آید. انسان ایرانی یا آلمانی هم به گذشته‌ای که با آن پیوند دارد وابسته است و افکار مثل ذره‌هایی در هوا می‌چرخند و از راه رسانه‌ها به ما می‌رسند. او مثال می‌زند که گوته با حافظ آشنا شد و تعصب فرهنگی‌اش شکست.", "en": "Per the lecturer, a tree does not exist 'on its own'; it gets meaning from what is above, below and beside it. The Iranian or German person likewise depends on the past they connect with, and ideas circulate like particles in the air and reach us through media. He cites Goethe meeting Hafez and loosening his cultural pride.", "nl": "Per the lecturer, a tree does not exist 'on its own'; it gets meaning from what is above, below and beside it. The Iranian or German person likewise depends on the past they connect with, and ideas circulate like particles in the air and reach us through media. He cites Goethe meeting Hafez and loosening his cultural pride."}, "sources": ["src:93b2d62ade"], "flags": ["editor-note"]}, {"text": {"fa": "گوته واقعاً «دیوان غربی-شرقی» (۱۸۱۹) را با الهام از حافظ نوشت. این بخش از نظر تاریخی درست است.", "en": "Goethe did write the West-Eastern Divan (1819) inspired by Hafez; this part is historically accurate.", "nl": "Goethe did write the West-Eastern Divan (1819) inspired by Hafez; this part is historically accurate."}, "sources": ["src:c7f829dc0e"], "flags": []}, {"text": {"fa": "به گفتهٔ سخنران، دو نگاه به معنا هست: نگاه عرفانی که معنا را در جهان موجود می‌داند و باید کشف شود، و نگاه غیرمذهبی که معنا را ما می‌سازیم (مثل نوروز). او خوب و بد را در جایی «خوب» می‌نامد که به سود دیگری هم باشد. این تصویر که فلسفهٔ تحلیلی «معنا را اصلاً وجود نداشته» می‌داند ساده‌سازی است؛ بسیاری از فیلسوفان تحلیلی مانند درک پارفیت واقع‌گرایی اخلاقی را دفاع کرده‌اند. دیدگاه «خوب و بد در ذهن ماست» هم در هملت شکسپیر آمده اما نظر شخصیت است، نه فلسفهٔ خود نویسنده.", "en": "Per the lecturer there are two stances on meaning: a mystical one where meaning exists in the world and must be discovered, and a secular one where we make it (as with Nowruz). He calls something 'good' where it benefits others too. His picture of analytic philosophy as holding that meaning does not exist is a simplification; many analytic philosophers, such as Derek Parfit, defend moral realism. The 'good and bad are in the mind' line is Hamlet's, a character's view rather than Shakespeare's own philosophy.", "nl": "Per the lecturer there are two stances on meaning: a mystical one where meaning exists in the world and must be discovered, and a secular one where we make it (as with Nowruz). He calls something 'good' where it benefits others too. His picture of analytic philosophy as holding that meaning does not exist is a simplification; many analytic philosophers, such as Derek Parfit, defend moral realism. The 'good and bad are in the mind' line is Hamlet's, a character's view rather than Shakespeare's own philosophy."}, "sources": ["src:93b2d62ade", "src:d7c9ca0fb6", "src:8a09b13976"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، کسی که می‌داند کارش بد است و شرم می‌کند هنوز امکان رستگاری دارد، اما کسی که کار بد را «زرنگی» می‌داند خطرناک می‌شود. به نظر او قانون هم قاعده‌ای است که برای زندگی بهتر آیندگان ساخته‌ایم و علوم انسانی گنجینهٔ درس‌های گذشتگان، حتی از اشتباهاتشان، است.", "en": "Per the lecturer, someone who knows an act is wrong and feels shame still has a chance of redemption, whereas someone who counts the wrong as cleverness becomes dangerous. He sees law as rules we make for a better life for those after us, and the humanities as a store of lessons from predecessors, even from their mistakes.", "nl": "Per the lecturer, someone who knows an act is wrong and feels shame still has a chance of redemption, whereas someone who counts the wrong as cleverness becomes dangerous. He sees law as rules we make for a better life for those after us, and the humanities as a store of lessons from predecessors, even from their mistakes."}, "sources": ["src:93b2d62ade"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، بیش از ۹۰ درصد زندگی جبر است: خانواده، ملیت، طبقه و حتی اینکه عاشق چه کسی شویم. او می‌گوید مهاجرت و دوری از محیط به او فرصت داد خودش و فرهنگش را نقد و بعد بیشتر دوست داشته باشد. رقم ۹۰ درصد برداشت شخصی است نه یافتهٔ پژوهشی؛ بحث ارادهٔ آزاد و جبر پیچیده است و پژوهش‌ها دربارهٔ اینکه آیا مهاجران وطن‌دوست‌ترند یا نه نتیجهٔ یکسان ندارند.", "en": "Per the lecturer, over 90 percent of life is given: family, nationality, class, even whom we fall in love with. He says leaving home let him examine his culture and then love it more. The 90 percent figure is a personal impression, not a research finding; the free will versus determinism debate is complex, and studies of whether emigrants become more patriotic give mixed results.", "nl": "Per the lecturer, over 90 percent of life is given: family, nationality, class, even whom we fall in love with. He says leaving home let him examine his culture and then love it more. The 90 percent figure is a personal impression, not a research finding; the free will versus determinism debate is complex, and studies of whether emigrants become more patriotic give mixed results."}, "sources": ["src:93b2d62ade"], "flags": ["contested", "editor-note"]}], "links": [{"to": "phil:personal-identity", "rel": "see-also", "note": {"fa": "من کیستم و چه چیز مرا همان نگه می‌دارد", "en": "Who I am and what keeps me the same", "nl": "Who I am and what keeps me the same"}}, {"to": "phil:absurd-meaning", "rel": "contrasts", "note": {"fa": "معنا کشف‌شدنی است یا ساخته‌شدنی", "en": "Is meaning discovered or made", "nl": "Is meaning discovered or made"}}, {"to": "phil:free-will", "rel": "see-also", "note": {"fa": "جبر در برابر انتخاب در زندگی", "en": "Determinism versus choice in life", "nl": "Determinism versus choice in life"}}, {"to": "phil:moral-luck", "rel": "see-also", "note": {"fa": "نقش بخت تولد در اخلاق", "en": "The role of birth luck in ethics", "nl": "The role of birth luck in ethics"}}], "people": ["core:johann-wolfgang-von-goethe", "core:hafez-of-shiraz", "core:derek-parfit"], "sources": ["src:8a09b13976", "src:93b2d62ade", "src:c7f829dc0e", "src:d7c9ca0fb6"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:iranian-irfan-single-line", "kind": "concept", "title": {"fa": "عرفان ایرانی به‌مثابه «یک خط» و جایگاه تن: دیدگاه فتاحی", "en": "Iranian mysticism as \"one line\", and the status of the body: Fattahi's view", "nl": "Iraanse mystiek als \"één lijn\" en de status van het lichaam: Fattahi's visie"}, "aliases": [], "parent": "phil:iranian", "field": "phil:iranian", "summary": {"fa": "فتاحی عرفان ایرانی را سرچشمهٔ فلسفی همهٔ جلوه‌های «جهان ایرانی» می‌داند و باور دارد از پیش از زرتشت تا مانی و سهروردی و مولانا یک خط پیوسته بوده و برچسب‌های دینی انحراف از آن‌اند. او همچنین می‌گوید در این نگاه تن پست نیست بلکه ابزار جان است. این یک تز تفسیری است و پژوهشگران بسیاری آن را ساده‌سازی می‌دانند.", "en": "Fattahi treats Iranian mysticism (irfan) as the philosophical source of all expressions of the \"Iranian world\", and believes there is one continuous line from before Zoroaster through Mani, Suhrawardi and Rumi, with religious labels being deviations from it. He also says the body is not despised here but is the soul's instrument. This is an interpretive thesis that many scholars regard as a simplification.", "nl": "Fattahi ziet de Iraanse mystiek (irfan) als filosofische bron van de \"Iraanse wereld\" en denkt dat er één ononderbroken lijn loopt van vóór Zoroaster via Mani en Suhrawardi tot Roemi; religieuze labels zijn voor hem afwijkingen. Dit is een interpretatieve stelling die door veel onderzoekers als vereenvoudiging wordt gezien."}, "points": [{"text": {"fa": "به گفتهٔ سخنران، پایهٔ فلسفی و هستی‌شناسانهٔ «جهان ایرانی» را باید در عرفان ایرانی جست؛ منظور او از عرفان همان «معرفت» است، نه فقط یک رویکرد دینی. او منابع شناخت آن را مثنوی و غزلیات شمس، آثار سهروردی، تذکرةالاولیا، حافظ، خیام، حلاج، شاهنامه و نظامی و همچنین زروان، آیین مهر، زرتشت و مانی می‌شمارد.", "en": "Per the lecturer, the philosophical and ontological base of the \"Iranian world\" is Iranian mysticism, where by irfan he means \"knowledge\" (ma'rifa) rather than merely a religious approach. As sources he lists Rumi's Masnavi and Divan of Shams, Suhrawardi, Attar's Tazkirat al-Awliya, Hafez, Khayyam, Hallaj, the Shahnameh and Nizami, plus Zurvan, the Mithra cult, Zoroaster and Mani.", "nl": "Per the lecturer, the philosophical and ontological base of the \"Iranian world\" is Iranian mysticism, where by irfan he means \"knowledge\" (ma'rifa) rather than merely a religious approach. As sources he lists Rumi's Masnavi and Divan of Shams, Suhrawardi, Attar's Tazkirat al-Awliya, Hafez, Khayyam, Hallaj, the Shahnameh and Nizami, plus Zurvan, the Mithra cult, Zoroaster and Mani."}, "sources": ["src:d7a70608b6"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، زرتشتی‌گری، مسیحیت، مانوی‌گری و اسلام در بنیان از یک حقیقت حرف می‌زنند و برچسب‌های دینی انحراف از «خط اصلی» عرفان ایرانی‌اند؛ بنابراین حتی تفکیک ادیان ابراهیمی و غیرابراهیمی مسئله‌ساز است. مفهوم «وحدت وجود» و ایدهٔ «انسان کامل» (که در هر زمان هست و ممکن است ناشناس باشد) را او مرکزی می‌داند. او می‌گوید حکیم یا عارف از چیزی که دیده سخن می‌گوید و اعتبارش از آگاهی است نه از انباشت دانش.", "en": "Per the lecturer, Zoroastrianism, Christianity, Manichaeism and Islam speak at root of one truth, and religious labels are deviations from the \"main line\" of Iranian mysticism, so even the split between Abrahamic and non-Abrahamic religions becomes problematic. He treats \"unity of being\" (wahdat al-wujud) and the \"perfect human\" (present in every age, possibly unrecognised) as central, and says the sage speaks of what he has seen, his authority coming from awareness rather than accumulated information.", "nl": "Per the lecturer, Zoroastrianism, Christianity, Manichaeism and Islam speak at root of one truth, and religious labels are deviations from the \"main line\" of Iranian mysticism, so even the split between Abrahamic and non-Abrahamic religions becomes problematic. He treats \"unity of being\" (wahdat al-wujud) and the \"perfect human\" (present in every age, possibly unrecognised) as central, and says the sage speaks of what he has seen, his authority coming from awareness rather than accumulated information."}, "sources": ["src:d7a70608b6"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، در نگاه ایرانی تن و زمین پست نیستند؛ تن ابزار جان است و نباید جایش با جان عوض شود. او این را با سنت‌هایی مقایسه می‌کند که به نظرش تن را جای گناه می‌دانند و به بحث نیچه دربارهٔ تحقیر تن اشاره می‌کند. او همچنین می‌گوید آگاهی در این جهان مثل علم تکاملی و انباشتی نیست و ممکن است مغی در دورهٔ هخامنشی به همان سطح آگاهی برسد که عارفی امروز.", "en": "Per the lecturer, in the Iranian view the body and the earth are not low; the body is the soul's instrument and the two must not swap places. He contrasts this with traditions that in his view treat the body as the seat of sin, and refers to Nietzsche's discussion of the devaluing of the body. He also says awareness here is not cumulative like science, so a Magian priest in the Achaemenid era could have reached the same level as a mystic today.", "nl": "Per the lecturer, in the Iranian view the body and the earth are not low; the body is the soul's instrument and the two must not swap places. He contrasts this with traditions that in his view treat the body as the seat of sin, and refers to Nietzsche's discussion of the devaluing of the body. He also says awareness here is not cumulative like science, so a Magian priest in the Achaemenid era could have reached the same level as a mystic today."}, "sources": ["src:d7a70608b6"], "flags": ["editor-note"]}, {"text": {"fa": "دیدگاه رایج پژوهشی: سهروردی «حکمت خسروانی» را یک سلسلهٔ فلسفی در ذهن خود ساخت و آن را به ایرانیان باستان نسبت داد؛ این پیوند بیشتر نوعی روایت فلسفی است تا تداوم تاریخی اثبات‌شده (هانری کربن آن را با علاقه‌ای ویژه بازخوانی کرد). آموزه‌های زرتشت، مانی و عارفان مسلمان در مسائلی مهم مثل دوگانگی خیر و شر و وحدت وجود تفاوت جدی دارند، و وحدت وجود را بیشتر با ابن‌عربی (اهل اندلس) می‌شناسند. تصوف هم ریشه‌های گوناگون و غیرایرانی دارد. تصویر ادیان ابراهیمی به‌عنوان بدن‌ستیز هم ساده‌سازی است، چون یهودیت و اسلام تن را ارج می‌نهند و مسیحیت دیدگاه‌های متفاوتی داشته است. برخی منتقدان «ایران معنوی» را ذات‌گرایی می‌دانند.", "en": "Mainstream scholarly view: Suhrawardi built the \"Khusrawani wisdom\" lineage as a philosophical genealogy and attributed it to ancient Iranians; this link is better read as a philosophical narrative than as proven historical continuity (Henry Corbin revived it with particular interest). The teachings of Zoroaster, Mani and the Muslim mystics differ sharply on key matters such as the duality of good and evil versus unity of being, and wahdat al-wujud is mostly associated with Ibn Arabi (from al-Andalus). Sufism also has varied, non-Iranian roots. Portraying Abrahamic religions as hostile to the body is also a simplification: Judaism and Islam affirm the body, and Christianity has held varied views. Some critics call the idea of a \"spiritual Iran\" essentialist.", "nl": "Mainstream scholarly view: Suhrawardi built the \"Khusrawani wisdom\" lineage as a philosophical genealogy and attributed it to ancient Iranians; this link is better read as a philosophical narrative than as proven historical continuity (Henry Corbin revived it with particular interest). The teachings of Zoroaster, Mani and the Muslim mystics differ sharply on key matters such as the duality of good and evil versus unity of being, and wahdat al-wujud is mostly associated with Ibn Arabi (from al-Andalus). Sufism also has varied, non-Iranian roots. Portraying Abrahamic religions as hostile to the body is also a simplification: Judaism and Islam affirm the body, and Christianity has held varied views. Some critics call the idea of a \"spiritual Iran\" essentialist."}, "sources": ["src:e6aed343c6", "src:508eb73995"], "flags": ["contested", "editor-note"]}], "links": [{"to": "phil:illumination", "rel": "see-also", "note": {"fa": "حکمت اشراق سهروردی", "en": "Suhrawardi's illuminationism", "nl": "Suhrawardi's illuminationism"}}, {"to": "phil:iranian", "rel": "part-of", "note": {"fa": "فلسفهٔ ایرانی-اسلامی", "en": "Iranian-Islamic philosophy", "nl": "Iranian-Islamic philosophy"}}, {"to": "phil:iranian-world-aesthetics-inner-outer", "rel": "explains", "note": {"fa": "ریشهٔ فلسفی که سخنران برای زیبایی بناها می‌بیند", "en": "The philosophical root the lecturer sees for architectural beauty", "nl": "The philosophical root the lecturer sees for architectural beauty"}}], "people": ["core:shihab-al-din-yahya-suhrawardi", "core:henry-corbin", "core:jalal-al-din-rumi", "core:ibn-arabi"], "sources": ["src:508eb73995", "src:d7a70608b6", "src:e6aed343c6"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:omniscient-narrator-god-gambling", "kind": "concept", "title": {"fa": "راوی دانای کل، خدا، پیشگویی و میل به روایت‌شدن", "en": "The omniscient narrator, God, foretelling and the wish to be narrated", "nl": "De alwetende verteller, God, voorspelling en de wens verteld te worden"}, "aliases": [], "parent": "phil:life", "field": "phil:life", "summary": {"fa": "سخنران از انواع راوی در داستان (اول‌شخص، دانای کل) برای فهم نقش خدا، پدر و دیگری مهم زندگی استفاده می‌کند. نظر او این است که انسان هم شیفتهٔ کسی است که از آینده خبر دارد و هم می‌خواهد دیگری او را روایت کند، و بعد از او دلگیر می‌شود که چرا بهتر روایت نکرده. این تفسیرها روان‌شناختی و ادبی‌اند و برخی ادعاها (مانند ربط قمار با پرستش) اثبات‌شده نیستند.", "en": "The lecturer uses narrator types in fiction (first person, omniscient) to think about God, the father and the significant other. He argues people are drawn to whoever knows the future and want to be narrated by another, then resent that narrator for not doing better. These readings are literary and psychological, and some claims (such as gambling as worship) are not established.", "nl": "De spreker gebruikt vertellerstypen (ik-verteller, alwetend) om God, de vader en de geliefde te duiden. Mensen willen door een ander verteld worden en nemen die verteller later kwalijk dat het anders had gekund."}, "points": [{"text": {"fa": "به گفتهٔ سخنران، در داستان‌نویسی راوی می‌تواند اول‌شخص یا سوم‌شخص باشد و راوی دانای کل از ذهن همه و حتی از آینده خبر دارد. او خدا را «بزرگ‌ترین قصه‌گو» و دانای کل می‌داند و می‌گوید پیشگویی (کاهنان دلفی، شمن‌ها، معجزهٔ پیامبران) به همین دلیل مقام الهیاتی دارد؛ جامعه‌های شفاهی هم دانایی را در قالب قصه منتقل می‌کردند.", "en": "Per the lecturer, in fiction the narrator can be first or third person, and an omniscient narrator knows everyone's minds and even the future. He calls God the 'greatest storyteller' and omniscient, says foretelling (the Delphic priests, shamans, prophetic miracles) carries theological status for this reason, and notes that oral societies passed knowledge on through stories.", "nl": "Per the lecturer, in fiction the narrator can be first or third person, and an omniscient narrator knows everyone's minds and even the future. He calls God the 'greatest storyteller' and omniscient, says foretelling (the Delphic priests, shamans, prophetic miracles) carries theological status for this reason, and notes that oral societies passed knowledge on through stories."}, "sources": ["src:131af1a2fa"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، قمار ورزیدن شکلی از سنجیدن نسبت خود با آینده و امر قدسی است و او از قول یونگ می‌گوید «شانس» کهن‌الگوی خداست؛ پس قمارباز در هر دست می‌پرسد «نسبتم با خدا چقدر است؟». او می‌گوید این را یک بار به‌عنوان فرضیه مطرح کرده و بررسی مردم‌شناختی در این زمینه کم است.", "en": "Per the lecturer, gambling is a way of testing one's relation to the future and the sacred, and he says Jung held that 'chance' is an archetype of God, so each hand asks 'how do I stand with God?'. He presents this as his own hypothesis and notes little anthropological work exists on it.", "nl": "Per the lecturer, gambling is a way of testing one's relation to the future and the sacred, and he says Jung held that 'chance' is an archetype of God, so each hand asks 'how do I stand with God?'. He presents this as his own hypothesis and notes little anthropological work exists on it."}, "sources": ["src:131af1a2fa"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "نکتهٔ علمی: نتوانستم این ادعا را به متن مشخصی از یونگ ببندم و آن را تأییدشده نمی‌دانم. پژوهش‌های روان‌شناسی قمار معمولاً سازوکارهایی مانند یادگیری پاداش، «کم‌مانده بود» و خطاهای شناختی را توضیح می‌دهند؛ تفسیر دینی یا کهن‌الگویی یک خوانش نمادین است نه توضیح علمی.", "en": "Scholarly caveat: I could not tie this claim to a specific Jung text and do not treat it as established. Psychological research on gambling usually points to reward learning, near-misses and cognitive biases; a religious or archetypal reading is a symbolic interpretation, not a scientific explanation.", "nl": "Scholarly caveat: I could not tie this claim to a specific Jung text and do not treat it as established. Psychological research on gambling usually points to reward learning, near-misses and cognitive biases; a religious or archetypal reading is a symbolic interpretation, not a scientific explanation."}, "sources": ["src:131af1a2fa"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، ما دوست داریم عزیزانمان ما را «روایت کنند» و به صفت و کلمه تبدیلمان کنند، اما اگر کسی همه‌چیز را در دست بگیرد، بعد از مدتی می‌پرسیم «پس روایت خودم کو؟». او همین الگو را برای خدا و پدر هم می‌آورد: چون دانای کل بود، چرا زندگی ما را بهتر روایت نکرد؟ و پیشنهاد می‌کند بخشی از مسائل ما با «پدر» از اینجا می‌آید (اشاره به فروید).", "en": "Per the lecturer, we like loved ones to 'narrate' us and turn us into words and qualities, yet if one person takes over completely we later ask 'where is my own narrative?'. He applies the same pattern to God and father: being omniscient, why did they not narrate our lives better? He suggests part of our trouble with 'the father' comes from here (a nod to Freud).", "nl": "Per the lecturer, we like loved ones to 'narrate' us and turn us into words and qualities, yet if one person takes over completely we later ask 'where is my own narrative?'. He applies the same pattern to God and father: being omniscient, why did they not narrate our lives better? He suggests part of our trouble with 'the father' comes from here (a nod to Freud)."}, "sources": ["src:131af1a2fa"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، چون قصه‌ها سینه‌به‌سینه نقل می‌شدند، هر راوی چیزهایی از شرایط و مخاطب خودش به آن می‌افزود و همین تفاوت روایت‌های یک رویداد در متن‌های دینی را توضیح می‌دهد. نکتهٔ علمی: تحلیل تاریخی متن‌ها تفاوت‌ها را با ویرایش‌ها و سنت‌های جداگانه توضیح می‌دهد، اما باورمندان معمولاً تبیین‌های دینی دیگری (مانند وحی) دارند؛ این بحث میان تفسیر تاریخی و الهیاتی هنوز باز است.", "en": "Per the lecturer, because stories were passed on orally, each teller added something of their own situation and audience, which he uses to explain differing accounts of one event in religious texts. Caveat: historical-critical study explains differences through redaction and separate traditions, while believers usually give other explanations (such as revelation); the historical versus theological reading remains an open debate.", "nl": "Per the lecturer, because stories were passed on orally, each teller added something of their own situation and audience, which he uses to explain differing accounts of one event in religious texts. Caveat: historical-critical study explains differences through redaction and separate traditions, while believers usually give other explanations (such as revelation); the historical versus theological reading remains an open debate."}, "sources": ["src:131af1a2fa"], "flags": ["contested", "editor-note"]}], "links": [{"to": "phil:stories-memory-lying-fantasy", "rel": "see-also", "note": {"fa": "خاطره، دروغ و رویاپردازی", "en": "Memory, lying and fantasy", "nl": "Memory, lying and fantasy"}}, {"to": "phil:free-will", "rel": "bridges", "note": {"fa": "دانای کل و آزادی اراده", "en": "Omniscience and free will", "nl": "Omniscience and free will"}}, {"to": "phil:moral-luck", "rel": "see-also", "note": {"fa": "شانس و سرنوشت", "en": "Chance and fate", "nl": "Chance and fate"}}, {"to": "soc:sacred-and-taboo", "rel": "see-also", "note": {"fa": "امر قدسی", "en": "The sacred", "nl": "The sacred"}}], "people": ["core:carl-gustav-jung", "core:sigmund-freud"], "sources": ["src:131af1a2fa"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:absurd-meaning", "kind": "concept", "title": {"fa": "پوچی و معنا: کامو و فرانکل", "en": "Absurdity and meaning: Camus and Frankl", "nl": "Absurditeit en zin: Camus en Frankl"}, "aliases": [], "parent": "phil:life", "field": "phil:life", "summary": {"fa": "کامو: پوچی برخورد میل انسان به معنا با سکوت جهان است؛ پاسخ نه خودکشی است نه ایمانِ جهشی، بلکه شورش آگاهانه: «باید سیزیف را خوشبخت تصور کرد». فرانکل، از دل اردوگاه مرگ: انسان حتی در بدترین شرایط آزادی انتخاب نگرش را دارد و معنا را نه می‌سازد نه می‌یابد، بلکه «کشف» می‌کند: در کار، در عشق، و در رنجی که نمی‌شود تغییرش داد.", "en": "Camus: the absurd is the clash of the human longing for meaning with the silence of the world; the answer is neither suicide nor a leap of faith but conscious revolt: \"one must imagine Sisyphus happy\". Frankl, out of the death camp: even in the worst conditions a person retains the freedom to choose an attitude, and meaning is neither made nor found but \"discovered\": in work, in love, and in suffering that cannot be changed.", "nl": "Camus: het absurde is de botsing van het menselijk verlangen naar zin met het zwijgen van de wereld; het antwoord is noch zelfmoord noch een geloofssprong, maar bewuste opstand: \"men moet zich Sisyphus gelukkig voorstellen\". Frankl, vanuit het vernietigingskamp: zelfs onder de ergste omstandigheden behoudt een mens de vrijheid een houding te kiezen, en zin wordt noch gemaakt noch gevonden maar \"ontdekt\": in werk, in liefde, en in lijden dat niet veranderd kan worden."}, "points": [{"text": {"fa": "کامو (۱۹۴۲): «تنها یک مسئلهٔ فلسفی واقعاً جدی وجود دارد و آن خودکشی است»؛ کتاب استدلال می‌کند که پوچی دلیل مرگ نیست، دلیل زیستنِ بی‌امید و پرشور است. (این متن دربارهٔ خودکشی به‌عنوان مسئلهٔ فلسفی است؛ اگر خودتان درگیر چنین افکاری هستید، با کسی حرف بزنید.)", "en": "Camus (1942): \"there is but one truly serious philosophical problem, and that is suicide\"; the book argues that the absurd is a reason not for death but for living passionately without hope. (This text treats suicide as a philosophical problem; if you are struggling with such thoughts yourself, talk to someone.)", "nl": "Camus (1942): \"there is but one truly serious philosophical problem, and that is suicide\"; the book argues that the absurd is a reason not for death but for living passionately without hope. (This text treats suicide as a philosophical problem; if you are struggling with such thoughts yourself, talk to someone.)"}, "sources": ["src:21e863680c"], "flags": ["editor-note"]}, {"text": {"fa": "فرانکل (۱۹۴۶): «کسی که چرایی برای زیستن دارد، تقریباً با هر چگونه‌ای کنار می‌آید» (نقل از نیچه)؛ لوگوتراپی معنا را نیاز بنیادی می‌داند و «خلأ وجودی» را ریشهٔ بسیاری از افسردگی‌ها و اعتیادها. شواهد تجربی برای رابطهٔ معنا و سلامت روان قوی است؛ برای خودِ لوگوتراپی به‌عنوان درمان، محدود.", "en": "Frankl (1946): \"he who has a why to live can bear almost any how\" (quoting Nietzsche); logotherapy treats meaning as a basic need and the \"existential vacuum\" as the root of many depressions and addictions. Empirical evidence for the link between meaning and mental health is strong; for logotherapy itself as a treatment, limited.", "nl": "Frankl (1946): \"he who has a why to live can bear almost any how\" (quoting Nietzsche); logotherapy treats meaning as a basic need and the \"existential vacuum\" as the root of many depressions and addictions. Empirical evidence for the link between meaning and mental health is strong; for logotherapy itself as a treatment, limited."}, "sources": ["src:cb0447f889"], "flags": ["editor-note"]}, {"text": {"fa": "کیرکگور و سارتر دو سر طیف‌اند: کیرکگور پوچی را با «جهش ایمان» پاسخ می‌دهد؛ سارتر می‌گوید «وجود بر ماهیت مقدم است» و ما محکوم به آزادی و ساختن معنای خودیم. کامو میان این دو می‌ایستد و هر دو را «خودکشی فلسفی» می‌خواند.", "en": "Kierkegaard and Sartre are two ends of the spectrum: Kierkegaard answers absurdity with the \"leap of faith\"; Sartre says \"existence precedes essence\" and we are condemned to freedom and to making our own meaning. Camus stands between them and calls both \"philosophical suicide\".", "nl": "Kierkegaard and Sartre are two ends of the spectrum: Kierkegaard answers absurdity with the \"leap of faith\"; Sartre says \"existence precedes essence\" and we are condemned to freedom and to making our own meaning. Camus stands between them and calls both \"philosophical suicide\"."}, "sources": ["src:21e863680c"], "flags": []}], "links": [{"to": "psy:existentialism", "rel": "same-as", "note": {"fa": "فلسفهٔ وجودی در ویکی روان", "en": "Existential philosophy in the psychology wiki", "nl": "Existential philosophy in the psychology wiki"}}, {"to": "psy:meaning-making", "rel": "bridges", "note": {"fa": "معناسازی", "en": "Meaning-making", "nl": "Meaning-making"}}, {"to": "soc:secularization", "rel": "bridges", "note": {"fa": "معنا پس از دین", "en": "Meaning after religion", "nl": "Meaning after religion"}}], "people": ["core:albert-camus", "core:viktor-frankl", "core:sartre", "core:kierkegaard"], "sources": ["src:21e863680c", "src:cb0447f889"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:iranian", "kind": "field", "title": {"fa": "فلسفهٔ ایرانی‌اسلامی", "en": "Iranian-Islamic philosophy", "nl": "Iraans-islamitische filosofie"}, "aliases": [], "parent": "phil:phil", "field": null, "summary": {"fa": "از ابن سینا تا ملاصدرا: استدلال‌هایی که هنوز در فلسفهٔ ذهن و متافیزیک زنده‌اند.", "en": "From Avicenna to Mulla Sadra: arguments still alive in philosophy of mind and metaphysics.", "nl": "Van Avicenna tot Mulla Sadra: argumenten die nog leven in de filosofie van de geest en de metafysica."}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:two-liberties", "kind": "concept", "title": {"fa": "دو مفهوم آزادی", "en": "Two concepts of liberty", "nl": "Twee begrippen van vrijheid"}, "aliases": [], "parent": "phil:political", "field": "phil:political", "summary": {"fa": "برلین: آزادی «منفی» یعنی نبودن مانع بیرونی (کسی جلویم را نگیرد)؛ آزادی «مثبت» یعنی ارباب خود بودن و تحقق «خودِ واقعی». او هشدار داد مفهوم دوم به‌راحتی به استبداد می‌انجامد: کسی که ادعا می‌کند «خودِ واقعی» تو را بهتر از تو می‌شناسد، به نام آزادی‌ات تو را مجبور می‌کند.", "en": "Berlin: \"negative\" liberty is the absence of external obstacles (no one stops me); \"positive\" liberty is being one's own master and realising the \"true self\". He warned that the second easily turns to tyranny: whoever claims to know your \"true self\" better than you will coerce you in the name of your freedom.", "nl": "Berlin: \"negatieve\" vrijheid is de afwezigheid van uiterlijke belemmeringen (niemand houdt me tegen); \"positieve\" vrijheid is meester over zichzelf zijn en het \"ware zelf\" verwezenlijken. Hij waarschuwde dat het tweede gemakkelijk in tirannie omslaat: wie beweert jouw \"ware zelf\" beter te kennen dan jij, zal je dwingen in naam van jouw vrijheid."}, "points": [{"text": {"fa": "برلین (۱۹۵۸): ارزش‌های انسانی «کثرت‌گرا» و گاه ناسازگارند (آزادی و برابری، عدالت و رحمت)؛ هیچ نظام واحدی همه را با هم تحقق نمی‌دهد و ادعای چنین نظامی خطرناک است. از این‌جا دفاع او از کثرت‌گرایی لیبرال می‌آید.", "en": "Berlin (1958): human values are \"plural\" and sometimes incompatible (liberty and equality, justice and mercy); no single system realises them all, and claiming such a system is dangerous. Hence his defence of liberal pluralism.", "nl": "Berlin (1958): human values are \"plural\" and sometimes incompatible (liberty and equality, justice and mercy); no single system realises them all, and claiming such a system is dangerous. Hence his defence of liberal pluralism."}, "sources": ["src:3f08753416"], "flags": []}, {"text": {"fa": "آرنت (۱۹۶۳): «ابتذال شر»: آیشمن نه هیولا که کارمندی بی‌فکر بود که وظیفه انجام می‌داد؛ شر بزرگ از ناتوانی در اندیشیدن از منظر دیگری برمی‌آید. پیوند با آزمایش میلگرام و روان‌شناسی اطاعت. نقدها: شواهد بعدی نشان داد آیشمن ایدئولوژیک‌تر از تصویر آرنت بود.", "en": "Arendt (1963): the \"banality of evil\": Eichmann was not a monster but a thoughtless functionary doing his job; great evil arises from the inability to think from another's standpoint. Links to Milgram and the psychology of obedience. Critiques: later evidence showed Eichmann more ideological than Arendt's portrait.", "nl": "Arendt (1963): the \"banality of evil\": Eichmann was not a monster but a thoughtless functionary doing his job; great evil arises from the inability to think from another's standpoint. Links to Milgram and the psychology of obedience. Critiques: later evidence showe
