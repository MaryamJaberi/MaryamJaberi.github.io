The sacred in ancient religions", "nl": "The sacred in ancient religions"}}], "people": ["core:lucien-febvre", "core:zarathustra-zoroaster"], "sources": ["src:4505c21c79", "src:75325e8f83", "src:7d8cfd1cf4"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:state-expectations-bastiat-loop", "kind": "concept", "title": {"fa": "حلقهٔ انتظار از دولت: نان یا آزادی؟", "en": "The loop of expectations of the state: bread or liberty?", "nl": "De cirkel van verwachtingen van de staat: brood of vrijheid?"}, "aliases": [], "parent": "phil:political", "field": "phil:political", "summary": {"fa": "به گفتهٔ سخنران، جامعه‌ای که از دولت همه‌چیز می‌خواهد (وام، مسکن، بهداشت) دولت را بزرگ و متمرکز می‌کند و آزادی خود را از دست می‌دهد و باز انقلاب می‌کند. او با اشاره به باستیا و کامو می‌گوید باید دربارهٔ نقش دولت پرسید و گفت‌وگو کرد. این موضع لیبرال کلاسیک است و مخالفان جدی دارد.", "en": "Per the lecturer, a society that asks the state for everything (loans, housing, health care) grows a large centralised state, loses liberty and rebels again. Citing Bastiat and Camus he says expectations of the state must be debated. This is a classical-liberal stance with serious opponents.", "nl": "Volgens de spreker maakt een samenleving die alles van de staat vraagt de staat groot en verliest zij vrijheid; dit is een klassiek-liberale positie."}, "points": [{"text": {"fa": "به گفتهٔ سخنران، باستیا (روزنامه‌نگار فرانسوی) می‌گفت فرانسه میان جمهوری و پادشاهی می‌چرخد چون هنوز نقش دولت را تعریف نکرده است. این خوانش سخنران از باستیاست.", "en": "Per the lecturer, Bastiat (French journalist) held that France kept cycling between republic and monarchy because it had not defined the state's role. This is the lecturer's reading of Bastiat.", "nl": "Per the lecturer, Bastiat (French journalist) held that France kept cycling between republic and monarchy because it had not defined the state's role. This is the lecturer's reading of Bastiat."}, "sources": ["src:298b2455e6"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، وقتی مردم دولت را مسئول همه‌چیز می‌دانند، دولتی متمرکز شکل می‌گیرد که آزادی را محدود می‌کند و چرخهٔ انقلاب تکرار می‌شود.", "en": "Per the lecturer, when people hold the state responsible for everything, a centralised state emerges that restricts liberty and the cycle of revolution repeats.", "nl": "Per the lecturer, when people hold the state responsible for everything, a centralised state emerges that restricts liberty and the cycle of revolution repeats."}, "sources": ["src:298b2455e6"], "flags": ["editor-note"]}, {"text": {"fa": "او با نقل جمله‌ای از کامو می‌پرسد کدام بدتر است: آن‌که نان می‌دهد و آزادی می‌گیرد یا آن‌که آزادی می‌دهد و نان می‌برد.", "en": "Quoting Camus, he asks which is worse: the one who gives bread but takes liberty, or the one who gives liberty but takes bread.", "nl": "Quoting Camus, he asks which is worse: the one who gives bread but takes liberty, or the one who gives liberty but takes bread."}, "sources": ["src:298b2455e6"], "flags": ["editor-note"]}, {"text": {"fa": "نکتهٔ مقابل: بسیاری از اقتصاددانان و فیلسوفان سیاسی (از جمله سنت دولت رفاه و رالز) معتقدند آزادی و تأمین حداقل‌های معیشتی با هم سازگارند و فقر خود آزادی مؤثر را کم می‌کند؛ همچنین دولت‌های رفاه نوردیک نشان می‌دهند ترکیب این دو ممکن است.", "en": "Counterpoint: many economists and political philosophers (welfare-state tradition, Rawls) argue liberty and basic material security are compatible and poverty itself undermines effective liberty; Nordic welfare states are cited as combining both.", "nl": "Counterpoint: many economists and political philosophers (welfare-state tradition, Rawls) argue liberty and basic material security are compatible and poverty itself undermines effective liberty; Nordic welfare states are cited as combining both."}, "sources": ["src:298b2455e6"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "درستی تاریخی ادعای «چرخهٔ بی‌پایان» برای فرانسه ساده‌شده است؛ تاریخ فرانسهٔ قرن نوزدهم عوامل طبقاتی، جنگی و اقتصادی بسیاری داشت.", "en": "The 'endless cycle' claim about France is simplified; nineteenth-century French upheavals had many class, military and economic causes.", "nl": "The 'endless cycle' claim about France is simplified; nineteenth-century French upheavals had many class, military and economic causes."}, "sources": ["src:298b2455e6"], "flags": ["contested", "editor-note"]}], "links": [{"to": "phil:bastiat-law-state", "rel": "explains", "note": {"fa": "باستیا و دولت", "en": "Bastiat on law and state", "nl": "Bastiat on law and state"}}, {"to": "soc:liberty-before-democracy-iran", "rel": "see-also", "note": {"fa": "آزادی پیش از دموکراسی", "en": "Liberty before democracy", "nl": "Liberty before democracy"}}, {"to": "phil:political", "rel": "part-of", "note": {"fa": "فلسفهٔ سیاسی", "en": "Political philosophy", "nl": "Political philosophy"}}], "people": ["core:fr-d-ric-bastiat", "core:albert-camus"], "sources": ["src:298b2455e6"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:bastiat-law-state", "kind": "concept", "title": {"fa": "باستیا: قانون، دولت و «چپاول قانونی»", "en": "Bastiat: law, the state and \"legal plunder\"", "nl": "Bastiat: wet, staat en \"wettelijke plundering\""}, "aliases": [], "parent": "phil:political", "field": "phil:political", "summary": {"fa": "باستیا، اقتصاددان و روزنامه‌نگار لیبرال فرانسوی در میانهٔ قرن نوزدهم، می‌گفت قانون باید فقط جان و آزادی و دارایی را پاس بدارد. اگر قانون چیزی را از گروهی بگیرد و به گروهی دیگر بدهد، «چپاول قانونی» است. او به تناقض آشنایی اشاره می‌کرد: مردم هم خدمات بیشتری از دولت می‌خواهند و هم مالیات کمتر. این مدخل نمایی از یک سنت لیبرال کلاسیک است، نه حکم نهایی؛ نقدهایش پایین آمده است.", "en": "Bastiat, a mid-nineteenth-century French liberal economist and journalist, held that law should only protect life, liberty and property. If law takes from one group to give to another, it is \"legal plunder\". He pointed to a familiar contradiction: people want both more services from the state and lower taxes. This entry presents one classical-liberal tradition, not a final verdict; the criticisms are listed below.", "nl": "Bastiat, een Franse liberale econoom en journalist uit het midden van de negentiende eeuw, vond dat de wet alleen leven, vrijheid en eigendom moet beschermen. Neemt de wet van de ene groep om aan de andere te geven, dan is dat \"wettelijke plundering\". Hij wees op een bekende tegenstrijdigheid: mensen willen méér diensten van de staat én lagere belastingen. Dit lemma toont één klassiek-liberale traditie, geen eindoordeel; de kritiek staat hieronder."}, "points": [{"text": {"fa": "باستیا («قانون»، ۱۸۵۰): قانون باید حقوق فردی را در برابر زور و تقلب پاس بدارد. وقتی قانون خود ابزار گرفتن از یکی برای دادن به دیگری شود، همان بی‌عدالتی را «قانونی» کرده است. معیار ساده‌ای هم می‌دهد: ببین قانون چیزی را از کسی می‌گیرد که حق دیگری نیست.", "en": "Bastiat (The Law, 1850): law should protect individual rights against force and fraud. When law itself becomes the tool for taking from one to give to another, it has made the same injustice \"legal\". He offers a simple test: does the law take from someone what is not another's right?", "nl": "Bastiat (The Law, 1850): law should protect individual rights against force and fraud. When law itself becomes the tool for taking from one to give to another, it has made the same injustice \"legal\". He offers a simple test: does the law take from someone what is not another's right?"}, "sources": ["src:accbce5601"], "flags": []}, {"text": {"fa": "باستیا («دولت»، ۱۸۴۸): «دولت» افسانه‌ای است که هر کس می‌کوشد با آن به هزینهٔ همه زندگی کند. دولتی که همه‌چیز می‌دهد، به همان اندازه باید بگیرد؛ خواستن خدمات بی‌پایان همراه با مالیات اندک، به ناکامی و ناخشنودی مداوم می‌رسد.", "en": "Bastiat (\"The State\", 1848): \"the State\" is the great fiction through which everyone tries to live at the expense of everyone else. A state that gives everything must take as much; demanding endless services with low taxes leads to constant frustration and disappointment.", "nl": "Bastiat (\"The State\", 1848): \"the State\" is the great fiction through which everyone tries to live at the expense of everyone else. A state that gives everything must take as much; demanding endless services with low taxes leads to constant frustration and disappointment."}, "sources": ["src:b5ee37f7db"], "flags": []}, {"text": {"fa": "خوانش سخنران (جلسهٔ دهم، کارگاه لیبرالیسم): باستیا را پاسخی به چرخهٔ بی‌ثباتی سیاسی فرانسه پس از ۱۷۸۹ می‌داند (جمهوری‌ها، سلطنت‌ها، و قانون اساسی‌های پیاپی) و نتیجه می‌گیرد دولتِ بزرگ و مداخله‌گر، خودش را در برابر هر ناکامی اجتماعی مسئول می‌کند و به سمت سانسور و نظارت می‌رود. این تفسیر یک نظر است، نه اجماع تاریخ‌نگاران.", "en": "The speaker's reading (session 10, liberalism workshop): Bastiat is an answer to France's cycle of political instability after 1789 (republics, monarchies, successive constitutions); a large, interventionist state makes itself answerable for every social failure and slides toward censorship and surveillance. This interpretation is one view, not a consensus of historians.", "nl": "The speaker's reading (session 10, liberalism workshop): Bastiat is an answer to France's cycle of political instability after 1789 (republics, monarchies, successive constitutions); a large, interventionist state makes itself answerable for every social failure and slides toward censorship and surveillance. This interpretation is one view, not a consensus of historians."}, "sources": ["src:175d815217"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "نقد: تعریف «چپاول» پیشاپیش فرض می‌گیرد توزیع کنونی دارایی عادلانه است؛ رالز، سن و نوسبام (و سنت سوسیال‌دموکرات) می‌گویند عدالت بدون بازتوزیع و تضمین حداقل‌های قابلیت ناقص است. تجربهٔ دولت‌های رفاه شمال اروپا هم نشان داده بزرگ‌بودن دولت الزاماً به استبداد نمی‌رسد.", "en": "Criticism: the definition of \"plunder\" presupposes that the current distribution of property is just; Rawls, Sen and Nussbaum (and the social-democratic tradition) argue that justice without redistribution and a guaranteed capability floor is incomplete. The experience of Northern European welfare states also shows a large state does not necessarily lead to despotism.", "nl": "Criticism: the definition of \"plunder\" presupposes that the current distribution of property is just; Rawls, Sen and Nussbaum (and the social-democratic tradition) argue that justice without redistribution and a guaranteed capability floor is incomplete. The experience of Northern European welfare states also shows a large state does not necessarily lead to despotism."}, "sources": [], "flags": ["contested", "editor-note"]}], "links": [{"to": "phil:capabilities", "rel": "critiques", "note": {"fa": "رویکرد قابلیت‌ها", "en": "The capabilities approach", "nl": "The capabilities approach"}}, {"to": "phil:two-liberties", "rel": "see-also", "note": {"fa": "آزادی منفی در برابر مثبت", "en": "Negative vs positive liberty", "nl": "Negative vs positive liberty"}}, {"to": "phil:veil-of-ignorance", "rel": "critiques", "note": {"fa": "رالز و عدالت توزیعی", "en": "Rawls and distributive justice", "nl": "Rawls and distributive justice"}}, {"to": "soc:mobility", "rel": "bridges", "note": {"fa": "نابرابری و نقش دولت", "en": "Inequality and the role of the state", "nl": "Inequality and the role of the state"}}], "people": ["core:fr-d-ric-bastiat"], "sources": ["src:175d815217", "src:accbce5601", "src:b5ee37f7db"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:berkeley-idealism", "kind": "concept", "title": {"fa": "برکلی و ایدئالیسم: بودن یعنی ادراک‌شدن", "en": "Berkeley's idealism: to be is to be perceived", "nl": "Berkeley en het idealisme: zijn is waargenomen worden"}, "aliases": [], "parent": "phil:epistemology", "field": "phil:epistemology", "summary": {"fa": "جورج برکلی، اسقف و فیلسوف ایرلندی، می‌گفت جهان مادی مستقل از ذهن وجود ندارد و آنچه می‌شناسیم «ایده‌هایی» است که ادراک می‌شوند. این ایده‌ها به باور او پایدارند چون خدا آن‌ها را در ذهن ما پدید می‌آورد و نگه می‌دارد. سخنران این نظر را با تمایز «واقعیت در برابر حقیقت» در هم می‌آمیزد، در حالی که خود برکلی چنین شکافی را نمی‌پذیرفت.", "en": "George Berkeley, an Irish bishop and philosopher, held that a mind-independent material world does not exist and that what we know are ideas that are perceived. He thought these ideas are stable because God produces and sustains them in our minds. The lecturer blends this with a 'reality versus truth' split, a gap Berkeley himself rejected.", "nl": "George Berkeley, Iers bisschop en filosoof, stelde dat er geen van de geest onafhankelijke materiële wereld bestaat; wat we kennen zijn waargenomen ideeën. De spreker vermengt dit met een kloof tussen 'werkelijkheid' en 'waarheid' die Berkeley zelf afwees."}, "points": [{"text": {"fa": "به گفتهٔ سخنران، برکلی معتقد بود آنچه حواس از جهان می‌فهمند فقط تصویری از «حقیقت» است و آن حقیقت خداست؛ زمان و مکان هم توهم ذهن انسان‌اند و برای خدا وجود ندارند.", "en": "Per the lecturer, Berkeley held that what the senses grasp is only an image of 'truth', that this truth is God, and that space and time are illusions of the human mind that do not exist for God.", "nl": "Per the lecturer, Berkeley held that what the senses grasp is only an image of 'truth', that this truth is God, and that space and time are illusions of the human mind that do not exist for God."}, "sources": ["src:64d205371b"], "flags": ["editor-note"]}, {"text": {"fa": "هستهٔ واقعی نظر برکلی این است: چیزهای محسوس چیزی جز ایده‌هایی که ادراک می‌شوند نیستند («بودن یعنی ادراک‌شدن») و ماده‌ای ناپیدا پشت آن‌ها نیست. نظر او را باید در «رسالهٔ اصول معرفت انسانی» و «سه گفتگو» دید.", "en": "Berkeley's actual core claim: sensible things are nothing but perceived ideas ('esse est percipi'), with no unseen matter behind them. His view is set out in the Principles of Human Knowledge and the Three Dialogues.", "nl": "Berkeley's actual core claim: sensible things are nothing but perceived ideas ('esse est percipi'), with no unseen matter behind them. His view is set out in the Principles of Human Knowledge and the Three Dialogues."}, "sources": ["src:96d26a6af0", "src:8613ac75bd"], "flags": []}, {"text": {"fa": "سخنران برکلی را به «قرن هفدهم» نسبت می‌دهد؛ برکلی در ۱۶۸۵ متولد شد و آثار اصلی‌اش را در ۱۷۱۰ و ۱۷۱۳ نوشت، یعنی بیشتر به قرن هجدهم تعلق دارد (۱۷۵۳–۱۶۸۵).", "en": "The lecturer places Berkeley in the seventeenth century; he was born in 1685 and published his main works in 1710 and 1713, so he is chiefly an eighteenth-century thinker (1685-1753).", "nl": "The lecturer places Berkeley in the seventeenth century; he was born in 1685 and published his main works in 1710 and 1713, so he is chiefly an eighteenth-century thinker (1685-1753)."}, "sources": ["src:64d205371b"], "flags": ["editor-note"]}, {"text": {"fa": "تفسیر سخنران با نظر خود برکلی تفاوت جدی دارد: برکلی می‌گفت چیزهایی که می‌بینیم کاملاً واقعی‌اند و میان ظاهر و واقعیت شکافی نیست؛ او درست با این طرح مخالف بود که حواس ما فقط تصویری از جهانی پنهان و ناشناختنی به ما می‌دهند (این بیشتر به لاک و کانت می‌خورد). همچنین ادعای اینکه برای برکلی زمان و مکان «توهم» و برای خدا ناموجودند، دقیق نیست؛ برکلی فضای مطلق نیوتن را رد می‌کرد، اما مفهوم «خدای بیرون از زمان» بیشتر سنت الهیات کلاسیک است.", "en": "The lecturer's reading departs sharply from Berkeley: Berkeley said the things we see are fully real and that there is no gap between appearance and reality; he opposed the picture in which senses give us only an image of a hidden, unknowable world (which resembles Locke or Kant more). The claim that for Berkeley time and space are 'illusions' and do not exist for God is also imprecise: he criticised Newton's absolute space, while the idea of a timeless God belongs more to classical theology.", "nl": "The lecturer's reading departs sharply from Berkeley: Berkeley said the things we see are fully real and that there is no gap between appearance and reality; he opposed the picture in which senses give us only an image of a hidden, unknowable world (which resembles Locke or Kant more). The claim that for Berkeley time and space are 'illusions' and do not exist for God is also imprecise: he criticised Newton's absolute space, while the idea of a timeless God belongs more to classical theology."}, "sources": ["src:64d205371b"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "سخنران می‌گوید اگر بخش «حقیقت خداست» را کنار بگذاریم، فلسفهٔ برکلی با علم مدرن هماهنگ است. این ارزیابی نظر شخصی اوست؛ بیشتر فیلسوفان علم ایدئالیسم برکلی را با علم تجربی هماهنگ نمی‌دانند و آن را یک موضع متافیزیکی جداگانه می‌شمارند.", "en": "The lecturer says that without the 'truth is God' part Berkeley's philosophy fits modern science. This is his personal assessment; most philosophers of science do not treat Berkeley's idealism as simply compatible with empirical science and see it as a separate metaphysical position.", "nl": "The lecturer says that without the 'truth is God' part Berkeley's philosophy fits modern science. This is his personal assessment; most philosophers of science do not treat Berkeley's idealism as simply compatible with empirical science and see it as a separate metaphysical position."}, "sources": ["src:64d205371b"], "flags": ["contested", "editor-note"]}], "links": [{"to": "phil:epistemology", "rel": "part-of", "note": {"fa": "بحث دربارهٔ حدود شناخت ما از جهان", "en": "A question about the limits of what we can know of the world", "nl": "A question about the limits of what we can know of the world"}}, {"to": "phil:skepticism-cogito", "rel": "see-also", "note": {"fa": "پرسش مشابه دربارهٔ اعتماد به حواس", "en": "A related doubt about trusting the senses", "nl": "A related doubt about trusting the senses"}}, {"to": "phil:cave", "rel": "see-also", "note": {"fa": "تمثیل افلاطون دربارهٔ سایه و حقیقت", "en": "Plato's image of shadows versus reality", "nl": "Plato's image of shadows versus reality"}}, {"to": "phil:perceptual-interface-theory", "rel": "contrasts", "note": {"fa": "ایدهٔ مدرن «رابط ادراکی» که با برکلی یکی نیست", "en": "The modern 'perceptual interface' idea, which is not Berkeley's", "nl": "The modern 'perceptual interface' idea, which is not Berkeley's"}}], "people": ["core:george-berkeley", "core:john-locke", "core:david-hume"], "sources": ["src:64d205371b", "src:8613ac75bd", "src:96d26a6af0"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:ethics-first-zoroaster-kalam-origins", "kind": "concept", "title": {"fa": "اخلاق پیش از امر قدسی؟ زرتشت، خاستگاه کلام و بحث جبر و علیت در نگاه وکیلی", "en": "Ethics before the sacred? Zoroaster, the origins of kalam and the determinism debate in Vakili's account", "nl": "Ethiek vóór het heilige? Zarathoestra, de oorsprong van kalam en het determinisme"}, "aliases": [], "parent": "phil:iranian", "field": "phil:iranian", "summary": {"fa": "وکیلی می‌گوید نوآوری بنیادین زرتشت این بود که اخلاق را بر امر قدسی مقدم داشت و خدای ناعادل را دروغین دانست؛ به نظر او همین پرسش در ایران سده‌های نخست اسلامی دوباره در برابر آموزهٔ اموی «هر چه خدا بخواهد» برخاست. او همچنین علم کلام را برآمده از سنت ایرانی «مانترا» می‌داند، نه لوگوس یونانی. این‌ها فرضیه‌های شخصی‌اند و پژوهشگران دربارهٔ آن‌ها دیدگاه‌های دیگری دارند.", "en": "Vakili argues that Zoroaster's radical innovation was to put ethics before the sacred, declaring an unjust god false; he sees the same question resurfacing in early Islamic Iran against the Umayyad doctrine that God does whatever he wills. He also derives Islamic kalam from an Iranian 'manthra' tradition rather than Greek logos. These are personal hypotheses, and scholars hold other views.", "nl": "Vakili stelt dat Zarathoestra ethiek boven het heilige plaatste en dat kalam uit een Iraanse traditie voortkomt; dit zijn persoonlijke hypotheses en omstreden."}, "points": [{"text": {"fa": "به گفتهٔ سخنران، زرتشت نخستین کسی بود که گفت اگر خدایی فرمان کار ناروا (مثل غارت و قربانی) بدهد دروغین است؛ پس معیار قدسی بودن، اخلاقی بودن است. او می‌گوید این پایهٔ «عدل» در کلام و فقه ایرانی-اسلامی و نزد معتزله، زیدیه و خوارج شد و فارابی و ابن‌مسکویه اخلاق را از انسان آغاز کردند.", "en": "Per the lecturer, Zoroaster was the first to say that a god who commands wrongdoing (such as raiding and sacrifice) is false, so the test of holiness is ethical. He says this became the basis of 'justice' (adl) in Iranian-Islamic theology and law among the Mu'tazila, Zaydis and Kharijites, and that al-Farabi and Miskawayh began ethics from the human person.", "nl": "Per the lecturer, Zoroaster was the first to say that a god who commands wrongdoing (such as raiding and sacrifice) is false, so the test of holiness is ethical. He says this became the basis of 'justice' (adl) in Iranian-Islamic theology and law among the Mu'tazila, Zaydis and Kharijites, and that al-Farabi and Miskawayh began ethics from the human person."}, "sources": ["src:13520836c4"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، ادیان «سامی» عقل‌ستیزند، خدای تورات و مسیحیت غربی ناعادل است (مثلاً داستان ایوب)، و تفاوت اصلی ایران با آن‌ها همین مرجعیت اخلاق است. به نظر او رومیان و یونانیان هم خدایانی غیراخلاقی داشتند.", "en": "Per the lecturer, 'Semitic' religions are anti-rational, the god of the Torah and of Western Christianity is unjust (e.g. the story of Job), and Iran's distinctive feature is precisely the primacy of ethics. He says Romans and Greeks also had amoral gods.", "nl": "Per the lecturer, 'Semitic' religions are anti-rational, the god of the Torah and of Western Christianity is unjust (e.g. the story of Job), and Iran's distinctive feature is precisely the primacy of ethics. He says Romans and Greeks also had amoral gods."}, "sources": ["src:13520836c4"], "flags": ["editor-note", "contested"]}, {"text": {"fa": "نظر پژوهشگران: زمان زرتشت مورد اختلاف است (از حدود ۱۵۰۰ تا ۱۰۰۰ پیش از میلاد در نظر بویس و دیگران، تا سدهٔ ششم پیش از میلاد در نظر برخی دیگر)، و گاثاها تفسیر دشواری دارند؛ همه می‌پذیرند که دوگانهٔ راستی و دروغ در آن‌ها مرکزی است، ولی نتیجه‌گیری «نخستین کافر تاریخ» ادعایی بلاغی است. «سامی = عقل‌ستیز» با تاریخ فلسفهٔ یهودی، مسیحی و اسلامی نمی‌خواند (ابن‌میمون، آکویناس، معتزله). پرسشی که لوح افلاطون در اوتیفرون مطرح می‌کند (آیا نیکی را خدایان فرمان می‌دهند یا چون نیک است فرمان می‌دهند؟) نشان می‌دهد این بحث در سنت یونانی نیز بود. دربارهٔ اخلاق اسلامی، ابن‌مسکویه آشکارا از ارسطو و گالن بهره برده است.", "en": "Scholarly view: Zoroaster's date is disputed (c. 1500-1000 BCE in Boyce and others, the 6th century BCE for some), and the Gathas are hard to interpret; all agree that the contrast between truth and the lie is central, but 'the first infidel in history' is a rhetorical claim. 'Semitic equals anti-rational' does not fit the history of Jewish, Christian and Islamic philosophy (Maimonides, Aquinas, the Mu'tazila). Plato's Euthyphro, which asks whether the gods command what is good or whether it is good because they command it, shows the problem was alive in the Greek tradition too. In Islamic ethics, Miskawayh draws openly on Aristotle and Galen.", "nl": "Scholarly view: Zoroaster's date is disputed (c. 1500-1000 BCE in Boyce and others, the 6th century BCE for some), and the Gathas are hard to interpret; all agree that the contrast between truth and the lie is central, but 'the first infidel in history' is a rhetorical claim. 'Semitic equals anti-rational' does not fit the history of Jewish, Christian and Islamic philosophy (Maimonides, Aquinas, the Mu'tazila). Plato's Euthyphro, which asks whether the gods command what is good or whether it is good because they command it, shows the problem was alive in the Greek tradition too. In Islamic ethics, Miskawayh draws openly on Aristotle and Galen."}, "sources": ["src:1330ec912f", "src:aabbacb038", "src:c0d9c29994"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، کلام اسلامی (با واصل بن عطا، بنیان‌گذار معتزله) از سنت «مانترا»ی ایرانی برآمد، یعنی گفتاری که حقیقت را بازتاب می‌دهد و به روش عقلی بحث می‌شود، و ربطی به لوگوس یونانی (که او آن را فن بلاغت و دادگاه می‌داند) ندارد. او می‌گوید پیش از واصل مبلغ مسلمان نداشتیم و مناظره‌های عقلی میان زرتشتیان و مسلمانان به شکل‌گیری کلام انجامید.", "en": "Per the lecturer, Islamic kalam (with Wasil ibn Ata, founder of the Mu'tazila) grew out of an Iranian 'manthra' tradition, meaning speech that reflects truth and is argued by rational method, with no link to Greek logos, which he reads as the art of rhetoric and courtroom persuasion. He says there were no Muslim missionaries before Wasil and that rational debates between Zoroastrians and Muslims led to kalam.", "nl": "Per the lecturer, Islamic kalam (with Wasil ibn Ata, founder of the Mu'tazila) grew out of an Iranian 'manthra' tradition, meaning speech that reflects truth and is argued by rational method, with no link to Greek logos, which he reads as the art of rhetoric and courtroom persuasion. He says there were no Muslim missionaries before Wasil and that rational debates between Zoroastrians and Muslims led to kalam."}, "sources": ["src:13520836c4"], "flags": ["editor-note", "contested"]}, {"text": {"fa": "نظر پژوهشگران: خاستگاه کلام هنوز بحث‌برانگیز است؛ ولفسن (۱۹۷۶) تأثیر مسیحی-یونانی را مهم می‌دانست، مایکل کوک (۱۹۸۰) تأثیر مسیحی را در طرح پرسش‌های اولیه (مثل قدر) بررسی کرد، و فان اس تاریخ فکری کلام را در شبکهٔ فرقه‌ای و اجتماعی سده‌های دوم و سوم می‌خواند. فرضیهٔ منشأ ایرانی-مانترایی برای کلام پذیرفته‌شدهٔ عمومی نیست و دلیل مستقیم متنی ندارد. بحث قدر و جبر از دورهٔ اموی شروع شد و تأثیر زروانی بر حلاج یا اشعری حدسی است (زنر ۱۹۵۵ زروانیسم را بررسی کرده است ولی نه این پیوند را). ادعای اینکه اشعری ایدهٔ نفی علیت را از حلاج گرفته با شواهد روشن پشتیبانی نمی‌شود.", "en": "Scholarly view: the origins of kalam remain disputed; Wolfson (1976) stressed Christian-Greek influence, Michael Cook (1980) examined Christian influence on early questions such as qadar, and van Ess reads kalam within the sectarian and social network of the 2nd-3rd centuries. An Iranian 'manthra' origin for kalam is not generally accepted and lacks direct textual evidence. The qadar-versus-jabr debate began in Umayyad times, and Zurvanite influence on Hallaj or al-Ash'ari is speculative (Zaehner 1955 studied Zurvanism but not this link). The claim that al-Ash'ari took his denial of necessary causation from Hallaj is not supported by clear evidence.", "nl": "Scholarly view: the origins of kalam remain disputed; Wolfson (1976) stressed Christian-Greek influence, Michael Cook (1980) examined Christian influence on early questions such as qadar, and van Ess reads kalam within the sectarian and social network of the 2nd-3rd centuries. An Iranian 'manthra' origin for kalam is not generally accepted and lacks direct textual evidence. The qadar-versus-jabr debate began in Umayyad times, and Zurvanite influence on Hallaj or al-Ash'ari is speculative (Zaehner 1955 studied Zurvanism but not this link). The claim that al-Ash'ari took his denial of necessary causation from Hallaj is not supported by clear evidence."}, "sources": ["src:85011b3355", "src:7676040a4d", "src:7601475ecc"], "flags": ["contested", "editor-note"]}], "links": [{"to": "phil:ghazali-causation", "rel": "see-also", "note": {"fa": "علیت در کلام اشعری و غزالی", "en": "Causation in Ash'arite kalam and al-Ghazali", "nl": "Causation in Ash'arite kalam and al-Ghazali"}}, {"to": "phil:free-will", "rel": "contrasts", "note": {"fa": "بحث امروزی ارادهٔ آزاد", "en": "The modern free-will debate", "nl": "The modern free-will debate"}}, {"to": "phil:ethics", "rel": "see-also", "note": {"fa": "اخلاق", "en": "Ethics", "nl": "Ethics"}}, {"to": "phil:hallaj-historical-portrait", "rel": "see-also", "note": {"fa": "حلاج در این دوره", "en": "Hallaj in this period", "nl": "Hallaj in this period"}}], "people": ["core:zarathustra-zoroaster", "core:wasil-ibn-ata", "core:miskawayh", "core:al-farabi", "core:abu-al-hasan-al-ash-ari"], "sources": ["src:1330ec912f", "src:13520836c4", "src:7601475ecc", "src:7676040a4d", "src:85011b3355", "src:aabbacb038", "src:c0d9c29994"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:moral-luck", "kind": "concept", "title": {"fa": "بخت اخلاقی", "en": "Moral luck", "nl": "Moreel geluk"}, "aliases": [], "parent": "phil:ethics", "field": "phil:ethics", "summary": {"fa": "دو راننده با یک بی‌احتیاطی: جلوی یکی کودکی می‌پرد و می‌میرد، جلوی دیگری نه. اولی قاتل است و دومی فقط بی‌احتیاط؛ اما تنها فرقشان شانس بود. اگر فقط آنچه در کنترل ماست اخلاقاً مهم است، پس تقریباً هیچ‌چیز مهم نیست: شخصیت، موقعیت و نتیجه همه تا حد زیادی بخت‌اند.", "en": "Two drivers equally careless: a child runs in front of one and dies, not the other. The first is a killer, the second merely careless; yet the only difference was luck. If only what is in our control matters morally, almost nothing matters: character, circumstance and outcome are all largely luck.", "nl": "Twee even onvoorzichtige bestuurders: voor de een rent een kind de weg op en sterft, voor de ander niet. De eerste is een doder, de tweede slechts onvoorzichtig; toch was het enige verschil geluk. Als alleen wat in onze macht ligt moreel telt, telt bijna niets: karakter, omstandigheid en uitkomst zijn grotendeels geluk."}, "points": [{"text": {"fa": "ویلیامز (۱۹۸۱) و نیگل (۱۹۷۹): چهار نوع بخت اخلاقی: نتیجه، موقعیت (آلمانی ۱۹۳۳ در برابر آلمانی مهاجر به آرژانتین)، سرشت (مزاجی که با آن به دنیا آمده‌ای) و علّی. شهود «فقط کنترل مهم است» با شهودهای روزمرهٔ سرزنش ناسازگار است و این تناقض حل نشده است.", "en": "Williams (1981) and Nagel (1979): four kinds of moral luck: resultant, circumstantial (a German in 1933 versus one who emigrated to Argentina), constitutive (the temperament you were born with) and causal. The intuition \"only control matters\" conflicts with our everyday intuitions of blame, and the paradox is unresolved.", "nl": "Williams (1981) and Nagel (1979): four kinds of moral luck: resultant, circumstantial (a German in 1933 versus one who emigrated to Argentina), constitutive (the temperament you were born with) and causal. The intuition \"only control matters\" conflicts with our everyday intuitions of blame, and the paradox is unresolved."}, "sources": ["src:3ad423b7df", "src:be9c4483b2"], "flags": []}, {"text": {"fa": "پیوند با ژنتیک و جامعه: اگر خویشتن‌داری و هوش تا حدی وراثتی و طبقه تا حدی ارثی است، «شایستگی» بیش از آنچه می‌پنداریم بخت است؛ استدلالی که هاردن و رالز هر دو به‌کار گرفته‌اند.", "en": "Link to genetics and society: if self-control and intelligence are partly heritable and class partly inherited, \"merit\" is more luck than we assume; an argument used by both Harden and Rawls.", "nl": "Link to genetics and society: if self-control and intelligence are partly heritable and class partly inherited, \"merit\" is more luck than we assume; an argument used by both Harden and Rawls."}, "sources": ["src:3ad423b7df"], "flags": []}], "links": [{"to": "tabar:heritability", "rel": "bridges", "note": {"fa": "بخت سرشتی و وراثت‌پذیری", "en": "Constitutive luck and heritability", "nl": "Constitutive luck and heritability"}}, {"to": "phil:veil-of-ignorance", "rel": "see-also", "note": {"fa": "رالز: استعدادها دارایی مشترک‌اند", "en": "Rawls: talents as a common asset", "nl": "Rawls: talents as a common asset"}}, {"to": "psy:learned-helplessness", "rel": "bridges", "note": {"fa": "کنترل و درماندگی", "en": "Control and helplessness", "nl": "Control and helplessness"}}], "people": ["core:bernard-williams", "core:thomas-nagel"], "sources": ["src:3ad423b7df", "src:be9c4483b2"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}], "people": {"core:amartya-sen": {"id": "core:amartya-sen", "name": {"fa": "آمارتیا سن", "en": "Amartya Sen", "nl": "Amartya Sen"}, "years": "", "note": {"fa": ""}, "wikidata": "Q132489", "wikis": ["psy", "soc"]}, "core:immanuel-kant": {"id": "core:immanuel-kant", "name": {"fa": "ایمانوئل کانت", "en": "Immanuel Kant", "nl": "Immanuel Kant"}, "years": "1724–1804", "note"
