d Eichmann more ideological than Arendt's portrait."}, "sources": ["src:0053354674"], "flags": ["contested"]}], "links": [{"to": "psy:autonomy", "rel": "bridges", "note": {"fa": "خودمختاری", "en": "Autonomy", "nl": "Autonomy"}}, {"to": "psy:dehumanization", "rel": "bridges", "note": {"fa": "انسان‌زدایی و اطاعت", "en": "Dehumanization and obedience", "nl": "Dehumanization and obedience"}}, {"to": "phil:capabilities", "rel": "see-also", "note": {"fa": "قابلیت به‌عنوان آزادی مثبت سنجش‌پذیر", "en": "Capability as measurable positive liberty", "nl": "Capability as measurable positive liberty"}}], "people": ["core:isaiah-berlin", "core:hannah-arendt"], "sources": ["src:0053354674", "src:3f08753416"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:everyday-fallacies-session-four", "kind": "concept", "title": {"fa": "مغالطه‌های پرکاربرد در بحث‌های اجتماعی: توسل به اقتدار، اکثریت، تجربه، ترس و دیگران", "en": "Common fallacies in social debate: appeals to authority, majority, experience, fear and more", "nl": "Veelvoorkomende drogredenen in maatschappelijk debat"}, "aliases": [], "parent": "phil:epistemology", "field": "phil:epistemology", "summary": {"fa": "سخنران چند مغالطهٔ پرتکرار را معرفی می‌کند: توسل به اقتدار، نابه‌هنگامی (قضاوت گذشته با معیار امروز)، حق‌به‌جانب‌بودن، توسل به اکثریت، تجربه، عوام‌فریبی، ترس، استهزا، ترحم، آرزواندیشی، بی‌اعتمادی به عقل، «خودت هم همین‌طوری» و مغالطهٔ روان‌شناسانه. او تأکید می‌کند که مغالطه ممکن است مقدمه‌های درست هم داشته باشد، اما استدلال را نامعتبر می‌کند. این مدخل مکمل مدخل کلی مغالطه‌هاست و بیشتر مثال‌های اجتماعی را می‌آورد.", "en": "The lecturer introduces frequent fallacies: appeal to authority, anachronism, self-righteousness, appeal to the majority, appeal to experience, demagoguery, appeal to fear, ridicule, pity, wishful thinking, distrust of reason, 'you too', and the psychologistic fallacy. He stresses that a fallacy can even have true premises yet still fail as an argument. This entry complements the general fallacies entry with socially flavoured examples.", "nl": "Een overzicht van veelvoorkomende drogredenen die in de les worden besproken, zoals beroep op autoriteit, meerderheid, angst en spot."}, "points": [{"text": {"fa": "توسل به اقتدار: استناد به نام یک متخصص در حوزه‌ای دیگر (مثلاً فیزیک‌دانی که دربارهٔ مسئلهٔ اجتماعی یا فلسفی نقل می‌شود) یا به عبارت‌های مبهمی مثل «بسیاری از جامعه‌شناسان می‌گویند». نکتهٔ دقیق: استناد به متخصص در حوزهٔ خودش مغالطه نیست؛ مشکل وقتی است که تخصص مربوط نباشد، اجماع واقعی وجود نداشته باشد یا نام به جای دلیل بنشیند.", "en": "Appeal to authority: citing a specialist from another field (for example a physicist quoted on a social or philosophical question) or vague phrases like 'many sociologists say'. A precision: citing an expert within their own field is not a fallacy; the problem arises when the expertise is irrelevant, no real consensus exists, or a name stands in for reasons.", "nl": "Appeal to authority: citing a specialist from another field (for example a physicist quoted on a social or philosophical question) or vague phrases like 'many sociologists say'. A precision: citing an expert within their own field is not a fallacy; the problem arises when the expertise is irrelevant, no real consensus exists, or a name stands in for reasons."}, "sources": ["src:e5f1685e69", "src:06a4d503e5"], "flags": ["editor-note"]}, {"text": {"fa": "مغالطهٔ نابه‌هنگامی: سنجیدن متن‌ها و آدم‌های گذشته با دانش و ارزش‌های امروز، مثلاً پرسیدن نظر سعدی دربارهٔ محیط زیست یا خواندن حکایتی در گلستان به عنوان «نخستین نظریهٔ اشاعهٔ فرهنگی». سخنران می‌گوید برای ظهور یک رویکرد مثل جامعه‌شناسی پیش‌نیازهای معرفتی و تاریخی لازم است. او به نقد جواد طباطبایی بر ایدهٔ «ابن‌خلدون بنیان‌گذار جامعه‌شناسی» اشاره می‌کند.", "en": "Anachronism: judging past texts and people by today's knowledge and values, for instance asking Saadi's view on the environment or reading a tale in the Golestan as the 'first theory of cultural diffusion'. The lecturer says a new approach like sociology needs epistemic and historical preconditions. He points to Javad Tabatabai's critique of calling Ibn Khaldun the founder of sociology.", "nl": "Anachronism: judging past texts and people by today's knowledge and values, for instance asking Saadi's view on the environment or reading a tale in the Golestan as the 'first theory of cultural diffusion'. The lecturer says a new approach like sociology needs epistemic and historical preconditions. He points to Javad Tabatabai's critique of calling Ibn Khaldun the founder of sociology."}, "sources": ["src:e5f1685e69"], "flags": ["editor-note"]}, {"text": {"fa": "ملاحظه: دربارهٔ ابن‌خلدون نظر واحدی وجود ندارد. بسیاری از پژوهشگران او را پیشگام تفکر جامعه‌شناختی (نه بنیان‌گذار رشتهٔ مدرن) می‌دانند و بعضی دیگر لقب «بنیان‌گذار» را درست نمی‌دانند. دشوار است گفت یک نظر نهایی است.", "en": "Note: there is no single view on Ibn Khaldun. Many scholars see him as a pioneer of sociological thinking (not the founder of the modern discipline), while others reject the title 'founder' outright. It is hard to call either view final.", "nl": "Note: there is no single view on Ibn Khaldun. Many scholars see him as a pioneer of sociological thinking (not the founder of the modern discipline), while others reject the title 'founder' outright. It is hard to call either view final."}, "sources": ["src:e5f1685e69"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "حق‌به‌جانب‌بودن یعنی اصل گرفتن فرهنگ، دین، قوم یا گروه خود و سنجیدن دیگران با «انحراف از خودمان»؛ از دید سخنران مفاهیمی مثل «تهاجم فرهنگی» از چنین نگاهی ساخته می‌شود. توسل به اکثریت: درست‌دانستن چیزی چون بسیاری آن را باور دارند. توسل به تجربه: جایگزین کردن تخصص و تحلیل با «من سال‌ها تجربه دارم»؛ سخنران می‌گوید شهروند با کمی تجربه اجتماعی خود را بی‌نیاز از جامعه‌شناس می‌بیند.", "en": "Self-righteousness means treating one's own culture, religion, ethnicity or group as the standard and measuring others by their 'deviation from us'; in the lecturer's view, notions such as 'cultural invasion' are built from this stance. Appeal to the majority: counting something true because many believe it. Appeal to experience: replacing expertise and analysis with 'I have years of experience'; the lecturer says citizens with a little social experience feel they need no sociologist.", "nl": "Self-righteousness means treating one's own culture, religion, ethnicity or group as the standard and measuring others by their 'deviation from us'; in the lecturer's view, notions such as 'cultural invasion' are built from this stance. Appeal to the majority: counting something true because many believe it. Appeal to experience: replacing expertise and analysis with 'I have years of experience'; the lecturer says citizens with a little social experience feel they need no sociologist."}, "sources": ["src:e5f1685e69"], "flags": ["editor-note"]}, {"text": {"fa": "ملاحظهٔ منصفانه دربارهٔ تجربه: تجربهٔ زیسته شاهد معتبری است دربارهٔ اینکه چیزی «چه حسی دارد» و نظریه‌های دیدگاه‌محور (standpoint) بر ارزش معرفتی آن تأکید می‌کنند. مغالطه وقتی است که تجربهٔ شخصی به جای شواهد عمومی و روش‌مند بنشیند یا تعمیم داده شود. همچنین در حقوق و پزشکی «تجربهٔ بالینی» نقش واقعی دارد و فقط مطلق کردنش خطاست.", "en": "A fair note on experience: lived experience is valid evidence about what something is like, and standpoint theories stress its epistemic value. It becomes a fallacy when personal experience replaces public, methodical evidence or is overgeneralised. Likewise, clinical experience plays a real role in law and medicine; only absolutising it is the mistake.", "nl": "A fair note on experience: lived experience is valid evidence about what something is like, and standpoint theories stress its epistemic value. It becomes a fallacy when personal experience replaces public, methodical evidence or is overgeneralised. Likewise, clinical experience plays a real role in law and medicine; only absolutising it is the mistake."}, "sources": ["src:e5f1685e69"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "عوام‌فریبی (دستکاری هیجان جمع)، توسل به ترس (مثل «اگر این کار را نکنی پیر می‌شوی/بایکوت می‌شوی»)، استهزا (رد کردن استدلال با مسخره کردن)، توسل به ترحم و آرزواندیشی (پذیرفتن چیزی چون دلمان می‌خواهد درست باشد) همه به جای دلیل بر هیجان تکیه می‌کنند. باید دقت کرد که هیجان‌برانگیزی خودش همیشه مغالطه نیست؛ مغالطه وقتی است که هیجان جای دلیل را بگیرد.", "en": "Demagoguery (manipulating crowd emotion), appeal to fear ('if you do not do this you will age or be boycotted'), ridicule (dismissing an argument by mocking it), appeal to pity and wishful thinking (accepting something because we want it to be true) all lean on emotion instead of reasons. Note that stirring emotion is not always a fallacy; it is one when emotion replaces reasons.", "nl": "Demagoguery (manipulating crowd emotion), appeal to fear ('if you do not do this you will age or be boycotted'), ridicule (dismissing an argument by mocking it), appeal to pity and wishful thinking (accepting something because we want it to be true) all lean on emotion instead of reasons. Note that stirring emotion is not always a fallacy; it is one when emotion replaces reasons."}, "sources": ["src:e5f1685e69", "src:06a4d503e5"], "flags": ["editor-note"]}, {"text": {"fa": "بی‌اعتمادی به عقل: «چون تاکنون نتوانسته‌ایم توضیح بدهیم، پس عقل بشر هرگز نمی‌تواند» و بعد خود گوینده توضیح‌های فراوانی از همان میدان می‌دهد؛ این نوعی استدلال از نادانی است. «خودت هم همین‌طوری»: رد کردن استدلال به خاطر ناهماهنگی گوینده؛ استدلال سیگارکشی که سیگار را نقد کند از درستی نمی‌افتد. مغالطهٔ روان‌شناسانه: ریشه‌یابی روانی (کینه، ترس، کودکی) به جای بررسی خود استدلال. هر سه در متون مغالطه‌شناسی با نام‌های «استدلال از نادانی»، tu quoque و «مغالطهٔ منشأ/ژنتیک» شناخته می‌شوند.", "en": "Distrust of reason: 'since we could not explain it so far, human reason never can', after which the speaker supplies many explanations from that very field; this is an argument from ignorance. 'You too': rejecting an argument because the speaker is inconsistent; a smoker's argument against smoking does not fail for that reason. Psychologistic fallacy: tracing the argument to psychological roots (resentment, fear, childhood) instead of assessing it. In the fallacy literature these appear as argument from ignorance, tu quoque and the genetic fallacy.", "nl": "Distrust of reason: 'since we could not explain it so far, human reason never can', after which the speaker supplies many explanations from that very field; this is an argument from ignorance. 'You too': rejecting an argument because the speaker is inconsistent; a smoker's argument against smoking does not fail for that reason. Psychologistic fallacy: tracing the argument to psychological roots (resentment, fear, childhood) instead of assessing it. In the fallacy literature these appear as argument from ignorance, tu quoque and the genetic fallacy."}, "sources": ["src:e5f1685e69", "src:06a4d503e5"], "flags": ["editor-note"]}], "links": [{"to": "phil:fallacies", "rel": "see-also", "note": {"fa": "مدخل کلی‌تر دربارهٔ مغالطه‌ها و استدلال غیررسمی.", "en": "The more general entry on fallacies and informal reasoning.", "nl": "The more general entry on fallacies and informal reasoning."}}, {"to": "psy:cognitive-biases", "rel": "see-also", "note": {"fa": "بسیاری از این مغالطه‌ها با سوگیری‌های شناختی ریشه مشترک دارند.", "en": "Many of these fallacies share roots with cognitive biases.", "nl": "Many of these fallacies share roots with cognitive biases."}}, {"to": "phil:epistemic-injustice", "rel": "contrasts", "note": {"fa": "رد کردن گوینده به جای استدلال (استهزا، روان‌شناسی‌کردن) می‌تواند به بی‌عدالتی معرفتی نزدیک شود.", "en": "Dismissing the speaker instead of the argument (ridicule, psychologising) can shade into epistemic injustice.", "nl": "Dismissing the speaker instead of the argument (ridicule, psychologising) can shade into epistemic injustice."}}], "people": ["core:charles-l-hamblin"], "sources": ["src:06a4d503e5", "src:e5f1685e69"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:vanguard-praxis-and-freedom-critique", "kind": "concept", "title": {"fa": "آگاهی بیرونی، پراکسیس و دو معنای آزادی: نقد سخنران بر چپ", "en": "Outside consciousness, praxis and two meanings of freedom: the lecturer's critique of the left", "nl": "Bewustzijn van buitenaf, praxis en vrijheid: kritiek van de spreker op links"}, "aliases": [], "parent": "phil:political", "field": "phil:political", "summary": {"fa": "سخنران می‌گوید در چپ آگاهی نزد روشن‌فکر پیشرو است و مردم عادی باید به آن برسند، هر کنش باید در خدمت انقلاب باشد، و آزادیِ چپ جدید یعنی رهایی از خانواده، سنت و دین. او این‌ها را ناپخته و خطرناک می‌داند. این ادعاها فقط دربارهٔ برخی شاخه‌های چپ درست است و پاسخ‌های مخالف جدی دارند.", "en": "The lecturer says that on the left, awareness sits with the vanguard intellectual, every action should serve revolution, and the new left's freedom means escaping family, tradition and religion. He calls this immature and dangerous. These claims fit only some strands of the left and have serious rebuttals.", "nl": "Volgens de spreker ligt bewustzijn bij de voorhoede, moet elke daad de revolutie dienen en betekent vrijheid loskomen van familie en religie; dit geldt slechts voor delen van links."}, "points": [{"text": {"fa": "به گفتهٔ سخنران، در چپ آگاهی بیرون از مردم است و نزد روشن‌فکر یا نظریه‌پرداز چپ؛ هر کس کنشی خارج از خدمت به انقلاب دارد (سینما، فوتبال، کافه) «فریب‌خورده» شمرده می‌شود. این تصویر به‌ویژه با لنینیسم می‌خواند: لنین در «چه باید کرد؟» (۱۹۰۲) نوشت آگاهی سوسیالیستی از بیرون به کارگران می‌رسد.", "en": "Per the lecturer, on the left awareness lies outside the people, with the left intellectual, and anyone whose activities do not serve revolution (cinema, football, cafes) is deemed deceived. This fits Leninism especially: in What Is To Be Done? (1902) Lenin wrote that socialist consciousness is brought to workers from outside.", "nl": "Per the lecturer, on the left awareness lies outside the people, with the left intellectual, and anyone whose activities do not serve revolution (cinema, football, cafes) is deemed deceived. This fits Leninism especially: in What Is To Be Done? (1902) Lenin wrote that socialist consciousness is brought to workers from outside."}, "sources": ["src:d825bcc909", "src:4b3fcf1341"], "flags": ["editor-note"]}, {"text": {"fa": "نقد مخالف: همهٔ چپ لنینی نیست. مارکسیسم هگلی و گرامشی، رزا لوکزامبورگ و سوسیال‌دموکراسی مدافع خودآگاهی و مشارکت توده‌ها بودند و گرامشی ایده‌های روزمرهٔ مردم را جدی می‌گرفت. نسبت دادن ممنوعیت تئاتر یا کنسرت به «چپ» به‌طور کلی تعمیمی بی‌پشتوانه است.", "en": "Counter-view: not all of the left is Leninist. Hegelian Marxism, Gramsci, Rosa Luxemburg and social democracy defended mass self-awareness and participation, and Gramsci took ordinary people's ideas seriously. Attributing bans on theatre or concerts to 'the left' in general is an unsupported generalisation.", "nl": "Counter-view: not all of the left is Leninist. Hegelian Marxism, Gramsci, Rosa Luxemburg and social democracy defended mass self-awareness and participation, and Gramsci took ordinary people's ideas seriously. Attributing bans on theatre or concerts to 'the left' in general is an unsupported generalisation."}, "sources": ["src:d825bcc909"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، لوکاچ در «تاریخ و آگاهی طبقاتی» (۱۹۲۳) انقلاب را ناگزیر خشونت‌بار می‌داند. این تفسیر دقیق نیست و خود محل بحث است؛ لوکاچ بیشتر دربارهٔ آگاهی طبقاتی و بیگانگی نوشت. کاربرد خشونت در انقلاب‌های قرن بیستم (شوروی) واقعی است، اما همهٔ جریان‌های چپ آن را لازم نمی‌دانستند.", "en": "Per the lecturer, Lukács in History and Class Consciousness (1923) holds that revolution must be violent. That reading is imprecise and itself disputed; Lukács wrote mainly on class consciousness and reification. Violence in 20th-century revolutions (USSR) is documented, but not every left current held it necessary.", "nl": "Per the lecturer, Lukács in History and Class Consciousness (1923) holds that revolution must be violent. That reading is imprecise and itself disputed; Lukács wrote mainly on class consciousness and reification. Violence in 20th-century revolutions (USSR) is documented, but not every left current held it necessary."}, "sources": ["src:d825bcc909", "src:c200efe3f3"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، چپ جدید آزادی را به رهایی از خانواده، عرف و دین تعبیر کرده و این به آوارگی و آشفتگی می‌انجامد؛ مثل کسی که بدون قواعد رانندگی کند. نقد مخالف: لیبرال‌ها و بسیاری از چپ‌ها آزادی را نه بی‌قاعده، بلکه در چارچوب قانون و حقوق فردی می‌دانند (مثلاً آزادی منفی و مثبت در تمایز برلین). نقد سنت هم همیشه نابودی آن نیست و پیشرفت‌هایی مثل حقوق زنان با زیر پرسش‌بردن سنت‌ها به دست آمده است.", "en": "Per the lecturer, the new left reads freedom as escape from family, custom and religion, leading to rootlessness, like driving with no traffic rules. Counter-view: liberals and many leftists see freedom not as rule-lessness but as rights within law (cf. Berlin's negative and positive liberty), and questioning tradition has not always been destruction; gains such as women's rights came from challenging customs.", "nl": "Per the lecturer, the new left reads freedom as escape from family, custom and religion, leading to rootlessness, like driving with no traffic rules. Counter-view: liberals and many leftists see freedom not as rule-lessness but as rights within law (cf. Berlin's negative and positive liberty), and questioning tradition has not always been destruction; gains such as women's rights came from challenging customs."}, "sources": ["src:d825bcc909"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، اورول پس از تجربهٔ جنگ داخلی اسپانیا از چپ استالینی دلسرد شد. این درست است که اورول در «ادای احترام به کاتالونیا» (۱۹۳۸) کشتار درون‌چپی و کنترل شوروی را نقد کرد، اما او تا پایان خود را سوسیالیست دموکرات می‌دانست؛ پس از او نمی‌توان برای رد کلی چپ استفاده کرد. نمونهٔ طبری هم ساده‌شده است: حزب توده در ایران به شوروی وابسته بود، اما ملی‌گرایی همهٔ چپ ایرانی چنین نبود.", "en": "Per the lecturer, Orwell turned against the Stalinist left after the Spanish Civil War. True that in Homage to Catalonia (1938) Orwell criticised internal killings and Soviet control, but he called himself a democratic socialist to the end, so he cannot be used to reject the left as a whole. The Tabari example is simplified too: the Tudeh Party was Soviet-aligned, but not all Iranian left nationalism was.", "nl": "Per the lecturer, Orwell turned against the Stalinist left after the Spanish Civil War. True that in Homage to Catalonia (1938) Orwell criticised internal killings and Soviet control, but he called himself a democratic socialist to the end, so he cannot be used to reject the left as a whole. The Tabari example is simplified too: the Tudeh Party was Soviet-aligned, but not all Iranian left nationalism was."}, "sources": ["src:d825bcc909", "src:fc16e3ddc6"], "flags": ["contested", "editor-note"]}], "links": [{"to": "soc:class-consciousness", "rel": "see-also", "note": {"fa": "آگاهی طبقاتی نزد لوکاچ", "en": "Class consciousness in Lukács", "nl": "Class consciousness in Lukács"}}, {"to": "soc:western-marxism", "rel": "contrasts", "note": {"fa": "مارکسیسم هگلی (غربی)", "en": "Hegelian (Western) Marxism", "nl": "Hegelian (Western) Marxism"}}, {"to": "soc:revolution-or-reform", "rel": "see-also", "note": {"fa": "انقلاب یا اصلاح", "en": "Revolution or reform", "nl": "Revolution or reform"}}, {"to": "phil:two-liberties", "rel": "explains", "note": {"fa": "دو مفهوم آزادی", "en": "Two concepts of liberty", "nl": "Two concepts of liberty"}}], "people": ["core:vladimir-lenin", "core:george-orwell", "core:georg-luk-cs", "core:ehsan-tabari"], "sources": ["src:4b3fcf1341", "src:c200efe3f3", "src:d825bcc909", "src:fc16e3ddc6"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:fallacy-language-and-false-authority", "kind": "concept", "title": {"fa": "مغالطه‌های زبانی و معرفتی: توسل به جهل، فضل‌فروشی، آمار ساختگی، بار ارزشی واژه‌ها، مرجع کاذب و تجسم", "en": "Language and knowledge fallacies: appeal to ignorance, pedantry, bogus numbers, loaded words, false authority, reification", "nl": "Taal- en kennisfouten: beroep op onwetendheid, schijngeleerdheid, schijncijfers, beladen woorden, valse autoriteit, verdinglijking"}, "aliases": [], "parent": "phil:epistemology", "field": "phil:epistemology", "summary": {"fa": "این بخش شش ترفند را کنار هم می‌گذارد که به شیوهٔ حرف زدن و نحوهٔ استناد به دانش مربوط‌اند: نتیجه‌گرفتن از ندانستن، پنهان شدن پشت واژه‌های سخت، آمار بی‌معنا، واژه‌های بار‌دار، استناد به کسی که متخصص آن موضوع نیست و واقعی‌انگاشتن مفاهیم انتزاعی. او تأکید می‌کند که بعضی از این‌ها، مثل ارجاع به کارشناس یا استدلال از سکوت شواهد، همیشه مغالطه نیستند.", "en": "This entry groups six tricks about how we talk and how we cite knowledge: concluding from ignorance, hiding behind hard words, meaningless statistics, loaded vocabulary, citing someone who is no expert on the topic, and treating abstractions as concrete things. The lecturer stresses that some of these, such as consulting an expert or arguing from missing evidence, are not always fallacies.", "nl": "Zes trucs rond taalgebruik en het aanhalen van kennis: conclusies uit onwetendheid, schuilen achter moeilijke woorden, betekenisloze cijfers, beladen woorden, een niet-deskundige als autoriteit en abstracties als concrete dingen behandelen."}, "points": [{"text": {"fa": "توسل به جهل: از «هیچ‌کس خبر ندارد» نتیجه می‌گیرند «پس وجود ندارد». مثال سخنران: نبودن دلیل بر موجودات فرازمینی، دلیل نبودنشان نیست. اما او می‌گوید این استدلال همیشه نادرست نیست: وقتی اگر رویدادی رخ داده بود باید ردپای آشکاری می‌گذاشت و نگذاشته، نبود شواهد خودش شاهد است.", "en": "Appeal to ignorance: 'nobody knows of X, so X does not exist'. Yet the lecturer notes it is not always fallacious: when an event would surely have left traces and none exist, absence of evidence is itself some evidence.", "nl": "Appeal to ignorance: 'nobody knows of X, so X does not exist'. Yet the lecturer notes it is not always fallacious: when an event would surely have left traces and none exist, absence of evidence is itself some evidence."}, "sources": ["src:a81ae2997d"], "flags": []}, {"text": {"fa": "فضل‌فروشی: استفاده از واژه‌های پیچیده یا نقل متن به زبانی که مخاطب نمی‌فهمد (مثلاً آیات به عربی) تا او را تحت تأثیر قرار دهند. آمار ساختگی (کمیت‌گرایی): عددهایی که معنایش روشن نیست، مثل «رشد ۱۰۰ درصد» بدون دانستن مبنا، یا «از هر ده نفر نه نفر» بدون روش شمارش.", "en": "Pedantry and bogus numbers: obscure vocabulary or untranslated quotations to impress; statistics with no base or method, such as '100% growth' without the starting value.", "nl": "Pedantry and bogus numbers: obscure vocabulary or untranslated quotations to impress; statistics with no base or method, such as '100% growth' without the starting value."}, "sources": ["src:a81ae2997d"], "flags": []}, {"text": {"fa": "بار ارزشی واژه‌ها: انتخاب واژه‌ای مثبت یا منفی برای یک رویداد که قضاوت را از پیش جا می‌اندازد؛ مثل «عملیات ویژه» به‌جای «حمله»، یا «معترض» برای یک گروه و «اغتشاشگر» برای گروه مشابه دیگر.", "en": "Loaded language: choosing positive or negative words to settle the judgement in advance, e.g. 'special operation' versus 'invasion', or 'protesters' versus 'rioters' for similar crowds.", "nl": "Loaded language: choosing positive or negative words to settle the judgement in advance, e.g. 'special operation' versus 'invasion', or 'protesters' versus 'rioters' for similar crowds."}, "sources": ["src:a81ae2997d"], "flags": []}, {"text": {"fa": "توسل به مرجع کاذب: ارجاع به متخصص در حوزهٔ تخصصش معقول است (هرچند برهان قطعی نیست)، اما استناد به کسی که در آن موضوع صلاحیت ندارد، مثل نقل قول از یک رهبر دینی در بحث اقتصاد، مغالطه است.", "en": "False authority: citing an expert within their field is reasonable though not conclusive; citing someone with no competence in the topic is fallacious.", "nl": "False authority: citing an expert within their field is reasonable though not conclusive; citing someone with no competence in the topic is fallacious."}, "sources": ["src:a81ae2997d"], "flags": []}, {"text": {"fa": "تجسم: مفهوم انتزاعی (مثل «نظام») چنان رفتار می‌شود که گویی موجودی واقعی است که باید به هر قیمتی حفظش کرد، حتی به قیمت رنج انسان‌های واقعی. به گفتهٔ سخنران، این استدلال را حکومت‌ها برای توجیه سرکوب به کار می‌برند.", "en": "Reification: an abstract concept ('the system') is treated as a real thing to be preserved at any cost, even at the cost of real people's suffering. Per the lecturer, regimes use this to justify repression.", "nl": "Reification: an abstract concept ('the system') is treated as a real thing to be preserved at any cost, even at the cost of real people's suffering. Per the lecturer, regimes use this to justify repression."}, "sources": ["src:a81ae2997d"], "flags": ["editor-note"]}, {"text": {"fa": "مثال شق‌القمر از سخنران (استدلال از سکوت منابع تمدن‌های دیگر) استدلالی تاریخی است که مورد اختلاف است: مخالفانش می‌گویند رویدادهای ادعایی ممکن است محلی، کوتاه یا بی‌ثبت مانده باشند و منابع دورهٔ آن عصر اندک است؛ آن‌ها نیز دربارهٔ باورهای دینی نظر می‌دهند. این بخش نظر سخنران است نه حکم تاریخ‌نگاری.", "en": "The lecturer's 'splitting of the moon' example is an argument from silence in other civilizations' records; it is contested, since sources are sparse and a brief, local or unrecorded event is not excluded. It reflects his opinion, not a settled historiographical verdict.", "nl": "The lecturer's 'splitting of the moon' example is an argument from silence in other civilizations' records; it is contested, since sources are sparse and a brief, local or unrecorded event is not excluded. It reflects his opinion, not a settled historiographical verdict."}, "sources": ["src:a81ae2997d"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "پژوهش‌های معاصر دربارهٔ مغالطه‌ها نشان می‌دهد «توسل به جهل» و «مرجع» وقتی به‌صورت احتمالی و با شرط‌های درست به کار روند، می‌توانند استدلال‌های معتبرند؛ مغالطه بودن آن‌ها به بافت بستگی دارد.", "en": "Contemporary argumentation theory (Walton) shows that argument from ignorance and from authority can be reasonable presumptive arguments under the right conditions; whether they are fallacious depends on context.", "nl": "Contemporary argumentation theory (Walton) shows that argument from ignorance and from authority can be reasonable presumptive arguments under the right conditions; whether they are fallacious depends on context."}, "sources": ["src:05d15fe653"], "flags": ["contested", "editor-note"]}], "links": [{"to": "phil:fallacies", "rel": "part-of", "note": {"fa": "از خانوادهٔ مغالطه‌ها", "en": "Part of the family of fallacies", "nl": "Part of the family of fallacies"}}, {"to": "phil:fallacy-appeals-to-feeling-and-force", "rel": "see-also", "note": {"fa": "ترفندهای فشار و احساس", "en": "Appeals to feeling and force", "nl": "Appeals to feeling and force"}}, {"to": "phil:epistemic-injustice", "rel": "see-also", "note": {"fa": "مرجعیت و اعتبار دانش با بی‌عدالتی معرفتی پیوند دارد", "en": "Authority and credibility connect to epistemic injustice", "nl": "Authority and credibility connect to epistemic injustice"}}, {"to": "phil:epistemology", "rel": "part-of", "note": {"fa": "معرفت‌شناسی", "en": "Epistemology", "nl": "Epistemology"}}], "people": [], "sources": ["src:05d15fe653", "src:a81ae2997d"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:paradigms", "kind": "concept", "title": {"fa": "پارادایم‌ها و انقلاب‌های علمی", "en": "Paradigms and scientific revolutions", "nl": "Paradigma's en wetenschappelijke revoluties"}, "aliases": [], "parent": "phil:science", "field": "phil:science", "summary": {"fa": "کوهن با نگاه تاریخی نشان داد علم بیشتر وقت‌ها «عادی» است: حل معما درون یک پارادایم (مجموعه‌ای از فرض‌ها، روش‌ها و نمونه‌های الگو). ناهنجاری‌ها انباشته می‌شوند تا بحران و سپس انقلاب: پارادایم تازه‌ای که با قبلی «قیاس‌ناپذیر» است. پیشرفت علم خطی و انباشتی نیست.", "en": "Kuhn, looking at history, showed science is mostly \"normal\": puzzle-solving within a paradigm (a set of assumptions, methods and exemplars). Anomalies accumulate until crisis and then revolution: a new paradigm \"incommensurable\" with the old. Scientific progress is not linear and cumulative.", "nl": "Kuhn toonde historisch dat wetenschap meestal \"normaal\" is: puzzels oplossen binnen een paradigma (een geheel van aannames, methoden en voorbeelden). Anomalieën stapelen zich op tot crisis en dan revolutie: een nieuw paradigma dat \"incommensurabel\" is met het oude. Wetenschappelijke vooruitgang is niet lineair en cumulatief."}, "points": [{"text": {"fa": "کوهن (۱۹۶۲): دانشمندانِ پارادایم‌های رقیب تا حدی «در جهان‌های متفاوت» کار می‌کنند و حتی داده را متفاوت می‌بینند؛ گذار به پارادایم تازه شبیه «تغییر گشتالت» است و با دلیل صرف انجام نمی‌شود. منتقدان این را نسبی‌گرایی خواندند؛ کوهن انکار کرد.", "en": "Kuhn (1962): scientists of rival paradigms work partly \"in different worlds\" and even see data differently; the shift to a new paradigm resembles a \"gestalt switch\" and is not made by argument alone. Critics called this relativism; Kuhn denied it.", "nl": "Kuhn (1962): scientists of rival paradigms work partly \"in different worlds\" and even see data differently; the shift to a new paradigm resembles a \"gestalt switch\" and is not made by argument alone. Critics called this relativism; Kuhn denied it."}, "sources": ["src:1d46a7c051"], "flags": ["contested"]}, {"text": {"fa": "داگلاس (۲۰۰۹): آرمان «علمِ خالی از ارزش» ناممکن است، چون هر پذیرش فرضیه خطر خطا دارد و اینکه چقدر شاهد «کافی» است به پیامدهای خطا (ارزش‌ها) بستگی دارد؛ ارزش‌ها نقش مشروع ولی غیرمستقیم دارند.", "en": "Douglas (2009): the ideal of \"value-free science\" is impossible, because accepting any hypothesis risks error, and how much evidence is \"enough\" depends on the consequences of error (values); values have a legitimate but indirect role.", "nl": "Douglas (2009): the ideal of \"value-free science\" is impossible, because accepting any hypothesis risks error, and how much evidence is \"enough\" depends on the consequences of error (values); values have a legitimate but indirect role."}, "sources": ["src:c6bde39ef4"], "flags": []}, {"text": {"fa": "روان‌شناسی و روان‌پزشکی نمونهٔ خوبی از «علم چندپارادایمی»اند: روان‌کاوی، رفتارگرایی، شناخت‌گرایی و عصب‌زیست‌شناسی هم‌زمان زیسته‌اند؛ بحث «نظام تشخیص» (DSM در برابر ابعادی) جدال پارادایمی زنده است.", "en": "Psychology and psychiatry are good examples of a \"multi-paradigm science\": psychoanalysis, behaviourism, cognitivism and neurobiology have coexisted; the \"diagnostic system\" debate (DSM versus dimensional) is a live paradigm struggle.", "nl": "Psychology and psychiatry are good examples of a \"multi-paradigm science\": psychoanalysis, behaviourism, cognitivism and neurobiology have coexisted; the \"diagnostic system\" debate (DSM versus dimensional) is a live paradigm struggle."}, "sources": ["src:1d46a7c051"], "flags": []}], "links": [{"to": "phil:falsification", "rel": "contrasts", "note": {"fa": "پوپر", "en": "Popper", "nl": "Popper"}}, {"to": "psy:dimensional-dx", "rel": "bridges", "note": {"fa": "تشخیص ابعادی در برابر مقوله‌ای", "en": "Dimensional versus categorical diagnosis", "nl": "Dimensional versus categorical diagnosis"}}, {"to": "psy:p-history", "rel": "bridges", "note": {"fa": "تاریخ روان‌شناسی", "en": "The history of psychology", "nl": "The history of psychology"}}], "people": ["core:thomas-kuhn", "core:heather-douglas"], "sources": ["src:1d46a7c051", "src:c6bde39ef4"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:normalization-banality-of-evil", "kind": "concept", "title": {"fa": "عادی‌سازی ناکارآمدی و «ابتذال شر» آرنت", "en": "Normalising dysfunction and Arendt's 'banality of evil'", "nl": "Normaliseren van wanbeheer en Arendts 'banaliteit van het kwaad'"}, "aliases": [], "parent": "phil:political", "field": "phil:political", "summary": {"fa": "مجری‌ها می‌گویند وقتی مسئولان گم‌شدن کالا یا قطع آب و برق را «عادی» می‌نامند و برای امتیازهای ناعادلانه توجیه می‌آورند، این «ابتذال شر» است. این مدخل معنای اصلی مفهوم آرنت و بحث‌های دربارهٔ آن را توضیح می‌دهد.", "en": "The hosts say that when officials call lost goods or power and water cuts 'normal' and justify unfair privileges, this is the 'banality of evil'. The entry explains Arendt's original concept and the debates over it.", "nl": "De presentatoren noemen het 'banaliteit van het kwaad' wanneer functionarissen verlies van goederen of stroomuitval 'normaal' noemen en privileges rechtvaardigen. Dit lemma legt Arendts oorspronkelijke begrip en de discussie uit."}, "points": [{"text": {"fa": "به گفتهٔ مجری‌ها، عادی‌خواندن ناکارآمدی و فساد و سپس توجیه نابرابری‌ها نمونه‌ای از «ابتذال شر» است. آن‌ها این را بدون حکم دربارهٔ تک‌تک افراد، به‌عنوان نقد زبان رسمی به‌کار می‌برند.", "en": "Per the hosts, calling dysfunction and corruption 'normal' and then excusing inequalities is an example of the 'banality of evil'. They use it as a critique of official language, not as a verdict on named individuals.", "nl": "Per the hosts, calling dysfunction and corruption 'normal' and then excusing inequalities is an example of the 'banality of evil'. They use it as a critique of official language, not as a verdict on named individuals."}, "sources": ["src:9433492748"], "flags": ["editor-note"]}, {"text": {"fa": "آرنت در «آیشمان در اورشلیم» (۱۹۶۳) نوشت که آیشمان بیشتر از آنکه هیولا باشد، آدمی بی‌اندیشه و پیرو دستور بود. مقصودش توجیه‌کردن شر نبود، بلکه این بود که شر بزرگ می‌تواند از بی‌فکری و اطاعت بیاید.", "en": "In Eichmann in Jerusalem (1963) Arendt wrote that Eichmann was less a monster than a thoughtless, order-following functionary. She did not mean justifying evil, but that great evil can arise from thoughtlessness and obedience.", "nl": "In Eichmann in Jerusalem (1963) Arendt wrote that Eichmann was less a monster than a thoughtless, order-following functionary. She did not mean justifying evil, but that great evil can arise from thoughtlessness and obedience."}, "sources": ["src:e744201744"], "flags": []}, {"text": {"fa": "کاربرد مجری‌ها آزاد و استعاری است: «عادی‌سازی» با «بی‌فکری یک کارمند در ماشین کشتار» تفاوت بزرگی دارد و مقایسهٔ مستقیم می‌تواند مفهوم را از اندازه بیندازد.", "en": "The hosts' use is loose and metaphorical: normalising dysfunction differs greatly from a functionary's thoughtlessness inside a killing machine, and a direct comparison can stretch the concept.", "nl": "The hosts' use is loose and metaphorical: normalising dysfunction differs greatly from a functionary's thoughtlessness inside a killing machine, and a direct comparison can stretch the concept."}, "sources": ["src:9433492748"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "خود نظر آرنت هم مورد اختلاف است: پژوهشگرانی مانند برتینا استانگنت (۲۰۱۱) با استناد به اسناد تازه گفته‌اند آیشمان ایدئولوگ آگاهی بود و آن‌قدر که آرنت تصور می‌کرد بی‌فکر نبود.", "en": "Arendt's thesis itself is disputed: scholars such as Bettina Stangneth (2011) argue from new documents that Eichmann was a committed ideologue and less thoughtless than Arendt portrayed.", "nl": "Arendt's thesis itself is disputed: scholars such as Bettina Stangneth (2011) argue from new documents that Eichmann was a committed ideologue and less thoughtless than Arendt portrayed."}, "sources": ["src:52d4dc9d84"], "flags": ["contested", "editor-note"]}], "links": [{"to": "soc:selective-access-white-sim-rent", "rel": "see-also", "note": {"fa": "نمونه‌ای که مجری‌ها این مفهوم را به آن اطلاق می‌کنند", "en": "The case the hosts apply this concept to", "nl": "The case the hosts apply this concept to"}}, {"to": "phil:political", "rel": "part-of", "note": {"fa": "فلسفهٔ سیاسی", "en": "Political philosophy", "nl": "Political philosophy"}}, {"to": "phil:moral-luck", "rel": "see-also", "note": {"fa": "مسئولیت اخلاقی و شرایط", "en": "Moral responsibility and circumstance", "nl": "Moral responsibility and circumstance"}}], "people": ["core:hannah-arendt", "core:bettina-stangneth"], "sources": ["src:52d4dc9d84", "src:9433492748", "src:e744201744"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:hegel-phenomenology-spirit", "kind": "concept", "title": {"fa": "هگل: روح، آگاهی و حرکت تاریخ به‌سوی آزادی", "en": "Hegel: spirit, consciousness and history moving toward freedom", "nl": "Hegel: geest, bewustzijn en de geschiedenis op weg naar vrijheid"}, "aliases": [], "parent": "phil:epistemology", "field": "phil:epistemology", "summary": {"fa": "هگل در کتاب «پدیدارشناسی روح» (۱۸۰۷) می‌پرسد آگاهی انسان در طول تاریخ چگونه رشد کرده است. به نظر او آگاهی ثابت نیست و از راه کشمکش‌ها و تضادها مرحله‌به‌مرحله پیش می‌رود. او پیشرفت تاریخ را حرکت به سوی آزادی می‌داند. این ایده‌ها مبنای فکری مارکس جوان شدند.", "en": "In the Phenomenology of Spirit (1807) Hegel asks how human consciousness has developed through history. For him consciousness is not fixed; it advances stage by stage through conflicts and contradictions, and history is read as a movement toward freedom. These ideas became the intellectual ground of the young Marx.", "nl": "In de Fenomenologie van de geest (1807) vraagt Hegel hoe het menselijk bewustzijn zich door de geschiedenis heeft ontwikkeld: via tegenstellingen, stap voor stap, richting vrijheid. Dit denken vormde de basis van de jonge Marx."}, "points": [{"text": {"fa": "«روح» (Geist) در فلسفهٔ هگل نام فرایندی است که در فرهنگ، قانون، سیاست و اندیشهٔ انسان‌ها پدیدار می‌شود و در طول تاریخ خودش را بهتر می‌شناسد. هگل می‌خواست روش فلسفه را به دقت یک علم برساند و نظرهای پیشینیان را رد نکند، بلکه آن‌ها را مرحله‌هایی از همین رشد بداند.", "en": "Spirit (Geist) names the process that shows itself in culture, law, politics and thought, and that comes to know itself better through history. Hegel wanted philosophy to reach the rigour of a science, and treated earlier thinkers not as refuted but as stages of the same growth.", "nl": "Spirit (Geist) names the process that shows itself in culture, law, politics and thought, and that comes to know itself better through history. Hegel wanted philosophy to reach the rigour of a science, and treated earlier thinkers not as refuted but as stages of the same growth."}, "sources": ["src:85227fe9b7", "src:746db1b948"], "flags": []}, {"text": {"fa": "در بخش خودآگاهی، رابطهٔ ارباب (خدایگان) و بنده نخستین صحنهٔ تاریخ اندیشه است. بنده برای رسیدن به آزادی باید اول خودآگاه شود. به روایت سخنران، ذهن بنده سه مرحله را می‌گذراند: رواقی‌گری (احساس آزادیِ فقط درونی)، شکاکیت (شکاف میان آنچه فکر می‌کنم و آنچه جامعه هست) و «آگاهی اندوهبار» (پناه بردن به دین).", "en": "In the section on self-consciousness, the master–slave relation is an early scene of the history of thought: to become free the servant must first become self-conscious. As the lecturer tells it, the servant's mind passes through three stages: Stoicism (freedom felt only inwardly), Scepticism (a gap between what I think and what society is) and the unhappy consciousness (turning to religion).", "nl": "In the section on self-consciousness, the master–slave relation is an early scene of the history of thought: to become free the servant must first become self-conscious. As the lecturer tells it, the servant's mind passes through three stages: Stoicism (freedom felt only inwardly), Scepticism (a gap between what I think and what society is) and the unhappy consciousness (turning to religion)."}, "sources": ["src:b4ab8b990d", "src:85227fe9b7", "src:746db1b948"], "flags": []}, {"text": {"fa": "هگل با کانت مخالف است که می‌گوید عقل و خواسته‌های نفسانی تا ابد در جدال می‌مانند و ما فقط نمودها را می‌شناسیم نه شیء فی‌نفسه. به روایت سخنران، هگل با نگاه تاریخی پاسخ می‌دهد: در یونان باستان فرد خود را جزئی از شهر می‌دید و این شکاف کم بود؛ بعد وجدان فردی (که هگل اوجش را در پروتستانیسم می‌بیند) پدید آمد؛ و مرحلهٔ بعد آشتی میان وجدان فردی و خواست جمع است.", "en": "Hegel rejects Kant's view that reason and inclination stay at war for ever and that we only know appearances, not the thing-in-itself. As the lecturer tells it, Hegel answers historically: in ancient Greece the individual saw himself as part of the polis and the split was small; individual conscience then emerged (peaking, for Hegel, with Protestantism); the next stage is a reconciliation of individual conscience and the common will.", "nl": "Hegel rejects Kant's view that reason and inclination stay at war for ever and that we only know appearances, not the thing-in-itself. As the lecturer tells it, Hegel answers historically: in ancient Greece the individual saw himself as part of the polis and the split was small; individual conscience then emerged (peaking, for Hegel, with Protestantism); the next stage is a reconciliation of individual conscience and the common will."}, "sources": ["src:b4ab8b990d", "src:85227fe9b7", "src:0a5b54d8b3"], "flags": []}, {"text": {"fa": "به گفتهٔ سخنران، هگل از «دیالکتیک» برای توضیح این حرکت استفاده می‌کند و سه‌گانهٔ تز–آنتی‌تز–سنتز را با یونان (هماهنگی ساده)، وجدان فردی و آشتی دو طرف تطبیق می‌دهد. او همچنین می‌گوید دولت برای هگل ضامن آزادی‌های فردی است، و هگل شکل حکومت را کم‌اهمیت‌تر از محتوای آن می‌دانست.", "en": "Per the lecturer, Hegel uses dialectic to explain this movement, and he maps the thesis–antithesis–synthesis triad onto Greek simple harmony, individual conscience and their reconciliation. He adds that for Hegel the state guarantees individual freedoms, and that the form of government matters less than its content.", "nl": "Per the lecturer, Hegel uses dialectic to explain this movement, and he maps the thesis–antithesis–synthesis triad onto Greek simple harmony, individual conscience and their reconciliation. He adds that for Hegel the state guarantees individual freedoms, and that the form of government matters less than its content."}, "sources": ["src:b4ab8b990d"], "flags": ["editor-note"]}, {"text": {"fa": "توضیح تکمیلی: سه‌گانهٔ «تز–آنتی‌تز–سنتز» را معمولاً به فیشته و شارحان بعدی نسبت می‌دهند و خود هگل تقریباً هیچ‌گاه این قالب را به کار نبرد. بنابراین آن را باید خلاصهٔ ساده‌شده‌ای از فلسفهٔ او دانست، نه عین حرف او.", "en": "Caveat: the thesis–antithesis–synthesis triad is usually traced to Fichte and later commentators, and Hegel himself almost never used that formula, so it is a simplified summary of his thought, not his own wording.", "nl": "Caveat: the thesis–antithesis–synthesis triad is usually traced to Fichte and later commentators, and Hegel himself almost never used that formula, so it is a simplified summary of his thought, not his own wording."}, "sources": ["src:29497892a2"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "توضیح تکمیلی: سخنران «از‌خودبیگانگی» را در هگل به معنای فرافکنی تواناییِ انسان بر خداوند می‌گیرد. این برداشت در واقع بیشتر به فویرباخ (۱۸۴۱) تعلق دارد. در هگل بیگانگی (Entfremdung) بیشتر به معنای دورشدن «روح» از خودش در جهان عینی و فرهنگ است. همچنین سخنران گفته هگل آفریقایی‌ها و آسیایی‌ها را فاقد «سوژه» می‌داند؛ این بخشی از دید اروپامحورانهٔ هگل در درس‌گفتارهای فلسفهٔ تاریخ است که امروز به‌شدت نقد می‌شود و نباید به‌عنوان حقیقت پذیرفته شود.", "en": "Caveat: the lecturer reads alienation in Hegel as projecting human powers onto God, which is really closer to Feuerbach (1841); in Hegel, Entfremdung is mostly spirit's estrangement from itself in the objective world and culture. His report that Hegel denies Africans and Asians the 'subject' reflects the Eurocentric strand of Hegel's Lectures on the Philosophy of History, which is heavily criticised today and should not be taken as fact.", "nl": "Caveat: the lecturer reads alienation in Hegel as projecting human powers onto God, which is really closer to Feuerbach (1841); in Hegel, Entfremdung is mostly spirit's estrangement from itself in the objective world and culture. His report that Hegel denies Africans and Asians the 'subject' reflects the Eurocentric strand of Hegel's Lectures on the Philosophy of History, which is heavily criticised today and should not be taken as fact."}, "sources": ["src:c73dda8959"], "flags": ["contested", "editor-note"]}], "links": [{"to": "soc:marx-young-hegelian-roots", "rel": "explains", "note": {"fa": "ایده‌هایی که مارکس جوان از هگل گرفت", "en": "What the young Marx took from Hegel", "nl": "What the young Marx took from Hegel"}}, {"to": "phil:two-liberties", "rel": "see-also", "note": {"fa": "آزادی مثبت و منفی", "en": "Positive and negative liberty", "nl": "Positive and negative liberty"}}, {"to": "soc:enlightenment-break", "rel": "part-of", "note": {"fa": "زمینهٔ روشنگری و فلسفهٔ آلمانی", "en": "The Enlightenment backdrop of German philosophy", "nl": "The Enlightenment backdrop of German philosophy"}}], "people": ["core:georg-wilhelm-friedrich-hegel", "core:immanuel-kant"], "sources": ["src:0a5b54d8b3", "src:29497892a2", "src:746db1b948", "src:85227fe9b7", "src:b4ab8b990d", "src:c73dda8959"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:wisdom-good-pleasant-meaningful", "kind": "concept", "title": {"fa": "حکمت و مثلث زندگی مطلوب: خوبی، خوشی، معنا (چارچوب سخنران)", "en": "Wisdom and the triangle of a good life: goodness, pleasure, meaning (the lecturer's framework)", "nl": "Wijsheid en de driehoek van het goede leven: goed, prettig, zinvol (kader van de docent)"}, "aliases": [], "parent": "phil:ethics", "field": "phil:ethics", "summary": {"fa": "سخنران حکمت را دانشی عملی برای زندگی خوب می‌داند و زندگی مطلوب را مثلثی با سه ضلع می‌بیند: زندگی اخلاقی (خوبی)، رضایت و آرامش روانی (خوشی) و داشتن معنا و هدف. این چارچوب برداشت و ترکیب خود اوست، نه آموزهٔ رسمی یک مکتب؛ او نتیجه می‌گیرد آموزش باید فراتر از مهارت شغلی، «مهارت زندگی» هم بیاموزد.", "en": "The lecturer treats wisdom as practical knowledge for living well, and pictures a good life as a triangle with three sides: ethical life (goodness), psychological contentment (pleasantness) and meaning or purpose. This is his own synthesis, not the official doctrine of any school; he concludes that education should teach life skills beyond job skills.", "nl": "De docent ziet wijsheid als praktische kennis om goed te leven en beschrijft het goede leven als een driehoek: moreel leven (goed), psychisch welbevinden (prettig) en zin of doel. Dit is zijn eigen synthese; hij concludeert dat onderwijs naast beroepsvaardigheden ook levenskunst moet bijbrengen."}, "points": [{"text": {"fa": "به گفتهٔ سخنران، «حکیم» کسی است که آنچه برای زندگی مطلوب باید دانست می‌داند و بر پایهٔ آن عمل می‌کند؛ پس حکمت دانش صرفاً نظری یا هر اطلاعاتی نیست، بلکه دانشی است که به عمل تبدیل می‌شود.", "en": "Per the lecturer, the 'sage' is someone who knows what one needs to know for a good life and acts on that knowledge; wisdom is thus not purely theoretical knowledge or just any information but knowledge that turns into action.", "nl": "Per the lecturer, the 'sage' is someone who knows what one needs to know for a good life and acts on that knowledge; wisdom is thus not purely theoretical knowledge or just any information but knowledge that turns into action."}, "sources": ["src:873416a5d1"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، زندگی مطلوب سه ضلع دارد و هر سه لازم‌اند: «خوبی» (فضیلت و پایبندی به اخلاق)، «خوشی» (شادی، آرامش، سلامت و رضایت روانی) و «معنا» (هدفی بلندمدت فراتر از روزمرگی و مصرف). او می‌گوید زندگی اخلاقیِ بی‌خوشی، خوشیِ بی‌اخلاق و زندگیِ بی‌معنا هر یک ناقص‌اند.", "en": "Per the lecturer, a good life has three sides, all necessary: 'goodness' (virtue and ethical commitment), 'pleasantness' (joy, calm, health, psychological satisfaction) and 'meaning' (a long-term purpose beyond routine and consumption). He holds that an ethical life without joy, joy without ethics, and a life without meaning are each incomplete.", "nl": "Per the lecturer, a good life has three sides, all necessary: 'goodness' (virtue and ethical commitment), 'pleasantness' (joy, calm, health, psychological satisfaction) and 'meaning' (a long-term purpose beyond routine and consumption). He holds that an ethical life without joy, joy without ethics, and a life without meaning are each incomplete."}, "sources": ["src:873416a5d1"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، آموزش مدرن بیش از حد بر تخصص و شغل تکیه دارد؛ بدون پایه‌های اخلاق، شادی و معنا، فرزندان با وجود موفقیت شغلی به پوچی می‌رسند. پس مدرسه و خانواده باید «حکمت زندگی» را هم بپرورانند و از انباشت اطلاعات بی‌ربط پرهیز کنند.", "en": "Per the lecturer, modern education leans too heavily on expertise and careers; without ethics, joy and meaning as foundations, children may feel empty despite career success. Schools and families should therefore also cultivate 'life wisdom' and avoid piling up irrelevant information.", "nl": "Per the lecturer, modern education leans too heavily on expertise and careers; without ethics, joy and meaning as foundations, children may feel empty despite career success. Schools and families should therefore also cultivate 'life wisdom' and avoid piling up irrelevant information."}, "sources": ["src:873416a5d1"], "flags": ["editor-note"]}, {"text": {"fa": "این مثلث ساختهٔ خود سخنران است و یک نظریهٔ استاندارد نیست. چارچوب‌های مشابهی وجود دارند، مثل «زندگی لذت‌بخش، درگیر و معنادار» نزد سلیگمن یا «دل‌بستگی به چیزهای ارزشمند» نزد سوزان وولف، اما آن‌ها با هم یکی نیستند. همچنین این‌که همهٔ مکتب‌های باستان و شرق «زندگی خوب» را فقط پایبندی به اخلاق می‌دانستند ساده‌سازی است: رواقیان فضیلت را برای خوشبختی کافی می‌دانستند، ارسطو دارایی‌ها و شرایط بیرونی را هم لازم می‌شمرد، و هدف بودا رهایی از رنج است.", "en": "The triangle is the lecturer's own construction, not a standard theory. Similar frameworks exist, such as the pleasant, engaged and meaningful lives in Seligman, or 'fitting fulfilment' in Susan Wolf, but they are not identical. Claiming that all ancient and Eastern schools simply equated the good life with moral commitment is a simplification: Stoics held virtue sufficient for happiness, Aristotle also required external goods, and the Buddha's aim is liberation from suffering.", "nl": "The triangle is the lecturer's own construction, not a standard theory. Similar frameworks exist, such as the pleasant, engaged and meaningful lives in Seligman, or 'fitting fulfilment' in Susan Wolf, but they are not identical. Claiming that all ancient and Eastern schools simply equated the good life with moral commitment is a simplification: Stoics held virtue sufficient for happiness, Aristotle also required external goods, and the Buddha's aim is liberation from suffering."}, "sources": ["src:74af762861", "src:f21fea0c4c", "src:77b209e41f"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "پیوند دادن این مثلث به نیچه هم محل بحث است: نیچه خوشبختی را هدف زندگی نمی‌دانست («انسان در پی خوشبختی نیست، فقط انگلیسی چنین می‌کند») و آشتی‌دادن فضیلت و شادی به شیوهٔ سقراط و ارسطو را قبول نداشت. پس مثلث بیشتر ایدهٔ خود سخنران است تا پاسخ نیچه.", "en": "Linking this triangle to Nietzsche is also debatable: Nietzsche did not treat happiness as life's aim ('man does not strive for happiness; only the Englishman does') and did not accept the Socratic-Aristotelian harmony of virtue and happiness. The triangle is thus more the lecturer's own idea than Nietzsche's answer.", "nl": "Linking this triangle to Nietzsche is also debatable: Nietzsche did not treat happiness as life's aim ('man does not strive for happiness; only the Englishman does') and did not accept the Socratic-Aristotelian harmony of virtue and happiness. The triangle is thus more the lecturer's own idea than Nietzsche's answer."}, "sources": ["src:127df9d5d4"], "flags": ["contested", "editor-note"]}], "links": [{"to": "phil:stoicism", "rel": "see-also", "note": {"fa": "رواقی‌گری و زندگی خوب", "en": "Stoicism and the good life", "nl": "Stoicism and the good life"}}, {"to": "phil:three-theories", "rel": "see-also", "note": {"fa": "سه نظریهٔ بزرگ اخلاق", "en": "The three great moral theories", "nl": "The three great moral theories"}}, {"to": "psy:happiness-origins", "rel": "bridges", "note": {"fa": "ریشه‌های شادکامی", "en": "The origins of happiness", "nl": "The origins of happiness"}}, {"to": "phil:nietzsche-god-is-dead-nihilism", "rel": "part-of", "note": {"fa": "پاسخ سخنران به بحران مرگ خدا", "en": "The lecturer's response to the death-of-God crisis", "nl": "The lecturer's response to the death-of-God crisis"}}], "people": ["core:aristotle", "core:friedrich-nietzsche"], "sources": ["src:127df9d5d4", "src:74af762861", "src:77b209e41f", "src:873416a5d1", "src:f21fea0c4c"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:common-sense-as-collective-lived-reason", "kind": "concept", "title": {"fa": "عقل متعارف به‌عنوان عقل جمعیِ برآمده از تجربهٔ زیسته", "en": "Common sense as collective reason grounded in lived experience", "nl": "Gezond verstand als collectieve, ervaringsgebonden rede"}, "aliases": [], "parent": "phil:epistemology", "field": "phil:epistemology", "summary": {"fa": "در این گفتگو دو برداشت از عقل رو‌به‌رو می‌شود: عقل انتزاعی دکارتی و عقل عرفی که از تجربه، خاطره، حسرت و رؤیای مردم ساخته می‌شود. به گفتهٔ سخنران، نارضایتی نسل جدید ریشه در تجربهٔ زیستهٔ رنج دارد و نباید آن را بی‌خردی دانست.", "en": "The conversation contrasts abstract Cartesian reason with common sense formed from people's experience, memory, longing and dreams. Per the lecturer, the new generation's discontent grows out of lived hardship and should not be dismissed as irrational.", "nl": "Het gesprek zet abstracte cartesiaanse rede tegenover gezond verstand dat uit ervaring, herinnering en verlangen groeit."}, "points": [{"text": {"fa": "به گفتهٔ سخنران، عقل متعارف یک «بستهٔ جمعی» است که علاوه بر استدلال، خاطره، نوستالژی، آرزو و حتی رؤیاپردازی را هم در خود دارد، در حالی که عقل خشک دکارتی این‌ها را کنار می‌زند.", "en": "Per the lecturer, common sense is a collective package that carries memory, nostalgia, hopes and fantasy alongside inference, which a dry Cartesian reason would set aside.", "nl": "Per the lecturer, common sense is a collective package that carries memory, nostalgia, hopes and fantasy alongside inference, which a dry Cartesian reason would set aside."}, "sources": ["src:298b2455e6"], "flags": ["editor-note"]}, {"text": {"fa": "او می‌گوید این عقل جمعی از گفت‌وگوی روزمره (درددل با دوست، خانواده و همسایه دربارهٔ اجاره و قبض) ساخته می‌شود و به آگاهی جمعی از شرایط می‌انجامد.", "en": "He says this collective reason is built through everyday talk (friends, family, neighbours discussing rent and bills) and becomes shared awareness of conditions.", "nl": "He says this collective reason is built through everyday talk (friends, family, neighbours discussing rent and bills) and becomes shared awareness of conditions."}, "sources": ["src:298b2455e6"], "flags": ["editor-note"]}, {"text": {"fa": "اشاره به کانت: عقل جدا از تجربه وجود ندارد. این خوانش ساده‌شده است؛ کانت برای شناخت، هم شهود تجربی و هم صورت‌های پیشینیِ فاهمه را لازم می‌دانست.", "en": "Reference to Kant: reason does not exist apart from experience. This is a simplification; Kant held that knowledge needs both empirical intuition and a priori forms of understanding.", "nl": "Reference to Kant: reason does not exist apart from experience. This is a simplification; Kant held that knowledge needs both empirical intuition and a priori forms of understanding."}, "sources": ["src:dfc39000ce"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "سخنران می‌پذیرد که عقل جمعی همیشه راه درست خروج از بحران را نمی‌داند و حتی روشنفکران هم ممکن است تصوراتی قدیمی از دولت داشته باشند.", "en": "The lecturer concedes that collective reason does not always find the right way out, and that intellectuals too may hold outdated ideas of the state.", "nl": "The lecturer concedes that collective reason does not always find the right way out, and that intellectuals too may hold outdated ideas of the state."}, "sources": ["src:298b2455e6"], "flags": ["editor-note"]}, {"text": {"fa": "نکتهٔ مقابل: «حکمت جمع» می‌تواند به تعصب یا هیجان‌های توده‌ای هم برسد؛ به همین دلیل بسیاری از فیلسوفان نقد عقلانی را مکمل عقل عرفی می‌دانند، نه رقیب آن.", "en": "Counterpoint: popular opinion can also yield prejudice or mass passions, so many philosophers see rational critique as complementing, not opposing, common sense.", "nl": "Counterpoint: popular opinion can also yield prejudice or mass passions, so many philosophers see rational critique as complementing, not opposing, common sense."}, "sources": ["src:298b2455e6"], "flags": ["contested", "editor-note"]}], "links": [{"to": "soc:epistemic-distance", "rel": "see-also", "note": {"fa": "فاصلهٔ معرفتی", "en": "Epistemic distance", "nl": "Epistemic distance"}}, {"to": "soc:enlightenment-break", "rel": "see-also", "note": {"fa": "روشنگری", "en": "Enlightenment", "nl": "Enlightenment"}}, {"to": "soc:anomie-after-religious-meaning-collapse", "rel": "see-also", "note": {"fa": "آنومی و رنج نسلی", "en": "Anomie and generational hardship", "nl": "Anomie and generational hardship"}}], "people": ["core:immanuel-kant", "core:ren-descartes"], "sources": ["src:298b2455e6", "src:dfc39000ce"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:practical-reason-in-usuli-fiqh", "kind": "concept", "title": {"fa": "عقل عملی و استنباط فقهی: چرا خلأ «حکمت عملی» در فقه احساس می‌شود؟", "en": "Practical reason and juristic inference: the gap of 'practical wisdom' in fiqh", "nl": "Praktische rede en juridische afleiding: de leemte van 'praktische wijsheid' in de fiqh"}, "aliases": [], "parent": "phil:iranian", "field": "phil:iranian", "summary": {"fa": "برهانی می‌گوید فقه شیعی در روش استنباط (اصول فقه) عقل‌گراست، اما «عقل عملی» یعنی داوری دربارهٔ عدالت و ظلم و تدبیر اجتماع پس از فارابی و خواجه نصیر پرورش نیافت. نتیجه این شده که وقتی فقیهی حکمی را ناعادلانه می‌یابد، این برداشتِ شخصی او است و قاعدهٔ روشن علمی پشتش نیست. این استدلال را او مطرح می‌کند و تاریخ‌نگاران اندیشه با آن مخالفت یا آن را تکمیل کرده‌اند.", "en": "Borhani says Shia fiqh is rationalist in its method of inference (usul al-fiqh), but 'practical reason', meaning judgments about justice, injustice and managing society, was not cultivated after al-Farabi and Nasir al-Din al-Tusi. As a result, when a jurist finds a ruling unjust, it is his personal sense with no clear scholarly rule behind it. He makes this argument; historians of ideas contest or refine it.", "nl": "Borhani stelt dat de Shi'itische fiqh in methode rationalistisch is, maar dat 'praktische rede' (oordelen over rechtvaardigheid en bestuur) na al-Farabi en al-Tusi niet is ontwikkeld; dit is zijn stelling."}, "points": [{"text": {"fa": "به گفتهٔ سخنران، اصولیان قاعدهٔ «ملازمه» را می‌پذیرند (آنچه عقل حکم کند، شرع هم حکم می‌کند) اما در عمل کمتر حکمی بر پایهٔ حکم عقل عملی استنباط شده است. به نظر او این ضعفی تاریخی است.", "en": "Per the lecturer, usuli scholars accept the principle of 'implication' (what reason rules, the law also rules) but in practice few rulings are actually inferred from practical reason. He sees this as a historical weakness.", "nl": "Per the lecturer, usuli scholars accept the principle of 'implication' (what reason rules, the law also rules) but in practice few rulings are actually inferred from practical reason. He sees this as a historical weakness."}, "sources": ["src:8d9faff0ab"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، حکمت عملی کلاسیک سه شاخه داشت: تدبیر منزل، اخلاق و سیاست مدن. او می‌گوید این رشته پس از فارابی و خواجه نصیر تعطیل شد و فقه بیش از حد «نقلی و حدیثی» ماند. این تاریخ‌نگاری ساده‌شده است: اندیشه‌ورانی مثل دوانی و ملاصدرا و بعدها شاگردان آنان به اخلاق و سیاست نوشتند، هرچند پیوند آن با اجتهاد فقهی ضعیف ماند.", "en": "Per the lecturer, classical practical wisdom had three branches: household management, ethics and city politics. He says it lapsed after al-Farabi and al-Tusi and fiqh became overly textual and hadith-based. This history is simplified: thinkers such as Davani and Mulla Sadra and later pupils wrote on ethics and politics, though the link to juristic ijtihad stayed weak.", "nl": "Per the lecturer, classical practical wisdom had three branches: household management, ethics and city politics. He says it lapsed after al-Farabi and al-Tusi and fiqh became overly textual and hadith-based. This history is simplified: thinkers such as Davani and Mulla Sadra and later pupils wrote on ethics and politics, though the link to juristic ijtihad stayed weak."}, "sources": ["src:8d9faff0ab"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، نائینی برای بحث حکومت و استبداد از متن‌های دینی شروع نکرد، بلکه از تحلیل عقلی مفاهیم «حکومت» و «استبداد» وارد شد؛ او این را نمونهٔ ظرفیتِ عقل عملی می‌داند. این روایت با آنچه در «تنبیه‌الامه» دیده می‌شود تقریباً هم‌خوان است، هرچند نائینی در جاهایی به آیات و روایات هم استناد می‌کند.", "en": "Per the lecturer, Naini approached government and despotism not from scriptural texts first but from a rational analysis of what government and despotism are, and he sees this as an example of the potential of practical reason. This roughly matches the argument of Tanbih al-Umma, though Naini also cites verses and narrations in places.", "nl": "Per the lecturer, Naini approached government and despotism not from scriptural texts first but from a rational analysis of what government and despotism are, and he sees this as an example of the potential of practical reason. This roughly matches the argument of Tanbih al-Umma, though Naini also cites verses and narrations in places."}, "sources": ["src:8d9faff0ab", "src:ab857af402"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، جدال معتزله و اشاعره به نفع اشاعره تمام شد، اما استدلال عقلی در تشیع در متد اصول ادامه یافت و دعوای اصولی-اخباری نسبت به جدال اهل حدیث و اهل رأی در فقه اهل سنت ملایم‌تر بوده است. درباره فقه حنفی هم او می‌گوید ابزارهایی مثل قیاس و استحسان بیشتر نتیجهٔ کمبود روایات بود. این‌ها قضاوت‌های نسبی هستند و مورخان فقه با آن‌ها همه‌جا موافق نیستند.", "en": "Per the lecturer, the Mu'tazili-Ash'ari contest ended in favour of the Ash'aris, yet rational argument survived in Shia usul methodology; he adds that the usuli-akhbari conflict was milder than the Sunni hadith-versus-opinion divide, and that Hanafi tools such as analogy and istihsan arose partly from a shortage of reports. These are relative judgments and historians of law do not agree with all of them.", "nl": "Per the lecturer, the Mu'tazili-Ash'ari contest ended in favour of the Ash'aris, yet rational argument survived in Shia usul methodology; he adds that the usuli-akhbari conflict was milder than the Sunni hadith-versus-opinion divide, and that Hanafi tools such as analogy and istihsan arose partly from a shortage of reports. These are relative judgments and historians of law do not agree with all of them."}, "sources": ["src:8d9faff0ab", "src:77a538786b"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "نکتهٔ علمی: اینکه معتزله «تمام شدند» دقیق نیست. بیشتر متکلمان شیعهٔ امامی در مسئلهٔ «حُسن و قُبح عقلی» (اینکه عقل می‌تواند خوب و بد را بشناسد) به معتزله نزدیک ماندند و این مبنا تا امروز در کلام شیعه زنده است. اشاعره عمدتاً در کلام اهل سنت غالب شدند.", "en": "Scholarly note: it is not accurate that the Mu'tazila simply 'ended'. Most Twelver Shia theologians stayed close to them on the rational knowability of good and evil (husn and qubh 'aqli), and that premise remains alive in Shia theology. The Ash'aris came to dominate mainly in Sunni theology.", "nl": "Scholarly note: it is not accurate that the Mu'tazila simply 'ended'. Most Twelver Shia theologians stayed close to them on the rational knowability of good and evil (husn and qubh 'aqli), and that premise remains alive in Shia theology. The Ash'aris came to dominate mainly in Sunni theology."}, "sources": ["src:77a538786b"], "flags": ["contested", "editor-note"]}], "links": [{"to": "phil:iranian", "rel": "part-of", "note": {"fa": "حوزهٔ فلسفهٔ ایرانی-اسلامی", "en": "Iranian-Islamic philosophy field", "nl": "Iranian-Islamic philosophy field"}}, {"to": "soc:fiqh-minimal-vs-totalizing", "rel": "explains", "note": {"fa": "ریشهٔ فکری بحث فقه و توسعه", "en": "Intellectual root of the fiqh-and-development debate", "nl": "Intellectual root of the fiqh-and-development debate"}}, {"to": "soc:formal-vs-substantive-rationality", "rel": "bridges", "note": {"fa": "پیوند با عقلانیت صوری و ماهوی", "en": "Link to formal versus substantive rationality", "nl": "Link to formal versus substantive rationality"}}], "people": ["core:al-farabi", "core:nasir-al-din-al-tusi", "core:muhammad-husayn-na-ini"], "sources": ["src:77a538786b", "src:8d9faff0ab", "src:ab857af402"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:evolutionary-lens-on-culture-parsi", "kind": "concept", "title": {"fa": "تعمیم مفاهیم تکامل به فرهنگ و معماری: مجوز و محدودیت‌ها", "en": "Extending evolutionary concepts to culture and architecture: licence and limits", "nl": "Evolutionaire begrippen toepassen op cultuur en architectuur: mogelijkheden en grenzen"}, "aliases": [], "parent": "phil:epistemology", "field": "phil:epistemology", "summary": {"fa": "پارسی استدلال می‌کند که تعمیم مفاهیم تکاملی به زبان، فرهنگ و معماری مجاز است، چون علم همواره دنبال یکپارچه‌سازی و روش‌های مشترک بوده و داروین بیشتر روش‌شناسی ارائه کرده است. او تأکید می‌کند «تکامل» برتری ارزشی نمی‌آورد و ترجیح می‌دهد «فرگشت» بگوید. این رویکرد در پژوهش جدی هم سابقه دارد (تکامل فرهنگی) اما قیاس‌های ساده خطرناک‌اند.", "en": "Parsi argues that applying evolutionary concepts to language, culture and architecture is legitimate because science seeks unification and Darwin supplied a method, not just biology. He stresses that evolution implies no value hierarchy and prefers the term 'fargasht'. The approach has serious scholarly counterparts (cultural evolution), but naive analogies are risky.", "nl": "Parsi verdedigt het toepassen van evolutionaire concepten op taal, cultuur en architectuur als methode; hij benadrukt dat evolutie geen waardehiërarchie inhoudt."}, "points": [{"text": {"fa": "به گفتهٔ سخنران، دو دلیل به او اجازه می‌دهد مفاهیم زیست‌شناسی را به فرهنگ ببرد: علم به سوی نظریه‌های یکپارچه می‌رود، و زبان و فرهنگ ویژگی‌های همین موجود زنده‌اند. او می‌گوید این رویکرد برای پدیده‌های پیچیده مثل حیات و فرهنگ به کار می‌آید نه برای پدیده‌های ساده مثل نقطهٔ جوش آب.", "en": "Per the lecturer, two reasons license carrying biological concepts into culture: science moves toward unified theories, and language and culture are features of the same living species. He says this suits complex phenomena such as life and culture rather than simple ones such as water's boiling point.", "nl": "Per the lecturer, two reasons license carrying biological concepts into culture: science moves toward unified theories, and language and culture are features of the same living species. He says this suits complex phenomena such as life and culture rather than simple ones such as water's boiling point."}, "sources": ["src:608cb2ca67"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، فرگشت یعنی تکرار تجربه‌های موفق به‌علاوهٔ تغییرهای کوچک که گزینش می‌شوند؛ جمعیت، زمان و جدایی جغرافیایی مهم‌اند، و تغییر بزرگ و ناگهانی معمولاً کشنده است. او می‌گوید فرهنگ‌های کهن هم محصول گزینش‌های آهستهٔ موفق بوده‌اند. تعبیر داروین به تغییرهای تدریجی نزدیک است، اما زیست‌شناسان بعدی (مثلاً نظریهٔ تعادل منقطع) نشان داده‌اند آهنگ تغییر می‌تواند ناهمگن باشد.", "en": "Per the lecturer, evolution means repetition of successful experience plus small selected changes, with population, time and geographic isolation mattering, while large sudden change tends to be fatal; he reads old cultures as products of slow selection. Darwin did stress gradualism, though later biologists (e.g. punctuated equilibrium) showed the tempo of change can be uneven.", "nl": "Per the lecturer, evolution means repetition of successful experience plus small selected changes, with population, time and geographic isolation mattering, while large sudden change tends to be fatal; he reads old cultures as products of slow selection. Darwin did stress gradualism, though later biologists (e.g. punctuated equilibrium) showed the tempo of change can be uneven."}, "sources": ["src:608cb2ca67", "src:2d15cc791c", "src:3361fef6ff"], "flags": ["editor-note", "contested"]}, {"text": {"fa": "به گفتهٔ سخنران، «تکامل» در فارسی بار ارزشی (بهترشدن) دارد، در حالی‌که فرایند فرگشت برتری نمی‌آورد: انسان از کرم پیچیده‌تر است نه برتر، و هیچ فرهنگ یا قومی بر دیگری برتری ذاتی ندارد. این دقیقاً هم‌خوان با نقد دانشمندان از «داروینیسم اجتماعی» است که قیاس تکامل را برای توجیه نابرابری و استعمار به کار برد.", "en": "Per the lecturer, the Persian word 'takāmol' carries a sense of improvement, whereas evolution brings no superiority: humans are more complex than worms, not better, and no culture or people is inherently superior. This agrees with scholars' critique of 'Social Darwinism', which used the evolutionary analogy to justify inequality and empire.", "nl": "Per the lecturer, the Persian word 'takāmol' carries a sense of improvement, whereas evolution brings no superiority: humans are more complex than worms, not better, and no culture or people is inherently superior. This agrees with scholars' critique of 'Social Darwinism', which used the evolutionary analogy to justify inequality and empire."}, "sources": ["src:608cb2ca67", "src:2218562122", "src:b4436300be"], "flags": ["editor-note"]}, {"text": {"fa": "پژوهش علمی دربارهٔ «تکامل فرهنگی» وجود دارد (مثلاً مدل‌های انتقال، تنوع و گزینش در فرهنگ)، اما فرهنگ از چند جهت با ژن فرق دارد: آموخته می‌شود، از غیرپدر و مادر هم منتقل می‌شود و آگاهانه تغییر می‌کند. پس قیاس باید با احتیاط و با داده انجام شود، نه به‌عنوان تحلیل قطعی.", "en": "There is genuine research on cultural evolution (models of transmission, variation and selection in culture), but culture differs from genes: it is learned, can be transmitted from non-parents and is changed deliberately. The analogy should therefore be used cautiously and with data, not as a conclusive analysis.", "nl": "There is genuine research on cultural evolution (models of transmission, variation and selection in culture), but culture differs from genes: it is learned, can be transmitted from non-parents and is changed deliberately. The analogy should therefore be used cautiously and with data, not as a conclusive analysis."}, "sources": ["src:2b2dba9329"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "چند ادعای فرعی گفتگو ساده‌شده است: (۱) نیروهای بنیادی فیزیک هنوز یکپارچه نشده‌اند؛ فقط الکترومغناطیس و هستهٔ ضعیف در نظریهٔ الکتروضعیف یکی شده‌اند و گرانش و هستهٔ قوی جدا مانده‌اند. (۲) نداشتن هنر نزد نئاندرتال‌ها نشانهٔ نداشتن زبان نیست؛ شواهدی از زیور و رنگ‌دانه‌ی نمادین در سایت‌های نئاندرتالی گزارش شده و دربارهٔ زبانشان بحث ادامه دارد.", "en": "Some side claims in the talk are simplified: (1) fundamental forces are not yet unified; only electromagnetism and the weak force are merged (electroweak), while the strong force and gravity remain separate. (2) Absence of art among Neanderthals does not show absence of language; symbolic ornaments and pigments have been reported at Neanderthal sites, and their language ability is still debated.", "nl": "Some side claims in the talk are simplified: (1) fundamental forces are not yet unified; only electromagnetism and the weak force are merged (electroweak), while the strong force and gravity remain separate. (2) Absence of art among Neanderthals does not show absence of language; symbolic ornaments and pigments have been reported at Neanderthal sites, and their language ability is still debated."}, "sources": ["src:daec94b079"], "flags": ["contested", "editor-note"]}], "links": [{"to": "psy:cultural-evolution", "rel": "see-also", "note": {"fa": "تکامل فرهنگی", "en": "Cultural evolution", "nl": "Cultural evolution"}}, {"to": "tabar:mutation-selection-drift", "rel": "see-also", "note": {"fa": "جهش، انتخاب و رانش", "en": "Mutation, selection and drift", "nl": "Mutation, selection and drift"}}, {"to": "tabar:race-biology", "rel": "contrasts", "note": {"fa": "نقد برداشت‌های نژادی از تکامل", "en": "Critique of racial readings of evolution", "nl": "Critique of racial readings of evolution"}}], "people": ["core:charles-darwin", "core:alex-mesoudi"], "sources": ["src:2218562122", "src:2b2dba9329", "src:2d15cc791c", "src:3361fef6ff", "src:608cb2ca67", "src:b4436300be", "src:daec94b079"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:gettier", "kind": "concept", "title": {"fa": "مسئلهٔ گتیه: دانستن فقط باور صادق موجه نیست", "en": "The Gettier problem", "nl": "Het Gettier-probleem"}, "aliases": [], "parent": "phil:epistemology", "field": "phil:epistemology", "summary": {"fa": "دو هزار سال تعریف دانش «باور صادقِ موجه» بود. گتیه در سه صفحه نشان داد می‌شود باوری موجه و صادق داشت که از روی شانس درست درآمده و دانش نیست. از آن پس معرفت‌شناسی دنبال «جزء چهارم» است.", "en": "For two thousand years knowledge was defined as \"justified true belief\". In three pages Gettier showed one can have a belief that is justified and true but right by luck, and not knowledge. Epistemology has sought the \"fourth condition\" ever since.", "nl": "Tweeduizend jaar lang was kennis \"gerechtvaardigde ware overtuiging\". In drie pagina's toonde Gettier dat men een overtuiging kan hebben die gerechtvaardigd en waar is, maar door toeval klopt, en geen kennis is. Sindsdien zoekt de kennistheorie de \"vierde voorwaarde\"."}, "points": [{"text": {"fa": "گتیه (۱۹۶۳): اسمیت شواهد قوی دارد که جونز شغل را می‌گیرد و ده سکه در جیب دارد؛ نتیجه می‌گیرد «کسی که شغل را می‌گیرد ده سکه در جیب دارد». شغل را خودش می‌گیرد و اتفاقاً ده سکه در جیب دارد. باورش صادق و موجه است، اما دانش نیست.", "en": "Gettier (1963): Smith has strong evidence that Jones will get the job and has ten coins in his pocket; he infers \"the man who gets the job has ten coins in his pocket\". Smith himself gets the job and happens to have ten coins. His belief is true and justified, but not knowledge.", "nl": "Gettier (1963): Smith has strong evidence that Jones will get the job and has ten coins in his pocket; he infers \"the man who gets the job has ten coins in his pocket\". Smith himself gets the job and happens to have ten coins. His belief is true and justified, but not knowledge."}, "sources": ["src:7cf7e49835"], "flags": []}, {"text": {"fa": "کاربرد روزمره: درست درآمدنِ یک پیش‌بینی ثابت نمی‌کند پیش‌بینی‌کننده می‌دانست؛ باید پرسید آیا راهی که به باور رسید با صدقش پیوند داشت یا شانسی بود (مسئلهٔ «پیش‌گوهای موفق» و «تحلیل‌گران بورس»).", "en": "Everyday use: a prediction coming true does not show the predictor knew; ask whether the route to the belief was connected to its truth or lucky (the problem of \"successful seers\" and \"stock analysts\").", "nl": "Everyday use: a prediction coming true does not show the predictor knew; ask whether the route to the belief was connected to its truth or lucky (the problem of \"successful seers\" and \"stock analysts\")."}, "sources": ["src:7cf7e49835"], "flags": []}], "links": [{"to": "psy:epistemology", "rel": "bridges", "note": {"fa": "معرفت‌شناسی و شک‌ورزی در ویکی روان", "en": "Epistemology and scepticism in the psychology wiki", "nl": "Epistemology and scepticism in the psychology wiki"}}, {"to": "psy:critical-thinking", "rel": "bridges", "note": {"fa": "تفکر نقادانه", "en": "Critical thinking", "nl": "Critical thinking"}}, {"to": "phil:epistemic-injustice", "rel": "see-also", "note": {"fa": "بعد اجتماعی دانستن", "en": "The social dimension of knowing", "nl": "The social dimension of knowing"}}], "people": ["core:edmund-gettier", "core:plato"], "sources": ["src:7cf7e49835"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "phil:hallaj-historical-portrait", "kind": "concept", "title": {"fa": "حلاج: عارف شهید یا رهبر سیاسی-فکری؟ (روایت وکیلی در برابر روایت رایج)", "en": "Al-Hallaj: martyr-mystic or political-intellectual leader? (Vakili's account versus the standard one)", "nl": "Al-Hallaj: mysticus-martelaar of politiek-intellectueel leider?"}, "aliases": [], "parent": "phil:iranian", "field": "phil:iranian", "summary": {"fa": "حسین بن منصور حلاج (حدود ۲۴۴–۳۰۹ هجری) را معمولاً عارفی می‌دانند که به‌خاطر «انا الحق» در بغداد اعدام شد. وکیلی می‌گوید این تصویر «کفن کلیشه‌هاست»؛ به نظر او حلاج مردی جنگجو، جهانگرد و سازمان‌ده با گرایش‌های نزدیک به قرمطیان بود، نمایش‌هایی از کرامات اجرا می‌کرد و در کشاکش جناح‌های دربار کشته شد. بخش‌هایی از این روایت با پژوهش‌های ماسینیون و شیمل نمی‌خواند.", "en": "Husayn ibn Mansur al-Hallaj (c. 244-309 AH) is usually remembered as a mystic executed in Baghdad for saying 'I am the Truth'. Vakili calls this a 'shroud of clichés': in his view Hallaj was a warrior-traveller and organiser close to Qarmatian currents, staged miracle-like displays, and was killed in a court power struggle. Parts of this contradict the research of Massignon and Schimmel.", "nl": "Al-Hallaj geldt als mysticus die om 'Ik ben de Waarheid' werd geëxecuteerd; Vakili ziet hem als politiek-religieus leider. Onderdelen daarvan zijn omstreden."}, "points": [{"text": {"fa": "به گفتهٔ سخنران، حلاج از خانواده‌ای ایرانی-زرتشتی بود، به احتمال زیاد زبان مادری‌اش پهلوی بود و لقب فارسی داشت، ولی هرچه از او مانده به عربی و در بغداد گردآوری شده است. او می‌گوید ما حلاج را از «پنجره‌ای» می‌بینیم که تنها بخش کوچک و گزینش‌شده‌ای از نوشته‌ها و سفرهایش را نشان می‌دهد (مثل کسی که فقط اینستاگرامش مانده باشد).", "en": "Per the lecturer, Hallaj came from an Iranian-Zoroastrian family, probably had Pahlavi as his mother tongue and bore a Persian nickname, yet everything that survives is in Arabic and was gathered in Baghdad. He says we view Hallaj through a 'window' that shows only a small, selected part of his writing and travels (like judging someone from an Instagram account alone).", "nl": "Per the lecturer, Hallaj came from an Iranian-Zoroastrian family, probably had Pahlavi as his mother tongue and bore a Persian nickname, yet everything that survives is in Arabic and was gathered in Baghdad. He says we view Hallaj through a 'window' that shows only a small, selected part of his writing and travels (like judging someone from an Instagram account alone)."}, "sources": ["src:13520836c4"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، حلاج در جوانی جبرگرا بود و در محیط بصره (مرکز اموی‌گرایی) رشد کرد، سپس با استادانش (از جمله سهل شوشتری، عمرو مکی و جنید) اختلاف پیدا کرد، به خراسان و فراتر سفر کرد و بعد «آدمی دیگر» در بغداد بود. او می‌گوید تناقض‌های متون حلاج را باید نشانهٔ دوره‌های مختلف فکری او گرفت، نه اینکه پنهانشان کرد.", "en": "Per the lecturer, the young Hallaj leaned towards determinism and grew up in Basra (an Umayyad-leaning centre), then fell out with his teachers (including Sahl al-Tustari, Amr al-Makki and al-Junayd), travelled to Khurasan and beyond, and returned to Baghdad as 'a different man'. He says contradictions in Hallaj's texts should be read as marks of different intellectual phases, not smoothed over.", "nl": "Per the lecturer, the young Hallaj leaned towards determinism and grew up in Basra (an Umayyad-leaning centre), then fell out with his teachers (including Sahl al-Tustari, Amr al-Makki and al-Junayd), travelled to Khurasan and beyond, and returned to Baghdad as 'a different man'. He says contradictions in Hallaj's texts should be read as marks of different intellectual phases, not smoothed over."}, "sources": ["src:13520836c4"], "flags": ["editor-note"]}, {"text": {"fa": "به گفتهٔ سخنران، دلیل اعدام حلاج «انا الحق» نبود (چون بایزید پیش‌تر چنین سخنانی گفته بود)، بلکه محاکمه‌ای سیاسی بود و او را از رهبران فکری قرمطیان می‌دانستند؛ او حتی نامه‌ای دربارهٔ ویران‌کردن کعبه و برانداختن حج نوشته بود. نیز گفت جناحی درباری حلاج را در کودتایی از میان برد.", "en": "Per the lecturer, Hallaj was not executed for 'ana al-Haqq' (Bayazid had earlier said comparable things); it
