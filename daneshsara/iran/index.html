const D = {"notes": [{"id": "iran:happiness-rank", "domain": "psy", "question": {"fa": "ایرانیان در سنجش جهانی شادکامی کجا ایستاده‌اند؟", "en": "Where do Iranians stand in global happiness rankings?"}, "finding": {"fa": "گزارش جهانی شادکامی ۲۰۲۴ (میانگین ارزیابی زندگی ۲۰۲۱–۲۰۲۳، نردبان کانتریل ۰ تا ۱۰): ایران حدود ۴٫۹ و در ردهٔ صدم از ۱۴۳ کشور؛ پایین‌تر از میانگین جهانی و پایین‌تر از همسایگانی چون ترکیه و عربستان، بالاتر از افغانستان و لبنان.", "en": "World Happiness Report 2024 (life evaluation averaged 2021–2023, Cantril ladder 0–10): Iran about 4.9, ranked around 100th of 143; below the world mean and below neighbours such as Turkey and Saudi Arabia, above Afghanistan and Lebanon."}, "year": 2024, "method": "Gallup World Poll, ~1,000 respondents per year", "grade": "B", "contested": false, "critique": "یک پرسش واحد با نمونهٔ کوچک سالانه؛ رتبه‌ها سال‌به‌سال نوسان دارند و تفاوت‌های کوچک معنادار نیستند.", "source": [{"title": "Helliwell, J. F., Layard, R., Sachs, J. D., De Neve, J.-E., Aknin, L. B., & Wang, S. (Eds.) (2024). World Happiness Report 2024. Wellbeing Research Centre, University of Oxford.", "url": "https://worldhappiness.report/ed/2024/"}], "fields": ["positive"], "concepts": ["psy:happiness-origins", "psy:perma"], "capability": [5, 7], "_concepts": [{"id": "psy:happiness-origins", "title": {"fa": "ریشه‌های شادکامی", "en": "The origins of happiness", "nl": "De oorsprong van geluk"}, "url": "../psy/graph.html#happiness-origins"}, {"id": "psy:perma", "title": {"fa": "مدل PERMA", "en": "PERMA model of well-being", "nl": "PERMA-model van welzijn"}, "url": "../psy/graph.html#perma"}]}, {"id": "iran:suicide-rate", "domain": "psy", "question": {"fa": "نرخ خودکشی در ایران در مقایسه با جهان چقدر است؟", "en": "How does Iran's suicide rate compare with the world?"}, "finding": {"fa": "برآورد سازمان جهانی بهداشت (۲۰۱۹): نرخ سن‌استاندهٔ خودکشی ایران حدود ۵ در صد هزار، کمتر از میانگین جهانی (حدود ۹)؛ اما ثبت ناقص و انگ، برآوردها را کمتر از واقع می‌کند و تفاوت استانی (غرب کشور بالاتر) چشمگیر است.", "en": "WHO estimate (2019): Iran's age-standardised suicide rate about 5 per 100,000, below the global mean (about 9); but under-registration and stigma depress estimates, and provincial variation (higher in the west) is marked."}, "year": 2019, "method": "WHO modelled estimate from vital registration", "grade": "B", "contested": false, "critique": "ثبت مرگ ناشی از خودکشی در ایران کامل نیست؛ ارقام ملی را باید کمینه دانست.", "source": [{"title": "World Health Organization (2021). Suicide worldwide in 2019: Global Health Estimates.", "url": "https://www.who.int/publications/i/item/9789240026643"}], "fields": ["psychiatry"], "concepts": ["psy:crisis-mh"], "capability": [1, 5], "_concepts": [{"id": "psy:crisis-mh", "title": {"fa": "سلامت روان در بحران و جنگ", "en": "Mental health in crises", "nl": "Mentale gezondheid in crises"}, "url": "../psy/graph.html#crisis-mh"}]}, {"id": "iran:drug-use-disorders", "domain": "psy", "question": {"fa": "اختلال مصرف مواد غیرقانونی در ایران چقدر شایع است؟", "en": "How common are illicit drug use disorders in Iran?"}, "finding": {"fa": "همان پیمایش ملی: شیوع دوازده‌ماههٔ اختلال مصرف مواد غیرقانونی ۲٫۴۴ درصد (مردان بسیار بیشتر از زنان)؛ مواد افیونی شایع‌ترین؛ هم‌ابتلایی بالا با اختلال‌های خلقی و اضطرابی و استفاده از خدمات درمانی کم.", "en": "Same national survey: twelve-month prevalence of illicit drug use disorders 2.44 percent (men far more than women); opioids most common; high comorbidity with mood and anxiety disorders and low use of treatment services."}, "year": 2011, "method": "national household survey, CIDI", "grade": "A", "contested": false, "source": [{"title": "Amin-Esmaeili, M., Rahimi-Movaghar, A., Sharifi, V., et al. (2016). Epidemiology of illicit drug use disorders in Iran: Prevalence, correlates, comorbidity and service utilization results from the Iranian Mental Health Survey. Addiction, 111(10), 1836–1847.", "url": "https://doi.org/10.1111/add.13453"}], "fields": ["psychiatry"], "concepts": ["psy:addiction", "psy:opioids"], "capability": [2, 6], "_concepts": [{"id": "psy:addiction", "title": {"fa": "اعتیاد", "en": "Addiction", "nl": "Verslaving"}, "url": "../psy/graph.html#addiction"}, {"id": "psy:opioids", "title": {"fa": "مواد افیونی و سم‌زدایی", "en": "Opioids & detoxification", "nl": "Opioïden en detoxificatie"}, "url": "../psy/graph.html#opioids"}]}, {"id": "iran:mental-disorder-prevalence", "domain": "psy", "question": {"fa": "چند درصد ایرانیان در یک سال اختلال روانی دارند؟", "en": "What share of Iranians have a mental disorder in a given year?"}, "finding": {"fa": "پیمایش ملی سلامت روان ایران (۱۳۹۰، ۷٬۸۸۶ نفر ۱۵ تا ۶۴ ساله، مصاحبهٔ تشخیصی): ۲۳٫۶ درصد در دوازده ماه گذشته دست‌کم یک اختلال روانی داشتند؛ اختلال‌های اضطرابی (۱۵٫۶٪) و خلقی (۱۴٫۱٪) شایع‌ترین؛ زنان، شهرنشینان، بیکاران و مطلقه‌ها بیشتر در معرض.", "en": "Iranian Mental Health Survey (2011, 7,886 people aged 15–64, diagnostic interview): 23.6 percent had at least one mental disorder in the past twelve months; anxiety (15.6%) and mood disorders (14.1%) most common; women, urban residents, the unemployed and the divorced at higher risk."}, "year": 2011, "method": "national household survey, CIDI diagnostic interview", "grade": "A", "contested": false, "source": [{"title": "Sharifi, V., Amin-Esmaeili, M., Hajebi, A., Motevalian, A., Radgoodarzi, R., Hefazi, M., & Rahimi-Movaghar, A. (2015). Twelve-month prevalence and correlates of psychiatric disorders in Iran: The Iranian Mental Health Survey, 2011. Archives of Iranian Medicine, 18(2), 76–84.", "url": "https://pubmed.ncbi.nlm.nih.gov/25644794/"}], "fields": ["psychiatry"], "concepts": ["psy:anxiety", "psy:dx"], "capability": [2, 5], "_concepts": [{"id": "psy:anxiety", "title": {"fa": "اختلالات اضطرابی", "en": "Anxiety disorders", "nl": "Angststoornissen"}, "url": "../psy/graph.html#anxiety"}, {"id": "psy:dx", "title": {"fa": "طبقه‌بندی و تشخیص", "en": "Classification · DSM / ICD", "nl": "Classificatie · DSM / ICD"}, "url": "../psy/graph.html#dx"}]}, {"id": "iran:fertility", "domain": "soc", "question": {"fa": "باروری در ایران چقدر و چگونه افت کرد؟", "en": "How far and how did fertility fall in Iran?"}, "finding": {"fa": "از حدود ۶٫۵ فرزند به ازای هر زن در اوایل دههٔ ۱۳۶۰ به حدود ۲ در ۱۳۷۹ و حدود ۱٫۷ در دههٔ ۱۴۰۰؛ افت در همهٔ استان‌ها و سطوح سواد. سیاست‌های تشویقی اخیر روند را برنگردانده‌اند.", "en": "From about 6.5 children per woman in the early 1980s to about 2 in 2000 and about 1.7 in the 2020s; the decline occurred in all provinces and literacy levels. Recent pronatalist policies have not reversed it."}, "year": 2024, "method": "census and DHS-type surveys; UN estimates", "grade": "A", "contested": false, "source": [{"title": "Abbasi-Shavazi, M. J., McDonald, P., & Hosseini-Chavoshi, M. (2009). The Fertility Transition in Iran: Revolution and Reproduction. Springer.", "url": "https://doi.org/10.1007/978-90-481-3198-3"}, {"title": "United Nations, Department of Economic and Social Affairs, Population Division (2024). World Population Prospects 2024.", "url": "https://population.un.org/wpp/"}], "fields": [], "concepts": ["soc:iran-fertility"], "capability": [2, 10], "_concepts": [{"id": "soc:iran-fertility", "title": {"fa": "گذار باروری ایران: از ۶٫۵ به زیر ۲", "en": "Iran's fertility transition: from 6.5 to below 2", "nl": "De Iraanse vruchtbaarheidstransitie: van 6,5 naar onder de 2"}, "url": "../soc/#iran-fertility"}]}, {"id": "iran:gini", "domain": "soc", "question": {"fa": "نابرابری درآمد در ایران چقدر است؟", "en": "How unequal is income in Iran?"}, "finding": {"fa": "ضریب جینی در دههٔ اخیر حدود ۳۸ تا ۴۲ (بانک جهانی و مرکز آمار)؛ پس از ۱۳۹۰ کمی کاهش و در سال‌های تورم بالا دوباره افزایش. نابرابری ثروت اندازه‌گیری رسمی ندارد.", "en": "The Gini has been about 38 to 42 in the last decade (World Bank and Statistical Centre); a slight fall after 2011 and renewed rise in high-inflation years. Wealth inequality has no official measurement."}, "year": 2022, "method": "household budget surveys", "g     s = doms.map(d => `<section class="sec"><h2 style="color:${FC[d]}">${esc(T("dom")[d] || d)} <small style="color:var(--ink-3);font-weight:400">(${fa(D.notes.filter(n => n.domain === d).length)})</small></h2><div class="notes">${D.notes.filter(n => n.domain === d).map(card).join("")}</div></section>`).join("");
  } else {
    const caps = Object.keys(T("cap")).map(Number);
    s = `<div class="cap">${caps.map(c => `<div><span>${fa(c)}. ${esc(T("cap")[c])}</span><b>${fa(D.notes.filter(n => (n.capability || []).includes(c)).length)}</b></div>`).join("")}</div>`;
    s += caps.filter(c => D.notes.some(n => (n.capability || []).includes(c))).map(c => `<section class="sec"><h2>${fa(c)}. ${esc(T("cap")[c])}</h2><div class="notes">${D.notes.filter(n => (n.capability || []).includes(c)).map(card).join("")}</div></section>`).join("");
  }
  document.getElementById("body").innerHTML = s;
}
document.addEventListener("click", ev => { const b = ev.target.closest("[data-m]"); if (b) { mode = b.dataset.m; render(); } });
function i18n(){ document.documentElement.lang = L; document.documentElement.dir = L === "fa" ? "rtl" : "ltr"; document.querySelectorAll("[data-i]").forEach(el => el.textContent = T(el.dataset.i)); document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === L)); document.title = T("h1") + " — " + (L === "fa" ? "دانش‌سرا" : "Daneshsara"); render(); }
document.querySelector(".lang").addEventListener("click", ev => { const b = ev.target.closest("[data-l]"); if (!b) return; L = b.dataset.l; try { localStorage.setItem("ds-lang", L); } catch(_) {} i18n(); });
i18n();
