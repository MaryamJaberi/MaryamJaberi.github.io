 ناشی از خودکشی، ۱۳۷۹ تا ۱۴۰۰"}, "series": [{"name": {"fa": "ایران"}, "points": [[2000, 6.03], [2002, 5.69], [2004, 5.2], [2006, 4.83], [2008, 5.28], [2010, 4.96], [2012, 4.52], [2014, 4.93], [2016, 4.72], [2018, 4.33], [2019, 4.27], [2020, 3.4], [2021, 4.07]]}], "note": {"fa": "این‌ها برآورد سازمان جهانی بهداشت‌اند، نه شمارش ثبت‌شده. ثبت ناقص و انگ، عدد واقعی را بالاتر از این می‌برد؛ اندازهٔ این کم‌شماری معلوم نیست."}, "source": {"title": "World Bank, World Development Indicators — Suicide mortality rate (Iran, Islamic Rep.), retrieved 2026-11-09.", "url": "https://data.worldbank.org/indicator/SH.STA.SUIC.P5?locations=IR"}}, "roots": {"fa": "دربارهٔ ریشه‌ها در ایران شواهد محکم کم است و باید محتاط بود. آنچه پژوهش‌های داخلی به‌طور مکرر گزارش کرده‌اند: تفاوت جنسیتی و منطقه‌ای بزرگ (ایلام، کرمانشاه و لرستان نرخ بالاتر)، سهم بالای خودسوزی در میان زنان برخی مناطق غربی، و همبستگی با بیکاری، اعتیاد و خشونت خانگی. هیچ‌کدام از این‌ها رابطهٔ علّی اثبات‌شده نیست؛ همراهی است.\nیک نکتهٔ روشی مهم: ثبت خودکشی در ایران ناقص است. انگ اجتماعی و مذهبی باعث می‌شود بخشی از موارد با عنوان دیگری ثبت شود، پس هر تحلیلی دربارهٔ روند باید این کم‌شماری را در نظر بگیرد."}, "now": {"fa": "برآورد سازمان جهانی بهداشت برای ۱۴۰۰ حدود ۴ در هر صد هزار نفر است، که نسبت به میانگین جهانی پایین‌تر است. ولی این عدد برآورد است نه شمارش، و اندازهٔ کم‌شماری معلوم نیست؛ پس «پایین‌تر از جهان» را باید با احتیاط خواند. آنچه در منابع داخلی مکرر گزارش می‌شود، تفاوت بزرگ میان استان‌هاست که در عدد ملی دیده نمی‌شود."}, "_concepts": [{"id": "psy:crisis-mh", "title": {"fa": "سلامت روان در بحران و جنگ", "en": "Mental health in crises", "nl": "Mentale gezondheid in crises"}, "url": "../psy/tools/graph.html#crisis-mh"}]}, {"id": "iran:drug-use-disorders", "domain": "psy", "question": {"fa": "اختلال مصرف مواد غیرقانونی در ایران چقدر شایع است؟", "en": "How common are illicit drug use disorders in Iran?"}, "finding": {"fa": "همان پیمایش ملی: شیوع دوازده‌ماههٔ اختلال مصرف مواد غیرقانونی ۲٫۴۴ درصد (مردان بسیار بیشتر از زنان)؛ مواد افیونی شایع‌ترین؛ هم‌ابتلایی بالا با اختلال‌های خلقی و اضطرابی و استفاده از خدمات درمانی کم.", "en": "Same national survey: twelve-month prevalence of illicit drug use disorders 2.44 percent (men far more than women); opioids most common; high comorbidity with mood and anxiety disorders and low use of treatment services."}, "year": 2011, "method": "national household survey, CIDI", "grade": "A", "contested": false, "source": [{"title": "Amin-Esmaeili, M., Rahimi-Movaghar, A., Sharifi, V., et al. (2016). Epidemiology of illicit drug use disorders in Iran: Prevalence, correlates, comorbidity and service utilization results from the Iranian Mental Health Survey. Addiction, 111(10), 1836–1847.", "url": "https://doi.org/10.1111/add.13453"}], "fields": ["psychiatry"], "concepts": ["psy:addiction", "psy:opioids"], "capability": [2, 6], "viz": {"kind": "none", "note": {"fa": "برای این یافته سری زمانی یا عدد قابل‌رسم منتشرشده‌ای در دست نیست؛ به‌جای نمودار، متن و منبع را بخوانید."}}, "_concepts": [{"id": "psy:addiction", "title": {"fa": "اعتیاد", "en": "Addiction", "nl": "Verslaving"}, "url": "../psy/tools/graph.html#addiction"}, {"id": "psy:opioids", "title": {"fa": "مواد افیونی و سم‌زدایی", "en": "Opioids & detoxification", "nl": "Opioïden en detoxificatie"}, "url": "../psy/tools/graph.html#opioids"}]}, {"id": "iran:mental-disorder-prevalence", "domain": "psy", "question": {"fa": "چند درصد ایرانیان در یک سال اختلال روانی دارند؟", "en": "What share of Iranians have a mental disorder in a given year?"}, "finding": {"fa": "پیمایش ملی سلامت روان ایران (۱۳۹۰، ۷٬۸۸۶ نفر ۱۵ تا ۶۴ ساله، مصاحبهٔ تشخیصی): ۲۳٫۶ درصد در دوازده ماه گذشته دست‌کم یک اختلال روانی داشتند؛ اختلال‌های اضطرابی (۱۵٫۶٪) و خلقی (۱۴٫۱٪) شایع‌ترین؛ زنان، شهرنشینان، بیکاران و مطلقه‌ها بیشتر در معرض.", "en": "Iranian Mental Health Survey (2011, 7,886 people aged 15–64, diagnostic interview): 23.6 percent had at least one mental disorder in the past twelve months; anxiety (15.6%) and mood disorders (14.1%) most common; women, urban residents, the unemployed and the divorced at higher risk."}, "year": 2011, "method": "national household survey, CIDI diagnostic interview", "grade": "A", "contested": false, "source": [{"title": "Sharifi, V., Amin-Esmaeili, M., Hajebi, A., Motevalian, A., Radgoodarzi, R., Hefazi, M., & Rahimi-Movaghar, A. (2015). Twelve-month prevalence and correlates of psychiatric disorders in Iran: The Iranian Mental Health Survey, 2011. Archives of Iranian Medicine, 18(2), 76–84.", "url": "https://pubmed.ncbi.nlm.nih.gov/25644794/"}], "fields": ["psychiatry"], "concepts": ["psy:anxiety", "psy:dx"], "capability": [2, 5], "viz": {"kind": "bars", "unit": {"fa": "درصد جمعیت ۱۵ تا ۶۴ ساله، دوازده ماه گذشته"}, "label": {"fa": "شیوع اختلال‌های روانی، پیمایش ملی ۱۳۹۰"}, "bars": [{"fa": "دست‌کم یک اختلال", "v": 23.6, "self": true}, {"fa": "اختلال‌های اضطرابی", "v": 15.6}, {"fa": "اختلال‌های خلقی", "v": 14.1}], "note": {"fa": "این سه ستون را با هم جمع نکنید: یک نفر می‌تواند هم‌زمان در چند دسته باشد (هم‌ابتلایی)."}}, "_concepts": [{"id": "psy:anxiety", "title": {"fa": "اختلالات اضطرابی", "en": "Anxiety disorders", "nl": "Angststoornissen"}, "url": "../psy/tools/graph.html#anxiety"}, {"id": "psy:dx", "title": {"fa": "طبقه‌بندی و تشخیص", "en": "Classification · DSM / ICD", "nl": "Classificatie · DSM / ICD"}, "url": "../psy/tools/graph.html#dx"}]}, {"id": "iran:political-attitudes-2026", "domain": "soc", "question": {"fa": "ایرانیان پس از اعتراض‌های دی ۱۴۰۴ و جنگ ۱۴۰۴–۱۴۰۵ دربارهٔ تغییر چه می‌گویند؟", "en": "What do Iranians say about change after the January 2026 protests and the 2026 war?"}, "finding": {"fa": "در نظرسنجی آنلاین گمان (۳۰ خرداد تا ۶ تیر ۱۴۰۵، ۳۱٬۴۵۰ پاسخ‌دهنده در ایران، وزن‌دهی‌شده) حدود ۴۷٪ «تغییر نظام» و حدود ۲۳٪ «گذار ساختاری از جمهوری اسلامی» را شرط تغییر دانستند؛ حدود ۱۰٪ اصلاح تدریجی درون نظام و حدود ۹٪ پایبندی به اصول انقلاب و رهبری. ۲۴٫۹٪ گفتند در اعتراض‌های دی ۱۴۰۴ شرکت کرده‌اند و ۲۵٫۴٪ پاسخ ندادند. دربارهٔ نظام جایگزین: حدود ۳۴٪ پادشاهی، ۲۸٪ جمهوری، ۱۳٪ جمهوری اسلامی و حدود یک چهارم بی‌نظر.", "en": "In GAMAAN’s online survey (20–27 June 2026, 31,450 respondents inside Iran, weighted) about 47% named “regime change” and about 23% “structural transition from the Islamic Republic” as the condition for change; about 10% gradual reform within the system and about 9% loyalty to the revolution’s principles and the Leader. 24.9% said they took part in the January 2026 protests and 25.4% declined to answer. On the alternative system: about 34% monarchy, 28% republic, 13% Islamic Republic and about a quarter undecided."}, "year": 2026, "method": "online survey via circumvention tools (Psiphon ~97%), raked on age, gender, education, residence, province; effective sample ~6,211", "grade": "B", "contested": true, "source": [{"title": "GAMAAN (2026). Iranians’ Attitudes Toward the 2026 Protests and War: Survey Report.", "url": "https://gamaan.org/wp-content/uploads/2026/07/GAMAAN-2026-Protests-and-War-Survey-Report-Final-English.pdf"}], "fields": [], "concepts": ["soc:preference-falsification", "soc:coordination-focal-points", "soc:security-defection-credible-commitment"], "capability": [7], "critique": "نمونه آنلاین و از راه فیلترشکن است: باسوادها، جوان‌ترها و شهری‌ها بیشتر در آن هستند و وزن‌دهی همهٔ این سوگیری را جبران نمی‌کند. در عوض ناشناس است و ترس از پاسخ را کم می‌کند، که در نظرسنجی تلفنی داخل ایران ممکن نیست. اعداد را باید جهت‌نما دانست، نه دقیق.", "viz": {"kind": "bars", "unit": {"fa": "درصد پاسخ‌دهندگان (تقریبی)"}, "label": {"fa": "شرط تغییر از نگاه پاسخ‌دهندگان، تیر ۱۴۰۵"}, "bars": [{"fa": "تغییر نظام", "v": 47, "self": true}, {"fa": "گذار ساختاری", "v": 23}, {"fa": "اصلاح تدریجی درون نظام", "v": 10}, {"fa": "اصول انقلاب و رهبری", "v": 9}], "note": {"fa": "جمع به ۱۰۰ نمی‌رسد چون گزینه‌های دیگر و «نمی‌دانم» نشان داده نشده‌اند. نمونهٔ آنلاین است؛ ردهٔ B."}}, "_concepts": [{"id": "soc:preference-falsification", "title": {"fa": "تحریف ترجیحات و غافلگیری انقلاب‌ها", "en": "Preference falsification and the surprise of revolutions", "nl": "Voorkeursvervalsing en de verrassing van revoluties"}, "url": "../soc/#preference-falsification"}, {"id": "soc:coordination-focal-points", "title": {"fa": "بازی هماهنگی و نقطهٔ کانونی", "en": "Coordination games and focal points", "nl": "Coördinatiespellen en focale punten"}, "url": "../soc/#coordination-focal-points"}, {"id": "soc:security-defection-credible-commitment", "title": {"fa": "ریزش نیروهای امنیتی و مسئلهٔ تعهد باورپذیر", "en": "Security-force defection and the credible-commitment problem", "nl": "Afvalligheid van veiligheidstroepen en het probleem van geloofwaardige toezeggingen"}, "url": "../soc/#security-defection-credible-commitment"}]}, {"id": "iran:violence-against-women", "domain": "soc", "question": {"fa": "خشونت علیه زنان در خانه در ایران چقدر شایع است؟", "en": "How common is domestic violence against women in Iran?"}, "finding": {"fa": "فراتحلیل ۴۷ پژوهش ایرانی (۱۴۰۳): شیوع کلی ۵۹٪؛ روانی ۵۰٪، جسمی ۲۵٪، جنسی ۲۰٪. آموزش، آگاهی و استقلال مالی زن مهم‌ترین عوامل مرتبط بودند.", "en": "Meta-analysis of 47 Iranian studies (2025): overall prevalence 59%; psychological 50%, physical 25%, sexual 20%. Education, awareness and women’s financial independence were the main correlates."}, "year": 2025, "method": "meta-analysis of heterogeneous local studies", "grade": "C", "contested": true, "source": [{"title": "Hasanpour Dehkordi, A., & Heydari, H. (2025). The prevalence of domestic violence in Iran: A systematic review and meta-analysis. Jundishapur Journal of Chronic Disease Care.", "url": "https://repository.brieflands.com/items/d0b4e232-eed3-4a7c-bb6b-ff988d88fbe4"}], "fields": ["epi"], "concepts": ["soc:social-roots-of-childhood-adversity"], "capability": [3, 7, 10], "viz": {"kind": "bars", "unit": {"fa": "درصد زنان در پژوهش‌های ترکیب‌شده"}, "label": {"fa": "گونه‌های خشونت علیه زنان، برآورد ترکیبی"}, "bars": [{"fa": "هر نوع", "v": 59, "self": true}, {"fa": "روانی", "v": 50}, {"fa": "جسمی", "v": 25}, {"fa": "جنسی", "v": 20}], "note": {"fa": "پژوهش‌ها نمونه‌ها و تعریف‌های متفاوت دارند و بسیاری بیمارستانی یا محلی‌اند؛ عدد ترکیبی تصویر کلی است، نه شیوع دقیق ملی."}}, "roots": {"fa": "وابستگی مالی، نبود قانون جامع منع خشونت خانگی، حضانت پس از هفت سالگی به نفع پدر، هنجارهای «حرف خانه بیرون نمی‌رود» و نبود پناهگاه کافی."}, "now": {"fa": "برای کودک، دیدن خشونت علیه مادر یکی از ده تجربهٔ ناگوار کودکی است؛ پس این عدد همزمان شاخص آسیب زنان و آسیب کودکان است."}, "_concepts": [{"id": "soc:social-roots-of-childhood-adversity", "title": {"fa": "ریشه‌های اجتماعی تجربه‌های ناگوار کودکی: از قانون و اقتصاد تا باورها", "en": "Social roots of adverse childhood experiences: from law and economy to beliefs", "nl": "Sociale wortels van ingrijpende jeugdervaringen: van wet en economie tot overtuigingen"}, "url": "../soc/#social-roots-of-childhood-adversity"}]}, {"id": "iran:fertility", "domain": "soc", "question": {"fa": "باروری در ایران چقدر و چگونه افت کرد؟", "en": "How far and how did fertility fall in Iran?"}, "finding": {"fa": "از حدود ۶٫۵ فرزند به ازای هر زن در اوایل دههٔ ۱۳۶۰ به حدود ۲ در ۱۳۷۹ و حدود ۱٫۷ در دههٔ ۱۴۰۰؛ افت در همهٔ استان‌ها و سطوح سواد. سیاست‌های تشویقی اخیر روند را برنگردانده‌اند.", "en": "From about 6.5 children per woman in the early 1980s to about 2 in 2000 and about 1.7 in the 2020s; the decline occurred in all provinces and literacy levels. Recent pronatalist policies have not reversed it."}, "year": 2024, "method": "census and DHS-type surveys; UN estimates", "grade": "A", "contested": false, "source": [{"title": "Abbasi-Shavazi, M. J., McDonald, P., & Hosseini-Chavoshi, M. (2009). The Fertility Transition in Iran: Revolution and Reproduction. Springer.", "url": "https://doi.org/10.1007/978-90-481-3198-3"}, {"title": "United Nations, Department of Economic and Social Affairs, Population Division (2024). World Population Prospects 2024.", "url": "https://population.un.org/wpp/"}], "fields": [], "concepts": ["soc:iran-fertility"], "capability": [2, 10], "viz": {"kind": "line", "unit": {"fa": "فرزند به ازای هر زن"}, "label": {"fa": "نرخ باروری کل، ۱۳۳۹ تا ۱۴۰۳"}, "series": [{"name": {"fa": "ایران"}, "points": [[1960, 7.52], [1965, 7.22], [1970, 6.8], [1975, 5.95], [1979, 6.55], [1980, 6.63], [1985, 6.24], [1990, 4.93], [1995, 2.85], [2000, 2.0], [2005, 1.76], [2010, 1.75], [2015, 2.02], [2017, 2.02], [2019, 1.77], [2021, 1.71], [2024, 1.68]]}], "mark": [{"x": 1980, "fa": "اوج: ۶٫۶"}, {"x": 2000, "fa": "زیر سطح جانشینی"}], "note": {"fa": "سقوط باروری ایران از سریع‌ترین‌های ثبت‌شدهٔ جهان است: از ۶٫۶ در ۱۳۵۹ به ۲ در ۱۳۷۹، یعنی در بیست سال."}, "source": {"title": "World Bank, World Development Indicators — Fertility rate, total (Iran, Islamic Rep.), retrieved 2026-11-09.", "url": "https://data.worldbank.org/indicator/SP.DYN.TFRT.IN?locations=IR"}}, "roots": {"fa": "سه چیز هم‌زمان جمع شد. اول، شهرنشینی و آموزش: نسبت زنان باسواد و دانشگاه‌رفته در دههٔ ۱۳۷۰ و ۱۳۸۰ به‌سرعت بالا رفت و سن ازدواج بالا رفت. دوم، برنامهٔ ملی تنظیم خانواده که از ۱۳۶۸ با پشتیبانی رسمی و فتوای مذهبی اجرا شد و وسایل پیشگیری را رایگان و در دسترس کرد؛ این برنامه را سازمان ملل یکی از موفق‌ترین نمونه‌های جهان خوانده است. سوم، فشار اقتصادی پس از جنگ: هزینهٔ مسکن و بزرگ کردن فرزند نسبت به درآمد بالا رفت.\nوزن این سه یکسان نیست و بر سرش اختلاف هست. کسانی برنامهٔ تنظیم خانواده را علت اصلی می‌دانند؛ کسانی می‌گویند باروری پیش از آغاز رسمی برنامه هم در حال کاهش بود و تغییر آموزش و شهرنشینی علت ریشه‌ای‌تر است. شاهدی که به نفع نظر دوم است: پس از ۱۳۹۰ که سیاست رسمی برعکس شد و تشویق به فرزندآوری جای تنظیم خانواده را گرفت، باروری بالا نرفت و پس از یک بالا رفتن کوتاه دوباره پایین آمد."}, "now": {"fa": "باروری حالا حدود ۱٫۷ است، یعنی زیر سطح جانشینی (۲٫۱). این یعنی جمعیت ایران با ادامهٔ همین روند از دههٔ ۱۴۲۰ شروع به کاهش می‌کند و سهم سالمندان به‌سرعت بالا می‌رود، در حالی که نظام بازنشستگی و درمان برای جمعیت جوان طراحی شده بود. تفاوت میان استان‌ها زیاد است: سیستان و بلوچستان همچنان باروری بالاتری دارد و استان‌های شمالی و تهران پایین‌تر. سیاست‌های تشویقی از ۱۳۹۰ تا کنون روند را برنگردانده‌اند."}, "_concepts": [{"id": "soc:iran-fertility", "title": {"fa": "گذار باروری ایران: از ۶٫۵ به زیر ۲", "en": "Iran's fertility transition: from 6.5 to below 2", "nl": "De Iraanse vruchtbaarheidstransitie: van 6,5 naar onder de 2"}, "url": "../soc/#iran-fertility"}]}, {"id": "iran:poverty-rate", "domain": "soc", "question": {"fa": "چند درصد ایرانیان زیر خط فقر زندگی می‌کنند؟", "en": "What share of Iranians live in poverty?"}, "finding": {"fa": "بانک جهانی (خط ۶٫۸۵ دلار روزانه، برابری قدرت خرید ۲۰۱۷): ۱۹٫۹٪ در ۱۴۰۲، پس از اوج ۲۹٫۳٪ در ۱۳۹۹؛ برآورد ۱۹٪ برای ۱۴۰۳ و پیش‌بینی افزایش به ۲۰٪ در ۱۴۰۴. تورم حدود ۵۲٪ در ۱۴۰۲ و ۳۵٪ در ۱۴۰۳.", "en": "World Bank (US$6.85/day, 2017 PPP): 19.9% in 2023/24 after a 29.3% peak in 2020/21; estimated 19% for 2024/25, forecast to rise to 20% in 2025/26. Inflation about 52% in 2023/24 and 35% in 2024/25."}, "year": 2024, "method": "household survey-based estimate", "grade": "B", "contested": false, "source": [{"title": "World Bank (2025). Macro Poverty Outlook, Spring 2025: Islamic Republic of Iran. Washington, DC: World Bank.", "url": "https://thedocs.worldbank.org/en/doc/77351105a334213c64122e44c2efe523-0500072021/related/mpo-sm25-mena.pdf"}], "fields": ["epi"], "concepts": ["soc:social-roots-of-childhood-adversity"], "capability": [2, 4], "viz": {"kind": "bars", "unit": {"fa": "درصد جمعیت زیر خط ۶٫۸۵ دلار"}, "label": {"fa": "نرخ فقر ایران، بانک جهانی"}, "bars": [{"fa": "۱۳۹۹", "v": 29.3}, {"fa": "۱۴۰۲", "v": 19.9, "self": true}, {"fa": "۱۴۰۳ (برآورد)", "v": 19.0}], "note": {"fa": "خط فقر بین‌المللی است و با خط فقر ملی فرق دارد؛ تورم بالا یعنی بسیاری از خانوارهای بالای خط هم هر سال توان خرید از دست می‌دهند."}}, "roots": {"fa": "تحریم، تورم مزمن، بیکاری جوانان و نابرابری منطقه‌ای."}, "now": {"fa": "فشار اقتصادی از راه «الگوی استرس خانواده» به فرزندپروری خشن و کشمکش زناشویی وصل است."}, "_concepts": [{"id": "soc:social-roots-of-childhood-adversity", "title": {"fa": "ریشه‌های اجتماعی تجربه‌های ناگوار کودکی: از قانون و اقتصاد تا باورها", "en": "Social roots of adverse childhood experiences: from law and economy to beliefs", "nl": "Sociale wortels van ingrijpende jeugdervaringen: van wet en economie tot overtuigingen"}, "url": "../soc/#social-roots-of-childhood-adversity"}]}, {"id": "iran:child-labour", "domain": "soc", "question": {"fa": "چند کودک در ایران کار می‌کنند؟", "en": "How many children work in Iran?"}, "finding": {"fa": "یونیسف به برآورد سازمان بهزیستی (۲۰۲۳) از حدود ۱۲۰ هزار کودک درگیر کار استناد می‌کند. برآوردهای فعالان مدنی چند برابر این عدد است. کودکان مهاجر افغان بی‌مدرک بیشترین آسیب را دارند (زباله‌گردی، تکدی، دستفروشی).", "en": "UNICEF cites a 2023 State Welfare Organization estimate of about 120,000 children engaged in labour; activists’ estimates are many times higher. Undocumented Afghan refugee children are most affected (waste picking, begging, street vending)."}, "year": 2023, "method": "administrative estimate", "grade": "D", "contested": true, "source": [{"title": "UNICEF Iran (n.d.). Children in street situations [برآورد سازمان بهزیستی، ۲۰۲۳].", "url": "https://www.unicef.org/iran/en/children-street-situations"}], "fields": ["epi"], "concepts": ["soc:social-roots-of-childhood-adversity"], "capability": [4, 5], "viz": {"kind": "none", "note": {"fa": "اختلاف برآوردها بیش از یک مرتبهٔ بزرگی است؛ عدد قابل رسمی نداریم."}}, "roots": {"fa": "فقر و تورم، ترک تحصیل، مهاجرت بی‌مدرک، و اجرای ضعیف قانون کار."}, "now": {"fa": "کار کودک هم بی‌توجهی است و هم در معرض خشونت، اعتیاد و بهره‌کشی جنسی قرار گرفتن."}, "critique": "شمار واقعی ناشناخته است؛ برآورد رسمی احتمالاً فقط بخشی از کودکان خیابانی را شامل می‌شود.", "_concepts": [{"id": "soc:social-roots-of-childhood-adversity", "title": {"fa": "ریشه‌های اجتماعی تجربه‌های ناگوار کودکی: از قانون و اقتصاد تا باورها", "en": "Social roots of adverse childhood experiences: from law and economy to beliefs", "nl": "Sociale wortels van ingrijpende jeugdervaringen: van wet en economie tot overtuigingen"}, "url": "../soc/#social-roots-of-childhood-adversity"}]}, {"id": "iran:gini", "domain": "soc", "question": {"fa": "نابرابری درآمد در ایران چقدر است؟", "en": "How unequal is income in Iran?"}, "finding": {"fa": "بر پایهٔ بانک جهانی، ضریب جینی ایران از ۱۳۹۰ تا کنون میان ۳۴ تا ۳۷٫۵ نوسان کرده و آخرین رقم (۱۴۰۲) ۳۵٫۹ است. ارقام پیش از ۱۳۹۰ (۴۲ تا ۴۷) با روش دیگری محاسبه شده‌اند و مستقیم با این‌ها قابل مقایسه نیستند. نابرابری ثروت اندازه‌گیری رسمی ندارد.", "en": "World Bank figures put Iran's Gini between 34 and 37.5 since 2011, most recently 35.9 (2023). Pre-2011 figures (42 to 47) use a different methodology and are not directly comparable. Wealth inequality has no official measurement."}, "year": 2023, "method": "household budget surveys", "grade": "B", "contested": false, "source": [{"title": "World Bank (2024). Gini index — Iran, Islamic Rep. World Development Indicators.", "url": "https://data.worldbank.org/indicator/SI.POV.GINI?locations=IR"}], "fields": [], "concepts": ["soc:gini-inequality"], "capability": [10], "viz": {"kind": "line", "unit": {"fa": "ضریب جینی (۰ تا ۱۰۰)"}, "label": {"fa": "نابرابری درآمد، ۱۳۶۵ تا ۱۴۰۲"}, "series": [{"name": {"fa": "پیش از تغییر روش"}, "points": [[1986, 47.4], [1990, 43.6], [1994, 43.0], [1998, 44.1], [2005, 43.6], [2006, 44.8], [2009, 42.1]]}, {"name": {"fa": "پس از تغییر روش"}, "points": [[2011, 34.7], [2013, 34.0], [2015, 35.3], [2017, 36.7], [2018, 37.4], [2019, 36.5], [2020, 35.8], [2021, 35.5], [2022, 34.8], [2023, 35.9]]}], "broken": true, "compare": {"year": "آخرین سال موجود", "unit": {"fa": "ضریب جینی"}, "bars": [{"fa": "ترکیه (۲۰۲۳)", "v": 43.7}, {"fa": "ایران (۲۰۲۳)", "v": 35.9, "self": true}, {"fa": "پاکستان (۲۰۲۴)", "v": 33.5}, {"fa": "مصر (۲۰۲۱)", "v": 28.5}]}, "note": {"fa": "دو تکهٔ این خط را به هم وصل نکنید: میان ۱۳۸۸ و ۱۳۹۰ روش محاسبهٔ بانک جهانی عوض شده و افت از ۴۲ به ۳۵ بیشتر تغییر روش است تا تغییر واقعیت. نابرابری ثروت (نه درآمد) در ایران اندازه‌گیری رسمی ندارد."}, "source": {"title": "World Bank, World Development Indicators — Gini index (Iran, Islamic Rep.), retrieved 2026-11-09.", "url": "https://data.worldbank.org/indicator/SI.POV.GINI?locations=IR"}}, "critique": "شکست روشی میان ۱۳۸۸ و ۱۳۹۰ باعث می‌شود افت ظاهری نابرابری بیشتر تغییر اندازه‌گیری باشد تا تغییر واقعیت؛ جینی درآمدی هم نابرابری ثروت و دسترسی را نشان نمی‌دهد.", "roots": {"fa": "دو چیز را باید از هم جدا کرد. یکی خودِ نابرابری: جنگ، تورم بلندمدت، یارانهٔ انرژی که بیشترش به مصرف‌کنندهٔ پرمصرف می‌رسد، و نوسان ارزی که دارایی‌دار را در برابر حقوق‌بگیر جلو می‌اندازد. دیگری چیزی که عدد نشان می‌دهد: جینی درآمدی بر پایهٔ پیمایش هزینه و درآمد خانوار محاسبه می‌شود و پیمایش معمولاً بالای توزیع را کم‌شماری می‌کند.\nافت ظاهری میان ۱۳۸۸ و ۱۳۹۰ بیشتر از آنکه تغییر واقعیت باشد، تغییر روش محاسبهٔ بانک جهانی است. کسانی هم هدفمندسازی یارانه‌ها در ۱۳۸۹ را علت بخشی از کاهش می‌دانند، چون پرداخت نقدی یکسان نسبت به درآمدِ کم‌درآمدها وزن بیشتری دارد؛ ولی اثر آن با تورم سال‌های بعد فرسوده شد."}, "now": {"fa": "جینی درآمدی از ۱۳۹۰ در بازهٔ ۳۴ تا ۳۷٫۵ مانده و تغییر بزرگی نکرده. ولی این عدد آنچه را مردم تجربه می‌کنند کامل نشان نمی‌دهد: نابرابری ثروت، به‌ویژه مسکن، در ایران اندازه‌گیری رسمی ندارد و جینی درآمدی آن را نمی‌بیند. فاصلهٔ استان‌ها و فاصلهٔ درون کلان‌شهرها هم در یک عدد ملی گم می‌شود."}, "_concepts": [{"id": "soc:gini-inequality", "title": {"fa": "اندازه‌گیری نابرابری: ضریب جینی و فراتر از آن", "en": "Measuring inequality: the Gini and beyond", "nl": "Ongelijkheid meten: de Gini en verder"}, "url": "../soc/#gini-inequality"}]}, {"id": "iran:child-marriage", "domain": "soc", "question": {"fa": "ازدواج کودکان در ایران چقدر رایج است؟", "en": "How common is child marriage in Iran?"}, "finding": {"fa": "بر پایهٔ داده‌های یونیسف حدود ۳٪ زنان پیش از ۱۵ و حدود ۱۷٪ پیش از ۱۸ سالگی ازدواج کرده‌اند. مرکز آمار ایران حدود ۳۲ هزار ازدواج ثبت‌شدهٔ دختران زیر ۱۵ سال در ۱۴۰۰ و حدود ۲۶ هزار در ۱۴۰۱ گزارش کرده است؛ ازدواج‌های ثبت‌نشده بیرون از این عددهاست. سن قانونی ازدواج دختر ۱۳ سال است و کمتر از آن با اجازهٔ ولی و دادگاه ممکن است.", "en": "UNICEF data indicate about 3% of women married before 15 and about 17% before 18. Iran’s Statistical Centre reported about 32,000 registered marriages of girls under 15 in 2021 and about 26,000 in 2022; unregistered marriages are excluded. The legal marriage age for girls is 13, and younger with guardian and court approval."}, "year": 2022, "method": "UNICEF global databases; civil registration (as reported)", "grade": "B", "contested": true, "source": [{"title": "Girls Not Brides (n.d.). Iran — Child Marriage Atlas (UNICEF global databases, 2019).", "url": "https://www.girlsnotbrides.org/en/learning-resources/child-marriage-atlas/regions-and-countries/iran/"}, {"title": "Iran International (2023, 24 December). New research shows rise in child marriages in Iran [گزارش آمار ثبت ازدواج دختران زیر ۱۵ سال بر پایهٔ مرکز آمار ایران].", "url": "https://www.iranintl.com/en/202312241642"}, {"title": "قانون مدنی ایران، مادهٔ ۱۰۴۱ (اصلاحی ۱۳۸۱)، مادهٔ ۱۱۶۹ و مادهٔ ۱۱۷۹؛ قانون مجازات اسلامی (۱۳۹۲)، مادهٔ ۱۵۸ (بند ت).", "url": ""}], "fields": ["epi"], "concepts": ["soc:social-roots-of-childhood-adversity", "soc:aces-iran-turning-points"], "capability": [2, 4, 7], "viz": {"kind": "bars", "unit": {"fa": "درصد زنان"}, "label": {"fa": "زنانی که پیش از این سن ازدواج کرده‌اند (یونیسف)"}, "bars": [{"fa": "پیش از ۱۵ سالگی", "v": 3, "self": true}, {"fa": "پیش از ۱۸ سالگی", "v": 17, "self": true}], "note": {"fa": "سال پیمایش زیربنای برآورد یونیسف در منبع گفته نشده است. شمار ثبت‌شده‌ها از گزارش رسانه‌ای دربارهٔ دادهٔ مرکز آمار آمده و خودش ردهٔ ۳ است."}}, "roots": {"fa": "سن قانونی پایین (مادهٔ ۱۰۴۱ قانون مدنی، اصلاح ۱۳۸۱)، فقر خانواده، هنجارهای «آبرو» و تفسیرهای سنتی از بلوغ، و تفاوت بزرگ میان روستا و شهر و میان استان‌ها."}, "now": {"fa": "با توجه به نوسان آمار رسمی و ازدواج‌های ثبت‌نشده، روند واقعی روشن نیست. ازدواج کودک هم خودش تجربهٔ ناگوار است و هم مسیر ترک تحصیل، بارداری زودهنگام و خشونت همسر را باز می‌کند."}, "critique": "عددهای مرکز آمار در سال‌های پیاپی با هم نمی‌خوانند و رسانه‌های مختلف تفسیرهای متضاد از روند دارند.", "_concepts": [{"id": "s pability": [4, 7], "critique": "پیمایش آنلاین با نمونهٔ خودگزین را نمی‌توان به کل جمعیت تعمیم داد؛ پیمایش ملی نیز در موضوع دین با سوگیری «پاسخ مطلوب اجتماعی» روبه‌روست.", "viz": {"kind": "none", "note": {"fa": "برای این یافته سری زمانی یا عدد قابل‌رسم منتشرشده‌ای در دست نیست؛ به‌جای نمودار، متن و منبع را بخوانید."}}, "_concepts": [{"id": "soc:secularization", "title": {"fa": "سکولار شدن: امنیت وجودی و دین", "en": "Secularization: existential security and religion", "nl": "Secularisering: existentiële zekerheid en religie"}, "url": "../soc/#secularization"}]}, {"id": "iran:social-trust", "domain": "soc", "question": {"fa": "اعتماد تعمیم‌یافتهٔ ایرانیان چقدر است؟", "en": "How high is Iranians' generalised trust?"}, "finding": {"fa": "در پیمایش جهانی ارزش‌ها حدود ۱۰ تا ۱۵ درصد می‌گویند «به بیشتر مردم می‌شود اعتماد کرد» (ردهٔ کشورهای کم‌اعتماد)؛ پیمایش ملی ارزش‌ها و نگرش‌ها نیز کاهش اعتماد به مردم را از موج اول (۱۳۷۹) تا سوم (۱۳۹۴) نشان می‌دهد. رقم دقیق به موج و شیوهٔ نمونه‌گیری وابسته است.", "en": "In the World Values Survey about 10 to 15 percent say \"most people can be trusted\" (a low-trust country); the national Values and Attitudes survey also shows trust in people falling from wave 1 (2000) to wave 3 (2015). Exact figures depend on wave and sampling."}, "year": 2020, "method": "national probability surveys (WVS; IVAS)", "grade": "B", "contested": false, "source": [{"title": "Haerpfer, C., Inglehart, R., Moreno, A., Welzel, C., et al. (Eds.) (2022). World Values Survey Wave 7 (2017–2022) Cross-National Data-Set. WVSA Secretariat.", "url": "https://www.worldvaluessurvey.org/WVSDocumentationWV7.jsp"}, {"title": "وزارت فرهنگ و ارشاد اسلامی، دفتر طرح‌های ملی (۱۳۷۹، ۱۳۸۲، ۱۳۹۴). پیمایش ملی ارزش‌ها و نگرش‌های ایرانیان، موج‌های اول تا سوم.", "url": ""}], "fields": [], "concepts": ["soc:generalized-trust"], "capability": [7], "critique": "سؤال واحد و ترجمه‌اش در ایران بحث‌برانگیز است؛ اعتماد «خاص» (به خانواده و آشنایان) بالا و «عام» پایین است و باید جدا گزارش شود.", "viz  en:{home:"Home",h1:"For Iran",lead:"Each note is a question about Iran answered with real data: year, method, quality grade and primary source. Notes link to wiki entries, and where a finding is contested its critique sits beside it. This layer grows with every new wiki.",gradeL:"Data grade:",gA:"national survey or strong peer-reviewed study",gB:"good data with sample or time limits",gC:"estimate, non-probability sample or secondary source",gD:"conjecture or dated data",byDomain:"By domain",byCap:"By capability",method:"Method",contested:"contested",critique:"Critique",informs:"Related entries",foot:"The data grade is about the quality of evidence, not the importance of the topic. \"Capability\" refers to Nussbaum's list of ten, the frame of the Iran layer.",

 nl:{home:"Home",h1:"Voor Iran",lead:"Elke notitie is een vraag over Iran, beantwoord met echte data: jaar, methode, kwaliteitsgraad en primaire bron. Notities linken naar wiki-lemma's, en waar een bevinding omstreden is staat de kritiek ernaast. Deze laag groeit met elke nieuwe wiki.",gradeL:"Datakwaliteit:",gA:"nationale survey of sterke peer-reviewed studie",gB:"goede data met steekproef- of tijdsbeperkingen",gC:"schatting, niet-probabilistische steekproef of secundaire bron",gD:"vermoeden of verouderde data",byDomain:"Per domein",byCap:"Per capability",method:"Methode",contested:"omstreden",critique:"Kritiek",informs:"Gerelateerde lemma's",foot:"De datakwaliteit gaat over de kwaliteit van het bewijs, niet over het belang van het onderwerp. \"Capability\" verwijst naar Nussbaums lijst van tien, het kader van de Iran-laag.",

};
let L = "fa"; try { L = localStorage.getItem("ds-lang") || "fa"; } catch(_) {}
const T = k => (UI[L] && UI[L][k]) ?? UI.fa[k];
const tx = o => !o ? "" : (typeof o === "string" ? o : (L === "fa" ? o.fa : (o[L] || o.en || o.fa)) || "");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fa = s => L === "fa" ? String(s).replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]) : String(s);
/* ---- viz: every graphic is RTL, Persian-numbered, and never draws a number without a source ---- */
const VW = 320, VH = 128, VP = {t:14, r:34, b:22, l:10};
function nf(v, d){ let t = Number(v).toFixed(d === undefined ? (Math.abs(v) >= 10 ? 1 : 2) : d); if (t.indexOf(".") > -1) t = t.replace(/0+$/, "").replace(/\.$/, ""); return fa(t.replace(".", "٫")); }
const jy = y => fa(y - 621);
function vwrap(inner, lab, note, src){
  return `<figure class="viz">${lab ? `<figcaption class="vlab">${esc(lab)}</figcaption>` : ""}${inner}${note ? `<p class="vnote">${esc(note)}</p>` : ""}${src ? `<p class="vsrc"><a href="${esc(src.url)}" target="_blank" rel="noopener">${esc(src.title)}</a></p>` : ""}</figure>`;
}
function lineChart(v){
  const segs = v.series, pts = segs.flatMap(s => s.points);
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  let y0 = Math.min(...ys), y1 = Math.max(...ys); const pad = (y1 - y0) * .15 || 1; y0 -= pad; y1 += pad; if (y0 < 0 && Math.min(...ys) >= 0) y0 = 0;
  // RTL: older years on the right, newer on the left
  const X = x => VP.l + (x1 - x) / (x1 - x0 || 1) * (VW - VP.l - VP.r);
  const Y = y => VP.t + (y1 - y) / (y1 - y0 || 1) * (VH - VP.t - VP.b);
  const col = segs.length > 1 ? ["var(--ink-3)", "var(--primary)"] : ["var(--primary)"];
  let g = "";
  // y gridlines
  [y0, (y0 + y1) / 2, y1].forEach(y => { g += `<line x1="${VP.l}" x2="${VW - VP.r}" y1="${Y(y).toFixed(1)}" y2="${Y(y).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${VW - VP.r + 5}" y="${(Y(y) + 4).toFixed(1)}" font-size="9.5" fill="var(--ink-3)">${nf(y)}</text>`; });
  segs.forEach((s, i) => {
    const d = s.points.map((p, j) => (j ? "L" : "M") + X(p[0]).toFixed(1) + "," + Y(p[1]).toFixed(1)).join(" ");
    g += `<path d="${d}" fill="none" stroke="${col[i] || col[0]}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
    s.points.forEach(p => { g += `<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="2.1" fill="${col[i] || col[0]}"><title>${jy(p[0])} (${fa(p[0])}): ${nf(p[1])}</title></circle>`; });
    const e = s.points[s.points.length - 1], f = s.points[0];
    const ex = X(e[0]), ea = ex < VP.l + 18 ? "start" : (ex > VW - VP.r - 18 ? "end" : "middle");
    g += `<text x="${ex.toFixed(1)}" y="${(Y(e[1]) - 7).toFixed(1)}" font-size="10" font-weight="700" fill="${col[i] || col[0]}" text-anchor="${ea}">${nf(e[1])}</text>`;
    if (segs.length > 1) g += `<text x="${((X(f[0]) + X(e[0])) / 2).toFixed(1)}" y="${VH - 12}" font-size="9" fill="${col[i] || col[0]}" text-anchor="middle">${esc(tx(s.name))}</text>`;
  });
  if (v.broken && segs.length > 1){
    const bx = ((X(segs[0].points[segs[0].points.length - 1][0]) + X(segs[1].points[0][0])) / 2).toFixed(1);
    g += `<line x1="${bx}" x2="${bx}" y1="${VP.t}" y2="${VH - VP.b}" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="4 3"/><text x="${bx}" y="${VP.t - 4}" font-size="9" fill="var(--warn)" text-anchor="middle">تغییر روش</text>`;
  }
  g += `<text x="${VW - VP.r}" y="${VH - 4}" font-size="9.5" fill="var(--ink-3)" text-anchor="end">${jy(x0)}</text><text x="${VP.l}" y="${VH - 4}" font-size="9.5" fill="var(--ink-3)">${jy(x1)}</text>`;
  return `<div class="vbox"><svg viewBox="0 0 ${VW} ${VH}" role="img" aria-label="${esc(tx(v.label) || "")}" style="direction:ltr">${g}</svg></div>${v.unit ? `<p class="vunit">${esc(tx(v.unit))}</p>` : ""}`;
}
function barChart(bars, unit){
  const m = Math.max(...bars.map(b => b.v));
  return `<div class="bars">${bars.map(b => `<div class="bar"><span class="bl">${esc(tx(b))}</span><span class="bt"><i style="width:${(b.v / m * 100).toFixed(1)}%;background:${b.self ? "var(--primary)" : "var(--primary-soft)"}"></i></span><b>${nf(b.v, 1)}</b></div>`).join("")}</div>${unit ? `<p class="vunit">${esc(tx(unit))}</p>` : ""}`;
}
function scaleViz(v){
  const pc = (x) => ((v.max - x) / (v.max - v.min) * 100).toFixed(1);
  return `<div class="scale"><span class="st"><i style="inset-inline-start:${pc(v.v)}%"></i></span><div class="se"><span>${fa(v.max)}</span><span>${fa(v.min)}</span></div><b class="sv">${nf(v.v, 1)}</b></div>`;
}
function rangeViz(v){
  const a = ((v.max - v.hi) / (v.max - v.min) * 100), b = ((v.max - v.lo) / (v.max - v.min) * 100);
  return `<div class="scale"><span class="st"><u style="inset-inline-start:${a.toFixed(1)}%;width:${(b - a).toFixed(1)}%"></u></span><div class="se"><span>${fa(v.max)}٪</span><span>${fa(v.min)}٪</span></div><b class="sv">${fa(v.lo)} تا ${fa(v.hi)}٪</b></div>${v.unit ? `<p class="vunit">${esc(tx(v.unit))}</p>` : ""}`;
}
function sec(v, head, kicker){
  if (!v) return "";
  const body = tx(v).split("\n").filter(Boolean).map(p => `<p>${esc(p)}</p>`).join("");
  return `<section class="story"><h4>${esc(head)}<small>${esc(kicker)}</small></h4>${body}</section>`;
}
function viz(n){
  const v = n.viz; if (!v) return "";
  if (v.kind === "none") return `<p class="vnone">${esc(tx(v.note))}</p>`;
  let body = "";
  if (v.kind === "line") body = lineChart(v) + (v.compare ? `<div class="cmp"><span class="vlab2">${esc(tx(v.compare.unit))}</span>${barChart(v.compare.bars, null)}</div>` : "");
  else if (v.kind === "bars") body = barChart(v.bars, v.unit);
  else if (v.kind === "scale") body = scaleViz(v);
  else if (v.kind === "range") body = rangeViz(v);
  else return "";
  return vwrap(body, tx(v.label), tx(v.note), v.source);
}
const FC = {psy:"var(--fam-psy)", soc:"var(--fam-soc)", tabar:"var(--fam-bio)", phil:"var(--fam-hum)"};
let mode = "dom";
function card(n){
  return `<article class="card note" id="${n.id.split(":")[1]}" style="--fc:${FC[n.domain] || "var(--primary)"}"><h3 class="q">${esc(tx(n.question))}</h3><p class="f">${esc(tx(n.finding))}</p>
   <div class="meta"><i class="g ${n.grade}">${n.grade}</i><span>${fa(n.year)}</span>${n.method ? `<span>${T("method")}: ${esc(n.method)}</span>` : ""}${n.contested ? `<span class="flag">${T("contested")}</span>` : ""}<span>${esc(T("dom")[n.domain] || n.domain)}</span></div>
   ${viz(n)}
   ${sec(n.roots, "ریشه‌یابی", "چه شد که این‌طور شد")}
   ${sec(n.now, "وضع موجود", "الان یعنی چه، برای چه کسی")}
   ${n.critique ? `<p class="crit"><b>${T("critique")}:</b> ${esc(n.critique)}</p>` : ""}
   ${n._concepts.length ? `<div class="links">${n._concepts.map(c => `<a href="${c.url}">${esc(tx(c.title))} ↗</a>`).join("")}</div>` : ""}
   <div class="src">${(n.source || []).map(s => s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>` : esc(s.title)).join("<br>")}</div></article>`;
}
function render(){
  document.getElementById("tabs").innerHTML = `<button data-m="dom" aria-pressed="${mode === "dom"}">${T("byDomain")}</button><button data-m="cap" aria-pressed="${mode === "cap"}">${T("byCap")}</button>`;
  let s = "";
  if (mode === "dom") {
    const doms = [...new Set(D.notes.map(n => n.domain))];
    s = doms.map(d => `<section class="sec"><h2 style="color:${FC[d]}">${esc(T("dom")[d] || d)} <small style="color:var(--ink-3);font-weight:400">(${fa(D.notes.filter(n => n.domain === d).length)})</small></h2><div class="notes">${D.notes.filter(n => n.domain === d).map(card).join("")}</div></section>`).join("");
  } else {
    const caps = Object.keys(T("cap")).map(Number);
    s = `<div class="cap">${caps.map(c => `<div><span>${fa(c)}. ${esc(T("cap")[c])}</span><b>${fa(D.notes.filter(n => (n.capability || []).includes(c)).length)}</b></div>`).join("")}</div>`;
    s += caps.filter(c => D.notes.some(n => (n.capability || []).includes(c))).map(c => `<section class="sec"><h2>${fa(c)}. ${esc(T("cap")[c])}</h2><div class="notes">${D.notes.filter(n => (n.capability || []).includes(c)).map(card).join("")}</div></section>`).join("");
  }
  document.getElementById("body").innerHTML = s;
}
document.addEventListener("click", ev => { const b = ev.target.closest("[data-m]"); if (b) { mode = b.dataset.m; render(); } });
function i18n(){ document.documentElement.lang = L; document.documentElement.dir = L === "fa" ? "rtl" : "ltr"; document.querySelectorAll("[data-i]").forEach(el => el.textContent = T(el.dataset.i)); document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === L)); document.title = (L === "fa" ? "همهٔ یادداشت‌ها | ویکی ایران | دانش‌سرا" : "All notes | Iran | Daneshsara"); render(); }
document.querySelector(".lang").addEventListener("click", ev => { const b = ev.target.closest("[data-l]"); if (!b) return; L = b.dataset.l; try { localStorage.setItem("ds-lang", L); } catch(_) {} i18n(); });
i18n();
if (location.hash) setTimeout(() => { const e = document.getElementById(location.hash.slice(1)); if (e) { e.scrollIntoView({block: "start"}); e.style.outline = "2px solid var(--primary)"; } }, 50);
</script>
