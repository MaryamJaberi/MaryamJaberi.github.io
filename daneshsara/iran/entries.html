"mark": [{"x": 1980, "fa": "اوج: ۶٫۶"}, {"x": 2000, "fa": "زیر سطح جانشینی"}], "note": {"fa": "سقوط باروری ایران از سریع‌ترین‌های ثبت‌شدهٔ جهان است: از ۶٫۶ در ۱۳۵۹ به ۲ در ۱۳۷۹، یعنی در بیست سال."}, "source": {"title": "World Bank, World Development Indicators — Fertility rate, total (Iran, Islamic Rep.), retrieved 2026-11-09.", "url": "https://data.worldbank.org/indicator/SP.DYN.TFRT.IN?locations=IR"}}, "roots": {"fa": "سه چیز هم‌زمان جمع شد. اول، شهرنشینی و آموزش: نسبت زنان باسواد و دانشگاه‌رفته در دههٔ ۱۳۷۰ و ۱۳۸۰ به‌سرعت بالا رفت و سن ازدواج بالا رفت. دوم، برنامهٔ ملی تنظیم خانواده که از ۱۳۶۸ با پشتیبانی رسمی و فتوای مذهبی اجرا شد و وسایل پیشگیری را رایگان و در دسترس کرد؛ این برنامه را سازمان ملل یکی از موفق‌ترین نمونه‌های جهان خوانده است. سوم، فشار اقتصادی پس از جنگ: هزینهٔ مسکن و بزرگ کردن فرزند نسبت به درآمد بالا رفت.\nوزن این سه یکسان نیست و بر سرش اختلاف هست. کسانی برنامهٔ تنظیم خانواده را علت اصلی می‌دانند؛ کسانی می‌گویند باروری پیش از آغاز رسمی برنامه هم در حال کاهش بود و تغییر آموزش و شهرنشینی علت ریشه‌ای‌تر است. شاهدی که به نفع نظر دوم است: پس از ۱۳۹۰ که سیاست رسمی برعکس شد و تشویق به فرزندآوری جای تنظیم خانواده را گرفت، باروری بالا نرفت و پس از یک بالا رفتن کوتاه دوباره پایین آمد."}, "now": {"fa": "باروری حالا حدود ۱٫۷ است، یعنی زیر سطح جانشینی (۲٫۱). این یعنی جمعیت ایران با ادامهٔ همین روند از دههٔ ۱۴۲۰ شروع به کاهش می‌کند و سهم سالمندان به‌سرعت بالا می‌رود، در حالی که نظام بازنشستگی و درمان برای جمعیت جوان طراحی شده بود. تفاوت میان استان‌ها زیاد است: سیستان و بلوچستان همچنان باروری بالاتری دارد و استان‌های شمالی و تهران پایین‌تر. سیاست‌های تشویقی از ۱۳۹۰ تا کنون روند را برنگردانده‌اند."}, "_concepts": [{"id": "soc:iran-fertility", "title": {"fa": "گذار باروری ایران: از ۶٫۵ به زیر ۲", "en": "Iran's fertility transition: from 6.5 to below 2", "nl": "De Iraanse vruchtbaarheidstransitie: van 6,5 naar onder de 2"}, "url": "../soc/#iran-fertility"}]}, {"id": "iran:gini", "domain": "soc", "question": {"fa": "نابرابری درآمد در ایران چقدر است؟", "en": "How unequal is income in Iran?"}, "finding": {"fa": "بر پایهٔ بانک جهانی، ضریب جینی ایران از ۱۳۹۰ تا کنون میان ۳۴ تا ۳۷٫۵ نوسان کرده و آخرین رقم (۱۴۰۲) ۳۵٫۹ است. ارقام پیش از ۱۳۹۰ (۴۲ تا ۴۷) با روش دیگری محاسبه شده‌اند و مستقیم با این‌ها قابل مقایسه نیستند. نابرابری ثروت اندازه‌گیری رسمی ندارد.", "en": "World Bank figures put Iran's Gini between 34 and 37.5 since 2011, most recently 35.9 (2023). Pre-2011 figures (42 to 47) use a different methodology and are not directly comparable. Wealth inequality has no official measurement."}, "year": 2023, "method": "household budget surveys", "grade": "B", "contested": false, "source": [{"title": "World Bank (2024). Gini index — Iran, Islamic Rep. World Development Indicators.", "url": "https://data.worldbank.org/indicator/SI.POV.GINI?locations=IR"}], "fields": [], "concepts": ["soc:gini-inequality"], "capability": [10], "viz": {"kind": "line", "unit": {"fa": "ضریب جینی (۰ تا ۱۰۰)"}, "label": {"fa": "نابرابری درآمد، ۱۳۶۵ تا ۱۴۰۲"}, "series": [{"name": {"fa": "پیش از تغییر روش"}, "points": [[1986, 47.4], [1990, 43.6], [1994, 43.0], [1998, 44.1], [2005, 43.6], [2006, 44.8], [2009, 42.1]]}, {"name": {"fa": "پس از تغییر روش"}, "points": [[2011, 34.7], [2013, 34.0], [2015, 35.3], [2017, 36.7], [2018, 37.4], [2019, 36.5], [2020, 35.8], [2021, 35.5], [2022, 34.8], [2023, 35.9]]}], "broken": true, "compare": {"year": "آخرین سال موجود", "unit": {"fa": "ضریب جینی"}, "bars": [{"fa": "ترکیه (۲۰۲۳)", "v": 43.7}, {"fa": "ایران (۲۰۲۳)", "v": 35.9, "self": true}, {"fa": "پاکستان (۲۰۲۴)", "v": 33.5}, {"fa": "مصر (۲۰۲۱)", "v": 28.5}]}, "note": {"fa": "دو تکهٔ این خط را به هم وصل نکنید: میان ۱۳۸۸ و ۱۳۹۰ روش محاسبهٔ بانک جهانی عوض شده و افت از ۴۲ به ۳۵ بیشتر تغییر روش است تا تغییر واقعیت. نابرابری ثروت (نه درآمد) در ایران اندازه‌گیری رسمی ندارد."}, "source": {"title": "World Bank, World Development Indicators — Gini index (Iran, Islamic Rep.), retrieved 2026-11-09.", "url": "https://data.worldbank.org/indicator/SI.POV.GINI?locations=IR"}}, "critique": function rangeViz(v){
  const a = ((v.max - v.hi) / (v.max - v.min) * 100), b = ((v.max - v.lo) / (v.max - v.min) * 100);
  return `<div class="scale"><span class="st"><u style="inset-inline-start:${a.toFixed(1)}%;width:${(b - a).toFixed(1)}%"></u></span><div class="se"><span>${fa(v.max)}٪</span><span>${fa(v.min)}٪</span></div><b class="sv">${fa(v.lo)} تا ${fa(v.hi)}٪</b></div>${v.unit ? `<p class="vunit">${esc(tx(v.unit))}</p>` : ""}`;
}
function sec(v, head, kicker){
  if (!v) return "";
  const body = tx(v).split("\n").filter(Boolean).map(p => `<p>${esc(p)}</p>`).join("");
  return `<section class="story"><h4>${esc(head)}<small>${esc(kicker)}</small></h4>${body}</section>`;
}
function viz(n){
  const v = n.viz; if (!v) return "";
  if (v.kind === "none") return `<p class="vnone">${esc(tx(v.note))}</p>`;
  let body = "";
  if (v.kind === "line") body = lineChart(v) + (v.compare ? `<div class="cmp"><span class="vlab2">${esc(tx(v.compare.unit))}</span>${barChart(v.compare.bars, null)}</div>` : "");
  else if (v.kind === "bars") body = barChart(v.bars, v.unit);
  else if (v.kind === "scale") body = scaleViz(v);
  else if (v.kind === "range") body = rangeViz(v);
  else return "";
  return vwrap(body, tx(v.label), tx(v.note), v.source);
}
const FC = {psy:"var(--fam-psy)", soc:"var(--fam-soc)", tabar:"var(--fam-bio)", phil:"var(--fam-hum)"};
let mode = "dom";
function card(n){
  return `<article class="card note" id="${n.id.split(":")[1]}" style="--fc:${FC[n.domain] || "var(--primary)"}"><h3 class="q">${esc(tx(n.question))}</h3><p class="f">${esc(tx(n.finding))}</p>
   <div class="meta"><i class="g ${n.grade}">${n.grade}</i><span>${fa(n.year)}</span>${n.method ? `<span>${T("method")}: ${esc(n.method)}</span>` : ""}${n.contested ? `<span class="flag">${T("contested")}</span>` : ""}<span>${esc(T("dom")[n.domain] || n.domain)}</span></div>
   ${viz(n)}
   ${sec(n.roots, "ریشه‌یابی", "چه شد که این‌طور شد")}
   ${sec(n.now, "وضع موجود", "الان یعنی چه، برای چه کسی")}
   ${n.critique ? `<p class="crit"><b>${T("critique")}:</b> ${esc(n.critique)}</p>` : ""}
   ${n._concepts.length ? `<div class="links">${n._concepts.map(c => `<a href="${c.url}">${esc(tx(c.title))} ↗</a>`).join("")}</div>` : ""}
   <div class="src">${(n.source || []).map(s => s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>` : esc(s.title)).join("<br>")}</div></article>`;
}
function render(){
  document.getElementById("tabs").innerHTML = `<button data-m="dom" aria-pressed="${mode === "dom"}">${T("byDomain")}</button><button data-m="cap" aria-pressed="${mode === "cap"}">${T("byCap")}</button>`;
  let s = "";
  if (mode === "dom") {
    const doms = [...new Set(D.notes.map(n => n.domain))];
    s = doms.map(d => `<section class="sec"><h2 style="color:${FC[d]}">${esc(T("dom")[d] || d)} <small style="color:var(--ink-3);font-weight:400">(${fa(D.notes.filter(n => n.domain === d).length)})</small></h2><div class="notes">${D.notes.filter(n => n.domain === d).map(card).join("")}</div></section>`).join("");
  } else {
    const caps = Object.keys(T("cap")).map(Number);
    s = `<div class="cap">${caps.map(c => `<div><span>${fa(c)}. ${esc(T("cap")[c])}</span><b>${fa(D.notes.filter(n => (n.capability || []).includes(c)).length)}</b></div>`).join("")}</div>`;
    s += caps.filter(c => D.notes.some(n => (n.capability || []).includes(c))).map(c => `<section class="sec"><h2>${fa(c)}. ${esc(T("cap")[c])}</h2><div class="notes">${D.notes.filter(n => (n.capability || []).includes(c)).map(card).join("")}</div></section>`).join("");
  }
  document.getElementById("body").innerHTML = s;
}
document.addEventListener("click", ev => { const b = ev.target.closest("[data-m]"); if (b) { mode = b.dataset.m; render(); } });
function i18n(){ document.documentElement.lang = L; document.documentElement.dir = L === "fa" ? "rtl" : "ltr"; document.querySelectorAll("[data-i]").forEach(el => el.textContent = T(el.dataset.i)); document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === L)); document.title = (L === "fa" ? "همهٔ یادداشت‌ها | ویکی ایران | دانش‌سرا" : "All notes | Iran | Daneshsara"); render(); }
document.querySelector(".lang").addEventListener("click", ev => { const b = ev.target.closest("[data-l]"); if (!b) return; L = b.dataset.l; try { localStorage.setItem("ds-lang", L); } catch(_) {} i18n(); });
i18n();
if (location.hash) setTimeout(() => { const e = document.getElementById(location.hash.slice(1)); if (e) { e.scrollIntoView({block: "start"}); e.style.outline = "2px solid var(--primary)"; } }, 50);
</script>
