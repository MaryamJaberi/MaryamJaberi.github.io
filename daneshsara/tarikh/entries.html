تون‌ها ارتش بریتانیا را در هند زمین‌گیر کنند (سخن مؤلف، ص ۲۳ فایل).", "en": "A card everyone played: Tikhonov writes that in the twentieth century there was no one who did not try to play the “Pashtun card”. The Germans with Turkish pan-Islamists in the First World War, then the Bolsheviks and the Comintern speaking of an “eastern front of world revolution”, and in the Second War the Axis powers who hoped a Pashtun rising would pin down the British army in India (author’s preface, file p. 23).", "nl": "A card everyone played: Tikhonov writes that in the twentieth century there was no one who did not try to play the “Pashtun card”. The Germans with Turkish pan-Islamists in the First World War, then the Bolsheviks and the Comintern speaking of an “eastern front of world revolution”, and in the Second War the Axis powers who hoped a Pashtun rising would pin down the British army in India (author’s preface, file p. 23)."}, "sources": ["src:49969a8adf"], "flags": []}, {"text": {"fa": "بازی کابل: پادشاهان افغانستان هم با انگلیس حساب تسویه‌نشده داشتند، اما نیروی قبایل برای خود کابل هم خطرناک بود. پس دولت افغانستان از رقابت اردوگاه‌ها به سود خود بهره می‌گرفت و هر توطئهٔ بیرونی در قلمرو قبایل را برهم می‌زد. از آغاز حملهٔ آلمان به شوروی، دستگاه اطلاعاتی شوروی در افغانستان با سرویس‌های آلمان درگیر شد و عملاً کنار بریتانیا قرار گرفت (ص ۲۳ و ۲۴ فایل).", "en": "Kabul’s game: Afghanistan’s kings had unsettled scores with Britain too, but the tribes’ strength was dangerous to Kabul itself. So the Afghan government used the rivalry of the camps to its own advantage and broke up every outside plot in tribal territory. From Germany’s attack on the USSR, Soviet intelligence in Afghanistan fought the German services and in effect stood beside Britain (file pp. 23–24).", "nl": "Kabul’s game: Afghanistan’s kings had unsettled scores with Britain too, but the tribes’ strength was dangerous to Kabul itself. So the Afghan government used the rivalry of the camps to its own advantage and broke up every outside plot in tribal territory. From Germany’s attack on the USSR, Soviet intelligence in Afghanistan fought the German services and in effect stood beside Britain (file pp. 23–24)."}, "sources": ["src:49969a8adf"], "flags": []}, {"text": {"fa": "الگو برای ایران: این همان الگوی «کشور میان قدرت‌ها»ست که در ایرانِ آغاز قرن نوزدهم هم دیدیم، با یک تفاوت آموزنده. قدرت‌های بیرونی کمتر با دولت مرکزی و بیشتر با گروه‌های قومی و مرزی کار می‌کردند. برای کشوری چندقومی، نتیجه روشن است: هر جا شهروندان مرزنشین سهمی از قدرت و رفاه نداشته باشند، دری برای بازی دیگران باز می‌ماند. این برداشت ویراستار است.", "en": "A pattern for Iran: this is the same “country between powers” pattern seen in early nineteenth-century Iran, with one instructive difference. Outside powers worked less with the central state and more with ethnic and frontier groups. For a multi-ethnic country the conclusion is plain: wherever citizens of the borderlands have no share in power and welfare, a door stays open to others’ games. This is the editor’s reading.", "nl": "A pattern for Iran: this is the same “country between powers” pattern seen in early nineteenth-century Iran, with one instructive difference. Outside powers worked less with the central state and more with ethnic and frontier groups. For a multi-ethnic country the conclusion is plain: wherever citizens of the borderlands have no share in power and welfare, a door stays open to others’ games. This is the editor’s reading."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "حدّ این مدخل: کتاب بر بایگانی‌های شوروی و بریتانیا تکیه دارد و از نگاه یک تاریخ‌نگار روس نوشته شده است؛ عنوان فارسی («نبرد افغانی استالین») از کتاب دیگری از همین نویسنده گرفته شده و عنوان اصلی «سیاست قدرت‌های بزرگ در افغانستان و قبایل پشتون» است. مترجم مقدمه‌ای بلند با تحلیل ژئوپولیتیک امروز افزوده که نظر خود اوست. از ۵۸۶ صفحهٔ فایل، سخن مؤلف، آغاز بخش یکم و بخشی از مقدمهٔ مترجم خوانده شد.", "en": "Limits: the book rests on Soviet and British archives and is written from a Russian historian’s standpoint; the Persian title (“Stalin’s Afghan War”) comes from another book by the same author, the original being “Politics of the Great Powers in Afghanistan and the Pashtun Tribes”. The translator added a long introduction with present-day geopolitical analysis that is his own view. Of 586 file pages, the author’s preface, the start of part one and part of the translator’s introduction were read.", "nl": "Limits: the book rests on Soviet and British archives and is written from a Russian historian’s standpoint; the Persian title (“Stalin’s Afghan War”) comes from another book by the same author, the original being “Politics of the Great Powers in Afghanistan and the Pashtun Tribes”. The translator added a long introduction with present-day geopolitical analysis that is his own view. Of 586 file pages, the author’s preface, the start of part one and part of the translator’s introduction were read."}, "sources": [], "flags": ["editor-note"]}], "links": [{"to": "tarikh:iran-between-powers-1800-1828-mahmud", "rel": "see-also", "note": {"fa": "ایران میان قدرت‌ها", "en": "Iran between the powers", "nl": "Iran between the powers"}}, {"to": "tarikh:armenia-between-iran-and-rome", "rel": "see-also", "note": {"fa": "ارمنستان میان ایران و روم", "en": "Armenia between Iran and Rome", "nl": "Armenia between Iran and Rome"}}, {"to": "soc:ethnic-identity-crisis-iran-altaee", "rel": "see-also", "note": {"fa": "بحران هویت قومی", "en": "The ethnic identity crisis", "nl": "The ethnic identity crisis"}}, {"to": "soc:baluchestan-1970s-witness-dowlatabadi", "rel": "see-also", "note": {"fa": "بلوچستان", "en": "Baluchestan", "nl": "Baluchestan"}}, {"to": "soc:soviet-collapse-reform-from-above", "rel": "see-also", "note": {"fa": "شوروی", "en": "The Soviet Union", "nl": "The Soviet Union"}}], "people": [], "sources": ["src:49969a8adf"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tarikh:protest-waves-2009-2022", "kind": "concept", "title": {"fa": "موج‌های اعتراض: ۱۳۸۸، ۱۳۹۶، ۱۳۹۸، ۱۴۰۱", "en": "Protest waves: 2009, 2017–18, 2019, 2022", "nl": "Protest waves: 2009, 2017–18, 2019, 2022"}, "aliases": [], "parent": "tarikh:modern", "field": "tarikh:modern", "summary": {"fa": "چهار موج با چهار چهرهٔ متفاوت: ۱۳۸۸ اعتراض طبقهٔ متوسط شهری به نتیجهٔ انتخابات با شعار «رأی من کو»؛ دی ۱۳۹۶ اعتراض اقتصادی شهرهای کوچک که زود به شعار علیه کل نظام رسید؛ آبان ۱۳۹۸ اعتراض به گرانی بنزین که با قطع سراسری اینترنت و خونین‌ترین سرکوب تا آن زمان پاسخ گرفت؛ و ۱۴۰۱ جنبش «زن، زندگی، آزادی» پس از مرگ مهسا (ژینا) امینی در بازداشت گشت ارشاد. روند کلی: از اصلاح به گذار، از تهران به همهٔ کشور، و از طبقهٔ متوسط به همهٔ طبقه‌ها.", "en": "Four waves with four faces: 2009, the urban middle class protesting an election result under “where is my vote”; winter 2017–18, economic protest in small towns that quickly turned against the whole system; November 2019, protest at a fuel price rise answered with a nationwide internet shutdown and the bloodiest crackdown until then; and 2022, the “Woman, Life, Freedom” movement after the death of Mahsa (Jina) Amini in morality-police custody. The overall trend: from reform to transition, from Tehran to the whole country, and from the middle class to all classes.", "nl": "Four waves with four faces: 2009, the urban middle class protesting an election result under “where is my vote”; winter 2017–18, economic protest in small towns that quickly turned against the whole system; November 2019, protest at a fuel price rise answered with a nationwide internet shutdown and the bloodiest crackdown until then; and 2022, the “Woman, Life, Freedom” movement after the death of Mahsa (Jina) Amini in morality-police custody. The overall trend: from reform to transition, from Tehran to the whole country, and from the middle class to all classes."}, "points": [{"text": {"fa": "آبان ۱۳۹۸: عفو بین‌الملل نام و جزئیات ۳۰۴ کشته را مستند کرد و گفت رقم واقعی بیشتر است؛ رقم‌های دیگر بسیار بالاتر است و حکومت آمار تفکیکی نداد. اینترنت حدود یک هفته تقریباً در سراسر کشور قطع بود.", "en": "November 2019: Amnesty International documented the names and details of 304 people killed and said the real figure is higher; other figures are far higher and the state gave no detailed count. The internet was cut almost nationwide for about a week.", "nl": "November 2019: Amnesty International documented the names and details of 304 people killed and said the real figure is higher; other figures are far higher and the state gave no detailed count. The internet was cut almost nationwide for about a week."}, "sources": ["src:06a7496d98"], "flags": ["contested"]}, {"text": {"fa": "۱۴۰۱: هیئت حقیقت‌یاب سازمان ملل (۲۰۲۴) نتیجه گرفت سرکوب این اعتراض‌ها شامل نقض‌های شدید حقوق بشر بود که بسیاری‌شان به جنایت علیه بشریت می‌رسد، از جمله قتل، حبس، شکنجه، تجاوز و آزار جنسیتی.", "en": "2022: the UN fact-finding mission (2024) concluded the crackdown involved serious human-rights violations, many amounting to crimes against humanity, including murder, imprisonment, torture, rape and gender persecution.", "nl": "2022: the UN fact-finding mission (2024) concluded the crackdown involved serious human-rights violations, many amounting to crimes against humanity, including murder, imprisonment, torture, rape and gender persecution."}, "sources": ["src:e841177b4b"], "flags": []}, {"text": {"fa": "الگوی مشترک: جرقهٔ پیش‌بینی‌ناپذیر، گسترش سریع، قطع اینترنت، سرکوب، و فروکش بدون سازمان پایدار. هر موج آستانهٔ ترس را پایین‌تر و فاصله تا موج بعد را کوتاه‌تر کرد.", "en": "Common pattern: an unpredictable spark, rapid spread, internet shutdown, repression, and subsidence without durable organisation. Each wave lowered the fear threshold and shortened the gap to the next.", "nl": "Common pattern: an unpredictable spark, rapid spread, internet shutdown, repression, and subsidence without durable organisation. Each wave lowered the fear threshold and shortened the gap to the next."}, "sources": [], "flags": ["editor-note"]}], "links": [{"to": "soc:civil-resistance-success-rates", "rel": "see-also", "note": {"fa": "مقاومت مدنی چقدر موفق می‌شود", "en": "How often civil resistance succeeds", "nl": "How often civil resistance succeeds"}}, {"to": "soc:self-organized-criticality", "rel": "see-also", "note": {"fa": "جرقه و بهمن", "en": "Sparks and avalanches", "nl": "Sparks and avalanches"}}, {"to": "soc:telegram-public-sphere-iran-2010s", "rel": "see-also", "note": {"fa": "تلگرام و حوزهٔ عمومی", "en": "Telegram and the public sphere", "nl": "Telegram and the public sphere"}}, {"to": "tarikh:revolution-1979", "rel": "see-also", "note": {"fa": "مقایسه با ۱۳۵۷", "en": "Compared with 1979", "nl": "Compared with 1979"}}], "people": [], "sources": ["src:06a7496d98", "src:e841177b4b"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}], "people": {}, "sources": {"src:e658a741c7": {"id": "src:e658a741c7", "cite": "Kurzman, C. (2004). The Unthinkable Revolution in Iran. Cambridge, MA: Harvard University Press.", "year": 2004, "tier": 3, "wikis": ["soc", "phil", "tarikh"]}, "src:36618cf31d": {"id": "src:36618cf31d", "cite": "Abrahamian, E. (2008). A History of Modern Iran. Cambridge: Cambridge University Press.", "year": 2008, "tier": 3, "wikis": ["soc", "phil", "tarikh"]}, "src:06a7496d98": {"id": "src:06a7496d98", "cite": "Amnesty International (2020). Iran: Details of 304 deaths in crackdown on November 2019 protests (MDE 13/2308/2020).", "year": 2020, "tier": 2, "wikis": ["tarikh"], "url": "https://www.amnesty.org/en/documents/mde13/2308/2020/en/"}, "src:1594f979d0": {"id": "src:1594f979d0", "cite": "Gasiorowski, M. J., & Byrne, M. (Eds.). (2004). Mohammad Mosaddeq and the 1953 Coup in Iran. Syracuse: Syracuse University Press.", "year": 2004, "tier": 2, "wikis": ["tarikh"]}, "src:c182e55a07": {"id": "src:c182e55a07", "cite": "عبدالحسین زرین‌کوب، تاریخ ایران بعد از اسلام (مجلدِ ۵ از ۷، نسخهٔ دیجیتالِ کتابخانهٔ دانش‌سرا؛ ویراست و ناشر دقیق const fa = s => L === "fa" ? String(s).replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]) : String(s);
const BY = Object.fromEntries(D.concepts.map(c => [c.id, c]));
const ROOT = D.concepts.find(c => c.kind === "root"), FIELDS = D.concepts.filter(c => c.kind === "field").sort((a, b) => (D.order || []).indexOf(a.id) - (D.order || []).indexOf(b.id)), ITEMS = D.concepts.filter(c => c.kind === "concept" || c.kind === "subfield");
let fieldSel = null, q = "";
const titleOf = id => BY[id] ? tx(BY[id].title) : (D.ext[id] ? tx(D.ext[id].title) : id);
const urlOf = id => BY[id] ? "#" + id.split(":")[1] : (D.ext[id] ? D.ext[id].url : null);
function list(){
  const items = ITEMS.filter(c => (!fieldSel || c.field === fieldSel || c.parent === fieldSel) && (!q || JSON.stringify([c.title, c.summary, c.aliases]).toLowerCase().includes(q.toLowerCase())));
  const groups = FIELDS.filter(f => !fieldSel || f.id === fieldSel).map(f => ({f, items: items.filter(c => c.field === f.id || c.parent === f.id)})).filter(g => g.items.length);
  return `<section class="hero"><h1>${esc(tx(ROOT.title))}</h1><p>${esc(tx(ROOT.summary))}</p><div><span class="draft">⚑ ${T("draft")} · ${fa(ITEMS.length)} ${T("concepts")}</span></div>
    ${ROOT.links && ROOT.links.length ? `<div class="ppl">${ROOT.links.map(l => `<a class="chip" style="text-decoration:none" href="${urlOf(l.to)}">${esc(tx(l.note))} ↗</a>`).join("")}</div>` : ""}</section>
   <div class="search"><input id="q" type="search" placeholder="${T("search")}" value="${esc(q)}" aria-label="${T("search")}"></div>
   <div class="fields"><button data-f="" aria-pressed="${!fieldSel}">${T("all")}</button>${FIELDS.map(f => `<button data-f="${f.id}" aria-pressed="${fieldSel === f.id}">${esc(tx(f.title))}</button>`).join("")}</div>
   ${groups.map(g => `<section class="fsec"><h2>${esc(tx(g.f.title))}</h2><p>${esc(tx(g.f.summary))}</p><div class="grid">${g.items.map(c => `<div class="card" data-go="${c.id}" tabindex="0" role="link"><div class="kick">${esc(tx(g.f.title))}</div><h3>${esc(tx(c.title))}</h3>${L === "fa" && c.title.en ? `<div class="sub">${esc(c.title.en)}</div>` : ""}<p>${esc(tx(c.summary))}</p></div>`).join("")}</div></section>`).join("")}`;
}
function detail(c){
  const f = c.field && BY[c.field] || c.parent && BY[c.parent];
  const srcIds = []; const sref = id => { let i = srcIds.indexOf(id); if (i < 0) { srcIds.push(id); i = srcIds.length - 1; } return i + 1; };
  const evOf = p => { const t = (p.sources || []).map(id => D.sources[id] && D.sources[id].tier).filter(Boolean); return t.length ? Math.min(...t) : 0; };
  const pts = (c.points || []).map(p => { const refs = (p.sources || []).map(sref); const ev = evOf(p); return `<li>${esc(tx(p.text))}<div class="ref"><span class="ev t${ev}" title="${esc(T("evl"))}">${esc(T("ev")[ev])}</span>${(p.flags || []).map(fl => `<span class="flag ${fl}">${esc(T("flag")[fl] || fl)}</span>`).join("")}${refs.map(n => `<span>[${fa(n)}]</span>`).join("")}</div></li>`; }).join("");
  (c.sources || []).forEach(sref);
  const links = (c.links || []).map(l => { const u = urlOf(l.to); if (!u) return ""; const extW = !BY[l.to] ? l.to.split(":")[0] : ""; return `<a href="${u}"><span class="rel">${esc(T("rel")[l.rel] || l.rel)}</span><span><b>${esc(titleOf(l.to))}</b>${extW ? ` <span class="ext">(${T("inwiki")} ${extW})</span>` : ""}<div class="nt">${esc(tx(l.note))}</div></span></a>`; }).join("");
  const slug = c.id.split(":")[1];
  const chipOf = id => { const u = urlOf(id); if (!u) return ""; const w = !BY[id] ? id.split(":")[0] : ""; return `<a href="${u}">${esc(titleOf(id))}${w ? ` <span class="ext">(${T("inwiki")} ${w})</span>` : ""}</a>`; };
  const back = ((D.back || {})[slug] || []).map(chipOf).join("");
  const same = ((D.same || {})[slug] || []).map(chipOf).join("");
  const LB = {fa: ["به این مدخل پیوند داده‌اند", "از همین منبع"], en: ["Linked from", "From the same source"], nl: ["Verwezen vanuit", "Uit dezelfde bron"]}[L] || ["Linked from", "From the same source"];
  const ppl = (c.people || []).map(id => D.people[id]).filter(Boolean).map(p => `<span>${esc(tx(p.name))}${p.years ? ` <small>${fa(p.years)}</small>` : ""}${L === "fa" && p.note && p.note.fa ? ` <small>— ${esc(p.note.fa)}</small>` : ""}</span>`).join("");
  const ir = c.iran && D.iran[c.iran];
  const iran = ir ? `<h2 class="sec">${T("iran")}</h2><div class="iran"><div class="q">${esc(tx(ir.question))}</div><div>${esc(tx(ir.finding))}</div><div class="status"><span class="grade">${T("grade")} ${esc(ir.grade)}</span><span>${fa(ir.year)}</span>${ir.method ? `<span>${T("method")}: ${esc(ir.method)}</span>` : ""}${ir.contested ? `<span class="flag contested">${T("contested")}</span>` : ""}</div>${ir.critique ? `<div class="nt"><b>${T("critique")}:</b> ${esc(ir.critique)}</div>` : ""}<div class="ref" dir="ltr" style="font-size:var(--chip);color:var(--ink-3);text-align:left">${(ir.source || []).map(s => s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>` : esc(s.title)).join("<br>")}</div></div>` : "";
  const srcs = srcIds.map((id, i) => { const s = D.sources[id]; if (!s) return ""; return `<li>${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.cite)}</a>` : esc(s.cite)} <small>(${T("tier")} ${fa(s.tier)})</small></li>`; }).join("");
  return `<article class="detail"><button class="back" data-back>${T("back")}</button>
   <div><div class="kick">${f ? esc(tx(f.title)) : ""}</div><h1>${esc(tx(c.title))}</h1>${L === "fa" && c.title.en ? `<div class="sub">${esc(c.title.en)}${c.title.nl && c.title.nl !== c.title.en ? ` · ${esc(c.title.nl)}` : ""}</div>` : ""}</div>
   <p class="lead">${esc(tx(c.summary))}</p>
   ${pts ? `<h2 class="sec">${T("points")}</h2><ol class="pts">${pts}</ol>` : ""}
   ${iran}
   ${links ? `<h2 class="sec">${T("links")}</h2><div class="links">${links}</div>` : ""}
   ${back ? `<h2 class="sec">${LB[0]}</h2><div class="rels">${back}</div>` : ""}
   ${same ? `<h2 class="sec">${LB[1]}</h2><div class="rels">${same}</div>` : ""}
   ${ppl ? `<h2 class="sec">${T("people")}</h2><div class="ppl">${ppl}</div>` : ""}
   ${srcs ? `<h2 class="sec">${T("sources")}</h2><ol class="src">${srcs}</ol>` : ""}
   <div class="status"><span class="draft">⚑ ${T(c.status)}</span>${c.origin ? `<span>${esc(c.origin)}</span>` : ""}</div></article>`;
}
function render(){
  const h = location.hash.slice(1); const c = h && BY[D.wiki + ":" + h];
  if (h && !c && D.renamed && D.renamed[h]) { location.replace("#" + D.renamed[h]); return; }
  if (h && !c && D.merged && D.merged[h]) { location.replace("../" + D.merged[h] + "/entries.html#" + h); return; }
  document.getElementById("main").innerHTML = c ? detail(c) : list();
  if (c) window.scrollTo({top: 0}); else { const i = document.getElementById("q"); if (i && q) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }
}
document.addEventListener("click", ev => {
  const g = ev.target.closest("[data-go]"); if (g) { location.hash = g.dataset.go.split(":")[1]; return; }
  if (ev.target.closest("[data-back]")) { history.pushState(null, "", location.pathname); render(); return; }
  const f = ev.target.closest("[data-f]"); if (f) { fieldSel = f.dataset.f || null; render(); }
});
document.addEventListener("keydown", ev => { if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches("[data-go]")) { ev.preventDefault(); ev.target.click(); } });
document.addEventListener("input", ev => { if (ev.target.id === "q") { q = ev.target.value; render(); } });
window.addEventListener("hashchange", render);
function i18n(){ document.documentElement.lang = L; document.documentElement.dir = L === "fa" ? "rtl" : "ltr"; document.querySelectorAll("[data-i]").forEach(el => el.textContent = T(el.dataset.i)); const _wn = document.getElementById("wname"); if (_wn) _wn.textContent = tx(ROOT.title); document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === L)); document.title = (L === "fa" ? "همهٔ مدخل‌ها | ویکی " + tx(ROOT.title) + " | دانش‌سرا" : "All entries | " + tx(ROOT.title) + " | Daneshsara"); render(); }
document.querySelector(".lang").addEventListener("click", ev => { const b = ev.target.closest("[data-l]"); if (!b) return; L = b.dataset.l; try { localStorage.setItem("ds-lang", L); } catch(_) {} i18n(); });
i18n();
</script>
</body>
</html>
