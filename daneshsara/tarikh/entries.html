رفت. محمود محمود در جلد چهارم تاریخش متن کامل را می‌آورد و آن را اشتباه می‌داند.", "en": "In 1881, after Russia had defeated the Akhal Turkmens, Iran and Russia drew the border east of the Caspian in Tehran. Iran gave up its claim to Merv and accepted several undertakings on water, arms and Russian border agents. In volume four of his history Mahmud Mahmud gives the full text and judges it a mistake.", "nl": "In 1881, after Russia had defeated the Akhal Turkmens, Iran and Russia drew the border east of the Caspian in Tehran. Iran gave up its claim to Merv and accepted several undertakings on water, arms and Russian border agents. In volume four of his history Mahmud Mahmud gives the full text and judges it a mistake."}, "points": [{"text": {"fa": "زمینه: پس از کنگرهٔ برلن (۱۸۷۸) روسیه به کرانهٔ شرقی دریای خزر روی آورد. به روایت محمود، لشکر ژنرال لوماکین در ۱۸۷۹ در گوگ‌تپه از ترکمن‌ها شکست خورد و سپس ژنرال اسکوبلف آنان را درهم شکست. ایران مرو را از آنِ خود می‌دانست، اما پس از جدا شدن هرات راهش به مرو بسته شده بود و نمی‌توانست جلوی تاخت‌وتاز ترکمن‌ها به خراسان را بگیرد (فصل ۴۸).", "en": "Background: after the Congress of Berlin (1878) Russia turned to the eastern shore of the Caspian. By Mahmud’s account General Lomakin’s force was beaten by the Turkmens at Geok Tepe in 1879, and General Skobelev then crushed them. Iran regarded Merv as its own, but once Herat was detached its road to Merv was closed and it could not stop Turkmen raids into Khorasan (ch. 48).", "nl": "Background: after the Congress of Berlin (1878) Russia turned to the eastern shore of the Caspian. By Mahmud’s account General Lomakin’s force was beaten by the Turkmens at Geok Tepe in 1879, and General Skobelev then crushed them. Iran regarded Merv as its own, but once Herat was detached its road to Merv was closed and it could not stop Turkmen raids into Khorasan (ch. 48)."}, "sources": ["src:52a0e0bdb0"], "flags": []}, {"text": {"fa": "قرارنامه: در دسامبر ۱۸۸۱ در تهران، میرزا سعیدخان مؤتمن‌الملک و ایوان زینوویف، وزیر مختار روسیه، قرارنامهٔ مرزی را امضا کردند. مرز از خلیج حسینقلی در امتداد رود اترک تا چات و سپس بر خط‌الرأس کوه‌ها تا نزدیکی لطف‌آباد کشیده شد. متن نُه فصل دارد (فصل ۴۸).", "en": "The convention: in December 1881 in Tehran, Mirza Sa‘id Khan Mo’tamen al-Molk and Ivan Zinoviev, the Russian minister, signed the boundary convention. The frontier ran from Hasanqoli bay along the Atrak river to Chat and then along the mountain crests to near Lotfabad. The text has nine articles (ch. 48).", "nl": "The convention: in December 1881 in Tehran, Mirza Sa‘id Khan Mo’tamen al-Molk and Ivan Zinoviev, the Russian minister, signed the boundary convention. The frontier ran from Hasanqoli bay along the Atrak river to Chat and then along the mountain crests to near Lotfabad. The text has nine articles (ch. 48)."}, "sources": ["src:52a0e0bdb0"], "flags": []}, {"text": {"fa": "بندهای کمتر دیده‌شده: ایران پذیرفت در کنار رودهایی که از خاکش به آن سوی مرز می‌روند آبادی تازه نسازد و کشت را گسترش ندهد و بیش از نیاز آب برندارد. همچنین صدور هر گونه سلاح از مرز استرآباد و خراسان را ممنوع کند، دو قلعهٔ مرزی را تخلیه کند، و بپذیرد روسیه در نقاط مرزی ایران مأمور بگمارد تا رفتار ترکمن‌ها را زیر نظر بگیرد (فصل‌های سوم تا هفتم قرارنامه).", "en": "The lesser-noticed clauses: Iran agreed not to found new villages or extend cultivation along rivers flowing from its soil across the border, nor to draw more water than needed. It also agreed to ban all arms exports across the Astarabad and Khorasan frontier, to evacuate two border forts, and to let Russia post agents at points on the Iranian frontier to watch the Turkmens (articles three to seven of the convention).", "nl": "The lesser-noticed clauses: Iran agreed not to found new villages or extend cultivation along rivers flowing from its soil across the border, nor to draw more water than needed. It also agreed to ban all arms exports across the Astarabad and Khorasan frontier, to evacuate two border forts, and to let Russia post agents at points on the Iranian frontier to watch the Turkmens (articles three to seven of the convention)."}, "sources": ["src:52a0e0bdb0"], "flags": []}, {"text": {"fa": "داوری محمود: او می‌نویسد ایران با این قرارنامه از حق حاکمیت بر مرو و ترکمن‌های آن نواحی گذشت به این امید که خراسان آرام شود، و این «اشتباه بزرگ» بود چون تاخت‌وتاز پایان نیافت. او امضای قرارنامه را نشانهٔ کم شدن نفوذ بریتانیا در دربار پس از برکناری سپهسالار می‌داند (فصل ۴۸).", "en": "Mahmud’s verdict: he writes that with this convention Iran gave up its claim to sovereignty over Merv and the Turkmens of the region in the hope of calm in Khorasan, and that this was “a great mistake” because the raids did not end. He reads the signature as a sign of declining British influence at court after the dismissal of the Sepahsalar (ch. 48).", "nl": "Mahmud’s verdict: he writes that with this convention Iran gave up its claim to sovereignty over Merv and the Turkmens of the region in the hope of calm in Khorasan, and that this was “a great mistake” because the raids did not end. He reads the signature as a sign of declining British influence at court after the dismissal of the Sepahsalar (ch. 48)."}, "sources": ["src:52a0e0bdb0"], "flags": []}, {"text": {"fa": "چرا امروز مهم است: این همان مرزی است که اکنون ایران را از ترکمنستان جدا می‌کند، و بند آب آن نمونه‌ای زودهنگام از محدود شدن حق بالادست در یک رود مرزی است. نگاه ترکمن‌ها، که سرزمینشان میان دو دولت تقسیم شد، در این کتاب نیست. این یادآوری ویراستار است.", "en": "Why it matters today: this is the frontier that now separates Iran from Turkmenistan, and its water clause is an early case of restricting upstream rights on a border river. The view of the Turkmens, whose land was divided between two states, is absent from this book. This is the editor’s reminder.", "nl": "Why it matters today: this is the frontier that now separates Iran from Turkmenistan, and its water clause is an early case of restricting upstream rights on a border river. The view of the Turkmens, whose land was divided between two states, is absent from this book. This is the editor’s reminder."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "حدّ این مدخل: فایل اسکن است و با نویسه‌خوانی خودکار خوانده شد؛ نام برخی کوه‌ها و روستاهای مرزی ناخوانا بود و نیامده است. از ۴۶۰ صفحهٔ جلد چهارم، فهرست مطالب و حدود دوازده صفحه از پایان فصل ۴۸ خوانده شد.", "en": "Limits: the file is a scan read by OCR; the names of some border mountains and villages were illegible and are omitted. Of the 460 pages of volume four, the contents and about twelve pages from the end of chapter 48 were read.", "nl": "Limits: the file is a scan read by OCR; the names of some border mountains and villages were illegible and are omitted. Of the 460 pages of volume four, the contents and about twelve pages from the end of chapter 48 were read."}, "sources": [], "flags": ["editor-note"]}], "links": [{"to": "tarikh:herat-war-1856-treaty-of-paris-1857", "rel": "see-also", "note": {"fa": "جنگ هرات و عهدنامهٔ پاریس", "en": "The Herat war and the Treaty of Paris", "nl": "The Herat war and the Treaty of Paris"}}, {"to": "tarikh:afghanistan-1919-1945-pashtun-card-great-powers", "rel": "see-also", "note": {"fa": "افغانستان و قدرت‌ها", "en": "Afghanistan and the powers", "nl": "Afghanistan and the powers"}}, {"to": "tarikh:anglo-russian-convention-1907-iran-not-told", "rel": "see-also", "note": {"fa": "قرارداد ۱۹۰۷", "en": "The 1907 convention", "nl": "The 1907 convention"}}, {"to": "soc:turkmen-settlement-and-schools-in-royal-account", "rel": "see-also", "note": {"fa": "اسکان ترکمن‌ها در روایت رسمی", "en": "Turkmen settlement in the official account", "nl": "Turkmen settlement in the official account"}}, {"to": "soc:qanat-share-of-water-baluchestan-1969", "rel": "see-also", "note": {"fa": "قنات و سهم آب", "en": "Qanats and water shares", "nl": "Qanats and water shares"}}], "people": [], "sources": ["src:52a0e0bdb0"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tarikh:saffarid-rise", "kind": "concept", "title": {"fa": "برآمدن یعقوب لیث: از عیاری تا امارت صفاریان", "en": "The rise of Ya'qub al-Saffar: from street chivalry to the Saffarid emirate", "nl": "De opkomst van Ya'qub al-Saffar: van straatridderlijkheid tot het Saffaridische emiraat"}, "aliases": ["یعقوب لیث صفاری", "صفاریان", "یعقوب لیث"], "parent": "tarikh:early-islamic", "field": "tarikh:early-islamic", "summary": {"fa": "یعقوب بن لیث، پسر یک مسگر از سیستان، از دل شبکهٔ «عیاران» و «مطوعهٔ» ضدخوارجِ سیستان بالا آمد و در سال ۲۴۷ هجری امیر محلی سیستان را برانداخت و نخستین سلسلهٔ ایرانی‌ای را بنیاد نهاد که دیگر حتی اسماً هم تابع فرمانروای عرب محلی نبود — صفاریان.", "en": "Ya'qub ibn al-Layth, the son of a coppersmith from Sistan, rose through the network of Sistan's \"ayyarun\" (street-chivalry militias) and anti-Kharijite \"mutawwi'a\", and in 247 AH overthrew Sistan's local Arab-appointed ruler, founding the first Iranian dynasty that was no longer even nominally under a local Arab governor — the Saffarids.", "nl": "Ya'qub ibn al-Layth, zoon van een kopersmid uit Sistan, klom op via het netwerk van Sistans \"ayyarun\" (straatridderlijkheidsmilities) en anti-Kharijitische \"mutawwi'a\", en wierp in 247 AH de lokale, door Arabieren aangestelde heerser van Sistan omver, waarmee hij de eerste Iraanse dynastie stichtte die zelfs niet meer nominaal onder een lokale Arabische gouverneur stond — de Saffariden."}, "points": [{"text": {"fa": "سیستان از دیرباز با خوارج دست‌به‌گریبان بود؛ چون نه طاهریان و نه عمال محلی‌شان نمی‌توانستند خوارج را کاملاً سرکوب کنند، مردم خود داوطلبانه دسته‌های «مطوعه» تشکیل دادند. این مطوعه‌ها، همراه با طبقهٔ «عیاران» (جوانمردان مسلح محلی)، به‌تدریج از نیروی کمکی به نیروی مستقل قدرت تبدیل شدند که حتی حکمرانان را به وحشت می‌انداخت.", "en": "Sistan had long struggled with Kharijite unrest; since neither the Tahirids nor their local officials could fully suppress them, the populace formed volunteer \"mutawwi'a\" militias on their own. These militias, together with the \"ayyarun\" class (armed local men of chivalry), gradually turned from an auxiliary force into an independent power that even frightened the ruling governors.", "nl": "Sistan worstelde al lang met Kharijitische onrust; omdat noch de Tahiriden noch hun plaatselijke ambtenaren hen volledig konden onderdrukken, vormde de bevolking zelf vrijwillige \"mutawwi'a\"-milities. Deze milities groeiden, samen met de \"ayyarun\"-klasse (gewapende plaatselijke mannen van ridderlijkheid), geleidelijk uit van een hulptroepenmacht tot een onafhankelijke machtsfactor die zelfs de heersende gouverneurs schrik aanjoeg."}, "sources": ["src:f407762ded"], "flags": []}, {"text": {"fa": "یعقوب و برادرانش (عمرو، ظاهر، علی) از عیاران سیستان بودند. او نخست در کنار صالح بن نضر و سپس درهم بن نضر (که به امارت سیستان رسیدند) جنگید؛ وقتی درهم از نفوذ یعقوب در میان عیاران ترسید و قصد کشتنش کرد، یعقوب بر او شورید، او را دستگیر کرد و خود در محرم سال ۲۴۷ هجری جای او را گرفت.", "en": "Ya'qub and his brothers (Amr, Zahir, Ali) were part of Sistan's ayyarun. He first fought alongside Salih ibn Nasr and then Dirham ibn Nasr (who each in turn gained the emirate of Sistan); when Dirham grew afraid of Ya'qub's influence among the ayyarun and plotted to kill him, Ya'qub rose against him, had him captured, and took his place himself in Muharram 247 AH.", "nl": "Ya'qub en zijn broers (Amr, Zahir, Ali) maakten deel uit van Sistans ayyarun. Hij vocht eerst aan de zijde van Salih ibn Nasr en daarna Dirham ibn Nasr (die beiden achtereenvolgens het emiraat van Sistan verwierven); toen Dirham bang werd voor Ya'qubs invloed onder de ayyarun en plannen smeedde om hem te doden, kwam Ya'qub tegen hem in opstand, liet hem gevangennemen en nam zelf zijn plaats in, in Muharram 247 AH."}, "sources": ["src:f407762ded"], "flags": []}, {"text": {"fa": "در روایتی که خودِ منبع آن را «بی‌پایه اما جالب» می‌خواند، گفته‌اند یعقوب در آغاز عیاری نقبی به خزانهٔ حاکم زد، تکه‌ای یافت که گمان کرد گوهر است، و چون دریافت نمک است — به رسم نمک‌خوارگی (وفاداری به کسی که نانش را خورده‌ای) — چیزی برنداشت و بیرون رفت؛ حاکم از این درستکاری خوشش آمد و او را به خدمت گرفت.", "en": "In an account the source itself calls \"baseless but interesting,\" it is said that early in his career as an ayyar, Ya'qub broke into the ruler's treasury, found something he thought was a jewel, and on discovering it was salt — honoring the code of \"namak-khwaragi\" (loyalty to one whose salt/bread one has eaten) — took nothing and left; the ruler, pleased by this honesty, took him into his service.", "nl": "In een verslag dat de bron zelf \"ongefundeerd maar interessant\" noemt, wordt verteld dat Ya'qub vroeg in zijn carrière als ayyar inbrak in de schatkamer van de heerser, iets vond dat hij voor een juweel hield, en toen hij ontdekte dat het zout was — trouw aan de code van \"namak-khwaragi\" (loyaliteit aan wie men het zout/brood heeft gegeten) — niets meenam en wegging; de heerser, aangenaam getroffen door deze eerlijkheid, nam hem in dienst."}, "sources": ["src:f407762ded"], "flags": ["unreplicated", "editor-note"], "note": {"fa": "این یک افسانهٔ بنیان‌گذاری کلاسیک است (شبیه الگوهای رایج در روایت خاستگاه قهرمانان)؛ منبع خودش صراحتاً می‌گوید اساس تاریخی ندارد. اینجا فقط به‌عنوان نمونه‌ای از فرهنگ «نمک‌خوارگی» و روایت‌سازی آورده شده، نه رویدادی مستند.", "en": "This is a classic founder-legend (similar to common patterns in origin stories of heroes); the source itself explicitly states it has no historical basis. It's included here only as an example of \"namak-khwaragi\" culture and legend-making, not as a documented event.", "nl": "Dit is een klassieke stichtersmythe (vergelijkbaar met gangbare patronen in oorsprongsverhalen van helden); de bron zelf stelt expliciet dat er geen historische basis voor is. Het wordt hier alleen opgenomen als voorbeeld van \"namak-khwaragi\"-cultuur en mythevorming, niet als gedocumenteerde gebeurtenis."}}], "links": [{"to": "tarikh:ayyarun-class", "rel": "explains", "note": {"fa": "یعقوب لیث مشهورترین نمونهٔ کسی‌ست که از طبقهٔ عیاران به قدرت رسید", "en": "Ya'qub al-Saffar is the most famous example of someone who rose from the ayyarun class to power", "nl": "Ya'qub al-Saffar is het bekendste voorbeeld van iemand die vanuit de ayyarun-klasse aan de macht kwam"}}, {"to": "tarikh:tahirid-origins", "rel": "contrasts", "note": {"fa": "طاهریان از راه خدمت در دستگاه خلافت بالا آمدند؛ صفاریان از راه شورش محلی علیه همان دستگاه", "en": "The Tahirids rose through service within the caliphal apparatus; the Saffarids rose through local revolt against that same apparatus", "nl": "De Tahiriden kwamen op door dienst binnen het kalifale apparaat; de Saffariden kwamen op door lokale opstand tegen datzelfde apparaat"}}, {"to": "soc:saffarid-pouriya-civic-networks", "rel": "see-also", "note": {"fa": "شبکه‌های مدنی روزگار صفاریان", "en": "Civic networks in the Saffarid era", "nl": "Burgerlijke netwerken in de Saffaridische tijd"}}], "people": [], "sources": ["src:f407762ded"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tarikh:iran-iraq-war", "kind": "concept", "title": {"fa": "جنگ ایران و عراق (۱۳۵۹–۱۳۶۷)", "en": "The Iran–Iraq War (1980–1988)", "nl": "The Iran–Iraq War (1980–1988)"}, "aliases": [], "parent": "tarikh:modern", "field": "tarikh:modern", "summary": {"fa": "عراق در ۳۱ شهریور ۱۳۵۹ به ایران حمله کرد. ایران تا خرداد ۱۳۶۱ خرمشهر را پس گرفت، اما جنگ شش سال دیگر با هدف سرنگونی صدام ادامه یافت و با پذیرش قطعنامهٔ ۵۹۸ در تیر ۱۳۶۷ بی هیچ تغییر مرزی پایان گرفت. صدها هزار نفر کشته شدند، عراق بارها سلاح شیمیایی به کار برد، و جنگ نهادهای امنیتی و نظامی تازه (به‌ویژه سپاه) را به ستون حکومت بدل کرد.", "en": "Iraq invaded Iran on 22 September 1980. Iran retook Khorramshahr by May 1982, yet the war went on six more years with the aim of toppling Saddam and ended with acceptance of UN Resolution 598 in July 1988, with no border change. Hundreds of thousands died, Iraq repeatedly used chemical weapons, and the war turned new security and military bodies (above all the Revolutionary Guards) into pillars of the state.", "nl": "Iraq invaded Iran on 22 September 1980. Iran retook Khorramshahr by May 1982, yet the war went on six more years with the aim of toppling Saddam and ended with acceptance of UN Resolution 598 in July 1988, with no border change. Hundreds of thousands died, Iraq repeatedly used chemical weapons, and the war turned new security and military bodies (above all the Revolutionary Guards) into pillars of the state."}, "points": [{"text": {"fa": "دو مرحله: رزو جنگ را به دفاع (تا ۱۳۶۱) و ادامهٔ جنگ در خاک عراق تقسیم می‌کند؛ تصمیم به ادامه پس از خرمشهر از بحث‌انگیزترین تصمیم‌های تاریخ معاصر ایران است.", "en": "Two phases: Razoux divides the war into defence (to 1982) and its continuation on Iraqi soil; the decision to fight on after Khorramshahr is among the most debated in modern Iranian history.", "nl": "Two phases: Razoux divides the war into defence (to 1982) and its continuation on Iraqi soil; the decision to fight on after Khorramshahr is among the most debated in modern Iranian history."}, "sources": ["src:cafe941639"], "flags": ["contested"]}, {"text": {"fa": "شمار کشته‌ها: برآوردها بسیار متفاوت است و رقم قطعی وجود ندارد؛ پژوهش‌های تازه‌تر عددهایی پایین‌تر از «یک میلیون» رایج می‌دهند. آنچه قطعی است ده‌ها هزار مصدوم شیمیایی و شهرهای ویران خوزستان است.", "en": "Death toll: estimates vary widely and there is no settled figure; newer studies give numbers below the commonly cited “one million”. What is certain is tens of thousands of chemical casualties and the ruined cities of Khuzestan.", "nl": "Death toll: estimates vary widely and there is no settled figure; newer studies give numbers below the commonly cited “one million”. What is certain is tens of thousands of chemical casualties and the ruined cities of Khuzestan."}, "sources": ["src:cafe941639"], "flags": ["contested"]}, {"text": {"fa": "اثر داخلی: جنگ سرکوب مخالفان را «ضرورت زمان جنگ» کرد، اقتصاد را جیره‌بندی و دولتی کرد، و نسلی از فرماندهان را ساخت که بعدها وارد سیاست و اقتصاد شدند.", "en": "Domestic effect: the war framed repression of opponents as wartime necessity, rationed and nationalised the economy, and produced a generation of commanders who later entered politics and business.", "nl": "Domestic effect: the war framed repression of opponents as wartime necessity, rationed and nationalised the economy, and produced a generation of commanders who later entered politics and business."}, "sources": ["src:36618cf31d"], "flags": []}], "links": [{"to": "tarikh:revolution-1979", "rel": "see-also", "note": {"fa": "پیشینه: انقلاب ۱۳۵۷", "en": "Background: the 1979 revolution", "nl": "Background: the 1979 revolution"}}, {"to": "tarikh:prison-massacre-1988", "rel": "see-also", "note": {"fa": "تابستان ۱۳۶۷", "en": "Summer 1988", "nl": "Summer 1988"}}], "people": [], "sources": ["src:cafe941639", "src:36618cf31d"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tarikh:iran-railway-not-built-1865-1910-concessions-and-veto", "kind": "concept", "title": {"fa": "راه‌آهنی که ساخته نشد (۱۸۶۵ تا ۱۹۱۰)", "en": "The railway that was not built (1865–1910)", "nl": "De spoorweg die er niet kwam (1865–1910)"}, "aliases": [], "parent": "tarikh:modern", "field": "tarikh:modern", "summary": {"fa": "نزدیک نیم قرن، امتیاز پشت امتیاز برای راه‌آهن ایران داده یا خواسته شد و جز یک خط کوتاه به حضرت عبدالعظیم چیزی ساخته نشد. محمود محمود در جلد پنجم تاریخش، با تکیه بر کرزن، دلیل را در سه چیز می‌بیند: نبود تضمین مالی، مخالفت داخلی با نوآوری، و بیش از همه وتوی روسیه در رقابت با بریتانیا.", "en": "For nearly half a century concession after concession for an Iranian railway was granted or sought, and nothing was built but one short line to Shah Abdolazim. In volume five of his history Mahmud Mahmud, drawing on Curzon, finds the reason in three things: no financial guarantee, domestic opposition to innovation, and above all Russia’s veto in its rivalry with Britain.", "nl": "For nearly half a century concession after concession for an Iranian railway was granted or sought, and nothing was built but one short line to Shah Abdolazim. In volume five of his history Mahmud Mahmud, drawing on Curzon, finds the reason in three things: no financial guarantee, domestic opposition to innovation, and above all Russia’s veto in its rivalry with Britain."}, "points": [{"text": {"fa": "صف امتیازخواهان: به روایت محمود، از دههٔ ۱۸۶۰ فرانسوی، آلمانی، اتریشی و انگلیسی در تهران در پی امتیاز راه‌آهن بودند. امتیاز رویتر (۱۸۷۲) راه‌آهن سرتاسری را همراه با بسیاری از منابع کشور می‌داد و سال بعد لغو شد. پس از آن امتیازهای رشت به تهران، طرح‌های روسی از جلفا، و چند طرح دیگر یکی پس از دیگری بی‌نتیجه ماند (فصل ۶۱).", "en": "A queue of concession-hunters: by Mahmud’s account, from the 1860s French, German, Austrian and British parties in Tehran sought a railway concession. The Reuter concession (1872) granted a trans-Iranian railway along with many of the country’s resources and was cancelled the next year. After it, concessions for Rasht–Tehran, Russian schemes from Julfa and several other projects came to nothing one after another (ch. 61).", "nl": "A queue of concession-hunters: by Mahmud’s account, from the 1860s French, German, Austrian and British parties in Tehran sought a railway concession. The Reuter concession (1872) granted a trans-Iranian railway along with many of the country’s resources and was cancelled the next year. After it, concessions for Rasht–Tehran, Russian schemes from Julfa and several other projects came to nothing one after another (ch. 61)."}, "sources": ["src:01959e0415"], "flags": []}, {"text": {"fa": "تنها خطی که ساخته شد: از میان همهٔ آن امتیازها فقط خط کوتاه تهران به حضرت عبدالعظیم به دست یک شرکت بلژیکی ساخته و در ۱۸۸۸ گشوده شد، و سپس واگن اسبی شهری تهران. خط محمودآباد به آمل هم که حاج محمدحسن امین‌الضرب ساخت مدتی کار کرد و از میان رفت؛ نویسنده می‌گوید خودش ریل‌های زنگ‌زده‌اش را در مازندران دیده است (فصل ۶۱).", "en": "The only line built: of all those concessions only the short Tehran–Shah Abdolazim line was built, by a Belgian company, and opened in 1888, followed by Tehran’s horse tramway. The Mahmudabad–Amol line built by Haj Mohammad-Hasan Amin al-Zarb worked for a while and was abandoned; the author says he saw its rusting rails in Mazandaran himself (ch. 61).", "nl": "The only line built: of all those concessions only the short Tehran–Shah Abdolazim line was built, by a Belgian company, and opened in 1888, followed by Tehran’s horse tramway. The Mahmudabad–Amol line built by Haj Mohammad-Hasan Amin al-Zarb worked for a while and was abandoned; the author says he saw its rusting rails in Mazandaran himself (ch. 61)."}, "sources": ["src:01959e0415"], "flags": []}, {"text": {"fa": "چرا نشد، از نگاه کرزن: محمود از لرد کرزن سه مانع نقل می‌کند. مخالفت بخشی از علما با هر نوآوری اروپایی؛ خودداری دولت ایران از تضمین سود سرمایه، که سرمایه‌گذار اروپایی را می‌ترساند؛ و مهم‌تر از همه مخالفت روسیه با هر خطی که به سود خودش نباشد (فصل ۶۱).", "en": "Why it failed, in Curzon’s view: Mahmud quotes three obstacles from Lord Curzon. Opposition from part of the clergy to any European innovation; the Iranian government’s refusal to guarantee a return on capital, which frightened European investors; and above all Russia’s opposition to any line that did not serve itself (ch. 61).", "nl": "Why it failed, in Curzon’s view: Mahmud quotes three obstacles from Lord Curzon. Opposition from part of the clergy to any European innovation; the Iranian government’s refusal to guarantee a return on capital, which frightened European investors; and above all Russia’s opposition to any line that did not serve itself (ch. 61)."}, "sources": ["src:01959e0415"], "flags": []}, {"text": {"fa": "وتوی ده‌ساله: پس از آنکه بریتانیا در ۱۸۸۸ امتیاز کشتی‌رانی کارون را گرفت، وزیر مختار روسیه با فشار از شاه سندی گرفت که تا پنج سال به هیچ‌کس امتیاز راه‌آهن ندهد. این تعهد سپس تمدید شد و به نوشتهٔ کتاب در ۱۹۱۰ پایان یافت. کرزن می‌نویسد روسیه به خود می‌بالید که راه‌آهن ایران را سال‌ها عقب انداخته است (فصل ۶۱).", "en": "A decade-long veto: after Britain obtained the Karun navigation concession in 1888, the Russian minister pressed the Shah into a written pledge to grant no railway concession to anyone for five years. The pledge was then extended and, by the book’s account, ended in 1910. Curzon writes that Russia prided itself on having delayed Iran’s railway for years (ch. 61).", "nl": "A decade-long veto: after Britain obtained the Karun navigation concession in 1888, the Russian minister pressed the Shah into a written pledge to grant no railway concession to anyone for five years. The pledge was then extended and, by the book’s account, ended in 1910. Curzon writes that Russia prided itself on having delayed Iran’s railway for years (ch. 61)."}, "sources": ["src:01959e0415"], "flags": []}, {"text": {"fa": "خوانش محمود: او یادآوری می‌کند که کرزن خود طرف دعواست. در آن سال‌ها بریتانیا می‌خواست پیش از روسیه امتیاز راه‌آهن را برای سرمایهٔ خودش بگیرد و روسیه را دشمن ترقی ایران جلوه می‌داد. نتیجه برای ایران یکی بود: رقابت دو همسایه زیرساختی را که کشور لازم داشت دهه‌ها معطل گذاشت (فصل ۶۱).", "en": "Mahmud’s reading: he reminds the reader that Curzon is a party to the quarrel. In those years Britain wanted to secure the railway concession for its own capital before Russia did, and portrayed Russia as the enemy of Iran’s progress. For Iran the result was the same: the rivalry of two neighbours kept infrastructure the country needed on hold for decades (ch. 61).", "nl": "Mahmud’s reading: he reminds the reader that Curzon is a party to the quarrel. In those years Britain wanted to secure the railway concession for its own capital before Russia did, and portrayed Russia as the enemy of Iran’s progress. For Iran the result was the same: the rivalry of two neighbours kept infrastructure the country needed on hold for decades (ch. 61)."}, "sources": ["src:01959e0415"], "flags": []}, {"text": {"fa": "درس امروزی: زیرساخت بزرگ سه چیز می‌خواهد که ایران قاجار هیچ‌کدام را نداشت. پول یا اعتبار برای تضمین، توان چانه‌زنی در برابر قدرت‌های بیرونی، و دولتی که امتیاز را به سود کشور بنویسد نه به سود دربار. هر سه امروز هم معیار سنجش قراردادهای بزرگ‌اند. این برداشت ویراستار است.", "en": "Today’s lesson: large infrastructure needs three things Qajar Iran lacked. Money or credit to back a guarantee, bargaining power against outside powers, and a state that writes concessions for the country’s benefit rather than the court’s. All three remain tests for large contracts today. This is the editor’s reading.", "nl": "Today’s lesson: large infrastructure needs three things Qajar Iran lacked. Money or credit to back a guarantee, bargaining power against outside powers, and a state that writes concessions for the country’s benefit rather than the court’s. All three remain tests for large contracts today. This is the editor’s reading."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "حدّ این مدخل: فایل اسکن است و با نویسه‌خوانی خودکار خوانده شد؛ برای همین مبلغ‌ها و بیشتر نام‌های خارجی نیامده‌اند. بخش بزرگ فصل نقل از کرزن است. از ۴۶۴ صفحهٔ جلد پنجم، فهرست مطالب و حدود ده صفحهٔ نخست فصل ۶۱ خوانده شد.", "en": "Limits: the file is a scan read by OCR, so sums and most foreign names are omitted. Much of the chapter is quotation from Curzon. Of the 464 pages of volume five, the contents and about the first ten pages of chapter 61 were read.", "nl": "Limits: the file is a scan read by OCR, so sums and most foreign names are omitted. Much of the chapter is quotation from Curzon. Of the 464 pages of volume five, the contents and about the first ten pages of chapter 61 were read."}, "sources": [], "flags": ["editor-note"]}], "links": [{"to": "tarikh:telegraph-line-iran-1860s-wire-to-india", "rel": "see-also", "note": {"fa": "تلگراف و راه هند", "en": "The telegraph and the road to India", "nl": "The telegraph and the road to India"}}, {"to": "tarikh:anglo-russian-convention-1907-iran-not-told", "rel": "see-also", "note": {"fa": "قرارداد ۱۹۰۷", "en": "The 1907 convention", "nl": "The 1907 convention"}}, {"to": "soc:darcy-concession-anglo-persian-oil", "rel": "see-also", "note": {"fa": "امتیاز دارسی", "en": "The D’Arcy concession", "nl": "The D’Arcy concession"}}, {"to": "tarikh:iran-between-powers-1800-1828-mahmud", "rel": "see-also", "note": {"fa": "ایران میان قدرت‌ها", "en": "Iran between the powers", "nl": "Iran between the powers"}}, {"to": "soc:oil-fed-urbanisation-iran", "rel": "see-also", "note": {"fa": "شهرنشینی نفتی", "en": "Oil-fed urbanisation", "nl": "Oil-fed urbanisation"}}], "people": [], "sources": ["src:01959e0415"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tarikh:arab-conquest-iran", "kind": "concept", "title": {"fa": "فتح عربی ایران: واقعهٔ جسر و پیامدش", "en": "The Arab conquest of Iran: the Battle of the Bridge and its aftermath", "nl": "De Arabische verovering van Iran: de Slag om de Brug en de nasleep"}, "aliases": ["واقعهٔ جسر", "جنگ پل", "فتح ایران"], "parent": "tarikh:early-islamic", "field": "tarikh:early-islamic", "summary": {"fa": "اولین شکست بزرگ عرب‌های مسلمان در عراق از سپاه ساسانی (حدود ۱۳ هجری/۶۳۴ م)، در نبردی کنار یک پل بر فرات. شکست چنان شرم‌آور بود که فراریان در مدینه ماه‌ها از شرم خانه‌نشین شدند؛ عمر برای مدتی نام «عراق» را به زبان نمی‌آورد. این شکست موقتی بود، نه پایان ماجرا.", "en": "The first major defeat of Muslim Arab forces in Iraq at Sasanian hands (c. 13 AH/634 CE), in a battle beside a bridge on the Euphrates. The defeat was so shameful that the fleeing survivors shut themselves in their homes in Medina for months; Caliph Umar avoided even saying the word \"Iraq\" for nearly a year. It was a temporary setback, not the end of the story.", "nl": "De eerste grote nederlaag van moslim-Arabische troepen in Irak tegen de Sassaniden (ca. 13 AH/634 CE), in een slag bij een brug over de Eufraat. De nederlaag was zo beschamend dat de vluchtende overlevenden zich maandenlang thuis opsloten in Medina; kalief Omar vermeed bijna een jaar lang zelfs het woord \"Irak\" te noemen. Het was een tijdelijke terugslag, geen einde van het verhaal."}, "points": [{"text": {"fa": "در واقعهٔ جسر، سپاه عرب به فرماندهی ابوعبید ثقفی از سپاه ساسانی به فرماندهی بهمن جادویه کنار پلی بر فرات شکست خورد؛ به‌روایت سیف بن عمر این نبرد در شعبان سال ۱۳ هجری روی داد، هرچند خود این تاریخ قطعی نیست — برخی آن را آخر رمضان همان سال، و ابن اسحاق آن را سال ۱۴ هجری نوشته‌اند.", "en": "At the Battle of the Bridge, the Arab force under Abu Ubayd al-Thaqafi was defeated by the Sasanian force under Bahman Jadhuyeh beside a bridge on the Euphrates; per Sayf ibn Umar's account the battle took place in Sha'ban 13 AH, though even this date is disputed — some place it at the end of Ramadan of the same year, and Ibn Ishaq dates it to 14 AH.", "nl": "In de Slag om de Brug werd de Arabische troepenmacht onder Abu Ubayd al-Thaqafi verslagen door de Sassanidische troepenmacht onder Bahman Jadhuyeh bij een brug over de Eufraat; volgens Sayf ibn Umar vond de slag plaats in Sha'ban 13 AH, al is zelfs deze datum omstreden — sommigen plaatsen het aan het einde van Ramadan van hetzelfde jaar, en Ibn Ishaq dateert het op 14 AH."}, "sources": ["src:c4abd0c6f3"], "flags": ["contested", "dated"]}, {"text": {"fa": "شکست آن‌قدر شرم‌آور بود که فراریان به مدینه چون شرمسار از شرم روی نهان می‌کردند، در خانه گریه می‌کردند و خود را به‌خاطر پشت‌کردن به دشمن گناهکار می‌دانستند؛ گفته شده عمر تا نزدیک یک سال نام «عراق» را بر زبان نمی‌آورد.", "en": "The defeat was so shameful that the fleeing survivors who reached Medina hid their faces in shame, wept at home, and considered themselves guilty for having turned their backs on the enemy; it is said Caliph Umar avoided even saying the word \"Iraq\" for nearly a year afterward.", "nl": "De nederlaag was zo beschamend dat de vluchtelingen die Medina bereikten hun gezicht verborgen van schaamte, thuis huilden en zichzelf schuldig voelden omdat ze de vijand de rug hadden toegekeerd; er wordt gezegd dat kalief Omar bijna een jaar lang zelfs het woord \"Irak\" vermeed."}, "sources": ["src:c4abd0c6f3"], "flags": ["editor-note"], "note": {"fa": "این جزئیات روایی (شرم، گریه) از سنت تاریخ‌نگاری اسلامی سده‌های بعد می‌آید، نه سندی هم‌زمان با واقعه؛ به‌عنوان شاهدی از چگونگی روایت‌شدنِ این شکست در حافظهٔ تاریخی بخوانید، نه گزارشی صددرصد مستند.", "en": "These narrative details (shame, weeping) come from the later Islamic historiographic tradition, not a document contemporary with the event; read them as evidence of how this defeat was remembered and narrated, not as a fully documented report.", "nl": "Deze narratieve details (schaamte, huilen) komen uit de latere islamitische historiografische traditie, niet uit een document uit de tijd van de gebeurtenis zelf; lees ze als bewijs van hoe deze nederlaag werd herinnerd en verteld, niet als een volledig gedocumenteerd verslag."}}, {"text": {"fa": "عمر برای جبران شکست، طایفهٔ بَجیله را به فرماندهی جریر بن عبدالله بجلی با وعدهٔ ربع یا ثلث غنایم به عراق فرستاد؛ چندماه بعد در محلی به نام بویب (نهری از فرات) سپاه عرب دوباره با سپاه ایران به فرماندهی مهران بن مهربنداد روبه‌رو شد — این‌بار همراه با چند زنجیر فیل، که دیگر اعراب را مثل جسر نترساند.", "en": "To redress the defeat, Umar sent the Bajila tribe under Jarir ibn Abdullah al-Bajali to Iraq with a promise of a quarter or third of the spoils; months later at a place called Buwayb (a canal off the Euphrates), the Arab force again faced the Persian army under Mihran ibn Mihrbandad — this time with war elephants, which no longer frightened the Arabs as they had at the Bridge.", "nl": "Om de nederlaag te herstellen, stuurde Omar de Bajila-stam onder Jarir ibn Abdullah al-Bajali naar Irak met de belofte van een kwart of derde van de buit; maanden later op een plaats genaamd Buwayb (een kanaal van de Eufraat) stond de Arabische troepenmacht opnieuw tegenover het Perzische leger onder Mihran ibn Mihrbandad — deze keer met oorlogsolifanten, die de Arabieren niet meer schrik aanjoegen zoals bij de Brug."}, "sources": ["src:c4abd0c6f3"], "flags": []}], "links": [{"to": "soc:jasemi-arab-conquest-iran-resistance-narrative", "rel": "see-also", "note": {"fa": "روایت جدلی همین رویداد، برای مقایسه", "en": "A polemical account of the same events, for comparison", "nl": "Een polemisch relaas van dezelfde gebeurtenissen, ter vergelijking"}}, {"to": "soc:early-islam-sources-casualty-claims", "rel": "see-also", "note": {"fa": "چگونه عددهای منابع کهن را بخوانیم", "en": "How to read the numbers in the early sources", "nl": "Hoe de getallen in de vroege bronnen te lezen"}}, {"to": "soc:sasanian-state-administration", "rel": "see-also", "note": {"fa": "دولتی که در این جنگ‌ها فروپاشید", "en": "The state that collapsed in these wars", "nl": "De staat die in deze oorlogen instortte"}}], "people": [], "sources": ["src:c4abd0c6f3"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tarikh:persian-marxist-print-1953-1979-bibliography-map", "kind": "concept", "title": {"fa": "قفسهٔ چپ ایران، ۱۳۳۲ تا ۱۳۵۸: نقشهٔ یک کتاب‌شناسی", "en": "Iran’s left bookshelf, 1953–1979: the map in a bibliography", "nl": "De linkse boekenkast van Iran, 1953–1979"}, "aliases": [], "parent": "tarikh:modern", "field": "tarikh:modern", "summary": {"fa": "در تیر ۱۳۵۹ کتاب‌شناسی‌ای چاپ شد که می‌خواست همهٔ نوشته‌های مارکسیستی فارسیِ منتشرشده در ایران از کودتا تا پایان ۱۳۵۸ را فهرست کند. خود فهرست، با سرفصل‌ها و حذف‌هایش، تصویری از جهان فکری چپ ایران در آستانه و فردای انقلاب است.", "en": "In July 1980 a bibliography appeared that set out to list every Marxist writing in Persian published in Iran from the 1953 coup to the end of 1979. The list itself, through its headings and its omissions, is a picture of the Iranian left’s intellectual world on the eve and the morrow of the revolution.", "nl": "In July 1980 a bibliography appeared that set out to list every Marxist writing in Persian published in Iran from the 1953 coup to the end of 1979. The list itself, through its headings and its omissions, is a picture of the Iranian left’s intellectual world on the eve and the morrow of the revolution."}, "points": [{"text": {"fa": "چه چیزی را می‌شمارد: گردآورنده می‌گوید مشخصات بررسی‌ها و تحلیل‌های مارکسیستی را ثبت کرده که به فارسی، به شکل مقاله، جزوه و کتاب، از ۲۸ مرداد ۱۳۳۲ تا اول دی ۱۳۵۸ در ایران منتشر شده‌اند، و کوشیده همهٔ گرایش‌های مارکسیستی را بیاورد. فهرست مطالب تا نزدیک سه هزار ردیف شماره خورده است (پیش‌گفتار، ص ۱۳ فایل؛ فهرست، ص ۵ تا ۱۲).", "en": "What it counts: the compiler says he recorded Marxist studies and analyses published in Persian inside Iran, as articles, pamphlets and books, from 19 August 1953 to 22 December 1979, and tried to include every Marxist tendency. The table of contents numbers close to three thousand items (preface, file p. 13; contents, pp. 5–12).", "nl": "What it counts: the compiler says he recorded Marxist studies and analyses published in Persian inside Iran, as articles, pamphlets and books, from 19 August 1953 to 22 December 1979, and tried to include every Marxist tendency. The table of contents numbers close to three thousand items (preface, file p. 13; contents, pp. 5–12)."}, "sources": ["src:d9d98341f3"], "flags": []}, {"text": {"fa": "چه چیزی را کنار می‌گذارد: خود کتاب می‌گوید نوشته‌های «ضد کمونیست (مذهبی و بورژوا و غیره)» را نیاورده است. چهار دسته هم بیرون مانده: چاپ‌های خارج که به ایران نرسیده، نوشته‌های درون‌سازمانی، چاپ‌های شهرستانی که به تهران نرسیده، و آنچه بسیار کم‌شمار چاپ شده. بیرون از این چهار دسته، گردآورنده ادعا می‌کند تقریباً همه را ضبط کرده است (ص ۱۳ و ۱۴ فایل).", "en": "What it leaves out: the book itself says it omitted the writings of “anti-communists (religious, bourgeois and so on)”. Four further groups are excluded: prints from abroad that had not reached Iran, internal organisational papers, provincial prints that had not reached Tehran, and anything printed in very small numbers. Outside these four the compiler claims to have captured nearly everything (file pp. 13–14).", "nl": "What it leaves out: the book itself says it omitted the writings of “anti-communists (religious, bourgeois and so on)”. Four further groups are excluded: prints from abroad that had not reached Iran, internal organisational papers, provincial prints that had not reached Tehran, and anything printed in very small numbers. Outside these four the compiler claims to have captured nearly everything (file pp. 13–14)."}, "sources": ["src:d9d98341f3"], "flags": []}, {"text": {"fa": "نقشهٔ دغدغه‌ها: هفت بخش دارد. سه بخش نخست به آثار و زندگی مارکس، انگلس، لنین، استالین، تروتسکی، مائو و چه‌گوارا می‌رسد. بخش «مسائل و موضوعات» چهل‌ودو سرفصل دارد، از امپریالیسم و جنگ چریکی تا مسئلهٔ زنان، دین، روان‌شناسی و «نقد جامعه‌شناسی بورژوایی». بخش ایران سرفصل‌های جدا برای جنبش چریکی، سازمان‌ها، و پس از انقلاب برای آذربایجان، بلوچ، ترکمن، عرب و کرد دارد (فهرست، ص ۴ تا ۱۲ فایل).", "en": "A map of preoccupations: there are seven parts. The first three cover the works and lives of Marx, Engels, Lenin, Stalin, Trotsky, Mao and Che Guevara. The “issues and topics” part has forty-two headings, from imperialism and guerrilla war to the woman question, religion, psychology and a “critique of bourgeois sociology”. The Iran part has separate headings for the guerrilla movement, the organisations, and after the revolution for Azerbaijan, the Baluch, Turkmen, Arabs and Kurds (contents, file pp. 4–12).", "nl": "A map of preoccupations: there are seven parts. The first three cover the works and lives of Marx, Engels, Lenin, Stalin, Trotsky, Mao and Che Guevara. The “issues and topics” part has forty-two headings, from imperialism and guerrilla war to the woman question, religion, psychology and a “critique of bourgeois sociology”. The Iran part has separate headings for the guerrilla movement, the organisations, and after the revolution for Azerbaijan, the Baluch, Turkmen, Arabs and Kurds (contents, file pp. 4–12)."}, "sources": ["src:d9d98341f3"], "flags": []}, {"text": {"fa": "چه می‌آموزد: این کتاب خودِ جهانِ فکری را نشان می‌دهد که در آن یک نسل می‌خواند. فهرست، موضوع به موضوع، پاسخ آماده دارد و صدای مخالف را از آغاز بیرون گذاشته است. کسی که فقط از چنین قفسه‌ای بخواند، دربارهٔ هر پرسشی نظر دارد اما هرگز استدلال طرف مقابل را ندیده است. همین خطر برای هر جریان فکری دیگر هم هست. این برداشت ویراستار است.", "en": "What it teaches: the book shows the intellectual world a generation was reading inside. Topic by topic the list has a ready answer, and the opposing voice is left out from the start. Someone who reads only from such a shelf has a view on every question yet has never seen the other side’s argument. The same danger holds for any other current of thought. This is the editor’s reading.", "nl": "What it teaches: the book shows the intellectual world a generation was reading inside. Topic by topic the list has a ready answer, and the opposing voice is left out from the start. Someone who reads only from such a shelf has a view on every question yet has never seen the other side’s argument. The same danger holds for any other current of thought. This is the editor’s reading."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "حدّ این مدخل: این یک کتاب‌شناسی است، نه تحلیل؛ از آن فقط می‌شود فهمید چه چاپ شده، نه اینکه چه خوانده شده یا چه اثری داشته است. گردآورنده خود با این جریان همدل است. فایل اسکن است؛ پیش‌گفتار، فهرست مطالب و چند صفحهٔ نمونه خوانده شد و شمار ردیف‌ها از روی فهرست تخمین زده شده، نه شمارش.", "en": "Limits: this is a bibliography, not an analysis; it shows what was printed, not what was read or what effect it had. The compiler is himself sympathetic to the current. The file is a scan; the preface, the contents and a few sample pages were read, and the number of items is estimated from the contents, not counted.", "nl": "Limits: this is a bibliography, not an analysis; it shows what was printed, not what was read or what effect it had. The compiler is himself sympathetic to the current. The file is a scan; the preface, the contents and a few sample pages were read, and the number of items is estimated from the contents, not counted."}, "sources": [], "flags": ["editor-note"]}], "links": [{"to": "soc:iran-1979-causes-and-left-readings", "rel": "see-also", "note": {"fa": "خوانش‌های چپ از ۱۳۵۷", "en": "Left readings of 1979", "nl": "Left readings of 1979"}}, {"to": "soc:left-intellectuals-ideology-thesis-iran", "rel": "see-also", "note": {"fa": "روشنفکران چپ و ایدئولوژی", "en": "Left intellectuals and ideology", "nl": "Left intellectuals and ideology"}}, {"to": "soc:left-as-secular-religion-thesis", "rel": "see-also", "note": {"fa": "چپ به‌مثابه دین سکولار", "en": "The left as secular religion", "nl": "The left as secular religion"}}, {"to": "soc:preference-falsification", "rel": "see-also", "note": {"fa": "پنهان‌کاری ترجیح", "en": "Preference falsification", "nl": "Preference falsification"}}, {"to": "soc:abadan-labour-segregation-tudeh", "rel": "see-also", "note": {"fa": "آبادان و حزب توده", "en": "Abadan and the Tudeh", "nl": "Abadan and the Tudeh"}}], "people": [], "sources": ["src:d9d98341f3"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tarikh:neighbours", "kind": "field", "title": {"fa": "ایران و همسایگان", "en": "Iran and its neighbours", "nl": "Iran en zijn buren"}, "aliases": [], "parent": "tarikh:tarikh", "field": null, "summary": {"fa": "مردمان و سرزمین‌هایی که تاریخشان با ایران گره خورده است: ارمنستان، قفقاز، میان‌رودان، آسیای میانه و شبه‌قاره.", "en": "Peoples and lands whose history is entwined with Iran’s: Armenia, the Caucasus, Mesopotamia, Central Asia and the subcontinent.", "nl": "Peoples and lands whose history is entwined with Iran’s: Armenia, the Caucasus, Mesopotamia, Central Asia and the subcontinent."}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tarikh:oil-nationalisation-1953-coup", "kind": "concept", "title": {"fa": "ملی‌شدن نفت و کودتای ۲۸ مرداد ۱۳۳۲", "en": "Oil nationalisation and the 1953 coup", "nl": "Oil nationalisation and the 1953 coup"}, "aliases": [], "parent": "tarikh:modern", "field": "tarikh:modern", "summary": {"fa": "مجلس در اسفند ۱۳۲۹ صنعت نفت را ملی کرد و محمد مصدق نخست‌وزیر شد. بریتانیا نفت ایران را تحریم کرد و اقتصاد زیر فشار رفت. در مرداد ۱۳۳۲ کودتایی با طراحی سازمان‌های اطلاعاتی آمریکا و بریتانیا و همراهی بخشی از ارتش، دربار و نیروهای داخلی دولت مصدق را برانداخت و شاه را برگرداند. بیست و پنج سال حکومت فردی پس از آن، و خاطرهٔ این دخالت، سیاست ایران را تا امروز شکل داده است.", "en": "In March 1951 the Majles nationalised the oil industry and Mohammad Mosaddeq became prime minister. Britain embargoed Iranian oil and the economy came under strain. In August 1953 a coup planned by US and British intelligence, with part of the army, the court and domestic forces, toppled Mosaddeq and restored the Shah. The twenty-five years of personal rule that followed, and the memory of that intervention, have shaped Iranian politics to this day.", "nl": "In March 1951 the Majles nationalised the oil industry and Mohammad Mosaddeq became prime minister. Britain embargoed Iranian oil and the economy came under strain. In August 1953 a coup planned by US and British intelligence, with part of the army, the court and domestic forces, toppled Mosaddeq and restored the Shah. The twenty-five years of personal rule that followed, and the memory of that intervention, have shaped Iranian politics to this day."}, "points": [{"text": {"fa": "نقش خارجی و داخلی: پژوهش‌های گردآمده در کتاب گازیوروسکی و برن بر پایهٔ اسناد نشان می‌دهد طرح کودتا خارجی بود، اما بدون شکاف در جبههٔ ملی، دوری بخشی از روحانیت و بازار از مصدق، و افسران هوادار شاه پیش نمی‌رفت.", "en": "Foreign and domestic roles: the studies collected by Gasiorowski and Byrne show from documents that the coup plan was foreign, yet it could not have worked without the split in the National Front, the drift of part of the clergy and bazaar away from Mosaddeq, and pro-Shah officers.", "nl": "Foreign and domestic roles: the studies collected by Gasiorowski and Byrne show from documents that the coup plan was foreign, yet it could not have worked without the split in the National Front, the drift of part of the clergy and bazaar away from Mosaddeq, and pro-Shah officers."}, "sources": ["src:1594f979d0"], "flags": []}, {"text": {"fa": "اختلاف تفسیر: برخی مورخان وزن بیشتری به ضعف‌های دولت مصدق (انحلال مجلس با همه‌پرسی، بن‌بست مذاکرهٔ نفت) می‌دهند و برخی به دخالت خارجی. اسناد هر دو را تأیید می‌کند؛ اختلاف بر سر وزن است.", "en": "Disputed readings: some historians give more weight to the weaknesses of Mosaddeq’s government (dissolving parliament by referendum, the oil negotiation deadlock), others to foreign intervention. The documents support both; the dispute is over weight.", "nl": "Disputed readings: some historians give more weight to the weaknesses of Mosaddeq’s government (dissolving parliament by referendum, the oil negotiation deadlock), others to foreign intervention. The documents support both; the dispute is over weight."}, "sources": ["src:1594f979d0", "src:36618cf31d"], "flags": ["contested"]}, {"text": {"fa": "پیامد بلندمدت: بسته‌شدن راه حزب و مجلس مستقل، مخالفان را به مسجد و زیرزمین راند؛ آبراهامیان این را از زمینه‌های شکل انقلاب ۱۳۵۷ می‌داند.", "en": "Long-run effect: closing the path of independent parties and parliament pushed the opposition into mosques and underground; Abrahamian counts this among the roots of the shape the 1979 revolution took.", "nl": "Long-run effect: closing the path of independent parties and parliament pushed the opposition into mosques and underground; Abrahamian counts this among the roots of the shape the 1979 revolution took."}, "sources": ["src:36618cf31d"], "flags": []}], "links": [{"to": "tarikh:constitutional-revolution-1906", "rel": "see-also", "note": {"fa": "پیشینه: مشروطه", "en": "Background: the Constitutional Revolution", "nl": "Background: the Constitutional Revolution"}}, {"to": "tarikh:revolution-1979", "rel": "see-also", "note": {"fa": "پیامد: انقلاب ۱۳۵۷", "en": "Consequence: the 1979 revolution", "nl": "Consequence: the 1979 revolution"}}, {"to": "soc:oil-nationalization-political-critique", "rel": "see-also", "note": {"fa": "نقد سیاسی ملی‌شدن نفت", "en": "A political critique of nationalisation", "nl": "A political critique of nationalisation"}}], "people": [], "sources": ["src:1594f979d0", "src:36618cf31d"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tarikh:modern", "kind": "field", "title": {"fa": "ایران معاصر: از مشروطه تا امروز", "en": "Modern Iran: from the Constitutional Revolution to today", "nl": "Modern Iran: van de Constitutionele Revolutie tot nu"}, "aliases": [], "parent": "tarikh:tarikh", "field": null, "summary": {"fa": "صد و بیست سال کشاکش بر سر یک پرسش: قدرت را چگونه می‌شود به قانون و رأی مردم بست؟ از مشروطه (۱۲۸۵) و ملی‌شدن نفت تا انقلاب ۱۳۵۷، جنگ هشت‌ساله و موج‌های اعتراض ۱۳۸۸، ۱۳۹۸ و ۱۴۰۱.", "en": "A hundred and twenty years of struggle over one question: how can power be bound to law and the popular vote? From the Constitutional Revolution (1906) and oil nationalisation to the 1979 revolution, the eight-year war and the protest waves of 2009, 2019 and 2022.", "nl": "A hundred and twenty years of struggle over one question: how can power be bound to law and the popular vote? From the Constitutional Revolution (1906) and oil nationalisation to the 1979 revolution, the eight-year war and the protest waves of 2009, 2019 and 2022."}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tarikh:early-islamic", "kind": "field", "title": {"fa": "ایران در سده‌های نخست اسلامی", "en": "Iran in the early Islamic centuries", "nl": "Iran in de vroege islamitische eeuwen"}, "aliases": [], "parent": "tarikh:tarikh", "field": null, "summary": {"fa": "از فروپاشی ساسانیان (سدهٔ ۷ م) تا سر برآوردن نخستین حکومت‌های نیمه‌مستقل و مستقل ایرانی — طاهریان و صفاریان (سدهٔ ۹ م): فتح عربی، نقش ایرانیان در تحولات سیاسی خلافت، عصر طلایی عباسی، خانواده‌های ایرانی‌تباری که در خدمت خلافت قدرت یافتند، و طبقهٔ عیاران که از دل شورش محلی فرمانروا ساخت.", "en": "From the fall of the Sasanians (7th c. CE) to the rise of the first semi-independent and fully independent Persian dynasties — the Tahirids and Saffarids (9th c. CE): the Arab conquest, Iranians' role in the caliphate's political upheavals, the Abbasid golden age, the Persian-descended families who gained power in the caliphate's service, and the ayyarun class that turned local revolt into a ruling dynasty.", "nl": "Van de val van de Sassaniden (7e eeuw) tot de opkomst van de eerste semi-onafhankelijke en volledig onafhankelijke Perzische dynastieën — de Tahiriden en Saffariden (9e eeuw): de Arabische verovering, de rol van Iraniërs in de politieke omwentelingen van het kalifaat, het Abbasidische gouden tijdperk, de Perzisch afkomstige families die macht verwierven in dienst van het kalifaat, en de ayyarun-klasse die lokale opstand omzette in een heersende dynastie."}, "points": [], "links": [{"to": "soc:early-islamic-iran-continuity-debate", "rel": "see-also", "note": {"fa": "بحث «دو قرن سکوت»: گسست یا پیوستگی", "en": "The two centuries of silence debate: rupture or continuity", "nl": "Het debat over twee eeuwen stilte: breuk of continuïteit"}}, {"to": "tarikh:sources-early-islamic-iran-zarrinkoub", "rel": "see-also", "note": {"fa": "مدخل هم‌موضوع", "en": "Related entry", "nl": "Verwant lemma"}}], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tarikh:herat-war-1856-treaty-of-paris-1857", "kind": "concept", "title": {"fa": "جنگ هرات و عهدنامهٔ پاریس (۱۸۵۶ تا ۱۸۵۷)", "en": "The Herat war and the Treaty of Paris (1856–1857)", "nl": "De oorlog om Herat en het Verdrag van Parijs (1856–1857)"}, "aliases": [], "parent": "tarikh:modern", "field": "tarikh:modern", "summary": {"fa": "در ۱۸۵۶ ایران هرات را گرفت و بریتانیا، که هرات را دروازهٔ هند می‌دانست، از راه خلیج فارس به ایران حمله کرد. جنگ کوتاه بود و با عهدنامهٔ پاریس پایان یافت: ایران برای همیشه از ادعا بر هرات و افغانستان گذشت. محمود محمود در جلد دوم تاریخش متن قراردادها را می‌آورد و آن را حلقه‌ای از رقابت روس و انگلیس می‌خواند.", "en": "In 1856 Iran took Herat, and Britain, which saw Herat as the gate of India, attacked Iran by way of the Persian Gulf. The war was short and ended with the Treaty of Paris: Iran gave up for good its claim to Herat and Afghanistan. In volume two of his history Mahmud Mahmud gives the texts of the agreements and reads the episode as one link in Anglo-Russian rivalry.", "nl": "In 1856 Iran took Herat, and Britain, which saw Herat as the gate of India, attacked Iran by way of the Persian Gulf. The war was short and ended with the Treaty of Paris: Iran gave up for good its claim to Herat and Afghanistan. In volume two of his history Mahmud Mahmud gives the texts of the agreements and reads the episode as one link in Anglo-Russian rivalry."}, "points": [{"text": {"fa": "زمینه: به روایت محمود، در جنگ کریمه ایران میان دو قدرت مردد ماند. در ۱۸۵۴ با روسیه عهدنامه‌ای سری بست و هم‌زمان صدراعظم، میرزا آقاخان نوری، به بریتانیا پیشنهاد اتحاد داد که پاسخ سرد گرفت. پس از شکست روسیه در کریمه، بریتانیا دست بازتری در آسیا داشت و وزیر مختاری تندخو به تهران فرستاد (فصل ۳۱ و ۳۲).", "en": "Background: by Mahmud’s account Iran wavered between two powers during the Crimean War. In 1854 it signed a secret treaty with Russia while the chief minister, Mirza Aqa Khan Nuri, offered Britain an alliance that met a cold reply. After Russia’s defeat in the Crimea Britain had a freer hand in Asia and sent a harsher envoy to Tehran (chs. 31–32).", "nl": "Background: by Mahmud’s account Iran wavered between two powers during the Crimean War. In 1854 it signed a secret treaty with Russia while the chief minister, Mirza Aqa Khan Nuri, offered Britain an alliance that met a cold reply. After Russia’s defeat in the Crimea Britain had a freer hand in Asia and sent a harsher envoy to Tehran (chs. 31–32)."}, "sources": ["src:056d58919a"], "flags": []}, {"text": {"fa": "محاصرهٔ دیپلماتیک: بریتانیا در ۱۸۵۵ با امیر کابل، دوست‌محمدخان، پیمان دوستی بست و سپس به او پول و تفنگ داد. محمود متن این قراردادها را می‌آورد و نتیجه می‌گیرد که قطع رابطه با ایران از پیش آماده شده بود. سیاست‌مداران انگلیسی آن روز هرات را «دروازهٔ هندوستان» می‌دانستند (فصل ۳۲).", "en": "Diplomatic encirclement: in 1855 Britain concluded a treaty of friendship with the Amir of Kabul, Dost Mohammad Khan, and then supplied him with money and muskets. Mahmud reproduces these agreements and concludes that the break with Iran had been prepared in advance. British statesmen of the day regarded Herat as “the gate of India” (ch. 32).", "nl": "Diplomatic encirclement: in 1855 Britain concluded a treaty of friendship with the Amir of Kabul, Dost Mohammad Khan, and then supplied him with money and muskets. Mahmud reproduces these agreements and concludes that the break with Iran had been prepared in advance. British statesmen of the day regarded Herat as “the gate of India” (ch. 32)."}, "sources": ["src:056d58919a"], "flags": []}, {"text": {"fa": "جنگ: ایران هرات را گرفت. بریتانیا در اول نوامبر ۱۸۵۶ اعلان جنگ داد، جزیرهٔ خارک و سپس بوشهر را گرفت و جنگ تا محمره (خرمشهر) کشیده شد. هدف، به نوشتهٔ محمود، ترساندن شاه بود تا از هرات و افغانستان دست بکشد (فصل ۳۲).", "en": "The war: Iran took Herat. Britain declared war on 1 November 1856, seized Kharg island and then Bushehr, and the fighting reached Mohammerah (Khorramshahr). The aim, Mahmud writes, was to frighten the Shah into giving up Herat and Afghanistan (ch. 32).", "nl": "The war: Iran took Herat. Britain declared war on 1 November 1856, seized Kharg island and then Bushehr, and the fighting reached Mohammerah (Khorramshahr). The aim, Mahmud writes, was to frighten the Shah into giving up Herat and Afghanistan (ch. 32)."}, "sources": ["src:056d58919a"], "flags": []}, {"text": {"fa": "عهدنامهٔ پاریس، ۴ مارس ۱۸۵۷: ایران پذیرفت هرات و افغانستان را تخلیه کند، از هر ادعای حاکمیت بر آنها بگذرد و در کارشان دخالت نکند، و در اختلاف‌های آینده میانجی‌گری بریتانیا را بپذیرد. در برابر، نیروهای بریتانیا خاک ایران را ترک کردند. فصل‌های دیگر به اسیران، عفو عمومی، حقوق کنسولی و بازرگانی و تجدید قرارداد منع تجارت برده در خلیج فارس می‌پردازد. شرط‌های نخستین بریتانیا در استانبول سنگین‌تر بود، از جمله برکناری صدراعظم، و ایران آنها را نپذیرفته بود (فصل ۳۲).", "en": "The Treaty of Paris, 4 March 1857: Iran agreed to evacuate Herat and Afghanistan, renounce all claims of sovereignty over them and not interfere in their affairs, and to accept British mediation in future disputes. In return British forces left Iranian soil. Other articles deal with prisoners, an amnesty, consular and commercial rights, and renewal of the agreement against the slave trade in the Persian Gulf. Britain’s first terms at Istanbul had been heavier, including dismissal of the chief minister, and Iran had refused them (ch. 32).", "nl": "The Treaty of Paris, 4 March 1857: Iran agreed to evacuate Herat and Afghanistan, renounce all claims of sovereignty over them and not interfere in their affairs, and to accept British mediation in future disputes. In return British forces left Iranian soil. Other articles deal with prisoners, an amnesty, consular and commercial rights, and renewal of the agreement against the slave trade in the Persian Gulf. Britain’s first terms at Istanbul had been heavier, including dismissal of the chief minister, and Iran had refused them (ch. 32)."}, "sources": ["src:056d58919a"], "flags": []}, {"text": {"fa": "خوانش محمود و حدّ آن: او این جنگ را نمونهٔ سلب «حق مسلم» ایران می‌داند و بریتانیا را به بازی دوگانه با «دو دسته رجال موافق و مخالف» متهم می‌کند. این داوری اوست. از نگاه افغانستان، همین رویداد گامی به سوی استقلال از ادعای ایران است؛ کتاب آن صدا را ندارد. این یادآوری ویراستار است.", "en": "Mahmud’s reading and its limit: he treats the war as the stripping of Iran’s “undoubted right” and accuses Britain of a double game played with “two sets of statesmen, friendly and hostile”. That is his judgement. Seen from Afghanistan, the same event is a step toward independence from Iranian claims; the book does not carry that voice. This is the editor’s reminder.", "nl": "Mahmud’s reading and its limit: he treats the war as the stripping of Iran’s “undoubted right” and accuses Britain of a double game played with “two sets of statesmen, friendly and hostile”. That is his judgement. Seen from Afghanistan, the same event is a step toward independence from Iranian claims; the book does not carry that voice. This is the editor’s reminder."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "حدّ این مدخل: فایل اسکن است و با نویسه‌خوانی خودکار خوانده شد؛ برای همین تاریخ‌های هجری و برخی نام‌ها نیامده‌اند. از ۴۰۱ صفحهٔ جلد دوم، فهرست مطالب و حدود بیست‌وپنج صفحه از پایان فصل ۳۱ و فصل ۳۲ خوانده شد.", "en": "Limits: the file is a scan read by OCR, so hijri dates and some names are omitted. Of the 401 pages of volume two, the contents and about twenty-five pages from the end of chapter 31 and chapter 32 were read.", "nl": "Limits: the file is a scan read by OCR, so hijri dates and some names are omitted. Of the 401 pages of volume two, the contents and about twenty-five pages from the end of chapter 31 and chapter 32 were read."}, "sources": [], "flags": ["editor-note"]}], "links": [{"to": "tarikh:iran-between-powers-1800-1828-mahmud", "rel": "see-also", "note": {"fa": "ایران میان قدرت‌ها، ۱۸۰۰ تا ۱۸۲۸", "en": "Iran between the powers, 1800–1828", "nl": "Iran between the powers, 1800–1828"}}, {"to": "tarikh:afghanistan-1919-1945-pashtun-card-great-powers", "rel": "see-also", "note": {"fa": "افغانستان و قدرت‌ها", "en": "Afghanistan and the powers", "nl": "Afghanistan and the powers"}}, {"to": "tarikh:telegraph-line-iran-1860s-wire-to-india", "rel": "see-also", "note": {"fa": "تلگراف و راه هند", "en": "The telegraph and the road to India", "nl": "The telegraph and the road to India"}}, {"to": "tarikh:anglo-russian-convention-1907-iran-not-told", "rel": "see-also", "note": {"fa": "قرارداد ۱۹۰۷", "en": "The 1907 convention", "nl": "The 1907 convention"}}, {"to": "soc:national-humiliation-anger", "rel": "see-also", "note": {"fa": "خشم از تحقیر ملی", "en": "Anger at national humiliation", "nl": "Anger at national humiliation"}}], "people": [], "sources": ["src:056d58919a"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tarikh:abu-muslim-revolt", "kind": "concept", "title": {"fa": "قیام سیاه‌جامگان ابومسلم خراسانی", "en": "Abu Muslim al-Khurasani's Black-Banner revolt", "nl": "De Zwarte-Vaandel-opstand van Abu Muslim al-Khurasani"}, "aliases": ["سیاه‌جامگان", "ابومسلم خراسانی", "انقلاب عباسی در خراسان"], "parent": "tarikh:early-islamic", "field": "tarikh:early-islamic", "summary": {"fa": "جنبشی در خراسان (حدود ۱۲۹-۱۳۰ هجری/۷۴۷ م) که به سقوط امویان و برآمدن عباسیان رسید. ابومسلم با ترکیبی از سازمان‌دهی نظامی و سیاستِ آزادکردنِ اسیران برای کسب آبرو، در چندماه از شهر به شهرِ خراسان گسترش یافت.", "en": "A movement in Khorasan (c. 129-130 AH/747 CE) that led to the fall of the Umayyads and the rise of the Abbasids. Combining military organization with a policy of releasing captives to build a reputation for chivalry, Abu Muslim spread from city to city across Khorasan within months.", "nl": "Een beweging in Khorasan (ca. 129-130 AH/747 CE) die leidde tot de val van de Omajjaden en de opkomst van de Abbasiden. Door militaire organisatie te combineren met een beleid van het vrijlaten van gevangenen om een reputatie van ridderlijkheid op te bouwen, verspreidde Abu Muslim zich binnen maanden van stad tot stad door Khorasan."}, "points": [{"text": {"fa": "در عید فطر، بیش از ۲۲۰۰ تن «سیاه‌جامگان» در سفیدنج نزد ابومسلم گرد آمدند؛ نصر بن سیار (والی اموی خراسان) دسته‌ای سوار برای سرکوب آن‌ها فرستاد که ابومسلم آن را شکست داد.", "en": "On Eid al-Fitr, more than 2,200 \"black-banner\" men gathered around Abu Muslim at Safidanj; Nasr ibn Sayyar (the Umayyad governor of Khorasan) sent a cavalry detachment to suppress them, which Abu Muslim defeated.", "nl": "Op Eid al-Fitr verzamelden zich meer dan 2.200 \"zwarte-vaandel\"-mannen rond Abu Muslim bij Safidanj; Nasr ibn Sayyar (de Omajjadische gouverneur van Khorasan) stuurde een cavalerie-eenheid om hen te onderdrukken, die Abu Muslim verslagen heeft."}, "sources": ["src:c4abd0c6f3"], "flags": []}, {"text": {"fa": "فرماندهٔ مجروح و اسیرشدهٔ آن دسته را ابومسلم تیمار کرد و بعد از بهبودی آزاد کرد تا آوازهٔ جوانمردی سیاه‌جامگان را ببرد؛ چندماه بعد نیز گروهی دیگر از اسیران را به همین قصد آزاد کردند — سیاستی برای کسب آبرو، نه فقط رحم.", "en": "Abu Muslim had the wounded, captured commander of that detachment treated, then released him after recovery so he would spread word of the rebels' chivalry; months later another group of captives was released with the same purpose — a reputation-building policy, not mere mercy.", "nl": "Abu Muslim liet de gewonde, gevangengenomen commandant van die eenheid verzorgen en liet hem na herstel vrij zodat hij het woord zou verspreiden over de ridderlijkheid van de rebellen; maanden later werd nog een groep gevangenen met hetzelfde doel vrijgelaten — een reputatiebeleid, geen pure genade."}, "sources": ["src:c4abd0c6f3"], "flags": ["editor-note"], "note": {"fa": "این یک کاربرد اولیهٔ شناخته‌شدهٔ «جوانمردی به‌عنوان راهبرد سیاسی» در تاریخ ایران است؛ ارزش مقایسه با مطالعات روان‌شناسی اجتماعی دربارهٔ آبرو و اعتماد را دارد، اما این مدخل هنوز به آن ویکی پیوند نخورده.", "en": "This is a well-known early instance of \"chivalry as political strategy\" in Iranian history; it is worth comparing with social-psychology research on reputation and trust, but this entry is not yet cross-linked to that wiki.", "nl": "Dit is een bekend vroeg voorbeeld van \"ridderlijkheid als politieke strategie\" in de Iraanse geschiedenis; het is de moeite waard om te vergelijken met sociaalpsychologisch onderzoek naar reputatie en vertrouwen, maar dit lemma is nog niet gekoppeld aan die wiki."}}, {"text": {"fa": "در اندک زمانی شهرهای هرات، پوشنگ، مرورود، طالقان، مرو، نشابور، سرخس، بلخ، چغانیان، طخارستان، ختلان، کش و نخشب به سیاه‌جامگان پیوستند؛ حتی یمانی‌ها، به‌رغم رقابت قبیله‌ای با مُضَر، به یاری ابومسلم برخاستند. در اردوگاه ماخوان نزدیک مرو، نفرات او به حدود هفت‌هزار تن رسید و برایشان مانند یک فرمانده واقعی مقرری و جامگی تعیین کرد.", "en": "Within a short time the cities of Herat, Pushang, Marv-rud, Talaqan, Marv, Nishapur, Sarakhs, Balkh, Chaghanian, Tokharistan, Khottal, Kesh and Nakhshab joined the black-banner movement; even the Yamani Arabs, despite their tribal rivalry with the Mudar, rose to Abu Muslim's aid. At the Makhwan camp near Marv his numbers reached about 7,000, and he assigned them provisions and pay like a real commander.", "nl": "Binnen korte tijd sloten de steden Herat, Pushang, Marv-rud, Talaqan, Marv, Nishapur, Sarakhs, Balkh, Chaghanian, Tocharistan, Khottal, Kesh en Nakhshab zich aan bij de zwarte-vaandel-beweging; zelfs de Yamani-Arabieren, ondanks hun stammenrivaliteit met de Mudar, kwamen Abu Muslim te hulp. In het kamp Makhwan bij Marv bereikte zijn aantal ongeveer 7.000, en hij kende hen proviand en soldij toe als een echte bevelhebber."}, "sources": ["src:c4abd0c6f3"], "flags": []}], "links": [{"to": "tarikh:arab-conquest-iran", "rel": "part-of", "note": {"fa": "هر دو، فصل‌هایی از همان دورهٔ ایران زیر خلافت عربی‌اند", "en": "Both are chapters of the same period of Iran under Arab-caliphal rule", "nl": "Beide zijn hoofdstukken uit dezelfde periode van Iran onder Arabisch-kalifaal bestuur"}}, {"to": "soc:early-islamic-iran-revolts-local-dynasties", "rel": "part-of", "note": {"fa": "جای این قیام در زنجیرهٔ قیام‌های خراسان", "en": "This revolt's place in the chain of Khorasan uprisings", "nl": "De plaats van deze opstand in de reeks opstanden in Khorasan"}}], "people": [], "sources": ["src:c4abd0c6f3"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tarikh:ayyarun-class", "kind": "concept", "title": {"fa": "عیاران: طبقهٔ جوانمردان مسلح سده‌های میانه", "en": "The Ayyarun: the armed chivalry class of the medieval Islamic world", "nl": "De Ayyarun: de gewapende ridderlijkheidsklasse van de middeleeuwse islamitische wereld"}, "aliases": ["عیار", "عیاری", "جوانمردی"], "parent": "tarikh:early-islamic", "field": "tarikh:early-islamic", "summary": {"fa": "عیاران طبقه‌ای از جوانان مسلح عوام بودند که در بغداد، نشابور، سمرقند، سیستان و بیشتر شهرهای بزرگ خلافت، به‌خصوص در دوره‌های ضعف حکومت مرکزی، سر برمی‌آوردند. رفتارشان آمیزه‌ای متناقض بود: هم راهزنی و باج‌گیری، هم دفاع از مظلوم و وفاداری قبیله‌ای به سرکردهٔ خود — زیر لوای آیین «جوانمردی».", "en": "The ayyarun were a class of armed commoner youths who surfaced in Baghdad, Nishapur, Samarqand, Sistan and most major cities of the caliphate, especially during periods of weak central rule. Their conduct was a contradictory blend: both banditry and extortion, and defense of the oppressed and tribal-like loyalty to their chief — all under the banner of \"javanmardi\" (chivalry).", "nl": "De ayyarun waren een klasse van gewapende jongens uit het gewone volk die opdoken in Bagdad, Nishapur, Samarkand, Sistan en de meeste grote steden van het kalifaat, vooral in periodes van zwak centraal gezag. Hun gedrag was een tegenstrijdige mengeling: zowel roverij en afpersing, als verdediging van de verdrukten en stamachtige loyaliteit aan hun leider — allemaal onder de vlag van \"javanmardi\" (ridderlijkheid)."}, "points": [{"text": {"fa": "عیاران سازمانی شبیه به احزاب و اتحادیه داشتند و در هر شهر تا حدی با تشکیلات اصناف مرتبط بودند. جامه و آداب خاص خود داشتند و نسبت به سرکرده‌شان («سرهنگ» یا «سرعیار») اطاعتی نزدیک به تسلیم مطلق نشان می‌دادند.", "en": "The ayyarun had an organization resembling parties or guilds, and in each city were to some degree linked with craft-guild structures. They had their own distinctive dress and customs, and showed their chief (\"sarhang\" or \"sar-ayyar\") an obedience approaching total submission.", "nl": "De ayyarun hadden een organisatie die leek op partijen of gilden, en waren in elke stad tot op zekere hoogte verbonden met ambachtsgilden. Ze hadden hun eigen kledij en gebruiken, en toonden hun leider (\"sarhang\" of \"sar-ayyar\") een gehoorzaamheid die bijna volledige onderwerping benaderde."}, "sources": ["src:f407762ded"], "flags": []}, {"text": {"fa": "سلاحشان غالباً ابتدایی بود — نیزه‌های حصیری قیراندود، گرز، شمشیر، یا حتی فقط سنگ و فلاخن — و اغلب پیاده و بی‌زره می‌جنگیدند. با این‌حال در وقایع بزرگ نقش داشتند: در محاصرهٔ بغداد و جنگ امین و مأمون، عیاران بغداد در دفاع از شهر خود در برابر سپاه طاهر شجاعت نشان دادند.", "en": "Their weaponry was often rudimentary — tar-coated reed spears, maces, swords, or even just stones and slings — and they often fought on foot without armor. Yet they played a role in major events: during the siege of Baghdad and the war between al-Amin and al-Ma'mun, Baghdad's ayyarun showed courage defending their city against Tahir's army.", "nl": "Hun bewapening was vaak rudimentair — met teer bestreken rieten speren, knotsen, zwaarden, of zelfs alleen stenen en slingers — en ze vochten vaak te voet zonder harnas. Toch speelden ze een rol in grote gebeurtenissen: tijdens het beleg van Bagdad en de oorlog tussen al-Amin en al-Ma'mun toonden Bagdads ayyarun moed bij de verdediging van hun stad tegen Tahirs leger."}, "sources": ["src:f407762ded"], "flags": []}, {"text": {"fa": "در دوره‌های ضعف حکومت مرکزی، همین عیاران می‌توانستند به بلای جان مردم تبدیل شوند: به خانهٔ امیران و توانگران دستبرد می‌زدند و از بزرگان به‌زور پول می‌ستاندند. منبع این تناقض را آشکارا بیان می‌کند، نه پنهان: «با وجود اشتغال به غارت و راهزنی ... همواره در رعایت دوستی و نمک‌خوارگی و حمایت از مظلومان اهتمام نشان می‌دادند.»", "en": "In periods of weak central government, these same ayyarun could become a scourge on the populace: raiding the houses of nobles and the wealthy and extorting money from the great. The source states this contradiction openly rather than hiding it: \"despite being engaged in plunder and banditry ... they always showed care for loyalty and 'salt-eating' and protection of the oppressed.\"", "nl": "In periodes van zwak centraal gezag konden diezelfde ayyarun een plaag voor de bevolking worden: ze overvielen de huizen van edelen en rijken en persten geld af van de groten. De bron stelt deze tegenstrijdigheid openlijk en niet verhuld: \"ondanks dat ze zich bezighielden met plundering en roverij ... toonden ze altijd zorg voor trouw en 'zouteten' en bescherming van de verdrukten.\""}, "sources": ["src:f407762ded"], "flags": ["editor-note"], "note": {"fa": "این الگوی «راهزن نجیب» (بزهکار محلی که هم‌زمان حامی مردم عادی هم هست) در جامعه‌شناسی تاریخی با عنوان «راهزنی اجتماعی» شناخته می‌شود؛ مقایسه با آن ادبیات می‌تواند به ویکی جامعه پیوند بخورد، اما این مدخل هنوز به آن پیوند نخورده.", "en": "This \"noble bandit\" pattern (a local outlaw who is simultaneously a protector of common people) is known in historical sociology as \"social banditry\"; comparison with that literature could connect to the sociology wiki, though this entry is not yet cross-linked there.", "nl": "Dit \"nobele bandiet\"-patroon (een plaatselijke misdadiger die tegelijk een beschermer van gewone mensen is) staat in de historische sociologie bekend als \"sociaal banditisme\"; vergelijking met die literatuur zou kunnen aansluiten bij de sociologiewiki, al is dit lemma daar nog niet aan gekoppeld."}}], "links": [{"to": "soc:futuwwa-ayyaran-code", "rel": "see-also", "note": {"fa": "آیین و اخلاق همین گروه", "en": "The code and ethics of this group", "nl": "De code en ethiek van deze groep"}}, {"to": "soc:zurkhaneh-institution-social-base", "rel": "see-also", "note": {"fa": "نهادی که این سنت را ادامه داد", "en": "An institution that carried this tradition on", "nl": "Een instelling die deze traditie voortzette"}}, {"to": "soc:inclusive-politics-needs-central-state", "rel": "applies-to", "note": {"fa": "گروه‌های مسلح محلی وقتی دولت مرکزی ناتوان است", "en": "Local armed groups when the central state is weak", "nl": "Lokale gewapende groepen wanneer de centrale staat zwak is"}}], "people": [], "sources": ["src:f407762ded"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tarikh:prison-massacre-1988", "kind": "concept", "title": {"fa": "کشتار زندانیان سیاسی در تابستان ۱۳۶۷", "en": "The 1988 prison massacres", "nl": "The 1988 prison massacres"}, "aliases": [], "parent": "tarikh:modern", "field": "tarikh:modern", "summary": {"fa": "در مرداد و شهریور ۱۳۶۷، پس از پذیرش آتش‌بس، هزاران زندانی سیاسی که بیشترشان دوران محکومیت خود را می‌گذراندند در زندان‌های سراسر کشور مخفیانه اعدام و در گورهای بی‌نشان دفن شدند. هیئت‌هایی چندنفره در چند دقیقه دربارهٔ هر زندانی تصمیم می‌گرفتند. به خانواده‌ها محل دفن گفته نشد. عفو بین‌الملل این را جنایت علیه بشریتِ ادامه‌دار می‌داند، چون سرنوشت و محل دفن قربانیان هنوز پنهان است.", "en": "In August and September 1988, after the ceasefire, thousands of political prisoners, most of them serving sentences, were secretly executed in prisons across the country and buried in unmarked graves. Small panels decided each prisoner’s fate in minutes. Families were not told the burial sites. Amnesty International regards this as an ongoing crime against humanity, because the fate and burial places of the victims are still concealed.", "nl": "In August and September 1988, after the ceasefire, thousands of political prisoners, most of them serving sentences, were secretly executed in prisons across the country and buried in unmarked graves. Small panels decided each prisoner’s fate in minutes. Families were not told the burial sites. Amnesty International regards this as an ongoing crime against humanity, because the fate and burial places of the victims are still concealed."}, "points": [{"text": {"fa": "شمار: عفو بین‌الملل حداقل را «حدود ۵ هزار» می‌گذارد و می‌گوید رقم واقعی می‌تواند بیشتر باشد؛ فهرست‌های نام‌به‌نام گروه‌های مختلف با هم یکی نیست. حکومت هرگز آماری نداده است.", "en": "Numbers: Amnesty International puts the minimum at “around 5,000” and says the real figure may be higher; name-by-name lists from different groups do not coincide. The state has never given a figure.", "nl": "Numbers: Amnesty International puts the minimum at “around 5,000” and says the real figure may be higher; name-by-name lists from different groups do not coincide. The state has never given a figure."}, "sources": ["src:741a162474"], "flags": ["contested"]}, {"text": {"fa": "پنهان‌کاری ادامه‌دار: تخریب یا ساخت‌وساز روی گورهای جمعی، آزار خانواده‌هایی که یادبود می‌گیرند، و انکار رسمی.", "en": "Continuing concealment: destruction of or building over mass graves, harassment of families who hold commemorations, and official denial.", "nl": "Continuing concealment: destruction of or building over mass graves, harassment of families who hold commemorations, and official denial."}, "sources": ["src:741a162474"], "flags": []}, {"text": {"fa": "چرا در دفتر دادخواهی می‌آید: مستندسازی نام، تاریخ و مکان، و حق خانواده برای دانستن، پایهٔ هر سازوکار حقیقت‌یابی در آینده است.", "en": "Why it belongs in the accountability ledger: documenting names, dates and places, and the family’s right to know, underlie any future truth-seeking mechanism.", "nl": "Why it belongs in the accountability ledger: documenting names, dates and places, and the family’s right to know, underlie any future truth-seeking mechanism."}, "sources": [], "flags": ["editor-note"]}], "links": [{"to": "soc:transitional-justice-options", "rel": "see-also", "note": {"fa": "عدالت انتقالی: چهار راه", "en": "Transitional justice: four routes", "nl": "Transitional justice: four routes"}}, {"to": "tarikh:iran-iraq-war", "rel": "see-also", "note": {"fa": "پایان جنگ", "en": "End of the war", "nl": "End of the war"}}, {"to": "soc:collective-trauma-justice-revenge", "rel": "see-also", "note": {"fa": "عدالت یا انتقام", "en": "Justice or revenge", "nl": "Justice or revenge"}}], "people": [], "sources": ["src:741a162474"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tarikh:ancient", "kind": "field", "title": {"fa": "پیش از تاریخ و ایران باستان", "en": "Prehistory and ancient Iran", "nl": "Prehistorie en het oude Iran"}, "aliases": [], "parent": "tarikh:tarikh", "field": null, "summary": {"fa": "از نخستین شهرهای فلات ایران در هزارهٔ سوم پیش از میلاد تا پایان ساسانیان.", "en": "From the first cities of the Iranian plateau in the third millennium BC to the end of the Sasanians.", "nl": "From the first cities of the Iranian plateau in the third millennium BC to the end of the Sasanians."}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tarikh:afghanistan-1919-1945-pashtun-card-great-powers", "kind": "concept", "title": {"fa": "افغانستان ۱۹۱۹ تا ۱۹۴۵: «کارت پشتون» در دست قدرت‌ها", "en": "Afghanistan 1919–1945: the “Pashtun card” in the powers’ hands", "nl": "Afghanistan 1919–1945: de “Pasjtoense kaart”"}, "aliases": [], "parent": "tarikh:neighbours", "field": "tarikh:neighbours", "summary": {"fa": "یوری تیخانف، تاریخ‌نگار روس، با سندهای بایگانی شوروی و بریتانیا نشان می‌دهد که در نیمهٔ نخست سدهٔ بیستم هر قدرتی که با بریتانیا دشمنی داشت کوشید قبایل پشتونِ مرز هند را بشوراند: آلمان، شوروی، و سپس کشورهای محور. افغانستان میدان این بازی بود و دولتش آموخته بود از رقابت بزرگ‌ترها برای ماندن خودش بهره بگیرد.", "en": "The Russian historian Yuri Tikhonov, using Soviet and British archive documents, shows that in the first half of the twentieth century every power hostile to Britain tried to raise the Pashtun tribes of the Indian frontier: Germany, the Soviet Union, then the Axis. Afghanistan was the field of this game, and its government had learned to use the rivalry of the great to secure its own survival.", "nl": "The Russian historian Yuri Tikhonov, using Soviet and British archive documents, shows that in the first half of the twentieth century every power hostile to Britain tried to raise the Pashtun tribes of the Indian frontier: Germany, the Soviet Union, then the Axis. Afghanistan was the field of this game, and its government had learned to use the rivalry of the great to secure its own survival."}, "points": [{"text": {"fa": "سرزمین و مردم: به نوشتهٔ کتاب، نزدیک چهل درصد مردم افغانستان پشتون‌اند، در دو اتحادیهٔ بزرگ درانی و غلزایی. پشتون‌های خاوری در کوهستانی به گسترهٔ بیش از ۱۲۰ هزار کیلومتر مربع زندگی می‌کنند که از ۱۸۹۳ تا ۱۹۴۷ مرز شمال‌باختری هند بریتانیایی بود و امروز مرز افغانستان و پاکستان از میانش می‌گذرد (بخش یکم، ص ۲۵ فایل).", "en": "Land and people: by the book’s account nearly forty per cent of Afghanistan’s people are Pashtun, in two great confederations, Durrani and Ghilzai. The eastern Pashtuns live in mountains covering over 120,000 square kilometres that from 1893 to 1947 formed British India’s north-west frontier and through which the Afghan-Pakistani border runs today (part one, file p. 25).", "nl": "Land and people: by the book’s account nearly forty per cent of Afghanistan’s people are Pashtun, in two great confederations, Durrani and Ghilzai. The eastern Pashtuns live in mountains covering over 120,000 square kilometres that from 1893 to 1947 formed British India’s north-west frontier and through which the Afghan-Pakistani border runs today (part one, file p. 25)."}, "sources": ["src:49969a8adf"], "flags": []}, {"text": {"fa": "کارتی که همه بازی کردند: تیخانف می‌نویسد در سدهٔ بیستم کسی نبود که نکوشد با «کارت پشتون» بازی کند. آلمانی‌ها با پان‌اسلامیست‌های ترک در جنگ جهانی اول، سپس بلشویک‌ها و کمینترن که از «جبههٔ خاوری انقلاب جهانی» سخن می‌گفتند، و در جنگ دوم کشورهای محور که می‌خواستند با شورش پش
