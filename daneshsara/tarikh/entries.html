is higher; other figures are far higher and the state gave no detailed count. The internet was cut almost nationwide for about a week.", "nl": "November 2019: Amnesty International documented the names and details of 304 people killed and said the real figure is higher; other figures are far higher and the state gave no detailed count. The internet was cut almost nationwide for about a week."}, "sources": ["src:06a7496d98"], "flags": ["contested"]}, {"text": {"fa": "۱۴۰۱: هیئت حقیقت‌یاب سازمان ملل (۲۰۲۴) نتیجه گرفت سرکوب این اعتراض‌ها شامل نقض‌های شدید حقوق بشر بود که بسیاری‌شان به جنایت علیه بشریت می‌رسد، از جمله قتل، حبس، شکنجه، تجاوز و آزار جنسیتی.", "en": "2022: the UN fact-finding mission (2024) concluded the crackdown involved serious human-rights violations, many amounting to crimes against humanity, including murder, imprisonment, torture, rape and gender persecution.", "nl": "2022: the UN fact-finding mission (2024) concluded the crackdown involved serious human-rights violations, many amounting to crimes against humanity, including murder, imprisonment, torture, rape and gender persecution."}, "sources": ["src:e841177b4b"], "flags": []}, {"text": {"fa": "الگوی مشترک: جرقهٔ پیش‌بینی‌ناپذیر، گسترش سریع، قطع اینترنت، سرکوب، و فروکش بدون سازمان پایدار. هر موج آستانهٔ ترس را پایین‌تر و فاصله تا موج بعد را کوتاه‌تر کرد.", "en": "Common pattern: an unpredictable spark, rapid spread, internet shutdown, repression, and subsidence without durable organisation. Each wave lowered the fear threshold and shortened the gap to the next.", "nl": "Common pattern: an unpredictable spark, rapid spread, internet shutdown, repression, and subsidence without durable organisation. Each wave lowered the fear threshold and shortened the gap to the next."}, "sources": [], "flags": ["editor-note"]}], "links": [{"to": "soc:civil-resistance-success-rates", "rel": "see-also", "note": {"fa": "مقاومت مدنی چقدر موفق می‌شود", "en": "How often civil resistance succeeds", "nl": "How often civil resistance succeeds"}}, {"to": "soc:self-organized-criticality", "rel": "see-also", "note": {"fa": "جرقه و بهمن", "en": "Sparks and avalanches", "nl": "Sparks and avalanches"}}, {"to": "soc:telegram-public-sphere-iran-2010s", "rel": "see-also", "note": {"fa": "تلگرام و حوزهٔ عمومی", "en": "Telegram and the public sphere", "nl": "Telegram and the public sphere"}}, {"to": "tarikh:revolution-1979", "rel": "see-also", "note": {"fa": "مقایسه با ۱۳۵۷", "en": "Compared with 1979", "nl": "Compared with 1979"}}], "people": [], "sources": ["src:06a7496d98", "src:e841177b4b"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}], "people": {}, "sources": {"src:e841177b4b": {"id": "src:e841177b4b", "cite": "UN Human Rights Council (2024). Report of the Independent International Fact-Finding Mission on the Islamic Republic of Iran (A/HRC/55/67).", "year": 2024, "tier": 1, "wikis": ["tarikh"], "url": "https://www.ohchr.org/en/hr-bodies/hrc/ffm-iran/index"}, "src:12a047ab10": {"id": "src:12a047ab10", "cite": "زرین‌کوب، عبدالحسین. تاریخ ایران بعد از اسلام (جلد نخست: ایران در اوایل عهد اسلامی). تهران: امیرکبیر، چاپ دهم ۱۳۸۳. نسخهٔ دیجیتال کتابخانهٔ دانشسرا (۱۰۰ صفحهٔ نخست).", "year": 2004, "tier": 3, "wikis": ["tarikh"]}, "src:cafe941639": {"id": "src:cafe941639", "cite": "Razoux, P. (2015). The Iran–Iraq War (trans. N. Elliott). Cambridge, MA: Harvard University Press.", "year": 2015, "tier": 2, "wikis": ["tarikh"]}, "src:36618cf31d": {"id": "src:36618cf31d", "cite": "Abrahamian, E. (2008). A History of Modern Iran. Cambridge: Cambridge University Press.", "year": 2008, "tier": 3, "wikis": ["soc", "phil", "tarikh"]}, "src:f407762ded": {"id": "src:f407762ded", "cite": "عبدالحسین زرین‌کوب، تاریخ ایران بعد از اسلام (مجلدِ ۶ از ۷، نسخهٔ دیجیتالِ کتابخانهٔ دانش‌سرا؛ ویراست و ناشر دقیق نامشخص)", "year": null, "tier": 3, "wikis": ["tarikh"]}, "src:c182e55a07": {"id": "src:c182e55a07", "cite": "عبدالحسین زرین‌کوب، تاریخ ایران بعد از اسلام (مجلدِ ۵ از ۷، نس  "Reading casualty figures in early Islamic sources", "nl": "Hoe omgaan met dodencijfers in vroege islamitische bronnen"}, "url": "../soc/#early-islam-sources-casualty-claims"}, "soc:justinianic-plague-sasanian-war": {"title": {"fa": "طاعون و جنگ پایانی روم و ایران", "en": "Plague and the last Roman-Persian war", "nl": "Pest en de laatste Romeins-Perzische oorlog"}, "url": "../soc/#justinianic-plague-sasanian-war"}, "soc:early-islamic-iran-revolts-local-dynasties": {"title": {"fa": "قیام‌های خراسان و شمال ایران و پیدایش حکومت‌های محلی", "en": "Khurasan and northern Iranian revolts and the rise of local dynasties", "nl": "Opstanden in Khorasan en Noord-Iran en de opkomst van lokale dynastieën"}, "url": "../soc/#early-islamic-iran-revolts-local-dynasties"}, "soc:early-islamic-iran-continuity-debate": {"title": {"fa": "ایران سده‌های نخست اسلامی: گسست یا پیوستگی؟ (بحث «دو قرن سکوت»)", "en": "Iran in the early Islamic centuries: rupture or continuity? (the 'two centuries of silence' debate)", "nl": "Iran in de vroege islamitische eeuwen: breuk of continuïteit?"}, "url": "../soc/#early-islamic-iran-continuity-debate"}, "soc:abadan-oil-city-early-modernity": {"title": {"fa": "آبادان، شهر نفتی و نوسازی زودهنگام: «قرطی‌بازی» یا پیشگامی؟", "en": "Abadan, the oil city and early modernity: 'fast living' or pioneering?", "nl": "Abadan, de oliestad en vroege moderniteit: bandeloosheid of voortrekkersrol?"}, "url": "../soc/#abadan-oil-city-early-modernity"}, "soc:second-khordad-1997-peaceful-no": {"title": {"fa": "دوم خرداد ۱۳۷۶: «نه» مسالمت‌آمیز و «آری» به اصلاح (خوانش یک اصلاح‌طلب)", "en": "2 Khordad 1997: a peaceful “no” and a “yes” to reform (a reformist’s reading)", "nl": "2 Khordad 1997: een vreedzaam “nee”"}, "url": "../soc/#second-khordad-1997-peaceful-no"}, "soc:preference-falsification": {"title": {"fa": "تحریف ترجیحات و غافلگیری انقلاب‌ها", "en": "Preference falsification and the surprise of revolutions", "nl": "Voorkeursvervalsing en de verrassing van revoluties"}, "ur
