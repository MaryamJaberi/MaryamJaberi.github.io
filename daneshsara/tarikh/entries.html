<script>
const D = {"wiki": "tarikh", "order": ["tarikh:ancient", "tarikh:early-islamic", "tarikh:modern", "tarikh:neighbours"], "concepts": [{"id": "tarikh:tahirid-origins", "kind": "concept", "title": {"fa": "خاستگاه طاهریان: از پوشنگ تا درگاه مأمون", "en": "The origin of the Tahirids: from Pushang to Ma'mun's court", "nl": "De oorsprong van de Tahiriden: van Pushang tot het hof van al-Ma'mun"}, "aliases": ["طاهر بن حسین", "بیت‌النار", "خاندان طاهری"], "parent": "tarikh:early-islamic", "field": "tarikh:early-islamic", "summary": {"fa": "نیاکان طاهر بن حسین — بنیان‌گذار حکومت طاهریان، نخستین سلسلهٔ نیمه‌مستقل ایرانی پس از اسلام — از مردم پوشنگِ خراسان بودند و نسل به نسل در خدمت خلافت عباسی بالا آمدند؛ نسبشان به قبیلهٔ عرب خزاعه از راه «مولات» (پیوند غیرخویشاوندی) بود، نه خون. اعراب از سر طعنه آن‌ها را «بیت‌النار» (زادهٔ آتشکده) می‌خواندند.", "en": "The ancestors of Tahir ibn al-Husayn — founder of the Tahirid state, the first semi-independent Persian dynasty after Islam — were from Pushang in Khorasan and rose generation by generation in the service of the Abbasid caliphate; their lineage to the Arab tribe of Khuza'a was through \"mawala\" (a non-kinship bond), not blood. Arabs mockingly called them \"Bayt al-Nar\" (house of the fire-temple).", "nl": "De voorouders van Tahir ibn al-Husayn — grondlegger van de Tahiridenstaat, de eerste semi-onafhankelijke Perzische dynastie na de islam — kwamen uit Pushang in Khorasan en klommen generatie na generatie op in dienst van het Abbasidische kalifaat; hun afstamming tot de Arabische stam Khuza'a liep via \"mawala\" (een niet-bloedverwantschapsband), niet via bloed. Arabieren noemden hen spottend \"Bayt al-Nar\" (huis van de vuurtempel)."}, "points": [{"text": {"fa": "جدِ طاهر، رزیق بن اسعد، در عهد خلیفه مهدی در پوشنگ (نزدیک هرات) می‌زیست و از راه «مولات» با قبیلهٔ عرب خزاعه پیوند یافت — ازین‌رو فرزندانش به خزاعه منسوب شدند، هرچند نسب خونی نبود.", "en": "Tahir's forefather, Ruzayq ibn As'ad, lived in Pushang (near Herat) during Caliph Mahdi's reign and formed a \"mawala\" bond with the Arab tribe of Khuza'a — which is why his descendants came to be attributed to Khuza'a, though it was not a blood lineage.", "nl": "Tahirs voorvader, Ruzayq ibn As'ad, leefde in Pushang (bij Herat) tijdens het bewind van kalief Mahdi en vormde een \"mawala\"-band met de Arabische stam Khuza'a — daarom werden zijn nakomelingen toegeschreven aan Khuza'a, hoewel het geen bloedlijn was."}, "sources": ["src:c182e55a07"], "flags": []}, {"text": {"fa": "پسرش حسین بن مصعب، پدر طاهر، در دورهٔ هارون‌الرشید فرمانروای پوشنگ بود و در زمان اقامت مأمون در خراسان نیز در درگاه او حضور داشت. چون حسین در سال ۱۹۹ هجری درگذشت، خودِ مأمون بر جنازه‌اش حاضر شد و برای طاهر — که در عراق بود — پیک تسلیت فرستاد.", "en": "His son Husayn ibn Mus'ab, Tahir's father, was ruler of Pushang under Harun al-Rashid and was also present at Ma'mun's court during Ma'mun's stay in Khorasan. When Husayn died in 199 AH, Ma'mun himself attended the funeral and sent a messenger of condolence to Tahir, who was in Iraq at the time.", "nl": "Zijn zoon Husayn ibn Mus'ab, Tahirs vader, was heerser van Pushang onder Harun al-Rashid en was ook aanwezig aan het hof van al-Ma'mun tijdens diens verblijf in Khorasan. Toen Husayn stierf in 199 AH, woonde al-Ma'mun zelf de begrafenis bij en stuurde een condoleancebode naar Tahir, die op dat moment in Irak verbleef."}, "sources": ["src:c182e55a07"], "flags": []}, {"text": {"fa": "با این پیشینهٔ نسلی در خدمت خلافت، اعراب از سر طعنه آنان را «بیت‌النار» یعنی «زادهٔ آتشکده» می‌خواندند — اشاره‌ای تحقیرآمیز به ریشهٔ ایرانی و زرتشتی خاندان، در حالی که آن خاندان خود را دیگر بخشی از نظام عربی-اسلامی خلافت می‌دانست.", "en": "Given this generational record of service to the caliphate, Arabs mockingly called them \"Bayt al-Nar\" — \"house of the fire-temple\" — a derisive jab at the family's Persian and Zoroastrian roots, even as the family itself had come to see itself as part of the caliphate's Arab-Islamic order.", "nl": "Gezien deze generaties lange dienst aan het kalifaat noemden Arabieren hen spottend \"Bayt al-Nar\" — \"huis van de vuurtempel\" — een honende steek naar de Perzische en Zoroastrische wortels van de familie, ook al zag de familie zichzelf inmiddels als onderdeel van de Arabisch-islamitische orde van het kalifaat."}, "sources": ["src:c182e55a07"], "flags": ["editor-note"], "note": {"fa": "این لقب طعنه‌آمیز نمونهٔ خوبی از تنش قومی/مذهبی پنهان زیر ظاهر یکپارچگی خلافت عباسی است — موضوعی که می‌تواند به ویکی جامعه (هویت، طبقه) پیوند بخورد، اما این مدخل هنوز به آن پیوند نخورده.", "en": "This mocking epithet is a good example of the ethnic/religious tension hidden beneath the surface unity of the Abbasid caliphate — a topic that could connect to the sociology wiki (identity, status), though this entry is not yet cross-linked there.", "nl": "Deze spottende bijnaam is een goed voorbeeld van de etnische/religieuze spanning verborgen onder de oppervlakte-eenheid van het Abbasidische kalifaat — een onderwerp dat zou kunnen aansluiten bij de sociologiewiki (identiteit, status), al is dit lemma daar nog niet aan gekoppeld."}}], "links": [{"to": "tarikh:abbasid-golden-age", "rel": "part-of", "note": {"fa": "خاستگاه طاهریان در دل همان دستگاه خلافت عباسی شکل گرفت", "en": "The Tahirids' origin took shape within that same Abbasid caliphal apparatus", "nl": "De oorsprong van de Tahiriden nam vorm aan binnen datzelfde Abbasidische kalifale apparaat"}}, {"to": "soc:early-islamic-iran-revolts-local-dynasties", "rel": "part-of", "note": {"fa": "طاهریان در میان حکومت‌های محلی ایران", "en": "The Tahirids among Iran's local dynasties", "nl": "De Tahiriden tussen de lokale dynastieën van Iran"}}], "people": [], "sources": ["src:c182e55a07"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tarikh:constitutional-revolution-1906", "kind": "concept", "title": {"fa": "انقلاب مشروطه (۱۲۸۵–۱۲۹۰)", "en": "The Constitutional Revolution (1906–1911)", "nl": "The Constitutional Revolution (1906–1911)"}, "aliases": [], "parent": "tarikh:modern", "field": "tarikh:modern", "summary": {"fa": "در مرداد ۱۲۸۵ مظفرالدین‌شاه زیر فشار بست‌نشینی بازاریان، روحانیان و روشنفکران فرمان مشروطه را امضا کرد و ایران نخستین مجلس و قانون اساسی‌اش را یافت. محمدعلی‌شاه در ۱۲۸۷ مجلس را به توپ بست؛ مقاومت تبریز و فتح تهران در ۱۲۸۸ مشروطه را برگرداند، و اولتیماتوم روسیه در ۱۲۹۰ مجلس دوم را بست. مشروطه شکست خورد اما واژه‌ها و نهادهایش ماند: قانون، مجلس، ملت، انجمن.", "en": "In August 1906 Mozaffar al-Din Shah, pressed by sit-ins of merchants, clerics and intellectuals, signed the constitutional decree and Iran gained its first parliament and constitution. Mohammad Ali Shah bombarded the Majles in 1908; the resistance of Tabriz and the taking of Tehran in 1909 restored the constitution, and the Russian ultimatum of 1911 closed the second Majles. The revolution was defeated but its words and institutions remained: law, parliament, nation, association.", "nl": "In August 1906 Mozaffar al-Din Shah, pressed by sit-ins of merchants, clerics and intellectuals, signed the constitutional decree and Iran gained its first parliament and constitution. Mohammad Ali Shah bombarded the Majles in 1908; the resistance of Tabriz and the taking of Tehran in 1909 restored the constitution, and the Russian ultimatum of 1911 closed the second Majles. The revolution was defeated but its words and institutions remained: law, parliament, nation, association."}, "points": [{"text": {"fa": "ائتلاف: بازار، بخشی از روحانیت و روشنفکران نوگرا بر سر محدودکردن خودکامگی و نفوذ خارجی یکی شدند، اما بر سر اینکه قانون را چه کسی می‌نویسد (مجلس یا شرع) خیلی زود از هم جدا شدند.", "en": "The coalition: bazaar, part of the clergy and modernist intellectuals united on limiting autocracy and foreign influence but soon split over who writes the law (parliament or sharia).", "nl": "The coalition: bazaar, part of the clergy and modernist intellectuals united on limiting autocracy and foreign influence but soon split over who writes the law (parliament or sharia)."}, "sources": ["src:44eed7320d"], "flags": []}, {"text": {"fa": "از پایین: افاری نشان می‌دهد انجمن‌های شهری و ایالتی، روزنامه‌ها، و انجمن‌ها و مدرسه‌های زنان بدنهٔ واقعی جنبش بودند، نه فقط مجلس. تبریز یازده ماه در محاصره ایستاد.", "en": "From below: Afary shows urban and provincial councils, newspapers and women’s societies and schools were the real body of the movement, not only parliament. Tabriz withstood an eleven-month siege.", "nl": "From below: Afary shows urban and provincial councils, newspapers and women’s societies and schools were the real body of the movement, not only parliament. Tabriz withstood an eleven-month siege."}, "sources": ["src:afba09a998"], "flags": []}, {"text": {"fa": "چرا مهم است: نخستین بار که ایرانیان کوشیدند قدرت را به قانون ببندند، هم شکاف درونی ائتلاف و هم دخالت دو قدرت خارجی (روسیه و بریتانیا، با تقسیم ایران در ۱۹۰۷) کار را ناتمام گذاشت. هر دو عامل در دوره‌های بعد تکرار شد.", "en": "Why it matters: the first time Iranians tried to bind power to law, both the coalition’s internal rift and the intervention of two foreign powers (Russia and Britain, who partitioned Iran in 1907) left the work unfinished. Both factors recurred later.", "nl": "Why it matters: the first time Iranians tried to bind power to law, both the coalition’s internal rift and the intervention of two foreign powers (Russia and Britain, who partitioned Iran in 1907) left the work unfinished. Both factors recurred later."}, "sources": ["src:36618cf31d"], "flags": ["editor-note"]}], "links": [{"to": "soc:constitutional-revolution-three-forces-clergy", "rel": "see-also", "note": {"fa": "سه نیروی مشروطه", "en": "Three forces of the revolution", "nl": "Three forces of the revolution"}}, {"to": "tarikh:oil-nationalisation-1953-coup", "rel": "see-also", "note": {"fa": "گام بعد: ملی‌شدن نفت", "en": "Next: oil nationalisation", "nl": "Next: oil nationalisation"}}, {"to": "soc:coordination-focal-points", "rel": "see-also", "note": {"fa": "بست‌نشینی به‌مثابه نقطهٔ کانونی", "en": "Sit-ins as focal points", "nl": "Sit-ins as focal points"}}], "people": [], "sources": ["src:44eed7320d", "src:afba09a998", "src:36618cf31d"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tarikh:revolution-1979", "kind": "concept", "title": {"fa": "انقلاب ۱۳۵۷: چرا کسی پیش‌بینی‌اش نکرد", "en": "The 1979 revolution: why nobody predicted it", "nl": "The 1979 revolution: why nobody predicted it"}, "aliases": [], "parent": "tarikh:modern", "field": "tarikh:modern", "summary": {"fa": "از دی ۱۳۵۶ تا بهمن ۱۳۵۷، چرخهٔ چهلم‌ها، اعتصاب‌های سراسری (به‌ویژه نفت) و راهپیمایی‌های میلیونی حکومتی را که ارتش بزرگ و درآمد نفت داشت فروریخت. کورزمن نشان می‌دهد هیچ‌کدام از توضیح‌های رایج (اقتصاد، سازمان، فرهنگ، ضعف سرکوب) به‌تنهایی کافی نیست: مردم وقتی پیوستند که باور کردند دیگران هم می‌پیوندند. انقلاب تا لحظهٔ آخر برای خود انقلابیان هم «تصورناپذیر» بود.", "en": "From January 1978 to February 1979 a cycle of forty-day mournings, nationwide strikes (above all in oil) and million-strong marches brought down a regime with a large army and oil income. Kurzman shows none of the usual explanations (economy, organisation, culture, weak repression) suffices alone: people joined when they came to believe others would join too. Until the last moment the revolution was “unthinkable” even to the revolutionaries.", "nl": "From January 1978 to February 1979 a cycle of forty-day mournings, nationwide strikes (above all in oil) and million-strong marches brought down a regime with a large army and oil income. Kurzman shows none of the usual explanations (economy, organisation, culture, weak repression) suffices alone: people joined when they came to believe others would join too. Until the last moment the revolution was “unthinkable” even to the revolutionaries."}, "points": [{"text": {"fa": "سازوکار: هر چهلم برای کشته‌شدگان تظاهرات پیشین، تظاهرات تازه می‌ساخت؛ تقویم مذهبی یک نقطهٔ کانونی آماده بود. اعتصاب کارکنان نفت در پاییز ۱۳۵۷ درآمد دولت را برید.", "en": "Mechanism: each fortieth-day mourning for those killed in the previous protest produced a new protest; the religious calendar was a ready focal point. The oil workers’ strike in autumn 1978 cut the state’s income.", "nl": "Mechanism: each fortieth-day mourning for those killed in the previous protest produced a new protest; the religious calendar was a ready focal point. The oil workers’ strike in autumn 1978 cut the state’s income."}, "sources": ["src:e658a741c7", "src:36618cf31d"], "flags": []}, {"text": {"fa": "پس از پیروزی: ائتلافی که فقط بر «رفتن شاه» توافق داشت ظرف دو سال از هم پاشید. همه‌پرسی «جمهوری اسلامی: آری یا نه» در فروردین ۱۳۵۸، دادگاه‌های انقلاب و حذف پی‌درپی لیبرال‌ها، چپ‌ها و مجاهدین تا ۱۳۶۰، قدرت را در دست سازمان‌یافته‌ترین گروه گذاشت.", "en": "After victory: a coalition that agreed only on “the Shah must go” fell apart within two years. The yes/no referendum on an “Islamic Republic” in spring 1979, revolutionary courts and the successive elimination of liberals, leftists and the Mojahedin by 1981 left power with the best-organised group.", "nl": "After victory: a coalition that agreed only on “the Shah must go” fell apart within two years. The yes/no referendum on an “Islamic Republic” in spring 1979, revolutionary courts and the successive elimination of liberals, leftists and the Mojahedin by 1981 left power with the best-organised group."}, "sources": ["src:36618cf31d"], "flags": []}, {"text": {"fa": "درس برای امروز: توافق بر سر «نه» کافی نیست. آنچه در ماه‌های پس از فروپاشی تعیین‌کننده شد سازمان، سلاح و قواعد نوشته‌نشدهٔ گذار بود.", "en": "Lesson for today: agreeing on a “no” is not enough. What decided the months after the collapse was organisation, arms and the unwritten rules of the transition.", "nl": "Lesson for today: agreeing on a “no” is not enough. What decided the months after the collapse was organisation, arms and the unwritten rules of the transition."}, "sources": [], "flags": ["editor-note"]}], "links": [{"to": "soc:preference-falsification", "rel": "see-also", "note": {"fa": "چرا انقلاب‌ها غافلگیر می‌کنند", "en": "Why revolutions surprise", "nl": "Why revolutions surprise"}}, {"to": "soc:threshold-models-of-collective-behaviour", "rel": "see-also", "note": {"fa": "مدل آستانه", "en": "Threshold models", "nl": "Threshold models"}}, {"to": "soc:revolution-1357-religion-left-fusion-and-charisma", "rel": "see-also", "note": {"fa": "پیوند دین و چپ در ۱۳۵۷", "en": "Religion–left fusion in 1979", "nl": "Religion–left fusion in 1979"}}, {"to": "tarikh:iran-iraq-war", "rel": "see-also", "note": {"fa": "جنگ هشت‌ساله", "en": "The eight-year war", "nl": "The eight-year war"}}], "people": [], "sources": ["src:e658a741c7", "src:36618cf31d"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tarikh:armenia-between-iran-and-rome", "kind": "concept", "title": {"fa": "ارمنستان میان ایران و روم: ماندن بدون دولت", "en": "Armenia between Iran and Rome: enduring without a state", "nl": "Armenië tussen Iran en Rome"}, "aliases": [], "parent": "tarikh:neighbours", "field": "tarikh:neighbours", "summary": {"fa": "ارمنستان قرن‌ها میان دو قدرت بزرگ، ایران و روم، دست‌به‌دست شد و در پایان سدهٔ چهارم میلادی میانشان تقسیم گشت. سیرارپی درنرسسیان، تاریخ‌نگار هنر و تاریخ ارمنی، نشان می‌دهد این مردم چگونه با پذیرفتن مسیحیت، ساختن الفبای خود و ایستادگی در برابر تغییر دین اجباری، هویتشان را بدون دولت مستقل نگه داشتند. برای تاریخ ایران این روی دیگر سکه است: روایت همسایه‌ای که زیر فرمان ساسانیان زیست.", "en": "For centuries Armenia changed hands between two great powers, Iran and Rome, and at the end of the fourth century was partitioned between them. Sirarpie Der Nersessian, a historian of Armenian art and history, shows how this people kept its identity without an independent state by adopting Christianity, creating its own alphabet and resisting forced conversion. For Iranian history this is the other side of the coin: the account of a neighbour who lived under Sasanian rule.", "nl": "For centuries Armenia changed hands between two great powers, Iran and Rome, and at the end of the fourth century was partitioned between them. Sirarpie Der Nersessian, a historian of Armenian art and history, shows how this people kept its identity without an independent state by adopting Christianity, creating its own alphabet and resisting forced conversion. For Iranian history this is the other side of the coin: the account of a neighbour who lived under Sasanian rule."}, "points": [{"text": {"fa": "پیوند با ایران: به روایت کتاب، شاهزادگان اشکانی بر تخت ارمنستان نشستند و زبان پارتی اثر ژرفی بر ارمنی کهن گذاشت که هنوز در واژگان ارمنی دیده می‌شود. ارمنستان در جنگ‌های چندصدسالهٔ ایران و روم، که بر سر راه‌های بازرگانی بود، پیوسته میدان نبرد بود (مقدمهٔ مترجم و فصل تاریخ، حدود صفحه‌های ۱۲ تا ۲۶ فایل).", "en": "Ties with Iran: in the book’s account Arsacid princes sat on the Armenian throne and Parthian left a deep mark on Old Armenian, still visible in its vocabulary. In the centuries-long wars of Iran and Rome, fought over trade routes, Armenia was constantly the battlefield (translator’s preface and the history chapter, about file pp. 12–26).", "nl": "Ties with Iran: in the book’s account Arsacid princes sat on the Armenian throne and Parthian left a deep mark on Old Armenian, still visible in its vocabulary. In the centuries-long wars of Iran and Rome, fought over trade routes, Armenia was constantly the battlefield (translator’s preface and the history chapter, about file pp. 12–26)."}, "sources": ["src:6e6bf84368"], "flags": []}, {"text": {"fa": "دین به‌جای دولت: ارمنستان در آغاز سدهٔ چهارم میلادی مسیحیت را دین رسمی کرد و نویسنده آن را نخستین کشور با این تصمیم می‌داند. در پایان همان سده کشور میان روم و ساسانیان تقسیم شد و بخش بزرگ‌تر به ایران رسید. از آن پس کلیسا، نه دولت، هویت را نگه داشت.", "en": "Religion in place of the state: Armenia made Christianity its official religion in the early fourth century, and the author calls it the first country to do so. At the end of that century the land was partitioned between Rome and the Sasanians, the larger part going to Iran. From then on the church, not the state, carried the identity.", "nl": "Religion in place of the state: Armenia made Christianity its official religion in the early fourth century, and the author calls it the first country to do so. At the end of that century the land was partitioned between Rome and the Sasanians, the larger part going to Iran. From then on the church, not the state, carried the identity."}, "sources": ["src:6e6bf84368"], "flags": []}, {"text": {"fa": "آوارایر و الفبا: وقتی شاهان ساسانی کوشیدند آیین زرتشتی را جایگزین کنند، ارمنیان در نبرد آوارایر (۴۵۱ م) ایستادند؛ شکست نظامی خوردند اما دینشان ماند. ساختن الفبای ارمنی به دست مسروپ ماشتوتس در آغاز سدهٔ پنجم، کتاب مقدس و ادبیات را به زبان خود مردم آورد. نکته: در نسخهٔ اسکن‌شده برخی تاریخ‌ها ناخواناست و نام شاه ساسانی «یزدگرد سوم» آمده، حال آنکه منابع دیگر یزدگرد دوم می‌گویند.", "en": "Avarayr and the alphabet: when Sasanian kings tried to impose Zoroastrianism, the Armenians stood at the battle of Avarayr (451 CE); they lost militarily but kept their religion. The creation of the Armenian alphabet by Mesrop Mashtots in the early fifth century brought scripture and literature into the people’s own language. Note: some dates are illegible in the scan and the Sasanian king is given as “Yazdgerd III”, where other sources say Yazdgerd II.", "nl": "Avarayr and the alphabet: when Sasanian kings tried to impose Zoroastrianism, the Armenians stood at the battle of Avarayr (451 CE); they lost militarily but kept their religion. The creation of the Armenian alphabet by Mesrop Mashtots in the early fifth century brought scripture and literature into the people’s own language. Note: some dates are illegible in the scan and the Sasanian king is given as “Yazdgerd III”, where other sources say Yazdgerd II."}, "sources": ["src:6e6bf84368"], "flags": ["editor-note"]}, {"text": {"fa": "درسی برای امروز: مردمی که قرن‌ها دولت نداشتند با سه چیز ماندند: زبان نوشتاری خودشان، نهادی که آموزش می‌داد، و حافظهٔ مشترک از یک ایستادگی. این همان چیزی است که پژوهش‌های امروز دربارهٔ نمادها و نقطهٔ کانونی می‌گویند. از کتاب فقط مقدمهٔ مترجم و بخش‌هایی از فصل‌های تاریخ و ادبیات به‌صورت گزینشی خوانده شد؛ فصل‌های معماری و نقاشی خوانده نشده است. کتاب دربارهٔ ارمنستان تاریخی است، نه دربارهٔ ارمنیان ایران امروز.", "en": "A lesson for today: a people stateless for centuries endured through three things: their own written language, an institution that taught, and a shared memory of a stand. This is what current work on symbols and focal points describes. Only the translator’s preface and parts of the history and literature chapters were read selectively; the architecture and painting chapters were not. The book is about historical Armenia, not about Armenians in today’s Iran.", "nl": "A lesson for today: a people stateless for centuries endured through three things: their own written language, an institution that taught, and a shared memory of a stand. This is what current work on symbols and focal points describes. Only the translator’s preface and parts of the history and literature chapters were read selectively; the architecture and painting chapters were not. The book is about historical Armenia, not about Armenians in today’s Iran."}, "sources": [], "flags": ["editor-note"]}], "links": [{"to": "soc:coordination-focal-points", "rel": "see-also", "note": {"fa": "نماد و نقطهٔ کانونی", "en": "Symbols and focal points", "nl": "Symbols and focal points"}}, {"to": "soc:ethnic-identity-crisis-iran-altaee", "rel": "see-also", "note": {"fa": "هویت قومی و دینی در ایران", "en": "Ethnic and religious identity in Iran", "nl": "Ethnic and religious identity in Iran"}}, {"to": "soc:nation-myths-symbols-cohesion-and-limits", "rel": "see-also", "note": {"fa": "اسطوره و نماد ملی", "en": "National myths and symbols", "nl": "National myths and symbols"}}], "people": [], "sources": ["src:6e6bf84368"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tarikh:abbasid-golden-age", "kind": "concept", "title": {"fa": "عصر طلایی عباسی و دنیای هزار و یک شب", "en": "The Abbasid golden age and the world of 1001 Nights", "nl": "Het Abbasidische gouden tijdperk en de wereld van 1001 Nachten"}, "aliases": ["دنیای هزار و یک شب", "خلافت عباسی", "عهد مهدی و هارون"], "parent": "tarikh:early-islamic", "field": "tarikh:early-islamic", "summary": {"fa": "عباسیان، برخلاف امویان، حکومتی بر پایهٔ سیادت قومی عرب نساختند؛ قدرتشان را بر سیاه‌جامگان و خراسانیان استوار کردند و مرکز را به عراق — نزدیک جای پیشین تیسفون — بردند. دورهٔ مهدی و هارون‌الرشید، با شکوه دربار و زمینهٔ افسانه‌های هزار و یک شب، همراه بود، اما همان‌زمان نیز جنگ و ناامنی مرزی ادامه داشت.", "en": "Unlike the Umayyads, the Abbasids did not build their rule on Arab tribal supremacy; they based their power on the black-banner troops and Khorasanians, and moved the center to Iraq — near the old site of Ctesiphon. The era of Mahdi and Harun al-Rashid brought a splendid court and the backdrop for the 1001 Nights tales, even as border wars and insecurity continued.", "nl": "In tegenstelling tot de Omajjaden bouwden de Abbasiden hun heerschappij niet op Arabische stammenheerschappij; ze baseerden hun macht op de zwarte-vaandeltroepen en Khorasaniërs, en verplaatsten het centrum naar Irak — dicht bij de oude plek van Ctesiphon. Het tijdperk van Mahdi en Harun al-Rashid bracht een schitterend hof en de achtergrond voor de verhalen van 1001 Nachten, zelfs terwijl grensoorlogen en onveiligheid voortduurden."}, "points": [{"text": {"fa": "هدف عباسیان برخلاف امویان، ایجاد دولتی بود که غیرعرب نیز مانند عرب از حقوق و مزایا بهره‌مند باشد؛ قدرت خلیفه به‌ویژه در آغاز بیشتر بر نیروی سیاه‌جامگان و خراسانیان تکیه داشت، نه بر تعصب قومی عربی. مرکز خلافت نیز به عراق منتقل شد — همان‌جا که شاهنشاهی ساسانی مرکز داشت.", "en": "Unlike the Umayyads, the Abbasids' aim was a state in which non-Arabs would enjoy the same rights as Arabs; caliphal power, especially at the outset, rested chiefly on the black-banner troops and Khorasanians rather than Arab tribal partisanship. The caliphate's center also moved to Iraq — the very region where the Sasanian empire had been centered.", "nl": "In tegenstelling tot de Omajjaden was het doel van de Abbasiden een staat waarin niet-Arabieren dezelfde rechten zouden genieten als Arabieren; de kalifale macht, vooral in het begin, rustte vooral op de zwarte-vaandeltroepen en Khorasaniërs, niet op Arabisch stammenpartijdigheid. Het centrum van het kalifaat verhuisde ook naar Irak — precies de regio waar het Sassanidische rijk gecentreerd was geweest."}, "sources": ["src:c182e55a07"], "flags": []}, {"text": {"fa": "دوران مهدی و به‌خصوص هارون‌الرشید با شکوه دربار چنان شهرت یافت که زمینهٔ افسانه‌های هزار و یک شب شد. با این‌همه، همین دوره دنیای جنگ و جهاد نیز بود — جهاد در مرز روم، هند، دیلم و خزر — و «مطوعه» (رزمندگان داوطلب) در زمان صلح غالباً خودسر می‌ماندند و ناامنی شهر را دامن می‌زدند.", "en": "The era of Mahdi, and especially Harun al-Rashid, became so famed for the splendor of the court that it became the backdrop for the 1001 Nights tales. Yet the same period was also a world of war and jihad — on the frontiers with Byzantium, India, Daylam and the Khazars — and the \"mutawwi'a\" (volunteer fighters) often grew unruly in peacetime, feeding urban insecurity.", "nl": "Het tijdperk van Mahdi, en vooral Harun al-Rashid, werd zo beroemd om de pracht van het hof dat het de achtergrond werd voor de verhalen van 1001 Nachten. Toch was dezelfde periode ook een wereld van oorlog en jihad — aan de grenzen met Byzantium, India, Daylam en de Khazaren — en de \"mutawwi'a\" (vrijwillige strijders) werden in vredestijd vaak onhandelbaar, wat onveiligheid in de stad voedde."}, "sources": ["src:c182e55a07"], "flags": ["editor-note"], "note": {"fa": "تصویر «عصر طلایی» در این متن خودِ روایتِ زرین‌کوب است، نه یک ارزیابی خنثا؛ در کنار شکوه دربار، ناامنی مرزی و خشونت داخلی هم ذکر شده — این مدخل هر دو را آورده تا تصویر یک‌سویه نشود.", "en": "The \"golden age\" framing here is Zarrinkoub's own narrative choice, not a neutral assessment; alongside courtly splendor he also notes border insecurity and domestic violence — this entry includes both so the picture isn't one-sided.", "nl": "Het \"gouden tijdperk\"-kader hier is Zarrinkoubs eigen narratieve keuze, geen neutrale beoordeling; naast hofse pracht vermeldt hij ook grensonveiligheid en binnenlands geweld — dit lemma neemt beide op zodat het beeld niet eenzijdig wordt."}}], "links": [{"to": "tarikh:abu-muslim-revolt", "rel": "prerequisite", "note": {"fa": "قیام سیاه‌جامگان همان نیرویی بود که بنیاد قدرت عباسیان شد", "en": "The black-banner revolt was the very force that became the foundation of Abbasid power", "nl": "De zwarte-vaandelopstand was precies de kracht die de basis werd van de Abbasidische macht"}}, {"to": "tarikh:tahirid-origins", "rel": "part-of", "note": {"fa": "خاستگاه طاهریان در همین عصر عباسی شکل گرفت", "en": "The Tahirids' origin took shape within this same Abbasid era", "nl": "De oorsprong van de Tahiriden nam vorm aan binnen datzelfde Abbasidische tijdperk"}}, {"to": "soc:abbasid-iranian-bureaucracy-viziers", "rel": "see-also", "note": {"fa": "دیوان‌سالاری ایرانیِ همین خلافت", "en": "The Iranian bureaucracy of this caliphate", "nl": "De Iraanse bureaucratie van dit kalifaat"}}, {"to": "soc:persian-culture-in-abbasid-caliphate", "rel": "see-also", "note": {"fa": "فرهنگ ایرانی در دربار عباسی", "en": "Persian culture at the Abbasid court", "nl": "Perzische cultuur aan het Abbasidische hof"}}, {"to": "soc:manji-golden-age-coexistence-narrative", "rel": "see-also", "note": {"fa": "مدخل هم‌موضوع", "en": "Related entry", "nl": "Verwant lemma"}}], "people": [], "sources": ["src:c182e55a07"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tarikh:iran-between-powers-1800-1828-mahmud", "kind": "concept", "title": {"fa": "ایران میان قدرت‌ها، ۱۸۰۰ تا ۱۸۲۸: عهدنامه‌ای که با دویست هزار تومان بازخرید شد", "en": "Iran between the powers, 1800–1828: the treaty bought back for 200,000 tomans", "nl": "Iran tussen de mogendheden, 1800–1828"}, "aliases": [], "parent": "tarikh:modern", "field": "tarikh:modern", "summary": {"fa": "در آغاز قرن نوزدهم ایران برای نخستین بار به بازی قدرت‌های اروپایی کشیده شد: ناپلئون راهی به هند می‌خواست، انگلیس سپری برای هند، و روسیه قفقاز را. محمود محمود در جلد اول اثر هشت‌جلدی‌اش سندهای این دوره را کنار هم می‌گذارد. روشن‌ترین نمونه عهدنامهٔ ۱۸۱۴ است: انگلیس وعدهٔ کمک در برابر حملهٔ اروپایی داد و چهارده سال بعد، وقتی ایران شکست‌خورده به آن نیاز داشت، همان وعده را با یک پرداخت نقدی از عهدنامه بیرون کشید.", "en": "At the start of the nineteenth century Iran was drawn for the first time into the game of the European powers: Napoleon wanted a road to India, Britain a shield for India, Russia the Caucasus. In the first of his eight volumes Mahmud Mahmud sets the documents of the period side by side. The clearest case is the 1814 treaty: Britain promised help against a European attack and, fourteen years later, when a defeated Iran needed it, bought that promise out of the treaty with a single cash payment.", "nl": "At the start of the nineteenth century Iran was drawn for the first time into the game of the European powers: Napoleon wanted a road to India, Britain a shield for India, Russia the Caucasus. In the first of his eight volumes Mahmud Mahmud sets the documents of the period side by side. The clearest case is the 1814 treaty: Britain promised help against a European attack and, fourteen years later, when a defeated Iran needed it, bought that promise out of the treaty with a single cash payment."}, "points": [{"text": {"fa": "کشیده شدن به بازی: به روایت محمود، تا ۱۷۹۹ نگرانی انگلیس در هند از افغان‌ها بود. از ۱۸۰۰، که ناپلئون و تزار پل اول از حمله به هند از راه ایران سخن گفتند، ایران ناخواسته وارد سیاست قدرت‌های اروپا شد. او می‌نویسد دربار فتحعلی‌شاه از اوضاع اروپا بی‌خبر بود و هر قدرتی با اندک پیشکشی آن را به سوی خود می‌کشید (ص ۳۶ تا ۴۰ فایل).", "en": "Drawn into the game: in Mahmud’s account, until 1799 Britain’s worry in India was the Afghans. From 1800, when Napoleon and Tsar Paul I spoke of attacking India through Iran, the country was pulled unwillingly into European power politics. He writes that Fath-Ali Shah’s court knew nothing of European affairs and that each power drew it to its side with small gifts (file pp. 36–40).", "nl": "Drawn into the game: in Mahmud’s account, until 1799 Britain’s worry in India was the Afghans. From 1800, when Napoleon and Tsar Paul I spoke of attacking India through Iran, the country was pulled unwillingly into European power politics. He writes that Fath-Ali Shah’s court knew nothing of European affairs and that each power drew it to its side with small gifts (file pp. 36–40)."}, "sources": ["src:5fcf217418"], "flags": []}, {"text": {"fa": "عهدنامهٔ ۱۸۱۴: کتاب متن عهدنامهٔ ۲۵ نوامبر ۱۸۱۴ تهران را می‌آورد. ایران پذیرفت پیمان‌هایش با دشمنان انگلیس را باطل بداند و راه هند را بر سپاه اروپایی ببندد. در برابر، انگلیس وعده داد اگر قدرتی اروپایی به ایران حمله کند، سپاه بفرستد یا سالانه دویست هزار تومان بدهد، به شرط آنکه ایران آغازگر جنگ نباشد. دربارهٔ جنگ ایران و افغان‌ها، انگلیس خود را بی‌طرف خواند (ص ۲۰۹ تا ۲۱۲ فایل).", "en": "The 1814 treaty: the book reproduces the Tehran treaty of 25 November 1814. Iran agreed to void its pacts with Britain’s enemies and to close the road to India to European armies. In return Britain promised, if a European power attacked Iran, to send troops or pay 200,000 tomans a year, provided Iran had not started the war. On any war between Iran and the Afghans, Britain declared itself neutral (file pp. 209–212).", "nl": "The 1814 treaty: the book reproduces the Tehran treaty of 25 November 1814. Iran agreed to void its pacts with Britain’s enemies and to close the road to India to European armies. In return Britain promised, if a European power attacked Iran, to send troops or pay 200,000 tomans a year, provided Iran had not started the war. On any war between Iran and the Afghans, Britain declared itself neutral (file pp. 209–212)."}, "sources": ["src:5fcf217418"], "flags": []}, {"text": {"fa": "خریدن تعهد: وقتی ایران در جنگ دوم با روسیه شکست خورد و باید غرامت ترکمانچای را می‌پرداخت، کمک وعده‌داده‌شده نرسید. کتاب سه سند از سال ۱۸۲۸ می‌آورد که در آنها عباس‌میرزا و سپس شاه، در برابر یک‌بار دریافت دویست هزار تومان برای پرداخت غرامت، دو مادهٔ کمک‌رسانی عهدنامه (۳ و ۴) را برای همیشه لغو می‌کنند (ص ۲۸۹ تا ۲۹۱ فایل).", "en": "Buying out the promise: when Iran lost its second war with Russia and had to pay the Turkmenchay indemnity, the promised help did not come. The book prints three documents from 1828 in which Abbas Mirza and then the Shah, in exchange for a single payment of 200,000 tomans towards the indemnity, cancel for ever the treaty’s two assistance articles (3 and 4) (file pp. 289–291).", "nl": "Buying out the promise: when Iran lost its second war with Russia and had to pay the Turkmenchay indemnity, the promised help did not come. The book prints three documents from 1828 in which Abbas Mirza and then the Shah, in exchange for a single payment of 200,000 tomans towards the indemnity, cancel for ever the treaty’s two assistance articles (3 and 4) (file pp. 289–291)."}, "sources": ["src:5fcf217418"], "flags": []}, {"text": {"fa": "ادعای بحث‌برانگیز نویسنده: محمود فراتر می‌رود و می‌گوید جنگ ایران و روس را خودِ انگلیس «پیش آورد» تا روسیه مشغول و ایران ناتوان شود، و ترکمانچای «استقلال ایران را به‌کلی از بین برد». برای بخش نخست سند مستقیمی در صفحه‌های خوانده‌شده نیامده و این داوری اوست. تاریخ‌نگاری‌های دیگر علت جنگ را بیشتر در اختلاف مرزی پس از گلستان و فشار داخلی برای جهاد می‌دانند. این ادعا را باید «مناقشه‌برانگیز» خواند، نه واقعیت.", "en": "The author’s contested claim: Mahmud goes further and says Britain itself “brought about” the Russo-Persian war to keep Russia busy and Iran weak, and that Turkmenchay “wholly destroyed Iran’s independence”. For the first part no direct document appears in the pages read; it is his judgement. Other histories locate the war’s causes more in the border disputes after Golestan and domestic pressure for jihad. The claim should be read as contested, not as fact.", "nl": "The author’s contested claim: Mahmud goes further and says Britain itself “brought about” the Russo-Persian war to keep Russia busy and Iran weak, and that Turkmenchay “wholly destroyed Iran’s independence”. For the first part no direct document appears in the pages read; it is his judgement. Other histories locate the war’s causes more in the border disputes after Golestan and domestic pressure for jihad. The claim should be read as contested, not as fact."}, "sources": ["src:5fcf217418"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "الگویی که می‌ماند: فارغ از داوری نویسنده، متن سندها یک چیز را نشان می‌دهد. تعهد یک قدرت بزرگ به کشور ضعیف‌تر مشروط نوشته می‌شود، در لحظهٔ نیاز تفسیر می‌شود، و سرانجام با پول نقد بازخرید می‌شود. این برداشت ویراستار است.", "en": "The pattern that remains: whatever one makes of the author’s verdicts, the documents show one thing. A great power’s commitment to a weaker state is written with conditions, interpreted at the moment of need, and finally bought back for cash. This is the editor’s reading.", "nl": "The pattern that remains: whatever one makes of the author’s verdicts, the documents show one thing. A great power’s commitment to a weaker state is written with conditions, interpreted at the moment of need, and finally bought back for cash. This is the editor’s reading."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "حدّ این کتاب و این مدخل: محمود محمود (نگارش ۱۳۲۸) روزنامه‌نگار و سیاستمدار ملی‌گرا بود و کتاب را آشکارا برای نشان دادن «آنچه در صد و پنجاه سال بر ملت ایران گذشت» نوشت. ارزش آن در سندهایی است که ترجمه و گردآوری کرده، بیشتر از منابع انگلیسی؛ داوری‌هایش یک‌سویه است. از ۴۰۲ صفحهٔ جلد اول، پیشگفتار، آغاز فصل اول، متن عهدنامهٔ ۱۸۱۴ و بخش لغو مواد ۳ و ۴ خوانده شد. اسکن کیفیت پایینی دارد و با OCR خوانده شده است؛ هفت جلد دیگر هنوز خوانده نشده.", "en": "Limits: Mahmud Mahmud (writing in 1949–50) was a nationalist journalist and politician who wrote openly to show “what befell the Iranian nation in a hundred and fifty years”. The value lies in the documents he translated and assembled, mostly from British sources; his verdicts are one-sided. Of the 402 pages of volume one, the preface, the opening of chapter one, the 1814 treaty text and the section on the cancelling of articles 3 and 4 were read. The scan is poor and was read by OCR; seven further volumes remain unread.", "nl": "Limits: Mahmud Mahmud (writing in 1949–50) was a nationalist journalist and politician who wrote openly to show “what befell the Iranian nation in a hundred and fifty years”. The value lies in the documents he translated and assembled, mostly from British sources; his verdicts are one-sided. Of the 402 pages of volume one, the preface, the opening of chapter one, the 1814 treaty text and the section on the cancelling of articles 3 and 4 were read. The scan is poor and was read by OCR; seven further volumes remain unread."}, "sources": [], "flags": ["editor-note"]}], "links": [{"to": "tarikh:constitutional-revolution-1906", "rel": "see-also", "note": {"fa": "مشروطه", "en": "The Constitutional Revolution", "nl": "The Constitutional Revolution"}}, {"to": "tarikh:oil-nationalisation-1953-coup", "rel": "see-also", "note": {"fa": "نفت و ۱۳۳۲", "en": "Oil and 1953", "nl": "Oil and 1953"}}, {"to": "tarikh:armenia-between-iran-and-rome", "rel": "see-also", "note": {"fa": "کشوری میان دو قدرت", "en": "A country between two powers", "nl": "A country between two powers"}}, {"to": "soc:darcy-concession-anglo-persian-oil", "rel": "see-also", "note": {"fa": "امتیاز دارسی", "en": "The D’Arcy concession", "nl": "The D’Arcy concession"}}, {"to": "soc:national-humiliation-anger", "rel": "see-also", "note": {"fa": "تحقیر ملی", "en": "National humiliation", "nl": "National humiliation"}}], "people": [], "sources": ["src:5fcf217418"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tarikh:anglo-russian-convention-1907-iran-not-told", "kind": "concept", "title": {"fa": "قرارداد ۱۹۰۷: تقسیم ایران بی‌خبر از ایران", "en": "The 1907 convention: Iran divided without being told", "nl": "De conventie van 1907: Iran verdeeld zonder het te weten"}, "aliases": [], "parent": "tarikh:modern", "field": "tarikh:modern", "summary": {"fa": "در تابستان ۱۹۰۷، وقتی ایران سرگرم مشروطه بود، بریتانیا و روسیه در پترزبورگ کشور را به سه بخش کردند: شمال برای امتیازهای روسیه، جنوب‌شرق برای بریتانیا و میانه برای هر دو. محمود محمود در جلد هشتم تاریخش متن قرارداد و واکنش مجلس را می‌آورد و نشان می‌دهد دولت ایران تا روز انتشار از آن بی‌خبر نگه داشته شد.", "en": "In the summer of 1907, while Iran was absorbed in its constitutional struggle, Britain and Russia at St Petersburg divided the country into three: the north for Russian concessions, the south-east for Britain and the middle for both. In volume eight of his history Mahmud Mahmud gives the text and the Majlis’s reaction and shows that Iran’s government was kept in the dark until publication.", "nl": "In the summer of 1907, while Iran was absorbed in its constitutional struggle, Britain and Russia at St Petersburg divided the country into three: the north for Russian concessions, the south-east for Britain and the middle for both. In volume eight of his history Mahmud Mahmud gives the text and the Majlis’s reaction and shows that Iran’s government was kept in the dark until publication."}, "points": [{"text": {"fa": "متن چه می‌گفت: به نقل محمود از متن فارسی قرارداد، بریتانیا پذیرفت در شمال خطی که از قصر شیرین و اصفهان و یزد به مرز شمال‌شرقی می‌رسد امتیاز تجاری یا سیاسی (راه‌آهن، بانک، تلگراف، بیمه و مانند آن) نخواهد، و روسیه همین را دربارهٔ جنوبِ خطی پذیرفت که از مرز افغانستان از بیرجند و کرمان به بندرعباس می‌رسد. میانهٔ کشور برای هر دو باز ماند. فصل‌های چهارم و پنجم درآمد گمرک‌ها را پشتوانهٔ وام‌های دو بانک روسی و انگلیسی نگه داشت و در صورت بدحسابی به دو دولت حق نظارت داد (فصل ۹۲).", "en": "What the text said: in the Persian text Mahmud reproduces, Britain agreed not to seek commercial or political concessions (railways, banks, telegraphs, insurance and the like) north of a line from Qasr-e Shirin through Isfahan and Yazd to the north-eastern frontier, and Russia accepted the same south of a line from the Afghan border through Birjand and Kerman to Bandar Abbas. The middle of the country stayed open to both. Articles four and five kept customs revenue as security for the loans of the Russian and British banks and gave the two governments a right of supervision in case of default (ch. 92).", "nl": "What the text said: in the Persian text Mahmud reproduces, Britain agreed not to seek commercial or political concessions (railways, banks, telegraphs, insurance and the like) north of a line from Qasr-e Shirin through Isfahan and Yazd to the north-eastern frontier, and Russia accepted the same south of a line from the Afghan border through Birjand and Kerman to Bandar Abbas. The middle of the country stayed open to both. Articles four and five kept customs revenue as security for the loans of the Russian and British banks and gave the two governments a right of supervision in case of default (ch. 92)."}, "sources": ["src:65bd3f5019"], "flags": []}, {"text": {"fa": "ایران بی‌خبر ماند: محمود می‌نویسد دولت ایران از گفت‌وگوها آگاه نبود و هر بار که از خبر روزنامه‌ها می‌پرسید، پاسخ آرام‌کننده می‌شنید. او روایت می‌کند که در ژوئن ۱۹۰۷ وزیر مختار ایران از سر ادوارد گری پرسید آیا کشور به منطقهٔ نفوذ تقسیم شده، و گری این برداشت را نادرست خواند. قرارداد در پایان اوت همان سال در پترزبورگ امضا شد، همان روزهایی که اتابک در برابر مجلس کشته شد (فصل ۹۲).", "en": "Iran was not told: Mahmud writes that the Iranian government was unaware of the talks and received soothing answers whenever it asked about press reports. He relates that in June 1907 Iran’s minister asked Sir Edward Grey whether the country had been divided into spheres of influence, and Grey called that reading incorrect. The convention was signed at St Petersburg at the end of August that year, in the very days the Atabak was killed outside the Majlis (ch. 92).", "nl": "Iran was not told: Mahmud writes that the Iranian government was unaware of the talks and received soothing answers whenever it asked about press reports. He relates that in June 1907 Iran’s minister asked Sir Edward Grey whether the country had been divided into spheres of influence, and Grey called that reading incorrect. The convention was signed at St Petersburg at the end of August that year, in the very days the Atabak was killed outside the Majlis (ch. 92)."}, "sources": ["src:65bd3f5019"], "flags": []}, {"text": {"fa": "ضربه به اعتماد: به نوشتهٔ محمود، مردم آن روز ایران بریتانیا را پشتیبان مشروطه و روسیه را دشمن ملت‌های کوچک می‌دانستند. انتشار خبر قرارداد «هیجانی» پدید آورد، انجمن‌ها در تهران تشکیل شد و نمایندگان مجلس «بهت‌زده» شدند. چهار روز پس از امضا، وزیر مختار بریتانیا در نامه‌ای رسمی کوشید توضیح دهد که مقصود تقسیم ایران نیست (فصل ۹۲).", "en": "A blow to trust: by Mahmud’s account Iranians of the day saw Britain as the patron of the constitution and Russia as the enemy of small nations. News of the convention caused a “commotion”, associations met in Tehran and deputies were “stunned”. Four days after the signature the British minister tried to explain in an official letter that the purpose was not the partition of Iran (ch. 92).", "nl": "A blow to trust: by Mahmud’s account Iranians of the day saw Britain as the patron of the constitution and Russia as the enemy of small nations. News of the convention caused a “commotion”, associations met in Tehran and deputies were “stunned”. Four days after the signature the British minister tried to explain in an official letter that the purpose was not the partition of Iran (ch. 92)."}, "sources": ["src:65bd3f5019"], "flags": []}, {"text": {"fa": "چرا بریتانیا چنین کرد: محمود قرارداد را در بازی بزرگ‌تر اروپا می‌نشاند. بریتانیا از قدرت‌گیری آلمان نگران بود، در ۱۹۰۴ با فرانسه کنار آمد و پس از شکست روسیه از ژاپن، روسیه را هم به سوی خود کشید. از نگاه او ایران بهای این آشتی بود. داوری‌های تندتر او، مثل اینکه بریتانیا ژاپن را «به دام انداخت» تا روسیه ضعیف شود، برداشت خود اوست و باید با تاریخ‌نگاری دیپلماتیک امروز سنجیده شود (فصل ۹۰ و ۹۲).", "en": "Why Britain did it: Mahmud sets the convention in the larger European game. Britain feared Germany’s rise, settled with France in 1904 and, after Russia’s defeat by Japan, drew Russia to its side as well. In his view Iran was the price of that reconciliation. His sharper judgements, such as that Britain “entrapped” Japan in order to weaken Russia, are his own and should be checked against present-day diplomatic history (chs. 90 and 92).", "nl": "Why Britain did it: Mahmud sets the convention in the larger European game. Britain feared Germany’s rise, settled with France in 1904 and, after Russia’s defeat by Japan, drew Russia to its side as well. In his view Iran was the price of that reconciliation. His sharper judgements, such as that Britain “entrapped” Japan in order to weaken Russia, are his own and should be checked against present-day diplomatic history (chs. 90 and 92)."}, "sources": ["src:65bd3f5019"], "flags": []}, {"text": {"fa": "درس برای امروز: سرنوشت کشور ضعیف گاهی در اتاقی بسته می‌شود که خودش در آن نیست، و حتی قدرتی که دوستِ آزادی‌خواهان به نظر می‌رسد منافع خودش را دنبال می‌کند. نتیجهٔ عملی این نیست که به هیچ‌کس نباید اعتماد کرد؛ این است که پشتیبانی بیرونی جای توان و آگاهی درونی را نمی‌گیرد. این برداشت ویراستار است.", "en": "A lesson for today: the fate of a weak country is sometimes settled in a room where it is not present, and even a power that seems a friend of the freedom movement pursues its own interests. The practical conclusion is not that no one can be trusted; it is that outside support does not replace domestic capacity and awareness. This is the editor’s reading.", "nl": "A lesson for today: the fate of a weak country is sometimes settled in a room where it is not present, and even a power that seems a friend of the freedom movement pursues its own interests. The practical conclusion is not that no one can be trusted; it is that outside support does not replace domestic capacity and awareness. This is the editor’s reading."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "حدّ این مدخل: فایل اسکن است و با نویسه‌خوانی خودکار خوانده شد؛ برای همین نام همهٔ نقطه‌های خط مرزی و شمارهٔ صفحه‌ها نیامده و تاریخ امضا به «پایان اوت ۱۹۰۷» گفته شده است. محمود با بدبینی آشکار به بریتانیا می‌نویسد. از ۳۹۶ صفحهٔ جلد هشتم، فهرست مطالب و حدود بیست صفحه از فصل ۹۲ خوانده شد.", "en": "Limits: the file is a scan read by OCR, so not every point on the boundary lines nor the page numbers are given, and the date of signature is stated as “the end of August 1907”. Mahmud writes with open distrust of Britain. Of the 396 pages of volume eight, the contents and about twenty pages of chapter 92 were read.", "nl": "Limits: the file is a scan read by OCR, so not every point on the boundary lines nor the page numbers are given, and the date of signature is stated as “the end of August 1907”. Mahmud writes with open distrust of Britain. Of the 396 pages of volume eight, the contents and about twenty pages of chapter 92 were read."}, "sources": [], "flags": ["editor-note"]}], "links": [{"to": "phil:talibov-1907-convention-and-ottoman-view", "rel": "see-also", "note": {"fa": "طالبوف و قرارداد ۱۹۰۷", "en": "Talibov on the 1907 convention", "nl": "Talibov on the 1907 convention"}}, {"to": "soc:constitution-and-great-power-pressure-qajar", "rel": "see-also", "note": {"fa": "مشروطه و فشار قدرت‌ها", "en": "The constitution and great-power pressure", "nl": "The constitution and great-power pressure"}}, {"to": "soc:hidden-hand-british-imperial-memory-iran", "rel": "see-also", "note": {"fa": "دست پنهان بریتانیا در حافظهٔ ایرانی", "en": "Britain’s hidden hand in Iranian memory", "nl": "Britain’s hidden hand in Iranian memory"}}, {"to": "tarikh:constitutional-revolution-1906", "rel": "see-also", "note": {"fa": "انقلاب مشروطه", "en": "The Constitutional Revolution", "nl": "The Constitutional Revolution"}}, {"to": "tarikh:telegraph-line-iran-1860s-wire-to-india", "rel": "see-also", "note": {"fa": "تلگراف و راه هند", "en": "The telegraph and the road to India", "nl": "The telegraph and the road to India"}}, {"to": "tarikh:iran-between-powers-1800-1828-mahmud", "rel": "see-also", "note": {"fa": "ایران میان قدرت‌ها", "en": "Iran between the powers", "nl": "Iran between the powers"}}], "people": [], "sources": ["src:65bd3f5019"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tarikh:shahr-i-sokhta-bronze-age-city", "kind": "concept", "title": {"fa": "شهر سوخته: شهری در سیستان، پنج هزار سال پیش", "en": "Shahr-i Sokhta: a city in Sistan, five thousand years ago", "nl": "Shahr-i Sokhta: een stad in Sistan"}, "aliases": [], "parent": "tarikh:ancient", "field": "tarikh:ancient", "summary": {"fa": "در دلتای هیرمند، جایی که امروز از خشک‌ترین گوشه‌های ایران است، در هزارهٔ سوم پیش از میلاد شهری بزرگ بود با محلهٔ صنعتگران، انبارهای مُهرشده و بازرگانی سنگ لاجورد تا میان‌رودان. سیدمنصور سیدسجادی، باستان‌شناسی که خود در کاوش‌های آن کار کرده، یافته‌ها را در یک گفتار گرد آورده است. این شهر نشان می‌دهد که شرق ایران حاشیهٔ تمدن نبوده است.", "en": "In the Helmand delta, today one of the driest corners of Iran, there stood in the third millennium BC a large city with a craftsmen’s quarter, sealed storerooms and a lapis lazuli trade reaching Mesopotamia. Seyyed Mansur Seyyed Sajjadi, an archaeologist who worked on its excavation, gathers the finds in one essay. The city shows that eastern Iran was no margin of civilisation.", "nl": "In the Helmand delta, today one of the driest corners of Iran, there stood in the third millennium BC a large city with a craftsmen’s quarter, sealed storerooms and a lapis lazuli trade reaching Mesopotamia. Seyyed Mansur Seyyed Sajjadi, an archaeologist who worked on its excavation, gathers the finds in one essay. The city shows that eastern Iran was no margin of civilisation."}, "points": [{"text": {"fa": "چهار دوره: باستان‌شناسان چهار دورهٔ سکونت را از هم جدا کرده‌اند. در کهن‌ترین لایه گل‌نوشته‌ای از نوع «آغاز ایلامی» پیدا شده که مانندش در تپه یحیی کرمان و گودین‌تپه نزدیک کنگاور هم هست. دوره‌های دوم و سوم، در میانهٔ عصر مفرغ، زمان شکوفایی و بیشترین گستردگی شهر است؛ کتاب دورهٔ دوم را ۲۷۰۰ تا ۲۵۰۰ پیش از میلاد می‌داند (ص ۲۵۴ و ۲۵۵ فایل).", "en": "Four periods: archaeologists separate four periods of settlement. In the oldest layer a “Proto-Elamite” tablet was found, like those from Tepe Yahya in Kerman and Godin Tepe near Kangavar. Periods two and three, in the middle Bronze Age, were the city’s flowering and greatest extent; the book dates period two to 2700–2500 BC (file pp. 254–255).", "nl": "Four periods: archaeologists separate four periods of settlement. In the oldest layer a “Proto-Elamite” tablet was found, like those from Tepe Yahya in Kerman and Godin Tepe near Kangavar. Periods two and three, in the middle Bronze Age, were the city’s flowering and greatest extent; the book dates period two to 2700–2500 BC (file pp. 254–255)."}, "sources": ["src:a29c19c377"], "flags": []}, {"text": {"fa": "خانه و کار: همهٔ خانه‌ها از خشت خام بود، با بام تخت از چوب و حصیر، و برای خانواده‌های هشت تا ده نفره. کار صنعتی نخست در خود خانه‌ها انجام می‌شد؛ با بزرگ شدن شهر در حدود ۲۵۰۰ پیش از میلاد به محله‌ای ویژه در غرب شهر رفت و سفالگری به بیرون شهر. نویسنده این را نشانهٔ دو شیوهٔ سازمان تولید در کنار هم می‌داند: کارگاه خانگی مستقل و کارگاه متمرکزِ زیر نظارت (ص ۲۵۵ تا ۲۵۸ و ۲۶۶ فایل).", "en": "House and work: every house was of mud brick, with a flat roof of timber and matting, built for families of eight to ten. Craft work was first done inside homes; as the city grew around 2500 BC it moved to a special quarter in the west, and pottery-making outside the city. The author reads this as two ways of organising production side by side: the independent household workshop and the supervised, concentrated one (file pp. 255–258, 266).", "nl": "House and work: every house was of mud brick, with a flat roof of timber and matting, built for families of eight to ten. Craft work was first done inside homes; as the city grew around 2500 BC it moved to a special quarter in the west, and pottery-making outside the city. The author reads this as two ways of organising production side by side: the independent household workshop and the supervised, concentrated one (file pp. 255–258, 266)."}, "sources": ["src:a29c19c377"], "flags": []}, {"text": {"fa": "بازرگانی: شهر سوخته جایی بود که سنگ لاجورد و عقیق از شرق می‌رسید، تراش می‌خورد و به سوی میان‌رودان می‌رفت (ص ۲۷۰ فایل).", "en": "Trade: Shahr-i Sokhta was where lapis lazuli and carnelian arrived from the east, were worked, and went on towards Mesopotamia (file p. 270).", "nl": "Trade: Shahr-i Sokhta was where lapis lazuli and carnelian arrived from the east, were worked, and went on towards Mesopotamia (file p. 270)."}, "sources": ["src:a29c19c377"], "flags": []}, {"text": {"fa": "زندگی کوتاه: گورستان شهر حدود ۲۵ هکتار است و دست‌کم ۲۵ هزار گور برای آن برآورد شده. بررسی استخوان‌ها مرگ‌ومیر بالای کودکان را نشان می‌دهد؛ میانگین سن مرگ برای مردان ۲۵ تا ۳۰ و برای زنان ۲۰ تا ۲۵ سال بوده و تنها چهار اسکلت مرد بالای چهل سال پیدا شده است (ص ۲۶۷ فایل).", "en": "Short lives: the cemetery covers about 25 hectares, with an estimated 25,000 graves at least. The bones show high child mortality; mean age at death was 25–30 for men and 20–25 for women, and only four male skeletons older than forty were found (file p. 267).", "nl": "Short lives: the cemetery covers about 25 hectares, with an estimated 25,000 graves at least. The bones show high child mortality; mean age at death was 25–30 for men and 20–25 for women, and only four male skeletons older than forty were found (file p. 267)."}, "sources": ["src:a29c19c377"], "flags": []}, {"text": {"fa": "حدّ این مدخل: کتاب در ۱۳۷۴ چاپ شده و کاوش‌های پس از آن در اینجا نیامده است. از ۴۴۱ صفحهٔ فایل، پیشگفتار، بخش‌هایی از گفتار پنجم (شهرنشینی) و گفتار ششم (آب) خوانده شد؛ گفتارهای جغرافیا، تاریخ پیش از اسلام و قوم کوچ خوانده نشد. متن از روی اسکن با OCR خوانده شده و چند عدد ناخوانا کنار گذاشته شد.", "en": "Limits: the book was published in 1995 and later excavations are not covered here. Of 441 file pages, the preface, parts of essay five (urbanism) and essay six (water) were read; the essays on geography, pre-Islamic history and the Kuch people were not. The text was read from a scan by OCR and a few illegible figures were left out.", "nl": "Limits: the book was published in 1995 and later excavations are not covered here. Of 441 file pages, the preface, parts of essay five (urbanism) and essay six (water) were read; the essays on geography, pre-Islamic history and the Kuch people were not. The text was read from a scan by OCR and a few illegible figures were left out."}, "sources": [], "flags": ["editor-note"]}], "links": [{"to": "soc:oil-fed-urbanisation-iran", "rel": "see-also", "note": {"fa": "شهرنشینی در ایران معاصر", "en": "Urbanisation in modern Iran", "nl": "Urbanisation in modern Iran"}}, {"to": "soc:baluchestan-1970s-witness-dowlatabadi", "rel": "see-also", "note": {"fa": "بلوچستان در دههٔ ۱۳۵۰", "en": "Baluchestan in the 1970s", "nl": "Baluchestan in the 1970s"}}], "people": [], "sources": ["src:a29c19c377"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tarikh:telegraph-line-iran-1860s-wire-to-india", "kind": "concept", "title": {"fa": "سیم تلگراف در ایران (دههٔ ۱۸۶۰): راه خبر به هند", "en": "The telegraph in Iran (1860s): the wire to India", "nl": "De telegraaf in Iran (jaren 1860): de draad naar India"}, "aliases": [], "parent": "tarikh:modern", "field": "tarikh:modern", "summary": {"fa": "تلگراف برای خود ایران کشیده نشد؛ بریتانیا راهی سریع به هند می‌خواست و ایران سر راه بود. محمود محمود در جلد سوم تاریخش، با نقل بلند از لرد کرزن، نشان می‌دهد این سیم هم ایران را به جهان پیوست و دست پایتخت را بر ولایات دراز کرد، و هم شبکه‌ای از مأموران انگلیسی را در شهرهای ایران نشاند.", "en": "The telegraph was not built for Iran’s sake; Britain wanted a fast route to India and Iran lay on the way. In volume three of his history Mahmud Mahmud, quoting Lord Curzon at length, shows that the wire both joined Iran to the world and lengthened the capital’s reach over the provinces, and planted a network of British officers in Iran’s towns.", "nl": "The telegraph was not built for Iran’s sake; Britain wanted a fast route to India and Iran lay on the way. In volume three of his history Mahmud Mahmud, quoting Lord Curzon at length, shows that the wire both joined Iran to the world and lengthened the capital’s reach over the provinces, and planted a network of British officers in Iran’s towns."}, "points": [{"text": {"fa": "چرا سیم از ایران گذشت: محمود از قول لرد کرزن می‌آورد که پس از شورش هند، بریتانیا به راهی سریع برای خبررسانی میان لندن و هند نیاز داشت و نخستین سیم زیردریایی از دریای سرخ ناکام ماند. به گفتهٔ کرزن، اگر ایران سر راه هند نبود، سال‌ها بی‌تلگراف می‌ماند. نخستین قرارداد تلگرافی ایران و بریتانیا در ۱۸۶۳ بسته شد و خط از خانقین به تهران و از آنجا به بوشهر رفت (فصل ۳۵، ص ۷۸۶ تا ۷۸۹ کتاب).", "en": "Why the wire crossed Iran: Mahmud quotes Lord Curzon that after the Indian Mutiny Britain needed a fast channel between London and India, and the first submarine cable through the Red Sea failed. In Curzon’s words, had Iran not lain on the road to India it would have waited years for a telegraph. The first Anglo-Persian telegraph convention was signed in 1863, and the line ran from Khanaqin to Tehran and on to Bushehr (ch. 35, book pp. 786–789).", "nl": "Why the wire crossed Iran: Mahmud quotes Lord Curzon that after the Indian Mutiny Britain needed a fast channel between London and India, and the first submarine cable through the Red Sea failed. In Curzon’s words, had Iran not lain on the road to India it would have waited years for a telegraph. The first Anglo-Persian telegraph convention was signed in 1863, and the line ran from Khanaqin to Tehran and on to Bushehr (ch. 35, book pp. 786–789)."}, "sources": ["src:b76e762861"], "flags": []}, {"text": {"fa": "قراردادها: به روایت کتاب، قرارداد ۱۸۶۵ سیم دومی را روی همان تیرها ویژهٔ پیام‌های خارجی گذاشت که کارکنان انگلیسی اداره‌اش می‌کردند و شمارشان نباید از پنجاه نفر می‌گذشت؛ یک سیم هم برای پیام‌های داخلی در دست دولت ایران ماند و سالانه مبلغی به خزانه می‌رسید. در ۱۸۷۰ خط شرکت «هند و اروپایی» میان لندن و تهران گشوده شد (ص ۷۸۹ تا ۷۹۱).", "en": "The agreements: by the book’s account the 1865 convention put a second wire on the same poles for foreign traffic, run by British staff who were not to exceed fifty; one wire for domestic messages stayed with the Iranian government, and a yearly sum reached the treasury. In 1870 the Indo-European company’s line between London and Tehran opened (pp. 789–791).", "nl": "The agreements: by the book’s account the 1865 convention put a second wire on the same poles for foreign traffic, run by British staff who were not to exceed fifty; one wire for domestic messages stayed with the Iranian government, and a yearly sum reached the treasury. In 1870 the Indo-European company’s line between London and Tehran opened (pp. 789–791)."}, "sources": ["src:b76e762861"], "flags": []}, {"text": {"fa": "چهار پیامد از نگاه کرزن (نوشتهٔ ۱۸۹۱، به نقل محمود): ایران با اروپا پیوند خورد و هر دو سو یکدیگر را شناختند؛ پایتخت توانست فرمانش را زود به ولایات دور برساند و شورش‌ها را زودتر سرکوب کند؛ مأموران انگلیسی تلگراف‌خانه در شهرها پناهگاه و مشاور حاکمان شدند؛ و آگاهی محلی آنان در مرزبندی‌ها به کار رفت، از جمله کار گلداسمید در مکران (ص ۷۹۳ تا ۷۹۶).", "en": "Four effects in Curzon’s eyes (written 1891, as quoted by Mahmud): Iran was tied to Europe and each side came to know the other; the capital could send orders quickly to distant provinces and put down revolts sooner; British telegraph officers in the towns became places of refuge and advisers to governors; and their local knowledge was used in boundary settlements, including Goldsmid’s work in Makran (pp. 793–796).", "nl": "Four effects in Curzon’s eyes (written 1891, as quoted by Mahmud): Iran was tied to Europe and each side came to know the other; the capital could send orders quickly to distant provinces and put down revolts sooner; British telegraph officers in the towns became places of refuge and advisers to governors; and their local knowledge was used in boundary settlements, including Goldsmid’s work in Makran (pp. 793–796)."}, "sources": ["src:b76e762861"], "flags": []}, {"text": {"fa": "داوری محمود: او این روایت خوش‌بینانه را نمی‌پذیرد و می‌نویسد گماشتن چند ده کارمند انگلیسی که خود را از هر نفوذ داخلی آزاد می‌دانستند «یک موضوع سیاسی» و بخشی از نقشهٔ نگهداری هند بود. به نوشتهٔ او، در ۱۳۰۹ خورشیدی دولت ایران مالک همهٔ خط‌ها شد و دست کارکنان انگلیسی کوتاه گشت (ص ۷۹۷ و ۷۹۸).", "en": "Mahmud’s verdict: he rejects this rosy account and writes that posting several dozen British employees who considered themselves free of any domestic authority was “a political matter”, part of the plan to protect India. By his account the Iranian government took ownership of all the lines in 1309 SH (1930–31) and the British staff withdrew (pp. 797–798).", "nl": "Mahmud’s verdict: he rejects this rosy account and writes that posting several dozen British employees who considered themselves free of any domestic authority was “a political matter”, part of the plan to protect India. By his account the Iranian government took ownership of all the lines in 1309 SH (1930–31) and the British staff withdrew (pp. 797–798)."}, "sources": ["src:b76e762861"], "flags": []}, {"text": {"fa": "درس امروزی: زیرساخت ارتباطی دو لبه دارد. همان سیمی که ایران را به جهان پیوست، به دولت مرکزی ابزار کنترل ولایات داد و به قدرت بیرونی شبکه‌ای از آدم و خبر در سراسر کشور. پرسش «مالک و ادارهٔ شبکه دست کیست» امروز دربارهٔ اینترنت هم همان‌قدر جدی است. این برداشت ویراستار است.", "en": "Today’s lesson: communication infrastructure cuts both ways. The same wire that joined Iran to the world gave the central state a tool to control the provinces and gave an outside power a network of people and information across the country. The question “who owns and runs the network” is just as serious for the internet today. This is the editor’s reading.", "nl": "Today’s lesson: communication infrastructure cuts both ways. The same wire that joined Iran to the world gave the central state a tool to control the provinces and gave an outside power a network of people and information across the country. The question “who owns and runs the network” is just as serious for the internet today. This is the editor’s reading."}, "sources": [], "flags": ["editor-note"]}, {"text": {"fa": "حدّ این مدخل: فایل اسکن است و با نویسه‌خوانی خودکار خوانده شد؛ برای همین عددهای ریز (مبلغ‌ها، مسافت‌ها) نیامده‌اند. بیشتر این فصل نقل از کتاب کرزن است، یعنی نگاه یک دولتمرد بریتانیایی، و محمود خود با بدبینی آشکار به بریتانیا می‌نویسد. از ۳۹۳ صفحهٔ جلد سوم فقط فهرست و صفحه‌های ۷۸۴ تا ۷۹۸ کتاب خوانده شد.", "en": "Limits: the file is a scan read by OCR, so fine figures (sums, distances) are left out. Most of this chapter is quotation from Curzon, the view of a British statesman, and Mahmud himself writes with open distrust of Britain. Of the 393 pages of volume three only the contents and book pp. 784–798 were read.", "nl": "Limits: the file is a scan read by OCR, so fine figures (sums, distances) are left out. Most of this chapter is quotation from Curzon, the view of a British statesman, and Mahmud himself writes with open distrust of Britain. Of the 393 pages of volume three only the contents and book pp. 784–798 were read."}, "sources": [], "flags": ["editor-note"]}], "links": [{"to": "tarikh:iran-between-powers-1800-1828-mahmud", "rel": "see-also", "note": {"fa": "جلد اول همین کتاب", "en": "Volume one of the same work", "nl": "Volume one of the same work"}}, {"to": "soc:darcy-concession-anglo-persian-oil", "rel": "see-also", "note": {"fa": "امتیاز دارسی", "en": "The D’Arcy concession", "nl": "The D’Arcy concession"}}, {"to": "tarikh:constitutional-revolution-1906", "rel": "see-also", "note": {"fa": "مشروطه", "en": "The Constitutional Revolution", "nl": "The Constitutional Revolution"}}, {"to": "phil:kasravi-two-tracks-of-progress", "rel": "see-also", "note": {"fa": "کسروی و پیشرفت", "en": "Kasravi on progress", "nl": "Kasravi on progress"}}, {"to": "tarikh:afghanistan-1919-1945-pashtun-card-great-powers", "rel": "see-also", "note": {"fa": "افغانستان و قدرت‌ها", "en": "Afghanistan and the powers", "nl": "Afghanistan and the powers"}}], "people": [], "sources": ["src:b76e762861"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tarikh:tarikh", "kind": "root", "title": {"fa": "تاریخ و ایران‌شناسی", "en": "History & Iranology", "nl": "Geschiedenis & Iranologie"}, "aliases": ["تاریخ ایران", "ایران‌شناسی"], "parent": null, "field": null, "summary": {"fa": "چه شد که این‌طور شد؟ بزرگ‌ترین قفسهٔ مخزن دانش‌سرا (۲۸۲ کتاب) همین پرسش را دنبال می‌کند: تاریخ سیاسی و اجتماعی ایران، باستان‌شناسی، و تاریخ جهان در پیوند با آن. این ویکی تازه‌ساز است و تا الان با سه جلد (از هفت) یک اثر کلاسیک شروع شده؛ بقیهٔ مخزن هنوز خوانده نشده.", "en": "What happened, and why? The largest shelf in Daneshsara's library (282 books) follows exactly this question: Iran's political and social history, archaeology, and world history in connection with it. This wiki is brand new, started so far from three volumes (of seven) of one classic work; the rest of the shelf is still unread.", "nl": "Wat is er gebeurd, en waarom? De grootste plank in Daneshsara's bibliotheek (282 boeken) volgt precies deze vraag: Iran's politieke en sociale geschiedenis, archeologie, en wereldgeschiedenis in verband daarmee. Deze wiki is nieuw en begon tot nu toe met drie delen (van zeven) van één klassiek werk; de rest van de plank is nog ongelezen."}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tarikh:sources-early-islamic-iran-zarrinkoub", "kind": "concept", "title": {"fa": "منابع تاریخ ایران در سده‌های نخست اسلامی: سنجش زرین‌کوب", "en": "Sources for early Islamic Iran: Zarrinkoub's assessment", "nl": "Sources for early Islamic Iran: Zarrinkoub's assessment"}, "aliases": [], "parent": "tarikh:early-islamic", "field": "tarikh:early-islamic", "summary": {"fa": "زرین‌کوب پیش از روایت تاریخ، منابع را می‌سنجد: روایت‌های فتوح قبیله‌ای و گزافه‌آمیزند ولی ناگزیر، طبری گردآورنده است نه منتقد، ابن‌اثیر و مسکویه نقادترند، و تاریخ‌های عمومی فارسی متأخر را باید با احتیاط خواند.", "en": "Before narrating, Zarrinkoub weighs the sources: conquest reports are tribal and inflated yet unavoidable, al-Tabari compiles rather than criticises, Ibn al-Athir and Miskawayh are more critical, and later Persian general histories need caution.", "nl": "Before narrating, Zarrinkoub weighs the sources."}, "points": [{"text": {"fa": "زرین‌کوب می‌گوید خبرهای فتوح از روایت‌های شفاهی قبیله‌های عرب آمده و آمیخته به تفاخر قبیله‌ای و هواداری از کوفیان است؛ پس همیشه در معرض تحریف و گزافه است. با این همه «چاره‌ای جز استفاده از این روایات نیست»، چون تنها مأخذ مورخان بعدی همین‌هاست (ص ۱۹).", "en": "Zarrinkoub notes that conquest reports derive from oral traditions of Arab tribes, coloured by tribal boasting and partiality toward the Kufans, hence always open to distortion and exaggeration. Yet 'there is no choice but to use these reports', as they are the only source later historians had (p. 19).", "nl": "Zarrinkoub notes that conquest reports derive from oral traditions of Arab tribes, coloured by tribal boasting and partiality toward the Kufans, hence always open to distortion and exaggeration. Yet 'there is no choice but to use these reports', as they are the only source later historians had (p. 19)."}, "sources": ["src:12a047ab10"], "flags": []}, {"text": {"fa": "کتاب‌های سدهٔ دوم و سوم بیشتر از میان رفته و فقط در نقل دیگران مانده است. برای عراق ابومخنف و برای خراسان و فارس مدائنی آگاه‌ترین راوی بودند؛ زرین‌کوب روایت مدائنی را دقیق می‌داند و می‌گوید پژوهش جدید درستی بسیاری از آن را تأیید کرده است (ص ۱۹–۲۱).", "en": "The books of the 2nd–3rd Islamic centuries are mostly lost and survive only in later quotation. Abu Mikhnaf was best informed on Iraq and al-Mada'ini on Khurasan and Fars; Zarrinkoub rates al-Mada'ini's reports as careful and says modern research has confirmed many of them (pp. 19–21).", "nl": "The books of the 2nd–3rd Islamic centuries are mostly lost and survive only in later quotation. Abu Mikhnaf was best informed on Iraq and al-Mada'ini on Khurasan and Fars; Zarrinkoub rates al-Mada'ini's reports as careful and says modern research has confirmed many of them (pp. 19–21)."}, "sources": ["src:12a047ab10"], "flags": []}, {"text": {"fa": "بلاذری نخستین مورخی است که اثر عمده‌اش دربارهٔ فتوح به دست ما رسیده است. فارسی می‌دانست و «فتوح‌البلدان» او برای جزیه، خراج، سکه و به‌ویژه برگرداندن دیوان از فارسی به عربی آگاهی ارزشمند دارد (ص ۲۱).", "en": "Al-Baladhuri is the first historian whose main work on the conquests survives. He knew Persian, and his Futuh al-Buldan gives valuable information on poll-tax, land-tax, coinage and especially the change of the chancery from Persian to Arabic (p. 21).", "nl": "Al-Baladhuri is the first historian whose main work on the conquests survives. He knew Persian, and his Futuh al-Buldan gives valuable information on poll-tax, land-tax, coinage and especially the change of the chancery from Persian to Arabic (p. 21)."}, "sources": ["src:12a047ab10"], "flags": []}, {"text": {"fa": "طبری مهم‌ترین مجموعه است، اما هدفش گردآوری همهٔ روایت‌ها بود نه سنجش آن‌ها؛ عین روایت‌ها را کنار هم آورده و هرچه به روزگار خودش نزدیک‌تر می‌شود کوتاه‌تر می‌نویسد. ترجمهٔ بلعمی سندها و روایت‌های موازی را حذف کرد و سال‌ها اصل کتاب را نزد فارسی‌زبانان از یاد برد (ص ۲۳–۲۴).", "en": "Al-Tabari is the most important compilation, but his aim was to gather all reports, not to weigh them; he sets them side by side and grows briefer as he nears his own time. Bal'ami's Persian version dropped the chains of transmission and parallel reports and for long eclipsed the original among Persian readers (pp. 23–24).", "nl": "Al-Tabari is the most important compilation, but his aim was to gather all reports, not to weigh them; he sets them side by side and grows briefer as he nears his own time. Bal'ami's Persian version dropped the chains of transmission and parallel reports and for long eclipsed the original among Persian readers (pp. 23–24)."}, "sources": ["src:12a047ab10"], "flags": []}, {"text": {"fa": "ابن‌اثیر به داوری زرین‌کوب دقتی «بی‌نظیر» در میان مورخان آن روزگار دارد: روایت‌ها را می‌سنجد و جایی که ترجیح ممکن نیست هر دو را می‌آورد. نمونه‌اش این‌که گزارش او از برخورد مسلمانان با چین با منابع چینی می‌خواند، هرچند در هیچ مأخذ عربی کهن‌تری نیست (ص ۲۴–۲۵).", "en": "Ibn al-Athir, in Zarrinkoub's judgement, shows a care 'unmatched' among historians of his age: he compares reports and gives both where he cannot choose. His account of Muslim–Chinese clashes matches Chinese sources though found in no older Arabic source (pp. 24–25).", "nl": "Ibn al-Athir, in Zarrinkoub's judgement, shows a care 'unmatched' among historians of his age: he compares reports and gives both where he cannot choose. His account of Muslim–Chinese clashes matches Chinese sources though found in no older Arabic source (pp. 24–25)."}, "sources": ["src:12a047ab10"], "flags": []}, {"text": {"fa": "مسعودی و مسکویه دو استثنای نقادند. مسکویه در پی علت رویدادها می‌رود، روایت‌های افسانه‌ای و معجزه‌ها را از تاریخ کنار می‌گذارد و برای آل‌بویه مأخذ دست‌اول است، چون خازن کتابخانهٔ عضدالدوله بود (ص ۲۵–۲۷).", "en": "Al-Mas'udi and Miskawayh are two critical exceptions. Miskawayh seeks the causes of events, sets aside legendary reports and miracles as outside history, and is a first-hand source for the Buyids, having been librarian to 'Adud al-Dawla (pp. 25–27).", "nl": "Al-Mas'udi and Miskawayh are two critical exceptions. Miskawayh seeks the causes of events, sets aside legendary reports and miracles as outside history, and is a first-hand source for the Buyids, having been librarian to 'Adud al-Dawla (pp. 25–27)."}, "sources": ["src:12a047ab10"], "flags": []}, {"text": {"fa": "دربارهٔ تاریخ‌های عمومی فارسی سخت‌گیر است: پرشمارند ولی به غنای عربی‌ها نیستند، بخش‌های پیش از روزگار مؤلف اغلب رونویسی بی‌دقت است و نثر مصنوع فایده را کم می‌کند، به‌ویژه پس از مغول و تیموریان. با این حال برای روزگار خودِ مؤلف مرجع عمده‌اند (ص ۲۸–۳۰).", "en": "He is severe on Persian general histories: numerous but less rich than the Arabic, their pre-author sections often careless copying, their ornate prose reducing usefulness, especially after the Mongols and Timurids. Still, for the author's own time they are principal sources (pp. 28–30).", "nl": "He is severe on Persian general histories: numerous but less rich than the Arabic, their pre-author sections often careless copying, their ornate prose reducing usefulness, especially after the Mongols and Timurids. Still, for the author's own time they are principal sources (pp. 28–30)."}, "sources": ["src:12a047ab10"], "flags": []}, {"text": {"fa": "نمونهٔ دست‌کاری: هدایت در «روضة‌الصفای ناصری» گناه فرستادهٔ شاه‌عباس را چنین می‌نویسد که چند فرنگیِ مایل به اسلام را رماند. در «عالم‌آرای عباسی»، که مأخذ اوست، ماجرا وارونه است: بدرفتاری او چند همراه ایرانی را به مسیحی شدن و ماندن در فرنگ کشاند (ص ۲۹).", "en": "A case of tampering: Hedayat's continuation of Rawzat al-Safa says a Safavid envoy's sin was to drive away some Europeans inclined to Islam. In his source, the 'Alam-ara-yi 'Abbasi, it is the reverse: his ill-treatment drove several Iranian companions to turn Christian and stay in Europe (p. 29).", "nl": "A case of tampering: Hedayat's continuation of Rawzat al-Safa says a Safavid envoy's sin was to drive away some Europeans inclined to Islam. In his source, the 'Alam-ara-yi 'Abbasi, it is the reverse: his ill-treatment drove several Iranian companions to turn Christian and stay in Europe (p. 29)."}, "sources": ["src:12a047ab10"], "flags": []}, {"text": {"fa": "گردیزی (زین‌الاخبار) برای خراسان، سامانیان و غزنویان با همهٔ کوتاهی معتبر است، چون بر «اخبار خراسان» سلامی تکیه دارد که مأخذ ابن‌اثیر هم بود (ص ۳۰–۳۱).", "en": "Gardizi's Zayn al-Akhbar, brief as it is, is reliable for Khurasan, the Samanids and Ghaznavids, resting on al-Sallami's lost history of Khurasan, also Ibn al-Athir's source (pp. 30–31).", "nl": "Gardizi's Zayn al-Akhbar, brief as it is, is reliable for Khurasan, the Samanids and Ghaznavids, resting on al-Sallami's lost history of Khurasan, also Ibn al-Athir's source (pp. 30–31)."}, "sources": ["src:12a047ab10"], "flags": []}, {"text": {"fa": "این مدخل از صفحه‌های ۱۹ تا ۳۱ بخش «در باب مآخذ» است؛ این بخش تا حدود صفحهٔ ۱۰۰ ادامه دارد و هنوز خوانده نشده. متن از روی اسکن خوانده شده و برخی سال‌های وفات در آن ناخوانا بود، برای همین سال‌ها را نیاورده‌ام. داوری‌های زرین‌کوب مربوط به پژوهش میانهٔ سدهٔ بیستم است و بحث‌های تازه‌تر دربارهٔ اعتبار روایت‌های فتوح را ندارد.", "en": "This entry covers pp. 19–31 of the section 'On the sources', which runs to about p. 100 and is not yet read. The text was read from a scan with some death-dates illegible, so dates are omitted. Zarrinkoub's judgements reflect mid-20th-century scholarship and lack more recent debates on the reliability of conquest narratives.", "nl": "This entry covers pp. 19–31 of the section 'On the sources', which runs to about p. 100 and is not yet read. The text was read from a scan with some death-dates illegible, so dates are omitted. Zarrinkoub's judgements reflect mid-20th-century scholarship and lack more recent debates on the reliability of conquest narratives."}, "sources": ["src:12a047ab10"], "flags": ["editor-note", "dated"]}], "links": [{"to": "tarikh:arab-conquest-iran", "rel": "explains", "note": {"fa": "خبرهای فتح از کجا می‌آید", "en": "where the conquest reports come from", "nl": "where the conquest reports come from"}}, {"to": "soc:jasemi-arab-conquest-iran-resistance-narrative", "rel": "see-also", "note": {"fa": "روایتی دیگر بر پایهٔ همین منابع", "en": "another narrative built on the same sources", "nl": "another narrative built on the same sources"}}, {"to": "soc:early-islamic-iran-continuity-debate", "rel": "see-also", "note": {"fa": "بحث گسست یا پیوستگی", "en": "the rupture-or-continuity debate", "nl": "the rupture-or-continuity debate"}}, {"to": "tarikh:tahirid-origins", "rel": "see-also", "note": {"fa": "خراسان و طاهریان", "en": "Khurasan and the Tahirids", "nl": "Khurasan and the Tahirids"}}, {"to": "soc:historical-memory-as-popular-history", "rel": "bridges", "note": {"fa": "حافظهٔ تاریخی و تاریخ عامه", "en": "historical memory and popular history", "nl": "historical memory and popular history"}}, {"to": "tarikh:early-islamic", "rel": "see-also", "note": {"fa": "مدخل هم‌موضوع", "en": "Related entry", "nl": "Verwant lemma"}}], "people": [], "sources": ["src:12a047ab10"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tarikh:akhal-treaty-1881-iran-russia-turkmen-border", "kind": "concept", "title": {"fa": "قرارنامهٔ آخال (۱۸۸۱): مرز ایران و روسیه در شرق خزر", "en": "The Akhal convention (1881): the Iran–Russia border east of the Caspian", "nl": "De Achal-conventie (1881): de grens tussen Iran en Rusland ten oosten van de Kaspische Zee"}, "aliases": [], "parent": "tarikh:neighbours", "field": "tarikh:neighbours", "summary": {"fa": "در ۱۸۸۱، پس از آنکه روسیه ترکمن‌های آخال را شکست داد، ایران و روسیه در تهران مرز شرق دریای خزر را کشیدند. ایران از ادعای خود بر مرو گذشت و چند تعهد دربارهٔ آب، سلاح و مأموران مرزی روس پذی
