.ev{font-size:var(--chip);padding:1px 8px;border-radius:var(--r-full);border:1px solid var(--line-strong);color:var(--ink-2)} .ev.t1{border-color:#2F7D4F;color:#2F7D4F} .ev.t2{border-color:#3C6EA8;color:#3C6EA8} .ev.t3{border-color:#8A6D1D;color:#8A6D1D} .ev.t4,.ev.t0{border-color:#8A2E2E;color:#8A2E2E}

:root[data-theme=dark] .flag.unreplicated{background:#3A1F1F;color:#F2B8B8;border-color:#6B3A3A} :root[data-theme=dark] .flag.contested,:root[data-theme=dark] .draft{background:#3A3010;color:#F0D78A;border-color:#6B5A2A}

<script>
const D = {"wiki": "tarikh", "order": ["tarikh:early-islamic"], "concepts": [{"id": "tarikh:tahirid-origins", "kind": "concept", "title": {"fa": "خاستگاه طاهریان: از پوشنگ تا درگاه مأمون", "en": "The origin of the Tahirids: from Pushang to Ma'mun's court", "nl": "De oorsprong van de Tahiriden: van Pushang tot het hof van al-Ma'mun"}, "aliases": ["طاهر بن حسین", "بیت‌النار", "خاندان طاهری"], "parent": "tarikh:early-islamic", "field": "tarikh:early-islamic", "summary": {"fa": "نیاکان طاهر بن حسین — بنیان‌گذار حکومت طاهریان، نخستین سلسلهٔ نیمه‌مستقل ایرانی پس از اسلام — از مردم پوشنگِ خراسان بودند و نسل به نسل در خدمت خلافت عباسی بالا آمدند؛ نسبشان به قبیلهٔ عرب خزاعه از راه «مولات» (پیوند غیرخویشاوندی) بود، نه خون. اعراب از سر طعنه آن‌ها را «بیت‌النار» (زادهٔ آتشکده) می‌خواندند.", "en": "The ancestors of Tahir ibn al-Husayn — founder of the Tahirid state, the first semi-independent Persian dynasty after Islam — were from Pushang in Khorasan and rose generation by generation in the service of the Abbasid caliphate; their lineage to the Arab tribe of Khuza'a was through \"mawala\" (a non-kinship bond), not blood. Arabs mockingly called them \"Bayt al-Nar\" (house of the fire-temple).", "nl": "De voorouders van Tahir ibn al-Husayn — grondlegger van de Tahiridenstaat, de eerste semi-onafhankelijke Perzische dynastie na de islam — kwamen uit Pushang in Khorasan en klommen generatie na generatie op in dienst van het Abbasidische kalifaat; hun afstamming tot de Arabische stam Khuza'a liep via \"mawala\" (een niet-bloedverwantschapsband), niet via bloed. Arabieren noemden hen spottend \"Bayt al-Nar\" (huis van de vuurtempel)."}, "points": [{"text": {"fa": "جدِ طاهر، رزیق بن اسعد، در عهد خلیفه مهدی در پوشنگ (نزدیک هرات) می‌زیست و از راه «مولات» با قبیلهٔ عرب خزاعه پیوند یافت — ازین‌رو فرزندانش به خزاعه منسوب شدند، هرچند نسب خونی نبود.", "en": "Tahir's forefather, Ruzayq ibn As'ad, lived in Pushang (near Herat) during Caliph Mahdi's reign and formed a \"mawala\" bond with the Arab tribe of Khuza'a — which is why his descendants came to be attributed to Khuza'a, though it was not a blood lineage.", "nl": "Tahirs voorvader, Ruzayq ibn As'ad, leefde in Pushang (bij Herat) tijdens het bewind van kalief Mahdi en vormde een \"mawala\"-band met de Arabische stam Khuza'a — daarom werden zijn nakomelingen toegeschreven aan Khuza'a, hoewel het geen bloedlijn was."}, "sources": ["src:c182e55a07"], "flags": []}, {"text": {"fa": "پسرش حسین بن مصعب، پدر طاهر، در دورهٔ هارون‌الرشید فرمانروای پوشنگ بود و در زمان اقامت مأمون در خراسان نیز در درگاه او حضور داشت. چون حسین در سال ۱۹۹ هجری درگذشت، خودِ مأمون بر جنازه‌اش حاضر شد و برای طاهر — که در عراق بود — پیک تسلیت فرستاد.", "en": "His son Husayn ibn Mus'ab, Tahir's father, was ruler of Pushang under Harun al-Rashid and was also present at Ma'mun's court during Ma'mun's stay in Khorasan. When Husayn died in 199 AH, Ma'mun himself attended the funeral and sent a messenger of condolence to Tahir, who was in Iraq at the time.", "nl": "Zijn zoon Husayn ibn Mus'ab, Tahirs vader, was heerser van Pushang onder Harun al-Rashid en was ook aanwezig aan het hof van al-Ma'mun tijdens diens verblijf in Khorasan. Toen Husayn stierf in 199 AH, woonde al-Ma'mun zelf de begrafenis bij en stuurde een condoleancebode naar Tahir, die op dat moment in Irak verbleef."}, "sources": ["src:c182e55a07"], "flags": []}, {"text": {"fa": "با این پیشینهٔ نسلی در خدمت خلافت، اعراب از سر طعنه آنان را «بیت‌النار» یعنی «زادهٔ آتشکده» می‌خواندند — اشاره‌ای تحقیرآمیز به ریشهٔ ایرانی و زرتشتی خاندان، در حالی که آن خاندان خود را دیگر بخشی از نظام عربی-اسلامی خلافت می‌دانست.", "en": "Given this generational record of service to the caliphate, Arabs mockingly called them \"Bayt al-Nar\" — \"house of the fire-temple\" — a derisive jab at the family's Persian and Zoroastrian roots, even as the family itself had come to see itself as part of the caliphate's Arab-Islamic order.", "nl": "Gezien deze generaties lange dienst aan het kalifaat noemden Arabieren hen spottend \"Bayt al-Nar\" — \"huis van de vuurtempel\" — een honende steek naar de Perzische en Zoroastrische wortels van de familie, ook al zag de familie zichzelf inmiddels als onderdeel van de Arabisch-islamitische orde van het kalifaat."}, "sources": ["src:c182e55a07"], "flags": ["editor-note"], "note": {"fa": "این لقب طعنه‌آمیز نمونهٔ خوبی از تنش قومی/مذهبی پنهان زیر ظاهر یکپارچگی خلافت عباسی است — موضوعی که می‌تواند به ویکی جامعه (هویت، طبقه) پیوند بخورد، اما این مدخل هنوز به آن پیوند نخورده.", "en": "This mocking epithet is a good example of the ethnic/religious tension hidden beneath the surface unity of the Abbasid caliphate — a topic that could connect to the sociology wiki (identity, status), though this entry is not yet cross-linked there.", "nl": "Deze spottende bijnaam is een goed voorbeeld van de etnische/religieuze spanning verborgen onder de oppervlakte-eenheid van het Abbasidische kalifaat — een onderwerp dat zou kunnen aansluiten bij de sociologiewiki (identiteit, status), al is dit lemma daar nog niet aan gekoppeld."}}], "links": [{"to": "tarikh:abbasid-golden-age", "rel": "part-of", "note": {"fa": "خاستگاه طاهریان در دل همان دستگاه خلافت عباسی شکل گرفت", "en": "The Tahirids' origin took shape within that same Abbasid caliphal apparatus", "nl": "De oorsprong van de Tahiriden nam vorm aan binnen datzelfde Abbasidische kalifale apparaat"}}, {"to": "soc:early-islamic-iran-revolts-local-dynasties", "rel": "part-of", "note": {"fa": "طاهریان در میان حکومت‌های محلی ایران", "en": "The Tahirids among Iran's local dynasties", "nl": "De Tahiriden tussen de lokale dynastieën van Iran"}}], "people": [], "sources": ["src:c182e55a07"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tarikh:abbasid-golden-age", "kind": "concept", "title": {"fa": "عصر طلایی عباسی و دنیای هزار و یک شب", "en": "The Abbasid golden age and the world of 1001 Nights", "nl": "Het Abbasidische gouden tijdperk en de wereld van 1001 Nachten"}, "aliases": ["دنیای هزار و یک شب", "خلافت عباسی", "عهد مهدی و هارون"], "parent": "tarikh:early-islamic", "field": "tarikh:early-islamic", "summary": {"fa": "عباسیان، برخلاف امویان، حکومتی بر پایهٔ سیادت قومی عرب نساختند؛ قدرتشان را بر سیاه‌جامگان و خراسانیان استوار کردند و مرکز را به عراق — نزدیک جای پیشین تیسفون — بردند. دورهٔ مهدی و هارون‌الرشید، با شکوه دربار و زمینهٔ افسانه‌های هزار و یک شب، همراه بود، اما همان‌زمان نیز جنگ و ناامنی مرزی ادامه داشت.", "en": "Unlike the Umayyads, the Abbasids did not build their rule on Arab tribal supremacy; they based their power on the black-banner troops and Khorasanians, and moved the center to Iraq — near the old site of Ctesiphon. The era of Mahdi and Harun al-Rashid brought a splendid court and the backdrop for the 1001 Nights tales, even as border wars and insecurity continued.", "nl": "In tegenstelling tot de Omajjaden bouwden de Abbasiden hun heerschappij niet op Arabische stammenheerschappij; ze baseerden hun macht op de zwarte-vaandeltroepen en Khorasaniërs, en verplaatsten het centrum naar Irak — dicht bij de oude plek van Ctesiphon. Het tijdperk van Mahdi en Harun al-Rashid bracht een schitterend hof en de achtergrond voor de verhalen van 1001 Nachten, zelfs terwijl grensoorlogen en onveiligheid voortduurden."}, "points": [{"text": {"fa": "هدف عباسیان برخلاف امویان، ایجاد دولتی بود که غیرعرب نیز مانند عرب از حقوق و مزایا بهره‌مند باشد؛ قدرت خلیفه به‌ویژه در آغاز بیشتر بر نیروی سیاه‌جامگان و خراسانیان تکیه داشت، نه بر تعصب قومی عربی. مرکز خلافت نیز به عراق منتقل شد — همان‌جا که شاهنشاهی ساسانی مرکز داشت.", "en": "Unlike the Umayyads, the Abbasids' aim was a state in which non-Arabs would enjoy the same rights as Arabs; caliphal power, especially at the outset, rested chiefly on the black-banner troops and Khorasanians rather than Arab tribal partisanship. The caliphate's center also moved to Iraq — the very region where the Sasanian empire had been centered.", "nl": "In tegenstelling tot de Omajjaden was het doel van de Abbasiden een staat waarin niet-Arabieren dezelfde rechten zouden genieten als Arabieren; de kalifale macht, vooral in het begin, rustte vooral op de zwarte-vaandeltroepen en Khorasaniërs, niet op Arabisch stammenpartijdigheid. Het centrum van het kalifaat verhuisde ook naar Irak — precies de regio waar het Sassanidische rijk gecentreerd was geweest."}, "sources": ["src:c182e55a07"], "flags": []}, {"text": {"fa": "دوران مهدی و به‌خصوص هارون‌الرشید با شکوه دربار چنان شهرت یافت که زمینهٔ افسانه‌های هزار و یک شب شد. با این‌همه، همین دوره دنیای جنگ و جهاد نیز بود — جهاد در مرز روم، هند، دیلم و خزر — و «مطوعه» (رزمندگان داوطلب) در زمان صلح غالباً خودسر می‌ماندند و ناامنی شهر را دامن می‌زدند.", "en": "The era of Mahdi, and especially Harun al-Rashid, became so famed for the splendor of the court that it became the backdrop for the 1001 Nights tales. Yet the same period was also a world of war and jihad — on the frontiers with Byzantium, India, Daylam and the Khazars — and the \"mutawwi'a\" (volunteer fighters) often grew unruly in peacetime, feeding urban insecurity.", "nl": "Het tijdperk van Mahdi, en vooral Harun al-Rashid, werd zo beroemd om de pracht van het hof dat het de achtergrond werd voor de verhalen van 1001 Nachten. Toch was dezelfde periode ook een wereld van oorlog en jihad — aan de grenzen met Byzantium, India, Daylam en de Khazaren — en de \"mutawwi'a\" (vrijwillige strijders) werden in vredestijd vaak onhandelbaar, wat onveiligheid in de stad voedde."}, "sources": ["src:c182e55a07"], "flags": ["editor-note"], "note": {"fa": "تصویر «عصر طلایی» در این متن خودِ روایتِ زرین‌کوب است، نه یک ارزیابی خنثا؛ در کنار شکوه دربار، ناامنی مرزی و خشونت داخلی هم ذکر شده — این مدخل هر دو را آورده تا تصویر یک‌سویه نشود.", "en": "The \"golden age\" framing here is Zarrinkoub's own narrative choice, not a neutral assessment; alongside courtly splendor he also notes border insecurity and domestic violence — this entry includes both so the picture isn't one-sided.", "nl": "Het \"gouden tijdperk\"-kader hier is Zarrinkoubs eigen narratieve keuze, geen neutrale beoordeling; naast hofse pracht vermeldt hij ook grensonveiligheid en binnenlands geweld — dit lemma neemt beide op zodat het beeld niet eenzijdig wordt."}}], "links": [{"to": "tarikh:abu-muslim-revolt", "rel": "prerequisite", "note": {"fa": "قیام سیاه‌جامگان همان نیرویی بود که بنیاد قدرت عباسیان شد", "en": "The black-banner revolt was the very force that became the foundation of Abbasid power", "nl": "De zwarte-vaandelopstand was precies de kracht die de basis werd van de Abbasidische macht"}}, {"to": "tarikh:tahirid-origins", "rel": "part-of", "note": {"fa": "خاستگاه طاهریان در همین عصر عباسی شکل گرفت", "en": "The Tahirids' origin took shape within this same Abbasid era", "nl": "De oorsprong van de Tahiriden nam vorm aan binnen datzelfde Abbasidische tijdperk"}}, {"to": "soc:abbasid-iranian-bureaucracy-viziers", "rel": "see-also", "note": {"fa": "دیوان‌سالاری ایرانیِ همین خلافت", "en": "The Iranian bureaucracy of this caliphate", "nl": "De Iraanse bureaucratie van dit kalifaat"}}, {"to": "soc:persian-culture-in-abbasid-caliphate", "rel": "see-also", "note": {"fa": "فرهنگ ایرانی در دربار عباسی", "en": "Persian culture at the Abbasid court", "nl": "Perzische cultuur aan het Abbasidische hof"}}], "people": [], "sources": ["src:c182e55a07"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tarikh:tarikh", "kind": "root", "title": {"fa": "تاریخ و ایران‌شناسی", "en": "History & Iranology", "nl": "Geschiedenis & Iranologie"}, "aliases": ["تاریخ ایران", "ایران‌شناسی"], "parent": null, "field": null, "summary": {"fa": "چه شد که این‌طور شد؟ بزرگ‌ترین قفسهٔ مخزن دانش‌سرا (۲۸۲ کتاب) همین پرسش را دنبال می‌کند: تاریخ سیاسی و اجتماعی ایران، باستان‌شناسی، و تاریخ جهان در پیوند با آن. این ویکی تازه‌ساز است و تا الان با سه جلد (از هفت) یک اثر کلاسیک شروع شده؛ بقیهٔ مخزن هنوز خوانده نشده.", "en": "What happened, and why? The largest shelf in Daneshsara's library (282 books) follows exactly this question: Iran's political and social history, archaeology, and world history in connection with it. This wiki is brand new, started so far from three volumes (of seven) of one classic work; the rest of the shelf is still unread.", "nl": "Wat is er gebeurd, en waarom? De grootste plank in Daneshsara's bibliotheek (282 boeken) volgt precies deze vraag: Iran's politieke en sociale geschiedenis, archeologie, en wereldgeschiedenis in verband daarmee. Deze wiki is nieuw en begon tot nu toe met drie delen (van zeven) van één klassiek werk; de rest van de plank is nog ongelezen."}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tarikh:sources-early-islamic-iran-zarrinkoub", "kind": "concept", "title": {"fa": "منابع تاریخ ایران در سده‌های نخست اسلامی: سنجش زرین‌کوب", "en": "Sources for early Islamic Iran: Zarrinkoub's assessment", "nl": "Sources for early Islamic Iran: Zarrinkoub's assessment"}, "aliases": [], "parent": "tarikh:early-islamic", "field": "tarikh:early-islamic", "summary": {"fa": "زرین‌کوب پیش از روایت تاریخ، منابع را می‌سنجد: روایت‌های فتوح قبیله‌ای و گزافه‌آمیزند ولی ناگزیر، طبری گردآورنده است نه منتقد، ابن‌اثیر و مسکویه نقادترند، و تاریخ‌های عمومی فارسی متأخر را باید با احتیاط خواند.", "en": "Before narrating, Zarrinkoub weighs the sources: conquest reports are tribal and inflated yet unavoidable, al-Tabari compiles rather than criticises, Ibn al-Athir and Miskawayh are more critical, and later Persian general histories need caution.", "nl": "Before narrating, Zarrinkoub weighs the sources."}, "points": [{"text": {"fa": "زرین‌کوب می‌گوید خبرهای فتوح از روایت‌های شفاهی قبیله‌های عرب آمده و آمیخته به تفاخر قبیله‌ای و هواداری از کوفیان است؛ پس همیشه در معرض تحریف و گزافه است. با این همه «چاره‌ای جز استفاده از این روایات نیست»، چون تنها مأخذ مورخان بعدی همین‌هاست (ص ۱۹).", "en": "Zarrinkoub notes that conquest reports derive from oral traditions of Arab tribes, coloured by tribal boasting and partiality toward the Kufans, hence always open to distortion and exaggeration. Yet 'there is no choice but to use these reports', as they are the only source later historians had (p. 19).", "nl": "Zarrinkoub notes that conquest reports derive from oral traditions of Arab tribes, coloured by tribal boasting and partiality toward the Kufans, hence always open to distortion and exaggeration. Yet 'there is no choice but to use these reports', as they are the only source later historians had (p. 19)."}, "sources": ["src:12a047ab10"], "flags": []}, {"text": {"fa": "کتاب‌های سدهٔ دوم و سوم بیشتر از میان رفته و فقط در نقل دیگران مانده است. برای عراق ابومخنف و برای خراسان و فارس مدائنی آگاه‌ترین راوی بودند؛ زرین‌کوب روایت مدائنی را دقیق می‌داند و می‌گوید پژوهش جدید درستی بسیاری از آن را تأیید کرده است (ص ۱۹–۲۱).", "en": "The books of the 2nd–3rd Islamic centuries are mostly lost and survive only in later quotation. Abu Mikhnaf was best informed on Iraq and al-Mada'ini on Khurasan and Fars; Zarrinkoub rates al-Mada'ini's reports as careful and says modern research has confirmed many of them (pp. 19–21).", "nl": "The books of the 2nd–3rd Islamic centuries are mostly lost and survive only in later quotation. Abu Mikhnaf was best informed on Iraq and al-Mada'ini on Khurasan and Fars; Zarrinkoub rates al-Mada'ini's reports as careful and says modern research has confirmed many of them (pp. 19–21)."}, "sources": ["src:12a047ab10"], "flags": []}, {"text": {"fa": "بلاذری نخستین مورخی است که اثر عمده‌اش دربارهٔ فتوح به دست ما رسیده است. فارسی می‌دانست و «فتوح‌البلدان» او برای جزیه، خراج، سکه و به‌ویژه برگرداندن دیوان از فارسی به عربی آگاهی ارزشمند دارد (ص ۲۱).", "en": "Al-Baladhuri is the first historian whose main work on the conquests survives. He knew Persian, and his Futuh al-Buldan gives valuable information on poll-tax, land-tax, coinage and especially the change of the chancery from Persian to Arabic (p. 21).", "nl": "Al-Baladhuri is the first historian whose main work on the conquests survives. He knew Persian, and his Futuh al-Buldan gives valuable information on poll-tax, land-tax, coinage and especially the change of the chancery from Persian to Arabic (p. 21)."}, "sources": ["src:12a047ab10"], "flags": []}, {"text": {"fa": "طبری مهم‌ترین مجموعه است، اما هدفش گردآوری همهٔ روایت‌ها بود نه سنجش آن‌ها؛ عین روایت‌ها را کنار هم آورده و هرچه به روزگار خودش نزدیک‌تر می‌شود کوتاه‌تر می‌نویسد. ترجمهٔ بلعمی سندها و روایت‌های موازی را حذف کرد و سال‌ها اصل کتاب را نزد فارسی‌زبانان از یاد برد (ص ۲۳–۲۴).", "en": "Al-Tabari is the most important compilation, but his aim was to gather all reports, not to weigh them; he sets them side by side and grows briefer as he nears his own time. Bal'ami's Persian version dropped the chains of transmission and parallel reports and for long eclipsed the original among Persian readers (pp. 23–24).", "nl": "Al-Tabari is the most important compilation, but his aim was to gather all reports, not to weigh them; he sets them side by side and grows briefer as he nears his own time. Bal'ami's Persian version dropped the chains of transmission and parallel reports and for long eclipsed the original among Persian readers (pp. 23–24)."}, "sources": ["src:12a047ab10"], "flags": []}, {"text": {"fa": "ابن‌اثیر به داوری زرین‌کوب دقتی «بی‌نظیر» در میان مورخان آن روزگار دارد: روایت‌ها را می‌سنجد و جایی که ترجیح ممکن نیست هر دو را می‌آورد. نمونه‌اش این‌که گزارش او از برخورد مسلمانان با چین با منابع چینی می‌خواند، هرچند در هیچ مأخذ عربی کهن‌تری نیست (ص ۲۴–۲۵).", "en": "Ibn al-Athir, in Zarrinkoub's judgement, shows a care 'unmatched' among historians of his age: he compares reports and gives both where he cannot choose. His account of Muslim–Chinese clashes matches Chinese sources though found in no older Arabic source (pp. 24–25).", "nl": "Ibn al-Athir, in Zarrinkoub's judgement, shows a care 'unmatched' among historians of his age: he compares reports and gives both where he cannot choose. His account of Muslim–Chinese clashes matches Chinese sources though found in no older Arabic source (pp. 24–25)."}, "sources": ["src:12a047ab10"], "flags": []}, {"text": {"fa": "مسعودی و مسکویه دو استثنای نقادند. مسکویه در پی علت رویدادها می‌رود، روایت‌های افسانه‌ای و معجزه‌ها را از تاریخ کنار می‌گذارد و برای آل‌بویه مأخذ دست‌اول است، چون خازن کتابخانهٔ عضدالدوله بود (ص ۲۵–۲۷).", "en": "Al-Mas'udi and Miskawayh are two critical exceptions. Miskawayh seeks the causes of events, sets aside legendary reports and miracles as outside history, and is a first-hand source for the Buyids, having been librarian to 'Adud al-Dawla (pp. 25–27).", "nl": "Al-Mas'udi and Miskawayh are two critical exceptions. Miskawayh seeks the causes of events, sets aside legendary reports and miracles as outside history, and is a first-hand source for the Buyids, having been librarian to 'Adud al-Dawla (pp. 25–27)."}, "sources": ["src:12a047ab10"], "flags": []}, {"text": {"fa": "دربارهٔ تاریخ‌های عمومی فارسی سخت‌گیر است: پرشمارند ولی به غنای عربی‌ها نیستند، بخش‌های پیش از روزگار مؤلف اغلب رونویسی بی‌دقت است و نثر مصنوع فایده را کم می‌کند، به‌ویژه پس از مغول و تیموریان. با این حال برای روزگار خودِ مؤلف مرجع عمده‌اند (ص ۲۸–۳۰).", "en": "He is severe on Persian general histories: numerous but less rich than the Arabic, their pre-author sections often careless copying, their ornate prose reducing usefulness, especially after the Mongols and Timurids. Still, for the author's own time they are principal sources (pp. 28–30).", "nl": "He is severe on Persian general histories: numerous but less rich than the Arabic, their pre-author sections often careless copying, their ornate prose reducing usefulness, especially after the Mongols and Timurids. Still, for the author's own time they are principal sources (pp. 28–30)."}, "sources": ["src:12a047ab10"], "flags": []}, {"text": {"fa": "نمونهٔ دست‌کاری: هدایت در «روضة‌الصفای ناصری» گناه فرستادهٔ شاه‌عباس را چنین می‌نویسد که چند فرنگیِ مایل به اسلام را رماند. در «عالم‌آرای عباسی»، که مأخذ اوست، ماجرا وارونه است: بدرفتاری او چند همراه ایرانی را به مسیحی شدن و ماندن در فرنگ کشاند (ص ۲۹).", "en": "A case of tampering: Hedayat's continuation of Rawzat al-Safa says a Safavid envoy's sin was to drive away some Europeans inclined to Islam. In his source, the 'Alam-ara-yi 'Abbasi, it is the reverse: his ill-treatment drove several Iranian companions to turn Christian and stay in Europe (p. 29).", "nl": "A case of tampering: Hedayat's continuation of Rawzat al-Safa says a Safavid envoy's sin was to drive away some Europeans inclined to Islam. In his source, the 'Alam-ara-yi 'Abbasi, it is the reverse: his ill-treatment drove several Iranian companions to turn Christian and stay in Europe (p. 29)."}, "sources": ["src:12a047ab10"], "flags": []}, {"text": {"fa": "گردیزی (زین‌الاخبار) برای خراسان، سامانیان و غزنویان با همهٔ کوتاهی معتبر است، چون بر «اخبار خراسان» سلامی تکیه دارد که مأخذ ابن‌اثیر هم بود (ص ۳۰–۳۱).", "en": "Gardizi's Zayn al-Akhbar, brief as it is, is reliable for Khurasan, the Samanids and Ghaznavids, resting on al-Sallami's lost history of Khurasan, also Ibn al-Athir's source (pp. 30–31).", "nl": "Gardizi's Zayn al-Akhbar, brief as it is, is reliable for Khurasan, the Samanids and Ghaznavids, resting on al-Sallami's lost history of Khurasan, also Ibn al-Athir's source (pp. 30–31)."}, "sources": ["src:12a047ab10"], "flags": []}, {"text": {"fa": "این مدخل از صفحه‌های ۱۹ تا ۳۱ بخش «در باب مآخذ» است؛ این بخش تا حدود صفحهٔ ۱۰۰ ادامه دارد و هنوز خوانده نشده. متن از روی اسکن خوانده شده و برخی سال‌های وفات در آن ناخوانا بود، برای همین سال‌ها را نیاورده‌ام. داوری‌های زرین‌کوب مربوط به پژوهش میانهٔ سدهٔ بیستم است و بحث‌های تازه‌تر دربارهٔ اعتبار روایت‌های فتوح را ندارد.", "en": "This entry covers pp. 19–31 of the section 'On the sources', which runs to about p. 100 and is not yet read. The text was read from a scan with some death-dates illegible, so dates are omitted. Zarrinkoub's judgements reflect mid-20th-century scholarship and lack more recent debates on the reliability of conquest narratives.", "nl": "This entry covers pp. 19–31 of the section 'On the sources', which runs to about p. 100 and is not yet read. The text was read from a scan with some death-dates illegible, so dates are omitted. Zarrinkoub's judgements reflect mid-20th-century scholarship and lack more recent debates on the reliability of conquest narratives."}, "sources": ["src:12a047ab10"], "flags": ["editor-note", "dated"]}], "links": [{"to": "tarikh:arab-conquest-iran", "rel": "explains", "note": {"fa": "خبرهای فتح از کجا می‌آید", "en": "where the conquest reports come from", "nl": "where the conquest reports come from"}}, {"to": "soc:jasemi-arab-conquest-iran-resistance-narrative", "rel": "see-also", "note": {"fa": "روایتی دیگر بر پایهٔ همین منابع", "en": "another narrative built on the same sources", "nl": "another narrative built on the same sources"}}, {"to": "soc:early-islamic-iran-continuity-debate", "rel": "see-also", "note": {"fa": "بحث گسست یا پیوستگی", "en": "the rupture-or-continuity debate", "nl": "the rupture-or-continuity debate"}}, {"to": "tarikh:tahirid-origins", "rel": "see-also", "note": {"fa": "خراسان و طاهریان", "en": "Khurasan and the Tahirids", "nl": "Khurasan and the Tahirids"}}, {"to": "soc:historical-memory-as-popular-history", "rel": "bridges", "note": {"fa": "حافظهٔ تاریخی و تاریخ عامه", "en": "historical memory and popular history", "nl": "historical memory and popular history"}}], "people": [], "sources": ["src:12a047ab10"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tarikh:saffarid-rise", "kind": "concept", "title": {"fa": "برآمدن یعقوب لیث: از عیاری تا امارت صفاریان", "en": "The rise of Ya'qub al-Saffar: from street chivalry to the Saffarid emirate", "nl": "De opkomst van Ya'qub al-Saffar: van straatridderlijkheid tot het Saffaridische emiraat"}, "aliases": ["یعقوب لیث صفاری", "صفاریان", "یعقوب لیث"], "parent": "tarikh:early-islamic", "field": "tarikh:early-islamic", "summary": {"fa": "یعقوب بن لیث، پسر یک مسگر از سیستان، از دل شبکهٔ «عیاران» و «مطوعهٔ» ضدخوارجِ سیستان بالا آمد و در سال ۲۴۷ هجری امیر محلی سیستان را برانداخت و نخستین سلسلهٔ ایرانی‌ای را بنیاد نهاد که دیگر حتی اسماً هم تابع فرمانروای عرب محلی نبود — صفاریان.", "en": "Ya'qub ibn al-Layth, the son of a coppersmith from Sistan, rose through the network of Sistan's \"ayyarun\" (street-chivalry militias) and anti-Kharijite \"mutawwi'a\", and in 247 AH overthrew Sistan's local Arab-appointed ruler, founding the first Iranian dynasty that was no longer even nominally under a local Arab governor — the Saffarids.", "nl": "Ya'qub ibn al-Layth, zoon van een kopersmid uit Sistan, klom op via het netwerk van Sistans \"ayyarun\" (straatridderlijkheidsmilities) en anti-Kharijitische \"mutawwi'a\", en wierp in 247 AH de lokale, door Arabieren aangestelde heerser van Sistan omver, waarmee hij de eerste Iraanse dynastie stichtte die zelfs niet meer nominaal onder een lokale Arabische gouverneur stond — de Saffariden."}, "points": [{"text": {"fa": "سیستان از دیرباز با خوارج دست‌به‌گریبان بود؛ چون نه طاهریان و نه عمال محلی‌شان نمی‌توانستند خوارج را کاملاً سرکوب کنند، مردم خود داوطلبانه دسته‌های «مطوعه» تشکیل دادند. این مطوعه‌ها، همراه با طبقهٔ «عیاران» (جوانمردان مسلح محلی)، به‌تدریج از نیروی کمکی به نیروی مستقل قدرت تبدیل شدند که حتی حکمرانان را به وحشت می‌انداخت.", "en": "Sistan had long struggled with Kharijite unrest; since neither the Tahirids nor their local officials could fully suppress them, the populace formed volunteer \"mutawwi'a\" militias on their own. These militias, together with the \"ayyarun\" class (armed local men of chivalry), gradually turned from an auxiliary force into an independent power that even frightened the ruling governors.", "nl": "Sistan worstelde al lang met Kharijitische onrust; omdat noch de Tahiriden noch hun plaatselijke ambtenaren hen volledig konden onderdrukken, vormde de bevolking zelf vrijwillige \"mutawwi'a\"-milities. Deze milities groeiden, samen met de \"ayyarun\"-klasse (gewapende plaatselijke mannen van ridderlijkheid), geleidelijk uit van een hulptroepenmacht tot een onafhankelijke machtsfactor die zelfs de heersende gouverneurs schrik aanjoeg."}, "sources": ["src:f407762ded"], "flags": []}, {"text": {"fa": "یعقوب و برادرانش (عمرو، ظاهر، علی) از عیاران سیستان بودند. او نخست در کنار صالح بن نضر و سپس درهم بن نضر (که به امارت سیستان رسیدند) جنگید؛ وقتی درهم از نفوذ یعقوب در میان عیاران ترسید و قصد کشتنش کرد، یعقوب بر او شورید، او را دستگیر کرد و خود در محرم سال ۲۴۷ هجری جای او را گرفت.", "en": "Ya'qub and his brothers (Amr, Zahir, Ali) were part of Sistan's ayyarun. He first fought alongside Salih ibn Nasr and then Dirham ibn Nasr (who each in turn gained the emirate of Sistan); when Dirham grew afraid of Ya'qub's influence among the ayyarun and plotted to kill him, Ya'qub rose against him, had him captured, and took his place himself in Muharram 247 AH.", "nl": "Ya'qub en zijn broers (Amr, Zahir, Ali) maakten deel uit van Sistans ayyarun. Hij vocht eerst aan de zijde van Salih ibn Nasr en daarna Dirham ibn Nasr (die beiden achtereenvolgens het emiraat van Sistan verwierven); toen Dirham bang werd voor Ya'qubs invloed onder de ayyarun en plannen smeedde om hem te doden, kwam Ya'qub tegen hem in opstand, liet hem gevangennemen en nam zelf zijn plaats in, in Muharram 247 AH."}, "sources": ["src:f407762ded"], "flags": []}, {"text": {"fa": "در روایتی که خودِ منبع آن را «بی‌پایه اما جالب» می‌خواند، گفته‌اند یعقوب در آغاز عیاری نقبی به خزانهٔ حاکم زد، تکه‌ای یافت که گمان کرد گوهر است، و چون دریافت نمک است — به رسم نمک‌خوارگی (وفاداری به کسی که نانش را خورده‌ای) — چیزی برنداشت و بیرون رفت؛ حاکم از این درستکاری خوشش آمد و او را به خدمت گرفت.", "en": "In an account the source itself calls \"baseless but interesting,\" it is said that early in his career as an ayyar, Ya'qub broke into the ruler's treasury, found something he thought was a jewel, and on discovering it was salt — honoring the code of \"namak-khwaragi\" (loyalty to one whose salt/bread one has eaten) — took nothing and left; the ruler, pleased by this honesty, took him into his service.", "nl": "In een verslag dat de bron zelf \"ongefundeerd maar interessant\" noemt, wordt verteld dat Ya'qub vroeg in zijn carrière als ayyar inbrak in de schatkamer van de heerser, iets vond dat hij voor een juweel hield, en toen hij ontdekte dat het zout was — trouw aan de code van \"namak-khwaragi\" (loyaliteit aan wie men het zout/brood heeft gegeten) — niets meenam en wegging; de heerser, aangenaam getroffen door deze eerlijkheid, nam hem in dienst."}, "sources": ["src:f407762ded"], "flags": ["unreplicated", "editor-note"], "note": {"fa": "این یک افسانهٔ بنیان‌گذاری کلاسیک است (شبیه الگوهای رایج در روایت خاستگاه قهرمانان)؛ منبع خودش صراحتاً می‌گوید اساس تاریخی ندارد. اینجا فقط به‌عنوان نمونه‌ای از فرهنگ «نمک‌خوارگی» و روایت‌سازی آورده شده، نه رویدادی مستند.", "en": "This is a classic founder-legend (similar to common patterns in origin stories of heroes); the source itself explicitly states it has no historical basis. It's included here only as an example of \"namak-khwaragi\" culture and legend-making, not as a documented event.", "nl": "Dit is een klassieke stichtersmythe (vergelijkbaar met gangbare patronen in oorsprongsverhalen van helden); de bron zelf stelt expliciet dat er geen historische basis voor is. Het wordt hier alleen opgenomen als voorbeeld van \"namak-khwaragi\"-cultuur en mythevorming, niet als gedocumenteerde gebeurtenis."}}], "links": [{"to": "tarikh:ayyarun-class", "rel": "explains", "note": {"fa": "یعقوب لیث مشهورترین نمونهٔ کسی‌ست که از طبقهٔ عیاران به قدرت رسید", "en": "Ya'qub al-Saffar is the most famous example of someone who rose from the ayyarun class to power", "nl": "Ya'qub al-Saffar is het bekendste voorbeeld van iemand die vanuit de ayyarun-klasse aan de macht kwam"}}, {"to": "tarikh:tahirid-origins", "rel": "contrasts", "note": {"fa": "طاهریان از راه خدمت در دستگاه خلافت بالا آمدند؛ صفاریان از راه شورش محلی علیه همان دستگاه", "en": "The Tahirids rose through service within the caliphal apparatus; the Saffarids rose through local revolt against that same apparatus", "nl": "De Tahiriden kwamen op door dienst binnen het kalifale apparaat; de Saffariden kwamen op door lokale opstand tegen datzelfde apparaat"}}, {"to": "soc:saffarid-pouriya-civic-networks", "rel": "see-also", "note": {"fa": "شبکه‌های مدنی روزگار صفاریان", "en": "Civic networks in the Saffarid era", "nl": "Burgerlijke netwerken in de Saffaridische tijd"}}], "people": [], "sources": ["src:f407762ded"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tarikh:arab-conquest-iran", "kind": "concept", "title": {"fa": "فتح عربی ایران: واقعهٔ جسر و پیامدش", "en": "The Arab conquest of Iran: the Battle of the Bridge and its aftermath", "nl": "De Arabische verovering van Iran: de Slag om de Brug en de nasleep"}, "aliases": ["واقعهٔ جسر", "جنگ پل", "فتح ایران"], "parent": "tarikh:early-islamic", "field": "tarikh:early-islamic", "summary": {"fa": "اولین شکست بزرگ عرب‌های مسلمان در عراق از سپاه ساسانی (حدود ۱۳ هجری/۶۳۴ م)، در نبردی کنار یک پل بر فرات. شکست چنان شرم‌آور بود که فراریان در مدینه ماه‌ها از شرم خانه‌نشین شدند؛ عمر برای مدتی نام «عراق» را به زبان نمی‌آورد. این شکست موقتی بود، نه پایان ماجرا.", "en": "The first major defeat of Muslim Arab forces in Iraq at Sasanian hands (c. 13 AH/634 CE), in a battle beside a bridge on the Euphrates. The defeat was so shameful that the fleeing survivors shut themselves in their homes in Medina for months; Caliph Umar avoided even saying the word \"Iraq\" for nearly a year. It was a temporary setback, not the end of the story.", "nl": "De eerste grote nederlaag van moslim-Arabische troepen in Irak tegen de Sassaniden (ca. 13 AH/634 CE), in een slag bij een brug over de Eufraat. De nederlaag was zo beschamend dat de vluchtende overlevenden zich maandenlang thuis opsloten in Medina; kalief Omar vermeed bijna een jaar lang zelfs het woord \"Irak\" te noemen. Het was een tijdelijke terugslag, geen einde van het verhaal."}, "points": [{"text": {"fa": "در واقعهٔ جسر، سپاه عرب به فرماندهی ابوعبید ثقفی از سپاه ساسانی به فرماندهی بهمن جادویه کنار پلی بر فرات شکست خورد؛ به‌روایت سیف بن عمر این نبرد در شعبان سال ۱۳ هجری روی داد، هرچند خود این تاریخ قطعی نیست — برخی آن را آخر رمضان همان سال، و ابن اسحاق آن را سال ۱۴ هجری نوشته‌اند.", "en": "At the Battle of the Bridge, the Arab force under Abu Ubayd al-Thaqafi was defeated by the Sasanian force under Bahman Jadhuyeh beside a bridge on the Euphrates; per Sayf ibn Umar's account the battle took place in Sha'ban 13 AH, though even this date is disputed — some place it at the end of Ramadan of the same year, and Ibn Ishaq dates it to 14 AH.", "nl": "In de Slag om de Brug werd de Arabische troepenmacht onder Abu Ubayd al-Thaqafi verslagen door de Sassanidische troepenmacht onder Bahman Jadhuyeh bij een brug over de Eufraat; volgens Sayf ibn Umar vond de slag plaats in Sha'ban 13 AH, al is zelfs deze datum omstreden — sommigen plaatsen het aan het einde van Ramadan van hetzelfde jaar, en Ibn Ishaq dateert het op 14 AH."}, "sources": ["src:c4abd0c6f3"], "flags": ["contested", "dated"]}, {"text": {"fa": "شکست آن‌قدر شرم‌آور بود که فراریان به مدینه چون شرمسار از شرم روی نهان می‌کردند، در خانه گریه می‌کردند و خود را به‌خاطر پشت‌کردن به دشمن گناهکار می‌دانستند؛ گفته شده عمر تا نزدیک یک سال نام «عراق» را بر زبان نمی‌آورد.", "en": "The defeat was so shameful that the fleeing survivors who reached Medina hid their faces in shame, wept at home, and considered themselves guilty for having turned their backs on the enemy; it is said Caliph Umar avoided even saying the word \"Iraq\" for nearly a year afterward.", "nl": "De nederlaag was zo beschamend dat de vluchtelingen die Medina bereikten hun gezicht verborgen van schaamte, thuis huilden en zichzelf schuldig voelden omdat ze de vijand de rug hadden toegekeerd; er wordt gezegd dat kalief Omar bijna een jaar lang zelfs het woord \"Irak\" vermeed."}, "sources": ["src:c4abd0c6f3"], "flags": ["editor-note"], "note": {"fa": "این جزئیات روایی (شرم، گریه) از سنت تاریخ‌نگاری اسلامی سده‌های بعد می‌آید، نه سندی هم‌زمان با واقعه؛ به‌عنوان شاهدی از چگونگی روایت‌شدنِ این شکست در حافظهٔ تاریخی بخوانید، نه گزارشی صددرصد مستند.", "en": "These narrative details (shame, weeping) come from the later Islamic historiographic tradition, not a document contemporary with the event; read them as evidence of how this defeat was remembered and narrated, not as a fully documented report.", "nl": "Deze narratieve details (schaamte, huilen) komen uit de latere islamitische historiografische traditie, niet uit een document uit de tijd van de gebeurtenis zelf; lees ze als bewijs van hoe deze nederlaag werd herinnerd en verteld, niet als een volledig gedocumenteerd verslag."}}, {"text": {"fa": "عمر برای جبران شکست، طایفهٔ بَجیله را به فرماندهی جریر بن عبدالله بجلی با وعدهٔ ربع یا ثلث غنایم به عراق فرستاد؛ چندماه بعد در محلی به نام بویب (نهری از فرات) سپاه عرب دوباره با سپاه ایران به فرماندهی مهران بن مهربنداد روبه‌رو شد — این‌بار همراه با چند زنجیر فیل، که دیگر اعراب را مثل جسر نترساند.", "en": "To redress the defeat, Umar sent the Bajila tribe under Jarir ibn Abdullah al-Bajali to Iraq with a promise of a quarter or third of the spoils; months later at a place called Buwayb (a canal off the Euphrates), the Arab force again faced the Persian army under Mihran ibn Mihrbandad — this time with war elephants, which no longer frightened the Arabs as they had at the Bridge.", "nl": "Om de nederlaag te herstellen, stuurde Omar de Bajila-stam onder Jarir ibn Abdullah al-Bajali naar Irak met de belofte van een kwart of derde van de buit; maanden later op een plaats genaamd Buwayb (een kanaal van de Eufraat) stond de Arabische troepenmacht opnieuw tegenover het Perzische leger onder Mihran ibn Mihrbandad — deze keer met oorlogsolifanten, die de Arabieren niet meer schrik aanjoegen zoals bij de Brug."}, "sources": ["src:c4abd0c6f3"], "flags": []}], "links": [{"to": "soc:jasemi-arab-conquest-iran-resistance-narrative", "rel": "see-also", "note": {"fa": "روایت جدلی همین رویداد، برای مقایسه", "en": "A polemical account of the same events, for comparison", "nl": "Een polemisch relaas van dezelfde gebeurtenissen, ter vergelijking"}}, {"to": "soc:early-islam-sources-casualty-claims", "rel": "see-also", "note": {"fa": "چگونه عددهای منابع کهن را بخوانیم", "en": "How to read the numbers in the early sources", "nl": "Hoe de getallen in de vroege bronnen te lezen"}}, {"to": "soc:sasanian-state-administration", "rel": "see-also", "note": {"fa": "دولتی که در این جنگ‌ها فروپاشید", "en": "The state that collapsed in these wars", "nl": "De staat die in deze oorlogen instortte"}}], "people": [], "sources": ["src:c4abd0c6f3"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tarikh:early-islamic", "kind": "field", "title": {"fa": "ایران در سده‌های نخست اسلامی", "en": "Iran in the early Islamic centuries", "nl": "Iran in de vroege islamitische eeuwen"}, "aliases": [], "parent": "tarikh:tarikh", "field": null, "summary": {"fa": "از فروپاشی ساسانیان (سدهٔ ۷ م) تا سر برآوردن نخستین حکومت‌های نیمه‌مستقل و مستقل ایرانی — طاهریان و صفاریان (سدهٔ ۹ م): فتح عربی، نقش ایرانیان در تحولات سیاسی خلافت، عصر طلایی عباسی، خانواده‌های ایرانی‌تباری که در خدمت خلافت قدرت یافتند، و طبقهٔ عیاران که از دل شورش محلی فرمانروا ساخت.", "en": "From the fall of the Sasanians (7th c. CE) to the rise of the first semi-independent and fully independent Persian dynasties — the Tahirids and Saffarids (9th c. CE): the Arab conquest, Iranians' role in the caliphate's political upheavals, the Abbasid golden age, the Persian-descended families who gained power in the caliphate's service, and the ayyarun class that turned local revolt into a ruling dynasty.", "nl": "Van de val van de Sassaniden (7e eeuw) tot de opkomst van de eerste semi-onafhankelijke en volledig onafhankelijke Perzische dynastieën — de Tahiriden en Saffariden (9e eeuw): de Arabische verovering, de rol van Iraniërs in de politieke omwentelingen van het kalifaat, het Abbasidische gouden tijdperk, de Perzisch afkomstige families die macht verwierven in dienst van het kalifaat, en de ayyarun-klasse die lokale opstand omzette in een heersende dynastie."}, "points": [], "links": [{"to": "soc:early-islamic-iran-continuity-debate", "rel": "see-also", "note": {"fa": "بحث «دو قرن سکوت»: گسست یا پیوستگی", "en": "The two centuries of silence debate: rupture or continuity", "nl": "Het debat over twee eeuwen stilte: breuk of continuïteit"}}], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tarikh:abu-muslim-revolt", "kind": "concept", "title": {"fa": "قیام سیاه‌جامگان ابومسلم خراسانی", "en": "Abu Muslim al-Khurasani's Black-Banner revolt", "nl": "De Zwarte-Vaandel-opstand van Abu Muslim al-Khurasani"}, "aliases": ["سیاه‌جامگان", "ابومسلم خراسانی", "انقلاب عباسی در خراسان"], "parent": "tarikh:early-islamic", "field": "tarikh:early-islamic", "summary": {"fa": "جنبشی در خراسان (حدود ۱۲۹-۱۳۰ هجری/۷۴۷ م) که به سقوط امویان و برآمدن عباسیان رسید. ابومسلم با ترکیبی از سازمان‌دهی نظامی و سیاستِ آزادکردنِ اسیران برای کسب آبرو، در چندماه از شهر به شهرِ خراسان گسترش یافت.", "en": "A movement in Khorasan (c. 129-130 AH/747 CE) that led to the fall of the Umayyads and the rise of the Abbasids. Combining military organization with a policy of releasing captives to build a reputation for chivalry, Abu Muslim spread from city to city across Khorasan within months.", "nl": "Een beweging in Khorasan (ca. 129-130 AH/747 CE) die leidde tot de val van de Omajjaden en de opkomst van de Abbasiden. Door militaire organisatie te combineren met een beleid van het vrijlaten van gevangenen om een reputatie van ridderlijkheid op te bouwen, verspreidde Abu Muslim zich binnen maanden van stad tot stad door Khorasan."}, "points": [{"text": {"fa": "در عید فطر، بیش از ۲۲۰۰ تن «سیاه‌جامگان» در سفیدنج نزد ابومسلم گرد آمدند؛ نصر بن سیار (والی اموی خراسان) دسته‌ای سوار برای سرکوب آن‌ها فرستاد که ابومسلم آن را شکست داد.", "en": "On Eid al-Fitr, more than 2,200 \"black-banner\" men gathered around Abu Muslim at Safidanj; Nasr ibn Sayyar (the Umayyad governor of Khorasan) sent a cavalry detachment to suppress them, which Abu Muslim defeated.", "nl": "Op Eid al-Fitr verzamelden zich meer dan 2.200 \"zwarte-vaandel\"-mannen rond Abu Muslim bij Safidanj; Nasr ibn Sayyar (de Omajjadische gouverneur van Khorasan) stuurde een cavalerie-eenheid om hen te onderdrukken, die Abu Muslim verslagen heeft."}, "sources": ["src:c4abd0c6f3"], "flags": []}, {"text": {"fa": "فرماندهٔ مجروح و اسیرشدهٔ آن دسته را ابومسلم تیمار کرد و بعد از بهبودی آزاد کرد تا آوازهٔ جوانمردی سیاه‌جامگان را ببرد؛ چندماه بعد نیز گروهی دیگر از اسیران را به همین قصد آزاد کردند — سیاستی برای کسب آبرو، نه فقط رحم.", "en": "Abu Muslim had the wounded, captured commander of that detachment treated, then released him after recovery so he would spread word of the rebels' chivalry; months later another group of captives was released with the same purpose — a reputation-building policy, not mere mercy.", "nl": "Abu Muslim liet de gewonde, gevangengenomen commandant van die eenheid verzorgen en liet hem na herstel vrij zodat hij het woord zou verspreiden over de ridderlijkheid van de rebellen; maanden later werd nog een groep gevangenen met hetzelfde doel vrijgelaten — een reputatiebeleid, geen pure genade."}, "sources": ["src:c4abd0c6f3"], "flags": ["editor-note"], "note": {"fa": "این یک کاربرد اولیهٔ شناخته‌شدهٔ «جوانمردی به‌عنوان راهبرد سیاسی» در تاریخ ایران است؛ ارزش مقایسه با مطالعات روان‌شناسی اجتماعی دربارهٔ آبرو و اعتماد را دارد، اما این مدخل هنوز به آن ویکی پیوند نخورده.", "en": "This is a well-known early instance of \"chivalry as political strategy\" in Iranian history; it is worth comparing with social-psychology research on reputation and trust, but this entry is not yet cross-linked to that wiki.", "nl": "Dit is een bekend vroeg voorbeeld van \"ridderlijkheid als politieke strategie\" in de Iraanse geschiedenis; het is de moeite waard om te vergelijken met sociaalpsychologisch onderzoek naar reputatie en vertrouwen, maar dit lemma is nog niet gekoppeld aan die wiki."}}, {"text": {"fa": "در اندک زمانی شهرهای هرات، پوشنگ، مرورود، طالقان، مرو، نشابور، سرخس، بلخ، چغانیان، طخارستان، ختلان، کش و نخشب به سیاه‌جامگان پیوستند؛ حتی یمانی‌ها، به‌رغم رقابت قبیله‌ای با مُضَر، به یاری ابومسلم برخاستند. در اردوگاه ماخوان نزدیک مرو، نفرات او به حدود هفت‌هزار تن رسید و برایشان مانند یک فرمانده واقعی مقرری و جامگی تعیین کرد.", "en": "Within a short time the cities of Herat, Pushang, Marv-rud, Talaqan, Marv, Nishapur, Sarakhs, Balkh, Chaghanian, Tokharistan, Khottal, Kesh and Nakhshab joined the black-banner movement; even the Yamani Arabs, despite their tribal rivalry with the Mudar, rose to Abu Muslim's aid. At the Makhwan camp near Marv his numbers reached about 7,000, and he assigned them provisions and pay like a real commander.", "nl": "Binnen korte tijd sloten de steden Herat, Pushang, Marv-rud, Talaqan, Marv, Nishapur, Sarakhs, Balkh, Chaghanian, Tocharistan, Khottal, Kesh en Nakhshab zich aan bij de zwarte-vaandel-beweging; zelfs de Yamani-Arabieren, ondanks hun stammenrivaliteit met de Mudar, kwamen Abu Muslim te hulp. In het kamp Makhwan bij Marv bereikte zijn aantal ongeveer 7.000, en hij kende hen proviand en soldij toe als een echte bevelhebber."}, "sources": ["src:c4abd0c6f3"], "flags": []}], "links": [{"to": "tarikh:arab-conquest-iran", "rel": "part-of", "note": {"fa": "هر دو، فصل‌هایی از همان دورهٔ ایران زیر خلافت عربی‌اند", "en": "Both are chapters of the same period of Iran under Arab-caliphal rule", "nl": "Beide zijn hoofdstukken uit dezelfde periode van Iran onder Arabisch-kalifaal bestuur"}}, {"to": "soc:early-islamic-iran-revolts-local-dynasties", "rel": "part-of", "note": {"fa": "جای این قیام در زنجیرهٔ قیام‌های خراسان", "en": "This revolt's place in the chain of Khorasan uprisings", "nl": "De plaats van deze opstand in de reeks opstanden in Khorasan"}}], "people": [], "sources": ["src:c4abd0c6f3"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tarikh:ayyarun-class", "kind": "concept", "title": {"fa": "عیاران: طبقهٔ جوانمردان مسلح سده‌های میانه", "en": "The Ayyarun: the armed chivalry class of the medieval Islamic world", "nl": "De Ayyarun: de gewapende ridderlijkheidsklasse van de middeleeuwse islamitische wereld"}, "aliases": ["عیار", "عیاری", "جوانمردی"], "parent": "tarikh:early-islamic", "field": "tarikh:early-islamic", "summary": {"fa": "عیاران طبقه‌ای از جوانان مسلح عوام بودند که در بغداد، نشابور، سمرقند، سیستان و بیشتر شهرهای بزرگ خلافت، به‌خصوص در دوره‌های ضعف حکومت مرکزی، سر برمی‌آوردند. رفتارشان آمیزه‌ای متناقض بود: هم راهزنی و باج‌گیری، هم دفاع از مظلوم و وفاداری قبیله‌ای به سرکردهٔ خود — زیر لوای آیین «جوانمردی».", "en": "The ayyarun were a class of armed commoner youths who surfaced in Baghdad, Nishapur, Samarqand, Sistan and most major cities of the caliphate, especially during periods of weak central rule. Their conduct was a contradictory blend: both banditry and extortion, and defense of the oppressed and tribal-like loyalty to their chief — all under the banner of \"javanmardi\" (chivalry).", "nl": "De ayyarun waren een klasse van gewapende jongens uit het gewone volk die opdoken in Bagdad, Nishapur, Samarkand, Sistan en de meeste grote steden van het kalifaat, vooral in periodes van zwak centraal gezag. Hun gedrag was een tegenstrijdige mengeling: zowel roverij en afpersing, als verdediging van de verdrukten en stamachtige loyaliteit aan hun leider — allemaal onder de vlag van \"javanmardi\" (ridderlijkheid)."}, "points": [{"text": {"fa": "عیاران سازمانی شبیه به احزاب و اتحادیه داشتند و در هر شهر تا حدی با تشکیلات اصناف مرتبط بودند. جامه و آداب خاص خود داشتند و نسبت به سرکرده‌شان («سرهنگ» یا «سرعیار») اطاعتی نزدیک به تسلیم مطلق نشان می‌دادند.", "en": "The ayyarun had an organization resembling parties or guilds, and in each city were to some degree linked with craft-guild structures. They had their own distinctive dress and customs, and showed their chief (\"sarhang\" or \"sar-ayyar\") an obedience approaching total submission.", "nl": "De ayyarun hadden een organisatie die leek op partijen of gilden, en waren in elke stad tot op zekere hoogte verbonden met ambachtsgilden. Ze hadden hun eigen kledij en gebruiken, en toonden hun leider (\"sarhang\" of \"sar-ayyar\") een gehoorzaamheid die bijna volledige onderwerping benaderde."}, "sources": ["src:f407762ded"], "flags": []}, {"text": {"fa": "سلاحشان غالباً ابتدایی بود — نیزه‌های حصیری قیراندود، گرز، شمشیر، یا حتی فقط سنگ و فلاخن — و اغلب پیاده و بی‌زره می‌جنگیدند. با این‌حال در وقایع بزرگ نقش داشتند: در محاصرهٔ بغداد و جنگ امین و مأمون، عیاران بغداد در دفاع از شهر خود در برابر سپاه طاهر شجاعت نشان دادند.", "en": "Their weaponry was often rudimentary — tar-coated reed spears, maces, swords, or even just stones and slings — and they often fought on foot without armor. Yet they played a role in major events: during the siege of Baghdad and the war between al-Amin and al-Ma'mun, Baghdad's ayyarun showed courage defending their city against Tahir's army.", "nl": "Hun bewapening was vaak rudimentair — met teer bestreken rieten speren, knotsen, zwaarden, of zelfs alleen stenen en slingers — en ze vochten vaak te voet zonder harnas. Toch speelden ze een rol in grote gebeurtenissen: tijdens het beleg van Bagdad en de oorlog tussen al-Amin en al-Ma'mun toonden Bagdads ayyarun moed bij de verdediging van hun stad tegen Tahirs leger."}, "sources": ["src:f407762ded"], "flags": []}, {"text": {"fa": "در دوره‌های ضعف حکومت مرکزی، همین عیاران می‌توانستند به بلای جان مردم تبدیل شوند: به خانهٔ امیران و توانگران دستبرد می‌زدند و از بزرگان به‌زور پول می‌ستاندند. منبع این تناقض را آشکارا بیان می‌کند، نه پنهان: «با وجود اشتغال به غارت و راهزنی ... همواره در رعایت دوستی و نمک‌خوارگی و حمایت از مظلومان اهتمام نشان می‌دادند.»", "en": "In periods of weak central government, these same ayyarun could become a scourge on the populace: raiding the houses of nobles and the wealthy and extorting money from the great. The source states this contradiction openly rather than hiding it: \"despite being engaged in plunder and banditry ... they always showed care for loyalty and 'salt-eating' and protection of the oppressed.\"", "nl": "In periodes van zwak centraal gezag konden diezelfde ayyarun een plaag voor de bevolking worden: ze overvielen de huizen van edelen en rijken en persten geld af van de groten. De bron stelt deze tegenstrijdigheid openlijk en niet verhuld: \"ondanks dat ze zich bezighielden met plundering en roverij ... toonden ze altijd zorg voor trouw en 'zouteten' en bescherming van de verdrukten.\""}, "sources": ["src:f407762ded"], "flags": ["editor-note"], "note": {"fa": "این الگوی «راهزن نجیب» (بزهکار محلی که هم‌زمان حامی مردم عادی هم هست) در جامعه‌شناسی تاریخی با عنوان «راهزنی اجتماعی» شناخته می‌شود؛ مقایسه با آن ادبیات می‌تواند به ویکی جامعه پیوند بخورد، اما این مدخل هنوز به آن پیوند نخورده.", "en": "This \"noble bandit\" pattern (a local outlaw who is simultaneously a protector of common people) is known in historical sociology as \"social banditry\"; comparison with that literature could connect to the sociology wiki, though this entry is not yet cross-linked there.", "nl": "Dit \"nobele bandiet\"-patroon (een plaatselijke misdadiger die tegelijk een beschermer van gewone mensen is) staat in de historische sociologie bekend als \"sociaal banditisme\"; vergelijking met die literatuur zou kunnen aansluiten bij de sociologiewiki, al is dit lemma daar nog niet aan gekoppeld."}}], "links": [{"to": "soc:futuwwa-ayyaran-code", "rel": "see-also", "note": {"fa": "آیین و اخلاق همین گروه", "en": "The code and ethics of this group", "nl": "De code en ethiek van deze groep"}}, {"to": "soc:zurkhaneh-institution-social-base", "rel": "see-also", "note": {"fa": "نهادی که این سنت را ادامه داد", "en": "An institution that carried this tradition on", "nl": "Een instelling die deze traditie voortzette"}}, {"to": "soc:inclusive-politics-needs-central-state", "rel": "applies-to", "note": {"fa": "گروه‌های مسلح محلی وقتی دولت مرکزی ناتوان است", "en": "Local armed groups when the central state is weak", "nl": "Lokale gewapende groepen wanneer de centrale staat zwak is"}}], "people": [], "sources": ["src:f407762ded"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}], "people": {}, "sources": {"src:f407762ded": {"id": "src:f407762ded", "cite": "عبدالحسین زرین‌کوب، تاریخ ایران بعد از اسلام (مجلدِ ۶ از ۷، نسخهٔ دیجیتالِ کتابخانهٔ دانش‌سرا؛ ویراست و ناشر دقیق نامشخص)", "year": null, "tier": 3, "wikis": ["tarikh"]}, "src:c4abd0c6f3": {"id": "src:c4abd0c6f3", "cite": "عبدالحسین زرین‌کوب، تاریخ ایران بعد از اسلام (مجلدِ ۴ از ۷، نسخهٔ دیجیتالِ کتابخانهٔ دانش‌سرا؛ ویراست و ناشر دقیق نامشخص)", "year": null, "tier": 3, "wikis": ["tarikh"]}, "src:12a047ab10": {"id": "src:12a047ab10", "cite": "زرین‌کوب، عبدالحسین. تاریخ ایران بعد از اسلام (جلد نخست: ایران در اوایل عهد اسلامی). تهران: امیرکبیر، چاپ دهم ۱۳۸۳. نسخهٔ دیجیتال کتابخانهٔ دانشسرا (۱۰۰ صفحهٔ نخست).", "year": 2004, "tier": 3, "wikis": ["tarikh"]}, "src:c182e55a07": {"id": "src:c182e55a07", "cite": "عبدالحسین زرین‌کوب، تاریخ ایران بعد از اسلام (مجلدِ ۵ از ۷، نسخهٔ دیجیتالِ کتابخانهٔ دانش‌سرا؛ ویراست و ناشر دقیق نامشخص)", "year": null, "tier": 3, "wikis": ["tarikh"]}}, "iran": {}, "ext": {"soc:sasanian-state-administration": {"title": {"fa": "دستگاه نظامی و مالیاتی ساسانیان", "en": "Sasanian military command and taxation", "nl": "Het Sassanidische militaire en belastingstelsel"}, "url": "../soc/#sasanian-state-administration"}, "soc:persian-culture-in-abbasid-caliphate": {"title": {"fa": "فرهنگ ایرانی در جهان عباسی: ترجمه، ا
