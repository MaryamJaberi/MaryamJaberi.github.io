<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Workplace Wellbeing Check</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<style>
/* Layout: a calm, trustworthy service site. Sticky top bar (brand, five sections, language switch); each section is one view routed by the hash. Content column max 1120px; cards and simple charts; one primary action per screen. */
:root{
  --bg:#f5f3ee; --card:#ffffff; --ink:#1b2430; --muted:#5b6572; --rule:#e3ded4; --wash:#edeae2;
  --accent:#1d6d74; --accent-ink:#ffffff; --accent-soft:#dcecec;
  --low:#cf6a4c; --mid:#d9b25b; --high:#3d977a; --low-soft:#f6e1d9; --mid-soft:#f6edd6; --high-soft:#dcefe7;
  --shadow:0 1px 2px rgba(27,36,48,.06),0 6px 24px rgba(27,36,48,.06);
  --f-fa:"Vazirmatn",Tahoma,sans-serif; --f-lat:"Source Sans 3","Segoe UI",Arial,sans-serif; --f-lat-d:"Source Serif 4",Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171d; --card:#1a2129; --ink:#e7ecef; --muted:#9ba7b2; --rule:#2b343e; --wash:#212a33;
  --accent:#4fb3b8; --accent-ink:#0d1418; --accent-soft:#1d3436;
  --low:#e3866b; --mid:#e3c06e; --high:#5cc09d; --low-soft:#3a2620; --mid-soft:#3a3220; --high-soft:#1d3a30;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171d; --card:#1a2129; --ink:#e7ecef; --muted:#9ba7b2; --rule:#2b343e; --wash:#212a33;
  --accent:#4fb3b8; --accent-ink:#0d1418; --accent-soft:#1d3436;
  --low:#e3866b; --mid:#e3c06e; --high:#5cc09d; --low-soft:#3a2620; --mid-soft:#3a3220; --high-soft:#1d3a30;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-lat);font-size:17px;line-height:1.65}
html[lang="fa"] body,html[lang="ar"] body{font-family:var(--f-fa);font-size:16px;line-height:1.95}
h1,h2,h3{line-height:1.25;text-wrap:balance;margin:0}
html:not([lang="fa"]):not([lang="ar"]) h1,html:not([lang="fa"]):not([lang="ar"]) h2{font-family:var(--f-lat-d)}
html[lang="fa"] h1,html[lang="fa"] h2,html[lang="ar"] h1,html[lang="ar"] h2{font-weight:800}
a{color:var(--accent)}
button{font:inherit;color:inherit}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);border-bottom:1px solid var(--rule)}
.bar .wrap{display:flex;align-items:center;gap:14px;min-height:60px;flex-wrap:wrap;padding-block:6px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:700;margin-inline-end:auto;min-width:0}
.logo svg{width:30px;height:30px;flex:none}
.logo span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.main{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;max-width:100%}
nav.main a{white-space:nowrap;text-decoration:none;color:var(--muted);padding:7px 10px;border-radius:8px;font-size:.92rem;font-weight:600}
nav.main a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.langs{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--rule);border-radius:999px;padding:0 4px 0 10px;flex:none;color:var(--muted);background:var(--card)}
.langs .gl{display:inline-flex}
.langsel{border:0;background:transparent;color:var(--ink);font:700 .85rem var(--f-lat);padding:6px 6px;cursor:pointer;max-width:140px}
.langsel:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
html[dir="rtl"] .langs{padding:0 10px 0 4px}
nav.main{order:3;width:100%;padding-bottom:4px}
.hcta{font-size:.85rem;padding:7px 14px;min-height:0}
@media (max-width:560px){.bar .hcta{display:none}}
/* generic */
main{padding-block:28px 64px}
.view[hidden]{display:none}
.kicker{font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
html[lang="fa"] .kicker,html[lang="ar"] .kicker{letter-spacing:0;text-transform:none}
.lead{color:var(--muted);font-size:1.08rem;max-width:66ch;margin:10px 0 0}
section.blk{margin-top:48px}
section.blk>h2{font-size:1.6rem;margin-bottom:6px}
section.blk>p.sub{color:var(--muted);margin:0 0 18px;max-width:70ch}
.card{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.grid>*{min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 20px;border-radius:12px;border:1px solid transparent;font-weight:700;cursor:pointer;text-decoration:none;font-size:1rem}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--card);color:var(--ink);border-color:var(--rule)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.muted{color:var(--muted)} .small{font-size:.88rem}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--wash);color:var(--muted)}
.b0{background:var(--low-soft);color:var(--low)} .b1{background:var(--mid-soft);color:#8a6a1c} .b2{background:var(--high-soft);color:var(--high)}
:root[data-theme="dark"] .b1{color:var(--mid)} @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .b1{color:var(--mid)}}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:36px;align-items:center}
@media (max-width:880px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero h1{font-size:clamp(1.9rem,4.4vw,2.9rem);margin-top:8px}
.hero .row{margin-top:24px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:28px}
@media (max-width:560px){.facts{grid-template-columns:minmax(0,1fr)}}
.facts div{border-inline-start:3px solid var(--accent);padding-inline-start:12px}
.facts b{display:block;font-size:1.15rem} .facts span{font-size:.86rem;color:var(--muted)}
.preview{padding:18px}
/* steps */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;counter-reset:s}
@media (max-width:820px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.steps{grid-template-columns:minmax(0,1fr)}}
.step{position:relative;padding-top:52px}
.step::before{counter-increment:s;content:counter(s);position:absolute;top:16px;inset-inline-start:20px;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:.9rem}
html[lang="fa"] .step::before{content:counter(s,persian)}
.step b{display:block;margin-bottom:4px}
.step p{margin:0;color:var(--muted);font-size:.93rem}
/* dimension cards */
.dim{cursor:pointer;text-align:start;border:1px solid var(--rule);display:flex;flex-direction:column;gap:8px}
.dim .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:800}
.dim b{font-size:1.05rem}
.dim .q{color:var(--muted);font-size:.93rem;margin:0}
.dim .more{display:none;font-size:.9rem;border-top:1px dashed var(--rule);padding-top:8px}
.dim[aria-expanded="true"] .more{display:block}
.dim .more p{margin:4px 0}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:720px){.split{grid-template-columns:minmax(0,1fr)}}
ul.check{list-style:none;margin:0;padding:0;display:grid;gap:8px}
ul.check li{display:flex;gap:10px} ul.check li::before{content:"✓";color:var(--high);font-weight:800}
.callout{border-inline-start:4px solid var(--mid);background:var(--mid-soft);padding:14px 16px;border-radius:10px}
.callout.care{border-color:var(--accent);background:var(--accent-soft)}
/* take */
.take{max-width:760px;margin:0 auto}
.choice{display:grid;gap:10px}
.choice label{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1.5px solid var(--rule);border-radius:12px;background:var(--card);cursor:pointer}
.choice label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.choice input{margin-top:6px;accent-color:var(--accent);width:18px;height:18px;flex:none}
.choice small{display:block;color:var(--muted)}
fieldset{border:0;margin:0 0 22px;padding:0}
legend{font-weight:700;font-size:1.1rem;margin-bottom:10px;padding:0}
.prog{height:8px;background:var(--wash);border-radius:99px;overflow:hidden;margin:10px 0 4px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.qhead{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--barH,61px));background:var(--bg);z-index:5;padding-block:10px;border-bottom:1px solid var(--rule)}
.item{padding:18px 0;border-bottom:1px solid var(--rule)}
.item.miss .qt{color:var(--low)}
.qt{font-weight:600;margin:0 0 12px;display:flex;gap:10px}
.qt .n{color:var(--muted);font-weight:700;min-width:1.6em}
.scale{display:grid;grid-template-columns:repeat(var(--k),minmax(0,1fr));gap:6px}
.opt{min-height:46px;border:1.5px solid var(--rule);background:var(--card);border-radius:10px;cursor:pointer;font-weight:700;color:var(--muted);padding:4px}
.opt[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.anch{display:flex;justify-content:space-between;gap:12px;font-size:.8rem;color:var(--muted);margin-top:6px}
.anch span:last-child{text-align:end}
.nav2{display:flex;justify-content:space-between;gap:10px;margin-top:24px;flex-wrap:wrap}
/* bars */
.bars{display:grid;gap:14px}
.br{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr) 3.2em;gap:12px;align-items:center}
@media (max-width:520px){.br{grid-template-columns:minmax(0,1fr) 3em}.br .lab{grid-column:1/-1}}
.br .lab{font-weight:600;font-size:.95rem}
.trk{position:relative;height:14px;border-radius:99px;background:linear-gradient(to right,var(--low-soft) 0 37.5%,var(--mid-soft) 37.5% 62.5%,var(--high-soft) 62.5%)}
html[dir="rtl"] .trk{background:linear-gradient(to left,var(--low-soft) 0 37.5%,var(--mid-soft) 37.5% 62.5%,var(--high-soft) 62.5%)}
.trk i{position:absolute;top:0;bottom:0;inset-inline-start:0;border-radius:99px}
.br .v{font-weight:800;text-align:end;font-variant-numeric:tabular-nums}
.legendb{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin-top:10px}
.legendb span{display:inline-flex;gap:6px;align-items:center}.legendb i{width:12px;height:12px;border-radius:3px;display:inline-block}
details.more{margin-top:16px}
details.more summary{cursor:pointer;font-weight:700;color:var(--accent)}
.res-dim{border-top:1px solid var(--rule);padding:14px 0}
.res-dim h4{margin:0 0 4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.res-dim p{margin:4px 0}
.unval{background:var(--mid-soft);border-radius:10px;padding:8px 12px;margin:14px 0 6px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.78rem;word-break:break-all;background:var(--wash);border:1px solid var(--rule);border-radius:8px;padding:10px;direction:ltr;text-align:left;max-height:110px;overflow:auto}
/* report */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:720px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi b{display:block;font-size:1.8rem;font-weight:800;line-height:1.1}
.kpi span{font-size:.85rem;color:var(--muted)}
.tabs{display:inline-flex;border:1px solid var(--rule);border-radius:12px;overflow:hidden;background:var(--card);flex-wrap:wrap}
.tabs button{border:0;background:none;padding:9px 14px;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.scroll{overflow-x:auto;max-width:100%}
table.heat{border-collapse:separate;border-spacing:4px;width:100%;min-width:560px}
table.heat th{font-size:.82rem;color:var(--muted);font-weight:700;text-align:center;padding:4px}
table.heat th.dn{text-align:start;color:var(--ink);font-size:.92rem;white-space:nowrap}
table.heat td{text-align:center;font-weight:800;border-radius:8px;padding:10px 4px;font-variant-numeric:tabular-nums}
table.heat td.na{background:var(--wash);color:var(--muted);font-weight:500;font-size:.75rem}
.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;font-size:.72rem;font-weight:800;color:#fff}
.stack span{display:grid;place-items:center;min-width:0;overflow:hidden}
.pri{display:grid;gap:14px}
.pcard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px}
.rank{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--low);color:#fff;font-weight:800}
.pcard h4{margin:0;font-size:1.08rem}
.pcard .ws{margin-top:10px;padding:12px;border-radius:10px;background:var(--wash)}
input[type=text],textarea,select{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--rule);border-radius:10px;padding:10px 12px;width:100%;max-width:100%}
textarea{min-height:90px}
label.f{display:grid;gap:6px;font-weight:600;font-size:.93rem}
/* workshops */
.wcard h3{font-size:1.15rem;margin:6px 0 10px}
.wcard dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:.9rem;margin:0}
.wcard dt{color:var(--muted)} .wcard dd{margin:0}
.wcard ul{margin:6px 0 0;padding-inline-start:20px;font-size:.93rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
/* method */
table.t{border-collapse:collapse;width:100%;min-width:620px;font-size:.9rem}
table.t th,table.t td{border-bottom:1px solid var(--rule);padding:10px 8px;text-align:start;vertical-align:top}
table.t th{color:var(--muted);font-size:.8rem}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
footer.foot{border-top:1px solid var(--rule);padding-block:24px 40px;color:var(--muted);font-size:.85rem}
/* decision-maker sections */
.why{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:16px}
.why .card b{display:block;font-family:var(--f-display,inherit);font-size:2rem;line-height:1.1;color:var(--accent)}
.why .card p{margin:6px 0 8px}
.why .card small{color:var(--muted);font-size:.78rem}
.gets{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:16px}
.gets .card{border-top:3px solid var(--accent)}
.gets .card b{display:block;margin-bottom:4px}
.gets .card p{margin:0;font-size:.92rem;color:var(--muted)}
.tl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-top:18px;position:relative}
.tl::before{content:"";position:absolute;top:15px;inset-inline:6%;height:3px;background:var(--rule)}
.tl>div{position:relative;padding:0 10px}
.tl .dot{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:.85rem;position:relative}
.tl .wk{display:block;margin-top:10px;font-size:.78rem;color:var(--accent);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.tl b{display:block}
.tl p{margin:4px 0 0;font-size:.9rem;color:var(--muted)}
.need{margin-top:18px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.need b{margin-inline-end:6px}
.need span{background:var(--card);border:1px solid var(--rule);border-radius:999px;padding:4px 12px;font-size:.88rem}
.law{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.law .card b{display:block;color:var(--accent);margin-bottom:4px}
.law .card p{margin:0;font-size:.92rem}
.faq{margin-top:12px;display:grid;gap:8px}
.faq details{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:12px 16px}
.faq summary{cursor:pointer;font-weight:600}
.faq p{margin:8px 0 0;color:var(--muted)}
.ctaband{margin-top:44px;border-radius:20px;padding:28px;background:var(--accent);color:var(--accent-ink);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
.ctaband h2{color:inherit;margin:0 0 6px}
.ctaband p{margin:0;opacity:.9}
.ctaband .row a{background:var(--accent-ink);color:var(--accent);border-color:transparent}
.ctaband .row a.sec{background:transparent;color:var(--accent-ink);border:1.5px solid var(--accent-ink)}
@media (max-width:820px){.why,.law{grid-template-columns:minmax(0,1fr)} .tl{grid-template-columns:minmax(0,1fr);gap:16px} .tl::before{display:none} .ctaband{grid-template-columns:minmax(0,1fr)}}
input[type=number],input[type=email]{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--rule);border-radius:10px;padding:10px 12px;width:100%;max-width:100%}
input[type=range]{width:100%;accent-color:var(--accent)}
a.cite{font-size:.75em;font-weight:700;text-decoration:none;vertical-align:super;line-height:0;margin-inline-start:1px;white-space:nowrap}
.tagfa{font-size:.68rem;font-weight:700;opacity:.65;border:1px solid currentColor;border-radius:4px;padding:0 3px;margin-inline-start:4px}
.calc .cin{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;align-items:start}
.calc .cin label.f{align-content:start}
.calc .cout{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:18px}
.calc .cout>div{background:var(--wash);border-radius:12px;padding:12px 14px}
.calc .cout b{display:block;font-size:1.35rem;font-variant-numeric:tabular-nums}
.calc .cout span{font-size:.85rem;color:var(--muted)}
.calc .cout .big b{color:var(--low)} .calc .cout .save b{color:var(--high)}
.arbo{border-inline-start:4px solid var(--accent);padding-inline-start:18px}
.reqf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;background:var(--card);color:var(--ink);border-radius:14px;padding:16px}
.reqf .btn{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.ctaband .row a.btn.sec{background:transparent;color:var(--accent-ink);border:1.5px solid var(--accent-ink)}
ol.refs{list-style:none;margin:10px 0 0;padding:6px 16px;display:grid}
ol.refs li{display:grid;grid-template-columns:2.2em minmax(0,1fr);gap:8px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:.9rem}
ol.refs li:last-child{border-bottom:0}
ol.refs .rn{font-weight:700;color:var(--accent)}
ol.refs .rt{text-align:start;unicode-bidi:isolate}
ol.refs a{word-break:break-all}
ol.refs li.hl{background:var(--accent-soft);border-radius:8px;padding-inline:8px}
@media (max-width:620px){.reqf{grid-template-columns:minmax(0,1fr)}}
@media (min-width:821px){.ctaband{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr)}}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:16px}
.role{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px}
.role .ric{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--wash);color:var(--accent);font-size:1.2rem}
.role.core .ric{background:var(--accent);color:var(--accent-ink)}

{id:"sreis", fa:"مقیاس خودسنجی هوش هیجانی", en:"Self-Rated Emotional Intelligence Scale (SREIS)", ses:"s14", pkg:"core", tag:"ei",

 "برای بیان احساسات و هیجاناتم، خزانهٔ لغت وسیعی دارم.",

 "می‌توانم بدون آنکه عصبی شوم، شرایط پراسترس را مدیریت کنم.",
 "راهکارهای بهتر کردن و خوب کردن حال مردم را بلدم.",

 "برای بیان و توضیح هیجانات، از ساده تا پیچیده، واژه و کلمه بلدم.",

{id:"bscs", fa:"مقیاس کوتاه خویشتنداری", en:"Brief Self-Control Scale (BSCS)", ses:"s6", pkg:"ext", tag:"selfctrl",
 ref:"Tangney, Baumeister & Boone (2004). Journal of Personality, 72, 271–324.",
 intro:"هر جمله چقدر شما را توصیف می‌کند؟",
 min:1, max:5, anchors:["اصلاً","","","","خیلی زیاد"],
 items:["در مقابله با هوس خوب هستم.","برایم شکستن عادت‌های بد دشوار است.","تنبل هستم.","چیزهای ناشایست و بد به زبان می‌آورم.",
 "کارهای بد و مضر را اگر لذت‌بخش باشند، انجام می‌دهم.","از چیزهایی که برایم مضرند دوری می‌کنم.","آرزو می‌کنم ای کاش انضباط فردی بیشتری داشتم.",
 "مردم می‌گویند که انضباط شخصی آهنین دارم.","گاهی خوش‌گذرانی و لذت‌جویی مانع انجام کارهایم می‌شود.","در تمرکز اشکال دارم.",

{id:"ders", fa:"مقیاس دشواری در تنظیم هیجان", en:"Difficulties in Emotion Regulation Scale (DERS)", ses:"s4", pkg:"ext", tag:"emoreg",
 ref:"Gratz & Roemer (2004). Journal of Psychopathology and Behavioral Assessment, 26, 41–54.",
 intro:"هر جمله چند وقت یک بار دربارهٔ شما صدق می‌کند؟",
 min:1, max:5, anchors:["تقریباً هیچ‌وقت","گاهی","حدود نیمی از اوقات","بیشتر اوقات","تقریباً همیشه"],
 items:["برای من، احساساتم شفاف و واضح‌اند.","به اینکه چه احساساتی دارم، دقت می‌کنم.","احساساتم را به‌صورت شدید و غیرقابل‌کنترل تجربه می‌کنم.",
 "نمی‌دانم واقعاً چه احساسی دارم.","در درک و فهمیدن احساساتم دچار مشکل هستم.","به حس‌هایم توجه می‌کنم و دقیق می‌شوم.","دقیقاً می‌دانم چه حس‌هایی دارم.",
 "برایم مهم است که چه حس‌هایی دارم.","دربارهٔ حس‌هایم احساس گیجی و سرگردانی دارم.","وقتی ناراحتم، احساساتم را انکار نمی‌کنم (قبول دارم که آن احساسات وجود دارند).",
 "وقتی ناراحتم، به‌خاطر احساس ناراحتی از خودم عصبانی می‌شوم.","وقتی ناراحتم، به‌خاطر این احساس دچار شرمساری و خجالت می‌شوم.","وقتی ناراحتم، انجام کارهایم دشوار می‌شود.",
 "وقتی ناراحتم، بدون کنترل و خویشتنداری می‌شوم.","وقتی ناراحتم، حس می‌کنم مدت طولانی همان‌طور خواهم ماند.","وقتی ناراحتم، فکر می‌کنم آخرش افسرده خواهم شد.",
 "وقتی ناراحتم، فکر می‌کنم حس‌هایم معتبر و مهم‌اند.","وقتی ناراحتم، تمرکز روی چیزهای دیگر برایم دشوار می‌شود.","وقتی ناراحتم، احساس خارج از کنترل بودن می‌کنم.",
 "وقتی ناراحتم، هنوز می‌توانم کارها را انجام دهم.","وقتی ناراحتم، بابت احساس ناراحتی‌ام از خودم خجالت می‌کشم.","وقتی ناراحتم، می‌دانم که بالاخره راهی پیدا می‌کنم که بهتر شوم.",
 "وقتی ناراحتم، احساس می‌کنم آدم ضعیفی هستم.","وقتی ناراحتم، حس می‌کنم می‌توانم کنترل رفتارهایم را حفظ کنم.","وقتی ناراحتم، بابت آن احساس گناه می‌کنم.",
 "وقتی ناراحتم، در تمرکز کردن دچار اشکال می‌شوم.","وقتی ناراحتم، در کنترل رفتارم دچار مشکل می‌شوم.","وقتی ناراحتم، حس می‌کنم هیچ کاری نیست که بتوانم انجام دهم تا حالم بهتر شود.",
 "وقتی ناراحتم، به‌خاطر این احساس از دست خودم عصبی می‌شوم.","وقتی ناراحتم، نسبت به خودم حس بدی پیدا می‌کنم.","وقتی ناراحتم، فکر می‌کنم ولو شدن و هیچ کاری نکردن تنها کاری است که می‌توانم بکنم.",
 "وقتی ناراحتم، کنترل خودم را روی اعمالم از دست می‌دهم.","وقتی ناراحتم، فکر کردن دربارهٔ هر چیز دیگری برایم دشوار می‌شود.","وقتی ناراحتم، به خودم کمی زمان می‌دهم تا بفهمم واقعاً چه حس‌هایی دارم.",
 "وقتی ناراحتم، خیلی طول می‌کشد تا بهتر شوم.","وقتی ناراحتم، هیجان‌هایم واقعاً غیرقابل‌تحمل‌اند."],

{id:"socs", fa:"مقیاس شفقت به خود ساسکس-آکسفورد", en:"Sussex-Oxford Compassion for the Self Scale (SOCS-S)", ses:"s3", pkg:"ext", tag:"compassion",
 ref:"Gu, Baer, Cavanagh, Kuyken & Strauss (2020). Assessment, 27(1), 3–20.",
 intro:"هر جمله چقدر دربارهٔ شما درست است؟",
 min:1, max:5, anchors:["هیچ‌وقت درست نیست","به‌ندرت درست است","گاهی درست است","اغلب درست است","همواره درست است"],
 items:["در تشخیص اینکه چه زمانی تنش دارم و ناراحتم، مهارت دارم.","می‌دانم که هر کسی در زمانی از زندگی خود رنج کشیده است.",
 "وقتی در شرایط سختی هستم، به خودم احساس مهربانی دارم.","وقتی ناراحتم، به‌جای اجتناب از حس‌هایم سعی می‌کنم آن‌ها را بپذیرم.",
 "وقتی حالم بد است، حتی اگر نتوانم دربارهٔ علت آن کاری کنم، سعی می‌کنم حال خودم را خوب کنم.","وقتی در فشار و ناراحتی هستم، متوجه حال خودم می‌شوم.",
 "می‌فهمم که گاهی بدحال و ناراحت بودن جزئی از ذات و طبیعت بشری است.","وقتی چیزهای بد اتفاق می‌افتند، نوعی حس مراقبت از خودم پیدا می‌کنم.",
 "با ناراحتی و بدحالی خودم مواجه می‌شوم، بی‌آنکه اجازه دهم بر من غلبه کند و تسلیمش شوم.","وقتی در روزهای دشواری هستم، سعی می‌کنم از خودم مراقبت کنم.",
 "سریع متوجه نشانه‌های اولیهٔ بدحالی و ناراحتی در خودم می‌شوم.","می‌دانم که دیگران هم مثل من درگیر مشکلات و ناملایمات زندگی هستند.",
 "وقتی ناراحتم، سعی می‌کنم به حس‌های خودم دقیق شوم.","بی‌آنکه خودم را قضاوت کنم، با حس‌های خودم مواجه می‌شوم.",
 "وقتی ناراحت و بدحالم، سعی می‌کنم آنچه برای من بهترین است را انجام دهم.","توان شناسایی علائم رنج و ناراحتی در خودم را دارم.",
 "می‌دانم که وقتی شرایط بر وفق مراد پیش نمی‌رود، همهٔ ما ممکن است دچار احساس ناراحتی و بدحالی شویم.",
 "حتی وقتی نسبت به خودم سرخورده و مأیوسم، باز هم می‌توانم در زمان ناراحتی با خودم با گرمی و لطافت برخورد کنم.",
 "وقتی ناراحت و بدحالم، می‌توانم بگذارم هیجان‌ها و احساس‌های منفی آنجا باشند، بی‌آنکه زیر آن‌ها له و تسلیم شوم.",
 "وقتی ناراحتم، بیشترین تلاشم را می‌کنم تا از خودم مراقبت کنم."],

{id:"fcs", fa:"مقیاس‌های ترس از شفقت", en:"Fears of Compassion Scales (FCS)", ses:"s2", pkg:"ext", tag:"fearcomp",
 ref:"Gilbert, McEwan, Matos & Rivis (2011). Psychology and Psychotherapy, 84, 239–255.",
 intro:"سه بخش دارد: ترس از ابراز شفقت به دیگران، ترس از دریافت شفقت از دیگران، و ترس از شفقت به خود.",
 min:1, max:5, anchors:["هیچ‌وقت","","","","همیشه"],
 parts:[[1,"ترس از ابراز شفقت به دیگران"],[11,"ترس از شفقت و مهربانی دیگران به خود"],[24,"ترس از شفقت و مهربانی به خود"]],
 items:["اگر خیلی مهربان به نظر برسم، مردم از من سوءاستفاده خواهند کرد.","مهربانی و شفقت با افرادی که کارهای بدی انجام داده‌اند، آن‌ها را از مجازات خلاص می‌کند.",
 "در زندگی افرادی وجود دارند که مستحق شفقت و مهربانی نیستند.","نگرانم که اگر خیلی مهربان باشم، به هدف راحتی تبدیل شوم.",
 "اگر خیلی مهربان و بخشنده باشی، مردم از تو بهره‌کشی خواهند کرد.","نگرانم که اگر خیلی مهربان باشم، افراد آسیب‌پذیر و شکننده جذبم شوند و منابع روانی‌ام را تحلیل ببرند.",
 "به‌جای اینکه منتظر باشند به آن‌ها کمک شود، هر کسی باید به خودش کمک کند.","بیم آن دارم که اگر خیلی مهربان باشم، بعضی افراد بیش از حد به من وابسته شوند.",
 "بیش از حد مهربان بودن باعث می‌شود آدم به‌راحتی مورد سوءاستفاده قرار گیرد.","فکر می‌کنم برای برخی افراد، انضباط سخت و نوعی مجازات مناسب بهتر از مهربانی و شفقت است.",
 "اینکه بخواهی دیگران با تو مهربان باشند، نشانهٔ ضعف است.","نگرانم وقتی نیاز دارم دیگران درکم کنند و مهربان باشند، مهربان نباشند و مرا درک نکنند.",
 "بیم دارم که وابستهٔ مراقبت و لطف دیگران شوم، چون آن‌ها ممکن است همیشه نباشند تا از من مراقبت کنند.","اغلب در فکرم که آیا ابراز محبت و گرمی دیگران واقعی و از ته دل است.",
 "مهربانی دیگران نسبت به من، به گونه‌ای ترسناک است.","وقتی مردم با من مهربان‌اند و با شفقت رفتار می‌کنند، دچار اضطراب و دستپاچگی می‌شوم.",
 "وقتی دیگران با من صمیمی و مهربان‌اند، نگرانم که چیز بدی دربارهٔ من بفهمند و نظرشان عوض شود.","وقتی افراد با من مهربان و صمیمی‌اند، نگرانم که حتماً از من چیزی می‌خواهند.",
 "وقتی مردم با من مهربان‌اند و با شفقت رفتار می‌کنند، دچار احساس غم و توخالی بودن می‌شوم.","وقتی افراد مهربان‌اند، حس می‌کنم بیش از حد نزدیک شده‌اند.",
 "با وجود آنکه افراد با من مهربان‌اند، به‌ندرت در روابطم احساس گرمی کرده‌ام.","حتی زمانی که می‌دانم دیگران مهربان‌اند، سعی می‌کنم فاصله‌ام را با آن‌ها حفظ کنم.",
 "وقتی حس کنم کسی خیلی با من مهربان و مراقب است، سعی می‌کنم میان خودم و او مرز و فاصله بگذارم.",
 "احساس می‌کنم استحقاق این را ندارم که نسبت به خودم مهربان و بخشنده باشم.","اینکه واقعاً در فکر مهربان و لطیف بودن با خودم باشم، دچار غم می‌شوم.",

ht ansehen oder Antwortcodes importieren.","T.pDemoNote":"Dieser Bericht verwendet simulierte Daten von 180 Personen, damit Sie sehen, wie ein echter Bericht aussieht.","T.wT":"Workshops","T.wP":"Jeder Workshop zielt auf eine oder zwei Dimensionen ab und baut auf dem Material des Kurses von Dr. Mokri auf. Die Leselinks öffnen die Seiten des Kurswikis; die Titel sind hier übersetzt, die Seiten selbst sind auf Persisch.","T.wGoals":"Ziele","T.wWho":"Zielgruppe","T.wLen":"Dauer","T.wEv":"Evidenz","T.wRead":"Hintergrundlektüre im Kurswiki (Seiten auf Persisch)","T.mT":"Methode","T.mP":"Transparent darüber, was wir messen, wie wir auswerten und wo die Grenzen liegen.","T.mInst":"Fragebögen","T.mScore":"Auswertung","T.mScoreP":"Der Mittelwert jeder Unterskala wird auf einen Bereich von 0–100 umgerechnet: (Mittelwert − Minimum) ÷ (Maximum − Minimum) × 100. Invertierte Items werden zuvor umgepolt. Wo ein hoher Wert im Originalfragebogen mehr Schwierigkeiten bedeutet (z. B. AAQ-II), wird der Wert umgepolt, sodass überall „höher = besser“ gilt.","T.mBands":"Wertebereiche","T.mBandsP":"Unter 37,5: braucht Aufmerksamkeit · 37,5 bis 62,5: mittel · über 62,5: stark. Diese Schwellenwerte sind Konventionen, die sich aus dem Skalenbereich ableiten – keine Bevölkerungsnormen und keine klinischen Grenzwerte.","T.mLim":"Grenzen","T.mLimL.0":"Alle Fragebögen beruhen auf Selbstauskunft und können von der Tagesstimmung oder dem Wunsch, gut dazustehen, beeinflusst werden.","T.mLimL.1":"Für die Wertebereiche gibt es keine Bevölkerungsnormen; Vergleiche innerhalb der Organisation und über die Zeit sind aussagekräftiger als Vergleiche mit einem „Landesdurchschnitt“.","T.mLimL.2":"Die Fragebögen sind in ihrer Originalsprache validiert, und die englischen Items folgen dem Originalwortlaut. Die hier verwendeten Versionen in anderen Sprachen, auch diese deutsche, sind in dieser Form nicht gesondert validiert; ihre Reliabilität wird in der Pilotphase geprüft. Verwenden Sie für Forschungszwecke die offiziell validierten Versionen (siehe Quellen).","T.mLimL.3":"Dieses Instrument ist nicht für Entscheidungen über einzelne Personen (Einstellung, Leistungsbeurteilung) gedacht und darf dafür nicht verwendet werden.","T.mEth":"Ethik und Datenschutz","T.mEthL.0":"Die Teilnahme ist freiwillig, und alle können jederzeit aufhören.","T.mEthL.1":"Erfasst werden nur Monat und Jahr, nicht das genaue Datum oder die Uhrzeit.","T.mEthL.2":"Berichte gibt es nur auf Gruppenebene, mit einer Mindestgruppengröße von 5.","T.mEthL.3":"Persönliche Ergebnisse werden nur auf dem eigenen Gerät der teilnehmenden Person angezeigt.","T.mCourse":"Dieser Service ist aus dem Kurs „Persönliche und menschliche Kompetenzen in Organisationen und Bildungseinrichtungen“ von Dr. Azarakhsh Mokri entstanden. Die Fragebögen sind die in den Kursfolien vorgestellten.","T.mWiki":"Vollständiges Kurswiki (Persisch)","T.mOrgPsy":"Arbeits- und Organisationspsychologie","T.items":"Items","T.scale":"Skala","T.ref":"Quelle","T.session":"Kursskript","T.footer":"Wohlbefindens-Check für Organisationen von SoloNovate · Pilotversion · nicht diagnostisch","T.dims":"Dimensionen","T.whyT":"Warum das wichtig ist","T.whyP":"Psychische Gesundheit ist kein weiches Thema; sie zeigt sich in Fehlzeiten, Fluktuation und der Qualität der Arbeit.","T.why.0.0":"1 von 5","T.why.0.1":"Beschäftigten in den Niederlanden berichtet von Burnout-Beschwerden (21 % im Jahr 2025).","T.why.1.0":"12 Milliarden","T.why.1.1":"Arbeitstage gehen weltweit jedes Jahr durch Depression und Angst verloren – das entspricht Produktivitätsverlusten von rund 1 Billion US-Dollar.","T.why.2.0":"Berufsbezogen","T.why.2.1":"Die WHO stuft Burnout (ICD-11) als berufsbezogenes Phänomen ein: ein Problem der Arbeit, nicht nur ein persönliches.","T.getT":"Was Ihre Organisation erhält","T.get.0.0":"Einen Bericht nach Funktionsebene","T.get.0.1":"Acht Dimensionen je Ebene, mit Stärken, Prioritäten und den Unterschieden zwischen den Ebenen.","T.get.1.0":"Eine wissenschaftliche Einordnung","T.get.1.1":"Verständliche Erklärung, was jeder Wert bedeutet und was nicht.","T.get.2.0":"Einen Workshop-Plan","T.get.2.1":"Zwei oder drei Workshops passend zu Ihren Prioritäten, mit Format und Dauer.","T.get.3.0":"Eine persönliche Momentaufnahme für alle Teilnehmenden","T.get.3.1":"Alle Mitarbeitenden sehen ihre eigenen Ergebnisse und zwei praktische Tipps; nichts davon wird an die Leitung weitergegeben.","T.get.4.0":"Eine 45-minütige Nachbesprechung","T.get.4.1":"Besprechung der Ergebnisse mit Leitung und Personalabteilung, mit konkreten nächsten Schritten.","T.pilot.0.0":"Woche 0","T.pilot.0.1":"Auftakt","T.pilot.0.2":"30-minütiges Gespräch: Ziele, Ebenen, Zeitplan und wie die Mitarbeitenden informiert werden.","T.pilot.1.0":"Wochen 1–2","T.pilot.1.1":"Befragung läuft","T.pilot.1.2":"Die Mitarbeitenden füllen den anonymen Check in 8 bis 18 Minuten aus, am Handy oder Computer, in einer von neun Sprachen.","T.pilot.2.0":"Woche 3","T.pilot.2.1":"Bericht","T.pilot.2.2":"Der anonyme Gruppenbericht nach Funktionsebene und der empfohlene Workshop-Plan.","T.pilot.3.0":"Woche 4","T.pilot.3.1":"Nachbesprechung & Auswahl","T.pilot.3.2":"Gespräch mit der Leitung; Auswahl der ersten Workshops und des Zeitpunkts der nächsten Messung.","T.needT":"Was wir von Ihnen brauchen","T.need.0":"Eine Kontaktperson (z. B. Personalabteilung)","T.need.1":"Mindestens 20 Teilnehmende und mindestens 5 je Funktionsebene","T.need.2":"Eine kurze Nachricht an die Mitarbeitenden (wir liefern eine Vorlage)","T.need.3":"Gegebenenfalls die Information des Betriebsrats (OR)","T.need.4":"Insgesamt etwa 3 Stunden Zeit der Personalabteilung, verteilt auf vier Wochen","T.lawT":"Im Einklang mit niederländischen und europäischen Vorschriften","T.law.0.0":"DSGVO","T.law.0.1":"Es werden keine Namen oder Kennungen erhoben; Ergebnisse werden nur für Gruppen ab 5 Personen berichtet.","T.law.1.0":"Arbowet","T.law.1.1":"Unterstützt das PSA-Präventionskonzept des Arbeitgebers (Art. 3 Abs. 2) als eine Quelle neben dem Teil der RI&E zu den Arbeitsbedingungen (Arbobesluit Art. 2.15).","T.law.2.0":"Betriebsrat","T.law.2.1":"Eine solche Mitarbeitendenbefragung wird in der Regel mit dem Betriebsrat (OR) besprochen (WOR Art. 27); wir helfen bei der Vorbereitung.","T.faqT":"Häufige Fragen","T.faq.0.0":"Wie viel Zeit brauchen die Mitarbeitenden dafür?","T.faq.0.1":"Die Kurzversion dauert etwa 8 Minuten, die vollständige Version etwa 18. Sie funktioniert auf jedem Handy oder Computer.","T.faq.1.0":"Können Führungskräfte einzelne Antworten sehen?","T.faq.1.1":"Nein. Es gibt keine Namen, und der Organisationsbericht zeigt nur Gruppen ab fünf Personen.","T.faq.2.0":"Ist das eine Diagnose?","T.faq.2.1":"Nein. Es ist ein nichtklinischer Check auf Basis validierter Fragebögen, um Gruppenmuster zu erkennen und die passende Unterstützung zu wählen. Wer es schwer hat, wird an den betriebsärztlichen Dienst, die Hausarztpraxis oder eine Psychologin bzw. einen Psychologen verwiesen.","T.faq.3.0":"Sind die Fragebögen validiert?","T.faq.3.1":"Alle acht sind international veröffentlicht und in ihrer Originalsprache validiert, und wir verwenden ihre originalen Auswertungsschlüssel (siehe Methode und Quellen). Die englischen Items folgen dem Originalwortlaut; die hier verwendeten Versionen in anderen Sprachen, auch die deutsche, sind in dieser Form noch nicht gesondert validiert. Deshalb prüfen wir mit den Pilotdaten die Reliabilität jeder Skala. Lizenzen für die kommerzielle Nutzung werden mit den Autorinnen und Autoren geregelt.","T.faq.4.0":"Misst das Arbeitsstress oder Burnout?","T.faq.4.1":"Nicht direkt. Es misst psychische Ressourcen, die Menschen helfen, mit Druck umzugehen. Arbeitsbezogene Risiken wie Arbeitsbelastung und Autonomie werden mit einer Befragung zu den Arbeitsbedingungen gemessen. Beides ergänzt sich, und wir helfen Ihnen gern, beides zu kombinieren.","T.faq.5.0":"Funktioniert es auch für große Organisationen?","T.faq.5.1":"Ja. Ein Pilotprojekt kann in einer Abteilung oder an einem Standort beginnen und dann ausgeweitet werden. Die Anonymitätsregeln bleiben bei jeder Größe gleich: Ergebnisse nur für Gruppen ab 5 Personen.","T.faq.6.0":"Wie werden die Antworten in der Pilotphase gesammelt?","T.faq.6.1":"Alle Teilnehmenden senden einen anonymen Antwortcode (nur Antwortnummern und Funktionsebene) per E-Mail direkt an SoloNovate, nie an den Arbeitgeber. SoloNovate löscht diese E-Mails nach dem Einlesen. Für eine flächendeckende Einführung kann eine sichere Online-Erhebung eingerichtet werden.","T.faq.7.0":"Was passiert nach dem Bericht?","T.faq.7.1":"Eine Nachbesprechung, zwei oder drei Workshops unter der Leitung qualifizierter Fachleute aus unserem Partnernetzwerk in den Niederlanden und eine Wiederholungsmessung nach 3 bis 6 Monaten, um zu sehen, was sich verändert hat.","T.ctaT":"Interesse an einem Pilotprojekt?","T.ctaP":"Probieren Sie den Check selbst aus, sehen Sie sich den Beispielbericht an und senden Sie eine kurze Anfrage.","T.calcT":"Was kosten Sie stressbedingte Fehlzeiten?","T.calcP":"Eine schnelle Schätzung für Ihre Organisation. Passen Sie die Zahlen an Ihre Situation an.","T.cEmp":"Anzahl der Mitarbeitenden","T.cAbs":"Krankenstand (%)","T.cAbsH":"Niederländischer Durchschnitt 2025: 5,4 %","T.cSal":"Durchschnittliches Bruttojahresgehalt (€)","T.cShare":"Anteil der Fehltage aufgrund von Stress oder psychischen Beschwerden (%)","T.cShareH":"Landesweite Schätzung: etwa ein Viertel","T.cRed":"Szenario: stressbedingte Fehlzeiten sinken um","T.cDays":"Fehltage pro Jahr","T.cStress":"davon stressbedingt","T.cCost":"Kosten stressbedingter Fehlzeiten pro Jahr","T.cSave":"Einsparung pro Jahr in diesem Szenario","T.cPerDay":"Hier verwendete Kosten pro Fehltag: {x} (Gehalt × 1,3 für Arbeitgeberkosten ÷ 220 Arbeitstage). Niederländische Schätzungen liegen zwischen 250 € und 400 € pro Tag.","T.cNote":"Das ist ein Szenario, keine Vorhersage. Ein Fragebogenwert lässt sich nicht direkt in weniger Fehltage übersetzen. Nutzen Sie die Schätzung, um zu beurteilen, ob sich Prävention lohnt, und die Wiederholungsmessung, um zu sehen, was sich tatsächlich verändert hat.","T.wsPartner":"Durchführung: Jeder Workshop wird von einer erfahrenen Psychologin, einem Psychologen, einer Trainerin oder einem Trainer aus unserem Partnernetzwerk in den Niederlanden geleitet; Organisation und Koordination übernehmen wir.","T.pilotNoteT":"Zu dieser Pilotversion","T.pilotNote":"In der Pilotphase werden die Antworten nur für den Bericht Ihrer Organisation und zur Validierung des Angebots verwendet, für nichts anderes. Lizenzen für die kommerzielle Nutzung der Fragebögen werden parallel mit den Autorinnen und Autoren geregelt. Wir weisen vorab darauf hin, damit es keine Überraschungen gibt.","T.arboT":"Hilft Ihnen, die Pflichten aus der Arbowet zu erfüllen","T.arboP":"Arbeitgeber in den Niederlanden müssen ein Konzept haben, um psychosoziale Arbeitsbelastung (PSA) wie Arbeitsstress zu verhindern oder zumindest zu begrenzen, und die PSA-Risiken in ihrer Risikoinventarisierung und -evaluierung (RI&E) bewerten und dazu einen Maßnahmenplan aufstellen.","T.arbo.0.0":"Ein Baustein für den PSA-Teil Ihrer RI&E","T.arbo.0.1":"PSA-Risiken betreffen vor allem die Arbeit selbst: Arbeitsbelastung, Autonomie, Unterstützung und unerwünschtes Verhalten. Dieser Check ergänzt die andere Seite: welche psychischen Ressourcen Ihre Teams haben, nach Funktionsebene. Nutzen Sie ihn zusätzlich zu einer Befragung zu den Arbeitsbedingungen, nicht als Ersatz dafür.","T.arbo.1.0":"Grundlage für Ihren Maßnahmenplan","T.arbo.1.1":"Der Workshop-Plan und die Wiederholungsmessung liefern konkrete, datierte Maßnahmen, die Sie festhalten können.","T.arbo.2.0":"Sichtbare Nachverfolgung","T.arbo.2.1":"Vorher-nachher-Ergebnisse helfen, dem Betriebsrat zu zeigen, dass Sie gegen die Risiken aktiv werden.","T.arboNote":"Der Check ersetzt weder Ihre RI&E noch eine Befragung zu den Arbeitsbedingungen oder die Prüfung durch eine zertifizierte Fachperson; er ergänzt sie.","T.fName":"Ihr Name","T.fOrg":"Organisation","T.fMail":"E-Mail","T.fSize":"Anzahl der Mitarbeitenden","T.fMsg":"Nachricht (optional)","T.fSend":"Pilotprojekt anfragen","T.fSent":"Ihr E-Mail-Programm öffnet sich mit der ausgefüllten Anfrage; Sie müssen nur noch auf Senden klicken.","T.sizes.0":"20–50","T.sizes.1":"50–250","T.sizes.2":"250–1.000","T.sizes.3":"1.000+","T.sizes.4":"Sonstige","T.ctaAbout":"Über Maryam Jaberi","T.pPlan":"Diesen Workshop planen","T.nSrc":"Quellen","T.sT":"Quellen","T.sP":"Alle Zahlen, Rechtsverweise und Forschungsaussagen dieser Website, mit Link zum Original. Titel von Publikationen stehen in ihrer Originalsprache.","T.gStats":"Zahlen und Kosten","T.gLaw":"Gesetze und Vorschriften","T.gEv":"Forschung hinter den Workshops","T.gInst":"Fragebögen","T.gCourse":"Kurs","T.courseRef":"Mokri, A. Persönliche und menschliche Kompetenzen in Organisationen und Bildungseinrichtungen [Kurs; Persisch]. Kursnotizen, gesammelt im Psychologie-Wiki.","T.audT":"Wo möchten Sie anfangen?","T.paths.0.1":"Geschäftsleitung","T.paths.0.2":"Was es kostet, was es bringt und wie ein Pilotprojekt abläuft.","T.paths.0.3":"Kostenschätzung","T.paths.1.1":"Personalabteilung","T.paths.1.2":"Der Ablauf Woche für Woche, wer was tut, und fertige Dokumente.","T.paths.1.3":"Ablauf und Dokumente","T.paths.2.1":"Mitarbeitende","T.paths.2.2":"Was mit Ihren Antworten passiert – und wie Sie den Check selbst ausprobieren können.","T.paths.2.3":"Ihr Datenschutz","T.paths.3.1":"Psychologinnen, Psychologen, Trainerinnen und Trainer","T.paths.3.2":"Fragebögen, Evidenz und Zusammenarbeit mit uns als Partner.","T.paths.3.3":"Zusammenarbeit","T.tryIt":"Check selbst ausprobieren (8 Min.)","T.jT":"Von der Messung zur Maßnahme","T.jP":"Ein vierwöchiges Pilotprojekt, danach Workshops. Für eine Abteilung oder die ganze Organisation.","T.jAfter.0":"Danach","T.jAfter.1":"Workshops und Wiederholungsmessung","T.jAfter.2":"Workshops unter der Leitung erfahrener Psychologinnen, Psychologen, Trainerinnen oder Trainer; eine Wiederholungsmessung nach 3–6 Monaten zeigt, was sich verändert hat.","T.company":"SoloNovate · Rotterdam · KvK 94264759 · USt-IdNr. NL005072230B46","T.teamT":"Das Team","T.teamP":"Bewusst klein: Sie wissen immer, mit wem Sie es zu tun haben.","T.meRole":"Gründerin von SoloNovate · Produkt und Daten","T.meBio":"Produktmanagerin mit Hintergrund in den Bereichen Suche, Videostreaming und Bildungsplattformen sowie in UX-Research. Entwirft den Check, schützt die Daten und schreibt Ihren Bericht.","T.meLangs":"Niederländisch, Englisch, Persisch","T.phName":"[Name der Psychologin / des Psychologen]","T.phRole":"Psychologin/Psychologe · [Registrierung, z. B. NIP oder BIG]","T.phBio":"[Zwei oder drei Sätze: Erfahrung, Schwerpunkt, mit welchen Organisationen und Teams gearbeitet wurde.]","T.phLangs":"[Sprachen der Workshops]","T.phNote":"Vorschau – so sieht das Profil der Partnerin oder des Partners aus, sobald es ausgefüllt ist.","T.langsL":"Sprachen","T.profile":"Profil","T.nProc":"So funktioniert es","T.prT":"So funktioniert es","T.prP":"Ein klarer Ablauf mit einem kleinen Team: wer was tut, wer was sieht und welche Dokumente wir unterschreiben. Keine Überraschungen für Leitung oder Mitarbeitende.","T.rolesT":"Wer macht was","T.roles.0.2":"Ihre feste Ansprechpartnerin","T.roles.0.3":"Richtet die Befragung ein, schützt die Daten, analysiert die Antworten, schreibt den Bericht und koordiniert alles vom Auftakt bis zur Wiederholungsmessung.","T.roles.1.1":"Partner-Psychologin/-Psychologe","T.roles.1.2":"Erfahren, leitet Workshops für Organisationen","T.roles.1.3":"Prüft die Interpretation des Berichts, nimmt an der Nachbesprechung teil und leitet die Workshops, die Ihre Teams auswählen.","T.roles.2.1":"Ihre Kontaktperson","T.roles.2.2":"Oft die Personalabteilung oder das Office-Management","T.roles.2.3":"Plant die Runde mit uns, informiert die Mitarbeitenden mit unserer Vorlage und ist das Bindeglied zur Leitung.","T.roles.3.1":"Mitarbeitende","T.roles.3.2":"Um sie geht es","T.roles.3.3":"Entscheiden selbst, ob sie teilnehmen, antworten anonym in 8–18 Minuten und sehen sofort ihr eigenes Ergebnis.","T.roles.4.1":"Leitung","T.roles.4.2":"Verantwortlich für die Umsetzung","T.roles.4.3":"Erhält den Gruppenbericht, bespricht ihn in der Nachbesprechung, wählt die nächsten Schritte und teilt eine Zusammenfassung mit den Mitarbeitenden.","T.roles.5.1":"Betriebsrat","T.roles.5.2":"Sofern vorhanden","T.roles.5.3":"Wird vorab informiert und erteilt seine Zustimmung, wo dies gesetzlich vorgeschrieben ist.","T.flowT":"Der Ablauf, Woche für Woche","T.flow.0.0":"Woche 0","T.flow.0.1":"Auftakt","T.flow.0.2.1":"Kontaktperson","T.flow.0.3":"30 Minuten: Ziele, Funktionsebenen und Planung. Wir unterschreiben die Pilotvereinbarung und den Auftragsverarbeitungsvertrag.","T.flow.1.0":"Woche 0","T.flow.1.1":"Mitarbeitende informieren","T.flow.1.2.0":"Leitung","T.flow.1.2.1":"Betriebsrat","T.flow.1.3":"Die Leitung verschickt die vorbereitete Nachricht: warum die Befragung stattfindet, wie die Anonymität gewährleistet ist und was mit den Ergebnissen passiert.","T.flow.2.0":"Wochen 1–2","T.flow.2.1":"Befragung läuft","T.flow.2.2.0":"Mitarbeitende","T.flow.2.3":"Anonyme Fragebögen am Handy oder Computer. Alle sehen ihr eigenes Ergebnis sofort. Eine Erinnerung zur Halbzeit.","T.flow.3.0":"Woche 3","T.flow.3.1":"Analyse und Bericht","T.flow.3.2.1":"Psychologin/Psychologe","T.flow.3.3":"Wir analysieren die Gruppendaten, und die Psychologin oder der Psychologe prüft die Interpretation. Gruppen mit weniger als 5 Personen bleiben ausgeblendet.","T.flow.4.0":"Woche 4","T.flow.4.1":"Nachbesprechung","T.flow.4.2.1":"Psychologin/Psychologe","T.flow.4.2.2":"Leitung","T.flow.4.3":"45 Minuten: was die Ergebnisse bedeuten und mit welchen zwei oder drei Workshops Sie beginnen.","T.flow.5.0":"Woche 4","T.flow.5.1":"Rückmeldung an das Team","T.flow.5.2.0":"Leitung","T.flow.5.3":"Eine kurze Zusammenfassung geht an alle Mitarbeitenden. Wer mitgemacht hat, soll auch erfahren, was daraus wird.","T.flow.6.0":"Danach","T.flow.6.1":"Workshops und Wiederholungsmessung","T.flow.6.2.0":"Psychologin/Psychologe","T.flow.6.3":"Die Psychologin oder der Psychologe leitet die Workshops; eine Wiederholungsmessung nach 3–6 Monaten zeigt, was sich verändert hat.","T.seeT":"Wer sieht was","T.seeP":"Anonymität ist fest im Ablauf verankert, nicht nur versprochen.","T.seeCols.0":"Einzelantworten (ohne Namen)","T.seeCols.1":"Gruppenbericht (ab 5 Personen)","T.see.0.0":"Mitarbeitende","T.see.0.1":"Nur die eigenen","T.see.0.2":"Zusammenfassung","T.see.1.0":"Leitung und Personalabteilung","T.see.1.1":"Nie","T.see.1.2":"Ja","T.see.2.0":"Partner-Psychologin/-Psychologe","T.see.2.1":"Nie","T.see.2.2":"Ja","T.see.3.1":"Ja, ohne Namen","T.see.3.2":"Ja","T.empT":"Für Mitarbeitende: was mit Ihren Antworten passiert","T.emp.0":"Sie werden nie nach Ihrem Namen, Ihrer E-Mail-Adresse oder Personalnummer gefragt.","T.emp.1":"Ihre Führungskraft und die Personalabteilung sehen nur Ergebnisse von Gruppen ab 5 Personen.","T.emp.2":"Sie sehen Ihr eigenes Ergebnis sofort, mit zwei praktischen Tipps. Nur Sie sehen es.","T.emp.3":"Die Teilnahme ist freiwillig. Sie können jederzeit aufhören oder eine Frage überspringen.","T.emp.4":"Wenn Sie einen Antwortcode senden, dann an SoloNovate – nie an Ihre Führungskraft oder die Personalabteilung.","T.docsT":"Beispieldokumente","T.docsP":"Damit Sie vorher genau wissen, was Sie unterschreiben. Jedes Dokument gibt es auf Niederländisch und Englisch, und es lässt sich drucken oder als PDF speichern. Es sind Entwürfe, die wir vor dem Pilotprojekt gemeinsam fertigstellen.","T.docs.pilot-agreement.0":"Pilotvereinbarung","T.docs.pilot-agreement.1":"Was das Pilotprojekt umfasst, Rollen, Anonymität, Preis, Haftung.","T.docs.data-processing.0":"Auftragsverarbeitungsvertrag","T.docs.data-processing.1":"DSGVO Art. 28: welche Daten, Sicherheit, Aufbewahrung und Datenpannen.","T.docs.privacy-participants.0":"Datenschutzhinweis für Teilnehmende","T.docs.privacy-participants.1":"In einfacher Sprache für Mitarbeitende: wer was sieht und welche Rechte Sie haben.","T.docs.staff-announcement.0":"Ankündigung an die Mitarbeitenden","T.docs.staff-announcement.1":"Vorlage für eine Nachricht der Leitung, fertig zum Anpassen.","T.aud.mgmt":"Für die Leitung","T.aud.staff":"Für Mitarbeitende","T.aud.hr":"Für die Personalabteilung","T.open":"Öffnen (Niederländisch / Englisch)","T.rMail":"Code per E-Mail an SoloNovate senden","T.partT":"Für Psychologinnen, Psychologen, Trainerinnen und Trainer","T.partP":"Leiten Sie Workshops oder Coachings für Organisationen? Wir bauen ein kleines Partnernetzwerk auf.","T.partL.0":"Wir übernehmen Messung, Bericht und Kundenkontakt; Sie tun, was Sie am besten können.","T.partL.1":"Jeder Auftrag beginnt mit Daten: Sie wissen vor der ersten Sitzung, welche Themen und Funktionsebenen Aufmerksamkeit brauchen.","T.partL.2":"Workshop-Konzepte mit Evidenz und Quellen liegen einsatzbereit vor und lassen sich anpassen.","T.partL.3":"Sie legen Ihre eigenen Honorare fest und entscheiden, welche Aufträge Sie annehmen.","T.partAsk":"Wir erwarten Erfahrung in der Arbeit mit Gruppen in Organisationen, eine einschlägige Berufsregistrierung (zum Beispiel NIP oder BIG) und die Bereitschaft, Workshops auf Niederländisch oder Englisch zu leiten.","T.partCta":"Partner werden","T.partSubj":"Partneranfrage – Wohlbefindens-Check","T.rvTabs":"Berichtsansichten","T.whatL":"Was Sie sehen","T.howL":"Lesehilfe","T.keyL":"Wichtigste Erkenntnis","T.srcL":"Quelle","T.rv.sum.0":"Zusammenfassung","T.rv.sum.1":"Die wichtigsten Ergebnisse in einfacher Sprache.","T.rv.sum.2":"Die Werte reichen von 0 bis 100: 0 entspricht der niedrigsten möglichen Antwort bei allen Fragen, 100 der höchsten. Unter 37,5 = braucht Aufmerksamkeit, 37,5–62,5 = mittel, über 62,5 = stark.","T.rv.heat.0":"Nach Funktionsebene","T.rv.heat.1":"Der Durchschnittswert jeder Funktionsebene in jeder Dimension.","T.rv.heat.2":"Lesen Sie eine Zeile, um die Ebenen zu vergleichen; eine Spalte zeigt das Profil einer Ebene. Warme Farben bedeuten „braucht Aufmerksamkeit“, Grün bedeutet „stark“. Gruppen mit weniger als 5 Personen sind ausgeblendet.","T.rv.gap.0":"Unterschiede zwischen Ebenen","T.rv.gap.1":"Für jede Dimension: wo jede Funktionsebene liegt, vom niedrigsten bis zum höchsten Wert.","T.rv.gap.2":"Eine lange Linie bedeutet, dass die Ebenen dies sehr unterschiedlich erleben. Das deutet oft auf die Arbeit oder die Rolle hin, nicht auf einzelne Personen.","T.rv.dist.0":"Verteilung","T.rv.dist.1":"Wie viele Personen in jeden Bereich fallen, je Dimension.","T.rv.dist.2":"Ein Durchschnitt kann eine Gruppe verbergen, der es schlecht geht. Der rote Teil zeigt den Anteil der Personen im Bereich „braucht Aufmerksamkeit“.","T.rv.prof.0":"Profil einer Ebene","T.rv.prof.1":"Eine Funktionsebene im Vergleich zur gesamten Organisation.","T.rv.prof.2":"Der Balken ist der Wert der Ebene, die dünne Linie der Durchschnitt der Organisation. Die Zahl rechts ist die Differenz: positiv heißt besser als der Durchschnitt.","T.rv.sub.0":"Zugrunde liegende Aspekte","T.rv.sub.1":"Die Bestandteile jeder Dimension.","T.rv.sub.2":"Wenn eine Dimension niedrig ist, zeigt dies, welcher Teil sie nach unten zieht – und damit, welche Art von Workshop am meisten hilft. Höher ist hier immer besser.","T.rv.time.0":"Verlauf","T.rv.time.1":"Die erste Messung im Vergleich zur Wiederholungsmessung.","T.rv.time.2":"Heller Balken = erste Messung, dunkler Balken = Wiederholungsmessung. Veränderungen unter etwa 3 Punkten können zufällig sein.","T.rv.plan.0":"Maßnahmenplan","T.rv.plan.1":"Woran Sie zuerst arbeiten, für wen und mit welchem Workshop.","T.rv.plan.2":"Eine Dimension hat Priorität, wenn ihr Durchschnitt unter 55 liegt oder mehr als 25 % der Personen im Bereich „braucht Aufmerksamkeit“ liegen.","T.kpiSub.0":"Personen haben geantwortet","T.kpiSub.1":"Funktionsebenen mit mind. 5 Personen","T.kpiSub.2":"Durchschnitt aller Dimensionen (0–100)","T.kpiSub.3":"aller Werte liegen im Bereich „braucht Aufmerksamkeit“","T.sumN":"Basierend auf {n} Teilnehmenden in {k} Funktionsebenen.","T.sumStrong":"Am stärksten: {a}.","T.sumWeak":"Braucht am meisten Aufmerksamkeit: {d} ({m}); {p} der Personen liegen im Bereich „braucht Aufmerksamkeit“.","T.sumGap":"Größter Unterschied zwischen den Ebenen: {d} – {hi}: {a}, {lo}: {b}.","T.sumNext":"Vorgeschlagener erster Schritt: der Workshop „{w}“ – vor allem für folgende Ebenen: {who}.","T.and":"und","T.heatKey":"Niedrigster Wert: {lv} bei {d} ({v}). Höchster: {lv2} bei {d2} ({v2}).","T.gapKey":"Größter Unterschied: {d} – {lo}: {a}, {hi}: {b} ({x} Punkte).","T.distKey":"{d}: {p} der Personen liegen im Bereich „braucht Aufmerksamkeit“, obwohl der Durchschnitt bei {m} liegt.","T.profSel":"Funktionsebene","T.profUp":"{lv} – über dem Durchschnitt der Organisation: {a}.","T.profDown":"{lv} – unter dem Durchschnitt der Organisation: {b}.","T.profFlat":"{lv}: überall nah am Durchschnitt der Organisation.","T.orgAvg":"Durchschnitt der Organisation","T.subKey":"Niedrigster Aspekt: {s} innerhalb der Dimension {d} ({v}).","T.timeDemo":"Simuliertes Beispiel: Wiederholungsmessung vier Monate nach Workshops zu Selbstmitgefühl und Flow.","T.timeKey":"Größte Verbesserung: {d} (+{x}). Kleinste Veränderung: {d2} ({y}).","T.timeNone":"Diese Ansicht ist nach der Wiederholungsmessung verfügbar (3–6 Monate nach den Workshops).","T.t1":"Erste Messung","T.t2":"Wiederholungsmessung","T.rHow":"Jeder Wert reicht von 0 bis 100. Die Hintergrundfarbe zeigt den Bereich: Rot = braucht Aufmerksamkeit, Gelb = mittel, Grün = stark. Das ist eine Momentaufnahme, keine Diagnose.","T.ariaHome":"Startseite","T.ariaNav":"Bereiche","T.ariaLang":"Sprache","T.tUnval":"Diese Fragen sind unsere eigene deutsche Übersetzung der Originalfragebögen und noch nicht gesondert validiert. Sie werden genauso ausgewertet; ihre Reliabilität prüfen wir in der Pilotphase.","DIMS.compassion.n":"Selbstmitgefühl","DIMS.compassion.q":"Bin ich freundlich oder hart zu mir, wenn ich scheitere oder es schwer habe?","DIMS.compassion.what":"Wie Menschen in Zeiten von Misserfolg und Schmerz mit sich umgehen: freundlich und ausgeglichen oder selbstkritisch und überwältigt.","DIMS.compassion.not":"Nicht Faulheit, Egoismus oder das Senken der eigenen Ansprüche.","DIMS.compassion.b.0":"Die Selbstkritik ist stark. Fehler werden wahrscheinlich mit Vorwürfen, Rückzug und Grübeln beantwortet.","DIMS.compassion.b.1":"Mal freundlich, mal hart; unter Druck kippt es in Richtung Selbstvorwurf.","DIMS.compassion.b.2":"In schweren Zeiten freundlich und ausgeglichen sich selbst gegenüber; lernt aus Fehlern, ohne sich selbst anzugreifen.","DIMS.compassion.tips.0":"Fragen Sie sich nach einem Fehler: „Was würde ich einer Freundin oder einem Freund in dieser Lage sagen?“ – und sagen Sie es sich selbst.","DIMS.compassion.tips.1":"Denken Sie daran, dass alle Menschen Fehler machen; benennen Sie das Gefühl, ohne darin zu versinken.","DIMS.flex.n":"Psychologische Flexibilität","DIMS.flex.q":"Halten mich schwierige Gedanken und Gefühle von dem ab, was mir wichtig ist?","DIMS.flex.what":"Wie sehr unangenehme Gedanken und Gefühle einem Leben und Arbeiten nach den eigenen Werten im Weg stehen.","DIMS.flex.not":"Ein niedriger Wert ist keine Diagnose; er zeigt, dass der Umgang mit Gefühlen gerade schwerfällt.","DIMS.flex.b.0":"Schmerzhafte Gedanken und Gefühle nehmen viel Raum ein und blockieren wahrscheinlich wichtige Handlungen.","DIMS.flex.b.1":"Das Ringen mit Gefühlen stört manchmal, aber die Arbeit läuft meist weiter.","DIMS.flex.b.2":"Kann sich auch bei schwierigen Gefühlen auf das zubewegen, was wichtig ist.","DIMS.flex.tips.0":"Statt gegen einen Gedanken anzukämpfen, sagen Sie sich: „Ich habe den Gedanken, dass …“ – und machen Sie den nächsten kleinen Schritt.","DIMS.flex.tips.1":"Tun Sie jeden Tag eine kleine Handlung, die zu Ihren Werten passt, auch wenn Sie sich noch nicht ganz bereit fühlen.","DIMS.optim.n":"Optimismus","DIMS.optim.q":"Erwarte ich im Allgemeinen, dass die Dinge gut ausgehen?","DIMS.optim.what":"Die allgemeine Erwartung eines Menschen an die Zukunft: eher Gutes oder eher Schlechtes.","DIMS.optim.not":"Es geht nicht um die Zukunft der Organisation oder die Arbeitszufriedenheit; Optimismus ist ein eher stabiles persönliches Merkmal.","DIMS.optim.b.0":"Die Erwartung, dass Dinge schlecht ausgehen, ist ausgeprägt; die Energie, dranzubleiben, ist womöglich geringer.","DIMS.optim.b.1":"Eine ausgewogene Sicht; weder sehr hoffnungsvoll noch pessimistisch.","DIMS.optim.b.2":"Erwartet im Allgemeinen, dass Dinge gut ausgehen; meist verbunden mit mehr Ausdauer und besserer Gesundheit.","DIMS.optim.tips.0":"Schreiben Sie einige Minuten über Ihr „bestmögliches Selbst“ in einem Jahr; diese Übung hat in Studien den Optimismus gesteigert.","DIMS.optim.tips.1":"Schreiben Sie neben jede Sorge einen Plan „Wenn das passiert, dann werde ich …“.","DIMS.hope.n":"Hoffnung","DIMS.hope.q":"Habe ich Ziele, Wege dorthin und die Energie, sie anzugehen?","DIMS.hope.what":"Hoffnung im wissenschaftlichen Sinn: Ziele haben, Wege zu ihnen finden (engl. pathways) und die Energie und Zuversicht haben, sie zu verfolgen (Antrieb, engl. agency).","DIMS.hope.not":"Nicht dasselbe wie Optimismus; Hoffnung betrifft die eigene Fähigkeit, ans Ziel zu kommen.","DIMS.hope.b.0":"Wege oder Energie zum Erreichen von Zielen sind gering; das Gefühl, festzustecken, ist wahrscheinlicher.","DIMS.hope.b.1":"Ziele und Wege sind da, aber die Energie sinkt, wenn Hindernisse auftauchen.","DIMS.hope.b.2":"Klare Ziele, mehrere Wege und genug Energie; sagt bessere Leistungen voraus.","DIMS.hope.tips.0":"Schreiben Sie für ein wichtiges Ziel mindestens drei verschiedene Wege auf.","DIMS.hope.tips.1":"Nutzen Sie WOOP: Wunsch (Wish), Ergebnis (Outcome), inneres Hindernis (Obstacle) und einen „Wenn … dann …“-Plan.","DIMS.belong.n":"Zugehörigkeit","DIMS.belong.q":"Fühle ich mich als Teil der Gruppe und akzeptiert?","DIMS.belong.what":"Ein allgemeines Gefühl von Zugehörigkeit und Akzeptanz in Beziehungen, im Leben und im Umgang mit anderen.","DIMS.belong.not":"Nicht nur auf den Arbeitsplatz bezogen; gemessen wird Zugehörigkeit in allen Lebensbereichen.","DIMS.belong.b.0":"Das Gefühl, außen vor oder abgelehnt zu sein, ist stark; ein wichtiger Treiber von Burnout und Kündigungen.","DIMS.belong.b.1":"Teilweise Zugehörigkeit; in manchen Gruppen dabei, in anderen nicht.","DIMS.belong.b.2":"Fühlt sich akzeptiert und verbunden; eine wichtige Säule der psychischen Gesundheit.","DIMS.belong.tips.0":"Führen Sie diese Woche ein kurzes Gespräch mit einer Kollegin oder einem Kollegen, das sich nicht um die Arbeit dreht.","DIMS.belong.tips.1":"Bitten Sie jemanden, Sie in eine Aufgabe oder einen Plan einzubeziehen; auch um Hilfe zu bitten, schafft Verbundenheit.","DIMS.flow.n":"Flow bei der Arbeit","DIMS.flow.q":"Gehe ich in meiner Arbeit auf, genieße ich sie und tue ich sie um ihrer selbst willen?","DIMS.flow.what":"Flow bei der Arbeit in den letzten zwei Wochen: Vertiefung, Freude und intrinsische Motivation.","DIMS.flow.not":"Weder Einsatz noch Arbeitsstunden; gemessen wird die Qualität des Arbeitserlebens.","DIMS.flow.b.0":"Die Arbeit fesselt oder erfreut weniger; möglicherweise gibt es viele Unterbrechungen oder wenig Sinnerleben.","DIMS.flow.b.1":"Flow und Freude gibt es zeitweise, aber nicht beständig.","DIMS.flow.b.2":"Vertieft, mit Freude und intrinsisch motiviert; verbunden mit besserer Leistung und mehr Sinnerleben.","DIMS.flow.tips.0":"Blocken Sie jeden Tag 60–90 Minuten für konzentrierte Arbeit ohne Nachrichten oder Meetings.","DIMS.flow.tips.1":"Gestalten Sie einen Teil Ihrer Arbeit so um, dass er besser zu Ihren Stärken und Interessen passt (Job Crafting).","DIMS.ei.n":"Emotionale Intelligenz","DIMS.ei.q":"Verstehe und steuere ich meine eigenen Gefühle und die anderer?","DIMS.ei.what":"Wie Menschen ihre Fähigkeiten einschätzen, Gefühle bei sich und anderen zu verstehen und zu steuern.","DIMS.ei.not":"Selbsteinschätzung, kein Fähigkeitstest; kann von der tatsächlichen Fähigkeit abweichen.","DIMS.ei.b.0":"Schätzt sich als weniger kompetent darin ein, Gefühle zu erkennen oder zu steuern.","DIMS.ei.b.1":"In manchen emotionalen Fähigkeiten stark, in anderen schwächer.","DIMS.ei.b.2":"Sieht sich als fähig, Gefühle bei sich und anderen zu verstehen und zu steuern.","DIMS.ei.tips.0":"Geben Sie Ihrem Gefühl dreimal am Tag einen genauen Namen („genervt“ statt „schlecht“).","DIMS.ei.tips.1":"Wenn eine Kollegin oder ein Kollege aufgewühlt ist, spiegeln Sie zuerst („du wirkst müde“) und bieten dann Lösungen an.","DIMS.selfctrl.n":"Selbstkontrolle","DIMS.selfctrl.q":"Widerstehe ich Versuchungen und bleibe ich bei langfristigen Zielen?","DIMS.selfctrl.what":"Die Fähigkeit, Impulse zu kontrollieren, Versuchungen zu widerstehen und bei langfristigen Zielen zu bleiben.","DIMS.selfctrl.not":"Ein niedriger Wert bedeutet keinen schwachen Willen; Umgebung und Gewohnheiten spielen eine große Rolle.","DIMS.selfctrl.b.0":"Versuchungen und Ablenkungen gewinnen oft; die Umgebung enthält wahrscheinlich ungünstige Reize.","DIMS.selfctrl.b.1":"In manchen Bereichen konsequent, in anderen wird eher aufgeschoben.","DIMS.selfctrl.b.2":"Bleibt meist bei langfristigen Zielen – vor allem dank guter Gewohnheiten, weniger dank Willenskraft.","DIMS.selfctrl.tips.0":"Gestalten Sie Ihre Umgebung: Legen Sie Ihr Handy während konzentrierter Arbeit in einen anderen Raum.","DIMS.selfctrl.tips.1":"Verbinden Sie eine schwierige Aufgabe mit einem kleinen Vergnügen (z. B. Ihren Lieblingspodcast nur beim Spazierengehen hören).","WS.w-comp.t":"Selbstmitgefühl und der innere Kritiker","WS.w-comp.who":"Alle Ebenen; Version für Führungskräfte: mitfühlende Führung","WS.w-comp.goals.0":"Den inneren Kritiker und seine Kosten erkennen","WS.w-comp.goals.1":"Die drei Komponenten des Selbstmitgefühls üben: Selbstfreundlichkeit, gemeinsames Menschsein, Achtsamkeit","WS.w-comp.goals.2":"Mit Fehlern im Team umgehen, ohne jemanden bloßzustellen","WS.w-comp.ev":"Eine Metaanalyse von 27 randomisierten Studien fand mittlere Effekte von Selbstmitgefühlstraining auf Stress und Selbstkritik.","WSLEN.w-comp":"2 × 3 Stunden","WS.w-flex.t":"Psychologische Flexibilität und Emotionsregulation","WS.w-flex.who":"Alle Ebenen, besonders Rollen mit hohem Druck","WS.w-flex.goals.0":"Abstand zu Gedanken gewinnen, ohne gegen sie anzukämpfen","WS.w-flex.goals.1":"Berufliche Werte klären","WS.w-flex.goals.2":"Das Prozessmodell der Emotionsregulation und vier vorausschauende Strategien","WS.w-flex.ev":"Eine Metaanalyse von Acceptance-and-Commitment-Trainings (ACT) am Arbeitsplatz fand eine kleine bis mittlere Verringerung von Stress und psychischer Belastung, am stärksten bei Büroangestellten.","WSLEN.w-flex":"2 × 3 Stunden","WS.w-hope.t":"Hoffnung und realistischer Optimismus","WS.w-hope.who":"Alle Ebenen; geeignet in Zeiten organisatorischer Veränderung","WS.w-hope.goals.0":"Die Übung „bestmögliches Selbst“","WS.w-hope.goals.1":"WOOP und „Wenn … dann …“-Pläne","WS.w-hope.goals.2":"Das Fortschrittsprinzip: kleine Erfolge wahrnehmen","WS.w-hope.ev":"WOOP (mentales Kontrastieren mit „Wenn … dann …“-Plänen) hat einen kleinen bis mittleren Effekt auf das Erreichen von Zielen; die Übung „bestmögliches Selbst“ steigert den Optimismus leicht.","WSLEN.w-hope":"1 × 4 Stunden","WS.w-belong.t":"Zugehörigkeit und Verbundenheit bei der Arbeit","WS.w-belong.who":"Teams gemeinsam mit ihren Führungskräften","WS.w-belong.goals.0":"Mit Unbekannten sprechen und ehrliche Komplimente machen","WS.w-belong.goals.1":"Onboarding- und Buddy-Programme für neue Mitarbeitende","WS.w-belong.goals.2":"Bedeutsamkeit („Mattering“): gesehen werden und etwas beitragen","WS.w-belong.ev":"Eine kurze Zugehörigkeitsintervention hatte in einer bekannten Studie dauerhafte Effekte; eine große Folgestudie von 2023 zeigte, dass der Effekt vom Umfeld abhängt.","WSLEN.w-belong":"1 × 3 Stunden + Teamprogramm","WS.w-flow.t":"Konzentriertes Arbeiten, Flow und Abschalten","WS.w-flow.who":"Alle Ebenen; Version für Führungskräfte: Fokuszeit des Teams schützen","WS.w-flow.goals.0":"Job Crafting: die eigene Arbeit selbst umgestalten","WS.w-flow.goals.1":"Ungestörte Fokusblöcke","WS.w-flow.goals.2":"Psychisches Abschalten nach Feierabend","WS.w-flow.ev":"Metaanalysen bringen Job Crafting mit höherem Arbeitsengagement und Abschalten nach der Arbeit mit weniger Erschöpfung in Verbindung; diese Evidenz ist überwiegend korrelativ.","WSLEN.w-flow":"1 × 4 Stunden","WS.w-ei.t":"Emotionale Intelligenz in der Praxis","WS.w-ei.who":"Rollen mit Kundenkontakt, Führungskräfte und Vorgesetzte","WS.w-ei.goals.0":"Gefühle genau benennen","WS.w-ei.goals.1":"Auf die Gefühle von Kolleginnen, Kollegen und Kunden reagieren","WS.w-ei.goals.2":"Emotionsarbeit und Burnout-Prävention","WS.w-ei.ev":"Im Durchschnitt steigert ein EI-Training die EI-Werte mäßig; selbst eingeschätzte EI überschneidet sich mit der Persönlichkeit, daher sollten die Werte mit Vorsicht interpretiert werden.","WSLEN.w-ei":"2 × 3 Stunden","WS.w-self.t":"Selbstkontrolle durch Gestaltung: Umgebung, Gewohnheiten und Versuchungsbündelung","WS.w-self.who":"Alle Ebenen; Version für Führungskräfte: Nudges und gesunde Voreinstellungen (Defaults)","WS.w-self.goals.0":"Situationen wählen und verändern, statt Willenskraft zu erzwingen","WS.w-self.goals.1":"Gewohnheiten und Erinnerungsreize aufbauen","WS.w-self.goals.2":"Versuchungsbündelung (eine kleine Belohnung an eine lästige Aufgabe koppeln) und Notreserven (geplante Ausnahmetage)","WS.w-self.ev":"Die Situation zu gestalten wirkt besser, als sich im Moment auf Willenskraft zu verlassen; Versuchungsbündelung half in einem Feldexperiment, doch der Effekt ließ mit der Zeit nach.","WSLEN.w-self":"1 × 4 Stunden","LEVELS.staff":"Mitarbeitende","LEVELS.lead":"Teamleitungen","LEVELS.mid":"Mittleres Management","LEVELS.senior":"Obere Führungsebene","LEVELS.student":"Studierende","SUBN.scs.sk":"Selbstfreundlichkeit","SUBN.scs.sj":"Weniger Selbstverurteilung","SUBN.scs.ch":"Gemeinsames Menschsein","SUBN.scs.is":"Weniger Isolation","SUBN.scs.mi":"Achtsamkeit","SUBN.scs.oi":"Weniger Überidentifikation (nicht von Gefühlen mitgerissen)","SUBN.ahs.path":"Wege (Möglichkeiten, Ziele zu erreichen)","SUBN.ahs.agency":"Antrieb (zielgerichtete Energie)","SUBN.gbs.acc":"Akzeptanz / Einbezogensein","SUBN.gbs.rej":"Weniger Ablehnung","SUBN.wolf.abs":"Vertiefung","SUBN.wolf.enj":"Freude an der Arbeit","SUBN.wolf.int":"Intrinsische Motivation","SUBN.sreis.p":"Gefühle wahrnehmen","SUBN.sreis.u":"Gefühle nutzen","SUBN.sreis.r":"Gefühle verstehen","SUBN.sreis.m1":"Eigene Gefühle steuern","SUBN.sreis.m2":"Gefühle anderer steuern","PACKS.quick":"Kurz","PACKS.standard":"Vollständig","INST.scs.name":"Selbstmitgefühlsskala – Kurzform","INST.scs.intro":"Wie gehen Sie in schwierigen Zeiten normalerweise mit sich selbst um?","INST.scs.anchors.0":"Fast nie","INST.scs.anchors.4":"Fast immer","INST.scs.items.0":"Wenn ich bei etwas scheitere, das mir wichtig ist, nehmen mich Gefühle der Unzulänglichkeit völlig ein.","INST.scs.items.1":"Ich versuche, verständnisvoll und geduldig mit den Seiten meiner Persönlichkeit zu sein, die ich nicht mag.","INST.scs.items.2":"Wenn etwas Schmerzhaftes passiert, versuche ich, die Situation ausgewogen zu betrachten.","INST.scs.items.3":"Wenn ich niedergeschlagen bin, habe ich oft das Gefühl, dass die meisten anderen wahrscheinlich glücklicher sind als ich.","INST.scs.items.4":"Ich versuche, meine Schwächen als Teil des Menschseins zu sehen.","INST.scs.items.5":"Wenn ich eine sehr schwere Zeit durchmache, schenke ich mir die Fürsorge und Zuwendung, die ich brauche.","INST.scs.items.6":"Wenn mich etwas aufregt, versuche ich, meine Gefühle im Gleichgewicht zu halten.","INST.scs.items.7":"Wenn ich bei etwas scheitere, das mir wichtig ist, fühle ich mich mit meinem Scheitern oft allein.","INST.scs.items.8":"Wenn ich niedergeschlagen bin, neige ich dazu, zu grübeln und mich auf alles zu fixieren, was nicht stimmt.","INST.scs.items.9":"Wenn ich mich irgendwie unzulänglich fühle, versuche ich mir in Erinnerung zu rufen, dass die meisten Menschen solche Gefühle kennen.","INST.scs.items.10":"Ich missbillige und verurteile meine eigenen Fehler und Schwächen.","INST.scs.items.11":"Ich bin intolerant und ungeduldig gegenüber den Seiten meiner Persönlichkeit, die ich nicht mag.","INST.aaq.name":"Fragebogen zu Akzeptanz und Handeln II (AAQ-II)","INST.aaq.intro":"Wie sehr trifft jede Aussage auf Sie zu?","INST.aaq.anchors.0":"Trifft nie zu","INST.aaq.anchors.6":"Trifft immer zu","INST.aaq.items.0":"Meine schmerzhaften Erfahrungen und Erinnerungen machen es mir schwer, ein Leben zu führen, das ich als wertvoll empfinden würde.","INST.aaq.items.1":"Ich habe Angst vor meinen Gefühlen.","INST.aaq.items.2":"Ich mache mir Sorgen, meine Sorgen und Gefühle nicht kontrollieren zu können.","INST.aaq.items.3":"Meine schmerzhaften Erinnerungen hindern mich an einem erfüllten Leben.","INST.aaq.items.4":"Gefühle verursachen Probleme in meinem Leben.","INST.aaq.items.5":"Es scheint, als kämen die meisten Menschen besser mit ihrem Leben zurecht als ich.","INST.aaq.items.6":"Sorgen stehen meinem Erfolg im Weg.","INST.lot.name":"Lebensorientierungstest – revidiert (LOT-R)","INST.lot.intro":"Wie sehr stimmen Sie jeder Aussage zu? Vier Aussagen sind Füllaussagen und werden nicht ausgewertet.","INST.lot.anchors.0":"Stimme überhaupt nicht zu","INST.lot.anchors.1":"Stimme nicht zu","INST.lot.anchors.2":"Neutral","INST.lot.anchors.3":"Stimme zu","INST.lot.anchors.4":"Stimme voll und ganz zu","INST.lot.items.0":"In unsicheren Zeiten erwarte ich normalerweise das Beste.","INST.lot.items.1":"Es fällt mir leicht, mich zu entspannen.","INST.lot.items.2":"Wenn bei mir etwas schiefgehen kann, dann geht es auch schief.","INST.lot.items.3":"Ich bin immer optimistisch, was meine Zukunft angeht.","INST.lot.items.4":"Ich bin sehr gern mit meinen Freunden zusammen.","INST.lot.items.5":"Es ist mir wichtig, beschäftigt zu sein.","INST.lot.items.6":"Ich erwarte fast nie, dass die Dinge so laufen, wie ich es mir wünsche.","INST.lot.items.7":"Ich gerate nicht so leicht aus der Fassung.","INST.lot.items.8":"Ich rechne selten damit, dass mir Gutes widerfährt.","INST.lot.items.9":"Alles in allem erwarte ich, dass mir mehr Gutes als Schlechtes widerfährt.","INST.ahs.name":"Hoffnungsskala für Erwachsene (AHS)","INST.ahs.intro":"Wie sehr trifft jede Aussage auf Sie zu? Vier Aussagen sind Füllaussagen.","INST.ahs.anchors.0":"Trifft überhaupt nicht zu","INST.ahs.anchors.7":"Trifft voll und ganz zu","INST.ahs.items.0":"Mir fallen viele Wege ein, um aus einer Klemme herauszukommen.","INST.ahs.items.1":"Ich verfolge meine Ziele mit Energie.","INST.ahs.items.2":"Ich fühle mich die meiste Zeit müde.","INST.ahs.items.3":"Für jedes Problem gibt es viele Lösungswege.","INST.ahs.items.4":"In einer Diskussion lasse ich mich leicht unterkriegen.","INST.ahs.items.5":"Mir fallen viele Wege ein, um die Dinge im Leben zu erreichen, die mir wichtig sind.","INST.ahs.items.6":"Ich mache mir Sorgen um meine Gesundheit.","INST.ahs.items.7":"Selbst wenn andere entmutigt sind, weiß ich, dass ich einen Weg finden kann, das Problem zu lösen.","INST.ahs.items.8":"Meine bisherigen Erfahrungen haben mich gut auf meine Zukunft vorbereitet.","INST.ahs.items.9":"Ich war bisher im Leben ziemlich erfolgreich.","INST.ahs.items.10":"Meistens mache ich mir über irgendetwas Sorgen.","INST.ahs.items.11":"Ich erreiche die Ziele, die ich mir setze.","INST.gbs.name":"Allgemeine Zugehörigkeitsskala (GBS)","INST.gbs.intro":"Wie sehr stimmen Sie jeder Aussage zu?","INST.gbs.anchors.0":"Stimme überhaupt nicht zu","INST.gbs.anchors.6":"Stimme voll und ganz zu","INST.gbs.items.0":"Wenn ich mit anderen Menschen zusammen bin, fühle ich mich einbezogen.","INST.gbs.items.1":"Ich habe enge Bindungen zu Familie und Freunden.","INST.gbs.items.2":"Ich fühle mich wie ein Außenseiter.","INST.gbs.items.3":"Ich habe das Gefühl, dass ich anderen egal bin.","INST.gbs.items.4":"Ich fühle mich von anderen akzeptiert.","INST.gbs.items.5":"Weil ich nicht dazugehöre, habe ich in der Feiertagszeit das Gefühl, abseits zu stehen.","INST.gbs.items.6":"Ich fühle mich vom Rest der Welt isoliert.","INST.gbs.items.7":"Ich habe ein Gefühl der Zugehörigkeit.","INST.gbs.items.8":"Wenn ich mit anderen Menschen zusammen bin, fühle ich mich fremd.","INST.gbs.items.9":"Unter anderen Menschen habe ich meinen Platz.","INST.gbs.items.10":"Ich fühle mich mit anderen verbunden.","INST.gbs.items.11":"Freunde und Familie beziehen mich nicht in ihre Pläne ein.","INST.wolf.name":"Fragebogen zu arbeitsbezogenem Flow (WOLF)","INST.wolf.intro":"Wie oft haben Sie in den letzten zwei Wochen Folgendes erlebt?","INST.wolf.anchors.0":"Nie","INST.wolf.anchors.1":"Fast nie","INST.wolf.anchors.2":"Manchmal","INST.wolf.anchors.3":"Regelmäßig","INST.wolf.anchors.4":"Oft","INST.wolf.anchors.5":"Sehr oft","INST.wolf.anchors.6":"Immer","INST.wolf.items.0":"Wenn ich arbeite, denke ich an nichts anderes.","INST.wolf.items.1":"Meine Arbeit reißt mich mit.","INST.wolf.items.2":"Wenn ich arbeite, vergesse ich alles um mich herum.","INST.wolf.items.3":"Ich bin völlig in meine Arbeit vertieft.","INST.wolf.items.4":"Meine Arbeit gibt mir ein gutes Gefühl.","INST.wolf.items.5":"Ich mache meine Arbeit mit viel Freude.","INST.wolf.items.6":"Ich fühle mich bei der Arbeit glücklich.","INST.wolf.items.7":"Ich bin fröhlich, wenn ich arbeite.","INST.wolf.items.8":"Ich würde diese Arbeit auch dann machen, wenn ich weniger dafür bezahlt bekäme.","INST.wolf.items.9":"Ich merke, dass ich auch in meiner Freizeit arbeiten möchte.","INST.wolf.items.10":"Ich arbeite, weil es mir Freude macht.","INST.wolf.items.11":"Wenn ich an etwas arbeite, tue ich es für mich selbst.","INST.wolf.items.12":"Meine Motivation kommt aus der Arbeit selbst und nicht aus der Belohnung dafür.","INST.sreis.name":"Skala zur selbst eingeschätzten emotionalen Intelligenz (SREIS)","INST.sreis.intro":"Wie gut trifft jede Aussage auf Sie zu?","INST.sreis.anchors.0":"Sehr unzutreffend","INST.sreis.anchors.1":"Eher unzutreffend","INST.sreis.anchors.2":"Weder noch","INST.sreis.anchors.3":"Eher zutreffend","INST.sreis.anchors.4":"Sehr zutreffend","INST.sreis.items.0":"Am Gesichtsausdruck von Menschen erkenne ich, welche Gefühle sie gerade erleben.","INST.sreis.items.1":"Ich bin ein rationaler Mensch und ziehe meine Gefühle selten oder nie zu Rate, wenn ich eine Entscheidung treffe.","INST.sreis.items.2":"Ich habe einen reichen Wortschatz, um meine Gefühle zu beschreiben.","INST.sreis.items.3":"Ich habe Probleme, mit meinem Ärger umzugehen.","INST.sreis.items.4":"Wenn jemand, den ich kenne, schlechte Laune hat, kann ich der Person helfen, sich zu beruhigen und sich schnell besser zu fühlen.","INST.sreis.items.5":"Ich nehme die nonverbalen Botschaften anderer Menschen wahr.","INST.sreis.items.6":"Bei Entscheidungen höre ich auf meine Gefühle, um zu sehen, ob sich die Entscheidung richtig anfühlt.","INST.sreis.items.7":"Mir fallen leicht viele Synonyme für Gefühlswörter wie Glück und Traurigkeit ein.","INST.sreis.items.8":"Ich kann mit stressigen Situationen umgehen, ohne zu nervös zu werden.","INST.sreis.items.9":"Ich kenne Strategien, um bei anderen eine Stimmung zu erzeugen oder ihre Stimmung zu verbessern.","INST.sreis.items.10":"Am Gesichtsausdruck von Menschen erkenne ich, ob sie ehrlich zu mir sind.","INST.sreis.items.11":"Ich bin ein rationaler Mensch und verlasse mich bei Entscheidungen nicht gern auf meine Gefühle.","INST.sreis.items.12":"Ich kann in Worte fassen, wie Gefühle von einfach bis komplex reichen.","INST.sreis.items.13":"Ich kann mit den meisten belastenden Problemen umgehen.","INST.sreis.items.14":"Ich bin nicht sehr gut darin, anderen zu helfen, sich besser zu fühlen, wenn sie wütend oder traurig sind.","INST.sreis.items.15":"Mein erster Eindruck davon, wie sich andere fühlen, ist oft falsch.","INST.sreis.items.16":"Im Vergleich zu den meisten Menschen habe ich einen reicheren Wortschatz, um Gefühle zu beschreiben.","INST.sreis.items.17":"Ich weiß, wie ich in schwierigen oder stressigen Situationen ruhig bleibe.","INST.sreis.items.18":"Ich bin ein Mensch, an den sich andere wenden, wenn sie in einer schwierigen Situation Hilfe brauchen.","INST.bscs.name":"Kurzskala zur Selbstkontrolle (BSCS)","INST.bscs.intro":"Wie sehr trifft jede Aussage im Allgemeinen auf Sie zu?","INST.bscs.anchors.0":"Trifft überhaupt nicht zu","INST.bscs.anchors.4":"Trifft voll und ganz zu","INST.bscs.items.0":"Ich kann Versuchungen gut widerstehen.","INST.bscs.items.1":"Es fällt mir schwer, schlechte Gewohnheiten abzulegen.","INST.bscs.items.2":"Ich bin faul.","INST.bscs.items.3":"Ich sage unangemessene Dinge.","INST.bscs.items.4":"Ich tue bestimmte Dinge, die schlecht für mich sind, wenn sie Spaß machen.","INST.bscs.items.5":"Ich lehne Dinge ab, die schlecht für mich sind.","INST.bscs.items.6":"Ich wünschte, ich hätte mehr Selbstdisziplin.","INST.bscs.items.7":"Andere würden sagen, dass ich eiserne Selbstdisziplin habe.","INST.bscs.items.8":"Vergnügen und Spaß halten mich manchmal davon ab, meine Arbeit zu erledigen.","INST.bscs.items.9":"Ich habe Schwierigkeiten, mich zu konzentrieren.","INST.bscs.items.10":"Ich kann effektiv auf langfristige Ziele hinarbeiten.","INST.bscs.items.11":"Manchmal kann ich mich nicht davon abhalten, etwas zu tun, obwohl ich weiß, dass es falsch ist.","INST.bscs.items.12":"Ich handle oft, ohne alle Alternativen durchdacht zu haben.","LABELS.s2":"Selbstmitgefühl","LABELS.s3":"Von Selbstvorwürfen zu Selbstmitgefühl","LABELS.compassion":"Bücherregal: Mitgefühl und Selbstkritik","LABELS.s4":"Das Rätsel der Emotionsregulation","LABELS.s7":"Sich selbst statt die Umgebung verändern","LABELS.shelf13":"Bücherregal: prozessbasierte Therapie und emotionale Beweglichkeit","LABELS.s9":"Optimismus und Hoffnung für die Zukunft","LABELS.riseabove":"Rise Above (Kaufman, 2024): von der Opferhaltung zum Wachstum","LABELS.s10":"Subkulturen in Organisationen und Motivation","LABELS.s8":"Neubewertung, Ego-Erschöpfung und Denkweisen","LABELS.mattering":"Wie Menschen für andere bedeutsam werden","LABELS.s11":"Dampf ablassen: Wann hilft es, sich auszusprechen?","LABELS.s13":"Motivation: extern, introjiziert und intrinsisch","LABELS.s15":"Positive Gefühle, Freizeit und gute Nachrichten teilen","LABELS.s14":"Emotionale Intelligenz: Fähigkeit, Merkmal oder Mischung?","LABELS.s5":"Selbstkontrolle und die Wahl von Situationen","LABELS.s6":"Die eigene Umgebung wählen und verändern","LABELS.s12":"Perfektionismus: ausgezeichnet, aber unter Druck","REFS.nea25":"21 % der Beschäftigten berichten von Burnout-Beschwerden","REFS.who22":"jährlich 12 Milliarden Arbeitstage durch Depression und Angst verloren","REFS.icd11":"Burnout als berufsbezogenes Phänomen eingestuft","REFS.cbs26":"Krankenstand 5,4 % im Jahr 2025; 9 % der krankgemeldeten Beschäftigten nennen psychische Beschwerden oder Burnout","REFS.tno24":"Fehlzeiten wegen psychischer Beschwerden dauern im Schnitt 63 Arbeitstage; 75 % davon (teilweise) arbeitsbedingt","REFS.arbo24":"8,3 Mrd. € für (teilweise) arbeitsbedingte Fehlzeiten im Jahr 2023, davon 4,9 Mrd. € durch psychosoziale Arbeitsbelastung","REFS.arbo18":"etwa ein Viertel aller Fehltage hängt mit psychischen Beschwerden, Überlastung oder Burnout zusammen","REFS.mkb":"im Durchschnitt 250 € bis 400 € pro Fehltag","REFS.arbowet":"Art. 3 Abs. 2: Konzept zur Vermeidung oder Begrenzung psychosozialer Arbeitsbelastung; Art. 5: Risikoinventarisierung und -evaluierung (RI&E) mit Maßnahmenplan","REFS.arbobes":"Art. 2.15: PSA-Risiken in der RI&E bewerten und Maßnahmen im Maßnahmenplan festlegen","REFS.arboportaal":"Informationen der niederländischen Regierung zur psychosozialen Arbeitsbelastung","REFS.wor":"Art. 27: Zustimmungsrecht des Betriebsrats, u. a. bei Mitarbeitendenbefragungen und Regelungen zum Arbeitsschutz","REFS.gdpr":"Datenschutz-Grundverordnung (DSGVO)","T.rStrRel":"Ihre verg
