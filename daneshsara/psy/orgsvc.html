<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Workplace Wellbeing Check</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<style>
/* Layout: a calm, trustworthy service site. Sticky top bar (brand, five sections, language switch); each section is one view routed by the hash. Content column max 1120px; cards and simple charts; one primary action per screen. */
:root{
  --bg:#f5f3ee; --card:#ffffff; --ink:#1b2430; --muted:#5b6572; --rule:#e3ded4; --wash:#edeae2;
  --accent:#1d6d74; --accent-ink:#ffffff; --accent-soft:#dcecec;
  --low:#cf6a4c; --mid:#d9b25b; --high:#3d977a; --low-soft:#f6e1d9; --mid-soft:#f6edd6; --high-soft:#dcefe7;
  --shadow:0 1px 2px rgba(27,36,48,.06),0 6px 24px rgba(27,36,48,.06);
  --f-fa:"Vazirmatn",Tahoma,sans-serif; --f-lat:"Source Sans 3","Segoe UI",Arial,sans-serif; --f-lat-d:"Source Serif 4",Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171d; --card:#1a2129; --ink:#e7ecef; --muted:#9ba7b2; --rule:#2b343e; --wash:#212a33;
  --accent:#4fb3b8; --accent-ink:#0d1418; --accent-soft:#1d3436;
  --low:#e3866b; --mid:#e3c06e; --high:#5cc09d; --low-soft:#3a2620; --mid-soft:#3a3220; --high-soft:#1d3a30;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171d; --card:#1a2129; --ink:#e7ecef; --muted:#9ba7b2; --rule:#2b343e; --wash:#212a33;
  --accent:#4fb3b8; --accent-ink:#0d1418; --accent-soft:#1d3436;
  --low:#e3866b; --mid:#e3c06e; --high:#5cc09d; --low-soft:#3a2620; --mid-soft:#3a3220; --high-soft:#1d3a30;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-lat);font-size:17px;line-height:1.65}
html[lang="fa"] body,html[lang="ar"] body{font-family:var(--f-fa);font-size:16px;line-height:1.95}
h1,h2,h3{line-height:1.25;text-wrap:balance;margin:0}
html:not([lang="fa"]):not([lang="ar"]) h1,html:not([lang="fa"]):not([lang="ar"]) h2{font-family:var(--f-lat-d)}
html[lang="fa"] h1,html[lang="fa"] h2,html[lang="ar"] h1,html[lang="ar"] h2{font-weight:800}
a{color:var(--accent)}
button{font:inherit;color:inherit}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);border-bottom:1px solid var(--rule)}
.bar .wrap{display:flex;align-items:center;gap:14px;min-height:60px;flex-wrap:wrap;padding-block:6px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:700;margin-inline-end:auto;min-width:0}
.logo svg{width:30px;height:30px;flex:none}
.logo span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.main{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;max-width:100%}
nav.main a{white-space:nowrap;text-decoration:none;color:var(--muted);padding:7px 10px;border-radius:8px;font-size:.92rem;font-weight:600}
nav.main a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.langs{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--rule);border-radius:999px;padding:0 4px 0 10px;flex:none;color:var(--muted);background:var(--card)}
.langs .gl{display:inline-flex}
.lcode{display:none}
.langsel{border:0;background:transparent;color:var(--ink);font:700 .85rem var(--f-lat);padding:6px 6px;cursor:pointer;max-width:140px}
.langsel:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
html[dir="rtl"] .langs{padding:0 10px 0 4px}
nav.main{order:3;width:100%;padding-bottom:4px}
.hcta{font-size:.85rem;padding:7px 14px;min-height:0}
@media (max-width:560px){.bar .hcta{display:none}}
/* generic */
main{padding-block:28px 64px}
.view[hidden]{display:none}
.kicker{font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
html[lang="fa"] .kicker,html[lang="ar"] .kicker{letter-spacing:0;text-transform:none}
.lead{color:var(--muted);font-size:1.08rem;max-width:66ch;margin:10px 0 0}
section.blk{margin-top:48px}
section.blk>h2{font-size:1.6rem;margin-bottom:6px}
section.blk>p.sub{color:var(--muted);margin:0 0 18px;max-width:70ch}
.card{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.grid>*{min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 20px;border-radius:12px;border:1px solid transparent;font-weight:700;cursor:pointer;text-decoration:none;font-size:1rem}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--card);color:var(--ink);border-color:var(--rule)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.muted{color:var(--muted)} .small{font-size:.88rem}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--wash);color:var(--muted)}
.b0{background:var(--low-soft);color:var(--low)} .b1{background:var(--mid-soft);color:#8a6a1c} .b2{background:var(--high-soft);color:var(--high)}
:root[data-theme="dark"] .b1{color:var(--mid)} @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .b1{color:var(--mid)}}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:36px;align-items:center}
@media (max-width:880px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero h1{font-size:clamp(1.9rem,4.4vw,2.9rem);margin-top:8px}
.hero .row{margin-top:24px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:28px}
@media (max-width:560px){.facts{grid-template-columns:minmax(0,1fr)}}
.facts div{border-inline-start:3px solid var(--accent);padding-inline-start:12px}
.facts b{display:block;font-size:1.15rem} .facts span{font-size:.86rem;color:var(--muted)}
.preview{padding:18px}
/* steps */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;counter-reset:s}
@media (max-width:820px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.steps{grid-template-columns:minmax(0,1fr)}}
.step{position:relative;padding-top:52px}
.step::before{counter-increment:s;content:counter(s);position:absolute;top:16px;inset-inline-start:20px;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:.9rem}
html[lang="fa"] .step::before{content:counter(s,persian)}
.step b{display:block;margin-bottom:4px}
.step p{margin:0;color:var(--muted);font-size:.93rem}
/* dimension cards */
.dim{cursor:pointer;text-align:start;border:1px solid var(--rule);display:flex;flex-direction:column;gap:8px}
.dim .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:800}
.dim b{font-size:1.05rem}
.dim .q{color:var(--muted);font-size:.93rem;margin:0}
.dim .more{display:none;font-size:.9rem;border-top:1px dashed var(--rule);padding-top:8px}
.dim[aria-expanded="true"] .more{display:block}
.dim .more p{margin:4px 0}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:720px){.split{grid-template-columns:minmax(0,1fr)}}
ul.check{list-style:none;margin:0;padding:0;display:grid;gap:8px}
ul.check li{display:flex;gap:10px} ul.check li::before{content:"✓";color:var(--high);font-weight:800}
.callout{border-inline-start:4px solid var(--mid);background:var(--mid-soft);padding:14px 16px;border-radius:10px}
.callout.care{border-color:var(--accent);background:var(--accent-soft)}
/* take */
.take{max-width:760px;margin:0 auto}
.choice{display:grid;gap:10px}
.choice label{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1.5px solid var(--rule);border-radius:12px;background:var(--card);cursor:pointer}
.choice label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.choice input{margin-top:6px;accent-color:var(--accent);width:18px;height:18px;flex:none}
.choice small{display:block;color:var(--muted)}
fieldset{border:0;margin:0 0 22px;padding:0}
legend{font-weight:700;font-size:1.1rem;margin-bottom:10px;padding:0}
.prog{height:8px;background:var(--wash);border-radius:99px;overflow:hidden;margin:10px 0 4px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.qhead{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--barH,61px));background:var(--bg);z-index:5;padding-block:10px;border-bottom:1px solid var(--rule)}
.item{padding:18px 0;border-bottom:1px solid var(--rule)}
.item.miss .qt{color:var(--low)}
.qt{font-weight:600;margin:0 0 12px;display:flex;gap:10px}
.qt .n{color:var(--muted);font-weight:700;min-width:1.6em}
.scale{display:grid;grid-template-columns:repeat(var(--k),minmax(0,1fr));gap:6px}
.opt{min-height:46px;border:1.5px solid var(--rule);background:var(--card);border-radius:10px;cursor:pointer;font-weight:700;color:var(--muted);padding:4px}
.opt[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.anch{display:flex;justify-content:space-between;gap:12px;font-size:.8rem;color:var(--muted);margin-top:6px}
.anch span:last-child{text-align:end}
.nav2{display:flex;justify-content:space-between;gap:10px;margin-top:24px;flex-wrap:wrap}
/* bars */
.bars{display:grid;gap:14px}
.br{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr) 3.2em;gap:12px;align-items:center}
@media (max-width:520px){.br{grid-template-columns:minmax(0,1fr) 3em}.br .lab{grid-column:1/-1}}
.br .lab{font-weight:600;font-size:.95rem}
.trk{position:relative;height:14px;border-radius:99px;background:linear-gradient(to right,var(--low-soft) 0 37.5%,var(--mid-soft) 37.5% 62.5%,var(--high-soft) 62.5%)}
html[dir="rtl"] .trk{background:linear-gradient(to left,var(--low-soft) 0 37.5%,var(--mid-soft) 37.5% 62.5%,var(--high-soft) 62.5%)}
.trk i{position:absolute;top:0;bottom:0;inset-inline-start:0;border-radius:99px}
.br .v{font-weight:800;text-align:end;font-variant-numeric:tabular-nums}
.legendb{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin-top:10px}
.legendb span{display:inline-flex;gap:6px;align-items:center}.legendb i{width:12px;height:12px;border-radius:3px;display:inline-block}
details.more{margin-top:16px}
details.more summary{cursor:pointer;font-weight:700;color:var(--accent)}
.res-dim{border-top:1px solid var(--rule);padding:14px 0}
.res-dim h4{margin:0 0 4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.res-dim p{margin:4px 0}
.unval{background:var(--mid-soft);border-radius:10px;padding:8px 12px;margin:14px 0 6px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.78rem;word-break:break-all;background:var(--wash);border:1px solid var(--rule);border-radius:8px;padding:10px;direction:ltr;text-align:left;max-height:110px;overflow:auto}
/* report */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:720px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi b{display:block;font-size:1.8rem;font-weight:800;line-height:1.1}
.kpi span{font-size:.85rem;color:var(--muted)}
.tabs{display:inline-flex;border:1px solid var(--rule);border-radius:12px;overflow:hidden;background:var(--card);flex-wrap:wrap}
.tabs button{border:0;background:none;padding:9px 14px;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.scroll{overflow-x:auto;max-width:100%}
table.heat{border-collapse:separate;border-spacing:4px;width:100%;min-width:560px}
table.heat th{font-size:.82rem;color:var(--muted);font-weight:700;text-align:center;padding:4px}
table.heat th.dn{text-align:start;color:var(--ink);font-size:.92rem;white-space:nowrap}
table.heat td{text-align:center;font-weight:800;border-radius:8px;padding:10px 4px;font-variant-numeric:tabular-nums}
table.heat td.na{background:var(--wash);color:var(--muted);font-weight:500;font-size:.75rem}
.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;font-size:.72rem;font-weight:800;color:#fff}
.stack span{display:grid;place-items:center;min-width:0;overflow:hidden}
.pri{display:grid;gap:14px}
.pcard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px}
.rank{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--low);color:#fff;font-weight:800}
.pcard h4{margin:0;font-size:1.08rem}
.pcard .ws{margin-top:10px;padding:12px;border-radius:10px;background:var(--wash)}
input[type=text],textarea,select{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--rule);border-radius:10px;padding:10px 12px;width:100%;max-width:100%}
textarea{min-height:90px}
label.f{display:grid;gap:6px;font-weight:600;font-size:.93rem}
/* workshops */
.wcard h3{font-size:1.15rem;margin:6px 0 10px}
.wcard dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:.9rem;margin:0}
.wcard dt{color:var(--muted)} .wcard dd{margin:0}
.wcard ul{margin:6px 0 0;padding-inline-start:20px;font-size:.93rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
/* method */
table.t{border-collapse:collapse;width:100%;min-width:620px;font-size:.9rem}
table.t th,table.t td{border-bottom:1px solid var(--rule);padding:10px 8px;text-align:start;vertical-align:top}
table.t th{color:var(--muted);font-size:.8rem}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
footer.foot{border-top:1px solid var(--rule);padding-block:24px 40px;color:var(--muted);font-size:.85rem}
/* decision-maker sections */
.why{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:16px}
.why .card b{display:block;font-family:var(--f-display,inherit);font-size:2rem;line-height:1.1;color:var(--accent)}
.why .card p{margin:6px 0 8px}
.why .card small{color:var(--muted);font-size:.78rem}
.gets{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:16px}
.gets .card{border-top:3px solid var(--accent)}
.gets .card b{display:block;margin-bottom:4px}
.gets .card p{margin:0;font-size:.92rem;color:var(--muted)}
.tl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-top:18px;position:relative}
.tl::before{content:"";position:absolute;top:15px;inset-inline:6%;height:3px;background:var(--rule)}
.tl>div{position:relative;padding:0 10px}
.tl .dot{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:.85rem;position:relative}
.tl .wk{display:block;margin-top:10px;font-size:.78rem;color:var(--accent);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.tl b{display:block}
.tl p{margin:4px 0 0;font-size:.9rem;color:var(--muted)}
.need{margin-top:18px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.need b{margin-inline-end:6px}
.need span{background:var(--card);border:1px solid var(--rule);border-radius:999px;padding:4px 12px;font-size:.88rem}
.law{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.law .card b{display:block;color:var(--accent);margin-bottom:4px}
.law .card p{margin:0;font-size:.92rem}
.faq{margin-top:12px;display:grid;gap:8px}
.faq details{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:12px 16px}
.faq summary{cursor:pointer;font-weight:600}
.faq p{margin:8px 0 0;color:var(--muted)}
.ctaband{margin-top:44px;border-radius:20px;padding:28px;background:var(--accent);color:var(--accent-ink);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
.ctaband h2{color:inherit;margin:0 0 6px}
.ctaband p{margin:0;opacity:.9}
.ctaband .row a{background:var(--accent-ink);color:var(--accent);border-color:transparent}
.ctaband .row a.sec{background:transparent;color:var(--accent-ink);border:1.5px solid var(--accent-ink)}
@media (max-width:820px){.why,.law{grid-template-columns:minmax(0,1fr)} .tl{grid-template-columns:minmax(0,1fr);gap:16px} .tl::before{display:none} .ctaband{grid-template-columns:minmax(0,1fr)}}
input[type=number],input[type=email]{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--rule);border-radius:10px;padding:10px 12px;width:100%;max-width:100%}
input[type=range]{width:100%;accent-color:var(--accent)}
a.cite{font-size:.75em;font-weight:700;text-decoration:none;vertical-align:super;line-height:0;margin-inline-start:1px;white-space:nowrap}
.tagfa{font-size:.68rem;font-weight:700;opacity:.65;border:1px solid currentColor;border-radius:4px;padding:0 3px;margin-inline-start:4px}
.calc .cin{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;align-items:start}
.calc .cin label.f{align-content:start}
.calc .cout{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:18px}
.calc .cout>div{background:var(--wash);border-radius:12px;padding:12px 14px}
.calc .cout b{display:block;font-size:1.35rem;font-variant-numeric:tabular-nums}
.calc .cout span{font-size:.85rem;color:var(--muted)}
.calc .cout .big b{color:var(--low)} .calc .cout .save b{color:var(--high)}
.arbo{border-inline-start:4px solid var(--accent);padding-inline-start:18px}
.reqf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;background:var(--card);color:var(--ink);border-radius:14px;padding:16px}
.reqf .btn{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.ctaband .row a.btn.sec{background:transparent;color:var(--accent-ink);border:1.5px solid var(--accent-ink)}
ol.refs{list-style:none;margin:10px 0 0;padding:6px 16px;display:grid}
ol.refs li{display:grid;grid-template-columns:2.2em minmax(0,1fr);gap:8px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:.9rem}
ol.refs li:last-child{border-bottom:0}
ol.refs .rn{font-weight:700;color:var(--accent)}
ol.refs .rt{text-align:start;unicode-bidi:isolate}
ol.refs a{word-break:break-all}
ol.refs li.hl{background:var(--accent-soft);border-radius:8px;padding-inline:8px}
@media (max-width:620px){.reqf{grid-template-columns:minmax(0,1fr)}}
@media (min-width:821px){.ctaband{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr)}}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:16px}
.role{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px}
.role .ric{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--wash);color:var(--accent);font-size:1.2rem}
.role.core .ric{background:var(--accent);color:var(--accent-ink)}

 items:["در تشخیص اینکه چه زمانی تنش دارم و ناراحتم، مهارت دارم.","می‌دانم که هر کسی در زمانی از زندگی خود رنج کشیده است.",

 "وقتی حالم بد است، حتی اگر نتوانم دربارهٔ علت آن کاری کنم، سعی می‌کنم حال خودم را خوب کنم.","وقتی در فشار و ناراحتی هستم، متوجه حال خودم می‌شوم.",
 "می‌فهمم که گاهی بدحال و ناراحت بودن جزئی از ذات و طبیعت بشری است.","وقتی چیزهای بد اتفاق می‌افتند، نوعی حس مراقبت از خودم پیدا می‌کنم.",
 "با ناراحتی و بدحالی خودم مواجه می‌شوم، بی‌آنکه اجازه دهم بر من غلبه کند و تسلیمش شوم.","وقتی در روزهای دشواری هستم، سعی می‌کنم از خودم مراقبت کنم.",
 "سریع متوجه نشانه‌های اولیهٔ بدحالی و ناراحتی در خودم می‌شوم.","می‌دانم که دیگران هم مثل من درگیر مشکلات و ناملایمات زندگی هستند.",
 "وقتی ناراحتم، سعی می‌کنم به حس‌های خودم دقیق شوم.","بی‌آنکه خودم را قضاوت کنم، با حس‌های خودم مواجه می‌شوم.",
 "وقتی ناراحت و بدحالم، سعی می‌کنم آنچه برای من بهترین است را انجام دهم.","توان شناسایی علائم رنج و ناراحتی در خودم را دارم.",
 "می‌دانم که وقتی شرایط بر وفق مراد پیش نمی‌رود، همهٔ ما ممکن است دچار احساس ناراحتی و بدحالی شویم.",
 "حتی وقتی نسبت به خودم سرخورده و مأیوسم، باز هم می‌توانم در زمان ناراحتی با خودم با گرمی و لطافت برخورد کنم.",
 "وقتی ناراحت و بدحالم، می‌توانم بگذارم هیجان‌ها و احساس‌های منفی آنجا باشند، بی‌آنکه زیر آن‌ها له و تسلیم شوم.",
 "وقتی ناراحتم، بیشترین تلاشم را می‌کنم تا از خودم مراقبت کنم."],

{id:"fcs", fa:"مقیاس‌های ترس از شفقت", en:"Fears of Compassion Scales (FCS)", ses:"s2", pkg:"ext", tag:"fearcomp",
 ref:"Gilbert, McEwan, Matos & Rivis (2011). Psychology and Psychotherapy, 84, 239–255.",
 intro:"سه بخش دارد: ترس از ابراز شفقت به دیگران، ترس از دریافت شفقت از دیگران، و ترس از شفقت به خود.",
 min:1, max:5, anchors:["هیچ‌وقت","","","","همیشه"],
 parts:[[1,"ترس از ابراز شفقت به دیگران"],[11,"ترس از شفقت و مهربانی دیگران به خود"],[24,"ترس از شفقت و مهربانی به خود"]],
 items:["اگر خیلی مهربان به نظر برسم، مردم از من سوءاستفاده خواهند کرد.","مهربانی و شفقت با افرادی که کارهای بدی انجام داده‌اند، آن‌ها را از مجازات خلاص می‌کند.",
 "در زندگی افرادی وجود دارند که مستحق شفقت و مهربانی نیستند.","نگرانم که اگر خیلی مهربان باشم، به هدف راحتی تبدیل شوم.",
 "اگر خیلی مهربان و بخشنده باشی، مردم از تو بهره‌کشی خواهند کرد.","نگرانم که اگر خیلی مهربان باشم، افراد آسیب‌پذیر و شکننده جذبم شوند و منابع روانی‌ام را تحلیل ببرند.",
 "به‌جای اینکه منتظر باشند به آن‌ها کمک شود، هر کسی باید به خودش کمک کند.","بیم آن دارم که اگر خیلی مهربان باشم، بعضی افراد بیش از حد به من وابسته شوند.",
 "بیش از حد مهربان بودن باعث می‌شود آدم به‌راحتی مورد سوءاستفاده قرار گیرد.","فکر می‌کنم برای برخی افراد، انضباط سخت و نوعی مجازات مناسب بهتر از مهربانی و شفقت است.",
 "اینکه بخواهی دیگران با تو مهربان باشند، نشانهٔ ضعف است.","نگرانم وقتی نیاز دارم دیگران درکم کنند و مهربان باشند، مهربان نباشند و مرا درک نکنند.",
 "بیم دارم که وابستهٔ مراقبت و لطف دیگران شوم، چون آن‌ها ممکن است همیشه نباشند تا از من مراقبت کنند.","اغلب در فکرم که آیا ابراز محبت و گرمی دیگران واقعی و از ته دل است.",
 "مهربانی دیگران نسبت به من، به گونه‌ای ترسناک است.","وقتی مردم با من مهربان‌اند و با شفقت رفتار می‌کنند، دچار اضطراب و دستپاچگی می‌شوم.",
 "وقتی دیگران با من صمیمی و مهربان‌اند، نگرانم که چیز بدی دربارهٔ من بفهمند و نظرشان عوض شود.","وقتی افراد با من مهربان و صمیمی‌اند، نگرانم که حتماً از من چیزی می‌خواهند.",
 "وقتی مردم با من مهربان‌اند و با شفقت رفتار می‌کنند، دچار احساس غم و توخالی بودن می‌شوم.","وقتی افراد مهربان‌اند، حس می‌کنم بیش از حد نزدیک شده‌اند.",
 "با وجود آنکه افراد با من مهربان‌اند، به‌ندرت در روابطم احساس گرمی کرده‌ام.","حتی زمانی که می‌دانم دیگران مهربان‌اند، سعی می‌کنم فاصله‌ام را با آن‌ها حفظ کنم.",
 "وقتی حس کنم کسی خیلی با من مهربان و مراقب است، سعی می‌کنم میان خودم و او مرز و فاصله بگذارم.",
 "احساس می‌کنم استحقاق این را ندارم که نسبت به خودم مهربان و بخشنده باشم.","اینکه واقعاً در فکر مهربان و لطیف بودن با خودم باشم، دچار غم می‌شوم.",
 "برای اینکه در زندگی جلو بروی و دوام بیاوری، باید سرسخت باشی نه مهربان.","ترجیح می‌دهم اصلاً ندانم «مهربان و شفیق بودن با خود» چیست و چه شکلی است.",
 "وقتی سعی می‌کنم با خودم گرم و مهربان باشم، نوعی احساس پوچی و توخالی بودن پیدا می‌کنم.","نگرانم که اگر نسبت به خودم مهربان و گرم باشم، دچار نوعی احساس سوگ و فقدان شوم.",
 "نگرانم که اگر با خودم مهربان‌تر باشم و کمتر خودم را سرزنش کنم، استانداردهایم افت کند.","اگر با خودم بیشتر مهربان باشم، نگرانم که آدم ضعیفی بشوم.",
 "هیچ‌وقت احساس مهربانی به خودم نداشته‌ام، بنابراین نمی‌دانم از کجا و چطور باید شروع کنم.","نگرانم که اگر شروع کنم با خودم مهربان باشم، به آن وابسته شوم و عادت کنم.",
 "اگر با خودم خیلی مهربان باشم، نگرانم که سرزنش خودم را از دست بدهم و بعد نقص‌هایم شروع به رشد و ظاهر شدن کنند.","بیم دارم که اگر با خودم مهربان باشم، تبدیل به آدمی شوم که دوست ندارم باشم.",
 "نگرانم که اگر با خودم مهربان باشم، دیگران مرا طرد کنند.","برایم راحت‌تر است که خودم را سرزنش کنم تا با خودم مهربان باشم.","بیم دارم که اگر با خودم مهربان باشم، ممکن است چیزهای بدی اتفاق بیفتد."],

{id:"fmps", fa:"مقیاس چندبعدی کمال‌گرایی فراست", en:"Frost Multidimensional Perfectionism Scale (FMPS)", ses:"s12", pkg:"ext", tag:"perf",
 ref:"Frost, Marten, Lahart & Rosenblate (1990). Cognitive Therapy and Research, 14, 449–468.",
 intro:"چقدر با هر جمله موافقید؟",
 min:1, max:5, anchors:["کاملاً مخالفم","مخالفم","نه موافق نه مخالف","موافقم","کاملاً موافقم"],
 items:["پدر و مادرم استانداردهای خیلی بالایی برایم قرار می‌دهند.","سازمان‌یافته بودن (انضباط و ساختار) برایم خیلی مهم است.","در کودکی به‌خاطر انجام دادن کار در حد کمتر از کامل، تنبیه می‌شدم.",
 "اگر برای خودم استانداردهای خیلی بالایی قرار ندهم، سرانجام آدم درجه‌دومی می‌شوم.","والدینم هیچ‌وقت سعی نکردند اشتباهاتم را بفهمند.","برایم مهم است که در هر کاری که انجام می‌دهم، تماماً باکفایت و توانمند باشم.",
 "آدم تمیز و منظمی هستم.","سعی می‌کنم آدم منضبط و سازمان‌یافته‌ای باشم.","اگر در کار یا درس شکست بخورم، به نظرم آدم شکست‌خورده‌ای هستم.","اگر اشتباهی مرتکب شده باشم، باید ناراحت شوم.",
 "والدینم می‌خواستند که من در هر چیزی بهترین باشم.","در مقایسه با بیشتر مردم، هدف‌های بالاتری برای خودم قرار می‌دهم.","اگر کسی کاری را در محل کار یا مدرسه بهتر از من انجام دهد، حس می‌کنم در کل کار شکست خورده‌ام.",
 "اگر در بخشی از کار شکست بخورم، مثل آن است که در کل کار شکست خورده‌ام.","فقط کارکرد فوق‌العاده در خانوادهٔ من قابل قبول و کافی تلقی می‌شود.","در متمرکز کردن تلاش‌هایم برای رسیدن به هدف، خوب و توانا هستم.",
 "حتی وقتی کاری را با دقت انجام می‌دهم، باز حس می‌کنم درست انجام نشده است.","از اینکه در چیزی بهترین نباشم، بدم می‌آید.","هدف‌های خیلی بالایی دارم.","والدینم انتظار «عالی» بودن از من دارند.",
 "اگر مرتکب اشتباه شوم، مردم احتمالاً دربارهٔ من نظر پایین‌تری خواهند داشت.","هیچ‌وقت حس نکردم که می‌توانم از پس انتظارات والدینم برآیم.","اگر به اندازهٔ دیگران خوب عمل نکنم، یعنی انسان پایین‌تری هستم.",
 "ظاهراً بقیهٔ انسان‌ها، در مقایسه با من، انتظار و استانداردهای پایین‌تری از خود دارند.","اگر همیشه خوب و درست عمل نکنم، مردم به من احترام نخواهند گذاشت.","والدینم در مقایسه با خودم، همیشه انتظارات بیشتری برای آینده‌ام داشته‌اند.",
 "سعی می‌کنم آدم تمیزی باشم.","دربارهٔ کارهای ساده‌ای که هر روز انجام می‌دهم هم شک می‌کنم.","تمیزی برایم خیلی مهم است.","در کارهای روزانه‌ام در مقایسه با بقیهٔ آدم‌ها، انتظار کارکرد بالاتری از خودم دارم.",
 "فرد منضبط و باسازمانی هستم.","در کارهایم عقب می‌مانم، چون کارها را مرتب تکرار می‌کنم.","برای من زمان زیادی می‌برد که کاری را «درست» انجام دهم.","هرچه کمتر اشتباه کنم، مردم مرا بیشتر دوست دارند.",
 "هیچ‌وقت حس نکردم که بتوانم از عهدهٔ سطح انتظارات پدر و مادرم برآیم."],
 sub:[{id:"cm",fa:"نگرانی از اشتباه",items:[9,10,13,14,18,21,23,25,34],dir:-1,main:true},{id:"da",fa:"شک دربارهٔ عمل",items:[17,28,32,33],dir:-1,main:true},

window.XP = {"en":{"T.heroT":"See which psychological resources your teams have, by job level, and where to start.","T.heroP":"Employees anonymously answer eight published scientific questionnaires in 8 to 18 minutes and see their own result straight away. Your organisation receives a group report by job level, with a plain-language interpretation and a plan of two or three recommended workshops.","T.f1s":"8 published questionnaires, validated in their original language","T.pP":"Your organisation's psychological resources by job level, with priorities and recommended workshops.","T.paths.0.2":"The business case, what you get and how a pilot runs.","T.paths.0.3":"Absence cost estimate","T.whyP":"Psychological health is not a soft topic: it shows up in absence, turnover and the quality of work. This check does not measure these problems; it measures psychological resources that help people cope with pressure at work.","T.why.0.1":"Dutch employees report burnout complaints (21% in 2025, national NEA survey).","T.priv.1":"Only your job level, the month and which version you took are stored with your answers.","T.priv.3":"Answers are stored without any identifier; no manager or HR sees anyone's individual result.","T.law.0.1":"No names are asked; answers are kept apart from any e-mail address and reported only for groups of 5 or more. Because answers about wellbeing can count as health data, taking part is based on explicit, voluntary consent.","T.law.1.1":"Can support the employer's PSA policy (art. 3(2)) as an individual-level addition to source-oriented measures and the RI&E (Arbobesluit art. 2.15).","T.law.2.1":"A staff survey like this usually needs the works council's consent, or at least its involvement (WOR art. 27); we help prepare it.","T.arboT":"Can support your PSA policy under the Arbowet","T.arboP":"Dutch employers must have a policy to prevent, or at least limit, psychosocial workload (PSA) such as work stress, and must assess PSA risks in their risk inventory (RI&E) with a plan of action. The law asks employers to tackle work stress at the source first (workload, autonomy, support) and only then with individual measures. This check and its workshops are such an individual measure: a useful addition, never a substitute.","T.arbo.1.1":"Workshops and the repeat measurement can be recorded as individual-level measures in your plan of action, next to measures that address the work itself.","T.need.3":"If you have a works council (OR): its consent where required (WOR art. 27). We help prepare the request.","T.pilotNote":"In the pilot, answers are used only to produce your organisation's report and to check the reliability of the questionnaires. Licences for commercial use of the questionnaires are being arranged with their authors.","T.faq.2.1":"No. It is a non-clinical check based on published questionnaires, used to see patterns in groups and choose the right support. The personal result page points anyone who is struggling to their company doctor, GP or a psychologist.","T.emp.3":"Taking part is voluntary. You can stop at any time; your answers are only used if you send your response code.","T.jAfter.2":"Workshops by an experienced psychologist or trainer; a repeat measurement after 3–6 months shows whether scores moved.","T.flow.6.3":"The psychologist runs the workshops; a repeat measurement after 3–6 months shows whether scores moved.","T.tSelf":"Your answers and result stay in this browser. Nothing is sent unless you choose to send your response code.","T.tConsent":"I understand that taking part is voluntary, that nothing is sent without my action, and that this is not a clinical diagnosis.","T.tLevelHint":"Used only to compare groups. Groups with fewer than 5 people are never shown.","T.rP":"On every scale, a higher score means more of that resource. This is a snapshot of today's answers, not a diagnosis.","T.rHow":"Colours show the band: red = needs attention, yellow = moderate, green = strong. Each questionnaire has its own typical range, so compare a dimension with itself over time rather than with other dimensions.","T.rStr":"Your highest scores","T.rGrow":"Your lowest scores","T.rCodeP":"Copy this code and e-mail it to SoloNovate, not to your manager or HR. It contains only your answers, job level and month, not your name. Because it arrives by e-mail, SoloNovate briefly sees your e-mail address; we never store it with your answers and delete the e-mail after importing the code.","T.rCodeShow":"Show the code","T.rDetailNote":"Parts based on only 2–4 questions are indicative.","T.whatNot":"Keep in mind","T.see.3.1":"Yes, without names (e-mail deleted after import)","T.roles.2.3":"Plans the survey period with us, prepares the staff message for management to send, and is the link to management.","T.wsPartner":"Delivery: each workshop is run by an experienced psychologist or trainer in the Netherlands, selected by us for your assignment. You meet them before the debrief.","T.meName":"Maryam Jaberi","T.meBio":"Product manager and UX researcher with experience in search, video and education platforms. Designs the check, safeguards the data and writes your report; the partner psychologist checks the interpretation.","T.rv.sum.2":"Scores run from 0 to 100: 0 is the lowest possible answer on every question, 100 the highest. Below 37.5 = needs attention, 37.5–62.5 = moderate, above 62.5 = strong. Each questionnaire has its own typical range, so compare a dimension between job levels or over time rather than with other dimensions.","T.rv.gap.2":"A long line means the job levels score very differently. This can reflect the demands of the role, but also who ends up in which role; discuss it in the debrief before drawing conclusions.","T.rv.prof.2":"The bar is the level's score, the thin line the average of the other levels. Differences smaller than about 5 points are usually not meaningful, and for levels under 20 people even larger differences can be chance.","T.rv.sub.0":"Sub-scores","T.rv.sub.2":"When a dimension is low, this shows which part scores lowest. The self-compassion parts rest on 2 questions each and the authors advise using only the total score, so treat them as conversation starters for the debrief, not as measurements.","T.rv.time.2":"Light bar = first measurement, dark bar = repeat measurement. Whether a change is more than chance depends on group size; different people may take part each time and other events play a role too, so a change shows what moved, not why.","T.rv.plan.2":"A dimension is suggested as a priority when more than 25% of people score in 'needs attention', or when a job level of 10 or more people scores at least 5 points below the other levels. We show the top three; the rest are listed as 'also worth watching'. This is a starting point for the debrief, not a verdict.","T.sumStrong":"Highest scores: {a}.","T.sumWeak":"Lowest score: {d} ({m}); {p} of people are in 'needs attention'.","T.pAvg":"Lowest dimension","T.kpiSub.2":"start here in the debrief","T.allLv":"all job levels (no level scores clearly lower)","T.planNote":"Before choosing workshops, check with your RI&E or work-conditions survey whether workload, autonomy or support explain these patterns. If they do, address those first.","T.pPlan":"Ask about this workshop (e-mail)","T.print":"Print / save as PDF","T.fHint":"Opens your e-mail app with this request filled in. No e-mail app? Write to {e}.","T.mBandsP":"Below 37.5: needs attention · 37.5 to 62.5: moderate · above 62.5: strong. These cut-offs follow the convention used for the Self-Compassion Scale (average answer below 2.5 or above 3.5 on a 1–5 scale) and are applied to all scales for simplicity. They are not population norms or clinical cut-offs, and typical scores differ between questionnaires.","T.mCourse":"This service grew out of Dr. Azarakhsh Mokri's course \"Personal and Human Skills in Organisations and Educational Centres\". From the questionnaires covered there, we chose eight that are short, published, free of clinical labels and each linked to a skill that can be trained.","T.cRed":"Illustrative scenario (not an expected effect): psychologically related absence falls by","T.cStress":"of which psychological","T.cCost":"cost of psychologically related absence per year","T.cNote":"This is a scenario, not a prediction. There is no direct evidence yet that this check and its workshops reduce absence, and a questionnaire score does not translate directly into fewer absence days. Use the estimate to judge whether prevention is worth investing in, and the repeat measurement to see what actually changed.","DIMS.flex.b.1":"Difficult thoughts and feelings sometimes get in the way, but you mostly keep moving towards what matters.","DIMS.belong.b.0":"A strong sense of being an outsider or rejected; in research this goes together with lower wellbeing.","DIMS.selfctrl.what":"How people rate their own ability to control impulses, resist temptation and stay with long-term goals.","DIMS.selfctrl.b.0":"Temptations and distractions often win; changing the environment and habits often helps more than trying harder.","DIMS.selfctrl.b.2":"Usually sticks to long-term goals; in research this often goes together with good habits.","DIMS.hope.b.2":"Clear goals, several routes and enough energy; linked with somewhat better performance in studies.","DIMS.optim.b.2":"Generally expects good outcomes; in studies this goes together with persistence and better health.","WS.w-comp.ev":"A meta-analysis of 27 randomised trials found moderate effects of self-compassion programmes, mostly several weeks long, on self-criticism and stress. Effects of a two-session workshop are likely smaller.","WS.w-flex.ev":"A meta-analysis of 17 workplace trials of acceptance and commitment training found small-to-moderate reductions in distress and gains in psychological flexibility; effects were clearest for office employees and small for health-care staff.","WS.w-belong.ev":"Brief belonging interventions improved outcomes for university students, but a large 2023 replication found effects only where the environment offered real opportunities to belong. There are no comparable workplace trials yet, so the workshop combines this idea with onboarding and buddy practices.","WS.w-ei.goals.2":"Emotional labour: recognising its cost","WS.w-self.ev":"Reviews suggest that shaping the situation works better than relying on willpower in the moment; temptation bundling helped in one field experiment, but the effect faded over time.","INST.lot.intro":"How much do you agree with each statement?","INST.ahs.intro":"How true is each statement for you?","SUBN.scs.sj":"Not overly self-critical","SUBN.scs.is":"Not feeling alone in difficulty","SUBN.scs.oi":"Not swept away by feelings","T.calcT":"What does psychologically related absence cost you?","T.heroK":"For knowledge-intensive organisations · pilots from 20 participants","T.jP":"About five weeks from kick-off to debrief, then workshops. One department or the whole organisation.","T.need.4":"Roughly 3 hours of HR time in total, spread over five weeks","T.jAfter.1":"Workshops and repeat measurement","T.flow.6.1":"Workshops and repeat measurement","T.get.3.0":"A personal result for every participant","T.get.3.1":"Each employee sees their own result and two practical tips straight away; management never sees anyone's individual result.","T.mEthL.1":"Only the month is recorded, not the exact date or time.","T.rCare":"If you have been feeling low for a while or feel you cannot cope, talk to your company doctor, GP or a psychologist. Asking for help is a sign of strength.","T.rStrRel":"Where you score highest today","T.rStrNote":"None of your scores is in the strong band yet; these are simply your highest scores today.","T.session":"Course wiki page (Persian)","T.kpiSub.3":"average across the eight dimensions","T.sumNext":"Suggested first step: the workshop '{w}', for {who}.","T.distKey":"{d}: {p} of people score in 'needs attention', even though the average ({m}) is moderate.","T.rv.prof.1":"One job level compared with the other levels.","T.orgAvg":"average of the other levels","T.profUp":"Compared with the other levels, {lv} score higher on: {a}.","T.profDown":"Compared with the other levels, {lv} score lower on: {b}.","T.profFlat":"{lv} score close to the other levels on every dimension.","T.timeKey":"Largest change: {d} ({x} points). Changes smaller than about 5 points can be chance at these group sizes.","T.pWhyLow":"{p} of people score in 'needs attention'.","T.pWhyGap":"{lv} score {x} points below the other levels.","T.pAlso":"Also worth watching","T.pScopeBelong":"Note: this scale measures belonging in life as a whole, not only at work; look at work-related causes in the debrief.","T.pScopeOptim":"Note: optimism is a fairly stable trait; expect modest change, and look at work circumstances first.","DIMS.compassion.not":"Self-compassion is not the same as laziness, selfishness or lowering your standards.","DIMS.flex.not":"A low score is not a diagnosis; it means difficult thoughts and feelings often get in the way of what matters to you at the moment.","DIMS.compassion.b.1":"Neither very harsh nor consistently kind towards yourself in difficult moments.","DIMS.belong.b.1":"A moderate sense of belonging and acceptance; neither strongly connected nor strongly left out.","DIMS.flow.b.1":"Absorption, enjoyment and motivation at work are moderate.","DIMS.optim.b.1":"Moderate expectations about the future; neither clearly optimistic nor pessimistic.","DIMS.ei.b.1":"Sees their own emotional skills as moderate.","DIMS.selfctrl.b.1":"Moderate self-rated self-control; long-term goals win some of the time.","WS.w-belong.goals.0":"Low-threshold contact: short check-ins and genuine appreciation between colleagues"},"nl":{"T.heroT":"Zie welke psychologische hulpbronnen uw teams hebben, per functieniveau, en waar u kunt beginnen.","T.heroP":"Medewerkers vullen anoniem acht gepubliceerde wetenschappelijke vragenlijsten in, in 8 tot 18 minuten, en zien direct hun eigen resultaat. Uw organisatie krijgt een groepsrapport per functieniveau, met een duiding in begrijpelijke taal en een plan met twee of drie aanbevolen workshops.","T.f1s":"8 gepubliceerde vragenlijsten, gevalideerd in hun oorspronkelijke taal","T.pP":"De psychologische hulpbronnen van uw organisatie per functieniveau, met prioriteiten en aanbevolen workshops.","T.paths.0.2":"De businesscase, wat u krijgt en hoe een pilot verloopt.","T.paths.0.3":"Schatting verzuimkosten","T.whyP":"Psychische gezondheid is geen zacht onderwerp: het is zichtbaar in verzuim, verloop en de kwaliteit van het werk. Deze scan meet die problemen niet; hij meet psychologische hulpbronnen die mensen helpen om te gaan met druk op het werk.","T.why.0.1":"Nederlandse werknemers meldt burn-outklachten (21% in 2025, landelijke NEA-enquête).","T.priv.1":"Bij uw antwoorden worden alleen uw functieniveau, de maand en de versie die u heeft ingevuld opgeslagen.","T.priv.3":"Antwoorden worden zonder enige identificatie opgeslagen; geen leidinggevende of HR-medewerker ziet iemands individuele resultaat.","T.law.0.1":"Er wordt niet naar namen gevraagd; antwoorden worden gescheiden gehouden van e-mailadressen en alleen gerapporteerd voor groepen van 5 of meer. Omdat antwoorden over welzijn als gezondheidsgegevens kunnen gelden, is deelname gebaseerd op uitdrukkelijke, vrijwillige toestemming.","T.law.1.1":"Kan het PSA-beleid van de werkgever (art. 3 lid 2) ondersteunen als aanvulling op individueel niveau, naast brongerichte maatregelen en de RI&E (Arbobesluit art. 2.15).","T.law.2.1":"Voor een medewerkersonderzoek als dit is meestal instemming van de OR nodig, of in elk geval betrokkenheid van de OR (WOR art. 27); wij helpen dit voorbereiden.","T.arboT":"Kan uw PSA-beleid onder de Arbowet ondersteunen","T.arboP":"Nederlandse werkgevers moeten beleid voeren om psychosociale arbeidsbelasting (PSA), zoals werkstress, te voorkomen of in elk geval te beperken, en moeten de PSA-risico's beoordelen in hun risico-inventarisatie en -evaluatie (RI&E), met een plan van aanpak. De wet vraagt werkgevers werkstress eerst bij de bron aan te pakken (werkdruk, autonomie, steun) en pas daarna met individuele maatregelen. Deze scan en de workshops zijn zo'n individuele maatregel: een nuttige aanvulling, nooit een vervanging.","T.arbo.1.1":"De workshops en de herhaalmeting kunt u als maatregelen op individueel niveau opnemen in uw plan van aanpak, naast maatregelen die het werk zelf aanpakken.","T.need.3":"Als u een ondernemingsraad (OR) heeft: instemming van de OR waar dat vereist is (WOR art. 27). Wij helpen het verzoek voorbereiden.","T.pilotNote":"In de pilot worden de antwoorden alleen gebruikt om het rapport van uw organisatie op te stellen en om de betrouwbaarheid van de vragenlijsten te controleren. Licenties voor commercieel gebruik van de vragenlijsten worden momenteel met de auteurs geregeld.","T.faq.2.1":"Nee. Het is een niet-klinische scan op basis van gepubliceerde vragenlijsten, bedoeld om patronen in groepen te zien en de juiste ondersteuning te kiezen. De persoonlijke resultaatpagina verwijst iedereen die het zwaar heeft naar de bedrijfsarts, de huisarts of een psycholoog.","T.emp.3":"Meedoen is vrijwillig. U kunt op elk moment stoppen; uw antwoorden worden alleen gebruikt als u uw antwoordcode verstuurt.","T.jAfter.2":"Workshops door een ervaren psycholoog of trainer; een herhaalmeting na 3–6 maanden laat zien of de scores zijn veranderd.","T.flow.6.3":"De psycholoog geeft de workshops; een herhaalmeting na 3–6 maanden laat zien of de scores zijn veranderd.","T.tSelf":"Uw antwoorden en resultaat blijven in deze browser. Er wordt niets verstuurd, tenzij u er zelf voor kiest uw antwoordcode te versturen.","T.tConsent":"Ik begrijp dat deelname vrijwillig is, dat er niets wordt verstuurd zonder dat ik daar zelf voor kies, en dat dit geen klinische diagnose is.","T.tLevelHint":"Wordt alleen gebruikt om groepen te vergelijken. Groepen van minder dan 5 personen worden nooit getoond.","T.rP":"Op elke schaal betekent een hogere score meer van die hulpbron. Dit is een momentopname van uw antwoorden van vandaag, geen diagnose.","T.rHow":"De kleuren tonen de scoreklasse: rood = aandacht nodig, geel = gemiddeld, groen = sterk. Elke vragenlijst heeft zijn eigen gebruikelijke scorebereik; vergelijk een dimensie daarom liever met zichzelf door de tijd heen dan met andere dimensies.","T.rStr":"Uw hoogste scores","T.rGrow":"Uw laagste scores","T.rCodeP":"Kopieer deze code en mail hem naar SoloNovate, niet naar uw leidinggevende of HR. De code bevat alleen uw antwoorden, functieniveau en maand, niet uw naam. Omdat de code per e-mail binnenkomt, ziet SoloNovate kort uw e-mailadres; we slaan dat nooit op bij uw antwoorden en verwijderen de e-mail zodra de code is ingevoerd.","T.rCodeShow":"Code tonen","T.rDetailNote":"Onderdelen die op slechts 2–4 vragen zijn gebaseerd, zijn indicatief.","T.whatNot":"Goed om te weten","T.see.3.1":"Ja, zonder naam (e-mail verwijderd na invoer)","T.roles.2.3":"Plant de meetperiode met ons, bereidt het bericht aan medewerkers voor dat het management verstuurt, en is de schakel naar het management.","T.wsPartner":"Uitvoering: elke workshop wordt gegeven door een ervaren psycholoog of trainer in Nederland, die wij voor uw opdracht selecteren. U maakt vóór de nabespreking kennis met hem of haar.","T.meName":"Maryam Jaberi","T.meBio":"Productmanager en UX-onderzoeker met ervaring in zoekmachines, video- en onderwijsplatforms. Ontwerpt de scan, bewaakt de gegevens en schrijft uw rapport; de partner-psycholoog controleert de duiding.","T.rv.sum.2":"Scores lopen van 0 tot 100: 0 is het laagst mogelijke antwoord op elke vraag, 100 het hoogste. Onder 37,5 = aandacht nodig, 37,5–62,5 = gemiddeld, boven 62,5 = sterk. Elke vragenlijst heeft zijn eigen gebruikelijke scorebereik; vergelijk een dimensie daarom liever tussen functieniveaus of door de tijd heen dan met andere dimensies.","T.rv.gap.2":"Een lange lijn betekent dat de functieniveaus heel verschillend scoren. Dat kan samenhangen met de eisen van de functie, maar ook met wie in welke functie terechtkomt; bespreek het in de nabespreking voordat u conclusies trekt.","T.rv.prof.2":"De balk is de score van het niveau, de dunne lijn het gemiddelde van de andere niveaus. Verschillen kleiner dan ongeveer 5 punten zijn meestal niet betekenisvol, en bij niveaus met minder dan 20 mensen kunnen ook grotere verschillen op toeval berusten.","T.rv.sub.0":"Subscores","T.rv.sub.2":"Is een dimensie laag, dan ziet u hier welk onderdeel het laagst scoort. De onderdelen van zelfcompassie berusten elk op 2 vragen en de auteurs raden aan alleen de totaalscore te gebruiken; zie ze dus als aanknopingspunten voor het gesprek in de nabespreking, niet als metingen.","T.rv.time.2":"Lichte balk = eerste meting, donkere balk = herhaalmeting. Of een verandering meer is dan toeval, hangt af van de groepsgrootte. Elke keer kunnen andere mensen meedoen en ook andere gebeurtenissen spelen mee; een verandering laat dus zien wát er is veranderd, niet waarom.","T.rv.plan.2":"Een dimensie wordt als prioriteit voorgesteld als meer dan 25% van de mensen in 'aandacht nodig' scoort, of als een functieniveau van 10 of meer mensen minstens 5 punten lager scoort dan de andere niveaus. We tonen de drie belangrijkste; de rest staat onder 'Ook in de gaten houden'. Dit is een vertrekpunt voor de nabespreking, geen oordeel.","T.sumStrong":"Hoogste scores: {a}.","T.sumWeak":"Laagste score: {d} ({m}); {p} van de mensen scoort in 'aandacht nodig'.","T.pAvg":"Laagste dimensie","T.kpiSub.2":"begin hier in de nabespreking","T.allLv":"alle functieniveaus (geen niveau scoort duidelijk lager)","T.planNote":"Kijk voordat u workshops kiest in uw RI&E of uw onderzoek naar arbeidsomstandigheden: worden deze patronen verklaard door werkdruk, autonomie of steun? Pak dat dan eerst aan.","T.pPlan":"Informeer naar deze workshop (e-mail)","T.print":"Afdrukken / opslaan als pdf","T.fHint":"Opent uw e-mailprogramma met deze aanvraag al ingevuld. Geen e-mailprogramma? Schrijf naar {e}.","T.mBandsP":"Onder 37,5: aandacht nodig · 37,5 tot 62,5: gemiddeld · boven 62,5: sterk. Deze grenzen volgen de conventie die voor de Zelfcompassieschaal (Self-Compassion Scale) wordt gebruikt (gemiddeld antwoord onder 2,5 of boven 3,5 op een schaal van 1–5) en worden voor de eenvoud op alle schalen toegepast. Het zijn geen populatienormen of klinische afkappunten, en de gebruikelijke scores verschillen per vragenlijst.","T.mCourse":"Deze dienst is ontstaan uit de cursus \"Persoonlijke en menselijke vaardigheden in organisaties en onderwijsinstellingen\" van dr. Azarakhsh Mokri. Uit de vragenlijsten die daarin aan bod komen, kozen we er acht die kort en gepubliceerd zijn, geen klinische labels gebruiken en elk gekoppeld zijn aan een vaardigheid die te trainen is.","T.cRed":"Illustratief scenario (geen verwacht effect): verzuim door psychische klachten daalt met","T.cStress":"waarvan door psychische klachten","T.cCost":"kosten van verzuim door psychische klachten per jaar","T.cNote":"Dit is een scenario, geen voorspelling. Er is nog geen direct bewijs dat deze scan en de workshops verzuim verminderen, en een score op een vragenlijst vertaalt zich niet rechtstreeks in minder verzuimdagen. Gebruik de schatting om te beoordelen of investeren in preventie de moeite waard is, en de herhaalmeting om te zien wat er echt veranderd is.","DIMS.flex.b.1":"Moeilijke gedachten en gevoelens zitten soms in de weg, maar meestal blijft de koers gericht op wat belangrijk is.","DIMS.belong.b.0":"Een sterk gevoel buitenstaander of afgewezen te zijn; in onderzoek gaat dit samen met een lager welzijn.","DIMS.selfctrl.what":"Hoe mensen hun eigen vermogen inschatten om impulsen te beheersen, verleidingen te weerstaan en vast te houden aan langetermijndoelen.","DIMS.selfctrl.b.0":"Verleidingen en afleiding winnen vaak; de omgeving en gewoonten aanpassen helpt vaak meer dan harder proberen.","DIMS.selfctrl.b.2":"Houdt meestal vast aan langetermijndoelen; in onderzoek gaat dit vaak samen met goede gewoonten.","DIMS.hope.b.2":"Heldere doelen, meerdere routes en genoeg energie; in studies verbonden met iets betere prestaties.","DIMS.optim.b.2":"Verwacht over het algemeen goede uitkomsten; in studies gaat dit samen met doorzettingsvermogen en een betere gezondheid.","WS.w-comp.ev":"Een meta-analyse van 27 gerandomiseerde studies vond matige effecten van zelfcompassieprogramma's, meestal van enkele weken, op zelfkritiek en stress. De effecten van een workshop van twee sessies zijn waarschijnlijk kleiner.","WS.w-flex.ev":"Een meta-analyse van 17 studies op de werkvloer naar acceptance and commitment training (ACT) vond een kleine tot matige afname van psychische klachten en een toename van psychologische flexibiliteit; de effecten waren het duidelijkst bij kantoormedewerkers en klein bij zorgpersoneel.","WS.w-belong.ev":"Korte interventies voor verbondenheid verbeterden de uitkomsten van studenten, maar een grote replicatie uit 2023 vond alleen effecten waar de omgeving echte kansen bood om erbij te horen. Vergelijkbare studies op de werkvloer zijn er nog niet; daarom combineert de workshop dit idee met inwerk- en buddyprogramma's.","WS.w-ei.goals.2":"Emotionele arbeid: de prijs ervan herkennen","WS.w-self.ev":"Overzichtsstudies wijzen erop dat de situatie inrichten beter werkt dan vertrouwen op wilskracht op het moment zelf; iets leuks koppelen aan een taak (temptation bundling) hielp in één veldexperiment, maar het effect nam na verloop van tijd af.","INST.lot.intro":"In hoeverre bent u het eens met elke uitspraak?","INST.ahs.intro":"Hoe waar is elke uitspraak voor u?","SUBN.scs.sj":"Niet overdreven zelfkritisch","SUBN.scs.is":"Zich niet alleen voelen bij tegenslag","SUBN.scs.oi":"Niet meegesleept door gevoelens","T.calcT":"Wat kost verzuim door psychische klachten u?","T.sumNext":"Voorgestelde eerste stap: de workshop '{w}', voor {who}.","T.profUp":"Hoger dan de andere niveaus bij {lv}: {a}.","T.profDown":"Lager dan de andere niveaus bij {lv}: {b}.","T.profFlat":"{lv}: op elke dimensie dicht bij de andere niveaus.","T.orgAvg":"gemiddelde van de andere niveaus","T.rv.prof.1":"Eén functieniveau vergeleken met de andere niveaus.","T.subKey":"Laagste onderdeel: {s} binnen {d} ({v}).","T.mLimL.1":"De scoreklassen hebben geen populatienormen; vergelijken binnen de organisatie en over de tijd is betrouwbaarder dan vergelijken met een \"landelijk gemiddelde\".","T.heroK":"Voor kennisintensieve organisaties · pilots vanaf 20 deelnemers","T.jP":"Ongeveer vijf weken van kick-off tot nabespreking, daarna workshops. Eén afdeling of de hele organisatie.","T.need.4":"In totaal ongeveer 3 uur tijd van HR, verspreid over vijf weken","T.jAfter.1":"Workshops en herhaalmeting","T.flow.6.1":"Workshops en herhaalmeting","T.get.3.0":"Een persoonlijk resultaat voor elke deelnemer","T.get.3.1":"Elke medewerker ziet direct het eigen resultaat en twee praktische tips; het management ziet nooit iemands individuele resultaat.","T.mEthL.1":"Alleen de maand wordt vastgelegd, niet de exacte datum of tijd.","T.rCare":"Voelt u zich al een tijd somber of heeft u het gevoel dat u het niet meer aankunt? Praat dan met uw bedrijfsarts, uw huisarts of een psycholoog. Hulp vragen is een teken van kracht.","T.rStrRel":"Waar u vandaag het hoogst scoort","T.rStrNote":"Geen van uw scores valt nog in de scoreklasse 'sterk'; dit zijn simpelweg uw hoogste scores van vandaag.","T.session":"Pagina in de cursuswiki (Perzisch)","T.kpiSub.3":"gemiddelde over de acht dimensies","T.distKey":"{d}: {p} van de mensen scoort in 'aandacht nodig', ook al valt het gemiddelde ({m}) in 'gemiddeld'.","T.timeKey":"Grootste verandering: {d} ({x} punten). Bij deze groepsgroottes kunnen veranderingen kleiner dan ongeveer 5 punten op toeval berusten.","T.pWhyLow":"{p} van de mensen scoort in 'aandacht nodig'.","T.pWhyGap":"{lv}: {x} punten lager dan de andere niveaus.","T.pAlso":"Ook in de gaten houden","T.pScopeBelong":"Let op: deze schaal meet verbondenheid in het leven als geheel, niet alleen op het werk; kijk in de nabespreking naar oorzaken die met het werk te maken hebben.","T.pScopeOptim":"Let op: optimisme is een vrij stabiele eigenschap; verwacht een bescheiden verandering en kijk eerst naar de omstandigheden op het werk.","DIMS.compassion.not":"Zelfcompassie is niet hetzelfde als luiheid, egoïsme of de lat lager leggen.","DIMS.flex.not":"Een lage score is geen diagnose; het betekent dat moeilijke gedachten en gevoelens op dit moment vaak in de weg zitten bij wat belangrijk voor u is.","DIMS.compassion.b.1":"In moeilijke momenten niet erg streng voor zichzelf, maar ook niet consequent mild.","DIMS.belong.b.1":"Een gemiddeld gevoel van erbij horen en geaccepteerd worden; niet sterk verbonden, maar ook niet sterk buitengesloten.","DIMS.flow.b.1":"Opgaan in het werk, werkplezier en motivatie liggen op een gemiddeld niveau.","DIMS.optim.b.1":"Gematigde verwachtingen over de toekomst; niet duidelijk optimistisch en ook niet pessimistisch.","DIMS.ei.b.1":"Schat de eigen emotionele vaardigheden als gemiddeld in.","DIMS.selfctrl.b.1":"Gemiddelde zelfcontrole volgens eigen inschatting; langetermijndoelen winnen het een deel van de tijd.","WS.w-belong.goals.0":"Laagdrempelig contact: korte check-ins en oprechte waardering tussen collega's"},"fa":{"T.heroT":"ببینید تیم‌های شما در هر ردهٔ شغلی از نظر منابع روانی کجا ایستاده‌اند و از کجا باید شروع کنید.","T.heroP":"کارکنان بی‌نام و در ۸ تا ۱۸ دقیقه به هشت پرسشنامهٔ علمیِ منتشرشده پاسخ می‌دهند و نتیجهٔ خودشان را همان لحظه می‌بینند. سازمان شما یک گزارش گروهی به تفکیک ردهٔ شغلی می‌گیرد، با توضیح به زبان ساده و برنامه‌ای با دو یا سه کارگاه پیشنهادی.","T.f1s":"با ۸ پرسشنامهٔ منتشرشده که در زبان اصلی خود اعتباریابی شده‌اند","T.pP":"منابع روانی سازمان شما به تفکیک ردهٔ شغلی، با اولویت‌ها و کارگاه‌های پیشنهادی.","T.paths.0.2":"توجیه اقتصادی، آنچه دریافت می‌کنید و روند اجرای آزمایشی.","T.paths.0.3":"برآورد هزینهٔ غیبت","T.whyP":"سلامت روان موضوعی «نرم» نیست؛ اثرش در غیبت، ترک کار و کیفیت کار دیده می‌شود. این سنجش خودِ این مشکل‌ها را نمی‌سنجد؛ منابع روانی‌ای را می‌سنجد که به افراد کمک می‌کنند با فشار کاری کنار بیایند.","T.why.0.1":"از کارکنان هلندی نشانه‌های فرسودگی شغلی را گزارش می‌کند (۲۱٪ در ۲۰۲۵، پیمایش ملی NEA).","T.priv.1":"فقط ردهٔ شغلی شما، ماه شرکت و نسخه‌ای که پر کرده‌اید همراه پاسخ‌هایتان ذخیره می‌شود.","T.priv.3":"پاسخ‌ها بدون نام یا هر نشانهٔ شناسایی ذخیره می‌شوند؛ هیچ مدیری و هیچ‌کس در منابع انسانی نتیجهٔ فردی کسی را نمی‌بیند.","T.law.0.1":"نامی پرسیده نمی‌شود؛ پاسخ‌ها جدا از هر نشانی ایمیلی نگه داشته می‌شوند و فقط برای گروه‌های ۵ نفر و بیشتر گزارش می‌شوند. چون پاسخ‌ها دربارهٔ حال روانی افرادند و ممکن است دادهٔ سلامت به شمار آیند، شرکت در سنجش بر پایهٔ رضایت صریح و داوطلبانه است.","T.law.1.1":"از سیاست کارفرما برای کاهش فشار روانی-اجتماعی کار (PSA، مادهٔ ۳ بند ۲) پشتیبانی می‌کند؛ مکملی در سطح فرد است، در کنار اقدام‌هایی که ریشهٔ خطر را در خود کار برطرف می‌کنند و در کنار RI&E (مادهٔ ۲٫۱۵ آیین‌نامهٔ Arbobesluit).","T.law.2.1":"چنین نظرسنجی‌ای از کارکنان معمولاً به موافقت شورای کار، یا دست‌کم مشارکت آن، نیاز دارد (مادهٔ ۲۷ WOR)؛ در آماده کردنش کمک می‌کنیم.","T.arboT":"پشتیبانی از سیاست PSA شما طبق قانون شرایط کار هلند (Arbowet)","T.arboP":"کارفرمایان در هلند باید سیاستی داشته باشند تا از فشار روانی-اجتماعی کار (PSA)، مثل استرس شغلی، پیشگیری کنند یا دست‌کم آن را کم کنند. آن‌ها باید خطرهای PSA را در ارزیابی خطر (RI&E) بسنجند و برایشان برنامهٔ اقدام بنویسند. قانون می‌خواهد استرس شغلی اول در ریشه‌اش (حجم کار، اختیار عمل، حمایت) کم شود و فقط پس از آن سراغ اقدام‌های فردی بروند. این سنجش و کارگاه‌هایش از همین نوع اقدام فردی‌اند: مکملی سودمند که هرگز جای آن اقدام‌ها را نمی‌گیرد.","T.arbo.1.1":"کارگاه‌ها و سنجش دوباره را می‌توان به‌عنوان اقدام‌های سطح فرد در برنامهٔ اقدام ثبت کرد، در کنار اقدام‌هایی که به خود کار می‌پردازند.","T.need.3":"اگر شورای کار (OR) دارید، موافقت آن، هر جا لازم باشد (مادهٔ ۲۷ WOR). در آماده کردن درخواست به شما کمک می‌کنیم.","T.pilotNote":"در اجرای آزمایشی، پاسخ‌ها فقط برای ساختن گزارش سازمان شما و بررسی پایایی پرسشنامه‌ها به کار می‌روند. مجوز استفادهٔ تجاری از پرسشنامه‌ها در حال هماهنگی با پدیدآورندگان آن‌هاست.","T.faq.2.1":"نه. این سنجش بالینی نیست و بر پایهٔ پرسشنامه‌های منتشرشده است؛ هدفش دیدن الگوهای گروهی و انتخاب حمایت مناسب است. اگر حال کسی خوب نباشد، صفحهٔ نتیجهٔ شخصی او را به پزشک شرکت، پزشک خانواده یا روان‌شناس راهنمایی می‌کند.","T.emp.3":"شرکت داوطلبانه است. هر وقت بخواهید می‌توانید دست بکشید؛ پاسخ‌هایتان فقط وقتی به کار می‌روند که کد پاسخ خود را بفرستید.","T.jAfter.2":"کارگاه‌ها را یک روان‌شناس یا مربی باتجربه برگزار می‌کند؛ سنجش دوباره پس از ۳ تا ۶ ماه نشان می‌دهد نمره‌ها تغییر کرده‌اند یا نه.","T.flow.6.3":"روان‌شناس کارگاه‌ها را برگزار می‌کند؛ سنجش دوباره پس از ۳ تا ۶ ماه نشان می‌دهد نمره‌ها تغییر کرده‌اند یا نه.","T.tSelf":"پاسخ‌ها و نتیجهٔ شما در همین مرورگر می‌مانند. تا خودتان کد پاسخ را نفرستید، چیزی ارسال نمی‌شود.","T.tConsent":"می‌دانم که شرکت داوطلبانه است، تا خودم نخواهم چیزی فرستاده نمی‌شود و این سنجش تشخیص بالینی نیست.","T.tLevelHint":"فقط برای مقایسهٔ گروه‌ها به کار می‌رود. گروه‌های کمتر از ۵ نفر هرگز نمایش داده نمی‌شوند.","T.rP":"در همهٔ مقیاس‌ها، نمرهٔ بالاتر یعنی آن منبع روانی در شما قوی‌تر است. این تصویری لحظه‌ای از پاسخ‌های امروز شماست، نه تشخیص.","T.rHow":"رنگ‌ها سطح را نشان می‌دهند: قرمز = «نیازمند توجه»، زرد = «متوسط»، سبز = «قوی». هر پرسشنامه دامنهٔ معمول خودش را دارد؛ پس هر بُعد را در طول زمان با خودش مقایسه کنید، نه با بُعدهای دیگر.","T.rStr":"بالاترین نمره‌های شما","T.rGrow":"پایین‌ترین نمره‌های شما","T.rCodeP":"این کد را کپی کنید و برای SoloNovate ایمیل کنید، نه برای مدیر یا منابع انسانی. کد فقط گزینه‌هایی که انتخاب کرده‌اید، ردهٔ شغلی و ماه را در خود دارد، نه نام شما. چون کد با ایمیل می‌رسد، SoloNovate برای مدت کوتاهی نشانی ایمیل شما را می‌بیند؛ ما هرگز آن را همراه پاسخ‌هایتان ذخیره نمی‌کنیم و پس از وارد کردن کد، ایمیل را پاک می‌کنیم.","T.rCodeShow":"نمایش کد","T.rDetailNote":"زیرمقیاس‌هایی که فقط ۲ تا ۴ پرسش دارند، تقریبی‌اند.","T.whatNot":"در نظر داشته باشید","T.see.3.1":"بله، بدون نام (ایمیل پس از وارد کردن کد پاک می‌شود)","T.roles.2.3":"دورهٔ سنجش را با ما برنامه‌ریزی می‌کند، پیامی را که مدیریت برای کارکنان می‌فرستد آماده می‌کند و رابط ما با مدیریت است.","T.wsPartner":"برگزاری: هر کارگاه را یک روان‌شناس یا مربی باتجربه در هلند برگزار می‌کند که ما برای پروژهٔ شما انتخاب می‌کنیم. پیش از جلسهٔ بازخورد با او آشنا می‌شوید.","T.meName":"مریم جابری","T.meBio":"مدیر محصول و پژوهشگر تجربهٔ کاربری، با سابقهٔ کار در موتور جست‌وجو، پخش ویدیو و پلتفرم‌های آموزشی. سنجش را طراحی می‌کند، از داده‌ها محافظت می‌کند و گزارش شما را می‌نویسد؛ یک روان‌شناس همکار تفسیر نتیجه‌ها را بازبینی می‌کند.","T.rv.sum.2":"نمره‌ها از ۰ تا ۱۰۰ هستند: ۰ یعنی پایین‌ترین پاسخ ممکن به همهٔ پرسش‌ها و ۱۰۰ یعنی بالاترین. زیر ۳۷٫۵ = «نیازمند توجه»، ۳۷٫۵ تا ۶۲٫۵ = «متوسط»، بالای ۶۲٫۵ = «قوی». هر پرسشنامه دامنهٔ معمول خودش را دارد؛ پس هر بُعد را میان رده‌ها یا در طول زمان مقایسه کنید، نه با بُعدهای دیگر.","T.rv.gap.2":"خط بلند یعنی نمرهٔ رده‌ها در این بُعد خیلی با هم فرق دارد. این ممکن است از خواسته‌های هر نقش باشد، یا از اینکه چه کسانی به کدام نقش‌ها می‌رسند؛ پیش از نتیجه‌گیری، آن را در جلسهٔ بازخورد بررسی کنید.","T.rv.prof.2":"نوار، نمرهٔ این رده است و خط باریک، میانگین رده‌های دیگر. تفاوت‌های کمتر از حدود ۵ امتیاز معمولاً معنادار نیستند و در رده‌های کمتر از ۲۰ نفر، حتی تفاوت‌های بزرگ‌تر هم ممکن است تصادفی باشند.","T.rv.sub.0":"زیرمقیاس‌ها","T.rv.sub.2":"وقتی بُعدی پایین است، اینجا می‌بینید کدام بخش آن کمترین نمره را دارد. هر بخش شفقت به خود فقط ۲ پرسش دارد و سازندگان مقیاس توصیه می‌کنند فقط نمرهٔ کل به کار رود؛ پس این بخش‌ها را سرنخی برای گفت‌وگو در جلسهٔ بازخورد بدانید، نه اندازه‌گیری دقیق.","T.rv.time.2":"نوار روشن = سنجش اول، نوار تیره = سنجش دوباره. اینکه یک تغییر واقعی است یا تصادفی، به اندازهٔ گروه بستگی دارد. ممکن است هر بار افراد متفاوتی شرکت کنند و رویدادهای دیگر هم اثر بگذارند؛ پس تغییر نشان می‌دهد چه چیزی عوض شده، نه چرا.","T.rv.plan.2":"بُعدی به‌عنوان اولویت پیشنهاد می‌شود که در آن بیش از ۲۵٪ افراد در سطح «نیازمند توجه» باشند، یا یک ردهٔ شغلی با ۱۰ نفر یا بیشتر در آن دست‌کم ۵ امتیاز پایین‌تر از رده‌های دیگر باشد. سه مورد اول را نشان می‌دهیم و بقیه زیر عنوان «این‌ها را هم زیر نظر داشته باشید» می‌آیند. این فقط نقطهٔ شروعی برای جلسهٔ بازخورد است، نه حکم نهایی.","T.sumStrong":"بالاترین نمره‌ها: {a}.","T.sumWeak":"پایین‌ترین نمره: «{d}» ({m})؛ {p} افراد در سطح «نیازمند توجه» هستند.","T.pAvg":"پایین‌ترین بُعد","T.kpiSub.2":"در جلسهٔ بازخورد از اینجا شروع کنید","T.allLv":"همهٔ رده‌ها (هیچ رده‌ای آشکارا پایین‌تر نیست)","T.planNote":"پیش از انتخاب کارگاه‌ها، با RI&E یا سنجش شرایط کار خود بررسی کنید که آیا حجم کار، اختیار عمل یا حمایت، این الگوها را توضیح می‌دهند یا نه. اگر چنین است، اول به آن‌ها بپردازید.","T.pPlan":"پرسیدن دربارهٔ این کارگاه (ایمیل)","T.print":"چاپ / ذخیره به‌صورت PDF","T.fHint":"برنامهٔ ایمیل شما با همین درخواست باز می‌شود. برنامهٔ ایمیل ندارید؟ به {e} بنویسید.","T.mBandsP":"زیر ۳۷٫۵: «نیازمند توجه» · ۳۷٫۵ تا ۶۲٫۵: «متوسط» · بالای ۶۲٫۵: «قوی». این مرزها از روشی گرفته شده‌اند که برای مقیاس شفقت به خود رایج است (میانگین پاسخ زیر ۲٫۵ یا بالای ۳٫۵ در مقیاس ۱ تا ۵) و برای سادگی در همهٔ مقیاس‌ها به کار رفته‌اند. این مرزها هنجار جمعیتی (مقایسه با میانگین جامعه) یا نقطهٔ برش بالینی نیستند و نمره‌های معمول در هر پرسشنامه فرق دارد.","T.mCourse":"این خدمت از دورهٔ آموزشی «مهارت‌های فردی و انسانی در سازمان‌ها و مراکز آموزشی» دکتر آذرخش مکری الهام گرفته است. از میان پرسشنامه‌های آن دوره، هشت پرسشنامه را انتخاب کردیم که کوتاه و منتشرشده‌اند، برچسب بالینی ندارند و هر کدام به مهارتی مربوط‌اند که می‌شود آن را آموخت.","T.cRed":"سناریوی فرضی (نه نتیجهٔ مورد انتظار): کاهش غیبت به‌خاطر مشکلات روانی","T.cStress":"روز از آن به مشکلات روانی مربوط است","T.cCost":"هزینهٔ سالانهٔ غیبت به‌خاطر مشکلات روانی","T.cNote":"این یک سناریوست، نه پیش‌بینی. هنوز شاهد مستقیمی نداریم که این سنجش و کارگاه‌هایش غیبت را کم کنند، و نمرهٔ پرسشنامه مستقیماً به روزهای غیبت کمتر تبدیل نمی‌شود. از این برآورد برای سنجیدن اینکه سرمایه‌گذاری در پیشگیری می‌ارزد یا نه استفاده کنید، و از سنجش دوباره برای دیدن اینکه واقعاً چه چیزی تغییر کرده است.","DIMS.flex.b.1":"افکار و احساس‌های سخت گاهی مانع می‌شوند، اما بیشتر وقت‌ها حرکت به سوی آنچه مهم است ادامه پیدا می‌کند.","DIMS.belong.b.0":"احساس غریبگی یا طرد شدن پررنگ است؛ در پژوهش‌ها این با حال روانی بدتر همراه است.","DIMS.selfctrl.what":"اینکه افراد توانایی خود را در کنترل تکانه، مقاومت در برابر وسوسه و پایبندی به هدف‌های درازمدت چطور ارزیابی می‌کنند.","DIMS.selfctrl.b.0":"وسوسه‌ها و حواس‌پرتی‌ها اغلب برنده می‌شوند؛ تغییر محیط و عادت‌ها معمولاً بیش از تلاش بیشتر کمک می‌کند.","DIMS.selfctrl.b.2":"معمولاً به هدف‌های درازمدت پایبند است؛ در پژوهش‌ها این اغلب با عادت‌های خوب همراه است.","DIMS.hope.b.2":"هدف روشن، چند راه برای رسیدن و انرژی کافی؛ در پژوهش‌ها با عملکردی اندکی بهتر همراه است.","DIMS.optim.b.2":"به‌طور کلی انتظار پیامدهای خوب را دارد؛ در پژوهش‌ها این با پشتکار و سلامت بهتر همراه است.","WS.w-comp.ev":"فراتحلیلی از ۲۷ کارآزمایی تصادفی‌شده نشان داد برنامه‌های شفقت به خود، که بیشترشان چند هفته طول می‌کشیدند، اثری متوسط بر خودانتقادی و استرس دارند. اثر یک کارگاه دوجلسه‌ای احتمالاً کمتر است.","WS.w-flex.ev":"فراتحلیلی از ۱۷ کارآزمایی آموزش مبتنی بر پذیرش و تعهد (ACT) در محیط کار، کاهش کوچک تا متوسط پریشانی و افزایش انعطاف‌پذیری روانی را نشان داد؛ اثرها در کارکنان اداری روشن‌تر و در کارکنان حوزهٔ سلامت کوچک بود.","WS.w-belong.ev":"مداخله‌های کوتاه برای تقویت تعلق، نتیجه‌های تحصیلی دانشجویان را بهتر کردند، اما یک پژوهش تکراری بزرگ در ۲۰۲۳ این اثر را فقط در جاهایی دید که محیط فرصت واقعی برای تعلق فراهم می‌کرد. هنوز کارآزمایی مشابهی در محیط کار انجام نشده است؛ برای همین این کارگاه، این ایده را با برنامهٔ آنبوردینگ و همکار راهنما ترکیب می‌کند.","WS.w-ei.goals.2":"کار عاطفی (کنترل احساس‌ها به‌خاطر شغل): شناختن هزینه‌های آن","WS.w-self.ev":"مرورهای پژوهشی نشان می‌دهند شکل دادن به موقعیت مؤثرتر از تکیه بر ارادهٔ لحظه‌ای است؛ جفت کردن لذت با کار در یک آزمایش میدانی کمک کرد، اما اثرش با گذشت زمان کم شد.","INST.lot.intro":"چقدر با هر جمله موافقید؟","INST.ahs.intro":"هر جمله چقدر دربارهٔ شما درست است؟","SUBN.scs.sj":"پرهیز از خودانتقادی افراطی","SUBN.scs.is":"تنها ندیدن خود در سختی‌ها","SUBN.scs.oi":"غرق نشدن در احساس‌ها","T.why.0.0":"از هر ۵ نفر، ۱ نفر","T.why.1.1":"روز کاری هر سال در جهان به‌خاطر افسردگی و اضطراب از دست می‌رود؛ زیانی حدود هزار میلیارد دلار در بهره‌وری.","T.why.2.1":"سازمان جهانی بهداشت در ICD-11 فرسودگی شغلی را «پدیده‌ای شغلی» می‌داند: مشکلِ کار، نه فقط مشکلِ فرد.","T.not":"این سنجش تشخیص بالینی نیست و جای مشاوره یا درمان را نمی‌گیرد. «منابع روانی» را می‌سنجد، یعنی توانایی‌هایی مثل شفقت به خود، انعطاف‌پذیری و تعلق که به آدم کمک می‌کنند با فشار کنار بیاید؛ خودِ فرسودگی شغلی یا فشار کاری را نمی‌سنجد. هدفش دیدن الگوهای گروهی و انتخاب حمایت مناسب است.","T.faq.4.0":"این سنجش استرس شغلی یا فرسودگی شغلی را می‌سنجد؟","T.faq.4.1":"نه مستقیماً. منابع روانی‌ای را می‌سنجد که به افراد کمک می‌کنند با فشار کنار بیایند. خطرهای کاری مثل حجم کار و اختیار عمل را با سنجش شرایط کار می‌سنجند. این دو مکمل یکدیگرند و در ترکیب آن‌ها کمکتان می‌کنیم.","T.faq.6.1":"هر شرکت‌کننده یک کد پاسخ ناشناس (فقط گزینه‌های انتخاب‌شده و رده) را مستقیم برای SoloNovate ایمیل می‌کند، هرگز برای کارفرما. SoloNovate این ایمیل‌ها را پس از وارد کردن کدها پاک می‌کند. برای اجرای کامل، می‌توان جمع‌آوری آنلاین و امن پاسخ‌ها را راه انداخت.","LEVELS.staff":"کارکنان","LEVELS.lead":"سرپرستان تیم","LEVELS.mid":"مدیران میانی","LEVELS.senior":"مدیران ارشد","DIMS.selfctrl.n":"خویشتن‌داری","WS.w-self.t":"خویشتن‌داری با کمک محیط: چیدن محیط، عادت‌ها و جفت کردن لذت با کار","INST.bscs.name":"مقیاس کوتاه خویشتن‌داری","INST.ders.items.13":"وقتی ناراحتم، کنترلم را از دست می‌دهم.","LABELS.s5":"خویشتن‌داری و انتخاب موقعیت","LABELS.s6":"انتخاب و تغییر محیط برای خویشتن‌داری","T.kpiSub.0":"نفر شرکت کرده‌اند","T.kpiSub.3":"میانگین هشت بُعد","T.get.1.0":"تفسیر علمی","T.roles.1.3":"تفسیر گزارش را بازبینی می‌کند، در جلسهٔ بازخورد حاضر است و کارگاه‌هایی را که تیم‌ها انتخاب می‌کنند برگزار می‌کند.","T.flow.3.3":"داده‌های گروهی را تحلیل می‌کنیم و روان‌شناس تفسیرها را بازبینی می‌کند. گروه‌های کمتر از ۵ نفر پنهان می‌مانند.","T.mBands":"سطح‌ها","T.mLimL.1":"سطح‌ها هنجار جمعیتی ندارند؛ مقایسهٔ درون‌سازمانی و در طول زمان معتبرتر از مقایسه با «میانگین کشور» است.","T.pDistP":"در هر بُعد، چند درصد کارکنان در هر سطح‌اند. میانگین ممکن است گروه کوچکی را که حالش خوب نیست پنهان کند.","T.pPriP":"بُعدهایی که میانگین‌شان زیر ۵۵ است یا بیش از ۲۵٪ افراد در آن‌ها در سطح «نیازمند توجه» هستند.","T.mScoreP":"میانگین پاسخ‌های هر زیرمقیاس به بازهٔ ۰ تا ۱۰۰ برده می‌شود: (میانگین − کمینه) ÷ (بیشینه − کمینه) × ۱۰۰. پرسش‌های معکوس (که جهتشان برعکس است) پیش از میانگین‌گیری برگردانده می‌شوند. در بُعدهایی که عدد بالا در پرسشنامهٔ اصلی یعنی مشکل بیشتر (مثل AAQ-II)، نمره برعکس می‌شود تا همه‌جا «بالاتر = بهتر» باشد.","T.profFlat":"نمرهٔ {lv} در همهٔ بُعدها نزدیک به رده‌های دیگر است.","T.profUp":"در مقایسه با رده‌های دیگر، نمرهٔ {lv} در این بُعدها بالاتر است: {a}.","T.profDown":"در مقایسه با رده‌های دیگر، نمرهٔ {lv} در این بُعدها پایین‌تر است: {b}.","T.sumGap":"بیشترین فاصلهٔ میان رده‌ها: «{d}»، {hi} با {a} و {lo} با {b}.","T.gapKey":"بیشترین فاصله: «{d}» — {lo} با {a} در برابر {hi} با {b} ({x} امتیاز).","T.heatKey":"پایین‌ترین نمره: {lv} در «{d}» ({v}). بالاترین: {lv2} در «{d2}» ({v2}).","T.distKey":"«{d}»: {p} افراد در سطح «نیازمند توجه» هستند، با اینکه میانگین ({m}) در سطح «متوسط» است.","T.subKey":"پایین‌ترین زیرمقیاس: «{s}» در «{d}» ({v}).","T.pHeatP":"هر خانه میانگین یک بُعد در یک رده است. قرمز یعنی «نیازمند توجه»، زرد یعنی «متوسط» و سبز یعنی «قوی». خانه‌هایی که کمتر از ۵ نفر دارند، برای حفظ ناشناس بودن پنهان‌اند.","T.rv.heat.2":"هر ردیف را بخوانید تا رده‌ها را مقایسه کنید؛ هر ستون تصویر کلی یک رده را نشان می‌دهد. قرمز یعنی «نیازمند توجه»، زرد یعنی «متوسط» و سبز یعنی «قوی». گروه‌های کمتر از ۵ نفر پنهان‌اند.","T.rv.dist.1":"در هر بُعد، چند درصد افراد در هر سطح‌اند.","DIMS.compassion.what":"اینکه فرد در زمان شکست و رنج با خودش چطور رفتار می‌کند: مهربان و متعادل، یا سرزنش‌گر و غرق در احساس.","DIMS.flex.not":"نمرهٔ پایین تشخیص اختلال نیست؛ یعنی در حال حاضر افکار و احساس‌های سخت اغلب سد راه چیزهایی می‌شوند که برایتان مهم‌اند.","DIMS.belong.what":"احساس محدودیت‌های این سنجش کجاست.","T.mLimL.0":"همهٔ پرسشنامه‌ها خودگزارشی‌اند و ممکن است از حال آن روز یا میل به خوب جلوه کردن اثر بپذیرند.","T.mLimL.2":"پرسشنامه‌ها در زبان اصلی خود اعتباریابی شده‌اند و پرسش‌های انگلیسی همان متن اصلی‌اند. نسخه‌های زبان‌های دیگر که اینجا به کار رفته‌اند (از جمله فارسی، هلندی، آلمانی، فرانسوی، اسپانیایی، لهستانی، ترکی و عربی) در این شکل جداگانه اعتباریابی نشده‌اند و پایایی آن‌ها (اینکه نتیجه‌ها چقدر ثابت و قابل اعتمادند) در اجرای آزمایشی بررسی می‌شود. برای پژوهش، از نسخه‌های رسمیِ اعتباریابی‌شده استفاده کنید (بخش منابع).","T.mEthL.0":"شرکت داوطلبانه است و هر کس هر وقت بخواهد می‌تواند کنار بکشد.","T.mEthL.2":"گزارش‌ها فقط گروهی‌اند و هر گروه دست‌کم ۵ نفر دارد.","T.items":"پرسش","T.footer":"سنجش سلامت روانی سازمان از SoloNovate · نسخهٔ آزمایشی · تشخیص بالینی نیست","T.get.0.1":"هشت بُعد برای هر رده، با نقاط قوت، اولویت‌ها و فاصلهٔ میان رده‌ها.","T.get.1.1":"توضیحی ساده دربارهٔ اینکه هر نمره چه معنایی دارد و چه معنایی ندارد.","T.get.4.1":"مرور نتیجه‌ها با مدیریت و منابع انسانی و تعیین گام‌های بعدی.","T.pilot.0.1":"جلسهٔ شروع","T.pilot.1.1":"زمان پاسخ‌گویی","T.pilot.3.1":"جلسهٔ بازخورد و انتخاب کارگاه","T.faq.3.1":"هر هشت پرسشنامه در سطح بین‌المللی منتشر شده‌اند و در زبان اصلی خود اعتباریابی شده‌اند، و ما کلید نمره‌گذاری اصلی آن‌ها را به کار می‌بریم (بخش «روش علمی» و «منابع»). پرسش‌های انگلیسی همان متن اصلی‌اند. نسخه‌های زبان‌های دیگر که اینجا به کار رفته‌اند هنوز در این شکل جداگانه اعتباریابی نشده‌اند، پس پایایی هر مقیاس را با داده‌های اجرای آزمایشی بررسی می‌کنیم. مجوز استفادهٔ تجاری در حال هماهنگی با پدیدآورندگان پرسشنامه‌هاست.","T.faq.5.1":"بله. اجرای آزمایشی می‌تواند از یک بخش یا یک شعبه شروع شود و بعد گسترش پیدا کند. قاعدهٔ ناشناس بودن در هر اندازه‌ای یکسان است: نتیجه فقط برای گروه‌های دست‌کم ۵ نفره نشان داده می‌شود.","T.faq.7.1":"جلسهٔ بازخورد، دو یا سه کارگاه که یک همکار واجد شرایط در هلند برگزار می‌کند، و سنجش دوباره پس از ۳ تا ۶ ماه برای دیدن تغییرها.","T.cPerDay":"هزینهٔ هر روز غیبت در این محاسبه: {x} (حقوق × ۱٫۳ برای هزینه‌های کارفر window.XL = {"de":{"T.proto":"Pilotversion – ab sofort verfügbar für ein erstes Pilotprojekt in Ihrer Organisation.","T.brand":"Wohlbefindens-Check für Organisationen","T.brandShort":"Wohlbefindens-Check","T.by":"Inspiriert vom Kurs „Persönliche und menschliche Kompetenzen in Organisationen und Bildungseinrichtungen“ von Dr. Azarakhsh Mokri","T.nHome":"Überblick","T.nTake":"Fragebogen ausfüllen","T.nReport":"Organisationsbericht","T.nWs":"Workshops","T.nMethod":"Methode","T.heroK":"Für wissensintensive Organisationen · Pilotprojekte ab 20 Teilnehmenden","T.heroT":"Sehen Sie, über welche psychischen Ressourcen Ihre Teams verfügen – nach Funktionsebene – und wo Sie ansetzen können.","T.heroP":"Die Mitarbeitenden beantworten in 8 bis 18 Minuten anonym acht veröffentlichte wissenschaftliche Fragebögen und sehen ihr eigenes Ergebnis sofort. Ihre Organisation erhält einen Gruppenbericht nach Funktionsebene mit einer verständlichen Einordnung und einem Plan mit zwei oder drei empfohlenen Workshops.","T.ctaTake":"Fragebogen starten","T.ctaDemo":"Beispielbericht ansehen","T.f1":"8 Dimensionen","T.f1s":"8 veröffentlichte Fragebögen, in ihrer Originalsprache validiert","T.f2":"Anonym","T.f2s":"Keine Namen; Gruppen unter 5 Personen werden nie angezeigt","T.f3":"9 Sprachen","T.f3s":"Deutsch, Englisch, Niederländisch, Französisch, Spanisch, Polnisch, Türkisch, Arabisch und Persisch","T.measT":"Was wir messen","T.measP":"Jede Dimension beantwortet eine einfache Frage. Tippen Sie auf eine Karte, um zu sehen, was sie misst und was nicht.","T.whatIs":"Was gemessen wird","T.whatNot":"Bitte beachten","T.privT":"Datenschutz an erster Stelle","T.priv.0":"Es werden keine Namen, E-Mail-Adressen oder Personalnummern abgefragt.","T.priv.1":"Mit Ihren Antworten werden nur Ihre Funktionsebene, der Monat und die von Ihnen gewählte Version gespeichert.","T.priv.2":"Gruppen mit weniger als 5 Personen werden im Organisationsbericht ausgeblendet.","T.priv.3":"Antworten werden ohne jede Kennung gespeichert; weder Führungskräfte noch die Personalabteilung sehen individuelle Ergebnisse.","T.notT":"Was dieser Check nicht ist","T.not":"Er ist keine klinische Diagnose und ersetzt weder Beratung noch Behandlung. Er misst psychische Ressourcen wie Selbstmitgefühl, Flexibilität und Zugehörigkeit, nicht Burnout oder Arbeitsbelastung. Ziel ist es, Muster in Gruppen zu erkennen und die passende Unterstützung zu wählen.","T.tT":"Fragebogen ausfüllen","T.tRound":"Ihr Fragebogen","T.tSelf":"Ihre Antworten und Ihr Ergebnis bleiben in diesem Browser. Es wird nichts gesendet, außer Sie entscheiden sich, Ihren Antwortcode zu senden.","T.tJoin":"Befragungsrunde der Organisation","T.tLevel":"Auf welcher Funktionsebene arbeiten Sie bzw. welche Rolle haben Sie?","T.tLevelHint":"Wird nur für den Gruppenvergleich verwendet. Gruppen mit weniger als 5 Personen werden nie angezeigt.","T.tPack":"Welche Version?","T.tMin":"Min.","T.tItems":"Fragen","T.tConsent":"Mir ist bewusst, dass die Teilnahme freiwillig ist, dass ohne mein Zutun nichts gesendet wird und dass dies keine klinische Diagnose ist.","T.tStart":"Starten","T.tNext":"Nächster Teil","T.tPrev":"Vorheriger Teil","T.tFinish":"Meine Ergebnisse ansehen","T.tPart":"Teil","T.tOf":"von","T.tMissing":"Diese Fragen haben Sie noch nicht beantwortet:","T.tSaved":"Antworten werden auf diesem Gerät gespeichert; wenn Sie die Seite schließen, können Sie hier weitermachen.","T.tResume":"Begonnenen Fragebogen fortsetzen","T.tRestart":"Neu beginnen","T.rT":"Ihre Ergebnisse auf einen Blick","T.rP":"Auf jeder Skala bedeutet ein höherer Wert mehr von dieser Ressource. Dies ist eine Momentaufnahme Ihrer heutigen Antworten, keine Diagnose.","T.rStr":"Ihre höchsten Werte","T.rGrow":"Ihre niedrigsten Werte","T.rTips":"Zwei kurze Tipps","T.rDetail":"Details und Unterskalen","T.rSend":"Anonym an meine Organisation senden","T.rSent":"Ihre Antworten wurden anonym gespeichert. Vielen Dank!","T.rCode":"Antwortcode","T.rCodeP":"Kopieren Sie diesen Code und senden Sie ihn per E-Mail an SoloNovate, nicht an Ihre Führungskraft oder die Personalabteilung. Er enthält nur Ihre Antworten, Ihre Funktionsebene und den Monat, nicht Ihren Namen. Da er per E-Mail eingeht, sieht SoloNovate kurz Ihre E-Mail-Adresse; wir speichern sie nie zusammen mit Ihren Antworten und löschen die E-Mail nach dem Einlesen des Codes.","T.rCopy":"Code kopieren","T.rCopied":"Kopiert","T.rCare":"Wenn Sie sich schon länger niedergeschlagen fühlen oder das Gefühl haben, nicht mehr zurechtzukommen, sprechen Sie mit Ihrem betriebsärztlichen Dienst, Ihrer Hausarztpraxis oder einer Psychologin bzw. einem Psychologen. Sich Hilfe zu holen ist ein Zeichen von Stärke.","T.rNot":"Dieses Ergebnis ist eine Momentaufnahme Ihrer heutigen Antworten, kein Etikett und keine Diagnose.","T.band.0":"Braucht Aufmerksamkeit","T.band.1":"Mittel","T.band.2":"Stark","T.pT":"Organisationsbericht","T.pP":"Die psychischen Ressourcen Ihrer Organisation nach Funktionsebene, mit Prioritäten und empfohlenen Workshops.","T.pSrc":"Berichtsdaten","T.pDemo":"Beispieldaten (zur Demonstration)","T.pLive":"Echte Antworten dieser Runde","T.pImport":"Antwortcodes importieren","T.pImportP":"Fügen Sie hier Antwortcodes ein (einen pro Zeile).","T.pImportGo":"Hinzufügen","T.pAdded":"Antworten hinzugefügt","T.pN":"Teilnehmende","T.pLevels":"Ebenen","T.pAvg":"Niedrigste Dimension","T.pLowShare":"Anteil „braucht Aufmerksamkeit“","T.pNoPri":"Keine Dimension erreicht die Prioritätsschwelle. Vorschlag: Auffrischungs-Workshops, um Stärken zu erhalten.","T.pWhy":"Warum","T.pFor":"Vor allem für","T.pStrengths":"Stärken der Organisation","T.pGap":"Größter Unterschied zwischen den Ebenen","T.pHidden":"weniger als 5","T.pNone":"Noch keine Antworten.","T.pExport":"Zusammenfassung kopieren (CSV)","T.pAdmin":"Runden verwalten","T.pAdminP":"Für die Person, die die Befragung in der Organisation koordiniert. Legen Sie eine Runde an und senden Sie den Link an die Mitarbeitenden.","T.pOrg":"Name der Organisation","T.p
