leichsweise stärksten Bereiche"},"fr":{"T.proto":"Version pilote – disponible dès maintenant pour un premier projet pilote avec votre organisation.","T.brand":"Bilan bien-être pour les organisations","T.brandShort":"Bilan bien-être","T.by":"Inspiré du cours « Compétences personnelles et humaines dans les organisations et les établissements d’enseignement » du Dr Azarakhsh Mokri","T.nHome":"Présentation","T.nTake":"Répondre au questionnaire","T.nReport":"Rapport d’organisation","T.nWs":"Ateliers","T.nMethod":"Méthode","T.heroK":"Pour les organisations à forte intensité de connaissances · pilotes à partir de 20 salariés","T.heroT":"Voyez où en est la santé psychologique de votre organisation, et par où commencer.","T.heroP":"En 15 minutes environ, les salariés remplissent anonymement des questionnaires scientifiques validés. Chacun voit aussitôt un résumé personnel ; l’organisation reçoit un rapport par niveau de fonction, avec une interprétation scientifique et un plan d’ateliers recommandés.","T.ctaTake":"Commencer le questionnaire","T.ctaDemo":"Voir un exemple de rapport","T.f1":"8 dimensions","T.f1s":"Mesurées avec 8 questionnaires validés au niveau international","T.f2":"Anonyme","T.f2s":"Aucun nom ; les groupes de moins de 5 personnes ne sont jamais affichés","T.f3":"9 langues","T.f3s":"Français, anglais, néerlandais, allemand, espagnol, polonais, turc, arabe et persan","T.measT":"Ce que nous mesurons","T.measP":"Chaque dimension répond à une question simple. Touchez une carte pour voir ce qu’elle mesure et ce qu’elle ne mesure pas.","T.whatIs":"Ce qui est mesuré","T.whatNot":"Ce qui n’est pas mesuré","T.privT":"La confidentialité d’abord","T.priv.0":"Aucun nom, adresse e-mail ou numéro de personnel n’est demandé.","T.priv.1":"Seul le niveau de fonction (par ex. collaborateur ou cadre intermédiaire) est enregistré.","T.priv.2":"Les groupes de moins de 5 personnes sont masqués dans le rapport d’organisation.","T.priv.3":"Les réponses sont enregistrées sans aucun identifiant et le rapport ne montre que des résultats de groupe ; aucun responsable n’a accès aux résultats individuels.","T.notT":"Ce que ce bilan n’est pas","T.not":"Ce bilan n’est pas un diagnostic clinique et ne remplace ni un accompagnement ni un traitement. Il mesure des ressources psychologiques, comme l’autocompassion, la flexibilité et l’appartenance, et non l’épuisement professionnel ou la charge de travail. Son but est de repérer des tendances de groupe et de choisir le bon soutien.","T.tT":"Répondre au questionnaire","T.tRound":"Votre questionnaire","T.tSelf":"Bilan personnel (les résultats restent sur votre appareil)","T.tJoin":"Campagne de questionnaire de l’organisation","T.tLevel":"Quel est votre niveau de fonction ou votre rôle ?","T.tLevelHint":"Utilisé uniquement pour comparer les groupes ; aucune autre information personnelle n’est demandée.","T.tPack":"Quelle version ?","T.tMin":"min","T.tItems":"questions","T.tConsent":"Je comprends que la participation est volontaire, que mes réponses sont enregistrées sans mon nom et qu’il ne s’agit pas d’un diagnostic clinique.","T.tStart":"Commencer","T.tNext":"Partie suivante","T.tPrev":"Partie précédente","T.tFinish":"Voir mes résultats","T.tPart":"Partie","T.tOf":"sur","T.tMissing":"Vous n’avez pas encore répondu à ces questions :","T.tSaved":"Les réponses sont enregistrées sur cet appareil ; si vous fermez la page, vous pourrez reprendre ici.","T.tResume":"Reprendre le questionnaire inachevé","T.tRestart":"Recommencer","T.rT":"Vos résultats en un coup d’œil","T.rP":"Les scores vont de 0 à 100 et sont toujours orientés de sorte qu’un score plus élevé soit meilleur.","T.rStr":"Vos points forts","T.rGrow":"Marges de progression","T.rTips":"Deux conseils courts","T.rDetail":"Détails et sous-échelles","T.rSend":"Envoyer anonymement à mon organisation","T.rSent":"Vos réponses ont été enregistrées anonymement. Merci !","T.rCode":"Code de réponse","T.rCodeP":"Copiez ce code et envoyez-le par e-mail à SoloNovate, pas à votre responsable ni aux RH. Il ne contient que les numéros de réponse et votre niveau de fonction, pas votre nom. Nous ne relions pas votre adresse e-mail à vos réponses et nous supprimons l’e-mail après avoir importé le code.","T.rCopy":"Copier le code","T.rCopied":"Copié","T.rCare":"Si votre moral est bas depuis un certain temps ou si vous avez l’impression de ne plus y arriver, parlez-en au médecin du travail, à votre médecin traitant ou à un psychologue. Demander de l’aide est un signe de force.","T.rNot":"Ce résultat est un instantané de vos réponses d’aujourd’hui, pas une étiquette ni un diagnostic.","T.band.0":"À surveiller","T.band.1":"Moyen","T.band.2":"Solide","T.pT":"Rapport d’organisation","T.pP":"Une carte de la santé psychologique de votre organisation par niveau, avec des priorités et des ateliers recommandés.","T.pSrc":"Données du rapport","T.pDemo":"Données d’exemple (démonstration)","T.pLive":"Réponses réelles de cette campagne","T.pImport":"Importer des codes de réponse","T.pImportP":"Collez les codes de réponse ici (un par ligne).","T.pImportGo":"Ajouter","T.pAdded":"réponses ajoutées","T.pN":"Répondants","T.pLevels":"Niveaux","T.pAvg":"Moyenne générale","T.pLowShare":"Part « à surveiller »","T.pNoPri":"Aucune dimension n’atteint le seuil de priorité. Suggestion : des ateliers de consolidation pour préserver les points forts.","T.pWhy":"Pourquoi","T.pFor":"Surtout pour","T.pStrengths":"Points forts de l’organisation","T.pGap":"Plus grand écart entre les niveaux","T.pHidden":"moins de 5","T.pNone":"Pas encore de réponses.","T.pExport":"Copier les données de synthèse (CSV)","T.pAdmin":"Gérer les campagnes","T.pAdminP":"Pour la personne qui coordonne le questionnaire dans l’organisation. Créez une campagne et envoyez le lien aux salariés.","T.pOrg":"Nom de l’organisation","T.pRoundName":"Titre de la campagne","T.pCreate":"Créer la campagne","T.pRounds":"Campagnes","T.pChoose":"Choisir une campagne","T.pNoAdmin":"Seules les personnes qui coordonnent le questionnaire (éditeurs de cette page) peuvent créer des campagnes et voir les réponses réelles. Les autres peuvent consulter l’exemple de rapport ou importer des codes de réponse.","T.pDemoNote":"Ce rapport utilise des données simulées de 180 personnes pour vous montrer à quoi ressemble un vrai rapport.","T.wT":"Ateliers","T.wP":"Chaque atelier cible une ou deux dimensions et s’appuie sur le contenu du cours du Dr Mokri. Les liens de lecture ouvrent les pages du wiki du cours ; les titres sont traduits ici, les pages elles-mêmes sont en persan.","T.wGoals":"Objectifs","T.wWho":"Public","T.wLen":"Durée","T.wEv":"Données probantes","T.wRead":"Pour approfondir dans le wiki du cours (pages en persan)","T.mT":"Méthode","T.mP":"En toute transparence : ce que nous mesurons, comment nous calculons les scores et où se situent les limites.","T.mInst":"Questionnaires","T.mScore":"Calcul des scores","T.mScoreP":"La moyenne de chaque sous-échelle est convertie sur une plage de 0 à 100 : (moyenne − minimum) ÷ (maximum − minimum) × 100. Les items inversés sont d’abord recodés. Lorsqu’un score élevé dans le questionnaire original signifie plus de difficultés (par ex. AAQ-II), le score est inversé pour que « plus haut = mieux » partout.","T.mBands":"Tranches de score","T.mBandsP":"Moins de 37,5 : à surveiller · de 37,5 à 62,5 : moyen · plus de 62,5 : solide. Ces seuils sont des conventions fondées sur l’étendue de l’échelle, et non des normes de population ni des seuils cliniques.","T.mLim":"Limites","T.mLimL.0":"Tous les questionnaires sont des auto-évaluations et peuvent être influencés par l’humeur du jour ou le souhait de bien paraître.","T.mLimL.1":"Les tranches n’ont pas de normes de population ; les comparaisons au sein de l’organisation et dans le temps sont plus valables que la comparaison avec une « moyenne nationale ».","T.mLimL.2":"Les questionnaires sont validés dans leur langue d’origine et les items anglais suivent la formulation originale. Les versions dans d’autres langues utilisées ici, y compris cette version française, n’ont pas été validées séparément sous cette forme ; leur fiabilité est vérifiée pendant le pilote. Pour la recherche, utilisez les versions officiellement validées (voir Sources).","T.mLimL.3":"Cet outil n’est pas conçu pour des décisions concernant des personnes (recrutement, évaluation des performances) et ne doit pas être utilisé à cette fin.","T.mEth":"Éthique et confidentialité","T.mEthL.0":"La participation est volontaire et chacun peut arrêter à tout moment.","T.mEthL.1":"Seuls le mois et l’année sont enregistrés, pas la date ni l’heure exactes.","T.mEthL.2":"Les rapports sont uniquement collectifs, avec un minimum de 5 personnes par groupe.","T.mEthL.3":"Les résultats personnels ne s’affichent que sur l’appareil du répondant.","T.mCourse":"Ce service est né du cours « Compétences personnelles et humaines dans les organisations et les établissements d’enseignement » du Dr Azarakhsh Mokri. Les questionnaires sont ceux présentés dans les diapositives du cours.","T.mWiki":"Wiki complet du cours (persan)","T.mOrgPsy":"Psychologie du travail et des organisations","T.items":"items","T.scale":"Échelle","T.ref":"Référence","T.session":"Support de cours","T.footer":"Bilan bien-être pour les organisations par SoloNovate · version pilote · non diagnostique","T.dims":"dimensions","T.whyT":"Pourquoi c’est important","T.whyP":"La santé psychologique n’est pas un sujet secondaire ; elle se voit dans l’absentéisme, le turnover et la qualité du travail.","T.why.0.0":"1 salarié sur 5","T.why.0.1":"aux Pays-Bas déclare des symptômes d’épuisement professionnel (21 % en 2025).","T.why.1.0":"12 milliards","T.why.1.1":"de journées de travail sont perdues chaque année dans le monde à cause de la dépression et de l’anxiété, soit une perte de productivité d’environ 1 000 milliards de dollars US.","T.why.2.0":"Professionnel","T.why.2.1":"L’OMS classe l’épuisement professionnel (CIM-11) comme un phénomène lié au travail : un problème du travail, pas seulement personnel.","T.getT":"Ce que reçoit votre organisation","T.get.0.0":"Un rapport par niveau de fonction","T.get.0.1":"Huit dimensions par niveau, avec les points forts, les priorités et les écarts entre niveaux.","T.get.1.0":"Une interprétation scientifique","T.get.1.1":"Une explication claire de ce que chaque score signifie et ne signifie pas.","T.get.2.0":"Un plan d’ateliers","T.get.2.1":"Deux ou trois ateliers adaptés à vos priorités, avec format et durée.","T.get.3.0":"Un instantané personnel pour chaque participant","T.get.3.1":"Chaque salarié voit ses propres résultats et deux conseils pratiques ; rien n’est partagé avec la direction.","T.get.4.0":"Un débriefing de 45 minutes","T.get.4.1":"Les résultats sont discutés avec la direction et les RH, avec des prochaines étapes concrètes.","T.pilot.0.0":"Semaine 0","T.pilot.0.1":"Lancement","T.pilot.0.2":"Réunion de 30 minutes : objectifs, niveaux, calendrier et manière d’informer les salariés.","T.pilot.1.0":"Semaines 1–2","T.pilot.1.1":"Questionnaire ouvert","T.pilot.1.2":"Les salariés remplissent le bilan anonyme en 8 à 18 minutes, sur téléphone ou ordinateur, dans l’une des neuf langues.","T.pilot.2.0":"Semaine 3","T.pilot.2.1":"Rapport","T.pilot.2.2":"Le rapport de groupe anonyme par niveau et le plan d’ateliers recommandé.","T.pilot.3.0":"Semaine 4","T.pilot.3.1":"Débriefing et choix","T.pilot.3.2":"Échange avec la direction ; choix des premiers ateliers et du moment de la prochaine mesure.","T.needT":"Ce dont nous avons besoin","T.need.0":"Une personne de contact (par ex. RH)","T.need.1":"Au moins 20 participants, et au moins 5 par niveau de fonction","T.need.2":"Un court message aux salariés (nous fournissons un modèle)","T.need.3":"Le cas échéant, l’information du conseil d’entreprise (OR)","T.need.4":"Environ 3 heures de temps RH au total, réparties sur quatre semaines","T.lawT":"Conforme aux règles néerlandaises et européennes","T.law.0.0":"RGPD","T.law.0.1":"Aucun nom ni identifiant n’est collecté ; les résultats ne sont communiqués que pour des groupes d’au moins 5 personnes.","T.law.1.0":"Arbowet","T.law.1.1":"Contribue à la politique PSA de l’employeur (art. 3, al. 2) comme source complémentaire au volet conditions de travail de la RI&E (Arbobesluit, art. 2.15).","T.law.2.0":"Conseil d’entreprise","T.law.2.1":"Une enquête auprès du personnel comme celle-ci est généralement discutée avec le conseil d’entreprise (WOR, art. 27) ; nous aidons à la préparer.","T.faqT":"Questions fréquentes","T.faq.0.0":"Combien de temps cela prend-il aux salariés ?","T.faq.0.1":"La version courte prend environ 8 minutes ; la version complète environ 18. Le bilan fonctionne sur tout téléphone ou ordinateur.","T.faq.1.0":"Les responsables peuvent-ils voir les réponses individuelles ?","T.faq.1.1":"Non. Il n’y a pas de noms, et le rapport d’organisation ne montre que des groupes de cinq personnes ou plus.","T.faq.2.0":"S’agit-il d’un diagnostic ?","T.faq.2.1":"Non. C’est un bilan non clinique fondé sur des questionnaires validés, pour repérer des tendances de groupe et choisir le bon soutien. Toute personne en difficulté est orientée vers le médecin du travail, son médecin traitant ou un psychologue.","T.faq.3.0":"Les questionnaires sont-ils validés ?","T.faq.3.1":"Les huit questionnaires sont publiés au niveau international et validés dans leur langue d’origine, et nous utilisons leurs clés de cotation originales (voir Méthode et Sources). Les items anglais suivent la formulation originale ; les versions dans d’autres langues utilisées ici, y compris la française, n’ont pas encore été validées séparément sous cette forme. Les données du pilote servent donc à vérifier la fiabilité de chaque échelle. Les licences d’utilisation commerciale sont en cours de négociation avec les auteurs.","T.faq.4.0":"Cela mesure-t-il le stress au travail ou l’épuisement professionnel ?","T.faq.4.1":"Pas directement. Cela mesure les ressources psychologiques qui aident à faire face à la pression. Les risques liés au travail, comme la charge et l’autonomie, se mesurent avec une enquête sur les conditions de travail. Les deux se complètent, et nous vous aidons volontiers à les combiner.","T.faq.5.0":"Est-ce adapté aux grandes organisations ?","T.faq.5.1":"Oui. Un pilote peut commencer dans un service ou sur un site, puis être étendu. Les règles d’anonymat restent les mêmes quelle que soit la taille : des résultats uniquement pour des groupes d’au moins 5 personnes.","T.faq.6.0":"Comment les réponses sont-elles recueillies pendant le pilote ?","T.faq.6.1":"Chaque participant envoie par e-mail un code de réponse anonyme (uniquement les numéros de réponse et le niveau de fonction) directement à SoloNovate, jamais à l’employeur. SoloNovate supprime ces e-mails après importation. Pour un déploiement complet, une collecte en ligne sécurisée peut être mise en place.","T.faq.7.0":"Que se passe-t-il après le rapport ?","T.faq.7.1":"Un débriefing, deux ou trois ateliers animés par un partenaire qualifié aux Pays-Bas, et une nouvelle mesure après 3 à 6 mois pour voir ce qui a changé.","T.ctaT":"Un projet pilote vous intéresse ?","T.ctaP":"Essayez le bilan vous-même, consultez l’exemple de rapport et envoyez une courte demande.","T.calcT":"Combien vous coûte l’absentéisme lié au stress ?","T.calcP":"Une estimation rapide pour votre organisation. Modifiez les chiffres selon votre situation.","T.cEmp":"Nombre de salariés","T.cAbs":"Taux d’absentéisme (%)","T.cAbsH":"Moyenne néerlandaise en 2025 : 5,4 %","T.cSal":"Salaire annuel brut moyen (€)","T.cShare":"Part des jours d’absence due au stress ou à des troubles psychologiques (%)","T.cShareH":"Estimation nationale : environ un quart","T.cRed":"Scénario : l’absentéisme lié au stress baisse de","T.cDays":"jours d’absence par an","T.cStress":"dont liés au stress","T.cCost":"coût annuel de l’absentéisme lié au stress","T.cSave":"économie annuelle dans ce scénario","T.cPerDay":"Coût par jour d’absence utilisé ici : {x} (salaire × 1,3 pour les charges patronales ÷ 220 jours ouvrés). Aux Pays-Bas, les estimations vont de 250 € à 400 € par jour.","T.cNote":"Il s’agit d’un scénario, pas d’une prévision. Un score de questionnaire ne se traduit pas directement en moins de jours d’absence. Utilisez l’estimation pour juger s’il vaut la peine d’investir dans la prévention, et la nouvelle mesure pour voir ce qui a réellement changé.","T.wsPartner":"Animation : chaque atelier est animé par un psychologue ou un formateur expérimenté de notre réseau de partenaires aux Pays-Bas, organisé et coordonné par nous.","T.pilotNoteT":"À propos de cette version pilote","T.pilotNote":"Pendant le pilote, les réponses servent uniquement à produire le rapport de votre organisation et à valider le service, rien d’autre. Les licences d’utilisation commerciale des questionnaires sont négociées en parallèle avec leurs auteurs. Nous le disons dès le départ pour éviter toute surprise.","T.arboT":"Vous aide à respecter vos obligations au titre de l’Arbowet","T.arboP":"Aux Pays-Bas, les employeurs doivent mener une politique visant à prévenir, ou au moins à limiter, la charge psychosociale (PSA) comme le stress au travail, et évaluer les risques PSA dans leur inventaire et évaluation des risques (RI&E) avec un plan d’action.","T.arbo.0.0":"Un élément pour la partie PSA de votre RI&E","T.arbo.0.1":"Les risques PSA concernent surtout le travail lui-même : charge, autonomie, soutien et comportements indésirables. Ce bilan ajoute l’autre versant : les ressources psychologiques de vos équipes, par niveau de fonction. Utilisez-le en complément d’une enquête sur les conditions de travail, pas à sa place.","T.arbo.1.0":"Des éléments pour votre plan d’action","T.arbo.1.1":"Le plan d’ateliers et la nouvelle mesure fournissent des actions concrètes et datées que vous pouvez consigner.","T.arbo.2.0":"Un suivi visible","T.arbo.2.1":"Les résultats avant et après aident à montrer au conseil d’entreprise que vous agissez sur les risques.","T.arboNote":"Le bilan ne remplace ni votre RI&E, ni une enquête sur les conditions de travail, ni l’examen par un expert certifié ; il les complète.","T.fName":"Votre nom","T.fOrg":"Organisation","T.fMail":"E-mail","T.fSize":"Nombre de salariés","T.fMsg":"Message (facultatif)","T.fSend":"Demander un pilote","T.fSent":"Votre messagerie s’ouvre avec la demande préremplie ; il ne reste qu’à cliquer sur Envoyer.","T.sizes.0":"20–50","T.sizes.1":"50–250","T.sizes.2":"250–1 000","T.sizes.3":"1 000+","T.sizes.4":"Autre","T.ctaAbout":"À propos de Maryam Jaberi","T.pPlan":"Planifier cet atelier","T.nSrc":"Sources","T.sT":"Sources","T.sP":"Tous les chiffres, références juridiques et affirmations scientifiques de ce site, avec un lien vers l’original. Les titres des publications restent dans leur langue d’origine.","T.gStats":"Chiffres et coûts","T.gLaw":"Lois et règles","T.gEv":"Recherches à la base des ateliers","T.gInst":"Questionnaires","T.gCourse":"Cours","T.courseRef":"Mokri, A. Compétences personnelles et humaines dans les organisations et les établissements d’enseignement [cours ; persan]. Notes de cours réunies dans le wiki de psychologie.","T.audT":"Par où voulez-vous commencer ?","T.paths.0.1":"Direction","T.paths.0.2":"Ce que cela coûte, ce que cela apporte et comment se déroule un pilote.","T.paths.0.3":"Estimation des coûts","T.paths.1.1":"RH","T.paths.1.2":"Le déroulé semaine par semaine, qui fait quoi, et des documents prêts à l’emploi.","T.paths.1.3":"Déroulé et documents","T.paths.2.1":"Salariés","T.paths.2.2":"Ce que deviennent vos réponses – et essayez le bilan vous-même.","T.paths.2.3":"Votre vie privée","T.paths.3.1":"Psychologues et formateurs","T.paths.3.2":"Questionnaires, données probantes et collaboration avec nous comme partenaire.","T.paths.3.3":"Partenariat","T.tryIt":"Essayez le bilan vous-même (8 min)","T.jT":"De la mesure à l’action","T.jP":"Un pilote de quatre semaines, puis des ateliers. Un service ou toute l’organisation.","T.jAfter.0":"Ensuite","T.jAfter.1":"Ateliers et nouvelle mesure","T.jAfter.2":"Ateliers animés par un psychologue ou un formateur expérimenté ; une nouvelle mesure après 3 à 6 mois montre ce qui a changé.","T.company":"SoloNovate · Rotterdam · KvK 94264759 · TVA NL005072230B46","T.teamT":"L’équipe","T.teamP":"Volontairement petite : vous savez toujours à qui vous avez affaire.","T.meRole":"Fondatrice de SoloNovate · produit et données","T.meBio":"Cheffe de produit avec une expérience dans les moteurs de recherche, le streaming vidéo et les plateformes éducatives, ainsi qu’en recherche UX. Conçoit le bilan, protège les données et rédige votre rapport.","T.meLangs":"Néerlandais, anglais, persan","T.phName":"[Nom du/de la psychologue]","T.phRole":"Psychologue · [inscription, par ex. NIP ou BIG]","T.phBio":"[Deux ou trois phrases : expérience, spécialité, types d’organisations et d’équipes accompagnées.]","T.phLangs":"[Langues des ateliers]","T.phNote":"Aperçu – voici à quoi ressemblera le profil du partenaire une fois complété.","T.langsL":"Langues","T.profile":"Profil","T.nProc":"Fonctionnement","T.prT":"Fonctionnement","T.prP":"Un déroulé clair avec une petite équipe : qui fait quoi, qui voit quoi et quels documents nous signons. Aucune surprise pour la direction ni pour les salariés.","T.rolesT":"Qui fait quoi","T.roles.0.2":"Votre interlocutrice unique","T.roles.0.3":"Met en place le questionnaire, protège les données, analyse les réponses, rédige le rapport et coordonne tout, du lancement à la nouvelle mesure.","T.roles.1.1":"Psychologue partenaire","T.roles.1.2":"Expérimenté(e), anime des ateliers pour les organisations","T.roles.1.3":"Vérifie l’interprétation du rapport, participe au débriefing et anime les ateliers choisis par vos équipes.","T.roles.2.1":"Votre personne de contact","T.roles.2.2":"Souvent les RH ou l’office manager","T.roles.2.3":"Planifie la campagne avec nous, informe les salariés avec notre modèle de message et fait le lien avec la direction.","T.roles.3.1":"Salariés","T.roles.3.2":"Les personnes au centre de la démarche","T.roles.3.3":"Décident eux-mêmes de participer, répondent anonymement en 8 à 18 minutes et voient tout de suite leur propre résultat.","T.roles.4.1":"Direction","T.roles.4.2":"Responsable du suivi","T.roles.4.3":"Reçoit le rapport de groupe, en discute lors du débriefing, choisit les prochaines étapes et partage un résumé avec le personnel.","T.roles.5.1":"Conseil d’entreprise","T.roles.5.2":"Si votre organisation en a un","T.roles.5.3":"Est informé à l’avance et donne son accord lorsque la loi l’exige.","T.flowT":"Le déroulé, semaine par semaine","T.flow.0.0":"Semaine 0","T.flow.0.1":"Lancement","T.flow.0.2.1":"Personne de contact","T.flow.0.3":"30 minutes : objectifs, niveaux de fonction et planning. Nous signons l’accord de pilote et l’accord de traitement des données.","T.flow.1.0":"Semaine 0","T.flow.1.1":"Informer le personnel","T.flow.1.2.0":"Direction","T.flow.1.2.1":"Conseil d’entreprise","T.flow.1.3":"La direction envoie le modèle de message : pourquoi ce questionnaire, comment l’anonymat est garanti et ce qui sera fait des résultats.","T.flow.2.0":"Semaines 1–2","T.flow.2.1":"Questionnaire ouvert","T.flow.2.2.0":"Salariés","T.flow.2.3":"Questionnaires anonymes sur téléphone ou ordinateur. Chacun voit immédiatement son résultat. Un rappel à mi-parcours.","T.flow.3.0":"Semaine 3","T.flow.3.1":"Analyse et rapport","T.flow.3.2.1":"Psychologue","T.flow.3.3":"Nous analysons les données de groupe et le psychologue vérifie l’interprétation. Les groupes de moins de 5 personnes restent masqués.","T.flow.4.0":"Semaine 4","T.flow.4.1":"Débriefing","T.flow.4.2.1":"Psychologue","T.flow.4.2.2":"Direction","T.flow.4.3":"45 minutes : ce que signifient les résultats et par quels deux ou trois ateliers commencer.","T.flow.5.0":"Semaine 4","T.flow.5.1":"Retour à l’équipe","T.flow.5.2.0":"Direction","T.flow.5.3":"Un court résumé est envoyé à tous les salariés. Ils ont participé, ils doivent donc savoir ce qu’il en ressort.","T.flow.6.0":"Ensuite","T.flow.6.1":"Ateliers et nouvelle mesure","T.flow.6.2.0":"Psychologue","T.flow.6.3":"Le psychologue anime les ateliers ; une nouvelle mesure après 3 à 6 mois montre ce qui a changé.","T.seeT":"Qui voit quoi","T.seeP":"L’anonymat est intégré au processus, pas seulement promis.","T.seeCols.0":"Réponses individuelles (sans nom)","T.seeCols.1":"Rapport de groupe (5 personnes et plus)","T.see.0.0":"Salarié","T.see.0.1":"Seulement les siennes","T.see.0.2":"Résumé","T.see.1.0":"Direction et RH","T.see.1.1":"Jamais","T.see.1.2":"Oui","T.see.2.0":"Psychologue partenaire","T.see.2.1":"Jamais","T.see.2.2":"Oui","T.see.3.1":"Oui, sans nom","T.see.3.2":"Oui","T.empT":"Pour les salariés : ce que deviennent vos réponses","T.emp.0":"On ne vous demande jamais votre nom, votre adresse e-mail ou votre numéro de personnel.","T.emp.1":"Votre responsable et les RH ne voient que les résultats de groupes de 5 personnes ou plus.","T.emp.2":"Vous voyez votre propre résultat immédiatement, avec deux conseils pratiques. Personne d’autre que vous ne le voit.","T.emp.3":"La participation est volontaire. Vous pouvez arrêter ou sauter une question à tout moment.","T.emp.4":"Si vous envoyez un code de réponse, envoyez-le à SoloNovate, jamais à votre responsable ni aux RH.","T.docsT":"Exemples de documents","T.docsP":"Pour savoir exactement ce que vous signez avant de commencer. Chaque document est disponible en néerlandais et en anglais et peut être imprimé ou enregistré en PDF. Ce sont des projets que nous finalisons ensemble avant le pilote.","T.docs.pilot-agreement.0":"Accord de pilote","T.docs.pilot-agreement.1":"Ce que comprend le pilote, rôles, anonymat, prix, responsabilité.","T.docs.data-processing.0":"Accord de traitement des données","T.docs.data-processing.1":"RGPD art. 28 : quelles données, sécurité, conservation et violations de données.","T.docs.privacy-participants.0":"Notice de confidentialité pour les participants","T.docs.privacy-participants.1":"En langage simple pour les salariés : qui voit quoi et quels sont vos droits.","T.docs.staff-announcement.0":"Annonce au personnel","T.docs.staff-announcement.1":"Modèle de message de la direction, prêt à adapter.","T.aud.mgmt":"Pour la direction","T.aud.staff":"Pour les salariés","T.aud.hr":"Pour les RH","T.open":"Ouvrir (néerlandais / anglais)","T.rMail":"Envoyer le code à SoloNovate par e-mail","T.partT":"Pour les psychologues et les formateurs","T.partP":"Vous animez des ateliers ou du coaching pour des organisations ? Nous constituons un petit réseau de partenaires.","T.partL.0":"Nous nous chargeons de la mesure, du rapport et du contact client ; vous faites ce que vous faites le mieux.","T.partL.1":"Chaque mission commence par des données : vous savez avant la première séance quels thèmes et niveaux de fonction demandent de l’attention.","T.partL.2":"Des trames d’ateliers avec données probantes et sources sont prêtes à l’emploi et adaptables.","T.partL.3":"Vous fixez vos propres tarifs et choisissez les missions que vous acceptez.","T.partAsk":"Nous recherchons une expérience des groupes en organisation, une inscription professionnelle pertinente (par exemple NIP ou BIG) et des ateliers en néerlandais ou en anglais.","T.partCta":"Devenir partenaire","T.partSubj":"Demande de partenariat – Bilan bien-être","T.rvTabs":"Vues du rapport","T.whatL":"Ce que vous voyez","T.howL":"Comment le lire","T.keyL":"Point clé","T.srcL":"Source","T.rv.sum.0":"Synthèse","T.rv.sum.1":"Les principaux résultats en langage simple.","T.rv.sum.2":"Les scores vont de 0 à 100 : 0 est la réponse la plus basse possible à chaque question, 100 la plus haute. Moins de 37,5 = à surveiller, 37,5–62,5 = moyen, plus de 62,5 = solide.","T.rv.heat.0":"Par niveau de fonction","T.rv.heat.1":"Le score moyen de chaque niveau de fonction pour chaque dimension.","T.rv.heat.2":"Lisez une ligne pour comparer les niveaux ; lisez une colonne pour voir le profil d’un niveau. Les couleurs chaudes demandent de l’attention, le vert indique un résultat solide. Les groupes de moins de 5 personnes sont masqués.","T.rv.gap.0":"Écarts entre les niveaux","T.rv.gap.1":"Pour chaque dimension : la position de chaque niveau de fonction, du plus bas au plus haut.","T.rv.gap.2":"Une longue ligne signifie que les niveaux vivent cela très différemment. Cela renvoie souvent au travail ou au rôle, pas aux individus.","T.rv.dist.0":"Répartition","T.rv.dist.1":"Combien de personnes se situent dans chaque tranche de score, par dimension.","T.rv.dist.2":"Une moyenne peut cacher un groupe en difficulté. La partie rouge est la part des personnes dont le score est « à surveiller ».","T.rv.prof.0":"Profil d’un niveau","T.rv.prof.1":"Un niveau de fonction comparé à l’ensemble de l’organisation.","T.rv.prof.2":"La barre est le score du niveau, le trait fin la moyenne de l’organisation. Le nombre à droite est l’écart : positif signifie mieux que la moyenne.","T.rv.sub.0":"Aspects sous-jacents","T.rv.sub.1":"Les composantes de chaque dimension.","T.rv.sub.2":"Quand une dimension est basse, cette vue montre quelle composante la tire vers le bas, et donc quel type d’atelier aide le plus. Ici, plus haut est toujours mieux.","T.rv.time.0":"Évolution","T.rv.time.1":"La première mesure à côté de la nouvelle mesure.","T.rv.time.2":"Barre claire = première mesure, barre foncée = nouvelle mesure. Des écarts inférieurs à environ 3 points peuvent être dus au hasard.","T.rv.plan.0":"Plan d’action","T.rv.plan.1":"Sur quoi travailler d’abord, pour qui et avec quel atelier.","T.rv.plan.2":"Une dimension est prioritaire quand sa moyenne est inférieure à 55 ou que plus de 25 % des personnes ont un score « à surveiller ».","T.kpiSub.0":"personnes ont répondu","T.kpiSub.1":"niveaux de fonction comptant 5 personnes ou plus","T.kpiSub.2":"moyenne de toutes les dimensions (0–100)","T.kpiSub.3":"de tous les scores sont « à surveiller »","T.sumN":"Sur la base de {n} répondants répartis en {k} niveaux de fonction.","T.sumStrong":"Points forts : {a}.","T.sumWeak":"À surveiller en priorité : {d} ({m}) ; {p} des personnes sont dans la zone « à surveiller ».","T.sumGap":"Plus grand écart entre les niveaux : {d} ({hi} : {a} ; {lo} : {b}).","T.sumNext":"Première étape suggérée : l’atelier « {w} », en priorité pour les niveaux suivants : {who}.","T.and":"et","T.heatKey":"Score le plus bas : {lv} pour {d} ({v}). Le plus haut : {lv2} pour {d2} ({v2}).","T.gapKey":"Plus grand écart : {d} – {lo} {a} contre {hi} {b} ({x} points).","T.distKey":"{d} : {p} des personnes ont un score « à surveiller », alors que la moyenne est de {m}.","T.profSel":"Niveau de fonction","T.profUp":"{lv} : au-dessus de la moyenne de l’organisation pour {a}.","T.profDown":"{lv} : en dessous de la moyenne de l’organisation pour {b}.","T.profFlat":"{lv} : proche de la moyenne de l’organisation partout.","T.orgAvg":"moyenne de l’organisation","T.subKey":"Aspect le plus bas : {s} ({d}, {v}).","T.timeDemo":"Exemple simulé : nouvelle mesure quatre mois après des ateliers sur l’autocompassion et le flow.","T.timeKey":"Plus forte amélioration : {d} (+{x}). Plus faible changement : {d2} ({y}).","T.timeNone":"Cette vue sera disponible après la nouvelle mesure (3 à 6 mois après les ateliers).","T.t1":"Première mesure","T.t2":"Nouvelle mesure","T.rHow":"Chaque score va de 0 à 100. La couleur de fond indique la tranche : rouge à surveiller, jaune moyen, vert solide. C’est un instantané, pas un diagnostic.","T.ariaHome":"Accueil","T.ariaNav":"Rubriques","T.ariaLang":"Langue","T.tUnval":"Ces questions sont notre propre traduction française des questionnaires originaux et n’ont pas encore été validées séparément. Elles sont cotées de la même façon ; leur fiabilité est vérifiée pendant le pilote.","DIMS.compassion.n":"Autocompassion","DIMS.compassion.q":"Quand j’échoue ou que je traverse une difficulté, est-ce que je me traite avec bienveillance ou avec dureté ?","DIMS.compassion.what":"La façon dont on se traite face à l’échec et à la souffrance : avec bienveillance et équilibre, ou avec autocritique et débordement.","DIMS.compassion.not":"Ce n’est ni de la paresse, ni de l’égoïsme, ni une baisse d’exigence.","DIMS.compassion.b.0":"L’autocritique est forte. Les erreurs sont probablement accueillies par des reproches, l’isolement et la rumination.","DIMS.compassion.b.1":"Parfois bienveillant, parfois dur ; sous pression, cela bascule vers l’auto-accusation.","DIMS.compassion.b.2":"Bienveillant et équilibré envers soi dans les moments difficiles ; apprend de ses erreurs sans s’attaquer soi-même.","DIMS.compassion.tips.0":"Après une erreur, demandez-vous : « Que dirais-je à un ami dans cette situation ? » et dites-le-vous.","DIMS.compassion.tips.1":"Rappelez-vous que les erreurs font partie de l’expérience de tous ; nommez l’émotion sans vous y noyer.","DIMS.flex.n":"Flexibilité psychologique","DIMS.flex.q":"Les pensées et émotions difficiles m’empêchent-elles d’aller vers ce qui compte ?","DIMS.flex.what":"À quel point les pensées et émotions désagréables gênent le fait de vivre et de travailler selon ses valeurs.","DIMS.flex.not":"Un score bas n’est pas un diagnostic ; il traduit une difficulté à composer avec ses émotions.","DIMS.flex.b.0":"Les pensées et émotions douloureuses prennent beaucoup de place et bloquent probablement des actions importantes.","DIMS.flex.b.1":"La lutte avec les émotions gêne parfois, mais le travail avance la plupart du temps.","DIMS.flex.b.2":"Parvient à aller vers ce qui compte même quand les émotions sont difficiles.","DIMS.flex.tips.0":"Au lieu de combattre une pensée, dites « J’ai la pensée que… » et faites le petit pas suivant.","DIMS.flex.tips.1":"Chaque jour, faites une petite action fidèle à vos valeurs, même si vous ne vous sentez pas tout à fait prêt.","DIMS.optim.n":"Optimisme","DIMS.optim.q":"Est-ce que je m’attends en général à ce que les choses tournent bien ?","DIMS.optim.what":"L’attente générale d’une personne vis-à-vis de l’avenir : de bonnes ou de mauvaises choses.","DIMS.optim.not":"Ne concerne ni l’avenir de l’organisation ni la satisfaction au travail ; un trait personnel plutôt stable.","DIMS.optim.b.0":"L’attente de mauvais résultats domine ; l’énergie pour continuer d’essayer peut être plus faible.","DIMS.optim.b.1":"Une vision équilibrée, ni très confiante ni pessimiste.","DIMS.optim.b.2":"S’attend en général à de bons résultats ; souvent associé à la persévérance et à une meilleure santé.","DIMS.optim.tips.0":"Écrivez quelques minutes sur votre « meilleur moi possible » dans un an ; cet exercice a augmenté l’optimisme dans des études.","DIMS.optim.tips.1":"À côté de chaque inquiétude, écrivez un plan « si cela arrive, je… ».","DIMS.hope.n":"Espoir","DIMS.hope.q":"Ai-je des objectifs, des moyens de les atteindre et l’énergie pour y aller ?","DIMS.hope.what":"L’espoir au sens scientifique : avoir des objectifs, trouver des moyens d’y arriver (chemins) et l’énergie et la conviction de les poursuivre (motivation).","DIMS.hope.not":"Ce n’est pas la même chose que l’optimisme ; l’espoir porte sur sa propre capacité à y arriver.","DIMS.hope.b.0":"Peu de chemins ou d’énergie pour atteindre ses objectifs ; plus de risques de se sentir bloqué.","DIMS.hope.b.1":"Les objectifs et les chemins existent, mais l’énergie baisse face aux obstacles.","DIMS.hope.b.2":"Objectifs clairs, plusieurs chemins et assez d’énergie ; prédit de meilleures performances.","DIMS.hope.tips.0":"Pour un objectif important, écrivez au moins trois chemins différents.","DIMS.hope.tips.1":"Utilisez WOOP : souhait (Wish), résultat (Outcome), obstacle intérieur (Obstacle) et un plan « si… alors… » (Plan).","DIMS.belong.n":"Appartenance","DIMS.belong.q":"Est-ce que je me sens accepté et membre à part entière du groupe ?","DIMS.belong.what":"Un sentiment général d’appartenance et d’acceptation dans les relations, dans la vie et parmi les autres.","DIMS.belong.not":"Ne concerne pas seulement le travail ; mesure l’appartenance dans l’ensemble de la vie.","DIMS.belong.b.0":"Le sentiment d’être à l’écart ou rejeté est fort ; un facteur important d’épuisement et de départs.","DIMS.belong.b.1":"Appartenance partielle ; inclus dans certains groupes mais pas dans d’autres.","DIMS.belong.b.2":"Se sent accepté et relié aux autres ; un pilier important de la santé mentale.","DIMS.belong.tips.0":"Cette semaine, ayez une courte conversation avec un collègue qui ne porte pas sur le travail.","DIMS.belong.tips.1":"Demandez à quelqu’un de vous associer à une tâche ou un projet ; demander de l’aide crée aussi du lien.","DIMS.flow.n":"Flow au travail","DIMS.flow.q":"Mon travail m’absorbe-t-il, me plaît-il, et est-ce que je le fais pour lui-même ?","DIMS.flow.what":"Le flow au travail au cours des deux dernières semaines : absorption, plaisir et motivation intrinsèque.","DIMS.flow.not":"Ne mesure ni l’effort ni les heures, mais la qualité de l’expérience de travail.","DIMS.flow.b.0":"Le travail absorbe ou plaît moins ; les interruptions ou le manque de sens sont peut-être élevés.","DIMS.flow.b.1":"Le flow et le plaisir sont présents par moments, mais pas de façon constante.","DIMS.flow.b.2":"Absorbé par son travail, y prend plaisir et est motivé de l’intérieur ; associé à de meilleures performances et à du sens.","DIMS.flow.tips.0":"Bloquez chaque jour un créneau de 60 à 90 minutes de travail concentré, sans messages ni réunions.","DIMS.flow.tips.1":"Remodelez une partie de votre poste pour qu’elle corresponde mieux à vos forces et intérêts (job crafting).","DIMS.ei.n":"Intelligence émotionnelle","DIMS.ei.q":"Est-ce que je comprends et gère mes émotions et celles des autres ?","DIMS.ei.what":"La façon dont les personnes évaluent leurs compétences pour comprendre et gérer les émotions, chez elles et chez les autres.","DIMS.ei.not":"Une auto-évaluation, pas un test d’aptitude ; peut différer de la compétence réelle.","DIMS.ei.b.0":"Se perçoit comme moins habile pour reconnaître ou gérer les émotions.","DIMS.ei.b.1":"Fort dans certaines compétences émotionnelles et plus faible dans d’autres.","DIMS.ei.b.2":"Se perçoit comme capable de comprendre et de gérer les émotions, chez soi et chez les autres.","DIMS.ei.tips.0":"Trois fois par jour, donnez un nom précis à votre émotion (« agacé » plutôt que « mal »).","DIMS.ei.tips.1":"Quand un collègue est contrarié, reformulez d’abord (« tu as l’air fatigué »), puis proposez des solutions.","DIMS.selfctrl.n":"Maîtrise de soi","DIMS.selfctrl.q":"Est-ce que je résiste aux tentations et reste fidèle à mes objectifs à long terme ?","DIMS.selfctrl.what":"La capacité à contrôler ses impulsions, résister aux tentations et rester sur ses objectifs à long terme.","DIMS.selfctrl.not":"Un score bas ne signifie pas une volonté faible ; l’environnement et les habitudes jouent un grand rôle.","DIMS.selfctrl.b.0":"Les tentations et distractions l’emportent souvent ; l’environnement contient probablement des signaux défavorables.","DIMS.selfctrl.b.1":"Engagé dans certains domaines, procrastinateur dans d’autres.","DIMS.selfctrl.b.2":"Tient généralement ses objectifs à long terme, surtout grâce à de bonnes habitudes plutôt qu’à la volonté.","DIMS.selfctrl.tips.0":"Aménagez votre environnement : mettez votre téléphone dans une autre pièce pendant le travail concentré.","DIMS.selfctrl.tips.1":"Associez une tâche difficile à un petit plaisir (par ex. votre podcast préféré uniquement en marchant).","WS.w-comp.t":"L’autocompassion et le critique intérieur","WS.w-comp.who":"Tous niveaux ; version managers : leadership bienveillant","WS.w-comp.goals.0":"Reconnaître le critique intérieur et ce qu’il coûte","WS.w-comp.goals.1":"Pratiquer les trois composantes de l’autocompassion : bienveillance envers soi, humanité partagée, pleine conscience","WS.w-comp.goals.2":"Gérer les erreurs en équipe sans humilier","WS.w-comp.ev":"Une méta-analyse de 27 essais randomisés a montré des effets modérés de l’entraînement à l’autocompassion sur le stress et l’autocritique.","WSLEN.w-comp":"2 × 3 heures","WS.w-flex.t":"Flexibilité psychologique et régulation émotionnelle","WS.w-flex.who":"Tous niveaux, en particulier les postes à forte pression","WS.w-flex.goals.0":"Prendre du recul par rapport à ses pensées sans les combattre","WS.w-flex.goals.1":"Clarifier ses valeurs au travail","WS.w-flex.goals.2":"Le modèle processuel de la régulation émotionnelle et quatre stratégies proactives","WS.w-flex.ev":"Une méta-analyse des formations d’acceptation et d’engagement (ACT) en milieu de travail a montré des baisses faibles à modérées du stress et de la détresse, plus marquées chez les employés de bureau.","WSLEN.w-flex":"2 × 3 heures","WS.w-hope.t":"Espoir et optimisme réaliste","WS.w-hope.who":"Tous niveaux ; adapté aux périodes de changement organisationnel","WS.w-hope.goals.0":"L’exercice du « meilleur moi possible »","WS.w-hope.goals.1":"WOOP et les plans « si… alors… »","WS.w-hope.goals.2":"Le principe du progrès : remarquer les petites victoires","WS.w-hope.ev":"WOOP (contraste mental avec plans « si… alors… ») a un effet faible à moyen sur l’atteinte des objectifs ; l’exercice du meilleur moi possible augmente modestement l’optimisme.","WSLEN.w-hope":"1 × 4 heures","WS.w-belong.t":"Appartenance et lien au travail","WS.w-belong.who":"Les équipes avec leurs responsables","WS.w-belong.goals.0":"Parler à des inconnus et faire des compliments sincères","WS.w-belong.goals.1":"Programmes d’intégration et de parrainage pour les nouveaux","WS.w-belong.goals.2":"Compter pour les autres : être vu et apporter de la valeur","WS.w-belong.ev":"Une courte intervention sur l’appartenance a eu des effets durables dans une étude connue ; une vaste étude de suivi en 2023 a montré que l’effet dépend du contexte.","WSLEN.w-belong":"1 × 3 heures + programme d’équipe","WS.w-flow.t":"Travail concentré, flow et déconnexion","WS.w-flow.who":"Tous niveaux ; version managers : protéger le temps de concentration des équipes","WS.w-flow.goals.0":"Job crafting : remodeler son poste par soi-même","WS.w-flow.goals.1":"Plages de concentration sans interruption","WS.w-flow.goals.2":"Déconnexion psychologique après les heures de travail","WS.w-flow.ev":"Des méta-analyses associent le job crafting à un engagement plus élevé et la déconnexion après le travail à moins d’épuisement ; ces données sont surtout corrélationnelles.","WSLEN.w-flow":"1 × 4 heures","WS.w-ei.t":"L’intelligence émotionnelle en pratique","WS.w-ei.who":"Postes en contact avec les clients, managers et encadrants","WS.w-ei.goals.0":"Nommer précisément les émotions","WS.w-ei.goals.1":"Répondre aux émotions des collègues et des clients","WS.w-ei.goals.2":"Travail émotionnel et prévention de l’épuisement","WS.w-ei.ev":"En moyenne, la formation à l’IE augmente modérément les scores d’IE ; l’IE auto-évaluée recoupe la personnalité, il faut donc lire les scores avec prudence.","WSLEN.w-ei":"2 × 3 heures","WS.w-self.t":"La maîtrise de soi par l’aménagement : environnement, habitudes et association de tentations","WS.w-self.who":"Tous niveaux ; version managers : nudges et choix par défaut sains","WS.w-self.goals.0":"Choisir et modifier les situations plutôt que forcer la volonté","WS.w-self.goals.1":"Construire des habitudes et des rappels","WS.w-self.goals.2":"Association de tentations (lier un petit plaisir à une corvée) et réserves d’urgence (jours d’exception prévus)","WS.w-self.ev":"Agir sur la situation fonctionne mieux que compter sur la volonté sur le moment ; l’association de tentations a aidé dans une expérience de terrain, mais l’effet s’est estompé avec le temps.","WSLEN.w-self":"1 × 4 heures","LEVELS.staff":"Collaborateurs","LEVELS.lead":"Chefs d’équipe","LEVELS.mid":"Cadres intermédiaires","LEVELS.senior":"Cadres dirigeants","LEVELS.student":"Étudiants","SUBN.scs.sk":"Bienveillance envers soi","SUBN.scs.sj":"Moins de jugement de soi","SUBN.scs.ch":"Humanité partagée","SUBN.scs.is":"Moins d’isolement","SUBN.scs.mi":"Pleine conscience","SUBN.scs.oi":"Moins de sur-identification (ne pas être emporté par ses émotions)","SUBN.ahs.path":"Chemins (moyens d’atteindre ses objectifs)","SUBN.ahs.agency":"Motivation (énergie tournée vers les objectifs)","SUBN.gbs.acc":"Acceptation / inclusion","SUBN.gbs.rej":"Moins de rejet","SUBN.wolf.abs":"Absorption","SUBN.wolf.enj":"Plaisir au travail","SUBN.wolf.int":"Motivation intrinsèque","SUBN.sreis.p":"Percevoir les émotions","SUBN.sreis.u":"Utiliser les émotions","SUBN.sreis.r":"Comprendre les émotions","SUBN.sreis.m1":"Gérer ses propres émotions","SUBN.sreis.m2":"Gérer les émotions des autres","PACKS.quick":"Courte","PACKS.standard":"Complète","INST.scs.name":"Échelle d’autocompassion – forme courte","INST.scs.intro":"Comment vous comportez-vous habituellement envers vous-même dans les moments difficiles ?","INST.scs.anchors.0":"Presque jamais","INST.scs.anchors.4":"Presque toujours","INST.scs.items.0":"Quand j’échoue dans quelque chose d’important pour moi, je suis envahi par le sentiment de ne pas être à la hauteur.","INST.scs.items.1":"J’essaie d’être compréhensif et patient envers les aspects de ma personnalité que je n’aime pas.","INST.scs.items.2":"Quand quelque chose de douloureux arrive, j’essaie d’avoir une vision équilibrée de la situation.","INST.scs.items.3":"Quand je n’ai pas le moral, j’ai tendance à penser que la plupart des autres sont probablement plus heureux que moi.","INST.scs.items.4":"J’essaie de voir mes faiblesses comme faisant partie de la condition humaine.","INST.scs.items.5":"Quand je traverse une période très difficile, je m’accorde la bienveillance et la tendresse dont j’ai besoin.","INST.scs.items.6":"Quand quelque chose me contrarie, j’essaie de garder mes émotions en équilibre.","INST.scs.items.7":"Quand j’échoue dans quelque chose d’important pour moi, j’ai tendance à me sentir seul dans mon échec.","INST.scs.items.8":"Quand je n’ai pas le moral, j’ai tendance à ressasser et à me focaliser sur tout ce qui ne va pas.","INST.scs.items.9":"Quand je ne me sens pas à la hauteur d’une manière ou d’une autre, j’essaie de me rappeler que la plupart des gens éprouvent ce sentiment.","INST.scs.items.10":"Je désapprouve et je juge sévèrement mes propres défauts et lacunes.","INST.scs.items.11":"Je suis intolérant et impatient envers les aspects de ma personnalité que je n’aime pas.","INST.aaq.name":"Questionnaire d’acceptation et d’action II (AAQ-II)","INST.aaq.intro":"Dans quelle mesure chaque affirmation est-elle vraie pour vous ?","INST.aaq.anchors.0":"Jamais vrai","INST.aaq.anchors.6":"Toujours vrai","INST.aaq.items.0":"Mes expériences et souvenirs douloureux font qu’il m’est difficile de mener une vie qui ait de la valeur à mes yeux.","INST.aaq.items.1":"J’ai peur de mes émotions.","INST.aaq.items.2":"Je m’inquiète de ne pas pouvoir contrôler mes inquiétudes et mes émotions.","INST.aaq.items.3":"Mes souvenirs douloureux m’empêchent d’avoir une vie épanouie.","INST.aaq.items.4":"Les émotions me causent des problèmes dans ma vie.","INST.aaq.items.5":"J’ai l’impression que la plupart des gens gèrent leur vie mieux que moi.","INST.aaq.items.6":"Les inquiétudes font obstacle à ma réussite.","INST.lot.name":"Test d’orientation de vie – révisé (LOT-R)","INST.lot.intro":"Dans quelle mesure êtes-vous d’accord avec chaque affirmation ? Quatre affirmations servent uniquement de remplissage et ne sont pas comptées.","INST.lot.anchors.0":"Pas du tout d’accord","INST.lot.anchors.1":"Pas d’accord","INST.lot.anchors.2":"Ni d’accord ni pas d’accord","INST.lot.anchors.3":"D’accord","INST.lot.anchors.4":"Tout à fait d’accord","INST.lot.items.0":"Dans les périodes d’incertitude, je m’attends généralement au meilleur.","INST.lot.items.1":"Il m’est facile de me détendre.","INST.lot.items.2":"Si quelque chose peut mal tourner pour moi, cela arrivera.","INST.lot.items.3":"Je suis toujours optimiste quant à mon avenir.","INST.lot.items.4":"J’apprécie beaucoup mes amis.","INST.lot.items.5":"Il est important pour moi de rester occupé.","INST.lot.items.6":"Je ne m’attends presque jamais à ce que les choses se passent comme je le veux.","INST.lot.items.7":"Je ne m’énerve pas trop facilement.","INST.lot.items.8":"Je compte rarement sur le fait que de bonnes choses m’arrivent.","INST.lot.items.9":"Dans l’ensemble, je m’attends à ce qu’il m’arrive plus de bonnes choses que de mauvaises.","INST.ahs.name":"Échelle d’espoir pour adultes (AHS)","INST.ahs.intro":"Dans quelle mesure chaque affirmation est-elle vraie pour vous ? Quatre affirmations servent uniquement de remplissage.","INST.ahs.anchors.0":"Tout à fait faux","INST.ahs.anchors.7":"Tout à fait vrai","INST.ahs.items.0":"Je peux trouver de nombreux moyens de me sortir d’un mauvais pas.","INST.ahs.items.1":"Je poursuis mes objectifs avec énergie.","INST.ahs.items.2":"Je me sens fatigué la plupart du temps.","INST.ahs.items.3":"Il existe de nombreux moyens de venir à bout de n’importe quel problème.","INST.ahs.items.4":"Dans une discussion, on a facilement le dessus sur moi.","INST.ahs.items.5":"Je peux trouver de nombreux moyens d’obtenir ce qui est important pour moi dans la vie.","INST.ahs.items.6":"Je m’inquiète pour ma santé.","INST.ahs.items.7":"Même quand les autres se découragent, je sais que je peux trouver un moyen de résoudre le problème.","INST.ahs.items.8":"Mes expériences passées m’ont bien préparé à mon avenir.","INST.ahs.items.9":"J’ai plutôt bien réussi dans la vie.","INST.ahs.items.10":"Je me surprends généralement à m’inquiéter de quelque chose.","INST.ahs.items.11":"J’atteins les objectifs que je me fixe.","INST.gbs.name":"Échelle générale d’appartenance (GBS)","INST.gbs.intro":"Dans quelle mesure êtes-vous d’accord avec chaque affirmation ?","INST.gbs.anchors.0":"Pas du tout d’accord","INST.gbs.anchors.6":"Tout à fait d’accord","INST.gbs.items.0":"Quand je suis avec d’autres personnes, je me sens inclus.","INST.gbs.items.1":"J’ai des liens étroits avec ma famille et mes amis.","INST.gbs.items.2":"Je me sens à l’écart.","INST.gbs.items.3":"J’ai l’impression que les gens ne se soucient pas de moi.","INST.gbs.items.4":"Je me sens accepté par les autres.","INST.gbs.items.5":"Parce que je n’ai pas ma place, je me sens loin des autres pendant la période des fêtes.","INST.gbs.items.6":"Je me sens isolé du reste du monde.","INST.gbs.items.7":"J’ai un sentiment d’appartenance.","INST.gbs.items.8":"Quand je suis avec d’autres personnes, je me sens comme un étranger.","INST.gbs.items.9":"J’ai ma place parmi les autres.","INST.gbs.items.10":"Je me sens en lien avec les autres.","INST.gbs.items.11":"Mes amis et ma famille ne m’associent pas à leurs projets.","INST.wolf.name":"Inventaire du flow au travail (WOLF)","INST.wolf.intro":"Au cours des deux dernières semaines, à quelle fréquence avez-vous vécu chacune de ces situations ?","INST.wolf.anchors.0":"Jamais","INST.wolf.anchors.1":"Presque jamais","INST.wolf.anchors.2":"Parfois","INST.wolf.anchors.3":"Régulièrement","INST.wolf.anchors.4":"Souvent","INST.wolf.anchors.5":"Très souvent","INST.wolf.anchors.6":"Toujours","INST.wolf.items.0":"Quand je travaille, je ne pense à rien d’autre.","INST.wolf.items.1":"Je me laisse emporter par mon travail.","INST.wolf.items.2":"Quand je travaille, j’oublie tout ce qui m’entoure.","INST.wolf.items.3":"Je suis totalement plongé dans mon travail.","INST.wolf.items.4":"Mon travail me procure un sentiment agréable.","INST.wolf.items.5":"Je fais mon travail avec beaucoup de plaisir.","INST.wolf.items.6":"Je me sens heureux pendant mon travail.","INST.wolf.items.7":"Je me sens joyeux quand je travaille.","INST.wolf.items.8":"Je ferais ce travail même si j’étais moins payé.","INST.wolf.items.9":"Je constate que j’ai aussi envie de travailler pendant mon temps libre.","INST.wolf.items.10":"Je travaille parce que j’aime ça.","INST.wolf.items.11":"Quand je travaille sur quelque chose, je le fais pour moi-même.","INST.wolf.items.12":"Ma motivation vient du travail lui-même, et non de sa récompense.","INST.sreis.name":"Échelle d’intelligence émotionnelle auto-évaluée (SREIS)","INST.sreis.intro":"Dans quelle mesure chaque affirmation vous décrit-elle fidèlement ?","INST.sreis.anchors.0":"Très inexact","INST.sreis.anchors.1":"Plutôt inexact","INST.sreis.anchors.2":"Ni exact ni inexact","INST.sreis.anchors.3":"Plutôt exact","INST.sreis.anchors.4":"Très exact","INST.sreis.items.0":"En regardant l’expression du visage des gens, je reconnais les émotions qu’ils ressentent.","INST.sreis.items.1":"Je suis une personne rationnelle et je consulte rarement, voire jamais, mes émotions pour prendre une décision.","INST.sreis.items.2":"J’ai un vocabulaire riche pour décrire mes émotions.","INST.sreis.items.3":"J’ai du mal à gérer ma colère.","INST.sreis.items.4":"Quand une personne que je connais est de mauvaise humeur, je peux l’aider à se calmer et à se sentir mieux rapidement.","INST.sreis.items.5":"Je suis conscient des messages non verbaux qu’envoient les autres.","INST.sreis.items.6":"Quand je prends une décision, j’écoute mes émotions pour voir si la décision me semble juste.","INST.sreis.items.7":"Je trouve facilement de nombreux synonymes pour des mots d’émotion comme le bonheur et la tristesse.","INST.sreis.items.8":"Je peux faire face à des situations stressantes sans devenir trop nerveux.","INST.sreis.items.9":"Je connais des stratégies pour mettre les autres de bonne humeur ou améliorer leur humeur.","INST.sreis.items.10":"En regardant l’expression du visage des gens, je peux dire s’ils sont honnêtes avec moi.","INST.sreis.items.11":"Je suis une personne rationnelle et je n’aime pas m’appuyer sur mes émotions pour prendre des décisions.","INST.sreis.items.12":"J’ai les mots pour décrire comment les émotions vont du simple au complexe.","INST.sreis.items.13":"Je suis capable de faire face à la plupart des problèmes qui me bouleversent.","INST.sreis.items.14":"Je ne suis pas très doué pour aider les autres à se sentir mieux quand ils sont en colère ou tristes.","INST.sreis.items.15":"Mes premières impressions sur ce que ressentent les autres sont souvent fausses.","INST.sreis.items.16":"Par rapport à la plupart des gens, j’ai un vocabulaire plus riche pour décrire les sentiments.","INST.sreis.items.17":"Je sais rester calme dans des situations difficiles ou stressantes.","INST.sreis.items.18":"Je suis le genre de personne vers qui les autres se tournent quand ils ont besoin d’aide dans une situation difficile.","INST.bscs.name":"Échelle brève de maîtrise de soi (BSCS)","INST.bscs.intro":"Dans quelle mesure chaque affirmation reflète-t-elle votre façon d’être habituelle ?","INST.bscs.anchors.0":"Pas du tout","INST.bscs.anchors.4":"Tout à fait","INST.bscs.items.0":"Je sais bien résister aux tentations.","INST.bscs.items.1":"J’ai du mal à me défaire de mauvaises habitudes.","INST.bscs.items.2":"Je suis paresseux.","INST.bscs.items.3":"Je dis des choses inappropriées.","INST.bscs.items.4":"Je fais certaines choses qui sont mauvaises pour moi, si elles sont amusantes.","INST.bscs.items.5":"Je refuse les choses qui sont mauvaises pour moi.","INST.bscs.items.6":"J’aimerais avoir plus d’autodiscipline.","INST.bscs.items.7":"Les gens diraient que j’ai une autodiscipline de fer.","INST.bscs.items.8":"Le plaisir et l’amusement m’empêchent parfois de faire mon travail.","INST.bscs.items.9":"J’ai du mal à me concentrer.","INST.bscs.items.10":"Je suis capable de travailler efficacement à atteindre des objectifs à long terme.","INST.bscs.items.11":"Parfois, je ne peux pas m’empêcher de faire quelque chose, même si je sais que ce n’est pas bien.","INST.bscs.items.12":"J’agis souvent sans avoir réfléchi à toutes les possibilités.","LABELS.s2":"Autocompassion","LABELS.s3":"De l’autoreproche à l’autocompassion","LABELS.compassion":"Bibliothèque : compassion et autocritique","LABELS.s4":"L’énigme de la régulation émotionnelle","LABELS.s7":"Se changer soi-même plutôt que son environnement","LABELS.shelf13":"Bibliothèque : thérapie fondée sur les processus et agilité émotionnelle","LABELS.s9":"Optimisme et espoir en l’avenir","LABELS.riseabove":"Rise Above (Kaufman, 2024) : de la mentalité de victime à la croissance","LABELS.s10":"Sous-cultures organisationnelles et motivation","LABELS.s8":"Réévaluation, épuisement de l’ego et états d’esprit","LABELS.mattering":"Comment on en vient à compter pour les autres","LABELS.s11":"Vider son sac : quand est-ce que parler aide ?","LABELS.s13":"Motivation : externe, introjectée et intrinsèque","LABELS.s15":"Émotions positives, loisirs et partage des bonnes nouvelles","LABELS.s14":"Intelligence émotionnelle : aptitude, trait ou mélange ?","LABELS.s5":"Maîtrise de soi et choix des situations","LABELS.s6":"Choisir et modifier son environnement","LABELS.s12":"Perfectionnisme : excellent mais sous pression","REFS.nea25":"21 % des salariés déclarent des symptômes d’épuisement professionnel","REFS.who22":"12 milliards de journées de travail perdues chaque année à cause de la dépression et de l’anxiété","REFS.icd11":"l’épuisement professionnel classé comme phénomène lié au travail","REFS.cbs26":"taux d’absentéisme de 5,4 % en 2025 ; 9 % des salariés absents citent des troubles psychologiques ou un épuisement","REFS.tno24":"les absences pour troubles psychologiques durent en moyenne 63 jours ouvrés ; 75 % sont (en partie) liées au travail","REFS.arbo24":"8,3 Md€ pour l’absentéisme (en partie) lié au travail en 2023, dont 4,9 Md€ dus à la charge psychosociale","REFS.arbo18":"environ un quart des jours d’absence est lié à des troubles psychologiques, au surmenage ou à l’épuisement","REFS.mkb":"en moyenne 250 € à 400 € par jour d’absence","REFS.arbowet":"art. 3, al. 2 : politique de prévention ou de limitation de la charge psychosociale ; art. 5 : inventaire et évaluation des risques (RI&E) avec plan d’action","REFS.arbobes":"art. 2.15 : évaluer les risques liés à la charge psychosociale dans la RI&E et prévoir des mesures dans le plan d’action","REFS.arboportaal":"information officielle sur la charge psychosociale au travail","REFS.wor":"art. 27 : droit d’approbation du conseil d’entreprise, notamment pour les enquêtes auprès du personnel et la politique des conditions de travail","REFS.gdpr":"Règlement général sur la protection des données (RGPD)","T.rStrRel":"Vos points relativement les plus forts"},"es":{"T.proto":"Versión piloto: ya disponible para un primer piloto en su organización.","T.brand":"Chequeo de bienestar para organizaciones","T.brandShort":"Chequeo de bienestar","T.by":"Inspirado en el curso «Competencias personales y humanas en organizaciones y centros educativos» del Dr. Azarakhsh Mokri","T.nHome":"Resumen","T.nTake":"Responder el cuestionario","T.nReport":"Informe de la organización","T.nWs":"Talleres","T.nMethod":"Método","T.heroK":"Para organizaciones basadas en el conocimiento · pilotos a partir de 20 empleados","T.heroT":"Vea cómo está la salud psicológica de su organización y por dónde empezar.","T.heroP":"En unos 15 minutos, los empleados responden de forma anónima cuestionarios científicos validados. Cada persona ve al instante un resumen personal; la organización recibe un informe por nivel de puesto, con interpretación científica y un plan de talleres recomendados.","T.ctaTake":"Empezar el cuestionario","T.ctaDemo":"Ver un informe de ejemplo","T.f1":"8 dimensiones","T.f1s":"Medidas con 8 cuestionarios validados internacionalmente","T.f2":"Anónimo","T.f2s":"Sin nombres; los grupos de menos de 5 nunca se muestran","T.f3":"9 idiomas","T.f3s":"Español, inglés, neerlandés, alemán, francés, polaco, turco, árabe y persa","T.measT":"Qué medimos","T.measP":"Cada dimensión responde a una pregunta sencilla. Toque una tarjeta para ver qué mide y qué no.","T.whatIs":"Qué mide","T.whatNot":"Qué no mide","T.privT":"La privacidad, primero","T.priv.0":"No se piden nombres, correos electrónicos ni números de empleado.","T.priv.1":"Solo se registra el nivel de puesto (p. ej. personal sin mando o mando intermedio).","T.priv.2":"Los grupos de menos de 5 personas se ocultan en el informe de la organización.","T.priv.3":"Las respuestas se guardan sin ningún identificador y el informe solo muestra resultados de grupo; ningún responsable ve el resultado individual de nadie.","T.notT":"Lo que este chequeo no es","T.not":"No es un diagnóstico clínico y no sustituye el asesoramiento psicológico ni el tratamiento. Mide recursos psicológicos, como la autocompasión, la flexibilidad y la pertenencia, no el agotamiento laboral ni la carga de trabajo. Su objetivo es ver patrones de grupo y elegir el apoyo adecuado.","T.tT":"Responder el cuestionario","T.tRound":"Su cuestionario","T.tSelf":"Chequeo personal (los resultados se quedan en su dispositivo)","T.tJoin":"Ronda de cuestionario de la organización","T.tLevel":"¿Cuál es su nivel de puesto o su función?","T.tLevelHint":"Solo se usa para comparar grupos; no se pide ningún otro dato personal.","T.tPack":"¿Qué versión?","T.tMin":"min","T.tItems":"preguntas","T.tConsent":"Entiendo que la participación es voluntaria, que mis respuestas se guardan sin mi nombre y que esto no es un diagnóstico clínico.","T.tStart":"Empezar","T.tNext":"Siguiente parte","T.tPrev":"Parte anterior","T.tFinish":"Ver mis resultados","T.tPart":"Parte","T.tOf":"de","T.tMissing":"Todavía no ha respondido estas preguntas:","T.tSaved":"Las respuestas se guardan en este dispositivo; si cierra la página, puede continuar aquí.","T.tResume":"Continuar el cuestionario sin terminar","T.tRestart":"Empezar de nuevo","T.rT":"Sus resultados de un vistazo","T.rP":"Las puntuaciones van de 0 a 100 y siempre están orientadas para que más alto signifique mejor.","T.rStr":"Sus fortalezas","T.rGrow":"Margen de mejora","T.rTips":"Dos consejos breves","T.rDetail":"Detalles y subescalas","T.rSend":"Enviar de forma anónima a mi organización","T.rSent":"Sus respuestas se registraron de forma anónima. ¡Gracias!","T.rCode":"Código de respuesta","T.rCodeP":"Copie este código y envíelo por correo electrónico a SoloNovate, no a su responsable ni a Recursos Humanos. Solo contiene números de respuesta y su nivel de puesto, no su nombre. No vinculamos su dirección de correo con sus respuestas y borramos el correo después de importar el código.","T.rCopy":"Copiar código","T.rCopied":"Copiado","T.rCare":"Si lleva un tiempo con el ánimo bajo o siente que no puede con todo, hable con el médico de empresa, su médico de cabecera o un psicólogo. Pedir ayuda es una señal de fortaleza.","T.rNot":"Este resultado es una instantánea de sus respuestas de hoy, no una etiqueta ni un diagnóstico.","T.band.0":"Requiere atención","T.band.1":"Moderado","T.band.2":"Sólido","T.pT":"Informe de la organización","T.pP":"Un mapa de la salud psicológica de su organización por nivel, con prioridades y talleres recomendados.","T.pSrc":"Datos del informe","T.pDemo":"Datos de ejemplo (demostración)","T.pLive":"Respuestas reales de esta ronda","T.pImport":"Importar códigos de respuesta","T.pImportP":"Pegue aquí los códigos de respuesta (uno por línea).","T.pImportGo":"Añadir","T.pAdded":"respuestas añadidas","T.pN":"Participantes","T.pLevels":"Niveles","T.pAvg":"Media general","T.pLowShare":"Porcentaje en «requiere atención»","T.pNoPri":"Ninguna dimensión alcanza el umbral de prioridad. Sugerencia: talleres de refuerzo para mantener las fortalezas.","T.pWhy":"Por qué","T.pFor":"Sobre todo para","T.pStrengths":"Fortalezas de la organización","T.pGap":"Mayor diferencia entre niveles","T.pHidden":"menos de 5","T.pNone":"Todavía no hay respuestas.","T.pExport":"Copiar datos resumidos (CSV)","T.pAdmin":"Gestionar rondas","T.pAdminP":"Para la persona que coordina el cuestionario en la organización. Cree una ronda y envíe el enlace a los empleados.","T.pOrg":"Nombre de la organización","T.pRoundName":"Título de la ronda","T.pCreate":"Crear ronda","T.pRounds":"Rondas","T.pChoose":"Elegir ronda","T.pNoAdmin":"Solo quienes coordinan el cuestionario (editores de esta página) pueden crear rondas y ver respuestas reales. Los demás pueden ver el informe de ejemplo o importar códigos de respuesta.","T.pDemoNote":"Este informe usa datos simulados de 180 personas para que vea cómo es un informe real.","T.wT":"Talleres","T.wP":"Cada taller se centra en una o dos dimensiones y se basa en el material del curso del Dr. Mokri. Los enlaces de lectura abren las páginas del wiki del curso; los títulos están traducidos aquí, pero las páginas están en persa.","T.wGoals":"Objetivos","T.wWho":"Público","T.wLen":"Duración","T.wEv":"Evidencia","T.wRead":"Lectura de fondo en el wiki del curso (páginas en persa)","T.mT":"Método","T.mP":"Transparencia sobre qué medimos, cómo puntuamos y dónde están los límites.","T.mInst":"Cuestionarios","T.mScore":"Puntuación","T.mScoreP":"La media de cada subescala se convierte a un rango de 0 a 100: (media − mínimo) ÷ (máximo − mínimo) × 100. Los ítems invertidos se recodifican primero. Cuando una puntuación alta en el cuestionario original significa más dificultad (p. ej. AAQ-II), se invierte para que en todas partes «más alto = mejor».","T.mBands":"Franjas de puntuación","T.mBandsP":"Menos de 37,5: requiere atención · de 37,5 a 62,5: moderado · más de 62,5: sólido. Estos umbrales son convenciones basadas en el rango de la escala, no normas poblacionales ni puntos de corte clínicos.","T.mLim":"Limitaciones","T.mLimL.0":"Todos los cuestionarios son de autoinforme y pueden verse afectados por el estado de ánimo del día o por el deseo de dar buena imagen.","T.mLimL.1":"Las franjas no se basan en normas poblacionales; las comparaciones dentro de la organización y a lo largo del tiempo son más válidas que la comparación con una «media nacional».","T.mLimL.2":"Los cuestionarios están validados en su idioma original y los ítems en inglés siguen la redacción original. Las versiones en otros idiomas usadas aquí, incluida esta en español, no se han validado por separado en esta forma; su fiabilidad se comprueba en el piloto. Para investigación, utilice las versiones validadas oficialmente (véase Fuentes).","T.mLimL.3":"Esta herramienta no está diseñada para tomar decisiones sobre personas (contratación, evaluación del desempeño) y no debe usarse con ese fin.","T.mEth":"Ética y privacidad","T.mEthL.0":"La participación es voluntaria y puede interrumpirse en cualquier momento.","T.mEthL.1":"Solo se registran el mes y el año, no la fecha ni la hora exactas.","T.mEthL.2":"Los informes son solo grupales, con un tamaño mínimo de grupo de 5.","T.mEthL.3":"Los resultados personales solo se muestran en el dispositivo de quien responde.","T.mCourse":"Este servicio nació del curso «Competencias personales y humanas en organizaciones y centros educativos» del Dr. Azarakhsh Mokri. Los cuestionarios son los presentados en las diapositivas del curso.","T.mWiki":"Wiki completo del curso (persa)","T.mOrgPsy":"Psicología del trabajo y de las organizaciones","T.items":"ítems","T.scale":"Escala","T.ref":"Referencia","T.session":"Material del curso","T.footer":"Chequeo de bienestar para organizaciones de SoloNovate · versión piloto · sin fines diagnósticos","T.dims":"dimensiones","T.whyT":"Por qué importa","T.whyP":"La salud psicológica no es un tema menor; se nota en el absentismo, la rotación y la calidad del trabajo.","T.why.0.0":"1 de cada 5","T.why.0.1":"trabajadores en los Países Bajos declara síntomas de agotamiento laboral (21 % en 2025).","T.why.1.0":"12 000 millones","T.why.1.1":"de días laborables se pierden cada año en el mundo por depresión y ansiedad, con un coste de alrededor de un billón de dólares en productividad.","T.why.2.0":"Laboral","T.why.2.1":"La OMS clasifica el agotamiento laboral (CIE-11) como un fenómeno ocupacional: un problema del trabajo, no solo personal.","T.getT":"Qué recibe su organización","T.get.0.0":"Un informe por nivel de puesto","T.get.0.1":"Ocho dimensiones por nivel, con fortalezas, prioridades y diferencias entre niveles.","T.get.1.0":"Una interpretación científica","T.get.1.1":"Una explicación clara de lo que significa y no significa cada puntuación.","T.get.2.0":"Un plan de talleres","T.get.2.1":"Dos o tres talleres adaptados a sus prioridades, con formato y duración.","T.get.3.0":"Una instantánea personal para cada participante","T.get.3.1":"Cada empleado ve sus propios resultados y dos consejos prácticos; nada se comparte con la dirección.","T.get.4.0":"Una reunión de resultados de 45 minutos","T.get.4.1":"Se comentan los resultados con la dirección y Recursos Humanos, con próximos pasos concretos.","T.pilot.0.0":"Semana 0","T.pilot.0.1":"Arranque","T.pilot.0.2":"Reunión de 30 minutos: objetivos, niveles, calendario y cómo se informa a los empleados.","T.pilot.1.0":"Semanas 1–2","T.pilot.1.1":"Cuestionario abierto","T.pilot.1.2":"Los empleados completan el chequeo anónimo en el móvil o el ordenador, en uno de nueve idiomas; lleva de 8 a 18 minutos.","T.pilot.2.0":"Semana 3","T.pilot.2.1":"Informe","T.pilot.2.2":"El informe de grupo anónimo por nivel y el plan de talleres recomendado.","T.pilot.3.0":"Semana 4","T.pilot.3.1":"Reunión de resultados y elección","T.pilot.3.2":"Conversación con la dirección; elección de los primeros talleres y de cuándo volver a medir.","T.needT":"Qué necesitamos de usted","T.need.0":"Una persona de contacto (p. ej. Recursos Humanos)","T.need.1":"Al menos 20 participantes y al menos 5 por nivel de puesto","T.need.2":"Un breve mensaje a la plantilla (le facilitamos un modelo)","T.need.3":"Cuando proceda, informar al comité de empresa (OR)","T.need.4":"Unas 3 horas de dedicación de Recursos Humanos en total, repartidas en cuatro semanas","T.lawT":"Conforme a las normas neerlandesas y europeas","T.law.0.0":"RGPD","T.law.0.1":"No se recogen nombres ni identificadores; los resultados solo se presentan para grupos de 5 o más personas.","T.law.1.0":"Arbowet","T.law.1.1":"Respalda la política PSA del empleador (art. 3, apdo. 2) como fuente complementaria a la parte de condiciones de trabajo de la RI&E (Arbobesluit art. 2.15).","T.law.2.0":"Comité de empresa","T.law.2.1":"Una encuesta a la plantilla como esta suele tratarse con el comité de empresa (WOR art. 27); le ayudamos a prepararla.","T.faqT":"Preguntas frecuentes","T.faq.0.0":"¿Cuánto tiempo les lleva a los empleados?","T.faq.0.1":"La versión corta lleva unos 8 minutos; la completa, unos 18. Funciona en cualquier móvil u ordenador.","T.faq.1.0":"¿Pueden los responsables ver respuestas individuales?","T.faq.1.1":"No. No hay nombres, y el informe de la organización solo muestra grupos de cinco o más personas.","T.faq.2.0":"¿Es un diagnóstico?","T.faq.2.1":"No. Es un chequeo no clínico basado en cuestionarios validados, para ver patrones de grupo y elegir el apoyo adecuado. A quien lo esté pasando mal se le orienta hacia el médico de empresa, su médico de cabecera o un psicólogo.","T.faq.3.0":"¿Están validados los cuestionarios?","T.faq.3.1":"Los ocho están publicados internacionalmente y validados en su idioma original, y usamos sus claves de puntuación originales (véase Método y Fuentes). Los ítems en inglés siguen la redacción original; las versiones en otros idiomas usadas aquí, incluida la española, aún no se han validado por separado en esta forma, por eso usamos los datos del piloto para comprobar la fiabilidad de cada escala. Las licencias de uso comercial se están acordando con los autores.","T.faq.4.0":"¿Mide el estrés laboral o el agotamiento?","T.faq.4.1":"No directamente. Mide recursos psicológicos que ayudan a afrontar la presión. Los riesgos laborales, como la carga de trabajo y la autonomía, se miden con una encuesta de condiciones de trabajo. Ambas se complementan, y con gusto le ayudamos a combinarlas.","T.faq.5.0":"¿Sirve para organizaciones grandes?","T.faq.5.1":"Sí. Un piloto puede empezar en un departamento o una sede y ampliarse después. Las reglas de anonimato son las mismas a cualquier escala: resultados solo para grupos de al menos 5 personas.","T.faq.6.0":"¿Cómo se recogen las respuestas en el piloto?","T.faq.6.1":"Cada participante envía por correo un código de respuesta anónimo (solo números de respuesta y nivel de puesto) directamente a SoloNovate, nunca al empleador. SoloNovate borra esos correos después de importarlos. Para una implantación completa se puede configurar una recogida en línea segura.","T.faq.7.0":"¿Qué pasa después del informe?","T.faq.7.1":"Una reunión de resultados, dos o tres talleres impartidos por un socio cualificado en los Países Bajos y una nueva medición a los 3–6 meses para ver qué ha cambiado.","T.ctaT":"¿Le interesa un piloto?","T.ctaP":"Pruebe el chequeo usted mismo, vea el informe de ejemplo y envíe una breve solicitud.","T.calcT":"¿Cuánto le cuesta el absentismo por estrés?","T.calcP":"Una estimación rápida para su organización. Cambie las cifras según su situación.","T.cEmp":"Número de empleados","T.cAbs":"Tasa de absentismo (%)","T.cAbsH":"Media neerlandesa en 2025: 5,4 %","T.cSal":"Salario bruto anual medio (€)","T.cShare":"Porcentaje de días de ausencia por estrés o problemas psicológicos (%)","T.cShareH":"Estimación nacional: alrededor de una cuarta parte","T.cRed":"Escenario: el absentismo por estrés baja un","T.cDays":"días de ausencia al año","T.cStress":"de ellos, por estrés","T.cCost":"coste anual del absentismo por estrés","T.cSave":"ahorro anual en este escenario","T.cPerDay":"Coste por día de ausencia usado aquí: {x} (salario × 1,3 por costes del empleador ÷ 220 días laborables). Las estimaciones neerlandesas van de 250 € a 400 € al día.","T.cNote":"Esto es un escenario, no una predicción. Una puntuación de cuestionario no se traduce directamente en menos días de ausencia. Use la estimación para juzgar si merece la pena invertir en prevención, y la nueva medición para ver qué ha cambiado realmente.","T.wsPartner":"Quién lo imparte: cada taller está a cargo de un psicólogo o formador con experiencia de nuestra red de socios en los Países Bajos; nosotros lo organizamos y coordinamos.","T.pilotNoteT":"Sobre esta versión piloto","T.pilotNote":"En el piloto, las respuestas solo se usan para elaborar el informe de su organización y validar el servicio, nada más. Las licencias de uso comercial de los cuestionarios se están acordando en paralelo con sus autores. Lo decimos desde el principio para que no haya sorpresas.","T.arboT":"Le ayuda a cumplir sus obligaciones derivadas de la Arbowet","T.arboP":"En los Países Bajos, los empleadores deben tener una política para prevenir, o al menos limitar, la carga psicosocial (PSA), como el estrés laboral, y evaluar los riesgos PSA en su evaluación de riesgos (RI&E) con un plan de acción.","T.arbo.0.0":"Una pieza para la parte PSA de su RI&E","T.arbo.0.1":"Los riesgos PSA tienen que ver sobre todo con el propio trabajo: carga, autonomía, apoyo y conductas indeseadas. Este chequeo añade la otra cara: qué recursos psicológicos tienen sus equipos, por nivel de puesto. Úselo junto a una encuesta de condiciones de trabajo, no en su lugar.","T.arbo.1.0":"Material para su plan de acción","T.arbo.1.1":"El plan de talleres y la nueva medición aportan medidas concretas y fechadas que puede registrar.","T.arbo.2.0":"Seguimiento visible","T.arbo.2.1":"Los resultados de antes y después ayudan a mostrar al comité de empresa que su organización toma medidas frente a los riesgos.","T.arboNote":"El chequeo no sustituye su RI&E, una encuesta de condiciones de trabajo ni la revisión de un experto certificado; las complementa.","T.fName":"Su nombre","T.fOrg":"Organización","T.fMail":"Correo electrónico","T.fSize":"Número de empleados","T.fMsg":"Mensaje (opcional)","T.fSend":"Solicitar un piloto","T.fSent":"Su programa de correo se abre con la solicitud rellenada; solo tiene que pulsar Enviar.","T.sizes.0":"20–50","T.sizes.1":"50–250","T.sizes.2":"250–1000","T.sizes.3":"1000+","T.sizes.4":"Otro","T.ctaAbout":"Sobre Maryam Jaberi","T.pPlan":"Planificar este taller","T.nSrc":"Fuentes","T.sT":"Fuentes","T.sP":"Todas las cifras, referencias legales y afirmaciones científicas de este sitio, con un enlace al original
