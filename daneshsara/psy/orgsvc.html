0 kişilik simüle edilmiş veri kullanır.","T.wT":"Atölyeler","T.wP":"Her atölye bir veya iki boyuta odaklanır ve Dr. Mokri'nin ders materyallerine dayanır. Okuma bağlantıları dersin wiki sayfalarını açar; başlıklar burada çevrilmiştir ancak sayfaların kendisi Farsçadır.","T.wGoals":"Hedefler","T.wWho":"Kimin için","T.wLen":"Süre","T.wEv":"Bilimsel kanıt","T.wRead":"Ders wiki'sinde ek okuma (Farsça sayfalar)","T.mT":"Yöntem","T.mP":"Neyi ölçtüğümüz, puanları nasıl hesapladığımız ve sınırlılıkların nerede olduğu konusunda şeffafız.","T.mInst":"Ölçekler","T.mScore":"Puanlama","T.mScoreP":"Her alt ölçeğin ortalaması 0–100 aralığına dönüştürülür: (ortalama − en düşük) ÷ (en yüksek − en düşük) × 100. Ters puanlanan maddeler önce ters çevrilir. Orijinal ölçekte yüksek puan daha fazla güçlük anlamına geliyorsa (ör. AAQ-II), puan ters çevrilir; böylece her yerde “yüksek = daha iyi” olur.","T.mBands":"Puan aralıkları","T.mBandsP":"37,5'in altı: dikkat gerektiriyor · 37,5 ile 62,5 arası: orta · 62,5'in üstü: güçlü. Bu eşikler Öz Şefkat Ölçeği için kullanılan uzlaşıma dayanır (1–5 ölçeğinde ortalama yanıtın 2,5'in altında veya 3,5'in üstünde olması) ve kolaylık olsun diye tüm ölçeklere uygulanır. Norm değerleri ya da klinik kesme puanları değildir ve tipik puanlar ölçekten ölçeğe farklılık gösterir.","T.mLim":"Sınırlılıklar","T.mLimL.0":"Tüm ölçekler öz bildirime dayanır ve o günkü ruh halinden veya iyi görünme isteğinden etkilenebilir.","T.mLimL.1":"Puan aralıkları norm değerlerine dayanmaz; kuruluş içindeki ve zaman içindeki karşılaştırmalar, “ulusal ortalamayla” yapılan karşılaştırmalardan daha geçerlidir.","T.mLimL.2":"Ölçeklerin geçerliği orijinal dillerinde kanıtlanmıştır ve İngilizce maddeler orijinal ifadeleri korur. Burada kullanılan diğer dillerdeki sürümler için, bu Türkçe sürüm dahil, bu biçimiyle ayrıca geçerlik çalışması yapılmamıştır; güvenirliklerini pilotta kontrol ediyoruz. Bilimsel araştırma için resmî olarak geçerliği kanıtlanmış sürümleri kullanın (bkz. Kaynaklar).","T.mLimL.3":"Bu araç bireyler hakkında karar vermek (işe alım, performans değerlendirmesi) için tasarlanmamıştır ve bu amaçla kullanılmamalıdır.","T.mEth":"Etik ve gizlilik","T.mEthL.0":"Katılım gönüllüdür ve herkes istediği an bırakabilir.","T.mEthL.1":"Kesin tarih veya saat değil, yalnızca ay kaydedilir.","T.mEthL.2":"Raporlar yalnızca grup düzeyindedir ve en küçük grup büyüklüğü 5'tir.","T.mEthL.3":"Kişisel sonuçlar yalnızca yanıtlayan kişinin cihazında gösterilir.","T.mCourse":"Bu hizmet, Dr. Azarakhsh Mokri'nin “Kuruluşlarda ve eğitim kurumlarında kişisel ve kişiler arası yetkinlikler” dersinden doğmuştur. Orada ele alınan ölçekler arasından kısa, yayımlanmış, klinik etiket içermeyen ve her biri geliştirilebilir bir beceriyle bağlantılı olan sekiz tanesini seçtik.","T.mWiki":"Dersin tam wiki'si (Farsça)","T.mOrgPsy":"Endüstri ve örgüt psikolojisi","T.items":"madde","T.scale":"Ölçek","T.ref":"Kaynak","T.session":"Ders wiki sayfası (Farsça)","T.footer":"SoloNovate'ten Kurumsal İyi Oluş Taraması · pilot sürüm · tanı amaçlı değildir","T.dims":"boyut","T.whyT":"Bu neden önemli","T.whyP":"Ruh sağlığı ikinci plana atılabilecek bir konu değildir: devamsızlıkta, işten ayrılmalarda ve işin kalitesinde kendini gösterir. Bu tarama bu sorunları ölçmez; insanların işteki baskıyla başa çıkmasına yardımcı olan psikolojik kaynakları ölçer.","T.why.0.0":"5'te 1","T.why.0.1":"Hollandalı çalışan tükenmişlik şikâyetleri bildiriyor (2025'te %21, ulusal NEA araştırması).","T.why.1.0":"12 milyar","T.why.1.1":"iş günü dünyada her yıl depresyon ve kaygı nedeniyle kaybediliyor; bunun verimlilik maliyeti yaklaşık 1 trilyon ABD doları.","T.why.2.0":"Mesleki","T.why.2.1":"DSÖ tükenmişliği (ICD-11) mesleki bir olgu olarak sınıflandırır: yalnızca kişisel değil, işle ilgili bir sorun.","T.getT":"Kuruluşunuz ne alır","T.get.0.0":"Kademeye göre rapor","T.get.0.1":"Her kademe için sekiz boyut; güçlü yönler, öncelikler ve kademeler arası farklarla.","T.get.1.0":"Bilimsel yorum","T.get.1.1":"Her puanın ne anlama geldiğini ve ne anlama gelmediğini sade bir dille açıklama.","T.get.2.0":"Atölye planı","T.get.2.1":"Önceliklere uygun iki veya üç atölye; biçim ve süreyle birlikte.","T.get.3.0":"Her katılımcıya kişisel sonuç","T.get.3.1":"Her çalışan kendi sonucunu ve iki pratik ipucunu hemen görür; yönetim hiçbir zaman kimsenin bireysel sonucunu görmez.","T.get.4.0":"45 dakikalık değerlendirme toplantısı","T.get.4.1":"Yönetim ve İK ile sonuçların somut sonraki adımlarla ele alınması.","T.pilot.0.0":"Hafta 0","T.pilot.0.1":"Başlangıç","T.pilot.0.2":"30 dakikalık görüşme: hedefler, kademeler, zamanlama ve çalışanların nasıl bilgilendirileceği.","T.pilot.1.0":"Hafta 1–2","T.pilot.1.1":"Tarama açık","T.pilot.1.2":"Çalışanlar anonim taramayı 8–18 dakikada, telefonda veya bilgisayarda, dokuz dilden birinde doldurur.","T.pilot.2.0":"Hafta 3","T.pilot.2.1":"Rapor","T.pilot.2.2":"Kademelere göre anonim grup raporu ve önerilen atölye planı.","T.pilot.3.0":"Hafta 4","T.pilot.3.1":"Değerlendirme ve seçim","T.pilot.3.2":"Yönetimle görüşme; ilk atölyelerin ve tekrar ölçüm tarihinin seçilmesi.","T.needT":"Sizden neye ihtiyacımız var","T.need.0":"Bir irtibat kişisi (ör. İK'dan)","T.need.1":"En az 20 katılımcı ve her kademede en az 5 kişi","T.need.2":"Çalışanlara kısa bir duyuru (şablonunu biz sağlıyoruz)","T.need.3":"Çalışan konseyiniz (OR) varsa: gerektiği durumlarda onayı (WOR Madde 27). Talebin hazırlanmasında yardımcı oluyoruz.","T.need.4":"Beş haftaya yayılmış toplam yaklaşık 3 saatlik İK zamanı","T.lawT":"Hollanda ve AB mevzuatına uygun","T.law.0.0":"GDPR (AVG)","T.law.0.1":"İsim sorulmaz; yanıtlar herhangi bir e-posta adresinden ayrı tutulur ve yalnızca en az 5 kişilik gruplar için raporlanır. İyi oluşla ilgili yanıtlar sağlık verisi sayılabileceğinden katılım, açık ve gönüllü rızaya dayanır.","T.law.1.0":"Arbowet","T.law.1.1":"Kaynağa yönelik önlemlere ve RI&E'ye (Arbobesluit Madde 2.15) bireysel düzeyde bir ek olarak, işverenin PSA politikasını (Madde 3(2)) destekleyebilir.","T.law.2.0":"Çalışan konseyi","T.law.2.1":"Bu tür bir çalışan taraması genellikle çalışan konseyinin onayını ya da en azından katılımını gerektirir (WOR Madde 27); hazırlığında size yardımcı oluyoruz.","T.faqT":"Sık sorulan sorular","T.faq.0.0":"Çalışanların ne kadar zamanını alır?","T.faq.0.1":"Kısa sürüm yaklaşık 8 dakika, tam sürüm yaklaşık 18 dakika sürer. Her telefon ve bilgisayarda çalışır.","T.faq.1.0":"Yöneticiler bireysel yanıtları görebilir mi?","T.faq.1.1":"Hayır. İsim yoktur ve kurum raporu yalnızca beş veya daha fazla kişilik grupları gösterir.","T.faq.2.0":"Bu bir tanı mı?","T.faq.2.1":"Hayır. Gruplardaki örüntüleri görmek ve doğru desteği seçmek için kullanılan, yayımlanmış ölçeklere dayanan, klinik olmayan bir taramadır. Kişisel sonuç sayfası, zorlanan herkesi işyeri hekimine, aile hekimine veya bir psikoloğa yönlendirir.","T.faq.3.0":"Ölçeklerin geçerliği kanıtlanmış mı?","T.faq.3.1":"Sekizinin tamamı uluslararası alanda yayımlanmış ve geçerliği orijinal dillerinde kanıtlanmış ölçeklerdir; orijinal puanlama anahtarlarını kullanıyoruz (bkz. Yöntem ve Kaynaklar). İngilizce maddeler orijinal ifadeleri korur; burada kullanılan diğer dillerdeki sürümler için, Türkçe dahil, bu biçimiyle henüz ayrıca geçerlik çalışması yapılmamıştır; bu nedenle pilot verileriyle her ölçeğin güvenirliğini kontrol ediyoruz. Ticari kullanım lisansları yazarlarla görüşülmektedir.","T.faq.4.0":"İş stresini veya tükenmişliği ölçer mi?","T.faq.4.1":"Doğrudan değil. Baskıyla başa çıkmaya yardımcı olan psikolojik kaynakları ölçer. İş yükü ve özerklik gibi işle ilgili riskler bir çalışma koşulları anketiyle ölçülür. İkisi birbirini tamamlar ve bunları birleştirmenize yardımcı olabiliriz.","T.faq.5.0":"Büyük kuruluşlarda işe yarar mı?","T.faq.5.1":"Evet. Pilot tek bir departman veya şubeyle başlayıp sonra genişletilebilir. Anonimlik kuralları her büyüklükte aynıdır: sonuçlar yalnızca en az 5 kişilik gruplar için verilir.","T.faq.6.0":"Pilotta yanıtlar nasıl toplanır?","T.faq.6.1":"Her katılımcı anonim bir yanıt kodunu (yalnızca yanıt numaraları ve kademe) asla işverene değil, doğrudan SoloNovate'e e-postayla gönderir. SoloNovate bu e-postaları içe aktardıktan sonra siler. Tam ölçekli uygulamada güvenli bir çevrimiçi toplama sistemi kurulabilir.","T.faq.7.0":"Rapordan sonra ne olur?","T.faq.7.1":"Bir değerlendirme görüşmesi, Hollanda'daki nitelikli bir iş ortağının yürüttüğü iki veya üç atölye ve neyin değiştiğini görmek için 3–6 ay sonra tekrar ölçüm.","T.ctaT":"Pilotla ilgileniyor musunuz?","T.ctaP":"Taramayı kendiniz deneyin, örnek raporu inceleyin ve kısa bir talep gönderin.","T.calcT":"Psikolojik nedenli devamsızlık size ne kadara mal oluyor?","T.calcP":"Kuruluşunuz için hızlı bir tahmin. Rakamları kendi durumunuza göre değiştirin.","T.cEmp":"Çalışan sayısı","T.cAbs":"Devamsızlık oranı (%)","T.cAbsH":"2025'te Hollanda ortalaması: %5,4","T.cSal":"Ortalama yıllık brüt maaş (€)","T.cShare":"Stres veya psikolojik şikâyetlerden kaynaklanan devamsızlık günlerinin oranı (%)","T.cShareH":"Ulusal tahmin: yaklaşık dörtte bir","T.cRed":"Örnek senaryo (beklenen bir etki değildir): psikolojik nedenli devamsızlıktaki azalma","T.cDays":"yıllık devamsızlık günü","T.cStress":"bunlardan psikolojik nedenli olan","T.cCost":"psikolojik nedenli devamsızlığın yıllık maliyeti","T.cSave":"bu senaryoda yıllık tasarruf","T.cPerDay":"Burada kullanılan devamsızlık günü başına maliyet: {x} (işveren maliyetleri için maaş × 1,3 ÷ 220 iş günü). Hollanda'daki tahminler günlük €250 ile €400 arasındadır.","T.cNote":"Bu bir öngörü değil, bir senaryodur. Bu taramanın ve atölyelerinin devamsızlığı azalttığına dair henüz doğrudan bir kanıt yoktur ve bir ölçek puanı doğrudan daha az devamsızlık gününe dönüşmez. Önlemeye yatırım yapmaya değip değmeyeceğini değerlendirmek için bu tahmini, gerçekte neyin değiştiğini görmek için tekrar ölçümü kullanın.","T.wsPartner":"Uygulama: her atölyeyi, projeniz için tarafımızdan seçilen ve Hollanda'da çalışan deneyimli bir psikolog veya eğitmen yürütür. Değerlendirme görüşmesinden önce kendisiyle tanışırsınız.","T.pilotNoteT":"Bu pilot sürüm hakkında","T.pilotNote":"Pilotta yanıtlar yalnızca kuruluşunuzun raporunu hazırlamak ve ölçeklerin güvenirliğini kontrol etmek için kullanılır. Ölçeklerin ticari kullanım lisansları yazarlarıyla görüşülmektedir.","T.arboT":"Arbowet kapsamındaki PSA politikanızı destekleyebilir","T.arboP":"Hollanda'daki işverenler, iş stresi gibi psikososyal iş yükünü (PSA) önlemeye veya en azından sınırlamaya yönelik bir politika uygulamalı ve PSA risklerini risk envanteri ve değerlendirmelerinde (RI&E) bir eylem planıyla birlikte değerlendirmelidir. Yasa, işverenlerden iş stresini önce kaynağında (iş yükü, özerklik, destek), ancak ondan sonra bireysel önlemlerle ele almalarını ister. Bu tarama ve atölyeleri böyle bir bireysel önlemdir: yararlı bir ektir, ancak kaynağa yönelik önlemlerin yerini asla tutmaz.","T.arbo.0.0":"RI&E'nizin PSA bölümü için bir yapı taşı","T.arbo.0.1":"PSA riskleri esas olarak işin kendisiyle ilgilidir: iş yükü, özerklik, destek ve istenmeyen davranışlar. Bu tarama diğer tarafı ekler: ekiplerinizin kademeye göre hangi psikolojik kaynaklara sahip olduğu. Bunu bir çalışma koşulları anketinin yerine değil, yanında kullanın.","T.arbo.1.0":"Eylem planınız için girdi","T.arbo.1.1":"Atölyeler ve tekrar ölçüm, eylem planınızda işin kendisini ele alan önlemlerin yanında bireysel düzeydeki önlemler olarak kayda geçirilebilir.","T.arbo.2.0":"Görünür takip","T.arbo.2.1":"Öncesi ve sonrası sonuçlar, çalışan konseyine risklere karşı harekete geçtiğinizi göstermenize yardımcı olur.","T.arboNote":"Tarama RI&E'nin, çalışma koşulları anketinin veya sertifikalı bir uzmanın değerlendirmesinin yerini tutmaz; onları tamamlar.","T.fName":"Ad soyad","T.fOrg":"Kuruluş","T.fMail":"E-posta","T.fSize":"Çalışan sayısı","T.fMsg":"Mesaj (isteğe bağlı)","T.fSend":"Pilot talep et","T.fSent":"E-posta programınız hazır bir taleple açılacak; yalnızca Gönder'e tıklayın.","T.sizes.0":" la kişilik grupların sonuçlarını görür.","T.emp.2":"Sonucunuzu iki pratik ipucuyla birlikte hemen görürsünüz. Bunu yalnızca siz görürsünüz.","T.emp.3":"Katılım gönüllüdür. İstediğiniz an bırakabilirsiniz; yanıtlarınız yalnızca yanıt kodunuzu gönderirseniz kullanılır.","T.emp.4":"Bir yanıt kodu gönderirseniz SoloNovate'e gönderin – asla yöneticinize veya İK'ya değil.","T.docsT":"Örnek belgeler","T.docsP":"Başlamadan önce neyi imzaladığınızı tam olarak bilmeniz için. Her belge Felemenkçe ve İngilizce olarak mevcuttur ve yazdırılabilir veya PDF olarak kaydedilebilir. Bunlar, pilottan önce birlikte netleştirdiğimiz taslaklardır.","T.docs.pilot-agreement.0":"Pilot sözleşmesi","T.docs.pilot-agreement.1":"Pilotun kapsamı, roller, anonimlik, fiyat, sorumluluk.","T.docs.data-processing.0":"Veri işleme sözleşmesi","T.docs.data-processing.1":"GDPR Madde 28: hangi veriler, güvenlik, saklama süresi ve veri ihlalleri.","T.docs.privacy-participants.0":"Katılımcılar için gizlilik bildirimi","T.docs.privacy-participants.1":"Çalışanlar için sade dille: kim neyi görür ve haklarınız neler.","T.docs.staff-announcement.0":"Çalışanlara duyuru","T.docs.staff-announcement.1":"Yönetimden gelen, uyarlamaya hazır bir duyuru şablonu.","T.aud.mgmt":"Yönetim için","T.aud.staff":"Çalışanlar için","T.aud.hr":"İK için","T.open":"Aç (Felemenkçe / İngilizce)","T.rMail":"Kodu SoloNovate'e e-postayla gönder","T.partT":"Psikologlar ve eğitmenler için","T.partP":"Kuruluşlara atölye çalışması veya koçluk hizmeti mi veriyorsunuz? Küçük bir iş ortağı ağı kuruyoruz.","T.partL.0":"Ölçümü, raporu ve müşteri iletişimini biz üstleniriz; siz en iyi yaptığınız işi yaparsınız.","T.partL.1":"Her iş veriyle başlar: ilk oturumdan önce hangi konuların ve kademelerin dikkat gerektirdiğini bilirsiniz.","T.partL.2":"Bilimsel kanıt ve kaynaklarıyla birlikte, kullanıma ve uyarlamaya hazır atölye taslakları.","T.partL.3":"Ücretlerinizi kendiniz belirler ve hangi işleri kabul edeceğinize kendiniz karar verirsiniz.","T.partAsk":"Kuruluşlarda gruplarla çalışma deneyimi, ilgili bir mesleki kayıt (örneğin NIP veya BIG) ve Felemenkçe veya İngilizce atölye verebilme becerisi arıyoruz.","T.partCta":"İş ortağı ol","T.partSubj":"İş ortaklığı başvurusu – İyi Oluş Taraması","T.rvTabs":"Rapor görünümleri","T.whatL":"Ne görüyorsunuz","T.howL":"Nasıl okunur","T.keyL":"Temel çıkarım","T.srcL":"Kaynak","T.rv.sum.0":"Özet","T.rv.sum.1":"En önemli bulgular, sade bir dille.","T.rv.sum.2":"Puanlar 0 ile 100 arasındadır: 0 her soruya verilebilecek en düşük yanıt, 100 en yüksek yanıttır. 37,5'in altı = dikkat gerektiriyor, 37,5–62,5 = orta, 62,5'in üstü = güçlü. Her ölçeğin kendine özgü tipik bir puan düzeyi vardır; bu nedenle bir boyutu diğer boyutlarla değil, kademeler arasında ya da zaman içinde karşılaştırın.","T.rv.heat.0":"Kademeye göre","T.rv.heat.1":"Her kademenin her boyuttaki ortalama puanı.","T.rv.heat.2":"Kademeleri karşılaştırmak için satırı, bir kademenin profilini görmek için sütunu okuyun. Sıcak renkler dikkat gerektirir, yeşil güçlüdür. 5 kişiden az olan gruplar gizlidir.","T.rv.gap.0":"Kademeler arası farklar","T.rv.gap.1":"Her boyut için: her kademenin aldığı puan, en düşükten en yükseğe.","T.rv.gap.2":"Uzun bir çizgi, kademelerin çok farklı puanlar aldığı anlamına gelir. Bu, rolün gerekliliklerini yansıtabileceği gibi kimin hangi role geldiğini de yansıtabilir; sonuç çıkarmadan önce bunu değerlendirme görüşmesinde konuşun.","T.rv.dist.0":"Dağılım","T.rv.dist.1":"Her boyutta her aralıkta kaç kişi olduğu.","T.rv.dist.2":"Ortalama, zorlanan bir grubu gizleyebilir. Kırmızı kısım, dikkat gerektiren kişilerin oranıdır.","T.rv.prof.0":"Kademe profili","T.rv.prof.1":"Bir kademenin diğer kademelerle karşılaştırılması.","T.rv.prof.2":"Çubuk kademenin puanını, ince çizgi diğer kademelerin ortalamasını gösterir. Yaklaşık 5 puandan küçük farklar genellikle anlamlı değildir; 20 kişiden az olan kademelerde daha büyük farklar bile tesadüf olabilir.","T.rv.sub.0":"Alt puanlar","T.rv.sub.1":"Her boyutu oluşturan parçalar.","T.rv.sub.2":"Bir boyut düşük olduğunda, en düşük puanı hangi bölümün aldığını burada görürsünüz. Öz şefkat bölümlerinin her biri yalnızca 2 soruya dayanır ve ölçeğin yazarları yalnızca toplam puanın kullanılmasını önerir; bu nedenle bunları ölçüm olarak değil, değerlendirme görüşmesinde sohbeti başlatacak ipuçları olarak ele alın.","T.rv.time.0":"Zaman içinde","T.rv.time.1":"İlk ölçüm ile tekrar ölçüm yan yana.","T.rv.time.2":"Açık çubuk = ilk ölçüm, koyu çubuk = tekrar ölçüm. Bir değişikliğin tesadüften öte olup olmadığı grup büyüklüğüne bağlıdır. Her seferinde farklı kişiler katılabilir ve başka olaylar da rol oynar; bu nedenle bir değişiklik neyin değiştiğini gösterir, neden değiştiğini değil.","T.rv.plan.0":"Eylem planı","T.rv.plan.1":"Önce neye, kimin için ve hangi atölyeyle odaklanılmalı.","T.rv.plan.2":"Kişilerin %25'inden fazlası “dikkat gerektiriyor” aralığında olduğunda ya da 10 veya daha fazla kişiden oluşan bir kademe diğer kademelerden en az 5 puan düşük aldığında, o boyut öncelik olarak önerilir. İlk üçünü gösteriyoruz; diğerleri “Ayrıca izlenmeye değer” başlığı altında listelenir. Bu bir hüküm değil, değerlendirme görüşmesi için bir başlangıç noktasıdır.","T.kpiSub.0":"kişi yanıt verdi","T.kpiSub.1":"5+ kişilik kademe","T.kpiSub.2":"değerlendirme görüşmesine buradan başlayın","T.kpiSub.3":"sekiz boyutun ortalaması","T.sumN":"{k} kademeden {n} kişinin yanıtlarına dayanır.","T.sumStrong":"En yüksek puanlar: {a}.","T.sumWeak":"En düşük puan: {d} ({m}); “dikkat gerektiriyor” aralığındaki kişilerin oranı: {p}.","T.sumGap":"Kademeler arasındaki en büyük fark: {d} – {hi}: {a}, {lo}: {b}.","T.sumNext":"Önerilen ilk adım: “{w}” atölyesi (hedef grup: {who}).","T.and":"ve","T.heatKey":"En düşük puan: {lv} – {d} ({v}). En yüksek: {lv2} – {d2} ({v2}).","T.gapKey":"En büyük fark: {d} – {lo}: {a}, {hi}: {b} ({x} puan).","T.distKey":"{d}: ortalama ({m}) orta düzeyde olsa da “dikkat gerektiriyor” aralığındaki kişilerin oranı {p}.","T.profSel":"Kademe","T.profUp":"Diğer kademelere kıyasla {lv} şu boyutlarda daha yüksek puan alıyor: {a}.","T.profDown":"Diğer kademelere kıyasla {lv} şu boyutlarda daha düşük puan alıyor: {b}.","T.profFlat":"{lv} tüm boyutlarda diğer kademelere yakın puan alıyor.","T.orgAvg":"diğer kademelerin ortalaması","T.subKey":"En düşük alt puan: {d} boyutunda {s} ({v}).","T.timeDemo":"Simüle edilmiş örnek: öz şefkat ve akış atölyelerinden dört ay sonra tekrar ölçüm.","T.timeKey":"En büyük değişim: {d} ({x} puan). Bu grup büyüklüklerinde yaklaşık 5 puandan küçük değişimler tesadüf olabilir.","T.timeNone":"Bu görünüm bir tekrar ölçümden sonra kullanılabilir olur (atölyelerden 3–6 ay sonra).","T.t1":"İlk ölçüm","T.t2":"Tekrar ölçüm","T.rHow":"Renkler aralığı gösterir: kırmızı = dikkat gerektiriyor, sarı = orta, yeşil = güçlü. Her ölçeğin kendine özgü tipik bir puan düzeyi vardır; bu nedenle bir boyutu diğer boyutlarla değil, zaman içinde kendisiyle karşılaştırın.","T.ariaHome":"Ana sayfa","T.ariaNav":"Bölümler","T.ariaLang":"Dil","T.tUnval":"Bu sorular, orijinal ölçeklerin bizim yaptığımız Türkçe çevirisidir ve henüz ayrıca geçerlik çalışması yapılmamıştır. Aynı şekilde puanlanırlar; güvenirliklerini pilotta kontrol ediyoruz.","DIMS.compassion.n":"Öz şefkat","DIMS.compassion.q":"Başarısız olduğumda veya zorlandığımda kendime karşı nazik miyim, sert mi?","DIMS.compassion.what":"İnsanların başarısızlık ve acı anlarında kendilerine nasıl davrandığı: nazik ve dengeli mi, yoksa öz eleştirel ve bunalmış mı.","DIMS.compassion.not":"Öz şefkat; tembellik, bencillik veya kendi standartlarınızı düşürmekle aynı şey değildir.","DIMS.compassion.b.0":"Öz eleştiri güçlü. Hatalar muhtemelen suçlama, kendini yalnız hissetme ve olumsuz düşüncelere takılıp kalma ile karşılanıyor.","DIMS.compassion.b.1":"Zor anlarda kendine karşı ne çok sert ne de sürekli nazik.","DIMS.compassion.b.2":"Zor anlarda kendine karşı nazik ve dengeli; kendine saldırmadan hatalarından öğreniyor.","DIMS.compassion.tips.0":"Bir hatadan sonra kendinize sorun: “Bu durumdaki bir arkadaşıma ne derdim?” ve bunu kendinize söyleyin.","DIMS.compassion.tips.1":"Hataların her insanın deneyiminin bir parçası olduğunu hatırlayın; duygunuzu içinde boğulmadan adlandırın.","DIMS.flex.n":"Psikolojik esneklik","DIMS.flex.q":"Zor düşünce ve duygular beni önemli olandan uzaklaştırıyor mu?","DIMS.flex.what":"Hoş olmayan düşünce ve duyguların, kişinin değerlerine göre yaşamasını ve çalışmasını ne ölçüde engellediği.","DIMS.flex.not":"Düşük puan bir tanı değildir; zor düşünce ve duyguların şu sıralar sizin için önemli olanın önüne sık sık geçtiği anlamına gelir.","DIMS.flex.b.0":"Acı veren düşünce ve duygular çok yer kaplıyor ve muhtemelen önemli eylemleri engelliyor.","DIMS.flex.b.1":"Zor düşünce ve duygular zaman zaman engel oluyor, ancak çoğunlukla önemli olana doğru ilerlemeyi sürdürüyor.","DIMS.flex.b.2":"Duygular zor olsa bile önemli olana doğru ilerleyebiliyor.","DIMS.flex.tips.0":"Bir düşünceyle savaşmak yerine “… diye bir düşüncem var” deyin ve bir sonraki küçük adımı atın.","DIMS.flex.tips.1":"Tam hazır hissetmeseniz bile her gün değerlerinize uygun küçük bir eylem yapın.","DIMS.optim.n":"İyimserlik","DIMS.optim.q":"Genel olarak işlerin iyi sonuçlanacağını bekler miyim?","DIMS.optim.what":"Kişinin gelecekten genel beklentisi: iyi şeyler mi, kötü şeyler mi.","DIMS.optim.not":"Kuruluşun geleceği veya iş memnuniyetiyle ilgili değildir; oldukça kalıcı bir kişisel özelliktir.","DIMS.optim.b.0":"Kötü sonuç beklentisi baskın; denemeyi sürdürme enerjisi daha düşük olabilir.","DIMS.optim.b.1":"Geleceğe dair orta düzeyde beklentiler; ne açıkça iyimser ne de karamsar.","DIMS.optim.b.2":"Genellikle iyi sonuçlar bekliyor; çalışmalarda bu durum sebat ve daha iyi sağlıkla birlikte görülür.","DIMS.optim.tips.0":"Birkaç dakika bir yıl sonraki “mümkün olan en iyi benliğiniz” hakkında yazın; bu alıştırma araştırmalarda iyimserliği artırdı.","DIMS.optim.tips.1":"Her endişenin yanına bir “bu olursa şunu yapacağım: …” planı yazın.","DIMS.hope.n":"Umut","DIMS.hope.q":"Hedeflerim, onlara giden yollarım ve harekete geçecek enerjim var mı?","DIMS.hope.what":"Bilimsel anlamda umut: hedeflere sahip olmak, onlara giden yolları bulmak (yollar) ve bu hedefleri sürdürecek enerji ve inanca sahip olmak (eyleyicilik).","DIMS.hope.not":"İyimserlikle aynı değildir; umut, kişinin hedefe ulaşma kapasitesiyle ilgilidir.","DIMS.hope.b.0":"Hedeflere ulaşmak için yol veya enerji az; kendini çıkmazda hissetme olasılığı daha yüksek.","DIMS.hope.b.1":"Hedefler ve yollar var ama engellerle karşılaşınca enerji düşüyor.","DIMS.hope.b.2":"Net hedefler, birden fazla yol ve yeterli enerji; çalışmalarda biraz daha iyi performansla ilişkili bulunmuştur.","DIMS.hope.tips.0":"Önemli bir hedef için en az üç farklı yol yazın.","DIMS.hope.tips.1":"WOOP kullanın: dilek (Wish), sonuç (Outcome), içsel engel (Obstacle) ve “eğer… o zaman…” planı (Plan).","DIMS.belong.n":"Aidiyet","DIMS.belong.q":"Kendimi bir grubun parçası ve kabul görmüş hissediyor muyum?","DIMS.belong.what":"İlişkilerde, yaşamda ve başkaları arasında genel aidiyet ve kabul görme duygusu.","DIMS.belong.not":"Yalnızca işyeriyle ilgili değildir; yaşamın tamamındaki aidiyeti ölçer.","DIMS.belong.b.0":"Güçlü bir dışlanmışlık veya reddedilmişlik duygusu; araştırmalarda bu durum daha düşük iyi oluşla birlikte görülür.","DIMS.belong.b.1":"Orta düzeyde aidiyet ve kabul görme duygusu; ne güçlü biçimde bağlı ne de belirgin biçimde dışlanmış hissediyor.","DIMS.belong.b.2":"Kendini kabul görmüş ve başkalarıyla bağlı hissediyor; ruh sağlığının önemli bir dayanağı.","DIMS.belong.tips.0":"Bu hafta bir iş arkadaşınızla işle ilgili olmayan kısa bir sohbet edin.","DIMS.belong.tips.1":"Birinden sizi bir göreve veya plana dahil etmesini isteyin; yardım istemek de bağ kurar.","DIMS.flow.n":"İşte akış","DIMS.flow.q":"İşime dalıyor muyum, ondan keyif alıyor muyum ve onu kendisi için mi yapıyorum?","DIMS.flow.what":"Son iki haftadaki işte akış: kendini kaptırma, keyif ve içsel motivasyon.","DIMS.flow.not":"Çabayı veya çalışma saatlerini değil, iş deneyiminin niteliğini ölçer.","DIMS.flow.b.0":"İş pek sürükleyici ya da keyifli değil; kesintiler veya anlam eksikliği fazla olabilir.","DIMS.flow.b.1":"İşte kendini kaptırma, keyif alma ve motivasyon orta düzeyde.","DIMS.flow.b.2":"Kendini kaptırma, keyif ve içsel motivasyon; daha iyi performans ve anlam duygusuyla ilişkili.","DIMS.flow.tips.0":"Her gün mesaj ve toplantı olmadan odaklı çalışma için 60–90 dakika ayırın.","DIMS.flow.tips.1":"İşinizin bir bölümünü güçlü yönlerinize ve ilgi alanlarınıza daha uygun hale getirin (iş biçimlendirme).","DIMS.ei.n":"Duygusal zekâ","DIMS.ei.q":"Kendi duygularımı ve başkalarının duygularını anlayıp yönetebiliyor muyum?","DIMS.ei.what":"İnsanların kendilerinde ve başkalarında duyguları anlama ve yönetme becerilerini nasıl değerlendirdiği.","DIMS.ei.not":"Bir yetenek testi değil, öz değerlendirmedir; gerçek becerilerden farklı olabilir.","DIMS.ei.b.0":"Kendini duyguları tanıma veya yönetmede daha az becerikli görüyor.","DIMS.ei.b.1":"Kendi duygusal becerilerini orta düzeyde görüyor.","DIMS.ei.b.2":"Kendini kendisinde ve başkalarında duyguları anlama ve yönetmede yetkin görüyor.","DIMS.ei.tips.0":"Günde üç kez duygunuzu net bir şekilde adlandırın (“kötü” yerine “sinirli”).","DIMS.ei.tips.1":"Bir iş arkadaşınız üzgün olduğunda önce onun duygusunu yansıtın (“yorgun görünüyorsun”), sonra çözüm önerin.","DIMS.selfctrl.n":"Öz denetim","DIMS.selfctrl.q":"Ayartmalara direnip uzun vadeli hedeflerime bağlı kalıyor muyum?","DIMS.selfctrl.what":"Kişilerin dürtülerini kontrol etme, ayartmalara direnme ve uzun vadeli hedeflere bağlı kalma becerilerini kendilerinin nasıl değerlendirdiği.","DIMS.selfctrl.not":"Düşük puan zayıf irade anlamına gelmez; çevre ve alışkanlıklar büyük rol oynar.","DIMS.selfctrl.b.0":"Ayartmalar ve dikkat dağıtıcılar sık sık kazanıyor; çevreyi ve alışkanlıkları değiştirmek çoğu zaman daha çok çabalamaktan daha fazla işe yarar.","DIMS.selfctrl.b.1":"Kendi değerlendirmesine göre öz denetimi orta düzeyde; uzun vadeli hedefler zaman zaman ağır basıyor.","DIMS.selfctrl.b.2":"Uzun vadeli hedeflere genellikle bağlı kalıyor; araştırmalarda bu durum çoğunlukla iyi alışkanlıklarla birlikte görülür.","DIMS.selfctrl.tips.0":"Çevrenizi tasarlayın: odaklı çalışma sırasında telefonu başka bir odaya koyun.","DIMS.selfctrl.tips.1":"Zor bir görevi küçük bir keyifle birleştirin (ör. en sevdiğiniz podcast yalnızca yürüyüş sırasında).","WS.w-comp.t":"Öz şefkat ve içsel eleştirmen","WS.w-comp.who":"Tüm kademeler; yöneticiler için sürüm: şefkatli liderlik","WS.w-comp.goals.0":"İçsel eleştirmeni ve bedelini fark etmek","WS.w-comp.goals.1":"Öz şefkatin üç bileşenini uygulamak: kendine nezaket, ortak insanlık ve bilinçli farkındalık","WS.w-comp.goals.2":"Ekipte hatalarla küçük düşürmeden başa çıkmak","WS.w-comp.ev":"27 randomize kontrollü çalışmanın meta-analizi, çoğu birkaç hafta süren öz şefkat programlarının öz eleştiri ve stres üzerinde orta düzeyde etkileri olduğunu buldu. İki oturumluk bir atölyenin etkileri muhtemelen daha küçüktür.","WSLEN.w-comp":"2 × 3 saat","WS.w-flex.t":"Psikolojik esneklik ve duygu düzenleme","WS.w-flex.who":"Tüm kademeler, özellikle yüksek baskı altındaki roller","WS.w-flex.goals.0":"Düşüncelerle savaşmadan onlara mesafe koymak","WS.w-flex.goals.1":"İşteki değerleri netleştirmek","WS.w-flex.goals.2":"Duygu düzenlemenin süreç modeli ve dört proaktif strateji","WS.w-flex.ev":"Kabul ve kararlılık eğitimine (ACT) ilişkin 17 işyeri çalışmasının meta-analizi, psikolojik sıkıntıda küçük ila orta düzeyde azalma ve psikolojik esneklikte artış buldu; etkiler en belirgin olarak büro çalışanlarında görüldü, sağlık çalışanlarında ise küçüktü.","WSLEN.w-flex":"2 × 3 saat","WS.w-hope.t":"Umut ve gerçekçi iyimserlik","WS.w-hope.who":"Tüm kademeler; kurumsal değişim dönemleri için uygun","WS.w-hope.goals.0":"“Mümkün olan en iyi benlik” alıştırması","WS.w-hope.goals.1":"WOOP ve “eğer… o zaman…” planları","WS.w-hope.goals.2":"İlerleme ilkesi: küçük başarıları görmek","WS.w-hope.ev":"WOOP'un (eğer… o zaman… planlarıyla zihinsel karşılaştırma) hedefe ulaşma üzerinde küçük ila orta düzeyde etkisi vardır; “mümkün olan en iyi benlik” alıştırması iyimserliği biraz artırır.","WSLEN.w-hope":"1 × 4 saat","WS.w-belong.t":"İşte aidiyet ve bağ","WS.w-belong.who":"Ekipler yöneticileriyle birlikte","WS.w-belong.goals.0":"Zahmetsiz temas: iş arkadaşları arasında kısa hal hatır sohbetleri ve içten takdir","WS.w-belong.goals.1":"Yeni gelenler için uyum (onboarding) ve yol arkadaşı (buddy) programları","WS.w-belong.goals.2":"Önemsenmek: fark edilmek ve katkı sağlamak","WS.w-belong.ev":"Kısa aidiyet müdahaleleri üniversite öğrencilerinde sonuçları iyileştirdi; ancak 2023'te yapılan büyük bir tekrar çalışması, etkileri yalnızca ortamın gerçek aidiyet fırsatları sunduğu yerlerde buldu. Henüz karşılaştırılabilir işyeri çalışmaları yoktur; bu nedenle atölye bu fikri uyum (onboarding) ve yol arkadaşı (buddy) uygulamalarıyla birleştirir.","WSLEN.w-belong":"1 × 3 saat + ekip programı","WS.w-flow.t":"Derin çalışma, akış ve işten zihinsel kopma","WS.w-flow.who":"Tüm kademeler; yöneticiler için sürüm: ekibin odaklanma zamanını korumak","WS.w-flow.goals.0":"İş biçimlendirme: işinizi kendiniz yeniden şekillendirmek","WS.w-flow.goals.1":"Kesintisiz odaklanma blokları","WS.w-flow.goals.2":"Mesai sonrası işten zihinsel olarak kopmak","WS.w-flow.ev":"Meta-analizler iş biçimlendirmeyi daha yüksek işe tutkunlukla, mesai sonrası zihinsel kopmayı daha az tükenmeyle ilişkilendirir; bu kanıtların çoğu korelasyoneldir.","WSLEN.w-flow":"1 × 4 saat","WS.w-ei.t":"Uygulamada duygusal zekâ","WS.w-ei.who":"Müşteriyle temas eden roller, yöneticiler ve amirler","WS.w-ei.goals.0":"Duyguları isabetli biçimde adlandırmak","WS.w-ei.goals.1":"İş arkadaşlarının ve müşterilerin duygularına yanıt vermek","WS.w-ei.goals.2":"Duygusal emek: bedelini fark etmek","WS.w-ei.ev":"Duygusal zekâ eğitimi, duygusal zekâ puanlarını ortalama olarak orta düzeyde artırır; عن هويتي","T.rSent":"حُفظت إجاباتك دون الكشف عن هويتك. شكرًا لك!","T.rCode":"رمز الإجابات","T.rCodeP":"انسخ هذا الرمز وأرسله بالبريد الإلكتروني إلى SoloNovate، لا إلى مديرك ولا إلى الموارد البشرية. لا يحتوي إلا على إجاباتك ومستواك الوظيفي والشهر، لا اسمك. ولأنه يصل بالبريد الإلكتروني، ترى SoloNovate عنوان بريدك لفترة وجيزة؛ لكننا لا نحفظه أبدًا مع إجاباتك، ونحذف الرسالة بعد استيراد الرمز.","T.rCopy":"انسخ الرمز","T.rCopied":"تم النسخ","T.rCare":"إذا كنت تشعر بالإحباط منذ مدة أو تشعر أنك لم تعد قادرًا على التحمّل، فتحدّث إلى طبيب الشركة أو طبيبك العام أو أخصائي نفسي. طلب المساعدة علامة قوة.","T.rNot":"هذه النتيجة لقطة من إجاباتك اليوم، وليست حكمًا عليك ولا تشخيصًا.","T.band.0":"يحتاج إلى اهتمام","T.band.1":"متوسط","T.band.2":"قوي","T.pT":"تقرير المؤسسة","T.pP":"الموارد النفسية في مؤسستك حسب المستوى الوظيفي، مع الأولويات وورش العمل المقترحة.","T.pSrc":"بيانات التقرير","T.pDemo":"بيانات نموذجية (عرض توضيحي)","T.pLive":"الإجابات الحقيقية لهذه الجولة","T.pImport":"استيراد رموز الإجابات","T.pImportP":"الصق رموز الإجابات هنا (رمز في كل سطر).","T.pImportGo":"أضف","T.pAdded":"عدد الإجابات المضافة","T.pN":"المشاركون","T.pLevels":"المستويات","T.pAvg":"البُعد الأدنى","T.pLowShare":"نسبة «يحتاج إلى اهتمام»","T.pNoPri":"لا يبلغ أي بُعد عتبة الأولوية. الاقتراح: ورش عمل تعزيزية للحفاظ على نقاط القوة.","T.pWhy":"السبب","T.pFor":"الفئة المستهدفة أساسًا","T.pStrengths":"نقاط قوة المؤسسة","T.pGap":"أكبر فرق بين المستويات","T.pHidden":"أقل من 5","T.pNone":"لا توجد إجابات بعد.","T.pExport":"انسخ البيانات المجمّعة (CSV)","T.pAdmin":"إدارة الجولات","T.pAdminP":"للشخص الذي ينسّق الفحص في المؤسسة. أنشئ جولة وشارك الرابط مع الموظفين.","T.pOrg":"اسم المؤسسة","T.pRoundName":"اسم الجولة","T.pCreate":"أنشئ جولة","T.pRounds":"الجولات","T.pChoose":"اختر جولة","T.pNoAdmin":"إنشاء الجولات ورؤية الإجابات الحقيقية متاحان فقط لمنسّقي الفحص (محرري هذه الصفحة). يمكن للآخرين مشاهدة التقرير النموذجي أو استيراد رموز الإجابات.","T.pDemoNote":"يستخدم هذا التقرير بيانات محاكاة لـ 180 شخصًا لترى كيف يبدو التقرير الحقيقي.","T.wT":"ورش العمل","T.wP":"تركّز كل ورشة على بُعد أو بُعدين وتستند إلى مواد مقرر الدكتور مكري. روابط القراءة تفتح صفحات ويكي المقرر؛ العناوين مترجمة هنا لكن الصفحات نفسها بالفارسية.","T.wGoals":"الأهداف","T.wWho":"الفئة المستهدفة","T.wLen":"المدة","T.wEv":"الأدلة العلمية","T.wRead":"قراءات إضافية في ويكي المقرر (صفحات بالفارسية)","T.mT":"المنهجية","T.mP":"بشفافية: ماذا نقيس، وكيف نحسب الدرجات، وأين تكمن الحدود.","T.mInst":"الاستبيانات","T.mScore":"حساب الدرجات","T.mScoreP":"يُحوَّل متوسط كل مقياس فرعي إلى نطاق 0–100: (المتوسط − الحد الأدنى) ÷ (الحد الأعلى − الحد الأدنى) × 100. يُعاد أولًا ترميز البنود العكسية. وحين تعني الدرجة المرتفعة في الاستبيان الأصلي صعوبة أكبر (مثل AAQ-II) تُعكس الدرجة لكي يكون «الأعلى = الأفضل» في كل مكان.","T.mBands":"نطاقات الدرجات","T.mBandsP":"أقل من 37.5: يحتاج إلى اهتمام · من 37.5 إلى 62.5: متوسط · أعلى من 62.5: قوي. تتبع هذه الحدود العُرف المستخدم في مقياس التعاطف مع الذات (متوسط إجابة أقل من 2.5 أو أعلى من 3.5 على مقياس من 1 إلى 5)، وتُطبَّق على جميع المقاييس تبسيطًا. وهي ليست معايير سكانية ولا درجات قطع سريرية، والدرجات المعتادة تختلف من استبيان إلى آخر.","T.mLim":"القيود","T.mLimL.0":"جميع الاستبيانات تقرير ذاتي، وقد تتأثر بمزاج اليوم أو بالرغبة في الظهور بمظهر جيد.","T.mLimL.1":"لا توجد للنطاقات معايير سكانية؛ المقارنات داخل المؤسسة وعبر الزمن أدق من المقارنة بـ«متوسط وطني».","T.mLimL.2":"الاستبيانات مُثبتة الصدق بلغتها الأصلية، والبنود الإنجليزية تحافظ على صياغتها الأصلية. أما النسخ المستخدمة هنا بلغات أخرى، ومنها هذه النسخة العربية، فلم يُتحقق من صدقها بشكل مستقل بهذه الصيغة؛ ونحن نفحص ثباتها في التجربة. للبحث العلمي استخدم النسخ المعتمدة رسميًا (انظر المصادر).","T.mLimL.3":"هذه الأداة ليست مصممة لاتخاذ قرارات بشأن أفراد (التوظيف، تقييم الأداء) ولا يجوز استخدامها لذلك.","T.mEth":"الأخلاقيات والخصوصية","T.mEthL.0":"المشاركة طوعية، ويمكن لأي شخص التوقف في أي وقت.","T.mEthL.1":"يُسجَّل الشهر فقط، لا التاريخ أو الوقت بدقة.","T.mEthL.2":"التقارير على مستوى المجموعات فقط، بحد أدنى 5 أشخاص لكل مجموعة.","T.mEthL.3":"النتائج الشخصية تُعرض فقط على جهاز المشارك.","T.mCourse":"نشأت هذه الخدمة من مقرر «المهارات الشخصية والإنسانية في المؤسسات والمراكز التعليمية» للدكتور آذرخش مكري. ومن بين الاستبيانات التي تناولها المقرر، اخترنا ثمانية استبيانات قصيرة ومنشورة، خالية من التسميات السريرية، ويرتبط كل منها بمهارة يمكن تدريبها.","T.mWiki":"ويكي المقرر الكامل (بالفارسية)","T.mOrgPsy":"علم النفس الصناعي والتنظيمي","T.items":"عدد البنود","T.scale":"المقياس","T.ref":"المرجع","T.session":"صفحة ويكي المقرر (بالفارسية)","T.footer":"فحص الرفاه في المؤسسة من SoloNovate · نسخة تجريبية · ليس تشخيصًا","T.dims":"الأبعاد","T.whyT":"لماذا يهم هذا","T.whyP":"الصحة النفسية ليست موضوعًا هامشيًا؛ فهي تظهر في الغياب ودوران الموظفين وجودة العمل. لا يقيس هذا الفحص هذه المشكلات، بل يقيس الموارد النفسية التي تساعد الناس على التعامل مع ضغوط العمل.","T.why.0.0":"1 من كل 5","T.why.0.1":"موظفين في هولندا يبلّغ عن أعراض الاحتراق الوظيفي (21% عام 2025، وفق المسح الوطني لظروف العمل NEA).","T.why.1.0":"12 مليار","T.why.1.1":"يوم عمل يضيع سنويًا في العالم بسبب الاكتئاب والقلق، بتكلفة إنتاجية تقارب تريليون دولار أمريكي.","T.why.2.0":"مرتبط بالعمل","T.why.2.1":"تصنّف منظمة الصحة العالمية الاحتراق الوظيفي (ICD-11) ظاهرةً مرتبطة بالعمل: مشكلة في العمل، لا مشكلة شخصية فقط.","T.getT":"ما الذي تحصل عليه مؤسستك","T.get.0.0":"تقرير حسب المستوى الوظيفي","T.get.0.1":"ثمانية أبعاد لكل مستوى، مع نقاط القوة والأولويات والفروق بين المستويات.","T.get.1.0":"تفسير علمي","T.get.1.1":"شرح واضح لما تعنيه كل درجة وما لا تعنيه.","T.get.2.0":"خطة ورش عمل","T.get.2.1":"ورشتان أو ثلاث تناسب الأولويات، مع الشكل والمدة.","T.get.3.0":"نتيجة شخصية لكل مشارك","T.get.3.1":"يرى كل موظف نتيجته ونصيحتين عمليتين فورًا؛ ولا ترى الإدارة أبدًا النتيجة الفردية لأي شخص.","T.get.4.0":"جلسة مراجعة مدتها 45 دقيقة","T.get.4.1":"مناقشة النتائج مع الإدارة والموارد البشرية، مع خطوات تالية ملموسة.","T.pilot.0.0":"الأسبوع 0","T.pilot.0.1":"الانطلاق","T.pilot.0.2":"اجتماع لمدة 30 دقيقة: الأهداف والمستويات والجدول الزمني وطريقة إبلاغ الموظفين.","T.pilot.1.0":"الأسبوعان 1–2","T.pilot.1.1":"الفحص مفتوح","T.pilot.1.2":"يملأ الموظفون الفحص المجهول الهوية في 8–18 دقيقة، على الهاتف أو الحاسوب، بإحدى تسع لغات.","T.pilot.2.0":"الأسبوع 3","T.pilot.2.1":"التقرير","T.pilot.2.2":"تقرير مجموعات مجهول الهوية حسب المستوى وخطة ورش عمل مقترحة.","T.pilot.3.0":"الأسبوع 4","T.pilot.3.1":"المراجعة والاختيار","T.pilot.3.2":"نقاش مع الإدارة؛ اختيار أولى ورش العمل وموعد القياس التالي.","T.needT":"ما الذي نحتاجه منك","T.need.0":"شخص واحد للتواصل (مثلًا من الموارد البشرية)","T.need.1":"20 مشاركًا على الأقل، و5 على الأقل في كل مستوى وظيفي","T.need.2":"رسالة قصيرة للموظفين (نوفّر لك نموذجًا)","T.need.3":"إن كان لديكم مجلس عاملين (OR): موافقته حيث يلزم ذلك (WOR المادة 27). ونساعدك في إعداد الطلب.","T.need.4":"نحو 3 ساعات من وقت الموارد البشرية إجمالًا، موزّعة على خمسة أسابيع","T.lawT":"متوافق مع القوانين الهولندية والأوروبية","T.law.0.0":"اللائحة العامة لحماية البيانات (GDPR)","T.law.0.1":"لا نطلب أي أسماء؛ وتُحفظ الإجابات بمعزل عن أي عنوان بريد إلكتروني، ولا تُعرض إلا لمجموعات من 5 أشخاص أو أكثر. ولأن الإجابات المتعلقة بالرفاه قد تُعدّ بيانات صحية، تقوم المشاركة على موافقة صريحة وطوعية.","T.law.1.0":"Arbowet","T.law.1.1":"يمكن أن يدعم سياسة صاحب العمل بشأن العبء النفسي الاجتماعي (PSA) (المادة 3 الفقرة 2) بوصفه إضافة على المستوى الفردي إلى الإجراءات التي تعالج مصدر المشكلة وإلى جرد المخاطر وتقييمها (RI&E) (Arbobesluit المادة 2.15).","T.law.2.0":"مجلس العاملين","T.law.2.1":"يحتاج مثل هذا الاستبيان للموظفين عادةً إلى موافقة مجلس العاملين، أو على الأقل إلى إشراكه (WOR المادة 27)؛ ونساعدك في التحضير لذلك.","T.faqT":"أسئلة شائعة","T.faq.0.0":"كم يستغرق من وقت الموظفين؟","T.faq.0.1":"تستغرق النسخة القصيرة نحو 8 دقائق، والكاملة نحو 18 دقيقة. ويعمل الفحص على أي هاتف أو حاسوب.","T.faq.1.0":"هل يرى المديرون الإجابات الفردية؟","T.faq.1.1":"لا. لا توجد أسماء، ولا يعرض تقرير المؤسسة إلا المجموعات المؤلفة من خمسة أشخاص أو أكثر.","T.faq.2.0":"هل هذا تشخيص؟","T.faq.2.1":"لا. إنه فحص غير سريري مبني على استبيانات منشورة، يُستخدم لرؤية الأنماط في المجموعات واختيار الدعم المناسب. وتوجّه صفحة النتيجة الشخصية كل من يمرّ بصعوبة إلى طبيب الشركة أو الطبيب العام أو أخصائي نفسي.","T.faq.3.0":"هل الاستبيانات مُثبتة الصدق؟","T.faq.3.1":"نُشرت الاستبيانات الثمانية جميعها دوليًا وثبت صدقها بلغتها الأصلية، ونستخدم مفاتيح التصحيح الأصلية (انظر المنهجية والمصادر). البنود الإنجليزية تحافظ على صياغتها الأصلية؛ أما النسخ المستخدمة هنا بلغات أخرى، ومنها العربية، فلم يُتحقق من صدقها بعد بشكل مستقل بهذه الصيغة، لذلك نفحص ثبات كل مقياس على بيانات التجربة. ويجري ترتيب تراخيص الاستخدام التجاري مع المؤلفين.","T.faq.4.0":"هل يقيس ضغط العمل أو الاحتراق الوظيفي؟","T.faq.4.1":"ليس مباشرة. إنه يقيس الموارد النفسية التي تساعد على التعامل مع الضغط. أما مخاطر العمل مثل العبء والاستقلالية فتُقاس باستبيان لظروف العمل. الاثنان يكمّلان بعضهما، ويسعدنا مساعدتك على الجمع بينهما.","T.faq.5.0":"هل يصلح للمؤسسات الكبيرة؟","T.faq.5.1":"نعم. يمكن أن تبدأ التجربة في قسم أو موقع واحد ثم تتوسع. قواعد إخفاء الهوية واحدة مهما كان الحجم: النتائج فقط لمجموعات من 5 أشخاص على الأقل.","T.faq.6.0":"كيف تُجمع الإجابات في التجربة؟","T.faq.6.1":"يرسل كل مشارك رمز إجابات مجهول الهوية (أرقام الإجابات والمستوى الوظيفي فقط) بالبريد الإلكتروني مباشرة إلى SoloNovate، وليس أبدًا إلى صاحب العمل. تحذف SoloNovate هذه الرسائل بعد استيراد الرموز. وعند التطبيق الكامل بعد التجربة يمكن تفعيل جمع آمن للإجابات عبر الإنترنت.","T.faq.7.0":"ماذا يحدث بعد التقرير؟","T.faq.7.1":"جلسة مراجعة، وورشتان أو ثلاث يقدمها شريك مؤهل في هولندا، ثم قياس متكرر بعد 3–6 أشهر لمعرفة ما الذي تغيّر.","T.ctaT":"هل تودّ إجراء تجربة في مؤسستك؟","T.ctaP":"جرّب الفحص بنفسك، واطّلع على التقرير النموذجي، وأرسل طلبًا قصيرًا.","T.calcT":"كم يكلّفك الغياب لأسباب نفسية؟","T.calcP":"تقدير سريع لمؤسستك. غيّر الأرقام لتناسب وضعك.","T.cEmp":"عدد الموظفين","T.cAbs":"نسبة الغياب (%)","T.cAbsH":"المتوسط في هولندا عام 2025: ‎5.4%‎","T.cSal":"متوسط الراتب السنوي الإجمالي (€)","T.cShare":"نسبة أيام الغياب بسبب الضغط أو الشكاوى النفسية (%)","T.cShareH":"تقدير وطني: نحو الربع","T.cRed":"سيناريو توضيحي (وليس أثرًا متوقَّعًا): ينخفض الغياب المرتبط بأسباب نفسية بنسبة","T  إلى اهتمام»، أو حين يسجّل مستوى وظيفي يضم 10 أشخاص أو أكثر درجةً أدنى من بقية المستويات بـ 5 نقاط على الأقل. نعرض أهم ثلاث أولويات، وتُدرج البقية تحت «يستحق المتابعة أيضًا». هذه نقطة انطلاق لجلسة مناقشة النتائج، لا حكم نهائي.","T.kpiSub.0":"عدد الأشخاص الذين أجابوا","T.kpiSub.1":"المستويات الوظيفية التي تضم 5 أشخاص أو أكثر","T.kpiSub.2":"ابدأ من هنا في جلسة مناقشة النتائج","T.kpiSub.3":"المتوسط عبر الأبعاد الثمانية","T.sumN":"عدد المشاركين: {n}؛ عدد المستويات الوظيفية: {k}.","T.sumStrong":"أعلى الدرجات: {a}.","T.sumWeak":"أدنى درجة: {d} ({m})؛ نسبة الأشخاص في نطاق «يحتاج إلى اهتمام»: {p}.","T.sumGap":"أكبر فرق بين المستويات: {d} – {hi}: {a}، {lo}: {b}.","T.sumNext":"الخطوة الأولى المقترحة: ورشة «{w}»؛ الفئة المستهدفة: {who}.","T.and":"و","T.heatKey":"أدنى درجة: {lv} – {d} ({v}). أعلى درجة: {lv2} – {d2} ({v2}).","T.gapKey":"أكبر فرق: {d} – {lo} {a} مقابل {hi} {b} (الفرق بالنقاط: {x}).","T.distKey":"{d}: {p} من الأشخاص في نطاق «يحتاج إلى اهتمام»، رغم أن المتوسط ({m}) يقع في نطاق «متوسط».","T.profSel":"المستوى الوظيفي","T.profUp":"{lv}: درجات أعلى مقارنةً ببقية المستويات في: {a}.","T.profDown":"{lv}: درجات أدنى مقارنةً ببقية المستويات في: {b}.","T.profFlat":"{lv}: الدرجات قريبة من بقية المستويات في كل الأبعاد.","T.orgAvg":"متوسط المستويات الأخرى","T.subKey":"أدنى درجة فرعية: {s} في {d} ({v}).","T.timeDemo":"مثال محاكاة: قياس متكرر بعد أربعة أشهر من ورش التعاطف مع الذات والتدفق.","T.timeKey":"أكبر تغيّر: {d} (الفرق بالنقاط: ‎{x}). التغيّرات الأصغر من نحو 5 نقاط قد تكون من قبيل المصادفة في مجموعات بهذا الحجم.","T.timeNone":"سيتاح هذا العرض بعد القياس المتكرر (بعد 3–6 أشهر من الورش).","T.t1":"القياس الأول","T.t2":"القياس المتكرر","T.rHow":"تُظهر الألوان النطاق: الأحمر = يحتاج إلى اهتمام، والأصفر = متوسط، والأخضر = قوي. لكل استبيان مداه المعتاد، لذا قارن البُعد بنفسه عبر الزمن بدلًا من مقارنته بالأبعاد الأخرى.","T.ariaHome":"الصفحة الرئيسية","T.ariaNav":"الأقسام","T.ariaLang":"اللغة","T.tUnval":"هذه الأسئلة ترجمتنا العربية للاستبيانات الأصلية، ولم يُتحقق من صدقها بشكل مستقل بعد. تُصحَّح بالطريقة نفسها، ونفحص ثباتها في التجربة.","DIMS.compassion.n":"التعاطف مع الذات","DIMS.compassion.q":"حين أفشل أو أواجه صعوبة، هل أكون لطيفًا مع نفسي أم قاسيًا؟","DIMS.compassion.what":"كيف يعامل الناس أنفسهم في لحظات الفشل والألم: بلطف واتزان، أم بنقد للذات واستغراق في المشاعر.","DIMS.compassion.not":"التعاطف مع الذات ليس كسلًا ولا أنانية ولا خفضًا لمعاييرك.","DIMS.compassion.b.0":"النقد الذاتي قوي. يُقابَل الخطأ على الأرجح باللوم والعزلة والاجترار.","DIMS.compassion.b.1":"لا قسوة شديدة على الذات ولا لطف ثابت بها في الأوقات الصعبة.","DIMS.compassion.b.2":"لطيف ومتّزن مع نفسه في الأوقات الصعبة؛ يتعلّم من الأخطاء دون أن يهاجم نفسه.","DIMS.compassion.tips.0":"بعد الخطأ اسأل نفسك: «ماذا كنت سأقول لصديق في هذا الموقف؟» وقلها لنفسك.","DIMS.compassion.tips.1":"تذكّر أن الأخطاء جزء من تجربة كل إنسان؛ سمِّ شعورك دون أن تغرق فيه.","DIMS.flex.n":"المرونة النفسية","DIMS.flex.q":"هل تبعدني الأفكار والمشاعر الصعبة عمّا هو مهم؟","DIMS.flex.what":"إلى أي حد تعيق الأفكار والمشاعر المزعجة العيش والعمل وفق القيم الشخصية.","DIMS.flex.not":"الدرجة المنخفضة ليست تشخيصًا؛ إنها تعني أن الأفكار والمشاعر الصعبة كثيرًا ما تقف حاليًا بينك وبين ما يهمك.","DIMS.flex.b.0":"تأخذ الأفكار والمشاعر المؤلمة حيزًا كبيرًا، وتعيق على الأرجح أفعالًا مهمة.","DIMS.flex.b.1":"تعيق الأفكار والمشاعر الصعبة أحيانًا، لكن التقدّم نحو ما هو مهم يستمر في الغالب.","DIMS.flex.b.2":"قادر على التحرك نحو ما هو مهم حتى حين تكون المشاعر صعبة.","DIMS.flex.tips.0":"بدل أن تحارب فكرة، قل: «تراودني فكرة أن…» ثم اخطُ الخطوة الصغيرة التالية.","DIMS.flex.tips.1":"قم كل يوم بفعل صغير يتوافق مع قيمك، حتى لو لم تشعر بالاستعداد التام.","DIMS.optim.n":"التفاؤل","DIMS.optim.q":"هل أتوقع عمومًا أن تسير الأمور على ما يرام؟","DIMS.optim.what":"التوقع العام للشخص من المستقبل: أمور جيدة أم سيئة.","DIMS.optim.not":"لا يتعلق بمستقبل المؤسسة أو الرضا الوظيفي؛ إنه سمة شخصية ثابتة نسبيًا.","DIMS.optim.b.0":"يغلب توقع النتائج السيئة؛ وقد تقل الطاقة لإعادة المحاولة.","DIMS.optim.b.1":"توقعات معتدلة بشأن المستقبل؛ لا تفاؤل واضح ول function subScore(instId, sub, ans){
  const I = INST[instId]; let s = 0, n = 0;
  for(const raw of sub.items){ const k = Math.abs(raw) - 1; const a = ans[k]; if(a == null) continue; s += raw < 0 ? (I.max + I.min - a) : a; n++; }
  if(!n) return null;
  const pomp = (s / n - I.min) / (I.max - I.min) * 100;
  return sub.dir === -1 ? 100 - pomp : pomp;
}
function scoreAll(a){ // a: {instId:[answers]}
  const d = {}, sub = {};
  for(const D of DIMS){
    const I = INST[D.inst]; if(!a[D.inst]) continue;
    const vals = D.main.map(m => subScore(D.inst, I.sub.find(s => s.id === m), a[D.inst])).filter(v => v != null);
    d[D.id] = vals.reduce((x, y) => x + y, 0) / vals.length;
    for(const sid of D.subs){ const S = I.sub.find(s => s.id === sid); const v = subScore(D.inst, S, a[D.inst]); if(v != null) sub[D.inst + "." + sid] = v; }
  }
  return {d, sub};
}

const avg = a => { const v = a.filter(x => x != null); return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null; };
function demoData(seed0 = 42, shift = {}){
  let seed = seed0; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const g = () => { let s = 0; for(let i = 0; i < 6; i++) s += rnd(); return (s - 3) / Math.sqrt(.5); };
  const base = {compassion:52, flex:63, optim:58, hope:66, belong:64, flow:50, ei:64, selfctrl:57};
  const off = {staff:{compassion:-4, flow:-9, belong:-5, hope:-3}, lead:{compassion:-8, flex:-6, selfctrl:2}, mid:{compassion:-12, flex:-9, flow:-2, optim:-5}, senior:{flow:12, hope:8, optim:9, belong:6}};
  const n = {staff:96, lead:38, mid:31, senior:15}; const out = [];
  for(const [lv, k] of Object.entries(n)) for(let i = 0; i < k; i++){ const d = {}, sub = {};
    for(const D of DIMS){ d[D.id] = Math.max(2, Math.min(98, base[D.id] + (shift[D.id] || 0) + ((off[lv] || {})[D.id] || 0) + g() * 15));
      D.subs.forEach((s, j) => sub[D.inst + "." + s] = Math.max(2, Math.min(98, d[D.id] + g() * 10 + (j - D.subs.length / 2) * 3))); }

  return out;
}
