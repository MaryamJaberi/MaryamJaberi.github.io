3":"Met en place le questionnaire, protège les données, analyse les réponses, rédige le rapport et coordonne tout, du lancement à la nouvelle mesure.","T.roles.1.1":"Psychologue partenaire","T.roles.1.2":"Expérimenté(e), anime des ateliers pour les organisations","T.roles.1.3":"Vérifie l’interprétation du rapport, participe au débriefing et anime les ateliers choisis par vos équipes.","T.roles.2.1":"Votre personne de contact","T.roles.2.2":"Souvent les RH ou l’office manager","T.roles.2.3":"Planifie avec nous la période de l’enquête, prépare le message aux salariés que la direction enverra et fait le lien avec la direction.","T.roles.3.1":"Salariés","T.roles.3.2":"Les personnes au centre de la démarche","T.roles.3.3":"Décident eux-mêmes de participer, répondent anonymement en 8 à 18 minutes et voient tout de suite leur propre résultat.","T.roles.4.1":"Direction","T.roles.4.2":"Responsable du suivi","T.roles.4.3":"Reçoit le rapport de groupe, en discute lors du débriefing, choisit les prochaines étapes et partage un résumé avec le personnel.","T.roles.5.1":"Conseil d’entreprise","T.roles.5.2":"Si votre organisation en a un","T.roles.5.3":"Est informé à l’avance et donne son accord lorsque la loi l’exige.","T.flowT":"Le déroulé, semaine par semaine","T.flow.0.0":"Semaine 0","T.flow.0.1":"Lancement","T.flow.0.2.1":"Personne de contact","T.flow.0.3":"30 minutes : objectifs, niveaux de fonction et planning. Nous signons l’accord de pilote et l’accord de traitement des données.","T.flow.1.0":"Semaine 0","T.flow.1.1":"Informer le personnel","T.flow.1.2.0":"Direction","T.flow.1.2.1":"Conseil d’entreprise","T.flow.1.3":"La direction envoie le modèle de message : pourquoi ce questionnaire, comment l’anonymat est garanti et ce qui sera fait des résultats.","T.flow.2.0":"Semaines 1–2","T.flow.2.1":"Questionnaire ouvert","T.flow.2.2.0":"Salariés","T.flow.2.3":"Questionnaires anonymes sur téléphone ou ordinateur. Chacun voit immédiatement son résultat. Un rappel à mi-parcours.","T.flow.3.0":"Semaine 3","T.flow.3.1":"Analyse et rapport","T.flow.3.2.1":"Psychologue","T.flow.3.3":"Nous analysons les données de groupe et le psychologue vérifie l’interprétation. Les groupes de moins de 5 personnes restent masqués.","T.flow.4.0":"Semaine 4","T.flow.4.1":"Débriefing","T.flow.4.2.1":"Psychologue","T.flow.4.2.2":"Direction","T.flow.4.3":"45 minutes : ce que signifient les résultats et par quels deux ou trois ateliers commencer.","T.flow.5.0":"Semaine 4","T.flow.5.1":"Retour à l’équipe","T.flow.5.2.0":"Direction","T.flow.5.3":"Un court résumé est envoyé à tous les salariés. Ils ont participé, ils doivent donc savoir ce qu’il en ressort.","T.flow.6.0":"Ensuite","T.flow.6.1":"Ateliers et nouvelle mesure","T.flow.6.2.0":"Psychologue","T.flow.6.3":"Le psychologue anime les ateliers ; une nouvelle mesure après 3 à 6 mois montre si les scores ont évolué.","T.seeT":"Qui voit quoi","T.seeP":"L’anonymat est intégré au processus, pas seulement promis.","T.seeCols.0":"Réponses individuelles (sans nom)","T.seeCols.1":"Rapport de groupe (5 personnes et plus)","T.see.0.0":"Salarié","T.see.0.1":"Seulement les siennes","T.see.0.2":"Résumé","T.see.1.0":"Direction et RH","T.see.1.1":"Jamais","T.see.1.2":"Oui","T.see.2.0":"Psychologue partenaire","T.see.2.1":"Jamais","T.see.2.2":"Oui","T.see.3.1":"Oui, sans nom (e-mail supprimé après l’import)","T.see.3.2":"Oui","T.empT":"Pour les salariés : ce que deviennent vos réponses","T.emp.0":"On ne vous demande jamais votre nom, votre adresse e-mail ou votre numéro de personnel.","T.emp.1":"Votre responsable et les RH ne voient que les résultats de groupes de 5 personnes ou plus.","T.emp.2":"Vous voyez votre propre résultat immédiatement, avec deux conseils pratiques. Personne d’autre que vous ne le voit.","T.emp.3":"La participation est volontaire. Vous pouvez arrêter à tout moment ; vos réponses ne sont utilisées que si vous envoyez votre code de réponse.","T.emp.4":"Si vous envoyez un code de réponse, envoyez-le à SoloNovate, jamais à votre responsable ni aux RH.","T.docsT":"Exemples de documents","T.docsP":"Pour savoir exactement ce que vous signez avant de commencer. Chaque document est disponible en néerlandais et en anglais et peut être imprimé ou enregistré en PDF. Ce sont des projets que nous finalisons ensemble avant le pilote.","T.docs.pilot-agreement.0":"Accord de pilote","T.docs.pilot-agreement.1":"Ce que comprend le pilote, rôles, anonymat, prix, responsabilité.","T.docs.data-processing.0":"Accord de traitement des données","T.docs.data-processing.1":"RGPD art. 28 : quelles données, sécurité, conservation et violations de données.","T.docs.privacy-participants.0":"Notice de confidentialité pour les participants","T.docs.privacy-participants.1":"En langage simple pour les salariés : qui voit quoi et quels sont vos droits.","T.docs.staff-announcement.0":"Annonce au personnel","T.docs.staff-announcement.1":"Modèle de message de la direction, prêt à adapter.","T.aud.mgmt":"Pour la direction","T.aud.staff":"Pour les salariés","T.aud.hr":"Pour les RH","T.open":"Ouvrir (néerlandais / anglais)","T.rMail":"Envoyer le code à SoloNovate par e-mail","T.partT":"Pour les psychologues et les formateurs","T.partP":"Vous animez des ateliers ou du coaching pour des organisations ? Nous constituons un petit réseau de partenaires.","T.partL.0":"Nous nous chargeons de la mesure, du rapport et du contact client ; vous faites ce que vous faites le mieux.","T.partL.1":"Chaque mission commence par des données : vous savez avant la première séance quels thèmes et niveaux de fonction demandent de l’attention.","T.partL.2":"Des trames d’ateliers avec données probantes et sources sont prêtes à l’emploi et adaptables.","T.partL.3":"Vous fixez vos propres tarifs et choisissez les missions que vous acceptez.","T.partAsk":"Nous recherchons une expérience des groupes en organisation, une inscription professionnelle pertinente (par exemple NIP ou BIG) et des ateliers en néerlandais ou en anglais.","T.partCta":"Devenir partenaire","T.partSubj":"Demande de partenariat – Bilan bien-être","T.rvTabs":"Vues du rapport","T.whatL":"Ce que vous voyez","T.howL":"Comment le lire","T.keyL":"Point clé","T.srcL":"Source","T.rv.sum.0":"Synthèse","T.rv.sum.1":"Les principaux résultats en langage simple.","T.rv.sum.2":"Les scores vont de 0 à 100 : 0 est la réponse la plus basse possible à chaque question, 100 la plus haute. Moins de 37,5 = à surveiller, 37,5–62,5 = moyen, plus de 62,5 = solide. Chaque questionnaire a sa propre plage de scores habituelle ; comparez donc une dimension entre niveaux de fonction ou dans le temps plutôt qu’avec les autres dimensions.","T.rv.heat.0":"Par niveau de fonction","T.rv.heat.1":"Le score moyen de chaque niveau de fonction pour chaque dimension.","T.rv.heat.2":"Lisez une ligne pour comparer les niveaux ; lisez une colonne pour voir le profil d’un niveau. Les couleurs chaudes demandent de l’attention, le vert indique un résultat solide. Les groupes de moins de 5 personnes sont masqués.","T.rv.gap.0":"Écarts entre les niveaux","T.rv.gap.1":"Pour chaque dimension : la position de chaque niveau de fonction, du plus bas au plus haut.","T.rv.gap.2":"Une longue ligne signifie que les niveaux de fonction obtiennent des scores très différents. Cela peut refléter les exigences du rôle, mais aussi la façon dont les personnes se répartissent entre les rôles ; discutez-en lors du débriefing avant de tirer des conclusions.","T.rv.dist.0":"Répartition","T.rv.dist.1":"Combien de personnes se situent dans chaque tranche de score, par dimension.","T.rv.dist.2":"Une moyenne peut cacher un groupe en difficulté. La partie rouge est la part des personnes dont le score est « à surveiller ».","T.rv.prof.0":"Profil d’un niveau","T.rv.prof.1":"Un niveau de fonction comparé aux autres niveaux.","T.rv.prof.2":"La barre est le score du niveau, le trait fin la moyenne des autres niveaux. Des écarts inférieurs à environ 5 points ne sont généralement pas significatifs, et pour les niveaux de moins de 20 personnes, même des écarts plus importants peuvent être dus au hasard.","T.rv.sub.0":"Sous-scores","T.rv.sub.1":"Les composantes de chaque dimension.","T.rv.sub.2":"Quand une dimension est basse, cette vue montre quelle composante a le score le plus bas. Les composantes de l’autocompassion reposent chacune sur 2 questions et les auteurs recommandent de n’utiliser que le score total : considérez-les donc comme des pistes de discussion pour le débriefing, pas comme des mesures.","T.rv.time.0":"Évolution","T.rv.time.1":"La première mesure à côté de la nouvelle mesure.","T.rv.time.2":"Barre claire = première mesure, barre foncée = nouvelle mesure. Qu’un changement dépasse le simple hasard dépend de la taille du groupe. Les participants peuvent varier d’une mesure à l’autre et d’autres événements jouent aussi un rôle ; un changement montre donc ce qui a bougé, pas pourquoi.","T.rv.plan.0":"Plan d’action","T.rv.plan.1":"Sur quoi travailler d’abord, pour qui et avec quel atelier.","T.rv.plan.2":"Une dimension est proposée comme priorité quand plus de 25 % des personnes ont un score « à surveiller », ou quand un niveau de fonction comptant 10 personnes ou plus obtient au moins 5 points de moins que les autres niveaux. Nous présentons les trois premières ; les autres figurent sous « À suivre également ». C’est un point de départ pour le débriefing, pas un verdict.","T.kpiSub.0":"personnes ont répondu","T.kpiSub.1":"niveaux de fonction comptant 5 personnes ou plus","T.kpiSub.2":"à aborder en premier lors du débriefing","T.kpiSub.3":"moyenne des huit dimensions","T.sumN":"Sur la base de {n} répondants répartis en {k} niveaux de fonction.","T.sumStrong":"Scores les plus élevés : {a}.","T.sumWeak":"Score le plus bas : {d} ({m}) ; {p} des personnes sont dans la zone « à surveiller ».","T.sumGap":"Plus grand écart entre les niveaux : {d} ({hi} : {a} ; {lo} : {b}).","T.sumNext":"Première étape suggérée : l’atelier « {w} ». Public visé : {who}.","T.and":"et","T.heatKey":"Score le plus bas : {lv} pour {d} ({v}). Le plus haut : {lv2} pour {d2} ({v2}).","T.gapKey":"Plus grand écart : {d} – {lo} {a} contre {hi} {b} ({x} points).","T.distKey":"{d} : {p} des personnes ont un score « à surveiller », alors que le score moyen ({m}) se situe dans la zone « moyen ».","T.profSel":"Niveau de fonction","T.profUp":"Par rapport aux autres niveaux, scores plus élevés pour les {lv} dans les dimensions suivantes : {a}.","T.profDown":"Par rapport aux autres niveaux, scores plus bas pour les {lv} dans les dimensions suivantes : {b}.","T.profFlat":"{lv} : scores proches de ceux des autres niveaux dans toutes les dimensions.","T.orgAvg":"moyenne des autres niveaux","T.subKey":"Aspect le plus bas : {s} ({d}, {v}).","T.timeDemo":"Exemple simulé : nouvelle mesure quatre mois après des ateliers sur l’autocompassion et le flow.","T.timeKey":"Plus grand changement : {d} ({x} points). Avec des groupes de cette taille, des changements inférieurs à environ 5 points peuvent être dus au hasard.","T.timeNone":"Cette vue sera disponible après la nouvelle mesure (3 à 6 mois après les ateliers).","T.t1":"Première mesure","T.t2":"Nouvelle mesure","T.rHow":"Les couleurs indiquent la tranche : rouge = à surveiller, jaune = moyen, vert = solide. Chaque questionnaire a sa propre plage de scores habituelle ; comparez donc une dimension avec elle-même dans le temps plutôt qu’avec les autres dimensions.","T.ariaHome":"Accueil","T.ariaNav":"Rubriques","T.ariaLang":"Langue","T.tUnval":"Ces questions sont notre propre traduction française des questionnaires originaux et n’ont pas encore été validées séparément. Elles sont cotées de la même façon ; leur fiabilité est vérifiée pendant le pilote.","DIMS.compassion.n":"Autocompassion","DIMS.compassion.q":"Quand j’échoue ou que je traverse une difficulté, est-ce que je me traite avec bienveillance ou avec dureté ?","DIMS.compassion.what":"La façon dont on se traite face à l’échec et à la souffrance : avec bienveillance et équilibre, ou avec autocritique et débordement.","DIMS.compassion.not":"L’autocompassion n’est ni de la paresse, ni de l’égoïsme, ni un abaissement de ses exigences.","DIMS.compassion.b.0":"L’autocritique est forte. Les erreurs sont probablement accueillies par des reproches, l’isolement et la rumination.","DIMS.compassion.b.1":"Ni très dur ni toujours bienveillant envers soi dans les moments difficiles.","DIMS.compassion.b.2":"Bienveillant et équilibré envers soi dans les moments difficiles ; apprend de ses erreurs sans s’attaquer soi-même.","DIMS.compassion.tips.0":"Après une erreur, demandez-vous : « Que dirais-je à un ami dans cette situation ? » et dites-le-vous.","DIMS.compassion.tips.1":"Rappelez-vous que les erreurs font partie de l’expérience de tous ; nommez l’émotion sans vous y noyer.","DIMS.flex.n":"Flexibilité psychologique","DIMS.flex.q":"Les pensées et émotions difficiles m’empêchent-elles d’aller vers ce qui compte ?","DIMS.flex.what":"À quel point les pensées et émotions désagréables gênent le fait de vivre et de travailler selon ses valeurs.","DIMS.flex.not":"Un score bas n’est pas un diagnostic ; il signifie qu’en ce moment, des pensées et des émotions difficiles vous empêchent souvent d’aller vers ce qui compte pour vous.","DIMS.flex.b.0":"Les pensées et émotions douloureuses prennent beaucoup de place et bloquent probablement des actions importantes.","DIMS.flex.b.1":"Les pensées et émotions difficiles gênent parfois, mais on continue la plupart du temps d’avancer vers ce qui compte.","DIMS.flex.b.2":"Parvient à aller vers ce qui compte même quand les émotions sont difficiles.","DIMS.flex.tips.0":"Au lieu de combattre une pensée, dites « J’ai la pensée que… » et faites le petit pas suivant.","DIMS.flex.tips.1":"Chaque jour, faites une petite action fidèle à vos valeurs, même si vous ne vous sentez pas tout à fait prêt.","DIMS.optim.n":"Optimisme","DIMS.optim.q":"Est-ce que je m’attends en général à ce que les choses tournent bien ?","DIMS.optim.what":"L’attente générale d’une personne vis-à-vis de l’avenir : de bonnes ou de mauvaises choses.","DIMS.optim.not":"Ne concerne ni l’avenir de l’organisation ni la satisfaction au travail ; un trait personnel plutôt stable.","DIMS.optim.b.0":"L’attente de mauvais résultats domine ; l’énergie pour continuer d’essayer peut être plus faible.","DIMS.optim.b.1":"Attentes modérées face à l’avenir ; ni clairement optimiste ni pessimiste.","DIMS.optim.b.2":"S’attend en général à de bons résultats ; dans les études, cela va de pair avec la persévérance et une meilleure santé.","DIMS.optim.tips.0":"Écrivez quelques minutes sur votre « meilleur moi possible » dans un an ; cet exercice a augmenté l’optimisme dans des études.","DIMS.optim.tips.1":"À côté de chaque inquiétude, écrivez un plan « si cela arrive, je… ».","DIMS.hope.n":"Espoir","DIMS.hope.q":"Ai-je des objectifs, des moyens de les atteindre et l’énergie pour y aller ?","DIMS.hope.what":"L’espoir au sens scientifique : avoir des objectifs, trouver des moyens d’y arriver (chemins) et l’énergie et la conviction de les poursuivre (motivation).","DIMS.hope.not":"Ce n’est pas la même chose que l’optimisme ; l’espoir porte sur sa propre capacité à y arriver.","DIMS.hope.b.0":"Peu de chemins ou d’énergie pour atteindre ses objectifs ; plus de risques de se sentir bloqué.","DIMS.hope.b.1":"Les objectifs et les chemins existent, mais l’énergie baisse face aux obstacles.","DIMS.hope.b.2":"Objectifs clairs, plusieurs chemins et assez d’énergie ; associé dans les études à des performances un peu meilleures.","DIMS.hope.tips.0":"Pour un objectif important, écrivez au moins trois chemins différents.","DIMS.hope.tips.1":"Utilisez WOOP : souhait (Wish), résultat (Outcome), obstacle intérieur (Obstacle) et un plan « si… alors… » (Plan).","DIMS.belong.n":"Appartenance","DIMS.belong.q":"Est-ce que je me sens accepté et membre à part entière du groupe ?","DIMS.belong.what":"Un sentiment général d’appartenance et d’acceptation dans les relations, dans la vie et parmi les autres.","DIMS.belong.not":"Ne concerne pas seulement le travail ; mesure l’appartenance dans l’ensemble de la vie.","DIMS.belong.b.0":"Fort sentiment d’être à l’écart ou rejeté ; dans la recherche, cela va de pair avec un bien-être plus faible.","DIMS.belong.b.1":"Sentiment modéré d’appartenance et d’acceptation ; ni fortement relié aux autres, ni nettement à l’écart.","DIMS.belong.b.2":"Se sent accepté et relié aux autres ; un pilier important de la santé mentale.","DIMS.belong.tips.0":"Cette semaine, ayez une courte conversation avec un collègue qui ne porte pas sur le travail.","DIMS.belong.tips.1":"Demandez à quelqu’un de vous associer à une tâche ou un projet ; demander de l’aide crée aussi du lien.","DIMS.flow.n":"Flow au travail","DIMS.flow.q":"Mon travail m’absorbe-t-il, me plaît-il, et est-ce que je le fais pour lui-même ?","DIMS.flow.what":"Le flow au travail au cours des deux dernières semaines : absorption, plaisir et motivation intrinsèque.","DIMS.flow.not":"Ne mesure ni l’effort ni les heures, mais la qualité de l’expérience de travail.","DIMS.flow.b.0":"Le travail absorbe ou plaît moins ; les interruptions ou le manque de sens sont peut-être élevés.","DIMS.flow.b.1":"L’absorption, le plaisir et la motivation au travail sont modérés.","DIMS.flow.b.2":"Absorbé par son travail, y prend plaisir et est motivé de l’intérieur ; associé à de meilleures performances et à du sens.","DIMS.flow.tips.0":"Bloquez chaque jour un créneau de 60 à 90 minutes de travail concentré, sans messages ni réunions.","DIMS.flow.tips.1":"Remodelez une partie de votre poste pour qu’elle corresponde mieux à vos forces et intérêts (job crafting).","DIMS.ei.n":"Intelligence émotionnelle","DIMS.ei.q":"Est-ce que je comprends et gère mes émotions et celles des autres ?","DIMS.ei.what":"La façon dont les personnes évaluent leurs compétences pour comprendre et gérer les émotions, chez elles et chez les autres.","DIMS.ei.not":"Une auto-évaluation, pas un test d’aptitude ; peut différer de la compétence réelle.","DIMS.ei.b.0":"Se perçoit comme moins habile pour reconnaître ou gérer les émotions.","DIMS.ei.b.1":"Juge ses propres compétences émotionnelles moyennes.","DIMS.ei.b.2":"Se perçoit comme capable de comprendre et de gérer les émotions, chez soi et chez les autres.","DIMS.ei.tips.0":"Trois fois par jour, donnez un nom précis à votre émotion (« agacé » plutôt que « mal »).","DIMS.ei.tips.1":"Quand un collègue est contrarié, reformulez d’abord (« tu as l’air fatigué »), puis proposez des solutions.","DIMS.selfctrl.n":"Maîtrise de soi","DIMS.selfctrl.q":"Est-ce que je résiste aux tentations et reste fidèle à mes objectifs à long terme ?","DIMS.selfctrl.what":"La façon dont chacun évalue sa propre capacité à contrôler ses impulsions, à résister aux tentations et à rester fidèle à ses objectifs à long terme.","DIMS.selfctrl.not":"Un score bas ne signifie pas une volonté faible ; l’environnement et les habitudes jouent un grand rôle.","DIMS.selfctrl.b.0":"Les tentations et distractions l’emportent souvent ; modifier son environnement et ses habitudes aide souvent davantage que de redoubler d’efforts.","DIMS.selfctrl.b.1":"Maîtrise de soi auto-évaluée comme moyenne ; les objectifs à long terme l’emportent une partie du temps.","DIMS.selfctrl.b.2":"Tient généralement ses objectifs à long terme ; dans la recherche, cela va souvent de pair avec de bonnes habitudes.","DIMS.selfctrl.tips.0":"Aménagez votre environnement : mettez votre téléphone dans une autre pièce pendant le travail concentré.","DIMS.selfctrl.tips.1":"Associez une tâche difficile à un petit plaisir (par ex. votre podcast préféré uniquement en marchant).","WS.w-comp.t":"L’autocompassion et le critique intérieur","WS.w-comp.who":"Tous niveaux ; version managers : leadership bienveillant","WS.w-comp.goals.0":"Reconnaître le critique intérieur et ce qu’il coûte","WS.w-comp.goals.1":"Pratiquer les trois composantes de l’autocompassion : bienveillance envers soi, humanité partagée, pleine conscience","WS.w-comp.goals.2":"Gérer les erreurs en équipe sans humilier","WS.w-comp.ev":"Une méta-analyse de 27 essais randomisés a montré des effets modérés des programmes d’autocompassion, le plus souvent étalés sur plusieurs semaines, sur l’autocritique et le stress. Les effets d’un atelier en deux séances sont probablement plus faibles.","WSLEN.w-comp":"2 × 3 heures","WS.w-flex.t":"Flexibilité psychologique et régulation émotionnelle","WS.w-flex.who":"Tous niveaux, en particulier les postes à forte pression","WS.w-flex.goals.0":"Prendre du recul par rapport à ses pensées sans les combattre","WS.w-flex.goals.1":"Clarifier ses valeurs au travail","WS.w-flex.goals.2":"Le modèle processuel de la régulation émotionnelle et quatre stratégies proactives","WS.w-flex.ev":"Une méta-analyse de 17 essais en milieu de travail portant sur des formations d’acceptation et d’engagement (ACT) a montré des baisses faibles à modérées de la détresse et des gains en flexibilité psychologique ; les effets étaient les plus nets chez les employés de bureau et faibles chez le personnel soignant.","WSLEN.w-flex":"2 × 3 heures","WS.w-hope.t":"Espoir et optimisme réaliste","WS.w-hope.who":"Tous niveaux ; adapté aux périodes de changement organisationnel","WS.w-hope.goals.0":"L’exercice du « meilleur moi possible »","WS.w-hope.goals.1":"WOOP et les plans « si… alors… »","WS.w-hope.goals.2":"Le principe du progrès : remarquer les petites victoires","WS.w-hope.ev":"WOOP (contraste mental avec plans « si… alors… ») a un effet faible à moyen sur l’atteinte des objectifs ; l’exercice du meilleur moi possible augmente modestement l’optimisme.","WSLEN.w-hope":"1 × 4 heures","WS.w-belong.t":"Appartenance et lien au travail","WS.w-belong.who":"Les équipes avec leurs responsables","WS.w-belong.goals.0":"Des contacts faciles à engager : de courts échanges réguliers et une reconnaissance sincère entre collègues","WS.w-belong.goals.1":"Programmes d’intégration et de parrainage pour les nouveaux","WS.w-belong.goals.2":"Compter pour les autres : être vu et apporter de la valeur","WS.w-belong.ev":"De courtes interventions sur l’appartenance ont amélioré les résultats d’étudiants à l’université, mais une vaste réplication de 2023 n’a trouvé d’effets que là où l’environnement offrait de réelles possibilités d’appartenance. Il n’existe pas encore d’essais comparables en milieu de travail ; l’atelier associe donc cette idée à des pratiques d’intégration et de parrainage (buddy).","WSLEN.w-belong":"1 × 3 heures + programme d’équipe","WS.w-flow.t":"Travail concentré, flow et déconnexion","WS.w-flow.who":"Tous niveaux ; version managers : protéger le temps de concentration des équipes","WS.w-flow.goals.0":"Job crafting : remodeler son poste par soi-même","WS.w-flow.goals.1":"Plages de concentration sans interruption","WS.w-flow.goals.2":"Déconnexion psychologique après les heures de travail","WS.w-flow.ev":"Des méta-analyses associent le job crafting à un engagement plus élevé et la déconnexion après le travail à moins d’épuisement ; ces données sont surtout corrélationnelles.","WSLEN.w-flow":"1 × 4 heures","WS.w-ei.t":"L’intelligence émotionnelle en pratique","WS.w-ei.who":"Postes en contact avec les clients, managers et encadrants","WS.w-ei.goals.0":"Nommer précisément les émotions","WS.w-ei.goals.1":"Répondre aux émotions des collègues et des clients","WS.w-ei.goals.2":"Travail émotionnel : reconnaître ce qu’il coûte","WS.w-ei.ev":"En moyenne, la formation à l’IE augmente modérément les scores d’IE ; l’IE auto-évaluée recoupe la personnalité, il faut donc lire les scores avec prudence.","WSLEN.w-ei":"2 × 3 heures","WS.w-self.t":"La maîtrise de soi par l’aménagement : environnement, habitudes et association de tentations","WS.w-self.who":"Tous niveaux ; version managers : nudges et choix par défaut sains","WS.w-self.goals.0":"Choisir et modifier les situations plutôt que forcer la volonté","WS.w-self.goals.1":"Construire des habitudes et des rappels","WS.w-self.goals.2":"Association de tentations (lier un petit plaisir à une corvée) et réserves d’urgence (jours d’exception prévus)","WS.w-self.ev":"Selon les revues de la littérature, agir sur la situation fonctionne mieux que compter sur la volonté sur le moment ; l’association de tentations (temptation bundling) a aidé dans une expérience de terrain, mais l’effet s’est estompé avec le temps.","WSLEN.w-self":"1 × 4 heures","LEVELS.staff":"Collaborateurs","LEVELS.lead":"Chefs d’équipe","LEVELS.mid":"Cadres intermédiaires","LEVELS.senior":"Cadres dirigeants","LEVELS.student":"Étudiants","SUBN.scs.sk":"Bienveillance envers soi","SUBN.scs.sj":"Ne pas être trop autocritique","SUBN.scs.ch":"Humanité partagée","SUBN.scs.is":"Ne pas vivre ses difficultés dans l’isolement","SUBN.scs.mi":"Pleine conscience","SUBN.scs.oi":"Ne pas se laisser emporter par ses émotions","SUBN.ahs.path":"Chemins (moyens d’atteindre ses objectifs)","SUBN.ahs.agency":"Motivation (énergie tournée vers les objectifs)","SUBN.gbs.acc":"Acceptation / inclusion","SUBN.gbs.rej":"Moins de rejet","SUBN.wolf.abs":"Absorption","SUBN.wolf.enj":"Plaisir au travail","SUBN.wolf.int":"Motivation intrinsèque","SUBN.sreis.p":"Percevoir les émotions","SUBN.sreis.u":"Utiliser les émotions","SUBN.sreis.r":"Comprendre les émotions","SUBN.sreis.m1":"Gérer ses propres émotions","SUBN.sreis.m2":"Gérer les émotions des autres","PACKS.quick":"Courte","PACKS.standard":"Complète","INST.scs.name":"Échelle d’autocompassion – forme courte","INST.scs.intro":"Comment vous comportez-vous habituellement envers vous-même dans les moments difficiles ?","INST.scs.anchors.0":"Presque jamais","INST.scs.anchors.4":"Presque toujours","INST.scs.items.0":"Quand j’échoue dans quelque chose d’important pour moi, je suis envahi par le sentiment de ne pas être à la hauteur.","INST.scs.items.1":"J’essaie d’être compréhensif et patient envers les aspects de ma personnalité que je n’aime pas.","INST.scs.items.2":"Quand quelque chose de douloureux arrive, j’essaie d’avoir une vision équilibrée de la situation.","INST.scs.items.3":"Quand je n’ai pas le moral, j’ai tendance à penser que la plupart des autres sont probablement plus heureux que moi.","INST.scs.items.4":"J’essaie de voir mes faiblesses comme faisant partie de la condition humaine.","INST.scs.items.5":"Quand je traverse une période très difficile, je m’accorde la bienveillance et la tendresse dont j’ai besoin.","INST.scs.items.6":"Quand quelque chose me contrarie, j’essaie de garder mes émotions en équilibre.","INST.scs.items.7":"Quand j’échoue dans quelque chose d’important pour moi, j’ai tendance à me sentir seul dans mon échec.","INST.scs.items.8":"Quand je n’ai pas le moral, j’ai tendance à ressasser et à me focaliser sur tout ce qui ne va pas.","INST.scs.items.9":"Quand je ne me sens pas à la hauteur d’une manière ou d’une autre, j’essaie de me rappeler que la plupart des gens éprouvent ce sentiment.","INST.scs.items.10":"Je désapprouve et je juge sévèrement mes propres défauts et lacunes.","INST.scs.items.11":"Je suis intolérant et impatient envers les aspects de ma personnalité que je n’aime pas.","INST.aaq.name":"Questionnaire d’acceptation et d’action II (AAQ-II)","INST.aaq.intro":"Dans quelle mesure chaque affirmation est-elle vraie pour vous ?","INST.aaq.anchors.0":"Jamais vrai","INST.aaq.anchors.6":"Toujours vrai","INST.aaq.items.0":"Mes expériences et souvenirs douloureux font qu’il m’est difficile de mener une vie qui ait de la valeur à mes yeux.","INST.aaq.items.1":"J’ai peur de mes émotions.","INST.aaq.items.2":"Je m’inquiète de ne pas pouvoir contrôler mes inquiétudes et mes émotions.","INST.aaq.items.3":"Mes souvenirs douloureux m’empêchent d’avoir une vie épanouie.","INST.aaq.items.4":"Les émotions me causent des problèmes dans ma vie.","INST.aaq.items.5":"J’ai l’impression que la plupart des gens gèrent leur vie mieux que moi.","INST.aaq.items.6":"Les inquiétudes font obstacle à ma réussite.","INST.lot.name":"Test d’orientation de vie – révisé (LOT-R)","INST.lot.intro":"Dans quelle mesure êtes-vous d’accord avec chaque affirmation ?","INST.lot.anchors.0":"Pas du tout d’accord","INST.lot.anchors.1":"Pas d’accord","INST.lot.anchors.2":"Ni d’accord ni pas d’accord","INST.lot.anchors.3":"D’accord","INST.lot.anchors.4":"Tout à fait d’accord","INST.lot.items.0":"Dans les périodes d’incertitude, je m’attends généralement au meilleur.","INST.lot.items.1":"Il m’est facile de me détendre.","INST.lot.items.2":"Si quelque chose peut mal tourner pour moi, cela arrivera.","INST.lot.items.3":"Je suis toujours optimiste quant à mon avenir.","INST.lot.items.4":"J’apprécie beaucoup mes amis.","INST.lot.items.5":"Il est important pour moi de rester occupé.","INST.lot.items.6":"Je ne m’attends presque jamais à ce que les choses se passent comme je le veux.","INST.lot.items.7":"Je ne m’énerve pas trop facilement.","INST.lot.items.8":"Je compte rarement sur le fait que de bonnes choses m’arrivent.","INST.lot.items.9":"Dans l’ensemble, je m’attends à ce qu’il m’arrive plus de bonnes choses que de mauvaises.","INST.ahs.name":"Échelle d’espoir pour adultes (AHS)","INST.ahs.intro":"Dans quelle mesure chaque affirmation est-elle vraie pour vous ?","INST.ahs.anchors.0":"Tout à fait faux","INST.ahs.anchors.7":"Tout à fait vrai","INST.ahs.items.0":"Je peux trouver de nombreux moyens de me sortir d’un mauvais pas.","INST.ahs.items.1":"Je poursuis mes objectifs avec énergie.","INST.ahs.items.2":"Je me sens fatigué la plupart du temps.","INST.ahs.items.3":"Il existe de nombreux moyens de venir à bout de n’importe quel problème.","INST.ahs.items.4":"Dans une discussion, on a facilement le dessus sur moi.","INST.ahs.items.5":"Je peux trouver de nombreux moyens d’obtenir ce qui est important pour moi dans la vie.","INST.ahs.items.6":"Je m’inquiète pour ma santé.","INST.ahs.items.7":"Même quand les autres se découragent, je sais que je peux trouver un moyen de résoudre le problème.","INST.ahs.items.8":"Mes expériences passées m’ont bien préparé à mon avenir.","INST.ahs.items.9":"J’ai plutôt bien réussi dans la vie.","INST.ahs.items.10":"Je me surprends généralement à m’inquiéter de quelque chose.","INST.ahs.items.11":"J’atteins les objectifs que je me fixe.","INST.gbs.name":"Échelle générale d’appartenance (GBS)","INST.gbs.intro":"Dans quelle mesure êtes-vous d’accord avec chaque affirmation ?","INST.gbs.anchors.0":"Pas du tout d’accord","INST.gbs.anchors.6":"Tout à fait d’accord","INST.gbs.items.0":"Quand je suis avec d’autres personnes, je me sens inclus.","INST.gbs.items.1":"J’ai des liens étroits avec ma famille et mes amis.","INST.gbs.items.2":"Je me sens à l’écart.","INST.gbs.items.3":"J’ai l’impression que les gens ne se soucient pas de moi.","INST.gbs.items.4":"Je me sens accepté par les autres.","INST.gbs.items.5":"Parce que je n’ai pas ma place, je me sens loin des autres pendant la période des fêtes.","INST.gbs.items.6":"Je me sens isolé du reste du monde.","INST.gbs.items.7":"J’ai un sentiment d’appartenance.","INST.gbs.items.8":"Quand je suis avec d’autres personnes, je me sens comme un étranger.","INST.gbs.items.9":"J’ai ma place parmi les autres.","INST.gbs.items.10":"Je me sens en lien avec les autres.","INST.gbs.items.11":"Mes amis et ma famille ne m’associent pas à leurs projets.","INST.wolf.name":"Inventaire du flow au travail (WOLF)","INST.wolf.intro":"Au cours des deux dernières semaines, à quelle fréquence avez-vous vécu chacune de ces situations ?","INST.wolf.anchors.0":"Jamais","INST.wolf.anchors.1":"Presque jamais","INST.wolf.anchors.2":"Parfois","INST.wolf.anchors.3":"Régulièrement","INST.wolf.anchors.4":"Souvent","INST.wolf.anchors.5":"Très souvent","INST.wolf.anchors.6":"Toujours","INST.wolf.items.0":"Quand je travaille, je ne pense à rien d’autre.","INST.wolf.items.1":"Je me laisse emporter par mon travail.","INST.wolf.items.2":"Quand je travaille, j’oublie tout ce qui m’entoure.","INST.wolf.items.3":"Je suis totalement plongé dans mon travail.","INST.wolf.items.4":"Mon travail me procure un sentiment agréable.","INST.wolf.items.5":"Je fais mon travail avec beaucoup de plaisir.","INST.wolf.items.6":"Je me sens heureux pendant mon travail.","INST.wolf.items.7":"Je me sens joyeux quand je travaille.","INST.wolf.items.8":"Je ferais ce travail même si j’étais moins payé.","INST.wolf.items.9":"Je constate que j’ai aussi envie de travailler pendant mon temps libre.","INST.wolf.items.10":"Je travaille parce que j’aime ça.","INST.wolf.items.11":"Quand je travaille sur quelque chose, je le fais pour moi-même.","INST.wolf.items.12":"Ma motivation vient du travail lui-même, et non de sa récompense.","INST.sreis.name":"Échelle d’intelligence émotionnelle auto-évaluée (SREIS)","INST.sreis.intro":"Dans quelle mesure chaque affirmation vous décrit-elle fidèlement ?","INST.sreis.anchors.0":"Très inexact","INST.sreis.anchors.1":"Plutôt inexact","INST.sreis.anchors.2":"Ni exact ni inexact","INST.sreis.anchors.3":"Plutôt exact","INST.sreis.anchors.4":"Très exact","INST.sreis.items.0":"En regardant l’expression du visage des gens, je reconnais les émotions qu’ils ressentent.","INST.sreis.items.1":"Je suis une personne rationnelle et je consulte rarement, voire jamais, mes émotions pour prendre une décision.","INST.sreis.items.2":"J’ai un vocabulaire riche pour décrire mes émotions.","INST.sreis.items.3":"J’ai du mal à gérer ma colère.","INST.sreis.items.4":"Quand une personne que je connais est de mauvaise humeur, je peux l’aider à se calmer et à se sentir mieux rapidement.","INST.sreis.items.5":"Je suis conscient des messages non verbaux qu’envoient les autres.","INST.sreis.items.6":"Quand je prends une décision, j’écoute mes émotions pour voir si la décision me semble juste.","INST.sreis.items.7":"Je trouve facilement de nombreux synonymes pour des mots d’émotion comme le bonheur et la tristesse.","INST.sreis.items.8":"Je peux faire face à des situations stressantes sans devenir trop nerveux.","INST.sreis.items.9":"Je connais des stratégies pour mettre les autres de bonne humeur ou améliorer leur humeur.","INST.sreis.items.10":"En regardant l’expression du visage des gens, je peux dire s’ils sont honnêtes avec moi.","INST.sreis.items.11":"Je suis une personne rationnelle et je n’aime pas m’appuyer sur mes émotions pour prendre des décisions.","INST.sreis.items.12":"J’ai les mots pour décrire comment les émotions vont du simple au complexe.","INST.sreis.items.13":"Je suis capable de faire face à la plupart des problèmes qui me bouleversent.","INST.sreis.items.14":"Je ne suis pas très doué pour aider les autres à se sentir mieux quand ils sont en colère ou tristes.","INST.sreis.items.15":"Mes premières impressions sur ce que ressentent les autres sont souvent fausses.","INST.sreis.items.16":"Par rapport à la plupart des gens, j’ai un vocabulaire plus riche pour décrire les sentiments.","INST.sreis.items.17":"Je sais rester calme dans des situations difficiles ou stressantes.","INST.sreis.items.18":"Je suis le genre de personne vers qui les autres se tournent quand ils ont besoin d’aide dans une situation difficile.","INST.bscs.name":"Échelle brève de maîtrise de soi (BSCS)","INST.bscs.intro":"Dans quelle mesure chaque affirmation reflète-t-elle votre façon d’être habituelle ?","INST.bscs.anchors.0":"Pas du tout","INST.bscs.anchors.4":"Tout à fait","INST.bscs.items.0":"Je sais bien résister aux tentations.","INST.bscs.items.1":"J’ai du mal à me défaire de mauvaises habitudes.","INST.bscs.items.2":"Je suis paresseux.","INST.bscs.items.3":"Je dis des choses inappropriées.","INST.bscs.items.4":"Je fais certaines choses qui sont mauvaises pour moi, si elles sont amusantes.","INST.bscs.items.5":"Je refuse les choses qui sont mauvaises pour moi.","INST.bscs.items.6":"J’aimerais avoir plus d’autodiscipline.","INST.bscs.items.7":"Les gens diraient que j’ai une autodiscipline de fer.","INST.bscs.items.8":"Le plaisir et l’amusement m’empêchent parfois de faire mon travail.","INST.bscs.items.9":"J’ai du mal à me concentrer.","INST.bscs.items.10":"Je suis capable de travailler efficacement à atteindre des objectifs à long terme.","INST.bscs.items.11":"Parfois, je ne peux pas m’empêcher de faire quelque chose, même si je sais que ce n’est pas bien.","INST.bscs.items.12":"J’agis souvent sans avoir réfléchi à toutes les possibilités.","LABELS.s2":"Autocompassion","LABELS.s3":"De l’autoreproche à l’autocompassion","LABELS.compassion":"Bibliothèque : compassion et autocritique","LABELS.s4":"L’énigme de la régulation émotionnelle","LABELS.s7":"Se changer soi-même plutôt que son environnement","LABELS.shelf13":"Bibliothèque : thérapie fondée sur les processus et agilité émotionnelle","LABELS.s9":"Optimisme et espoir en l’avenir","LABELS.riseabove":"Rise Above (Kaufman, 2024) : de la mentalité de victime à la croissance","LABELS.s10":"Sous-cultures organisationnelles et motivation","LABELS.s8":"Réévaluation, épuisement de l’ego et états d’esprit","LABELS.mattering":"Comment on en vient à compter pour les autres","LABELS.s11":"Vider son sac : quand est-ce que parler aide ?","LABELS.s13":"Motivation : externe, introjectée et intrinsèque","LABELS.s15":"Émotions positives, loisirs et partage des bonnes nouvelles","LABELS.s14":"Intelligence émotionnelle : aptitude, trait ou mélange ?","LABELS.s5":"Maîtrise de soi et choix des situations","LABELS.s6":"Choisir et modifier son environnement","LABELS.s12":"Perfectionnisme : excellent mais sous pression","REFS.nea25":"21 % des salariés déclarent des symptômes d’épuisement professionnel","REFS.who22":"12 milliards de journées de travail perdues chaque année à cause de la dépression et de l’anxiété","REFS.icd11":"l’épuisement professionnel classé comme phénomène lié au travail","REFS.cbs26":"taux d’absentéisme de 5,4 % en 2025 ; 9 % des salariés absents citent des troubles psychologiques ou un épuisement","REFS.tno24":"les absences pour troubles psychologiques durent en moyenne 63 jours ouvrés ; 75 % sont (en partie) liées au travail","REFS.arbo24":"8,3 Md€ pour l’absentéisme (en partie) lié au travail en 2023, dont 4,9 Md€ dus à la charge psychosociale","REFS.arbo18":"environ un quart des jours d’absence est lié à des troubles psychologiques, au surmenage ou à l’épuisement","REFS.mkb":"en moyenne 250 € à 400 € par jour d’absence","REFS.arbowet":"art. 3, al. 2 : politique de prévention ou de limitation de la charge psychosociale ; art. 5 : inventaire et évaluation des risques (RI&E) avec plan d’action","REFS.arbobes":"art. 2.15 : évaluer les risques liés à la charge psychosociale dans la RI&E et prévoir des mesures dans le plan d’action","REFS.arboportaal":"information officielle sur la charge psychosociale au travail","REFS.wor":"art. 27 : droit d’approbation du conseil d’entreprise, notamment pour les enquêtes auprès du personnel et la politique des conditions de travail","REFS.gdpr":"Règlement général sur la protection des données (RGPD)","T.rStrRel":"Là où vos scores sont les plus élevés aujourd’hui","T.rCodeShow":"Afficher le code","T.rDetailNote":"Les composantes qui reposent sur 2 à 4 questions seulement sont indicatives.","T.meName":"Maryam Jaberi","T.allLv":"tous les niveaux de fonction (aucun niveau n’a un score nettement plus bas)","T.planNote":"Avant de choisir des ateliers, vérifiez avec votre RI&E ou votre enquête sur les conditions de travail si la charge de travail, l’autonomie ou le soutien expliquent ces tendances. Si c’est le cas, traitez-les d’abord.","T.print":"Imprimer / enregistrer en PDF","T.fHint":"Ouvre votre messagerie avec cette demande déjà remplie. Pas de logiciel de messagerie ? Écrivez à {e}.","T.rStrNote":"Aucun de vos scores ne se situe encore dans la zone « solide » ; ce sont simplement vos scores les plus élevés aujourd’hui.","T.pWhyLow":"{p} des personnes ont un score « à surveiller ».","T.pWhyGap":"{lv} : score inférieur de {x} points à celui des autres niveaux.","T.pAlso":"À suivre également","T.pScopeBelong":"Remarque : cette échelle mesure l’appartenance dans l’ensemble de la vie, pas seulement au travail ; examinez les causes liées au travail lors du débriefing.","T.pScopeOptim":"Remarque : l’optimisme est un trait assez stable ; attendez-vous à des changements modestes et examinez d’abord les conditions de travail."},"es":{"T.proto":"Versión piloto: ya disponible para un primer piloto en su organización.","T.brand":"Chequeo de bienestar para organizaciones","T.brandShort":"Chequeo de bienestar","T.by":"Inspirado en el curso «Competencias personales y humanas en organizaciones y centros educativos» del Dr. Azarakhsh Mokri","T.nHome":"Resumen","T.nTake":"Responder el cuestionario","T.nReport":"Informe de la organización","T.nWs":"Talleres","T.nMethod":"Método","T.heroK":"Para organizaciones basadas en el conocimiento · pilotos a partir de 20 participantes","T.heroT":"Vea con qué recursos psicológicos cuentan sus equipos, por nivel de puesto, y por dónde empezar.","T.heroP":"Los empleados responden de forma anónima ocho cuestionarios científicos publicados en 8 a 18 minutos y ven su propio resultado al instante. Su organización recibe un informe de grupo por nivel de puesto, con una interpretación en lenguaje claro y un plan de dos o tres talleres recomendados.","T.ctaTake":"Empezar el cuestionario","T.ctaDemo":"Ver un informe de ejemplo","T.f1":"8 dimensiones","T.f1s":"8 cuestionarios publicados, validados en su idioma original","T.f2":"Anónimo","T.f2s":"Sin nombres; los grupos de menos de 5 nunca se muestran","T.f3":"9 idiomas","T.f3s":"Español, inglés, neerlandés, alemán, francés, polaco, turco, árabe y persa","T.measT":"Qué medimos","T.measP":"Cada dimensión responde a una pregunta sencilla. Toque una tarjeta para ver qué mide y qué no.","T.whatIs":"Qué mide","T.whatNot":"Tenga en cuenta","T.privT":"La privacidad, primero","T.priv.0":"No se piden nombres, correos electrónicos ni números de empleado.","T.priv.1":"Junto con sus respuestas solo se guardan su nivel de puesto, el mes y la versión del cuestionario "Sus respuestas se registraron de forma anónima. ¡Gracias!","T.rCode":"Código de respuesta","T.rCodeP":"Copie este código y envíelo por correo electrónico a SoloNovate, no a su responsable ni a Recursos Humanos. Solo contiene sus respuestas, su nivel de puesto y el mes, no su nombre. Como llega por correo electrónico, SoloNovate ve brevemente su dirección de correo; nunca la guardamos junto con sus respuestas y borramos el correo después de importar el código.","T.rCopy":"Copiar código","T.rCopied":"Copiado","T.rCare":"Si lleva un tiempo con el ánimo bajo o siente que no puede con todo, hable con el médico de empresa, su médico de cabecera o un psicólogo. Pedir ayuda es una señal de fortaleza.","T.rNot":"Este resultado es una instantánea de sus respuestas de hoy, no una etiqueta ni un diagnóstico.","T.band.0":"Requiere atención","T.band.1":"Moderado","T.band.2":"Sólido","T.pT":"Informe de la organización","T.pP":"Los recursos psicológicos de su organización por nivel de puesto, con prioridades y talleres recomendados.","T.pSrc":"Datos del informe","T.pDemo":"Datos de ejemplo (demostración)","T.pLive":"Respuestas reales de esta ronda","T.pImport":"Importar códigos de respuesta","T.pImportP":"Pegue aquí los códigos de respuesta (uno por línea).","T.pImportGo":"Añadir","T.pAdded":"respuestas añadidas","T.pN":"Participantes","T.pLevels":"Niveles","T.pAvg":"Dimensión más baja","T.pLowShare":"Porcentaje en «requiere atención»","T.pNoPri":"Ninguna dimensión alcanza el umbral de prioridad. Sugerencia: talleres de refuerzo para mantener las fortalezas.","T.pWhy":"Por qué","T.pFor":"Sobre todo para","T.pStrengths":"Fortalezas de la organización","T.pGap":"Mayor diferencia entre niveles","T.pHidden":"menos de 5","T.pNone":"Todavía no hay respuestas.","T.pExport":"Copiar datos resumidos (CSV)","T.pAdmin":"Gestionar rondas","T.pAdminP":"Para la persona que coordina el cuestionario en la organización. Cree una ronda y envíe el enlace a los empleados.","T.pOrg":"Nombre de la organización","T.pRoundName":"Título de la ronda","T.pCreate":"Crear ronda","T.pRounds":"Rondas","T.pChoose":"Elegir ronda","T.pNoAdmin":"Solo quienes coordinan el cuestionario (editores de esta página) pueden crear rondas y ver respuestas reales. Los demás pueden ver el informe de ejemplo o importar códigos de respuesta.","T.pDemoNote":"Este informe usa datos simulados de 180 personas para que vea cómo es un informe real.","T.wT":"Talleres","T.wP":"Cada taller se centra en una o dos dimensiones y se basa en el material del curso del Dr. Mokri. Los enlaces de lectura abren las páginas del wiki del curso; los títulos están traducidos aquí, pero las páginas están en persa.","T.wGoals":"Objetivos","T.wWho":"Público","T.wLen":"Duración","T.wEv":"Evidencia","T.wRead":"Lectura de fondo en el wiki del curso (páginas en persa)","T.mT":"Método","T.mP":"Transparencia sobre qué medimos, cómo puntuamos y dónde están los límites.","T.mInst":"Cuestionarios","T.mScore":"Puntuación","T.mScoreP":"La media de cada subescala se convierte a un rango de 0 a 100: (media − mínimo) ÷ (máximo − mínimo) × 100. Los ítems invertidos se recodifican primero. Cuando una puntuación alta en el cuestionario original significa más dificultad (p. ej. AAQ-II), se invierte para que en todas partes «más alto = mejor».","T.mBands":"Franjas de puntuación","T.mBandsP":"Menos de 37,5: requiere atención · de 37,5 a 62,5: moderado · más de 62,5: sólido. Estos umbrales siguen la convención usada para la Self-Compassion Scale (respuesta media inferior a 2,5 o superior a 3,5 en una escala de 1 a 5) y, por simplicidad, se aplican a todas las escalas. No son normas poblacionales ni puntos de corte clínicos, y las puntuaciones habituales varían de un cuestionario a otro.","T.mLim":"Limitaciones","T.mLimL.0":"Todos los cuestionarios son de autoinforme y pueden verse afectados por el estado de ánimo del día o por el deseo de dar buena imagen.","T.mLimL.1":"Las franjas no se basan en normas poblacionales; las comparaciones dentro de la organización y a lo largo del tiempo son más válidas que la comparación con una «media nacional».","T.mLimL.2":"Los cuestionarios están validados en su idioma original y los ítems en inglés siguen la redacción original. Las versiones en otros idiomas usadas aquí, incluida esta en español, no se han validado por separado en esta forma; su fiabilidad se comprueba en el piloto. Para investigación, utilice las versiones validadas oficialmente (véase Fuentes).","T.mLimL.3":"Esta herramienta no está diseñada para tomar decisiones sobre personas (contratación, evaluación del desempeño) y no debe usarse con ese fin.","T.mEth":"Ética y privacidad","T.mEthL.0":"La participación es voluntaria y puede interrumpirse en cualquier momento.","T.mEthL.1":"Solo se registra el mes, no la fecha ni la hora exactas.","T.mEthL.2":"Los informes son solo grupales, con un tamaño mínimo de grupo de 5.","T.mEthL.3":"Los resultados personales solo se muestran en el dispositivo de quien responde.","T.mCourse":"Este servicio nació del curso «Competencias personales y humanas en organizaciones y centros educativos» del Dr. Azarakhsh Mokri. De los cuestionarios tratados en él, elegimos ocho que son breves, están publicados, no usan etiquetas clínicas y se vinculan cada uno a una competencia que se puede entrenar.","T.mWiki":"Wiki completo del curso (persa)","T.mOrgPsy":"Psicología del trabajo y de las organizaciones","T.items":"ítems","T.scale":"Escala","T.ref":"Referencia","T.session":"Página wiki del curso (en persa)","T.footer":"Chequeo de bienestar para organizaciones de SoloNovate · versión piloto · sin fines diagnósticos","T.dims":"dimensiones","T.whyT":"Por qué importa","T.whyP":"La salud psicológica no es un tema menor: se nota en el absentismo, la rotación y la calidad del trabajo. Este chequeo no mide esos problemas; mide los recursos psicológicos que ayudan a las personas a afrontar la presión en el trabajo.","T.why.0.0":"1 de cada 5","T.why.0.1":"trabajadores en los Países Bajos declara síntomas de agotamiento laboral (21 % en 2025, encuesta nacional NEA).","T.why.1.0":"12 000 millones","T.why.1.1":"de días laborables se pierden cada año en el mundo por depresión y ansiedad, con un coste de alrededor de un billón de dólares en productividad.","T.why.2.0":"Laboral","T.why.2.1":"La OMS clasifica el agotamiento laboral (CIE-11) como un fenómeno ocupacional: un problema del trabajo, no solo personal.","T.getT":"Qué recibe su organización","T.get.0.0":"Un informe por nivel de puesto","T.get.0.1":"Ocho dimensiones por nivel, con fortalezas, prioridades y diferencias entre niveles.","T.get.1.0":"Una interpretación científica","T.get.1.1":"Una explicación clara de lo que significa y no significa cada puntuación.","T.get.2.0":"Un plan de talleres","T.get.2.1":"Dos o tres talleres adaptados a sus prioridades, con formato y duración.","T.get.3.0":"Un resultado personal para cada participante","T.get.3.1":"Cada empleado ve al instante su propio resultado y dos consejos prácticos; la dirección nunca ve el resultado individual de nadie.","T.get.4.0":"Una reunión de resultados de 45 minutos","T.get.4.1":"Se comentan los resultados con la dirección y Recursos Humanos, con próximos pasos concretos.","T.pilot.0.0":"Semana 0","T.pilot.0.1":"Arranque","T.pilot.0.2":"Reunión de 30 minutos: objetivos, niveles, calendario y cómo se informa a los empleados.","T.pilot.1.0":"Semanas 1–2","T.pilot.1.1":"Cuestionario abierto","T.pilot.1.2":"Los empleados completan el chequeo anónimo en el móvil o el ordenador, en uno de nueve idiomas; lleva de 8 a 18 minutos.","T.pilot.2.0":"Semana 3","T.pilot.2.1":"Informe","T.pilot.2.2":"El informe de grupo anónimo por nivel y el plan de talleres recomendado.","T.pilot.3.0":"Semana 4","T.pilot.3.1":"Reunión de resultados y elección","T.pilot.3.2":"Conversación con la dirección; elección de los primeros talleres y de cuándo volver a medir.","T.needT":"Qué necesitamos de usted","T.need.0":"Una persona de contacto (p. ej. Recursos Humanos)","T.need.1":"Al menos 20 participantes y al menos 5 por nivel de puesto","T.need.2":"Un breve mensaje a la plantilla (le facilitamos un modelo)","T.need.3":"Si tiene comité de empresa (OR): su consentimiento cuando sea necesario (WOR art. 27). Le ayudamos a preparar la solicitud.","T.need.4":"Unas 3 horas de dedicación de Recursos Humanos en total, repartidas en cinco semanas","T.lawT":"Conforme a las normas neerlandesas y europeas","T.law.0.0":"RGPD","T.law.0.1":"No se piden nombres; las respuestas se guardan separadas de cualquier dirección de correo electrónico y solo se presentan para grupos de 5 o más personas. Como las respuestas sobre bienestar pueden considerarse datos de salud, la participación se basa en el consentimiento explícito y voluntario.","T.law.1.0":"Arbowet","T.law.1.1":"Puede respaldar la política PSA del empleador (art. 3, apdo. 2) como complemento a nivel individual de las medidas dirigidas al origen del riesgo y de la RI&E (Arbobesluit art. 2.15).","T.law.2.0":"Comité de empresa","T.law.2.1":"Una encuesta a la plantilla como esta suele requerir el consentimiento del comité de empresa o, al menos, su participación (WOR art. 27); le ayudamos a prepararla.","T.faqT":"Preguntas frecuentes","T.faq.0.0":"¿Cuánto tiempo les lleva a los empleados?","T.faq.0.1":"La versión corta lleva unos 8 minutos; la completa, unos 18. Funciona en cualquier móvil u ordenador.","T.faq.1.0":"¿Pueden los responsables ver respuestas individuales?","T.faq.1.1":"No. No hay nombres, y el informe de la organización solo muestra grupos de cinco o más personas.","T.faq.2.0":"¿Es un diagnóstico?","T.faq.2.1":"No. Es un chequeo no clínico basado en cuestionarios publicados, que sirve para ver patrones de grupo y elegir el apoyo adecuado. La página de resultados personales orienta a quien lo esté pasando mal hacia el médico de empresa, su médico de cabecera o un psicólogo.","T.faq.3.0":"¿Están validados los cuestionarios?","T.faq.3.1":"Los ocho están publicados internacionalmente y validados en su idioma original, y usamos sus claves de puntuación originales (véase Método y Fuentes). Los ítems en inglés siguen la redacción original; las versiones en otros idiomas usadas aquí, incluida la española, aún no se han validado por separado en esta forma, por eso usamos los datos del piloto para comprobar la fiabilidad de cada escala. Las licencias de uso comercial se están acordando con los autores.","T.faq.4.0":"¿Mide el estrés laboral o el agotamiento?","T.faq.4.1":"No directamente. Mide recursos psicológicos que ayudan a afrontar la presión. Los riesgos laborales, como la carga de trabajo y la autonomía, se miden con una encuesta de condiciones de trabajo. Ambas se complementan, y con gusto le ayudamos a combinarlas.","T.faq.5.0":"¿Sirve para organizaciones grandes?","T.faq.5.1":"Sí. Un piloto puede empezar en un departamento o una sede y ampliarse después. Las reglas de anonimato son las mismas a cualquier escala: resultados solo para grupos de al menos 5 personas.","T.faq.6.0":"¿Cómo se recogen las respuestas en el piloto?","T.faq.6.1":"Cada participante envía por correo un código de respuesta anónimo (solo números de respuesta y nivel de puesto) directamente a SoloNovate, nunca al empleador. SoloNovate borra esos correos después de importarlos. Para una implantación completa se puede configurar una recogida en línea segura.","T.faq.7.0":"¿Qué pasa después del informe?","T.faq.7.1":"Una reunión de resultados, dos o tres talleres impartidos por un socio cualificado en los Países Bajos y una nueva medición a los 3–6 meses para ver qué ha cambiado.","T.ctaT":"¿Le interesa un piloto?","T.ctaP":"Pruebe el chequeo usted mismo, vea el informe de ejemplo y envíe una breve solicitud.","T.calcT":"¿Cuánto le cuesta el absentismo por motivos psicológicos?","T.calcP":"Una estimación rápida para su organización. Cambie las cifras según su situación.","T.cEmp":"Número de empleados","T.cAbs":"Tasa de absentismo (%)","T.cAbsH":"Media neerlandesa en 2025: 5,4 %","T.cSal":"Salario bruto anual medio (€)","T.cShare":"Porcentaje de días de ausencia por estrés o problemas psicológicos (%)","T.cShareH":"Estimación nacional: alrededor de una cuarta parte","T.cRed":"Escenario ilustrativo (no es un efecto esperado): el absentismo por motivos psicológicos baja un","T.cDays":"días de ausencia al año","T.cStress":"de ellos, por motivos psicológicos","T.cCost":"coste anual del absentismo por motivos psicológicos","T.cSave":"ahorro anual en este escenario","T.cPerDay":"Coste por día de ausencia usado aquí: {x} (salario × 1,3 por costes del empleador ÷ 220 días laborables). Las estimaciones neerlandesas van de 250 € a 400 € al día.","T.cNote":"Esto es un escenario, no una predicción. Aún no hay pruebas directas de que este chequeo y sus talleres reduzcan el absentismo, y una puntuación de cuestionario no se traduce directamente en menos días de ausencia. Use la estimación para juzgar si merece la pena invertir en prevención, y la nueva medición para ver qué ha cambiado realmente.","T.wsPartner":"Quién lo imparte: cada taller está a cargo de un psicólogo o formador con experiencia en los Países Bajos, seleccionado por nosotros para su encargo. Lo conocerá antes de la sesión de devolución de resultados.","T.pilotNoteT":"Sobre esta versión piloto","T.pilotNote":"En el piloto, las respuestas solo se usan para elaborar el informe de su organización y comprobar la fiabilidad de los cuestionarios. Las licencias de uso comercial de los cuestionarios se están acordando con sus autores.","T.arboT":"Puede respaldar su política PSA en el marco de la Arbowet","T.arboP":"En los Países Bajos, los empleadores deben tener una política para prevenir, o al menos limitar, la carga psicosocial (PSA), como el estrés laboral, y evaluar los riesgos PSA en su evaluación de riesgos (RI&E) con un plan de acción. La ley pide abordar primero el estrés laboral en su origen (carga de trabajo, autonomía, apoyo) y solo después con medidas individuales. Este chequeo y sus talleres son una medida individual de ese tipo: un complemento útil, nunca un sustituto.","T.arbo.0.0":"Una pieza para la parte PSA de su RI&E","T.arbo.0.1":"Los riesgos PSA tienen que ver sobre todo con el propio trabajo: carga, autonomía, apoyo y conductas indeseadas. Este chequeo añade la otra cara: qué recursos psicológicos tienen sus equipos, por nivel de puesto. Úselo junto a una encuesta de condiciones de trabajo, no en su lugar.","T.arbo.1.0":"Material para su plan de acción","T.arbo.1.1":"Los talleres y la nueva medición pueden registrarse en su plan de acción como medidas a nivel individual, junto a las medidas que actúan sobre el propio trabajo.","T.arbo.2.0":"Seguimiento visible","T.arbo.2.1":"Los resultados de antes y después ayudan a mostrar al comité de empresa que su organización toma medidas frente a los riesgos.","T.arboNote":"El chequeo no sustituye su RI&E, una encuesta de condiciones de trabajo ni la revisión de un experto certificado; las complementa.","T.fName":"Su nombre","T.fOrg":"Organización","T.fMail":"Correo electrónico","T.fSize":"Número de empleados","T.fMsg":"Mensaje (opcional)","T.fSend":"Solicitar un piloto","T.fSent":"Su programa de correo se abre con la solicitud rellenada; solo tiene que pulsar Enviar.","T.sizes.0":"20–50","T.sizes.1":"50–250","T.sizes.2":"250–1000","T.sizes.3":"1000+","T.sizes.4":"Otro","T.ctaAbout":"Sobre Maryam Jaberi","T.pPlan":"Consultar sobre este taller (correo electrónico)","T.nSrc":"Fuentes","T.sT":"Fuentes","T.sP":"Todas las cifras, referencias legales y afirmaciones científicas de este sitio, con un enlace al original. Los títulos de las publicaciones se mantienen en su idioma original.","T.gStats":"Cifras y costes","T.gLaw":"Leyes y normas","T.gEv":"Investigación detrás de los talleres","T.gInst":"Cuestionarios","T.gCourse":"Curso","T.courseRef":"Mokri, A. Competencias personales y humanas en organizaciones y centros educativos [curso; persa]. Apuntes del curso reunidos en el wiki de "T.prT":"Cómo funciona","T.prP":"Un proceso claro con un equipo pequeño: quién hace qué, quién ve qué y qué documentos firmamos. Sin sorpresas para la dirección ni para la plantilla.","T.rolesT":"Quién hace qué","T.roles.0.2":"Su única persona de contacto","T.roles.0.3":"Prepara el cuestionario, protege los datos, analiza las respuestas, redacta el informe y coordina todo, desde el arranque hasta la nueva medición.","T.roles.1.1":"Psicólogo/a asociado/a","T.roles.1.2":"Con experiencia, imparte talleres para organizaciones","T.roles.1.3":"Revisa la interpretación del informe, participa en la reunión de resultados e imparte los talleres que eligen sus equipos.","T.roles.2.1":"Su persona de contacto","T.roles.2.2":"A menudo Recursos Humanos o la persona responsable de la oficina","T.roles.2.3":"Planifica con nosotros el periodo de la encuesta, prepara el mensaje a la plantilla para que lo envíe la dirección y hace de enlace con la dirección.","T.roles.3.1":"Empleados","T.roles.3.2":"Las personas en el centro","T.roles.3.3":"Deciden por sí mismos si participan, responden de forma anónima en 8–18 minutos y ven su propio resultado al instante.","T.roles.4.1":"Dirección","T.roles.4.2":"Responsable del seguimiento","T.roles.4.3":"Recibe el informe de grupo, lo comenta en la reunión de resultados, elige los siguientes pasos y comparte un resumen con la plantilla.","T.roles.5.1":"Comité de empresa","T.roles.5.2":"Si su organización tiene uno","T.roles.5.3":"Se le informa de antemano y da su consentimiento cuando la ley lo exige.","T.flowT":"El recorrido, semana a semana","T.flow.0.0":"Semana 0","T.flow.0.1":"Arranque","T.flow.0.2.1":"Persona de contacto","T.flow.0.3":"30 minutos: objetivos, niveles de puesto y planificación. Firmamos el acuerdo de piloto y el acuerdo de encargo de tratamiento de datos.","T.flow.1.0":"Semana 0","T.flow.1.1":"Informar a la plantilla","T.flow.1.2.0":"Dirección","T.flow.1.2.1":"Comité de empresa","T.flow.1.3":"La dirección envía el mensaje modelo: por qué se hace, qué grado de anonimato tiene y qué se hará con los resultados.","T.flow.2.0":"Semanas 1–2","T.flow.2.1":"Cuestionario abierto","T.flow.2.2.0":"Empleados","T.flow.2.3":"Cuestionarios anónimos en el móvil o el ordenador. Cada persona ve su resultado al momento. Un recordatorio a mitad de plazo.","T.flow.3.0":"Semana 3","T.flow.3.1":"Análisis e informe","T.flow.3.2.1":"Psicólogo/a","T.flow.3.3":"Analizamos los datos de grupo y el psicólogo revisa la interpretación. Los grupos de menos de 5 siguen ocultos.","T.flow.4.0":"Semana 4","T.flow.4.1":"Reunión de resultados","T.flow.4.2.1":"Psicólogo/a","T.flow.4.2.2":"Dirección","T.flow.4.3":"45 minutos: qué significan los resultados y con qué dos o tres talleres empezar.","T.flow.5.0":"Semana 4","T.flow.5.1":"Vuelta al equipo","T.flow.5.2.0":"Dirección","T.flow.5.3":"Un breve resumen llega a todos los empleados. Han participado, así que tienen derecho a saber qué sale de ello.","T.flow.6.0":"Después","T.flow.6.1":"Talleres y nueva medición","T.flow.6.2.0":"Psicólogo/a","T.flow.6.3":"El psicólogo imparte los talleres; una nueva medición a los 3–6 meses muestra si las puntuaciones han cambiado.","T.seeT":"Quién ve qué","T.seeP":"El anonimato está integrado en el proceso, no solo prometido.","T.seeCols.0":"Respuestas individuales (sin nombre)","T.seeCols.1":"Informe de grupo (5 personas o más)","T.see.0.0":"Empleado","T.see.0.1":"Solo las suyas","T.see.0.2":"Resumen","T.see.1.0":"Dirección y Recursos Humanos","T.see.1.1":"Nunca","T.see.1.2":"Sí","T.see.2.0":"Psicólogo/a asociado/a","T.see.2.1":"Nunca","T.see.2.2":"Sí","T.see.3.1":"Sí, sin nombres (el correo se borra tras la importación)","T.see.3.2":"Sí","T.empT":"Para los empleados: qué pasa con sus respuestas","T.emp.0":"Nunca se le pide su nombre, su correo electrónico ni su número de empleado.","T.emp.1":"Su responsable y Recursos Humanos solo ven resultados de grupos de 5 personas o más.","T.emp.2":"Ve su propio resultado al instante, con dos consejos prácticos. Solo usted lo ve.","T.emp.3":"La participación es voluntaria. Puede dejarlo en cualquier momento; sus respuestas solo se usan si envía su código de respuesta.","T.emp.4":"Si envía un código de respuesta, envíelo a SoloNovate, nunca a su responsable ni a Recursos Humanos.","T.docsT":"Documentos de ejemplo","T.docsP":"Para que sepa exactamente qué firma antes de empezar. Cada documento está disponible en neerlandés e inglés y se puede imprimir o guardar como PDF. Son borradores que ultimamos juntos antes del piloto.","T.docs.pilot-agreement.0":"Acuerdo de piloto","T.docs.pilot-agreement.1":"Qué incluye el piloto, funciones, anonimato, precio y responsabilidad.","T.docs.data-processing.0":"Acuerdo de encargo de tratamiento de datos","T.docs.data-processing.1":"RGPD art. 28: qué datos, seguridad, conservación y brechas de datos.","T.docs.privacy-participants.0":"Aviso de privacidad para participantes","T.docs.privacy-participants.1":"En lenguaje sencillo para los empleados: quién ve qué y cuáles son sus derechos.","T.docs.staff-announcement.0":"Anuncio a la plantilla","T.docs.staff-announcement.1":"Mensaje modelo de la dirección, listo para adaptar.","T.aud.mgmt":"Para la dirección","T.aud.staff":"Para los empleados","T.aud.hr":"Para Recursos Humanos","T.open":"Abrir (neerlandés / inglés)","T.rMail":"Enviar el código a SoloNovate por correo","T.partT":"Para psicólogos y formadores","T.partP":"¿Imparte talleres o coaching para organizaciones? Estamos creando una pequeña red de socios.","T.partL.0":"Nosotros nos encargamos de la medición, el informe y el contacto con el cliente; usted hace lo que mejor sabe hacer.","T.partL.1":"Cada encargo empieza con datos: antes de la primera sesión sabe qué temas y niveles de puesto necesitan atención.","T.partL.2":"Tiene a su disposición esquemas de talleres con evidencia y fuentes, listos para usar y adaptar.","T.partL.3":"Usted fija sus tarifas y decide qué encargos acepta.","T.partAsk":"Buscamos experiencia con grupos en organizaciones, una colegiación o registro profesional pertinente (por ejemplo NIP o BIG) y capacidad para impartir talleres en neerlandés o inglés.","T.partCta":"Unirse a la red de socios","T.partSubj":"Solicitud de colaboración – Chequeo de bienestar","T.rvTabs":"Vistas del informe","T.whatL":"Qué ve","T.howL":"Cómo leerlo","T.keyL":"Idea clave","T.srcL":"Fuente","T.rv.sum.0":"Resumen","T.rv.sum.1":"Los resultados principales en lenguaje sencillo.","T.rv.sum.2":"Las puntuaciones van de 0 a 100: 0 es la respuesta más baja posible en todas las preguntas y 100 la más alta. Menos de 37,5 = requiere atención, 37,5–62,5 = moderado, más de 62,5 = sólido. Cada cuestionario tiene su propio rango habitual, así que compare una dimensión entre niveles de puesto o a lo largo del tiempo, no con otras dimensiones.","T.rv.heat.0":"Por nivel de puesto","T.rv.heat.1":"La puntuación media de cada nivel de puesto en cada dimensión.","T.rv.heat.2":"Lea una fila para comparar niveles; lea una columna para ver el perfil de un nivel. Los colores cálidos requieren atención; el verde es sólido. Los grupos de menos de 5 personas están ocultos.","T.rv.gap.0":"Diferencias entre niveles","T.rv.gap.1":"Para cada dimensión: dónde puntúa cada nivel de puesto, del más bajo al más alto.","T.rv.gap.2":"Una línea larga significa que los niveles de puesto puntúan de forma muy distinta. Puede reflejar las exigencias de la función, pero también quién acaba en cada función; coméntelo en la sesión de devolución antes de sacar conclusiones.","T.rv.dist.0":"Distribución","T.rv.dist.1":"Cuántas personas hay en cada franja de puntuación, por dimensión.","T.rv.dist.2":"Una media puede ocultar a un grupo que lo está pasando mal. La parte roja es el porcentaje de personas que requieren atención.","T.rv.prof.0":"Perfil de un nivel","T.rv.prof.1":"Un nivel de puesto comparado con los demás niveles.","T.rv.prof.2":"La barra es la puntuación del nivel; la línea fina, la media de los demás niveles. Las diferencias de menos de unos 5 puntos no suelen ser significativas, y en niveles de menos de 20 personas incluso diferencias mayores pueden deberse al azar.","T.rv.sub.0":"Subpuntuaciones","T.rv.sub.1":"Las partes que forman cada dimensión.","T.rv.sub.2":"Cuando una dimensión es baja, aquí se ve qué parte puntúa más bajo. Las partes de autocompasión se basan en 2 preguntas cada una y los autores recomiendan usar solo la puntuación total, así que tómelas como punto de partida para la conversación en la reunión de resultados, no como mediciones.","T.rv.time.0":"Evolución","T.rv.time.1":"La primera medición junto a la nueva medición.","T.rv.time.2":"Barra clara = primera medición, barra oscura = nueva medición. Que un cambio sea algo más que azar depende del tamaño del grupo; cada vez pueden participar personas distintas y otros acontecimientos también influyen, así que un cambio muestra qué se ha movido, no por qué.","T.rv.plan.0":"Plan de acción","T.rv.plan.1":"En qué trabajar primero, para quién y con qué taller.","T.rv.plan.2":"Se sugiere una dimensión como prioridad cuando más del 25 % de las personas está en «requiere atención» o cuando un nivel de puesto de 10 personas o más puntúa al menos 5 puntos por debajo de los demás niveles. Mostramos las tres principales; el resto aparece en «También conviene vigilar». Es un punto de partida para la reunión de resultados, no un veredicto.","T.kpiSub.0":"personas respondieron","T.kpiSub.1":"niveles de puesto con 5 personas o más","T.kpiSub.2":"empiece por aquí en la reunión de resultados","T.kpiSub.3":"media de las ocho dimensiones","T.sumN":"Basado en {n} participantes en {k} niveles de puesto.","T.sumStrong":"Puntuaciones más altas: {a}.","T.sumWeak":"Puntuación más baja: {d} ({m}); el {p} de las personas está en «requiere atención».","T.sumGap":"Mayor diferencia entre niveles: {d} ({hi}: {a}; {lo}: {b}).","T.sumNext":"Primer paso sugerido: el taller «{w}», para {who}.","T.and":"y","T.heatKey":"Puntuación más baja: {lv} en {d} ({v}). La más alta: {lv2} en {d2} ({v2}).","T.gapKey":"Mayor diferencia: {d} — {lo} {a} frente a {hi} {b} ({x} puntos).","T.distKey":"{d}: el {p} de las personas está en «requiere atención», aunque la media ({m}) es moderada.","T.profSel":"Nivel de puesto","T.profUp":"En comparación con los demás niveles, el grupo «{lv}» puntúa más alto en: {a}.","T.profDown":"En comparación con los demás niveles, el grupo «{lv}» puntúa más bajo en: {b}.","T.profFlat":"El grupo «{lv}» puntúa de forma similar a los demás niveles en todas las dimensiones.","T.orgAvg":"media de los demás niveles","T.subKey":"Aspecto más bajo: {s} dentro de {d} ({v}).","T.timeDemo":"Ejemplo simulado: nueva medición cuatro meses después de talleres sobre autocompasión y flow.","T.timeKey":"Mayor cambio: {d} ({x} puntos). Con estos tamaños de grupo, los cambios de menos de unos 5 puntos pueden deberse al azar.","T.timeNone":"Esta vista estará disponible tras la nueva medición (3–6 meses después de los talleres).","T.t1":"Primera medición","T.t2":"Nueva medición","T.rHow":"Los colores indican la franja: rojo = requiere atención, amarillo = moderado, verde = sólido. Cada cuestionario tiene su propio rango habitual, así que compare cada dimensión consigo misma a lo largo del tiempo, no con otras dimensiones.","T.ariaHome":"Inicio","T.ariaNav":"Secciones","T.ariaLang":"Idioma","T.tUnval":"Estas preguntas son nuestra propia traducción al español de los cuestionarios originales y aún no se han validado por separado. Se puntúan igual; su fiabilidad se comprueba en el piloto.","DIMS.compassion.n":"Autocompasión","DIMS.compassion.q":"Cuando fracaso o lo paso mal, ¿soy amable o duro conmigo mismo?","DIMS.compassion.what":"Cómo se trata uno a sí mismo ante el fracaso y el dolor: con amabilidad y equilibrio, o con autocrítica y desbordamiento.","DIMS.compassion.not":"La autocompasión no es lo mismo que la pereza, el egoísmo ni rebajar las propias exigencias.","DIMS.compassion.b.0":"La autocrítica es fuerte. Es probable que los errores se reciban con reproches, aislamiento y rumiación.","DIMS.compassion.b.1":"Ni muy duro ni siempre amable consigo mismo en los momentos difíciles.","DIMS.compassion.b.2":"Amable y equilibrado consigo mismo en los momentos difíciles; aprende de los errores sin atacarse.","DIMS.compassion.tips.0":"Después de un error, pregúntese: «¿Qué le diría a un amigo en esta situación?» y dígaselo a usted mismo.","DIMS.compassion.tips.1":"Recuerde que los errores forman parte de la experiencia de todos; ponga nombre a la emoción sin ahogarse en ella.","DIMS.flex.n":"Flexibilidad psicológica","DIMS.flex.q":"¿Me apartan los pensamientos y sentimientos difíciles de lo que me importa?","DIMS.flex.what":"Cuánto se interponen los pensamientos y emociones desagradables en vivir y trabajar según los propios valores.","DIMS.flex.not":"Una puntuación baja no es un diagnóstico; significa que, en este momento, los pensamientos y sentimientos difíciles a menudo se interponen en lo que le importa.","DIMS.flex.b.0":"Los pensamientos y sentimientos dolorosos ocupan mucho espacio y probablemente bloquean acciones importantes.","DIMS.flex.b.1":"Los pensamientos y sentimientos difíciles a veces se interponen, pero en general sigue avanzando hacia lo que importa.","DIMS.flex.b.2":"Puede avanzar hacia lo que importa aunque los sentimientos sean difíciles.","DIMS.flex.tips.0":"En lugar de luchar contra un pensamiento, diga «Estoy teniendo el pensamiento de que…» y dé el siguiente pequeño paso.","DIMS.flex.tips.1":"Haga cada día una pequeña acción coherente con sus valores, aunque no se sienta del todo preparado.","DIMS.optim.n":"Optimismo","DIMS.optim.q":"¿Espero en general que las cosas salgan bien?","DIMS.optim.what":"La expectativa general de una persona sobre el futuro: cosas buenas o malas.","DIMS.optim.not":"No trata del futuro de la organización ni de la satisfacción laboral; es un rasgo personal bastante estable.","DIMS.optim.b.0":"Predomina la expectativa de malos resultados; la energía para seguir intentándolo puede ser menor.","DIMS.optim.b.1":"Expectativas moderadas sobre el futuro; ni claramente optimista ni pesimista.","DIMS.optim.b.2":"En general espera buenos resultados; en los estudios se asocia a la perseverancia y a una mejor salud.","DIMS.optim.tips.0":"Escriba unos minutos sobre su «mejor yo posible» dentro de un año; en varios estudios, este ejercicio aumentó el optimismo.","DIMS.optim.tips.1":"Junto a cada preocupación, escriba un plan «si pasa esto, yo…».","DIMS.hope.n":"Esperanza","DIMS.hope.q":"¿Tengo metas, caminos para alcanzarlas y energía para ponerme en marcha?","DIMS.hope.what":"La esperanza en sentido científico: tener metas, encontrar caminos hacia ellas (vías) y la energía y la convicción para perseguirlas (agencia).","DIMS.hope.not":"No es lo mismo que el optimismo; la esperanza se refiere a la propia capacidad de llegar.","DIMS.hope.b.0":"Pocas vías o poca energía para alcanzar metas; es más probable sentirse estancado.","DIMS.hope.b.1":"Hay metas y vías, pero la energía baja cuando aparecen obstáculos.","DIMS.hope.b.2":"Metas claras, varias vías y energía suficiente; en los estudios se asocia a un rendimiento algo mejor.","DIMS.hope.tips.0":"Para una meta importante, escriba al menos tres caminos distintos.","DIMS.hope.tips.1":"Use WOOP: deseo (Wish), resultado (Outcome), obstáculo interno (Obstacle) y un plan «si… entonces…» (Plan).","DIMS.belong.n":"Pertenencia","DIMS.belong.q":"¿Me siento parte del grupo y aceptado?","DIMS.belong.what":"Un sentido general de pertenencia y aceptación en las relaciones, en la vida y entre los demás.","DIMS.belong.not":"No se limita al trabajo; mide la pertenencia en toda la vida.","DIMS.belong.b.0":"Fuerte sensación de estar al margen o de ser rechazado; en la investigación, esto se asocia a un menor bienestar.","DIMS.belong.b.1":"Un sentido moderado de pertenencia y aceptación; ni muy conectado ni claramente al margen.","DIMS.belong.b.2":"Se siente aceptado y conectado; un pilar importante de la salud mental.","DIMS.belong.tips.0":"Esta semana, tenga una conversación breve con un compañero que no sea sobre trabajo.","DIMS.belong.tips.1":"Pida a alguien que le incluya en una tarea o plan; pedir ayuda también crea vínculo.","DIMS.flow.n":"Flow en el trabajo","DIMS.flow.q":"¿Me sumerjo en mi trabajo, lo disfruto y lo hago por sí mismo?","DIMS.flow.what":"El flow en el trabajo en las últimas dos semanas: absorción, disfrute y motivación intrínseca.","DIMS.flow.not":"No mide el esfuerzo ni las horas; mide la calidad de la experiencia de trabajo.","DIMS.flow.b.0":"El trabajo absorbe o se disfruta menos; quizá haya muchas interrupciones o falta de sentido.","DIMS.flow.b.1":"La absorción, el disfrute y la motivación en el trabajo son moderados.","DIMS.flow.b.2":"Absorto, disfrutando y con motivación intrínseca; ligado a mejor rendimiento y sentido.","DIMS.flow.tips.0":"Reserve cada día un bloque de 60–90 minutos de trabajo concentrado sin mensajes ni reuniones.","DIMS.flow.tips.1":"Rediseñe una parte de su puesto para que encaje mejor con sus fortalezas e intereses (job crafting).","DIMS.ei.n":"Inteligencia emocional","DIMS.ei.q":"¿Entiendo y gestiono mis emociones y las de los demás?","DIMS.ei.what":"Cómo valoran las personas su capacidad para entender y gestionar las emociones propias y ajenas.","DIMS.ei.not":"Autoinforme, no una prueba de aptitud; puede diferir de la habilidad real.","DIMS.ei.b.0":"Se ve con menos habilidad para reconocer o gestionar emociones.","DIMS.ei.b.1":"Valora como moderadas sus propias habilidades emocionales.","DIMS.ei.b.2":"Se ve capaz de entender y gestionar las emociones propias y ajenas.","DIMS.ei.tips.0":"Tres veces al día, ponga un nombre preciso a lo que siente («molesto» en lugar de «mal»).","DIMS.ei.tips.1":"Cuando un compañero esté alterado, refleje primero («pareces cansado») y luego ofrezca soluciones.","DIMS.selfctrl.n":"Autocontrol","DIMS.selfctrl.q":"¿Resisto las tentaciones y me mantengo fiel a mis metas a largo plazo?","DIMS.selfctrl.what":"Cómo valoran las personas su propia capacidad de controlar los impulsos, resistir las tentaciones y mantenerse fieles a sus metas a largo plazo.","DIMS.selfctrl.not":"Una puntuación baja no significa falta de voluntad; el entorno y los hábitos influyen mucho.","DIMS.selfctrl.b.0":"Las tentaciones y distracciones ganan a menudo; cambiar el entorno y los hábitos suele ayudar más que esforzarse más.","DIMS.selfctrl.b.1":"Autocontrol moderado según su propia valoración; las metas a largo plazo se imponen solo parte del tiempo.","DIMS.selfctrl.b.2":"Suele mantenerse fiel a sus metas a largo plazo; en la investigación, esto suele asociarse a buenos hábitos.","DIMS.selfctrl.tips.0":"Diseñe su entorno: deje el móvil en otra habitación durante el trabajo concentrado.","DIMS.selfctrl.tips.1":"Combine una tarea difícil con un pequeño placer (p. ej. su pódcast favorito solo mientras camina).","WS.w-comp.t":"La autocompasión y el crítico interior","WS.w-comp.who":"Todos los niveles; versión para mandos: liderazgo compasivo","WS.w-comp.goals.0":"Reconocer al crítico interior y su coste","WS.w-comp.goals.1":"Practicar las tres partes de la autocompasión: amabilidad con uno mismo, humanidad compartida y atención plena","WS.w-comp.goals.2":"Gestionar los errores en el equipo sin humillar","WS.w-comp.ev":"Un metaanálisis de 27 ensayos aleatorizados encontró efectos moderados de los programas de autocompasión, en su mayoría de varias semanas, sobre la autocrítica y el estrés. Es probable que los efectos de un taller de dos sesiones sean menores.","WSLEN.w-comp":"2 × 3 horas","WS.w-flex.t":"Flexibilidad psicológica y regulación emocional","WS.w-flex.who":"Todos los niveles, especialmente puestos con mucha presión","WS.w-flex.goals.0":"Tomar distancia de los pensamientos sin luchar contra ellos","WS.w-flex.goals.1":"Aclarar los valores en el trabajo","WS.w-flex.goals.2":"El modelo de proceso de la regulación emocional y cuatro estrategias proactivas","WS.w-flex.ev":"Un metaanálisis de 17 ensayos en el entorno laboral sobre el entrenamiento en aceptación y compromiso encontró reducciones pequeñas a moderadas del malestar y mejoras en la flexibilidad psicológica; los efectos fueron más claros en el personal de oficina y pequeños en el personal sanitario.","WSLEN.w-flex":"2 × 3 horas","WS.w-hope.t":"Esperanza y optimismo realista","WS.w-hope.who":"Todos los niveles; especialmente adecuado en periodos de cambio organizativo","WS.w-hope.goals.0":"El ejercicio del «mejor yo posible»","WS.w-hope.goals.1":"WOOP y planes «si… entonces…»","WS.w-hope.goals.2":"El principio del progreso: fijarse en las pequeñas victorias","WS.w-hope.ev":"WOOP (contraste mental con planes «si… entonces…») tiene un efecto pequeño a medio en el logro de metas; el ejercicio del mejor yo posible aumenta el optimismo de forma modesta.","WSLEN.w-hope":"1 × 4 horas","WS.w-belong.t":"Pertenencia y conexión en el trabajo","WS.w-belong.who":"Equipos junto con sus responsables","WS.w-belong.goals.0":"Contacto sencillo y cotidiano: breves charlas para saber cómo está cada uno y reconocimiento sincero entre compañeros","WS.w-belong.goals.1":"Programas de acogida y de compañero mentor para recién llegados","WS.w-belong.goals.2":"Importar a los demás: ser visto y aportar valor","WS.w-belong.ev":"Las intervenciones breves de pertenencia mejoraron los resultados de estudiantes universitarios, pero una amplia replicación de 2023 solo encontró efectos donde el entorno ofrecía oportunidades reales de pertenencia. Todavía no hay ensayos comparables en el entorno laboral, por lo que el taller combina esta idea con prácticas de incorporación y de acompañamiento por un compañero de referencia.","WSLEN.w-belong":"1 × 3 horas + programa de equipo","WS.w-flow.t":"Trabajo concentrado, flow y desconexión","WS.w-flow.who":"Todos los niveles; versión para mandos: proteger el tiempo de concentración del equipo","WS.w-flow.goals.0":"Job crafting: rediseñar el propio pue
