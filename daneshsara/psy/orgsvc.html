RoundName":"Titel der Runde","T.pCreate":"Runde anlegen","T.pRounds":"Runden","T.pChoose":"Runde wählen","T.pNoAdmin":"Runden anlegen und echte Antworten ansehen können nur die koordinierenden Personen (Bearbeitende dieser Seite). Alle anderen können den Beispielbericht ansehen oder Antwortcodes importieren.","T.pDemoNote":"Dieser Bericht verwendet simulierte Daten von 180 Personen, damit Sie sehen, wie ein echter Bericht aussieht.","T.wT":"Workshops","T.wP":"Jeder Workshop zielt auf eine oder zwei Dimensionen ab und baut auf dem Material des Kurses von Dr. Mokri auf. Die Leselinks öffnen die Seiten des Kurswikis; die Titel sind hier übersetzt, die Seiten selbst sind auf Persisch.","T.wGoals":"Ziele","T.wWho":"Zielgruppe","T.wLen":"Dauer","T.wEv":"Evidenz","T.wRead":"Hintergrundlektüre im Kurswiki (Seiten auf Persisch)","T.mT":"Methode","T.mP":"Transparent darüber, was wir messen, wie wir auswerten und wo die Grenzen liegen.","T.mInst":"Fragebögen","T.mScore":"Auswertung","T.mScoreP":"Der Mittelwert jeder Unterskala wird auf einen Bereich von 0–100 umgerechnet: (Mittelwert − Minimum) ÷ (Maximum − Minimum) × 100. Invertierte Items werden zuvor umgepolt. Wo ein hoher Wert im Originalfragebogen mehr Schwierigkeiten bedeutet (z. B. AAQ-II), wird der Wert umgepolt, sodass überall „höher = besser“ gilt.","T.mBands":"Wertebereiche","T.mBandsP":"Unter 37,5: braucht Aufmerksamkeit · 37,5 bis 62,5: mittel · über 62,5: stark. Diese Schwellenwerte folgen der für die Self-Compassion Scale üblichen Konvention (durchschnittliche Antwort unter 2,5 bzw. über 3,5 auf einer Skala von 1–5) und werden der Einfachheit halber auf alle Skalen angewandt. Sie sind keine Bevölkerungsnormen und keine klinischen Grenzwerte, und die typischen Werte unterscheiden sich zwischen den Fragebögen.","T.mLim":"Grenzen","T.mLimL.0":"Alle Fragebögen beruhen auf Selbstauskunft und können von der Tagesstimmung oder dem Wunsch, gut dazustehen, beeinflusst werden.","T.mLimL.1":"Für die Wertebereiche gibt es keine Bevölkerungsnormen; Vergleiche innerhalb der Organisation und über die Zeit sind aussagekräftiger als Vergleiche mit einem „Landesdurchschnitt“.","T.mLimL.2":"Die Fragebögen sind in ihrer Originalsprache validiert, und die englischen Items folgen dem Originalwortlaut. Die hier verwendeten Versionen in anderen Sprachen, auch diese deutsche, sind in dieser Form nicht gesondert validiert; ihre Reliabilität wird in der Pilotphase geprüft. Verwenden Sie für Forschungszwecke die offiziell validierten Versionen (siehe Quellen).","T.mLimL.3":"Dieses Instrument ist nicht für Entscheidungen über einzelne Personen (Einstellung, Leistungsbeurteilung) gedacht und darf dafür nicht verwendet werden.","T.mEth":"Ethik und Datenschutz","T.mEthL.0":"Die Teilnahme ist freiwillig, und alle können jederzeit aufhören.","T.mEthL.1":"Erfasst wird nur der Monat, nicht das genaue Datum oder die Uhrzeit.","T.mEthL.2":"Berichte gibt es nur auf Gruppenebene, mit einer Mindestgruppengröße von 5.","T.mEthL.3":"Persönliche Ergebnisse werden nur auf dem eigenen Gerät der teilnehmenden Person angezeigt.","T.mCourse":"Dieser Service ist aus dem Kurs „Persönliche und menschliche Kompetenzen in Organisationen und Bildungseinrichtungen“ von Dr. Azarakhsh Mokri entstanden. Aus den dort behandelten Fragebögen haben wir acht ausgewählt, die kurz und veröffentlicht sind, ohne klinische Etiketten auskommen und jeweils mit einer trainierbaren Fähigkeit verbunden sind.","T.mWiki":"Vollständiges Kurswiki (Persisch)","T.mOrgPsy":"Arbeits- und Organisationspsychologie","T.items":"Items","T.scale":"Skala","T.ref":"Quelle","T.session":"Seite im Kurswiki (Persisch)","T.footer":"Wohlbefindens-Check für Organisationen von SoloNovate · Pilotversion · nicht diagnostisch","T.dims":"Dimensionen","T.whyT":"Warum das wichtig ist","T.whyP":"Psychische Gesundheit ist kein weiches Thema: Sie zeigt sich in Fehlzeiten, Fluktuation und der Qualität der Arbeit. Dieser Check misst nicht diese Probleme selbst, sondern psychische Ressourcen, die Menschen helfen, mit Druck bei der Arbeit umzugehen.","T.why.0.0":"1 von 5","T.why.0.1":"Beschäftigten in den Niederlanden berichtet von Burnout-Beschwerden (21 % im Jahr 2025, landesweite NEA-Erhebung).","T.why.1.0":"12 Milliarden","T.why.1.1":"Arbeitstage gehen weltweit jedes Jahr durch Depression und Angst verloren – das entspricht Produktivitätsverlusten von rund 1 Billion US-Dollar.","T.why.2.0":"Berufsbezogen","T.why.2.1":"Die WHO stuft Burnout (ICD-11) als berufsbezogenes Phänomen ein: ein Problem der Arbeit, nicht nur ein persönliches.","T.getT":"Was Ihre Organisation erhält","T.get.0.0":"Einen Bericht nach Funktionsebene","T.get.0.1":"Acht Dimensionen je Ebene, mit Stärken, Prioritäten und den Unterschieden zwischen den Ebenen.","T.get.1.0":"Eine wissenschaftliche Einordnung","T.get.1.1":"Verständliche Erklärung, was jeder Wert bedeutet und was nicht.","T.get.2.0":"Einen Workshop-Plan","T.get.2.1":"Zwei oder drei Workshops passend zu Ihren Prioritäten, mit Format und Dauer.","T.get.3.0":"Ein persönliches Ergebnis für alle Teilnehmenden","T.get.3.1":"Alle Mitarbeitenden sehen sofort ihr eigenes Ergebnis und zwei praktische Tipps; die Leitung sieht nie ein individuelles Ergebnis.","T.get.4.0":"Eine 45-minütige Nachbesprechung","T.get.4.1":"Besprechung der Ergebnisse mit Leitung und Personalabteilung, mit konkreten nächsten Schritten.","T.pilot.0.0":"Woche 0","T.pilot.0.1":"Auftakt","T.pilot.0.2":"30-minütiges Gespräch: Ziele, Ebenen, Zeitplan und wie die Mitarbeitenden informiert werden.","T.pilot.1.0":"Wochen 1–2","T.pilot.1.1":"Befragung läuft","T.pilot.1.2":"Die Mitarbeitenden füllen den anonymen Check in 8 bis 18 Minuten aus, am Handy oder Computer, in einer von neun Sprachen.","T.pilot.2.0":"Woche 3","T.pilot.2.1":"Bericht","T.pilot.2.2":"Der anonyme Gruppenbericht nach Funktionsebene und der empfohlene Workshop-Plan.","T.pilot.3.0":"Woche 4","T.pilot.3.1":"Nachbesprechung & Auswahl","T.pilot.3.2":"Gespräch mit der Leitung; Auswahl der ersten Workshops und des Zeitpunkts der nächsten Messung.","T.needT":"Was wir von Ihnen brauchen","T.need.0":"Eine Kontaktperson (z. B. Personalabteilung)","T.need.1":"Mindestens 20 Teilnehmende und mindestens 5 je Funktionsebene","T.need.2":"Eine kurze Nachricht an die Mitarbeitenden (wir liefern eine Vorlage)","T.need.3":"Falls Sie einen Betriebsrat (OR) haben: seine Zustimmung, sofern erforderlich (WOR Art. 27). Wir helfen bei der Vorbereitung des Antrags.","T.need.4":"Insgesamt etwa 3 Stunden Zeit der Personalabteilung, verteilt auf fünf Wochen","T.lawT":"Im Einklang mit niederländischen und europäischen Vorschriften","T.law.0.0":"DSGVO","T.law.0.1":"Es werden keine Namen erfragt; die Antworten werden getrennt von jeder E-Mail-Adresse aufbewahrt und nur für Gruppen ab 5 Personen berichtet. Da Angaben zum Wohlbefinden als Gesundheitsdaten gelten können, beruht die Teilnahme auf einer ausdrücklichen, freiwilligen Einwilligung.","T.law.1.0":"Arbowet","T.law.1.1":"Kann das PSA-Konzept des Arbeitgebers (Art. 3 Abs. 2) als Ergänzung auf individueller Ebene zu Maßnahmen an der Quelle und zur RI&E (Arbobesluit Art. 2.15) unterstützen.","T.law.2.0":"Betriebsrat","T.law.2.1":"Eine solche Mitarbeitendenbefragung erfordert in der Regel die Zustimmung des Betriebsrats (OR) oder zumindest seine Beteiligung (WOR Art. 27); wir helfen bei der Vorbereitung.","T.faqT":"Häufige Fragen","T.faq.0.0":"Wie viel Zeit brauchen die Mitarbeitenden dafür?","T.faq.0.1":"Die Kurzversion dauert etwa 8 Minuten, die vollständige Version etwa 18. Sie funktioniert auf jedem Handy oder Computer.","T.faq.1.0":"Können Führungskräfte einzelne Antworten sehen?","T.faq.1.1":"Nein. Es gibt keine Namen, und der Organisationsbericht zeigt nur Gruppen ab fünf Personen.","T.faq.2.0":"Ist das eine Diagnose?","T.faq.2.1":"Nein. Es ist ein nichtklinischer Check auf Basis veröffentlichter Fragebögen, um Muster in Gruppen zu erkennen und die passende Unterstützung zu wählen. Die persönliche Ergebnisseite verweist alle, denen es nicht gut geht, an den betriebsärztlichen Dienst, die Hausarztpraxis oder eine Psychologin bzw. einen Psychologen.","T.faq.3.0":"Sind die Fragebögen validiert?","T.faq.3.1":"Alle acht sind international veröffentlicht und in ihrer Originalsprache validiert, und wir verwenden ihre originalen Auswertungsschlüssel (siehe Methode und Quellen). Die englischen Items folgen dem Originalwortlaut; die hier verwendeten Versionen in anderen Sprachen, auch die deutsche, sind in dieser Form noch nicht gesondert validiert. Deshalb prüfen wir mit den Pilotdaten die Reliabilität jeder Skala. Lizenzen für die kommerzielle Nutzung werden mit den Autorinnen und Autoren geregelt.","T.faq.4.0":"Misst das Arbeitsstress oder Burnout?","T.faq.4.1":"Nicht direkt. Es misst psychische Ressourcen, die Menschen helfen, mit Druck umzugehen. Arbeitsbezogene Risiken wie Arbeitsbelastung und Autonomie werden mit einer Befragung zu den Arbeitsbedingungen gemessen. Beides ergänzt sich, und wir helfen Ihnen gern, beides zu kombinieren.","T.faq.5.0":"Funktioniert es auch für große Organisationen?","T.faq.5.1":"Ja. Ein Pilotprojekt kann in einer Abteilung oder an einem Standort beginnen und dann ausgeweitet werden. Die Anonymitätsregeln bleiben bei jeder Größe gleich: Ergebnisse nur für Gruppen ab 5 Personen.","T.faq.6.0":"Wie werden die Antworten in der Pilotphase gesammelt?","T.faq.6.1":"Alle Teilnehmenden senden einen anonymen Antwortcode (nur Antwortnummern und Funktionsebene) per E-Mail direkt an SoloNovate, nie an den Arbeitgeber. SoloNovate löscht diese E-Mails nach dem Einlesen. Für eine flächendeckende Einführung kann eine sichere Online-Erhebung eingerichtet werden.","T.faq.7.0":"Was passiert nach dem Bericht?","T.faq.7.1":"Eine Nachbesprechung, zwei oder drei Workshops unter der Leitung qualifizierter Fachleute aus unserem Partnernetzwerk in den Niederlanden und eine Wiederholungsmessung nach 3 bis 6 Monaten, um zu sehen, was sich verändert hat.","T.ctaT":"Interesse an einem Pilotprojekt?","T.ctaP":"Probieren Sie den Check selbst aus, sehen Sie sich den Beispielbericht an und senden Sie eine kurze Anfrage.","T.calcT":"Was kosten Sie psychisch bedingte Fehlzeiten?","T.calcP":"Eine schnelle Schätzung für Ihre Organisation. Passen Sie die Zahlen an Ihre Situation an.","T.cEmp":"Anzahl der Mitarbeitenden","T.cAbs":"Krankenstand (%)","T.cAbsH":"Niederländischer Durchschnitt 2025: 5,4 %","T.cSal":"Durchschnittliches Bruttojahresgehalt (€)","T.cShare":"Anteil der Fehltage aufgrund von Stress oder psychischen Beschwerden (%)","T.cShareH":"Landesweite Schätzung: etwa ein Viertel","T.cRed":"Illustratives Szenario (keine erwartete Wirkung): psychisch bedingte Fehlzeiten sinken um","T.cDays":"Fehltage pro Jahr","T.cStress":"davon psychisch bedingt","T.cCost":"Kosten psychisch bedingter Fehlzeiten pro Jahr","T.cSave":"Einsparung pro Jahr in diesem Szenario","T.cPerDay":"Hier verwendete Kosten pro Fehltag: {x} (Gehalt × 1,3 für Arbeitgeberkosten ÷ 220 Arbeitstage). Niederländische Schätzungen liegen zwischen 250 € und 400 € pro Tag.","T.cNote":"Das ist ein Szenario, keine Vorhersage. Es gibt noch keine direkten Belege dafür, dass dieser Check und seine Workshops Fehlzeiten verringern, und ein Fragebogenwert lässt sich nicht direkt in weniger Fehltage übersetzen. Nutzen Sie die Schätzung, um zu beurteilen, ob sich eine Investition in Prävention lohnt, und die Wiederholungsmessung, um zu sehen, was sich tatsächlich verändert hat.","T.wsPartner":"Durchführung: Jeder Workshop wird von einer erfahrenen Psychologin, einem Psychologen, einer Trainerin oder einem Trainer in den Niederlanden geleitet, die bzw. den wir für Ihren Auftrag auswählen. Sie lernen diese Person vor der Nachbesprechung kennen.","T.pilotNoteT":"Zu dieser Pilotversion","T.pilotNote":"In der Pilotphase werden die Antworten nur für den Bericht Ihrer Organisation und zur Prüfung der Reliabilität der Fragebögen verwendet. Lizenzen für die kommerzielle Nutzung der Fragebögen werden mit den Autorinnen und Autoren geregelt.","T.arboT":"Unterstützung für Ihr PSA-Konzept nach der Arbowet","T.arboP":"Arbeitgeber in den Niederlanden müssen ein Konzept haben, um psychosoziale Arbeitsbelastung (PSA) wie Arbeitsstress zu verhindern oder zumindest zu begrenzen, und die PSA-Risiken in ihrer Risikoinventarisierung und -evaluierung (RI&E) bewerten und dazu einen Maßnahmenplan aufstellen. Das Gesetz verlangt, Arbeitsstress zuerst an der Quelle anzugehen (Arbeitsbelastung, Autonomie, Unterstützung) und erst danach mit individuellen Maßnahmen. Dieser Check und seine Workshops sind eine solche individuelle Maßnahme: eine sinnvolle Ergänzung, niemals ein Ersatz.","T.arbo.0.0":"Ein Baustein für den PSA-Teil Ihrer RI&E","T.arbo.0.1":"PSA-Risiken betreffen vor allem die Arbeit selbst: Arbeitsbelastung, Autonomie, Unterstützung und unerwünschtes Verhalten. Dieser Check ergänzt die andere Seite: welche psychischen Ressourcen Ihre Teams haben, nach Funktionsebene. Nutzen Sie ihn zusätzlich zu einer Befragung zu den Arbeitsbedingungen, nicht als Ersatz dafür.","T.arbo.1.0":"Grundlage für Ihren Maßnahmenplan","T.arbo.1.1":"Workshops und Wiederholungsmessung können in Ihrem Maßnahmenplan als Maßnahmen auf individueller Ebene festgehalten werden – neben Maßnahmen, die bei der Arbeit selbst ansetzen.","T.arbo.2.0":"Sichtbare Nachverfolgung","T.arbo.2.1":"Vorher-nachher-Ergebnisse helfen, dem Betriebsrat zu zeigen, dass Sie gegen die Risiken aktiv werden.","T.arboNote":"Der Check ersetzt weder Ihre RI&E noch eine Befragung zu den Arbeitsbedingungen oder die Prüfung durch eine zertifizierte Fachperson; er ergänzt sie.","T.fName":"Ihr Name","T.fOrg":"Organisation","T.fMail":"E-Mail","T.fSize":"Anzahl der Mitarbeitenden","T.fMsg":"Nachricht (optional)","T.fSend":"Pilotprojekt anfragen","T.fSent":"Ihr E-Mail-Programm öffnet sich mit der ausgefüllten Anfrage; Sie müssen nur noch auf Senden klicken.","T.sizes.0":"20–50","T.sizes.1":"50–250","T.sizes.2":"250–1.000","T.sizes.3":"1.000+","T.sizes.4":"Sonstige","T.ctaAbout":"Über Maryam Jaberi","T.pPlan":"Diesen Workshop anfragen (E-Mail)","T.nSrc":"Quellen","T.sT":"Quellen","T.sP":"Alle Zahlen, Rechtsverweise und Forschungsaussagen dieser Website, mit Link zum Original. Titel von Publikationen stehen in ihrer Originalsprache.","T.gStats":"Zahlen und Kosten","T.gLaw":"Gesetze und Vorschriften","T.gEv":"Forschung hinter den Workshops","T.gInst":"Fragebögen","T.gCourse":"Kurs","T.courseRef":"Mokri, A. Persönliche und menschliche Kompetenzen in Organisationen und Bildungseinrichtungen [Kurs; Persisch]. Kursnotizen, gesammelt im Psychologie-Wiki.","T.audT":"Wo möchten Sie anfangen?","T.paths.0.1":"Geschäftsleitung","T.paths.0.2":"Warum es sich lohnt, was Sie erhalten und wie ein Pilotprojekt abläuft.","T.paths.0.3":"Schätzung der Fehlzeitenkosten","T.paths.1.1":"Personalabteilung","T.paths.1.2":"Der Ablauf Woche für Woche, wer was tut, und fertige Dokumente.","T.paths.1.3":"Ablauf und Dokumente","T.paths.2.1":"Mitarbeitende","T.paths.2.2":"Was mit Ihren Antworten passiert – und wie Sie den Check selbst ausprobieren können.","T.paths.2.3":"Ihr Datenschutz","T.paths.3.1":"Psychologinnen, Psychologen, Trainerinnen und Trainer","T.paths.3.2":"Fragebögen, Evidenz und Zusammenarbeit mit uns als Partner.","T.paths.3.3":"Zusammenarbeit","T.tryIt":"Check selbst ausprobieren (8 Min.)","T.jT":"Von der Messung zur Maßnahme","T.jP":"Etwa fünf Wochen vom Auftakt bis zur Nachbesprechung, danach Workshops. Für eine Abteilung oder die ganze Organisation.","T.jAfter.0":"Danach","T.jAfter.1":"Workshops und Wiederholungsmessung","T.jAfter.2":"Workshops unter der Leitung einer erfahrenen Psychologin, eines Psychologen, einer Trainerin oder eines Trainers; eine Wiederholungsmessung nach 3–6 Monaten zeigt, ob sich die Werte verändert haben.","T.company":"SoloNovate · Rotterdam · KvK 94264759 · USt-IdNr. NL005072230B46","T.teamT":"Das Team","T.teamP":"Bewusst klein: Sie wissen immer, mit wem Sie es zu tun haben.","T.meRole":"Gründerin von SoloNovate · Produkt und Daten","T.meBio":"Produktmanagerin und UX-Researcherin mit Erfahrung in den Bereichen Suche, Video und Bildungsplattformen. Entwirft den Check, schützt die Daten und schreibt Ihren Bericht; die Partnerpsychologin bzw. der Partnerpsychologe prüft die Interpretation.","T.meLangs":"Niederländisch, Englisch, Persisch","T.phName":"[Name der Psychologin / des Psychologen]","T.phRole":"Psychologin/Psychologe · [Registrierung, z. B. NIP oder BIG]","T.phBio":"[Zwei oder drei Sätze: Erfahrung, Schwerpunkt, mit welchen Organisationen und Teams gearbeitet wurde.]","T.phLangs":"[Sprachen der Workshops]","T.phNote":"Vorschau – so sieht das Profil der Partnerin oder des Partners aus, sobald es ausgefüllt ist.","T.langsL":"Sprachen","T.profile":"Profil","T.nProc":"So funktioniert es","T.prT":"So funktioniert es","T.prP":"Ein klarer Ablauf mit einem kleinen Team: wer was tut, wer was sieht und welche Dokumente wir unterschreiben. Keine Überraschungen für Leitung oder Mitarbeitende.","T.rolesT":"Wer macht was","T.roles.0.2":"Ihre feste Ansprechpartnerin","T.roles.0.3":"Richtet die Befragung ein, schützt die Daten, analysiert die Antworten, schreibt den Bericht und koordiniert alles vom Auftakt bis zur Wiederholungsmessung.","T.roles.1.1":"Partner-Psychologin/-Psychologe","T.roles.1.2":"Erfahren, leitet Workshops für Organisationen","T.roles.1.3":"Prüft die Interpretation des Berichts, nimmt an der Nachbesprechung teil und leitet die Workshops, die Ihre Teams auswählen.","T.roles.2.1":"Ihre Kontaktperson","T.roles.2.2":"Oft die Personalabteilung oder das Office-Management","T.roles.2.3":"Plant mit uns den Befragungszeitraum, bereitet die Mitteilung an die Mitarbeitenden vor, die die Leitung versendet, und ist das Bindeglied zur Leitung.","T.roles.3.1":"Mitarbeitende","T.roles.3.2":"Um sie geht es","T.roles.3.3":"Entscheiden selbst, ob sie teilnehmen, antworten anonym in 8–18 Minuten und sehen sofort ihr eigenes Ergebnis.","T.roles.4.1":"Leitung","T.roles.4.2":"Verantwortlich für die Umsetzung","T.roles.4.3":"Erhält den Gruppenbericht, bespricht ihn in der Nachbesprechung, wählt die nächsten Schritte und teilt eine Zusammenfassung mit den Mitarbeitenden.","T.roles.5.1":"Betriebsrat","T.roles.5.2":"Sofern vorhanden","T.roles.5.3":"Wird vorab informiert und erteilt seine Zustimmung, wo dies gesetzlich vorgeschrieben ist.","T.flowT":"Der Ablauf, Woche für Woche","T.flow.0.0":"Woche 0","T.flow.0.1":"Auftakt","T.flow.0.2.1":"Kontaktperson","T.flow.0.3":"30 Minuten: Ziele, Funktionsebenen und Planung. Wir unterschreiben die Pilotvereinbarung und den Auftragsverarbeitungsvertrag.","T.flow.1.0":"Woche 0","T.flow.1.1":"Mitarbeitende informieren","T.flow.1.2.0":"Leitung","T.flow.1.2.1":"Betriebsrat","T.flow.1.3":"Die Leitung verschickt die vorbereitete Nachricht: warum die Befragung stattfindet, wie die Anonymität gewährleistet ist und was mit den Ergebnissen passiert.","T.flow.2.0":"Wochen 1–2","T.flow.2.1":"Befragung läuft","T.flow.2.2.0":"Mitarbeitende","T.flow.2.3":"Anonyme Fragebögen am Handy oder Computer. Alle sehen ihr eigenes Ergebnis sofort. Eine Erinnerung zur Halbzeit.","T.flow.3.0":"Woche 3","T.flow.3.1":"Analyse und Bericht","T.flow.3.2.1":"Psychologin/Psychologe","T.flow.3.3":"Wir analysieren die Gruppendaten, und die Psychologin oder der Psychologe prüft die Interpretation. Gruppen mit weniger als 5 Personen bleiben ausgeblendet.","T.flow.4.0":"Woche 4","T.flow.4.1":"Nachbesprechung","T.flow.4.2.1":"Psychologin/Psychologe","T.flow.4.2.2":"Leitung","T.flow.4.3":"45 Minuten: was die Ergebnisse bedeuten und mit welchen zwei oder drei Workshops Sie beginnen.","T.flow.5.0":"Woche 4","T.flow.5.1":"Rückmeldung an das Team","T.flow.5.2.0":"Leitung","T.flow.5.3":"Eine kurze Zusammenfassung geht an alle Mitarbeitenden. Wer mitgemacht hat, soll auch erfahren, was daraus wird.","T.flow.6.0":"Danach","T.flow.6.1":"Workshops und Wiederholungsmessung","T.flow.6.2.0":"Psychologin/Psychologe","T.flow.6.3":"Die Psychologin oder der Psychologe leitet die Workshops; eine Wiederholungsmessung nach 3–6 Monaten zeigt, ob sich die Werte verändert haben.","T.seeT":"Wer sieht was","T.seeP":"Anonymität ist fest im Ablauf verankert, nicht nur versprochen.","T.seeCols.0":"Einzelantworten (ohne Namen)","T.seeCols.1":"Gruppenbericht (ab 5 Personen)","T.see.0.0":"Mitarbeitende","T.see.0.1":"Nur die eigenen","T.see.0.2":"Zusammenfassung","T.see.1.0":"Leitung und Personalabteilung","T.see.1.1":"Nie","T.see.1.2":"Ja","T.see.2.0":"Partner-Psychologin/-Psychologe","T.see.2.1":"Nie","T.see.2.2":"Ja","T.see.3.1":"Ja, ohne Namen (E-Mail wird nach dem Einlesen gelöscht)","T.see.3.2":"Ja","T.empT":"Für Mitarbeitende: was mit Ihren Antworten passiert","T.emp.0":"Sie werden nie nach Ihrem Namen, Ihrer E-Mail-Adresse oder Personalnummer gefragt.","T.emp.1":"Ihre Führungskraft und die Personalabteilung sehen nur Ergebnisse von Gruppen ab 5 Personen.","T.emp.2":"Sie sehen Ihr eigenes Ergebnis sofort, mit zwei praktischen Tipps. Nur Sie sehen es.","T.emp.3":"Die Teilnahme ist freiwillig. Sie können jederzeit aufhören; Ihre Antworten werden nur verwendet, wenn Sie Ihren Antwortcode senden.","T.emp.4":"Wenn Sie einen Antwortcode senden, dann an SoloNovate – nie an Ihre Führungskraft oder die Personalabteilung.","T.docsT":"Beispieldokumente","T.docsP":"Damit Sie vorher genau wissen, was Sie unterschreiben. Jedes Dokument gibt es auf Niederländisch und Englisch, und es lässt sich drucken oder als PDF speichern. Es sind Entwürfe, die wir vor dem Pilotprojekt gemeinsam fertigstellen.","T.docs.pilot-agreement.0":"Pilotvereinbarung","T.docs.pilot-agreement.1":"Was das Pilotprojekt umfasst, Rollen, Anonymität, Preis, Haftung.","T.docs.data-processing.0":"Auftragsverarbeitungsvertrag","T.docs.data-processing.1":"DSGVO Art. 28: welche Daten, Sicherheit, Aufbewahrung und Datenpannen.","T.docs.privacy-participants.0":"Datenschutzhinweis für Teilnehmende","T.docs.privacy-participants.1":"In einfacher Sprache für Mitarbeitende: wer was sieht und welche Rechte Sie haben.","T.docs.staff-announcement.0":"Ankündigung an die Mitarbeitenden","T.docs.staff-announcement.1":"Vorlage für eine Nachricht der Leitung, fertig zum Anpassen.","T.aud.mgmt":"Für die Leitung","T.aud.staff":"Für Mitarbeitende","T.aud.hr":"Für die Personalabteilung","T.open":"Öffnen (Niederländisch / Englisch)","T.rMail":"Code per E-Mail an SoloNovate senden","T.partT":"Für Psychologinnen, Psychologen, Trainerinnen und Trainer","T.partP":"Leiten Sie Workshops oder Coachings für Organisationen? Wir bauen ein kleines Partnernetzwerk auf.","T.partL.0":"Wir übernehmen Messung, Bericht und Kundenkontakt; Sie tun, was Sie am besten können.","T.partL.1":"Jeder Auftrag beginnt mit Daten: Sie wissen vor der ersten Sitzung, welche Themen und Funktionsebenen Aufmerksamkeit brauchen.","T.partL.2":"Workshop-Konzepte mit Evidenz und Quellen liegen einsatzbereit vor und lassen sich anpassen.","T.partL.3":"Sie legen Ihre eigenen Honorare fest und entscheiden, welche Aufträge Sie annehmen.","T.partAsk":"Wir erwarten Erfahrung in der Arbeit mit Gruppen in Organisationen, eine einschlägige Berufsregistrierung (zum Beispiel NIP oder BIG) und die Bereitschaft, Workshops auf Niederländisch oder Englisch zu leiten.","T.partCta":"Partner werden","T.partSubj":"Partneranfrage – Wohlbefindens-Check","T.rvTabs":"Berichtsansichten","T.whatL":"Was Sie sehen","T.howL":"Lesehilfe","T.keyL":"Wichtigste Erkenntnis","T.srcL":"Quelle","T.rv.sum.0":"Zusammenfassung","T.rv.sum.1":"Die wichtigsten Ergebnisse in einfacher Sprache.","T.rv.sum.2":"Die Werte reichen von 0 bis 100: 0 entspricht der niedrigsten möglichen Antwort bei allen Fragen, 100 der höchsten. Unter 37,5 = braucht Aufmerksamkeit, 37,5–62,5 = mittel, über 62,5 = stark. Jeder Fragebogen hat sein eigenes typisches Werteniveau; vergleichen Sie eine Dimension daher besser zwischen Funktionsebenen oder im Zeitverlauf als mit anderen Dimensionen.","T.rv.heat.0":"Nach Funktionsebene","T.rv.heat.1":"Der Durchschnittswert jeder Funktionsebene in jeder Dimension.","T.rv.heat.2":"Lesen Sie eine Zeile, um die Ebenen zu vergleichen; eine Spalte zeigt das Profil einer Ebene. Warme Farben bedeuten „braucht Aufmerksamkeit“, Grün bedeutet „stark“. Gruppen mit weniger als 5 Personen sind ausgeblendet.","T.rv.gap.0":"Unterschiede zwischen Ebenen","T.rv.gap.1":"Für jede Dimension: wo jede Funktionsebene liegt, vom niedrigsten bis zum höchsten Wert.","T.rv.gap.2":"Eine lange Linie bedeutet, dass die Funktionsebenen sehr unterschiedliche Werte haben. Das kann an den Anforderungen der Rolle liegen, aber auch daran, wer in welcher Rolle landet; besprechen Sie es in der Nachbesprechung, bevor Sie Schlüsse ziehen.","T.rv.dist.0":"Verteilung","T.rv.dist.1":"Wie viele Personen in jeden Bereich fallen, je Dimension.","T.rv.dist.2":"Ein Durchschnitt kann eine Gruppe verbergen, der es schlecht geht. Der rote Teil zeigt den Anteil der Personen im Bereich „braucht Aufmerksamkeit“.","T.rv.prof.0":"Profil einer Ebene","T.rv.prof.1":"Eine Funktionsebene im Vergleich zu den anderen Ebenen.","T.rv.prof.2":"Der Balken ist der Wert der Ebene, die dünne Linie der Durchschnitt der anderen Ebenen. Unterschiede von weniger als etwa 5 Punkten sind meist nicht aussagekräftig, und bei Ebenen mit weniger als 20 Personen können auch größere Unterschiede zufällig sein.","T.rv.sub.0":"Teilwerte","T.rv.sub.1":"Die Bestandteile jeder Dimension.","T.rv.sub.2":"Wenn eine Dimension niedrig ist, zeigt dies, welcher Teil am niedrigsten liegt. Die Teilbereiche von Selbstmitgefühl beruhen auf jeweils 2 Fragen, und die Autorinnen und Autoren empfehlen, nur den Gesamtwert zu verwenden; verstehen Sie sie daher als Gesprächsanstöße für die Nachbesprechung, nicht als Messungen.","T.rv.time.0":"Verlauf","T.rv.time.1":"Die erste Messung im Vergleich zur Wiederholungsmessung.","T.rv.time.2":"Heller Balken = erste Messung, dunkler Balken = Wiederholungsmessung. Ob eine Veränderung mehr als Zufall ist, hängt von der Gruppengröße ab; jedes Mal können andere Personen teilnehmen, und auch andere Ereignisse spielen eine Rolle. Eine Veränderung zeigt also, was sich bewegt hat, nicht warum.","T.rv.plan.0":"Maßnahmenplan","T.rv.plan.1":"Woran Sie zuerst arbeiten, für wen und mit welchem Workshop.","T.rv.plan.2":"Eine Dimension wird als Priorität vorgeschlagen, wenn mehr als 25 % der Personen im Bereich „braucht Aufmerksamkeit“ liegen oder wenn eine Funktionsebene mit 10 oder mehr Personen mindestens 5 Punkte unter den anderen Ebenen liegt. Wir zeigen die drei wichtigsten; die übrigen stehen unter „Ebenfalls im Blick behalten“. Das ist ein Ausgangspunkt für die Nachbesprechung, kein Urteil.","T.kpiSub.0":"Personen haben geantwortet","T.kpiSub.1":"Funktionsebenen mit mind. 5 Personen","T.kpiSub.2":"hier in der Nachbesprechung beginnen","T.kpiSub.3":"Durchschnitt über die acht Dimensionen","T.sumN":"Basierend auf {n} Teilnehmenden in {k} Funktionsebenen.","T.sumStrong":"Höchste Werte: {a}.","T.sumWeak":"Niedrigster Wert: {d} ({m}); {p} der Personen liegen im Bereich „braucht Aufmerksamkeit“.","T.sumGap":"Größter Unterschied zwischen den Ebenen: {d} – {hi}: {a}, {lo}: {b}.","T.sumNext":"Vorgeschlagener erster Schritt: der Workshop „{w}“ – Zielgruppe: {who}.","T.and":"und","T.heatKey":"Niedrigster Wert: {lv} bei {d} ({v}). Höchster: {lv2} bei {d2} ({v2}).","T.gapKey":"Größter Unterschied: {d} – {lo}: {a}, {hi}: {b} ({x} Punkte).","T.distKey":"{d}: {p} der Personen liegen im Bereich „braucht Aufmerksamkeit“, obwohl der Durchschnitt ({m}) im mittleren Bereich liegt.","T.profSel":"Funktionsebene","T.profUp":"{lv} – im Vergleich zu den anderen Ebenen höhere Werte bei: {a}.","T.profDown":"{lv} – im Vergleich zu den anderen Ebenen niedrigere Werte bei: {b}.","T.profFlat":"{lv}: in allen Dimensionen nah an den anderen Ebenen.","T.orgAvg":"Durchschnitt der anderen Ebenen","T.subKey":"Niedrigster Teilwert: {s} innerhalb der Dimension {d} ({v}).","T.timeDemo":"Simuliertes Beispiel: Wiederholungsmessung vier Monate nach Workshops zu Selbstmitgefühl und Flow.","T.timeKey":"Größte Veränderung: {d} ({x} Punkte). Veränderungen unter etwa 5 Punkten können bei diesen Gruppengrößen zufällig sein.","T.timeNone":"Diese Ansicht ist nach der Wiederholungsmessung verfügbar (3–6 Monate nach den Workshops).","T.t1":"Erste Messung","T.t2":"Wiederholungsmessung","T.rHow":"Die Farben zeigen den Bereich: Rot = braucht Aufmerksamkeit, Gelb = mittel, Grün = stark. Jeder Fragebogen hat sein eigenes typisches Werteniveau; vergleichen Sie eine Dimension daher besser mit sich selbst im Zeitverlauf als mit anderen Dimensionen.","T.ariaHome":"Startseite","T.ariaNav":"Bereiche","T.ariaLang":"Sprache","T.tUnval":"Diese Fragen sind unsere eigene deutsche Übersetzung der Originalfragebögen und noch nicht gesondert validiert. Sie werden genauso ausgewertet; ihre Reliabilität prüfen wir in der Pilotphase.","DIMS.compassion.n":"Selbstmitgefühl","DIMS.compassion.q":"Bin ich freundlich oder hart zu mir, wenn ich scheitere oder es schwer habe?","DIMS.compassion.what":"Wie Menschen in Zeiten von Misserfolg und Schmerz mit sich umgehen: freundlich und ausgeglichen oder selbstkritisch und überwältigt.","DIMS.compassion.not":"Selbstmitgefühl ist nicht dasselbe wie Faulheit, Egoismus oder das Senken der eigenen Ansprüche.","DIMS.compassion.b.0":"Die Selbstkritik ist stark. Fehler werden wahrscheinlich mit Vorwürfen, Rückzug und Grübeln beantwortet.","DIMS.compassion.b.1":"In schwierigen Momenten weder sehr hart noch durchgehend freundlich zu sich selbst.","DIMS.compassion.b.2":"In schweren Zeiten freundlich und ausgeglichen sich selbst gegenüber; lernt aus Fehlern, ohne sich selbst anzugreifen.","DIMS.compassion.tips.0":"Fragen Sie sich nach einem Fehler: „Was würde ich einer Freundin oder einem Freund in dieser Lage sagen?“ – und sagen Sie es sich selbst.","DIMS.compassion.tips.1":"Denken Sie daran, dass alle Menschen Fehler machen; benennen Sie das Gefühl, ohne darin zu versinken.","DIMS.flex.n":"Psychologische Flexibilität","DIMS.flex.q":"Halten mich schwierige Gedanken und Gefühle von dem ab, was mir wichtig ist?","DIMS.flex.what":"Wie sehr unangenehme Gedanken und Gefühle einem Leben und Arbeiten nach den eigenen Werten im Weg stehen.","DIMS.flex.not":"Ein niedriger Wert ist keine Diagnose; er bedeutet, dass schwierige Gedanken und Gefühle derzeit oft dem im Weg stehen, was Ihnen wichtig ist.","DIMS.flex.b.0":"Schmerzhafte Gedanken und Gefühle nehmen viel Raum ein und blockieren wahrscheinlich wichtige Handlungen.","DIMS.flex.b.1":"Schwierige Gedanken und Gefühle stehen manchmal im Weg, doch meist geht es weiter in Richtung dessen, was wichtig ist.","DIMS.flex.b.2":"Kann sich auch bei schwierigen Gefühlen auf das zubewegen, was wichtig ist.","DIMS.flex.tips.0":"Statt gegen einen Gedanken anzukämpfen, sagen Sie sich: „Ich habe den Gedanken, dass …“ – und machen Sie den nächsten kleinen Schritt.","DIMS.flex.tips.1":"Tun Sie jeden Tag eine kleine Handlung, die zu Ihren Werten passt, auch wenn Sie sich noch nicht ganz bereit fühlen.","DIMS.optim.n":"Optimismus","DIMS.optim.q":"Erwarte ich im Allgemeinen, dass die Dinge gut ausgehen?","DIMS.optim.what":"Die allgemeine Erwartung eines Menschen an die Zukunft: eher Gutes oder eher Schlechtes.","DIMS.optim.not":"Es geht nicht um die Zukunft der Organisation oder die Arbeitszufriedenheit; Optimismus ist ein eher stabiles persönliches Merkmal.","DIMS.optim.b.0":"Die Erwartung, dass Dinge schlecht ausgehen, ist ausgeprägt; die Energie, dranzubleiben, ist womöglich geringer.","DIMS.optim.b.1":"Mittlere Erwartungen an die Zukunft; weder deutlich optimistisch noch pessimistisch.","DIMS.optim.b.2":"Erwartet im Allgemeinen, dass Dinge gut ausgehen; in Studien geht dies mit mehr Ausdauer und besserer Gesundheit einher.","DIMS.optim.tips.0":"Schreiben Sie einige Minuten über Ihr „bestmögliches Selbst“ in einem Jahr; diese Übung hat in Studien den Optimismus gesteigert.","DIMS.optim.tips.1":"Schreiben Sie neben jede Sorge einen Plan „Wenn das passiert, dann werde ich …“.","DIMS.hope.n":"Hoffnung","DIMS.hope.q":"Habe ich Ziele, Wege dorthin und die Energie, sie anzugehen?","DIMS.hope.what":"Hoffnung im wissenschaftlichen Sinn: Ziele haben, Wege zu ihnen finden (engl. pathways) und die Energie und Zuversicht haben, sie zu verfolgen (Antrieb, engl. agency).","DIMS.hope.not":"Nicht dasselbe wie Optimismus; Hoffnung betrifft die eigene Fähigkeit, ans Ziel zu kommen.","DIMS.hope.b.0":"Wege oder Energie zum Erreichen von Zielen sind gering; das Gefühl, festzustecken, ist wahrscheinlicher.","DIMS.hope.b.1":"Ziele und Wege sind da, aber die Energie sinkt, wenn Hindernisse auftauchen.","DIMS.hope.b.2":"Klare Ziele, mehrere Wege und genug Energie; in Studien mit etwas besseren Leistungen verbunden.","DIMS.hope.tips.0":"Schreiben Sie für ein wichtiges Ziel mindestens drei verschiedene Wege auf.","DIMS.hope.tips.1":"Nutzen Sie WOOP: Wunsch (Wish), Ergebnis (Outcome), inneres Hindernis (Obstacle) und einen „Wenn … dann …“-Plan.","DIMS.belong.n":"Zugehörigkeit","DIMS.belong.q":"Fühle ich mich als Teil der Gruppe und akzeptiert?","DIMS.belong.what":"Ein allgemeines Gefühl von Zugehörigkeit und Akzeptanz in Beziehungen, im Leben und im Umgang mit anderen.","DIMS.belong.not":"Nicht nur auf den Arbeitsplatz bezogen; gemessen wird Zugehörigkeit in allen Lebensbereichen.","DIMS.belong.b.0":"Ein starkes Gefühl, außen vor zu sein oder abgelehnt zu werden; in der Forschung geht dies mit geringerem Wohlbefinden einher.","DIMS.belong.b.1":"Ein mittleres Gefühl von Zugehörigkeit und Akzeptanz; weder stark verbunden noch deutlich außen vor.","DIMS.belong.b.2":"Fühlt sich akzeptiert und verbunden; eine wichtige Säule der psychischen Gesundheit.","DIMS.belong.tips.0":"Führen Sie diese Woche ein kurzes Gespräch mit einer Kollegin oder einem Kollegen, das sich nicht um die Arbeit dreht.","DIMS.belong.tips.1":"Bitten Sie jemanden, Sie in eine Aufgabe oder einen Plan einzubeziehen; auch um Hilfe zu bitten, schafft Verbundenheit.","DIMS.flow.n":"Flow bei der Arbeit","DIMS.flow.q":"Gehe ich in meiner Arbeit auf, genieße ich sie und tue ich sie um ihrer selbst willen?","DIMS.flow.what":"Flow bei der Arbeit in den letzten zwei Wochen: Vertiefung, Freude und intrinsische Motivation.","DIMS.flow.not":"Weder Einsatz noch Arbeitsstunden; gemessen wird die Qualität des Arbeitserlebens.","DIMS.flow.b.0":"Die Arbeit fesselt oder erfreut weniger; möglicherweise gibt es viele Unterbrechungen oder wenig Sinnerleben.","DIMS.flow.b.1":"Vertiefung, Freude und Motivation bei der Arbeit sind mittel ausgeprägt.","DIMS.flow.b.2":"Vertieft, mit Freude und intrinsisch motiviert; verbunden mit besserer Leistung und mehr Sinnerleben.","DIMS.flow.tips.0":"Blocken Sie jeden Tag 60–90 Minuten für konzentrierte Arbeit ohne Nachrichten oder Meetings.","DIMS.flow.tips.1":"Gestalten Sie einen Teil Ihrer Arbeit so um, dass er besser zu Ihren Stärken und Interessen passt (Job Crafting).","DIMS.ei.n":"Emotionale Intelligenz","DIMS.ei.q":"Verstehe und steuere ich meine eigenen Gefühle und die anderer?","DIMS.ei.what":"Wie Menschen ihre Fähigkeiten einschätzen, Gefühle bei sich und anderen zu verstehen und zu steuern.","DIMS.ei.not":"Selbsteinschätzung, kein Fähigkeitstest; kann von der tatsächlichen Fähigkeit abweichen.","DIMS.ei.b.0":"Schätzt sich als weniger kompetent darin ein, Gefühle zu erkennen oder zu steuern.","DIMS.ei.b.1":"Schätzt die eigenen emotionalen Fähigkeiten als mittel ein.","DIMS.ei.b.2":"Sieht sich als fähig, Gefühle bei sich und anderen zu verstehen und zu steuern.","DIMS.ei.tips.0":"Geben Sie Ihrem Gefühl dreimal am Tag einen genauen Namen („genervt“ statt „schlecht“).","DIMS.ei.tips.1":"Wenn eine Kollegin oder ein Kollege aufgewühlt ist, spiegeln Sie zuerst („du wirkst müde“) und bieten dann Lösungen an.","DIMS.selfctrl.n":"Selbstkontrolle","DIMS.selfctrl.q":"Widerstehe ich Versuchungen und bleibe ich bei langfristigen Zielen?","DIMS.selfctrl.what":"Wie Personen ihre eigene Fähigkeit einschätzen, Impulse zu kontrollieren, Versuchungen zu widerstehen und bei langfristigen Zielen zu bleiben.","DIMS.selfctrl.not":"Ein niedriger Wert bedeutet keinen schwachen Willen; Umgebung und Gewohnheiten spielen eine große Rolle.","DIMS.selfctrl.b.0":"Versuchungen und Ablenkungen gewinnen oft; die Umgebung und Gewohnheiten zu verändern hilft oft mehr, als sich mehr anzustrengen.","DIMS.selfctrl.b.1":"Mittlere Selbstkontrolle nach eigener Einschätzung; langfristige Ziele setzen sich manchmal durch.","DIMS.selfctrl.b.2":"Bleibt meist bei langfristigen Zielen; in der Forschung geht dies oft mit guten Gewohnheiten einher.","DIMS.selfctrl.tips.0":"Gestalten Sie Ihre Umgebung: Legen Sie Ihr Handy während konzentrierter Arbeit in einen anderen Raum.","DIMS.selfctrl.tips.1":"Verbinden Sie eine schwierige Aufgabe mit einem kleinen Vergnügen (z. B. Ihren Lieblingspodcast nur beim Spazierengehen hören).","WS.w-comp.t":"Selbstmitgefühl und der innere Kritiker","WS.w-comp.who":"Alle Ebenen; Version für Führungskräfte: mitfühlende Führung","WS.w-comp.goals.0":"Den inneren Kritiker und seine Kosten erkennen","WS.w-comp.goals.1":"Die drei Komponenten des Selbstmitgefühls üben: Selbstfreundlichkeit, gemeinsames Menschsein, Achtsamkeit","WS.w-comp.goals.2":"Mit Fehlern im Team umgehen, ohne jemanden bloßzustellen","WS.w-comp.ev":"Eine Metaanalyse von 27 randomisierten Studien fand mittlere Effekte von Selbstmitgefühlsprogrammen – meist über mehrere Wochen – auf Selbstkritik und Stress. Die Effekte eines Workshops mit zwei Terminen sind vermutlich kleiner.","WSLEN.w-comp":"2 × 3 Stunden","WS.w-flex.t":"Psychologische Flexibilität und Emotionsregulation","WS.w-flex.who":"Alle Ebenen, besonders Rollen mit hohem Druck","WS.w-flex.goals.0":"Abstand zu Gedanken gewinnen, ohne gegen sie anzukämpfen","WS.w-flex.goals.1":"Berufliche Werte klären","WS.w-flex.goals.2":"Das Prozessmodell der Emotionsregulation und vier vorausschauende Strategien","WS.w-flex.ev":"Eine Metaanalyse von 17 Studien zu Acceptance-and-Commitment-Trainings (ACT) am Arbeitsplatz fand eine kleine bis mittlere Verringerung psychischer Belastung und eine Zunahme psychologischer Flexibilität; am deutlichsten waren die Effekte bei Büroangestellten, gering beim Personal im Gesundheitswesen.","WSLEN.w-flex":"2 × 3 Stunden","WS.w-hope.t":"Hoffnung und realistischer Optimismus","WS.w-hope.who":"Alle Ebenen; geeignet in Zeiten organisatorischer Veränderung","WS.w-hope.goals.0":"Die Übung „bestmögliches Selbst“","WS.w-hope.goals.1":"WOOP und „Wenn … dann …“-Pläne","WS.w-hope.goals.2":"Das Fortschrittsprinzip: kleine Erfolge wahrnehmen","WS.w-hope.ev":"WOOP (mentales Kontrastieren mit „Wenn … dann …“-Plänen) hat einen kleinen bis mittleren Effekt auf das Erreichen von Zielen; die Übung „bestmögliches Selbst“ steigert den Optimismus leicht.","WSLEN.w-hope":"1 × 4 Stunden","WS.w-belong.t":"Zugehörigkeit und Verbundenheit bei der Arbeit","WS.w-belong.who":"Teams gemeinsam mit ihren Führungskräften","WS.w-belong.goals.0":"Niedrigschwelliger Kontakt: kurze Check-ins und echte Wertschätzung unter Kolleginnen und Kollegen","WS.w-belong.goals.1":"Onboarding- und Buddy-Programme für neue Mitarbeitende","WS.w-belong.goals.2":"Bedeutsamkeit („Mattering“): gesehen werden und etwas beitragen","WS.w-belong.ev":"Kurze Zugehörigkeitsinterventionen verbesserten die Ergebnisse von Studierenden, doch eine große Replikationsstudie von 2023 fand Effekte nur dort, wo das Umfeld echte Möglichkeiten zur Zugehörigkeit bot. Vergleichbare Studien am Arbeitsplatz gibt es noch nicht; der Workshop verbindet diese Idee daher mit Onboarding- und Buddy-Praktiken.","WSLEN.w-belong":"1 × 3 Stunden + Teamprogramm","WS.w-flow.t":"Konzentriertes Arbeiten, Flow und Abschalten","WS.w-flow.who":"Alle Ebenen; Version für Führungskräfte: Fokuszeit des Teams schützen","WS.w-flow.goals.0":"Job Crafting: die eigene Arbeit selbst umgestalten","WS.w-flow.goals.1":"Ungestörte Fokusblöcke","WS.w-flow.goals.2":"Psychisches Abschalten nach Feierabend","WS.w-flow.ev":"Metaanalysen bringen Job Crafting mit höherem Arbeitsengagement und Abschalten nach der Arbeit mit weniger Erschöpfung in Verbindung; diese Evidenz ist überwiegend korrelativ.","WSLEN.w-flow":"1 × 4 Stunden","WS.w-ei.t":"Emotionale Intelligenz in der Praxis","WS.w-ei.who":"Rollen mit Kundenkontakt, Führungskräfte und Vorgesetzte","WS.w-ei.goals.0":"Gefühle genau benennen","WS.w-ei.goals.1":"Auf die Gefühle von Kolleginnen, Kollegen und Kunden reagieren","WS.w-ei.goals.2":"Emotionsarbeit: ihren Preis erkennen","WS.w-ei.ev":"Im Durchschnitt steigert ein EI-Training die EI-Werte mäßig; selbst eingeschätzte EI überschneidet sich mit der Persönlichkeit, daher sollten die Werte mit Vorsicht interpretiert werden.","WSLEN.w-ei":"2 × 3 Stunden","WS.w-self.t":"Selbstkontrolle durch Gestaltung: Umgebung, Gewohnheiten und Versuchungsbündelung","WS.w-self.who":"Alle Ebenen; Version für Führungskräfte: Nudges und gesunde Voreinstellungen (Defaults)","WS.w-self.goals.0":"Situationen wählen und verändern, statt Willenskraft zu erzwingen","WS.w-self.goals.1":"Gewohnheiten und Erinnerungsreize aufbauen","WS.w-self.goals.2":"Versuchungsbündelung (eine kleine Belohnung an eine lästige Aufgabe koppeln) und Notreserven (geplante Ausnahmetage)","WS.w-self.ev":"Übersichtsarbeiten legen nahe, dass die Gestaltung der Situation besser wirkt, als sich im Moment auf Willenskraft zu verlassen; Versuchungsbündelung half in einem Feldexperiment, doch der Effekt ließ mit der Zeit nach.","WSLEN.w-self":"1 × 4 Stunden","LEVELS.staff":"Mitarbeitende","LEVELS.lead":"Teamleitungen","LEVELS.mid":"Mittleres Management","LEVELS.senior":"Obere Führungsebene","LEVELS.student":"Studierende","SUBN.scs.sk":"Selbstfreundlichkeit","SUBN.scs.sj":"Nicht übermäßig selbstkritisch","SUBN.scs.ch":"Gemeinsames Menschsein","SUBN.scs.is":"Sich in Schwierigkeiten nicht allein fühlen","SUBN.scs.mi":"Achtsamkeit","SUBN.scs.oi":"Nicht von Gefühlen mitgerissen","SUBN.ahs.path":"Wege (Möglichkeiten, Ziele zu erreichen)","SUBN.ahs.agency":"Antrieb (zielgerichtete Energie)","SUBN.gbs.acc":"Akzeptanz / Einbezogensein","SUBN.gbs.rej":"Weniger Ablehnung","SUBN.wolf.abs":"Vertiefung","SUBN.wolf.enj":"Freude an der Arbeit","SUBN.wolf.int":"Intrinsische Motivation","SUBN.sreis.p":"Gefühle wahrnehmen","SUBN.sreis.u":"Gefühle nutzen","SUBN.sreis.r":"Gefühle verstehen","SUBN.sreis.m1":"Eigene Gefühle steuern","SUBN.sreis.m2":"Gefühle anderer steuern","PACKS.quick":"Kurz","PACKS.standard":"Vollständig","INST.scs.name":"Selbstmitgefühlsskala – Kurzform","INST.scs.intro":"Wie gehen Sie in schwierigen Zeiten normalerweise mit sich selbst um?","INST.scs.anchors.0":"Fast nie","INST.scs.anchors.4":"Fast immer","INST.scs.items.0":"Wenn ich bei etwas scheitere, das mir wichtig ist, nehmen mich Gefühle der Unzulänglichkeit völlig ein.","INST.scs.items.1":"Ich versuche, verständnisvoll und geduldig mit den Seiten meiner Persönlichkeit zu sein, die ich nicht mag.","INST.scs.items.2":"Wenn etwas Schmerzhaftes passiert, versuche ich, die Situation ausgewogen zu betrachten.","INST.scs.items.3":"Wenn ich niedergeschlagen bin, habe ich oft das Gefühl, dass die meisten anderen wahrscheinlich glücklicher sind als ich.","INST.scs.items.4":"Ich versuche, meine Schwächen als Teil des Menschseins zu sehen.","INST.scs.items.5":"Wenn ich eine sehr schwere Zeit durchmache, schenke ich mir die Fürsorge und Zuwendung, die ich brauche.","INST.scs.items.6":"Wenn mich etwas aufregt, versuche ich, meine Gefühle im Gleichgewicht zu halten.","INST.scs.items.7":"Wenn ich bei etwas scheitere, das mir wichtig ist, fühle ich mich mit meinem Scheitern oft allein.","INST.scs.items.8":"Wenn ich niedergeschlagen bin, neige ich dazu, zu grübeln und mich auf alles zu fixieren, was nicht stimmt.","INST.scs.items.9":"Wenn ich mich irgendwie unzulänglich fühle, versuche ich mir in Erinnerung zu rufen, dass die meisten Menschen solche Gefühle kennen.","INST.scs.items.10":"Ich missbillige und verurteile meine eigenen Fehler und Schwächen.","INST.scs.items.11":"Ich bin intolerant und ungeduldig gegenüber den Seiten meiner Persönlichkeit, die ich nicht mag.","INST.aaq.name":"Fragebogen zu Akzeptanz und Handeln II (AAQ-II)","INST.aaq.intro":"Wie sehr trifft jede Aussage auf Sie zu?","INST.aaq.anchors.0":"Trifft nie zu","INST.aaq.anchors.6":"Trifft immer zu","INST.aaq.items.0":"Meine schmerzhaften Erfahrungen und Erinnerungen machen es mir schwer, ein Leben zu führen, das ich als wertvoll empfinden würde.","INST.aaq.items.1":"Ich habe Angst vor meinen Gefühlen.","INST.aaq.items.2":"Ich mache mir Sorgen, meine Sorgen und Gefühle nicht kontrollieren zu können.","INST.aaq.items.3":"Meine schmerzhaften Erinnerungen hindern mich an einem erfüllten Leben.","INST.aaq.items.4":"Gefühle verursachen Probleme in meinem Leben.","INST.aaq.items.5":"Es scheint, als kämen die meisten Menschen besser mit ihrem Leben zurecht als ich.","INST.aaq.items.6":"Sorgen stehen meinem Erfolg im Weg.","INST.lot.name":"Lebensorientierungstest – revidiert (LOT-R)","INST.lot.intro":"Wie sehr stimmen Sie den einzelnen Aussagen zu?","INST.lot.anchors.0":"Stimme überhaupt nicht zu","INST.lot.anchors.1":"Stimme nicht zu","INST.lot.anchors.2":"Neutral","INST.lot.anchors.3":"Stimme zu","INST.lot.anchors.4":"Stimme voll und ganz zu","INST.lot.items.0":"In unsicheren Zeiten erwarte ich normalerweise das Beste.","INST.lot.items.1":"Es fällt mir leicht, mich zu entspannen.","INST.lot.items.2":"Wenn bei mir etwas schiefgehen kann, dann geht es auch schief.","INST.lot.items.3":"Ich bin immer optimistisch, was meine Zukunft angeht.","INST.lot.items.4":"Ich bin sehr gern mit meinen Freunden zusammen.","INST.lot.items.5":"Es ist mir wichtig, beschäftigt zu sein.","INST.lot.items.6":"Ich erwarte fast nie, dass die Dinge so laufen, wie ich es mir wünsche.","INST.lot.items.7":"Ich gerate nicht so leicht aus der Fassung.","INST.lot.items.8":"Ich rechne selten damit, dass mir Gutes widerfährt.","INST.lot.items.9":"Alles in allem erwarte ich, dass mir mehr Gutes als Schlechtes widerfährt.","INST.ahs.name":"Hoffnungsskala für Erwachsene (AHS)","INST.ahs.intro":"Wie sehr trifft jede Aussage auf Sie zu?","INST.ahs.anchors.0":"Trifft überhaupt nicht zu","INST.ahs.anchors.7":"Trifft voll und ganz zu","INST.ahs.items.0":"Mir fallen viele Wege ein, um aus einer Klemme herauszukommen.","INST.ahs.items.1":"Ich verfolge meine Ziele mit Energie.","INST.ahs.items.2":"Ich fühle mich die meiste Zeit müde.","INST.ahs.items.3":"Für jedes Problem gibt es viele Lösungswege.","INST.ahs.items.4":"In einer Diskussion lasse ich mich leicht unterkriegen.","INST.ahs.items.5":"Mir fallen viele Wege ein, um die Dinge im Leben zu erreichen, die mir wichtig sind.","INST.ahs.items.6":"Ich mache mir Sorgen um meine Gesundheit.","INST.ahs.items.7":"Selbst wenn andere entmutigt sind, weiß ich, dass ich einen Weg finden kann, das Problem zu lösen.","INST.ahs.items.8":"Meine bisherigen Erfahrungen haben mich gut auf meine Zukunft vorbereitet.","INST.ahs.items.9":"Ich war bisher im Leben ziemlich erfolgreich.","INST.ahs.items.10":"Meistens mache ich mir über irgendetwas Sorgen.","INST.ahs.items.11":"Ich erreiche die Ziele, die ich mir setze.","INST.gbs.name":"Allgemeine Zugehörigkeitsskala (GBS)","INST.gbs.intro":"Wie sehr stimmen Sie jeder Aussage zu?","INST.gbs.anchors.0":"Stimme überhaupt nicht zu","INST.gbs.anchors.6":"Stimme voll und ganz zu","INST.gbs.items.0":"Wenn ich mit anderen Menschen zusammen bin, fühle ich mich einbezogen.","INST.gbs.items.1":"Ich habe enge Bindungen zu Familie und Freunden.","INST.gbs.items.2":"Ich fühle mich wie ein Außenseiter.","INST.gbs.items.3":"Ich habe das Gefühl, dass ich anderen egal bin.","INST.gbs.items.4":"Ich fühle mich von anderen akzeptiert.","INST.gbs.items.5":"Weil ich nicht dazugehöre, habe ich in der Feiertagszeit das Gefühl, abseits zu stehen.","INST.gbs.items.6":"Ich fühle mich vom Rest der Welt isoliert.","INST.gbs.items.7":"Ich habe ein Gefühl der Zugehörigkeit.","INST.gbs.items.8":"Wenn ich mit anderen Menschen zusammen bin, fühle ich mich fremd.","INST.gbs.items.9":"Unter anderen Menschen habe ich meinen Platz.","INST.gbs.items.10":"Ich fühle mich mit anderen verbunden.","INST.gbs.items.11":"Freunde und Familie beziehen mich nicht in ihre Pläne ein.","INST.wolf.name":"Fragebogen zu arbeitsbezogenem Flow (WOLF)","INST.wolf.intro":"Wie oft haben Sie in den letzten zwei Wochen Folgendes erlebt?","INST.wolf.anchors.0":"Nie","INST.wolf.anchors.1":"Fast nie","INST.wolf.anchors.2":"Manchmal","INST.wolf.anchors.3":"Regelmäßig","INST.wolf.anchors.4":"Oft","INST.wolf.anchors.5":"Sehr oft","INST.wolf.anchors.6":"Immer","INST.wolf.items.0":"Wenn ich arbeite, denke ich an nichts anderes.","INST.wolf.items.1":"Meine Arbeit reißt mich mit.","INST.wolf.items.2":"Wenn ich arbeite, vergesse ich alles um mich herum.","INST.wolf.items.3":"Ich bin völlig in meine Arbeit vertieft.","INST.wolf.items.4":"Meine Arbeit gibt mir ein gutes Gefühl.","INST.wolf.items.5":"Ich mache meine Arbeit mit viel Freude.","INST.wolf.items.6":"Ich fühle mich bei der Arbeit glücklich.","INST.wolf.items.7":"Ich bin fröhlich, wenn ich arbeite.","INST.wolf.items.8":"Ich würde diese Arbeit auch dann machen, wenn ich weniger dafür bezahlt bekäme.","INST.wolf.items.9":"Ich merke, dass ich auch in meiner Freizeit arbeiten möchte.","INST.wolf.items.10":"Ich arbeite, weil es mir Freude macht.","INST.wolf.items.11":"Wenn ich an etwas arbeite, tue ich es für mich selbst.","INST.wolf.items.12":"Meine Motivation kommt aus der Arbeit selbst und nicht aus der Belohnung dafür.","INST.sreis.name":"Skala zur selbst eingeschätzten emotionalen Intelligenz (SREIS)","INST.sreis.intro":"Wie gut trifft jede Aussage auf Sie zu?","INST.sreis.anchors.0":"Sehr unzutreffend","INST.sreis.anchors.1":"Eher unzutreffend","INST.sreis.anchors.2":"Weder noch","INST.sreis.anchors.3":"Eher zutreffend","INST.sreis.anchors.4":"Sehr zutreffend","INST.sreis.items.0":"Am Gesichtsausdruck von Menschen erkenne ich, welche Gefühle sie gerade erleben.","INST.sreis.items.1":"Ich bin ein rationaler Mensch und ziehe meine Gefühle selten oder nie zu Rate, wenn ich eine Entscheidung treffe.","INST.sreis.items.2":"Ich habe einen reichen Wortschatz, um meine Gefühle zu beschreiben.","INST.sreis.items.3":"Ich habe Probleme, mit meinem Ärger umzugehen.","INST.sreis.items.4":"Wenn jemand, den ich kenne, schlechte Laune hat, kann ich der Person helfen, sich zu beruhigen und sich schnell besser zu fühlen.","INST.sreis.items.5":"Ich nehme die nonverbalen Botschaften anderer Menschen wahr.","INST.sreis.items.6":"Bei Entscheidungen höre ich auf meine Gefühle, um zu sehen, ob sich die Entscheidung richtig anfühlt.","INST.sreis.items.7":"Mir fallen leicht viele Synonyme für Gefühlswörter wie Glück und Traurigkeit ein.","INST.sreis.items.8":"Ich kann mit stressigen Situationen umgehen, ohne zu nervös zu werden.","INST.sreis.items.9":"Ich kenne Strategien, um bei anderen eine Stimmung zu erzeugen oder ihre Stimmung zu verbessern.","INST.sreis.items.10":"Am Gesichtsausdruck von Menschen erkenne ich, ob sie ehrlich zu mir sind.","INST.sreis.items.11":"Ich bin ein rationaler Mensch und verlasse mich bei Entscheidungen nicht gern auf meine Gefühle.","INST.sreis.items.12":"Ich kann in Worte fassen, wie Gefühle von einfach bis komplex reichen.","INST.sreis.items.13":"Ich kann mit den meisten belastenden Problemen umgehen.","INST.sreis.items.14":"Ich bin nicht sehr gut darin, anderen zu helfen, sich besser zu fühlen, wenn sie wütend oder traurig sind.","INST.sreis.items.15":"Mein erster Eindruck davon, wie sich andere fühlen, ist oft falsch.","INST.sreis.items.16":"Im Vergleich zu den meisten Menschen habe ich einen reicheren Wortschatz, um Gefühle zu beschreiben.","INST.sreis.items.17":"Ich weiß, wie ich in schwierigen oder stressigen Situationen ruhig bleibe.","INST.sreis.items.18":"Ich bin ein Mensch, an den sich andere wenden, wenn sie in einer schwierigen Situation Hilfe brauchen.","INST.bscs.name":"Kurzskala zur Selbstkontrolle (BSCS)","INST.bscs.intro":"Wie sehr trifft jede Aussage im Allgemeinen auf Sie zu?","INST.bscs.anchors.0":"Trifft überhaupt nicht zu","INST.bscs.anchors.4":"Trifft voll und ganz zu","INST.bscs.items.0":"Ich kann Versuchungen gut widerstehen.","INST.bscs.items.1":"Es fällt mir schwer, schlechte Gewohnheiten abzulegen.","INST.bscs.items.2":"Ich bin faul.","INST.bscs.items.3":"Ich sage unangemessene Dinge.","INST.bscs.items.4":"Ich tue bestimmte Dinge, die schlecht für mich sind, wenn sie Spaß machen.","INST.bscs.items.5":"Ich lehne Dinge ab, die schlecht für mich sind.","INST.bscs.items.6":"Ich wünschte, ich hätte mehr Selbstdisziplin.","INST.bscs.items.7":"Andere würden sagen, dass ich eiserne Selbstdisziplin habe.","INST.bscs.items.8":"Vergnügen und Spaß halten mich manchmal davon ab, meine Arbeit zu erledigen.","INST.bscs.items.9":"Ich habe Schwierigkeiten, mich zu konzentrieren.","INST.bscs.items.10":"Ich kann effektiv auf langfristige Ziele hinarbeiten.","INST.bscs.items.11":"Manchmal kann ich mich nicht davon abhalten, etwas zu tun, obwohl ich weiß, dass es falsch ist.","INST.bscs.items.12":"Ich handle oft, ohne alle Alternativen durchdacht zu haben.","LABELS.s2":"Selbstmitgefühl","LABELS.s3":"Von Selbstvorwürfen zu Selbstmitgefühl","LABELS.compassion":"Bücherregal: Mitgefühl und Selbstkritik","LABELS.s4":"Das Rätsel der Emotionsregulation","LABELS.s7":"Sich selbst statt die Umgebung verändern","LABELS.shelf13":"Bücherregal: prozessbasierte Therapie und emotionale Beweglichkeit","LABELS.s9":"Optimismus und Hoffnung für die Zukunft","LABELS.riseabove":"Rise Above (Kaufman, 2024): von der Opferhaltung zum Wachstum","LABELS.s10":"Subkulturen in Organisationen und Motivation","LABELS.s8":"Neubewertung, Ego-Erschöpfung und Denkweisen","LABELS.mattering":"Wie Menschen für andere bedeutsam werden","LABELS.s11":"Dampf ablassen: Wann hilft es, sich auszusprechen?","LABELS.s13":"Motivation: extern, introjiziert und intrinsisch","LABELS.s15":"Positive Gefühle, Freizeit und gute Nachrichten teilen","LABELS.s14":"Emotionale Intelligenz: Fähigkeit, Merkmal oder Mischung?","LABELS.s5":"Selbstkontrolle und die Wahl von Situationen","LABELS.s6":"Die eigene Umgebung wählen und verändern","LABELS.s12":"Perfektionismus: ausgezeichnet, aber unter Druck","REFS.nea25":"21 % der Beschäftigten berichten von Burnout-Beschwerden","REFS.who22":"jährlich 12 Milliarden Arbeitstage durch Depression und Angst verloren","REFS.icd11":"Burnout als berufsbezogenes Phänomen eingestuft","REFS.cbs26":"Krankenstand 5,4 % im Jahr 2025; 9 % der krankgemeldeten Beschäftigten nennen psychische Beschwerden oder Burnout","REFS.tno24":"Fehlzeiten wegen psychischer Beschwerden dauern im Schnitt 63 Arbeitstage; 75 % davon (teilweise) arbeitsbedingt","REFS.arbo24":"8,3 Mrd. € für (teilweise) arbeitsbedingte Fehlzeiten im Jahr 2023, davon 4,9 Mrd. € durch psychosoziale Arbeitsbelastung","REFS.arbo18":"etwa ein Viertel aller Fehltage hängt mit psychischen Beschwerden, Überlastung oder Burnout zusammen","REFS.mkb":"im Durchschnitt 250 € bis 400 € pro Fehltag","REFS.arbowet":"Art. 3 Abs. 2: Konzept zur Vermeidung oder Begrenzung psychosozialer Arbeitsbelastung; Art. 5: Risikoinventarisierung und -evaluierung (RI&E) mit Maßnahmenplan","REFS.arbobes":"Art. 2.15: PSA-Risiken in der RI&E bewerten und Maßnahmen im Maßnahmenplan festlegen","REFS.arboportaal":"Informationen der niederländischen Regierung zur psychosozialen Arbeitsbelastung","REFS.wor":"Art. 27: Zustimmungsrecht des Betriebsrats, u. a. bei Mitarbeitendenbefragungen und Regelungen zum Arbeitsschutz","REFS.gdpr":"Datenschutz-Grundverordnung (DSGVO)","T.rStrRel":"Wo Ihre Werte heute am höchsten sind","T.rCodeShow":"Code anzeigen","T.rDetailNote":"Teilwerte, die auf nur 2–4 Fragen beruhen, sind nur als Richtwert zu verstehen.","T.meName":"Maryam Jaberi","T.allLv":"alle Funktionsebenen (keine Ebene liegt deutlich niedriger)","T.planNote":"Prüfen Sie vor der Auswahl der Workshops anhand Ihrer RI&E oder Ihrer Befragung zu den Arbeitsbedingungen, ob Arbeitsbelastung, Autonomie oder Unterstützung diese Muster erklären. Wenn ja, gehen Sie diese zuerst an.","T.print":"Drucken / als PDF speichern","T.fHint":"Öffnet Ihr E-Mail-Programm mit dieser Anfrage. Kein E-Mail-Programm? Schreiben Sie an {e}.","T.rStrNote":"Noch keiner Ihrer Werte liegt im Bereich „stark“; dies sind einfach Ihre heute höchsten Werte.","T.pWhyLow":"{p} der Personen liegen im Bereich „braucht Aufmerksamkeit“.","T.pWhyGap":"{lv} – {x} Punkte unter den anderen Ebenen.","T.pAlso":"Ebenfalls im Blick behalten","T.pScopeBelong":"Hinweis: Diese Skala misst Zugehörigkeit im Leben insgesamt, nicht nur bei der Arbeit; klären Sie arbeitsbezogene Ursachen in der Nachbesprechung.","T.pScopeOptim":"Hinweis: Optimismus ist ein relativ stabiles Merkmal; rechnen Sie mit moderaten Veränderungen und betrachten Sie zuerst die Arbeitsbedingungen."},"fr":{"T.proto":"Version pilote – disponible dès maintenant pour un premier projet pilote avec votre organisation.","T.brand":"Bilan bien-être pour les organisations","T.brandShort":"Bilan bien-être","T.by":"Inspiré du cours « Compétences personnelles et humaines dans les organisations et les établissements d’enseignement » du Dr Azarakhsh Mokri","T.nHome":"Présentation","T.nTake":"Répondre au questionnaire","T.nReport":"Rapport d’organisation","T.nWs":"Ateliers","T.nMethod":"Méthode","T.heroK":"Pour les organisations à forte intensité de connaissances · pilotes à partir de 20 participants","T.heroT":"Découvrez les ressources psychologiques de vos équipes, par niveau de fonction, et par où commencer.","T.heroP":"Les salariés répondent anonymement à huit questionnaires scientifiques publiés, en 8 à 18 minutes, et voient aussitôt leur propre résultat. Votre organisation reçoit un rapport de groupe par niveau de fonction, avec une interprétation en langage clair et un plan de deux ou trois ateliers recommandés.","T.ctaTake":"Commencer le questionnaire","T.ctaDemo":"Voir un exemple de rapport","T.f1":"8 dimensions","T.f1s":"8 questionnaires publiés, validés dans leur langue d’origine","T.f2":"Anonyme","T.f2s":"Aucun nom ; les groupes de moins de 5 personnes ne sont jamais affichés","T.f3":"9 langues","T.f3s":"Français, anglais, néerlandais, allemand, espagnol, polonais, turc, arabe et persan","T.measT":"Ce que nous mesurons","T.measP":"Chaque dimension répond à une question simple. Touchez une carte pour voir ce qu’elle mesure et ce qu’elle ne mesure pas.","T.whatIs":"Ce qui est mesuré","T.whatNot":"À garder à l’esprit","T.privT":"La confidentialité d’abord","T.priv.0":"Aucun nom, adresse e-mail ou numéro de personnel n’est demandé.","T.priv.1":"Seuls votre niveau de fonction, le mois et la version choisie sont enregistrés avec vos réponses.","T.priv.2":"Les groupes de moins de 5 personnes sont masqués dans le rapport d’organisation.","T.priv.3":"Les réponses sont enregistrées sans aucun identifiant ; aucun responsable ni aucune personne des RH ne voit le résultat individuel de qui que ce soit.","T.notT":"Ce que ce bilan n’est pas","T.not":"Ce bilan n’est pas un diagnostic clinique et ne remplace ni un accompagnement ni un traitement. Il mesure des ressources psychologiques, comme l’autocompassion, la flexibilité et l’appartenance, et non l’épuisement professionnel ou la charge de travail. Son but est de repérer des tendances de groupe et de choisir le bon soutien.","T.tT":"Répondre au questionnaire","T.tRound":"Votre questionnaire","T.tSelf":"Vos réponses et votre résultat restent dans ce navigateur. Rien n’est envoyé, sauf si vous choisissez d’envoyer votre code de réponse.","T.tJoin":"Campagne de questionnaire de l’organisation","T.tLevel":"Quel est votre niveau de fonction ou votre rôle ?","T.tLevelHint":"Utilisé uniquement pour comparer les groupes. Les groupes de moins de 5 personnes ne sont jamais affichés.","T.tPack":"Quelle version ?","T.tMin":"min","T.tItems":"questions","T.tConsent":"Je comprends que la participation est volontaire, que rien n’est envoyé sans une action de ma part et qu’il ne s’agit pas d’un diagnostic clinique.","T.tStart":"Commencer","T.tNext":"Partie suivante","T.tPrev":"Partie précédente","T.tFinish":"Voir mes résultats","T.tPart":"Partie","T.tOf":"sur","T.tMissing":"Vous n’avez pas encore répondu à ces questions :","T.tSaved":"Les réponses sont enregistrées sur cet appareil ; si vous fermez la page, vous pourrez reprendre ici.","T.tResume":"Reprendre le questionnaire inachevé","T.tRestart":"Recommencer","T.rT":"Vos résultats en un coup d’œil","T.rP":"Sur chaque échelle, un score plus élevé signifie davantage de cette ressource. C’est un instantané de vos réponses d’aujourd’hui, pas un diagnostic.","T.rStr":"Vos scores les plus élevés","T.rGrow":"Vos scores les plus bas","T.rTips":"Deux conseils courts","T.rDetail":"Détails et sous-échelles","T.rSend":"Envoyer anonymement à mon organisation","T.rSent":"Vos réponses ont été enregistrées anonymement. Merci !","T.rCode":"Code de réponse","T.rCodeP":"Copiez ce code et envoyez-le par e-mail à SoloNovate, pas à votre responsable ni aux RH. Il ne contient que vos réponses, votre niveau de fonction et le mois, pas votre nom. Comme il arrive par e-mail, SoloNovate voit brièvement votre adresse e-mail ; nous ne l’enregistrons jamais avec vos réponses et nous supprimons l’e-mail après avoir importé le code.","T.rCopy":"Copier le code","T.rCopied":"Copié","T.rCare":"Si votre moral est bas depuis un certain temps ou si vous avez l’impression de ne plus y arriver, parlez-en à votre médecin du travail, à votre médecin traitant ou à un psychologue. Demander de l’aide est un signe de force.","T.rNot":"Ce résultat est un instantané de vos réponses d’aujourd’hui, pas une étiquette ni un diagnostic.","T.band.0":"À surveiller","T.band.1":"Moyen","T.band.2":"Solide","T.pT":"Rapport d’organisation","T.pP":"Les ressources psychologiques de votre organisation par niveau de fonction, avec des priorités et des ateliers recommandés.","T.pSrc":"Données du rapport","T.pDemo":"Données d’exemple (démonstration)","T.pLive":"Réponses réelles de cette campagne","T.pImport":"Importer des codes de réponse","T.pImportP":"Collez les codes de réponse ici (un par ligne).","T.pImportGo":"Ajouter","T.pAdded":"réponses ajoutées","T.pN":"Répondants","T.pLevels":"Niveaux","T.pAvg":"Dimension la plus basse","T.pLowShare":"Part « à surveiller »","T.pNoPri":"Aucune dimension n’atteint le seuil de priorité. Suggestion : des ateliers de consolidation pour préserver les points forts.","T.pWhy":"Pourquoi","T.pFor":"Surtout pour","T.pStrengths":"Points forts de l’organisation","T.pGap":"Plus grand écart entre les niveaux","T.pHidden":"moins de 5","T.pNone":"Pas encore de réponses.","T.pExport":"Copier les données de synthèse (CSV)","T.pAdmin":"Gérer les campagnes","T.pAdminP":"Pour la personne qui coordonne le questionnaire dans l’organisation. Créez une campagne et envoyez le lien aux salariés.","T.pOrg":"Nom de l’organisation","T.pRoundName":"Titre de la campagne","T.pCreate":"Créer la campagne","T.pRounds":"Campagnes","T.pChoose":"Choisir une campagne","T.pNoAdmin":"Seules les personnes qui coordonnent le questionnaire (éditeurs de cette page) peuvent créer des campagnes et voir les réponses réelles. Les autres peuvent consulter l’exemple de rapport ou importer des codes de réponse.","T.pDemoNote":"Ce rapport utilise des données simulées de 180 personnes pour vous montrer à quoi ressemble un vrai rapport.","T.wT":"Ateliers","T.wP":"Chaque atelier cible une ou deux dimensions et s’appuie sur le contenu du cours du Dr Mokri. Les liens de lecture ouvrent les pages du wiki du cours ; les titres sont traduits ici, les pages elles-mêmes sont en persan.","T.wGoals":"Objectifs","T.wWho":"Public","T.wLen":"Durée","T.wEv":"Données probantes","T.wRead":"Pour approfondir dans le wiki du cours (pages en persan)","T.mT":"Méthode","T.mP":"En toute transparence : ce que nous mesurons, comment nous calculons les scores et où se situent les limites.","T.mInst":"Questionnaires","T.mScore":"Calcul des scores","T.mScoreP":"La moyenne de chaque sous-échelle est convertie sur une plage de 0 à 100 : (moyenne − minimum) ÷ (maximum − minimum) × 100. Les items inversés sont d’abord recodés. Lorsqu’un score élevé dans le questionnaire original signifie plus de difficultés (par ex. AAQ-II), le score est inversé pour que « plus haut = mieux » partout.","T.mBands":"Tranches de score","T.mBandsP":"Moins de 37,5 : à surveiller · de 37,5 à 62,5 : moyen · plus de 62,5 : solide. Ces seuils suivent la convention utilisée pour la Self-Compassion Scale (réponse moyenne inférieure à 2,5 ou supérieure à 3,5 sur une échelle de 1 à 5) et sont appliqués à toutes les échelles par souci de simplicité. Ce ne sont ni des normes de population ni des seuils cliniques, et les scores habituels diffèrent d’un questionnaire à l’autre.","T.mLim":"Limites","T.mLimL.0":"Tous les questionnaires sont des auto-évaluations et peuvent être influencés par l’humeur du jour ou le souhait de bien paraître.","T.mLimL.1":"Les tranches n’ont pas de normes de population ; les comparaisons au sein de l’organisation et dans le temps sont plus valables que la comparaison avec une « moyenne nationale ».","T.mLimL.2":"Les questionnaires sont validés dans leur langue d’origine et les items anglais suivent la formulation originale. Les versions dans d’autres langues utilisées ici, y compris cette version française, n’ont pas été validées séparément sous cette forme ; leur fiabilité est vérifiée pendant le pilote. Pour la recherche, utilisez les versions officiellement validées (voir Sources).","T.mLimL.3":"Cet outil n’est pas conçu pour des décisions concernant des personnes (recrutement, évaluation des performances) et ne doit pas être utilisé à cette fin.","T.mEth":"Éthique et confidentialité","T.mEthL.0":"La participation est volontaire et chacun peut arrêter à tout moment.","T.mEthL.1":"Seul le mois est enregistré, pas la date ni l’heure exactes.","T.mEthL.2":"Les rapports sont uniquement collectifs, avec un minimum de 5 personnes par groupe.","T.mEthL.3":"Les résultats personnels ne s’affichent que sur l’appareil du répondant.","T.mCourse":"Ce service est né du cours « Compétences personnelles et humaines dans les organisations et les établissements d’enseignement » du Dr Azarakhsh Mokri. Parmi les questionnaires présentés dans ce cours, nous en avons retenu huit qui sont courts, publiés, exempts d’étiquettes cliniques et liés chacun à une compétence qui peut s’entraîner.","T.mWiki":"Wiki complet du cours (persan)","T.mOrgPsy":"Psychologie du travail et des organisations","T.items":"items","T.scale":"Échelle","T.ref":"Référence","T.session":"Page wiki du cours (en persan)","T.footer":"Bilan bien-être pour les organisations par SoloNovate · version pilote · non diagnostique","T.dims":"dimensions","T.whyT":"Pourquoi c’est important","T.whyP":"La santé psychologique n’est pas un sujet secondaire : elle se voit dans l’absentéisme, le turnover et la qualité du travail. Ce bilan ne mesure pas ces problèmes ; il mesure les ressources psychologiques qui aident chacun à faire face à la pression au travail.","T.why.0.0":"1 salarié sur 5","T.why.0.1":"aux Pays-Bas déclare des symptômes d’épuisement professionnel (21 % en 2025, enquête nationale NEA).","T.why.1.0":"12 milliards","T.why.1.1":"de journées de travail sont perdues chaque année dans le monde à cause de la dépression et de l’anxiété, soit une perte de productivité d’environ 1 000 milliards de dollars US.","T.why.2.0":"Professionnel","T.why.2.1":"L’OMS classe l’épuisement professionnel (CIM-11) comme un phénomène lié au travail : un problème du travail, pas seulement personnel.","T.getT":"Ce que reçoit votre organisation","T.get.0.0":"Un rapport par niveau de fonction","T.get.0.1":"Huit dimensions par niveau, avec les points forts, les priorités et les écarts entre niveaux.","T.get.1.0":"Une interprétation scientifique","T.get.1.1":"Une explication claire de ce que chaque score signifie et ne signifie pas.","T.get.2.0":"Un plan d’ateliers","T.get.2.1":"Deux ou trois ateliers adaptés à vos priorités, avec format et durée.","T.get.3.0":"Un résultat personnel pour chaque participant","T.get.3.1":"Chaque salarié voit immédiatement son propre résultat et deux conseils pratiques ; la direction ne voit jamais le résultat individuel de qui que ce soit.","T.get.4.0":"Un débriefing de 45 minutes","T.get.4.1":"Les résultats sont discutés avec la direction et les RH, avec des prochaines étapes concrètes.","T.pilot.0.0":"Semaine 0","T.pilot.0.1":"Lancement","T.pilot.0.2":"Réunion de 30 minutes : objectifs, niveaux, calendrier et manière d’informer les salariés.","T.pilot.1.0":"Semaines 1–2","T.pilot.1.1":"Questionnaire ouvert","T.pilot.1.2":"Les salariés remplissent le bilan anonyme en 8 à 18 minutes, sur téléphone ou ordinateur, dans l’une des neuf langues.","T.pilot.2.0":"Semaine 3","T.pilot.2.1":"Rapport","T.pilot.2.2":"Le rapport de groupe anonyme par niveau et le plan d’ateliers recommandé.","T.pilot.3.0":"Semaine 4","T.pilot.3.1":"Débriefing et choix","T.pilot.3.2":"Échange avec la direction ; choix des premiers ateliers et du moment de la prochaine mesure.","T.needT":"Ce dont nous avons besoin","T.need.0":"Une personne de contact (par ex. RH)","T.need.1":"Au moins 20 participants, et au moins 5 par niveau de fonction","T.need.2":"Un court message aux salariés (nous fournissons un modèle)","T.need.3":"Si vous avez un conseil d’entreprise (OR) : son accord lorsqu’il est requis (WOR, art. 27). Nous aidons à préparer la demande.","T.need.4":"Environ 3 heures de temps RH au total, réparties sur cinq semaines","T.lawT":"Conforme aux règles néerlandaises et européennes","T.law.0.0":"RGPD","T.law.0.1":"Aucun nom n’est demandé ; les réponses sont conservées séparément de toute adresse e-mail et ne sont communiquées que pour des groupes d’au moins 5 personnes. Comme des réponses sur le bien-être peuvent être considérées comme des données de santé, la participation repose sur un consentement explicite et volontaire.","T.law.1.0":"Arbowet","T.law.1.1":"Peut appuyer la politique PSA de l’employeur (art. 3, al. 2) en complément, au niveau individuel, des mesures qui agissent à la source et de la RI&E (Arbobesluit, art. 2.15).","T.law.2.0":"Conseil d’entreprise","T.law.2.1":"Une enquête auprès du personnel comme celle-ci requiert généralement l’accord du conseil d’entreprise, ou au moins sa participation (WOR, art. 27) ; nous aidons à la préparer.","T.faqT":"Questions fréquentes","T.faq.0.0":"Combien de temps cela prend-il aux salariés ?","T.faq.0.1":"La version courte prend environ 8 minutes ; la version complète environ 18. Le bilan fonctionne sur tout téléphone ou ordinateur.","T.faq.1.0":"Les responsables peuvent-ils voir les réponses individuelles ?","T.faq.1.1":"Non. Il n’y a pas de noms, et le rapport d’organisation ne montre que des groupes de cinq personnes ou plus.","T.faq.2.0":"S’agit-il d’un diagnostic ?","T.faq.2.1":"Non. C’est un bilan non clinique fondé sur des questionnaires publiés, utilisé pour repérer des tendances dans les groupes et choisir le bon soutien. La page de résultat personnel oriente toute personne en difficulté vers le médecin du travail, son médecin traitant ou un psychologue.","T.faq.3.0":"Les questionnaires sont-ils validés ?","T.faq.3.1":"Les huit questionnaires sont publiés au niveau international et validés dans leur langue d’origine, et nous utilisons leurs clés de cotation originales (voir Méthode et Sources). Les items anglais suivent la formulation originale ; les versions dans d’autres langues utilisées ici, y compris la française, n’ont pas encore été validées séparément sous cette forme. Les données du pilote servent donc à vérifier la fiabilité de chaque échelle. Les licences d’utilisation commerciale sont en cours de négociation avec les auteurs.","T.faq.4.0":"Cela mesure-t-il le stress au travail ou l’épuisement professionnel ?","T.faq.4.1":"Pas directement. Cela mesure les ressources psychologiques qui aident à faire face à la pression. Les risques liés au travail, comme la charge et l’autonomie, se mesurent avec une enquête sur les conditions de travail. Les deux se complètent, et nous vous aidons volontiers à les combiner.","T.faq.5.0":"Est-ce adapté aux grandes organisations ?","T.faq.5.1":"Oui. Un pilote peut commencer dans un service ou sur un site, puis être étendu. Les règles d’anonymat restent les mêmes quelle que soit la taille : des résultats uniquement pour des groupes d’au moins 5 personnes.","T.faq.6.0":"Comment les réponses sont-elles recueillies pendant le pilote ?","T.faq.6.1":"Chaque participant envoie par e-mail un code de réponse anonyme (uniquement les numéros de réponse et le niveau de fonction) directement à SoloNovate, jamais à l’employeur. SoloNovate supprime ces e-mails après importation. Pour un déploiement complet, une collecte en ligne sécurisée peut être mise en place.","T.faq.7.0":"Que se passe-t-il après le rapport ?","T.faq.7.1":"Un débriefing, deux ou trois ateliers animés par un partenaire qualifié aux Pays-Bas, et une nouvelle mesure après 3 à 6 mois pour voir ce qui a changé.","T.ctaT":"Un projet pilote vous intéresse ?","T.ctaP":"Essayez le bilan vous-même, consultez l’exemple de rapport et envoyez une courte demande.","T.calcT":"Combien vous coûte l’absentéisme d’origine psychologique ?","T.calcP":"Une estimation rapide pour votre organisation. Modifiez les chiffres selon votre situation.","T.cEmp":"Nombre de salariés","T.cAbs":"Taux d’absentéisme (%)","T.cAbsH":"Moyenne néerlandaise en 2025 : 5,4 %","T.cSal":"Salaire annuel brut moyen (€)","T.cShare":"Part des jours d’absence due au stress ou à des troubles psychologiques (%)","T.cShareH":"Estimation nationale : environ un quart","T.cRed":"Scénario illustratif (et non un effet attendu) : l’absentéisme d’origine psychologique baisse de","T.cDays":"jours d’absence par an","T.cStress":"dont d’origine psychologique","T.cCost":"coût annuel de l’absentéisme d’origine psychologique","T.cSave":"économie annuelle dans ce scénario","T.cPerDay":"Coût par jour d’absence utilisé ici : {x} (salaire × 1,3 pour les charges patronales ÷ 220 jours ouvrés). Aux Pays-Bas, les estimations vont de 250 € à 400 € par jour.","T.cNote":"Il s’agit d’un scénario, pas d’une prévision. Il n’existe pas encore de preuve directe que ce bilan et ses ateliers réduisent l’absentéisme, et un score de questionnaire ne se traduit pas directement en moins de jours d’absence. Utilisez l’estimation pour juger s’il vaut la peine d’investir dans la prévention, et la nouvelle mesure pour voir ce qui a réellement changé.","T.wsPartner":"Animation : chaque atelier est animé par un psychologue ou un formateur expérimenté aux Pays-Bas, que nous sélectionnons pour votre mission. Vous le rencontrez avant le débriefing.","T.pilotNoteT":"À propos de cette version pilote","T.pilotNote":"Pendant le pilote, les réponses servent uniquement à produire le rapport de votre organisation et à vérifier la fiabilité des questionnaires. Les licences d’utilisation commerciale des questionnaires sont en cours de négociation avec leurs auteurs.","T.arboT":"Peut appuyer votre politique PSA au titre de l’Arbowet","T.arboP":"Aux Pays-Bas, les employeurs doivent mener une politique visant à prévenir, ou au moins à limiter, la charge psychosociale (PSA) comme le stress au travail, et évaluer les risques PSA dans leur inventaire et évaluation des risques (RI&E) avec un plan d’action. La loi demande aux employeurs de s’attaquer au stress au travail d’abord à la source (charge de travail, autonomie, soutien), et seulement ensuite par des mesures individuelles. Ce bilan et ses ateliers sont une mesure individuelle de ce type : un complément utile, jamais un substitut.","T.arbo.0.0":"Un élément pour la partie PSA de votre RI&E","T.arbo.0.1":"Les risques PSA concernent surtout le travail lui-même : charge, autonomie, soutien et comportements indésirables. Ce bilan ajoute l’autre versant : les ressources psychologiques de vos équipes, par niveau de fonction. Utilisez-le en complément d’une enquête sur les conditions de travail, pas à sa place.","T.arbo.1.0":"Des éléments pour votre plan d’action","T.arbo.1.1":"Les ateliers et la nouvelle mesure peuvent figurer dans votre plan d’action comme mesures individuelles, à côté des mesures qui portent sur le travail lui-même.","T.arbo.2.0":"Un suivi visible","T.arbo.2.1":"Les résultats avant et après aident à montrer au conseil d’entreprise que vous agissez sur les risques.","T.arboNote":"Le bilan ne remplace ni votre RI&E, ni une enquête sur les conditions de travail, ni l’examen par un expert certifié ; il les complète.","T.fName":"Votre nom","T.fOrg":"Organisation","T.fMail":"E-mail","T.fSize":"Nombre de salariés","T.fMsg":"Message (facultatif)","T.fSend":"Demander un pilote","T.fSent":"Votre messagerie s’ouvre avec la demande préremplie ; il ne reste qu’à cliquer sur Envoyer.","T.sizes.0":"20–50","T.sizes.1":"50–250","T.sizes.2":"250–1 000","T.sizes.3":"1 000+","T.sizes.4":"Autre","T.ctaAbout":"À propos de Maryam Jaberi","T.pPlan":"Se renseigner sur cet atelier (e-mail)","T.nSrc":"Sources","T.sT":"Sources","T.sP":"Tous les chiffres, références juridiques et affirmations scientifiques de ce site, avec un lien vers l’original. Les titres des publications restent dans leur langue d’origine.","T.gStats":"Chiffres et coûts","T.gLaw":"Lois et règles","T.gEv":"Recherches à la base des ateliers","T.gInst":"Questionnaires","T.gCourse":"Cours","T.courseRef":"Mokri, A. Compétences personnelles et humaines dans les organisations et les établissements d’enseignement [cours ; persan]. Notes de cours réunies dans le wiki de psychologie.","T.audT":"Par où voulez-vous commencer ?","T.paths.0.1":"Direction","T.paths.0.2":"L’intérêt économique, ce que vous obtenez et comment se déroule un pilote.","T.paths.0.3":"Estimation du coût de l’absentéisme","T.paths.1.1":"RH","T.paths.1.2":"Le déroulé semaine par semaine, qui fait quoi, et des documents prêts à l’emploi.","T.paths.1.3":"Déroulé et documents","T.paths.2.1":"Salariés","T.paths.2.2":"Ce que deviennent vos réponses – et essayez le bilan vous-même.","T.paths.2.3":"Votre vie privée","T.paths.3.1":"Psychologues et formateurs","T.paths.3.2":"Questionnaires, données probantes et collaboration avec nous comme partenaire.","T.paths.3.3":"Partenariat","T.tryIt":"Essayez le bilan vous-même (8 min)","T.jT":"De la mesure à l’action","T.jP":"Environ cinq semaines du lancement au débriefing, puis des ateliers. Un service ou toute l’organisation.","T.jAfter.0":"Ensuite","T.jAfter.1":"Ateliers et nouvelle mesure","T.jAfter.2":"Ateliers animés par un psychologue ou un formateur expérimenté ; une nouvelle mesure après 3 à 6 mois montre si les scores ont évolué.","T.company":"SoloNovate · Rotterdam · KvK 94264759 · TVA NL005072230B46","T.teamT":"L’équipe","T.teamP":"Volontairement petite : vous savez toujours à qui vous avez affaire.","T.meRole":"Fondatrice de SoloNovate · produit et données","T.meBio":"Cheffe de produit et chercheuse UX, avec une expérience dans les moteurs de recherche, la vidéo et les plateformes éducatives. Conçoit le bilan, protège les données et rédige votre rapport ; le psychologue partenaire vérifie l’interprétation.","T.meLangs":"Néerlandais, anglais, persan","T.phName":"[Nom du/de la psychologue]","T.phRole":"Psychologue · [inscription, par ex. NIP ou BIG]","T.phBio":"[Deux ou trois phrases : expérience, spécialité, types d’organisations et d’équipes accompagnées.]","T.phLangs":"[Langues des ateliers]","T.phNote":"Aperçu – voici à quoi ressemblera le profil du partenaire une fois complété.","T.langsL":"Langues","T.profile":"Profil","T.nProc":"Fonctionnement","T.prT":"Fonctionnement","T.prP":"Un déroulé clair avec une petite équipe : qui fait quoi, qui voit quoi et quels documents nous signons. Aucune surprise pour la direction ni pour les salariés.","T.rolesT":"Qui fait quoi","T.roles.0.2":"Votre interlocutrice unique","T.roles.0.
