f.anchors.4":"Często","INST.wolf.anchors.5":"Bardzo często","INST.wolf.anchors.6":"Zawsze","INST.wolf.items.0":"Kiedy pracuję, nie myślę o niczym innym.","INST.wolf.items.1":"Daję się porwać swojej pracy.","INST.wolf.items.2":"Kiedy pracuję, zapominam o wszystkim wokół.","INST.wolf.items.3":"Jestem całkowicie pochłonięty(-a) swoją pracą.","INST.wolf.items.4":"Moja praca sprawia, że dobrze się czuję.","INST.wolf.items.5":"Wykonuję swoją pracę z dużą przyjemnością.","INST.wolf.items.6":"Czuję się szczęśliwy(-a) podczas pracy.","INST.wolf.items.7":"Kiedy pracuję, mam pogodny nastrój.","INST.wolf.items.8":"Wykonywał(a)bym tę pracę nawet za mniejsze wynagrodzenie.","INST.wolf.items.9":"Zauważam, że chcę pracować także w wolnym czasie.","INST.wolf.items.10":"Pracuję, bo sprawia mi to przyjemność.","INST.wolf.items.11":"Kiedy nad czymś pracuję, robię to dla siebie.","INST.wolf.items.12":"Moja motywacja płynie z samej pracy, a nie z nagrody za nią.","INST.sreis.name":"Skala samooceny inteligencji emocjonalnej (SREIS)","INST.sreis.intro":"Na ile trafnie każde stwierdzenie Cię opisuje?","INST.sreis.anchors.0":"Bardzo nietrafnie","INST.sreis.anchors.1":"Raczej nietrafnie","INST.sreis.anchors.2":"Ani tak, ani nie","INST.sreis.anchors.3":"Raczej trafnie","INST.sreis.anchors.4":"Bardzo trafnie","INST.sreis.items.0":"Patrząc na wyraz twarzy ludzi, rozpoznaję emocje, których doświadczają.","INST.sreis.items.1":"Jestem osobą racjonalną i przy podejmowaniu decyzji rzadko lub wcale nie kieruję się uczuciami.","INST.sreis.items.2":"Mam bogate słownictwo do opisywania swoich emocji.","INST.sreis.items.3":"Mam problemy z radzeniem sobie ze złością.","INST.sreis.items.4":"Kiedy ktoś, kogo znam, ma zły humor, potrafię pomóc tej osobie szybko się uspokoić i poczuć się lepiej.","INST.sreis.items.5":"Dostrzegam komunikaty niewerbalne, które wysyłają inni.","INST.sreis.items.6":"Podejmując decyzje, słucham swoich uczuć, by sprawdzić, czy decyzja wydaje się właściwa.","INST.sreis.items.7":"Łatwo przychodzi mi do głowy wiele synonimów słów oznaczających emocje, takich jak szczęście i smutek.","INST.sreis.items.8":"Potrafię radzić sobie w stresujących sytuacjach, nie denerwując się zbytnio.","INST.sreis.items.9":"Znam sposoby na poprawienie nastroju innych ludzi.","INST.sreis.items.10":"Patrząc na wyraz twarzy ludzi, potrafię ocenić, czy są wobec mnie szczerzy.","INST.sreis.items.11":"Jestem osobą racjonalną i nie lubię opierać decyzji na uczuciach.","INST.sreis.items.12":"Potrafię opisać słowami całą gamę emocji – od prostych po złożone.","INST.sreis.items.13":"Potrafię poradzić sobie z większością przykrych problemów.","INST.sreis.items.14":"Nie za bardzo potrafię pomóc innym poczuć się lepiej, gdy są źli lub smutni.","INST.sreis.items.15":"Moje pierwsze wrażenie co do tego, co czują inni, często okazuje się błędne.","INST.sreis.items.16":"W porównaniu z większością ludzi mam bogatsze słownictwo do opisywania uczuć.","INST.sreis.items.17":"Wiem, jak zachować spokój w trudnych lub stresujących sytuacjach.","INST.sreis.items.18":"Jestem osobą, do której inni zwracają się, gdy potrzebują pomocy w trudnej sytuacji.","INST.bscs.name":"Krótka skala samokontroli (BSCS)","INST.bscs.intro":"W jakim stopniu każde stwierdzenie pasuje do tego, jaki(-a) zwykle jesteś?","INST.bscs.anchors.0":"Wcale","INST.bscs.anchors.4":"Bardzo","INST.bscs.items.0":"Dobrze opieram się pokusom.","INST.bscs.items.1":"Trudno mi zerwać ze złymi nawykami.","INST.bscs.items.2":"Jestem leniwy(-a).","INST.bscs.items.3":"Mówię niestosowne rzeczy.","INST.bscs.items.4":"Robię pewne rzeczy, które mi szkodzą, jeśli są przyjemne.","INST.bscs.items.5":"Odmawiam sobie rzeczy, które mi szkodzą.","INST.bscs.items.6":"Chciał(a)bym mieć więcej samodyscypliny.","INST.bscs.items.7":"Ludzie powiedzieliby, że mam żelazną samodyscyplinę.","INST.bscs.items.8":"Przyjemności i rozrywka czasem przeszkadzają mi w wykonaniu pracy.","INST.bscs.items.9":"Mam trudności z koncentracją.","INST.bscs.items.10":"Potrafię skutecznie pracować na rzecz celów długoterminowych.","INST.bscs.items.11":"Czasami nie potrafię się powstrzymać przed zrobieniem czegoś, nawet jeśli wiem, że to złe.","INST.bscs.items.12":"Często działam bez przemyślenia wszystkich możliwości.","LABELS.s2":"Współczucie wobec siebie","LABELS.s3":"Od obwiniania siebie do współczucia wobec siebie","LABELS.compassion":"Półka z książkami: współczucie i samokrytyka","LABELS.s4":"Zagadka regulacji emocji","LABELS.s7":"Zmiana siebie zamiast otoczenia","LABELS.shelf13":"Półka z książkami: terapia oparta na procesach i zwinność emocjonalna","LABELS.s9":"Optymizm i nadzieja na przyszłość","LABELS.riseabove":"Rise Above (Kaufman, 2024): od mentalności ofiary do rozwoju","LABELS.s10":"Subkultury organizacyjne i motywacja","LABELS.s8":"Ponowna ocena poznawcza, wyczerpanie ego i nastawienia","LABELS.mattering":"Jak ludzie zaczynają mieć znaczenie","LABELS.s11":"Wygadanie się: kiedy rozmowa pomaga?","LABELS.s13":"Motywacja: zewnętrzna, introjektowana i wewnętrzna","LABELS.s15":"Pozytywne emocje, czas wolny i dzielenie się dobrymi wiadomościami","LABELS.s14":"Inteligencja emocjonalna: zdolność, cecha czy połączenie?","LABELS.s5":"Samokontrola i wybór sytuacji","LABELS.s6":"Wybieranie i zmienianie swojego otoczenia","LABELS.s12":"Perfekcjonizm: doskonałe wyniki, ale pod presją","REFS.nea25":"21% pracowników zgłasza objawy wypalenia zawodowego","REFS.who22":"co roku 12 miliardów dni roboczych traconych z powodu depresji i lęku","REFS.icd11":"wypalenie zakwalifikowane jako zjawisko związane z pracą","REFS.cbs26":"wskaźnik absencji 5,4% w 2025 r.; 9% nieobecnych wskazuje dolegliwości psychiczne lub wypalenie","REFS.tno24":"absencja z powodu dolegliwości psychicznych trwa średnio 63 dni robocze; w 75% przypadków jest (częściowo) związana z pracą","REFS.arbo24":"8,3 mld € na absencję (częściowo) związaną z pracą w 2023 r., z czego 4,9 mld € z powodu obciążenia psychospołecznego","REFS.arbo18":"około jednej czwartej dni absencji wiąże się z dolegliwościami psychicznymi, przeciążeniem lub wypaleniem","REFS.mkb":"średnio od 250 € do 400 € za dzień absencji","REFS.arbowet":"art. 3 ust. 2: polityka zapobiegania obciążeniu psychospołecznemu lub jego ograniczania; art. 5: ocena ryzyka (RI&E) z planem działania","REFS.arbobes":"art. 2.15: ocena ryzyk psychospołecznych w RI&E i określenie działań w planie działania","REFS.arboportaal":"oficjalne informacje rządowe o obciążeniu psychospołecznym","REFS.wor":"art. 27: prawo rady pracowników do zgody, m.in. w sprawie badań pracowników i polityki warunków pracy","REFS.gdpr":"Ogólne rozporządzenie o ochronie danych (RODO)","T.rStrRel":"Twoje relatywnie najmocniejsze obszary"},"tr":{"T.proto":"Pilot sürüm – kuruluşunuzda ilk pilot için şimdiden kullanılabilir.","T.brand":"Kurumsal İyi Oluş Taraması","T.brandShort":"İyi Oluş Taraması","T.by":"Dr. Azarakhsh Mokri'nin “Kuruluşlarda ve eğitim kurumlarında kişisel ve kişiler arası yetkinlikler” dersinden esinlenilmiştir","T.nHome":"Genel bakış","T.nTake":"Taramayı yap","T.nReport":"Kurum raporu","T.nWs":"Atölyeler","T.nMethod":"Yöntem","T.heroK":"Bilgi yoğun kuruluşlar için · 20 çalışandan başlayan pilot uygulamalar","T.heroT":"Kuruluşunuzun ruh sağlığının nasıl olduğunu ve nereden başlamanız gerektiğini görün.","T.heroP":"Çalışanlar, geçerliği kanıtlanmış bilimsel ölçekleri yaklaşık 15 dakikada anonim olarak doldurur. Herkes hemen kişisel bir özet görür; kuruluş ise kademeye göre bir rapor, bilimsel yorum ve önerilen atölye planını alır.","T.ctaTake":"Taramaya başla","T.ctaDemo":"Örnek raporu gör","T.f1":"8 boyut","T.f1s":"Uluslararası alanda geçerliği kanıtlanmış 8 ölçekle ölçülür","T.f2":"Anonim","T.f2s":"İsim yok; 5 kişiden az olan gruplar asla gösterilmez","T.f3":"9 dil","T.f3s":"Türkçe, İngilizce, Felemenkçe, Almanca, Fransızca, İspanyolca, Lehçe, Arapça ve Farsça","T.measT":"Neyi ölçüyoruz","T.measP":"Her boyut basit bir soruyu yanıtlar. Neyi ölçtüğünü ve neyi ölçmediğini görmek için bir karta dokunun.","T.whatIs":"Neyi ölçer","T.whatNot":"Neyi ölçmez","T.privT":"Önce gizlilik","T.priv.0":"Adınızı, e-posta adresinizi veya personel numaranızı sormuyoruz.","T.priv.1":"Yalnızca kademeniz kaydedilir (ör. personel veya orta kademe yönetici).","T.priv.2":"5 kişiden az olan gruplar kurum raporunda gizlenir.","T.priv.3":"Yanıtlar hiçbir tanımlayıcı olmadan kaydedilir ve rapor yalnızca grup sonuçlarını gösterir; hiçbir yönetici kimsenin bireysel sonucunu göremez.","T.notT":"Bu tarama ne değildir","T.not":"Bu bir klinik tanı değildir ve psikolojik danışmanlığın ya da tedavinin yerini tutmaz. Öz şefkat, esneklik ve aidiyet gibi psikolojik kaynakları ölçer; tükenmişliği veya iş yükünü ölçmez. Amacı gruplardaki örüntüleri görmek ve doğru desteği seçmektir.","T.tT":"Taramayı yap","T.tRound":"Taramanız","T.tSelf":"Kişisel tarama (sonuçlar cihazınızda kalır)","T.tJoin":"Kurumsal tarama turu","T.tLevel":"Kademeniz veya rolünüz nedir?","T.tLevelHint":"Yalnızca grupları karşılaştırmak için kullanılır; başka hiçbir kişisel bilgi sormuyoruz.","T.tPack":"Hangi sürüm?","T.tMin":"dk","T.tItems":"soru","T.tConsent":"Katılımın gönüllü olduğunu, yanıtlarımın adım olmadan kaydedildiğini ve bunun bir klinik tanı olmadığını anlıyorum.","T.tStart":"Başla","T.tNext":"Sonraki bölüm","T.tPrev":"Önceki bölüm","T.tFinish":"Sonuçlarımı gör","T.tPart":"Bölüm","T.tOf":"/","T.tMissing":"Henüz şu soruları yanıtlamadınız:","T.tSaved":"Yanıtlar bu cihazda kaydedilir; sayfayı kapatırsanız buradan devam edebilirsiniz.","T.tResume":"Yarım kalan taramaya devam et","T.tRestart":"Baştan başla","T.rT":"Sonuçlarınıza kısa bir bakış","T.rP":"Puanlar 0 ile 100 arasındadır ve her zaman yüksek puan daha iyi anlamına gelecek şekilde düzenlenmiştir.","T.rStr":"Güçlü yönleriniz","T.rGrow":"Gelişime açık alanlar","T.rTips":"İki kısa ipucu","T.rDetail":"Ayrıntılar ve alt ölçekler","T.rSend":"Kuruluşuma anonim olarak gönder","T.rSent":"Yanıtlarınız anonim olarak kaydedildi. Teşekkürler!","T.rCode":"Yanıt kodu","T.rCodeP":"Bu kodu kopyalayıp e-postayla SoloNovate'e gönderin; yöneticinize veya İK'ya değil. Kod yalnızca yanıt numaralarını ve kademenizi içerir, adınızı içermez. E-posta adresinizi yanıtlarınızla ilişkilendirmeyiz ve kodu aktardıktan sonra e-postayı sileriz.","T.rCopy":"Kodu kopyala","T.rCopied":"Kopyalandı","T.rCare":"Uzun süredir kendinizi kötü hissediyorsanız veya baş edemediğinizi düşünüyorsanız işyeri hekiminizle, aile hekiminizle veya bir psikolojik danışmanla konuşun. Yardım istemek bir güç göstergesidir.","T.rNot":"Bu sonuç bugünkü yanıtlarınızın bir anlık görüntüsüdür; bir etiket ya da tanı değildir.","T.band.0":"Dikkat gerektiriyor","T.band.1":"Orta","T.band.2":"Güçlü","T.pT":"Kurum raporu","T.pP":"Kuruluşunuzun kademelere göre ruh sağlığı haritası; öncelikler ve önerilen atölyelerle.","T.pSrc":"Rapor verisi","T.pDemo":"Örnek veri (tanıtım amaçlı)","T.pLive":"Bu turun gerçek yanıtları","T.pImport":"Yanıt kodlarını içe aktar","T.pImportP":"Yanıt kodlarını buraya yapıştırın (her satıra bir kod).","T.pImportGo":"Ekle","T.pAdded":"yanıt eklendi","T.pN":"Katılımcı","T.pLevels":"Kademeler","T.pAvg":"Genel ortalama","T.pLowShare":"“Dikkat gerektiriyor” oranı","T.pNoPri":"Hiçbir boyut öncelik eşiğine ulaşmıyor. Öneri: güçlü yönleri korumak için pekiştirme atölyeleri.","T.pWhy":"Neden","T.pFor":"Öncelikli hedef grup","T.pStrengths":"Kuruluşun güçlü yönleri","T.pGap":"Kademeler arasındaki en büyük fark","T.pHidden":"5'ten az","T.pNone":"Henüz yanıt yok.","T.pExport":"Özet veriyi kopyala (CSV)","T.pAdmin":"Turları yönet","T.pAdminP":"Kuruluşta taramayı koordine eden kişi için. Bir tur oluşturun ve bağlantıyı çalışanlarla paylaşın.","T.pOrg":"Kuruluş adı","T.pRoundName":"Tur adı","T.pCreate":"Tur oluştur","T.pRounds":"Turlar","T.pChoose":"Bir tur seçin","T.pNoAdmin":"Tur oluşturmak ve gerçek yanıtları görmek yalnızca taramayı koordine edenlere (bu sayfanın editörleri) açıktır. Diğer herkes örnek raporu görebilir veya yanıt kodlarını içe aktarabilir.","T.pDemoNote":"Bu rapor, gerçek bir raporun nasıl göründüğünü görebilmeniz için 180 kişilik simüle edilmiş veri kullanır.","T.wT":"Atölyeler","T.wP":"Her atölye bir veya iki boyuta odaklanır ve Dr. Mokri'nin ders materyallerine dayanır. Okuma bağlantıları dersin wiki sayfalarını açar; başlıklar burada çevrilmiştir ancak sayfaların kendisi Farsçadır.","T.wGoals":"Hedefler","T.wWho":"Kimin için","T.wLen":"Süre","T.wEv":"Bilimsel kanıt","T.wRead":"Ders wiki'sinde ek okuma (Farsça sayfalar)","T.mT":"Yöntem","T.mP":"Neyi ölçtüğümüz, puanları nasıl hesapladığımız ve sınırlılıkların nerede olduğu konusunda şeffafız.","T.mInst":"Ölçekler","T.mScore":"Puanlama","T.mScoreP":"Her alt ölçeğin ortalaması 0–100 aralığına dönüştürülür: (ortalama − en düşük) ÷ (en yüksek − en düşük) × 100. Ters puanlanan maddeler önce ters çevrilir. Orijinal ölçekte yüksek puan daha fazla güçlük anlamına geliyorsa (ör. AAQ-II), puan ters çevrilir; böylece her yerde “yüksek = daha iyi” olur.","T.mBands":"Puan aralıkları","T.mBandsP":"37,5'in altı: dikkat gerektiriyor · 37,5 ile 62,5 arası: orta · 62,5'in üstü: güçlü. Bu eşikler ölçek aralığına dayanan uzlaşımsal değerlerdir; norm değerleri ya da klinik kesme puanları değildir.","T.mLim":"Sınırlılıklar","T.mLimL.0":"Tüm ölçekler öz bildirime dayanır ve o günkü ruh halinden veya iyi görünme isteğinden etkilenebilir.","T.mLimL.1":"Puan aralıkları norm değerlerine dayanmaz; kuruluş içindeki ve zaman içindeki karşılaştırmalar, “ulusal ortalamayla” yapılan karşılaştırmalardan daha geçerlidir.","T.mLimL.2":"Ölçeklerin geçerliği orijinal dillerinde kanıtlanmıştır ve İngilizce maddeler orijinal ifadeleri korur. Burada kullanılan diğer dillerdeki sürümler için, bu Türkçe sürüm dahil, bu biçimiyle ayrıca geçerlik çalışması yapılmamıştır; güvenirliklerini pilotta kontrol ediyoruz. Bilimsel araştırma için resmî olarak geçerliği kanıtlanmış sürümleri kullanın (bkz. Kaynaklar).","T.mLimL.3":"Bu araç bireyler hakkında karar vermek (işe alım, performans değerlendirmesi) için tasarlanmamıştır ve bu amaçla kullanılmamalıdır.","T.mEth":"Etik ve gizlilik","T.mEthL.0":"Katılım gönüllüdür ve herkes istediği an bırakabilir.","T.mEthL.1":"Kesin tarih veya saat değil, yalnızca ay ve yıl kaydedilir.","T.mEthL.2":"Raporlar yalnızca grup düzeyindedir ve en küçük grup büyüklüğü 5'tir.","T.mEthL.3":"Kişisel sonuçlar yalnızca yanıtlayan kişinin cihazında gösterilir.","T.mCourse":"Bu hizmet, Dr. Azarakhsh Mokri'nin “Kuruluşlarda ve eğitim kurumlarında kişisel ve kişiler arası yetkinlikler” dersinden doğmuştur. Ölçekler, dersin slaytlarında tanıtılanlardır.","T.mWiki":"Dersin tam wiki'si (Farsça)","T.mOrgPsy":"Endüstri ve örgüt psikolojisi","T.items":"madde","T.scale":"Ölçek","T.ref":"Kaynak","T.session":"Ders materyali","T.footer":"SoloNovate'ten Kurumsal İyi Oluş Taraması · pilot sürüm · tanı amaçlı değildir","T.dims":"boyut","T.whyT":"Bu neden önemli","T.whyP":"Ruh sağlığı ikinci plana atılabilecek bir konu değildir; devamsızlıkta, işten ayrılmalarda ve işin kalitesinde kendini gösterir.","T.why.0.0":"5'te 1","T.why.0.1":"çalışan Hollanda'da tükenmişlik şikâyetleri bildiriyor (2025'te %21).","T.why.1.0":"12 milyar","T.why.1.1":"iş günü dünyada her yıl depresyon ve kaygı nedeniyle kaybediliyor; bunun verimlilik maliyeti yaklaşık 1 trilyon ABD doları.","T.why.2.0":"Mesleki","T.why.2.1":"DSÖ tükenmişliği (ICD-11) mesleki bir olgu olarak sınıflandırır: yalnızca kişisel değil, işle ilgili bir sorun.","T.getT":"Kuruluşunuz ne alır","T.get.0.0":"Kademeye göre rapor","T.get.0.1":"Her kademe için sekiz boyut; güçlü yönler, öncelikler ve kademeler arası farklarla.","T.get.1.0":"Bilimsel yorum","T.get.1.1":"Her puanın ne anlama geldiğini ve ne anlama gelmediğini sade bir dille açıklama.","T.get.2.0":"Atölye planı","T.get.2.1":"Önceliklere uygun iki veya üç atölye; biçim ve süreyle birlikte.","T.get.3.0":"Her katılımcıya kişisel anlık görüntü","T.get.3.1":"Her çalışan kendi sonuçlarını ve iki pratik ipucunu görür; yönetimle hiçbir şey paylaşılmaz.","T.get.4.0":"45 dakikalık değerlendirme toplantısı","T.get.4.1":"Yönetim ve İK ile sonuçların somut sonraki adımlarla ele alınması.","T.pilot.0.0":"Hafta 0","T.pilot.0.1":"Başlangıç","T.pilot.0.2":"30 dakikalık görüşme: hedefler, kademeler, zamanlama ve çalışanların nasıl bilgilendirileceği.","T.pilot.1.0":"Hafta 1–2","T.pilot.1.1":"Tarama açık","T.pilot.1.2":"Çalışanlar anonim taramayı 8–18 dakikada, telefonda veya bilgisayarda, dokuz dilden birinde doldurur.","T.pilot.2.0":"Hafta 3","T.pilot.2.1":"Rapor","T.pilot.2.2":"Kademelere göre anonim grup raporu ve önerilen atölye planı.","T.pilot.3.0":"Hafta 4","T.pilot.3.1":"Değerlendirme ve seçim","T.pilot.3.2":"Yönetimle görüşme; ilk atölyelerin ve tekrar ölçüm tarihinin seçilmesi.","T.needT":"Sizden neye ihtiyacımız var","T.need.0":"Bir irtibat kişisi (ör. İK'dan)","T.need.1":"En az 20 katılımcı ve her kademede en az 5 kişi","T.need.2":"Çalışanlara kısa bir duyuru (şablonunu biz sağlıyoruz)","T.need.3":"Gerekirse çalışan konseyinin (OR) bilgilendirilmesi","T.need.4":"Dört haftaya yayılmış toplam yaklaşık 3 saatlik İK zamanı","T.lawT":"Hollanda ve AB mevzuatına uygun","T.law.0.0":"GDPR (AVG)","T.law.0.1":"İsim veya tanımlayıcı toplamıyoruz; sonuçlar yalnızca en az 5 kişilik gruplar için raporlanır.","T.law.1.0":"Arbowet","T.law.1.1":"İşverenin PSA politikasını (Madde 3(2)) RI&E'nin çalışma koşulları bölümünün yanında bir girdi olarak destekler (Arbobesluit Madde 2.15).","T.law.2.0":"Çalışan konseyi","T.law.2.1":"Bu tür bir çalışan taraması genellikle çalışan konseyiyle görüşülür (WOR Madde 27); hazırlığında size yardımcı oluyoruz.","T.faqT":"Sık sorulan sorular","T.faq.0.0":"Çalışanların ne kadar zamanını alır?","T.faq.0.1":"Kısa sürüm yaklaşık 8 dakika, tam sürüm yaklaşık 18 dakika sürer. Her telefon ve bilgisayarda çalışır.","T.faq.1.0":"Yöneticiler bireysel yanıtları görebilir mi?","T.faq.1.1":"Hayır. İsim yoktur ve kurum raporu yalnızca beş veya daha fazla kişilik grupları gösterir.","T.faq.2.0":"Bu bir tanı mı?","T.faq.2.1":"Hayır. Gruplardaki örüntüleri görmek ve doğru desteği seçmek için geçerliği kanıtlanmış ölçeklere dayanan, klinik olmayan bir taramadır. Zorlanan kişileri işyeri hekimine, aile hekimine veya bir psikoloğa yönlendiriyoruz.","T.faq.3.0":"Ölçeklerin geçerliği kanıtlanmış mı?","T.faq.3.1":"Sekizinin tamamı uluslararası alanda yayımlanmış ve geçerliği orijinal dillerinde kanıtlanmış ölçeklerdir; orijinal puanlama anahtarlarını kullanıyoruz (bkz. Yöntem ve Kaynaklar). İngilizce maddeler orijinal ifadeleri korur; burada kullanılan diğer dillerdeki sürümler için, Türkçe dahil, bu biçimiyle henüz ayrıca geçerlik çalışması yapılmamıştır; bu nedenle pilot verileriyle her ölçeğin güvenirliğini kontrol ediyoruz. Ticari kullanım lisansları yazarlarla görüşülmektedir.","T.faq.4.0":"İş stresini veya tükenmişliği ölçer mi?","T.faq.4.1":"Doğrudan değil. Baskıyla başa çıkmaya yardımcı olan psikolojik kaynakları ölçer. İş yükü ve özerklik gibi işle ilgili riskler bir çalışma koşulları anketiyle ölçülür. İkisi birbirini tamamlar ve bunları birleştirmenize yardımcı olabiliriz.","T.faq.5.0":"Büyük kuruluşlarda işe yarar mı?","T.faq.5.1":"Evet. Pilot tek bir departman veya şubeyle başlayıp sonra genişletilebilir. Anonimlik kuralları her büyüklükte aynıdır: sonuçlar yalnızca en az 5 kişilik gruplar için verilir.","T.faq.6.0":"Pilotta yanıtlar nasıl toplanır?","T.faq.6.1":"Her katılımcı anonim bir yanıt kodunu (yalnızca yanıt numaraları ve kademe) asla işverene değil, doğrudan SoloNovate'e e-postayla gönderir. SoloNovate bu e-postaları içe aktardıktan sonra siler. Tam ölçekli uygulamada güvenli bir çevrimiçi toplama sistemi kurulabilir.","T.faq.7.0":"Rapordan sonra ne olur?","T.faq.7.1":"Bir değerlendirme görüşmesi, Hollanda'daki nitelikli bir iş ortağının yürüttüğü iki veya üç atölye ve neyin değiştiğini görmek için 3–6 ay sonra tekrar ölçüm.","T.ctaT":"Pilotla ilgileniyor musunuz?","T.ctaP":"Taramayı kendiniz deneyin, örnek raporu inceleyin ve kısa bir talep gönderin.","T.calcT":"Stresle ilgili devamsızlık size ne kadara mal oluyor?","T.calcP":"Kuruluşunuz için hızlı bir tahmin. Rakamları kendi durumunuza göre değiştirin.","T.cEmp":"Çalışan sayısı","T.cAbs":"Devamsızlık oranı (%)","T.cAbsH":"2025'te Hollanda ortalaması: %5,4","T.cSal":"Ortalama yıllık brüt maaş (€)","T.cShare":"Stres veya psikolojik şikâyetlerden kaynaklanan devamsızlık günlerinin oranı (%)","T.cShareH":"Ulusal tahmin: yaklaşık dörtte bir","T.cRed":"Senaryo: stresle ilgili devamsızlıktaki azalma","T.cDays":"yıllık devamsızlık günü","T.cStress":"bunlardan stresle ilgili olan","T.cCost":"stresle ilgili devamsızlığın yıllık maliyeti","T.cSave":"bu senaryoda yıllık tasarruf","T.cPerDay":"Burada kullanılan devamsızlık günü başına maliyet: {x} (işveren maliyetleri için maaş × 1,3 ÷ 220 iş günü). Hollanda'daki tahminler günlük €250 ile €400 arasındadır.","T.cNote":"Bu bir öngörü değil, bir senaryodur. Ölçek puanı doğrudan daha az devamsızlık gününe dönüşmez. Önlemeye yatırım yapmaya değip değmeyeceğini değerlendirmek için bu tahmini, gerçekte neyin değiştiğini görmek için tekrar ölçümü kullanın.","T.wsPartner":"Uygulama: her atölyeyi Hollanda'daki iş ortağı ağımızdan deneyimli bir psikolog veya eğitmen yürütür; organizasyonu ve koordinasyonu biz yaparız.","T.pilotNoteT":"Bu pilot sürüm hakkında","T.pilotNote":"Pilotta yanıtlar yalnızca kuruluşunuzun raporunu hazırlamak ve hizmeti doğrulamak için kullanılır, başka hiçbir şey için değil. Ölçeklerin ticari kullanım lisansları paralel olarak yazarlarıyla görüşülmektedir. Sürpriz olmasın diye bunu baştan söylüyoruz.","T.arboT":"Arbowet kapsamındaki yükümlülüklerinizi yerine getirmenize yardımcı olur","T.arboP":"Hollanda'daki işverenler, iş stresi gibi psikososyal iş yükünü (PSA) önlemeye veya en azından sınırlamaya yönelik bir politika uygulamalı ve PSA risklerini risk envanteri ve değerlendirmelerinde (RI&E) bir eylem planıyla birlikte değerlendirmelidir.","T.arbo.0.0":"RI&E'nizin PSA bölümü için bir yapı taşı","T.arbo.0.1":"PSA riskleri esas olarak işin kendisiyle ilgilidir: iş yükü, özerklik, destek ve istenmeyen davranışlar. Bu tarama diğer tarafı ekler: ekiplerinizin kademeye göre hangi psikolojik kaynaklara sahip olduğu. Bunu bir çalışma koşulları anketinin yerine değil, yanında kullanın.","T.arbo.1.0":"Eylem planınız için girdi","T.arbo.1.1":"Atölye planı ve tekrar ölçüm, kayda geçirebileceğiniz somut ve tarihli eylemler sağlar.","T.arbo.2.0":"Görünür takip","T.arbo.2.1":"Öncesi ve sonrası sonuçlar, çalışan konseyine risklere karşı harekete geçtiğinizi göstermenize yardımcı olur.","T.arboNote":"Tarama RI&E'nin, çalışma koşulları anketinin veya sertifikalı bir uzmanın değerlendirmesinin yerini tutmaz; onları tamamlar.","T.fName":"Ad soyad","T.fOrg":"Kuruluş","T.fMail":"E-posta","T.fSize":"Çalışan sayısı","T.fMsg":"Mesaj (isteğe bağlı)","T.fSend":"Pilot talep et","T.fSent":"E-posta programınız hazır bir taleple açılacak; yalnızca Gönder'e tıklayın.","T.sizes.0":"20–50","T.sizes.1":"50–250","T.sizes.2":"250–1.000","T.sizes.3":"1.000+","T.sizes.4":"Diğer","T.ctaAbout":"Maryam Jaberi hakkında","T.pPlan":"Bu atölyeyi planla","T.nSrc":"Kaynaklar","T.sT":"Kaynaklar","T.sP":"Bu sitedeki tüm rakamlar, yasal atıflar ve bilimsel iddialar, orijinal kaynağa bağlantıyla. Yayın başlıklarını orijinal dillerinde veriyoruz.","T.gStats":"Rakamlar ve maliyetler","T.gLaw":"Hukuk ve mevzuat","T.gEv":"Atölyelerin arkasındaki araştırmalar","T.gInst":"Ölçekler","T.gCourse":"Ders","T.courseRef":"Mokri, A. Kuruluşlarda ve eğitim kurumlarında kişisel ve kişiler arası yetkinlikler [ders; Farsça]. Ders notları psikoloji wiki'sinde derlenmiştir.","T.audT":"Nereden başlamak istersiniz?","T.paths.0.1":"Üst yönetim","T.paths.0.2":"Maliyeti, size ne kazandıracağı ve pilotun nasıl işlediği.","T.paths.0.3":"Maliyet tahmini","T.paths.1.1":"İK","T.paths.1.2":"Hafta hafta akış, kimin ne yaptığı ve hazır belgeler.","T.paths.1.3":"Süreç ve belgeler","T.paths.2.1":"Çalışanlar","T.paths.2.2":"Yanıtlarınıza ne olduğu ve taramayı kendiniz deneme imkânı.","T.paths.2.3":"G olog","T.flow.6.3":"Psikolog atölyeleri yürütür; 3–6 ay sonra yapılan tekrar ölçüm neyin değiştiğini gösterir.","T.seeT":"Kim neyi görür","T.seeP":"Anonimlik sadece vaat edilmez, sürece yerleşiktir.","T.seeCols.0":"Bireysel yanıtlar (isimsiz)","T.seeCols.1":"Grup raporu (5+ kişi)","T.see.0.0":"Çalışan","T.see.0.1":"Yalnızca kendisininki","T.see.0.2":"Özet","T.see.1.0":"Yönetim ve İK","T.see.1.1":"Asla","T.see.1.2":"Evet","T.see.2.0":"İş ortağı psikolog","T.see.2.1":"Asla","T.see.2.2":"Evet","T.see.3.1":"Evet, isimsiz","T.see.3.2":"Evet","T.empT":"Çalışanlar için: yanıtlarınıza ne olur","T.emp.0":"Kimse adınızı, e-posta adresinizi veya personel numaranızı sormaz.","T.emp.1":"Yöneticiniz ve İK yalnızca 5 veya daha fazla kişilik grupların sonuçlarını görür.","T.emp.2":"Sonucunuzu iki pratik ipucuyla birlikte hemen görürsünüz. Bunu yalnızca siz görürsünüz.","T.emp.3":"Katılım gönüllüdür. İstediğiniz an bırakabilir veya bir soruyu atlayabilirsiniz.","T.emp.4":"Bir yanıt kodu gönderirseniz SoloNovate'e gönderin – asla yöneticinize veya İK'ya değil.","T.docsT":"Örnek belgeler","T.docsP":"Başlamadan önce neyi imzaladığınızı tam olarak bilmeniz için. Her belge Felemenkçe ve İngilizce olarak mevcuttur ve yazdırılabilir veya PDF olarak kaydedilebilir. Bunlar, pilottan önce birlikte netleştirdiğimiz taslaklardır.","T.docs.pilot-agreement.0":"Pilot sözleşmesi","T.docs.pilot-agreement.1":"Pilotun kapsamı, roller, anonimlik, fiyat, sorumluluk.","T.docs.data-processing.0":"Veri işleme sözleşmesi","T.docs.data-processing.1":"GDPR Madde 28: hangi veriler, güvenlik, saklama süresi ve veri ihlalleri.","T.docs.privacy-participants.0":"Katılımcılar için gizlilik bildirimi","T.docs.privacy-participants.1":"Çalışanlar için sade dille: kim neyi görür ve haklarınız neler.","T.docs.staff-announcement.0":"Çalışanlara duyuru","T.docs.staff-announcement.1":"Yönetimden gelen, uyarlamaya hazır bir duyuru şablonu.","T.aud.mgmt":"Yönetim için","T.aud.staff":"Çalışanlar için","T.aud.hr":"İK için","T.open":"Aç (Felemenkçe / İngilizce)","T.rMail":"Kodu SoloNovate'e e-postayla gönder","T.partT":"Psikologlar ve eğitmenler için","T.partP":"Kuruluşlara atölye çalışması veya koçluk hizmeti mi veriyorsunuz? Küçük bir iş ortağı ağı kuruyoruz.","T.partL.0":"Ölçümü, raporu ve müşteri iletişimini biz üstleniriz; siz en iyi yaptığınız işi yaparsınız.","T.partL.1":"Her iş veriyle başlar: ilk oturumdan önce hangi konuların ve kademelerin dikkat gerektirdiğini bilirsiniz.","T.partL.2":"Bilimsel kanıt ve kaynaklarıyla birlikte, kullanıma ve uyarlamaya hazır atölye taslakları.","T.partL.3":"Ücretlerinizi kendiniz belirler ve hangi işleri kabul edeceğinize kendiniz karar verirsiniz.","T.partAsk":"Kuruluşlarda gruplarla çalışma deneyimi, ilgili bir mesleki kayıt (örneğin NIP veya BIG) ve Felemenkçe veya İngilizce atölye verebilme becerisi arıyoruz.","T.partCta":"İş ortağı ol","T.partSubj":"İş ortaklığı başvurusu – İyi Oluş Taraması","T.rvTabs":"Rapor görünümleri","T.whatL":"Ne görüyorsunuz","T.howL":"Nasıl okunur","T.keyL":"Temel çıkarım","T.srcL":"Kaynak","T.rv.sum.0":"Özet","T.rv.sum.1":"En önemli bulgular, sade bir dille.","T.rv.sum.2":"Puanlar 0 ile 100 arasındadır: 0 her soruya verilebilecek en düşük yanıt, 100 en yüksek yanıttır. 37,5'in altı = dikkat gerektiriyor, 37,5–62,5 = orta, 62,5'in üstü = güçlü.","T.rv.heat.0":"Kademeye göre","T.rv.heat.1":"Her kademenin her boyuttaki ortalama puanı.","T.rv.heat.2":"Kademeleri karşılaştırmak için satırı, bir kademenin profilini görmek için sütunu okuyun. Sıcak renkler dikkat gerektirir, yeşil güçlüdür. 5 kişiden az olan gruplar gizlidir.","T.rv.gap.0":"Kademeler arası farklar","T.rv.gap.1":"Her boyut için: her kademenin aldığı puan, en düşükten en yükseğe.","T.rv.gap.2":"Uzun bir çizgi, kademelerin bunu çok farklı yaşadığı anlamına gelir. Bu çoğunlukla bireylere değil, işe veya role işaret eder.","T.rv.dist.0":"Dağılım","T.rv.dist.1":"Her boyutta her aralıkta kaç kişi olduğu.","T.rv.dist.2":"Ortalama, zorlanan bir grubu gizleyebilir. Kırmızı kısım, dikkat gerektiren kişilerin oranıdır.","T.rv.prof.0":"Kademe profili","T.rv.prof.1":"Tek bir kademenin tüm kuruluşla karşılaştırılması.","T.rv.prof.2":"Çubuk kademenin puanını, ince çizgi kuruluş ortalamasını gösterir. Sağdaki sayı farktır: pozitif değer, ortalamadan daha iyi anlamına gelir.","T.rv.sub.0":"Boyutların bileşenleri","T.rv.sub.1":"Her boyutu oluşturan parçalar.","T.rv.sub.2":"Bir boyut düşük olduğunda, onu hangi bileşenin aşağı çektiğini burada görürsünüz – dolayısıyla en çok hangi tür atölyenin yardımcı olacağını. Burada yüksek her zaman daha iyidir.","T.rv.time.0":"Zaman içinde","T.rv.time.1":"İlk ölçüm ile tekrar ölçüm yan yana.","T.rv.time.2":"Açık çubuk = ilk ölçüm, koyu = tekrar ölçüm. Yaklaşık 3 puandan küçük değişiklikler tesadüf olabilir.","T.rv.plan.0":"Eylem planı","T.rv.plan.1":"Önce neye, kimin için ve hangi atölyeyle odaklanılmalı.","T.rv.plan.2":"Ortalaması 55'in altında olan veya kişilerin %25'inden fazlasının dikkat gerektirdiği boyut önceliklidir.","T.kpiSub.0":"kişi yanıt verdi","T.kpiSub.1":"5+ kişilik kademe","T.kpiSub.2":"tüm boyutların ortalaması (0–100)","T.kpiSub.3":"tüm puanlar içinde “dikkat gerektiriyor” aralığında olanların oranı","T.sumN":"{k} kademeden {n} kişinin yanıtlarına dayanır.","T.sumStrong":"En güçlü: {a}.","T.sumWeak":"En çok dikkat gerektiren: {d} ({m}); “dikkat gerektiriyor” aralığındaki kişilerin oranı: {p}.","T.sumGap":"Kademeler arasındaki en büyük fark: {d} – {hi}: {a}, {lo}: {b}.","T.sumNext":"Önerilen ilk adım: “{w}” atölyesi (öncelikli hedef grup: {who}).","T.and":"ve","T.heatKey":"En düşük puan: {lv} – {d} ({v}). En yüksek: {lv2} – {d2} ({v2}).","T.gapKey":"En büyük fark: {d} – {lo}: {a}, {hi}: {b} ({x} puan).","T.distKey":"{d}: ortalama {m} olmasına rağmen dikkat gerektiren kişilerin oranı {p}.","T.profSel":"Kademe","T.profUp":"{lv} kuruluş ortalamasının üstünde: {a}.","T.profDown":"{lv} kuruluş ortalamasının altında: {b}.","T.profFlat":"{lv} tüm boyutlarda kuruluş ortalamasına yakın.","T.orgAvg":"kuruluş ortalaması","T.subKey":"En düşük bileşen: {d} boyutunda {s} ({v}).","T.timeDemo":"Simüle edilmiş örnek: öz şefkat ve akış atölyelerinden dört ay sonra tekrar ölçüm.","T.timeKey":"En büyük iyileşme: {d} (+{x}). En küçük değişim: {d2} ({y}).","T.timeNone":"Bu görünüm bir tekrar ölçümden sonra kullanılabilir olur (atölyelerden 3–6 ay sonra).","T.t1":"İlk ölçüm","T.t2":"Tekrar ölçüm","T.rHow":"Her puan 0 ile 100 arasındadır. Arka plan rengi aralığı gösterir: kırmızı dikkat gerektirir, sarı orta, yeşil güçlüdür. Bu bir anlık görüntüdür, tanı değildir.","T.ariaHome":"Ana sayfa","T.ariaNav":"Bölümler","T.ariaLang":"Dil","T.tUnval":"Bu sorular, orijinal ölçeklerin bizim yaptığımız Türkçe çevirisidir ve henüz ayrıca geçerlik çalışması yapılmamıştır. Aynı şekilde puanlanırlar; güvenirliklerini pilotta kontrol ediyoruz.","DIMS.compassion.n":"Öz şefkat","DIMS.compassion.q":"Başarısız olduğumda veya zorlandığımda kendime karşı nazik miyim, sert mi?","DIMS.compassion.what":"İnsanların başarısızlık ve acı anlarında kendilerine nasıl davrandığı: nazik ve dengeli mi, yoksa öz eleştirel ve bunalmış mı.","DIMS.compassion.not":"Tembellik, bencillik veya kendi standartlarını düşürmek değildir.","DIMS.compassion.b.0":"Öz eleştiri güçlü. Hatalar muhtemelen suçlama, kendini yalnız hissetme ve olumsuz düşüncelere takılıp kalma ile karşılanıyor.","DIMS.compassion.b.1":"Bazen nazik, bazen sert; baskı altında kendini suçlamaya kayıyor.","DIMS.compassion.b.2":"Zor anlarda kendine karşı nazik ve dengeli; kendine saldırmadan hatalarından öğreniyor.","DIMS.compassion.tips.0":"Bir hatadan sonra kendinize sorun: “Bu durumdaki bir arkadaşıma ne derdim?” ve bunu kendinize söyleyin.","DIMS.compassion.tips.1":"Hataların her insanın deneyiminin bir parçası olduğunu hatırlayın; duygunuzu içinde boğulmadan adlandırın.","DIMS.flex.n":"Psikolojik esneklik","DIMS.flex.q":"Zor düşünce ve duygular beni önemli olandan uzaklaştırıyor mu?","DIMS.flex.what":"Hoş olmayan düşünce ve duyguların, kişinin değerlerine göre yaşamasını ve çalışmasını ne ölçüde engellediği.","DIMS.flex.not":"Düşük puan bir tanı değildir; duygularla boğuşmayı gösterir.","DIMS.flex.b.0":"Acı veren düşünce ve duygular çok yer kaplıyor ve muhtemelen önemli eylemleri engelliyor.","DIMS.flex.b.1":"Duygularla boğuşmak bazen engel oluyor ama iş genellikle devam ediyor.","DIMS.flex.b.2":"Duygular zor olsa bile önemli olana doğru ilerleyebiliyor.","DIMS.flex.tips.0":"Bir düşünceyle savaşmak yerine “… diye bir düşüncem var” deyin ve bir sonraki küçük adımı atın.","DIMS.flex.tips.1":"Tam hazır hissetmeseniz bile her gün değerlerinize uygun küçük bir eylem yapın.","DIMS.optim.n":"İyimserlik","DIMS.optim.q":"Genel olarak işlerin iyi sonuçlanacağını bekler miyim?","DIMS.optim.what":"Kişinin gelecekten genel beklentisi: iyi şeyler mi, kötü şeyler mi.","DIMS.optim.not":"Kuruluşun geleceği veya iş memnuniyetiyle ilgili değildir; oldukça kalıcı bir kişisel özelliktir.","DIMS.optim.b.0":"Kötü sonuç beklentisi baskın; denemeyi sürdürme enerjisi daha düşük olabilir.","DIMS.optim.b.1":"Dengeli bir bakış; ne çok umutlu ne de karamsar.","DIMS.optim.b.2":"Genellikle iyi sonuçlar bekliyor; bu çoğunlukla sebat ve daha iyi sağlıkla ilişkilidir.","DIMS.optim.tips.0":"Birkaç dakika bir yıl sonraki “mümkün olan en iyi benliğiniz” hakkında yazın; bu alıştırma araştırmalarda iyimserliği artırdı.","DIMS.optim.tips.1":"Her endişenin yanına bir “bu olursa şunu yapacağım: …” planı yazın.","DIMS.hope.n":"Umut","DIMS.hope.q":"Hedeflerim, onlara giden yollarım ve harekete geçecek enerjim var mı?","DIMS.hope.what":"Bilimsel anlamda umut: hedeflere sahip olmak, onlara giden yolları bulmak (yollar) ve bu hedefleri sürdürecek enerji ve inanca sahip olmak (eyleyicilik).","DIMS.hope.not":"İyimserlikle aynı değildir; umut, kişinin hedefe ulaşma kapasitesiyle ilgilidir.","DIMS.hope.b.0":"Hedeflere ulaşmak için yol veya enerji az; kendini çıkmazda hissetme olasılığı daha yüksek.","DIMS.hope.b.1":"Hedefler ve yollar var ama engell /* ── scoring ── */
function subScore(instId, sub, ans){
  const I = INST[instId]; let s = 0, n = 0;
  for(const raw of sub.items){ const k = Math.abs(raw) - 1; const a = ans[k]; if(a == null) continue; s += raw < 0 ? (I.max + I.min - a) : a; n++; }
  if(!n) return null;
  const pomp = (s / n - I.min) / (I.max - I.min) * 100;
  return sub.dir === -1 ? 100 - pomp : pomp;
}
function scoreAll(a){ // a: {instId:[answers]}
  const d = {}, sub = {};
  for(const D of DIMS){
    const I = INST[D.inst]; if(!a[D.inst]) continue;
    const vals = D.main.map(m => subScore(D.inst, I.sub.find(s => s.id === m), a[D.inst])).filter(v => v != null);
    d[D.id] = vals.reduce((x, y) => x + y, 0) / vals.length;
    for(const sid of D.subs){ const S = I.sub.find(s => s.id === sid); const v = subScore(D.inst, S, a[D.inst]); if(v != null) sub[D.inst + "." + sid] = v; }
  }
  return {d, sub};
}
const encode = o => "SJ1-" + btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const decode = s => { s = s.trim().replace(/^SJ1-/, ""); s = s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length % 4) s += "="; return JSON.parse(decodeURIComponent(escape(atob(s)))); };

const avg = a => { const v = a.filter(x => x != null); return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null; };
function demoData(seed0 = 42, shift = {}){
  let seed = seed0; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const g = () => { let s = 0; for(let i = 0; i < 6; i++) s += rnd(); return (s - 3) / Math.sqrt(.5); };
  const base = {compassion:52, flex:63, optim:58, hope:66, belong:64, flow:50, ei:64, selfctrl:57};
  const off = {staff:{compassion:-4, flow:-9, belong:-5, hope:-3}, lead:{compassion:-8, flex:-6, selfctrl:2}, mid:{compassion:-12, flex:-9, flow:-2, optim:-5}, senior:{flow:12, hope:8, optim:9, belong:6}};
  const n = {staff:96, lead:38, mid:31, senior:15}; const out = [];
  for(const [lv, k] of Object.entries(n)) for(let i = 0; i < k; i++){ const d = {}, sub = {};
    for(const D of DIMS){ d[D.id] = Math.max(2, Math.min(98, base[D.id] + (shift[D.id] || 0) + ((off[lv] || {})[D.id] || 0) + g() * 15));
      D.subs.forEach((s, j) => sub[D.inst + "." + s] = Math.max(2, Math.min(98, d[D.id] + g() * 10 + (j - D.subs.length / 2) * 3))); }
    out.push({lv, d, sub}); }
  return out;
}

function subscribeRounds(){

async function loadLive(){
  if(!DB || !REP.round) return;
  try{ const s = await DB.collection("responses").where("r", "==", REP.round).get(); REP.live = s.docs.map(d => d.data()); }catch(e){ REP.live = []; }
  if(cur === "report") renderReport();
}
