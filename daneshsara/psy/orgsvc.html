sto desde abajo","WS.w-flow.goals.1":"Bloques de concentración sin interrupciones","WS.w-flow.goals.2":"Desconexión psicológica fuera del horario laboral","WS.w-flow.ev":"Los metaanálisis relacionan el job crafting con un mayor compromiso laboral y la desconexión tras el trabajo con menos agotamiento; la mayor parte de esta evidencia es correlacional.","WSLEN.w-flow":"1 × 4 horas","WS.w-ei.t":"Inteligencia emocional en la práctica","WS.w-ei.who":"Puestos de atención al cliente, mandos y supervisores","WS.w-ei.goals.0":"Nombrar las emociones con precisión","WS.w-ei.goals.1":"Responder a las emociones de compañeros y clientes","WS.w-ei.goals.2":"Trabajo emocional: reconocer su coste","WS.w-ei.ev":"De media, la formación en IE aumenta moderadamente las puntuaciones de IE; la IE autoinformada se solapa con la personalidad, así que conviene leer las puntuaciones con cautela.","WSLEN.w-ei":"2 × 3 horas","WS.w-self.t":"Autocontrol por diseño: entorno, hábitos y combinación de tentaciones","WS.w-self.who":"Todos los niveles; versión para mandos: nudges y opciones por defecto saludables","WS.w-self.goals.0":"Elegir y cambiar situaciones en lugar de forzar la voluntad","WS.w-self.goals.1":"Crear hábitos y señales recordatorias","WS.w-self.goals.2":"Combinación de tentaciones (unir un pequeño placer a una tarea pesada) y reservas de emergencia (días de excepción planificados)","WS.w-self.ev":"Las revisiones sugieren que moldear la situación funciona mejor que confiar en la fuerza de voluntad en el momento; la combinación de tentaciones ayudó en un experimento de campo, pero el efecto se desvaneció con el tiempo.","WSLEN.w-self":"1 × 4 horas","LEVELS.staff":"Personal sin mando","LEVELS.lead":"Jefes de equipo","LEVELS.mid":"Mandos intermedios","LEVELS.senior":"Alta dirección","LEVELS.student":"Estudiantes","SUBN.scs.sk":"Amabilidad con uno mismo","SUBN.scs.sj":"Sin excesiva autocrítica","SUBN.scs.ch":"Humanidad compartida","SUBN.scs.is":"No sentirse solo en las dificultades","SUBN.scs.mi":"Atención plena","SUBN.scs.oi":"No dejarse arrastrar por los sentimientos","SUBN.ahs.path":"Vías (caminos para alcanzar metas)","SUBN.ahs.agency":"Agencia (energía orientada a metas)","SUBN.gbs.acc":"Aceptación / inclusión","SUBN.gbs.rej":"Menos rechazo","SUBN.wolf.abs":"Absorción","SUBN.wolf.enj":"Disfrute","SUBN.wolf.int":"Motivación intrínseca","SUBN.sreis.p":"Percibir las emociones","SUBN.sreis.u":"Usar las emociones","SUBN.sreis.r":"Comprender las emociones","SUBN.sreis.m1":"Gestionar las propias emociones","SUBN.sreis.m2":"Gestionar las emociones de los demás","PACKS.quick":"Corta","PACKS.standard":"Completa","INST.scs.name":"Escala de autocompasión – versión breve","INST.scs.intro":"¿Cómo suele comportarse consigo mismo en momentos difíciles?","INST.scs.anchors.0":"Casi nunca","INST.scs.anchors.4":"Casi siempre","INST.scs.items.0":"Cuando fracaso en algo importante para mí, me consume la sensación de no estar a la altura.","INST.scs.items.1":"Intento ser comprensivo y paciente con los aspectos de mi personalidad que no me gustan.","INST.scs.items.2":"Cuando ocurre algo doloroso, intento ver la situación de forma equilibrada.","INST.scs.items.3":"Cuando me siento decaído, tiendo a pensar que la mayoría de la gente probablemente es más feliz que yo.","INST.scs.items.4":"Intento ver mis fallos como parte de la condición humana.","INST.scs.items.5":"Cuando paso por un momento muy difícil, me doy el cuidado y la ternura que necesito.","INST.scs.items.6":"Cuando algo me altera, intento mantener mis emociones en equilibrio.","INST.scs.items.7":"Cuando fracaso en algo importante para mí, tiendo a sentirme solo en mi fracaso.","INST.scs.items.8":"Cuando me siento decaído, tiendo a obsesionarme y fijarme en todo lo que va mal.","INST.scs.items.9":"Cuando siento que no estoy a la altura en algún aspecto, intento recordarme que la mayoría de las personas comparten ese sentimiento.","INST.scs.items.10":"Desapruebo y juzgo mis propios defectos y carencias.","INST.scs.items.11":"Soy intolerante e impaciente con los aspectos de mi personalidad que no me gustan.","INST.aaq.name":"Cuestionario de aceptación y acción II (AAQ-II)","INST.aaq.intro":"¿Hasta qué punto es verdad cada afirmación para usted?","INST.aaq.anchors.0":"Nunca es verdad","INST.aaq.anchors.6":"Siempre es verdad","INST.aaq.items.0":"Mis experiencias y recuerdos dolorosos me dificultan vivir una vida valiosa para mí.","INST.aaq.items.1":"Tengo miedo de mis sentimientos.","INST.aaq.items.2":"Me preocupa no ser capaz de controlar mis preocupaciones y sentimientos.","INST.aaq.items.3":"Mis recuerdos dolorosos me impiden tener una vida plena.","INST.aaq.items.4":"Las emociones me causan problemas en la vida.","INST.aaq.items.5":"Parece que la mayoría de la gente maneja su vida mejor que yo.","INST.aaq.items.6":"Las preocupaciones obstaculizan mi éxito.","INST.lot.name":"Test de orientación vital – revisado (LOT-R)","INST.lot.intro":"¿Hasta qué punto está de acuerdo con cada afirmación?","INST.lot.anchors.0":"Totalmente en desacuerdo","INST.lot.anchors.1":"En desacuerdo","INST.lot.anchors.2":"Ni de acuerdo ni en desacuerdo","INST.lot.anchors.3":"De acuerdo","INST.lot.anchors.4":"Totalmente de acuerdo","INST.lot.items.0":"En tiempos de incertidumbre, suelo esperar lo mejor.","INST.lot.items.1":"Me resulta fácil relajarme.","INST.lot.items.2":"Si algo puede salirme mal, me saldrá mal.","INST.lot.items.3":"Siempre soy optimista respecto a mi futuro.","INST.lot.items.4":"Disfruto mucho de mis amigos.","INST.lot.items.5":"Es importante para mí mantenerme ocupado.","INST.lot.items.6":"Casi nunca espero que las cosas salgan como quiero.","INST.lot.items.7":"No me altero con demasiada facilidad.","INST.lot.items.8":"Rara vez cuento con que me vayan a pasar cosas buenas.","INST.lot.items.9":"En general, espero que me ocurran más cosas buenas que malas.","INST.ahs.name":"Escala de esperanza para adultos (AHS)","INST.ahs.intro":"¿Hasta qué punto es cierta cada afirmación en su caso?","INST.ahs.anchors.0":"Totalmente falso","INST.ahs.anchors.7":"Totalmente cierto","INST.ahs.items.0":"Se me ocurren muchas maneras de salir de un aprieto.","INST.ahs.items.1":"Persigo mis metas con energía.","INST.ahs.items.2":"Me siento cansado la mayor parte del tiempo.","INST.ahs.items.3":"Hay muchas maneras de sortear cualquier problema.","INST.ahs.items.4":"En una discusión, me dejo vencer fácilmente.","INST.ahs.items.5":"Se me ocurren muchas maneras de conseguir las cosas de la vida que son importantes para mí.","INST.ahs.items.6":"Me preocupa mi salud.","INST.ahs.items.7":"Incluso cuando otros se desaniman, sé que puedo encontrar una forma de resolver el problema.","INST.ahs.items.8":"Mis experiencias pasadas me han preparado bien para el futuro.","INST.ahs.items.9":"He tenido bastante éxito en la vida.","INST.ahs.items.10":"Suelo estar preocupado por algo.","INST.ahs.items.11":"Alcanzo las metas que me propongo.","INST.gbs.name":"Escala general de pertenencia (GBS)","INST.gbs.intro":"¿Hasta qué punto está de acuerdo con cada afirmación?","INST.gbs.anchors.0":"Totalmente en desacuerdo","INST.gbs.anchors.6":"Totalmente de acuerdo","INST.gbs.items.0":"Cuando estoy con otras personas, me siento incluido.","INST.gbs.items.1":"Tengo vínculos estrechos con mi familia y mis amigos.","INST.gbs.items.2":"Siento que estoy al margen.","INST.gbs.items.3":"Siento que a la gente no le importo.","INST.gbs.items.4":"Me siento aceptado por los demás.","INST.gbs.items.5":"Como no encajo en ninguna parte, me siento distante en la época de fiestas.","INST.gbs.items.6":"Me siento aislado del resto del mundo.","INST.gbs.items.7":"Tengo sentido de pertenencia.","INST.gbs.items.8":"Cuando estoy con otras personas, me siento un extraño.","INST.gbs.items.9":"Tengo mi lugar entre los demás.","INST.gbs.items.10":"Me siento conectado con los demás.","INST.gbs.items.11":"Mis amigos y mi familia no me incluyen en sus planes.","INST.wolf.name":"Inventario de flow en el trabajo (WOLF)","INST.wolf.intro":"En las últimas dos semanas, ¿con qué frecuencia ha vivido cada una de estas situaciones?","INST.wolf.anchors.0":"Nunca","INST.wolf.anchors.1":"Casi nunca","INST.wolf.anchors.2":"A veces","INST.wolf.anchors.3":"Con regularidad","INST.wolf.anchors.4":"A menudo","INST.wolf.anchors.5":"Muy a menudo","INST.wolf.anchors.6":"Siempre","INST.wolf.items.0":"Cuando estoy trabajando, no pienso en nada más.","INST.wolf.items.1":"Mi trabajo me atrapa.","INST.wolf.items.2":"Cuando estoy trabajando, me olvido de todo lo que me rodea.","INST.wolf.items.3":"Estoy totalmente inmerso en mi trabajo.","INST.wolf.items.4":"Mi trabajo me hace sentir bien.","INST.wolf.items.5":"Disfruto mucho haciendo mi trabajo.","INST.wolf.items.6":"Me siento feliz mientras trabajo.","INST.wolf.items.7":"Me siento alegre cuando trabajo.","INST.wolf.items.8":"Seguiría haciendo este trabajo aunque me pagaran menos.","INST.wolf.items.9":"Me doy cuenta de que también quiero trabajar en mi tiempo libre.","INST.wolf.items.10":"Trabajo porque lo disfruto.","INST.wolf.items.11":"Cuando trabajo en algo, lo hago por mí mismo.","INST.wolf.items.12":"Mi motivación viene del propio trabajo y no de la recompensa por hacerlo.","INST.sreis.name":"Escala de inteligencia emocional autoevaluada (SREIS)","INST.sreis.intro":"¿Con qué precisión le describe cada afirmación?","INST.sreis.anchors.0":"Muy imprecisa","INST.sreis.anchors.1":"Algo imprecisa","INST.sreis.anchors.2":"Ni una cosa ni otra","INST.sreis.anchors.3":"Algo precisa","INST.sreis.anchors.4":"Muy precisa","INST.sreis.items.0":"Al mirar las expresiones faciales de la gente, reconozco las emociones que están sintiendo.","INST.sreis.items.1":"Soy una persona racional y rara vez, por no decir nunca, consulto mis sentimientos para tomar una decisión.","INST.sreis.items.2":"Tengo un vocabulario rico para describir mis emociones.","INST.sreis.items.3":"Tengo problemas para manejar mi enfado.","INST.sreis.items.4":"Cuando alguien que conozco está de mal humor, puedo ayudarle a calmarse y a sentirse mejor rápidamente.","INST.sreis.items.5":"Soy consciente de los mensajes no verbales que envían los demás.","INST.sreis.items.6":"Al tomar decisiones, escucho mis sentimientos para ver si la decisión me parece correcta.","INST.sreis.items.7":"Se me ocurren fácilmente muchos sinónimos de palabras que expresan emociones, como felicidad y tristeza.","INST.sreis.items.8":"Puedo manejar situaciones estresantes sin ponerme demasiado nervioso.","INST.sreis.items.9":"Conozco estrategias para generar o mejorar el buen ánimo de los demás.","INST.sreis.items.10":"Al mirar las expresiones faciales de la gente, sé si están siendo sinceros conmigo.","INST.sreis.items.11":"Soy una persona racional y no me gusta basarme en mis sentimientos para tomar decisiones.","INST.sreis.items.12":"Tengo palabras para describir cómo las emociones van de lo simple a lo complejo.","INST.sreis.items.13":"Soy capaz de manejar la mayoría de los problemas que me alteran.","INST.sreis.items.14":"No se me da muy bien ayudar a los demás a sentirse mejor cuando están enfadados o tristes.","INST.sreis.items.15":"Mis primeras impresiones sobre cómo se sienten los demás a menudo son erróneas.","INST.sreis.items.16":"En comparación con la mayoría de la gente, tengo un vocabulario más rico para describir sentimientos.","INST.sreis.items.17":"Sé mantener la calma en situaciones difíciles o estresantes.","INST.sreis.items.18":"Soy el tipo de persona a la que otros acuden cuando necesitan ayuda en una situación difícil.","INST.bscs.name":"Escala breve de autocontrol (BSCS)","INST.bscs.intro":"¿En qué medida refleja cada afirmación cómo suele ser usted?","INST.bscs.anchors.0":"Nada","INST.bscs.anchors.4":"Mucho","INST.bscs.items.0":"Se me da bien resistir las tentaciones.","INST.bscs.items.1":"Me cuesta dejar los malos hábitos.","INST.bscs.items.2":"Soy perezoso.","INST.bscs.items.3":"Digo cosas inapropiadas.","INST.bscs.items.4":"Hago ciertas cosas que son malas para mí si son divertidas.","INST.bscs.items.5":"Rechazo las cosas que son malas para mí.","INST.bscs.items.6":"Ojalá tuviera más autodisciplina.","INST.bscs.items.7":"La gente diría que tengo una autodisciplina de hierro.","INST.bscs.items.8":"El placer y la diversión a veces me impiden terminar el trabajo.","INST.bscs.items.9":"Me cuesta concentrarme.","INST.bscs.items.10":"Soy capaz de trabajar de forma eficaz para alcanzar metas a largo plazo.","INST.bscs.items.11":"A veces no puedo evitar hacer algo, aunque sepa que está mal.","INST.bscs.items.12":"A menudo actúo sin pensar en todas las alternativas.","LABELS.s2":"Autocompasión","LABELS.s3":"De la autoculpa a la autocompasión","LABELS.compassion":"Estantería: compasión y autocrítica","LABELS.s4":"El enigma de la regulación emocional","LABELS.s7":"Cambiar uno mismo en lugar de cambiar el entorno","LABELS.shelf13":"Estantería: terapia basada en procesos y agilidad emocional","LABELS.s9":"Optimismo y esperanza en el futuro","LABELS.riseabove":"Rise Above (Kaufman, 2024): de la mentalidad de víctima al crecimiento","LABELS.s10":"Subculturas organizativas y motivación","LABELS.s8":"Reevaluación, agotamiento del ego y mentalidades","LABELS.mattering":"Cómo llegamos a importar a los demás","LABELS.s11":"Desahogarse: ¿cuándo ayuda hablarlo?","LABELS.s13":"Motivación: externa, introyectada e intrínseca","LABELS.s15":"Emociones positivas, ocio y compartir buenas noticias","LABELS.s14":"Inteligencia emocional: ¿habilidad, rasgo o mezcla?","LABELS.s5":"Autocontrol y elección de situaciones","LABELS.s6":"Elegir y cambiar el propio entorno","LABELS.s12":"Perfeccionismo: excelente pero bajo presión","REFS.nea25":"el 21 % de los trabajadores declara síntomas de agotamiento laboral","REFS.who22":"12 000 millones de días laborables perdidos cada año por depresión y ansiedad","REFS.icd11":"el agotamiento laboral clasificado como fenómeno ocupacional","REFS.cbs26":"tasa de absentismo del 5,4 % en 2025; el 9 % de quienes se ausentaron cita problemas psicológicos o agotamiento","REFS.tno24":"la ausencia por problemas psicológicos dura de media 63 días laborables; en el 75 % de los casos se debe (en parte) al trabajo","REFS.arbo24":"8300 millones de euros por absentismo relacionado (en parte) con el trabajo en 2023, de los cuales 4900 millones se deben a la carga psicosocial","REFS.arbo18":"alrededor de una cuarta parte de los días de ausencia se relaciona con problemas psicológicos, sobrecarga o agotamiento","REFS.mkb":"de media, entre 250 € y 400 € por día de ausencia","REFS.arbowet":"art. 3, apdo. 2: política para prevenir o limitar la carga psicosocial; art. 5: evaluación de riesgos (RI&E) con plan de acción","REFS.arbobes":"art. 2.15: evaluar los riesgos psicosociales en la RI&E y fijar medidas en el plan de acción","REFS.arboportaal":"información oficial sobre la carga psicosocial en el trabajo","REFS.wor":"art. 27: derecho de consentimiento del comité de empresa en cuestiones como las encuestas a la plantilla y la política de condiciones de trabajo","REFS.gdpr":"Reglamento General de Protección de Datos (RGPD)","T.rStrRel":"Donde puntúa más alto hoy","T.rCodeShow":"Mostrar el código","T.rDetailNote":"Las partes basadas en solo 2–4 preguntas son orientativas.","T.meName":"Maryam Jaberi","T.allLv":"todos los niveles de puesto (ningún nivel puntúa claramente más bajo)","T.planNote":"Antes de elegir talleres, compruebe con su RI&E o su encuesta de condiciones de trabajo si la carga de trabajo, la autonomía o el apoyo explican estos patrones. Si es así, aborde eso primero.","T.print":"Imprimir / guardar como PDF","T.fHint":"Abre su aplicación de correo con esta solicitud ya rellenada. ¿No tiene aplicación de correo? Escriba a {e}.","T.rStrNote":"Ninguna de sus puntuaciones está todavía en la franja «sólido»; estas son simplemente sus puntuaciones más altas de hoy.","T.pWhyLow":"El {p} de las personas está en «requiere atención».","T.pWhyGap":"El grupo «{lv}» puntúa {x} puntos por debajo de los demás niveles.","T.pAlso":"También conviene vigilar","T.pScopeBelong":"Nota: esta escala mide la pertenencia en la vida en general, no solo en el trabajo; analice en la reunión de resultados las posibles causas relacionadas con el trabajo.","T.pScopeOptim":"Nota: el optimismo es un rasgo bastante estable; cabe esperar cambios modestos, y conviene fijarse primero en las circunstancias laborales."},"pl":{"T.proto":"Wersja pilotażowa – już teraz dostępna do pierwszego pilotażu w Twojej organizacji.","T.brand":"Badanie dobrostanu w organizacji","T.brandShort":"Badanie dobrostanu","T.by":"Inspirowane kursem „Kompetencje osobiste i interpersonalne w organizacjach i placówkach edukacyjnych” dr. Azarakhsha Mokriego","T.nHome":"Przegląd","T.nTake":"Wypełnij ankietę","T.nReport":"Raport organizacji","T.nWs":"Warsztaty","T.nMethod":"Metoda","T.heroK":"Dla organizacji opartych na wiedzy · pilotaże od 20 uczestników","T.heroT":"Zobacz, jakie zasoby psychologiczne mają Twoje zespoły według poziomu stanowisk – i od czego zacząć.","T.heroP":"Pracownicy anonimowo wypełniają osiem opublikowanych kwestionariuszy naukowych w 8–18 minut i od razu widzą swój wynik. Twoja organizacja otrzymuje raport grupowy według poziomów stanowisk, z interpretacją napisaną prostym językiem i planem dwóch lub trzech zalecanych warsztatów.","T.ctaTake":"Rozpocznij ankietę","T.ctaDemo":"Zobacz przykładowy raport","T.f1":"8 wymiarów","T.f1s":"8 opublikowanych kwestionariuszy, zwalidowanych w języku oryginału","T.f2":"Anonimowo","T.f2s":"Bez nazwisk; grupy mniejsze niż 5 osób nigdy nie są pokazywane","T.f3":"9 języków","T.f3s":"Polski, angielski, niderlandzki, niemiecki, francuski, hiszpański, turecki, arabski i perski","T.measT":"Co mierzymy","T.measP":"Każdy wymiar odpowiada na jedno proste pytanie. Dotknij karty, aby zobaczyć, co mierzy, a czego nie.","T.whatIs":"Co mierzy","T.whatNot":"Warto pamiętać","T.privT":"Prywatność przede wszystkim","T.priv.0":"Nie pytamy o imię i nazwisko, adres e-mail ani numer pracownika.","T.priv.1":"Razem z Twoimi odpowiedziami zapisywane są tylko Twój poziom stanowiska, miesiąc i to, którą wersję wypełniasz.","T.priv.2":"Grupy mniejsze niż 5 osób są ukryte w raporcie organizacji.","T.priv.3":"Odpowiedzi są zapisywane bez żadnego identyfikatora; żaden przełożony ani dział HR nie widzi niczyjego indywidualnego wyniku.","T.notT":"Czym to badanie nie jest","T.not":"To nie jest diagnoza kliniczna i nie zastępuje poradnictwa ani leczenia. Mierzy zasoby psychologiczne, takie jak współczucie wobec siebie, elastyczność i poczucie przynależności, a nie wypalenie zawodowe ani obciążenie pracą. Służy do dostrzegania wzorców w grupach i wyboru właściwego wsparcia.","T.tT":"Wypełnij ankietę","T.tRound":"Twoja ankieta","T.tSelf":"Twoje odpowiedzi i wynik zostają w tej przeglądarce. Nic nie jest wysyłane, chyba że zdecydujesz się wysłać swój kod odpowiedzi.","T.tJoin":"Runda ankiety w organizacji","T.tLevel":"Na jakim poziomie stanowiska pracujesz lub jaką pełnisz rolę?","T.tLevelHint":"Służy tylko do porównywania grup. Grupy liczące mniej niż 5 osób nigdy nie są pokazywane.","T.tPack":"Która wersja?","T.tMin":"min","T.tItems":"pyt.","T.tConsent":"Rozumiem, że udział jest dobrowolny, że nic nie zostanie wysłane bez mojego działania i że nie jest to diagnoza kliniczna.","T.tStart":"Rozpocznij","T.tNext":"Następna część","T.tPrev":"Poprzednia część","T.tFinish":"Zobacz moje wyniki","T.tPart":"Część","T.tOf":"z","T.tMissing":"Te pytania nie mają jeszcze odpowiedzi:","T.tSaved":"Odpowiedzi są zapisywane na tym urządzeniu; jeśli zamkniesz stronę, możesz kontynuować tutaj.","T.tResume":"Kontynuuj niedokończoną ankietę","T.tRestart":"Zacznij od nowa","T.rT":"Twoje wyniki w skrócie","T.rP":"Na każdej skali wyższy wynik oznacza więcej danego zasobu. To obraz Twoich dzisiejszych odpowiedzi, a nie diagnoza.","T.rStr":"Twoje najwyższe wyniki","T.rGrow":"Twoje najniższe wyniki","T.rTips":"Dwie krótkie wskazówki","T.rDetail":"Szczegóły i podskale","T.rSend":"Wyślij anonimowo do mojej organizacji","T.rSent":"Twoje odpowiedzi zostały zapisane anonimowo. Dziękujemy!","T.rCode":"Kod odpowiedzi","T.rCodeP":"Skopiuj ten kod i wyślij go e-mailem do SoloNovate, a nie do przełożonego ani działu HR. Zawiera tylko Twoje odpowiedzi, poziom stanowiska i miesiąc, bez nazwiska. Ponieważ kod przychodzi e-mailem, SoloNovate przez chwilę widzi Twój adres e-mail; nigdy nie zapisujemy go razem z odpowiedziami, a e-mail usuwamy po wczytaniu kodu.","T.rCopy":"Skopiuj kod","T.rCopied":"Skopiowano","T.rCare":"Jeśli od dłuższego czasu czujesz przygnębienie albo masz wrażenie, że sobie nie radzisz, porozmawiaj z lekarzem medycyny pracy, lekarzem rodzinnym lub psychologiem. Prośba o pomoc to oznaka siły.","T.rNot":"Ten wynik to obraz Twoich dzisiejszych odpowiedzi, a nie etykieta czy diagnoza.","T.band.0":"Wymaga uwagi","T.band.1":"Średni","T.band.2":"Wysoki","T.pT":"Raport organizacji","T.pP":"Zasoby psychologiczne Twojej organizacji według poziomów stanowisk, z priorytetami i zalecanymi warsztatami.","T.pSrc":"Dane raportu","T.pDemo":"Dane przykładowe (demonstracja)","T.pLive":"Prawdziwe odpowiedzi z tej rundy","T.pImport":"Importuj kody odpowiedzi","T.pImportP":"Wklej tutaj kody odpowiedzi (jeden w wierszu).","T.pImportGo":"Dodaj","T.pAdded":"Dodano odpowiedzi","T.pN":"Uczestnicy","T.pLevels":"Poziomy","T.pAvg":"Wymiar z najniższym wynikiem","T.pLowShare":"Odsetek „wymaga uwagi”","T.pNoPri":"Żaden wymiar nie osiąga progu priorytetu. Propozycja: warsztaty podtrzymujące, aby utrzymać mocne strony.","T.pWhy":"Dlaczego","T.pFor":"Głównie dla","T.pStrengths":"Mocne strony organizacji","T.pGap":"Największa różnica między poziomami","T.pHidden":"mniej niż 5","T.pNone":"Brak odpowiedzi.","T.pExport":"Kopiuj dane zbiorcze (CSV)","T.pAdmin":"Zarządzaj rundami","T.pAdminP":"Dla osoby koordynującej ankietę w organizacji. Utwórz rundę i wyślij link pracownikom.","T.pOrg":"Nazwa organizacji","T.pRoundName":"Nazwa rundy","T.pCreate":"Utwórz rundę","T.pRounds":"Rundy","T.pChoose":"Wybierz rundę","T.pNoAdmin":"Tworzyć rundy i oglądać prawdziwe odpowiedzi mogą tylko osoby koordynujące ankietę (edytorzy tej strony). Pozostali mogą obejrzeć przykładowy raport lub zaimportować kody odpowiedzi.","T.pDemoNote":"Ten raport korzysta z symulowanych danych 180 osób, aby pokazać, jak wygląda prawdziwy raport.","T.wT":"Warsztaty","T.wP":"Każdy warsztat dotyczy jednego lub dwóch wymiarów i opiera się na materiałach kursu dr. Mokriego. Linki do lektur otwierają strony wiki kursu; tytuły są tu przetłumaczone, ale same strony są po persku.","T.wGoals":"Cele","T.wWho":"Dla kogo","T.wLen":"Czas trwania","T.wEv":"Dowody naukowe","T.wRead":"Lektura w wiki kursu (strony po persku)","T.mT":"Metoda","T.mP":"Przejrzyście o tym, co mierzymy, jak liczymy wyniki i gdzie są ograniczenia.","T.mInst":"Kwestionariusze","T.mScore":"Obliczanie wyników","T.mScoreP":"Średnia każdej podskali jest przeliczana na zakres 0–100: (średnia − minimum) ÷ (maksimum − minimum) × 100. Pozycje odwrócone są najpierw przekodowywane. Gdy wysoki wynik w oryginalnym kwestionariuszu oznacza więcej trudności (np. AAQ-II), wynik jest odwracany, aby wszędzie „wyżej = lepiej”.","T.mBands":"Przedziały wyników","T.mBandsP":"Poniżej 37,5: wymaga uwagi · od 37,5 do 62,5: średni · powyżej 62,5: wysoki. Te progi wynikają z konwencji stosowanej dla Self-Compassion Scale (średnia odpowiedź poniżej 2,5 lub powyżej 3,5 na skali 1–5) i dla uproszczenia stosujemy je do wszystkich skal. Nie są to normy populacyjne ani kliniczne punkty odcięcia, a typowe wyniki różnią się między kwestionariuszami.","T.mLim":"Ograniczenia","T.mLimL.0":"Wszystkie kwestionariusze to samoopis, więc na wyniki może wpływać dzisiejszy nastrój lub chęć pokazania się z dobrej strony.","T.mLimL.1":"Przedziały nie mają norm populacyjnych; porównania wewnątrz organizacji i w czasie są trafniejsze niż porównania ze „średnią krajową”.","T.mLimL.2":"Kwestionariusze są zwalidowane w języku oryginału, a pozycje angielskie zachowują oryginalne brzmienie. Używane tu wersje w innych językach, w tym ta polska, nie zostały w tej formie osobno zwalidowane; ich rzetelność sprawdzamy w pilotażu. Do badań naukowych używaj oficjalnie zwalidowanych wersji (zob. Źródła).","T.mLimL.3":"To narzędzie nie jest przeznaczone do decyzji dotyczących pojedynczych osób (rekrutacja, ocena pracy) i nie wolno go do tego używać.","T.mEth":"Etyka i prywatność","T.mEthL.0":"Udział jest dobrowolny i każdy może w dowolnej chwili przerwać.","T.mEthL.1":"Zapisywany jest tylko miesiąc, a nie dokładna data ani godzina.","T.mEthL.2":"Raporty są wyłącznie grupowe, przy minimalnej wielkości grupy 5 osób.","T.mEthL.3":"Wyniki osobiste są pokazywane tylko na urządzeniu osoby odpowiadającej.","T.mCourse":"Ta usługa wyrosła z kursu dr. Azarakhsha Mokriego „Kompetencje osobiste i interpersonalne w organizacjach i placówkach edukacyjnych”. Spośród omawianych tam kwestionariuszy wybraliśmy osiem, które są krótkie, opublikowane, wolne od etykiet klinicznych i z których każdy wiąże się z umiejętnością możliwą do wyćwiczenia.","T.mWiki":"Pełne wiki kursu (po persku)","T.mOrgPsy":"Psychologia pracy i organizacji","T.items":"pozycji","T.scale":"Skala","T.ref":"Źródło","T.session":"Strona kursu w wiki (po persku)","T.footer":"Badanie dobrostanu w organizacji od SoloNovate · wersja pilotażowa · narzędzie niediagnostyczne","T.dims":"Wymiar","T.whyT":"Dlaczego to ważne","T.whyP":"Zdrowie psychiczne to nie miękki temat: widać je w absencji, rotacji i jakości pracy. To badanie nie mierzy tych problemów; mierzy zasoby psychologiczne, które pomagają ludziom radzić sobie z presją w pracy.","T.why.0.0":"1 na 5","T.why.0.1":"pracowników w Holandii zgłasza objawy wypalenia zawodowego (21% w 2025 r., ogólnokrajowe badanie NEA).","T.why.1.0":"12 miliardów","T.why.1.1":"dni roboczych traci się co roku na świecie z powodu depresji i lęku, co oznacza utratę produktywności o wartości około 1 biliona USD.","T.why.2.0":"Zawodowe","T.why.2.1":"WHO klasyfikuje wypalenie (ICD-11) jako zjawisko związane z pracą: problem pracy, a nie tylko osobisty.","T.getT":"Co otrzymuje Twoja organizacja","T.get.0.0":"Raport według poziomu stanowisk","T.get.0.1":"Osiem wymiarów dla każdego poziomu, z mocnymi stronami, priorytetami i różnicami między poziomami.","T.get.1.0":"Naukowa interpretacja","T.get.1.1":"Zrozumiałe wyjaśnienie, co każdy wynik oznacza, a czego nie.","T.get.2.0":"Plan warsztatów","T.get.2.1":"Dwa lub trzy warsztaty dopasowane do priorytetów, z formą i czasem trwania.","T.get.3.0":"Osobisty wynik dla każdego uczestnika","T.get.3.1":"Każdy pracownik od razu widzi swój wynik i dwie praktyczne wskazówki; kierownictwo nigdy nie widzi niczyjego indywidualnego wyniku.","T.get.4.0":"45-minutowe omówienie","T.get.4.1":"Omówienie wyników z kierownictwem i HR, z konkretnymi kolejnymi krokami.","T.pilot.0.0":"Tydzień 0","T.pilot.0.1":"Start","T.pilot.0.2":"Spotkanie na 30 minut: cele, poziomy, harmonogram i sposób poinformowania pracowników.","T.pilot.1.0":"Tygodnie 1–2","T.pilot.1.1":"Ankieta otwarta","T.pilot.1.2":"Pracownicy wypełniają anonimowe badanie w 8–18 minut, na telefonie lub komputerze, w jednym z dziewięciu języków.","T.pilot.2.0":"Tydzień 3","T.pilot.2.1":"Raport","T.pilot.2.2":"Anonimowy raport grupowy według poziomów i zalecany plan warsztatów.","T.pilot.3.0":"Tydzień 4","T.pilot.3.1":"Omówienie i wybór","T.pilot.3.2":"Rozmowa z kierownictwem; wybór pierwszych warsztatów i terminu kolejnego pomiaru.","T.needT":"Czego od Ciebie potrzebujemy","T.need.0":"Jednej osoby kontaktowej (np. z HR)","T.need.1":"Co najmniej 20 uczestników i co najmniej 5 na każdy poziom stanowisk","T.need.2":"Krótkiej wiadomości do pracowników (dostarczamy wzór)","T.need.3":"Jeśli w organizacji działa rada pracowników (OR): jej zgoda tam, gdzie jest wymagana (WOR art. 27). Pomagamy przygotować wniosek.","T.need.4":"Łącznie około 3 godzin pracy działu HR, rozłożonych na pięć tygodni","T.lawT":"Zgodne z przepisami holenderskimi i europejskimi","T.law.0.0":"RODO","T.law.0.1":"Nie pytamy o nazwiska; odpowiedzi są przechowywane oddzielnie od jakiegokolwiek adresu e-mail i raportowane tylko dla grup liczących co najmniej 5 osób. Ponieważ odpowiedzi dotyczące dobrostanu mogą zostać uznane za dane o zdrowiu, udział opiera się na wyraźnej, dobrowolnej zgodzie.","T.law.1.0":"Arbowet","T.law.1.1":"Może wspierać politykę PSA pracodawcy (art. 3 ust. 2) jako uzupełnienie na poziomie indywidualnym, obok działań skierowanych na źródła ryzyka i RI&E (Arbobesluit art. 2.15).","T.law.2.0":"Rada pracowników","T.law.2.1":"Takie badanie pracowników zwykle wymaga zgody rady pracowników, a przynajmniej jej udziału (WOR art. 27); pomagamy to przygotować.","T.faqT":"Najczęstsze pytania","T.faq.0.0":"Ile czasu zajmuje to pracownikom?","T.faq.0.1":"Wersja krótka trwa około 8 minut, pełna około 18. Działa na każdym telefonie i komputerze.","T.faq.1.0":"Czy przełożeni widzą indywidualne odpowiedzi?","T.faq.1.1":"Nie. Nie ma nazwisk, a raport organizacji pokazuje tylko grupy liczące pięć lub więcej osób.","T.faq.2.0":"Czy to diagnoza?","T.faq.2.1":"Nie. To niekliniczne badanie oparte na opublikowanych kwestionariuszach, służące do dostrzegania wzorców w grupach i wyboru właściwego wsparcia. Strona z wynikiem osobistym kieruje osoby, którym jest ciężko, do lekarza medycyny pracy, lekarza rodzinnego lub psychologa.","T.faq.3.0":"Czy kwestionariusze są zwalidowane?","T.faq.3.1":"Wszystkie osiem zostało opublikowanych i zwalidowanych w języku oryginału, a my używamy ich oryginalnych kluczy punktowania (zob. Metoda i Źródła). Pozycje angielskie zachowują oryginalne brzmienie; używane tu wersje w innych językach, w tym polska, nie zostały jeszcze w tej formie osobno zwalidowane, dlatego na danych z pilotażu sprawdzamy rzetelność każdej skali. Licencje na użycie komercyjne są uzgadniane z autorami.","T.faq.4.0":"Czy to mierzy stres w pracy lub wypalenie?","T.faq.4.1":"Nie bezpośrednio. Mierzy zasoby psychologiczne, które pomagają radzić sobie z presją. Ryzyka związane z pracą, takie jak obciążenie i autonomia, mierzy się badaniem warunków pracy. Oba się uzupełniają i chętnie pomożemy je połączyć.","T.faq.5.0":"Czy to działa w dużych organizacjach?","T.faq.5.1":"Tak. Pilotaż może zacząć się w jednym dziale lub lokalizacji, a potem zostać rozszerzony. Zasady anonimowości są takie same przy każdej skali: wyniki tylko dla grup liczących co najmniej 5 osób.","T.faq.6.0":"Jak zbierane są odpowiedzi w pilotażu?","T.faq.6.1":"Każdy uczestnik wysyła e-mailem anonimowy kod odpowiedzi (tylko numery odpowiedzi i poziom stanowiska) bezpośrednio do SoloNovate, nigdy do pracodawcy. SoloNovate usuwa te e-maile po wczytaniu. Przy pełnym wdrożeniu można uruchomić bezpieczne zbieranie online.","T.faq.7.0":"Co dzieje się po raporcie?","T.faq.7.1":"Omówienie, dwa lub trzy warsztaty prowadzone przez wykwalifikowanego partnera w Holandii oraz ponowny pomiar po 3–6 miesiącach, aby zobaczyć, co się zmieniło.","T.ctaT":"Interesuje Cię pilotaż?","T.ctaP":"Wypróbuj badanie samodzielnie, obejrzyj przykładowy raport i wyślij krótkie zapytanie.","T.calcT":"Ile kosztuje Cię absencja z przyczyn psychicznych?","T.calcP":"Szybki szacunek dla Twojej organizacji. Zmień liczby, aby pasowały do Twojej sytuacji.","T.cEmp":"Liczba pracowników","T.cAbs":"Wskaźnik absencji (%)","T.cAbsH":"Średnia w Holandii w 2025 r.: 5,4%","T.cSal":"Średnie roczne wynagrodzenie brutto (€)","T.cShare":"Odsetek dni absencji z powodu stresu lub dolegliwości psychicznych (%)","T.cShareH":"Szacunek krajowy: około jednej czwartej","T.cRed":"Scenariusz poglądowy (a nie spodziewany efekt): absencja związana z czynnikami psychicznymi spada o","T.cDays":"dni absencji rocznie","T.cStress":"w tym z przyczyn psychicznych","T.cCost":"roczny koszt absencji z przyczyn psychicznych","T.cSave":"roczna oszczędność w tym scenariuszu","T.cPerDay":"Przyjęty tu koszt dnia absencji: {x} (wynagrodzenie × 1,3 na koszty pracodawcy ÷ 220 dni roboczych). Holenderskie szacunki wynoszą od 250 € do 400 € dziennie.","T.cNote":"To scenariusz, a nie prognoza. Nie ma jeszcze bezpośrednich dowodów na to, że to badanie i jego warsztaty zmniejszają absencję, a wynik kwestionariusza nie przekłada się bezpośrednio na mniej dni absencji. Użyj szacunku, aby ocenić, czy warto inwestować w profilaktykę, a ponownego pomiaru, aby zobaczyć, co naprawdę się zmieniło.","T.wsPartner":"Realizacja: każdy warsztat prowadzi doświadczony psycholog lub trener w Holandii, wybrany przez nas specjalnie do Twojego zlecenia. Poznajesz tę osobę przed omówieniem wyników.","T.pilotNoteT":"O tej wersji pilotażowej","T.pilotNote":"W pilotażu odpowiedzi służą wyłącznie do przygotowania raportu Twojej organizacji i do sprawdzenia rzetelności kwestionariuszy. Licencje na komercyjne użycie kwestionariuszy są uzgadniane z ich autorami.","T.arboT":"Może wspierać Twoją politykę PSA wynikającą z Arbowet","T.arboP":"Pracodawcy w Holandii muszą prowadzić politykę zapobiegania obciążeniu psychospołecznemu (PSA), takiemu jak stres w pracy, lub przynajmniej jego ograniczania, a także oceniać ryzyka PSA w swojej ocenie ryzyka (RI&E) wraz z planem działania. Prawo wymaga, by stresem w pracy zajmować się najpierw u źródła (obciążenie pracą, autonomia, wsparcie), a dopiero potem działaniami indywidualnymi. To badanie i jego warsztaty są właśnie takim działaniem indywidualnym: wartościowym uzupełnieniem, nigdy zamiennikiem.","T.arbo.0.0":"Element części PSA Twojej RI&E","T.arbo.0.1":"Ryzyka PSA dotyczą głównie samej pracy: obciążenia, autonomii, wsparcia i niepożądanych zachowań. To badanie dodaje drugą stronę: jakie zasoby psychologiczne mają Twoje zespoły, według poziomu stanowisk. Używaj go obok badania warunków pracy, a nie zamiast niego.","T.arbo.1.0":"Materiał do planu działania","T.arbo.1.1":"Warsztaty i ponowny pomiar możesz zapisać w planie działania jako działania na poziomie indywidualnym, obok działań dotyczących samej pracy.","T.arbo.2.0":"Widoczna kontynuacja","T.arbo.2.1":"Wyniki przed i po pomagają pokazać radzie pracowników, że reagujesz na ryzyka.","T.arboNote":"Badanie nie zastępuje RI&E, badania warunków pracy ani oceny certyfikowanego eksperta; uzupełnia je.","T.fName":"Imię i nazwisko","T.fOrg":"Organizacja","T.fMail":"E-mail","T.fSize":"Liczba pracowników","T.fMsg":"Wiadomość (opcjonalnie)","T.fSend":"Poproś o pilotaż","T.fSent":"Twój program pocztowy otworzy się z wypełnionym zapytaniem; wystarczy kliknąć Wyślij.","T.sizes.0":"20–50","T.sizes.1":"50–250","T.sizes.2":"250–1000","T.sizes.3":"1000+","T.sizes.4":"Inna","T.ctaAbout":"O Maryam Jaberi","T.pPlan":"Zapytaj o ten warsztat (e-mail)","T.nSrc":"Źródła","T.sT":"Źródła","T.sP":"Wszystkie liczby, odwołania prawne i twierdzenia naukowe na tej stronie, z linkiem do oryginału. Tytuły publikacji podajemy w języku oryginału.","T.gStats":"Liczby i koszty","T.gLaw":"Prawo i przepisy","T.gEv":"Badania stojące za warsztatami","T.gInst":"Kwestionariusze","T.gCourse":"Kurs","T.courseRef":"Mokri, A. Kompetencje osobiste i interpersonalne w organizacjach i placówkach edukacyjnych [kurs; po persku]. Notatki z kursu zebrane w wiki psychologii.","T.audT":"Od czego chcesz zacząć?","T.paths.0.1":"Kierownictwo","T.paths.0.2":"Uzasadnienie biznesowe, co otrzymujesz i jak przebiega pilotaż.","T.paths.0.3":"Szacunek kosztów absencji","T.paths.1.1":"HR","T.paths.1.2":"Przebieg tydzień po tygodniu, kto co robi i gotowe dokumenty.","T.paths.1.3":"Proces i dokumenty","T.paths.2.1":"Pracownicy","T.paths.2.2":"Co dzieje się z Twoimi odpowiedziami – i wypróbuj badanie samodzielnie.","T.paths.2.3":"Twoja prywatność","T.paths.3.1":"Psycholodzy i trenerzy","T.paths.3.2":"Kwestionariusze, dowody naukowe i współpraca z nami jako partner.","T.paths.3.3":"Współpraca","T.tryIt":"Wypróbuj badanie samodzielnie (8 min)","T.jT":"Od pomiaru do działania","T.jP":"Około pięciu tygodni od startu do omówienia wyników, a potem warsztaty. Jeden dział lub cała organizacja.","T.jAfter.0":"Potem","T.jAfter.1":"Warsztaty i ponowny pomiar","T.jAfter.2":"Warsztaty prowadzone przez doświadczonego psychologa lub trenera; ponowny pomiar po 3–6 miesiącach pokazuje, czy wyniki się zmieniły.","T.company":"SoloNovate · Rotterdam · KvK 94264759 · nr VAT UE NL005072230B46","T.teamT":"Zespół","T.teamP":"Celowo mały: zawsze wiesz, z kim masz do czynienia.","T.meRole":"Założycielka SoloNovate · produkt i dane","T.meBio":"Menedżerka produktu i badaczka UX z doświadczeniem w wyszukiwarkach, streamingu wideo i platformach edukacyjnych. Projektuje badanie, chroni dane i pisze Twój raport; współpracujący psycholog sprawdza interpretację.","T.meLangs":"niderlandzki, angielski, perski","T.phName":"[Imię i nazwisko psychologa]","T.phRole":"Psycholog · [rejestracja, np. NIP lub BIG]","T.phBio":"[Dwa lub trzy zdania: doświadczenie, specjalizacja, z jakimi organizacjami i zespołami współpracuje.]","T.phLangs":"[Języki warsztatów]","T.phNote":"Podgląd – tak będzie wyglądał profil partnera po uzupełnieniu.","T.langsL":"Języki","T.profile":"Profil","T.nProc":"Jak to działa","T.prT":"Jak to działa","T.prP":"Jasny proces z małym zespołem: kto co robi, kto co widzi i jakie dokumenty podpisujemy. Bez niespodzianek dla kierownictwa i pracowników.","T.rolesT":"Kto co robi","T.roles.0.2":"Twoja jedyna osoba kontaktowa","T.roles.0.3":"Przygotowuje ankietę, chroni dane, analizuje odpowiedzi, pisze raport i koordynuje wszystko od startu po ponowny pomiar.","T.roles.1.1":"Psycholog partner","T.roles.1.2":"Z doświadczeniem w prowadzeniu warsztatów dla organizacji","T.roles.1.3":"Sprawdza interpretację raportu, bierze udział w omówieniu i prowadzi warsztaty wybrane przez zespoły.","T.roles.2.1":"Twoja osoba kontaktowa","T.roles.2.2":"Często HR lub office manager","T.roles.2.3":"Planuje z nami termin badania, przygotowuje wiadomość do pracowników, którą wysyła kierownictwo, i łączy nas z kierownictwem.","T.roles.3.1":"Pracownicy","T.roles.3.2":"Ludzie, o których tu chodzi","T.roles.3.3":"Sami decydują, czy wziąć udział, odpowiadają anonimowo w 8–18 minut i od razu widzą swój wynik.","T.roles.4.1":"Kierownictwo","T.roles.4.2":"Odpowiada za dalsze działania","T.roles.4.3":"Otrzymuje raport grupowy, omawia go na spotkaniu, wybiera kolejne kroki i dzieli się podsumowaniem z pracownikami.","T.roles.5.1":"Rada pracowników","T.roles.5.2":"Jeśli Twoja organizacja ją ma","T.roles.5.3":"Jest informowana z wyprzedzeniem i wyraża zgodę tam, gdzie wymaga tego prawo.","T.flowT":"Przebieg tydzień po tygodniu","T.flow.0.0":"Tydzień 0","T.flow.0.1":"Start","T.flow.0.2.1":"Osoba kontaktowa","T.flow.0.3":"30 minut: cele, poziomy stanowisk i harmonogram. Podpisujemy umowę pilotażową i umowę powierzenia przetwarzania danych.","T.flow.1.0":"Tydzień 0","T.flow.1.1":"Informacja dla pracowników","T.flow.1.2.0":"Kierownictwo","T.flow.1.2.1":"Rada pracowników","T.flow.1.3":"Kierownictwo wysyła wzór wiadomości: dlaczego, na czym polega anonimowość i co stanie się z wynikami.","T.flow.2.0":"Tygodnie 1–2","T.flow.2.1":"Ankieta otwarta","T.flow.2.2.0":"Pracownicy","T.flow.2.3":"Anonimowe kwestionariusze na telefonie lub komputerze. Każdy od razu widzi swój wynik. Jedno przypomnienie w połowie.","T.flow.3.0":"Tydzień 3","T.flow.3.1":"Analiza i raport","T.flow.3.2.1":"Psycholog","T.flow.3.3":"Analizujemy dane grupowe, a psycholog sprawdza interpretację. Grupy poniżej 5 osób pozostają ukryte.","T.flow.4.0":"Tydzień 4","T.flow.4.1":"Omówienie","T.flow.4.2.1":"Psycholog","T.flow.4.2.2":"Kierownictwo","T.flow.4.3":"45 minut: co oznaczają wyniki i od których dwóch lub trzech warsztatów zacząć.","T.flow.5.0":"Tydzień 4","T.flow.5.1":"Powrót do zespołu","T.flow.5.2.0":"Kierownictwo","T.flow.5.3":"Krótkie podsumowanie trafia do wszystkich pracowników. Wzięli udział, więc powinni wiedzieć, co z tego wynika.","T.flow.6.0":"Potem","T.flow.6.1":"Warsztaty i ponowny pomiar","T.flow.6.2.0":"Psycholog","T.flow.6.3":"Psycholog prowadzi warsztaty; ponowny pomiar po 3–6 miesiącach pokazuje, czy wyniki się zmieniły.","T.seeT":"Kto co widzi","T.seeP":"Anonimowość jest wbudowana w proces, a nie tylko obiecana.","T.seeCols.0":"Indywidualne odpowiedzi (bez nazwisk)","T.seeCols.1":"Raport grupowy (5+ osób)","T.see.0.0":"Pracownik","T.see.0.1":"Tylko własne","T.see.0.2":"Podsumowanie","T.see.1.0":"Kierownictwo i HR","T.see.1.1":"Nigdy","T.see.1.2":"Tak","T.see.2.0":"Psycholog partner","T.see.2.1":"Nigdy","T.see.2.2":"Tak","T.see.3.1":"Tak, bez nazwisk (e-mail usuwany po wczytaniu kodu)","T.see.3.2":"Tak","T.empT":"Dla pracowników: co dzieje się z Twoimi odpowiedziami","T.emp.0":"Nikt nie pyta Cię o imię i nazwisko, adres e-mail ani numer pracownika.","T.emp.1":"Twój przełożony i HR widzą tylko wyniki grup liczących 5 lub więcej osób.","T.emp.2":"Od razu widzisz swój wynik z dwiema praktycznymi wskazówkami. Widzisz go tylko Ty.","T.emp.3":"Udział jest dobrowolny. W każdej chwili możesz przerwać; Twoje odpowiedzi zostaną wykorzystane tylko wtedy, gdy wyślesz swój kod odpowiedzi.","T.emp.4":"Jeśli wysyłasz kod odpowiedzi, wyślij go do SoloNovate – nigdy do przełożonego ani do HR.","T.docsT":"Przykładowe dokumenty","T.docsP":"Żeby przed startem było jasne, co dokładnie podpisujesz. Każdy dokument jest dostępny po niderlandzku i angielsku i można go wydrukować lub zapisać jako PDF. To projekty, które dopracowujemy razem przed pilotażem.","T.docs.pilot-agreement.0":"Umowa pilotażowa","T.docs.pilot-agreement.1":"Zakres pilotażu, role, anonimowość, cena, odpowiedzialność.","T.docs.data-processing.0":"Umowa powierzenia przetwarzania danych","T.docs.data-processing.1":"RODO art. 28: jakie dane, bezpieczeństwo, przechowywanie i naruszenia danych.","T.docs.privacy-participants.0":"Informacja o prywatności dla uczestników","T.docs.privacy-participants.1":"Prostym językiem dla pracowników: kto co widzi i jakie masz prawa.","T.docs.staff-announcement.0":"Ogłoszenie dla pracowników","T.docs.staff-announcement.1":"Wzór wiadomości od kierownictwa, gotowy do dostosowania.","T.aud.mgmt":"Dla kierownictwa","T.aud.staff":"Dla pracowników","T.aud.hr":"Dla HR","T.open":"Otwórz (niderlandzki / angielski)","T.rMail":"Wyślij kod e-mailem do SoloNovate","T.partT":"Dla psychologów i trenerów","T.partP":"Prowadzisz warsztaty lub coaching dla organizacji? Budujemy małą sieć partnerów.","T.partL.0":"My zajmujemy się pomiarem, raportem i kontaktem z klientem; Ty robisz to, co potrafisz najlepiej.","T.partL.1":"Każde zlecenie zaczyna się od danych: przed pierwszą sesją wiesz, które tematy i poziomy stanowisk wymagają uwagi.","T.partL.2":"Gotowe scenariusze warsztatów z dowodami naukowymi i źródłami do wykorzystania i dostosowania.","T.partL.3":"To Ty ustalasz stawki i decydujesz, które zlecenia przyjmujesz.","T.partAsk":"Szukamy osób z doświadczeniem w pracy z grupami w organizacjach, z odpowiednią rejestracją zawodową (na przykład NIP lub BIG), które prowadzą warsztaty po niderlandzku lub angielsku.","T.partCta":"Zostań partnerem","T.partSubj":"Zgłoszenie partnerskie – Badanie dobrostanu","T.rvTabs":"Widoki raportu","T.whatL":"Co widzisz","T.howL":"Jak to czytać","T.keyL":"Najważniejszy wniosek","T.srcL":"Źródło","T.rv.sum.0":"Podsumowanie","T.rv.sum.1":"Najważniejsze wyniki prostym językiem.","T.rv.sum.2":"Wyniki mieszczą się w zakresie od 0 do 100: 0 to najniższa możliwa odpowiedź na każde pytanie, 100 – najwyższa. Poniżej 37,5 = wymaga uwagi, 37,5–62,5 = średni, powyżej 62,5 = wysoki. Każdy kwestionariusz ma własny typowy zakres wyników, dlatego porównuj wymiar między poziomami stanowisk lub w czasie, a nie z innymi wymiarami.","T.rv.heat.0":"Według poziomu stanowisk","T.rv.heat.1":"Średni wynik każdego poziomu stanowisk w każdym wymiarze.","T.rv.heat.2":"Czytaj wiersz, aby porównać poziomy; czytaj kolumnę, aby zobaczyć profil jednego poziomu. Ciepłe kolory oznaczają obszary wymagające uwagi, zielony – wysoki wynik. Grupy poniżej 5 osób są ukryte.","T.rv.gap.0":"Różnice między poziomami","T.rv.gap.1":"Dla każdego wymiaru: gdzie wypada każdy poziom stanowisk, od najniższego do najwyższego.","T.rv.gap.2":"Długa linia oznacza, że poziomy stanowisk mają bardzo różne wyniki. Może to odzwierciedlać wymagania danej roli, ale też to, kto trafia na jakie stanowisko; przedyskutuj to podczas omówienia, zanim wyciągniesz wnioski.","T.rv.dist.0":"Rozkład","T.rv.dist.1":"Ile osób mieści się w każdym przedziale, dla każdego wymiaru.","T.rv.dist.2":"Średnia może ukryć grupę, której jest ciężko. Czerwona część to odsetek osób, które wymagają uwagi.","T.rv.prof.0":"Profil poziomu","T.rv.prof.1":"Jeden poziom stanowisk w porównaniu z pozostałymi poziomami.","T.rv.prof.2":"Pasek to wynik danego poziomu, cienka linia – średnia pozostałych poziomów. Różnice mniejsze niż około 5 punktów zwykle nie mają znaczenia, a na poziomach liczących mniej niż 20 osób nawet większe różnice mogą wynikać z przypadku.","T.rv.sub.0":"Wyniki cząstkowe","T.rv.sub.1":"Elementy, z których składa się każdy wymiar.","T.rv.sub.2":"Gdy wymiar jest niski, widać tu, która jego część ma najniższy wynik. Części współczucia wobec siebie opierają się na 2 pytaniach każda, a autorzy zalecają korzystanie wyłącznie z wyniku ogólnego, więc traktuj je jako punkt wyjścia do rozmowy podczas omówienia, a nie jako pomiary.","T.rv.time.0":"W czasie","T.rv.time.1":"Pierwszy pomiar obok ponownego pomiaru.","T.rv.time.2":"Jasny pasek = pierwszy pomiar, ciemny = ponowny pomiar. To, czy zmiana jest czymś więcej niż przypadkiem, zależy od wielkości grupy; za każdym razem mogą brać udział inne osoby, a rolę odgrywają też inne wydarzenia, więc zmiana pokazuje, co się zmieniło, ale nie dlaczego.","T.rv.plan.0":"Plan działania","T.rv.plan.1":"Nad czym pracować najpierw, dla kogo i z jakim warsztatem.","T.rv.plan.2":"Wymiar jest proponowany jako priorytet, gdy ponad 25% osób ma wynik w przedziale „wymaga uwagi” albo gdy poziom stanowisk liczący co najmniej 10 osób ma wynik co najmniej 5 punktów niższy niż pozostałe poziomy. Pokazujemy trzy najważniejsze; pozostałe są wymienione jako „warto też obserwować”. To punkt wyjścia do omówienia, a nie werdykt.","T.kpiSub.0":"liczba osób, które odpowiedziały","T.kpiSub.1":"liczba poziomów stanowisk z co najmniej 5 osobami","T.kpiSub.2":"od tego zacznij omówienie","T.kpiSub.3":"średnia z ośmiu wymiarów","T.sumN":"Na podstawie odpowiedzi {n} osób z {k} poziomów stanowisk.","T.sumStrong":"Najwyższe wyniki: {a}.","T.sumWeak":"Najniższy wynik: {d} ({m}); {p} osób jest w przedziale „wymaga uwagi”.","T.sumGap":"Największa różnica między poziomami: {d} – {hi}: {a}, {lo}: {b}.","T.sumNext":"Proponowany pierwszy krok: warsztat „{w}” – dla: {who}.","T.and":"i","T.heatKey":"Najniższy wynik: {lv} – {d} ({v}). Najwyższy: {lv2} – {d2} ({v2}).","T.gapKey":"Największa różnica: {d} – {lo}: {a} wobec {hi}: {b} ({x} pkt).","T.distKey":"{d}: {p} osób ma wynik w przedziale „wymaga uwagi”, choć średnia ({m}) mieści się w przedziale „średni”.","T.profSel":"Poziom stanowisk","T.profUp":"{lv} – w porównaniu z pozostałymi poziomami wyższe wyniki: {a}.","T.profDown":"{lv} – w porównaniu z pozostałymi poziomami niższe wyniki: {b}.","T.profFlat":"{lv}: we wszystkich wymiarach wyniki zbliżone do pozostałych poziomów.","T.orgAvg":"średnia pozostałych poziomów","T.subKey":"Najniższa składowa: {s} w wymiarze {d} ({v}).","T.timeDemo":"Przykład symulowany: ponowny pomiar cztery miesiące po warsztatach o współczuciu wobec siebie i flow.","T.timeKey":"Największa zmiana: {d} ({x} pkt). Przy takich wielkościach grup zmiany mniejsze niż około 5 punktów mogą wynikać z przypadku.","T.timeNone":"Ten widok będzie dostępny po ponownym pomiarze (3–6 miesięcy po warsztatach).","T.t1":"Pierwszy pomiar","T.t2":"Ponowny pomiar","T.rHow":"Kolory pokazują przedział: czerwony – wymaga uwagi, żółty – średni, zielony – wysoki. Każdy kwestionariusz ma własny typowy zakres wyników, dlatego porównuj wymiar z nim samym w czasie, a nie z innymi wymiarami.","T.ariaHome":"Strona główna","T.ariaNav":"Sekcje","T.ariaLang":"Język","T.tUnval":"Te pytania to nasze własne polskie tłumaczenie oryginalnych kwestionariuszy i nie zostały jeszcze osobno zwalidowane. Są punktowane tak samo; ich rzetelność sprawdzamy w pilotażu.","DIMS.compassion.n":"Współczucie wobec siebie","DIMS.compassion.q":"Gdy ponoszę porażkę lub mam trudności, czy traktuję siebie życzliwie, czy surowo?","DIMS.compassion.what":"Jak ludzie traktują siebie w chwilach porażki i bólu: życzliwie i z równowagą czy krytycznie i z przytłoczeniem.","DIMS.compassion.not":"Współczucie wobec siebie to nie to samo co lenistwo, egoizm czy obniżanie własnych wymagań.","DIMS.compassion.b.0":"Samokrytyka jest silna. Błędy prawdopodobnie spotykają się z obwinianiem, izolacją i rozpamiętywaniem.","DIMS.compassion.b.1":"W trudnych chwilach ani wyraźna surowość wobec siebie, ani stała życzliwość.","DIMS.compassion.b.2":"Życzliwość i równowaga wobec siebie w trudnych chwilach; uczy się na błędach bez atakowania siebie.","DIMS.compassion.tips.0":"Po błędzie zapytaj: „Co usłyszałby ode mnie przyjaciel w tej sytuacji?” – i powiedz to sobie.","DIMS.compassion.tips.1":"Pamiętaj, że błędy są częścią doświadczenia każdego człowieka; nazwij uczucie, nie tonąc w nim.","DIMS.flex.n":"Elastyczność psychologiczna","DIMS.flex.q":"Czy trudne myśli i uczucia odciągają mnie od tego, co ważne?","DIMS.flex.what":"Na ile nieprzyjemne myśli i emocje przeszkadzają w życiu i pracy zgodnie z własnymi wartościami.","DIMS.flex.not":"Niski wynik to nie diagnoza; oznacza, że trudne myśli i uczucia obecnie często przeszkadzają w tym, co ważne.","DIMS.flex.b.0":"Bolesne myśli i uczucia zajmują dużo miejsca i prawdopodobnie blokują ważne działania.","DIMS.flex.b.1":"Trudne myśli i uczucia czasem przeszkadzają, ale zwykle udaje się iść w stronę tego, co ważne.","DIMS.flex.b.2":"Potrafi iść w stronę tego, co ważne, nawet gdy uczucia są trudne.","DIMS.flex.tips.0":"Zamiast walczyć z myślą, powiedz „Mam myśl, że…” i zrób kolejny mały krok.","DIMS.flex.tips.1":"Codziennie zrób jedno małe działanie zgodne z Twoimi wartościami, nawet jeśli nie masz poczucia pełnej gotowości.","DIMS.optim.n":"Optymizm","DIMS.optim.q":"Czy ogólnie spodziewam się, że wszystko dobrze się ułoży?","DIMS.optim.what":"Ogólne oczekiwanie człowieka wobec przyszłości: dobre czy złe rzeczy.","DIMS.optim.not":"Nie dotyczy przyszłości organizacji ani zadowolenia z pracy; to dość stała cecha osobista.","DIMS.optim.b.0":"Dominuje oczekiwanie, że sprawy potoczą się źle; energia do dalszych prób może być mniejsza.","DIMS.optim.b.1":"Umiarkowane oczekiwania wobec przyszłości; ani wyraźny optymizm, ani pesymizm.","DIMS.optim.b.2":"Zwykle spodziewa się dobrych rezultatów; w badaniach idzie to w parze z wytrwałością i lepszym zdrowiem.","DIMS.optim.tips.0":"Przez kilka minut napisz o swoim „najlepszym możliwym ja” za rok; w badaniach to ćwiczenie zwiększało optymizm.","DIMS.optim.tips.1":"Obok każdego zmartwienia zapisz plan „jeśli to się stanie, to…”.","DIMS.hope.n":"Nadzieja","DIMS.hope.q":"Czy mam cele, drogi do nich i energię, by ruszyć?","DIMS.hope.what":"Nadzieja w sensie naukowym: mieć cele, znajdować drogi do nich (ang. pathways) oraz mieć energię i wiarę, by je realizować (sprawczość, ang. agency).","DIMS.hope.not":"To nie to samo co optymizm; nadzieja dotyczy własnej zdolności do osiągnięcia celu.","DIMS.hope.b.0":"Mało dróg lub energii do osiągania celów; łatwiej o poczucie utknięcia.","DIMS.hope.b.1":"Cele i drogi są, ale energia spada, gdy pojawiają się przeszkody.","DIMS.hope.b.2":"Jasne cele, kilka dróg i wystarczająco energii; w badaniach wiąże się to z nieco lepszymi wynikami.","DIMS.hope.tips.0":"Dla jednego ważnego celu zapisz co najmniej trzy różne drogi.","DIMS.hope.tips.1":"Użyj WOOP: życzenie (Wish), rezultat (Outcome), wewnętrzna przeszkoda (Obstacle) i plan „jeśli… to…” (Plan).","DIMS.belong.n":"Przynależność","DIMS.belong.q":"Czy czuję się częścią grupy i mam poczucie akceptacji?","DIMS.belong.what":"Ogólne poczucie przynależności i akceptacji w relacjach, w życiu i wśród innych.","DIMS.belong.not":"Nie dotyczy tylko miejsca pracy; mierzy przynależność w całym życiu.","DIMS.belong.b.0":"Silne poczucie bycia na uboczu lub odrzucenia; w badaniach wiąże się to z niższym dobrostanem.","DIMS.belong.b.1":"Umiarkowane poczucie przynależności i akceptacji; ani silna więź, ani wyraźne poczucie bycia na uboczu.","DIMS.belong.b.2":"Poczucie akceptacji i więzi; ważny filar zdrowia psychicznego.","DIMS.belong.tips.0":"W tym tygodniu odbądź krótką rozmowę ze współpracownikiem, która nie dotyczy pracy.","DIMS.belong.tips.1":"Poproś kogoś o włączenie Cię do zadania lub planu; prośba o pomoc też buduje więź.","DIMS.flow.n":"Flow w pracy","DIMS.flow.q":"Czy pochłania mnie praca, czy sprawia mi radość i czy wykonuję ją dla niej samej?","DIMS.flow.what":"Flow w pracy w ostatnich dwóch tygodniach: pochłonięcie pracą, radość i motywacja wewnętrzna.","DIMS.flow.not":"Nie mierzy wysiłku ani liczby godzin, lecz jakość doświadczenia pracy.","DIMS.flow.b.0":"Praca mniej pochłania lub cieszy; być może jest często przerywana lub brakuje jej sensu.","DIMS.flow.b.1":"Pochłonięcie, radość i motywacja w pracy są na umiarkowanym poziomie.","DIMS.flow.b.2":"Pochłonięcie, radość i motywacja wewnętrzna; wiąże się z lepszymi wynikami w pracy i poczuciem sensu.","DIMS.flow.tips.0":"Codziennie zarezerwuj 60–90 minut na skupioną pracę bez wiadomości i spotkań.","DIMS.flow.tips.1":"Przekształć jedną część swojej pracy, by lepiej pasowała do Twoich mocnych stron i zainteresowań (job crafting).","DIMS.ei.n":"Inteligencja emocjonalna","DIMS.ei.q":"Czy rozumiem swoje i cudze emocje i umiem nimi kierować?","DIMS.ei.what":"Jak ludzie oceniają swoje umiejętności rozumienia emocji i kierowania nimi u siebie i innych.","DIMS.ei.not":"Samoocena, a nie test zdolności; może różnić się od rzeczywistych umiejętności.","DIMS.ei.b.0":"Ocenia swoje umiejętności rozpoznawania emocji i kierowania nimi jako słabsze.","DIMS.ei.b.1":"Ocenia swoje umiejętności emocjonalne jako umiarkowane.","DIMS.ei.b.2":"Ocenia się jako osobę, która potrafi rozumieć emocje i kierować nimi u siebie i innych.","DIMS.ei.tips.0":"Trzy razy dziennie nazwij swoje uczucie precyzyjnie („irytacja” zamiast „złe samopoczucie”).","DIMS.ei.tips.1":"Gdy współpracownik jest poruszony, najpierw nazwij to, co widzisz („wyglądasz na zmęczonego”), a potem zaproponuj rozwiązania.","DIMS.selfctrl.n":"Samokontrola","DIMS.selfctrl.q":"Czy opieram się pokusom i trzymam się celów długoterminowych?","DIMS.selfctrl.what":"Jak ludzie oceniają własną zdolność do kontrolowania impulsów, opierania się pokusom i trwania przy celach długoterminowych.","DIMS.selfctrl.not":"Niski wynik nie oznacza słabej woli; otoczenie i nawyki odgrywają dużą rolę.","DIMS.selfctrl.b.0":"Pokusy i rozproszenia często wygrywają; zmiana otoczenia i nawyków pomaga zwykle bardziej niż samo zwiększanie wysiłku.","DIMS.selfctrl.b.1":"Samokontrola oceniana jako umiarkowana; cele długoterminowe wygrywają tylko czasami.","DIMS.selfctrl.b.2":"Zwykle trzyma się celów długoterminowych; w badaniach często idzie to w parze z dobrymi nawykami.","DIMS.selfctrl.tips.0":"Zaprojektuj otoczenie: podczas skupionej pracy odłóż telefon do innego pokoju.","DIMS.selfctrl.tips.1":"Połącz trudne zadanie z małą przyjemnością (np. ulubiony podcast tylko podczas spaceru).","WS.w-comp.t":"Współczucie wobec siebie i wewnętrzny krytyk","WS.w-comp.who":"Wszystkie poziomy; wersja dla menedżerów: przywództwo oparte na współczuciu","WS.w-comp.goals.0":"Rozpoznanie wewnętrznego krytyka i jego kosztów","WS.w-comp.goals.1":"Ćwiczenie trzech elementów współczucia wobec siebie: życzliwości wobec siebie, wspólnego człowieczeństwa i uważności","WS.w-comp.goals.2":"Radzenie sobie z błędami w zespole bez upokarzania","WS.w-comp.ev":"Metaanaliza 27 badań randomizowanych wykazała umiarkowany wpływ programów rozwijania współczucia wobec siebie, zwykle kilkutygodniowych, na samokrytykę i stres. Efekty warsztatu złożonego z dwóch sesji są prawdopodobnie mniejsze.","WSLEN.w-comp":"2 × 3 godziny","WS.w-flex.t":"Elastyczność psychologiczna i regulacja emocji","WS.w-flex.who":"Wszystkie poziomy, zwłaszcza stanowiska pod dużą presją","WS.w-flex.goals.0":"Dystansowanie się od myśli bez walki z nimi","WS.w-flex.goals.1":"Doprecyzowanie wartości w pracy","WS.w-flex.goals.2":"Procesowy model regulacji emocji i cztery strategie proaktywne","WS.w-flex.ev":"Metaanaliza 17 badań treningu akceptacji i zaangażowania w miejscu pracy wykazała mały lub umiarkowany spadek dystresu i wzrost elastyczności psychologicznej; efekty były najwyraźniejsze u pracowników biurowych, a małe u personelu ochrony zdrowia.","WSLEN.w-flex":"2 × 3 godziny","WS.w-hope.t":"Nadzieja i realistyczny optymizm","WS.w-hope.who":"Wszystkie poziomy; dobre w okresach zmian w organizacji","WS.w-hope.goals.0":"Ćwiczenie „najlepsze możliwe ja”","WS.w-hope.goals.1":"WOOP i plany „jeśli… to…”","WS.w-hope.goals.2":"Zasada postępu: dostrzeganie małych sukcesów","WS.w-hope.ev":"WOOP (kontrastowanie mentalne z planami „jeśli… to…”) ma mały lub średni wpływ na osiąganie celów; ćwiczenie „najlepsze możliwe ja” nieznacznie zwiększa optymizm.","WSLEN.w-hope":"1 × 4 godziny","WS.w-belong.t":"Przynależność i więzi w pracy","WS.w-belong.who":"Zespoły razem ze swoimi przełożonymi","WS.w-belong.goals.0":"Łatwy, codzienny kontakt: krótkie rozmowy „co słychać?” i szczere docenianie się nawzajem przez współpracowników","WS.w-belong.goals.1":"Programy wdrożeniowe i programy opiekuna (buddy) dla nowych osób","WS.w-belong.goals.2":"Poczucie znaczenia (mattering): bycie dostrzeganym i wnoszenie wartości","WS.w-belong.ev":"Krótkie interwencje wzmacniające poczucie przynależności poprawiły wyniki studentów, ale duża replikacja z 2023 r. wykazała efekty tylko tam, gdzie otoczenie dawało realne możliwości przynależności. Nie ma jeszcze porównywalnych badań w miejscach pracy, dlatego warsztat łączy tę ideę z praktykami onboardingu i systemem opiekunów (buddy).","WSLEN.w-belong":"1 × 3 godziny + program zespołowy","WS.w-flow.t":"Głęboka praca, flow i odłączanie się od pracy","WS.w-flow.who":"Wszystkie poziomy; wersja dla menedżerów: ochrona czasu skupienia zespołu","WS.w-flow.goals.0":"Job crafting: samodzielne przekształcanie swojej pracy","WS.w-flow.goals.1":"Bloki skupienia bez przerw","WS.w-flow.goals.2":"Psychiczne odłączenie się od pracy po godzinach","WS.w-flow.ev":"Metaanalizy wiążą job crafting z większym zaangażowaniem w pracę, a odłączanie się po pracy z mniejszym wyczerpaniem; dowody te są w większości korelacyjne.","WSLEN.w-flow":"1 × 4 godziny","WS.w-ei.t":"Inteligencja emocjonalna w praktyce","WS.w-ei.who":"Stanowiska z kontaktem z klientem, menedżerowie i przełożeni","WS.w-ei.goals.0":"Precyzyjne nazywanie emocji","WS.w-ei.goals.1":"Reagowanie na emocje współpracowników i klientów","WS.w-ei.goals.2":"Praca emocjonalna: dostrzeganie jej kosztów","WS.w-ei.ev":"Średnio trening IE umiarkowanie podnosi wyniki IE; samooceniana IE pokrywa się z osobowością, więc wyniki warto czytać ostrożnie.","WSLEN.w-ei":"2 × 3 godziny","WS.w-self.t":"Samokontrola przez projektowanie: otoczenie, nawyki i łączenie pokus","WS.w-self.who":"Wszystkie poziomy; wersja dla menedżerów: nudging i zdrowe ustawienia domyślne","WS.w-self.goals.0":"Wybieranie i zmienianie sytuacji zamiast polegania na samej sile woli","WS.w-self.goals.1":"Budowanie nawyków i sygnałów przypominających","WS.w-self.goals.2":"Łączenie pokus (małej przyjemności z uciążliwym zadaniem) i rezerwy awaryjne (zaplanowane dni wyjątków)","WS.w-self.ev":"Przeglądy badań sugerują, że kształtowanie sytuacji działa lepiej niż poleganie na sile woli w danej chwili; łączenie pokus (temptation bundling) pomogło w jednym eksperymencie terenowym, ale efekt z czasem osłabł.","WSLEN.w-self":"1 × 4 godziny","LEVELS.staff":"Pracownicy","LEVELS.lead":"Liderzy zespołów","LEVELS.mid":"Kadra średniego szczebla","LEVELS.senior":"Najwyższe kierownictwo","LEVELS.student":"Studenci","SUBN.scs.sk":"Życzliwość wobec siebie","SUBN.scs.sj":"Bez nadmiernej samokrytyki","SUBN.scs.ch":"Wspólne człowieczeństwo","SUBN.scs.is":"Bez poczucia osamotnienia w trudnościach","SUBN.scs.mi":"Uważność","SUBN.scs.oi":"Bez dawania się porwać uczuciom","SUBN.ahs.path":"Drogi (sposoby osiągania celów)","SUBN.ahs.agency":"Sprawczość (energia skierowana na cel)","SUBN.gbs.acc":"Akceptacja / włączenie","SUBN.gbs.rej":"Mniej odrzucenia","SUBN.wolf.abs":"Pochłonięcie","SUBN.wolf.enj":"Radość z pracy","SUBN.wolf.int":"Motywacja wewnętrzna","SUBN.sreis.p":"Postrzeganie emocji","SUBN.sreis.u":"Wykorzystywanie emocji","SUBN.sreis.r":"Rozumienie emocji","SUBN.sreis.m1":"Kierowanie własnymi emocjami","SUBN.sreis.m2":"Kierowanie emocjami innych","PACKS.quick":"Krótka","PACKS.standard":"Pełna","INST.scs.name":"Skala współczucia wobec siebie – wersja skrócona","INST.scs.intro":"Jak zwykle traktujesz siebie w trudnych chwilach?","INST.scs.anchors.0":"Prawie nigdy","INST.scs.anchors.4":"Prawie zawsze","INST.scs.items.0":"Kiedy ponoszę porażkę w czymś ważnym dla mnie, pochłania mnie poczucie, że nie jestem wystarczająco dobry(-a).","INST.scs.items.1":"Staram się być wyrozumiały(-a) i cierpliwy(-a) wobec tych cech swojej osobowości, których nie lubię.","INST.scs.items.2":"Kiedy dzieje się coś bolesnego, staram się spojrzeć na sytuację w wyważony sposób.","INST.scs.items.3":"Kiedy czuję przygnębienie, zwykle mam wrażenie, że większość ludzi jest prawdopodobnie szczęśliwsza ode mnie.","INST.scs.items.4":"Staram się postrzegać swoje słabości jako część ludzkiej natury.","INST.scs.items.5":"Kiedy przechodzę przez bardzo trudny okres, okazuję sobie troskę i czułość, których potrzebuję.","INST.scs.items.6":"Kiedy coś mnie zdenerwuje, staram się zachować równowagę emocjonalną.","INST.scs.items.7":"Kiedy ponoszę porażkę w czymś ważnym dla mnie, zwykle czuję się w tej porażce osamotniony(-a).","INST.scs.items.8":"Kiedy czuję przygnębienie, mam skłonność do obsesyjnego skupiania się na wszystkim, co jest nie tak.","INST.scs.items.9":"Kiedy w jakiś sposób czuję, że nie jestem wystarczająco dobry(-a), staram się przypominać sobie, że większość ludzi miewa takie poczucie.","INST.scs.items.10":"Krytycznie i z dezaprobatą oceniam swoje wady i niedoskonałości.","INST.scs.items.11":"Jestem nietolerancyjny(-a) i niecierpliwy(-a) wobec tych cech swojej osobowości, których nie lubię.","INST.aaq.name":"Kwestionariusz akceptacji i działania II (AAQ-II)","INST.aaq.intro":"Na ile każde stwierdzenie jest prawdziwe w Twoim przypadku?","INST.aaq.anchors.0":"Nigdy prawdziwe","INST.aaq.anchors.6":"Zawsze prawdziwe","INST.aaq.items.0":"Moje bolesne doświadczenia i wspomnienia utrudniają mi prowadzenie życia, które byłoby dla mnie wartościowe.","INST.aaq.items.1":"Boję się swoich uczuć.","INST.aaq.items.2":"Martwię się, że nie potrafię kontrolować swoich zmartwień i uczuć.","INST.aaq.items.3":"Moje bolesne wspomnienia nie pozwalają mi na satysfakcjonujące życie.","INST.aaq.items.4":"Emocje powodują problemy w moim życiu.","INST.aaq.items.5":"Wydaje mi się, że większość ludzi radzi sobie w życiu lepiej niż ja.","INST.aaq.items.6":"Zmartwienia przeszkadzają mi w odnoszeniu sukcesów.","INST.lot.name":"Test orientacji życiowej – wersja zrewidowana (LOT-R)","INST.lot.intro":"Na ile zgadzasz się z każdym stwierdzeniem?","INST.lot.anchors.0":"Zdecydowanie się nie zgadzam","INST.lot.anchors.1":"Nie zgadzam się","INST.lot.anchors.2":"Ani się zgadzam, ani się nie zgadzam","INST.lot.anchors.3":"Zgadzam się","INST.lot.anchors.4":"Zdecydowanie się zgadzam","INST.lot.items.0":"W niepewnych czasach zwykle spodziewam się najlepszego.","INST.lot.items.1":"Łatwo mi się zrelaksować.","INST.lot.items.2":"Jeśli coś może mi się nie udać, to na pewno się nie uda.","INST.lot.items.3":"Zawsze optymistycznie patrzę na swoją przyszłość.","INST.lot.items.4":"Bardzo lubię spędzać czas z przyjaciółmi.","INST.lot.items.5":"Ważne jest dla mnie, żeby mieć zajęcie.","INST.lot.items.6":"Prawie nigdy nie spodziewam się, że sprawy potoczą się po mojej myśli.","INST.lot.items.7":"Nie denerwuję się zbyt łatwo.","INST.lot.items.8":"Rzadko liczę na to, że spotka mnie coś dobrego.","INST.lot.items.9":"Ogólnie spodziewam się, że spotka mnie więcej dobrego niż złego.","INST.ahs.name":"Skala nadziei dla dorosłych (AHS)","INST.ahs.intro":"Na ile każde stwierdzenie jest prawdziwe w Twoim przypadku?","INST.ahs.anchors.0":"Zdecydowanie nieprawdziwe","INST.ahs.anchors.7":"Zdecydowanie prawdziwe","INST.ahs.items.0":"Potrafię wymyślić wiele sposobów, by wyjść z kłopotów.","INST.ahs.items.1":"Energicznie dążę do swoich celów.","INST.ahs.items.2":"Przez większość czasu czuję się zmęczony(-a).","INST.ahs.items.3":"Na każdy problem jest wiele sposobów.","INST.ahs.items.4":"W sporze łatwo daję się pokonać.","INST.ahs.items.5":"Potrafię wymyślić wiele sposobów, by zdobyć w życiu to, co jest dla mnie ważne.","INST.ahs.items.6":"Martwię się o swoje zdrowie.","INST.ahs.items.7":"Nawet gdy inni się zniechęcają, wiem, że potrafię znaleźć sposób na rozwiązanie problemu.","INST.ahs.items.8":"Moje dotychczasowe doświadczenia dobrze przygotowały mnie na przyszłość.","INST.ahs.items.9":"W życiu całkiem nieźle mi się wiodło.","INST.ahs.items.10":"Zwykle łapię się na tym, że czymś się martwię.","INST.ahs.items.11":"Osiągam cele, które sobie wyznaczam.","INST.gbs.name":"Ogólna skala przynależności (GBS)","INST.gbs.intro":"Na ile zgadzasz się z każdym stwierdzeniem?","INST.gbs.anchors.0":"Zdecydowanie się nie zgadzam","INST.gbs.anchors.6":"Zdecydowanie się zgadzam","INST.gbs.items.0":"Kiedy jestem z innymi ludźmi, czuję, że jestem częścią grupy.","INST.gbs.items.1":"Mam bliskie więzi z rodziną i przyjaciółmi.","INST.gbs.items.2":"Czuję się jak ktoś z zewnątrz.","INST.gbs.items.3":"Czuję, że ludziom na mnie nie zależy.","INST.gbs.items.4":"Czuję się akceptowany(-a) przez innych.","INST.gbs.items.5":"Ponieważ nigdzie nie przynależę, w okresie świątecznym czuję dystans wobec innych.","INST.gbs.items.6":"Czuję się odizolowany(-a) od reszty świata.","INST.gbs.items.7":"Mam poczucie przynależności.","INST.gbs.items.8":"Kiedy jestem z innymi ludźmi, czuję się obco.","INST.gbs.items.9":"Mam swoje miejsce przy stole razem z innymi.","INST.gbs.items.10":"Czuję więź z innymi.","INST.gbs.items.11":"Przyjaciele i rodzina nie włączają mnie w swoje plany.","INST.wolf.name":"Kwestionariusz flow w pracy (WOLF)","INST.wolf.intro":"Jak często w ciągu ostatnich dwóch tygodni zdarzało Ci się doświadczać każdej z tych sytuacji?","INST.wolf.anchors.0":"Nigdy","INST.wolf.anchors.1":"Prawie nigdy","INST.wolf.anchors.2":"Czasami","INST.wolf.anchors.3":"Regularnie","INST.wolf.anchors.4":"Często","INST.wolf.anchors.5":"Bardzo często","INST.wolf.anchors.6":"Zawsze","INST.wolf.items.0":"Kiedy pracuję, nie myślę o niczym innym.","INST.wolf.items.1":"Daję się porwać swojej pracy.","INST.wolf.items.2":"Kiedy pracuję, zapominam o wszystkim wokół.","INST.wolf.items.3":"Jestem całkowicie pochłonięty(-a) swoją pracą.","INST.wolf.items.4":"Moja praca sprawia, że dobrze się czuję.","INST.wolf.items.5":"Wykonuję swoją pracę z dużą przyjemnością.","INST.wolf.items.6":"Czuję się szczęśliwy(-a) podczas pracy.","INST.wolf.items.7":"Kiedy pracuję, mam pogodny nastrój.","INST.wolf.items.8":"Wykonywał(a)bym tę pracę nawet za mniejsze wynagrodzenie.","INST.wolf.items.9":"Zauważam, że chcę pracować także w wolnym czasie.","INST.wolf.items.10":"Pracuję, bo sprawia mi to przyjemność.","INST.wolf.items.11":"Kiedy nad czymś pracuję, robię to dla siebie.","INST.wolf.items.12":"Moja motywacja płynie z samej pracy, a nie z nagrody za nią.","INST.sreis.name":"Skala samooceny inteligencji emocjonalnej (SREIS)","INST.sreis.intro":"Na ile trafnie każde stwierdzenie Cię opisuje?","INST.sreis.anchors.0":"Bardzo nietrafnie","INST.sreis.anchors.1":"Raczej nietrafnie","INST.sreis.anchors.2":"Ani tak, ani nie","INST.sreis.anchors.3":"Raczej trafnie","INST.sreis.anchors.4":"Bardzo trafnie","INST.sreis.items.0":"Patrząc na wyraz twarzy ludzi, rozpoznaję emocje, których doświadczają.","INST.sreis.items.1":"Jestem osobą racjonalną i przy podejmowaniu decyzji rzadko lub wcale nie kieruję się uczuciami.","INST.sreis.items.2":"Mam bogate słownictwo do opisywania swoich emocji.","INST.sreis.items.3":"Mam problemy z radzeniem sobie ze złością.","INST.sreis.items.4":"Kiedy ktoś, kogo znam, ma zły humor, potrafię pomóc tej osobie szybko się uspokoić i poczuć się lepiej.","INST.sreis.items.5":"Dostrzegam komunikaty niewerbalne, które wysyłają inni.","INST.sreis.items.6":"Podejmując decyzje, słucham swoich uczuć, by sprawdzić, czy decyzja wydaje się właściwa.","INST.sreis.items.7":"Łatwo przychodzi mi do głowy wiele synonimów słów oznaczających emocje, takich jak szczęście i smutek.","INST.sreis.items.8":"Potrafię radzić sobie w stresujących sytuacjach, nie denerwując się zbytnio.","INST.sreis.items.9":"Znam sposoby na poprawienie nastroju innych ludzi.","INST.sreis.items.10":"Patrząc na wyraz twarzy ludzi, potrafię ocenić, czy są wobec mnie szczerzy.","INST.sreis.items.11":"Jestem osobą racjonalną i nie lubię opierać decyzji na uczuciach.","INST.sreis.items.12":"Potrafię opisać słowami całą gamę emocji – od prostych po złożone.","INST.sreis.items.13":"Potrafię poradzić sobie z większością przykrych problemów.","INST.sreis.items.14":"Nie za bardzo potrafię pomóc innym poczuć się lepiej, gdy są źli lub smutni.","INST.sreis.items.15":"Moje pierwsze wrażenie co do tego, co czują inni, często okazuje się błędne.","INST.sreis.items.16":"W porównaniu z większością ludzi mam bogatsze słownictwo do opisywania uczuć.","INST.sreis.items.17":"Wiem, jak zachować spokój w trudnych lub stresujących sytuacjach.","INST.sreis.items.18":"Jestem osobą, do której inni zwracają się, gdy potrzebują pomocy w trudnej sytuacji.","INST.bscs.name":"Krótka skala samokontroli (BSCS)","INST.bscs.intro":"W jakim stopniu każde stwierdzenie pasuje do tego, jaki(-a) zwykle jesteś?","INST.bscs.anchors.0":"Wcale","INST.bscs.anchors.4":"Bardzo","INST.bscs.items.0":"Dobrze opieram się pokusom.","INST.bscs.items.1":"Trudno mi zerwać ze złymi nawykami.","INST.bscs.items.2":"Jestem leniwy(-a).","INST.bscs.items.3":"Mówię niestosowne rzeczy.","INST.bscs.items.4":"Robię pewne rzeczy, które mi szkodzą, jeśli są przyjemne.","INST.bscs.items.5":"Odmawiam sobie rzeczy, które mi szkodzą.","INST.bscs.items.6":"Chciał(a)bym mieć więcej samodyscypliny.","INST.bscs.items.7":"Ludzie powiedzieliby, że mam żelazną samodyscyplinę.","INST.bscs.items.8":"Przyjemności i rozrywka czasem przeszkadzają mi w wykonaniu pracy.","INST.bscs.items.9":"Mam trudności z koncentracją.","INST.bscs.items.10":"Potrafię skutecznie pracować na rzecz celów długoterminowych.","INST.bscs.items.11":"Czasami nie potrafię się powstrzymać przed zrobieniem czegoś, nawet jeśli wiem, że to złe.","INST.bscs.items.12":"Często działam bez przemyślenia wszystkich możliwości.","LABELS.s2":"Współczucie wobec siebie","LABELS.s3":"Od obwiniania siebie do współczucia wobec siebie","LABELS.compassion":"Półka z książkami: współczucie i samokrytyka","LABELS.s4":"Zagadka regulacji emocji","LABELS.s7":"Zmiana siebie zamiast otoczenia","LABELS.shelf13":"Półka z książkami: terapia oparta na procesach i zwinność emocjonalna","LABELS.s9":"Optymizm i nadzieja na przyszłość","LABELS.riseabove":"Rise Above (Kaufman, 2024): od mentalności ofiary do rozwoju","LABELS.s10":"Subkultury organizacyjne i motywacja","LABELS.s8":"Ponowna ocena poznawcza, wyczerpanie ego i nastawienia","LABELS.mattering":"Jak ludzie zaczynają mieć znaczenie","LABELS.s11":"Wygadanie się: kiedy rozmowa pomaga?","LABELS.s13":"Motywacja: zewnętrzna, introjektowana i wewnętrzna","LABELS.s15":"Pozytywne emocje, czas wolny i dzielenie się dobrymi wiadomościami","LABELS.s14":"Inteligencja emocjonalna: zdolność, cecha czy połączenie?","LABELS.s5":"Samokontrola i wybór sytuacji","LABELS.s6":"Wybieranie i zmienianie swojego otoczenia","LABELS.s12":"Perfekcjonizm: doskonałe wyniki, ale pod presją","REFS.nea25":"21% pracowników zgłasza objawy wypalenia zawodowego","REFS.who22":"co roku 12 miliardów dni roboczych traconych z powodu depresji i lęku","REFS.icd11":"wypalenie zakwalifikowane jako zjawisko związane z pracą","REFS.cbs26":"wskaźnik absencji 5,4% w 2025 r.; 9% nieobecnych wskazuje dolegliwości psychiczne lub wypalenie","REFS.tno24":"absencja z powodu dolegliwości psychicznych trwa średnio 63 dni robocze; w 75% przypadków jest (częściowo) związana z pracą","REFS.arbo24":"8,3 mld € na absencję (częściowo) związaną z pracą w 2023 r., z czego 4,9 mld € z powodu obciążenia psychospołecznego","REFS.arbo18":"około jednej czwartej dni absencji wiąże się z dolegliwościami psychicznymi, przeciążeniem lub wypaleniem","REFS.mkb":"średnio od 250 € do 400 € za dzień absencji","REFS.arbowet":"art. 3 ust. 2: polityka zapobiegania obciążeniu psychospołecznemu lub jego ograniczania; art. 5: ocena ryzyka (RI&E) z planem działania","REFS.arbobes":"art. 2.15: ocena ryzyk psychospołecznych w RI&E i określenie działań w planie działania","REFS.arboportaal":"oficjalne informacje rządowe o obciążeniu psychospołecznym","REFS.wor":"art. 27: prawo rady pracowników do zgody, m.in. w sprawie badań pracowników i polityki warunków pracy","REFS.gdpr":"Ogólne rozporządzenie o ochronie danych (RODO)","T.rStrRel":"Tu masz dziś najwyższe wyniki","T.rCodeShow":"Pokaż kod","T.rDetailNote":"Części oparte tylko na 2–4 pytaniach mają charakter orientacyjny.","T.meName":"Maryam Jaberi","T.allLv":"wszystkich poziomów stanowisk (żaden poziom nie ma wyraźnie niższych wyników)","T.planNote":"Zanim wybierzesz warsztaty, sprawdź w RI&E lub badaniu warunków pracy, czy te wzorce nie wynikają z obciążenia pracą, braku autonomii lub wsparcia. Jeśli tak, zajmij się najpierw tymi kwestiami.","T.print":"Drukuj / zapisz jako PDF","T.fHint":"Otwiera Twój program pocztowy z wypełnionym zapytaniem. Nie masz programu pocztowego? Napisz na adres {e}.","T.rStrNote":"Żaden z Twoich wyników nie jest jeszcze w przedziale „wysoki”; to po prostu Twoje najwyższe wyniki na dziś.","T.pWhyLow":"{p} osób ma wynik w przedziale „wymaga uwagi”.","T.pWhyGap":"{lv}: wynik o {x} pkt niższy niż na pozostałych poziomach.","T.pAlso":"Warto też obserwować","T.pScopeBelong":"Uwaga: ta skala mierzy przynależność w życiu jako całości, nie tylko w pracy; podczas omówienia przyjrzyj się przyczynom związanym z pracą.","T.pScopeOptim":"Uwaga: optymizm to dość stała cecha; spodziewaj się niewielkiej zmiany i najpierw przyjrzyj się warunkom pracy."},"tr":{"T.proto":"Pilot sürüm – kuruluşunuzda ilk pilot için şimdiden kullanılabilir.","T.brand":"Kurumsal İyi Oluş Taraması","T.brandShort":"İyi Oluş Taraması","T.by":"Dr. Azarakhsh Mokri'nin “Kuruluşlarda ve eğitim kurumlarında kişisel ve kişiler arası yetkinlikler” dersinden esinlenilmiştir","T.nHome":"Genel bakış","T.nTake":"Taramayı yap","T.nReport":"Kurum raporu","T.nWs":"Atölyeler","T.nMethod":"Yöntem","T.heroK":"Bilgi yoğun kuruluşlar için · 20 katılımcıdan başlayan pilot uygulamalar","T.heroT":"Ekiplerinizin kademeye göre hangi psikolojik kaynaklara sahip olduğunu ve nereden başlamanız gerektiğini görün.","T.heroP":"Çalışanlar, yayımlanmış sekiz bilimsel ölçeği 8 ila 18 dakikada anonim olarak yanıtlar ve kendi sonuçlarını hemen görür. Kuruluşunuz ise kademeye göre bir grup raporu, sade bir dille yazılmış bir yorum ve önerilen iki veya üç atölyeden oluşan bir plan alır.","T.ctaTake":"Taramaya başla","T.ctaDemo":"Örnek raporu gör","T.f1":"8 boyut","T.f1s":"Orijinal dillerinde geçerliği kanıtlanmış, yayımlanmış 8 ölçek","T.f2":"Anonim","T.f2s":"İsim yok; 5 kişiden az olan gruplar asla gösterilmez","T.f3":"9 dil","T.f3s":"Türkçe, İngilizce, Felemenkçe, Almanca, Fransızca, İspanyolca, Lehçe, Arapça ve Farsça","T.measT":"Neyi ölçüyoruz","T.measP":"Her boyut basit bir soruyu yanıtlar. Neyi ölçtüğünü ve neyi ölçmediğini görmek için bir karta dokunun.","T.whatIs":"Neyi ölçer","T.whatNot":"Göz önünde bulundurun","T.privT":"Önce gizlilik","T.priv.0":"Adınızı, e-posta adresinizi veya personel numaranızı sormuyoruz.","T.priv.1":"Yanıtlarınızla birlikte yalnızca kademeniz, ay bilgisi ve hangi sürümü doldurduğunuz kaydedilir.","T.priv.2":"5 kişiden az olan gruplar kurum raporunda gizlenir.","T.priv.3":"Yanıtlar hiçbir tanımlayıcı olmadan kaydedilir; hiçbir yönetici ya da İK kimsenin bireysel sonucunu göremez.","T.notT":"Bu tarama ne değildir","T.not":"Bu bir klinik tanı değildir ve psikolojik danışmanlığın ya da tedavinin yerini tutmaz. Öz şefkat, esneklik ve aidiyet gibi psikolojik kaynakları ölçer; tükenmişliği veya iş yükünü ölçmez. Amacı gruplardaki örüntüleri görmek ve doğru desteği seçmektir.","T.tT":"Taramayı yap","T.tRound":"Taramanız","T.tSelf":"Yanıtlarınız ve sonucunuz bu tarayıcıda kalır. Siz yanıt kodunuzu göndermeyi seçmedikçe hiçbir şey gönderilmez.","T.tJoin":"Kurumsal tarama turu","T.tLevel":"Kademeniz veya rolünüz nedir?","T.tLevelHint":"Yalnızca grupları karşılaştırmak için kullanılır. 5 kişiden az olan gruplar asla gösterilmez.","T.tPack":"Hangi sürüm?","T.tMin":"dk","T.tItems":"soru","T.tConsent":"Katılımın gönüllü olduğunu, ben bir işlem yapmadıkça hiçbir şeyin gönderilmeyeceğini ve bunun bir klinik tanı olmadığını anlıyorum.","T.tStart":"Başla","T.tNext":"Sonraki bölüm","T.tPrev":"Önceki bölüm","T.tFinish":"Sonuçlarımı gör","T.tPart":"Bölüm","T.tOf":"/","T.tMissing":"Henüz şu soruları yanıtlamadınız:","T.tSaved":"Yanıtlar bu cihazda kaydedilir; sayfayı kapatırsanız buradan devam edebilirsiniz.","T.tResume":"Yarım kalan taramaya devam et","T.tRestart":"Baştan başla","T.rT":"Sonuçlarınıza kısa bir bakış","T.rP":"Her ölçekte daha yüksek puan, o kaynağın sizde daha fazla olduğu anlamına gelir. Bu, bugünkü yanıtlarınızın anlık bir görüntüsüdür, bir tanı değildir.","T.rStr":"En yüksek puanlarınız","T.rGrow":"En düşük puanlarınız","T.rTips":"İki kısa ipucu","T.rDetail":"Ayrıntılar ve alt ölçekler","T.rSend":"Kuruluşuma anonim olarak gönder","T.rSent":"Yanıtlarınız anonim olarak kaydedildi. Teşekkürler!","T.rCode":"Yanıt kodu","T.rCodeP":"Bu kodu kopyalayıp e-postayla SoloNovate'e gönderin; yöneticinize veya İK'ya değil. Kod adınızı içermez; yalnızca yanıtlarınızı, kademenizi ve ay bilgisini içerir. Kod e-postayla geldiği için SoloNovate e-posta adresinizi kısa bir süre görür; bu adresi asla yanıtlarınızla birlikte saklamayız ve kodu aktardıktan sonra e-postayı sileriz.","T.rCopy":"Kodu kopyala","T.rCopied":"Kopyalandı","T.rCare":"Bir süredir kendinizi kötü hissediyorsanız veya baş edemediğinizi düşünüyorsanız işyeri hekiminizle, aile hekiminizle veya bir psikologla konuşun. Yardım istemek bir güç göstergesidir.","T.rNot":"Bu sonuç bugünkü yanıtlarınızın bir anlık görüntüsüdür; bir etiket ya da tanı değildir.","T.band.0":"Dikkat gerektiriyor","T.band.1":"Orta","T.band.2":"Güçlü","T.pT":"Kurum raporu","T.pP":"Kuruluşunuzun kademeye göre psikolojik kaynakları; öncelikler ve önerilen atölyelerle.","T.pSrc":"Rapor verisi","T.pDemo":"Örnek veri (tanıtım amaçlı)","T.pLive":"Bu turun gerçek yanıtları","T.pImport":"Yanıt kodlarını içe aktar","T.pImportP":"Yanıt kodlarını buraya yapıştırın (her satıra bir kod).","T.pImportGo":"Ekle","T.pAdded":"yanıt eklendi","T.pN":"Katılımcı","T.pLevels":"Kademeler","T.pAvg":"En düşük boyut","T.pLowShare":"“Dikkat gerektiriyor” oranı","T.pNoPri":"Hiçbir boyut öncelik eşiğine ulaşmıyor. Öneri: güçlü yönleri korumak için pekiştirme atölyeleri.","T.pWhy":"Neden","T.pFor":"Öncelikli hedef grup","T.pStrengths":"Kuruluşun güçlü yönleri","T.pGap":"Kademeler arasındaki en büyük fark","T.pHidden":"5'ten az","T.pNone":"Henüz yanıt yok.","T.pExport":"Özet veriyi kopyala (CSV)","T.pAdmin":"Turları yönet","T.pAdminP":"Kuruluşta taramayı koordine eden kişi için. Bir tur oluşturun ve bağlantıyı çalışanlarla paylaşın.","T.pOrg":"Kuruluş adı","T.pRoundName":"Tur adı","T.pCreate":"Tur oluştur","T.pRounds":"Turlar","T.pChoose":"Bir tur seçin","T.pNoAdmin":"Tur oluşturmak ve gerçek yanıtları görmek yalnızca taramayı koordine edenlere (bu sayfanın editörleri) açıktır. Diğer herkes örnek raporu görebilir veya yanıt kodlarını içe aktarabilir.","T.pDemoNote":"Bu rapor, gerçek bir raporun nasıl göründüğünü görebilmeniz için 18
