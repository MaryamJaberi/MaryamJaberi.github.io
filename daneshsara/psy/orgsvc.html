:"Su responsable y Recursos Humanos solo ven resultados de grupos de 5 personas o más.","T.emp.2":"Ve su propio resultado al instante, con dos consejos prácticos. Solo usted lo ve.","T.emp.3":"La participación es voluntaria. Puede interrumpir el cuestionario u omitir cualquier pregunta en cualquier momento.","T.emp.4":"Si envía un código de respuesta, envíelo a SoloNovate, nunca a su responsable ni a Recursos Humanos.","T.docsT":"Documentos de ejemplo","T.docsP":"Para que sepa exactamente qué firma antes de empezar. Cada documento está disponible en neerlandés e inglés y se puede imprimir o guardar como PDF. Son borradores que ultimamos juntos antes del piloto.","T.docs.pilot-agreement.0":"Acuerdo de piloto","T.docs.pilot-agreement.1":"Qué incluye el piloto, funciones, anonimato, precio y responsabilidad.","T.docs.data-processing.0":"Acuerdo de encargo de tratamiento de datos","T.docs.data-processing.1":"RGPD art. 28: qué datos, seguridad, conservación y brechas de datos.","T.docs.privacy-participants.0":"Aviso de privacidad para participantes","T.docs.privacy-participants.1":"En lenguaje sencillo para los empleados: quién ve qué y cuáles son sus derechos.","T.docs.staff-announcement.0":"Anuncio a la plantilla","T.docs.staff-announcement.1":"Mensaje modelo de la dirección, listo para adaptar.","T.aud.mgmt":"Para la dirección","T.aud.staff":"Para los empleados","T.aud.hr":"Para Recursos Humanos","T.open":"Abrir (neerlandés / inglés)","T.rMail":"Enviar el código a SoloNovate por correo","T.partT":"Para psicólogos y formadores","T.partP":"¿Imparte talleres o coaching para organizaciones? Estamos creando una pequeña red de socios.","T.partL.0":"Nosotros nos encargamos de la medición, el informe y el contacto con el cliente; usted hace lo que mejor sabe hacer.","T.partL.1":"Cada encargo empieza con datos: antes de la primera sesión sabe qué temas y niveles de puesto necesitan atención.","T.partL.2":"Tiene a su disposición esquemas de talleres con evidencia y fuentes, listos para usar y adaptar.","T.partL.3":"Usted fija sus tarifas y decide qué encargos acepta.","T.partAsk":"Buscamos experiencia con grupos en organizaciones, una colegiación o registro profesional pertinente (por ejemplo NIP o BIG) y capacidad para impartir talleres en neerlandés o inglés.","T.partCta":"Unirse a la red de socios","T.partSubj":"Solicitud de colaboración – Chequeo de bienestar","T.rvTabs":"Vistas del informe","T.whatL":"Qué ve","T.howL":"Cómo leerlo","T.keyL":"Idea clave","T.srcL":"Fuente","T.rv.sum.0":"Resumen","T.rv.sum.1":"Los resultados principales en lenguaje sencillo.","T.rv.sum.2":"Las puntuaciones van de 0 a 100: 0 es la respuesta más baja posible en todas las preguntas y 100 la más alta. Menos de 37,5 = requiere atención, 37,5–62,5 = moderado, más de 62,5 = sólido.","T.rv.heat.0":"Por nivel de puesto","T.rv.heat.1":"La puntuación media de cada nivel de puesto en cada dimensión.","T.rv.heat.2":"Lea una fila para comparar niveles; lea una columna para ver el perfil de un nivel. Los colores cálidos requieren atención; el verde es sólido. Los grupos de menos de 5 personas están ocultos.","T.rv.gap.0":"Diferencias entre niveles","T.rv.gap.1":"Para cada dimensión: dónde puntúa cada nivel de puesto, del más bajo al más alto.","T.rv.gap.2":"Una línea larga significa que los niveles lo viven de forma muy distinta. Eso suele apuntar al trabajo o a la función, no a las personas.","T.rv.dist.0":"Distribución","T.rv.dist.1":"Cuántas personas hay en cada franja de puntuación, por dimensión.","T.rv.dist.2":"Una media puede ocultar a un grupo que lo está pasando mal. La parte roja es el porcentaje de personas que requieren atención.","T.rv.prof.0":"Perfil de un nivel","T.rv.prof.1":"Un nivel de puesto comparado con toda la organización.","T.rv.prof.2":"La barra es la puntuación del nivel; la línea fina, la media de la organización. El número de la derecha es la diferencia: positivo significa mejor que la media.","T.rv.sub.0":"Aspectos subyacentes","T.rv.sub.1":"Las partes que forman cada dimensión.","T.rv.sub.2":"Cuando una dimensión es baja, aquí se ve qué parte la hace bajar y, por tanto, qué tipo de taller ayuda más. Aquí, más alto siempre es mejor.","T.rv.time.0":"Evolución","T.rv.time.1":"La primera medición junto a la nueva medición.","T.rv.time.2":"Barra clara = primera medición, barra oscura = nueva medición. Los cambios de menos de unos 3 puntos pueden deberse al azar.","T.rv.plan.0":"Plan de acción","T.rv.plan.1":"En qué trabajar primero, para quién y con qué taller.","T.rv.plan.2":"Una dimensión es prioritaria cuando su media está por debajo de 55 o cuando más del 25 % de las personas requiere atención.","T.kpiSub.0":"personas respondieron","T.kpiSub.1":"niveles de puesto con 5 personas o más","T.kpiSub.2":"media de todas las dimensiones (0–100)","T.kpiSub.3":"de todas las puntuaciones están en «requiere atención»","T.sumN":"Basado en {n} participantes en {k} niveles de puesto.","T.sumStrong":"Mejores resultados: {a}.","T.sumWeak":"Lo que más atención requiere: {d} ({m}); el {p} de las personas está en «requiere atención».","T.sumGap":"Mayor diferencia entre niveles: {d} ({hi}: {a}; {lo}: {b}).","T.sumNext":"Primer paso sugerido: el taller «{w}», sobre todo para {who}.","T.and":"y","T.heatKey":"Puntuación más baja: {lv} en {d} ({v}). La más alta: {lv2} en {d2} ({v2}).","T.gapKey":"Mayor diferencia: {d} — {lo} {a} frente a {hi} {b} ({x} puntos).","T.distKey":"{d}: el {p} de las personas requiere atención, aunque la media es {m}.","T.profSel":"Nivel de puesto","T.profUp":"{lv}: por encima de la media de la organización en {a}.","T.profDown":"{lv}: por debajo de la media de la organización en {b}.","T.profFlat":"{lv}: cerca de la media de la organización en todas las dimensiones.","T.orgAvg":"media de la organización","T.subKey":"Aspecto más bajo: {s} dentro de {d} ({v}).","T.timeDemo":"Ejemplo simulado: nueva medición cuatro meses después de talleres sobre autocompasión y flow.","T.timeKey":"Mayor mejora: {d} (+{x}). Menor cambio: {d2} ({y}).","T.timeNone":"Esta vista estará disponible tras la nueva medición (3–6 meses después de los talleres).","T.t1":"Primera medición","T.t2":"Nueva medición","T.rHow":"Cada puntuación va de 0 a 100. El color de fondo indica la franja: rojo requiere atención, amarillo es moderado y verde es sólido. Es una instantánea, no un diagnóstico.","T.ariaHome":"Inicio","T.ariaNav":"Secciones","T.ariaLang":"Idioma","T.tUnval":"Estas preguntas son nuestra propia traducción al español de los cuestionarios originales y aún no se han validado por separado. Se puntúan igual; su fiabilidad se comprueba en el piloto.","DIMS.compassion.n":"Autocompasión","DIMS.compassion.q":"Cuando fracaso o lo paso mal, ¿soy amable o duro conmigo mismo?","DIMS.compassion.what":"Cómo se trata uno a sí mismo ante el fracaso y el dolor: con amabilidad y equilibrio, o con autocrítica y desbordamiento.","DIMS.compassion.not":"No es pereza, egoísmo ni rebajar las propias exigencias.","DIMS.compassion.b.0":"La autocrítica es fuerte. Es probable que los errores se reciban con reproches, aislamiento y rumiación.","DIMS.compassion.b.1":"A veces amable, a veces duro; bajo presión se inclina hacia la autoculpa.","DIMS.compassion.b.2":"Amable y equilibrado consigo mismo en los momentos difíciles; aprende de los errores sin atacarse.","DIMS.compassion.tips.0":"Después de un error, pregúntese: «¿Qué le diría a un amigo en esta situación?» y dígaselo a usted mismo.","DIMS.compassion.tips.1":"Recuerde que los errores forman parte de la experiencia de todos; ponga nombre a la emoción sin ahogarse en ella.","DIMS.flex.n":"Flexibilidad psicológica","DIMS.flex.q":"¿Me apartan los pensamientos y sentimientos difíciles de lo que me importa?","DIMS.flex.what":"Cuánto se interponen los pensamientos y emociones desagradables en vivir y trabajar según los propios valores.","DIMS.flex.not":"Una puntuación baja no es un diagnóstico; refleja una lucha con las emociones.","DIMS.flex.b.0":"Los pensamientos y sentimientos dolorosos ocupan mucho espacio y probablemente bloquean acciones importantes.","DIMS.flex.b.1":"La lucha con los sentimientos a veces interfiere, pero el trabajo suele seguir adelante.","DIMS.flex.b.2":"Puede avanzar hacia lo que importa aunque los sentimientos sean difíciles.","DIMS.flex.tips.0":"En lugar de luchar contra un pensamiento, diga «Estoy teniendo el pensamiento de que…» y dé el siguiente pequeño paso.","DIMS.flex.tips.1":"Haga cada día una pequeña acción coherente con sus valores, aunque no se sienta del todo preparado.","DIMS.optim.n":"Optimismo","DIMS.optim.q":"¿Espero en general que las cosas salgan bien?","DIMS.optim.what":"La expectativa general de una persona sobre el futuro: cosas buenas o malas.","DIMS.optim.not":"No trata del futuro de la organización ni de la satisfacción laboral; es un rasgo personal bastante estable.","DIMS.optim.b.0":"Predomina la expectativa de malos resultados; la energía para seguir intentándolo puede ser menor.","DIMS.optim.b.1":"Una visión equilibrada; ni muy esperanzada ni pesimista.","DIMS.optim.b.2":"En general espera buenos resultados; suele asociarse a perseverancia y mejor salud.","DIMS.optim.tips.0":"Escriba unos minutos sobre su «mejor yo posible» dentro de un año; en varios estudios, este ejercicio aumentó el optimismo.","DIMS.optim.tips.1":"Junto a cada preocupación, escriba un plan «si pasa esto, yo…».","DIMS.hope.n":"Esperanza","DIMS.hope.q":"¿Tengo metas, caminos para alcanzarlas y energía para ponerme en marcha?","DIMS.hope.what":"La esperanza en sentido científico: tener metas, encontrar caminos hacia ellas (vías) y la energía y la convicción para perseguirlas (agencia).","DIMS.hope.not":"No es lo mismo que el optimismo; la esperanza se refiere a la propia capacidad de llegar.","DIMS.hope.b.0":"Pocas vías o poca energía para alcanzar metas; es más probable sentirse estancado.","DIMS.hope.b.1":"Hay metas y vías, pero la energía baja cuando aparecen obstáculos.","DIMS.hope.b.2":"Metas claras, varias vías y energía suficiente; predice un mejor rendimiento.","DIMS.hope.tips.0":"Para una meta importante, escriba al menos tres caminos distintos.","DIMS.hope.tips.1":"Use WOOP: deseo (Wish), resultado (Outcome), obstáculo interno (Obstacle) y un plan «si… entonces…» (Plan).","DIMS.belong.n":"Pertenencia","DIMS.belong.q":"¿Me siento parte del grupo y aceptado?","DIMS.belong.what":"Un sentido general de pertenencia y aceptación en las relaciones, en la vida y entre los demás.","DIMS.belong.not":"No se limita al trabajo; mide la pertenencia en toda la vida.","DIMS.belong.b.0":"Predomina la sensación de estar al margen o de ser rechazado; es un factor importante de agotamiento y rotación.","DIMS.belong.b.1":"Pertenencia parcial; incluido en algunos grupos pero no en otros.","DIMS.belong.b.2":"Se siente aceptado y conectado; un pilar importante de la salud mental.","DIMS.belong.tips.0":"Esta semana, tenga una conversación breve con un compañero que no sea sobre trabajo.","DIMS.belong.tips.1":"Pida a alguien que le incluya en una tarea o plan; pedir ayuda también crea vínculo.","DIMS.flow.n":"Flow en el trabajo","DIMS.flow.q":"¿Me sumerjo en mi trabajo, lo disfruto y lo hago por sí mismo?","DIMS.flow.what":"El flow en el trabajo en las últimas dos semanas: absorción, disfrute y motivación intrínseca.","DIMS.flow.not":"No mide el esfuerzo ni las horas; mide la calidad de la experiencia de trabajo.","DIMS.flow.b.0":"El trabajo absorbe o se disfruta menos; quizá haya muchas interrupciones o falta de sentido.","DIMS.flow.b.1":"Hay flow y disfrute a ratos, pero no de forma constante.","DIMS.flow.b.2":"Absorto, disfrutando y con motivación intrínseca; ligado a mejor rendimiento y sentido.","DIMS.flow.tips.0":"Reserve cada día un bloque de 60–90 minutos de trabajo concentrado sin mensajes ni reuniones.","DIMS.flow.tips.1":"Rediseñe una parte de su puesto para que encaje mejor con sus fortalezas e intereses (job crafting).","DIMS.ei.n":"Inteligencia emocional","DIMS.ei.q":"¿Entiendo y gestiono mis emociones y las de los demás?","DIMS.ei.what":"Cómo valoran las personas su capacidad para entender y gestionar las emociones propias y ajenas.","DIMS.ei.not":"Autoinforme, no una prueba de aptitud; puede diferir de la habilidad real.","DIMS.ei.b.0":"Se ve con menos habilidad para reconocer o gestionar emociones.","DIMS.ei.b.1":"Fuerte en algunas habilidades emocionales y más débil en otras.","DIMS.ei.b.2":"Se ve capaz de entender y gestionar las emociones propias y ajenas.","DIMS.ei.tips.0":"Tres veces al día, ponga un nombre preciso a lo que siente («molesto» en lugar de «mal»).","DIMS.ei.tips.1":"Cuando un compañero esté alterado, refleje primero («pareces cansado») y luego ofrezca soluciones.","DIMS.selfctrl.n":"Autocontrol","DIMS.selfctrl.q":"¿Resisto las tentaciones y me mantengo fiel a mis metas a largo plazo?","DIMS.selfctrl.what":"La capacidad de controlar los impulsos, resistir las tentaciones y mantenerse fiel a las metas a largo plazo.","DIMS.selfctrl.not":"Una puntuación baja no significa falta de voluntad; el entorno y los hábitos influyen mucho.","DIMS.selfctrl.b.0":"Las tentaciones y distracciones ganan a menudo; probablemente en el entorno hay señales que no ayudan.","DIMS.selfctrl.b.1":"Constante en algunas áreas; en otras, tiende a postergar.","DIMS.selfctrl.b.2":"Suele mantenerse fiel a sus metas a largo plazo, más gracias a buenos hábitos que a la fuerza de voluntad.","DIMS.selfctrl.tips.0":"Diseñe su entorno: deje el móvil en otra habitación durante el trabajo concentrado.","DIMS.selfctrl.tips.1":"Combine una tarea difícil con un pequeño placer (p. ej. su pódcast favorito solo mientras camina).","WS.w-comp.t":"La autocompasión y el crítico interior","WS.w-comp.who":"Todos los niveles; versión para mandos: liderazgo compasivo","WS.w-comp.goals.0":"Reconocer al crítico interior y su coste","WS.w-comp.goals.1":"Practicar las tres partes de la autocompasión: amabilidad con uno mismo, humanidad compartida y atención plena","WS.w-comp.goals.2":"Gestionar los errores en el equipo sin humillar","WS.w-comp.ev":"Un metaanálisis de 27 ensayos aleatorizados encontró efectos moderados del entrenamiento en autocompasión sobre el estrés y la autocrítica.","WSLEN.w-comp":"2 × 3 horas","WS.w-flex.t":"Flexibilidad psicológica y regulación emocional","WS.w-flex.who":"Todos los niveles, especialmente puestos con mucha presión","WS.w-flex.goals.0":"Tomar distancia de los pensamientos sin luchar contra ellos","WS.w-flex.goals.1":"Aclarar los valores en el trabajo","WS.w-flex.goals.2":"El modelo de proceso de la regulación emocional y cuatro estrategias proactivas","WS.w-flex.ev":"Un metaanálisis del entrenamiento en aceptación y compromiso (ACT) en el trabajo encontró reducciones pequeñas a moderadas del estrés y el malestar, mayores en personal de oficina.","WSLEN.w-flex":"2 × 3 horas","WS.w-hope.t":"Esperanza y optimismo realista","WS.w-hope.who":"Todos los niveles; especialmente adecuado en periodos de cambio organizativo","WS.w-hope.goals.0":"El ejercicio del «mejor yo posible»","WS.w-hope.goals.1":"WOOP y planes «si… entonces…»","WS.w-hope.goals.2":"El principio del progreso: fijarse en las pequeñas victorias","WS.w-hope.ev":"WOOP (contraste mental con planes «si… entonces…») tiene un efecto pequeño a medio en el logro de metas; el ejercicio del mejor yo posible aumenta el optimismo de forma modesta.","WSLEN.w-hope":"1 × 4 horas","WS.w-belong.t":"Pertenencia y conexión en el trabajo","WS.w-belong.who":"Equipos junto con sus responsables","WS.w-belong.goals.0":"Hablar con desconocidos y hacer cumplidos sinceros","WS.w-belong.goals.1":"Programas de acogida y de compañero mentor para recién llegados","WS.w-belong.goals.2":"Importar a los demás: ser visto y aportar valor","WS.w-belong.ev":"Una breve intervención de pertenencia tuvo efectos duraderos en un estudio conocido; un amplio seguimiento de 2023 mostró que el efecto depende del entorno.","WSLEN.w-belong":"1 × 3 horas + programa de equipo","WS.w-flow.t":"Trabajo concentrado, flow y desconexión","WS.w-flow.who":"Todos los niveles; versión para mandos: proteger el tiempo de concentración del equipo","WS.w-flow.goals.0":"Job crafting: rediseñar el propio puesto desde abajo","WS.w-flow.goals.1":"Bloques de concentración sin interrupciones","WS.w-flow.goals.2":"Desconexión psicológica fuera del horario laboral","WS.w-flow.ev":"Los metaanálisis relacionan el job crafting con un mayor compromiso laboral y la desconexión tras el trabajo con menos agotamiento; la mayor parte de esta evidencia es correlacional.","WSLEN.w-flow":"1 × 4 horas","WS.w-ei.t":"Inteligencia emocional en la práctica","WS.w-ei.who":"Puestos de atención al cliente, mandos y supervisores","WS.w-ei.goals.0":"Nombrar las emociones con precisión","WS.w-ei.goals.1":"Responder a las emociones de compañeros y clientes","WS.w-ei.goals.2":"Trabajo emocional y prevención del agotamiento","WS.w-ei.ev":"De media, la formación en IE aumenta moderadamente las puntuaciones de IE; la IE autoinformada se solapa con la personalidad, así que conviene leer las puntuaciones con cautela.","WSLEN.w-ei":"2 × 3 horas","WS.w-self.t":"Autocontrol por diseño: entorno, hábitos y combinación de tentaciones","WS.w-self.who":"Todos los niveles; versión para mandos: nudges y opciones por defecto saludables","WS.w-self.goals.0":"Elegir y cambiar situaciones en lugar de forzar la voluntad","WS.w-self.goals.1":"Crear hábitos y señales recordatorias","WS.w-self.goals.2":"Combinación de tentaciones (unir un pequeño placer a una tarea pesada) y reservas de emergencia (días de excepción planificados)","WS.w-self.ev":"Moldear la situación funciona mejor que confiar en la fuerza de voluntad en el momento; la combinación de tentaciones ayudó en un experimento de campo, pero el efecto se desvaneció con el tiempo.","WSLEN.w-self":"1 × 4 horas","LEVELS.staff":"Personal sin mando","LEVELS.lead":"Jefes de equipo","LEVELS.mid":"Mandos intermedios","LEVELS.senior":"Alta dirección","LEVELS.student":"Estudiantes","SUBN.scs.sk":"Amabilidad con uno mismo","SUBN.scs.sj":"Menos autojuicio","SUBN.scs.ch":"Humanidad compartida","SUBN.scs.is":"Menos aislamiento","SUBN.scs.mi":"Atención plena","SUBN.scs.oi":"Menos sobreidentificación (no dejarse arrastrar por los sentimientos)","SUBN.ahs.path":"Vías (caminos para alcanzar metas)","SUBN.ahs.agency":"Agencia (energía orientada a metas)","SUBN.gbs.acc":"Aceptación / inclusión","SUBN.gbs.rej":"Menos rechazo","SUBN.wolf.abs":"Absorción","SUBN.wolf.enj":"Disfrute","SUBN.wolf.int":"Motivación intrínseca","SUBN.sreis.p":"Percibir las emociones","SUBN.sreis.u":"Usar las emociones","SUBN.sreis.r":"Comprender las emociones","SUBN.sreis.m1":"Gestionar las propias emociones","SUBN.sreis.m2":"Gestionar las emociones de los demás","PACKS.quick":"Corta","PACKS.standard":"Completa","INST.scs.name":"Escala de autocompasión – versión breve","INST.scs.intro":"¿Cómo suele comportarse consigo mismo en momentos difíciles?","INST.scs.anchors.0":"Casi nunca","INST.scs.anchors.4":"Casi siempre","INST.scs.items.0":"Cuando fracaso en algo importante para mí, me consume la sensación de no estar a la altura.","INST.scs.items.1":"Intento ser comprensivo y paciente con los aspectos de mi personalidad que no me gustan.","INST.scs.items.2":"Cuando ocurre algo doloroso, intento ver la situación de forma equilibrada.","INST.scs.items.3":"Cuando me siento decaído, tiendo a pensar que la mayoría de la gente probablemente es más feliz que yo.","INST.scs.items.4":"Intento ver mis fallos como parte de la condición humana.","INST.scs.items.5":"Cuando paso por un momento muy difícil, me doy el cuidado y la ternura que necesito.","INST.scs.items.6":"Cuando algo me altera, intento mantener mis emociones en equilibrio.","INST.scs.items.7":"Cuando fracaso en algo importante para mí, tiendo a sentirme solo en mi fracaso.","INST.scs.items.8":"Cuando me siento decaído, tiendo a obsesionarme y fijarme en todo lo que va mal.","INST.scs.items.9":"Cuando siento que no estoy a la altura en algún aspecto, intento recordarme que la mayoría de las personas comparten ese sentimiento.","INST.scs.items.10":"Desapruebo y juzgo mis propios defectos y carencias.","INST.scs.items.11":"Soy intolerante e impaciente con los aspectos de mi personalidad que no me gustan.","INST.aaq.name":"Cuestionario de aceptación y acción II (AAQ-II)","INST.aaq.intro":"¿Hasta qué punto es verdad cada afirmación para usted?","INST.aaq.anchors.0":"Nunca es verdad","INST.aaq.anchors.6":"Siempre es verdad","INST.aaq.items.0":"Mis experiencias y recuerdos dolorosos me dificultan vivir una vida valiosa para mí.","INST.aaq.items.1":"Tengo miedo de mis sentimientos.","INST.aaq.items.2":"Me preocupa no ser capaz de controlar mis preocupaciones y sentimientos.","INST.aaq.items.3":"Mis recuerdos dolorosos me impiden tener una vida plena.","INST.aaq.items.4":"Las emociones me causan problemas en la vida.","INST.aaq.items.5":"Parece que la mayoría de la gente maneja su vida mejor que yo.","INST.aaq.items.6":"Las preocupaciones obstaculizan mi éxito.","INST.lot.name":"Test de orientación vital – revisado (LOT-R)","INST.lot.intro":"¿Hasta qué punto está de acuerdo con cada afirmación? Cuatro afirmaciones son de relleno y no se puntúan.","INST.lot.anchors.0":"Totalmente en desacuerdo","INST.lot.anchors.1":"En desacuerdo","INST.lot.anchors.2":"Ni de acuerdo ni en desacuerdo","INST.lot.anchors.3":"De acuerdo","INST.lot.anchors.4":"Totalmente de acuerdo","INST.lot.items.0":"En tiempos de incertidumbre, suelo esperar lo mejor.","INST.lot.items.1":"Me resulta fácil relajarme.","INST.lot.items.2":"Si algo puede salirme mal, me saldrá mal.","INST.lot.items.3":"Siempre soy optimista respecto a mi futuro.","INST.lot.items.4":"Disfruto mucho de mis amigos.","INST.lot.items.5":"Es importante para mí mantenerme ocupado.","INST.lot.items.6":"Casi nunca espero que las cosas salgan como quiero.","INST.lot.items.7":"No me altero con demasiada facilidad.","INST.lot.items.8":"Rara vez cuento con que me vayan a pasar cosas buenas.","INST.lot.items.9":"En general, espero que me ocurran más cosas buenas que malas.","INST.ahs.name":"Escala de esperanza para adultos (AHS)","INST.ahs.intro":"¿Hasta qué punto es verdad cada afirmación para usted? Cuatro afirmaciones son de relleno.","INST.ahs.anchors.0":"Totalmente falso","INST.ahs.anchors.7":"Totalmente cierto","INST.ahs.items.0":"Se me ocurren muchas maneras de salir de un aprieto.","INST.ahs.items.1":"Persigo mis metas con energía.","INST.ahs.items.2":"Me siento cansado la mayor parte del tiempo.","INST.ahs.items.3":"Hay muchas maneras de sortear cualquier problema.","INST.ahs.items.4":"En una discusión, me dejo vencer fácilmente.","INST.ahs.items.5":"Se me ocurren muchas maneras de conseguir las cosas de la vida que son importantes para mí.","INST.ahs.items.6":"Me preocupa mi salud.","INST.ahs.items.7":"Incluso cuando otros se desaniman, sé que puedo encontrar una forma de resolver el problema.","INST.ahs.items.8":"Mis experiencias pasadas me han preparado bien para el futuro.","INST.ahs.items.9":"He tenido bastante éxito en la vida.","INST.ahs.items.10":"Suelo estar preocupado por algo.","INST.ahs.items.11":"Alcanzo las metas que me propongo.","INST.gbs.name":"Escala general de pertenencia (GBS)","INST.gbs.intro":"¿Hasta qué punto está de acuerdo con cada afirmación?","INST.gbs.anchors.0":"Totalmente en desacuerdo","INST.gbs.anchors.6":"Totalmente de acuerdo","INST.gbs.items.0":"Cuando estoy con otras personas, me siento incluido.","INST.gbs.items.1":"Tengo vínculos estrechos con mi familia y mis amigos.","INST.gbs.items.2":"Siento que estoy al margen.","INST.gbs.items.3":"Siento que a la gente no le importo.","INST.gbs.items.4":"Me siento aceptado por los demás.","INST.gbs.items.5":"Como no encajo en ninguna parte, me siento distante en la época de fiestas.","INST.gbs.items.6":"Me siento aislado del resto del mundo.","INST.gbs.items.7":"Tengo sentido de pertenencia.","INST.gbs.items.8":"Cuando estoy con otras personas, me siento un extraño.","INST.gbs.items.9":"Tengo mi lugar entre los demás.","INST.gbs.items.10":"Me siento conectado con los demás.","INST.gbs.items.11":"Mis amigos y mi familia no me incluyen en sus planes.","INST.wolf.name":"Inventario de flow en el trabajo (WOLF)","INST.wolf.intro":"En las últimas dos semanas, ¿con qué frecuencia ha vivido cada una de estas situaciones?","INST.wolf.anchors.0":"Nunca","INST.wolf.anchors.1":"Casi nunca","INST.wolf.anchors.2":"A veces","INST.wolf.anchors.3":"Con regularidad","INST.wolf.anchors.4":"A menudo","INST.wolf.anchors.5":"Muy a menudo","INST.wolf.anchors.6":"Siempre","INST.wolf.items.0":"Cuando estoy trabajando, no pienso en nada más.","INST.wolf.items.1":"Mi trabajo me atrapa.","INST.wolf.items.2":"Cuando estoy trabajando, me olvido de todo lo que me rodea.","INST.wolf.items.3":"Estoy totalmente inmerso en mi trabajo.","INST.wolf.items.4":"Mi trabajo me hace sentir bien.","INST.wolf.items.5":"Disfruto mucho haciendo mi trabajo.","INST.wolf.items.6":"Me siento feliz mientras trabajo.","INST.wolf.items.7":"Me siento alegre cuando trabajo.","INST.wolf.items.8":"Seguiría haciendo este trabajo aunque me pagaran menos.","INST.wolf.items.9":"Me doy cuenta de que también quiero trabajar en mi tiempo libre.","INST.wolf.items.10":"Trabajo porque lo disfruto.","INST.wolf.items.11":"Cuando trabajo en algo, lo hago por mí mismo.","INST.wolf.items.12":"Mi motivación viene del propio trabajo y no de la recompensa por hacerlo.","INST.sreis.name":"Escala de inteligencia emocional autoevaluada (SREIS)","INST.sreis.intro":"¿Con qué precisión le describe cada afirmación?","INST.sreis.anchors.0":"Muy imprecisa","INST.sreis.anchors.1":"Algo imprecisa","INST.sreis.anchors.2":"Ni una cosa ni otra","INST.sreis.anchors.3":"Algo precisa","INST.sreis.anchors.4":"Muy precisa","INST.sreis.items.0":"Al mirar las expresiones faciales de la gente, reconozco las emociones que están sintiendo.","INST.sreis.items.1":"Soy una persona racional y rara vez, por no decir nunca, consulto mis sentimientos para tomar una decisión.","INST.sreis.items.2":"Tengo un vocabulario rico para describir mis emociones.","INST.sreis.items.3":"Tengo problemas para manejar mi enfado.","INST.sreis.items.4":"Cuando alguien que conozco está de mal humor, puedo ayudarle a calmarse y a sentirse mejor rápidamente.","INST.sreis.items.5":"Soy consciente de los mensajes no verbales que envían los demás.","INST.sreis.items.6":"Al tomar decisiones, escucho mis sentimientos para ver si la decisión me parece correcta.","INST.sreis.items.7":"Se me ocurren fácilmente muchos sinónimos de palabras que expresan emociones, como felicidad y tristeza.","INST.sreis.items.8":"Puedo manejar situaciones estresantes sin ponerme demasiado nervioso.","INST.sreis.items.9":"Conozco estrategias para generar o mejorar el buen ánimo de los demás.","INST.sreis.items.10":"Al mirar las expresiones faciales de la gente, sé si están siendo sinceros conmigo.","INST.sreis.items.11":"Soy una persona racional y no me gusta basarme en mis sentimientos para tomar decisiones.","INST.sreis.items.12":"Tengo palabras para describir cómo las emociones van de lo simple a lo complejo.","INST.sreis.items.13":"Soy capaz de manejar la mayoría de los problemas que me alteran.","INST.sreis.items.14":"No se me da muy bien ayudar a los demás a sentirse mejor cuando están enfadados o tristes.","INST.sreis.items.15":"Mis primeras impresiones sobre cómo se sienten los demás a menudo son erróneas.","INST.sreis.items.16":"En comparación con la mayoría de la gente, tengo un vocabulario más rico para describir sentimientos.","INST.sreis.items.17":"Sé mantener la calma en situaciones difíciles o estresantes.","INST.sreis.items.18":"Soy el tipo de persona a la que otros acuden cuando necesitan ayuda en una situación difícil.","INST.bscs.name":"Escala breve de autocontrol (BSCS)","INST.bscs.intro":"¿En qué medida refleja cada afirmación cómo suele ser usted?","INST.bscs.anchors.0":"Nada","INST.bscs.anchors.4":"Mucho","INST.bscs.items.0":"Se me da bien resistir las tentaciones.","INST.bscs.items.1":"Me cuesta dejar los malos hábitos.","INST.bscs.items.2":"Soy perezoso.","INST.bscs.items.3":"Digo cosas inapropiadas.","INST.bscs.items.4":"Hago ciertas cosas que son malas para mí si son divertidas.","INST.bscs.items.5":"Rechazo las cosas que son malas para mí.","INST.bscs.items.6":"Ojalá tuviera más autodisciplina.","INST.bscs.items.7":"La gente diría que tengo una autodisciplina de hierro.","INST.bscs.items.8":"El placer y la diversión a veces me impiden terminar el trabajo.","INST.bscs.items.9":"Me cuesta concentrarme.","INST.bscs.items.10":"Soy capaz de trabajar de forma eficaz para alcanzar metas a largo plazo.","INST.bscs.items.11":"A veces no puedo evitar hacer algo, aunque sepa que está mal.","INST.bscs.items.12":"A menudo actúo sin pensar en todas las alternativas.","LABELS.s2":"Autocompasión","LABELS.s3":"De la autoculpa a la autocompasión","LABELS.compassion":"Estantería: compasión y autocrítica","LABELS.s4":"El enigma de la regulación emocional","LABELS.s7":"Cambiar uno mismo en lugar de cambiar el entorno","LABELS.shelf13":"Estantería: terapia basada en procesos y agilidad emocional","LABELS.s9":"Optimismo y esperanza en el futuro","LABELS.riseabove":"Rise Above (Kaufman, 2024): de la mentalidad de víctima al crecimiento","LABELS.s10":"Subculturas organizativas y motivación","LABELS.s8":"Reevaluación, agotamiento del ego y mentalidades","LABELS.mattering":"Cómo llegamos a importar a los demás","LABELS.s11":"Desahogarse: ¿cuándo ayuda hablarlo?","LABELS.s13":"Motivación: externa, introyectada e intrínseca","LABELS.s15":"Emociones positivas, ocio y compartir buenas noticias","LABELS.s14":"Inteligencia emocional: ¿habilidad, rasgo o mezcla?","LABELS.s5":"Autocontrol y elección de situaciones","LABELS.s6":"Elegir y cambiar el propio entorno","LABELS.s12":"Perfeccionismo: excelente pero bajo presión","REFS.nea25":"el 21 % de los trabajadores declara síntomas de agotamiento laboral","REFS.who22":"12 000 millones de días laborables perdidos cada año por depresión y ansiedad","REFS.icd11":"el agotamiento laboral clasificado como fenómeno ocupacional","REFS.cbs26":"tasa de absentismo del 5,4 % en 2025; el 9 % de quienes se ausentaron cita problemas psicológicos o agotamiento","REFS.tno24":"la ausencia por problemas psicológicos dura de media 63 días laborables; en el 75 % de los casos se debe (en parte) al trabajo","REFS.arbo24":"8300 millones de euros por absentismo relacionado (en parte) con el trabajo en 2023, de los cuales 4900 millones se deben a la carga psicosocial","REFS.arbo18":"alrededor de una cuarta parte de los días de ausencia se relaciona con problemas psicológicos, sobrecarga o agotamiento","REFS.mkb":"de media, entre 250 € y 400 € por día de ausencia","REFS.arbowet":"art. 3, apdo. 2: política para prevenir o limitar la carga psicosocial; art. 5: evaluación de riesgos (RI&E) con plan de acción","REFS.arbobes":"art. 2.15: evaluar los riesgos psicosociales en la RI&E y fijar medidas en el plan de acción","REFS.arboportaal":"información oficial sobre la carga psicosocial en el trabajo","REFS.wor":"art. 27: derecho de consentimiento del comité de empresa en cuestiones como las encuestas a la plantilla y la política de condiciones de trabajo","REFS.gdpr":"Reglamento General de Protección de Datos (RGPD)","T.rStrRel":"Sus áreas relativamente más fuertes"},"pl":{"T.proto":"Wersja pilotażowa – już teraz dostępna do pierwszego pilotażu w Twojej organizacji.","T.brand":"Badanie dobrostanu w organizacji","T.brandShort":"Badanie dobrostanu","T.by":"Inspirowane kursem „Kompetencje osobiste i interpersonalne w organizacjach i placówkach edukacyjnych” dr. Azarakhsha Mokriego","T.nHome":"Przegląd","T.nTake":"Wypełnij ankietę","T.nReport":"Raport organizacji","T.nWs":"Warsztaty","T.nMethod":"Metoda","T.heroK":"Dla organizacji opartych na wiedzy · pilotaże od 20 pracowników","T.heroT":"Zobacz, jak wygląda zdrowie psychiczne Twojej organizacji – i od czego zacząć.","T.heroP":"W ciągu około 15 minut pracownicy anonimowo wypełniają zwalidowane kwestionariusze naukowe. Każdy od razu widzi osobiste podsumowanie; organizacja otrzymuje raport według poziomu stanowisk, z naukową interpretacją i planem zalecanych warsztatów.","T.ctaTake":"Rozpocznij ankietę","T.ctaDemo":"Zobacz przykładowy raport","T.f1":"8 wymiarów","T.f1s":"Mierzone 8 kwestionariuszami zwalidowanymi w badaniach międzynarodowych","T.f2":"Anonimowo","T.f2s":"Bez nazwisk; grupy mniejsze niż 5 osób nigdy nie są pokazywane","T.f3":"9 języków","T.f3s":"Polski, angielski, niderlandzki, niemiecki, francuski, hiszpański, turecki, arabski i perski","T.measT":"Co mierzymy","T.measP":"Każdy wymiar odpowiada na jedno proste pytanie. Dotknij karty, aby zobaczyć, co mierzy, a czego nie.","T.whatIs":"Co mierzy","T.whatNot":"Czego nie mierzy","T.privT":"Prywatność przede wszystkim","T.priv.0":"Nie pytamy o imię i nazwisko, adres e-mail ani numer pracownika.","T.priv.1":"Zapisywany jest tylko poziom stanowiska (np. pracownik lub kierownik średniego szczebla).","T.priv.2":"Grupy mniejsze niż 5 osób są ukryte w raporcie organizacji.","T.priv.3":"Odpowiedzi są zapisywane bez żadnego identyfikatora, a raport pokazuje tylko wyniki grupowe; żaden przełożony nie widzi niczyjego indywidualnego wyniku.","T.notT":"Czym to badanie nie jest","T.not":"To nie jest diagnoza kliniczna i nie zastępuje poradnictwa ani leczenia. Mierzy zasoby psychologiczne, takie jak współczucie wobec siebie, elastyczność i poczucie przynależności, a nie wypalenie zawodowe ani obciążenie pracą. Służy do dostrzegania wzorców w grupach i wyboru właściwego wsparcia.","T.tT":"Wypełnij ankietę","T.tRound":"Twoja ankieta","T.tSelf":"Badanie osobiste (wyniki zostają na Twoim urządzeniu)","T.tJoin":"Runda ankiety w organizacji","T.tLevel":"Na jakim poziomie stanowiska pracujesz lub jaką pełnisz rolę?","T.tLevelHint":"Służy tylko do porównania grup; nie pytamy o żadne inne dane osobowe.","T.tPack":"Która wersja?","T.tMin":"min","T.tItems":"pyt.","T.tConsent":"Rozumiem, że udział jest dobrowolny, moje odpowiedzi są zapisywane bez mojego nazwiska i nie jest to diagnoza kliniczna.","T.tStart":"Rozpocznij","T.tNext":"Następna część","T.tPrev":"Poprzednia część","T.tFinish":"Zobacz moje wyniki","T.tPart":"Część","T.tOf":"z","T.tMissing":"Te pytania nie mają jeszcze odpowiedzi:","T.tSaved":"Odpowiedzi są zapisywane na tym urządzeniu; jeśli zamkniesz stronę, możesz kontynuować tutaj.","T.tResume":"Kontynuuj niedokończoną ankietę","T.tRestart":"Zacznij od nowa","T.rT":"Twoje wyniki w skrócie","T.rP":"Wyniki mieszczą się w zakresie od 0 do 100 i zawsze obowiązuje zasada: im wyżej, tym lepiej.","T.rStr":"Twoje mocne strony","T.rGrow":"Pole do rozwoju","T.rTips":"Dwie krótkie wskazówki","T.rDetail":"Szczegóły i podskale","T.rSend":"Wyślij anonimowo do mojej organizacji","T.rSent":"Twoje odpowiedzi zostały zapisane anonimowo. Dziękujemy!","T.rCode":"Kod odpowiedzi","T.rCodeP":"Skopiuj ten kod i wyślij go e-mailem do SoloNovate, a nie do przełożonego ani działu HR. Zawiera tylko numery odpowiedzi i Twój poziom stanowiska, bez nazwiska. Nie łączymy Twojego adresu e-mail z odpowiedziami, a e-mail usuwamy po wczytaniu kodu.","T.rCopy":"Skopiuj kod","T.rCopied":"Skopiowano","T.rCare":"Jeśli od dłuższego czasu czujesz przygnębienie albo masz wrażenie, że sobie nie radzisz, porozmawiaj z lekarzem medycyny pracy, lekarzem rodzinnym lub psychologiem. Prośba o pomoc to oznaka siły.","T.rNot":"Ten wynik to obraz Twoich dzisiejszych odpowiedzi, a nie etykieta czy diagnoza.","T.band.0":"Wymaga uwagi","T.band.1":"Średni","T.band.2":"Wysoki","T.pT":"Raport organizacji","T.pP":"Mapa zdrowia psychicznego Twojej organizacji według poziomów, z priorytetami i zalecanymi warsztatami.","T.pSrc":"Dane raportu","T.pDemo":"Dane przykładowe (demonstracja)","T.pLive":"Prawdziwe odpowiedzi z tej rundy","T.pImport":"Importuj kody odpowiedzi","T.pImportP":"Wklej tutaj kody odpowiedzi (jeden w wierszu).","T.pImportGo":"Dodaj","T.pAdded":"Dodano odpowiedzi","T.pN":"Uczestnicy","T.pLevels":"Poziomy","T.pAvg":"Średnia ogólna","T.pLowShare":"Odsetek „wymaga uwagi”","T.pNoPri":"Żaden wymiar nie osiąga progu priorytetu. Propozycja: warsztaty podtrzymujące, aby utrzymać mocne strony.","T.pWhy":"Dlaczego","T.pFor":"Głównie dla","T.pStrengths":"Mocne strony organizacji","T.pGap":"Największa różnica między poziomami","T.pHidden":"mniej niż 5","T.pNone":"Brak odpowiedzi.","T.pExport":"Kopiuj dane zbiorcze (CSV)","T.pAdmin":"Zarządzaj rundami","T.pAdminP":"Dla osoby koordynującej ankietę w organizacji. Utwórz rundę i wyślij link pracownikom.","T.pOrg":"Nazwa organizacji","T.pRoundName":"Nazwa rundy","T.pCreate":"Utwórz rundę","T.pRounds":"Rundy","T.pChoose":"Wybierz rundę","T.pNoAdmin":"Tworzyć rundy i oglądać prawdziwe odpowiedzi mogą tylko osoby koordynujące ankietę (edytorzy tej strony). Pozostali mogą obejrzeć przykładowy raport lub zaimportować kody odpowiedzi.","T.pDemoNote":"Ten raport korzysta z symulowanych danych 180 osób, aby pokazać, jak wygląda prawdziwy raport.","T.wT":"Warsztaty","T.wP":"Każdy warsztat dotyczy jednego lub dwóch wymiarów i opiera się na materiałach kursu dr. Mokriego. Linki do lektur otwierają strony wiki kursu; tytuły są tu przetłumaczone, ale same strony są po persku.","T.wGoals":"Cele","T.wWho":"Dla kogo","T.wLen":"Czas trwania","T.wEv":"Dowody naukowe","T.wRead":"Lektura w wiki kursu (strony po persku)","T.mT":"Metoda","T.mP":"Przejrzyście o tym, co mierzymy, jak liczymy wyniki i gdzie są ograniczenia.","T.mInst":"Kwestionariusze","T.mScore":"Obliczanie wyników","T.mScoreP":"Średnia każdej podskali jest przeliczana na zakres 0–100: (średnia − minimum) ÷ (maksimum − minimum) × 100. Pozycje odwrócone są najpierw przekodowywane. Gdy wysoki wynik w oryginalnym kwestionariuszu oznacza więcej trudności (np. AAQ-II), wynik jest odwracany, aby wszędzie „wyżej = lepiej”.","T.mBands":"Przedziały wyników","T.mBandsP":"Poniżej 37,5: wymaga uwagi · od 37,5 do 62,5: średni · powyżej 62,5: wysoki. Te progi są umowne i oparte na zakresie skali; nie są normami populacyjnymi ani klinicznymi punktami odcięcia.","T.mLim":"Ograniczenia","T.mLimL.0":"Wszystkie kwestionariusze to samoopis, więc na wyniki może wpływać dzisiejszy nastrój lub chęć pokazania się z dobrej strony.","T.mLimL.1":"Przedziały nie mają norm populacyjnych; porównania wewnątrz organizacji i w czasie są trafniejsze niż porównania ze „średnią krajową”.","T.mLimL.2":"Kwestionariusze są zwalidowane w języku oryginału, a pozycje angielskie zachowują oryginalne brzmienie. Używane tu wersje w innych językach, w tym ta polska, nie zostały w tej formie osobno zwalidowane; ich rzetelność sprawdzamy w pilotażu. Do badań naukowych używaj oficjalnie zwalidowanych wersji (zob. Źródła).","T.mLimL.3":"To narzędzie nie jest przeznaczone do decyzji dotyczących pojedynczych osób (rekrutacja, ocena pracy) i nie wolno go do tego używać.","T.mEth":"Etyka i prywatność","T.mEthL.0":"Udział jest dobrowolny i każdy może w dowolnej chwili przerwać.","T.mEthL.1":"Zapisywane są tylko miesiąc i rok, a nie dokładna data ani godzina.","T.mEthL.2":"Raporty są wyłącznie grupowe, przy minimalnej wielkości grupy 5 osób.","T.mEthL.3":"Wyniki osobiste są pokazywane tylko na urządzeniu osoby odpowiadającej.","T.mCourse":"Ta usługa wyrosła z kursu „Kompetencje osobiste i interpersonalne w organizacjach i placówkach edukacyjnych” dr. Azarakhsha Mokriego. Kwestionariusze to te przedstawione na slajdach kursu.","T.mWiki":"Pełne wiki kursu (po persku)","T.mOrgPsy":"Psychologia pracy i organizacji","T.items":"pozycji","T.scale":"Skala","T.ref":"Źródło","T.session":"Materiał z kursu","T.footer":"Badanie dobrostanu w organizacji od SoloNovate · wersja pilotażowa · narzędzie niediagnostyczne","T.dims":"Wymiar","T.whyT":"Dlaczego to ważne","T.whyP":"Zdrowie psychiczne to nie miękki temat; widać je w absencji, rotacji i jakości pracy.","T.why.0.0":"1 na 5","T.why.0.1":"pracowników w Holandii zgłasza objawy wypalenia zawodowego (21% w 2025 r.).","T.why.1.0":"12 miliardów","T.why.1.1":"dni roboczych traci się co roku na świecie z powodu depresji i lęku, co oznacza utratę produktywności o wartości około 1 biliona USD.","T.why.2.0":"Zawodowe","T.why.2.1":"WHO klasyfikuje wypalenie (ICD-11) jako zjawisko związane z pracą: problem pracy, a nie tylko osobisty.","T.getT":"Co otrzymuje Twoja organizacja","T.get.0.0":"Raport według poziomu stanowisk","T.get.0.1":"Osiem wymiarów dla każdego poziomu, z mocnymi stronami, priorytetami i różnicami między poziomami.","T.get.1.0":"Naukowa interpretacja","T.get.1.1":"Zrozumiałe wyjaśnienie, co każdy wynik oznacza, a czego nie.","T.get.2.0":"Plan warsztatów","T.get.2.1":"Dwa lub trzy warsztaty dopasowane do priorytetów, z formą i czasem trwania.","T.get.3.0":"Osobiste podsumowanie dla każdego uczestnika","T.get.3.1":"Każdy pracownik widzi własne wyniki i dwie praktyczne wskazówki; nic nie trafia do kierownictwa.","T.get.4.0":"45-minutowe omówienie","T.get.4.1":"Omówienie wyników z kierownictwem i HR, z konkretnymi kolejnymi krokami.","T.pilot.0.0":"Tydzień 0","T.pilot.0.1":"Start","T.pilot.0.2":"Spotkanie na 30 minut: cele, poziomy, harmonogram i sposób poinformowania pracowników.","T.pilot.1.0":"Tygodnie 1–2","T.pilot.1.1":"Ankieta otwarta","T.pilot.1.2":"Pracownicy wypełniają anonimowe badanie w 8–18 minut, na telefonie lub komputerze, w jednym z dziewięciu języków.","T.pilot.2.0":"Tydzień 3","T.pilot.2.1":"Raport","T.pilot.2.2":"Anonimowy raport grupowy według poziomów i zalecany plan warsztatów.","T.pilot.3.0":"Tydzień 4","T.pilot.3.1":"Omówienie i wybór","T.pilot.3.2":"Rozmowa z kierownictwem; wybór pierwszych warsztatów i terminu kolejnego pomiaru.","T.needT":"Czego od Ciebie potrzebujemy","T.need.0":"Jednej osoby kontaktowej (np. z HR)","T.need.1":"Co najmniej 20 uczestników i co najmniej 5 na każdy poziom stanowisk","T.need.2":"Krótkiej wiadomości do pracowników (dostarczamy wzór)","T.need.3":"W razie potrzeby poinformowania rady pracowników (OR)","T.need.4":"Łącznie około 3 godzin pracy działu HR, rozłożonych na cztery tygodnie","T.lawT":"Zgodne z przepisami holenderskimi i europejskimi","T.law.0.0":"RODO","T.law.0.1":"Nie zbieramy nazwisk ani identyfikatorów; wyniki są raportowane tylko dla grup liczących co najmniej 5 osób.","T.law.1.0":"Arbowet","T.law.1.1":"Wspiera politykę PSA pracodawcy (art. 3 ust. 2) jako jedno ze źródeł obok części RI&E dotyczącej warunków pracy (Arbobesluit art. 2.15).","T.law.2.0":"Rada pracowników","T.law.2.1":"Takie badanie pracowników zwykle omawia się z radą pracowników (WOR art. 27); pomagamy to przygotować.","T.faqT":"Najczęstsze pytania","T.faq.0.0":"Ile czasu zajmuje to pracownikom?","T.faq.0.1":"Wersja krótka trwa około 8 minut, pełna około 18. Działa na każdym telefonie i komputerze.","T.faq.1.0":"Czy przełożeni widzą indywidualne odpowiedzi?","T.faq.1.1":"Nie. Nie ma nazwisk, a raport organizacji pokazuje tylko grupy liczące pięć lub więcej osób.","T.faq.2.0":"Czy to diagnoza?","T.faq.2.1":"Nie. To niekliniczne badanie oparte na zwalidowanych kwestionariuszach, służące do dostrzegania wzorców w grupach i wyboru właściwego wsparcia. Osoby, którym jest ciężko, kierujemy do lekarza medycyny pracy, lekarza rodzinnego lub psychologa.","T.faq.3.0":"Czy kwestionariusze są zwalidowane?","T.faq.3.1":"Wszystkie osiem zostało opublikowanych i zwalidowanych w języku oryginału, a my używamy ich oryginalnych kluczy punktowania (zob. Metoda i Źródła). Pozycje angielskie zachowują oryginalne brzmienie; używane tu wersje w innych językach, w tym polska, nie zostały jeszcze w tej formie osobno zwalidowane, dlatego na danych z pilotażu sprawdzamy rzetelność każdej skali. Licencje na użycie komercyjne są uzgadniane z autorami.","T.faq.4.0":"Czy to mierzy stres w pracy lub wypalenie?","T.faq.4.1":"Nie bezpośrednio. Mierzy zasoby psychologiczne, które pomagają radzić sobie z presją. Ryzyka związane z pracą, takie jak obciążenie i autonomia, mierzy się badaniem warunków pracy. Oba się uzupełniają i chętnie pomożemy je połączyć.","T.faq.5.0":"Czy to działa w dużych organizacjach?","T.faq.5.1":"Tak. Pilotaż może zacząć się w jednym dziale lub lokalizacji, a potem zostać rozszerzony. Zasady anonimowości są takie same przy każdej skali: wyniki tylko dla grup liczących co najmniej 5 osób.","T.faq.6.0":"Jak zbierane są odpowiedzi w pilotażu?","T.faq.6.1":"Każdy uczestnik wysyła e-mailem anonimowy kod odpowiedzi (tylko numery odpowiedzi i poziom stanowiska) bezpośrednio do SoloNovate, nigdy do pracodawcy. SoloNovate usuwa te e-maile po wczytaniu. Przy pełnym wdrożeniu można uruchomić bezpieczne zbieranie online.","T.faq.7.0":"Co dzieje się po raporcie?","T.faq.7.1":"Omówienie, dwa lub trzy warsztaty prowadzone przez wykwalifikowanego partnera w Holandii oraz ponowny pomiar po 3–6 miesiącach, aby zobaczyć, co się zmieniło.","T.ctaT":"Interesuje Cię pilotaż?","T.ctaP":"Wypróbuj badanie samodzielnie, obejrzyj przykładowy raport i wyślij krótkie zapytanie.","T.calcT":"Ile kosztuje Cię absencja związana ze stresem?","T.calcP":"Szybki szacunek dla Twojej organizacji. Zmień liczby, aby pasowały do Twojej sytuacji.","T.cEmp":"Liczba pracowników","T.cAbs":"Wskaźnik absencji (%)","T.cAbsH":"Średnia w Holandii w 2025 r.: 5,4%","T.cSal":"Średnie roczne wynagrodzenie brutto (€)","T.cShare":"Odsetek dni absencji z powodu stresu lub dolegliwości psychicznych (%)","T.cShareH":"Szacunek krajowy: około jednej czwartej","T.cRed":"Scenariusz: absencja związana ze stresem spada o","T.cDays":"dni absencji rocznie","T.cStress":"w tym związanych ze stresem","T.cCost":"roczny koszt absencji związanej ze stresem","T.cSave":"roczna oszczędność w tym scenariuszu","T.cPerDay":"Przyjęty tu koszt dnia absencji: {x} (wynagrodzenie × 1,3 na koszty pracodawcy ÷ 220 dni roboczych). Holenderskie szacunki wynoszą od 250 € do 400 € dziennie.","T.cNote":"To scenariusz, a nie prognoza. Wynik kwestionariusza nie przekłada się bezpośrednio na mniej dni absencji. Użyj szacunku, aby ocenić, czy warto inwestować w profilaktykę, a ponownego pomiaru, aby zobaczyć, co naprawdę się zmieniło.","T.wsPartner":"Realizacja: każdy warsztat prowadzi doświadczony psycholog lub trener z naszej sieci partnerów w Holandii, a my go organizujemy i koordynujemy.","T.pilotNoteT":"O tej wersji pilotażowej","T.pilotNote":"W pilotażu odpowiedzi służą wyłącznie do przygotowania raportu Twojej organizacji i walidacji usługi – do niczego więcej. Licencje na komercyjne użycie kwestionariuszy są równolegle uzgadniane z ich autorami. Mówimy o tym z góry, żeby nie było niespodzianek.","T.arboT":"Pomaga spełnić obowiązki wynikające z Arbowet","T.arboP":"Pracodawcy w Holandii muszą prowadzić politykę zapobiegania obciążeniu psychospołecznemu (PSA), takiemu jak stres w pracy, lub przynajmniej jego ograniczania, a także oceniać ryzyka PSA w swojej ocenie ryzyka (RI&E) wraz z planem działania.","T.arbo.0.0":"Element części PSA Twojej RI&E","T.arbo.0.1":"Ryzyka PSA dotyczą głównie samej pracy: obciążenia, autonomii, wsparcia i niepożądanych zachowań. To badanie dodaje drugą stronę: jakie zasoby psychologiczne mają Twoje zespoły, według poziomu stanowisk. Używaj go obok badania warunków pracy, a nie zamiast niego.","T.arbo.1.0":"Materiał do planu działania","T.arbo.1.1":"Plan warsztatów i ponowny pomiar dają konkretne, datowane działania, które możesz zapisać.","T.arbo.2.0":"Widoczna kontynuacja","T.arbo.2.1":"Wyniki przed i po pomagają pokazać radzie pracowników, że reagujesz na ryzyka.","T.arboNote":"Badanie nie zastępuje RI&E, badania warunków pracy ani oceny certyfikowanego eksperta; uzupełnia je.","T.fName":"Imię i nazwisko","T.fOrg":"Organizacja","T.fMail":"E-mail","T.fSize":"Liczba pracowników","T.fMsg":"Wiadomość (opcjonalnie)","T.fSend":"Poproś o pilotaż","T.fSent":"Twój program pocztowy otworzy się z wypełnionym zapytaniem; wystarczy kliknąć Wyślij.","T.sizes.0":"20–50","T.sizes.1":"50–250","T.sizes.2":"250–1000","T.sizes.3":"1000+","T.sizes.4":"Inna","T.ctaAbout":"O Maryam Jaberi","T.pPlan":"Zaplanuj ten warsztat","T.nSrc":"Źródła","T.sT":"Źródła","T.sP":"Wszystkie liczby, odwołania prawne i twierdzenia naukowe na tej stronie, z linkiem do oryginału. Tytuły publikacji podajemy w języku oryginału.","T.gStats":"Liczby i koszty","T.gLaw":"Prawo i przepisy","T.gEv":"Badania stojące za warsztatami","T.gInst":"Kwestionariusze","T.gCourse":"Kurs","T.courseRef":"Mokri, A. Kompetencje osobiste i interpersonalne w organizacjach i placówkach edukacyjnych [kurs; po persku]. Notatki z kursu zebrane w wiki psychologii.","T.audT":"Od czego chcesz zacząć?","T.paths.0.1":"Kierownictwo","T.paths.0.2":"Ile to kosztuje, co daje i jak przebiega pilotaż.","T.paths.0.3":"Szacunek kosztów","T.paths.1.1":"HR","T.paths.1.2":"Przebieg tydzień po tygodniu, kto co robi i gotowe dokumenty.","T.paths.1.3":"Proces i dokumenty","T.paths.2.1":"Pracownicy","T.paths.2.2":"Co dzieje się z Twoimi odpowiedziami – i wypróbuj badanie samodzielnie.","T.paths.2.3":"Twoja prywatność","T.paths.3.1":"Psycholodzy i trenerzy","T.paths.3.2":"Kwestionariusze, dowody naukowe i współpraca z nami jako partner.","T.paths.3.3":"Współpraca","T.tryIt":"Wypróbuj badanie samodzielnie (8 min)","T.jT":"Od pomiaru do działania","T.jP":"Czterotygodniowy pilotaż, a potem warsztaty. Jeden dział lub cała organizacja.","T.jAfter.0":"Potem","T.jAfter.1":"Warsztaty i ponowny pomiar","T.jAfter.2":"Warsztaty prowadzone przez doświadczonego psychologa lub trenera; ponowny pomiar po 3–6 miesiącach pokazuje, co się zmieniło.","T.company":"SoloNovate · Rotterdam · KvK 94264759 · nr VAT UE NL005072230B46","T.teamT":"Zespół","T.teamP":"Celowo mały: zawsze wiesz, z kim masz do czynienia.","T.meRole":"Założycielka SoloNovate · produkt i dane","T.meBio":"Menedżerka produktu z doświadczeniem w wyszukiwarkach, streamingu wideo i platformach edukacyjnych oraz w badaniach UX. Projektuje badanie, chroni dane i pisze Twój raport.","T.meLangs":"niderlandzki, angielski, perski","T.phName":"[Imię i nazwisko psychologa]","T.phRole":"Psycholog · [rejestracja, np. NIP lub BIG]","T.phBio":"[Dwa lub trzy zdania: doświadczenie, specjalizacja, z jakimi organizacjami i zespołami współpracuje.]","T.phLangs":"[Języki warsztatów]","T.phNote":"Podgląd – tak będzie wyglądał profil partnera po uzupełnieniu.","T.langsL":"Języki","T.profile":"Profil","T.nProc":"Jak to działa","T.prT":"Jak to działa","T.prP":"Jasny proces z małym zespołem: kto co robi, kto co widzi i jakie dokumenty podpisujemy. Bez niespodzianek dla kierownictwa i pracowników.","T.rolesT":"Kto co robi","T.roles.0.2":"Twoja jedyna osoba kontaktowa","T.roles.0.3":"Przygotowuje ankietę, chroni dane, analizuje odpowiedzi, pisze raport i koordynuje wszystko od startu po ponowny pomiar.","T.roles.1.1":"Psycholog partner","T.roles.1.2":"Z doświadczeniem w prowadzeniu warsztatów dla organizacji","T.roles.1.3":"Sprawdza interpretację raportu, bierze udział w omówieniu i prowadzi warsztaty wybrane przez zespoły.","T.roles.2.1":"Twoja osoba kontaktowa","T.roles.2.2":"Często HR lub office manager","T.roles.2.3":"Planuje rundę razem z nami, informuje pracowników za pomocą naszego wzoru wiadomości i łączy nas z kierownictwem.","T.roles.3.1":"Pracownicy","T.roles.3.2":"Ludzie, o których tu chodzi","T.roles.3.3":"Sami decydują, czy wziąć udział, odpowiadają anonimowo w 8–18 minut i od razu widzą swój wynik.","T.roles.4.1":"Kierownictwo","T.roles.4.2":"Odpowiada za dalsze działania","T.roles.4.3":"Otrzymuje raport grupowy, omawia go na spotkaniu, wybiera kolejne kroki i dzieli się podsumowaniem z pracownikami.","T.roles.5.1":"Rada pracowników","T.roles.5.2":"Jeśli Twoja organizacja ją ma","T.roles.5.3":"Jest informowana z wyprzedzeniem i wyraża zgodę tam, gdzie wymaga tego prawo.","T.flowT":"Przebieg tydzień po tygodniu","T.flow.0.0":"Tydzień 0","T.flow.0.1":"Start","T.flow.0.2.1":"Osoba kontaktowa","T.flow.0.3":"30 minut: cele, poziomy stanowisk i harmonogram. Podpisujemy umowę pilotażową i umowę powierzenia przetwarzania danych.","T.flow.1.0":"Tydzień 0","T.flow.1.1":"Informacja dla pracowników","T.flow.1.2.0":"Kierownictwo","T.flow.1.2.1":"Rada pracowników","T.flow.1.3":"Kierownictwo wysyła wzór wiadomości: dlaczego, na czym polega anonimowość i co stanie się z wynikami.","T.flow.2.0":"Tygodnie 1–2","T.flow.2.1":"Ankieta otwarta","T.flow.2.2.0":"Pracownicy","T.flow.2.3":"Anonimowe kwestionariusze na telefonie lub komputerze. Każdy od razu widzi swój wynik. Jedno przypomnienie w połowie.","T.flow.3.0":"Tydzień 3","T.flow.3.1":"Analiza i raport","T.flow.3.2.1":"Psycholog","T.flow.3.3":"Analizujemy dane grupowe, a psycholog sprawdza interpretację. Grupy poniżej 5 osób pozostają ukryte.","T.flow.4.0":"Tydzień 4","T.flow.4.1":"Omówienie","T.flow.4.2.1":"Psycholog","T.flow.4.2.2":"Kierownictwo","T.flow.4.3":"45 minut: co oznaczają wyniki i od których dwóch lub trzech warsztatów zacząć.","T.flow.5.0":"Tydzień 4","T.flow.5.1":"Powrót do zespołu","T.flow.5.2.0":"Kierownictwo","T.flow.5.3":"Krótkie podsumowanie trafia do wszystkich pracowników. Wzięli udział, więc powinni wiedzieć, co z tego wynika.","T.flow.6.0":"Potem","T.flow.6.1":"Warsztaty i ponowny pomiar","T.flow.6.2.0":"Psycholog","T.flow.6.3":"Psycholog prowadzi warsztaty; ponowny pomiar po 3–6 miesiącach pokazuje, co się zmieniło.","T.seeT":"Kto co widzi","T.seeP":"Anonimowość jest wbudowana w proces, a nie tylko obiecana.","T.seeCols.0":"Indywidualne odpowiedzi (bez nazwisk)","T.seeCols.1":"Raport grupowy (5+ osób)","T.see.0.0":"Pracownik","T.see.0.1":"Tylko własne","T.see.0.2":"Podsumowanie","T.see.1.0":"Kierownictwo i HR","T.see.1.1":"Nigdy","T.see.1.2":"Tak","T.see.2.0":"Psycholog partner","T.see.2.1":"Nigdy","T.see.2.2":"Tak","T.see.3.1":"Tak, bez nazwisk","T.see.3.2":"Tak","T.empT":"Dla pracowników: co dzieje się z Twoimi odpowiedziami","T.emp.0":"Nikt nie pyta Cię o imię i nazwisko, adres e-mail ani numer pracownika.","T.emp.1":"Twój przełożony i HR widzą tylko wyniki grup liczących 5 lub więcej osób.","T.emp.2":"Od razu widzisz swój wynik z dwiema praktycznymi wskazówkami. Widzisz go tylko Ty.","T.emp.3":"Udział jest dobrowolny. W każdej chwili możesz przerwać lub pominąć pytanie.","T.emp.4":"Jeśli wysyłasz kod odpowiedzi, wyślij go do SoloNovate – nigdy do przełożonego ani do HR.","T.docsT":"Przykładowe dokumenty","T.docsP":"Żeby przed startem było jasne, co dokładnie podpisujesz. Każdy dokument jest dostępny po niderlandzku i angielsku i można go wydrukować lub zapisać jako PDF. To projekty, które dopracowujemy razem przed pilotażem.","T.docs.pilot-agreement.0":"Umowa pilotażowa","T.docs.pilot-agreement.1":"Zakres pilotażu, role, anonimowość, cena, odpowiedzialność.","T.docs.data-processing.0":"Umowa powierzenia przetwarzania danych","T.docs.data-processing.1":"RODO art. 28: jakie dane, bezpieczeństwo, przechowywanie i naruszenia danych.","T.docs.privacy-participants.0":"Informacja o prywatności dla uczestników","T.docs.privacy-participants.1":"Prostym językiem dla pracowników: kto co widzi i jakie masz prawa.","T.docs.staff-announcement.0":"Ogłoszenie dla pracowników","T.docs.staff-announcement.1":"Wzór wiadomości od kierownictwa, gotowy do dostosowania.","T.aud.mgmt":"Dla kierownictwa","T.aud.staff":"Dla pracowników","T.aud.hr":"Dla HR","T.open":"Otwórz (niderlandzki / angielski)","T.rMail":"Wyślij kod e-mailem do SoloNovate","T.partT":"Dla psychologów i trenerów","T.partP":"Prowadzisz warsztaty lub coaching dla organizacji? Budujemy małą sieć partnerów.","T.partL.0":"My zajmujemy się pomiarem, raportem i kontaktem z klientem; Ty robisz to, co potrafisz najlepiej.","T.partL.1":"Każde zlecenie zaczyna się od danych: przed pierwszą sesją wiesz, które tematy i poziomy stanowisk wymagają uwagi.","T.partL.2":"Gotowe scenariusze warsztatów z dowodami naukowymi i źródłami do wykorzystania i dostosowania.","T.partL.3":"To Ty ustalasz stawki i decydujesz, które zlecenia przyjmujesz.","T.partAsk":"Szukamy osób z doświadczeniem w pracy z grupami w organizacjach, z odpowiednią rejestracją zawodową (na przykład NIP lub BIG), które prowadzą warsztaty po niderlandzku lub angielsku.","T.partCta":"Zostań partnerem","T.partSubj":"Zgłoszenie partnerskie – Badanie dobrostanu","T.rvTabs":"Widoki raportu","T.whatL":"Co widzisz","T.howL":"Jak to czytać","T.keyL":"Najważniejszy wniosek","T.srcL":"Źródło","T.rv.sum.0":"Podsumowanie","T.rv.sum.1":"Najważniejsze wyniki prostym językiem.","T.rv.sum.2":"Wyniki mieszczą się w zakresie od 0 do 100: 0 to najniższa możliwa odpowiedź na każde pytanie, 100 najwyższa. Poniżej 37,5 = wymaga uwagi, 37,5–62,5 = średni, powyżej 62,5 = wysoki.","T.rv.heat.0":"Według poziomu stanowisk","T.rv.heat.1":"Średni wynik każdego poziomu stanowisk w każdym wymiarze.","T.rv.heat.2":"Czytaj wiersz, aby porównać poziomy; czytaj kolumnę, aby zobaczyć profil jednego poziomu. Ciepłe kolory oznaczają obszary wymagające uwagi, zielony – wysoki wynik. Grupy poniżej 5 osób są ukryte.","T.rv.gap.0":"Różnice między poziomami","T.rv.gap.1":"Dla każdego wymiaru: gdzie wypada każdy poziom stanowisk, od najniższego do najwyższego.","T.rv.gap.2":"Długa linia oznacza, że poziomy doświadczają tego bardzo różnie. Często wskazuje to na pracę lub rolę, a nie na pojedyncze osoby.","T.rv.dist.0":"Rozkład","T.rv.dist.1":"Ile osób mieści się w każdym przedziale, dla każdego wymiaru.","T.rv.dist.2":"Średnia może ukryć grupę, której jest ciężko. Czerwona część to odsetek osób, które wymagają uwagi.","T.rv.prof.0":"Profil poziomu","T.rv.prof.1":"Jeden poziom stanowisk w porównaniu z całą organizacją.","T.rv.prof.2":"Pasek to wynik poziomu, cienka linia to średnia organizacji. Liczba po prawej to różnica: wartość dodatnia oznacza wynik lepszy od średniej.","T.rv.sub.0":"Składowe wymiarów","T.rv.sub.1":"Elementy, z których składa się każdy wymiar.","T.rv.sub.2":"Gdy wymiar jest niski, widać tu, który element go obniża – a więc jaki rodzaj warsztatu pomoże najbardziej. Tutaj wyżej zawsze znaczy lepiej.","T.rv.time.0":"W czasie","T.rv.time.1":"Pierwszy pomiar obok ponownego pomiaru.","T.rv.time.2":"Jasny pasek = pierwszy pomiar, ciemny = ponowny. Zmiany mniejsze niż około 3 punkty mogą być przypadkowe.","T.rv.plan.0":"Plan działania","T.rv.plan.1":"Nad czym pracować najpierw, dla kogo i z jakim warsztatem.","T.rv.plan.2":"Wymiar jest priorytetem, gdy jego średnia jest niższa niż 55 lub ponad 25% osób wymaga uwagi.","T.kpiSub.0":"liczba osób, które odpowiedziały","T.kpiSub.1":"liczba poziomów stanowisk z co najmniej 5 osobami","T.kpiSub.2":"średnia wszystkich wymiarów (0–100)","T.kpiSub.3":"wszystkich wyników jest w przedziale „wymaga uwagi”","T.sumN":"Na podstawie odpowiedzi {n} osób z {k} poziomów stanowisk.","T.sumStrong":"Najwyższe wyniki: {a}.","T.sumWeak":"Najbardziej wymaga uwagi: {d} ({m}); {p} osób jest w przedziale „wymaga uwagi”.","T.sumGap":"Największa różnica między poziomami: {d} – {hi}: {a}, {lo}: {b}.","T.sumNext":"Proponowany pierwszy krok: warsztat „{w}”, głównie dla: {who}.","T.and":"i","T.heatKey":"Najniższy wynik: {lv} – {d} ({v}). Najwyższy: {lv2} – {d2} ({v2}).","T.gapKey":"Największa różnica: {d} – {lo}: {a} wobec {hi}: {b} ({x} pkt).","T.distKey":"{d}: {p} osób wymaga uwagi, choć średnia wynosi {m}.","T.profSel":"Poziom stanowisk","T.profUp":"{lv} – powyżej średniej organizacji: {a}.","T.profDown":"{lv} – poniżej średniej organizacji: {b}.","T.profFlat":"{lv}: wszędzie blisko średniej organizacji.","T.orgAvg":"średnia organizacji","T.subKey":"Najniższa składowa: {s} w wymiarze {d} ({v}).","T.timeDemo":"Przykład symulowany: ponowny pomiar cztery miesiące po warsztatach o współczuciu wobec siebie i flow.","T.timeKey":"Największa poprawa: {d} (+{x}). Najmniejsza zmiana: {d2} ({y}).","T.timeNone":"Ten widok będzie dostępny po ponownym pomiarze (3–6 miesięcy po warsztatach).","T.t1":"Pierwszy pomiar","T.t2":"Ponowny pomiar","T.rHow":"Każdy wynik mieści się w zakresie od 0 do 100. Kolor tła pokazuje przedział: czerwony – wymaga uwagi, żółty – średni, zielony – wysoki. To obraz stanu na dziś, a nie diagnoza.","T.ariaHome":"Strona główna","T.ariaNav":"Sekcje","T.ariaLang":"Język","T.tUnval":"Te pytania to nasze własne polskie tłumaczenie oryginalnych kwestionariuszy i nie zostały jeszcze osobno zwalidowane. Są punktowane tak samo; ich rzetelność sprawdzamy w pilotażu.","DIMS.compassion.n":"Współczucie wobec siebie","DIMS.compassion.q":"Gdy ponoszę porażkę lub mam trudności, czy traktuję siebie życzliwie, czy surowo?","DIMS.compassion.what":"Jak ludzie traktują siebie w chwilach porażki i bólu: życzliwie i z równowagą czy krytycznie i z przytłoczeniem.","DIMS.compassion.not":"To nie lenistwo, egoizm ani obniżanie własnych wymagań.","DIMS.compassion.b.0":"Samokrytyka jest silna. Błędy prawdopodobnie spotykają się z obwinianiem, izolacją i rozpamiętywaniem.","DIMS.compassion.b.1":"Czasem życzliwość, czasem surowość; pod presją przeważa obwinianie siebie.","DIMS.compassion.b.2":"Życzliwość i równowaga wobec siebie w trudnych chwilach; uczy się na błędach bez atakowania siebie.","DIMS.compassion.tips.0":"Po błędzie zapytaj: „Co usłyszałby ode mnie przyjaciel w tej sytuacji?” – i powiedz to sobie.","DIMS.compassion.tips.1":"Pamiętaj, że błędy są częścią doświadczenia każdego człowieka; nazwij uczucie, nie tonąc w nim.","DIMS.flex.n":"Elastyczność psychologiczna","DIMS.flex.q":"Czy trudne myśli i uczucia odciągają mnie od tego, co ważne?","DIMS.flex.what":"Na ile nieprzyjemne myśli i emocje przeszkadzają w życiu i pracy zgodnie z własnymi wartościami.","DIMS.flex.not":"Niski wynik to nie diagnoza; pokazuje zmaganie się z emocjami.","DIMS.flex.b.0":"Bolesne myśli i uczucia zajmują dużo miejsca i prawdopodobnie blokują ważne działania.","DIMS.flex.b.1":"Zmaganie z uczuciami czasem przeszkadza, ale praca zwykle idzie dalej.","DIMS.flex.b.2":"Potrafi iść w stronę tego, co ważne, nawet gdy uczucia są trudne.","DIMS.flex.tips.0":"Zamiast walczyć z myślą, powiedz „Mam myśl, że…” i zrób kolejny mały krok.","DIMS.flex.tips.1":"Codziennie zrób jedno małe działanie zgodne z Twoimi wartościami, nawet jeśli nie masz poczucia pełnej gotowości.","DIMS.optim.n":"Optymizm","DIMS.optim.q":"Czy ogólnie spodziewam się, że wszystko dobrze się ułoży?","DIMS.optim.what":"Ogólne oczekiwanie człowieka wobec przyszłości: dobre czy złe rzeczy.","DIMS.optim.not":"Nie dotyczy przyszłości organizacji ani zadowolenia z pracy; to dość stała cecha osobista.","DIMS.optim.b.0":"Dominuje oczekiwanie, że sprawy potoczą się źle; energia do dalszych prób może być mniejsza.","DIMS.optim.b.1":"Wyważone spojrzenie; ani bardzo pełne nadziei, ani pesymistyczne.","DIMS.optim.b.2":"Zwykle spodziewa się, że sprawy potoczą się dobrze; często wiąże się to z wytrwałością i lepszym zdrowiem.","DIMS.optim.tips.0":"Przez kilka minut napisz o swoim „najlepszym możliwym ja” za rok; w badaniach to ćwiczenie zwiększało optymizm.","DIMS.optim.tips.1":"Obok każdego zmartwienia zapisz plan „jeśli to się stanie, to…”.","DIMS.hope.n":"Nadzieja","DIMS.hope.q":"Czy mam cele, drogi do nich i energię, by ruszyć?","DIMS.hope.what":"Nadzieja w sensie naukowym: mieć cele, znajdować drogi do nich (ang. pathways) oraz mieć energię i wiarę, by je realizować (sprawczość, ang. agency).","DIMS.hope.not":"To nie to samo co optymizm; nadzieja dotyczy własnej zdolności do osiągnięcia celu.","DIMS.hope.b.0":"Mało dróg lub energii do osiągania celów; łatwiej o poczucie utknięcia.","DIMS.hope.b.1":"Cele i drogi są, ale energia spada, gdy pojawiają się przeszkody.","DIMS.hope.b.2":"Jasne cele, kilka dróg i wystarczająco energii; pozwala przewidywać lepsze wyniki w pracy.","DIMS.hope.tips.0":"Dla jednego ważnego celu zapisz co najmniej trzy różne drogi.","DIMS.hope.tips.1":"Użyj WOOP: życzenie (Wish), rezultat (Outcome), wewnętrzna przeszkoda (Obstacle) i plan „jeśli… to…” (Plan).","DIMS.belong.n":"Przynależność","DIMS.belong.q":"Czy czuję się częścią grupy i mam poczucie akceptacji?","DIMS.belong.what":"Ogólne poczucie przynależności i akceptacji w relacjach, w życiu i wśród innych.","DIMS.belong.not":"Nie dotyczy tylko miejsca pracy; mierzy przynależność w całym życiu.","DIMS.belong.b.0":"Silne poczucie bycia na uboczu lub odrzucenia; ważny czynnik wypalenia i odejść z pracy.","DIMS.belong.b.1":"Częściowa przynależność; w niektórych grupach tak, w innych nie.","DIMS.belong.b.2":"Poczucie akceptacji i więzi; ważny filar zdrowia psychicznego.","DIMS.belong.tips.0":"W tym tygodniu odbądź krótką rozmowę ze współpracownikiem, która nie dotyczy pracy.","DIMS.belong.tips.1":"Poproś kogoś o włączenie Cię do zadania lub planu; prośba o pomoc też buduje więź.","DIMS.flow.n":"Flow w pracy","DIMS.flow.q":"Czy pochłania mnie praca, czy sprawia mi radość i czy wykonuję ją dla niej samej?","DIMS.flow.what":"Flow w pracy w ostatnich dwóch tygodniach: pochłonięcie pracą, radość i motywacja wewnętrzna.","DIMS.flow.not":"Nie mierzy wysiłku ani liczby godzin, lecz jakość doświadczenia pracy.","DIMS.flow.b.0":"Praca mniej pochłania lub cieszy; być może jest często przerywana lub brakuje jej sensu.","DIMS.flow.b.1":"Flow i radość pojawiają się czasami, ale nie stale.","DIMS.flow.b.2":"Pochłonięcie, radość i motywacja wewnętrzna; wiąże się z lepszymi wynikami w pracy i poczuciem sensu.","DIMS.flow.tips.0":"Codziennie zarezerwuj 60–90 minut na skupioną pracę bez wiadomości i spotkań.","DIMS.flow.tips.1":"Przekształć jedną część swojej pracy, by lepiej pasowała do Twoich mocnych stron i zainteresowań (job crafting).","DIMS.ei.n":"Inteligencja emocjonalna","DIMS.ei.q":"Czy rozumiem swoje i cudze emocje i umiem nimi kierować?","DIMS.ei.what":"Jak ludzie oceniają swoje umiejętności rozumienia emocji i kierowania nimi u siebie i innych.","DIMS.ei.not":"Samoocena, a nie test zdolności; może różnić się od rzeczywistych umiejętności.","DIMS.ei.b.0":"Ocenia swoje umiejętności rozpoznawania emocji i kierowania nimi jako słabsze.","DIMS.ei.b.1":"Niektóre umiejętności emocjonalne są mocną stroną, inne słabszą.","DIMS.ei.b.2":"Ocenia się jako osobę, która potrafi rozumieć emocje i kierować nimi u siebie i innych.","DIMS.ei.tips.0":"Trzy razy dziennie nazwij swoje uczucie precyzyjnie („irytacja” zamiast „złe samopoczucie”).","DIMS.ei.tips.1":"Gdy współpracownik jest poruszony, najpierw nazwij to, co widzisz („wyglądasz na zmęczonego”), a potem zaproponuj rozwiązania.","DIMS.selfctrl.n":"Samokontrola","DIMS.selfctrl.q":"Czy opieram się pokusom i trzymam się celów długoterminowych?","DIMS.selfctrl.what":"Zdolność kontrolowania impulsów, opierania się pokusom i trwania przy celach długoterminowych.","DIMS.selfctrl.not":"Niski wynik nie oznacza słabej woli; otoczenie i nawyki odgrywają dużą rolę.","DIMS.selfctrl.b.0":"Pokusy i rozproszenia często wygrywają; otoczenie zawiera prawdopodobnie niekorzystne bodźce.","DIMS.selfctrl.b.1":"Zaangażowanie w niektórych obszarach, odkładanie na później w innych.","DIMS.selfctrl.b.2":"Zwykle trzyma się celów długoterminowych, głównie dzięki dobrym nawykom, a nie sile woli.","DIMS.selfctrl.tips.0":"Zaprojektuj otoczenie: podczas skupionej pracy odłóż telefon do innego pokoju.","DIMS.selfctrl.tips.1":"Połącz trudne zadanie z małą przyjemnością (np. ulubiony podcast tylko podczas spaceru).","WS.w-comp.t":"Współczucie wobec siebie i wewnętrzny krytyk","WS.w-comp.who":"Wszystkie poziomy; wersja dla menedżerów: przywództwo oparte na współczuciu","WS.w-comp.goals.0":"Rozpoznanie wewnętrznego krytyka i jego kosztów","WS.w-comp.goals.1":"Ćwiczenie trzech elementów współczucia wobec siebie: życzliwości wobec siebie, wspólnego człowieczeństwa i uważności","WS.w-comp.goals.2":"Radzenie sobie z błędami w zespole bez upokarzania","WS.w-comp.ev":"Metaanaliza 27 badań randomizowanych wykazała umiarkowany wpływ treningu współczucia wobec siebie na stres i samokrytykę.","WSLEN.w-comp":"2 × 3 godziny","WS.w-flex.t":"Elastyczność psychologiczna i regulacja emocji","WS.w-flex.who":"Wszystkie poziomy, zwłaszcza stanowiska pod dużą presją","WS.w-flex.goals.0":"Dystansowanie się od myśli bez walki z nimi","WS.w-flex.goals.1":"Doprecyzowanie wartości w pracy","WS.w-flex.goals.2":"Procesowy model regulacji emocji i cztery strategie proaktywne","WS.w-flex.ev":"Metaanaliza treningów akceptacji i zaangażowania (ACT) w miejscu pracy wykazała mały lub umiarkowany spadek stresu i dystresu, największy u pracowników biurowych.","WSLEN.w-flex":"2 × 3 godziny","WS.w-hope.t":"Nadzieja i realistyczny optymizm","WS.w-hope.who":"Wszystkie poziomy; dobre w okresach zmian w organizacji","WS.w-hope.goals.0":"Ćwiczenie „najlepsze możliwe ja”","WS.w-hope.goals.1":"WOOP i plany „jeśli… to…”","WS.w-hope.goals.2":"Zasada postępu: dostrzeganie małych sukcesów","WS.w-hope.ev":"WOOP (kontrastowanie mentalne z planami „jeśli… to…”) ma mały lub średni wpływ na osiąganie celów; ćwiczenie „najlepsze możliwe ja” nieznacznie zwiększa optymizm.","WSLEN.w-hope":"1 × 4 godziny","WS.w-belong.t":"Przynależność i więzi w pracy","WS.w-belong.who":"Zespoły razem ze swoimi przełożonymi","WS.w-belong.goals.0":"Rozmowy z nieznajomymi i szczere komplementy","WS.w-belong.goals.1":"Programy wdrożeniowe i programy opiekuna (buddy) dla nowych osób","WS.w-belong.goals.2":"Poczucie znaczenia (mattering): bycie dostrzeganym i wnoszenie wartości","WS.w-belong.ev":"Krótka interwencja wzmacniająca przynależność miała trwałe efekty w znanym badaniu; duża replikacja z 2023 r. pokazała, że efekt zależy od środowiska.","WSLEN.w-belong":"1 × 3 godziny + program zespołowy","WS.w-flow.t":"Głęboka praca, flow i odłączanie się od pracy","WS.w-flow.who":"Wszystkie poziomy; wersja dla menedżerów: ochrona czasu skupienia zespołu","WS.w-flow.goals.0":"Job crafting: samodzielne przekształcanie swojej pracy","WS.w-flow.goals.1":"Bloki skupienia bez przerw","WS.w-flow.goals.2":"Psychiczne odłączenie się od pracy po godzinach","WS.w-flow.ev":"Metaanalizy wiążą job crafting z większym zaangażowaniem w pracę, a odłączanie się po pracy z mniejszym wyczerpaniem; dowody te są w większości korelacyjne.","WSLEN.w-flow":"1 × 4 godziny","WS.w-ei.t":"Inteligencja emocjonalna w praktyce","WS.w-ei.who":"St h","PACKS.quick":"Krótka","PACKS.standard":"Pełna","INST.scs.name":"Skala współczucia wobec siebie – wersja skrócona","INST.scs.intro":"Jak zwykle traktujesz siebie w trudnych chwilach?","INST.scs.anchors.0":"Prawie nigdy","INST.scs.anchors.4":"Prawie zawsze","INST.scs.items.0":"Kiedy ponoszę porażkę w czymś ważnym dla mnie, pochłania mnie poczucie, że nie jestem wystarczająco dobry(-a).","INST.scs.items.1":"Staram się być wyrozumiały(-a) i cierpliwy(-a) wobec tych cech swojej osobowości, których nie lubię.","INST.scs.items.2":"Kiedy dzieje się coś bolesnego, staram się spojrzeć na sytuację w wyważony sposób.","INST.scs.items.3":"Kiedy czuję przygnębienie, zwykle mam wrażenie, że większość ludzi jest prawdopodobnie szczęśliwsza ode mnie.","INST.scs.items.4":"Staram się postrzegać swoje słabości jako część ludzkiej natury.","INST.scs.items.5":"Kiedy przechodzę przez bardzo trudny okres, okazuję sobie troskę i czułość, których potrzebuję.","INST.scs.items.6":"Kiedy coś mnie zdenerwuje, staram się zachować równowagę emocjonalną.","INST.scs.items.7":"Kiedy ponoszę porażkę w czymś ważnym dla mnie, zwykle czuję się w tej porażce osamotniony(-a).","INST.scs.items.8":"Kiedy czuję przygnębienie, mam skłonność do obsesyjnego skupiania się na wszystkim, co jest nie tak.","INST.scs.items.9":"Kiedy w jakiś sposób czuję, że nie jestem wystarczająco dobry(-a), staram się przypominać sobie, że większość ludzi miewa takie poczucie.","INST.scs.items.10":"Krytycznie i z dezaprobatą oceniam swoje wady i niedoskonałości.","INST.scs.items.11":"Jestem nietolerancyjny(-a) i niecierpliwy(-a) wobec tych cech swojej osobowości, których nie lubię.","INST.aaq.name":"Kwestionariusz akceptacji i działania II (AAQ-II)","INST.aaq.intro":"Na ile każde stwierdzenie jest prawdziwe w Twoim przypadku?","INST.aaq.anchors.0":"Nigdy prawdziwe","INST.aaq.anchors.6":"Zawsze prawdziwe","INST.aaq.items.0":"Moje bolesne doświadczenia i wspomnienia utrudniają mi prowadzenie życia, które byłoby dla mnie wartościo
