 </div>

<script>
(() => {
const $ = id => document.getElementById(id), L = window.LIB, BK = L.books;
const cv = $("cv"), ctx = cv.getContext("2d");

const WC = {psy: "#0a6b60", soc: "#2a6f7a", phil: "#5b4b8a", tabar: "#c45c26"};
const TYPEFA = {"primary-source": "منبع دست‌اول", "religious-political": "دینی/سیاسی", other: "سایر", scholarly: "پژوهشی", literature: "ادبی", history: "تاریخ", reference: "مرجع", "self-help": "خودیاری"};

const B = L.bounds; let cw = 0, chh = 0, dpr = 1, s0 = 1, dirty = true, anim = null; const view = {cx: (B[0] + B[2]) / 2, cy: (B[1] + B[3]) / 2, s: 1};
const CAP = 40;
// geometry of every spine
const spines = [];
function addSpines(list, fn, extra) { list.forEach((bi, k) => { const g = fn(k, list.length); spines.push(Object.assign({bi}, g, extra || {})); }); }
L.rooms.forEach(r => r.cases.forEach(c => { c.rows = Math.max(1, Math.ceil(c.b.length / CAP)); const w = (c.w - 14) / CAP; addSpines(c.b, k => { const row = Math.floor(k / CAP), col = k % CAP; return {x: c.x + c.w - 7 - (col + 1) * w, y: c.y + 8 + row * 38 + 2, w: w - 1, h: 30}; }, {w_: r.w, case: c}); }));
{ const t = L.table, n = Math.max(1, t.b.length); addSpines(t.b, (k) => { const a = k / n * 6.283 - 1.57, rr = t.r - 4; return {x: t.x + Math.cos(a) * rr, y: t.y + Math.sin(a) * rr, w: 7, h: 24, rot: a + 1.57}; }, {w_: "mix"}); }
{ const l = L.lobby, n = Math.max(1, l.b.length), w = Math.min(14, (l.w - 20) / n); addSpines(l.b, k => ({x: l.x + l.w - 10 - (k + 1) * w, y: l.y + 12, w: w - 1.5, h: 34}), {w_: "lobby"}); }
const wx = x => (x - cw / 2) / view.s + view.cx, wy = y => (y - chh / 2) / view.s + view.cy, sx = x => (x - view.cx) * view.s + cw / 2, sy = y => (y - view.cy) * view.s + chh / 2;
function resize() { const r = cv.getBoundingClientRect(); dpr = Math.min(2.5, devicePixelRatio || 1); cw = r.width; chh = r.height; cv.width = Math.round(cw * dpr); cv.height = Math.round(chh * dpr); const old = s0; s0 = Math.min(cw / (B[2] - B[0]), chh / (B[3] - B[1])); if (!old || old === 1) view.s = s0; else view.s *= s0 / old; dirty = true; }
const clampV = () => { view.s = Math.max(s0 * .8, Math.min(s0 * 40, view.s)); view.cx = Math.max(B[0], Math.min(B[2], view.cx)); view.cy = Math.max(B[1], Math.min(B[3], view.cy)); };
function fly(cx, cy, s, ms) { s = Math.max(s0 * .8, Math.min(s0 * 40, s)); if (anim) cancelAnimationFrame(anim); if (!ms || matchMedia("(prefers-reduced-motion: reduce)").matches) { view.cx = cx; view.cy = cy; view.s = s; clampV(); dirty = true; return; } const a = {...view}, t0 = performance.now(); const st = t => { let k = Math.min(1, (t - t0) / ms); k = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; view.cx = a.cx + (cx - a.cx) * k; view.cy = a.cy + (cy - a.cy) * k; view.s = a.s * Math.pow(s / a.s, k); dirty = true; if (k < 1) anim = requestAnimationFrame(st); }; anim = requestAnimationFrame(st); }
function zoomAt(px, py, f) { const x = wx(px), y = wy(py); view.s = Math.max(s0 * .8, Math.min(s0 * 40, view.s * f)); view.cx = x - (px - cw / 2) / view.s; view.cy = y - (py - chh / 2) / view.s; clampV(); dirty = true; }
let sel = null;
const rr = (x, y, w, h, r) => { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); };
function draw() {
  dirty = false; const z = view.s / s0, S = view.s; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.fillStyle = "#cdbf a6".replace(" ", ""); ctx.fillRect(0, 0, cw, chh);
  ctx.save(); ctx.translate(cw / 2 - view.cx * S, chh / 2 - view.cy * S); ctx.scale(S, S);
  // floor
  ctx.fillStyle = "#e3d8c3"; ctx.fillRect(B[0] + 20, B[1] + 20, B[2] - B[0] - 40, B[3] - B[1] - 40);
  ctx.strokeStyle = "rgba(120,100,70,.18)"; ctx.lineWidth = 1 / S; for (let x = 40; x < B[2]; x += 80) { ctx.beginPath(); ctx.moveTo(x, 20); ctx.lineTo(x, B[3] - 20); ctx.stroke(); }

  L.rooms.forEach(r => { ctx.fillStyle = WC[r.w]; ctx.globalAlpha = .14; ctx.fillRect(r.x, r.y, r.W, r.H); ctx.globalAlpha = 1; ctx.strokeStyle = "#6b5a3e"; ctx.lineWidth = 6; ctx.strokeRect(r.x, r.y, r.W, r.H); });
  // doors (gaps) drawn as floor colour over walls
  ctx.fillStyle = "#e3d8c3"; L.rooms.forEach(r => { const dx = r.x + (r.x < 500 ? r.W - 3 : -3), dy = r.y + (r.y < 500 ? r.H - 3 : -3); ctx.fillRect(dx - 3, r.y + r.H / 2 - 40, 12, 80); ctx.fillRect(r.x + r.W / 2 - 60, r.y < 500 ? r.y + r.H - 4 : r.y - 4, 120, 10); });
  // bookcases
  L.rooms.forEach(r => r.cases.forEach(c => { const bw = c.w, bh = c.h; ctx.fillStyle = "rgba(0,0,0,.14)"; rr(c.x + 3, c.y + 4, bw, bh, 5); ctx.fill(); ctx.fillStyle = "#8a6a43"; rr(c.x, c.y, bw, bh, 5); ctx.fill(); ctx.fillStyle = "#5b432a"; for (let k = 0; k < c.rows; k++) ctx.fillRect(c.x + 4, c.y + 6 + k * 38, bw - 8, 36); }));
  // table + lobby shelf + desk
  const T = L.table; ctx.fillStyle = "rgba(0,0,0,.14)"; ctx.beginPath(); ctx.arc(T.x + 4, T.y + 5, T.r + 12, 0, 6.283); ctx.fill(); ctx.fillStyle = "#8a6a43"; ctx.beginPath(); ctx.arc(T.x, T.y, T.r + 10, 0, 6.283); ctx.fill(); ctx.fillStyle = "#5b432a"; ctx.beginPath(); ctx.arc(T.x, T.y, T.r - 12, 0, 6.283); ctx.fill();
  const LB = L.lobby; ctx.fillStyle = "#8a6a43"; rr(LB.x, LB.y, LB.w, LB.h, 6); ctx.fill(); ctx.fillStyle = "#5b432a"; ctx.fillRect(LB.x + 5, LB.y + 7, LB.w - 10, 44);
  const D = L.desk; ctx.fillStyle = "#b99a6b"; rr(D.x - 90, D.y - 24, 180, 48, 10); ctx.fill(); ctx.strokeStyle = "#6b5a3e"; ctx.lineWidth = 3; ctx.stroke();
  // spines
  const near = z > 2.2;
  spines.forEach(sp => { const b = BK[sp.bi]; const isSel = sel && sel.t === "b" && sel.i === sp.bi; ctx.save(); if (sp.rot) { ctx.translate(sp.x, sp.y); ctx.rotate(sp.rot); ctx.fillStyle = b.ne === 0 ? "#8a8a8a" : TIERC[b.tier] || "#888"; ctx.fillRect(-sp.w / 2, -sp.h / 2, sp.w, sp.h); } else { ctx.fillStyle = b.ne === 0 ? "#8a8a8a" : TIERC[b.tier] || "#888"; ctx.fillRect(sp.x, sp.y, sp.w, sp.h); if (b.dec === "add-as-viewpoint") { ctx.fillStyle = "rgba(255,255,255,.55)"; ctx.fillRect(sp.x, sp.y, sp.w, Math.max(2.2, sp.h * .12)); } if (near && sp.w * S > 3.2) { ctx.save(); ctx.translate(sp.x + sp.w / 2, sp.y + sp.h - 1.5); ctx.rotate(-Math.PI / 2); ctx.fillStyle = "#fff"; ctx.font = `600 ${Math.min(sp.w * .68, 5.2)}px Vazirmatn, Tahoma, sans-serif`; ctx.textAlign = "left"; ctx.textBaseline = "middle"; ctx.direction = "rtl"; const fs_ = Math.min(sp.w * .68, 5.2), mc = Math.max(4, Math.floor((sp.h - 3) / (fs_ * .5))); const t = b.t.length > mc ? b.t.slice(0, mc - 1) + "…" : b.t; ctx.fillText(t, 0, 0); ctx.restore(); } } ctx.restore();
    if (isSel) { ctx.strokeStyle = "#111"; ctx.lineWidth = 2.5 / S; ctx.strokeRect(sp.x - 1, sp.y - 1, sp.w + 2, sp.h + 2); } });
  ctx.restore();
  // labels (screen space)
  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic"; ctx.direction = "rtl";
  L.rooms.forEach(r => { const x = sx(r.x + r.W / 2), y = sy(r.y + 36); ctx.font = `800 ${Math.max(15, Math.min(46, 54 * S / s0 * s0))}px Vazirmatn, Tahoma, sans-serif`; ctx.lineWidth = 5; ctx.strokeStyle = "rgba(255,255,255,.8)"; ctx.fillStyle = WC[r.w]; const t = "تالار " + r.name; const fs = Math.max(15, Math.min(40, 42 * S)); ctx.font = `800 ${fs}px Vazirmatn, Tahoma, sans-serif`; ctx.strokeText(t, x, y); ctx.fillText(t, x, y);
    r.cases.forEach(c => { if (S < s0 * 1.5 && true) { } const fs2 = Math.max(10, Math.min(22, 17 * S)); if (c.w * S < 60) return; ctx.font = `700 ${fs2}px Vazirmatn, Tahoma, sans-serif`; const xx = sx(c.x + c.w / 2), yy = sy(c.y) - 6 * Math.min(1, S); ctx.lineWidth = 4; ctx.strokeStyle = "rgba(255,255,255,.85)"; ctx.fillStyle = "#3d2f1a"; const label = c.title + (c.b.length ? "" : " · هنوز کتابی ندارد"); ctx.strokeText(label, xx, yy); ctx.fillText(label, xx, yy); }); });
  const lab = (t, x, y, f) => { ctx.font = `700 ${Math.max(11, Math.min(26, f * S))}px Vazirmatn, Tahoma, sans-serif`; ctx.lineWidth = 4; ctx.strokeStyle = "rgba(255,255,255,.85)"; ctx.fillStyle = "#3d2f1a"; ctx.strokeText(t, sx(x), sy(y)); ctx.fillText(t, sx(x), sy(y)); };
  lab("میز میان‌رشته‌ای: کتاب‌هایی که چند ویکی را لمس می‌کنند", L.table.x, L.table.y + L.table.r + 34, 20); lab("قفسهٔ در انتظار · کتاب‌هایی که هنوز مدخلی از آن‌ها نداریم", LB.x + LB.w / 2, LB.y - 10, 19); lab("پیشخوان راهنما", D.x, D.y + 6, 20);
  // guide signs on corridors
  const sign = (t, x, y) => { ctx.font = `600 ${Math.max(10, Math.min(18, 15 * S))}px Vazirmatn, Tahoma, sans-serif`; const w = ctx.measureText(t).width + 18, X = sx(x), Y = sy(y); ctx.fillStyle = "#1f5f55"; rr(X - w / 2, Y - 13, w, 24, 6); ctx.fill(); ctx.fillStyle = "#fff"; ctx.fillText(t, X, Y + 4); };
  const m = 60 + 900 + 130; sign("← جامعه‌شناسی", m - 100, 60 + 280); sign("فلسفه →", m + 100, 60 + 280); sign("← روان‌شناسی", m - 100, 60 + 560 + 250 + 280); sign("تبار و ژنتیک →", m + 100, 60 + 560 + 250 + 280);
  const z2 = view.s / s0; $("where").textContent = whereAmI();
}
function whereAmI() { const x = view.cx, y = view.cy; for (const r of L.rooms) if (x > r.x && x < r.x + r.W && y > r.y && y < r.y + r.H) { for (const c of r.cases) if (x > c.x - 20 && x < c.x + c.w + 20 && y > c.y - 30 && y < c.y + c.h + 20) return `تالار ${r.name} › قفسهٔ ${c.title}`; return `تالار ${r.name}`; } const t = L.table; if (Math.hypot(x - t.x, y - t.y) < t.r + 40) return "میز میان‌رشته‌ای"; if (y > L.lobby.y - 40) return "سالن ورودی"; return "راهرو · " + faN(BK.length) + " کتاب در کل"; }
function loop() { if (dirty) draw(); requestAnimationFrame(loop); }
// ---------- panel ----------
const bookHtml = i => { const b = BK[i]; return `<span class="badge t" style="background:${b.ne === 0 ? "#8a8a8a" : TIERC[b.tier] || "#888"}">${b.ne === 0 ? "مدخلی ندارد" : "ردهٔ " + faN(b.tier) + " · " + (TIERT[b.tier] || "")}</span><span class="badge">${esc(TYPEFA[b.ty] || b.ty)}</span><span class="badge">${esc(DECFA[b.dec] || b.dec)}</span><h2>${esc(b.t)}</h2><p class="note">${esc(b.a)} · ${esc(b.y)}</p><p>${esc(b.lab)}</p>${b.best ? `<h3>بهترین استفاده</h3><p>${esc(b.best)}</p>` : ""}${b.cau.length ? `<h3>احتیاط‌ها</h3><ul>${b.cau.map(c => `<li>${esc(c)}</li>`).join("")}</ul>` : ""}${b.rs.length ? `<h3>چرا این ردّه؟</h3><ul>${b.rs.map(c => `<li>${esc(c)}</li>`).join("")}</ul>` : ""}${b.en.length ? `<h3>مدخل‌هایی که از این کتاب ساخته شد (${faN(b.ne)})</h3><div class="lst">${b.en.map(e => `<a href="../${esc(e[1])}"><span>${esc(e[0])}</span><small>${esc({psy: "روان", soc: "جامعه", phil: "فلسفه", tabar: "تبار"}[e[2]] || e[2])}</small></a>`).join("")}</div>` : `<p class="note">${esc(b.why || "")}</p>`}`; };
function intro() { const on = L.rooms.map(r => `<button data-r="${r.w}"><span>تالار ${esc(r.name)}</span><small>${faN(r.cases.reduce((a, c) => a + c.b.length, 0))} کتاب · ${faN(r.cases.length)} قفسه</small></button>`).join(""); const empty = L.rooms.flatMap(r => r.cases.filter(c => !c.b.length).map(c => `${c.title} (${r.name})`)); $("panel").innerHTML = `<h2>کتابخانهٔ جهان دانش</h2><p>تصور کنید از بالا به یک کتابخانهٔ واقعی نگاه می‌کنید. هر تالار یک ویکی است، هر قفسه یک رشته، و هر عطف یک کتاب. رنگ عطف ردهٔ اعتبار کتاب است. زوم کنید تا نام کتاب‌ها روی عطف‌ها پیدا شود؛ روی یک عطف بزنید تا برگهٔ کتاب باز شود.</p><div class="lst">${on}<button data-t="1"><span>میز میان‌رشته‌ای</span><small>${faN(L.table.b.length)} کتاب</small></button><button data-l="1"><span>قفسهٔ در انتظار</span><small>${faN(L.lobby.b.length)} کتاب</small></button></div><h3>جاهای خالی</h3><p class="note">${faN(empty.length)} قفسه هنوز کتابی ندارند و روی نقشه با «هنوز کتابی ندارد» مشخص شده‌اند. تالار روان‌شناسی بیشترین قفسهٔ خالی را دارد، چون کتاب‌های این پوشه بیشتر دربارهٔ جامعه، فلسفه و ایران‌اند.</p><p class="note">این نقشه فقط ${faN(BK.length)} کتاب اول را نشان می‌دهد؛ دسته‌های بعدی بعد از بازبینی اضافه می‌شوند. جای قفسه‌ها قراردادی است؛ جای هر کتاب از روی مدخل‌هایی که از آن ساخته شده تعیین شده.</p>`; }
const openBook = (i, f) => { sel = {t: "b", i}; dirty = true; $("panel").innerHTML = bookHtml(i); const sp = spines.find(s => s.bi === i); if (f && sp) fly(sp.x, sp.y, s0 * 12, 800); };
function flyRoom(w) { const r = L.rooms.find(x => x.w === w); fly(r.x + r.W / 2, r.y + r.H / 2, Math.min(cw / (r.W * 1.08), chh / (r.H * 1.15)), 800); }
document.addEventListener("click", e => { const b = e.target.closest("[data-r],[data-t],[data-l],[data-b]"); if (!b) return; if (b.dataset.r) flyRoom(b.dataset.r); else if (b.dataset.t) fly(L.table.x, L.table.y, s0 * 4, 800); else if (b.dataset.l) fly(L.lobby.x + L.lobby.w / 2, L.lobby.y + 30, s0 * 4, 800); });
// ---------- input ----------
function hitBook(px, py) { const x = wx(px), y = wy(py); let best = null; for (const sp of spines) { if (sp.rot) { if (Math.hypot(sp.x - x, sp.y - y) < 9) best = sp; } else if (x >= sp.x - .6 && x <= sp.x + sp.w + .6 && y >= sp.y && y <= sp.y + sp.h) best = sp; } return best; }
const ptrs = new Map(); let moved = 0, pd = 0;
cv.addEventListener("wheel", e => { e.preventDefault(); const r = cv.getBoundingClientRect(); if (anim) cancelAnimationFrame(anim); zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * (e.deltaMode === 1 ? .04 : .0009))); }, {passive: false});
cv.addEventListener("pointerdown", e => { ptrs.set(e.pointerId, [e.clientX, e.clientY]); moved = 0; if (anim) cancelAnimationFrame(anim); if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pd = Math.hypot(a[0] - b[0], a[1] - b[1]); } });
cv.addEventListener("pointermove", e => { const r = cv.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
  if (!ptrs.has(e.pointerId)) { const h = hitBook(px, py), tip = $("tip"); cv.classList.toggle("hit", !!h); if (h) { tip.textContent = BK[h.bi].t; tip.style.display = "block"; tip.style.left = Math.min(px + 14, cw - 220) + "px"; tip.style.top = py + 14 + "px"; } else tip.style.display = "none"; return; }
  const prev = ptrs.get(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (ptrs.size === 1) { const dx = e.clientX - prev[0], dy = e.clientY - prev[1]; moved += Math.abs(dx) + Math.abs(dy); if (moved > 6) { cv.classList.add("drag"); try { cv.setPointerCapture(e.pointerId); } catch (_) {} view.cx -= dx / view.s; view.cy -= dy / view.s; clampV(); dirty = true; } }
  else if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]); moved = 99; if (pd) zoomAt((a[0] + b[0]) / 2 - r.left, (a[1] + b[1]) / 2 - r.top, d / pd); pd = d; } });
const up = e => { const was = ptrs.size === 1 && moved <= 6 && ptrs.has(e.pointerId); ptrs.delete(e.pointerId); pd = 0; cv.classList.remove("drag"); if (was && e.type === "pointerup") { const r = cv.getBoundingClientRect(), h = hitBook(e.clientX - r.left, e.clientY - r.top); if (h) openBook(h.bi, false); else { const x = wx(e.clientX - r.left), y = wy(e.clientY - r.top); for (const rm of L.rooms) { for (const c of rm.cases) if (x > c.x && x < c.x + c.w && y > c.y - 24 && y < c.y + c.h) { fly(c.x + c.w / 2, c.y + c.h / 2, Math.min(cw / (c.w * 1.15), 9 * s0), 700); return; } if (x > rm.x && x < rm.x + rm.W && y > rm.y && y < rm.y + rm.H) { flyRoom(rm.w); return; } } } } };
cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up); cv.addEventListener("pointerleave", () => { $("tip").style.display = "none"; });
cv.addEventListener("dblclick", e => { const r = cv.getBoundingClientRect(); zoomAt(e.clientX - r.left, e.clientY - r.top, 2); });
const step = f => zoomAt(cw / 2, chh / 2, f); $("zi").onclick = () => step(1.8); $("zo").onclick = () => step(1 / 1.8); $("hm").onclick = () => { sel = null; intro(); fly((B[0] + B[2]) / 2, (B[1] + B[3]) / 2, s0, 700); };
cv.addEventListener("keydown", e => { const k = e.key, d = 60 / view.s; if (k === "+" || k === "=") step(1.5); else if (k === "-") step(1 / 1.5); else if (k === "ArrowLeft") view.cx -= d; else if (k === "ArrowRight") view.cx += d; else if (k === "ArrowUp") view.cy -= d; else if (k === "ArrowDown") view.cy += d; else return; e.preventDefault(); clampV(); dirty = true; });
// search
$("q").addEventListener("input", e => { const q = norm(e.target.value).trim(), box = $("res"); if (q.length < 2) { box.hidden = true; return; } const hits = BK.map((b, i) => [i, norm(b.t + " " + b.a)]).filter(x => x[1].includes(q)).slice(0, 8); box.innerHTML = hits.length ? hits.map(([i]) => `<button data-s="${i}"><span>${esc(BK[i].t.slice(0, 60))}</span><small>${esc(BK[i].a)}</small></button>`).join("") : '<button disabled><span>کتابی پیدا نشد</span></button>'; box.hidden = false; });
$("res").addEventListener("click", e => { const b = e.target.closest("[data-s]"); if (!b) return; $("res").hidden = true; $("q").value = ""; openBook(+b.dataset.s, true); });
resize(); intro(); loop(); addEventListener("resize", resize);
})();
</script>
</body>
