ry-source","tier":3,"dec":"add","lab":"منبع اولیهٔ کهن و بسیار مهم، اما نه گزارش دقیق؛ برای فهم نگاه یونانیان قرن پنجم ارزشمند و برای حقیقت رویدادها و ادعاهای مربوط به ایران و مصر باید با شواهد باستان‌شناسی و کتیبه‌ها سنجیده شود.","best":"برای دیدن چگونگی نگاه یونانیان به ایرانیان و مصریان، روایت‌های رایج در زمان او، و سرنخ‌هایی برای پژوهش بیشتر. نه برای شمار سپاه، سال‌شمار دقیق، یا جزئیات دربار هخامنشی بدون سنجش با منابع دیگر.","cau":["نسخه و مترجم مشخص نیست؛ برای استناد دانشگاهی ترجمهٔ شناخته‌شده و شمارهٔ بند (کتاب و بخش) را بیاورید.","شمار سپاه‌ها و برخی داستان‌های درباری اغراق‌آمیز یا افسانه‌ای است.","دیدگاه او یونانی‌محور است؛ دربارهٔ هخامنشیان از منابع خود ایرانی (کتیبه‌ها، لوح‌ها) باید کمک گرفت."],"rs":["هرودوت نخستین نویسندهٔ بزرگ تاریخ‌نگاری غربی است و کتابش مهم‌ترین گزارش پیوسته دربارهٔ جنگ‌های ایران و یونان و جهان شناخته‌شدهٔ آن زمان است.","او بیشتر از روایت شفاهی، شنیده‌ها و گفته‌های راهنمایان و کاهنان بهره می‌برد و خودش میان دیده و شنیده فرق می‌گذارد، ولی مرز همیشه روشن نیست.","نگارش بیش از ۲۴۰۰ سال پیش است و ارجاع و روش به معنای امروزی ندارد."],"why":"منبع اولیهٔ بنیادین است؛ مدخل‌ها بر پایهٔ دانش مطمئن دربارهٔ اثر نوشته شده‌اند نه متن این فایل، و ادعاهای مربوط به ایران و مصر با پژوهش امروز سنجیده شده است.","en":[],"ne":3,"ws":[]},{"n":"b06","t":"تراوش اندیشه در پیرامون فرهنگ","a":"نامشخص (در متنِ خوانده‌شده نام نویسنده نیامده؛ «استاد» در پیش‌گفتار نام‌برده نشده)","y":"2008","ty":"religious-political","tier":4,"dec":"add-as-viewpoint","lab":"مجموعه‌مقالات جدلی و ایدئولوژیک (ایران‌گرا و ضدشریعت) بدون ارجاع؛ برای فهم اندیشهٔ نویسنده سودمند است، نه برای ادعاهای دینی‌ـ‌تاریخی.","best":"منبع اولیه برای شناخت یک جریان فکری ایران‌گرا و ضدشریعت در برون‌مرز؛ برای حقیقت تاریخی، دین‌شناسی یا ادعاهای علمی منبع مناسبی نیست.","cau":["نقل مطالب فقط به‌عنوان دیدگاه نویسنده","نوشتار درباره‌ی دین‌داران تعمیمی و گاه تحقیرآمیز است","متن دریافتی ناقص و دارای آشفتگی ترتیب حروف بود؛ دقت نقل محدود است"],"rs":["نام نویسنده در متن خوانده‌شده نیامده و صلاحیت او قابل سنجش نیست"," م، طبری، واقدی، ابن‌سعد، حدیث بخاری) ارجاع می‌دهد که نکتهٔ مثبتی است؛ اما در بخش خوانده‌شده، ارزیابی منتقدانهٔ سند و گزینش روایات از پژوهش‌های دانشگاهی (مانند وات، رودنسون، موتسکی) دیده نمی‌شود.","(ج) عنوان و چارچوب کتاب (نامتسامح‌ترین دین جهان) از پیش داوری روشنی دارد و هدف آن سیاست‌گذاری پس از ۲۰۰۱ است، نه روایت بی‌طرف."],"why":"کتاب پژوهش دانشگاهی نیست، اما به‌عنوان نمونهٔ یک دیدگاه شناخته‌شده و برای بحث دربارهٔ مشکل منابع زندگی‌نامهٔ محمد قابل ثبت است. فقط دو مدخل با پرچم «مورد مناقشه» و یادداشت نظر پژوهش دانشگاهی افزوده می‌شود.","en":[["مسئلهٔ منابع برای شناخت محمد تاریخی","phil/#muhammad-biography-sources-problem","phil"],["اسپنسر: محمد و جهاد در بحث سیاست غرب پس از ۱۱ سپتامبر","soc/#spencer-muhammad-political-thesis","soc"]],"ne":2,"ws":["phil","soc"]},{"n":"b08","t":"فرهنگنامهٔ شعری بر اساس آثار شاعران قرن سوم تا یازدهم هجری (ترکیبات، کنایات و اصطلاحات)، جلد سوم","a":"رحیم عفیفی","y":"۱۳۷۲ (چاپ اول)؛ چاپ سوم ۱۳۹۱","ty":"reference","tier":3,"dec":"add","lab":"فرهنگ مرجع معتبر برای معنای کنایه‌ها و ترکیب‌های شعر کلاسیک فارسی، با شاهد و ارجاع به دیوان‌ها؛ نه منبعی برای ادعاهای تاریخی یا علمی.","best":"برای فهم معنای رایج یک کنایه یا اصطلاح در شعر قرن ۳ تا ۱۱ و دیدن شاهدهای آن؛ برای واژگان و تصویرهای ثابت (مثل عالم اصغر، عاشق‌کش) خوب است. برای تاریخ اندیشه، فلسفه یا حکم دربارهٔ باور شاعران منبع مناسبی نیست.","cau":["فقط بخش کوچکی از جلد ۳ (آغاز حرف ع) دیده شد؛ داوری دربارهٔ کل جلد بر پایهٔ شناسنامه و نمونه است.","تعریف‌ها مختصرند و گاهی عرفانی/سنتی‌اند؛ برای متن‌های خاص باید شرح‌ها را دید.","فهرست شعرها و شاهدها ارزش ویکی ندارد و بازنویسی نشد."],"rs":["مؤلف دانشگاهی (دکتر رحیم عفیفی، استاد ادبیات فارسی) و ناشر شناخته‌شده؛ کتابنامهٔ بلند (حدود ۱۵ صفحه) و فهرست‌نویسی ملی دارد.","هر مدخل با بیت شاهد و ارجاع به دیوان و شماره صفحه همراه است؛ روش مرجع‌نویسی روشن است.","چاپ سوم و تجدیدچاپ در ۱۳۹۱؛ اما واژه‌نامه است نه پژوهش تحلیلی، پس معنی‌ها را باید با تفسیرها و فرهنگ‌های دیگر هم سنجید."],"why":"کتاب مرجع ادبی معتبری است ولی مثل هر فرهنگ لغت، فقط الگوهای مفهومی (واژگا لی فلسفهٔ شوپنهاور و جای او میان کانت، هگل و نیچه مناسب است. برای جزئیات استدلال، تاریخ دقیق اثرپذیری (فروید، ویتگنشتاین، نیچه) یا ارزیابی آموزه‌ها باید به متن خود شوپنهاور و پژوهش‌های دانشگاهی (مثل راهنماهای کمبریج) مراجعه کرد.","cau":["تعمیم‌ها و تعبیرهای طنزآمیز نویسنده را باید دیدگاه او دانست، نه واقعیت مسلم.","دربارهٔ اثر شوپنهاور بر فروید و ویتگنشتاین و «وارونه‌سازی» اراده توسط نیچه، کتاب خلاصه‌گویی می‌کند؛ این‌ها در پژوهش‌ها بحث‌برانگیزتر و پیچیده‌ترند.","ترجمهٔ فارسی گاهی نشانه‌گذاری آشفته دارد (متن استخراج‌شده از PDF)؛ جزئیات نباید صرفاً از روی آن نقل شود."],"rs":["کتابی ۶۴ صفحه‌ای از مجموعهٔ «فیلسوفان در ۹۰ دقیقه» است و ناشر فارسی هم آن را مدخلی ساده و کوتاه برای نوآموزان معرفی می‌کند.","استراترن نویسندهٔ پرکار آثار مردم‌پسند دربارهٔ تاریخ فلسفه و علم است، نه پژوهشگر تخصصی شوپنهاور؛ کتاب ارجاع پانویسی‌شدهٔ دقیق ندارد.","خواندن متن نشان می‌دهد لحن طنزآمیز و داوری‌های شخصی فراوان دارد (مثلاً دربارهٔ شخصیت شوپنهاور و هگل) که با گزارش بی‌طرفانهٔ دانشگاهی فرق دارد."],"why":"کتاب مدخلی مقدماتی ولی سالم و خوانا است؛ سه مدخل فلسفی دربارهٔ اندیشهٔ شوپنهاور و یک مدخل دربارهٔ زندگی و بازتاب او با نشانه‌گذاری محدودیت‌ها افزوده می‌شود. هیچ مدخل موجودی برای شوپنهاور در دانش‌سرا پیدا نشد (جست‌وجو در درس‌ها، خروجی‌های پیشین و فهرست شناسه‌ها).","en":[["شوپنهاور: جهان همچون اراده و تصور","phil/#schopenhauer-world-as-will","phil"],["شوپنهاور: بدبینی، شفقت و رهایی از اراده","phil/#schopenhauer-pessimism-renunciation","phil"],["شوپنهاور و دولت: پوزه‌بند برای حیوان درنده","phil/#schopenhauer-state-muzzle","phil"],["شوپنهاور: زندگی، گمنامی و اثرگذاری دیرهنگام","phil/#schopenhauer-life-reception","phil"]],"ne":4,"ws":["phil"]},{"n":"b45","t":"هزار مغز: نظریه‌ای جدید برای هوش (A Thousand Brains: A New Theory of Intelligence)","a":"Jeff Hawkins (جف هاوکینز)","y":"نامشخص در فایل (اصل انگلیسی: ۲۰۲۱)","ty":"other","tier":3,"dec":"skip","lab":"حدس از عنوان و جلد؛ خوانده نشد: کتابی عمومی‌نویس از یک کارآفرین-پژوهشگر مغز دربارهٔ نظریه‌ای که هنوز محل بحث است.","best":"ارزیابی نشد؛ از روی د ,"best":"منبع خوبی برای فهم نظریهٔ قدرتِ شارپ، فهرست روش‌ها و منطق راهبردی جنبش‌های بی‌خشونت؛ منبع کافی برای اینکه مبارزهٔ بی‌خشونت «همیشه کارساز است» یا برای تحلیل موردهای تاریخی خاص نیست.","cau":["ادعای کارآمدی را با پژوهش‌های تجربی (چنووث و استفان، نپستاد) بسنجید","تأثیر ادعایی کتاب بر جنبش‌های مشخص (مثلاً صربستان، مصر) را نباید به‌عنوان علت قطعی گرفت","نسخهٔ فارسی ترتیب سطرها را در استخراج متن به‌هم‌ریخته داشت؛ برداشت من از بخش‌های خوانده‌شده محتاطانه است"],"rs":["نویسنده (۱۹۲۸–۲۰۱۸) پژوهشگر علوم سیاسی و از نظریه‌پردازان اصلی کنش بی‌خشونت است و کتاب بر پایهٔ کار چندین‌سالهٔ او نوشته شده","متن کوتاه، رساله‌ای و توصیه‌محور است، نه پژوهش تجربی؛ ارجاع و آمار مستقیم در آن اندک است و مثال‌ها گزینشی‌اند","نوشته برای فعالان مخالف دیکتاتوری (به‌ویژه برمه) و با هدف ترغیب است؛ لحن هوادارانه دارد"],"why":"کتاب راهبردی-هوادارانه است؛ برای اندیشهٔ خود شارپ منبع اولیه است. مدخل‌ها اندیشهٔ او را به‌عنوان دیدگاه نویسنده نقل می‌کنند و ادعاهای تجربی با پژوهش‌های داوری‌شده سنجیده شده‌اند.","en":[["نظریهٔ رضایت در قدرت: دیکتاتور به همکاری مردم وابسته است","soc/#consent-theory-of-power","soc"],["مبارزهٔ بی‌خشونت شارپ: روش‌ها، سازوکارها و جوجیتسوی سیاسی","soc/#nonviolent-action-methods-mechanisms","soc"],["برنامه‌ریزی راهبردی برای رهایی از دیکتاتوری و پیشگیری از استبداد تازه","soc/#strategic-planning-resistance","soc"],["خطرات مذاکره با دیکتاتور از موضع ضعف (دیدگاه شارپ)","soc/#negotiation-limits-dictatorship","soc"]],"ne":4,"ws":["soc"]},{"n":"b57","t":"بحثی پیرامون زندگانی و فعالیت روحانیان بزرگ عصر ساسانی (روحانیان بزرگ عصر ساسانی)","a":"علاءالدین آذری","y":"نامشخص (مقاله در «بررسی‌های تاریخی»، سال نهم، شمارهٔ ۶؛ احتمالاً دههٔ ۱۳۵۰ خورشیدی)","ty":"history","tier":3,"dec":"add","lab":"مقالهٔ مروری یک مورخ دانشگاهی دههٔ ۱۳۵۰ که بیشتر از منابع ثانویهٔ معتبر (کریستن‌سن، ماسه، معین، پورداود) نقل می‌کند؛ برای مرور کلی خوب است، نه برای جزئیات تازه یا داوری نهایی.","best":"مرور فارسی و روشن از مراتب روحانیان زرتشتی و فهرست موبدان‌موبدان مشهور و نقششان در سیاست ساسانی. برای تحلیل مدرن دین و ست و مقاله در یک نشریهٔ تخصصی ادیان چاپ شده؛ وضعیت داوری روشن نیست، پس رتبهٔ ۲ داده نشد.","(ب) ارجاع دارد: دایرةالمعارف دین الیاده (۱۹۸۷)، دایرةالمعارف دین و اخلاق هستینگز، دویسن، رادهاکریشنان، داسگوپتا، کیث، مکدانل، ترجمه‌های گریفیث و ماکس‌مولر؛ اما روش مشخصی ندارد و بیشتر مرور منابع ثانویه است.","(ج) روزآمدی: بسیاری از منابع از ۱۸۹۰ تا ۱۹۲۵ هستند (گاف، گارب، مکدانل، دویسن، کیث) و پژوهش‌های تازه‌تر دربارهٔ ظهور سمساره و کرمه (مثل بحث «ماگادهای بزرگ») نیامده است."],"why":"مقالهٔ دانشگاهی توصیفی است و برای مرور سیر زندگی پس از مرگ و تناسخ در متن‌های هندو سودمند است، اما به منابع قدیمی تکیه دارد و در بحث خاستگاه نتیجه‌ای محل مناقشه می‌گیرد؛ پس چهار مدخل با ردهٔ ۳ و پرچم‌های مناقشه و یادداشت ویراستار در جاهای لازم افزوده می‌شود.","en":[["تناسخ: واژه‌ها و پیش‌فرض‌های اصلی","phil/#reincarnation-terms-and-premises","phil"],["زندگی پس از مرگ در ودا و برهمنه‌ها: پدران، خدایان و پاداش آیین","phil/#vedic-afterlife-fathers-and-gods","phil"],["کرمه، سمساره و رهایی در اوپنیشدها و بهگود گیتا: دو راه پس از مرگ","phil/#upanishadic-karma-samsara-two-paths","phil"],["خاستگاه تناسخ در هند: بحث بومی یا آریایی و ادعای مقاله","phil/#origin-debate-hindu-reincarnation","phil"]],"ne":4,"ws":["phil"]},{"n":"b105","t":"تاریخ ناگفتهٔ حرمسراهای ایرانی","a":"نامشخص (گردآوری و تنظیم متنیِ یک مجموعه‌برنامهٔ رادیویی/تلویزیونی با عنوان «حرمسرا»؛ نام گردآورنده در متن نیست)","y":"نامشخص (فایل PDF سال ۲۰۰۷ میلادی ساخته شده)","ty":"history","tier":4,"dec":"add-as-viewpoint","lab":"متن عامه‌پسند و روایی دربارهٔ حرمسرای قاجار، بی‌نام‌نویسنده و بدون ارجاع دقیق؛ برای آشنایی اولیه و نقل بازتاب‌های دوران قاجار سودمند است، نه به‌عنوان منبع مستند تاریخی.","best":"برای دیدن تصویر رایج و ادبی/رسانه‌ای از حرمسرای قاجار، فهرست نام‌ها و ردیف‌های حرمسرا، آداب و سرگرمی‌ها و معرفی منابع بیشتر مفید است؛ برای شمار دقیق، رخدادهای مشخص (مثل مسابقهٔ نرم‌تنان یا نحوهٔ مرگ اعتمادالدوله) یا تحلیل علل تاریخی مناسب نیست.","cau":["نام نویسنده و منبع چاپی مشخص نیست.","ادعاهای آماری و رخدادهای خاص بی‌ارجاع‌اند و گاه با هم ناهماهنگ‌ ی است.","فصل آغازین صحنه‌ای رمانی از یک رهبر کلیسای انجیلی در آتلانتاست؛ بدون ارجاع یا روش پژوهشی.","نویسنده و ناشر در متن خوانده‌شده معرفی دقیق نشده‌اند؛ نسخه از کانال اشتراک‌گذاری غیررسمی است."],"why":"رمان تخیلی است؛ محتوای واقعی-علمی‌ای برای افزودن به ویکی‌های دانش‌سرا ندارد و فقط بخش کوچکی از آن خوانده شد. مدخلی که به ادعاهای واقعی تکیه کند از آن درنمی‌آید.","en":[],"ne":0,"ws":[]},{"n":"b108","t":"چین و ژاپن (Ιαπωνία–Κίνα؛ در ترجمهٔ فارسی: «چین و ژاپن»)","a":"نیکوس کازانتزاکیس (Nikos Kazantzakis، ۱۸۸۳–۱۹۵۷)","y":"سفر ۱۹۳۵؛ نخستین انتشار یونانی ۱۹۳۸ طبق یادداشت مترجم؛ ترجمهٔ فارسی ۱۳۷۹ (۲۰۰۰)","ty":"memoir","tier":4,"dec":"add-as-viewpoint","lab":"سفرنامهٔ ادبی و خاطره‌وار یک نویسندهٔ بزرگ؛ منبع اولیهٔ خوب برای نگاه کازانتزاکیس و تصور اروپاییان دههٔ ۱۹۳۰، اما نه منبعی معتبر برای واقعیت‌های ژاپن و چین.","best":"برای شناخت اندیشه و سبک کازانتزاکیس، تصور اروپایی‌های میان‌دو‌جنگ از آسیا، و حال‌وهوای ژاپن ۱۹۳۵ به‌عنوان منبع اولیهٔ ادبی خوب است؛ برای آمار، تاریخ، دین‌پژوهی یا جامعه‌شناسی ژاپن و چین منبع مناسبی نیست و باید با پژوهش دانشگاهی سنجیده شود.","cau":["نقل‌قول‌های شخصیت‌ها (مثل کاوایاما یا کارخانه‌دار) را سخن نویسنده‌ی کتاب یا واقعیت تاریخی نگیرید","عددها و سال‌ها در متن استخراج‌شده ممکن است خطای OCR داشته باشند","بخش چین و بخش‌های بعدی ژاپن خوانده نشد؛ دربارهٔ آن‌ها حکمی داده نمی‌شود"],"rs":["نویسنده صلاحیت ادبی و فلسفی دارد ولی پژوهشگر ژاپن‌شناس نیست و با زبان ژاپنی ناآشنا بوده است (خودش می‌گوید چند واژه می‌دانست)","بیشتر محتوا تجربهٔ شخصی، گفت‌وگوهای نقل‌شده و برداشت‌های لحظه‌ای است؛ ارجاع و روش پژوهشی ندارد و عددها (مثل دستمزد) بی‌سند آمده‌اند","سفر در ۱۹۳۵ بوده؛ اطلاعات زمینه‌ای (تاریخ، دین، اقتصاد) قدیمی‌اند و نویسنده و گاه شخصیت‌های گفت‌وگو اشتباه یا کلی‌گویی دارند"],"why":"کتاب کم‌ارجاع و ادبی-خاطره‌وار است و ادعاهای واقعی‌اش نیازمند بررسی؛ اما مصاحبه‌ها و دیده‌های آن، به‌عنوان دیدگاه یک نویسندهٔ مهم، برای دانش‌سرا ارزش دارد. سه مدخل با پرچم contested و یادداشت سردبیر، فقط از بخش خواندی‌شده.","en":[["نگاه یک سیاح اروپایی به ژاپنِ ۱۹۳۵: میان زیبایی و ن آوری نمادشناسانه و باطنی‌گرایانه دربارهٔ آتش، سرشار از روایت‌های جالب اما با تفسیر غیرعلمی؛ مترجم خودش هشدار می‌دهد که به اندازهٔ استادان همتایش متوازن و پژوهشی نیست.","best":"برای شناختن مضمون‌های اسطوره‌ای و آیینی آتش (ققنوس، شهیدان، قصه‌های جوان‌شدگی) و نگرش باطنی‌گرایانه؛ نه برای اثبات ادعاهای جهان‌شناختی، فیزیکی یا تاریخی. برای جزئیات باید به ادمن (Ignis Divinus)، الیاده و منابع اصلی رجوع کرد.","cau":["بخش بزرگی از کتاب (از صفحهٔ ~۷۸ به بعد) خوانده نشد","ادعاهای دربارهٔ آتش‌پیمایی، آواز ستارگان و جان‌داربودن ماده تایید نشده‌اند","خوانش ایدئولوژیک-باطنی اسطوره‌ها و استفاده از نظریهٔ فریزر که امروز بسیار نقد شده"],"rs":["نویسنده را ستاری در پیشگفتار در ردیف باطنی‌گرایان می‌گذارد (نه مورخ دین دانشگاهی)؛ از بخش خوانده‌شده، ادعای تخصص آکادمیک در دین‌پژوهی دیده نشد","ارجاع دارد (ادمن، الیاده، فریزر، پلوتارک و...) اما بیشتر به‌صورت نقل ثانوی و گاه ناقص؛ ستاری یک ارجاع به بندهش را در متن مترجم‌شده نیافته است","منابع اصلی دهه‌های ۱۹۰۰ تا ۱۹۵۰ هستند و رویکرد تطبیقی قدیمی (فریزر) دارد"],"why":"کتاب جدلی-باطنی است اما مجموعه‌ای از روایت‌ها و ارجاع‌های درخور دارد؛ مدخل‌ها فقط دیدگاه نویسنده را گزارش می‌کنند و دیدگاه دانشگاهی و پانوشت‌های سنجشگر مترجم را کنارش می‌نهند. فقط بخش خوانده‌شده (حدود ۷۸ صفحهٔ نخست) به‌کار رفته است.","en":[["آتش، مرگ و زایش دوباره در اسطوره و آیین، به روایت بایار","soc/#fire-death-rebirth-myths","soc"],["جوان‌شدگی با آتش و نقش آهنگر در قصه‌ها","soc/#fire-rejuvenation-smith-motif","soc"],["آتشِ پالاینده: سفر براندان، شهیدان مسیحی و آزمون آتش","soc/#fire-purification-martyrs-ordeal","soc"],["آتش‌پیمایی: روایت باطنی در برابر توضیح فیزیکی","soc/#fire-walking-claims","soc"],["پیش‌فرض‌های باطنی‌گرایانهٔ «رمزپردازی آتش» و هشدار مترجم","phil/#bayard-esoteric-premises","phil"]],"ne":5,"ws":["phil","soc"]},{"n":"b132","t":"ایدئولوژی‌های مدرن سیاسی (Modern Political Ideologies)","a":"اندرو وینسنت (Andrew Vincent)، دانشگاه ولز، کاردیف","y":"ترجمهٔ فارسی ۱۳۷۸؛ ویراست دوم اصل انگلیسی ۱۹۹۵","ty":"scholarly","tier":3,"dec":"add","lab":"درسنامهٔ دانشگاهی معتبر و محتاط دربارهٔ ایدئولوژی‌های سیاسی؛ برای مقدمه و نقشهٔ مفهومی خوب است، نه برای داوری نهایی دربارهٔ هر ایدئولوژی.","best":"خوب برای: تاریخ مفهوم «ایدئولوژی»، بحث پایان ایدئولوژی، مانهایم، و نقشهٔ کلی لیبرالیسم کلاسیک و جدید (در بخش خوانده‌شده)؛ آشنایی اولیه با ایدئولوژی‌های بزرگ. نامناسب برای: داده و آمار، روزآمدی پس از ۱۹۹۵، و داوری دربارهٔ فصل‌هایی که خوانده نشده‌اند.","cau":["فقط حدود ۱۳ درصد متن کتاب خوانده شد؛ اعتبار برای کل ۱۰ فصل بر پایهٔ همین بخش و جایگاه کلی کتاب است، نه بررسی تک‌تک فصل‌ها.","ادعاهای نویسنده دربارهٔ کوهن و فایرابند («ریشه‌داربودن» نظریه‌ها و استوارنبودن مرز علم و ایدئولوژی) برداشتی نسبی‌گرایانه و ساده‌شده است؛ خود کوهن نسبی‌گرایی محض را نمی‌پذیرفت و فلسفهٔ علم معاصر علم را صرفاً یک «بازی زبانی» دیگر نمی‌داند.","این تز که همهٔ ایدئولوژی‌ها پس از انقلاب فرانسه پدید آمده‌اند، دیدگاه نویسنده (و بسیاری از مورخان مفهوم) است، نه اجماع بی‌چون‌وچرا."],"rs":["نویسنده استاد علوم سیاسی در دانشگاه است و کتاب حاصل سال‌ها تدریس دورهٔ کارشناسی است (پیشگفتار)؛ فصل‌ها را همکاران دانشگاهی خوانده و نقد کرده‌اند.","متن به آثار و پژوهشگران نام‌برده ارجاع می‌دهد (ارجاع شمارهٔ‌دار با فهرست یادداشت‌ها در پایان کتاب)، اما در بخش خوانده‌شده روش پژوهشی یا داده‌ای ندارد؛ کتاب تفسیری و مفهومی است نه تجربی.","نسخهٔ فارسی ترجمهٔ ویراست ۱۹۹۵ است؛ پس تحولات پس از فروپاشی بلوک شرق و دهه‌های بعد را نمی‌پوشاند."],"why":"درسنامهٔ دانشگاهیِ معتبرِ خوانده‌شده در ردهٔ ۳؛ بخش خوانده‌شده محتوای قابل‌استفاده و بدیع نسبت به دانش‌سرا دارد (تاریخ مفهوم ایدئولوژی، پایان ایدئولوژی، مانهایم، لیبرالیسم کلاسیک/جدید). فقط مطالب همان بخش خوانده‌شده آمده؛ فصل‌های بعدی خوانده نشدند.","en":[["تاریخ مفهوم «ایدئولوژی»: از دستوت دو تراسی تا گرامشی (به روایت وینسنت)","phil/#ideology-concept-history","phil"],["بحث «پایان ایدئولوژی» (دههٔ ۱۹۵۰) و نقد آن","phil/#end-of-ideology-debate","phil"],["مانهایم: «ایدئولوژی و اتوپیا»، جامعه‌شناسی شناخت و «پارادوکس مانهایم»","soc/#mannheim-ideology-utopia","soc"],["لیبرالیسم: خاستگاه‌ها و دو مکتب کلاسیک و جدید (به روایت وینسنت)","phil/#liberalism-schools-history","phi ish-role-thesis","soc"]],"ne":3,"ws":["soc"]},{"n":"b141","t":"نامه‌هایی برای محمد پیامبر: قرآن‌پژوهی بر ریشه (Letters to Prophet Muhammad: Quran research at the roots)","a":"امین قضایی (Amin Ghazaei) — هویت نویسنده در کتاب روشن نیست","y":"2015 (1394)","ty":"religious-political","tier":4,"dec":"add-as-viewpoint","lab":"کتابی جدلی و فرضیه‌محور از نویسنده‌ای غیرمتخصص (بر پایهٔ آنچه خوانده شد)، مفید برای فهم دیدگاه خود نویسنده نه برای حقایق دربارهٔ منشأ قرآن.","best":"منبع اولیه برای دیدگاه خود نویسنده و نمونه‌ای از قرآن‌پژوهی سکولار/ایرانیِ برون‌مرزی؛ نه منبع مناسب برای تاریخ شکل‌گیری قرآن یا سنجش وحی. برای آن باید به پژوهش‌های دانشگاهی (نولدکه-شوالی، دونر، رینولدز، کوک و ...) رجوع کرد.","cau":["ادعای اصلی بدون شاهد مستقل است.","بعضی مشاهده‌های متنی واقعی‌اند اما تعمیم‌هایشان خارج از شواهد.","این کتاب به هیچ دین یا باوری توهین مستقیم را توجیه نمی‌کند؛ فقط دیدگاه نویسنده نقل شود و در کنار دیدگاه مقابل بیاید."],"rs":["نویسنده صلاحیت دانشگاهی مشخصی در متن اعلام نمی‌کند و هویتش معلوم نیست؛ ناشر یک گروه انتشاراتی آزاد برون‌مرزی است و داوری علمی ندارد.","ارجاعات محدود است (نولدکه، لوکزنبرگ، وانزبرو، دو سه مقاله) و بخشی از استدلال حدس‌های خود نویسنده است (او خودش از «حدس» سخن می‌گوید).","فرضیهٔ اصلی (نامه‌های فرقهٔ ابیونی) مدرک مستقل ندارد و با لحن قاطع و انتقادی به نتیجه‌ای «شوکه‌کننده» می‌رسد."],"why":"کتاب جدلی با فرضیهٔ بی‌پشتوانه است؛ فقط مدخل دربارهٔ اندیشهٔ نویسنده با پرچم و یادداشت نظر دانشگاهی. فقط بخشی از کتاب خوانده شد.","en":[["فرضیهٔ «قرآن مکی، نامه‌هایی برای محمد» (قضایی)","phil/#ghazaei-quran-as-letters-to-muhammad-thesis","phil"],["ویژگی‌های متنی قرآن به‌عنوان «شواهد» در استدلال قضایی","phil/#ghazaei-textual-features-as-evidence","phil"],["نظر قضایی دربارهٔ گردآوری و انتقال متن قرآن","phil/#ghazaei-quran-text-transmission-claims","phil"]],"ne":3,"ws":["phil"]},{"n":"b142","t":"معمای مدرنیته","a":"بابک احمدی","y":"چاپ اول ۱۳۷۷؛ چاپ پنجم ۱۳۸۷","ty":"scholarly","tier":3,"dec":"add","lab":"مجموعه‌جستارهای فلسفیِ یک نویسندهٔ شناخته‌شدهٔ ایرانی، با پانویس‌های فراوا
