یدنِ ساعت‌ها پیاپی ساخته شده بود. روش: شکاری مثل گُنو را از روی ردپا با ریتمی منظم دنبال می‌کردند؛ جانور در آغاز با سرعتی بسیار بیشتر می‌گریزد، اما چون بدنش پوشیده از مو است و عرق نمی‌کند و باید گرما را از راه دهان دفع کند، پس از هر تاخت ناچار می‌ایستد. با تکرار این تعقیب در طول ساعت‌ها، جانور سرانجام از گرمازدگی و کم‌آبی از پا می‌افتد. گوینده سه رشته شاهد می‌آورد: (۱) برخی بوشمن‌های امروزیِ آفریقای جنوبی هنوز همین روش را به کار می‌برند؛ (۲) مقایسهٔ آناتومی نشان می‌دهد بدن راست‌قامت دیرتر دچار کم‌آبی می‌شد؛ (۳) این ویژگی نام «ارگستر/کارگر» را توضیح می‌دهد. به تعبیر او، در جوامع شکارگر-گردآورنده فرد چاق پیدا نمی‌شود، چون چنین زیستی جایی برای او نمی‌گذاشت.", "en": "Persistence hunting: the hand-axe is not a projectile, so how was meat obtained? The body was built for hours of walking and running. Hunters tracked an animal such as a wildebeest at a steady pace; the animal bolts far faster but, being furred and unable to sweat, must stop to dump heat through panting. Repeated over hours, the chase ends with the animal collapsing from heat and dehydration. The speaker cites present-day San hunters who still use the method, anatomical comparisons suggesting erectus dehydrated more slowly, and links the name 'ergaster' ('worker') to this demanding life.", "nl": "Uithoudingsjacht: de vuistbijl is geen werpwapen. Het lichaam was gebouwd om urenlang te lopen en te rennen. Jagers volgden een dier zoals een gnoe in een vast tempo; het dier rent eerst veel sneller weg, maar moet, behaard en zonder zweet, telkens stoppen om warmte kwijt te raken. Na uren bezwijkt het aan oververhitting en uitdroging. De spreker wijst op San-jagers die de methode nog gebruiken en op anatomische vergelijkingen."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "ریشه‌های تفکر انتزاعی: به استدلال برنامه، دنبال‌کردن ردپا خودش ساده‌ترین شکل تفکر نمادین است: ذهن میان یک نشانه (جای پا بر خاک یا برف) و صاحب غایبِ آن پیوند برقرار می‌کند. گوینده آن را از رفتار سگ جدا می‌کند: سگ بو می‌کشد و از حس بویایی استفاده می‌کند، نه از تناظر ذهنیِ «این نشانه از آن جانور است». این پیوند ساده بعدها می‌تواند به شکل‌های بسیار پیچیده‌تر برسد.", "en": "Roots of abstract thought: tracking is itself the simplest form of symbolic thinking — the mind links a sign (a footprint in dust or snow) to its absent owner. The speaker contrasts this with a dog, which follows scent rather than mapping a visual sign onto an animal. This simple link can later grow into far more complex symbolism.", "nl": "Wortels van abstract denken: spoorzoeken is zelf de eenvoudigste vorm van symbolisch denken — de geest verbindt een teken (een voetafdruk) met de afwezige eigenaar. Een hond volgt geur, geen visueel teken. Deze eenvoudige koppeling kan later veel complexer worden."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "تبردستی آشولی، «چاقوی سوئیسیِ» پارینه‌سنگی: ابزاری بادامی یا قطره‌اشکی که با نوکش سوراخ می‌کردند، با ته آن می‌کوبیدند، با لبه‌هایش می‌بریدند و از خودش تراشه‌های ریز جدا می‌کردند. گوینده برای ساختنش چهار شرط برمی‌شمارد: چکش سنگیِ جنس مناسب که خودش نشکند؛ سنگ خامِ مناسب (از هر قلوه‌سنگی نمی‌شود)؛ مهارت برای تراش متقارن بی‌آنکه سنگ از وسط بشکند؛ و مهم‌تر از همه، تصورِ سه‌بعدیِ شکل نهایی پیش از شروع کار (او به حکایت مشهورِ «دیدنِ داوود در دل سنگ» از میکلانژ اشاره می‌کند و خودش می‌گوید سندیتش معلوم نیست). چون نقشه و قلمی در کار نبود، انتقال این مهارت با آموزش و آزمون و خطا انجام می‌شد، و به نظر برنامه این خودش نیازمند نوعی ارتباط کلامی میان آموزگار و شاگرد بوده است. گوینده که به دانشجویانش ابزارسازی عملی درس می‌دهد، می‌گوید تاکنون هیچ‌کدام نتوانسته‌اند جلوی او یک تبردستی آشولی کامل بسازند. این ابزار در آفریقا، ایران، آسیای مرکزی، اروپا و هند فراوان یافت شده است.", "en": "The Acheulean hand-axe, a Palaeolithic 'Swiss army knife': pointed for piercing, butt for pounding, edges for cutting, and a core for small flakes. The speaker lists four requirements: a hammerstone of the right material that will not itself shatter; suitable raw stone; the skill to work symmetrically without snapping the piece; and above all a three-dimensional mental image of the end product (he cites the Michelangelo 'David in the block' anecdote, noting its authenticity is uncertain). Without plans, the skill was passed on by teaching and trial and error, which in the programme's view implies some verbal communication. He notes that none of his students in practical knapping courses has yet managed to make a full Acheulean hand-axe. The tool is abundant in Africa, Iran, Central Asia, Europe and India.", "nl": "De Acheuleaanse vuistbijl, een paleolithisch 'Zwitsers zakmes': punt om te doorboren, achterkant om te kloppen, randen om te snijden. Vier voorwaarden: een geschikte klopsteen die zelf niet breekt; geschikt ruw gesteente; vakmanschap om symmetrisch te werken; en vooral een driedimensionaal beeld van de eindvorm vooraf. Zonder plannen werd de techniek doorgegeven via onderwijs en oefening, wat volgens het programma enige talige communicatie veronderstelt. De vuistbijl is gevonden in Afrika, Iran, Centraal-Azië, Europa en India."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "تبردستی‌های غول‌پیکر و آغاز «خودنمایی»: در برخی محوطه‌ها ده‌ها تبردستیِ بسیار بزرگ (به گفتهٔ گوینده تا حدود ۱۵ کیلوگرم و ۵۰ تا ۷۰ سانتی‌متر) کنار هم چیده شده‌اند که حمل‌شدنی نیستند و بررسی لبه‌هایشان با میکروسکوپ نشان می‌دهد هرگز برای بریدن یا کوبیدن به کار نرفته‌اند. باستان‌شناسان به شوخی می‌گویند وقتی کاربرد چیزی را نمی‌دانیم آن را «آیینی» می‌نامیم؛ تفسیری که برنامه نقل می‌کند «خودنمایی» است: صنعتگر می‌خواست چیره‌دستی‌اش را نشان دهد و احتمالاً توجه جنس مخالف را جلب کند یا در برابر هم‌جنسان قدرت‌نمایی کند — به تعبیر گوینده همان کاری که امروز خودروهای گران‌قیمت می‌کنند.", "en": "Giant hand-axes and the beginning of display: at some sites dozens of very large hand-axes (the speaker cites up to ~15 kg and 50–70 cm) lie together, too heavy to carry, and microscopic study of their edges shows they were never used. Archaeologists joke that whatever lacks an obvious use gets called 'ritual'; the interpretation the programme reports is display — showing off skill, possibly to attract mates or impress rivals, much as luxury cars do today.", "nl": "Reusachtige vuistbijlen en het begin van 'pronken': op sommige vindplaatsen liggen tientallen zeer grote vuistbijlen (tot ~15 kg en 50–70 cm volgens de spreker), te zwaar om te dragen en microscopisch ongebruikt. De interpretatie die het programma geeft is vertoon: vakmanschap tonen, mogelijk om partners aan te trekken of rivalen te imponeren."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "رهبری در جامعهٔ بی‌طبقه: برنامه یادآوری می‌کند که جوامع پارینه‌سنگی «طبقه» نداشتند، اما تفاوت فردی همیشه بود: کسی که تجربهٔ بیشتر داشت، می‌دانست آب در کدام فصل کجاست یا شکارچی قوی‌تری بود، گروه از پی‌اش می‌رفت و از منابع بهتری بهره می‌برد و احتمالاً فرزندان بیشتری داشت. این رهبری بر پایهٔ کارایی بود، نه موروثی، و به حدس گوینده رهبرِ خطاکار به احتمال زیاد کنار گذاشته می‌شد و دیگری جایش را می‌گرفت.", "en": "Leadership without classes: Palaeolithic societies had no social classes, but individual differences always existed. Whoever had more experience, knew where water was in each season, or hunted better was followed, gained better resources and probably more offspring. Such leadership rested on performance, not inheritance, and — the speaker suggests — a leader who erred was most likely replaced.", "nl": "Leiderschap zonder klassen: paleolithische samenlevingen kenden geen klassen, maar wel individuele verschillen. Wie meer ervaring had, wist waar water was of beter jaagde, werd gevolgd en kreeg betere middelen. Dat leiderschap berustte op prestaties, niet op erfelijkheid; een falende leider werd waarschijnlijk vervangen."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "نقد و احتیاط: (۱) «کج‌شدن محور زمین» تعبیری ساده‌شده است؛ زمین پیش از این هم محور کج و فصل داشت. آنچه در حدود ۲٫۸ تا ۱٫۷ میلیون سال پیش تغییر کرد نوسان‌های مداری، سردشدن جهانی و یخبندان‌های نیم‌کرهٔ شمالی و در نتیجه خشک‌ترشدن و پرنوسان‌ترشدن آفریقای شرقی بود. (۲) فرضیهٔ «شکار پیگیرانه» (از جمله در کارهای لیبرمن و برمبل) هوادار و منتقد جدی دارد؛ برخی می‌گویند لاشه‌خواری، کمین و شکارِ گروهی هم سهم بزرگی داشتند و نمونه‌های قوم‌نگاریِ این شکار کم‌اند. (۳) پیوند دادن موفقیت دوندگان کنیایی و اتیوپیایی با «میراث راست‌قامت» از نظر علمی سست است: سازگاری‌های استقامتی میان همهٔ انسان‌های امروزی مشترک است و موفقیت ورزشی عوامل اجتماعی، ارتفاع، تمرین و اقتصاد را هم در بر دارد. (۴) تفسیر تبردستی‌های بزرگ به «جلب جفت» یک فرضیه است، نه یافتهٔ قطعی.", "en": "Critique and caution: (1) 'the tilting of Earth's axis' is a simplification — Earth had an axial tilt and seasons long before; what changed around 2.8–1.7 Mya was orbital-cycle variability, global cooling and Northern Hemisphere glaciation, making East Africa drier and more variable. (2) Persistence hunting (e.g. Bramble & Lieberman) has serious critics who stress scavenging, ambush and group hunting and note how few ethnographic cases exist. (3) Linking Kenyan and Ethiopian running success to an 'erectus heritage' is weak: endurance adaptations are shared by all living humans, and athletic success also reflects altitude, training, social and economic factors. (4) Reading giant hand-axes as mate attraction is a hypothesis, not a finding.", "nl": "Kritiek en voorzichtigheid: (1) het 'kantelen van de aardas' is een vereenvoudiging; de aarde had al lang een schuine as en seizoenen. Wat rond 2,8–1,7 miljoen jaar geleden veranderde waren baanvariaties, wereldwijde afkoeling en ijstijden op het noordelijk halfrond. (2) Uithoudingsjacht heeft serieuze critici die aaseten, hinderlagen en groepsjacht benadrukken. (3) Het succes van Keniaanse en Ethiopische lopers koppelen aan een 'erectus-erfenis' is zwak: uithoudingsaanpassingen delen alle mensen, en sportsucces hangt ook af van hoogte, training en sociaaleconomische factoren. (4) Reuzenvuistbijlen als partnerlokkers is een hypothese."}, "sources": ["src:60e7838a5a"], "flags": ["editor-note", "contested"]}, {"text": {"fa": "یادداشت خوانش: این مدخل از رونوشت خودکارِ اپیزود دومِ نسخهٔ رادیویی «خداحافظ آفریقا» (اجرای اسماعیل میرفخرایی با حضور دکتر حامد وحدتی‌نسب) نوشته شده و همهٔ آن شنیده/خوانده شده است. رونوشت خطاهای گفتاری و آوانویسی دارد (مثلاً نام‌های علمی و اعداد گاهی درهم‌اند) و چند ارقام را با تکیه بر بافت تصحیح کرده‌ایم. چند اظهار نظر حاشیه‌ای و کلیشه‌آمیزِ گوینده دربارهٔ یک ملت خاص در این مدخل نیامده است. ادعاهای علمی را باید با منابع درجهٔ یک (مقاله‌ها و کتاب‌های دانشگاهی) سنجید.", "en": "Reading note: this entry is based on the automatic transcript of episode 2 of the radio version of 'Goodbye Africa' (hosted by Esmail Mirfakhraei with Dr Hamed Vahdati Nasab), heard/read in full. The transcript contains speech-recognition errors (scientific names and numbers are sometimes garbled); some figures were corrected from context. A few off-hand stereotyping remarks by the speaker about a particular nation are not reproduced. Scientific claims should be checked against first-tier academic sources.", "nl": "Leesnotitie: gebaseerd op het automatische transcript van aflevering 2 van de radioversie van 'Vaarwel Afrika' (presentatie Esmail Mirfakhraei, met dr. Hamed Vahdati Nasab), volledig gelezen. Het transcript bevat spraakherkenningsfouten; enkele getallen zijn uit de context gecorrigeerd. Een paar stereotyperende opmerkingen over een bepaald volk zijn niet overgenomen."}, "sources": ["src:60e7838a5a"], "flags": ["editor-note"]}], "links": [{"to": "tabar:earliest-bipeds-and-australopithecus", "rel": "see-also", "note": {"fa": "پیشینیانِ دست‌بلند و درخت‌زیِ این انسان", "en": "the long-armed, partly arboreal predecessors", "nl": "de langarmige, deels boombewonende voorgangers"}}, {"to": "tabar:meat-eating-hunting-hypothesis", "rel": "see-also", "note": {"fa": "گوشت‌خواری و شکار به‌عنوان موتور بزرگ‌شدن مغز", "en": "meat-eating and hunting as a driver of brain growth", "nl": "vlees en jacht als motor van hersengroei"}}, {"to": "tabar:cooking-hypothesis", "rel": "contrasts", "note": {"fa": "فرضیهٔ رقیب: پختن، نه فقط گوشت، انرژی مغز را تأمین کرد", "en": "rival hypothesis: cooking, not meat alone, fuelled the brain", "nl": "rivaliserende hypothese: koken, niet alleen vlees"}}, {"to": "tabar:hominin-evolution-changing-environments", "rel": "see-also", "note": {"fa": "نقش نوسان اقلیم در گونه‌زایی انسان", "en": "climate variability and hominin speciation", "nl": "klimaatvariatie en soortvorming"}}, {"to": "tabar:first-out-of-africa-java-peking-dmanisi", "rel": "see-also", "note": {"fa": "گام بعدی: نخستین خروج از آفریقا", "en": "next step: the first exit from Africa", "nl": "volgende stap: de eerste uittocht uit Afrika"}}, {"to": "tabar:social-brain-evolution", "rel": "see-also", "note": {"fa": "آموزش، ارتباط و مغز اجتماعی", "en": "teaching, communication and the social brain", "nl": "onderwijs, communicatie en het sociale brein"}}], "sources": ["src:60e7838a5a"], "people": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:human-genome", "kind": "concept", "title": {"fa": "ژنوم انسان: ۹۹٫۹ درصد مشترک", "en": "The human genome: 99.9 percent shared", "nl": "Het menselijk genoom: 99,9 procent gedeeld"}, "aliases": [], "parent": "tabar:basics", "field": "tabar:basics", "summary": {"fa": "حدود ۳ میلیارد حرف، نزدیک به ۲۰ هزار ژن پروتئین‌ساز، و دو انسان تصادفی در حدود یک حرف از هر هزار حرف با هم فرق دارند. همین یک‌دهم درصد، همهٔ تفاوت‌های ارثی ما را می‌سازد.", "en": "About 3 billion letters, close to 20 thousand protein-coding genes, and two random humans differ in about one letter in a thousand. That tenth of a percent carries all our inherited differences.", "nl": "Zo'n 3 miljard letters, bijna 20 duizend eiwitcoderende genen, en twee willekeurige mensen verschillen in ongeveer één letter op duizend. Dat tiende procent draagt al onze erfelijke verschillen."}, "points": [{"text": {"fa": "کنسرسیوم ژنوم انسان (۲۰۰۱): پیش‌نویس ژنوم، تعداد ژن‌ها بسیار کمتر از ۱۰۰ هزارِ پیش‌بینی‌شده (امروز حدود ۲۰ هزار)؛ بیش از ۹۸ درصد ژنوم پروتئین نمی‌سازد و بخشی از آن تنظیم‌کنندهٔ ژن‌هاست.", "en": "Human Genome Consortium (2001): the draft genome had far fewer genes than the 100 thousand predicted (today about 20 thousand); over 98 percent of the genome does not code for protein, and part of it regulates genes.", "nl": "Human Genome Consortium (2001): the draft genome had far fewer genes than the 100 thousand predicted (today about 20 thousand); over 98 percent of the genome does not code for protein, and part of it regulates genes."}, "sources": ["src:788a171c8d"], "flags": []}, {"text": {"fa": "پروژهٔ ۱۰۰۰ ژنوم (۲۰۱۵، ۲٬۵۰۴ نفر از ۲۶ جمعیت): هر فرد حدود ۴ تا ۵ میلیون جایگاه متفاوت با ژنوم مرجع دارد؛ بیشتر واریانت‌های شایع در همهٔ قاره‌ها یافت می‌شوند و واریانت‌های نادر جغرافیایی‌ترند.", "en": "The 1000 Genomes Project (2015, 2,504 people from 26 populations): each person differs from the reference at about 4 to 5 million sites; most common variants are found on every continent, while rare variants are more geographically specific.", "nl": "The 1000 Genomes Project (2015, 2,504 people from 26 populations): each person differs from the reference at about 4 to 5 million sites; most common variants are found on every continent, while rare variants are more geographically specific."}, "sources": ["src:7a7e4a41da"], "flags": []}], "links": [{"to": "tabar:race-biology", "rel": "explains", "note": {"fa": "چرا تنوع درون‌جمعیتی بیشتر است", "en": "Why within-population variation dominates", "nl": "Why within-population variation dominates"}}, {"to": "tabar:mutation-selection-drift", "rel": "see-also", "note": {"fa": "نیروهایی که این تنوع را می‌سازند", "en": "The forces that make this variation", "nl": "The forces that make this variation"}}], "people": [], "sources": ["src:788a171c8d", "src:7a7e4a41da"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:sapiens-sapiens-dog-art-animism", "kind": "concept", "title": {"fa": "خروج ششم: انسان خردمندِ خردمند، سگ، هنر غارها و جان‌انگاری", "en": "The sixth exit: Homo sapiens sapiens, the dog, cave art and animism", "nl": "De zesde uittocht: Homo sapiens sapiens, de hond, grotkunst en animisme"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "«خداحافظ آفریقا» تاریخ انسان را «شش بار خداحافظی با آفریقا» می‌خواند. ششمین آن خروج نیاکان مستقیم ما، «انسان خردمندِ خردمند»، حدود ۵۰ تا ۷۰ هزار سال پیش است. برنامه آن‌چه را این انسان را از پیشینیانش جدا می‌کرد نه در ریخت، بلکه در «انقلاب شناختی» می‌جوید: پرسش‌های «من کیستم، کجا هستم، از کجا آمده‌ام و به کجا می‌روم»، نمادپردازی و زبان استعاری، گروه‌های بزرگ‌تر و شبکه‌های مبادله، نیزه‌های پرتابی و سم، خوراکی بسیار متنوع، اهلی‌کردن گرگ و تبدیل آن به سگ، پیکرک‌های خیالی مثل «شیرمرد» و نقاشی‌های ژرفای غارها، و باوری که احتمالاً به جان‌انگاری نزدیک بود.", "en": "The programme frames human history as 'six goodbyes to Africa'. The sixth is the exit of our direct ancestors, 'Homo sapiens sapiens', about 50–70 ka. What set them apart was not mainly anatomy but a 'cognitive revolution': asking 'who am I, where am I, where do I come from and where am I going', symbolic thought and metaphorical language, larger groups and exchange networks, projectile weapons and poison, a very broad diet, domesticating the wolf into the dog, imaginary figurines like the Lion-Man, paintings deep in caves, and a belief system probably close to animism.", "nl": "Het programma beschrijft de menselijke geschiedenis als 'zes keer vaarwel aan Afrika'. De zesde is de uittocht van onze directe voorouders, 'Homo sapiens sapiens', rond 50–70.000 jaar geleden. Wat hen onderscheidde was vooral een 'cognitieve revolutie': existentiële vragen, symbolisch denken en metaforische taal, grotere groepen en ruilnetwerken, werpwapens en gif, een breed dieet, de domesticatie van de wolf tot hond, verbeelde figuren zoals de Leeuwmens, schilderingen diep in grotten, en waarschijnlijk animisme."}, "points": [{"text": {"fa": "موج‌های خروج: برنامه چند موج خروج از آفریقا را برمی‌شمارد (موج‌های نخست مربوط به راست‌قامت‌اند). موج چهارم حدود ۵۰۰ تا ۷۰۰ هزار سال پیش از آنِ انسان هایدلبرگ و نوادگانش است. موج پنجم، انسان خردمند (که حدود ۳۰۰ هزار سال پیش در آفریقا پدید آمد) حدود ۲۰۰ تا ۲۵۰ هزار سال پیش، با شواهدی از یونان، کرانه‌های مدیترانه و فویانِ چین — اما این گسترش دوام و پهنای زیادی نیافت. موج ششم، انسان خردمندِ خردمند، حدود ۵۰ تا ۷۰ هزار سال پیش؛ شواهد حضورش در اروپا حدود ۵۴ هزار سال، در خاورمیانه حدود ۴۸ تا ۴۹ هزار سال و در استرالیا حدود ۶۰ هزار سال پیش است.", "en": "Waves of exit: the programme lists several waves (the earliest are erectus). The fourth, about 500–700 ka, belongs to heidelbergensis and its descendants. The fifth: Homo sapiens (arising ~300 ka in Africa) about 200–250 ka, with evidence from Greece, the Mediterranean shore and Fuyan in China — but this spread did not last or reach far. The sixth: Homo sapiens sapiens about 50–70 ka, attested in Europe ~54 ka, the Middle East ~48–49 ka and Australia ~60 ka.", "nl": "Golven van uittocht: de vierde golf (~500–700.000 jaar) is van heidelbergensis; de vijfde, Homo sapiens (~200–250.000 jaar, Griekenland, Middellandse Zeekust, Fuyan in China), reikte niet ver; de zesde, Homo sapiens sapiens (~50–70.000 jaar), bereikte Europa (~54.000), het Midden-Oosten (~48–49.000) en Australië (~60.000)."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "«خردمند» و «خردمندِ خردمند»: برنامه این دو را چنین جدا می‌کند: انسان خردمندِ ۳۰۰ هزار سال پیش از نظر ریخت تا حد زیادی شبیه ما بود؛ انسان خردمندِ خردمند (مثال شاخصش کرومانیون‌ها) جمجمهٔ نازک‌تر، ابروی کم‌برجسته‌تر و — جالب اینکه — حجم مغزِ اندکی کمتر داشت؛ گوینده این را به «نشانگان اهلی‌شدن» نسبت می‌دهد که انسان، اهلی‌کنندهٔ جانوران، خود نیز دچارش شده است. اما تفاوت اصلی فرهنگی بود: انقلاب شناختی.", "en": "'Sapiens' and 'sapiens sapiens': the programme distinguishes them thus: Homo sapiens of 300 ka looked largely like us; Homo sapiens sapiens (the Cro-Magnons are the classic example) had thinner skulls, smaller brow ridges and — interestingly — slightly smaller brains, which the speaker attributes to the 'domestication syndrome' that humans, the domesticators, underwent themselves. But the main difference was cultural: the cognitive revolution.", "nl": "'Sapiens' en 'sapiens sapiens': de laatste (zoals Cro-Magnon) had dunnere schedels, kleinere wenkbrauwbogen en iets kleinere hersenen — volgens de spreker door een 'domesticatiesyndroom' bij de mens zelf. Het belangrijkste verschil was cultureel."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "انقلاب شناختی: به تعبیر برنامه، تنها موجودی که می‌تواند بپرسد «من کیستم، اینجا کجاست و چرا اینجایم» مغزی با کمینه‌ای از پیچیدگی دارد؛ شامپانزه و بونوبو با بیش از ۹۸ درصد شباهت ژنتیکی چنین نمی‌پرسند. دردناک‌ترین پرسش «به کجا می‌روم؟» است، چون کسی از آن سو برنگشته است؛ انسان برای کاستن از این اضطراب روایت‌هایی می‌سازد و به آن‌ها باور می‌آورد. همان بخش‌های مغز که درگیر این شناخت‌اند، نمادپردازی پیچیده‌تر را ممکن کردند؛ نمادپردازی به زبان استعاری‌تر انجامید؛ و این زبان به سخن گفتن دربارهٔ چیزهای نادیدنی و ساختن داستان. زنجیرهٔ پیامدها: ارتباط با افراد بیشتر، همکاری گروهی بهتر، شکار سازمان‌یافته‌تر، زادوولد بیشتر، جمعیت بزرگ‌تر — و فناوری پیچیده، که در جمعیت‌های بزرگ پدید می‌آید.", "en": "Cognitive revolution: only a creature with a minimum of neural complexity can ask 'who am I, where is this, why am I here'; chimpanzees and bonobos, sharing over 98% of our genes, do not. The most painful question is 'where am I going?', since no one has come back to tell; humans build narratives and believe in them to ease this anxiety. The same brain areas enabled more complex symbolism, symbolism led to metaphorical language, and language to talk of the unseen and to stories. The chain: wider communication, better cooperation, more organised hunting, higher birth rates, larger populations — and complex technology, which arises in large populations.", "nl": "Cognitieve revolutie: alleen een wezen met voldoende neurale complexiteit vraagt 'wie ben ik, waar ben ik'; chimpansees en bonobo's doen dat niet. De pijnlijkste vraag is 'waar ga ik heen?'. Dezelfde hersengebieden maakten complexere symboliek en metaforische taal mogelijk. De keten: betere samenwerking, georganiseerde jacht, meer geboorten, grotere populaties en complexe technologie."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "ابزار، خوراک و شبکه: راست‌قامت با تعقیب ساعت‌ها شکار می‌کرد و نئاندرتال و هایدلبرگ از فاصلهٔ نزدیک با نیزهٔ دستی؛ اما انسان خردمندِ خردمند نیزه‌های پرتابی و سرپیکان‌هایی ساخت که در بدن جانور فرو می‌رفتند و خونریزی درونی پدید می‌آوردند، و از سموم گیاهی و جانوری بر سر پیکان استفاده کرد؛ تیر و کمان هم از ابداعات اوست. گروه‌ها از ۱۰ تا ۲۰ نفرِ منزوی (نئاندرتال) به ۵۰ تا ۱۰۰ نفر رسیدند و با دره‌های دیگر مبادله داشتند؛ بررسی کانی‌شناسی نشان می‌دهد برخی ابزارهای سنگی صدها کیلومتر جابه‌جا شده‌اند. گوینده به شوخی می‌گوید نئاندرتال‌ها «کباب‌خور» بودند و بر پستانداران متوسط چون بز کوهی، قوچ و گراز تمرکز داشتند؛ پس اگر این جانوران کم می‌شدند ناچار به کوچ یا تغییر رژیم بودند. خوراک انسان خردمندِ خردمند بسیار متنوع‌تر بود: قارچ، تله برای پرندگان، تور و زوبین برای ماهی، و انواع صدف — و امگا-۳ ماهی و صدف به گفتهٔ برنامه در تحول مغز نقش داشت. این تنوع تاب‌آوری بیشتری در برابر دگرگونی محیط می‌داد. ابزارهای ویژهٔ دباغی پوست، پوشاک بهتر، مهار بهتر آتش و تدفین‌های آگاهانهٔ فراوان هم از ویژگی‌های اوست.", "en": "Tools, food and networks: erectus hunted by pursuit, Neanderthals and heidelbergensis at close range with thrusting spears; sapiens sapiens made throwing spears and points that penetrated and caused internal bleeding, poisoned arrowheads, and the bow and arrow. Groups grew from isolated 10–20 (Neanderthals) to 50–100 linked to other valleys; mineral sourcing shows some stone tools travelled hundreds of kilometres. Neanderthals, the speaker jokes, were 'kebab-eaters', focused on medium mammals like ibex, wild sheep and boar, so a decline in these forced migration or change. Sapiens sapiens ate far more widely: mushrooms, snared birds, fish with nets and harpoons, and shellfish — whose omega-3, the programme says, aided brain development. This breadth gave resilience. Hide-working tools, better clothing, better fire use and frequent deliberate burials also mark them.", "nl": "Werktuigen, voedsel en netwerken: sapiens sapiens maakte werpsperen, vergiftigde pijlpunten en pijl-en-boog. Groepen groeiden van 10–20 (Neanderthalers) tot 50–100, verbonden met andere dalen; sommige stenen werktuigen reisden honderden kilometers. Neanderthalers waren 'kebab-eters'; sapiens sapiens at paddenstoelen, vogels, vis en schelpdieren. Die variatie gaf veerkracht."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "گرگ و سگ: یکی از «شاهکارهای» انسان خردمندِ خردمند ساختن چیزی نبود، بلکه یافتن یک دوست: نخستین اهلی‌سازیِ تاریخ، تبدیل گرگ خاکستریِ پلیستوسن (گونه‌ای منقرض‌شده) به سگ. شواهد باستان‌شناختی از اروپا و آسیای مرکزی گرگ‌هایی با جمجمهٔ دگرگون‌شده، دندان نیشِ کوچک‌تر و مغز کوچک‌تر نشان می‌دهد که برخی به بیش از ۳۰ هزار سال پیش می‌رسند (بی‌اتفاق‌نظر)؛ برخی برآوردهای ژنتیکی تا حدود ۴۰ هزار سال پیش می‌روند، اما مطالعه‌ای در ۲۰۲۱ نخستین اهلی‌سازی را حدود ۲۳ هزار سال پیش در سیبری می‌داند که از آنجا سگ‌ها از تنگهٔ برینگ به آمریکا و نیز به اروپا رفتند. از حدود ۱۴ هزار سال پیش تدفینِ سگ کنار انسان کاملاً مستند است.", "en": "Wolf and dog: one masterpiece of sapiens sapiens was not an object but a friend — the first domestication, turning the (extinct) Pleistocene grey wolf into the dog. Archaeological finds from Europe and Central Asia show wolves with altered skulls, smaller canines and smaller brains, some over 30 ka (without consensus); some genetic estimates go back ~40 ka, but a 2021 study places the first domestication about 23 ka in Siberia, whence dogs crossed the Bering strait to America and spread to Europe. From about 14 ka dog burials beside humans are well attested.", "nl": "Wolf en hond: het eerste gedomesticeerde dier was de Pleistocene grijze wolf. Vondsten van ~30.000+ jaar zijn omstreden; een studie uit 2021 plaatst de eerste domesticatie rond 23.000 jaar geleden in Siberië. Vanaf ~14.000 jaar zijn hondenbegrafenissen goed gedocumenteerd."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "دو سناریوی اهلی‌شدن و سود متقابل: سناریوی قدیمی‌تر: شکارچیان توله‌گرگ‌های بی‌مادر را به اردوگاه آوردند و کودکان با آن‌ها بزرگ شدند. سناریوی دیگر که برنامه با معرفی کتاب «بقای دوستانه‌ترین» (هیر و وودز؛ به فارسی هم ترجمه شده) پیش می‌کشد: گله‌های گرگ خودشان زندگی در کنار اردوگاه‌های انسان را برگزیدند تا از پسماند شکار بخورند. رقابتِ دو گوشت‌خوار با آنزیم‌هایی در معدهٔ سگ کم شد که استخوان — بخشی که ما نمی‌خوریم — را هضم می‌کند. سودها: شکار مشترک که توان شکار را چند برابر می‌کرد؛ جبران شنوایی و بویاییِ ضعیف انسان — به گفتهٔ برنامه بخشی از مغز ما فدای نواحی شناختی شده و ما در برابر گرگ «تقریباً کر و بی‌بو» هستیم؛ نگهبانی شبانه که خطر را از دور تشخیص می‌دهد؛ و مهم‌تر از همه، فیزیولوژیِ فرمان‌برداریِ گرگ در سلسله‌مراتب گله: کافی بود انسان جای «گرگ آلفا» را بگیرد.", "en": "Two domestication scenarios and mutual benefit: the older scenario has hunters bringing orphaned wolf pups to camp to grow up with children. The other, which the programme introduces via the book 'Survival of the Friendliest' (Hare & Woods; translated into Persian), has wolf packs choosing to live near human camps to eat hunting leftovers. Competition between two carnivores was reduced by enzymes in the dog's stomach that digest bone, which we do not eat. Benefits: joint hunting multiplying success; compensation for humans' weak hearing and smell (part of our brain, the programme says, was traded for cognitive areas — next to a wolf we are 'nearly deaf and scentless'); night guarding; and above all the wolf's physiology of obedience within the pack hierarchy — humans simply took the alpha's place.", "nl": "Twee domesticatiescenario's: wolvenwelpen opgevoed in het kamp, of — via het boek 'Survival of the Friendliest' (Hare & Woods) — wolven die zelf voor het kamp kozen om restjes te eten. Voordelen: gezamenlijke jacht, compensatie voor ons zwakke gehoor en reukvermogen, nachtelijke bewaking, en de gehoorzaamheid van de wolf in de roedelhiërarchie: de mens werd de alfa."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "هنر منقول و غیرمنقول: باستان‌شناسان برای یافتن نشانه‌های انقلاب شناختی در دل زمین، به دنبال آثار هنری‌اند؛ آفرینندهٔ اثر هنری بی‌گمان اندیشهٔ نمادین دارد. هنر منقول (جابه‌جاشدنی): پیکرک‌ها و زیورهای بدن از دندانِ سوراخ‌شدهٔ جانوران. از انسان‌های پیشین پیکرکی که دانشمندان بر سرش توافق داشته باشند تقریباً نداریم؛ زیورآلات نئاندرتالی هم بسیار کمتر است. نمونهٔ شاخص: پیکرک «شیرمرد» از غار هوهلنشتاین-اشتادل در آلمان، حدود ۳۰ تا ۴۰ هزار سال پیش: انسانی با سرِ شیر — موجودی خیالی که سازنده‌اش هرگز ندیده بود و فقط در ذهن می‌توانست بسازد. هنر غیرمنقول: نقاشی‌های غارهای لاسکو، شووه و آلتامیرا، حدود ۳۵ تا ۲۰ هزار سال پیش، به سبک طبیعت‌گرایانه از جانورانِ پیرامون.", "en": "Portable and non-portable art: to find signs of the cognitive revolution, archaeologists look for art; whoever makes art certainly thinks symbolically. Portable art: figurines and body ornaments of perforated animal teeth. Agreed figurines from earlier humans are virtually absent, and Neanderthal ornaments are much rarer. A key example: the Lion-Man from Hohlenstein-Stadel cave, Germany, about 30–40 ka — a human with a lion's head, an imaginary creature its maker never saw. Non-portable art: the naturalistic animal paintings of Lascaux, Chauvet and Altamira, about 35–20 ka.", "nl": "Draagbare en vaste kunst: beeldjes en sieraden van doorboorde dierentanden; de Leeuwmens uit de Hohlenstein-Stadel-grot (~30–40.000 jaar) is een mens met leeuwenkop — een verbeeld wezen. Vaste kunst: de naturalistische dierenschilderingen van Lascaux, Chauvet en Altamira (~35–20.000 jaar)."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "چرا در ژرفای غار؟ نکتهٔ جالب این است که بسیاری از این نقاشی‌ها در انتهای دالان‌های تنگ و تاریک کشیده شده‌اند، گویی قرار نبود در منظر عمومی دیده شوند. مقاله‌ای در ۲۰۲۰ (بر پایهٔ کار تجربی) پیشنهاد کرد نقاشان در حالت «هیپوکسی» (کاهش اکسیژن خون) بودند: مشعل در انتهای غار اکسیژن را می‌سوزاند و هیپوکسی می‌تواند توهم پدید آورد. برخی هم مصرف گیاهان یا قارچ‌های توهم‌زا را دخیل می‌دانند — که شاهد قطعی ندارد.", "en": "Why deep inside caves? Many paintings sit at the end of narrow, dark passages, as if not meant for public view. A 2020 paper (based on experimental work) proposed that painters were in a hypoxic state: torches at the back of caves consume oxygen, and hypoxia can cause hallucinations. Others invoke hallucinogenic plants or mushrooms — without conclusive evidence.", "nl": "Waarom diep in de grot? Veel schilderingen liggen achter in nauwe gangen. Een artikel uit 2020 opperde hypoxie door fakkels die zuurstof verbruiken, wat hallucinaties kan veroorzaken. Anderen denken aan hallucinogene planten — zonder sluitend bewijs."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "جان‌انگاری: اینکه این انسان‌ها به چه باور داشتند از شواهد باستان‌شناختی به‌سختی برمی‌آید؛ تنها با رویکرد قوم‌نگاری و قوم‌باستان‌شناسی می‌توان حدس زد که به نوعی جان‌انگاری (آنیمیسم) باور داشتند: رود، کوه و جانوران روح دارند، می‌توان با آن‌ها سخن گفت و از آن‌ها اجازه گرفت. برخی پژوهشگران نقاشیِ جانوران در ژرفای غارها را نوعی ادای دین و «اجازه‌گرفتن» از جانوران پیش از شکار می‌دانند — رسمی که تا همین اواخر در میان بومیان آمریکای شمالی دیده می‌شد. برنامه این اپیزود را با پرسشی تمام می‌کند که موضوع اپیزود بعد است: چه شواهدی نشان می‌دهد نیای همهٔ انسان‌های امروز، انسانی سیاه‌پوست در شرق آفریقا بوده است؟", "en": "Animism: what these people believed is hard to read from archaeology; only ethnographic and ethnoarchaeological analogy suggests a form of animism — rivers, mountains and animals have spirits, can be spoken to and asked for permission. Some researchers read the deep-cave animal paintings as tribute and 'asking permission' before the hunt, a custom seen until recently among Native North Americans. The episode closes with the next episode's question: what evidence shows that the ancestor of all living humans was a dark-skinned person in East Africa?", "nl": "Animisme: archeologie zegt weinig over geloof; etnografische analogie wijst op animisme — rivieren, bergen en dieren hebben een ziel. Sommigen zien de grotdieren als eerbetoon en 'toestemming vragen' vóór de jacht. De aflevering eindigt met de vraag naar het bewijs voor een Oost-Afrikaanse oorsprong."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "نقد: (۱) «انقلاب شناختی» ناگهانی حدود ۵۰ تا ۷۰ هزار سال پیش (دیدگاهی که در «انسان خردمند» هراری هم آمده) را بسیاری از باستان‌شناسان رد می‌کنند: شواهد نمادپردازی (اُخرای حکاکی‌شده و مهره‌های صدفی در بلومبوس و جاهای دیگر آفریقا) ده‌ها هزار سال قدیمی‌تر است و رفتار مدرن به‌تدریج و ناپیوسته در آفریقا شکل گرفت (مک‌بریرتی و بروکس، ۲۰۰۰). (۲) دوگانهٔ «خردمند» و «خردمندِ خردمند» در ادبیات امروز کمتر به کار می‌رود؛ زیرگونهٔ «Homo sapiens sapiens» در برابر «Homo sapiens idaltu» یا «نئاندرتالنسیس» تعریف شده بود. (۳) شواهد نمادپردازی نئاندرتال‌ها (مثلاً نقاشی‌های غارهای اسپانیا با تاریخ بیش از ۶۴ هزار سال، که خودش بحث‌برانگیز است) تمایز قاطع را سست می‌کند. (۴) «نشانگان خوداهلی‌سازی» انسان فرضیه‌ای فعال اما اثبات‌نشده است. (۵) تاریخ ۶۰ هزارسالهٔ استرالیا (مادجدبه) هم مورد بحث است.", "en": "Critique: (1) a sudden 'cognitive revolution' 50–70 ka (as also in Harari's Sapiens) is rejected by many archaeologists: symbolic evidence (engraved ochre and shell beads at Blombos and elsewhere in Africa) is tens of thousands of years older, and modern behaviour accumulated gradually and patchily in Africa (McBrearty & Brooks 2000). (2) The 'sapiens' vs 'sapiens sapiens' distinction is little used today. (3) Evidence of Neanderthal symbolism (e.g. Spanish cave art dated >64 ka, itself disputed) weakens a sharp divide. (4) Human 'self-domestication' is an active but unproven hypothesis. (5) The ~60 ka date for Australia (Madjedbebe) is also debated.", "nl": "Kritiek: (1) een plotselinge 'cognitieve revolutie' wordt door veel archeologen verworpen: symbolisch gedrag in Afrika (Blombos) is veel ouder (McBrearty & Brooks 2000). (2) Het onderscheid 'sapiens'/'sapiens sapiens' wordt weinig meer gebruikt. (3) Neanderthalersymboliek (Spaanse grotkunst >64.000 jaar, zelf omstreden) verzwakt een scherpe scheiding. (4) Zelfdomesticatie is onbewezen. (5) De 60.000-jaardatering voor Australië is omstreden."}, "sources": ["src:60e7838a5a"], "flags": ["editor-note", "contested"]}, {"text": {"fa": "یادداشت خوانش: بر پایهٔ رونوشت خودکار یک اپیزود از نسخهٔ پادکستیِ «خداحافظ آفریقا» (شمارهٔ اپیزود در رونوشت نیامده)، به‌طور کامل. آغاز رونوشت تکرارهای ماشینی دارد و بخش نخستِ فهرست موج‌ها (موج‌های یکم تا سوم) در آن نیست.", "en": "Reading note: based on the automatic transcript of one episode of the podcast version (episode number not given), read in full. The start contains machine repetitions, and the first part of the list of waves (waves 1–3) is missing.", "nl": "Leesnotitie: gebaseerd op het volledige automatische transcript van één podcastaflevering (nummer onbekend). Het begin, met golven 1–3, ontbreekt."}, "sources": ["src:60e7838a5a"], "flags": ["editor-note"]}], "links": [{"to": "tabar:cognitive-revolution-debate", "rel": "see-also", "note": {"fa": "بحث بر سر «انقلاب شناختی»", "en": "the 'cognitive revolution' debate", "nl": "het debat over de 'cognitieve revolutie'"}}, {"to": "tabar:out-of-africa", "rel": "part-of", "note": {"fa": "خروج انسان خردمند از آفریقا", "en": "the sapiens exit from Africa", "nl": "de uittocht van sapiens"}}, {"to": "tabar:ochre-middle-stone-age", "rel": "contrasts", "note": {"fa": "نمادپردازی کهن‌تر در آفریقا", "en": "older symbolism in Africa", "nl": "oudere symboliek in Afrika"}}, {"to": "tabar:neanderthal-discovery-and-body", "rel": "contrasts", "note": {"fa": "شیوهٔ زیست نئاندرتال", "en": "the Neanderthal way of life", "nl": "de leefwijze van de Neanderthaler"}}, {"to": "tabar:forager-lifeways-diversity", "rel": "see-also", "note": {"fa": "تنوع زندگی شکارگر-گردآورندگان", "en": "diversity of forager lifeways", "nl": "diversiteit van jagers-verzamelaars"}}, {"to": "tabar:social-brain-evolution", "rel": "see-also", "note": {"fa": "گروه‌های بزرگ‌تر و مغز اجتماعی", "en": "larger groups and the social brain", "nl": "grotere groepen en het sociale brein"}}], "sources": ["src:60e7838a5a"], "people": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:t1-americas-founding-lineages", "kind": "concept", "title": {"fa": "تبارهای بنیان‌گذار بومیان آمریکا: Q و پنج خوشهٔ میتوکندریایی", "en": "Founding lineages of Native Americans: Y-haplogroup Q and the mitochondrial clusters", "nl": "Stichtende lijnen van de oorspronkelijke bevolking van Amerika"}, "aliases": [], "parent": "tabar:population-genetics", "field": "tabar:population-genetics", "summary": {"fa": "داده‌های هاپلوگروهی نشان می‌دهند بومیان آمریکا از سیبری و از راه برینگیا آمده‌اند. هاپلوگروه Q در مردان و چند خوشهٔ میتوکندریایی در زنان نشانهٔ این پیوندند.", "en": "Haplogroup data show Native Americans came from Siberia via Beringia, with Y-haplogroup Q in men and a few mitochondrial clusters in women marking the link.", "nl": "Haplogroepdata tonen dat de eerste Amerikanen uit Siberië kwamen via Beringia."}, "points": [{"text": {"fa": "نویسنده می‌گوید بومیان آمریکا از سیبری و از راه باریکهٔ برینگ در چند موج، میان حدود ۲۵ تا ۱۲ هزار سال پیش، به آلاسکا و شمال آمریکا رسیده‌اند و داده‌های ژنتیکی این نظریه را کاملاً تایید می‌کنند.", "en": "The author says Native Americans arrived from Siberia across the Bering land bridge in several waves, between about 25,000 and 12,000 years ago, and that genetic data fully confirm this.", "nl": "The author says Native Americans arrived from Siberia across the Bering land bridge in several waves, between about 25,000 and 12,000 years ago, and that genetic data fully confirm this."}, "sources": ["src:93456bf0b8"], "flags": []}, {"text": {"fa": "بیشتر مردان بومی آمریکا هاپلوگروه Q را دارند؛ شاخهٔ Q-M3 در آمریکای مرکزی و جنوبی بسیار فراوان (بیش از ۹۰ درصد در برخی گروه‌ها) و Q-M242 در آسیای مرکزی و سیبری تکامل یافته و در میان ترک‌زبانان آلتایی و قوم کت هم دیده می‌شود. شاخهٔ Q-M3 مشخصهٔ بومیان آمریکاست.", "en": "Most Native American men carry haplogroup Q; the Q-M3 branch is very frequent in Central and South America (over 90 percent in some groups), while Q-M242 evolved in Central Asia and Siberia and also occurs among Altaic Turkic speakers and the Ket. Q-M3 is the Native American signature.", "nl": "Most Native American men carry haplogroup Q; the Q-M3 branch is very frequent in Central and South America (over 90 percent in some groups), while Q-M242 evolved in Central Asia and Siberia and also occurs among Altaic Turkic speakers and the Ket. Q-M3 is the Native American signature."}, "sources": ["src:93456bf0b8"], "flags": []}, {"text": {"fa": "در خط مادری، بومیان آمریکا به چهار خوشهٔ اصلی A، B، C و D (و X در گروه‌های شمالی مانند الگونکین‌ها و اوجیبوا) برمی‌گردند. «مرد کنویک» (حدود ۸۵۰۰ سال، واشینگتن) و نمونهٔ ساقاق گرینلند (حدود ۴ هزار سال) از نمونه‌های باستانی ذکرشده‌اند.", "en": "On the maternal side Native Americans trace to four main clusters A, B, C and D (plus X in northern groups such as the Algonquian and Ojibwe). 'Kennewick Man' (about 8,500 years old, Washington) and the Saqqaq sample from Greenland (about 4,000 years old) are among the ancient samples discussed.", "nl": "On the maternal side Native Americans trace to four main clusters A, B, C and D (plus X in northern groups such as the Algonquian and Ojibwe). 'Kennewick Man' (about 8,500 years old, Washington) and the Saqqaq sample from Greenland (about 4,000 years old) are among the ancient samples discussed."}, "sources": ["src:93456bf0b8"], "flags": []}, {"text": {"fa": "فرضیهٔ آمدن مهاجران از اروپا (فرهنگ سولوترین) برای توضیح خوشهٔ X را نویسنده رد می‌کند؛ بسامد X در سیبری و آلتایی و دادهٔ ژنتیکی این فرضیه را ناکارآمد می‌کنند.", "en": "The author rejects the hypothesis of European migrants (Solutrean) as an explanation for cluster X; X frequencies in the Altai and genetic data make that idea untenable.", "nl": "The author rejects the hypothesis of European migrants (Solutrean) as an explanation for cluster X; X frequencies in the Altai and genetic data make that idea untenable."}, "sources": ["src:93456bf0b8"], "flags": []}, {"text": {"fa": "کار تازه‌تر دربارهٔ DNA باستانی (از جمله پژوهش‌های ۲۰۱۵) نشان می‌دهد تاریخ ورود و شمار امواج پیچیده‌تر از الگوی ساده است و بخشی از نیاکان بومیان آمریکا به «اوراسیای شمالی باستان» می‌رسد؛ پس مسیر کتاب خلاصه‌ای از زمان نگارش آن است.", "en": "Newer ancient-DNA work (including 2015 studies) shows the timing and number of waves are more complicated than a simple model and that part of Native American ancestry reaches back to Ancient North Eurasians; the book's account is a snapshot of its time of writing.", "nl": "Newer ancient-DNA work (including 2015 studies) shows the timing and number of waves are more complicated than a simple model and that part of Native American ancestry reaches back to Ancient North Eurasians; the book's account is a snapshot of its time of writing."}, "sources": ["src:dae84752d4", "src:8fec492450"], "flags": ["contested", "editor-note"]}], "links": [{"to": "tabar:ancient-dna", "rel": "see-also", "note": {"fa": "DNA باستانی و بازنگری مسیر آمریکا", "en": "Ancient DNA and the revised peopling of the Americas", "nl": "Ancient DNA and the revised peopling of the Americas"}}, {"to": "tabar:haplogroups", "rel": "explains", "note": {"fa": "هاپلوگروه Q و M3", "en": "Haplogroup Q and M3", "nl": "Haplogroup Q and M3"}}, {"to": "tabar:out-of-africa", "rel": "part-of", "note": {"fa": "ادامهٔ پراکندگی انسان از آفریقا", "en": "Continuation of the dispersal out of Africa", "nl": "Continuation of the dispersal out of Africa"}}], "people": [], "sources": ["src:8fec492450", "src:93456bf0b8", "src:dae84752d4"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:bipedalism-why-upright-and-the-chimp-split", "kind": "concept", "title": {"fa": "چرا روی دو پا ایستادیم؟ جدایی از نیای شامپانزه و سودهای دوپایی", "en": "Why did we stand up? The split from the chimpanzee lineage and the advantages of bipedalism", "nl": "Waarom gingen we rechtop staan? De splitsing van de chimpanseelijn en de voordelen van tweebenigheid"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "نخستین اپیزود «خداحافظ آفریقا» داستان انسان شدن را از دوراهی‌ای آغاز می‌کند که حدود ۶ تا ۹ میلیون سال پیش در آفریقا پدید آمد: یک شاخه به شامپانزه‌های امروز رسید و شاخهٔ دیگر، که توانِ راه رفتن روی دو پا را یافت، به ما. برنامه تأکید می‌کند که ما «از نسل شامپانزه» نیستیم؛ هر دو از نیایی مشترک آمده‌ایم. دوپایی پیش از مغز بزرگ آمد: نخستین دوپایان مغزی به اندازهٔ یک‌سوم مغز ما و قدی نزدیک یک متر داشتند. سودهای دوپایی — دیدِ دورتر، دست‌های آزاد برای حمل و ساختن، دریافت گرمای کمتر از خورشید و مصرف انرژی کمتر — و نقش محیطِ پرنوسان در انتخاب طبیعی، موضوع این مدخل است. برنامه از همین‌جا نیز به نقد دو برداشت نادرست می‌پردازد: تکامل لامارکی و این ادعای شبه‌علمی که «کمردرد نشان می‌دهد بدن ما برای دوپایی ساخته نشده».", "en": "The first episode starts the human story at a fork in Africa some 6–9 million years ago: one branch led to today's chimpanzees, the other — which gained the ability to walk on two legs — to us. We are not 'descended from chimpanzees'; both come from a shared ancestor. Bipedalism came before the big brain: the first bipeds had brains a third the size of ours and stood about a metre tall. The entry covers the advantages of upright walking — a longer view, free hands, less solar heat, lower energy cost — and the role of an unstable environment in selection, plus two misconceptions: Lamarckian evolution, and the pseudo-scientific claim that back pain shows our bodies were not built for bipedalism.", "nl": "De eerste aflevering begint bij een splitsing in Afrika, zo'n 6–9 miljoen jaar geleden: één tak leidde tot de chimpansees, de andere — die op twee benen leerde lopen — tot ons. We stammen niet af van chimpansees; beide komen van een gemeenschappelijke voorouder. Tweebenigheid kwam vóór het grote brein. Het lemma behandelt de voordelen ervan, de rol van een wisselvallige omgeving, en twee misvattingen: Lamarckisme en het idee dat rugpijn bewijst dat we niet voor rechtop lopen gebouwd zijn."}, "points": [{"text": {"fa": "دیرین‌انسان‌شناسی چه می‌کند؟ برنامه این رشته را چنین معرفی می‌کند: دیرین‌انسان‌شناسان جایی را برای کاوش برمی‌گزینند (غار، کنارهٔ رود یا دریاچهٔ خشک‌شده)، تکه‌های سنگواره‌های انسانی را بیرون می‌آورند و مانند پازل کنار هم می‌گذارند، و ابزارهای سنگی و بقایای جانورانِ خورده‌شده را هم گرد می‌آورند تا از همه با هم به تصویری از آن انسان برسند. تفاوتش با باستان‌شناسی این است که باستان‌شناس فقط به دنبال ساخته‌های انسان (ابزار، اشیا) است و دیرین‌انسان‌شناس به دنبال خودِ بقایای انسانی. تشخیص یک دست‌افزار سنگی از یک سنگِ شکستهٔ طبیعی، به تعبیر گوینده، مانند کار جوانی است که با یک نگاه می‌گوید گوشی موبایل مال کدام شرکت و کدام سال است: نشانه‌هایی روی سنگ هست که متخصص آن‌ها را می‌شناسد.", "en": "What does palaeoanthropology do? Practitioners choose a place to dig (a cave, a riverbank, a dried lake), recover fragments of human fossils and piece them together like a puzzle, and collect stone tools and the remains of eaten animals to build a picture of that human. Archaeology looks only for what humans made; palaeoanthropology looks for the human remains themselves. Telling a stone tool from a naturally broken stone is, the speaker says, like a young person identifying a phone's brand and year at a glance: experts recognise the tell-tale marks.", "nl": "Wat doet de paleoantropologie? Men kiest een vindplaats, haalt fossielfragmenten boven en legt ze als een puzzel samen, met stenen werktuigen en dierresten erbij. Archeologie zoekt wat mensen maakten; paleoantropologie zoekt de menselijke resten zelf. Een werktuig van een natuurlijk gebroken steen onderscheiden is als een telefoonmerk herkennen: de expert kent de kenmerken."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "فناوری پیش از مغز بزرگ: برنامه یادآوری می‌کند که «فناوری از علم کهن‌تر است»: حدود ۳٫۳ تا ۳٫۵ میلیون سال پیش در شرق آفریقا، موجوداتی با قد حدود یک متر، وزن حدود ۴۰ کیلو و ریختی هنوز بسیار میمون‌وار، ابزار سنگی می‌ساختند. آن‌ها شکارچیانی زبردست نبودند و بیشتر لاشه‌خواری می‌کردند: صبر می‌کردند تا شکارچیان بزرگ بخورند و بروند، سپس با تکه‌سنگی گوشتِ چسبیده به پوست را می‌تراشیدند، استخوان را برای مغز استخوان (همان «قلمِ» پرپروتین) می‌شکستند یا جمجمهٔ گاومیش را برای مغزش باز می‌کردند. برتری‌شان در گروه بود: تنها، طعمه‌ای بی‌دفاع بودند؛ اما ۵۰ یا ۶۰ نفر با پرتاب سنگ و چوب می‌توانستند لاشه‌ای را از دست شیر درآورند. گوینده به صحنهٔ آغازین فیلم «۲۰۰۱: ادیسهٔ فضایی» اشاره می‌کند که استخوانی پرتاب‌شده به سفینهٔ فضایی بدل می‌شود.", "en": "Technology before the big brain: 'technology is older than science'. Some 3.3–3.5 Mya in East Africa, creatures about a metre tall, ~40 kg and still very ape-like made stone tools. They were not skilled hunters and mostly scavenged: waiting for large predators to finish, then scraping meat off hides, cracking bones for marrow or opening a buffalo skull for its brain. Their strength was the group: alone they were defenceless prey, but fifty or sixty, throwing stones and sticks, could drive a lion off a carcass. The speaker evokes the opening of 2001: A Space Odyssey, where a thrown bone becomes a spaceship.", "nl": "Technologie vóór het grote brein: rond 3,3–3,5 miljoen jaar geleden maakten wezens van ongeveer een meter en 40 kg al stenen werktuigen. Ze joegen weinig en aten vooral aas: vlees van huiden schrapen, botten kraken voor merg. Hun kracht was de groep: samen konden ze een leeuw van een karkas verjagen."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "نه از شامپانزه، بلکه با شامپانزه: به گفتهٔ برنامه، حدود ۸ تا ۹ میلیون سال پیش (برآوردهای رایج‌تر ۶ تا ۷ میلیون سال است) جمعیتی میمون‌مانند در آفریقا می‌زیست. جهش‌هایی ژنتیکی به برخی از آن‌ها آناتومی و فرم لگنی داد که راه رفتن روی دو پا را آسان می‌کرد. آن‌ها که نتوانستند دوپا شوند، مسیر خود را ادامه دادند و به شامپانزه‌های امروز رسیدند که هنوز روی بند انگشتان دست راه می‌روند؛ آن‌ها که توانستند، مسیر دیگری را پیمودند که در آن مغز بزرگ‌تر، فک کوچک‌تر و دندان‌ها کوچک‌تر شدند. شامپانزه می‌تواند چیزی را در دست بگیرد و تلوتلوخوران چند گام روی دو پا برود، اما قفسهٔ سینهٔ برجسته، لگن کشیده و ران و ساقی که هنگام ایستادن صاف نمی‌شوند نشان می‌دهد بدنش برای دوپایی ساخته نشده است. نخستین دوپایان (مانند ساحل‌انتروپوس چادنسیس) مغزی حدود ۴۰۰ تا ۵۰۰ سی‌سی — یک‌سوم مغز ما با ۱۴۵۰ تا ۱۵۵۰ سی‌سی — و قدی حدود یک متر داشتند.", "en": "Not from chimpanzees but alongside them: about 8–9 Mya (more common estimates say 6–7 Mya) an ape-like population lived in Africa. Mutations gave some of them a pelvis and anatomy that made two-legged walking easy. Those that did not became today's knuckle-walking chimpanzees; those that did took another path, along which brains grew and jaws and teeth shrank. A chimpanzee can carry something and totter a few steps upright, but its protruding chest, long pelvis and bent hips and knees show its body is not built for it. The first bipeds (e.g. Sahelanthropus tchadensis) had brains of about 400–500 cc — a third of our 1,450–1,550 cc — and stood about a metre tall.", "nl": "Niet ván maar náást chimpansees: zo'n 8–9 miljoen jaar geleden (vaker genoemd: 6–7) leefde in Afrika een aapachtige populatie. Mutaties gaven sommigen een bekken waarmee rechtop lopen makkelijk werd. Een chimpansee kan een paar stappen rechtop wankelen, maar zijn lichaam is er niet voor gebouwd. De eerste tweebenigen hadden een brein van 400–500 cc en waren ongeveer een meter lang."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "چهار سود دوپایی: (۱) دید دورتر — مثل میرکت که روی دو پا می‌ایستد تا دورتر را ببیند (هرچند برخی می‌گویند این‌گونه، شکارچیان هم او را بهتر می‌دیدند). (۲) دست‌های آزاد — برای حمل اشیا و برای ساختن؛ شستِ روبه‌روی چهار انگشت در همهٔ نخستی‌ها هست (برای گرفتن شاخه)، اما فقط وقتی دست در راه رفتن به کار نمی‌آید، این «گیرایی» به ساختن و کوبیدن سنگ‌ها می‌رسد؛ به تعبیر گوینده این یک «اثر جانبی» بود، نه نقشه‌ای از پیش. (۳) گرمای کمتر — در آفتاب سوزان آفریقا، بدنِ ایستاده سطح کمتری را در معرض تابش مستقیم خورشید (به‌ویژه نیم‌روز) قرار می‌دهد تا بدنِ چهاردست‌وپا. (۴) انرژی کمتر — برای بدنی که برای دوپایی ساخته شده، مفاصل و عضلاتِ درگیر انرژی کمتری مصرف می‌کنند؛ و «در طبیعت اتلاف انرژی نداریم»: سازوکارهای طبیعی آنچه را از نظر انرژی بهینه‌تر است برمی‌گزینند.", "en": "Four advantages of bipedalism: (1) a longer view — like a meerkat standing up (though some note one is also more visible to predators); (2) free hands for carrying and making — all primates have opposable thumbs for gripping branches, but only when hands are freed from walking does that grip turn to making and knapping; the speaker calls this a 'side effect', not a plan; (3) less heat — an upright body exposes less surface to direct sun, especially at midday; (4) less energy — for a body built for it, walking upright costs less, and 'nature does not waste energy'.", "nl": "Vier voordelen: (1) verder kijken, zoals een stokstaartje; (2) vrije handen om te dragen en te maken — de tegenoverstaande duim hebben alle primaten, maar pas met vrije handen werd grijpen maken; (3) minder hitte, omdat een rechtop lichaam minder zon vangt; (4) minder energie, voor een lichaam dat ervoor gebouwd is."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "لامارک و داروین، با مثال زرافه: لامارک گمان می‌کرد زرافه‌ها چون علفِ زمین کم شد گردنشان را کشیدند و گردن بلند به فرزندان رسید — یعنی میان نیاز محیط و پاسخ جاندار رابطه‌ای یک‌به‌یک هست. گوینده می‌گوید این‌طور نیست: جراحی‌های زیبایی والدین به فرزندان منتقل نمی‌شود؛ «تا ژن تغییر نکند، چیزی منتقل نمی‌شود». روایت داروینی: میان زرافه‌های گردن‌کوتاه، جهش‌هایی گردن‌بلندها را هم پدید آورد. در محیطی که علف روی زمین فراوان است، گردن بلند سودی ندارد و حتی زندگی را سخت‌تر می‌کند و نمی‌ماند؛ اما وقتی محیط چنان تغییر کند که گردن بلند به کار آید، دارندگانش فرزندان بیشتری می‌آورند. در پاسخ به این ایراد که «همهٔ این تغییرات هم‌زمان در ستون فقرات، عضلات و گردش خون با جهش تصادفی ناممکن است»، گوینده می‌گوید یک تغییر در یک جایگاه ژنیِ تنظیمی می‌تواند کل این بسته را با هم تغییر دهد؛ پس پای «ضرب احتمالات کور» در میان نیست.", "en": "Lamarck vs Darwin, via the giraffe: Lamarck thought giraffes stretched their necks when ground grass ran short and passed the longer neck on — a one-to-one link between need and response. Not so, says the speaker: parents' cosmetic surgery is not inherited; 'unless genes change, nothing is passed on'. The Darwinian account: mutations produced some long-necked giraffes among short-necked ones; where grass is plentiful the long neck is useless or a burden and does not spread, but when the environment changes so that it helps, its bearers leave more offspring. To the objection that simultaneous changes to spine, muscles and circulation are too improbable, he answers that a change at a single regulatory locus can shift the whole package together.", "nl": "Lamarck tegenover Darwin, met de giraffe: Lamarck dacht dat giraffen hun nek rekten en dat doorgaven. Niet zo: cosmetische chirurgie van ouders erven kinderen niet. Darwiniaans: mutaties gaven sommige giraffen een langere nek, die pas voordeel bracht toen de omgeving veranderde. Op het bezwaar dat zoveel gelijktijdige veranderingen te onwaarschijnlijk zijn: één regulerend gen kan het hele pakket tegelijk verschuiven."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "محیطِ «بدخلق» و انتخاب: جهش‌ها همواره رخ می‌دهند و تنوع (variation) می‌سازند. در محیطی پایدار، این تنوع کار چندانی نمی‌کند، اما در محیطی که مدام دما بالا و پایین می‌رود، خشکسالی می‌آید، دریاچه‌ها پدید می‌آیند و از میان می‌روند و یخبندان‌ها می‌آیند و می‌روند — «مثل آدمی بدخلق که هر لحظه چیزی می‌خواهد» — همان تنوع است که به برخی امکان بقا و فرزند بیشتر می‌دهد. شرق آفریقا در میلیون‌ها سال گذشته چنین محیطی بود.", "en": "A 'moody' environment and selection: mutations always occur and create variation. In a stable environment that variation achieves little, but where temperatures swing, droughts strike, lakes appear and vanish and ice ages come and go — 'like a moody person who wants something new every moment' — that variation lets some survive and reproduce more. East Africa was such a place.", "nl": "Een 'humeurige' omgeving en selectie: mutaties maken variatie. In een stabiele omgeving doet die weinig, maar waar temperatuur, droogte en meren steeds wisselen, laat juist die variatie sommigen overleven. Oost-Afrika was zo'n plek."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "کمردرد، نه نشانهٔ «فرازمینی‌بودن»: برخی هواداران شبه‌علم می‌گویند کمردرد نشان می‌دهد بدن انسان برای دوپایی طراحی نشده و پس انسان از سیارهٔ دیگری آمده است. پاسخ برنامه: بدن نیاکان ما میلیون‌ها سال برای راه رفتن — راه رفتن و راه رفتن — شکل گرفت؛ آنچه با آن سازگار نیست، نشستن ۸ تا ۹ ساعته پشت میز و باجه است، شیوه‌ای از زندگی که در ایران کمتر از صد سال سابقه دارد. آرتروز، گردن‌درد و کمردرد تا حد زیادی پیامد همین ناهم‌خوانیِ بدن کهن و زندگی تازه است.", "en": "Back pain is not a sign of alien origin: some pseudo-scientists claim back pain proves humans were not designed for bipedalism and hence came from another planet. The programme's reply: our ancestors' bodies were shaped over millions of years for walking, walking and walking; what they are not suited to is sitting eight or nine hours a day at a desk or counter — a lifestyle less than a century old in Iran. Arthritis, neck and back pain largely reflect this mismatch between an old body and a new life.", "nl": "Rugpijn is geen bewijs van buitenaardse afkomst: ons lichaam is gevormd om te lopen, niet om acht uur per dag aan een bureau te zitten. Rug- en nekklachten weerspiegelen vooral die mismatch."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "گروه، آواها و «خطرناک‌ترین دشمن»: تا حدود ۲ میلیون سال پیش، انواع گوناگونی از دوپایانِ میمون‌وار (استرالوپیتکوس‌ها) در آفریقا می‌زیستند که دست‌های بلند داشتند و شب‌ها برای امنیت به درخت پناه می‌بردند. در گروه‌های ۱۰ تا ۲۰ نفره زندگی می‌کردند، لاشه‌خواری می‌کردند و جانوران کوچک را می‌گرفتند. «کلام» به معنای ما نداشتند، اما آواهای معنادار تولید می‌کردند. گوینده نکته‌ای را مقدمهٔ اپیزودهای بعد قرار می‌دهد: خطرناک‌ترین دشمنِ هر گروه نه ببر دندان‌خنجری و نه ماموت، بلکه گروه دیگری از هم‌نوعان بود — «و هنوز هم هست».", "en": "Groups, calls and the 'most dangerous enemy': until about 2 Mya, various ape-like bipeds (australopiths) with long arms lived in Africa and sheltered in trees at night. They lived in groups of 10–20, scavenged and caught small animals, and had no language in our sense but produced meaningful calls. The speaker sets up a theme for later episodes: a group's most dangerous enemy was not the sabre-toothed cat or the mammoth but another group of its own kind — 'and still is'.", "nl": "Groepen, roepen en de 'gevaarlijkste vijand': tot ~2 miljoen jaar geleden leefden australopitheken in groepen van 10–20, met betekenisvolle roepen maar zonder taal. De gevaarlijkste vijand was niet de sabeltandkat maar een andere groep van de eigen soort — 'en dat is nog zo'."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "نقد: (۱) زمان جدایی انسان و شامپانزه بسته به کالیبراسیون ساعت مولکولی از حدود ۵ تا ۱۰ میلیون سال برآورد شده؛ ۶ تا ۷ میلیون سال رایج‌تر است و ۸ تا ۹ میلیون سالِ برنامه در کرانهٔ بالایی است. (۲) فرضیهٔ «گرمای کمتر» (پیتر ویلر) و «انرژی کمتر» (رادمن و مک‌هنری) هر دو تأثیرگذارند اما نقد دارند؛ دوپایی احتمالاً در محیطی نیمه‌جنگلی و نه در ساوانای باز آغاز شد، پس سود گرمایی در آغاز کمتر بود. نظریه‌های دیگری هم هست: حمل غذا و نوزاد، راه رفتن روی شاخه‌ها، نمایش. (۳) «یک جهش، کل گردن زرافه» ساده‌سازی است: ژن‌های تنظیمی (مانند HOX) تغییرات هماهنگ را آسان می‌کنند، اما گردن زرافه حاصل انتخابِ تدریجی بر جهش‌های فراوان است. (۴) کمردرد ریشه‌های چندگانه دارد؛ برخی پژوهشگران سازش‌های ناقصِ ستون فقرات دوپا را هم دخیل می‌دانند، هرچند هیچ‌کدام دلیلی بر «فرازمینی‌بودن» نیست.", "en": "Critique: (1) the human–chimp split is estimated at about 5–10 Mya depending on molecular-clock calibration; 6–7 Mya is more common, and the programme's 8–9 Mya is at the upper end. (2) The thermoregulation (Peter Wheeler) and energy-efficiency (Rodman & McHenry) hypotheses are influential but criticised; bipedalism likely began in wooded rather than open savanna settings, reducing the early heat advantage. Other theories exist: carrying food and infants, walking along branches, display. (3) 'One mutation, the whole giraffe neck' oversimplifies: regulatory genes (e.g. HOX) make coordinated change easier, but the neck reflects gradual selection on many mutations. (4) Back pain has multiple causes; some researchers also point to imperfect spinal adaptations to bipedalism — though none of this suggests alien origins.", "nl": "Kritiek: (1) de splitsing wordt geschat op 5–10 miljoen jaar; 6–7 is gangbaarder. (2) De hitte- en energiehypothesen zijn invloedrijk maar omstreden; tweebenigheid begon waarschijnlijk in bosrijk gebied. (3) 'Eén mutatie, de hele giraffennek' is een vereenvoudiging. (4) Rugpijn heeft meerdere oorzaken, maar wijst nooit op buitenaardse afkomst."}, "sources": ["src:60e7838a5a"], "flags": ["editor-note", "contested"]}, {"text": {"fa": "یادداشت خوانش: بر پایهٔ رونوشت خودکار اپیزود یکمِ نسخهٔ رادیویی «خداحافظ آفریقا»، به‌طور کامل. بخش بزرگی از آغاز اپیزود گفت‌وگوی شخصی میزبان دربارهٔ انگیزهٔ برنامه و دلخوری‌اش از «انسان بودن» است که در این مدخل نیامده؛ بحث «آگاهی از مرگ و فراموش‌کردنش» در این اپیزود در مدخل نئاندرتال و مدخل خاستگاه آیین آمده است.", "en": "Reading note: based on the full automatic transcript of radio episode 1. Much of the opening is the host's personal reflection on the programme's motives, not reproduced; the episode's discussion of death awareness and forgetting is covered in the Neanderthal and ritual-origins entries.", "nl": "Leesnotitie: gebaseerd op het volledige transcript van radioaflevering 1. De persoonlijke inleiding van de presentator is weggelaten; het stuk over doodsbewustzijn staat in de lemma's over de Neanderthaler en de oorsprong van ritueel."}, "sources": ["src:60e7838a5a"], "flags": ["editor-note"]}], "links": [{"to": "tabar:earliest-bipeds-and-australopithecus", "rel": "see-also", "note": {"fa": "نخستین دوپایان و استرالوپیتکوس‌ها", "en": "the earliest bipeds and australopiths", "nl": "de vroegste tweebenigen"}}, {"to": "tabar:primates-ape-ancestry-molecular-clock", "rel": "see-also", "note": {"fa": "ساعت مولکولی و جدایی از شامپانزه", "en": "the molecular clock and the chimp split", "nl": "de moleculaire klok"}}, {"to": "tabar:lomekwian-stone-technology", "rel": "see-also", "note": {"fa": "کهن‌ترین ابزارهای سنگی (لومکوی)", "en": "the oldest stone tools (Lomekwian)", "nl": "de oudste stenen werktuigen"}}, {"to": "tabar:darwin-natural-selection", "rel": "explains", "note": {"fa": "انتخاب طبیعی در برابر لامارک", "en": "natural selection versus Lamarck", "nl": "natuurlijke selectie tegenover Lamarck"}}, {"to": "tabar:hominin-evolution-changing-environments", "rel": "see-also", "note": {"fa": "محیط پرنوسان", "en": "variable environments", "nl": "wisselende omgevingen"}}, {"to": "tabar:homo-erectus-endurance-and-handaxe", "rel": "see-also", "note": {"fa": "گام بعد: راست‌قامت", "en": "next: Homo erectus", "nl": "volgende: Homo erectus"}}], "sources": ["src:60e7838a5a"], "people": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:europe-three-streams-yamnaya", "kind": "concept", "title": {"fa": "اروپا از سه جریان ساخته شد: شکارگردآورندگان، کشاورزان آناتولی و دامداران استپ (یامنایا)", "en": "Europe built from three streams: hunter-gatherers, Anatolian farmers and steppe herders (Yamnaya)", "nl": "Europa uit drie stromen: jager-verzamelaars, Anatolische boeren en steppeherders (Yamnaya)"}, "aliases": [], "parent": "tabar:population-genetics", "field": "tabar:population-genetics", "summary": {"fa": "بر پایهٔ ژنوم‌های باستانی، اروپاییان امروز از سه گروه بسیار متفاوت پدید آمده‌اند که طی حدود نه هزار سال به هم رسیدند. آخرین جریان، دامداران یامنایا از استپ، حدود ۵ هزار سال پیش با فرهنگ طناب‌نقش (Corded Ware) دگرگونی بزرگی در ترکیب ژنتیکی اروپای مرکزی ایجاد کرد. خود یامنایا آمیزه‌ای از شکارگردآورندگان اروپای شرقی و تباری «مرتبط با ایران و ارمنستان» بودند؛ این برچسب جغرافیایی بیش از حد دقیق نیست.", "en": "Based on ancient genomes, present-day Europeans descend from three very different groups that came together over about nine thousand years. The last stream, Yamnaya herders from the steppe, transformed the genetics of central Europe around 5,000 years ago with the Corded Ware culture. The Yamnaya themselves were a mix of eastern European hunter-gatherers and ancestry 'related to Iran and Armenia'; this geographic label is imprecise.", "nl": "Op basis van oud DNA stammen Europeanen af van drie sterk verschillende groepen die over ca. negenduizend jaar samenkwamen. De laatste stroom, Yamnaya-herders van de steppe, veranderde rond 5000 jaar geleden de genetica van Midden-Europa. De Yamnaya waren zelf een mengsel met afstamming 'verwant aan Iran en Armenië'; dat geografische label is onnauwkeurig."}, "points": [{"text": {"fa": "جریان نخست شکارگردآورندگان اروپایی‌اند. جریان دوم کشاورزانی از آناتولی (ترکیهٔ امروز) که پس از حدود ۹ هزار سال پیش رسیدند و در اروپای غربی و مرکزی بیش از ۹۰ درصد تبارشان را از مهاجران حفظ کردند. کشاورزان اولیه از نظر ژنتیکی به ساردینی‌های امروز شبیه‌اند. این بخش را بسیاری از پژوهش‌ها تکرار کرده‌اند.", "en": "The first stream is European hunter-gatherers. The second is farmers from Anatolia (present-day Turkey), who arrived after about 9,000 years ago and in western and central Europe kept more than 90 percent of ancestry from the migrants. Early farmers resemble present-day Sardinians genetically. This part has been replicated by many studies.", "nl": "The first stream is European hunter-gatherers. The second is farmers from Anatolia (present-day Turkey), who arrived after about 9,000 years ago and in western and central Europe kept more than 90 percent of ancestry from the migrants. Early farmers resemble present-day Sardinians genetically. This part has been replicated by many studies."}, "sources": ["src:a4f00f41ff", "src:92e120a792"], "flags": []}, {"text": {"fa": "جریان سوم دامداران یامنایا از استپ شمال دریای سیاه و خزر است که با ارابه و اسب حدود ۵ هزار سال پیش گسترش یافتند. رایش می‌گوید در آلمان مردم فرهنگ طناب‌نقش حدود سه‌چهارم تبارشان را از گروه‌های مرتبط با یامنایا داشتند و این تبار از آن پس در همهٔ شمال اروپا ماند. پیش از این داده‌ها بیشتر باستان‌شناسان فکر می‌کردند فرهنگ یامنایا بیشتر با تقلید و تجارت پخش شد، نه با جابه‌جایی انبوه مردم.", "en": "The third stream is Yamnaya herders from the steppe north of the Black and Caspian seas who spread with wagons and horses about 5,000 years ago. Reich states that people of the Corded Ware culture in Germany derived about three quarters of their ancestry from Yamnaya-related groups, and that this ancestry persists across northern Europe. Before these data most archaeologists thought Yamnaya culture spread by imitation and trade, not mass movement of people.", "nl": "The third stream is Yamnaya herders from the steppe north of the Black and Caspian seas who spread with wagons and horses about 5,000 years ago. Reich states that people of the Corded Ware culture in Germany derived about three quarters of their ancestry from Yamnaya-related groups, and that this ancestry persists across northern Europe. Before these data most archaeologists thought Yamnaya culture spread by imitation and trade, not mass movement of people."}, "sources": ["src:a4f00f41ff", "src:0ac39f77d9"], "flags": []}, {"text": {"fa": "خود یامنایا حدود نیمی از تبارشان را از شکارگردآورندگان اروپای شرقی و نیم دیگر را از تباری داشتند که به مردم باستانی و امروزی ایران و ارمنستان نزدیک است؛ احتمالاً از راه قفقاز. توجه: «مرتبط با ایران» به معنای مهاجرت مستقیم از فلات ایران نیست؛ پژوهش‌های بعدی این تبار را بیشتر به شکارگردآورندگان قفقاز نسبت می‌دهند که خود به کشاورزان باستانی ایران نزدیک بودند.", "en": "The Yamnaya themselves derived about half their ancestry from eastern European hunter-gatherers and the other half from ancestry close to ancient and present-day people of Iran and Armenia, probably via the Caucasus. Note: 'Iran-related' does not mean direct migration from the Iranian plateau; later work links this ancestry mainly to Caucasus hunter-gatherers, who were themselves close to ancient Iranian farmers.", "nl": "The Yamnaya themselves derived about half their ancestry from eastern European hunter-gatherers and the other half from ancestry close to ancient and present-day people of Iran and Armenia, probably via the Caucasus. Note: 'Iran-related' does not mean direct migration from the Iranian plateau; later work links this ancestry mainly to Caucasus hunter-gatherers, who were themselves close to ancient Iranian farmers."}, "sources": ["src:a4f00f41ff", "src:0ac39f77d9"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "فرایند نیرومند بود، ولی یکدست نبود. در شبه‌جزیرهٔ ایبری حدود ۳۰ درصد جمعیت جایگزین شد، اما در مردان با تبار یامنایا حدود ۹۰ درصد کروموزوم Y از نوع استپی بود که پیش‌تر در آنجا نبود. رایش از این نتیجه می‌گیرد که مردان وابسته به قدرت در رقابت بر سر همسر پیروز بودند و گسترش «کاملاً مسالمت‌آمیز» نبود. (ادامه در مدخل دربارهٔ جنسیت و نابرابری.)", "en": "The process was powerful but not uniform. In Iberia about 30 percent of the population was replaced, yet around 90 percent of males with Yamnaya ancestry carried a steppe-type Y chromosome that was previously absent. Reich infers that men with power outcompeted local men for mates and that the spread was not entirely peaceful. (More in the entry on sex bias and inequality.)", "nl": "The process was powerful but not uniform. In Iberia about 30 percent of the population was replaced, yet around 90 percent of males with Yamnaya ancestry carried a steppe-type Y chromosome that was previously absent. Reich infers that men with power outcompeted local men for mates and that the spread was not entirely peaceful. (More in the entry on sex bias and inequality.)"}, "sources": ["src:a4f00f41ff", "src:f0cf216e27"], "flags": ["editor-note"]}, {"text": {"fa": "رایش یادآوری می‌کند این یافته ریشه‌های ایدئولوژیک دارد: گوستاو کوسینا، باستان‌شناس آلمانی، فرهنگ طناب‌نقش را پایهٔ ادعای ناسیونالیستی آلمان کرد و نازی‌ها از آن استفاده کردند. پس از جنگ، باستان‌شناسان نسبت به هر تبیین مبتنی بر مهاجرت بدگمان شدند. به نظر او ژنتیک نشان می‌دهد مهاجرت واقعاً رخ داده، اما آمیختگی هم نشان می‌دهد «خلوص» تباری در کار نبوده است.", "en": "Reich points out the ideological background: the German archaeologist Gustaf Kossinna made the Corded Ware culture a basis for German nationalist claims, and the Nazis used his work. After the war archaeologists became wary of migration explanations. In his view genetics shows migration did happen, but the resulting mixture also shows there was no 'purity' of ancestry.", "nl": "Reich points out the ideological background: the German archaeologist Gustaf Kossinna made the Corded Ware culture a basis for German nationalist claims, and the Nazis used his work. After the war archaeologists became wary of migration explanations. In his view genetics shows migration did happen, but the resulting mixture also shows there was no 'purity' of ancestry."}, "sources": ["src:a4f00f41ff"], "flags": []}], "links": [{"to": "tabar:steppe-indo-iranian", "rel": "see-also", "note": {"fa": "همین تبار استپی در جنوب و میانهٔ آسیا", "en": "The same steppe ancestry in South and Central Asia", "nl": "The same steppe ancestry in South and Central Asia"}}, {"to": "tabar:iranian-farmer-legacy", "rel": "bridges", "note": {"fa": "تبار «ایرانی» در یامنایا", "en": "The 'Iran-related' component in Yamnaya", "nl": "The 'Iran-related' component in Yamnaya"}}, {"to": "tabar:indo-european-origin-debate", "rel": "see-also", "note": {"fa": "پرسش زبان هندواروپایی", "en": "The Indo-European language question", "nl": "The Indo-European language question"}}, {"to": "tabar:sex-bias-inequality-genome", "rel": "see-also", "note": {"fa": "گسترش مردانه و نابرابری", "en": "Male-biased expansion and inequality", "nl": "Male-biased expansion and inequality"}}, {"to": "tabar:t1-europe-three-ancestry-layers", "rel": "see-also", "note": {"fa": "مدخل هم‌موضوع", "en": "Related entry", "nl": "Verwant lemma"}}], "people": ["core:iosif-lazaridis", "core:david-anthony", "core:gustaf-kossinna", "core:v-gordon-childe"], "sources": ["src:0ac39f77d9", "src:92e120a792", "src:a4f00f41ff", "src:f0cf216e27"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:iranian-genetic-diversity", "kind": "concept", "title": {"fa": "تنوع ژنتیکی مردم ایران", "en": "Genetic diversity of the Iranian population", "nl": "Genetische diversiteit van de Iraanse bevolking"}, "aliases": ["Iranome", "ایرانوم"], "parent": "tabar:population-genetics", "field": "tabar:population-genetics", "summary": {"fa": "ایرانیان یکی از ناهمگن‌ترین جمعیت‌های ژنتیکی خاورمیانه‌اند؛ گروه‌های بزرگ (فارس، کرد، لر، آذری، عرب) به هم نزدیک‌اند و چند گروه (بلوچ، ترکمن، سیستانی) تمایز بیشتری دارند؛ و بخش قابل توجهی از واریانت‌های ایرانی در پایگاه‌های داده جهانی غایب است.", "en": "Iranians are among the most genetically heterogeneous populations of the Middle East; the large groups (Persians, Kurds, Lurs, Azeris, Arabs) are close to one another while a few (Baloch, Turkmen, Sistani) are more distinct; and a notable share of Iranian variants is absent from global databases.", "nl": "Iraniërs behoren tot de genetisch meest heterogene bevolkingen van het Midden-Oosten; de grote groepen (Perzen, Koerden, Loeren, Azeri's, Arabieren) liggen dicht bij elkaar terwijl enkele (Beloetsji, Turkmenen, Sistani) meer afwijken; en een opmerkelijk deel van de Iraanse varianten ontbreekt in wereldwijde databanken."}, "points": [{"text": {"fa": "مهرجو و همکاران (۲۰۱۹): ۱٬۰۲۱ نفر از ۱۱ گروه قومی؛ ایرانیان خوشهٔ «ایرانی مرکزی» بزرگی تشکیل می‌دهند و تمایز بین‌گروهی در کل کم اما در بلوچ‌ها، ترکمن‌ها و سیستانی‌ها بیشتر است؛ نشانه‌هایی از انزوای تاریخی و آمیزش با همسایگان شرقی.", "en": "Mehrjoo et al. (2019): 1,021 people from 11 ethnic groups; Iranians form a large \"central Iranian\" cluster with low overall between-group differentiation, higher among Baloch, Turkmen and Sistani; signs of historical isolation and admixture with eastern neighbours.", "nl": "Mehrjoo et al. (2019): 1,021 people from 11 ethnic groups; Iranians form a large \"central Iranian\" cluster with low overall between-group differentiation, higher among Baloch, Turkmen and Sistani; signs of historical isolation and admixture with eastern neighbours."}, "sources": ["src:02461bf7f4"], "flags": []}, {"text": {"fa": "ایرانوم (۲۰۱۹): توالی اگزوم ۸۰۰ نفر از ۸ گروه قومی؛ درصد قابل توجهی از واریانت‌ها در پایگاه‌های بین‌المللی ثبت نشده بود؛ بدون مرجع بومی، تفسیر آزمایش‌های ژنتیک بالینی در ایران خطا دارد.", "en": "Iranome (2019): exome sequences of 800 people from 8 ethnic groups; a notable share of variants had not been recorded in international databases; without a local reference, interpreting clinical genetic tests in Iran is error-prone.", "nl": "Iranome (2019): exome sequences of 800 people from 8 ethnic groups; a notable share of variants had not been recorded in international databases; without a local reference, interpreting clinical genetic tests in Iran is error-prone."}, "sources": ["src:3c4d0940c4"], "flags": []}, {"text": {"fa": "فلات ایران در طول تاریخ چهارراه مهاجرت بوده؛ با این حال داده‌ها نشان می‌دهد لایهٔ اصلی تبار، پیوستگی طولانی با جمعیت‌های باستانی خود منطقه دارد، نه جایگزینی کامل.", "en": "The Iranian plateau has been a crossroads of migration throughout history; yet the data show that the main layer of ancestry has long continuity with the region's own ancient populations rather than full replacement.", "nl": "The Iranian plateau has been a crossroads of migration throughout history; yet the data show that the main layer of ancestry has long continuity with the region's own ancient populations rather than full replacement."}, "sources": ["src:02461bf7f4", "src:73a4e45469"], "flags": []}], "links": [{"to": "tabar:zagros-neolithic", "rel": "explains", "note": {"fa": "لایهٔ باستانی تبار ایرانیان", "en": "The ancient layer of Iranian ancestry", "nl": "The ancient layer of Iranian ancestry"}}, {"to": "tabar:gwas-polygenic", "rel": "applies-to", "note": {"fa": "چرا پنل مرجع بومی لازم است", "en": "Why a local reference panel is needed", "nl": "Why a local reference panel is needed"}}, {"to": "tabar:consanguinity", "rel": "see-also", "note": {"fa": "ساختار ازدواج و بار واریانت‌های مغلوب", "en": "Marriage structure and the load of recessive variants", "nl": "Marriage structure and the load of recessive variants"}}], "people": [], "sources": ["src:02461bf7f4", "src:3c4d0940c4", "src:73a4e45469"], "booklets": [], "origin": null, "iran": "iran:genetic-heterogeneity", "wikidata": null, "status": "draft"}, {"id": "tabar:meat-eating-hunting-hypothesis", "kind": "concept", "title": {"fa": "فرضیهٔ گوشت‌خواری و «انسانِ شکارچی»", "en": "The meat-eating / Man-the-Hunter hypothesis", "nl": "De vleeseterhypothese / «Man-the-Hunter»"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "از دههٔ ۱۹۵۰ دیدگاه رایج این بود که خوردن گوشت و شکار انسان را از میمون‌های انسان‌نما جدا کرد. رانگهم می‌گوید گوشت‌خواری گذار اول (به انسان‌های ابزارساز اولیه) را خوب توضیح می‌دهد، اما گذار دوم (به هومو ارکتوس با دهان و دندان کوچک) را نه، و برای آن به پختن نیاز است. منتقدان می‌گویند این تفکیک هنوز اثبات نشده است.", "en": "Since the 1950s the dominant view held that meat eating and hunting separated humans from apes. Wrangham argues that meat eating explains the first transition (to early tool-making habilines) but not the second (to Homo erectus with small mouth and teeth), which needs cooking. Critics say this separation is unproven.", "nl": "Sinds de jaren 1950 gold vleesconsumptie en jacht als de motor van menswording. Wrangham stelt dat vlees de eerste overgang verklaart maar niet de tweede (Homo erectus met kleine kaken), waarvoor koken nodig is. Critici vinden dit onbewezen."}, "points": [{"text": {"fa": "پایهٔ فرضیه: همهٔ جوامع شکارگر-گردآورِ شناخته‌شده بخش بزرگی از کالری‌شان را از گوشت می‌گیرند، و برش‌های ابزار سنگی روی استخوان‌ها گوشت‌خواری را تا حدود ۲٫۶ میلیون سال پیش نشان می‌دهد. شامپانزه‌ها هم گوشت می‌خورند، اما ماه‌ها بدون آن می‌گذرانند.", "en": "Basis of the hypothesis: all known hunter-gatherer societies draw a large share of calories from meat, and cut marks from stone tools on bones show butchery back to about 2.6 million years ago. Chimpanzees eat meat too, but may go months without it.", "nl": "Basis of the hypothesis: all known hunter-gatherer societies draw a large share of calories from meat, and cut marks from stone tools on bones show butchery back to about 2.6 million years ago. Chimpanzees eat meat too, but may go months without it."}, "sources": ["src:c12cd83ad0"], "flags": []}, {"text": {"fa": "رانگهم دو ایراد می‌گیرد: الف) این روایت نمی‌گوید شکار چگونه بدون غذای گردآوری‌شده ممکن بود، و گردآوری در جوامع امروزی بیشتر کار زنان است؛ ب) در فسیل‌ها دو گذار جدا دیده می‌شود (مرحلهٔ ابزارساز اولیه و بعد هومو ارکتوس) و یک علت برای هر دو قانع‌کننده نیست.", "en": "Wrangham raises two objections: (a) the story does not explain how hunting was possible without gathered food, and gathering in modern societies is mostly done by women; (b) the fossils show two separate transitions (early tool-making hominins, then Homo erectus), and a single cause for both is not convincing.", "nl": "Wrangham raises two objections: (a) the story does not explain how hunting was possible without gathered food, and gathering in modern societies is mostly done by women; (b) the fossils show two separate transitions (early tool-making hominins, then Homo erectus), and a single cause for both is not convincing."}, "sources": ["src:c12cd83ad0"], "flags": []}, {"text": {"fa": "استدلال او دربارهٔ دندان: هومو ارکتوس دهان و دندان کوچک و فک ضعیف داشت، یعنی برای جویدن گوشت خام و سخت مناسب نبود. پس هرچه گوشت‌خواری در آن دوره بیشتر شده باشد، کوچک‌شدن دندان‌ها را توضیح نمی‌دهد.", "en": "His argument from teeth: Homo erectus had a small mouth, small teeth and weak jaws, poorly suited to tough raw meat, so growing meat intake alone does not explain shrinking teeth.", "nl": "His argument from teeth: Homo erectus had a small mouth, small teeth and weak jaws, poorly suited to tough raw meat, so growing meat intake alone does not explain shrinking teeth."}, "sources": ["src:c12cd83ad0"], "flags": []}, {"text": {"fa": "نظر ویراستار: این استدلال را باید با پژوهش زینک و لیبرمن (۲۰۱۶) سنجید. آن‌ها آزمایش کردند که بریدن و کوبیدن گوشت و غده‌ها با ابزار سنگی، نیروی جویدن لازم را به‌طور چشمگیری کم می‌کند. به همین دلیل بعضی پژوهشگران می‌گویند فراوری مکانیکیِ بدون آتش هم می‌توانست دندان‌ها را کوچک کند و برای توضیح آن به پختن نیاز نیست.", "en": "Editor's note: this should be weighed against Zink and Lieberman (2016), who showed experimentally that slicing and pounding meat and tubers with stone tools greatly reduces chewing effort. Some researchers therefore argue that mechanical processing without fire could have allowed smaller teeth, so cooking is not required to explain them.", "nl": "Editor's note: this should be weighed against Zink and Lieberman (2016), who showed experimentally that slicing and pounding meat and tubers with stone tools greatly reduces chewing effort. Some researchers therefore argue that mechanical processing without fire could have allowed smaller teeth, so cooking is not required to explain them."}, "sources": ["src:c64b6db5f6"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "نظر ویراستار: عنوان «انسانِ شکارچی» از نظر فمینیستی و مردم‌شناختی هم نقد شده است،
