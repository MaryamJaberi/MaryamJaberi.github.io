<title>تبار و ژنتیک — دانش‌سرا</title>

<style>
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);min-height:var(--header-h)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--ink)}
.brand svg{width:26px;height:26px;color:var(--primary)}
.crumbs{font-size:var(--small);color:var(--ink-2)}.crumbs a{color:var(--ink-2)}
.lang{display:flex;gap:2px;border:1px solid var(--line-strong);border-radius:var(--r-full);padding:2px}
.lang button{font:inherit;font-size:var(--chip);padding:4px 10px;border:0;border-radius:var(--r-full);background:transparent;color:var(--ink-2);cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
main{padding-block:var(--s6) var(--s16)}
.hero{display:grid;gap:var(--s3);margin-bottom:var(--s6)}
.hero h1{margin:0}
.hero p{color:var(--ink-2);font-size:1.05rem;max-width:70ch;margin:0}
.draft{display:inline-flex;align-items:center;gap:8px;font-size:var(--chip);padding:4px 12px;border-radius:var(--r-full);background:var(--warn-bg,#FBF1D9);color:var(--warn-ink,#6B4E00);border:1px solid var(--warn-line,#E8D39A)}
.search{display:flex;gap:8px;margin:var(--s4) 0}
.search input{font:inherit;flex:1;min-width:0;padding:10px 14px;border-radius:var(--r-md);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink)}
.fields{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:var(--s6)}
.fields button{font:inherit;font-size:var(--small);padding:6px 14px;border-radius:var(--r-full);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer}
.fields button[aria-pressed=true]{background:var(--primary);color:#fff;border-color:var(--primary)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--s4)}
.grid .card{padding:var(--s5);display:grid;gap:8px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.grid .card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.grid h3{margin:0;font-size:var(--h4)}
.grid p{margin:0;color:var(--ink-2);font-size:var(--small);line-height:1.75;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.kick{font-size:var(--chip);color:var(--primary);font-weight:700}
.sub{color:var(--ink-3);font-size:var(--small);direction:ltr;text-align:start;unicode-bidi:isolate}
[dir=rtl] .sub{text-align:right}
.fsec{margin-bottom:var(--s8)} .fsec h2{font-size:var(--h3);margin:0 0 var(--s1)} .fsec>p{margin:0 0 var(--s4);color:var(--ink-2);max-width:70ch}
article.detail{display:grid;gap:var(--s5);max-width:78ch}
article.detail h1{margin:0}
article.detail .lead{font-size:1.1rem;line-height:1.9;margin:0}
.back{font:inherit;font-size:var(--small);border:0;background:transparent;color:var(--primary);cursor:pointer;padding:0;text-align:start}
.pts{display:grid;gap:var(--s3);margin:0;padding:0;list-style:none}
.pts li{padding:var(--s4) var(--s5);border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);line-height:1.85;position:relative}
.pts li .ref{font-size:var(--chip);color:var(--ink-3);display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.flag{font-size:var(--chip);padding:1px 8px;border-radius:var(--r-full);border:1px solid}
.flag.unreplicated{color:#8A2E2E;border-color:#E3B4B4;background:#FBEDED}
.flag.contested{color:#6B4E00;border-color:#E8D39A;background:#FBF1D9}
.flag.dated{color:var(--ink-2);border-color:var(--line-strong)}
.ev{font-size:var(--chip);padding:1px 8px;border-radius:var(--r-full);border:1px solid var(--line-strong);color:var(--ink-2)} .ev.t1{border-color:#2F7D4F;color:#2F7D4F} .ev.t2{border-color:#3C6EA8;color:#3C6EA8} .ev.t3{border-color:#8A6D1D;color:#8A6D1D} .ev.t4,.ev.t0{border-color:#8A2E2E;color:#8A2E2E}
.flag.editor-note{color:var(--primary);border-color:var(--primary)}
h2.sec{font-size:var(--small);color:var(--ink-2);font-weight:600;margin:var(--s2) 0 0;text-transform:uppercase;letter-spacing:.04em}
.links{display:grid;gap:6px}
.links a{display:flex;gap:10px;align-items:baseline;padding:8px 12px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--ink)}
.links a:hover{border-color:var(--primary)}
.links .rel{font-size:var(--chip);color:var(--primary);min-width:7em}
.links .nt{font-size:var(--small);color:var(--ink-2)}
.links .ext{font-size:var(--chip);color:var(--ink-3)}
.ppl{display:flex;flex-wrap:wrap;gap:6px}
.ppl span{font-size:var(--small);padding:4px 10px;border-radius:var(--r-full);border:1px solid var(--line-strong);background:var(--surface)}
.ppl small{color:var(--ink-3)}
.iran{border-inline-start:4px solid var(--primary);padding:var(--s4) var(--s5);border-radius:var(--r-md);background:var(--surface);display:grid;gap:8px}
.iran .q{font-weight:700}
.grade{display:inline-block;font-size:var(--chip);padding:1px 8px;border-radius:var(--r-full);background:var(--ink);color:var(--paper)}
ol.src{direction:ltr;text-align:left;padding-inline-start:1.4em;margin:0;display:grid;gap:6px;font-size:var(--small);color:var(--ink-2);line-height:1.7}
ol.src a{color:var(--primary)}
.status{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:var(--small);color:var(--ink-3)}
footer.foot{border-top:1px solid var(--line);padding-block:var(--s8);color:var(--ink-3);font-size:var(--small)}
@media (prefers-color-scheme: dark){:root:not([data-theme=light]) .flag.unreplicated{background:#3A1F1F;color:#F2B8B8;border-color:#6B3A3A} :root:not([data-theme=light]) .flag.contested,:root:not([data-theme=light]) .draft{background:#3A3010;color:#F0D78A;border-color:#6B5A2A}}
:root[data-theme=dark] .flag.unreplicated{background:#3A1F1F;color:#F2B8B8;border-color:#6B3A3A} :root[data-theme=dark] .flag.contested,:root[data-theme=dark] .draft{background:#3A3010;color:#F0D78A;border-color:#6B5A2A}
</style>

<script>
const D = {"wiki": "tabar", "order": ["tabar:behavior-genetics", "tabar:population-genetics", "tabar:human-evolution", "tabar:epigenetics", "tabar:medical-genetics", "tabar:genealogy", "tabar:genetics-society"], "concepts": [{"id": "tabar:darwin-classification-descent", "kind": "concept", "title": {"fa": "رده‌بندی، اندام‌های ناکارا و جنین‌شناسی به‌عنوان شاهد نیای مشترک", "en": "Classification, rudimentary organs and embryology as evidence of common descent", "nl": "Classificatie, rudimentaire organen en embryologie als bewijs voor gemeenschappelijke afstamming"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "داروین می‌گوید رده‌بندیِ تو در توی جانداران (گونه در جنس در خانواده) همان «شجرهٔ نسب» است، نه فقط طرحی برای آسانی. شباهت ساختاری اندام‌ها (مثل بازوی انسان و بال خفاش)، اندام‌های بی‌کارکرد و شباهت جنین‌ها همه با نیای مشترک بهتر توضیح داده می‌شوند تا با طرح‌های جداگانهٔ آفرینش. او در پایان کتاب تنها اشاره‌ای کوتاه به انسان می‌کند.", "en": "Darwin argues that the nested classification of life (species within genus within family) is a family tree, not just a filing system. Structural likeness (human arm, bat wing), useless organs and similar embryos fit common descent better than separate design plans. At the close he makes only a brief allusion to humans.", "nl": "Darwin stelt dat de geneste classificatie van het leven in feite een stamboom is. Structurele gelijkenis, rudimentaire organen en gelijkende embryo's passen beter bij gemeenschappelijke afstamming. Over de mens zegt hij aan het einde slechts kort iets."}, "points": [{"text": {"fa": "جانداران طوری رده‌بندی می‌شوند که گروه‌ها درون گروه‌های بزرگ‌تر جا می‌گیرند. داروین می‌گوید پیوند پنهانی که طبیعی‌شناسان با «شباهت» دنبال می‌کردند، در واقع نسب مشترک است. او شباهت‌های ساختاری میان اندام‌های بسیار متفاوت از نظر کارکرد (دست، بال، باله) را مثل هم‌ریشگی (هومولوژی) می‌بیند.", "en": "Organisms fall into groups inside larger groups. Darwin says the hidden bond naturalists were seeking in 'resemblance' is actually shared descent. He treats structural likeness among organs with very different functions (hand, wing, flipper) as homology.", "nl": "Organisms fall into groups inside larger groups. Darwin says the hidden bond naturalists were seeking in 'resemblance' is actually shared descent. He treats structural likeness among organs with very different functions (hand, wing, flipper) as homology."}, "sources": ["src:84786f7bfa"], "flags": []}, {"text": {"fa": "اندام‌های ناکارا (نیمه‌ازبین‌رفته) مثل بال‌های ریز برخی سوسک‌ها یا استخوان‌های لگن نهنگ، با «ناستفاده» و انتخاب توضیح داده می‌شوند و از شاهدهای مهم‌اند. جنین‌شناسی هم مشابه است: جنین‌های گروه‌های مختلف شبیه‌ترند از بالغ‌هایشان، چون ساختار نیای مشترک را بازتاب می‌دهند.", "en": "Rudimentary organs (reduced and useless), such as tiny wings in some beetles, are explained by disuse and selection and count as important evidence. Embryology is parallel: embryos of different groups resemble each other more than adults do, reflecting a shared ancestral plan.", "nl": "Rudimentary organs (reduced and useless), such as tiny wings in some beetles, are explained by disuse and selection and count as important evidence. Embryology is parallel: embryos of different groups resemble each other more than adults do, reflecting a shared ancestral plan."}, "sources": ["src:84786f7bfa"], "flags": []}, {"text": {"fa": "تأیید مولکولی: مقایسهٔ توالی دی‌ان‌ای و پروتئین‌ها درخت‌هایی می‌دهد که با رده‌بندی بر پایهٔ ساختار هم‌خوانی چشمگیر دارد. ژنوم انسان و شامپانزه حدود ۹۸–۹۹ درصد در بخش قابل مقایسه شبیه است. دی‌ان‌ای باستانی هم نشان داده انسان‌های امروزی و نئاندرتال‌ها آمیخته‌اند، پس «درخت» گاهی شبکه‌ای هم می‌شود.", "en": "Molecular confirmation: comparing DNA and protein sequences gives trees strikingly consistent with structure-based classification. Human and chimpanzee genomes are about 98–99% similar in comparable regions. Ancient DNA has shown modern humans and Neanderthals interbred, so the 'tree' is sometimes also a network.", "nl": "Molecular confirmation: comparing DNA and protein sequences gives trees strikingly consistent with structure-based classification. Human and chimpanzee genomes are about 98–99% similar in comparable regions. Ancient DNA has shown modern humans and Neanderthals interbred, so the 'tree' is sometimes also a network."}, "sources": ["src:ca65b3b7c6"], "flags": ["editor-note"]}, {"text": {"fa": "اصلاح دربارهٔ جنین‌شناسی: برداشت قدیمی «رشد جنین، تکرار کامل تاریخ تکاملی است» (هکل، که پس از داروین آمد) نادرست است. جنین‌ها شباهت‌هایی دارند ولی تکرار مراحل بزرگسالی نیاکان را نمی‌بینیم. دربارهٔ انسان، داروین فقط می‌نویسد روشنی بر منشأ انسان و تاریخ او خواهد افتاد؛ بحث تفصیلی را در «تبار انسان» (۱۸۷۱) آورد.", "en": "Correction on embryology: the old claim that 'embryo development fully replays evolutionary history' (Haeckel, after Darwin) is wrong. Embryos share features, but they do not replay the adult stages of ancestors. On humans, Darwin merely writes that light will be thrown on human origins; the detailed treatment came in The Descent of Man (1871).", "nl": "Correction on embryology: the old claim that 'embryo development fully replays evolutionary history' (Haeckel, after Darwin) is wrong. Embryos share features, but they do not replay the adult stages of ancestors. On humans, Darwin merely writes that light will be thrown on human origins; the detailed treatment came in The Descent of Man (1871)."}, "sources": ["src:84786f7bfa"], "flags": ["dated", "editor-note"]}], "links": [{"to": "tabar:neanderthal-admixture", "rel": "see-also", "note": {"fa": "آمیزش با نئاندرتال‌ها و دنیسوواها", "en": "Admixture with Neanderthals and Denisovans", "nl": "Admixture with Neanderthals and Denisovans"}}, {"to": "tabar:human-genome", "rel": "see-also", "note": {"fa": "ژنوم انسان", "en": "The human genome", "nl": "The human genome"}}, {"to": "tabar:common-ancestors", "rel": "see-also", "note": {"fa": "ریاضی نیاکان", "en": "The mathematics of ancestors", "nl": "The mathematics of ancestors"}}, {"to": "tabar:human-evolution", "rel": "part-of", "note": {"fa": "تکامل انسان", "en": "Human evolution", "nl": "Human evolution"}}], "people": ["core:charles-darwin", "core:ernst-haeckel"], "sources": ["src:84786f7bfa", "src:ca65b3b7c6"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:indo-european-origin-debate", "kind": "concept", "title": {"fa": "خاستگاه زبان‌های هندواروپایی: فرضیهٔ استپ، فرضیهٔ آناتولی و دیدگاه رایش", "en": "Origin of Indo-European languages: steppe vs Anatolian hypothesis and Reich's view", "nl": "Oorsprong van de Indo-Europese talen: steppe- versus Anatolische hypothese en Reichs visie"}, "aliases": [], "parent": "tabar:population-genetics", "field": "tabar:population-genetics", "summary": {"fa": "رایش می‌گوید ژنتیک باستانی «آخرین حرف» را درباره منشأ هندواروپایی نمی‌زند، اما فرضیهٔ آناتولیِ رنفرو را ناکارا کرده و نقش دامداران یامنایا را در پخش بیشتر این زبان‌ها محتمل ساخته است. او حدس می‌زند زبان نخستین هندواروپایی در جنوب قفقاز (شاید ایران یا ارمنستان) گویش می‌شد. زبان‌شناسان و باستان‌شناسان این تصویر را هنوز به‌طور کامل نپذیرفته‌اند.", "en": "Reich says ancient DNA does not give the final word on the origin of Indo-European, but it has undermined Renfrew's Anatolian hypothesis and made a role for Yamnaya herders in spreading most of these languages likely. He guesses that the earliest Indo-European was spoken south of the Caucasus (perhaps Iran or Armenia). Linguists and archaeologists have not fully accepted this picture.", "nl": "Reich zegt dat oud DNA het laatste woord niet geeft, maar de Anatolische hypothese van Renfrew heeft verzwakt en een rol van Yamnaya-herders waarschijnlijk maakt. Hij vermoedt dat Proto-Indo-Europees ten zuiden van de Kaukasus (misschien Iran of Armenië) werd gesproken. Taalkundigen en archeologen hebben dit beeld nog niet volledig aanvaard."}, "points": [{"text": {"fa": "دو فرضیه رقیب‌اند. فرضیهٔ آناتولی (کالین رنفرو، ۱۹۸۷): زبان‌ها با کشاورزان ترکیه پس از ۹ هزار سال پیش پخش شد. فرضیهٔ استپ (از جمله دیوید آنتونی): واژگان مشترک «ارابه و چرخ» در شاخه‌های زندهٔ این خانواده نشان می‌دهد نیای مشترک بیش از حدود ۶ هزار سال پیش نمی‌زیسته و باید با یامنایا مرتبط باشد.", "en": "Two hypotheses compete. The Anatolian hypothesis (Colin Renfrew, 1987): the languages spread with farmers from Turkey after 9,000 years ago. The steppe hypothesis (e.g. David Anthony): shared vocabulary for wagons and wheels across the living branches indicates a common ancestor no older than about 6,000 years, linked to the Yamnaya.", "nl": "Two hypotheses compete. The Anatolian hypothesis (Colin Renfrew, 1987): the languages spread with farmers from Turkey after 9,000 years ago. The steppe hypothesis (e.g. David Anthony): shared vocabulary for wagons and wheels across the living branches indicates a common ancestor no older than about 6,000 years, linked to the Yamnaya."}, "sources": ["src:a4f00f41ff", "src:293bb0dd11", "src:cf43544e1c"], "flags": []}, {"text": {"fa": "استدلال رایش: ژنوم‌ها نشان می‌دهند مهاجرتی انبوه از استپ هم به اروپا و هم به هند رسیده. چون جابه‌جایی انبوه مردم معمولاً شرط تغییر زبان است، او نتیجه می‌گیرد دست‌کم بیشتر زبان‌های هندواروپایی اروپا و هند با یامنایا پخش شده‌اند. ژنتیک خودش زبان مردم را نمی‌گوید؛ فقط نشان می‌دهد مهاجرتی رخ داده است.", "en": "Reich's argument: genomes show a mass migration from the steppe into both Europe and India. Because mass movement of people is usually needed for language replacement, he concludes that at least most Indo-European languages of Europe and India were spread by the Yamnaya. Genetics does not reveal which language people spoke; it shows that a migration happened.", "nl": "Reich's argument: genomes show a mass migration from the steppe into both Europe and India. Because mass movement of people is usually needed for language replacement, he concludes that at least most Indo-European languages of Europe and India were spread by the Yamnaya. Genetics does not reveal which language people spoke; it shows that a migration happened."}, "sources": ["src:a4f00f41ff"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "نظر خاص رایش دربارهٔ خانهٔ نخستین: زبان‌های آناتولی (مثل هیتی) واژگان کامل چرخ را ندارند و در ژنوم‌های باستانی آناتولی ردپای تبار یامنایا نیست؛ پس او فکر می‌کند گویندگان زبان نخستین احتمالاً جنوب قفقاز، شاید ایران یا ارمنستان، می‌زیستند و یک شاخه به استپ و شاخهٔ دیگر به آناتولی رفت. خودش این را «به نظر من محتمل‌ترین» می‌نامد، نه چیزی اثبات‌شده.", "en": "Reich's own view on the original homeland: Anatolian languages such as Hittite lack the full wheel vocabulary and ancient Anatolian genomes show no Yamnaya-type ancestry, so he thinks the first speakers probably lived south of the Caucasus, perhaps in Iran or Armenia, with one branch going to the steppe and another to Anatolia. He himself presents this as what seems most likely to him, not as established.", "nl": "Reich's own view on the original homeland: Anatolian languages such as Hittite lack the full wheel vocabulary and ancient Anatolian genomes show no Yamnaya-type ancestry, so he thinks the first speakers probably lived south of the Caucasus, perhaps in Iran or Armenia, with one branch going to the steppe and another to Anatolia. He himself presents this as what seems most likely to him, not as established."}, "sources": ["src:a4f00f41ff"], "flags": ["editor-note"]}, {"text": {"fa": "نظرهای مخالف: زبان‌شناسان گفته‌اند درخت‌های زبانی بر پایهٔ شمارش واژه‌ها ریشهٔ قدیم‌تری (نزدیک ۸ هزار سال) برای شاخهٔ آناتولی نشان می‌دهد و به یک مدل ترکیبی می‌رسند: ریشه در جنوب قفقاز یا آناتولی و گسترش ثانویهٔ استپ (هگرتی و همکاران، ۲۰۲۳). نمونه‌های ژنوم از قلمرو هیتی‌ها هم تبار استپی نداشتند، پس زبان لزوماً همراه ژن جابه‌جا نمی‌شود. بحث ادامه دارد و هر دو طرف دلیل دارند.", "en": "Opposing views: linguists using word-based phylogenetic trees obtain an older root (about 8,000 years) for the Anatolian branch and propose a hybrid model: a root in the south Caucasus or Anatolia with a secondary spread from the steppe (Heggarty et al. 2023). Genomes from Hittite-era Anatolia also lack steppe ancestry, showing that language does not always travel with genes. The debate continues and both sides have arguments.", "nl": "Opposing views: linguists using word-based phylogenetic trees obtain an older root (about 8,000 years) for the Anatolian branch and propose a hybrid model: a root in the south Caucasus or Anatolia with a secondary spread from the steppe (Heggarty et al. 2023). Genomes from Hittite-era Anatolia also lack steppe ancestry, showing that language does not always travel with genes. The debate continues and both sides have arguments."}, "sources": ["src:d459916ece", "src:fba3aacdc7"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "رایش دربارهٔ «آریایی‌ها» هشدار می‌دهد: یامنایا و فرهنگ‌های پس از آن خودشان آمیزه بودند، پس تصور گروهی ناب و برتر با داده‌ها نمی‌خواند. هم‌زمان ژن و زبان یک چیز نیستند: وابستگی زبانی هندواروپایی به معنای تبار مشترک نیست و خطای رایج است که «آریایی» را قومی زیستی بدانیم. «آریا» در متن‌های هندی و ایرانی کهن اصطلاحی فرهنگی-زبانی است.", "en": "On 'Aryans' Reich cautions that the Yamnaya and later cultures were themselves mixtures, so the idea of a pure, superior group does not fit the data. Genes and language are also not the same thing: belonging to the Indo-European family does not mean shared descent, and treating 'Aryan' as a biological ethnicity is a common error. In ancient Indian and Iranian texts 'arya' is a cultural-linguistic term.", "nl": "On 'Aryans' Reich cautions that the Yamnaya and later cultures were themselves mixtures, so the idea of a pure, superior group does not fit the data. Genes and language are also not the same thing: belonging to the Indo-European family does not mean shared descent, and treating 'Aryan' as a biological ethnicity is a common error. In ancient Indian and Iranian texts 'arya' is a cultural-linguistic term."}, "sources": ["src:a4f00f41ff"], "flags": ["contested", "editor-note"]}], "links": [{"to": "tabar:steppe-indo-iranian", "rel": "explains", "note": {"fa": "شاخهٔ هندوایرانی و تبار استپی", "en": "The Indo-Iranian branch and steppe ancestry", "nl": "The Indo-Iranian branch and steppe ancestry"}}, {"to": "tabar:europe-three-streams-yamnaya", "rel": "see-also", "note": {"fa": "جزئیات ژنتیکی یامنایا", "en": "Genetic details of the Yamnaya", "nl": "Genetic details of the Yamnaya"}}, {"to": "tabar:india-two-migrations-ani-asi", "rel": "see-also", "note": {"fa": "گسترش در هند", "en": "The spread in India", "nl": "The spread in India"}}, {"to": "tabar:iranian-farmer-legacy", "rel": "see-also", "note": {"fa": "میراث کشاورزان ایرانی", "en": "Legacy of Iranian farmers", "nl": "Legacy of Iranian farmers"}}], "people": ["core:colin-renfrew", "core:david-w-anthony", "core:william-jones"], "sources": ["src:293bb0dd11", "src:a4f00f41ff", "src:cf43544e1c", "src:d459916ece", "src:fba3aacdc7"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:darwin-struggle-for-existence", "kind": "concept", "title": {"fa": "مبارزه برای هستی و فشار جمعیت", "en": "The struggle for existence and population pressure", "nl": "De strijd om het bestaan en bevolkingsdruk"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "داروین با الهام از مالتوس می‌گوید همهٔ جانداران بیش از آنچه محیط می‌تواند نگه دارد زاده می‌شوند، پس بسیاری از آنها نابود می‌شوند. «مبارزه» در اینجا به‌معنای وابستگی و رقابت برای ماندن و فرزند گذاشتن است، نه همیشه جنگ مستقیم.", "en": "Inspired by Malthus, Darwin says all organisms are born in greater numbers than the environment can support, so most die. 'Struggle' here means dependence and competition to survive and leave offspring, not always direct fighting.", "nl": "Geïnspireerd door Malthus stelt Darwin dat alle organismen in grotere aantallen worden geboren dan het milieu kan dragen, zodat de meeste omkomen. 'Strijd' betekent hier afhankelijkheid en concurrentie, niet altijd direct gevecht."}, "points": [{"text": {"fa": "هر گونه‌ای، حتی کندزاترین، اگر مانعی نبود، در چند نسل زمین را پر می‌کرد. چون جمعیت‌ها در عمل تقریباً ثابت می‌مانند، بیشترِ زاده‌شده‌ها پیش از تولیدمثل می‌میرند. داروین این را «آموزهٔ مالتوس، اما در کل جهان زنده» می‌نامد.", "en": "Any species, even a slow breeder, would fill the earth within a few generations if nothing held it back. Because populations stay roughly stable, most of those born die before reproducing. Darwin calls this Malthus's doctrine applied to the whole living world.", "nl": "Any species, even a slow breeder, would fill the earth within a few generations if nothing held it back. Because populations stay roughly stable, most of those born die before reproducing. Darwin calls this Malthus's doctrine applied to the whole living world."}, "sources": ["src:84786f7bfa", "src:6b6570c31d"], "flags": []}, {"text": {"fa": "او می‌گوید «مبارزه» را باید گسترده فهمید: گیاهی در لبهٔ بیابان برای آب با خشکی «می‌جنگد»، و دو گونه ممکن است برای غذا یا برای زنده‌ماندن در برابر شکارچی رقابت کنند. بسیاری از بازدارنده‌ها (سرما، قحطی، بیماری، شکارچی) به‌شکل پیچیده‌ای در یک شبکه به هم وابسته‌اند.", "en": "He insists the term be read broadly: a plant at the desert's edge 'struggles' against drought, and two species may compete for food or for survival against a predator. Many checks (cold, famine, disease, predators) are tied together in a complex web.", "nl": "He insists the term be read broadly: a plant at the desert's edge 'struggles' against drought, and two species may compete for food or for survival against a predator. Many checks (cold, famine, disease, predators) are tied together in a complex web."}, "sources": ["src:84786f7bfa"], "flags": []}, {"text": {"fa": "داروین رقابت را بیشتر میان نزدیک‌ترینِ خویشاوندان (هم‌گونه‌ها و هم‌جنس‌ها) تندتر می‌داند، چون نیازهایشان بیشتر شبیه است. این نکته بعدها در بوم‌شناسی با عنوان «حذف رقابتی» و «جدایی آشیان» دنبال شد.", "en": "Darwin thought competition is fiercest between close relatives (same species and genus) since their needs overlap most. Ecology later developed this as competitive exclusion and niche partitioning.", "nl": "Darwin thought competition is fiercest between close relatives (same species and genus) since their needs overlap most. Ecology later developed this as competitive exclusion and niche partitioning."}, "sources": ["src:84786f7bfa"], "flags": ["editor-note"]}, {"text": {"fa": "هشدار دربارهٔ برداشت نادرست: عبارت «بقای اصلح» را بعدها هربرت اسپنسر ساخت و داروین از چاپ‌های بعدی به کار گرفت. این عبارت نباید به «قدرتمندترین» یا توجیه نابرابری اجتماعی ترجمه شود؛ در زیست‌شناسی یعنی بهتر سازگار با محیط و پرفرزندتر. «داروینیسم اجتماعی» برداشتی سیاسی است که خود داروین آن را نساخت و دانشمندان آن را رد کرده‌اند.", "en": "Caution about misreadings: the phrase 'survival of the fittest' was coined by Herbert Spencer and adopted by Darwin only in later editions. It does not mean 'strongest' or justify social inequality; in biology it means better fitted to the environment and leaving more offspring. 'Social Darwinism' is a political reading that Darwin did not create and that scholars reject.", "nl": "Caution about misreadings: the phrase 'survival of the fittest' was coined by Herbert Spencer and adopted by Darwin only in later editions. It does not mean 'strongest' or justify social inequality; in biology it means better fitted to the environment and leaving more offspring. 'Social Darwinism' is a political reading that Darwin did not create and that scholars reject."}, "sources": [], "flags": ["contested", "editor-note"]}], "links": [{"to": "tabar:eugenics", "rel": "see-also", "note": {"fa": "به‌نژادی؛ نمونهٔ سوءاستفاده از زبان تکاملی", "en": "Eugenics: a case of misusing evolutionary language", "nl": "Eugenics: a case of misusing evolutionary language"}}, {"to": "tabar:mutation-selection-drift", "rel": "see-also", "note": {"fa": "جهش، انتخاب و رانش", "en": "Mutation, selection and drift", "nl": "Mutation, selection and drift"}}, {"to": "tabar:human-evolution", "rel": "part-of", "note": {"fa": "تکامل انسان", "en": "Human evolution", "nl": "Human evolution"}}], "people": ["core:thomas-robert-malthus", "core:herbert-spencer"], "sources": ["src:6b6570c31d", "src:84786f7bfa"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:genetics-society", "kind": "field", "title": {"fa": "ژن، نژاد و اخلاق", "en": "Genes, race & ethics", "nl": "Genen, ras & ethiek"}, "aliases": [], "parent": "tabar:tabar", "field": null, "summary": {"fa": "آیا «نژاد» مقولهٔ زیست‌شناختی است؟ ژنتیک چه خطاهای فکری می‌سازد و چه سابقهٔ تاریکی دارد؟", "en": "Is \"race\" a biological category? What thinking errors does genetics invite, and what dark history does it carry?", "nl": "Is \"ras\" een biologische categorie? Welke denkfouten lokt genetica uit, en welke donkere geschiedenis draagt ze mee?"}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:primates-ape-ancestry-molecular-clock", "kind": "concept", "title": {"fa": "ما نخستی‌ایم: ریشهٔ میمونی انسان و ساعت مولکولی", "en": "We are primates: ape ancestry and the molecular clock", "nl": "Wij zijn primaten: apenafstamming en de moleculaire klok"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "نویسندگان از جایگاه انسان در درخت نخستی‌ها شروع می‌کنند: انسان یک گونهٔ نخستی است و ویژگی‌های پستانداران را دارد. آنها یادآوری می‌کنند که فرضیهٔ داروین دربارهٔ آفریقا به‌عنوان زادگاه انسان با زیست‌شناسی مولکولی تأیید شده و «ساعت مولکولی» زمان جدایی انسان از شامپانزه را حدود ۶ میلیون سال پیش نشان می‌دهد.", "en": "The authors start from humanity's place on the primate tree: Homo sapiens is one primate species sharing mammalian traits. They note that Darwin's guess of an African origin has been backed by molecular biology, and that the molecular clock puts the split from chimpanzees at about 6 million years ago.", "nl": "De auteurs plaatsen de mens in de stamboom van de primaten: Homo sapiens is één primatensoort. Darwins Afrikaanse oorsprong wordt door moleculaire biologie bevestigd; de moleculaire klok dateert de splitsing van chimpansees rond 6 miljoen jaar geleden."}, "points": [{"text": {"fa": "به نوشتهٔ نویسندگان، انسان خردمند (نامی که لینه در ۱۷۵۸ داد) فقط یک فصل از تاریخ طبیعی گروه نخستی‌هاست. ما مثل بقیهٔ پستانداران موی بدن داریم، دمای بدنمان را تنظیم می‌کنیم و نوزاد در بدن مادر رشد می‌کند و پس از تولد شیر می‌خورد.", "en": "The authors present H. sapiens (named by Linnaeus in 1758) as just one episode in the natural history of primates, sharing mammalian traits: body hair, temperature regulation, internal gestation and nursing.", "nl": "The authors present H. sapiens (named by Linnaeus in 1758) as just one episode in the natural history of primates, sharing mammalian traits: body hair, temperature regulation, internal gestation and nursing."}, "sources": ["src:64c357a843"], "flags": []}, {"text": {"fa": "نخستی‌ها دست‌کم به ۶۵ میلیون سال پیش، پایان دورهٔ دایناسورها، برمی‌گردند و امروز بیش از ۴۰۰ گونهٔ زنده از آنها هست که بیشترشان در مناطق گرمسیری‌اند. میمون‌های انسان‌نما (هومینوییده‌آ) پس از حدود ۳۵ میلیون سال پیش گسترش یافتند؛ گونه‌های زندهٔ آنها گیبون‌ها (۱۳ گونه)، اورانگوتان‌ها، گوریل‌ها و شامپانزه‌هاست.", "en": "The primate line reaches back before 65 Mya; more than 400 species live today, mostly in the tropics. The apes (Hominoidea) expanded after about 35 Mya; living members are gibbons (13 species), orangutans, gorillas and chimpanzees.", "nl": "The primate line reaches back before 65 Mya; more than 400 species live today, mostly in the tropics. The apes (Hominoidea) expanded after about 35 Mya; living members are gibbons (13 species), orangutans, gorillas and chimpanzees."}, "sources": ["src:64c357a843"], "flags": []}, {"text": {"fa": "داروین در ۱۸۷۱ حدس زد انسان در آفریقا پدید آمده، چون میمون‌های بزرگ آفریقایی (گوریل و شامپانزه) به ما نزدیک‌ترند. نویسندگان می‌گویند زیست‌شناسی مولکولی این حدس را تأیید کرده است. به گفتهٔ آنها نیای مشترک ما و شامپانزه حدود ۶ میلیون سال پیش می‌زیسته، جدایی گوریل کمی زودتر (حدود ۸) و جدایی اورانگوتان پیش از ۱۴ میلیون سال پیش بوده است.", "en": "Darwin guessed in 1871 that humans arose in Africa because the African great apes are closest to us; the authors say molecular biology has confirmed this. They give divergence times: chimpanzee about 6 Mya, gorilla about 8 Mya, orangutan before 14 Mya.", "nl": "Darwin guessed in 1871 that humans arose in Africa because the African great apes are closest to us; the authors say molecular biology has confirmed this. They give divergence times: chimpanzee about 6 Mya, gorilla about 8 Mya, orangutan before 14 Mya."}, "sources": ["src:64c357a843", "src:ffef41cc65"], "flags": []}, {"text": {"fa": "این تاریخ‌ها تقریبی‌اند. برآوردهای مختلف زمان جدایی انسان و شامپانزه بسته به نرخ جهش فرض‌شده و روش کالیبراسیون در پژوهش‌های گوناگون فاصلهٔ چشمگیری (در حدود ۵ تا ۸ میلیون سال) دارند و خود کتاب هم می‌پذیرد که اگر فسیلی قدیمی‌تر از ۶ میلیون سال تأیید شود، کالیبراسیون ژنتیکی باید بازنگری شود.", "en": "These dates are approximate. Published estimates of the human–chimpanzee split vary widely (roughly 5–8 Mya) depending on the assumed mutation rate and calibration, and the book itself concedes that a confirmed fossil older than 6 Mya would force a recalibration.", "nl": "These dates are approximate. Published estimates of the human–chimpanzee split vary widely (roughly 5–8 Mya) depending on the assumed mutation rate and calibration, and the book itself concedes that a confirmed fossil older than 6 Mya would force a recalibration."}, "sources": [], "flags": ["contested", "editor-note"]}, {"text": {"fa": "نویسندگان می‌گویند دیرینهٔ میمون پایان میوسن که این رشته از آن آغاز می‌شود هنوز در فسیل‌ها شناخته نشده است. در میان نوادگان آن، انسان خردمند دورترین گونه از سازگاری اصلی با جنگل و درخت است و تنها بازماندهٔ شاخه‌ای که حدود ۶ میلیون سال پیش شروع شد.", "en": "They add that the late-Miocene ape at the root of this story has not yet been identified in the fossil record; among its descendants H. sapiens is the furthest from the ancestral forest, tree-living adaptation and the sole survivor of a lineage begun about 6 Mya.", "nl": "They add that the late-Miocene ape at the root of this story has not yet been identified in the fossil record; among its descendants H. sapiens is the furthest from the ancestral forest, tree-living adaptation and the sole survivor of a lineage begun about 6 Mya."}, "sources": ["src:64c357a843"], "flags": []}], "links": [{"to": "tabar:human-evolution", "rel": "part-of", "note": {"fa": "تکامل انسان (حوزهٔ کلی)", "en": "Human evolution (field overview)", "nl": "Human evolution (field overview)"}}, {"to": "tabar:out-of-africa", "rel": "see-also", "note": {"fa": "خاستگاه آفریقایی انسان خردمند", "en": "The African origin of Homo sapiens", "nl": "The African origin of Homo sapiens"}}, {"to": "tabar:mutation-selection-drift", "rel": "see-also", "note": {"fa": "جهش، انتخاب و رانش (پایهٔ ساعت مولکولی)", "en": "Mutation, selection and drift (basis of the molecular clock)", "nl": "Mutation, selection and drift (basis of the molecular clock)"}}, {"to": "tabar:earliest-bipeds-and-australopithecus", "rel": "see-also", "note": {"fa": "نخستین دوپایان و استرالوپیتکوس‌ها", "en": "The earliest bipeds and Australopithecus", "nl": "The earliest bipeds and Australopithecus"}}], "people": ["core:carl-linnaeus", "core:charles-darwin"], "sources": ["src:64c357a843", "src:ffef41cc65"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:out-of-africa", "kind": "concept", "title": {"fa": "خاستگاه آفریقایی انسان خردمند", "en": "The African origin of Homo sapiens", "nl": "De Afrikaanse oorsprong van Homo sapiens"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "همهٔ انسان‌های امروزی از جمعیتی برآمده‌اند که در آفریقا شکل گرفت و در ۵۰ تا ۷۰ هزار سال اخیر در جهان پخش شد؛ تنوع ژنتیکی بیرون آفریقا زیرمجموعه‌ای از تنوع درون آفریقاست.", "en": "All living humans descend from a population that formed in Africa and spread across the world in the last 50 to 70 thousand years; genetic diversity outside Africa is a subset of the diversity within it.", "nl": "Alle levende mensen stammen af van een bevolking die in Afrika ontstond en zich in de laatste 50 tot 70 duizend jaar over de wereld verspreidde; de genetische diversiteit buiten Afrika is een deelverzameling van die binnen Afrika."}, "points": [{"text": {"fa": "بیشترین تنوع ژنتیکی انسان در آفریقاست و هرچه از آفریقا دورتر می‌شویم تنوع کمتر می‌شود: اثر «بنیان‌گذار» پیاپی مهاجرت‌های کوچک.", "en": "Human genetic diversity is greatest in Africa and declines with distance from it: the serial \"founder effect\" of small migrating groups.", "nl": "Human genetic diversity is greatest in Africa and declines with distance from it: the serial \"founder effect\" of small migrating groups."}, "sources": ["src:50f6134be0", "src:3dd3045232"], "flags": []}, {"text": {"fa": "تصویر امروزی پیچیده‌تر از یک خروج واحد است: چند موج، بازگشت‌ها، و ساختار جمعیتی درون آفریقا («چندمنطقه‌ای آفریقایی»)، همراه با آمیزش با انسان‌های کهن بیرون آفریقا.", "en": "Today's picture is more complex than a single exit: several waves, back-migrations, and population structure within Africa (\"African multiregionalism\"), plus admixture with archaic humans outside Africa.", "nl": "Today's picture is more complex than a single exit: several waves, back-migrations, and population structure within Africa (\"African multiregionalism\"), plus admixture with archaic humans outside Africa."}, "sources": ["src:8b730d2385"], "flags": []}], "links": [{"to": "tabar:neanderthal-admixture", "rel": "see-also", "note": {"fa": "آمیزش با نئاندرتال و دنیسووا", "en": "Admixture with Neanderthals and Denisovans", "nl": "Admixture with Neanderthals and Denisovans"}}, {"to": "tabar:race-biology", "rel": "evidence-for", "note": {"fa": "چرا تنوع انسانی پیوسته است نه گسسته", "en": "Why human variation is continuous, not discrete", "nl": "Why human variation is continuous, not discrete"}}], "people": ["core:svante-p-bo", "core:sarah-tishkoff"], "sources": ["src:3dd3045232", "src:50f6134be0", "src:8b730d2385"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:cooking-hypothesis", "kind": "concept", "title": {"fa": "فرضیهٔ پختن: آتش و پیدایش انسان", "en": "The cooking hypothesis: fire and the origin of humans", "nl": "De kookhypothese: vuur en het ontstaan van de mens"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "ریچارد رانگهم می‌گوید گذار از «انسان‌های ابزارساز اولیه» به «هومو ارکتوس» (حدود ۱٫۹ تا ۱٫۸ میلیون سال پیش) را باید با مهار آتش و پختن غذا توضیح داد. به‌باور او پختن انرژی بیشتری از غذا بیرون می‌کشد و همین، بدن، مغز، وقت روزانه و زندگی اجتماعی ما را تغییر داده است. این فرضیه جذاب و پرنفوذ است، اما بخش‌های مهمش، به‌ویژه زمانِ آغاز پختن، همچنان محل بحث است.", "en": "Richard Wrangham argues that the transition from early tool-making hominins to Homo erectus (about 1.9–1.8 million years ago) is best explained by the control of fire and the cooking of food. Cooking, he says, extracts more energy from food and thereby reshaped our body, brain, daily time budget and social life. The idea is influential and stimulating, but key parts of it, above all the timing, remain debated.", "nl": "Richard Wrangham stelt dat de overgang naar Homo erectus (circa 1,9–1,8 miljoen jaar geleden) verklaard moet worden door vuurbeheersing en koken. Koken levert meer energie uit voedsel en zou lichaam, brein en sociaal leven hebben veranderd. De hypothese is invloedrijk maar omstreden, vooral wat betreft de datering."}, "points": [{"text": {"fa": "ادعای اصلی کتاب «آتش را گرفتیم» (۲۰۰۹): انسان‌ها با غذای پخته سازگار شده‌اند، همان‌طور که گاو با علف یا کک با خون. یعنی پختن فقط یک سنت فرهنگی یا نمادین نیست، بلکه بخشی از زیست‌شناسی ماست.", "en": "Core claim of Catching Fire (2009): humans are biologically adapted to cooked food, as cows are to grass or fleas to blood; cooking is not merely a cultural or symbolic habit but part of our biology.", "nl": "Core claim of Catching Fire (2009): humans are biologically adapted to cooked food, as cows are to grass or fleas to blood; cooking is not merely a cultural or symbolic habit but part of our biology."}, "sources": ["src:c12cd83ad0"], "flags": []}, {"text": {"fa": "نویسنده خود را در برابر دو دیدگاه قدیمی‌تر می‌گذارد: دیدگاه داروین که آتش را اختراعی دیرهنگام و بی‌اثر بر بدن می‌دانست، و تحلیل لوی‌استروس در «خام و پخته» که اهمیت پختن را بیشتر نمادین می‌دید.", "en": "He positions the idea against two older views: Darwin's, which treated fire as a late invention with little effect on the body, and Lévi-Strauss's The Raw and the Cooked, which saw cooking's significance as largely symbolic.", "nl": "He positions the idea against two older views: Darwin's, which treated fire as a late invention with little effect on the body, and Lévi-Strauss's The Raw and the Cooked, which saw cooking's significance as largely symbolic."}, "sources": ["src:c12cd83ad0"], "flags": []}, {"text": {"fa": "استدلال به‌صورت زنجیره است: پختن انرژی قابل‌جذب را بالا می‌برد؛ غذا نرم‌تر و دیرفاسدتر می‌شود؛ روده و دندان کوچک‌تر و مغز بزرگ‌تر می‌شود؛ زمان جویدن کم می‌شود؛ و غذای خانگی روابط زن و مرد را شکل می‌دهد. هر حلقه را باید جداگانه سنجید، چون درستیِ یک حلقه درستیِ بقیه را تضمین نمی‌کند.", "en": "The argument is a chain: cooking raises usable energy; food becomes softer and safer; guts and teeth shrink while the brain grows; chewing time falls; and household meals shape relations between the sexes. Each link must be judged separately, because one holding does not guarantee the rest.", "nl": "The argument is a chain: cooking raises usable energy; food becomes softer and safer; guts and teeth shrink while the brain grows; chewing time falls; and household meals shape relations between the sexes. Each link must be judged separately, because one holding does not guarantee the rest."}, "sources": ["src:c12cd83ad0"], "flags": []}, {"text": {"fa": "به گفتهٔ نویسنده، شواهد زیست‌شناختی (کوچک‌شدن دندان‌ها و روده، بزرگ‌شدن مغز و بدن در هومو ارکتوس) نشان می‌دهد پختن حدود ۱٫۸ میلیون سال پیش آغاز شده است. بیشتر باستان‌شناسان این تاریخ را با شواهد مستقیمِ آتش تأیید‌شده نمی‌دانند (نک. مدخل «بحث دربارهٔ زمان مهار آتش»).", "en": "Per the author, biological evidence (smaller teeth and guts, larger brain and body in Homo erectus) implies cooking began about 1.8 million years ago. Most archaeologists do not regard this as confirmed by direct fire evidence (see the entry on the fire-control dating debate).", "nl": "Per the author, biological evidence (smaller teeth and guts, larger brain and body in Homo erectus) implies cooking began about 1.8 million years ago. Most archaeologists do not regard this as confirmed by direct fire evidence (see the entry on the fire-control dating debate)."}, "sources": ["src:c12cd83ad0"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "نظر ویراستار: فرضیهٔ پختن یک فرضیهٔ زیست‌تکاملی قابل‌بحث است نه واقعیتی اثبات‌شده. چند پژوهش مستقل بخش‌هایی از آن را تأیید می‌کنند (انرژی بیشتر از غذای فراوری‌شده، کوچک‌بودن دستگاه گوارش)، اما دیگران توضیح‌های جایگزین داده‌اند، مثل فراوری مکانیکی گوشت با ابزار سنگی. زمان آغاز پختن و سهم آن در بزرگ‌شدن مغز هنوز بسته نشده است.", "en": "Editor's note: the cooking hypothesis is a debatable evolutionary hypothesis, not an established fact. Several independent studies support parts of it (extra energy from processed food, small digestive systems), but others offer alternatives such as mechanical processing of meat with stone tools. When cooking began, and how much it contributed to brain growth, is unresolved.", "nl": "Editor's note: the cooking hypothesis is a debatable evolutionary hypothesis, not an established fact. Several independent studies support parts of it (extra energy from processed food, small digestive systems), but others offer alternatives such as mechanical processing of meat with stone tools. When cooking began, and how much it contributed to brain growth, is unresolved."}, "sources": ["src:732c1fdbea", "src:c8517f2ad2", "src:c64b6db5f6"], "flags": ["contested", "editor-note"]}], "links": [{"to": "tabar:human-evolution", "rel": "part-of", "note": {"fa": "تکامل انسان", "en": "Human evolution", "nl": "Human evolution"}}, {"to": "tabar:cooking-energy-gain", "rel": "explains", "note": {"fa": "پختن چگونه انرژی غذا را بالا می‌برد", "en": "How cooking raises the energy yield of food", "nl": "How cooking raises the energy yield of food"}}, {"to": "tabar:fire-control-dating-debate", "rel": "contrasts", "note": {"fa": "بحث دربارهٔ زمان مهار آتش", "en": "The debate over when fire was controlled", "nl": "The debate over when fire was controlled"}}, {"to": "tabar:meat-eating-hunting-hypothesis", "rel": "contrasts", "note": {"fa": "فرضیهٔ گوشت‌خواری و «انسانِ شکارچی»", "en": "The meat-eating / Man-the-Hunter hypothesis", "nl": "The meat-eating / Man-the-Hunter hypothesis"}}], "people": ["core:richard-wrangham", "core:claude-l-vi-strauss", "core:charles-darwin"], "sources": ["src:732c1fdbea", "src:c12cd83ad0", "src:c64b6db5f6", "src:c8517f2ad2"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:epigenetics", "kind": "field", "title": {"fa": "اپی‌ژنتیک", "en": "Epigenetics", "nl": "Epigenetica"}, "aliases": [], "parent": "tabar:tabar", "field": null, "summary": {"fa": "محیط چگونه روی خواندنِ ژن‌ها اثر می‌گذارد و آیا این اثر به نسل بعد می‌رسد؟", "en": "How does environment affect how genes are read, and does that reach the next generation?", "nl": "Hoe beïnvloedt de omgeving het aflezen van genen, en bereikt dat de volgende generatie?"}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:transgenerational", "kind": "concept", "title": {"fa": "وراثت اپی‌ژنتیک بین‌نسلی", "en": "Transgenerational epigenetic inheritance", "nl": "Transgenerationele epigenetische overerving"}, "aliases": [], "parent": "tabar:epigenetics", "field": "tabar:epigenetics", "summary": {"fa": "ادعای محبوب: ترومای پدربزرگ در ژن‌های نوه «ثبت» می‌شود. در گیاهان و کرم‌ها مستند است؛ در موش‌ها شواهدی هست؛ در انسان، شواهد مستقیم ضعیف و مطالعات کوچک و تکرارنشده‌اند. اثرهای بین‌نسلی از راه رفتار و محیط واقعی‌اند، ولی لزوماً «اپی‌ژنتیک» نیستند.", "en": "The popular claim: grandfather's trauma is \"recorded\" in the grandchild's genes. Documented in plants and worms; some evidence in mice; in humans, direct evidence is weak and the studies small and unreplicated. Intergenerational effects via behaviour and environment are real, but not necessarily \"epigenetic\".", "nl": "De populaire claim: het trauma van opa wordt \"vastgelegd\" in de genen van het kleinkind. Gedocumenteerd bij planten en wormen; enig bewijs bij muizen; bij mensen is het directe bewijs zwak en zijn de studies klein en niet gerepliceerd. Intergenerationele effecten via gedrag en omgeving zijn echt, maar niet per se \"epigenetisch\"."}, "points": [{"text": {"fa": "هورستمکه (۲۰۱۸): برای ادعای وراثت اپی‌ژنتیک واقعی در انسان باید اثر در نسلی دیده شود که هیچ تماس مستقیمی با محرک نداشته (نسل سوم از مادر، نسل دوم از پدر)، و باید عوامل ژنتیکی، فرهنگی و اکولوژیک حذف شوند؛ تقریباً هیچ مطالعهٔ انسانی این شرط‌ها را برآورده نمی‌کند.", "en": "Horsthemke (2018): to claim real epigenetic inheritance in humans, the effect must appear in a generation with no direct exposure to the stimulus (third generation via mother, second via father), and genetic, cultural and ecological factors must be excluded; almost no human study meets these conditions.", "nl": "Horsthemke (2018): to claim real epigenetic inheritance in humans, the effect must appear in a generation with no direct exposure to the stimulus (third generation via mother, second via father), and genetic, cultural and ecological factors must be excluded; almost no human study meets these conditions."}, "sources": ["src:07fb5aa7b9"], "flags": ["unreplicated"]}, {"text": {"fa": "مطالعهٔ پرارجاع فرزندان بازماندگان هولوکاست (یهودا ۲۰۱۶) ۳۲ خانواده داشت و نتایجش در تحلیل‌های بعدی تضعیف شد؛ با این حال اثر تروما بر فرزندان از راه فرزندپروری و محیط به‌خوبی مستند است.", "en": "The much-cited study of Holocaust survivors' children (Yehuda 2016) had 32 families and its results weakened under later analysis; yet the effect of trauma on children through parenting and environment is well documented.", "nl": "The much-cited study of Holocaust survivors' children (Yehuda 2016) had 32 families and its results weakened under later analysis; yet the effect of trauma on children through parenting and environment is well documented."}, "sources": ["src:07fb5aa7b9"], "flags": ["unreplicated", "editor-note"]}], "links": [{"to": "tabar:epigenetic-marks", "rel": "part-of", "note": {"fa": "سازوکار پیشنهادی", "en": "The proposed mechanism", "nl": "The proposed mechanism"}}, {"to": "psy:ptsd", "rel": "bridges", "note": {"fa": "تروما در ویکی روان", "en": "Trauma in the psychology wiki", "nl": "Trauma in the psychology wiki"}}, {"to": "tabar:genetic-essentialism", "rel": "see-also", "note": {"fa": "چرا این ادعا این‌قدر جذاب است", "en": "Why this claim is so attractive", "nl": "Why this claim is so attractive"}}], "people": [], "sources": ["src:07fb5aa7b9"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:genealogy", "kind": "field", "title": {"fa": "تبارشناسی و شجره", "en": "Genealogy", "nl": "Genealogie"}, "aliases": [], "parent": "tabar:tabar", "field": null, "summary": {"fa": "شجره‌نامه‌ها، آزمون‌های تجاری تبار و ریاضیِ نیاکان مشترک: از یک نفر چند نیا داریم و چرا همهٔ ما خویشاوندیم؟", "en": "Family trees, commercial ancestry tests and the mathematics of common ancestors: how many ancestors do we have, and why are we all related?", "nl": "Stambomen, commerciële afstammingstests en de wiskunde van gemeenschappelijke voorouders: hoeveel voorouders hebben we, en waarom zijn we allemaal verwant?"}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:ancient-dna", "kind": "concept", "title": {"fa": "انقلاب دی‌ان‌ای باستانی", "en": "The ancient DNA revolution", "nl": "De oud-DNA-revolutie"}, "aliases": [], "parent": "tabar:population-genetics", "field": "tabar:population-genetics", "summary": {"fa": "از ۲۰۱۰ به بعد خواندن ژنوم از استخوان‌های هزاران‌ساله ممکن شد و تاریخ جمعیت‌ها را بازنویسی کرد: تقریباً هیچ جمعیت امروزی «خالص» نیست؛ همه حاصل چند موج مهاجرت و آمیزش‌اند.", "en": "From 2010 on, reading genomes from bones thousands of years old became possible and rewrote population history: almost no living population is \"pure\"; all are the product of several waves of migration and admixture.", "nl": "Vanaf 2010 werd het mogelijk genomen uit duizenden jaren oude botten te lezen, wat de bevolkingsgeschiedenis herschreef: vrijwel geen levende bevolking is \"zuiver\"; alle zijn het product van meerdere migratie- en vermengingsgolven."}, "points": [{"text": {"fa": "رایش: جمعیت‌های امروزی اروپا آمیزه‌ای از دست‌کم سه جمعیت کاملاً متفاوت‌اند (شکارچی‌گردآورندگان غربی، کشاورزان آناتولی، و دامداران استپ)؛ الگوی مشابه در بیشتر مناطق جهان دیده می‌شود.", "en": "Reich: today's European populations are a mixture of at least three very different populations (western hunter-gatherers, Anatolian farmers and steppe herders); a similar pattern appears in most regions of the world.", "nl": "Reich: today's European populations are a mixture of at least three very different populations (western hunter-gatherers, Anatolian farmers and steppe herders); a similar pattern appears in most regions of the world."}, "sources": ["src:8b730d2385"], "flags": []}, {"text": {"fa": "کشاورزی در خاور نزدیک از دو جمعیت کاملاً جدا آغاز شد: کشاورزان زاگرس و کشاورزان آناتولی/شام که از نظر ژنتیکی به اندازهٔ اروپاییان و شرق آسیایی‌های امروز با هم فرق داشتند.", "en": "Farming in the Near East began among two quite separate populations: Zagros farmers and Anatolian/Levantine farmers, genetically about as different as today's Europeans and East Asians.", "nl": "Farming in the Near East began among two quite separate populations: Zagros farmers and Anatolian/Levantine farmers, genetically about as different as today's Europeans and East Asians."}, "sources": ["src:519a39f1f8", "src:22aa9386b9"], "flags": []}, {"text": {"fa": "هشدار روش‌شناختی: نمونه‌های باستانی پراکنده‌اند و «جمعیت» در این مطالعات یک خوشهٔ آماری است، نه قوم یا زبان؛ پیوند دادنش به هویت‌های امروزی کار دانش نیست.", "en": "Methodological caution: ancient samples are sparse, and a \"population\" in these studies is a statistical cluster, not an ethnicity or a language; tying it to present-day identities is not science.", "nl": "Methodological caution: ancient samples are sparse, and a \"population\" in these studies is a statistical cluster, not an ethnicity or a language; tying it to present-day identities is not science."}, "sources": ["src:8b730d2385"], "flags": ["editor-note"]}], "links": [{"to": "tabar:zagros-neolithic", "rel": "evidence-for", "note": {"fa": "نمونهٔ ایران: کشاورزان زاگرس", "en": "The Iranian case: Zagros farmers", "nl": "The Iranian case: Zagros farmers"}}, {"to": "tabar:neanderthal-admixture", "rel": "see-also", "note": {"fa": "آمیزش با نئاندرتال‌ها", "en": "Admixture with Neanderthals", "nl": "Admixture with Neanderthals"}}, {"to": "atlas:archaeogen", "rel": "part-of", "note": {"fa": "پل باستان‌ژنتیک", "en": "The archaeogenetics bridge", "nl": "The archaeogenetics bridge"}}], "people": ["core:david-reich", "core:svante-p-bo"], "sources": ["src:22aa9386b9", "src:519a39f1f8", "src:8b730d2385"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:near-east-first-farmers-structure", "kind": "concept", "title": {"fa": "ساختار ژنتیکی نخستین کشاورزان خاور نزدیک", "en": "The genetic structure of the first farmers of the Near East", "nl": "De genetische structuur van de eerste boeren van het Nabije Oosten"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "لازاریدیس و همکاران (۲۰۱۶) با دی‌ان‌ای باستانی نشان دادند نخستین کشاورزان لوانت جنوبی و کوهستان زاگرس (ایران) دو جمعیت کاملاً متمایز بودند و هر یک از شکارگردآورندگان همان ناحیه ادامه می‌یافت. تفاوت میان این گروه‌ها در عصر مفرغ، با آمیختگی، تقریباً از میان رفت.", "en": "Lazaridis and colleagues (2016) showed with ancient DNA that the first farmers of the southern Levant and the Zagros Mountains (Iran) were two strongly distinct populations, each continuing from local hunter-gatherers. By the Bronze Age, mixing had almost erased the differences between them.", "nl": "Lazaridis e.a. (2016) tonen met oud-DNA dat de eerste boeren van de zuidelijke Levant en de Zagros twee sterk verschillende populaties waren, elk voortgekomen uit lokale jager-verzamelaars; in de Bronstijd waren de verschillen grotendeels verdwenen."}, "points": [{"text": {"fa": "داده: ژنوم باستانیِ ۴۴ نفر (از حدود ۱۲٬۰۰۰ تا ۱۴۰۰ پیش از میلاد) از ارمنستان، شمال‌غرب آناتولی، ایران، اسرائیل و اردن، شامل ناتوفی‌های شکارگردآورنده، کشاورزان پیش‌سفالینهٔ لوانت و کشاورزان گنج‌دره (حدود ۸۲۰۰ تا ۷۶۰۰ پیش از میلاد). برای مقایسه، ۲۸۱ فرد باستانی و ۲۵۸۳ نفر امروزی به کار رفت. دی‌ان‌ای از بخش گوش داخلی استخوان گیجگاهی گرفته و حدود ۱٫۲ میلیون نشانگر ژنومی با «غنی‌سازی» خوانده شد.", "en": "Data: genome-wide ancient DNA from 44 people (~12,000–1,400 BCE) from Armenia, northwestern Anatolia, Iran, Israel and Jordan, including Natufian hunter-gatherers, Levantine Pre-Pottery Neolithic farmers and farmers from Ganj Dareh (~8,200–7,600 BCE). For comparison, 281 ancient individuals and 2,583 present-day people were used. DNA came from the inner-ear part of the petrous bone and ~1.2 million genomic markers were enriched and read.", "nl": "Data: genome-wide ancient DNA from 44 people (~12,000–1,400 BCE) from Armenia, northwestern Anatolia, Iran, Israel and Jordan, including Natufian hunter-gatherers, Levantine Pre-Pottery Neolithic farmers and farmers from Ganj Dareh (~8,200–7,600 BCE). For comparison, 281 ancient individuals and 2,583 present-day people were used. DNA came from the inner-ear part of the petrous bone and ~1.2 million genomic markers were enriched and read."}, "sources": ["src:43526796e0"], "flags": []}, {"text": {"fa": "تفاوت شدید منطقه‌ای: چهار گروه کهن در گوشه‌های نمودار تحلیل مؤلفه‌های اصلی قرار گرفتند (شکارگردآورندگان غربی اروپا، شکارگردآورندگان شرقی، نوسنگی لوانت/ناتوفی، نوسنگی ایران). فاصلهٔ ژنتیکی (FST) میان آن‌ها ۰٫۰۸ تا ۰٫۱۵ بود، یعنی هم‌اندازهٔ فاصلهٔ امروزی غرب‌اوراسیاییان با چینی‌های هان (۰٫۰۹ تا ۰٫۱۳). در عصر مفرغ این فاصله به سطح امروز (کمتر از حدود ۰٫۰۲۵ برای ۹۵٪ جفت‌ها) رسید.", "en": "Strong regional differentiation: four ancient groups sat at the corners of a PCA plot (Western hunter-gatherers, Eastern hunter-gatherers, Levantine Neolithic/Natufian, Iranian Neolithic). Their genetic distance (FST) was 0.08–0.15, comparable to the present-day distance between West Eurasians and Han Chinese (0.09–0.13). By the Bronze Age it had dropped to today's low level (≤ about 0.025 for 95% of pairs).", "nl": "Strong regional differentiation: four ancient groups sat at the corners of a PCA plot (Western hunter-gatherers, Eastern hunter-gatherers, Levantine Neolithic/Natufian, Iranian Neolithic). Their genetic distance (FST) was 0.08–0.15, comparable to the present-day distance between West Eurasians and Han Chinese (0.09–0.13). By the Bronze Age it had dropped to today's low level (≤ about 0.025 for 95% of pairs)."}, "sources": ["src:43526796e0"], "flags": []}, {"text": {"fa": "پیوستگی با شکارگردآورندگان: در لوانت، کشاورزان نخستین با آلل‌های بیشتری با ناتوفی‌ها شریک بودند تا با کشاورزان ایران؛ در قفقاز و ایران، کشاورزان نخستین بیشتر به شکارگردآورندگان همان ناحیه شبیه بودند تا به کشاورزان لوانت. به این ترتیب در هر دو منطقه گذار به کشاورزی بدون جایگزینی کامل جمعیت رخ داده است، برخلاف الگوی گزارش‌شده برای اروپا.", "en": "Continuity with hunter-gatherers: in the Levant early farmers shared more alleles with Natufians than with Iranian farmers; in the Caucasus-Iran highlands early farmers resembled local hunter-gatherers more than Levantine farmers. Thus in both regions the shift to farming occurred without complete population replacement, unlike the pattern reported for Europe.", "nl": "Continuity with hunter-gatherers: in the Levant early farmers shared more alleles with Natufians than with Iranian farmers; in the Caucasus-Iran highlands early farmers resembled local hunter-gatherers more than Levantine farmers. Thus in both regions the shift to farming occurred without complete population replacement, unlike the pattern reported for Europe."}, "sources": ["src:43526796e0"], "flags": []}, {"text": {"fa": "ترکیب: کشاورزان لوانت حدود دو سوم تبارشان را از گروه‌های وابسته به ناتوفی و حدود یک سوم را از گروه‌های وابسته به کشاورزان آناتولی دارند. کشاورزان غرب ایران به شکارگردآورندهٔ احتمالاً میان‌سنگی غار هوتو (البرز) نزدیک‌اند و آلل‌ها را به یک اندازه با کشاورزان آناتولی و لوانت شریک‌اند، که نویسندگان آن را نشانهٔ انزوای درازمدت غرب ایران می‌دانند.", "en": "Composition: Levantine farmers trace about two thirds of their ancestry to Natufian-related groups and about one third to Anatolian-farmer-related groups. Western Iranian farmers cluster with the probably Mesolithic Hotu Cave individual (Alborz) and share alleles equally with Anatolian and Levantine farmers, which the authors read as long-term isolation of western Iran.", "nl": "Composition: Levantine farmers trace about two thirds of their ancestry to Natufian-related groups and about one third to Anatolian-farmer-related groups. Western Iranian farmers cluster with the probably Mesolithic Hotu Cave individual (Alborz) and share alleles equally with Anatolian and Levantine farmers, which the authors read as long-term isolation of western Iran."}, "sources": ["src:43526796e0"], "flags": []}, {"text": {"fa": "نتیجهٔ اصلی نویسندگان: گسترش کشاورزی در خاور نزدیک را نمی‌توان با پراکندن یک جمعیت کشاورز واحد که شکارگردآورندگان را جابه‌جا کند توضیح داد؛ ایده و فناوری سریع‌تر از مردم پخش شد. توجه: این تعمیم بر نمونه‌های اندک هر گروه (گاه چند نفر) و بر مدل‌های آماری آمیختگی استوار است و در پیش‌چاپی بدون داوری همتا آمده است.", "en": "Authors' main conclusion: the spread of farming in the Near East cannot be explained by one farming population dispersing and displacing hunter-gatherers; ideas and technology moved faster than people. Caution: this generalisation rests on small samples per group (sometimes a few individuals) and on statistical admixture models, and appears in a preprint without peer review.", "nl": "Authors' main conclusion: the spread of farming in the Near East cannot be explained by one farming population dispersing and displacing hunter-gatherers; ideas and technology moved faster than people. Caution: this generalisation rests on small samples per group (sometimes a few individuals) and on statistical admixture models, and appears in a preprint without peer review."}, "sources": ["src:43526796e0"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "دربارهٔ وضعیت متن: فایل بررسی‌شده نسخهٔ پیش‌چاپ ژوئن ۲۰۱۶ است. به‌نظر می‌رسد نسخهٔ داوری‌شدهٔ آن بعداً با عنوان دیگری در مجلهٔ Nature (۲۰۱۶، جلد ۵۳۶) منتشر شد و باید اعداد را با آن نسخه تطبیق داد. پژوهش‌های بعدی هم جزئیات تبار ایران و لوانت را دقیق‌تر کرده‌اند.", "en": "On the text's status: the file reviewed is the June 2016 preprint. A peer-reviewed version appeared later in Nature (2016, vol. 536) under a different title, to my knowledge; numbers should be checked against that version. Later studies have also refined the details of Iranian and Levantine ancestry.", "nl": "On the text's status: the file reviewed is the June 2016 preprint. A peer-reviewed version appeared later in Nature (2016, vol. 536) under a different title, to my knowledge; numbers should be checked against that version. Later studies have also refined the details of Iranian and Levantine ancestry."}, "sources": [], "flags": ["dated", "editor-note"]}], "links": [{"to": "tabar:zagros-neolithic", "rel": "explains", "note": {"fa": "کشاورزان نوسنگی زاگرس", "en": "Zagros Neolithic farmers", "nl": "Zagros Neolithic farmers"}}, {"to": "tabar:ancient-dna", "rel": "part-of", "note": {"fa": "انقلاب دی‌ان‌ای باستانی", "en": "The ancient DNA revolution", "nl": "The ancient DNA revolution"}}, {"to": "soc:goat-domestication-zagros", "rel": "bridges", "note": {"fa": "اهلی‌سازی بز در گنج‌دره (همان جایگاه)", "en": "Goat domestication at Ganj Dareh (same site)", "nl": "Goat domestication at Ganj Dareh (same site)"}}, {"to": "tabar:iranian-farmer-legacy", "rel": "see-also", "note": {"fa": "میراث کشاورزان ایرانی", "en": "Legacy of the Iranian farmers", "nl": "Legacy of the Iranian farmers"}}], "people": ["core:iosif-lazaridis", "core:david-reich", "core:ron-pinhasi"], "sources": ["src:43526796e0"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:forager-lifeways-diversity", "kind": "concept", "title": {"fa": "شیوهٔ زندگی شکارگر-خوراک‌جو: تنوع، احتیاط روش‌شناختی و بحث «جامعهٔ مرفه»", "en": "Forager lifeways: diversity, methodological caution and the 'affluent society' debate", "nl": "Leefwijze van jager-verzamelaars: diversiteit, methodologische voorzichtigheid en het 'welvaartsdebat'"}, "aliases": [], "parent": "tabar:genetics-society", "field": "tabar:genetics-society", "summary": {"fa": "هراری می‌گوید دربارهٔ زندگی نیاکان خوراک‌جوی ما کم می‌دانیم، قیاس با خوراک‌جویان امروزی محدودیت دارد، و هیچ «شیوهٔ زیست طبیعی» واحدی برای انسان خردمند وجود نداشت. او همچنین تصویری نسبتاً مثبت از زندگی خوراک‌جویان (کار کمتر و دانش گسترده) می‌دهد که خود محل بحث است.", "en": "Harari says we know little about our forager ancestors' lives, that analogies from today's foragers have limits, and that there was no single 'natural way of life' for Homo sapiens. He also paints a fairly positive picture of forager life (less work, broad knowledge), itself a debated view.", "nl": "Harari stelt dat we weinig weten over het leven van onze jager-verzamelaarsvoorouders, dat vergelijking met hedendaagse groepen beperkt is en dat er geen enkele 'natuurlijke leefwijze' bestond. Zijn vrij positieve beeld van het leven van verzamelaars is zelf omstreden."}, "points": [{"text": {"fa": "او به دو دلیل با «روان‌شناسی تکاملی» عامه‌پسند محتاط است: شواهد باستان‌شناختی عمدتاً استخوان و ابزار سنگی است و چوب، چرم و باور و رسم را حفظ نمی‌کند؛ و بحث میان فرضیهٔ «کمون باستانی» (بدون مالکیت و تک‌همسری) و فرضیهٔ «تک‌همسری و خانوادهٔ هسته‌ای همیشگی» بر شاهد سست بنا شده است.", "en": "He is cautious about popular evolutionary psychology for two reasons: archaeological evidence is mostly bone and stone tools and does not preserve wood, leather, belief or custom; and the debate between an 'ancient commune' (no property, no monogamy) and 'eternal monogamy and nuclear family' rests on thin evidence.", "nl": "He is cautious about popular evolutionary psychology for two reasons: archaeological evidence is mostly bone and stone tools and does not preserve wood, leather, belief or custom; and the debate between an 'ancient commune' (no property, no monogamy) and 'eternal monogamy and nuclear family' rests on thin evidence."}, "sources": ["src:64cc653b84"], "flags": []}, {"text": {"fa": "او سه محدودیت قیاس با خوراک‌جویان امروزی را می‌شمارد: آن‌ها از جوامع کشاورز و صنعتی اطراف‌شان اثر پذیرفته‌اند؛ بیشترشان در زیستگاه‌های سخت و کم‌جمعیتی چون کالاهاری مانده‌اند؛ و میان خود جوامع خوراک‌جو تنوع بسیار است. مثال او از استرالیای پیش از استعمار است: چند صد قبیله با زبان، دین و هنجارهای متفاوت.", "en": "He lists three limits to analogy with today's foragers: they have been influenced by surrounding farming and industrial societies; most survive in harsh, sparsely populated habitats like the Kalahari; and foraging societies differ greatly from one another. His example is pre-colonial Australia: several hundred tribes with different languages, religions and norms.", "nl": "He lists three limits to analogy with today's foragers: they have been influenced by surrounding farming and industrial societies; most survive in harsh, sparsely populated habitats like the Kalahari; and foraging societies differ greatly from one another. His example is pre-colonial Australia: several hundred tribes with different languages, religions and norms."}, "sources": ["src:64cc653b84"], "flags": []}, {"text": {"fa": "نتیجهٔ او این است که پس از انقلاب شناختی «شیوهٔ زیست طبیعی» واحدی برای انسان خردمند وجود نداشت، بلکه گزینه‌های فرهنگی متنوعی در گسترهٔ امکانات زیستی بود. این هشدار روش‌شناختی مهمی است، چون بحث‌های داغ دربارهٔ «طبیعت انسان» را نسبی می‌کند.", "en": "His conclusion is that after the cognitive revolution there was no single 'natural way of life' for Homo sapiens, only varied cultural options within biological limits. This is a useful methodological warning, since it relativises heated debates about 'human nature'.", "nl": "His conclusion is that after the cognitive revolution there was no single 'natural way of life' for Homo sapiens, only varied cultural options within biological limits. This is a useful methodological warning, since it relativises heated debates about 'human nature'."}, "sources": ["src:64cc653b84"], "flags": []}, {"text": {"fa": "او می‌گوید خوراک‌جویان معمولاً گروه‌هایی از چند ده تا چند صد نفر بودند، بیشتر خانه‌به‌دوش بودند، با گروه‌های همسایه بیشتر کالاهای تجملی (صدف، کهربا، رنگدانه) رد و بدل می‌کردند تا کالای ضروری، و سگ تنها حیوان اهلی پیش از انقلاب کشاورزی بود. تاریخ دقیق اهلی شدن سگ را متخصصان یکسان نمی‌دانند و برآوردها از حدود ۱۵ هزار تا بسیار پیش‌تر می‌رسد.", "en": "He says foragers typically lived in bands of tens to a few hundred, were mostly nomadic, traded mainly luxury goods (shells, amber, pigments) rather than necessities with neighbours, and the dog was the only domesticated animal before agriculture. Specialists do not agree on the date of dog domestication, and estimates range from about 15,000 years ago to considerably earlier.", "nl": "He says foragers typically lived in bands of tens to a few hundred, were mostly nomadic, traded mainly luxury goods (shells, amber, pigments) rather than necessities with neighbours, and the dog was the only domesticated animal before agriculture. Specialists do not agree on the date of dog domestication, and estimates range from about 15,000 years ago to considerably earlier."}, "sources": ["src:64cc653b84"], "flags": ["contested"]}, {"text": {"fa": "هراری می‌نویسد خوراک‌جویان دانش و مهارت متنوع‌تر و عمیق‌تری از انسان صنعتی داشتند و هفته‌ای حدود ۳۵ تا ۴۵ ساعت کار می‌کردند، با زندگی دلپذیرتر از کشاورز و کارگر. این تصویر به بحث قدیمی «جامعهٔ مرفه اولیه» (سالینز) برمی‌گردد که برآوردهای ساعت کار آن از چند مطالعهٔ میدانی کوچک (مثل کالاهاری) می‌آید و معیار «کار» و نمونه‌گیری‌اش محل نقد است؛ و نمی‌تواند به همهٔ خوراک‌جویان باستان تعمیم یابد.", "en": "Harari writes that foragers had more varied and deeper knowledge than industrial people, worked about 35 to 45 hours a week, and led a more pleasant life than farmers and workers. This links to the old 'original affluent society' debate (Sahlins), whose working-hours estimates come from a few small field studies (e.g. in the Kalahari); the definition of 'work' and the sampling are criticised, and results cannot be generalised to all ancient foragers.", "nl": "Harari writes that foragers had more varied and deeper knowledge than industrial people, worked about 35 to 45 hours a week, and led a more pleasant life than farmers and workers. This links to the old 'original affluent society' debate (Sahlins), whose working-hours estimates come from a few small field studies (e.g. in the Kalahari); the definition of 'work' and the sampling are criticised, and results cannot be generalised to all ancient foragers."}, "sources": ["src:64cc653b84", "src:73e2b82f26"], "flags": ["contested", "editor-note"]}], "links": [{"to": "psy:anthropology", "rel": "see-also", "note": {"fa": "انسان‌شناسی تکاملی", "en": "Evolutionary anthropology", "nl": "Evolutionary anthropology"}}, {"to": "tabar:human-evolution", "rel": "part-of", "note": {"fa": "تکامل انسان", "en": "Human evolution", "nl": "Human evolution"}}, {"to": "psy:dog-cognition", "rel": "see-also", "note": {"fa": "شناخت اجتماعی سگ‌ها", "en": "Dog social cognition", "nl": "Dog social cognition"}}, {"to": "tabar:social-brain-evolution", "rel": "see-also", "note": {"fa": "مغز اجتماعی", "en": "The social brain", "nl": "The social brain"}}], "people": ["core:marshall-sahlins"], "sources": ["src:64cc653b84", "src:73e2b82f26"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:earliest-bipeds-and-australopithecus", "kind": "concept", "title": {"fa": "نخستین دوپایان و استرالوپیتکوس‌ها (شاخ آفریقا، شکاف بزرگ آفریقا)", "en": "The earliest bipeds and Australopithecus", "nl": "De vroegste tweebenigen en Australopithecus"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "کتاب شمار گونه‌های منقرض‌شدهٔ انسان و پیش‌انسان را در ۶ تا ۷ میلیون سال گذشته حدود بیست می‌داند و می‌گوید بخش بزرگی از این تاریخ در پیرامون شکاف بزرگ آفریقا گذشته است. سه نامزدِ نخستین دوپا (ساحل‌انتروپوس، اورورین و اردی‌پیتکوس) هنوز مبهم‌اند و استرالوپیتکوس‌ها بسیار بهتر شناخته شده‌اند.", "en": "The book counts about twenty extinct human and proto-human species over the last 6–7 million years, much of this history unfolding around the Great Rift Valley. Three candidate early bipeds (Sahelanthropus, Orrorin, Ardipithecus) remain ambiguous, while Australopithecus is far better known.", "nl": "Het boek telt zo'n twintig uitgestorven mens- en voormenssoorten in 6–7 miljoen jaar, vooral rond de Grote Slenkdal. Sahelanthropus, Orrorin en Ardipithecus blijven onzeker; Australopithecus is veel beter bekend."}, "points": [{"text": {"fa": "بر پایهٔ فسیل‌های ۶ تا ۷ میلیون سال اخیر، حدود بیست گونهٔ منقرض‌شدهٔ انسان یا پیش‌انسان شناخته می‌شود. کهن‌ترین‌ها در جنوب‌شرقی آفریقا (اتیوپی، کنیا، تانزانیا، آفریقای جنوبی) و دو مورد در چاد پیدا شده‌اند. نویسندگان می‌گویند بین ۶ و ۲ میلیون سال پیش بیشتر تاریخ ما در پیرامون «شکاف بزرگ آفریقا» گذشت؛ منطقه‌ای که خشک‌شدن تدریجی اقلیم در آن جنگل‌ها را تکه‌تکه کرد (پس از حدود ۶ میلیون سال پیش) و سپس علفزارهای گسترده پدید آورد (حدود ۳ میلیون سال پیش).", "en": "About twenty extinct human or proto-human species are known from the last 6–7 Myr, the oldest across eastern and southern Africa plus two from Chad. Between 6 and 2 Mya the story is centred on the Great Rift Valley, where progressive drying fragmented forests (after ~6 Mya) and later produced wide grasslands (~3 Mya).", "nl": "About twenty extinct human or proto-human species are known from the last 6–7 Myr, the oldest across eastern and southern Africa plus two from Chad. Between 6 and 2 Mya the story is centred on the Great Rift Valley, where progressive drying fragmented forests (after ~6 Mya) and later produced wide grasslands (~3 Mya)."}, "sources": ["src:64c357a843"], "flags": []}, {"text": {"fa": "سه سردستهٔ نخستین نامزدهای دوپایی: «ساحل‌انتروپوس چادنسیس» (جمجمهٔ چاد با نام «توماِی»، معرفی‌شده در ۲۰۰۲، سن ۷ تا ۶٫۵ میلیون سال با روش زیست‌زمان‌شناسی)، «اورورین توگننسیس» (تپه‌های توگن کنیا، حدود ۶ میلیون سال؛ بخش‌هایی از استخوان ران نشانهٔ راه‌رفتن دوپا است) و «اردی‌پیتکوس» (آواش میانی اتیوپی؛ گونهٔ کدابا ۵٫۸ تا ۵٫۲ و گونهٔ رامیدوس حدود ۴٫۴ میلیون سال، با اسکلت نسبتاً کامل «آردی» که در ۲۰۰۹ در یک شمارهٔ ویژهٔ ساینس منتشر شد).", "en": "Three genera are the first candidate bipeds: Sahelanthropus tchadensis (the 2002 Chad skull 'Toumaï', 7–6.5 Mya by faunal dating), Orrorin tugenensis (Tugen Hills, Kenya, ~6 Mya; femur fragments suggest bipedalism) and Ardipithecus (Middle Awash, Ethiopia; kadabba 5.8–5.2 Mya, ramidus ~4.4 Mya, with the partial skeleton 'Ardi' described in a 2009 special issue of Science).", "nl": "Three genera are the first candidate bipeds: Sahelanthropus tchadensis (the 2002 Chad skull 'Toumaï', 7–6.5 Mya by faunal dating), Orrorin tugenensis (Tugen Hills, Kenya, ~6 Mya; femur fragments suggest bipedalism) and Ardipithecus (Middle Awash, Ethiopia; kadabba 5.8–5.2 Mya, ramidus ~4.4 Mya, with the partial skeleton 'Ardi' described in a 2009 special issue of Science)."}, "sources": ["src:64c357a843", "src:66b0791be1", "src:90aae08571"], "flags": []}, {"text": {"fa": "به گفتهٔ خود نویسندگان، همهٔ دیرین‌انسان‌شناسان نمی‌پذیرند که جمجمهٔ توماِی نیای خط انسانی باشد. اگر سن آن تأیید شود از حد ساعت مولکولی (حدود ۶ میلیون سال) هم قدیمی‌تر درمی‌آید و کالیبراسیون ژنتیکی را زیر پرسش می‌برد. دربارهٔ اورورین و اردی‌پیتکوس کدابا نیز به‌دلیل کمیِ نمونه‌ها بهتر است داوری را به تعویق انداخت.", "en": "By the authors' own account, not all paleoanthropologists accept the Chad skull as ancestral to humans; if its age were confirmed it would exceed the molecular-clock limit and challenge the genetic calibration. For Orrorin and Ar. kadabba the samples are too small for firm judgement.", "nl": "By the authors' own account, not all paleoanthropologists accept the Chad skull as ancestral to humans; if its age were confirmed it would exceed the molecular-clock limit and challenge the genetic calibration. For Orrorin and Ar. kadabba the samples are too small for firm judgement."}, "sources": ["src:64c357a843"], "flags": ["contested"]}, {"text": {"fa": "استرالوپیتکوس بسیار بهتر از پیشینیانش شناخته شده است. دست‌کم چهار گونهٔ قابل‌اعتماد: آنامنسیس (۴٫۲ تا ۳٫۹ میلیون سال، کنیا و اتیوپی)، آفارنسیس (هَدار در اتیوپی و لائتولی در تانزانیا، حدود ۴ تا ۳ میلیون سال؛ شامل اسکلت مشهور «لوسی» و ردپاهای سه دوپا در خاکستر آتشفشانی لائتولی که بیش از ۳٫۵ میلیون سال قدمت دارد)، آفریکانوس و سدیبا. دو مورد دیگر (باهرالغزالی و گارهی) نامطمئن یا بحث‌برانگیزند. پیش‌نمایش در همین‌جا به پایان می‌رسد و جزئیات آفریکانوس و سدیبا را نشان نمی‌دهد.", "en": "Australopithecus is far better known than earlier forms: at least four reliable species — A. anamensis (4.2–3.9 Mya, Kenya/Ethiopia), A. afarensis (Hadar, Laetoli; ~4.0–3.0 Mya; includes 'Lucy' and the >3.5 Mya Laetoli footprints), A. africanus and A. sediba — with uncertain (A. bahrelghazali) and controversial (A. garhi) cases. The preview ends here, before details of africanus and sediba.", "nl": "Australopithecus is far better known than earlier forms: at least four reliable species — A. anamensis (4.2–3.9 Mya, Kenya/Ethiopia), A. afarensis (Hadar, Laetoli; ~4.0–3.0 Mya; includes 'Lucy' and the >3.5 Mya Laetoli footprints), A. africanus and A. sediba — with uncertain (A. bahrelghazali) and controversial (A. garhi) cases. The preview ends here, before details of africanus and sediba."}, "sources": ["src:64c357a843"], "flags": []}, {"text": {"fa": "یادداشت ویراستار: ارزیابی «آردی» هنوز بحث دارد. گروه کاشف آن را نزدیک به ریشهٔ تبار انسان می‌دانند، اما برخی پژوهشگران دربارهٔ اینکه آیا اردی‌پیتکوس واقعاً از نیاکان مستقیم انسان است و چگونه راه می‌رفته تردید دارند. این کتاب فقط روایت گروه کاشف را خلاصه می‌کند.", "en": "Editor's note: the interpretation of 'Ardi' remains debated. Its describers place it near the root of the human lineage, but some researchers question whether Ardipithecus is a direct ancestor and how it moved; the book only summarises the describers' view.", "nl": "Editor's note: the interpretation of 'Ardi' remains debated. Its describers place it near the root of the human lineage, but some researchers question whether Ardipithecus is a direct ancestor and how it moved; the book only summarises the describers' view."}, "sources": [], "flags": ["contested", "editor-note"]}], "links": [{"to": "tabar:primates-ape-ancestry-molecular-clock", "rel": "see-also", "note": {"fa": "ما نخستی‌ایم: ریشهٔ میمونی انسان و ساعت مولکولی", "en": "We are primates: ape ancestry and the molecular clock", "nl": "We are primates: ape ancestry and the molecular clock"}}, {"to": "tabar:brain-body-size-climate", "rel": "see-also", "note": {"fa": "اقلیم و اندازهٔ مغز و بدن", "en": "Climate and brain/body size", "nl": "Climate and brain/body size"}}, {"to": "tabar:out-of-africa", "rel": "see-also", "note": {"fa": "خاستگاه آفریقایی انسان خردمند", "en": "The African origin of Homo sapiens", "nl": "The African origin of Homo sapiens"}}], "people": [], "sources": ["src:64c357a843", "src:66b0791be1", "src:90aae08571"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:neanderthal-ancestry-selection", "kind": "concept", "title": {"fa": "سرنوشت دی‌ان‌ای نئاندرتال: زمان آمیزش و پاک‌سازی با انتخاب طبیعی", "en": "The fate of Neanderthal DNA: timing of mixture and purging by selection", "nl": "Het lot van Neanderthaler-DNA: tijdstip van vermenging en zuivering door selectie"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "مردم بیرون از آفریقا حدود ۲ درصد از ژنوم خود را از نئاندرتال‌ها دارند. دیوید رایش در کتابش می‌گوید این آمیزش حدود ۵۴ تا ۴۹ هزار سال پیش رخ داد و بعدها انتخاب طبیعی بخش بزرگی از این دی‌ان‌ای را از ژنوم ما حذف کرد؛ به‌ویژه از کروموزوم X و ژن‌های بیضه. تفسیر «کم‌باروری دورگه‌ها» و جزئیات زمانی هنوز میان پژوهشگران محل بحث است.", "en": "People outside Africa carry about 2 percent Neanderthal DNA. David Reich argues that the mixing happened roughly 54,000–49,000 years ago and that natural selection later removed much of this DNA, especially from the X chromosome and testis genes. The 'reduced hybrid fertility' interpretation and the exact timing are still debated.", "nl": "Mensen buiten Afrika dragen zo'n 2 procent Neanderthaler-DNA. Reich stelt dat de vermenging ca. 54.000–49.000 jaar geleden plaatsvond en dat natuurlijke selectie later veel van dit DNA verwijderde, vooral van het X-chromosoom en testisgenen. De verklaring via ver
