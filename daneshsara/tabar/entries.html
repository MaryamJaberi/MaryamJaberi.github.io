۰۰۴): زوج‌های هر دو ناقل، مشاوره می‌گیرند و می‌توانند ازدواج نکنند، ازدواج کنند و تشخیص پیش از تولد انجام دهند، یا خطر را بپذیرند؛ در سال‌های اول، تولد نوزادان مبتلا در استان‌های هدف به‌طور چشمگیری کاهش یافت.", "en": "Samavat and Modell (2004): couples who are both carriers receive counselling and may not marry, marry and use prenatal diagnosis, or accept the risk; in the first years the birth of affected infants fell markedly in the target provinces.", "nl": "Samavat and Modell (2004): couples who are both carriers receive counselling and may not marry, marry and use prenatal diagnosis, or accept the risk; in the first years the birth of affected infants fell markedly in the target provinces."}, "sources": ["src:0aa129f24c"], "flags": []}, {"text": {"fa": "درس‌های برنامه: ادغام در نظام بهداشت اولیه، حمایت رهبران مذهبی از مجوز سقط درمانی (فتوای ۱۹۹۷)، و احترام به انتخاب زوج به جای ممنوعیت.", "en": "Lessons of the programme: integration in primary health care, religious leaders' support for a therapeutic abortion permit (1997 ruling), and respect for the couple's choice rather than prohibition.", "nl": "Lessons of the programme: integration in primary health care, religious leaders' support for a therapeutic abortion permit (1997 ruling), and respect for the couple's choice rather than prohibition."}, "sources": ["src:0aa129f24c"], "flags": []}], "links": [{"to": "tabar:consanguinity", "rel": "applies-to", "note": {"fa": "چرا غربالگری در ایران اهمیت ویژه دارد", "en": "Why screening matters especially in Iran", "nl": "Why screening matters especially in Iran"}}, {"to": "atlas:genethics", "rel": "bridges", "note": {"fa": "پل اخلاق ژنتیک", "en": "The genetic ethics bridge", "nl": "The genetic ethics bridge"}}], "people": ["core:bernadette-modell"], "sources": ["src:0aa129f24c"], "booklets": [], "origin": null, "iran": "iran:thalassemia-screening", "wikidata": null, "status": "draft"}, {"id": "tabar:gene-environment", "kind": "concept", "title": {"fa": "تعامل و همبستگی ژن و محیط", "en": "Gene–environment interplay", "nl": "Samenspel van gen en omgeving"}, "aliases": [], "parent": "tabar:behavior-genetics", "field": "tabar:behavior-genetics", "summary": {"fa": "ژن و محیط دو ستون جدا نیستند: ژن‌ها محیط را انتخاب و برمی‌انگیزند، و محیط تعیین می‌کند ژن‌ها چقدر بروز کنند. این است که «چند درصد ژن، چند درصد محیط» سؤال بدی است.", "en": "Genes and environment are not two separate columns: genes select and evoke environments, and environments set how much genes express. That is why \"what percent genes, what percent environment\" is a bad question.", "nl": "Genen en omgeving zijn geen twee aparte kolommen: genen selecteren en roepen omgevingen op, en omgevingen bepalen hoeveel genen tot uiting komen. Daarom is \"hoeveel procent genen, hoeveel procent omgeving\" een slechte vraag."}, "points": [{"text": {"fa": "سه نوع همبستگی ژن–محیط: منفعل (والدین هم ژن می‌دهند هم محیط)، برانگیزاننده (کودک کنجکاو پاسخ‌های غنی‌تری می‌گیرد)، و فعال (آدم‌ها محیطی را انتخاب می‌کنند که با گرایش‌هایشان جور است).", "en": "Three kinds of gene–environment correlation: passive (parents give both genes and environment), evocative (a curious child draws richer responses), and active (people choose environments that fit their dispositions).", "nl": "Three kinds of gene–environment correlation: passive (parents give both genes and environment), evocative (a curious child draws richer responses), and active (people choose environments that fit their dispositions)."}, "sources": ["src:6104f13aa6"], "flags": []}, {"text": {"fa": "ترکهایمر (۲۰۰۳): در کودکان خانواده‌های فقیر آمریکایی وراثت‌پذیری هوش نزدیک صفر و در خانواده‌های مرفه بالا بود؛ محرومیت نمی‌گذارد تفاوت‌های ژنتیکی بروز کنند.", "en": "Turkheimer (2003): among children of poor US families the heritability of IQ was near zero, among affluent families high; deprivation keeps genetic differences from showing.", "nl": "Turkheimer (2003): among children of poor US families the heritability of IQ was near zero, among affluent families high; deprivation keeps genetic differences from showing."}, "sources": ["src:bf306944ea"], "flags": []}, {"text": {"fa": "تکرار: فراتحلیل ۲۰۱۶ این تعامل را در آمریکا تأیید کرد ولی در اروپای غربی و استرالیا نه؛ احتمالاً چون سیستم‌های رفاهی کف محیط را بالا می‌برند. یافته‌ای وابسته به بافت، نه قانون جهانی.", "en": "Replication: a 2016 meta-analysis confirmed the interaction in the US but not in Western Europe or Australia, probably because welfare systems raise the environmental floor. A context-dependent finding, not a universal law.", "nl": "Replication: a 2016 meta-analysis confirmed the interaction in the US but not in Western Europe or Australia, probably because welfare systems raise the environmental floor. A context-dependent finding, not a universal law."}, "sources": ["src:65b756684e"], "flags": ["contested"]}], "links": [{"to": "tabar:heritability", "rel": "explains", "note": {"fa": "چرا وراثت‌پذیری یک عدد ثابت نیست", "en": "Why heritability is not a fixed number", "nl": "Why heritability is not a fixed number"}}, {"to": "tabar:iq-heritability-debate", "rel": "prerequisite", "note": {"fa": "بدون این مفهوم بحث هوش گمراه‌کننده است", "en": "Without this concept the IQ debate misleads", "nl": "Without this concept the IQ debate misleads"}}], "people": ["core:eric-turkheimer"], "sources": ["src:6104f13aa6", "src:65b756684e", "src:bf306944ea"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:darwin-inheritance-gap", "kind": "concept", "title": {"fa": "خلأ وراثت در نظریهٔ داروین: وراثت آمیخته و ارث اکتسابی", "en": "The inheritance gap in Darwin's theory: blending and acquired characters", "nl": "De erfelijkheidskloof in Darwins theorie: vermenging en verworven eigenschappen"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "نظریهٔ داروین به وراثت نیاز داشت، اما در ۱۸۵۹ هیچ نظریهٔ درستی برای آن وجود نداشت. داروین بیشتر به «دیدگاه رایج زمانه» تکیه کرد: آمیزش والدین ویژگی‌ها را کم‌وبیش مخلوط می‌کند و استفاده یا ناستفادهٔ یک عضو می‌تواند به نسل بعد برسد. هر دو بخش با ژنتیک مندلی کنار گذاشته یا اصلاح شدند.", "en": "Darwin's theory needed heredity, but in 1859 no correct theory of it existed. He leaned on the common views of his day: parental traits roughly mix, and use or disuse of an organ can be passed on. Mendelian genetics later discarded or corrected both.", "nl": "Darwins theorie had erfelijkheid nodig, maar in 1859 bestond er geen juiste theorie. Hij leunde op gangbare ideeën: vermenging van ouderlijke eigenschappen en erfelijkheid van gebruik en niet-gebruik. De Mendeliaanse genetica verwierp of corrigeerde beide."}, "points": [{"text": {"fa": "داروین در «خاستگاه گونه‌ها» (چاپ نخست) می‌پذیرد که قانون‌های وراثت «ناشناخته» است و از «آمیزش و درهم‌شدن» ویژگی‌ها هم به‌عنوان یک خطر برای ماندگاری تفاوت‌های کوچک حرف می‌زند. فلیمینگ جنکین در ۱۸۶۷ استدلال کرد که اگر وراثت واقعاً آمیخته باشد، یک ویژگی تازه در جمعیت بزرگ رقیق می‌شود و از میان می‌رود.", "en": "In the first edition Darwin admits the laws of inheritance are unknown and treats the 'blending' of traits through crossing as a threat to small differences persisting. Fleeming Jenkin argued in 1867 that under true blending a new trait would be diluted away in a large population.", "nl": "In the first edition Darwin admits the laws of inheritance are unknown and treats the 'blending' of traits through crossing as a threat to small differences persisting. Fleeming Jenkin argued in 1867 that under true blending a new trait would be diluted away in a large population."}, "sources": ["src:84786f7bfa"], "flags": ["dated"]}, {"text": {"fa": "پاسخ درست را مندل (۱۸۶۶) پیش‌تر یافته بود، ولی دانش او تا حدود ۱۹۰۰ جدی گرفته نشد: وراثت «ذره‌ای» است. ژن‌ها مخلوط نمی‌شوند و بدون تغییر منتقل می‌شوند، پس تنوع در جمعیت حفظ می‌شود و انتخاب بر آن عمل می‌کند. بدین ترتیب «وراثت آمیخته» به‌عنوان نظریهٔ عمومی وراثت رد شد.", "en": "The right answer had been found by Mendel (1866) but was not taken seriously until about 1900: inheritance is particulate. Genes do not blend and are passed on intact, so variation is preserved for selection to act on. Blending as a general theory of heredity was thereby rejected.", "nl": "The right answer had been found by Mendel (1866) but was not taken seriously until about 1900: inheritance is particulate. Genes do not blend and are passed on intact, so variation is preserved for selection to act on. Blending as a general theory of heredity was thereby rejected."}, "sources": ["src:1de9de3693"], "flags": ["dated"]}, {"text": {"fa": "داروین استفاده/ناستفاده را هم در کنار انتخاب طبیعی علت دگرگونی می‌دانست (مثلاً کوچک‌شدن چشم موش کور). دیدگاه «ارث اکتسابی» نزدیک به لامارک است. این فرض اکنون در شکل کلاسیک خود رد شده است؛ وایسمان (۱۸۹۳) میان سلول‌های جنسی و بدنی فرق گذاشت و اثر مستقیم یک‌عمرِ فرد بر ژن‌ها نشان داده نشد. داروین در کتاب بعدی (۱۸۶۸) فرضیهٔ «پانژنز» را ارائه داد که ذره‌های ریز از همهٔ اندام‌ها به سلول جنسی می‌رسند؛ این فرضیه شواهدی نیافت.", "en": "Darwin also counted use and disuse alongside natural selection as a cause of change (for example, reduced eyes in burrowing animals). Such 'acquired inheritance' is close to Lamarck's view. In its classic form it is now rejected; Weismann (1893) separated germ cells from body cells, and direct passing of a lifetime's effects to genes was not shown. In a later book (1868) Darwin proposed 'pangenesis', where tiny particles travel from all organs to the sex cells; it found no support.", "nl": "Darwin also counted use and disuse alongside natural selection as a cause of change (for example, reduced eyes in burrowing animals). Such 'acquired inheritance' is close to Lamarck's view. In its classic form it is now rejected; Weismann (1893) separated germ cells from body cells, and direct passing of a lifetime's effects to genes was not shown. In a later book (1868) Darwin proposed 'pangenesis', where tiny particles travel from all organs to the sex cells; it found no support."}, "sources": ["src:84786f7bfa", "src:636e24d0d2", "src:f1896c7feb"], "flags": ["dated"]}, {"text": {"fa": "نکتهٔ امروزی: پژوهش‌های اپی‌ژنتیک نشان داده‌اند در موارد محدود برخی نشانه‌های شیمیایی روی دی‌ان‌ای می‌تواند به نسل بعد برسد، ولی این به‌هیچ‌وجه بازگشت به لامارک در انسان نیست و شواهد برای وراثت بین‌نسلی در پستانداران هنوز محدود و بحث‌برانگیز است.", "en": "Modern note: epigenetics shows that in limited cases some chemical marks on DNA can pass to the next generation, but this is not a return to Lamarck in humans, and evidence for transgenerational inheritance in mammals remains limited and debated.", "nl": "Modern note: epigenetics shows that in limited cases some chemical marks on DNA can pass to the next generation, but this is not a return to Lamarck in humans, and evidence for transgenerational inheritance in mammals remains limited and debated."}, "sources": [], "flags": ["contested", "editor-note"]}], "links": [{"to": "tabar:epigenetics", "rel": "see-also", "note": {"fa": "اپی‌ژنتیک", "en": "Epigenetics", "nl": "Epigenetics"}}, {"to": "tabar:transgenerational", "rel": "contrasts", "note": {"fa": "وراثت اپی‌ژنتیک بین‌نسلی", "en": "Transgenerational epigenetic inheritance", "nl": "Transgenerational epigenetic inheritance"}}, {"to": "tabar:epigenetic-marks", "rel": "see-also", "note": {"fa": "نشانه‌های اپی‌ژنتیک", "en": "Epigenetic marks", "nl": "Epigenetic marks"}}, {"to": "tabar:mutation-selection-drift", "rel": "see-also", "note": {"fa": "جهش، انتخاب و رانش", "en": "Mutation, selection and drift", "nl": "Mutation, selection and drift"}}], "people": ["core:gregor-mendel", "core:august-weismann", "core:jean-baptiste-lamarck", "core:fleeming-jenkin"], "sources": ["src:1de9de3693", "src:636e24d0d2", "src:84786f7bfa", "src:f1896c7feb"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:genetic-essentialism", "kind": "concept", "title": {"fa": "ذات‌گرایی ژنتیکی", "en": "Genetic essentialism", "nl": "Genetisch essentialisme"}, "aliases": [], "parent": "tabar:genetics-society", "field": "tabar:genetics-society", "summary": {"fa": "گرایش ذهن به اینکه ژن را «ذات» پنهان و تغییرناپذیر بداند: اگر چیزی ژنتیکی است، پس طبیعی، ثابت، سرنوشت و مرزبندی‌کننده است. این سوگیری شناختی مستند است و نحوهٔ خبررسانی علمی آن را تشدید یا تضعیف می‌کند.", "en": "The mind's tendency to treat genes as a hidden, unchangeable \"essence\": if something is genetic, then it is natural, fixed, fated and boundary-drawing. This cognitive bias is documented, and the way science is reported amplifies or dampens it.", "nl": "De neiging van de geest om genen te zien als een verborgen, onveranderlijke \"essentie\": als iets genetisch is, dan is het natuurlijk, vast, lotsbestemd en grensbepalend. Deze cognitieve bias is gedocumenteerd, en de manier waarop wetenschap wordt bericht versterkt of dempt haar."}, "points": [{"text": {"fa": "دار-نیمرود و هاینه (۲۰۱۱): خواندن توضیح ژنتیکی برای یک رفتار (مثلاً چاقی یا تفاوت ریاضی زن و مرد) باعث می‌شود افراد آن را تغییرناپذیرتر بدانند، کمتر خود را مسئول بدانند و کلیشه‌ها را بیشتر بپذیرند، حتی وقتی وراثت‌پذیری واقعی ناچیز است.", "en": "Dar-Nimrod and Heine (2011): reading a genetic explanation for a behaviour (e.g. obesity or sex differences in maths) makes people see it as more fixed, feel less responsible and accept stereotypes more, even when real heritability is negligible.", "nl": "Dar-Nimrod and Heine (2011): reading a genetic explanation for a behaviour (e.g. obesity or sex differences in maths) makes people see it as more fixed, feel less responsible and accept stereotypes more, even when real heritability is negligible."}, "sources": ["src:d5508c7aeb"], "flags": []}, {"text": {"fa": "پادزهر: هر بار که عدد وراثت‌پذیری می‌بینید، سه سؤال بپرسید: در کدام جمعیت؟ در کدام محیط؟ و آیا دربارهٔ تغییرپذیری چیزی می‌گوید؟ (پاسخ سومی همیشه «نه» است.)", "en": "Antidote: whenever you see a heritability figure, ask three questions: in which population? In which environment? And does it say anything about changeability? (The third answer is always \"no\".)", "nl": "Antidote: whenever you see a heritability figure, ask three questions: in which population? In which environment? And does it say anything about changeability? (The third answer is always \"no\".)"}, "sources": ["src:ba8f3ee8f4", "src:b1c0eba86d"], "flags": []}], "links": [{"to": "tabar:heritability", "rel": "critiques", "note": {"fa": "سوءبرداشت از وراثت‌پذیری", "en": "Misreading heritability", "nl": "Misreading heritability"}}, {"to": "psy:cognitive-biases", "rel": "bridges", "note": {"fa": "سوگیری‌های شناختی در ویکی روان", "en": "Cognitive biases in the psychology wiki", "nl": "Cognitive biases in the psychology wiki"}}, {"to": "psy:mindsets", "rel": "bridges", "note": {"fa": "ذهنیت رشد در برابر ثابت", "en": "Growth versus fixed mindset", "nl": "Growth versus fixed mindset"}}], "people": [], "sources": ["src:b1c0eba86d", "src:ba8f3ee8f4", "src:d5508c7aeb"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:epigenetic-marks", "kind": "concept", "title": {"fa": "نشانه‌های اپی‌ژنتیک", "en": "Epigenetic marks", "nl": "Epigenetische merktekens"}, "aliases": [], "parent": "tabar:epigenetics", "field": "tabar:epigenetics", "summary": {"fa": "متیل شدن دی‌ان‌ای و تغییر هیستون‌ها تعیین می‌کنند کدام ژن‌ها در کدام سلول خوانده شوند؛ این نشانه‌ها با تغذیه، استرس و سن تغییر می‌کنند. اپی‌ژنتیک واقعی و مهم است، اما بیشتر آنچه در رسانه‌ها «اپی‌ژنتیک» خوانده می‌شود، گمانه است.", "en": "DNA methylation and histone changes determine which genes are read in which cell; these marks change with nutrition, stress and age. Epigenetics is real and important, but much of what the media call \"epigenetics\" is speculation.", "nl": "DNA-methylering en histonveranderingen bepalen welke genen in welke cel worden afgelezen; deze merktekens veranderen met voeding, stress en leeftijd. Epigenetica is echt en belangrijk, maar veel van wat de media \"epigenetica\" noemen, is speculatie."}, "points": [{"text": {"fa": "قحطی هلند (زمستان ۱۹۴۴–۴۵): افرادی که در اوایل بارداری در معرض قحطی بودند، شش دهه بعد متیل شدن کمتری در ژن IGF2 داشتند؛ شاهدی که محیط پیش از تولد ردی ماندگار در تنظیم ژن می‌گذارد.", "en": "The Dutch Hunger Winter (1944–45): people exposed to famine in early gestation had less methylation of the IGF2 gene six decades later; evidence that the prenatal environment leaves a lasting trace in gene regulation.", "nl": "The Dutch Hunger Winter (1944–45): people exposed to famine in early gestation had less methylation of the IGF2 gene six decades later; evidence that the prenatal environment leaves a lasting trace in gene regulation."}, "sources": ["src:540fb9c6d0"], "flags": []}, {"text": {"fa": "«ساعت اپی‌ژنتیک» از الگوی متیل شدن سن زیستی را برآورد می‌کند و با سلامت و مرگ‌ومیر همبسته است؛ ابزار پژوهشی امیدبخش، هنوز نه ابزار بالینی.", "en": "The \"epigenetic clock\" estimates biological age from methylation patterns and correlates with health and mortality; a promising research tool, not yet a clinical one.", "nl": "The \"epigenetic clock\" estimates biological age from methylation patterns and correlates with health and mortality; a promising research tool, not yet a clinical one."}, "sources": ["src:07fb5aa7b9"], "flags": ["editor-note"]}], "links": [{"to": "tabar:transgenerational", "rel": "see-also", "note": {"fa": "آیا به نسل بعد می‌رسد؟", "en": "Does it reach the next generation?", "nl": "Does it reach the next generation?"}}, {"to": "psy:n-stress", "rel": "bridges", "note": {"fa": "استرس و مغز در ویکی روان", "en": "Stress and the brain in the psychology wiki", "nl": "Stress and the brain in the psychology wiki"}}], "people": ["core:bas-heijmans"], "sources": ["src:07fb5aa7b9", "src:540fb9c6d0"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:first-out-of-africa-java-peking-dmanisi", "kind": "concept", "title": {"fa": "نخستین خروج از آفریقا: انسان جاوه، مرد پکن، دمانیسی و تبردستی‌های ایران", "en": "The first exit from Africa: Java Man, Peking Man, Dmanisi and the hand-axes of Iran", "nl": "De eerste uittocht uit Afrika: de Javamens, de Pekingmens, Dmanisi en de vuistbijlen van Iran"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "انسان راست‌قامت نخستین انسانی است که بقایایش بیرون از آفریقا پیدا شده است: در جاوه (حدود ۱٫۶ میلیون سال)، در غار ژوکودیان نزدیک پکن (حدود ۸۰۰ هزار سال)، در دمانیسی گرجستان (حدود ۱٫۷۷ میلیون سال) و در جنوب اروپا. «خداحافظ آفریقا» داستان کشف این فسیل‌ها، روش‌های تاریخ‌گذاری، چگونگیِ گسترشِ نسل‌به‌نسلِ جمعیت‌ها بی‌آنکه کسی «قصد مهاجرت» داشته باشد، و شواهد ابزار سنگی آشولی در سراسر ایران را روایت می‌کند و نتیجه می‌گیرد که پیشینهٔ حضور انسان در فلات ایران به حدود دو میلیون سال پیش بازمی‌گردد.", "en": "Homo erectus is the first human found outside Africa: in Java (~1.6 Mya), Zhoukoudian near Beijing (~800 ka), Dmanisi in Georgia (~1.77 Mya) and southern Europe. The programme tells how these fossils were found and dated, how populations spread generation by generation without anyone 'intending' to migrate, and presents Acheulean hand-axes from across Iran, concluding that human presence on the Iranian plateau goes back about two million years.", "nl": "Homo erectus is de eerste mens die buiten Afrika is gevonden: op Java (~1,6 miljoen jaar), in Zhoukoudian bij Beijing (~800.000 jaar), in Dmanisi in Georgië (~1,77 miljoen jaar) en in Zuid-Europa. Het programma vertelt hoe deze fossielen zijn gevonden en gedateerd, hoe populaties zich generatie na generatie verspreidden zonder 'bedoeling' te migreren, en wijst op Acheuleaanse vuistbijlen uit heel Iran."}, "points": [{"text": {"fa": "چرا «خروج از آفریقا» و نه «خروج از آسیا»؟ در میانهٔ سدهٔ نوزدهم، زیست‌شناسانی چون ارنست هکل خاستگاه انسان را جنوب‌شرق آسیا می‌دانستند و این دیدگاه تا مدت‌ها رایج بود؛ در همان زمان داروین بی‌آنکه فسیلی دیده باشد حدس زد خاستگاه آفریقاست. امروز دیدگاه رایج «خروج از آفریقا» است چون کهن‌ترین فسیل‌ها و ابزارها از آفریقا آمده‌اند. گوینده تأکید می‌کند که این یک نتیجهٔ نسبی است: علم «تعصب روی حرفش» ندارد و اگر فردا فسیلی قدیمی‌تر در آسیا پیدا شود، باید مدل‌ها را بازنگری کرد.", "en": "Why 'out of Africa' and not 'out of Asia'? In the mid-19th century biologists such as Ernst Haeckel placed human origins in Southeast Asia, and the view long prevailed; Darwin, without having seen a fossil, guessed Africa. Today 'out of Africa' prevails because the oldest fossils and tools come from Africa. The speaker stresses this is provisional: if an older fossil turns up in Asia tomorrow, the models must be revised.", "nl": "Waarom 'uit Afrika' en niet 'uit Azië'? Halverwege de 19e eeuw plaatsten biologen als Ernst Haeckel de oorsprong in Zuidoost-Azië; Darwin gokte, zonder fossielen, op Afrika. Vandaag overheerst 'uit Afrika' omdat de oudste fossielen en werktuigen daar vandaan komen. De spreker benadrukt dat dit voorlopig is."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "تاریخ‌گذاری: کربن ۱۴ فقط تا حدود ۴۰ تا ۴۵ هزار سال پیش کار می‌کند. سن‌های میلیون‌ساله با روش پتاسیم-آرگون یا آرگون-آرگون به دست می‌آید که نه خود فسیل، بلکه لایهٔ خاکستر آتشفشانیِ کنار آن را تاریخ‌گذاری می‌کند. خاکستر آتشفشانی با گدازه فرق دارد: پودر سنگی است که پیش از جاری‌شدن گدازه، گاهی هفته‌ها، به هوا می‌رود و پخش می‌شود. کلید کار این است که باستان‌شناس مطمئن شود فسیل و لایهٔ خاکستر «درجا» و دست‌نخورده کنار هم‌اند؛ گوینده می‌گوید جابه‌جایی لایه‌ها تاکنون خطاهای چندصدهزارساله پدید آورده است.", "en": "Dating: radiocarbon only reaches about 40–45 ka. Million-year ages come from potassium–argon or argon–argon dating, which dates not the fossil but the volcanic ash layer beside it. Ash differs from lava: it is rock powder blown into the air, sometimes for weeks, before lava flows. The key is to establish that fossil and ash are in situ and undisturbed; the speaker notes that disturbed layers have caused errors of hundreds of thousands of years.", "nl": "Datering: koolstof-14 reikt maar tot zo'n 40–45.000 jaar. Ouderdommen van miljoenen jaren komen van kalium-argon- of argon-argondatering, die niet het fossiel maar de vulkanische aslaag ernaast dateert. Cruciaal is dat fossiel en as ongestoord in situ liggen; verstoorde lagen hebben fouten van honderdduizenden jaren veroorzaakt."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "انسان جاوه: در ۱۸۹۱ اوژن دوبوا، پزشک هلندی، با الهام از پیش‌بینی هکل به جاوه (هند شرقیِ مستعمرهٔ هلند) رفت تا «حلقهٔ گمشده» میان میمون و انسان را بیابد. او تخصصی در این زمینه نداشت، به‌عنوان پزشک ارتش حدود چهل زندانی را به کارگری گرفت و کاوش‌هایش غیرعلمی و تصادفی بود. با این حال یک کاسهٔ سر (حجم مغز نزدیک ۱۰۰۰ سی‌سی) و یک استخوان ران کاملاً شبیه ران انسانِ راست‌رو پیدا کرد و آن را «پیتکانتروپوس اِرِکتوس» (میمون-انسانِ راست‌قامت) نامید. نام «راست‌قامت» از همین‌جاست: نخستین نمونهٔ این گروه بود که کشف شد و دوبوا گمان می‌کرد نخستین موجود دوپاست. جامعهٔ علمی تقریباً یک‌صدا آن را رد کرد (یک میمون بزرگ یا گیبون)؛ دوبوا رنجید، یافته‌ها را در صندوقی قفل کرد و سرانجام خودش هم پذیرفت که اشتباه کرده، و بی‌آنکه بداند چه کشف مهمی کرده بود درگذشت.", "en": "Java Man: in 1891 the Dutch physician Eugène Dubois, inspired by Haeckel's prediction, went to Java (then the Dutch East Indies) to find the 'missing link'. Untrained in the field, he used around forty convict labourers as an army doctor and dug unsystematically. Still, he found a skullcap (brain ~1,000 cc) and a thigh bone just like that of an upright walker, naming it Pithecanthropus erectus — hence 'erectus', since it was the first of the group discovered and Dubois thought it the first biped. The scientific community largely rejected it as a large ape; Dubois, offended, locked the finds away and eventually came to think he had been wrong, dying unaware of the importance of his discovery.", "nl": "De Javamens: in 1891 ging de Nederlandse arts Eugène Dubois, geïnspireerd door Haeckel, naar Java om de 'ontbrekende schakel' te vinden. Als legerarts zette hij zo'n veertig gevangenen in en groef vrij lukraak. Toch vond hij een schedelkap (~1.000 cc) en een dijbeen van een rechtoplopend wezen: Pithecanthropus erectus. De wetenschap wees het grotendeels af; Dubois sloot de vondsten weg en stierf zonder het belang ervan te kennen."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "مرد پکن: دیویدسون بلک، کالبدشناس کانادایی، در داروفروشی‌های سنتی چین «دندان اژدها» دید که برای خواص پزشکیِ پنداری آسیاب و خورده می‌شد و تشخیص داد دندان انسان است. ردِ آن را تا غاری نزدیک پکن (ژوکودیان) گرفت که لایه‌هایش بقایای ده‌ها انسان راست‌قامت از حدود ۸۰۰ هزار سال پیش را در خود داشت؛ نمی‌دانیم پیش از شناخته‌شدن اهمیت محوطه چه شمار دندان آسیاب و خورده شده بود. یک جمجمهٔ تقریباً کامل («مرد پکن») در میانهٔ جنگ جهانی دوم گم شد؛ روایت‌ها مختلف‌اند (قطاری که بمباران شد، کشتی‌ای که غرق شد، یک کلکسیون خصوصی)، اما خوشبختانه قالبی از آن مانده است.", "en": "Peking Man: the Canadian anatomist Davidson Black saw 'dragon teeth' sold in Chinese traditional pharmacies — ground up for supposed medicinal powers — and recognised them as human. He traced them to a cave near Beijing (Zhoukoudian) whose layers held dozens of Homo erectus individuals from around 800 ka; how many teeth were ground up before the site's importance was realised is unknown. A nearly complete skull ('Peking Man') vanished during the Second World War — accounts vary (a bombed train, a sunk ship, a private collection) — but casts survive.", "nl": "De Pekingmens: de Canadese anatoom Davidson Black herkende 'drakentanden' uit Chinese traditionele apotheken als mensentanden en volgde ze naar een grot bij Beijing (Zhoukoudian), met resten van tientallen Homo erectus-individuen van zo'n 800.000 jaar oud. Een vrijwel complete schedel verdween tijdens de Tweede Wereldoorlog; afgietsels zijn bewaard."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "بازگشت به آفریقا و تفاوت «ارگستر» و «ارکتوس»: در دهه‌های ۱۹۶۰ و ۱۹۷۰ خانوادهٔ لیکی همین نوع فسیل‌ها را در آفریقا یافتند و تاریخ‌گذاریِ آرگون نشان داد نمونه‌های آفریقایی (حدود ۱٫۹ تا بیش از ۲ میلیون سال) از نمونه‌های اندونزی (حدود ۱٫۶ میلیون سال) و چین (حدود ۸۰۰ هزار سال) کهن‌ترند. چون ریختِ نمونه‌های آفریقایی با آسیایی‌ها کمی فرق داشت و نام «ارکتوس» پیش‌تر به نمونهٔ جاوه داده شده بود، بسیاری نمونه‌های آفریقایی را «هومو ارگستر» (انسان کارگر) می‌نامند؛ هر دو نام در برنامه به‌جای هم به کار می‌روند. شمار نمونه‌ها کم نیست: به گفتهٔ گوینده بیش از ۱۱ نمونه از اندونزی، بیش از ۱۰ از چین، نمونه‌هایی از هند، ۵ از گرجستان و بیش از ۲۰ از آفریقا.", "en": "Back to Africa, and 'ergaster' vs 'erectus': in the 1960s–70s the Leakey family found the same kind of fossils in Africa, and argon dating showed the African specimens (~1.9 to over 2 Mya) were older than the Indonesian (~1.6 Mya) and Chinese (~800 ka) ones. Because the African forms differ somewhat and 'erectus' already belonged to the Java find, many call the African ones Homo ergaster ('working man'); the programme uses both names. The sample is sizeable: over 11 specimens from Indonesia, over 10 from China, some from India, 5 from Georgia and over 20 from Africa.", "nl": "Terug naar Afrika: in de jaren 1960–70 vond de familie Leakey dezelfde soort fossielen in Afrika, ouder (~1,9 tot meer dan 2 miljoen jaar) dan die uit Indonesië (~1,6 miljoen) en China (~800.000). Omdat de Afrikaanse vormen iets verschillen, heten ze vaak Homo ergaster; het programma gebruikt beide namen."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "دمانیسی: در محوطه‌ای نزدیک تفلیس، هنگام کاوش یک کلیسای سده‌های میانه، به‌طور تصادفی جمجمه‌ای پیدا شد که نه به انسان خردمند شبیه بود و نه دقیقاً به راست‌قامت، با حجم مغزِ کمتر (حدود ۷۰۰ تا ۸۰۰ سی‌سی). کاوش‌های بعدی بقایای پنج نفر را با قدمت حدود ۱٫۷۷ میلیون سال آشکار کرد. پرسش این است که انسانی سازگار با گرما و دشت‌های آفریقا چگونه به کوهستان‌های سرد قفقاز رسیده است. نمونه‌هایی هم از جنوب اروپا (ایتالیا) با قدمت حدود ۱٫۴ میلیون سال گزارش شده است.", "en": "Dmanisi: at a site near Tbilisi, while a medieval church was being excavated, a skull turned up by chance that resembled neither Homo sapiens nor exactly erectus, with a smaller brain (~700–800 cc). Later work revealed five individuals dated to about 1.77 Mya. How did a human adapted to the heat of the African plains reach the cold Caucasus highlands? Finds from southern Europe (Italy) of about 1.4 Mya are also reported.", "nl": "Dmanisi: bij Tbilisi werd tijdens opgravingen van een middeleeuwse kerk toevallig een schedel gevonden met een kleiner brein (~700–800 cc). Later bleken er vijf individuen te liggen van circa 1,77 miljoen jaar oud. Hoe bereikte een aan Afrikaanse hitte aangepaste mens de koude Kaukasus? Ook uit Italië zijn vondsten van ~1,4 miljoen jaar gemeld."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "گسترش بی‌نقشه: برنامه هشدار می‌دهد که نباید ذهن امروزی‌مان را که نقشهٔ کرهٔ زمین را می‌شناسد به انسان راست‌قامت نسبت دهیم. او در تمام عمرش در شعاعی حدود ۴۰ تا ۵۰ کیلومتری می‌زیست، شکار و لاشه‌خواری و گردآوری می‌کرد و هیچ تصوری از «اندونزی» یا قاره‌ها نداشت. دو سازوکار گسترش را توضیح می‌دهد: (۱) وقتی جمعیت بزرگ‌تر می‌شود، هر قلمرو فقط شمار معینی را سیر می‌کند و گروه‌ها کمی به این سو و آن سو می‌روند؛ همین «کمی» در هر نسل چند کیلومتر فاصله می‌سازد. (۲) وقتی جانوران شکاری به دلیل تغییر اقلیم منطقه را ترک می‌کنند، انسان‌ها هم به دنبالشان می‌روند. محاسبه‌ای که نقل می‌شود: اگر در هر نسل حدود ۱۰ کیلومتر جابه‌جایی رخ دهد، رسیدن از آفریقای شرقی به اندونزی در حدود ۱۵ هزار سال ممکن است — در برابر یک یا دو میلیون سال، زمان کوتاهی است. (در اپیزودی دیگر همین محاسبه با ۵ کیلومتر در هر نسل و حدود ۱۰ هزار سال، و با برتریِ مسیر ساحلی که به رودهای بزرگی چون کارون، گنگ و یانگ‌تسه برنمی‌خورد، تکرار می‌شود.)", "en": "Spread without a plan: we must not project our map-knowing minds onto Homo erectus, who lived his whole life within a radius of perhaps 40–50 km and had no notion of 'Indonesia'. Two mechanisms explain the spread: (1) as populations grow, each territory supports only so many people, so groups shift a little — and a little per generation adds up; (2) when prey animals leave a region because of climate change, people follow. A calculation cited: at about 10 km per generation, East Africa to Indonesia takes roughly 15,000 years — short compared with one or two million years. (Another episode repeats it with 5 km per generation and ~10,000 years, favouring a coastal route that avoids great rivers such as the Karun, Ganges and Yangtze.)", "nl": "Verspreiding zonder plan: we moeten ons kaartbewustzijn niet op Homo erectus projecteren, die zijn hele leven binnen zo'n 40–50 km leefde. Twee mechanismen: (1) groeiende populaties schuiven telkens een beetje op; (2) mensen volgen prooidieren die door klimaatverandering wegtrekken. Bij ~10 km per generatie duurt de tocht van Oost-Afrika naar Indonesië zo'n 15.000 jaar — kort vergeleken met miljoenen jaren."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "مسیرها و رفت‌وبرگشت‌ها: سطح دریا بارها بالا و پایین رفته است؛ به گفتهٔ برنامه در دوره‌هایی تنگهٔ باب‌المندب و تنگهٔ هرمز و حتی خلیج فارس به شکل امروزی وجود نداشت و از جنوب شبه‌جزیرهٔ عربستان هم می‌شد گذشت، و بسیاری از جزایر جنوب‌شرق آسیا به خشکی پیوسته بودند. گسترش هم یک‌طرفه نبود: موج‌هایی بیرون رفتند، موج‌هایی بازگشتند و دوباره بیرون رفتند — «مثل موج دریا» — و نمی‌توان شمرد چند بار این رخ داد. به همین دلیل، به جای یک خط، با یک «درخت شبکه‌ای» سروکار داریم.", "en": "Routes and back-and-forth: sea levels rose and fell repeatedly; in some periods, the programme says, the Bab-el-Mandeb and Hormuz straits and even the Persian Gulf did not exist in their present form, so southern Arabia was also a route, and many Southeast Asian islands were joined to the mainland. Movement was not one-way: waves went out, came back and went out again, 'like sea waves', countless times — a network, not a line.", "nl": "Routes en heen-en-weer: de zeespiegel steeg en daalde herhaaldelijk; in sommige perioden bestonden de Bab-el-Mandeb, de Straat van Hormuz en zelfs de Perzische Golf niet in hun huidige vorm, en waren veel Zuidoost-Aziatische eilanden met het vasteland verbonden. Beweging was niet eenrichtingsverkeer: een netwerk, geen lijn."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "ایران در این داستان: تاکنون هیچ فسیلی از انسان راست‌قامت در خود ایران پیدا نشده، اما پیرامون ایران (مانند دمانیسی) پیدا شده است. در عوض تبردستی‌های آشولی در نقاط گوناگون ایران یافت شده‌اند: زاگرس، گنج‌پر در گیلان، حاشیهٔ شمالی خلیج فارس، و به گفتهٔ گوینده به‌تازگی در بررسی یکی از دانشجویان دکتری‌اش در کوهپایه‌های جیرفتِ کرمان. نتیجه‌ای که برنامه می‌گیرد: سراسر فلات ایران زیستگاه انسان راست‌قامت بوده و سابقهٔ حضور انسان در ایران به حدود دو میلیون سال پیش می‌رسد، چون رسیدن به جنوب‌شرق آسیا بدون گذر از این منطقه ممکن نبود.", "en": "Iran in the story: no Homo erectus fossil has yet been found inside Iran, though some have been found around it (e.g. Dmanisi). Acheulean hand-axes, however, come from many parts of Iran: the Zagros, Ganj Par in Gilan, the northern Persian Gulf shore and — the speaker reports — a recent survey by one of his doctoral students in the foothills of Jiroft, Kerman. The programme concludes that the whole plateau was erectus territory and human presence in Iran goes back about two million years, since reaching Southeast Asia meant passing through it.", "nl": "Iran in het verhaal: in Iran zelf is nog geen erectus-fossiel gevonden, maar wel Acheuleaanse vuistbijlen: in het Zagrosgebergte, Ganj Par in Gilan, de noordelijke Golfkust en recent in de uitlopers van Jiroft (Kerman). Het programma concludeert dat menselijke aanwezigheid in Iran zo'n twee miljoen jaar teruggaat."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "نقد: (۱) ادعای «دو میلیون سال حضور انسان در ایران» بر ابزارهای سنگی تکیه دارد که بیشترشان در بررسی‌های سطحی پیدا شده‌اند و تاریخ‌گذاریِ مستقیمِ کمی دارند؛ قدیمی‌ترین شواهدِ تاریخ‌دار در ایران (مثلاً کشف‌رود در خراسان یا گنج‌پر) معمولاً جوان‌تر برآورد می‌شوند و این ادعا بیشتر استنتاجی جغرافیایی است تا یافته‌ای اثبات‌شده. (۲) ارقام سن‌ها (جاوه، چین، اروپا) در رونوشت تقریبی‌اند و در ادبیات علمی بازه‌های گوناگونی دارند؛ برای نمونه برخی نمونه‌های جاوه را تا ۱٫۸ میلیون سال و برخی جوان‌تر می‌دانند. (۳) اینکه آیا ارگستر و ارکتوس دو گونه‌اند یا یک گونهٔ پراکنده، هنوز بحث‌برانگیز است و جمجمه‌های دمانیسی را برخی دلیل بر «یک گونهٔ بسیار متغیر» می‌دانند.", "en": "Critique: (1) the 'two million years in Iran' claim rests on stone tools mostly from surface surveys with little direct dating; the oldest dated evidence in Iran (e.g. Kashafrud or Ganj Par) is usually estimated as younger, so this is more a geographical inference than an established finding. (2) The ages quoted (Java, China, Europe) are approximate in the transcript and vary in the literature — some Java specimens are argued to be up to ~1.8 Mya, others younger. (3) Whether ergaster and erectus are two species or one widespread species remains debated; some read the Dmanisi skulls as evidence for one highly variable species.", "nl": "Kritiek: (1) de claim van 'twee miljoen jaar in Iran' steunt vooral op ongedateerde oppervlaktevondsten; de oudste gedateerde Iraanse vindplaatsen worden meestal jonger geschat. (2) De genoemde ouderdommen zijn bij benadering en variëren in de literatuur. (3) Of ergaster en erectus één of twee soorten zijn, blijft omstreden."}, "sources": ["src:60e7838a5a"], "flags": ["editor-note", "contested"]}, {"text": {"fa": "یادداشت خوانش: بر پایهٔ رونوشت خودکارِ اپیزود سومِ نسخهٔ رادیویی «خداحافظ آفریقا» (به‌طور کامل) و بخشی از اپیزود چهارم (محاسبهٔ گسترش ساحلی). بخش پایانی همان اپیزود سوم دربارهٔ «خودخواهی و هم‌رسانی» در مدخل جداگانه آمده و بحث «خط موویوس» در مدخل سوگیری نژادی. چند داوری کلیشه‌ای گوینده دربارهٔ عادت‌های خوراکیِ یک ملت و یک ادعای حاشیه‌ای سیاسی-تاریخی دربارهٔ مرزها در این مدخل نیامده است.", "en": "Reading note: based on the automatic transcript of episode 3 of the radio version (in full) and part of episode 4 (the coastal-spread calculation). The closing part of episode 3 on selfishness and sharing is in a separate entry, and the Movius Line in the entry on racial bias. Some stereotyping remarks about one nation's eating habits and a marginal political-historical remark about borders are not reproduced.", "nl": "Leesnotitie: gebaseerd op het automatische transcript van aflevering 3 (volledig) en een deel van aflevering 4. Het slot over egoïsme en delen staat in een apart lemma, de Movius-lijn in het lemma over raciale vooringenomenheid. Stereotyperende opmerkingen zijn niet overgenomen."}, "sources": ["src:60e7838a5a"], "flags": ["editor-note"]}], "links": [{"to": "tabar:homo-erectus-endurance-and-handaxe", "rel": "part-of", "note": {"fa": "همین انسان پیش از خروج", "en": "the same human before leaving Africa", "nl": "dezelfde mens vóór de uittocht"}}, {"to": "tabar:out-of-africa", "rel": "contrasts", "note": {"fa": "خروجِ بسیار دیرترِ انسان خردمند از آفریقا", "en": "the much later exit of Homo sapiens", "nl": "de veel latere uittocht van Homo sapiens"}}, {"to": "tabar:persian-plateau-hub", "rel": "see-also", "note": {"fa": "فلات ایران به‌عنوان گذرگاه", "en": "the Iranian plateau as a corridor", "nl": "het Iraanse plateau als doorgang"}}, {"to": "tabar:quaternary-climate-frameworks-dating", "rel": "see-also", "note": {"fa": "روش‌های تاریخ‌گذاری و چارچوب‌های اقلیمی", "en": "dating methods and climate frameworks", "nl": "dateringsmethoden en klimaatkaders"}}, {"to": "tabar:racial-bias-in-paleoanthropology", "rel": "see-also", "note": {"fa": "خط موویوس و تفسیر نژادپرستانهٔ نبودِ تبردستی", "en": "the Movius Line and its racist reading", "nl": "de Movius-lijn en haar racistische lezing"}}, {"to": "tabar:human-family-tree-branching", "rel": "see-also", "note": {"fa": "درخت شبکه‌ای به جای خط", "en": "a branching network, not a line", "nl": "een vertakt netwerk, geen lijn"}}], "sources": ["src:60e7838a5a"], "people": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:ancestry-tests", "kind": "concept", "title": {"fa": "آزمون‌های تجاری تبار", "en": "Commercial ancestry tests", "nl": "Commerciële afstammingstests"}, "aliases": [], "parent": "tabar:genealogy", "field": "tabar:genealogy", "summary": {"fa": "«۴۲ درصد ایرانی، ۱۸ درصد قفقازی…» این درصدها مقایسهٔ دی‌ان‌ای شما با پنل مرجعِ شرکت است، نه واقعیتی ثابت؛ با تغییر پنل، عدد عوض می‌شود. برای یافتن خویشاوند زنده دقیق‌اند، برای «هویت» گمراه‌کننده.", "en": "\"42 percent Iranian, 18 percent Caucasian…\" These percentages compare your DNA to the company's reference panel, not a fixed reality; change the panel and the number changes. Accurate for finding living relatives, misleading for \"identity\".", "nl": "\"42 procent Iraans, 18 procent Kaukasisch…\" Deze percentages vergelijken uw DNA met het referentiepanel van het bedrijf, geen vaststaande werkelijkheid; verander het panel en het getal verandert. Nauwkeurig om levende verwanten te vinden, misleidend voor \"identiteit\"."}, "points": [{"text": {"fa": "رویال و همکاران (۲۰۱۰، انجمن ژنتیک انسانی آمریکا): استنباط تبار به پنل مرجع، الگوریتم و تعریف «جمعیت» وابسته است؛ درصدها را نباید با هویت قومی یا سلامت یکی گرفت.", "en": "Royal et al. (2010, American Society of Human Genetics): ancestry inference depends on the reference panel, the algorithm and the definition of \"population\"; percentages must not be equated with ethnic identity or health.", "nl": "Royal et al. (2010, American Society of Human Genetics): ancestry inference depends on the reference panel, the algorithm and the definition of \"population\"; percentages must not be equated with ethnic identity or health."}, "sources": ["src:9e55a626fc"], "flags": []}, {"text": {"fa": "ارلیش و همکاران (۲۰۱۸): با پایگاه‌دادهٔ ۱٫۲۸ میلیون نفر، حدود ۶۰ درصد آمریکاییانِ اروپایی‌تبار از راه خویشاوند دور (پسرعموی درجهٔ سه) قابل شناسایی‌اند، حتی اگر خودشان آزمایش نداده باشند؛ همین روش قاتل زنجیره‌ای «گلدن استیت» را در ۲۰۱۸ لو داد.", "en": "Erlich et al. (2018): with a database of 1.28 million people, about 60 percent of European-ancestry Americans can be identified via a distant relative (third cousin) even if they never tested; the same method exposed the \"Golden State Killer\" in 2018.", "nl": "Erlich et al. (2018): with a database of 1.28 million people, about 60 percent of European-ancestry Americans can be identified via a distant relative (third cousin) even if they never tested; the same method exposed the \"Golden State Killer\" in 2018."}, "sources": ["src:b4623b437c"], "flags": []}, {"text": {"fa": "برای ایرانیان: پنل‌های مرجع شرکت‌ها از خاورمیانه نمونهٔ کمی دارند، پس برچسب‌ها («ایرانی/قفقازی/عرب») درشت و ناپایدارند.", "en": "For Iranians: companies' reference panels have few Middle Eastern samples, so the labels (\"Iranian/Caucasian/Arab\") are coarse and unstable.", "nl": "For Iranians: companies' reference panels have few Middle Eastern samples, so the labels (\"Iranian/Caucasian/Arab\") are coarse and unstable."}, "sources": ["src:3c4d0940c4"], "flags": ["editor-note"]}], "links": [{"to": "tabar:haplogroups", "rel": "part-of", "note": {"fa": "خطوط مادری و پدری در گزارش", "en": "Maternal and paternal lines in the report", "nl": "Maternal and paternal lines in the report"}}, {"to": "tabar:common-ancestors", "rel": "prerequisite", "note": {"fa": "ریاضی نیاکان", "en": "The mathematics of ancestors", "nl": "The mathematics of ancestors"}}, {"to": "tabar:race-biology", "rel": "see-also", "note": {"fa": "خوشه در برابر نژاد", "en": "Cluster versus race", "nl": "Cluster versus race"}}], "people": ["core:yaniv-erlich"], "sources": ["src:3c4d0940c4", "src:9e55a626fc", "src:b4623b437c"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:consanguinity", "kind": "concept", "title": {"fa": "ازدواج خویشاوندی", "en": "Consanguineous marriage", "nl": "Verwantschapshuwelijk"}, "aliases": [], "parent": "tabar:medical-genetics", "field": "tabar:medical-genetics", "summary": {"fa": "ازدواج با خویشاوند نزدیک در ایران و بسیاری از کشورهای خاورمیانه و جنوب آسیا رایج است. احتمال بیماری مغلوب در فرزندان دخترعمو/پسرعمو از حدود ۲ تا ۳ درصد به ۴ تا ۶ درصد می‌رسد؛ کم نیست، ولی «فاجعه» هم نیست، و با مشاورهٔ ژنتیک قابل مدیریت است.", "en": "Marriage to a close relative is common in Iran and many countries of the Middle East and South Asia. The chance of a recessive disorder in children of first cousins rises from about 2 to 3 percent to 4 to 6 percent; not trivial, not a \"catastrophe\", and manageable with genetic counselling.", "nl": "Trouwen met een naaste verwant is gangbaar in Iran en veel landen in het Midden-Oosten en Zuid-Azië. De kans op een recessieve aandoening bij kinderen van volle neven en nichten stijgt van zo'n 2 à 3 procent naar 4 à 6 procent; niet te verwaarlozen, geen \"ramp\", en beheersbaar met genetische counseling."}, "points": [{"text": {"fa": "سعادت و همکاران (۲۰۰۴): در نمونهٔ ملی بیش از ۳۰۰ هزار زوج ایرانی، ۳۸٫۶ درصد ازدواج‌ها خویشاوندی و ۲۷٫۹ درصد بین دخترعمو/پسرعمو و معادل‌ها بود؛ با تفاوت زیاد بین استان‌ها.", "en": "Saadat et al. (2004): in a national sample of over 300 thousand Iranian couples, 38.6 percent of marriages were consanguineous and 27.9 percent between first cousins or equivalents, with large provincial differences.", "nl": "Saadat et al. (2004): in a national sample of over 300 thousand Iranian couples, 38.6 percent of marriages were consanguineous and 27.9 percent between first cousins or equivalents, with large provincial differences."}, "sources": ["src:38e3f2042a"], "flags": []}, {"text": {"fa": "سازوکار: هر فرد چند واریانت مغلوب بیماری‌زا حمل می‌کند؛ خویشاوندان احتمال بیشتری دارند همان واریانت را از نیای مشترک داشته باشند. برای همین سهم بیماری‌های مغلوب نادر در جمعیت‌های با ازدواج خویشاوندی بالاست.", "en": "Mechanism: everyone carries a few recessive disease variants; relatives are likelier to share the same variant from a common ancestor. That is why rare recessive disorders are over-represented in populations with high consanguinity.", "nl": "Mechanism: everyone carries a few recessive disease variants; relatives are likelier to share the same variant from a common ancestor. That is why rare recessive disorders are over-represented in populations with high consanguinity."}, "sources": ["src:38e3f2042a", "src:3c4d0940c4"], "flags": []}, {"text": {"fa": "نگاه متوازن: ازدواج خویشاوندی کارکردهای اجتماعی و اقتصادی دارد و در ایران رو به کاهش است؛ پاسخ علمی نه تحقیر، که غربالگری ناقلان و مشاورهٔ پیش از ازدواج است.", "en": "A balanced view: consanguinity has social and economic functions and is declining in Iran; the scientific answer is not stigma but carrier screening and premarital counselling.", "nl": "A balanced view: consanguinity has social and economic functions and is declining in Iran; the scientific answer is not stigma but carrier screening and premarital counselling."}, "sources": ["src:0aa129f24c"], "flags": ["editor-note"]}], "links": [{"to": "tabar:thalassemia-screening", "rel": "applies-to", "note": {"fa": "نمونهٔ موفق غربالگری در ایران", "en": "A successful screening example in Iran", "nl": "A successful screening example in Iran"}}, {"to": "tabar:iranian-genetic-diversity", "rel": "see-also", "note": {"fa": "واریانت‌های بومی و پایگاه مرجع", "en": "Local variants and a reference database", "nl": "Local variants and a reference database"}}], "people": [], "sources": ["src:0aa129f24c", "src:38e3f2042a", "src:3c4d0940c4"], "booklets": [], "origin": null, "iran": "iran:consanguinity", "wikidata": null, "status": "draft"}, {"id": "tabar:t1-africa-deep-lineages-bottleneck", "kind": "concept", "title": {"fa": "ریشه‌های آفریقایی تبارنامهٔ انسان: شاخه‌های کهن و تنگنای خروج", "en": "African roots of the human family tree: deep lineages and the exit bottleneck", "nl": "Afrikaanse wortels van de menselijke stamboom: diepe lijnen en de flessenhals"}, "aliases": [], "parent": "tabar:population-genetics", "field": "tabar:population-genetics", "summary": {"fa": "بر پایهٔ هاپلوگروه‌ها، کهن‌ترین شاخه‌های هر دو تبار پدری و مادری در آفریقا یافت می‌شوند و جمعیت بیرون‌آمده از آفریقا از تنگنایی کوچک گذشته است.", "en": "On haplogroup evidence the oldest branches of both paternal and maternal ancestry sit in Africa, and the population that left passed through a small bottleneck.", "nl": "Volgens haplogroepen liggen de oudste takken in Afrika en passeerde de uittocht een kleine flessenhals."}, "points": [{"text": {"fa": "نویسنده می‌گوید در آفریقا بودنِ زادگاه انسان خردمند تردیدی ندارد. دو شاخهٔ کهن کروموزوم Y یعنی A و BT در آفریقا بیشترین تنوع را دارند و همهٔ مردان بیرون از آفریقا از شاخهٔ BT برآمده‌اند.", "en": "The author states that Africa as the homeland of Homo sapiens is beyond doubt. The two oldest Y branches, A and BT, show the greatest diversity in Africa, and all men outside Africa descend from BT.", "nl": "The author states that Africa as the homeland of Homo sapiens is beyond doubt. The two oldest Y branches, A and BT, show the greatest diversity in Africa, and all men outside Africa descend from BT."}, "sources": ["src:93456bf0b8"], "flags": []}, {"text": {"fa": "هاپلوگروه A00 در ۲۰۱۳ از یک مرد آفریقایی‌تبار آمریکایی کشف شد و بسامد بالایی از آن در مردان قوم بانگوا در کامرون یافت می‌شود. به گفتهٔ نویسنده، این شاخه فراتر از قدمت فسیل‌های شناخته‌شدهٔ انسان خردمند باستانی به عقب می‌رود.", "en": "Haplogroup A00 was discovered in 2013 in an African American man and occurs at high frequency in the Bangwa of Cameroon. The author says its age reaches back beyond the known fossils of early Homo sapiens.", "nl": "Haplogroup A00 was discovered in 2013 in an African American man and occurs at high frequency in the Bangwa of Cameroon. The author says its age reaches back beyond the known fossils of early Homo sapiens."}, "sources": ["src:93456bf0b8", "src:17bec11581"], "flags": []}, {"text": {"fa": "به نقل از پژوهشی در ۲۰۱۵، نیای مشترک مردانهٔ همهٔ انسان‌های امروز («آدم کروموزوم Y») حدود ۲۵۴ هزار سال پیش زیسته است.", "en": "Citing a 2015 study, the common male ancestor of all living men ('Y-chromosomal Adam') lived about 254,000 years ago.", "nl": "Citing a 2015 study, the common male ancestor of all living men ('Y-chromosomal Adam') lived about 254,000 years ago."}, "sources": ["src:93456bf0b8"], "flags": []}, {"text": {"fa": "پیش از خروج از آفریقا دست‌کم چهارده شاخهٔ متمایز میتوکندریایی در این قاره وجود داشته است؛ کوچندگان بیرون از آفریقا فقط بخش کوچکی از این تنوع را با خود بردند و نویسنده شمار بنیانگذاران را در حد حدود هزار و پانصد زن و مرد بالغ می‌داند.", "en": "Before the exit at least fourteen distinct mitochondrial lineages existed in Africa; those who left carried only a small part of this diversity, and the author puts the founder group at about 1,500 adult men and women.", "nl": "Before the exit at least fourteen distinct mitochondrial lineages existed in Africa; those who left carried only a small part of this diversity, and the author puts the founder group at about 1,500 adult men and women."}, "sources": ["src:93456bf0b8"], "flags": []}, {"text": {"fa": "رقم‌های اندازهٔ جمعیت بنیانگذار به مدل و فرضیات بستگی دارند و برآوردهای دیگری هم هست؛ زمان خروج در نوشته‌های جدیدتر هم دقیق‌تر شده و هم محل بحث است. این اعداد را تقریبی بخوانید.", "en": "Founder-size figures depend on models and assumptions and other estimates exist; exit timing has also been refined and remains debated in newer literature. Read these numbers as approximate.", "nl": "Founder-size figures depend on models and assumptions and other estimates exist; exit timing has also been refined and remains debated in newer literature. Read these numbers as approximate."}, "sources": [], "flags": ["contested", "editor-note"]}, {"text": {"fa": "نویسنده کوچ‌های برگشتی را هم یادآور می‌شود: برخی شاخه‌های اوراسیایی به آفریقا بازگشته‌اند و گسترش بانتوها از حدود پنج هزار سال پیش بر ترکیب جمعیتی جنوب و شرق قاره اثر گذاشته است. پس تصویر آفریقا «جدا از جهان» نیست.", "en": "The author also notes back-migrations: some Eurasian lineages returned to Africa, and the Bantu expansion from about 5,000 years ago reshaped southern and eastern Africa. Africa was not isolated from the rest of the world.", "nl": "The author also notes back-migrations: some Eurasian lineages returned to Africa, and the Bantu expansion from about 5,000 years ago reshaped southern and eastern Africa. Africa was not isolated from the rest of the world."}, "sources": ["src:93456bf0b8"], "flags": []}], "links": [{"to": "tabar:out-of-africa", "rel": "explains", "note": {"fa": "شواهد هاپلوگروهی خاستگاه آفریقایی", "en": "Haplogroup evidence for the African origin", "nl": "Haplogroup evidence for the African origin"}}, {"to": "tabar:human-evolution", "rel": "part-of", "note": {"fa": "تکامل انسان", "en": "Human evolution", "nl": "Human evolution"}}, {"to": "tabar:haplogroups", "rel": "see-also", "note": {"fa": "هاپلوگروه‌ها", "en": "Haplogroups", "nl": "Haplogroups"}}], "people": [], "sources": ["src:17bec11581", "src:93456bf0b8"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:heritability", "kind": "concept", "title": {"fa": "وراثت‌پذیری", "en": "Heritability", "nl": "Erfelijkheid"}, "aliases": ["heritability", "وراثت پذیری"], "parent": "tabar:behavior-genetics", "field": "tabar:behavior-genetics", "summary": {"fa": "وراثت‌پذیری نسبتی از تفاوت‌های یک صفت در یک جمعیت است که به تفاوت‌های ژنتیکی برمی‌گردد؛ دربارهٔ یک فرد، یا دربارهٔ تغییرپذیری، هیچ نمی‌گوید.", "en": "Heritability is the share of differences in a trait within a population that traces to genetic differences; it says nothing about an individual, nor about changeability.", "nl": "Erfelijkheid is het aandeel van de verschillen in een eigenschap binnen een populatie dat teruggaat op genetische verschillen; het zegt niets over een individu, noch over veranderbaarheid."}, "points": [{"text": {"fa": "فراتحلیل ۵۰ سال مطالعهٔ دوقلوها (۱۴٬۵۵۸٬۹۰۳ جفت دوقلو، ۱۷٬۸۰۴ صفت): همهٔ صفات انسانی وراثت‌پذیرند؛ میانگین ۴۹ درصد.", "en": "Meta-analysis of 50 years of twin studies (14,558,903 twin pairs, 17,804 traits): all human traits are heritable; the average is 49 percent.", "nl": "Meta-analysis of 50 years of twin studies (14,558,903 twin pairs, 17,804 traits): all human traits are heritable; the average is 49 percent."}, "sources": ["src:06c7402bec"], "flags": []}, {"text": {"fa": "وراثت‌پذیری ۵۰ درصد یعنی نیمی از تفاوت‌های بین افراد در آن جمعیت و آن محیط ژنتیکی است، نه اینکه نیمی از صفتِ یک نفر ژنتیکی است.", "en": "Heritability of 50 percent means half the differences between people in that population and environment are genetic, not that half of one person's trait is genetic.", "nl": "Heritability of 50 percent means half the differences between people in that population and environment are genetic, not that half of one person's trait is genetic."}, "sources": ["src:ba8f3ee8f4"], "flags": []}, {"text": {"fa": "مثال کلاسیک: قد بسیار وراثت‌پذیر است و با این حال میانگین قد در یک قرن ده‌ها سانتی‌متر بالا رفته؛ وراثت‌پذیری بالا با تغییر محیطی بزرگ سازگار است.", "en": "Classic example: height is highly heritable, yet average height rose by many centimetres in a century; high heritability is compatible with large environmental change.", "nl": "Classic example: height is highly heritable, yet average height rose by many centimetres in a century; high heritability is compatible with large environmental change."}, "sources": ["src:1deae47297"], "flags": []}, {"text": {"fa": "«قانون اول» ترکهایمر: همهٔ صفات رفتاری انسان وراثت‌پذیرند. قانون دوم: اثر بزرگ شدن در یک خانواده کوچک‌تر از اثر ژن‌هاست. قانون سوم: بخش بزرگی از واریانس را نه ژن توضیح می‌دهد نه خانواده.", "en": "Turkheimer's first law: all human behavioural traits are heritable. Second: the effect of being raised in the same family is smaller than the effect of genes. Third: a large share of variance is explained by neither genes nor families.", "nl": "Turkheimer's first law: all human behavioural traits are heritable. Second: the effect of being raised in the same family is smaller than the effect of genes. Third: a large share of variance is explained by neither genes nor families."}, "sources": ["src:ba8f3ee8f4"], "flags": []}], "links": [{"to": "tabar:twin-adoption", "rel": "measured-by", "note": {"fa": "با مطالعهٔ دوقلوها و فرزندخواندگی برآورد می‌شود", "en": "Estimated with twin and adoption studies", "nl": "Estimated with twin and adoption studies"}}, {"to": "tabar:gene-environment", "rel": "explains", "note": {"fa": "چرا عدد وراثت‌پذیری در محیط‌های مختلف فرق می‌کند", "en": "Why the heritability figure differs across environments", "nl": "Why the heritability figure differs across environments"}}, {"to": "tabar:genetic-essentialism", "rel": "critiques", "note": {"fa": "سوءبرداشت رایج: «ژنتیکی یعنی سرنوشت»", "en": "Common misreading: \"genetic means destiny\"", "nl": "Common misreading: \"genetic means destiny\""}}], "people": ["core:robert-plomin", "core:eric-turkheimer"], "sources": ["src:06c7402bec", "src:1deae47297", "src:ba8f3ee8f4"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:darwin-difficulties-fossil-record", "kind": "concept", "title": {"fa": "دشواری‌های نظریه و ناکامل بودن سابقهٔ فسیلی", "en": "Difficulties of the theory and the imperfect fossil record", "nl": "Moeilijkheden van de theorie en het onvolledige fossielenarchief"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "داروین پیش از منتقدان، خودش بزرگ‌ترین اعتراض‌ها را فهرست می‌کند: میانه‌شکل‌های گم‌شده، پیدایش اندام‌های کامل مثل چشم، و غریزه‌های پیچیده. پاسخ او این است که سابقهٔ زمین‌شناختی بسیار ناکامل است. بخشی از این استدلال با یافته‌های بعدی تأیید شد، اما برخی برآوردهایش دربارهٔ زمان نادرست بود.", "en": "Darwin lists the biggest objections himself: missing intermediates, the origin of perfect organs such as the eye, and complex instincts. His answer is that the geological record is very incomplete. Later finds supported part of this, but some of his time estimates were wrong.", "nl": "Darwin noemt zelf de grootste bezwaren: ontbrekende tussenvormen, de oorsprong van volmaakte organen zoals het oog, en complexe instincten. Zijn antwoord: het geologische archief is zeer onvolledig. Latere vondsten steunden dit deels."}, "points": [{"text": {"fa": "اگر گونه‌ها آرام دگرگون شده‌اند، باید بی‌شمار شکل‌های میانی ببینیم. داروین می‌گوید نیافتن آنها طبیعی است: فسیل شدن نادر است، رسوب‌ها ناپیوسته‌اند و بیشتر دورهٔ زندگی هر گونه ثبت نشده. او همچنین یادآوری می‌کند که میانه‌شکل‌ها «مستقیماً بین دو گونهٔ امروزی» نیستند، بلکه بین هر یک و نیای مشترک‌شان‌اند.", "en": "If species change gradually we should find countless intermediates. Darwin says their absence is expected: fossilisation is rare, deposition is discontinuous, and most of each species's history went unrecorded. He adds that intermediates lie not directly between two living species but between each and their common ancestor.", "nl": "If species change gradually we should find countless intermediates. Darwin says their absence is expected: fossilisation is rare, deposition is discontinuous, and most of each species's history went unrecorded. He adds that intermediates lie not directly between two living species but between each and their common ancestor."}, "sources": ["src:84786f7bfa"], "flags": []}, {"text": {"fa": "برای چشم، داروین می‌گوید اگر سلسله‌ای از چشم‌های ساده تا پیچیده در جانداران زنده دیده شود و هر مرحله کمی سودمند باشد، پیدایش چشم با انتخاب ممکن است. تأیید: نیلسون و پلگر (۱۹۹۴) با مدل ریاضی برآورد کردند چشم از یک نقطهٔ حساس به نور تا چشم عدسی‌دار در حدود چند صدهزار نسل ممکن است.", "en": "For the eye, Darwin argues that if a series from simple to complex eyes exists among living animals and each step is slightly useful, selection can build an eye. Support: Nilsson and Pelger (1994) modelled a light-sensitive patch becoming a lens eye in a geologically very short time.", "nl": "For the eye, Darwin argues that if a series from simple to complex eyes exists among living animals and each step is slightly useful, selection can build an eye. Support: Nilsson and Pelger (1994) modelled a light-sensitive patch becoming a lens eye in a geologically very short time."}, "sources": ["src:84786f7bfa", "src:c220e1653f"], "flags": []}, {"text": {"fa": "از زمان داروین فسیل‌های میانی بسیاری یافت شده است: «آرکئوپتریکس» (۱۸۶۱، پس از چاپ نخست) میان خزندگان و پرندگان، فسیل‌های نهنگ‌های پایه‌ای با پا، و «تیکتالیک» (۲۰۰۶) میان ماهی و چهارپا. بنابراین یکی از دشوارترین اعتراض‌های ۱۸۵۹ امروز بسیار ضعیف‌تر است.", "en": "Since Darwin many transitional fossils have turned up: Archaeopteryx (1861, after the first edition) between reptiles and birds, early whales with legs, and Tiktaalik (2006) between fish and tetrapods. One of the hardest objections of 1859 is therefore much weaker today.", "nl": "Since Darwin many transitional fossils have turned up: Archaeopteryx (1861, after the first edition) between reptiles and birds, early whales with legs, and Tiktaalik (2006) between fish and tetrapods. One of the hardest objections of 1859 is therefore much weaker today."}, "sources": ["src:2a0ed82834"], "flags": []}, {"text": {"fa": "آنچه نادرست یا ناقص بود: داروین در چاپ نخست برای فرسایش ناحیهٔ ویلد در انگلستان حدود ۳۰۰ میلیون سال حساب کرد (بعداً حذف شد) و با برآوردهای فیزیکدانان از عمر زمین درگیر شد؛ عمر واقعی زمین حدود ۴٫۵ میلیارد سال است. همچنین «تعادل نقطه‌ای» (الدرج و گولد، ۱۹۷۲) نشان داد بسیاری از گونه‌ها مدت طولانی بدون تغییر می‌مانند و تغییر عمدتاً در بازه‌های کوتاه رخ می‌دهد؛ این بحث هنوز دربارهٔ شدت آن ادامه دارد.", "en": "What was wrong or incomplete: in the first edition Darwin calculated about 300 million years for the erosion of the Weald in England (later dropped) and struggled with physicists' estimates of the earth's age; the real age is about 4.5 billion years. Also, 'punctuated equilibrium' (Eldredge and Gould, 1972) argued that many species stay unchanged for long periods with change concentrated in short bursts; how strong this effect is remains debated.", "nl": "What was wrong or incomplete: in the first edition Darwin calculated about 300 million years for the erosion of the Weald in England (later dropped) and struggled with physicists' estimates of the earth's age; the real age is about 4.5 billion years. Also, 'punctuated equilibrium' (Eldredge and Gould, 1972) argued that many species stay unchanged for long periods with change concentrated in short bursts; how strong this effect is remains debated."}, "sources": ["src:84786f7bfa", "src:f554732c6d"], "flags": ["dated", "contested"]}], "links": [{"to": "tabar:human-evolution", "rel": "part-of", "note": {"fa": "تکامل انسان", "en": "Human evolution", "nl": "Human evolution"}}, {"to": "tabar:ancient-dna", "rel": "see-also", "note": {"fa": "دی‌ان‌ای باستانی؛ شواهد مولکولیِ تازه", "en": "Ancient DNA: new molecular evidence", "nl": "Ancient DNA: new molecular evidence"}}, {"to": "phil:paradigms", "rel": "see-also", "note": {"fa": "پارادایم‌ها و انقلاب‌های علمی", "en": "Paradigms and scientific revolutions", "nl": "Paradigms and scientific revolutions"}}, {"to": "psy:desirable-difficulties", "rel": "see-also", "note": {"fa": "مدخل هم‌موضوع", "en": "Related entry", "nl": "Verwant lemma"}}], "people": ["core:charles-lyell", "core:niles-eldredge", "core:stephen-jay-gould"], "sources": ["src:2a0ed82834", "src:84786f7bfa", "src:c220e1653f", "src:f554732c6d"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:haplogroups", "kind": "concept", "title": {"fa": "هاپلوگروه‌ها: مادرتبار و پدرتبار", "en": "Haplogroups: maternal and paternal lines", "nl": "Haplogroepen: moeder- en vaderlijn"}, "aliases": ["mtDNA", "Y-DNA", "حوای میتوکندریایی", "آدم کروموزوم Y"], "parent": "tabar:population-genetics", "field": "tabar:population-genetics", "summary": {"fa": "دی‌ان‌ای میتوکندری فقط از مادر و کروموزوم Y فقط از پدر می‌رسد؛ پس دو «خطِ» تبار را بی‌آمیزش دنبال می‌کنند. خوب برای ردگیری مهاجرت‌های کهن، ضعیف برای گفتن «شما کی هستید»: فقط دو نیا از هزاران نیای شما.", "en": "Mitochondrial DNA comes only from the mother and the Y chromosome only from the father, so they trace two unmixed \"lines\" of descent. Good for tracking ancient migrations, poor at telling \"who you are\": just two of your thousands of ancestors.", "nl": "Mitochondriaal DNA komt alleen van de moeder en het Y-chromosoom alleen van de vader, dus volgen ze twee onvermengde \"lijnen\" van afstamming. Goed om oude migraties te volgen, slecht om te zeggen \"wie u bent\": slechts twee van uw duizenden voorouders."}, "points": [{"text": {"fa": "کان، استونکینگ و ویلسون (۱۹۸۷): همهٔ دی‌ان‌ای‌های میتوکندری امروزی به یک زن در آفریقا، حدود ۲۰۰ هزار سال پیش می‌رسند («حوای میتوکندریایی»)؛ او تنها زن زمان خود نبود، فقط تنها کسی است که خطِ مادری‌اش ناگسسته مانده.", "en": "Cann, Stoneking and Wilson (1987): all present-day mitochondrial DNA traces to one woman in Africa about 200 thousand years ago (\"mitochondrial Eve\"); she was not the only woman of her time, merely the only one whose maternal line survived unbroken.", "nl": "Cann, Stoneking and Wilson (1987): all present-day mitochondrial DNA traces to one woman in Africa about 200 thousand years ago (\"mitochondrial Eve\"); she was not the only woman of her time, merely the only one whose maternal line survived unbroken."}, "sources": ["src:3dd3045232"], "flags": []}, {"text": {"fa": "کروموزوم Y همین کار را برای خط پدری می‌کند و به دلیل جهش آهسته و نبودِ نوترکیبی نشانگر خوبی برای مهاجرت‌های مردان است.", "en": "The Y chromosome does the same for the paternal line and, due to slow mutation and no recombination, is a good marker of male migrations.", "nl": "The Y chromosome does the same for the paternal line and, due to slow mutation and no recombination, is a good marker of male migrations."}, "sources": ["src:9e723d4592"], "flags": []}, {"text": {"fa": "ده نسل عقب‌تر شما تا ۱٬۰۲۴ نیا دارید؛ هاپلوگروه فقط دربارهٔ ۲ نفر از آن‌ها حرف می‌زند. «هاپلوگروه R1a دارم پس آریایی‌ام» خطای رایج است.", "en": "Ten generations back you have up to 1,024 ancestors; a haplogroup speaks about 2 of them. \"I have haplogroup R1a so I am Aryan\" is a common error.", "nl": "Ten generations back you have up to 1,024 ancestors; a haplogroup speaks about 2 of them. \"I have haplogroup R1a so I am Aryan\" is a common error."}, "sources": ["src:9e55a626fc"], "flags": ["editor-note"]}], "links": [{"to": "tabar:ancestry-tests", "rel": "part-of", "note": {"fa": "یکی از سه چیزی که آزمون‌های تبار گزارش می‌کنند", "en": "One of three things ancestry tests report", "nl": "One of three things ancestry tests report"}}, {"to": "tabar:common-ancestors", "rel": "see-also", "note": {"fa": "ریاضی نیاکان", "en": "The mathematics of ancestors", "nl": "The mathematics of ancestors"}}], "people": [], "sources": ["src:3dd3045232", "src:9e55a626fc", "src:9e723d4592"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:neanderthal-admixture", "kind": "concept", "title": {"fa": "آمیزش با نئاندرتال‌ها و دنیسوواها", "en": "Admixture with Neanderthals and Denisovans", "nl": "Vermenging met Neanderthalers en Denisovamensen"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "انسان خردمند با خویشاوندان کهن خود فرزند آورد: همهٔ مردم بیرون آفریقا حدود ۱ تا ۲ درصد دی‌ان‌ای نئاندرتال دارند و مردم اقیانوسیه تا چند درصد دی‌ان‌ای دنیسووا. «ما» و «آن‌ها» گونه‌های کاملاً جدا نبودند.", "en": "Homo sapiens had children with its archaic relatives: everyone outside Africa carries about 1 to 2 percent Neanderthal DNA, and people of Oceania up to several percent Denisovan DNA. \"Us\" and \"them\" were not fully separate species.", "nl": "Homo sapiens kreeg kinderen met zijn archaïsche verwanten: iedereen buiten Afrika draagt zo'n 1 tot 2 procent Neanderthaler-DNA, en mensen uit Oceanië tot enkele procenten Denisova-DNA. \"Wij\" en \"zij\" waren geen volledig gescheiden soorten."}, "points": [{"text": {"fa": "گرین و همکاران (۲۰۱۰): پیش‌نویس ژنوم نئاندرتال از استخوان‌های غار ویندیا (کرواسی)؛ مردم اوراسیا ۱ تا ۴ درصد (برآورد بعدی: حدود ۲ درصد) با نئاندرتال‌ها اشتراک دارند و آفریقایی‌ها تقریباً هیچ.", "en": "Green et al. (2010): draft Neanderthal genome from Vindija Cave (Croatia) bones; Eurasians share 1 to 4 percent (later estimate: about 2 percent) with Neanderthals, Africans almost none.", "nl": "Green et al. (2010): draft Neanderthal genome from Vindija Cave (Croatia) bones; Eurasians share 1 to 4 percent (later estimate: about 2 percent) with Neanderthals, Africans almost none."}, "sources": ["src:ca65b3b7c6"], "flags": []}, {"text": {"fa": "رایش و همکاران (۲۰۱۰): از یک بند انگشت در غار دنیسووا (سیبری) گروهی ناشناختهٔ انسان‌های کهن کشف شد که ۴ تا ۶ درصد ژنوم مردم ملانزی را می‌سازد.", "en": "Reich et al. (2010): from one finger bone in Denisova Cave (Siberia), an unknown archaic human group was discovered that makes up 4 to 6 percent of Melanesian genomes.", "nl": "Reich et al. (2010): from one finger bone in Denisova Cave (Siberia), an unknown archaic human group was discovered that makes up 4 to 6 percent of Melanesian genomes."}, "sources": ["src:3c51e5e6aa"], "flags": []}, {"text": {"fa": "پابو برای این کار نوبل پزشکی ۲۰۲۲ را گرفت. بعضی واریانت‌های نئاندرتالی امروز با ایمنی، پوست و حتی شدت کووید-۱۹ پیوند دارند.", "en": "Pääbo received the 2022 Nobel Prize in Medicine for this work. Some Neanderthal variants are today linked to immunity, skin and even COVID-19 severity.", "nl": "Pääbo received the 2022 Nobel Prize in Medicine for this work. Some Neanderthal variants are today linked to immunity, skin and even COVID-19 severity."}, "sources": ["src:8b730d2385"], "flags": []}], "links": [{"to": "tabar:out-of-africa", "rel": "part-of", "note": {"fa": "بخشی از داستان خروج از آفریقا", "en": "Part of the out-of-Africa story", "nl": "Part of the out-of-Africa story"}}, {"to": "tabar:ancient-dna", "rel": "evidence-for", "note": {"fa": "نخستین پیروزی بزرگ دی‌ان‌ای باستانی", "en": "The first major triumph of ancient DNA", "nl": "The first major triumph of ancient DNA"}}], "people": ["core:svante-p-bo", "core:david-reich"], "sources": ["src:3c51e5e6aa", "src:8b730d2385", "src:ca65b3b7c6"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:lomekwian-stone-technology", "kind": "concept", "title": {"fa": "فناوری لومکوی: ابزارسازی پیش از اولدوان", "en": "Lomekwian stone technology: tool-making before the Oldowan", "nl": "Lomekwiaanse steentechnologie: gereedschapsmaken vóór het Oldowan"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "گروه هارمند برای ابزارهای لومکوی ۳ نام «لومکوی» را پیشنهاد می‌کند. این ابزارها درشت‌تر و خام‌ترند و بیشتر با شیوه‌هایی ساخته شده‌اند که با روش رایج در اولدوان فرق دارد. پیشنهاد نویسندگان این است که این مجموعه مرحله‌ای جدا، پیش از اولدوان، را نشان می‌دهد.", "en": "Harmand's team proposes the name 'Lomekwian' for the LOM3 tools. They are larger and cruder than Oldowan pieces and were made mostly with techniques different from the usual Oldowan method. The authors argue the assemblage marks a separate stage before the Oldowan.", "nl": "Het team van Harmand stelt de naam 'Lomekwiaan' voor. De werktuigen zijn groter en ruwer dan Oldowan-stukken en werden met andere technieken gemaakt; volgens de auteurs vormen ze een aparte fase vóór het Oldowan."}, "points": [{"text": {"fa": "اولدوان نام مجموعه‌ای از ابزارهای سنگی است که نخست در دره اولدووای (تانزانیا) شناخته شد و کهن‌ترین نمونه‌هایش حدود ۲٫۶ میلیون سال عمر دارند. در اولدوان معمولاً سنگ را با دست و ضربهٔ آزاد می‌شکستند و تراشه‌های تیز می‌گرفتند. نویسندگان یادآوری می‌کنند که تعریف «اولدوان» از ۱۹۳۴ تا امروز یکسان نبوده است.", "en": "The Oldowan is a set of stone tools first recognised at Olduvai Gorge (Tanzania), with the oldest examples at about 2.6 Ma. Makers usually struck flakes from cores by free-hand percussion. The authors note that the definition of 'Oldowan' has varied since 1934.", "nl": "The Oldowan is a set of stone tools first recognised at Olduvai Gorge (Tanzania), with the oldest examples at about 2.6 Ma. Makers usually struck flakes from cores by free-hand percussion. The authors note that the definition of 'Oldowan' has varied since 1934."}, "sources": ["src:23b2553ce8"], "flags": []}, {"text": {"fa": "به گزارش مقاله، سازندگان لومکوی ۳ بیشتر دو شیوه به کار می‌بردند: «چکش ایستا» (هسته روی سندان و کوبیدن بر آن) و «دوقطبی» (هسته میان کوبه و سندان). بازسازی‌های آزمایشی با همان سنگ‌های محلی این را پشتیبانی می‌کند. این شیوه‌ها در اولدوان کمتر دیده شده‌اند و به حرکت کوبیدن مغزها روی سنگ نزد شمپانزه‌ها شبیه‌ترند تا به ضربهٔ آزادِ اولدوان.", "en": "Per the paper, the LOM3 knappers mostly used two methods: the 'passive hammer' (striking a core against a stationary anvil) and the 'bipolar' technique (core held between hammer and anvil). Replication experiments with local stone support this. Both are rarely documented in the Oldowan and resemble primate hammer-and-anvil nut-cracking more than Oldowan free-hand percussion.", "nl": "Per the paper, the LOM3 knappers mostly used two methods: the 'passive hammer' (striking a core against a stationary anvil) and the 'bipolar' technique (core held between hammer and anvil). Replication experiments with local stone support this. Both are rarely documented in the Oldowan and resemble primate hammer-and-anvil nut-cracking more than Oldowan free-hand percussion."}, "sources": ["src:23b2553ce8"], "flags": []}, {"text": {"fa": "نمونه‌ها بزرگ‌اند: میانگین وزن هسته‌ها حدود ۳٫۱ کیلوگرم است و سنگین‌ترین قطعه‌ها تا ۱۵ کیلوگرم می‌رسند. بسیاری از ضربه‌ها خوب نتیجه نداده و تراشه‌ها با شکستگی پله‌ای یا لولایی تمام شده‌اند، یعنی سازندگان ظاهراً هنوز شکستن سنگ را کمتر از سازندگان اولدوان می‌شناختند. با این حال تراشه‌های پیاپی و هدفمند هم گرفته‌اند.", "en": "The pieces are large: cores average about 3.1 kg and the heaviest pieces reach 15 kg. Many blows failed, leaving step and hinge terminations, which suggests the knappers understood stone fracture less well than Oldowan makers, yet they did detach series of flakes on purpose.", "nl": "The pieces are large: cores average about 3.1 kg and the heaviest pieces reach 15 kg. Many blows failed, leaving step and hinge terminations, which suggests the knappers understood stone fracture less well than Oldowan makers, yet they did detach series of flakes on purpose."}, "sources": ["src:23b2553ce8"], "flags": []}, {"text": {"fa": "یک قطعه ممکن است چند کار انجام داده باشد: سندان، هسته برای تراشه‌گیری، و ابزار کوبیدن. نویسندگان از این «تنوع کارکرد» نتیجه می‌گیرند که فناوری در آغاز یکدست و تک‌منظوره نبوده است. آن‌ها همچنین استدلال می‌کنند که الگوی شکستگی، تصادفی و طبیعی نیست و با تراشه‌های ناخواستهٔ محل‌های مغزشکنی شمپانزه‌ها فرق دارد.", "en": "A single piece may have served several tasks: anvil, core, and pounding tool. The authors take this diversity as a sign that early technology was not uniformly single-purpose. They also argue the fracture pattern is not natural breakage and differs from the accidental flakes at chimpanzee nut-cracking sites.", "nl": "A single piece may have served several tasks: anvil, core, and pounding tool. The authors take this diversity as a sign that early technology was not uniformly single-purpose. They also argue the fracture pattern is not natural breakage and differs from the accidental flakes at chimpanzee nut-cracking sites."}, "sources": ["src:23b2553ce8"], "flags": []}, {"text": {"fa": "به گفتهٔ نویسندگان، نیازی نیست «لومکوی» حتماً پیش‌اولدوان باشد؛ آن‌ها پیشنهاد می‌کنند این مجموعه شاید گام میانی میان استفادهٔ ضربه‌ای ساده از سنگ و تراشه‌گیری اولدوانی باشد. این یک تفسیر است و هنوز با نمونه‌های دیگری که مستقل تأیید شده باشند آزموده نشده، چون جایگاهی هم‌عمر در این منطقه گزارش نشده بود.", "en": "The authors suggest, as interpretation, that the Lomekwian may be an intermediate step between simple percussive use of stone and Oldowan flaking. This has not yet been tested against other independently confirmed assemblages of similar age, since none had been reported.", "nl": "The authors suggest, as interpretation, that the Lomekwian may be an intermediate step between simple percussive use of stone and Oldowan flaking. This has not yet been tested against other independently confirmed assemblages of similar age, since none had been reported."}, "sources": ["src:23b2553ce8"], "flags": ["editor-note", "contested"]}], "links": [{"to": "tabar:lomekwi-3-site", "rel": "part-of", "note": {"fa": "جایگاه لومکوی ۳", "en": "The Lomekwi 3 site", "nl": "The Lomekwi 3 site"}}, {"to": "tabar:first-toolmakers-debate", "rel": "see-also", "note": {"fa": "نخستین ابزارسازان: چه کسی و چرا", "en": "The first toolmakers: who and why", "nl": "The first toolmakers: who and why"}}, {"to": "tabar:human-evolution", "rel": "part-of", "note": {"fa": "تکامل انسان", "en": "Human evolution", "nl": "Human evolution"}}, {"to": "tabar:social-brain-evolution", "rel": "bridges", "note": {"fa": "مغز و جهش اجتماعی", "en": "Brain and social leap", "nl": "Brain and social leap"}}], "people": ["core:jason-e-lewis"], "sources": ["src:23b2553ce8"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:human-evolution", "kind": "field", "title": {"fa": "تکامل انسان", "en": "Human evolution", "nl": "Menselijke evolutie"}, "aliases": [], "parent": "tabar:tabar", "field": null, "summary": {"fa": "انسان خردمند چگونه پدید آمد، با چه خویشاوندانی آمیخت و چرا این‌قدر اجتماعی شد؟", "en": "How did Homo sapiens arise, whom did it mix with, and why did it become so social?", "nl": "Hoe ontstond Homo sapiens, met wie vermengde hij zich en waarom werd hij zo sociaal?"}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:cognitive-revolution-debate", "kind": "concept", "title": {"fa": "«انقلاب شناختی» ۷۰ هزار سال پیش: ادعای هراری و نقد آن", "en": "The 'Cognitive Revolution' of ~70,000 years ago: Harari's claim and its critique", "nl": "De 'cognitieve revolutie' van ~70.000 jaar geleden: Harari's stelling en kritiek"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "هراری می‌گوید در حدود ۷۰ هزار سال پیش جهش‌های ژنتیکی «سیم‌کشی» مغز انسان خردمند را تغییر داد و زبان و تخیل تازه‌ای پدید آمد که نابودی رقبا و گسترش جهانی را ممکن کرد. این روایتِ «انقلاب ناگهانی» در باستان‌شناسی امروز بحث‌برانگیز است و بسیاری شواهد را تدریجی‌تر می‌دانند.", "en": "Harari claims that around 70,000 years ago genetic mutations 'rewired' the Homo sapiens brain, producing a new language and imagination that allowed it to replace rivals and spread worldwide. This 'sudden revolution' narrative is contested in current archaeology, where many read the evidence as more gradual.", "nl": "Harari stelt dat rond 70.000 jaar geleden genetische mutaties de hersenen van Homo sapiens 'herbedraadden', wat nieuwe taal en verbeelding opleverde. Dit narratief van een plotselinge revolutie is omstreden; veel onderzoekers zien het bewijs als geleidelijker."}, "points": [{"text": {"fa": "بر اساس کتاب، انسان خردمند حدود ۱۵۰ هزار سال پیش از نظر کالبدی شبیه ما بود، ولی تا حدود ۷۰ هزار سال پیش دستاورد فرهنگی ویژه‌ای نداشت. در بازهٔ ۷۰ تا ۳۰ هزار سال پیش قایق، تیر و کمان، سوزن، نخستین آثار هنری (مثل مرد شیرنمای اشتادل)، نشانه‌های دین و تجارت دوربرد و گسترش به استرالیا دیده می‌شود.", "en": "According to the book, Homo sapiens looked anatomically like us by about 150,000 years ago but showed no special cultural achievement until about 70,000. The period 70,000-30,000 years ago brings boats, bow and arrow, needles, early art (such as the Lion-Man of Stadel), signs of religion and long-distance trade, and the settling of Australia.", "nl": "According to the book, Homo sapiens looked anatomically like us by about 150,000 years ago but showed no special cultural achievement until about 70,000. The period 70,000-30,000 years ago brings boats, bow and arrow, needles, early art (such as the Lion-Man of Stadel), signs of religion and long-distance trade, and the settling of Australia."}, "sources": ["src:64cc653b84"], "flags": []}, {"text": {"fa": "هراری می‌گوید رایج‌ترین نظریه این است که جهش‌های ژنتیکی اتفاقی ساختار درونی مغز را عوض کرد؛ او این را «جهش درخت دانش» می‌نامد و صریح می‌پذیرد که علت آن را نمی‌دانیم. او در این‌جا مدعی است که چنین نظریه‌ای «پذیرفته‌ترین» است، اما ادعایش دربارهٔ یک جهش مشخص شاهد ژنتیکی مستقیم ندارد.", "en": "Harari says the most common theory is that random genetic mutations changed the brain's internal wiring, which he calls the 'Tree of Knowledge mutation', and he openly admits the cause is unknown. His claim that this is the most accepted theory is not backed by direct genetic evidence for any specific mutation.", "nl": "Harari says the most common theory is that random genetic mutations changed the brain's internal wiring, which he calls the 'Tree of Knowledge mutation', and he openly admits the cause is unknown. His claim that this is the most accepted theory is not backed by direct genetic evidence for any specific mutation."}, "sources": ["src:64cc653b84"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "او ادعا می‌کند انسان‌های خردمند پیش از آن کم‌توانی شناختی داشتند و حتی یادگیری انگلیسی یا فهم تکامل برایشان ناممکن بود. شاهدش بیشتر ناکامی مهاجرت حدود ۱۰۰ هزار سال پیش به خاورمیانه است که چند تبیین دیگر (اقلیم، بیماری، رقابت) هم دارد.", "en": "He suggests earlier sapiens had limited cognitive abilities, to the point of being unable to learn English or grasp evolution. His main evidence is the failed migration into the Middle East around 100,000 years ago, which has other explanations (climate, disease, competition).", "nl": "He suggests earlier sapiens had limited cognitive abilities, to the point of being unable to learn English or grasp evolution. His main evidence is the failed migration into the Middle East around 100,000 years ago, which has other explanations (climate, disease, competition)."}, "sources"
