 چون نقش گردآوری و کار زنان را کم‌اهمیت می‌گیرد. رانگهم خودش هم همین نکته را به‌عنوان نقطهٔ ضعف روایت قدیمی می‌آورد. بین کاوش‌گر لاشه و شکارچی فعال بودن در دورهٔ هابیلین‌ها هم شواهد قطعی نداریم.", "en": "Editor's note: the 'Man-the-Hunter' framing has also been criticised on feminist and anthropological grounds for downplaying gathering and women's work, a point Wrangham himself uses against it. Whether early habilines were scavengers or active hunters is not settled by the evidence.", "nl": "Editor's note: the 'Man-the-Hunter' framing has also been criticised on feminist and anthropological grounds for downplaying gathering and women's work, a point Wrangham himself uses against it. Whether early habilines were scavengers or active hunters is not settled by the evidence."}, "sources": [], "flags": ["contested", "editor-note"]}], "links": [{"to": "tabar:cooking-hypothesis", "rel": "contrasts", "note": {"fa": "فرضیهٔ پختن", "en": "The cooking hypothesis", "nl": "The cooking hypothesis"}}, {"to": "tabar:human-evolution", "rel": "part-of", "note": {"fa": "تکامل انسان", "en": "Human evolution", "nl": "Human evolution"}}, {"to": "tabar:cooked-diet-body-and-brain", "rel": "see-also", "note": {"fa": "غذای پخته، روده و مغز", "en": "Cooked food, gut and brain", "nl": "Cooked food, gut and brain"}}], "people": ["core:richard-wrangham", "core:adam-zink", "core:daniel-e-lieberman"], "sources": ["src:c12cd83ad0", "src:c64b6db5f6"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:persian-plateau-hub", "kind": "concept", "title": {"fa": "فلات ایران به‌عنوان «کانون» انسان خردمند پس از خروج از آفریقا", "en": "The Persian Plateau as a 'Hub' for Homo sapiens after Out of Africa", "nl": "Het Iraanse plateau als 'Hub' voor Homo sapiens na Out of Africa"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "شواهد ژنتیکی، فسیلی و باستان‌شناختی نشان می‌دهد انسان خردمند حدود ۷۰ تا ۶۰ هزار سال پیش از آفریقا بیرون آمد، اما تا حدود ۴۵ هزار سال پیش در سراسر اوراسیا پخش نشد. وانینی و همکاران (۲۰۲۴) پیشنهاد می‌کنند در این فاصلهٔ حدود ۲۰ هزار ساله، نیای همهٔ غیرآفریقایی‌های امروز در یک «کانون» زندگی می‌کرد و این کانون به احتمال زیاد فلات ایران بوده است. این فرضیه‌ای قوی اما هنوز مدل‌محور است.", "en": "Genetic, fossil and archaeological evidence indicates that Homo sapiens left Africa about 70–60 thousand years ago but did not spread across Eurasia until about 45 kya. Vallini and colleagues (2024) propose that during this gap of about 20,000 years the ancestors of all present-day non-Africans lived in a 'Hub', most probably the Persian Plateau. This is a strong but still model-based hypothesis.", "nl": "Vallini e.a. (2024) combineren oud-DNA en paleo-ecologische modellen en stellen dat de voorouders van alle huidige niet-Afrikanen tussen ca. 70–60 en 45 duizend jaar geleden op het Iraanse plateau leefden. Dit is een modelmatige hypothese, geen directe vondst."}, "points": [{"text": {"fa": "مسئله: بین خروج اصلی از آفریقا (حدود ۷۰ تا ۶۰ هزار سال پیش) و استقرار پایدار در اوراسیا (حدود ۴۵ هزار سال پیش) شکافی نزدیک به ۲۰ هزار سال هست که در آن تقریباً هیچ فسیل انسان خردمند در اوراسیا نداریم. نویسندگان این جمعیتِ میانی را «کانون» (Hub) می‌نامند؛ جایی که موج‌های بعدیِ مهاجرت از آن برخاستند.", "en": "The problem: between the main exit from Africa (~70–60 kya) and stable settlement of Eurasia (~45 kya) lies a gap of about 20,000 years with almost no Homo sapiens fossils in Eurasia. The authors call the population of this interval the 'Hub', from which later waves of migration emanated.", "nl": "The problem: between the main exit from Africa (~70–60 kya) and stable settlement of Eurasia (~45 kya) lies a gap of about 20,000 years with almost no Homo sapiens fossils in Eurasia. The authors call the population of this interval the 'Hub', from which later waves of migration emanated."}, "sources": ["src:3ec2e3a4ff"], "flags": []}, {"text": {"fa": "روش ژنتیکی: آن‌ها ژنوم‌های باستانی و امروزی را با دو نمونهٔ کهن مقایسه کردند، یعنی تیان‌یوان (چین، حدود ۴۰ هزار سال پیش) برای شاخهٔ شرق اوراسیا و کوستنکی ۱۴ (روسیه، حدود ۳۸ هزار سال پیش) برای شاخهٔ غرب اوراسیا. هر جمعیت را بر پایهٔ سهم «آلل‌های مشترک مشتق‌شده» با این دو نمونه نشان دادند و اثر آمیختگی با نئاندرتال‌ها و دنیسوواها، پیوند شرقی-غربی و تبار «اوراسیایی پایه» را تا حد ممکن تصحیح کردند.", "en": "Genetic method: ancient and present-day genomes were compared with two old reference individuals, Tianyuan (China, ~40 ky old) for the East Eurasian branch and Kostenki14 (Russia, ~38 ky old) for the West Eurasian branch. Each population was placed by its share of derived alleles with the two, correcting as far as possible for archaic admixture, East-West mixing and Basal Eurasian ancestry.", "nl": "Genetic method: ancient and present-day genomes were compared with two old reference individuals, Tianyuan (China, ~40 ky old) for the East Eurasian branch and Kostenki14 (Russia, ~38 ky old) for the West Eurasian branch. Each population was placed by its share of derived alleles with the two, correcting as far as possible for archaic admixture, East-West mixing and Basal Eurasian ancestry."}, "sources": ["src:3ec2e3a4ff"], "flags": []}, {"text": {"fa": "نتیجهٔ ژنتیکی: میان جمعیت‌های غرب اوراسیا، آن‌هایی که کمترین رانش مشترک با شاخهٔ غربی دارند و به «کانون» نزدیک‌ترند، تبارشان به شکارگردآورندگان و کشاورزان نخستین ایران («Iran HG»، همان تبار «نوسنگی ایران») می‌رسد. با فرض اینکه دست‌کم بخشی از پیوستگی جمعیتی در ۴۰ هزار سال گذشته حفظ شده، «ناحیهٔ کانونی» ژنتیکی میان کرانهٔ جنوبی دریای خزر و خلیج فارس (که آن زمان خشکی بود) قرار می‌گیرد.", "en": "Genetic result: among West Eurasian groups, those closest to the Hub (least drift shared with the West Eurasian wave) carry ancestry of the hunter-gatherers and early farmers of Iran ('Iran HG', the 'Iranian Neolithic' component). Assuming at least partial population continuity over the past 40,000 years, the genetic focal area lies between the southern Caspian shore and the Persian Gulf (then dry land).", "nl": "Genetic result: among West Eurasian groups, those closest to the Hub (least drift shared with the West Eurasian wave) carry ancestry of the hunter-gatherers and early farmers of Iran ('Iran HG', the 'Iranian Neolithic' component). Assuming at least partial population continuity over the past 40,000 years, the genetic focal area lies between the southern Caspian shore and the Persian Gulf (then dry land)."}, "sources": ["src:3ec2e3a4ff"], "flags": []}, {"text": {"fa": "آزمون مستقل با اقلیم باستان: مدل پراکنش گونه‌ای بر پایهٔ بازسازی‌های اقلیمی ۷۰ تا ۳۰ هزار سال پیش نشان داد این منطقه در بیشتر آن دوره برای سکونت انسان مناسب بوده و ظرفیت جمعیتی‌اش از دیگر نواحی غرب آسیا بیشتر بوده است. اما مدل اقلیمی فقط با یک نقطهٔ داده از خود ایران اعتبارسنجی شد و نویسندگان خودشان این را یادآوری می‌کنند.", "en": "Independent test with palaeoclimate: a species-distribution model built on climate reconstructions for 70–30 kya found the region suitable for human occupation for most of the period, with a higher carrying capacity than other West Asian regions. However, the climate data were validated locally with only a single data point from Iran, as the authors themselves note.", "nl": "Independent test with palaeoclimate: a species-distribution model built on climate reconstructions for 70–30 kya found the region suitable for human occupation for most of the period, with a higher carrying capacity than other West Asian regions. However, the climate data were validated locally with only a single data point from Iran, as the authors themselves note."}, "sources": ["src:3ec2e3a4ff"], "flags": ["contested"]}, {"text": {"fa": "حدود و ابهام‌ها: هنوز هیچ فسیل انسان خردمندِ همراه با ابزارهای پارینه‌سنگی میانی در فلات ایران یافت نشده و ژنوم باستانی مستقیم از آنجا برای ۷۰ تا ۴۵ هزار سال پیش در دست نیست. بخش شمال‌شرقی شبه‌جزیرهٔ عربستان را نمی‌توان کنار گذاشت، و نتیجه به فرض پیوستگی جمعیت بستگی دارد (جابه‌جایی‌های بعدی ممکن است ردپا را جابه‌جا یا رقیق کرده باشد). به همین دلیل «فلات ایران» محتمل‌ترین نامزد است، نه یک واقعیتِ اثبات‌شده.", "en": "Limits: no Homo sapiens fossil has yet been found with Middle Palaeolithic tools on the Persian Plateau, and no direct ancient genome from there exists for 70–45 kya. Northeastern Arabia cannot be excluded, and the result depends on assuming population continuity (later movements may have shifted or diluted the signal). The Plateau is thus the most likely candidate, not a proven fact.", "nl": "Limits: no Homo sapiens fossil has yet been found with Middle Palaeolithic tools on the Persian Plateau, and no direct ancient genome from there exists for 70–45 kya. Northeastern Arabia cannot be excluded, and the result depends on assuming population continuity (later movements may have shifted or diluted the signal). The Plateau is thus the most likely candidate, not a proven fact."}, "sources": ["src:3ec2e3a4ff"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "این یک مقالهٔ تک‌گروهی و هنوز بدون تکرار مستقل است و فرضیهٔ «کانون» پیش‌تر در پژوهش‌های همین گروه مطرح شده بود. نتیجه‌گیری‌ها را باید فرضیهٔ کاری دانست تا زمانی که نمونه‌های باستانی تازه یا کاوش‌های هدفمند در ایران آن را تأیید یا رد کنند.", "en": "This is a single-group study not yet independently replicated, and the 'Hub' idea had been proposed earlier by related work. Treat the conclusions as a working hypothesis until new ancient samples or targeted excavation in Iran confirm or refute it.", "nl": "This is a single-group study not yet independently replicated, and the 'Hub' idea had been proposed earlier by related work. Treat the conclusions as a working hypothesis until new ancient samples or targeted excavation in Iran confirm or refute it."}, "sources": [], "flags": ["unreplicated", "editor-note"]}], "links": [{"to": "tabar:out-of-africa", "rel": "part-of", "note": {"fa": "خاستگاه آفریقایی انسان خردمند", "en": "African origin of Homo sapiens", "nl": "African origin of Homo sapiens"}}, {"to": "tabar:neanderthal-admixture", "rel": "see-also", "note": {"fa": "آمیزش با نئاندرتال‌ها و دنیسوواها", "en": "Admixture with Neanderthals and Denisovans", "nl": "Admixture with Neanderthals and Denisovans"}}, {"to": "tabar:zagros-neolithic", "rel": "see-also", "note": {"fa": "کشاورزان نوسنگی زاگرس (تبار «Iran HG» از آنجاست)", "en": "Zagros Neolithic farmers (source of the 'Iran HG' ancestry)", "nl": "Zagros Neolithic farmers (source of the 'Iran HG' ancestry)"}}, {"to": "soc:persian-plateau-palaeolithic-record", "rel": "see-also", "note": {"fa": "شواهد باستان‌شناختی و اقلیمی فلات ایران", "en": "Archaeological and climatic record of the Persian Plateau", "nl": "Archaeological and climatic record of the Persian Plateau"}}], "people": ["core:leonardo-vallini", "core:luca-pagani", "core:mohamed-javad-shoaee"], "sources": ["src:3ec2e3a4ff"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:nature-of-nurture", "kind": "concept", "title": {"fa": "ژن‌های والدین به‌عنوان محیط فرزند", "en": "Genetic nurture", "nl": "Genetische opvoeding"}, "aliases": [], "parent": "tabar:behavior-genetics", "field": "tabar:behavior-genetics", "summary": {"fa": "ژن‌هایی که والدین به فرزند نمی‌دهند هم روی او اثر می‌گذارند: از راه رفتار و محیطی که همان ژن‌ها در والدین می‌سازند. مرز ژن و محیط این‌جا محو می‌شود.", "en": "Even the genes parents do not pass on affect the child, through the behaviour and environment those genes create in the parents. Here the boundary between gene and environment dissolves.", "nl": "Ook de genen die ouders niet doorgeven, beïnvloeden het kind, via het gedrag en de omgeving die die genen bij de ouders scheppen. Hier vervaagt de grens tussen gen en omgeving."}, "points": [{"text": {"fa": "کُنگ و همکاران (۲۰۱۸، ایسلند): آللِ‌های والدین که به فرزند منتقل نشده بودند، حدود ۳۰ درصدِ اثرِ آلل‌های منتقل‌شده را روی تحصیلات فرزند داشتند.", "en": "Kong et al. (2018, Iceland): parental alleles not transmitted to the child had about 30 percent of the effect on the child's education that transmitted alleles had.", "nl": "Kong et al. (2018, Iceland): parental alleles not transmitted to the child had about 30 percent of the effect on the child's education that transmitted alleles had."}, "sources": ["src:0d7705b088"], "flags": []}, {"text": {"fa": "پیامد: بخشی از «وراثت‌پذیری» صفات اجتماعی در واقع از راه محیط عمل می‌کند؛ نمره‌های چندژنی بین خانواده‌ها این دو را قاطی می‌کنند.", "en": "Implication: part of the \"heritability\" of social traits actually operates through environment; between-family polygenic scores mix the two.", "nl": "Implication: part of the \"heritability\" of social traits actually operates through environment; between-family polygenic scores mix the two."}, "sources": ["src:4e5c76eea4"], "flags": []}], "links": [{"to": "tabar:gwas-polygenic", "rel": "critiques", "note": {"fa": "چرا نمرهٔ چندژنی درون خانواده ضعیف‌تر است", "en": "Why polygenic scores weaken within families", "nl": "Why polygenic scores weaken within families"}}, {"to": "tabar:gene-environment", "rel": "part-of", "note": {"fa": "نوعی همبستگی منفعل ژن–محیط", "en": "A kind of passive gene–environment correlation", "nl": "A kind of passive gene–environment correlation"}}], "people": [], "sources": ["src:0d7705b088", "src:4e5c76eea4"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:basics", "kind": "field", "title": {"fa": "مبانی", "en": "Basics", "nl": "Grondslagen"}, "aliases": [], "parent": "tabar:tabar", "field": null, "summary": {"fa": "ژنوم، جهش، انتخاب و رانش: چهار مفهومی که بقیهٔ این ویکی روی آن‌ها ایستاده است.", "en": "Genome, mutation, selection and drift: the four concepts the rest of this wiki stands on.", "nl": "Genoom, mutatie, selectie en drift: de vier begrippen waarop de rest van deze wiki rust."}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:neanderthal-hunting-language-burial", "kind": "concept", "title": {"fa": "ذهن نئاندرتال: شکار تن‌به‌تن، سخن گفتن، تدفین و آگاهی از مرگ", "en": "The Neanderthal mind: close-quarters hunting, speech, burial and awareness of death", "nl": "De geest van de Neanderthaler: jagen van dichtbij, spraak, begrafenis en doodsbewustzijn"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "نئاندرتال‌ها نزدیک به ۳۵۰ هزار سال، از اسپانیا تا آسیای مرکزی و از جمله فلات ایران، با موفقیت زیستند. «خداحافظ آفریقا» با چند رشته شاهد نشان می‌دهد آن‌ها چگونه شکار می‌کردند (بیشتر با ضربهٔ نیزه از نزدیک، نه پرتاب)، چرا تقریباً بی‌گمان سخن می‌گفتند (قیاس با شامپانزه، نیاز به کار تیمی، نواحی مغزی و ژن FOXP2)، و چرا تدفین آگاهانهٔ مردگان — که نخستین نمونه‌هایش از آنِ نئاندرتال‌هاست — نشانهٔ «مرگ‌آگاهی» است: دانستن اینکه خودم نیز خواهم مرد. برنامه نتیجه می‌گیرد که نئاندرتال‌ها می‌اندیشیدند، سخن می‌گفتند و با هم مبادله می‌کردند، اما احتمالاً اندیشهٔ انتزاعی‌شان به پیچیدگی ما نبود، و تأکید می‌کند که آن‌ها یک‌دست نبودند: در گسترهٔ زمانی و مکانیِ عظیمشان، ریخت‌ها و زبان‌های گوناگون داشتند.", "en": "Neanderthals lived successfully for some 350,000 years, from Spain to Central Asia, including the Iranian plateau. The programme uses several lines of evidence to show how they hunted (mostly thrusting spears at close range, not throwing), why they almost certainly spoke (the chimpanzee analogy, the demands of teamwork, brain regions and the FOXP2 gene), and why deliberate burial — first seen among Neanderthals — signals awareness of one's own death. It concludes that Neanderthals thought, spoke and exchanged, though their abstraction was probably less complex than ours, and stresses that they were not uniform: across their vast range and time span they differed in looks and language.", "nl": "Neanderthalers leefden zo'n 350.000 jaar succesvol, van Spanje tot Centraal-Azië, ook op het Iraanse plateau. Het programma laat zien hoe ze jaagden (vooral stoten van dichtbij), waarom ze vrijwel zeker spraken (chimpansee-analogie, teamwerk, hersengebieden, FOXP2) en waarom bewuste begrafenis — het eerst bij Neanderthalers gezien — wijst op doodsbewustzijn. Ze waren niet uniform: over hun enorme gebied verschilden ze in uiterlijk en taal."}, "points": [{"text": {"fa": "مرز تدریجی و پراکنش: به گفتهٔ برنامه، آغاز نئاندرتال‌ها را حدود ۳۵۰ تا ۴۰۰ هزار سال پیش می‌گذارند، اما نمی‌توان «خط‌کشی» گذاشت و گفت پیش از این خط نئاندرتال نبود و پس از آن بود؛ آن‌ها به احتمال زیاد از گونه‌ای از انسان هایدلبرگ پدید آمدند. آخرین بقایایشان، حدود ۳۵ تا ۴۰ هزار سال پیش، در دو سرِ قلمروشان یافت شده: جبل‌الطارق در غربی‌ترین نقطه و ازبکستان در شرقی‌ترین. ایران در میانهٔ این قلمرو بود؛ دندان‌های نئاندرتال از غار قلعه‌کرد قزوین (دندان شیری)، محوطهٔ بawi‌یوان در کرمانشاه و وزمه گزارش شده است.", "en": "A gradual boundary and range: Neanderthal origins are placed at about 350–400 ka, but no ruler can separate 'before' and 'after'; they most likely arose from a heidelbergensis population. The last remains, about 35–40 ka, come from the two ends of their range: Gibraltar in the west and Uzbekistan in the east. Iran lay in the middle; Neanderthal teeth are reported from Qaleh Kurd cave (Qazvin), Bawa Yawan (Kermanshah) and Wezmeh.", "nl": "Een geleidelijke grens: de oorsprong ligt rond 350–400.000 jaar, maar een harde lijn bestaat niet. De laatste resten (~35–40.000 jaar) komen uit Gibraltar en Oezbekistan. Iran lag in het midden; tanden zijn gevonden in Qaleh Kurd, Bawa Yawan en Wezmeh."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "زندگی روزمره: مانند همهٔ انسان‌های پیش از کشاورزی، معیشتشان شکار، گردآوری و لاشه‌خواری بود. در دسته‌هایی کوچک (بسته به منابع، ۲۰ تا ۴۰ نفر) از خویشاوندان درجهٔ یک و دو می‌زیستند؛ وقتی دسته از اندازه‌ای بزرگ‌تر می‌شد، می‌شکست و بخشی به دره‌ای دیگر می‌رفت. پروتین و کالری از میوه، گیاه، حشرات و شکار؛ آب از چشمه و رود و دریاچه. فناوری‌شان بر چوب، استخوان و سنگ استوار بود؛ چوب و استخوان کمتر می‌مانند (هرچند نیزه‌ای ۳۰۰ تا ۴۰۰ هزارساله از آلمان — شونینگن — در دست است)، اما سنگ می‌ماند و «امضای» دست‌افزارهای سنگی نئاندرتالی را باستان‌شناسان می‌شناسند. یقین کامل وقتی است که بقایای بدنی، ابزار، بقایای شکار و تاریخ‌گذاری مطلق کنار هم باشند.", "en": "Everyday life: like all pre-farming humans they hunted, gathered and scavenged, living in small bands (20–40 depending on resources) of close kin that split when too large. Technology rested on wood, bone and stone; wood and bone rarely survive (though 300–400,000-year-old spears are known from Schöningen, Germany), but stone does, and archaeologists recognise the 'signature' of Neanderthal tools. Certainty comes when skeletal remains, tools, prey remains and absolute dates coincide.", "nl": "Dagelijks leven: jagen, verzamelen, aaseten in kleine groepen van verwanten (20–40) die zich splitsten als ze te groot werden. Techniek van hout, been en steen; speren van 300–400.000 jaar uit Schöningen zijn bewaard. Zekerheid ontstaat als resten, werktuigen, prooi en datering samenvallen."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "شکار با ضربه از نزدیک — سه رشته شاهد: (۱) مدل‌سازی فیزیکی سرپیکان‌ها: آزمایش‌ها در غرب آسیا و اروپا نشان داده سرپیکان‌های سنگیِ بزرگ و ضخیمِ نئاندرتالی، اگر پرتاب شوند، به اندازهٔ کافی در بدن جانور فرو نمی‌روند تا خونریزی درونی یا آسیب به اندام‌های حیاتی بسازند؛ فقط فشار مستقیمِ دست چنین آسیبی پدید می‌آورد. (۲) آسیب‌های بدن خودِ نئاندرتال‌ها: شکستگی و جوش‌خوردگیِ فراوان در ترقوه، کتف و بازو، که با درگیری تن‌به‌تن با خرس غارزیِ نزدیک به چهار متر یا گوزن غول‌پیکری با شاخ‌های چندمتری هم‌خوان است. (۳) ردِ زخم روی استخوان شکار: بررسی میکروسکوپیِ حفره‌ای در مهرهٔ یک گوزن از یک محوطهٔ نئاندرتالی نشان داد شکلش با زخمِ پرتابی فرق دارد و از ضربه‌ای سخت از نزدیک است. برنامه تأکید می‌کند «عمدتاً، نه هرگز»: آن‌ها شکارچیانی زبردست بودند — «نمی‌شود سیصد و پنجاه هزار سال زنده ماند و شکارچی خوبی نبود» — و کار تیمی را به‌خوبی انجام می‌دادند.", "en": "Close-range hunting — three lines of evidence: (1) physical modelling of points: experiments in western Asia and Europe show large, thick Neanderthal points, if thrown, do not penetrate deeply enough to cause internal bleeding; only direct thrusting does. (2) Their own injuries: many healed fractures of collarbone, shoulder blade and arm, consistent with grappling with a cave bear nearly four metres tall or a giant deer. (3) Wounds on prey: microscopic study of a hole in a deer vertebra from a Neanderthal site showed it came from a hard close-range blow, not a projectile. The programme stresses 'mostly, not never': they were skilled hunters — 'you do not survive 350,000 years as a poor hunter' — and good at teamwork.", "nl": "Jagen van dichtbij — drie bewijslijnen: (1) modellen tonen dat grote Neanderthalerpunten bij werpen onvoldoende doordringen; (2) hun eigen genezen breuken; (3) microscopisch onderzoek van een wond in een hertenwervel wijst op een stoot van dichtbij. 'Vooral, niet nooit': ze waren bekwame jagers en goede teamspelers."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "آیا سخن می‌گفتند؟ — چهار رشته شاهد: (۱) «تقلبِ شامپانزه»: شامپانزه‌ها که حدود ۸ تا ۹ میلیون سال پیش از ما جدا شده‌اند (برنامه تکرار می‌کند که ما نوادگان شامپانزه نیستیم) و مغزی حدود یک‌سومِ نئاندرتال دارند، به گزارش مقاله‌ای در PLOS One در ۲۰۲۲ گنجینه‌ای بزرگ از آواهای گوناگون دارند و با تغییر لحن بر معنا تأکید می‌کنند؛ پس دور از فرض نیست که نئاندرتال با مغزی سه برابر بسیار پیچیده‌تر مفاهیم را مبادله کند. (۲) کار تیمی: بقای ۳۵۰ هزارساله در شرایط سخت و شکار گروهیِ جانوران بزرگ بدون تبادل ایده ممکن نبود. (۳) «سخت‌افزار» مغز: گوینده مغز را به رایانه تشبیه می‌کند که مهندس از روی رم، پردازنده و کارت گرافیکش می‌فهمد چه کارهایی از آن برمی‌آید؛ نواحی مغزیِ درگیر در سخن گفتن، که در انسان امروز شناخته‌ایم، در نئاندرتال‌ها هم بود. (۴) «نرم‌افزار» ژنتیکی: ژن FOXP2 که با گفتار مرتبط است، به گفتهٔ برنامه در نئاندرتال‌ها هم بوده است.", "en": "Did they speak? — four lines of evidence: (1) the 'chimpanzee shortcut': chimpanzees, split from us some 8–9 Mya (we are not their descendants) and with a third of a Neanderthal's brain volume, have — according to a 2022 PLOS One paper — a large repertoire of distinct calls and use changes in tone to emphasise meaning; a Neanderthal with three times the brain could surely exchange far more complex ideas. (2) Teamwork: 350,000 years of survival and group hunting of large animals required exchanging ideas. (3) Brain 'hardware': like an engineer judging a computer from its RAM, CPU and graphics card, we can see Neanderthals had the brain regions involved in speech in modern humans. (4) Genetic 'software': the speech-related FOXP2 gene variant was also present in Neanderthals.", "nl": "Spraken ze? — vier bewijslijnen: (1) chimpansees, met een derde van het hersenvolume, hebben een groot repertoire van roepen en gebruiken toonhoogte voor betekenis; (2) teamwerk vereiste communicatie; (3) de spraakgerelateerde hersengebieden waren aanwezig; (4) ook de FOXP2-variant was er."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "تدفین و مرگ‌آگاهی: از انسان هایدلبرگ تدفینی نداریم (در آتاپوئرکا مردگان را در چاه می‌انداختند)، اما نخستین تدفین‌های آگاهانه از آنِ نئاندرتال‌هاست: کندن گودال، نهادن جسد در حالت بدنیِ خاص، گذاشتن اشیای فرهنگی کنار آن (گوشت شکار، ابزار سنگی) و گاهی پوشاندن گور با سنگ‌چین یا شاخ و سر جانوران. ممکن است ساده به نظر برسد (برای اینکه بو نگیرد یا جانوران نیایند)، اما به استدلال برنامه کسی که دفن می‌کند به مرگ فکر می‌کند — نه فقط مرگ دیگران، بلکه مرگی که برای خودش هم رخ خواهد داد. گوینده این «مرگ‌آگاهی» را مهم‌ترین ویژگیِ جداکنندهٔ انسان از دیگر جانداران می‌داند. گذاشتن گوشت و ابزار کنار مرده را می‌توان چنین خواند که او را «تمام‌شده» نمی‌دانستند، گویی قرار بود به سفری برود و این‌ها توشهٔ راهش بود؛ هرچند آنچه دقیقاً در ذهنشان بود هرگز دانستنی نیست.", "en": "Burial and death awareness: there are no burials from heidelbergensis (at Atapuerca the dead were dropped into a pit), but the first deliberate burials are Neanderthal: digging a pit, placing the body in a particular posture, adding cultural items (meat, stone tools) and sometimes covering the grave with stones or animal horns and skulls. It may look merely practical (to avoid smell or scavengers), but whoever buries is thinking about death — not only others' death but one's own. The speaker calls this 'death awareness' the single most important trait separating humans from other living things. Grave goods suggest the dead were not considered 'finished', as if setting out on a journey with provisions — though what they actually believed is unknowable.", "nl": "Begrafenis en doodsbewustzijn: van heidelbergensis zijn geen begrafenissen bekend, maar de eerste bewuste begrafenissen zijn van Neanderthalers: een kuil, een bepaalde lichaamshouding, grafgiften. Wie begraaft, denkt na over de dood — ook de eigen dood. Grafgiften suggereren dat de dode niet 'af' was, alsof hij op reis ging."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "چرا مرگ را فراموش می‌کنیم؟ برنامه (در این اپیزود و نیز در اپیزود یکم) استدلال می‌کند که انتخاب طبیعی از ما «زیاد شدن» می‌خواهد؛ اگر کسی صبح تا شب به مرگ خودش بیندیشد، انگیزهٔ زیستن و فرزندآوری‌اش کاسته می‌شود. پس سازوکارهای بدن (گوینده از هورمون‌ها سخن می‌گوید) ما را به‌سرعت به زندگی روزمره بازمی‌گردانند: «سر خاک گریه می‌کنیم و بعد ناهار می‌خوریم». فرهنگ هم به کمک می‌آید و داستان‌هایی می‌سازد که می‌گویند با مرگ تمام نمی‌شوی و به شکل یا در جهانی دیگر ادامه می‌یابی — از تناسخ تا بهشت و دوزخ. به گفتهٔ برنامه، آغاز این درد و این داستان‌ها به نئاندرتال‌ها بازمی‌گردد.", "en": "Why do we forget death? Natural selection 'wants' us to multiply; someone thinking constantly of their own death loses drive to live and reproduce. So bodily mechanisms (the speaker speaks of hormones) pull us back to daily life — 'we weep at the grave, then go and have lunch'. Culture helps by telling stories in which death is not the end and we continue in another form or world — from reincarnation to heaven and hell. The programme traces the beginning of this pain, and these stories, to Neanderthals.", "nl": "Waarom vergeten we de dood? Selectie 'wil' dat we ons voortplanten; lichaamsmechanismen trekken ons terug naar het dagelijks leven, en cultuur vertelt verhalen waarin de dood niet het einde is. Het begin daarvan legt het programma bij de Neanderthalers."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "هنر کم، انتزاع کمتر؟ بخش پیش‌پیشانیِ مغز که به اندیشهٔ بسیار انتزاعی کمک می‌کند، در نئاندرتال‌ها به گستردگی ما نبود؛ پس به گفتهٔ برنامه، نه اینکه انتزاع نداشتند، اما احتمالاً به پیچیدگی ما نبود. به همین دلیل شواهدی که آشکارا انتزاعی‌اند — هنر منقول و غیرمنقول — از آن‌ها کم است. تنها نقاشیِ منسوب به نئاندرتال‌ها از غاری در اسپانیا با قدمتی بیش از ۶۰ هزار سال است؛ و فقط به دلیل سنش به آن‌ها نسبت داده شده، چون شاهدی از انسان خردمند در اروپا پیش از حدود ۵۲ هزار سال پیش نداریم. زیورآلات (مهره و دندان سوراخ‌شده، آویز استخوانی) هم از محوطه‌هایشان هست، اما نه به فراوانیِ محوطه‌های انسان خردمند.", "en": "Little art, less abstraction? The prefrontal cortex, which supports highly abstract thought, was less expanded in Neanderthals, so — the programme says — they had abstraction but probably not of our complexity. Hence clearly abstract evidence, portable or parietal art, is scarce. The only painting attributed to Neanderthals comes from a Spanish cave dated to over 60,000 years, attributed purely by its age, since there is no evidence of Homo sapiens in Europe before about 52,000 years ago. Ornaments (perforated beads and teeth, bone pendants) occur at their sites, but far less often than at sapiens sites.", "nl": "Weinig kunst, minder abstractie? De prefrontale cortex was minder uitgebreid. Het enige aan Neanderthalers toegeschreven schilderwerk komt uit een Spaanse grot van ruim 60.000 jaar, puur op grond van de datering. Sieraden komen voor, maar minder vaak dan bij sapiens."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "نئاندرتال‌ها یک‌دست نبودند: برنامه با یک تصور نادرست رایج مخالفت می‌کند که همهٔ نئاندرتال‌ها یک شکل بودند و به یک زبان سخن می‌گفتند. وقتی جمعیتی در گستره‌ای از اسپانیا تا آسیای مرکزی و در بازه‌ای ده‌ها هزارساله پراکنده است، طبیعی است که — همانند تنوع ما انسان‌های امروز — در ریخت، اندام و زبان گوناگون شود. حدس گوینده این است که اگر نئاندرتالی از غار شانیدر در کردستان عراق، یکی از فرانسه و یکی از آلتای را کنار هم می‌گذاشتیم، احتمالاً زبان یکدیگر را نمی‌فهمیدند و آرایش بدنی متفاوتی هم داشتند. اپیزود با پرسشی تمام می‌شود که پاسخش «هم آری، هم نه» است: آیا ما انسان‌های خردمندِ خردمند مسئول انقراض نئاندرتال‌ها بودیم؟", "en": "Neanderthals were not uniform: the programme rejects the common idea that all Neanderthals looked alike and spoke one language. A population spread from Spain to Central Asia over tens of thousands of years would naturally diversify — like us — in appearance, body form and language. The speaker guesses that a Neanderthal from Shanidar cave (Iraqi Kurdistan), one from France and one from the Altai would probably not have understood each other and would have adorned themselves differently. The episode ends with a question whose answer is 'yes and no': were we, Homo sapiens sapiens, responsible for their extinction?", "nl": "Neanderthalers waren niet uniform: verspreid van Spanje tot Centraal-Azië verschilden ze in uiterlijk en taal. Een Neanderthaler uit Shanidar, één uit Frankrijk en één uit de Altai begrepen elkaar waarschijnlijk niet. De aflevering eindigt met de vraag of wij verantwoordelijk waren voor hun uitsterven: 'ja en nee'."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "نقد: (۱) FOXP2 «ژن زبان» نیست؛ یک ژن تنظیمی است که در گفتار و هماهنگی حرکتی دهان نقش دارد. اینکه نئاندرتال‌ها نسخهٔ انسانی‌اش را داشتند (کراوزه و همکاران، ۲۰۰۷) شرطی لازم ولی ناکافی است؛ ادعای برنامه دربارهٔ تاریخ جهشِ آن در رونوشت درهم است. (۲) گزارش «صدها آوای متمایز» شامپانزه‌ها بسته به روش شمارش بسیار متفاوت است؛ بیشتر پژوهش‌ها چند ده نوع صدای پایه با ترکیب‌های گوناگون می‌شمارند. (۳) تدفین‌های نئاندرتالی (مثلاً لا شاپل-او-سن، شانیدر) دهه‌ها مورد بحث بود و هنوز برخی آن‌ها را عمدی نمی‌دانند، هرچند کاوش‌های تازهٔ شانیدر (۲۰۱۸ به بعد) و لا فراسی دیدگاه تدفین عمدی را تقویت کرده‌اند. «گل‌های شانیدر» (رالف سولکی) امروز معمولاً به زنبورها یا جوندگان نسبت داده می‌شود. (۴) تاریخ‌گذاری ۶۴ هزارساله برای هنر غارهای اسپانیا (هافمان و همکاران، ۲۰۱۸) با روش اورانیوم-توریم مورد نقد روش‌شناختی است. (۵) «پیش‌پیشانیِ کوچک‌تر» بر قالب‌گیریِ درون جمجمه تکیه دارد و تفسیرش از توان شناختی محتاطانه است؛ تفاوت‌هایی در شکل مغز (کروی‌تر بودن مغز ما) قطعی‌ترند تا حجم پیش‌پیشانی.", "en": "Critique: (1) FOXP2 is not 'the language gene' but a regulatory gene involved in speech and orofacial motor control; that Neanderthals had the human variant (Krause et al. 2007) is necessary but not sufficient, and the programme's dating of the mutation is garbled in the transcript. (2) Counts of chimpanzee call types vary greatly with method; most studies count a few dozen basic calls with many combinations. (3) Neanderthal burials (La Chapelle-aux-Saints, Shanidar) were debated for decades and some still doubt intent, though new excavations at Shanidar (2018–) and La Ferrassie strengthen the case. Solecki's 'Shanidar flowers' are now usually attributed to bees or rodents. (4) The 64,000-year U-Th dates for Spanish cave art (Hoffmann et al. 2018) face methodological criticism. (5) A 'smaller prefrontal cortex' rests on endocasts and its cognitive meaning is uncertain; differences in brain shape (our more globular brain) are better established.", "nl": "Kritiek: (1) FOXP2 is geen 'taalgen'; noodzakelijk maar niet voldoende. (2) Tellingen van chimpanseeroepen variëren sterk. (3) Neanderthalerbegrafenissen waren lang omstreden; nieuwe opgravingen in Shanidar versterken het beeld; de 'bloemen' komen waarschijnlijk van bijen of knaagdieren. (4) De 64.000-jaardatering van Spaanse grotkunst is methodologisch betwist. (5) De kleinere prefrontale cortex steunt op schedelafgietsels."}, "sources": ["src:60e7838a5a"], "flags": ["editor-note", "contested"]}, {"text": {"fa": "یادداشت خوانش: بر پایهٔ رونوشت خودکار اپیزود ششمِ «خداحافظ آفریقا» (نخستین اپیزود پس از وقفه‌ای چندماهه)، به‌طور کامل، و بخشی از اپیزود یکم دربارهٔ فراموش‌کردن مرگ. گوینده در آغاز اپیزود دلیل وقفه را حال‌وهوای عمومیِ آن ماه‌ها می‌داند؛ ما آن را تفسیر نمی‌کنیم. بخشی از گفت‌وگو که به افسردگی شدید و پیامدهای آن اشاره دارد، به دلیل حساسیت در این مدخل نیامده است.", "en": "Reading note: based on the full automatic transcript of episode 6 (the first after a pause of several months) and part of episode 1 on forgetting death. The speaker attributes the pause to the general mood of those months; we do not interpret this. A passage touching on severe depression and its consequences is omitted for sensitivity.", "nl": "Leesnotitie: gebaseerd op aflevering 6 (volledig) en een deel van aflevering 1. De pauze wordt toegeschreven aan de algemene stemming van die maanden; wij interpreteren dat niet. Een passage over zware depressie is uit zorgvuldigheid weggelaten."}, "sources": ["src:60e7838a5a"], "flags": ["editor-note"]}], "links": [{"to": "tabar:neanderthal-discovery-and-body", "rel": "part-of", "note": {"fa": "کشف و بدنِ نئاندرتال", "en": "discovery and body of the Neanderthal", "nl": "ontdekking en lichaam"}}, {"to": "tabar:neanderthal-genes-in-us-gifts-and-costs", "rel": "see-also", "note": {"fa": "ژن‌های نئاندرتالی در ما", "en": "Neanderthal genes in us", "nl": "Neanderthalergenen in ons"}}, {"to": "tabar:origins-of-ritual-religion-shaman", "rel": "see-also", "note": {"fa": "خاستگاه آیین و باور به جهان دیگر", "en": "origins of ritual and afterlife belief", "nl": "oorsprong van ritueel"}}, {"to": "soc:death-awareness-ritual-afterlife-roles", "rel": "bridges", "note": {"fa": "مرگ‌آگاهی، آیین و نقش‌های پس از مرگ در جامعه‌شناسی", "en": "death awareness and ritual in sociology", "nl": "doodsbewustzijn en ritueel in de sociologie"}}, {"to": "tabar:sapiens-sapiens-dog-art-animism", "rel": "contrasts", "note": {"fa": "هنر و نمادپردازیِ گسترده‌ترِ انسان خردمند", "en": "the richer symbolism of sapiens", "nl": "de rijkere symboliek van sapiens"}}, {"to": "tabar:persian-plateau-hub", "rel": "see-also", "note": {"fa": "نئاندرتال‌ها در فلات ایران", "en": "Neanderthals on the Iranian plateau", "nl": "Neanderthalers op het Iraanse plateau"}}], "sources": ["src:60e7838a5a"], "people": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:animal-domestication-zagros-goat-pig-taboo", "kind": "concept", "title": {"fa": "اهلی‌سازی جانوران: بزِ زاگرس، معیارهای اهلی‌پذیری، تابوی خوک و اسبِ استپ", "en": "Animal domestication: the Zagros goat, criteria for domesticability, the pork taboo and the steppe horse", "nl": "Domesticatie van dieren: de Zagros-geit, criteria voor domesticeerbaarheid, het varkenstaboe en het steppepaard"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "چرا بز و گوسفند در جنوب‌غرب آسیا اهلی شدند و گورخر، اسب آبی و کانگورو هرگز؟ «خداحافظ آفریقا» با تکیه بر معیارهای ملیندا زیدر نشان می‌دهد که اهلی‌پذیری به رفتار و فیزیولوژی خودِ جانور بستگی دارد — نه به «هوش» مردمانی که در کنارش زیستند — و این‌گونه یکی از پیش‌داوری‌های نژادپرستانهٔ اروپاییان دربارهٔ آفریقا، آمریکا و استرالیا را رد می‌کند. برنامه سپس داستان تک‌تک جانوران را دنبال می‌کند: بزی که از گنج‌دره در زاگرس ایران به سه مسیر تا اروپا و شمال آفریقا رفت؛ خوکی که در جنوب‌غرب آسیا کم‌کم کنار گذاشته شد و به تابوی خوراکی بدل شد؛ گاوی که چند بار اهلی شد؛ اسبی که حدود پنج هزار سال پیش در استپ‌ها اهلی شد (و این «سرنخی» برای تاریخ‌گذاری سنگ‌نگاره‌های ادعایی ایران است)؛ شتر، مرغ و گربه‌ای که «رام» شد، نه اهلی.", "en": "Why were goats and sheep domesticated in SW Asia but never zebras, hippos or kangaroos? Using Melinda Zeder's criteria, the programme shows that domesticability depends on the animal's own behaviour and physiology — not on the 'intelligence' of people living alongside it — refuting a racist European prejudice about Africa, the Americas and Australia. It then follows each animal: the goat that spread from Ganj Dareh in Iran's Zagros along three routes to Europe and North Africa; the pig gradually abandoned in SW Asia and turned into a food taboo; cattle domesticated several times; the horse domesticated about five thousand years ago on the steppe (a useful clue for dating claimed rock art in Iran); the camel, the chicken, and the cat that was 'tamed' rather than domesticated.", "nl": "Waarom werden geit en schaap in Zuidwest-Azië gedomesticeerd, maar zebra, nijlpaard en kangoeroe nooit? Met de criteria van Melinda Zeder toont het programma dat domesticeerbaarheid van het dier zelf afhangt — niet van de 'intelligentie' van de mensen eromheen. Daarna: de geit uit Ganj Dareh (Zagros), het varken en zijn taboe, het rund, het paard (~5.000 jaar, een aanwijzing voor het dateren van rotskunst), de kameel, de kip en de kat die 'getemd' werd."}, "points": [{"text": {"fa": "خانه‌نشین شدنِ چه کسی؟ واژهٔ domestication از لاتین domus (خانه) می‌آید و یعنی «خانگی شدن». گوینده بازیِ معنایی آن را یادآور می‌شود: به نظر می‌رسد آنکه خانه‌نشین شد خودِ ما انسان‌ها بودیم؛ نخستین خانه‌ها در آغاز نوسنگی در جنوب‌غرب آسیا کنار کشتزارها ساخته شدند. تعریف: اهلی‌سازی فرایندی است که در آن بقا و تولیدمثل جانور یا گیاه به انسان وابسته می‌شود، و انسان از آن برای خوراک، کار، پوشاک، دارو و کاربردهای دیگر بهره می‌گیرد. از میان تنوع عظیم جانوران و گیاهان، تنها درصد بسیار کوچکی اهلی شده‌اند.", "en": "Who became housebound? 'Domestication' comes from Latin domus (house). The speaker notes the irony: it seems we humans were the ones made housebound — the first houses were built beside fields at the start of the Neolithic in SW Asia. Definition: a process in which an animal's or plant's survival and reproduction come to depend on humans, who use it for food, labour, clothing, medicine and more. Only a tiny fraction of animal and plant diversity was ever domesticated.", "nl": "Wie werd er huiselijk? 'Domesticatie' komt van domus (huis); misschien werden vooral wij mensen huiselijk. Definitie: overleving en voortplanting van dier of plant gaan afhangen van de mens. Slechts een fractie van alle soorten werd gedomesticeerd."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "اصل آنا کارنینا: جرد دایموند در «اسلحه، میکروب و فولاد» جملهٔ آغازین «آنا کارنینا»ی تولستوی را وام می‌گیرد («همهٔ خانواده‌های خوشبخت شبیه یکدیگرند؛ هر خانوادهٔ ناخوشبخت به شیوهٔ خودش ناخوشبخت است») و می‌گوید همهٔ جانوران اهلی‌پذیر شبیه یکدیگرند و هر جانوری که اهلی نشد، به شیوهٔ خودش شکست خورد. یعنی کافی است یکی از شرط‌ها نباشد تا این «ازدواج» میان انسان و جانور سر نگیرد.", "en": "The Anna Karenina principle: in Guns, Germs, and Steel Jared Diamond borrows Tolstoy's opening line ('all happy families are alike; each unhappy family is unhappy in its own way'): all domesticable animals are alike, and each one that failed did so in its own way. One missing condition is enough to wreck this 'marriage' between human and animal.", "nl": "Het Anna Karenina-principe (Jared Diamond): alle domesticeerbare dieren lijken op elkaar; elk dier dat faalde, faalde op zijn eigen manier. Eén ontbrekende voorwaarde volstaat."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "معیارهای ملیندا زیدر (۲۰۱۲): (۱) ساختار اجتماعی — در حالت وحشی در گروه‌های بزرگ زندگی کند تا در کنار جمعیت متراکم انسانی وحشت نکند؛ گروه سلسله‌مراتبی باشد تا انسان بتواند در رأس آن بنشیند (مانند گرگ)؛ و نرها کنار ماده‌ها و بچه‌ها بمانند، وگرنه نگه داشتن گله‌ای فقط از ماده‌ها و رها کردنشان برای جفت‌گیری به‌صرفه نیست. (۲) رفتار جنسی — جانورانی که پنهانی و بیرون از گروه تولیدمثل می‌کنند، در کنار انسان موفق نیستند؛ برتری جنسیِ نرها در گروه باید در گونهٔ وحشی وجود داشته باشد. (۳) رابطهٔ والد و فرزند — در برخی جانوران مادر اگر مدتی از بچه‌اش دور باشد او را نمی‌پذیرد؛ پیوندی محکم لازم است تا بچه شیر بخورد و بزرگ شود. (۴) پاسخ به انسان — جانورانی که فیزیولوژیک از انسان می‌ترسند و می‌گریزند نامزد خوبی نیستند. (۵) رژیم غذایی — گوشت‌خوارانی با رژیم کاملاً هم‌سان با ما رقیب‌اند (مگر سازگاری‌ای چون آنزیم هضم استخوان در معدهٔ سگ پیش آید).", "en": "Melinda Zeder's criteria (2012): (1) social structure — living in large groups in the wild, so as not to panic amid dense human settlements; hierarchical groups, so humans can take the top (as with wolves); and males staying with females and young, since keeping only females and releasing them to mate is uneconomical. (2) Sexual behaviour — species that mate secretly outside the group do poorly with humans; male dominance should already exist in the wild. (3) Parent–offspring bond — some mothers reject young after a short separation; a strong bond is needed. (4) Response to humans — species physiologically fearful of humans are poor candidates. (5) Diet — carnivores with a diet identical to ours are competitors (unless something like the dog's bone-digesting stomach enzymes evolves).", "nl": "De criteria van Melinda Zeder (2012): (1) sociale structuur — grote, hiërarchische groepen waarin mannetjes blijven; (2) paargedrag binnen de groep; (3) een sterke ouder-jongbinding; (4) geen fysiologische angst voor mensen; (5) een dieet dat niet met het onze concurreert."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "گربه: رام، نه اهلی. گربه سانان رژیمی هم‌سان ما داشتند و نیای گربهٔ خانگی، گربهٔ وحشی، جانوری قلمروطلب و منزوی است که هیچ ویژگی گله‌ای ندارد. صاحبان گربه می‌دانند که با آمدن مهمان، گربه حال خوبی ندارد؛ و در فرهنگ ما «گربه‌صفت» بودن صفتی منفی است — یعنی کسی که محبت‌ها را از یاد می‌برد. به گفتهٔ برنامه، این ربطی به نیتِ بدِ گربه ندارد: گربه خانه را قلمرو خود می‌داند و انسان‌ها را گربه‌های دیگری می‌بیند که اجازه داده در قلمرواش شریک باشند. برخی دانشمندان برای گربه واژهٔ «رام‌شدن» را بهتر می‌دانند: رام یعنی جانور اجازه دهد به او نزدیک شوی و لمسش کنی؛ اهلی یعنی بقا و تولیدمثلش بدون انسان ممکن نباشد — مانند گوسفندی که اگر از گله جدا شود در طبیعت دوام نمی‌آورد. سود گربه برای کشاورزان دفع جوندگان بود؛ رام‌شدن گربه حدود ۱۰ هزار سال پیش در شمال آفریقا یا جنوب‌غرب آسیا رخ داد و بعدها در مصر باستان جایگاهی ویژه و نمادِ یکی از خدایان شد.", "en": "The cat: tamed, not domesticated. The ancestor of the house cat, the wildcat, is territorial and solitary with no herd traits. Cat owners know a cat dislikes guests, and in Persian culture 'cat-natured' is an insult — someone who forgets kindness. It is not malice: the cat treats the house as its territory and humans as other cats it lets share it. Some scientists prefer 'tamed': a tame animal lets you approach and touch it; a domesticated one cannot survive and reproduce without humans — like a sheep separated from its flock. Cats helped farmers by killing rodents; taming happened about 10,000 years ago in North Africa or SW Asia, and in ancient Egypt the cat became sacred.", "nl": "De kat: getemd, niet gedomesticeerd. De wilde kat is territoriaal en solitair; de kat beschouwt mensen als andere katten in zijn territorium. Getemd betekent: je mag dichtbij komen; gedomesticeerd: overleving hangt van mensen af. Katten bestreden knaagdieren; tamming ~10.000 jaar geleden."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "پیش‌داوری اروپایی و پاسخ آن: اروپاییانی که به آفریقا رسیدند، گله‌های بزرگ زرافه، گورخر، اسب آبی، کرگدن و شیر دیدند که هیچ‌کدام اهلی نشده بودند و این انگاره را ساختند که بومیان آفریقا «هوش کافی» برای اهلی کردن نداشتند و «پایین‌تر از سفیدپوست اروپایی» بودند؛ همین داوری را دربارهٔ بومیان آمریکا و استرالیا هم کردند. پاسخ برنامه: هر یک از این جانوران دست‌کم یکی از شرط‌های زیدر را نداشت. گورخر بارها و بارها اهلی‌سازی را ناکام گذاشت؛ کرگدن بسیار تهاجمی است؛ اسب آبی — که گاه گمان می‌شد می‌توانست مشکل پروتین آفریقا را حل کند — به گفتهٔ برنامه از کشنده‌ترین جانوران آفریقاست، چون در برکه‌ها و رودها کنار تمساح‌ها تنها تهاجمی‌ترین‌ها می‌مانند. اروپاییان خودشان هم با همهٔ تلاش، هیچ پستاندار متوسط یا بزرگ آفریقایی را اهلی نکردند. آفریقا بز و گوسفند و گاو و اسب را سرانجام از جنوب‌غرب آسیا گرفت. در استرالیا اصلاً پستانداری متوسط و اهلی‌پذیر نبود: کانگورو کیسه‌دار و با مغز کوچک است و کوآلا تولیدمثلی بسیار کند دارد؛ بومیان قرن‌ها کانگورو را شکار کردند و این ربطی به ناتوانی‌شان نداشت. در آمریکای شمالی اسب‌های وحشی حدود ده هزار سال پیش (به شکار) از میان رفته بودند؛ تصویر «سرخپوستِ سوارکارِ ماهر» به اسب‌های رهاشدهٔ اروپاییان بازمی‌گردد که بومیان بی‌هیچ دشواری دوباره رامشان کردند.", "en": "European prejudice and the reply: Europeans arriving in Africa saw herds of giraffes, zebras, hippos, rhinos and lions, none domesticated, and concluded that Africans lacked the intelligence to domesticate them and were 'inferior to white Europeans' — the same judgement they passed on Native Americans and Australians. The reply: each of these animals failed at least one of Zeder's conditions. Zebras defeated domestication again and again; rhinos are highly aggressive; hippos — once imagined as a solution to Africa's protein needs — are among Africa's deadliest animals, because living beside crocodiles only the most aggressive survive. Europeans themselves, despite every effort, domesticated no medium or large African mammal. Africa eventually received goats, sheep, cattle and horses from SW Asia. Australia had no suitable medium-sized mammal: the kangaroo is a small-brained marsupial and the koala breeds very slowly; Aboriginal people hunted kangaroos for millennia, not from incapacity. In North America wild horses had disappeared (hunted) about 10,000 years earlier; the image of the expert Native rider stems from horses escaped from Europeans, which Native Americans readily re-tamed.", "nl": "Europees vooroordeel en het antwoord: Europeanen meenden dat Afrikanen te dom waren om zebra's of nijlpaarden te domesticeren. Maar elk van die dieren faalde op minstens één criterium; ook Europeanen slaagden er nooit in. Australië had geen geschikt middelgroot zoogdier. In Noord-Amerika waren paarden al uitgestorven; de ruiterbeelden gaan terug op ontsnapte Europese paarden."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "بز زاگرس و سه مسیرش: پاسخ این پرسش که چرا بز و گوسفند در جنوب‌غرب آسیا اهلی شدند ساده است: چون نیاکان وحشی‌شان — کِل یا بز وحشی و قوچ یا گوسفند وحشی — همین‌جا می‌زیستند؛ و چرا این‌جا می‌زیستند؟ گوینده می‌گوید فراتر از «جبر جغرافیایی» نمی‌توان رفت (بزهای وحشیِ سفیدِ کوهستان‌های آمریکای شمالی هم هستند، اما فیزیولوژی اهلی‌شدن ندارند). پژوهش‌ها نشان می‌دهد محوطهٔ گنج‌دره در زاگرس ایران از نخستین «زایشگاه‌های» بز اهلی بود: جایی که نیاکان ما بزهای وحشی را که هزاران سال کنارشان زیسته بودند آرام‌آرام نگه داشتند و گله ساختند. سپس امواج انسانیِ دامدار بز و گوسفند را با خود به شمال آفریقا، اروپا و آسیای مرکزی بردند. پژوهشی ژنتیکی در ۲۰۱۸ سه مسیر را برای رسیدن بز به اروپا و شمال آفریقا نشان داد: (۱) آناتولی و سپس امتداد رود دانوب به اروپای مرکزی و غربی؛ (۲) مسیر مدیترانه‌ای از کرانه‌های یونان و ایتالیا تا اسپانیا؛ (۳) مسیر شمال آفریقا تا مراکش. مقایسهٔ نشانگرهای ژنتیکی بزهای امروزِ این مناطق با بزهای ۱۰ تا ۱۱ هزارسالهٔ محوطه‌هایی چون آسیاب، تپه عبدالحسین و گنج‌دره نشان داد نیای همه به بزهای زاگرس بازمی‌گردد.", "en": "The Zagros goat and its three routes: why were goats and sheep domesticated in SW Asia? Because their wild ancestors — the bezoar goat and the wild sheep (mouflon/urial) — lived there; and why there? The speaker says one cannot go beyond 'geographic determinism' (North America has white mountain goats, but they lack the physiology for domestication). Research shows Ganj Dareh in Iran's Zagros was among the first 'birthplaces' of the domestic goat: our ancestors gradually kept wild goats they had lived beside for millennia and formed herds. Herding peoples then carried goats and sheep to North Africa, Europe and Central Asia. A 2018 genetic study traced three routes to Europe and North Africa: (1) Anatolia and up the Danube into central and western Europe; (2) a Mediterranean route along Greek and Italian coasts to Spain; (3) a North African route to Morocco. Comparing genetic markers of today's goats with 10–11,000-year-old goats from sites such as Asiab, Tepe Abdul Hosein and Ganj Dareh showed all descend from Zagros goats.", "nl": "De Zagros-geit en haar drie routes: de wilde voorouders leefden hier. Ganj Dareh in de Iraanse Zagros was een van de eerste 'geboorteplaatsen' van de huisgeit. Een genetische studie (2018) vond drie routes naar Europa en Noord-Afrika: via Anatolië en de Donau, langs de Middellandse Zee, en door Noord-Afrika. Alle gaan terug op Zagros-geiten."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "خوک و تابوی خوراکی: نخستین شواهد خوک اهلی (از گراز) به حدود ۱۰٬۵۰۰ سال پیش بازمی‌گردد؛ اهلی‌سازی آن احتمالاً در چند جا رخ داد، از جمله شرق آسیا و جنوب‌غرب آسیا. در این فرایند دست‌وپا کوتاه، مو کم، پوزه کوتاه و دندان‌های نیش کوچک شد. اما در جنوب‌غرب آسیا نگهداری خوک دوام نیافت: از حدود ۵ هزار سال پیش کم‌رنگ شد و حدود ۳۲۰۰ سال پیش تقریباً از میان رفت، در حالی که گراز وحشی همچنان شکار می‌شد؛ هم‌زمان در شرق آسیا و اروپا اوج گرفت. این هم‌زمان است با تابوی خوردن خوک که نخست نزد مصریان باستان دیده می‌شود و سپس در یهودیت و اسلام، اما نه در مسیحیت. توضیحی که برنامه از ماروین هریس (به نقل از کتاب درسیِ «انسان‌شناسی فرهنگی: نگاهی جهانی») نقل می‌کند بومشناختی-اقتصادی است: اقلیم گرم و خشک برای خوک مناسب نیست؛ خوک کوچ نمی‌کند، پشم نمی‌دهد، شیر چندانی نمی‌دهد و همه‌چیزخوار است و با انسان بر سر غلات، غده‌ها و سیب‌زمینی رقابت می‌کند؛ در حالی که بز و گوسفند علف‌خوارند، کوچ می‌کنند، پشم و شیر می‌دهند. نگهداری خوک دیگر به‌صرفه نبود و این واقعیت اقتصادی سرانجام شکل تابویی دینی یافت. مسیحیت با این باور که خوراک «دفع می‌شود و آسیبی نمی‌زند» این منع را برداشت؛ خوک با اقلیم اروپای مرکزی و غربی به‌خوبی سازگار شد و در جزایر اقیانوس آرام دارایی‌ای بسیار مهم ماند.", "en": "The pig and the food taboo: the earliest domestic pigs (from wild boar) date to about 10,500 years ago, probably domesticated in several places including East Asia and SW Asia; legs shortened, hair thinned, snouts shortened and tusks shrank. In SW Asia, though, pig-keeping did not last: it faded from about 5,000 years ago and had nearly vanished by about 3,200 years ago, while wild boar were still hunted — even as pigs flourished in East Asia and Europe. This coincides with a pork taboo seen first among ancient Egyptians, then in Judaism and Islam but not Christianity. The explanation cited from Marvin Harris (via the textbook Cultural Anthropology: Appreciating Cultural Diversity) is ecological and economic: hot dry climates suit pigs poorly; pigs do not migrate, give no wool and little milk, and as omnivores compete with people for grain and tubers, whereas goats and sheep graze, migrate and give wool and milk. Pig-keeping stopped paying, and this economic fact eventually took the form of a religious taboo. Christianity lifted the ban (food 'passes through' and does no harm); pigs thrived in central and western Europe and remained a key asset in the Pacific islands.", "nl": "Het varken en het voedseltaboe: varkens werden ~10.500 jaar geleden gedomesticeerd. In Zuidwest-Azië verdween het houden van varkens vanaf ~5.000 jaar geleden. Volgens Marvin Harris was dat ecologisch-economisch: varkens passen slecht bij een heet, droog klimaat, geven geen wol en weinig melk en concurreren om voedsel; geiten en schapen niet. Dat economische feit werd een religieus taboe (Egypte, jodendom, islam), dat het christendom ophief."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "گاو، اسب و یک سرنخ تاریخ‌گذاری: گاو حدود ۱۰٬۷۰۰ سال پیش در درهٔ فرات در سوریه از گاو وحشی (اوروکس، دو تا سه برابر بزرگ‌تر از گاو امروزی) اهلی شد؛ آخرین اوروکس در ۱۶۲۷ در لهستان مرد. برخلاف بز و گوسفند، گاو چند خاستگاه داشت: یکی در هلال حاصلخیز (به سوی اروپا و شمال آفریقا) و یکی گاوِ کوهان‌دار (زبو) در درهٔ سند (به سوی هند، عربستان و آفریقا)؛ و گاوهای دیگری چون یاک در تبت. اسب، به گفتهٔ برنامه، حدود پنج هزار سال پیش در استپ‌های اوراسیا اهلی شد و این اهلی‌سازی بر شکل‌گیری جوامع انسانی اثری ژرف گذاشت. گوینده از این‌جا سرنخی ساده برای ارزیابی ادعاها دربارهٔ سنگ‌نگاره‌های ایران بیرون می‌کشد: اگر در نقشی، اسب و سوارکار می‌بینید، مطمئن باشید کهن‌تر از حدود پنج هزار سال نیست؛ پس ادعای سی یا چهل یا دوازده هزارساله بودنِ چنین نقش‌هایی بی‌منطق است.", "en": "Cattle, horses and a dating clue: cattle were domesticated about 10,700 years ago in the Euphrates valley in Syria from the aurochs (two to three times larger than modern cattle); the last aurochs died in Poland in 1627. Unlike goats and sheep, cattle had several origins: one in the Fertile Crescent (spreading to Europe and North Africa), humped zebu in the Indus valley (spreading to India, Arabia and Africa), and others such as the yak in Tibet. The horse, the programme says, was domesticated about five thousand years ago on the Eurasian steppe, with profound effects on human societies. The speaker draws a simple test for claims about Iranian rock art: if a carving shows a horse and rider, it cannot be older than about five thousand years; claims that such images are 12, 30 or 40 thousand years old are illogical.", "nl": "Rund, paard en een dateringsaanwijzing: runderen werden ~10.700 jaar geleden in Syrië uit de oeros gedomesticeerd (laatste oeros: Polen, 1627), op meerdere plaatsen. Het paard ~5.000 jaar geleden op de steppe. Toets voor rotskunst in Iran: een paard met ruiter is nooit ouder dan ~5.000 jaar."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "شتر و مرغ: شتر دو گونه دارد: یک‌کوهانه و دوکوهانه (باختری). نیاکان دور شترسانان در آمریکای شمالی پدید آمدند، از راه سیبری به آسیای مرکزی رسیدند و برخی به عرض‌های پایین‌تر آمدند؛ اهلی‌سازی شتر حدود پنج هزار سال پیش رخ داد و با ورود به شبه‌جزیرهٔ عربستان و سازگاریِ فوق‌العاده با گرما و کم‌آبی، در برخی مناطق به برترین یا تنها جانورِ همراه انسان بدل شد. مرغ از قرقاول یا مرغ جنگلیِ جنوب‌شرق آسیا اهلی شد — برنامه حدود هشت هزار سال پیش را می‌گوید — و امروز یکی از مهم‌ترین منابع پروتین جهان است.", "en": "Camel and chicken: there are one-humped and two-humped (Bactrian) camels. Camelids originated in North America, crossed via Siberia to Central Asia and some moved to lower latitudes; camels were domesticated about five thousand years ago and, entering Arabia with superb adaptation to heat and water scarcity, became in places the main or only animal partner of humans. The chicken came from the red junglefowl of Southeast Asia — about 8,000 years ago, the programme says — and is now one of the world's main protein sources.", "nl": "Kameel en kip: kameelachtigen ontstonden in Noord-Amerika; de kameel werd ~5.000 jaar geleden gedomesticeerd. De kip stamt van het bankivahoen uit Zuidoost-Azië."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "محور شرقی-غربی و دام به‌عنوان «پول»: بیشترِ این جانوران از جنوب‌غرب آسیا در امتداد محوری شرقی-غربی به اروپا و آسیا رفتند، چون جانوران و گیاهان به زیستن در عرض‌های جغرافیایی مشابه — با طول روز، بارش و رطوبت یکسان — گرایش دارند؛ پس زودتر به شمال‌غرب آفریقا رسیدند تا اینکه هزاران کیلومتر در عرض آفریقا به جنوب بروند. گاه با جوامع انسانی کوچ کردند، گاه دست‌به‌دست به‌عنوان کالا. نکتهٔ مهم پایانی: بز و گوسفندِ نخستین دامداران حدود ۱۱ تا ۱۲ هزار سال پیش بیش از آنکه خوراک باشند، دارایی بودند — همان‌گونه که امروز روستانشینان و عشایر ایران هر شب کباب نمی‌خورند، بلکه در عزا و عروسی؛ خوراک روزانه‌شان بیشتر لبنیات، نان و برنج است، چون دامی که پشم و شیر و بچه می‌دهد، زنده ارزشمندتر است. معمولاً فقط نرهای اضافی و پیرها ذبح می‌شدند؛ دام وسیلهٔ مبادله و نوعی «پول رایج» آغاز یکجانشینی بود.", "en": "The east–west axis and livestock as 'money': most of these animals spread from SW Asia along an east–west axis to Europe and Asia, because animals and plants tend to thrive at similar latitudes with similar day length, rainfall and humidity; they reached northwest Africa sooner than they could travel thousands of kilometres south through Africa. Sometimes they moved with people, sometimes hand to hand as goods. A final point: for the first herders 11–12,000 years ago goats and sheep were wealth more than food — just as Iranian villagers and nomads today do not eat kebab every night but at funerals and weddings, living mostly on dairy, bread and rice, because an animal giving wool, milk and young is worth more alive. Usually only surplus males and old animals were slaughtered; livestock served as a medium of exchange, a kind of 'currency' in early settled life.", "nl": "Oost-westas en vee als 'geld': dieren verspreidden zich langs een oost-westas, omdat ze gedijen op vergelijkbare breedtegraden. Vee was eerder bezit dan voedsel — net als bij Iraanse dorpelingen en nomaden, die vlees vooral bij begrafenissen en bruiloften eten. Vee was een vroeg betaalmiddel."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "نقد و به‌روزرسانی: (۱) اهلی‌سازی اسب امروزی: پژوهش ژنتیکی لیبرادو و همکاران (نیچر، ۲۰۲۱) نشان داد تبار اسب‌های اهلیِ امروز (DOM2) حدود ۴۲۰۰ سال پیش در استپ‌های پایین ولگا-دون پدید آمد؛ اسب‌های بوتای (حدود ۵۵۰۰ سال) نیاکان اسب پرژوالسکی‌اند نه اسب امروزی. پس «اسب و سوار کهن‌تر از ۵ هزار سال نیست» همچنان معتبر و حتی محافظه‌کارانه است. (۲) اهلی‌سازی مرغ: پژوهش‌های تازه (پیترز و همکاران، ۲۰۲۲) آن را حدود ۳۵۰۰ سال پیش و پیوسته با کشت برنج در جنوب‌شرق آسیا می‌دانند، نه ۸ هزار سال. (۳) قدیمی‌ترین شواهد رابطهٔ انسان و گربه از قبرس (حدود ۹۵۰۰ سال) است. (۴) توضیح هریس دربارهٔ تابوی خوک کارکردگرایانه و تأثیرگذار، اما مورد نقد است: مری داگلاس آن را با منطق نمادینِ «پاکی و ناپاکی» توضیح می‌دهد و برخی باستان‌شناسان نقش تمایز هویتی و قومی را برجسته می‌کنند. (۵) «جبر جغرافیایی» دایموند نیز منتقدانی دارد که سهم انتخاب‌ها و نهادهای انسانی را بیشتر می‌دانند. (۶) شمارش اسب آبی به‌عنوان «کشنده‌ترین» جانور آفریقا در آمارها متغیر است (پشه بسیار بیشتر می‌کشد)؛ نکتهٔ درست این است که بسیار خطرناک است.", "en": "Critique and update: (1) Horse domestication: Librado et al. (Nature, 2021) showed the lineage of today's domestic horses (DOM2) arose about 4,200 years ago in the lower Volga–Don steppe; Botai horses (~5,500 years) are ancestors of Przewalski's horses, not modern ones. So 'no horse-and-rider older than ~5,000 years' still holds — conservatively. (2) Chicken domestication: recent work (Peters et al. 2022) places it about 3,500 years ago, linked to rice farming in Southeast Asia, not 8,000. (3) The earliest evidence of a human–cat bond is from Cyprus (~9,500 years). (4) Harris's pork-taboo explanation is functionalist and influential but criticised: Mary Douglas explains it through symbolic purity logic, and some archaeologists stress ethnic and identity boundaries. (5) Diamond's 'geographic determinism' also has critics who weigh human choices and institutions more. (6) Ranking the hippo as Africa's 'deadliest' animal varies by statistic (mosquitoes kill far more); the valid point is that it is very dangerous.", "nl": "Kritiek: (1) de lijn van het moderne huispaard ontstond ~4.200 jaar geleden (Librado e.a. 2021); de vuistregel voor rotskunst blijft dus gelden. (2) De kip werd volgens recent onderzoek ~3.500 jaar geleden gedomesticeerd. (3) Mens en kat: Cyprus ~9.500 jaar. (4) Harris' verklaring is omstreden (Mary Douglas: symbolische reinheid). (5) Diamonds determinisme heeft critici. (6) Het nijlpaard als 'dodelijkste' dier hangt af van de statistiek."}, "sources": ["src:60e7838a5a"], "flags": ["editor-note", "contested"]}, {"text": {"fa": "یادداشت خوانش: بر پایهٔ رونوشت خودکار یکی از اپیزودهای پادکستیِ «خداحافظ آفریقا» دربارهٔ اهلی‌سازی جانوران (شمارهٔ آن در رونوشت نیامده؛ پس از اپیزود سگ و پیش از اپیزود کشت گیاهان). آغاز رونوشت ناقص است. اپیزود مربوط به کشت گیاهان در دست نبود.", "en": "Reading note: based on the automatic transcript of a podcast episode on animal domestication (number not given; after the dog episode, before the plant episode). The start is incomplete; the plant-cultivation episode was not available.", "nl": "Leesnotitie: gebaseerd op het transcript van een podcastaflevering over domesticatie (nummer onbekend). De aflevering over planten was niet beschikbaar."}, "sources": ["src:60e7838a5a"], "flags": ["editor-note"]}], "links": [{"to": "tabar:zagros-neolithic", "rel": "see-also", "note": {"fa": "نوسنگی زاگرس و کشاورزان نخستین", "en": "the Zagros Neolithic", "nl": "het Zagros-neolithicum"}}, {"to": "tabar:near-east-first-farmers-structure", "rel": "see-also", "note": {"fa": "نخستین کشاورزان خاور نزدیک", "en": "first farmers of the Near East", "nl": "eerste boeren van het Nabije Oosten"}}, {"to": "tabar:darwin-domestic-variation", "rel": "see-also", "note": {"fa": "داروین و تنوع جانوران اهلی", "en": "Darwin on variation under domestication", "nl": "Darwin over variatie bij huisdieren"}}, {"to": "tabar:sapiens-sapiens-dog-art-animism", "rel": "see-also", "note": {"fa": "سگ، نخستین اهلی", "en": "the dog, the first domesticate", "nl": "de hond, het eerste huisdier"}}, {"to": "tabar:racial-bias-in-paleoanthropology", "rel": "see-also", "note": {"fa": "پیش‌داوری نژادی در تفسیر", "en": "racial bias in interpretation", "nl": "raciale vooringenomenheid"}}, {"to": "tabar:steppe-indo-iranian", "rel": "see-also", "note": {"fa": "استپ، اسب و هندوایرانیان", "en": "steppe, horse and Indo-Iranians", "nl": "steppe, paard en Indo-Iraniërs"}}, {"to": "soc:eastern-fertile-crescent-agriculture", "rel": "bridges", "note": {"fa": "کشاورزی در هلال حاصلخیز شرقی", "en": "agriculture in the eastern Fertile Crescent", "nl": "landbouw in de oostelijke Vruchtbare Sikkel"}}, {"to": "tabar:lactase-gene-culture", "rel": "see-also", "note": {"fa": "شیر و هم‌تکاملی ژن و فرهنگ", "en": "milk and gene–culture coevolution", "nl": "melk en gen-cultuurco-evolutie"}}], "sources": ["src:60e7838a5a"], "people": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:steppe-indo-iranian", "kind": "concept", "title": {"fa": "تبار استپی و زبان‌های هندوایرانی", "en": "Steppe ancestry and the Indo-Iranian languages", "nl": "Steppe-afstamming en de Indo-Iraanse talen"}, "aliases": [], "parent": "tabar:population-genetics", "field": "tabar:population-genetics", "summary": {"fa": "ژنتیک نشان می‌دهد در هزارهٔ دوم پیش از میلاد تباری از استپ اوراسیا به جنوب و میانهٔ آسیا رسید؛ این را با گسترش زبان‌های هندوایرانی پیوند می‌دهند. پیوند ژن و زبان اما استنباط است، نه مشاهده، و میان باستان‌شناسان و زبان‌شناسان محل بحث.", "en": "Genetics shows that in the second millennium BCE ancestry from the Eurasian steppe reached South and Central Asia; this is linked to the spread of Indo-Iranian languages. The gene–language link, however, is inference not observation, and is debated among archaeologists and linguists.", "nl": "Genetica toont dat in het tweede millennium v.Chr. afstamming uit de Euraziatische steppe Zuid- en Centraal-Azië bereikte; dit wordt gekoppeld aan de verspreiding van de Indo-Iraanse talen. De koppeling gen–taal is echter een gevolgtrekking, geen waarneming, en omstreden onder archeologen en taalkundigen."}, "points": [{"text": {"fa": "نراسیمهان و همکاران (۲۰۱۹): ۵۲۳ ژنوم باستانی از آسیای میانه و جنوبی؛ تبار استپی (یامنایا/سینتاشتا) در نیمهٔ دوم هزارهٔ دوم پیش از میلاد در منطقه ظاهر می‌شود و با تبار «کشاورزان ایرانی» و شکارچیان جنوب آسیا می‌آمیزد.", "en": "Narasimhan et al. (2019): 523 ancient genomes from Central and South Asia; steppe ancestry (Yamnaya/Sintashta) appears in the region in the second half of the second millennium BCE and mixes with \"Iranian farmer\" and South Asian hunter-gatherer ancestry.", "nl": "Narasimhan et al. (2019): 523 ancient genomes from Central and South Asia; steppe ancestry (Yamnaya/Sintashta) appears in the region in the second half of the second millennium BCE and mixes with \"Iranian farmer\" and South Asian hunter-gatherer ancestry."}, "sources": ["src:73a4e45469"], "flags": []}, {"text": {"fa": "همین مطالعه تأکید می‌کند تبار «ایرانیِ» جنوب آسیا از جمعیت زاگرس آمده، نه از مهاجرت هم‌زمان با کشاورزی؛ یعنی چند لایهٔ زمانی متفاوت.", "en": "The same study stresses that the \"Iranian\" ancestry of South Asia came from Zagros-related population, not from a migration contemporary with farming; several distinct time layers.", "nl": "The same study stresses that the \"Iranian\" ancestry of South Asia came from Zagros-related population, not from a migration contemporary with farming; several distinct time layers."}, "sources": ["src:73a4e45469"], "flags": []}, {"text": {"fa": "نقد: ژن زبان نمی‌گوید. تطبیق خوشهٔ ژنتیکی با «آریایی‌ها» یا یک زبان، فرضیه است و تاریخ سوءاستفاده‌های سیاسی از آن طولانی است. این صفحه پیوند ژن–زبان را «مطرح‌شده» می‌داند، نه اثبات‌شده.", "en": "Critique: genes do not speak a language. Matching a genetic cluster to \"the Aryans\" or to a language is a hypothesis, and the history of its political misuse is long. This page treats the gene–language link as proposed, not proven.", "nl": "Critique: genes do not speak a language. Matching a genetic cluster to \"the Aryans\" or to a language is a hypothesis, and the history of its political misuse is long. This page treats the gene–language link as proposed, not proven."}, "sources": ["src:8b730d2385"], "flags": ["contested", "editor-note"]}], "links": [{"to": "tabar:ancient-dna", "rel": "part-of", "note": {"fa": "یافته‌ای از دی‌ان‌ای باستانی", "en": "A finding from ancient DNA", "nl": "A finding from ancient DNA"}}, {"to": "tabar:race-biology", "rel": "see-also", "note": {"fa": "خطر سوءاستفادهٔ هویتی از خوشه‌های ژنتیکی", "en": "The risk of identity misuse of genetic clusters", "nl": "The risk of identity misuse of genetic clusters"}}], "people": ["core:david-reich"], "sources": ["src:73a4e45469", "src:8b730d2385"], "booklets": [], "origin": null, "iran": "iran:steppe-ancestry", "wikidata": null, "status": "draft"}, {"id": "tabar:race-versus-culture-levi-strauss", "kind": "concept", "title": {"fa": "جدایی نژاد از فرهنگ: خطای بنیادین نژادپرستی در روایت لوی‌استروس", "en": "Separating race from culture: racism's founding confusion in Lévi-Strauss", "nl": "Ras en cultuur scheiden: de grondfout van het racisme volgens Lévi-Strauss"}, "aliases": [], "parent": "tabar:genetics-society", "field": "tabar:genetics-society", "summary": {"fa": "لوی‌استروس در رسالهٔ یونسکو (۱۹۵۲) می‌گوید خطای اصلی نظریهٔ نژادی آن است که تفاوت زیستی گروه‌ها (به فرض وجود) را با تفاوت‌های روانی، اجتماعی و فرهنگی یکی می‌گیرد. او حتی «نژادگرایی وارونه» را هم رد می‌کند: نسبت‌دادن سهم ویژهٔ فرهنگی به هر نژاد، باز همان خطاست.", "en": "In his 1952 UNESCO essay Lévi-Strauss argues that racism's basic mistake is to merge supposed biological group differences with psychological, social and cultural ones. He also rejects the 'reverse' move of assigning each race its own cultural contribution.", "nl": "In zijn UNESCO-essay uit 1952 stelt Lévi-Strauss dat de kernfout van het racisme is dat biologische groepsverschillen worden vermengd met psychologische, sociale en culturele verschillen. Ook de omgekeerde stap, elk ras een eigen cultuurbijdrage toeschrijven, wijst hij af."}, "points": [{"text": {"fa": "کتاب بر آن است که هیچ برتری یا فروتری عقلانی نژادی را نمی‌توان با علم امروز (زمان نگارش) اثبات کرد.", "en": "The book holds that no intellectual superiority or inferiority of one race over another can be established by science (as of writing).", "nl": "The book holds that no intellectual superiority or inferiority of one race over another can be established by science (as of writing)."}, "sources": ["src:429130b6be"], "flags": []}, {"text": {"fa": "نویسنده گوبینو را مثال می‌آورد: او نابرابری نژادها را کیفی می‌دید و فساد جامعه را از آمیختگی نژادها می‌دانست؛ لوی‌استروس این را همان خلط زیست‌شناسی با فرهنگ می‌شمارد.", "en": "He takes Gobineau as the example: Gobineau saw races as qualitatively unequal and blamed social decline on racial mixing; Lévi-Strauss calls this a confusion of biology with culture.", "nl": "He takes Gobineau as the example: Gobineau saw races as qualitatively unequal and blamed social decline on racial mixing; Lévi-Strauss calls this a confusion of biology with culture."}, "sources": ["src:429130b6be"], "flags": []}, {"text": {"fa": "او هشدار می‌دهد که اثبات «سهم ویژهٔ هر گروه نژادی در تمدن» هم دوباره نظریهٔ نژادی را از در پشتی وارد می‌کند، چون ویژگی فرهنگی را به زیست‌شناسی گره می‌زند.", "en": "He warns that proving a 'special contribution of each racial group' to civilisation re-admits racial theory by the back door, since it ties culture to biology.", "nl": "He warns that proving a 'special contribution of each racial group' to civilisation re-admits racial theory by the back door, since it ties culture to biology."}, "sources": ["src:429130b6be"], "flags": []}, {"text": {"fa": "استدلال اصلی او این است که تفاوت فرهنگ‌ها را باید با تاریخ، تماس و همکاری جوامع توضیح داد، نه با سرشت زیستی.", "en": "His main claim is that cultural differences must be explained by history, contact and cooperation among societies, not by biological nature.", "nl": "His main claim is that cultural differences must be explained by history, contact and cooperation among societies, not by biological nature."}, "sources": ["src:429130b6be"], "flags": []}, {"text": {"fa": "دیدگاه رایج امروز: اجماع زیست‌شناسی و ژنتیک جمعیت نیز دسته‌بندی‌های «نژادی» کلاسیک را مقوله‌های زیستی دقیق نمی‌داند؛ تنوع ژنتیکی انسان پیوسته است و بیشترِ آن درون هر جمعیت است. این از کتاب نیست و به دانش روز بازمی‌گردد.", "en": "Current mainstream view: biology and population genetics do not treat classic 'racial' categories as sharp biological kinds; human genetic variation is largely continuous and mostly lies within populations. This is not from the book but from present-day science.", "nl": "Current mainstream view: biology and population genetics do not treat classic 'racial' categories as sharp biological kinds; human genetic variation is largely continuous and mostly lies within populations. This is not from the book but from present-day science."}, "sources": ["src:2e6fa65e13"], "flags": ["editor-note"]}], "links": [{"to": "tabar:race-biology", "rel": "see-also", "note": {"fa": "آیا «نژاد» مقولهٔ زیست‌شناختی است؟", "en": "Is race a biological category?", "nl": "Is race a biological category?"}}, {"to": "tabar:eugenics", "rel": "see-also", "note": {"fa": "به‌نژادی و تاریخ تاریک ژنتیک", "en": "Eugenics", "nl": "Eugenics"}}, {"to": "tabar:genetic-essentialism", "rel": "see-also", "note": {"fa": "ذات‌گرایی ژنتیکی", "en": "Genetic essentialism", "nl": "Genetic essentialism"}}, {"to": "soc:culture-concept-functions", "rel": "bridges", "note": {"fa": "مفهوم فرهنگ", "en": "The concept of culture", "nl": "The concept of culture"}}], "people": ["core:claude-l-vi-strauss", "core:arthur-de-gobineau"], "sources": ["src:2e6fa65e13", "src:429130b6be"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:darwin-natural-selection", "kind": "concept", "title": {"fa": "انتخاب طبیعی: هستهٔ استدلال داروین", "en": "Natural selection: the core of Darwin's argument", "nl": "Natuurlijke selectie: de kern van Darwins betoog"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "اگر جانداران کمی با هم فرق داشته باشند، فرق‌ها تا حدی به فرزندان برسد، و همه نتوانند زنده بمانند، آنگاه ویژگی‌های سودمند به‌طور میانگین در نسل‌ها بیشتر می‌شوند. داروین این فرایند را «انتخاب طبیعی» نامید و گفت با زمان بسیار طولانی می‌تواند ساختارها و گونه‌های تازه بسازد و همهٔ جانداران را به نیاکان مشترک برساند.", "en": "If organisms differ slightly, some differences are inherited, and not all can survive, then useful traits become more common over generations. Darwin called this natural selection and argued that over very long times it can build new structures and species and link all life to common ancestors.", "nl": "Als organismen licht verschillen, sommige verschillen erfelijk zijn en niet alle individuen overleven, worden nuttige eigenschappen algemener. Darwin noemde dit natuurlijke selectie en betoogde dat het over lange tijd nieuwe structuren en soorten kan vormen."}, "points": [{"text": {"fa": "استدلال سه پایه دارد: (۱) افراد یک جمعیت از نظر ویژگی‌ها فرق دارند؛ (۲) بخشی از این فرق‌ها به فرزندان می‌رسد؛ (۳) بیش از توان محیط زاده می‌شوند. نتیجه: کسانی که ویژگی‌هایشان در آن محیط کمی سودمندتر است، به‌طور میانگین بیشتر فرزند می‌گذارند و ویژگی‌ها در جمعیت جابه‌جا می‌شود.", "en": "The argument has three legs: (1) individuals in a population differ; (2) some of these differences are inherited; (3) more are born than the environment can support. Result: those whose traits are slightly more useful in that setting leave more offspring on average, and the population shifts.", "nl": "The argument has three legs: (1) individuals in a population differ; (2) some of these differences are inherited; (3) more are born than the environment can support. Result: those whose traits are slightly more useful in that setting leave more offspring on average, and the population shifts."}, "sources": ["src:84786f7bfa"], "flags": []}, {"text": {"fa": "داروین انتخاب طبیعی را «دستی ناظر» می‌داند که هر روز و هر ساعت در سراسر جهان تفاوت‌های کوچک را بررسی می‌کند؛ ولی تأکید می‌کند که این فرایند کور و بدون هدف از پیش‌تعیین‌شده است و لزوماً جانداران را «پیشرفته‌تر» نمی‌کند، فقط با محیطشان سازگارتر می‌کند. او همچنین از «درخت زندگی» و شاخه‌شدن گونه‌ها به‌جای یک نردبان خطی سخن می‌گوید.", "en": "Darwin pictures natural selection as constantly scrutinising small differences everywhere, but it has no preset goal and does not necessarily make organisms 'higher'; it only fits them better to their surroundings. He speaks of a 'tree of life' with branching lineages rather than a straight ladder.", "nl": "Darwin pictures natural selection as constantly scrutinising small differences everywhere, but it has no preset goal and does not necessarily make organisms 'higher'; it only fits them better to their surroundings. He speaks of a 'tree of life' with branching lineages rather than a straight ladder."}, "sources": ["src:84786f7bfa"], "flags": []}, {"text": {"fa": "تأیید: انتخاب طبیعی امروز مستقیم دیده شده است، مثلاً تغییر اندازهٔ نوک سهره‌های گالاپاگوس طی خشکسالی‌ها (پژوهش پیتر و رزمری گرانت) و مقاومت باکتری‌ها به آنتی‌بیوتیک. ژنتیک جمعیت در قرن بیستم (فیشر، رایت، هالدین) نشان داد انتخاب با وراثت مندلی هماهنگ است («ترکیب نوین»).", "en": "Confirmed: natural selection has been observed directly, for example in Galápagos finch beak sizes across droughts (the Grants' long-term study) and in antibiotic resistance of bacteria. Twentieth-century population genetics (Fisher, Wright, Haldane) showed selection fits Mendelian heredity (the 'modern synthesis').", "nl": "Confirmed: natural selection has been observed directly, for example in Galápagos finch beak sizes across droughts (the Grants' long-term study) and in antibiotic resistance of bacteria. Twentieth-century population genetics (Fisher, Wright, Haldane) showed selection fits Mendelian heredity (the 'modern synthesis')."}, "sources": ["src:9bfbba7cbd"], "flags": []}, {"text": {"fa": "اصلاح مهم: انتخاب تنها نیروی تکامل نیست. رانش ژنتیکی (تصادف در جمعیت‌های کوچک)، جریان ژن و جهش هم بر ترکیب ژنی اثر دارند؛ بخش بزرگی از تغییر در سطح مولکولی خنثی است (نظریهٔ خنثای کیمورا، ۱۹۶۸). همچنین هر ویژگی لزوماً «سازگاری» نیست؛ گولد و لوونتین (۱۹۷۹) از «تبیین‌های سازگاری‌گرایانه»ی بی‌پشتوانه انتقاد کردند.", "en": "Important correction: selection is not the only evolutionary force. Genetic drift (chance in small populations), gene flow and mutation also shape gene pools; much molecular change is neutral (Kimura's neutral theory, 1968). Nor is every trait an adaptation; Gould and Lewontin (1979) criticised unsupported 'just-so' adaptationist stories.", "nl": "Important correction: selection is not the only evolutionary force. Genetic drift (chance in small populations), gene flow and mutation also shape gene pools; much molecular change is neutral (Kimura's neutral theory, 1968). Nor is every trait an adaptation; Gould and Lewontin (1979) criticised unsupported 'just-so' adaptationist stories."}, "sources": ["src:a2a563ebeb", "src:992abe0681"], "flags": ["editor-note"]}], "links": [{"to": "tabar:mutation-selection-drift", "rel": "explains", "note": {"fa": "جهش، انتخاب و رانش (چارچوب امروزی)", "en": "Mutation, selection and drift (modern framework)", "nl": "Mutation, selection and drift (modern framework)"}}, {"to": "tabar:human-evolution", "rel": "part-of", "note": {"fa": "تکامل انسان", "en": "Human evolution", "nl": "Human evolution"}}, {"to": "tabar:lactase-gene-culture", "rel": "see-also", "note": {"fa": "تداوم لاکتاز؛ نمونه‌ای از انتخاب در انسان", "en": "Lactase persistence: an example of selection in humans", "nl": "Lactase persistence: an example of selection in humans"}}, {"to": "tabar:race-biology", "rel": "see-also", "note": {"fa": "آیا «نژاد» مقولهٔ زیست‌شناختی است؟", "en": "Is race a biological category?", "nl": "Is race a biological category?"}}, {"to": "tabar:darwin-sexual-selection", "rel": "see-also", "note": {"fa": "مدخل هم‌موضوع", "en": "Related entry", "nl": "Verwant lemma"}}], "people": ["core:charles-darwin", "core:alfred-russel-wallace", "core:ronald-a-fisher"], "sources": ["src:84786f7bfa", "src:992abe0681", "src:9bfbba7cbd", "src:a2a563ebeb"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:iq-heritability-debate", "kind": "concept", "title": {"fa": "بحث وراثت‌پذیری هوش و اثر فلین", "en": "The IQ heritability debate and the Flynn effect", "nl": "Het debat over erfelijkheid van IQ en het Flynn-effect"}, "aliases": [], "parent": "tabar:behavior-genetics", "field": "tabar:behavior-genetics", "summary": {"fa": "از مقالهٔ جنجالی جنسن (۱۹۶۹) تا اثر فلین: هوش درون جمعیت‌ها بسیار وراثت‌پذیر است و با این حال نمره‌های هوش در یک قرن حدود سه نمره در دهه بالا رفت. این دو واقعیت با هم سازگارند و درس مهمی دربارهٔ وراثت‌پذیری می‌دهند.", "en": "From Jensen's controversial 1969 article to the Flynn effect: IQ within populations is highly heritable, and yet IQ scores rose about three points per decade over a century. Both facts are compatible and teach an important lesson about heritability.", "nl": "Van Jensens omstreden artikel uit 1969 tot het Flynn-effect: IQ is binnen populaties sterk erfelijk, en toch stegen IQ-scores een eeuw lang met zo'n drie punten per decennium. Beide feiten zijn verenigbaar en leren iets belangrijks over erfelijkheid."}, "points": [{"text": {"fa": "جنسن (۱۹۶۹) استدلال کرد وراثت‌پذیری هوش حدود ۰٫۸ است و برنامه‌های جبرانی آموزشی اثر کمی داشته‌اند؛ و فرضیهٔ سهم ژنتیکی در تفاوت میانگین گروه‌های نژادی را مطرح کرد. مقاله یکی از پرمناقشه‌ترین متون تاریخ روان‌شناسی شد.", "en": "Jensen (1969) argued that IQ heritability is about 0.8 and compensatory education had little effect, and raised the hypothesis of a genetic share in mean differences between racial groups. The article became one of the most contested texts in psychology.", "nl": "Jensen (1969) argued that IQ heritability is about 0.8 and compensatory education had little effect, and raised the hypothesis of a genetic share in mean differences between racial groups. The article became one of the most contested texts in psychology."}, "sources": ["src:c25a1254f7"], "flags": ["contested"]}, {"text": {"fa": "خطای منطقی مرکزی که منتقدان نشان دادند: وراثت‌پذیری بالا درون گروه هیچ چیز دربارهٔ علت تفاوت بین گروه‌ها نمی‌گوید (مثال بذرهای یکسان در دو خاک متفاوت).", "en": "The central logical error critics pointed out: high heritability within a group says nothing about the cause of differences between groups (the same seeds in two different soils).", "nl": "The central logical error critics pointed out: high heritability within a group says nothing about the cause of differences between groups (the same seeds in two different soils)."}, "sources": ["src:ba8f3ee8f4"], "flags": []}, {"text": {"fa": "اثر فلین: در ۱۴ کشور نمرهٔ هوش خام در یک نسل ۵ تا ۲۵ نمره بالا رفت؛ فراتحلیل ۲۰۱۵ (۴ میلیون نفر، ۳۱ کشور): حدود ۳ نمره در دهه، با کند شدن در دهه‌های اخیر. ژن‌ها در یک نسل عوض نمی‌شوند؛ پس این محیط است.", "en": "The Flynn effect: in 14 nations raw IQ scores rose 5 to 25 points in a generation; a 2015 meta-analysis (4 million people, 31 countries): about 3 points per decade, slowing recently. Genes do not change in a generation; this is environment.", "nl": "The Flynn effect: in 14 nations raw IQ scores rose 5 to 25 points in a generation; a 20
