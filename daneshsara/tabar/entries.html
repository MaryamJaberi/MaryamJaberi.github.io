.links .ext{font-size:var(--chip);color:var(--ink-3)}

:root[data-theme=dark] .flag.unreplicated{background:#3A1F1F;color:#F2B8B8;border-color:#6B3A3A} :root[data-theme=dark] .flag.contested,:root[data-theme=dark] .draft{background:#3A3010;color:#F0D78A;border-color:#6B5A2A}

<script>
const D = {"wiki": "tabar", "order": ["tabar:behavior-genetics", "tabar:population-genetics", "tabar:human-evolution", "tabar:epigenetics", "tabar:medical-genetics", "tabar:genealogy", "tabar:genetics-society"], "concepts": [{"id": "tabar:darwin-classification-descent", "kind": "concept", "title": {"fa": "رده‌بندی، اندام‌های ناکارا و جنین‌شناسی به‌عنوان شاهد نیای مشترک", "en": "Classification, rudimentary organs and embryology as evidence of common descent", "nl": "Classificatie, rudimentaire organen en embryologie als bewijs voor gemeenschappelijke afstamming"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "داروین می‌گوید رده‌بندیِ تو در توی جانداران (گونه در جنس در خانواده) همان «شجرهٔ نسب» است، نه فقط طرحی برای آسانی. شباهت ساختاری اندام‌ها (مثل بازوی انسان و بال خفاش)، اندام‌های بی‌کارکرد و شباهت جنین‌ها همه با نیای مشترک بهتر توضیح داده می‌شوند تا با طرح‌های جداگانهٔ آفرینش. او در پایان کتاب تنها اشاره‌ای کوتاه به انسان می‌کند.", "en": "Darwin argues that the nested classification of life (species within genus within family) is a family tree, not just a filing system. Structural likeness (human arm, bat wing), useless organs and similar embryos fit common descent better than separate design plans. At the close he makes only a brief allusion to humans.", "nl": "Darwin stelt dat de geneste classificatie van het leven in feite een stamboom is. Structurele gelijkenis, rudimentaire organen en gelijkende embryo's passen beter bij gemeenschappelijke afstamming. Over de mens zegt hij aan het einde slechts kort iets."}, "points": [{"text": {"fa": "جانداران طوری رده‌بندی می‌شوند که گروه‌ها درون گروه‌های بزرگ‌تر جا می‌گیرند. داروین می‌گوید پیوند پنهانی که طبیعی‌شناسان با «شباهت» دنبال می‌کردند، در واقع نسب مشترک است. او شباهت‌های ساختاری میان اندام‌های بسیار متفاوت از نظر کارکرد (دست، بال، باله) را مثل هم‌ریشگی (هومولوژی) می‌بیند.", "en": "Organisms fall into groups inside larger groups. Darwin says the hidden bond naturalists were seeking in 'resemblance' is actually shared descent. He treats structural likeness among organs with very different functions (hand, wing, flipper) as homology.", "nl": "Organisms fall into groups inside larger groups. Darwin says the hidden bond naturalists were seeking in 'resemblance' is actually shared descent. He treats structural likeness among organs with very different functions (hand, wing, flipper) as homology."}, "sources": ["src:84786f7bfa"], "flags": []}, {"text": {"fa": "اندام‌های ناکارا (نیمه‌ازبین‌رفته) مثل بال‌های ریز برخی سوسک‌ها یا استخوان‌های لگن نهنگ، با «ناستفاده» و انتخاب توضیح داده می‌شوند و از شاهدهای مهم‌اند. جنین‌شناسی هم مشابه است: جنین‌های گروه‌های مختلف شبیه‌ترند از بالغ‌هایشان، چون ساختار نیای مشترک را بازتاب می‌دهند.", "en": "Rudimentary organs (reduced and useless), such as tiny wings in some beetles, are explained by disuse and selection and count as important evidence. Embryology is parallel: embryos of different groups resemble each other more than adults do, reflecting a shared ancestral plan.", "nl": "Rudimentary organs (reduced and useless), such as tiny wings in some beetles, are explained by disuse and selection and count as important evidence. Embryology is parallel: embryos of different groups resemble each other more than adults do, reflecting a shared ancestral plan."}, "sources": ["src:84786f7bfa"], "flags": []}, {"text": {"fa": "تأیید مولکولی: مقایسهٔ توالی دی‌ان‌ای و پروتئین‌ها درخت‌هایی می‌دهد که با رده‌بندی بر پایهٔ ساختار هم‌خوانی چشمگیر دارد. ژنوم انسان و شامپانزه حدود ۹۸–۹۹ درصد در بخش قابل مقایسه شبیه است. دی‌ان‌ای باستانی هم نشان داده انسان‌های امروزی و نئاندرتال‌ها آمیخته‌اند، پس «درخت» گاهی شبکه‌ای هم می‌شود.", "en": "Molecular confirmation: comparing DNA and protein sequences gives trees strikingly consistent with structure-based classification. Human and chimpanzee genomes are about 98–99% similar in comparable regions. Ancient DNA has shown modern humans and Neanderthals interbred, so the 'tree' is sometimes also a network.", "nl": "Molecular confirmation: comparing DNA and protein sequences gives trees strikingly consistent with structure-based classification. Human and chimpanzee genomes are about 98–99% similar in comparable regions. Ancient DNA has shown modern humans and Neanderthals interbred, so the 'tree' is sometimes also a network."}, "sources": ["src:ca65b3b7c6"], "flags": ["editor-note"]}, {"text": {"fa": "اصلاح دربارهٔ جنین‌شناسی: برداشت قدیمی «رشد جنین، تکرار کامل تاریخ تکاملی است» (هکل، که پس از داروین آمد) نادرست است. جنین‌ها شباهت‌هایی دارند ولی تکرار مراحل بزرگسالی نیاکان را نمی‌بینیم. دربارهٔ انسان، داروین فقط می‌نویسد روشنی بر منشأ انسان و تاریخ او خواهد افتاد؛ بحث تفصیلی را در «تبار انسان» (۱۸۷۱) آورد.", "en": "Correction on embryology: the old claim that 'embryo development fully replays evolutionary history' (Haeckel, after Darwin) is wrong. Embryos share features, but they do not replay the adult stages of ancestors. On humans, Darwin merely writes that light will be thrown on human origins; the detailed treatment came in The Descent of Man (1871).", "nl": "Correction on embryology: the old claim that 'embryo development fully replays evolutionary history' (Haeckel, after Darwin) is wrong. Embryos share features, but they do not replay the adult stages of ancestors. On humans, Darwin merely writes that light will be thrown on human origins; the detailed treatment came in The Descent of Man (1871)."}, "sources": ["src:84786f7bfa"], "flags": ["dated", "editor-note"]}], "links": [{"to": "tabar:neanderthal-admixture", "rel": "see-also", "note": {"fa": "آمیزش با نئاندرتال‌ها و دنیسوواها", "en": "Admixture with Neanderthals and Denisovans", "nl": "Admixture with Neanderthals and Denisovans"}}, {"to": "tabar:human-genome", "rel": "see-also", "note": {"fa": "ژنوم انسان", "en": "The human genome", "nl": "The human genome"}}, {"to": "tabar:common-ancestors", "rel": "see-also", "note": {"fa": "ریاضی نیاکان", "en": "The mathematics of ancestors", "nl": "The mathematics of ancestors"}}, {"to": "tabar:human-evolution", "rel": "part-of", "note": {"fa": "تکامل انسان", "en": "Human evolution", "nl": "Human evolution"}}], "people": ["core:charles-darwin", "core:ernst-haeckel"], "sources": ["src:84786f7bfa", "src:ca65b3b7c6"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:indo-european-origin-debate", "kind": "concept", "title": {"fa": "خاستگاه زبان‌های هندواروپایی: فرضیهٔ استپ، فرضیهٔ آناتولی و دیدگاه رایش", "en": "Origin of Indo-European languages: steppe vs Anatolian hypothesis and Reich's view", "nl": "Oorsprong van de Indo-Europese talen: steppe- versus Anatolische hypothese en Reichs visie"}, "aliases": [], "parent": "tabar:population-genetics", "field": "tabar:population-genetics", "summary": {"fa": "رایش می‌گوید ژنتیک باستانی «آخرین حرف» را درباره منشأ هندواروپایی نمی‌زند، اما فرضیهٔ آناتولیِ رنفرو را ناکارا کرده و نقش دامداران یامنایا را در پخش بیشتر این زبان‌ها محتمل ساخته است. او حدس می‌زند زبان نخستین هندواروپایی در جنوب قفقاز (شاید ایران یا ارمنستان) گویش می‌شد. زبان‌شناسان و باستان‌شناسان این تصویر را هنوز به‌طور کامل نپذیرفته‌اند.", "en": "Reich says ancient DNA does not give the final word on the origin of Indo-European, but it has undermined Renfrew's Anatolian hypothesis and made a role for Yamnaya herders in spreading most of these languages likely. He guesses that the earliest Indo-European was spoken south of the Caucasus (perhaps Iran or Armenia). Linguists and archaeologists have not fully accepted this picture.", "nl": "Reich zegt dat oud DNA het laatste woord niet geeft, maar de Anatolische hypothese van Renfrew heeft verzwakt en een rol van Yamnaya-herders waarschijnlijk maakt. Hij vermoedt dat Proto-Indo-Europees ten zuiden van de Kaukasus (misschien Iran of Armenië) werd gesproken. Taalkundigen en archeologen hebben dit beeld nog niet volledig aanvaard."}, "points": [{"text": {"fa": "دو فرضیه رقیب‌اند. فرضیهٔ آناتولی (کالین رنفرو، ۱۹۸۷): زبان‌ها با کشاورزان ترکیه پس از ۹ هزار سال پیش پخش شد. فرضیهٔ استپ (از جمله دیوید آنتونی): واژگان مشترک «ارابه و چرخ» در شاخه‌های زندهٔ این خانواده نشان می‌دهد نیای مشترک بیش از حدود ۶ هزار سال پیش نمی‌زیسته و باید با یامنایا مرتبط باشد.", "en": "Two hypotheses compete. The Anatolian hypothesis (Colin Renfrew, 1987): the languages spread with farmers from Turkey after 9,000 years ago. The steppe hypothesis (e.g. David Anthony): shared vocabulary for wagons and wheels across the living branches indicates a common ancestor no older than about 6,000 years, linked to the Yamnaya.", "nl": "Two hypotheses compete. The Anatolian hypothesis (Colin Renfrew, 1987): the languages spread with farmers from Turkey after 9,000 years ago. The steppe hypothesis (e.g. David Anthony): shared vocabulary for wagons and wheels across the living branches indicates a common ancestor no older than about 6,000 years, linked to the Yamnaya."}, "sources": ["src:a4f00f41ff", "src:293bb0dd11", "src:cf43544e1c"], "flags": []}, {"text": {"fa": "استدلال رایش: ژنوم‌ها نشان می‌دهند مهاجرتی انبوه از استپ هم به اروپا و هم به هند رسیده. چون جابه‌جایی انبوه مردم معمولاً شرط تغییر زبان است، او نتیجه می‌گیرد دست‌کم بیشتر زبان‌های هندواروپایی اروپا و هند با یامنایا پخش شده‌اند. ژنتیک خودش زبان مردم را نمی‌گوید؛ فقط نشان می‌دهد مهاجرتی رخ داده است.", "en": "Reich's argument: genomes show a mass migration from the steppe into both Europe and India. Because mass movement of people is usually needed for language replacement, he concludes that at least most Indo-European languages of Europe and India were spread by the Yamnaya. Genetics does not reveal which language people spoke; it shows that a migration happened.", "nl": "Reich's argument: genomes show a mass migration from the steppe into both Europe and India. Because mass movement of people is usually needed for language replacement, he concludes that at least most Indo-European languages of Europe and India were spread by the Yamnaya. Genetics does not reveal which language people spoke; it shows that a migration happened."}, "sources": ["src:a4f00f41ff"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "نظر خاص رایش دربارهٔ خانهٔ نخستین: زبان‌های آناتولی (مثل هیتی) واژگان کامل چرخ را ندارند و در ژنوم‌های باستانی آناتولی ردپای تبار یامنایا نیست؛ پس او فکر می‌کند گویندگان زبان نخستین احتمالاً جنوب قفقاز، شاید ایران یا ارمنستان، می‌زیستند و یک شاخه به استپ و شاخهٔ دیگر به آناتولی رفت. خودش این را «به نظر من محتمل‌ترین» می‌نامد، نه چیزی اثبات‌شده.", "en": "Reich's own view on the original homeland: Anatolian languages such as Hittite lack the full wheel vocabulary and ancient Anatolian genomes show no Yamnaya-type ancestry, so he thinks the first speakers probably lived south of the Caucasus, perhaps in Iran or Armenia, with one branch going to the steppe and another to Anatolia. He himself presents this as what seems most likely to him, not as established.", "nl": "Reich's own view on the original homeland: Anatolian languages such as Hittite lack the full wheel vocabulary and ancient Anatolian genomes show no Yamnaya-type ancestry, so he thinks the first speakers probably lived south of the Caucasus, perhaps in Iran or Armenia, with one branch going to the steppe and another to Anatolia. He himself presents this as what seems most likely to him, not as established."}, "sources": ["src:a4f00f41ff"], "flags": ["editor-note"]}, {"text": {"fa": "نظرهای مخالف: زبان‌شناسان گفته‌اند درخت‌های زبانی بر پایهٔ شمارش واژه‌ها ریشهٔ قدیم‌تری (نزدیک ۸ هزار سال) برای شاخهٔ آناتولی نشان می‌دهد و به یک مدل ترکیبی می‌رسند: ریشه در جنوب قفقاز یا آناتولی و گسترش ثانویهٔ استپ (هگرتی و همکاران، ۲۰۲۳). نمونه‌های ژنوم از قلمرو هیتی‌ها هم تبار استپی نداشتند، پس زبان لزوماً همراه ژن جابه‌جا نمی‌شود. بحث ادامه دارد و هر دو طرف دلیل دارند.", "en": "Opposing views: linguists using word-based phylogenetic trees obtain an older root (about 8,000 years) for the Anatolian branch and propose a hybrid model: a root in the south Caucasus or Anatolia with a secondary spread from the steppe (Heggarty et al. 2023). Genomes from Hittite-era Anatolia also lack steppe ancestry, showing that language does not always travel with genes. The debate continues and both sides have arguments.", "nl": "Opposing views: linguists using word-based phylogenetic trees obtain an older root (about 8,000 years) for the Anatolian branch and propose a hybrid model: a root in the south Caucasus or Anatolia with a secondary spread from the steppe (Heggarty et al. 2023). Genomes from Hittite-era Anatolia also lack steppe ancestry, showing that language does not always travel with genes. The debate continues and both sides have arguments."}, "sources": ["src:d459916ece", "src:fba3aacdc7"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "رایش دربارهٔ «آریایی‌ها» هشدار می‌دهد: یامنایا و فرهنگ‌های پس از آن خودشان آمیزه بودند، پس تصور گروهی ناب و برتر با داده‌ها نمی‌خواند. هم‌زمان ژن و زبان یک چیز نیستند: وابستگی زبانی هندواروپایی به معنای تبار مشترک نیست و خطای رایج است که «آریایی» را قومی زیستی بدانیم. «آریا» در متن‌های هندی و ایرانی کهن اصطلاحی فرهنگی-زبانی است.", "en": "On 'Aryans' Reich cautions that the Yamnaya and later cultures were themselves mixtures, so the idea of a pure, superior group does not fit the data. Genes and language are also not the same thing: belonging to the Indo-European family does not mean shared descent, and treating 'Aryan' as a biological ethnicity is a common error. In ancient Indian and Iranian texts 'arya' is a cultural-linguistic term.", "nl": "On 'Aryans' Reich cautions that the Yamnaya and later cultures were themselves mixtures, so the idea of a pure, superior group does not fit the data. Genes and language are also not the same thing: belonging to the Indo-European family does not mean shared descent, and treating 'Aryan' as a biological ethnicity is a common error. In ancient Indian and Iranian texts 'arya' is a cultural-linguistic term."}, "sources": ["src:a4f00f41ff"], "flags": ["contested", "editor-note"]}], "links": [{"to": "tabar:steppe-indo-iranian", "rel": "explains", "note": {"fa": "شاخهٔ هندوایرانی و تبار استپی", "en": "The Indo-Iranian branch and steppe ancestry", "nl": "The Indo-Iranian branch and steppe ancestry"}}, {"to": "tabar:europe-three-streams-yamnaya", "rel": "see-also", "note": {"fa": "جزئیات ژنتیکی یامنایا", "en": "Genetic details of the Yamnaya", "nl": "Genetic details of the Yamnaya"}}, {"to": "tabar:india-two-migrations-ani-asi", "rel": "see-also", "note": {"fa": "گسترش در هند", "en": "The spread in India", "nl": "The spread in India"}}, {"to": "tabar:iranian-farmer-legacy", "rel": "see-also", "note": {"fa": "میراث کشاورزان ایرانی", "en": "Legacy of Iranian farmers", "nl": "Legacy of Iranian farmers"}}], "people": ["core:colin-renfrew", "core:david-w-anthony", "core:william-jones"], "sources": ["src:293bb0dd11", "src:a4f00f41ff", "src:cf43544e1c", "src:d459916ece", "src:fba3aacdc7"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:darwin-struggle-for-existence", "kind": "concept", "title": {"fa": "مبارزه برای هستی و فشار جمعیت", "en": "The struggle for existence and population pressure", "nl": "De strijd om het bestaan en bevolkingsdruk"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "داروین با الهام از مالتوس می‌گوید همهٔ جانداران بیش از آنچه محیط می‌تواند نگه دارد زاده می‌شوند، پس بسیاری از آنها نابود می‌شوند. «مبارزه» در اینجا به‌معنای وابستگی و رقابت برای ماندن و فرزند گذاشتن است، نه همیشه جنگ مستقیم.", "en": "Inspired by Malthus, Darwin says all organisms are born in greater numbers than the environment can support, so most die. 'Struggle' here means dependence and competition to survive and leave offspring, not always direct fighting.", "nl": "Geïnspireerd door Malthus stelt Darwin dat alle organismen in grotere aantallen worden geboren dan het milieu kan dragen, zodat de meeste omkomen. 'Strijd' betekent hier afhankelijkheid en concurrentie, niet altijd direct gevecht."}, "points": [{"text": {"fa": "هر گونه‌ای، حتی کندزاترین، اگر مانعی نبود، در چند نسل زمین را پر می‌کرد. چون جمعیت‌ها در عمل تقریباً ثابت می‌مانند، بیشترِ زاده‌شده‌ها پیش از تولیدمثل می‌میرند. داروین این را «آموزهٔ مالتوس، اما در کل جهان زنده» می‌نامد.", "en": "Any species, even a slow breeder, would fill the earth within a few generations if nothing held it back. Because populations stay roughly stable, most of those born die before reproducing. Darwin calls this Malthus's doctrine applied to the whole living world.", "nl": "Any species, even a slow breeder, would fill the earth within a few generations if nothing held it back. Because populations stay roughly stable, most of those born die before reproducing. Darwin calls this Malthus's doctrine applied to the whole living world."}, "sources": ["src:84786f7bfa", "src:6b6570c31d"], "flags": []}, {"text": {"fa": "او می‌گوید «مبارزه» را باید گسترده فهمید: گیاهی در لبهٔ بیابان برای آب با خشکی «می‌جنگد»، و دو گونه ممکن است برای غذا یا برای زنده‌ماندن در برابر شکارچی رقابت کنند. بسیاری از بازدارنده‌ها (سرما، قحطی، بیماری، شکارچی) به‌شکل پیچیده‌ای در یک شبکه به هم وابسته‌اند.", "en": "He insists the term be read broadly: a plant at the desert's edge 'struggles' against drought, and two species may compete for food or for survival against a predator. Many checks (cold, famine, disease, predators) are tied together in a complex web.", "nl": "He insists the term be read broadly: a plant at the desert's edge 'struggles' against drought, and two species may compete for food or for survival against a predator. Many checks (cold, famine, disease, predators) are tied together in a complex web."}, "sources": ["src:84786f7bfa"], "flags": []}, {"text": {"fa": "داروین رقابت را بیشتر میان نزدیک‌ترینِ خویشاوندان (هم‌گونه‌ها و هم‌جنس‌ها) تندتر می‌داند، چون نیازهایشان بیشتر شبیه است. این نکته بعدها در بوم‌شناسی با عنوان «حذف رقابتی» و «جدایی آشیان» دنبال شد.", "en": "Darwin thought competition is fiercest between close relatives (same species and genus) since their needs overlap most. Ecology later developed this as competitive exclusion and niche partitioning.", "nl": "Darwin thought competition is fiercest between close relatives (same species and genus) since their needs overlap most. Ecology later developed this as competitive exclusion and niche partitioning."}, "sources": ["src:84786f7bfa"], "flags": ["editor-note"]}, {"text": {"fa": "هشدار دربارهٔ برداشت نادرست: عبارت «بقای اصلح» را بعدها هربرت اسپنسر ساخت و داروین از چاپ‌های بعدی به کار گرفت. این عبارت نباید به «قدرتمندترین» یا توجیه نابرابری اجتماعی ترجمه شود؛ در زیست‌شناسی یعنی بهتر سازگار با محیط و پرفرزندتر. «داروینیسم اجتماعی» برداشتی سیاسی است که خود داروین آن را نساخت و دانشمندان آن را رد کرده‌اند.", "en": "Caution about misreadings: the phrase 'survival of the fittest' was coined by Herbert Spencer and adopted by Darwin only in later editions. It does not mean 'strongest' or justify social inequality; in biology it means better fitted to the environment and leaving more offspring. 'Social Darwinism' is a political reading that Darwin did not create and that scholars reject.", "nl": "Caution about misreadings: the phrase 'survival of the fittest' was coined by Herbert Spencer and adopted by Darwin only in later editions. It does not mean 'strongest' or justify social inequality; in biology it means better fitted to the environment and leaving more offspring. 'Social Darwinism' is a political reading that Darwin did not create and that scholars reject."}, "sources": [], "flags": ["contested", "editor-note"]}], "links": [{"to": "tabar:eugenics", "rel": "see-also", "note": {"fa": "به‌نژادی؛ نمونهٔ سوءاستفاده از زبان تکاملی", "en": "Eugenics: a case of misusing evolutionary language", "nl": "Eugenics: a case of misusing evolutionary language"}}, {"to": "tabar:mutation-selection-drift", "rel": "see-also", "note": {"fa": "جهش، انتخاب و رانش", "en": "Mutation, selection and drift", "nl": "Mutation, selection and drift"}}, {"to": "tabar:human-evolution", "rel": "part-of", "note": {"fa": "تکامل انسان", "en": "Human evolution", "nl": "Human evolution"}}, {"to": "soc:demography", "rel": "see-also", "note": {"fa": "مدخل هم‌موضوع", "en": "Related entry", "nl": "Verwant lemma"}}], "people": ["core:thomas-robert-malthus", "core:herbert-spencer"], "sources": ["src:6b6570c31d", "src:84786f7bfa"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:genetics-society", "kind": "field", "title": {"fa": "ژن، نژاد و اخلاق", "en": "Genes, race & ethics", "nl": "Genen, ras & ethiek"}, "aliases": [], "parent": "tabar:tabar", "field": null, "summary": {"fa": "آیا «نژاد» مقولهٔ زیست‌شناختی است؟ ژنتیک چه خطاهای فکری می‌سازد و چه سابقهٔ تاریکی دارد؟", "en": "Is \"race\" a biological category? What thinking errors does genetics invite, and what dark history does it carry?", "nl": "Is \"ras\" een biologische categorie? Welke denkfouten lokt genetica uit, en welke donkere geschiedenis draagt ze mee?"}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:primates-ape-ancestry-molecular-clock", "kind": "concept", "title": {"fa": "ما نخستی‌ایم: ریشهٔ میمونی انسان و ساعت مولکولی", "en": "We are primates: ape ancestry and the molecular clock", "nl": "Wij zijn primaten: apenafstamming en de moleculaire klok"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "نویسندگان از جایگاه انسان در درخت نخستی‌ها شروع می‌کنند: انسان یک گونهٔ نخستی است و ویژگی‌های پستانداران را دارد. آنها یادآوری می‌کنند که فرضیهٔ داروین دربارهٔ آفریقا به‌عنوان زادگاه انسان با زیست‌شناسی مولکولی تأیید شده و «ساعت مولکولی» زمان جدایی انسان از شامپانزه را حدود ۶ میلیون سال پیش نشان می‌دهد.", "en": "The authors start from humanity's place on the primate tree: Homo sapiens is one primate species sharing mammalian traits. They note that Darwin's guess of an African origin has been backed by molecular biology, and that the molecular clock puts the split from chimpanzees at about 6 million years ago.", "nl": "De auteurs plaatsen de mens in de stamboom van de primaten: Homo sapiens is één primatensoort. Darwins Afrikaanse oorsprong wordt door moleculaire biologie bevestigd; de moleculaire klok dateert de splitsing van chimpansees rond 6 miljoen jaar geleden."}, "points": [{"text": {"fa": "به نوشتهٔ نویسندگان، انسان خردمند (نامی که لینه در ۱۷۵۸ داد) فقط یک فصل از تاریخ طبیعی گروه نخستی‌هاست. ما مثل بقیهٔ پستانداران موی بدن داریم، دمای بدنمان را تنظیم می‌کنیم و نوزاد در بدن مادر رشد می‌کند و پس از تولد شیر می‌خورد.", "en": "The authors present H. sapiens (named by Linnaeus in 1758) as just one episode in the natural history of primates, sharing mammalian traits: body hair, temperature regulation, internal gestation and nursing.", "nl": "The authors present H. sapiens (named by Linnaeus in 1758) as just one episode in the natural history of primates, sharing mammalian traits: body hair, temperature regulation, internal gestation and nursing."}, "sources": ["src:64c357a843"], "flags": []}, {"text": {"fa": "نخستی‌ها دست‌کم به ۶۵ میلیون سال پیش، پایان دورهٔ دایناسورها، برمی‌گردند و امروز بیش از ۴۰۰ گونهٔ زنده از آنها هست که بیشترشان در مناطق گرمسیری‌اند. میمون‌های انسان‌نما (هومینوییده‌آ) پس از حدود ۳۵ میلیون سال پیش گسترش یافتند؛ گونه‌های زندهٔ آنها گیبون‌ها (۱۳ گونه)، اورانگوتان‌ها، گوریل‌ها و شامپانزه‌هاست.", "en": "The primate line reaches back before 65 Mya; more than 400 species live today, mostly in the tropics. The apes (Hominoidea) expanded after about 35 Mya; living members are gibbons (13 species), orangutans, gorillas and chimpanzees.", "nl": "The primate line reaches back before 65 Mya; more than 400 species live today, mostly in the tropics. The apes (Hominoidea) expanded after about 35 Mya; living members are gibbons (13 species), orangutans, gorillas and chimpanzees."}, "sources": ["src:64c357a843"], "flags": []}, {"text": {"fa": "داروین در ۱۸۷۱ حدس زد انسان در آفریقا پدید آمده، چون میمون‌های بزرگ آفریقایی (گوریل و شامپانزه) به ما نزدیک‌ترند. نویسندگان می‌گویند زیست‌شناسی مولکولی این حدس را تأیید کرده است. به گفتهٔ آنها نیای مشترک ما و شامپانزه حدود ۶ میلیون سال پیش می‌زیسته، جدایی گوریل کمی زودتر (حدود ۸) و جدایی اورانگوتان پیش از ۱۴ میلیون سال پیش بوده است.", "en": "Darwin guessed in 1871 that humans arose in Africa because the African great apes are closest to us; the authors say molecular biology has confirmed this. They give divergence times: chimpanzee about 6 Mya, gorilla about 8 Mya, orangutan before 14 Mya.", "nl": "Darwin guessed in 1871 that humans arose in Africa because the African great apes are closest to us; the authors say molecular biology has confirmed this. They give divergence times: chimpanzee about 6 Mya, gorilla about 8 Mya, orangutan before 14 Mya."}, "sources": ["src:64c357a843", "src:ffef41cc65"], "flags": []}, {"text": {"fa": "این تاریخ‌ها تقریبی‌اند. برآوردهای مختلف زمان جدایی انسان و شامپانزه بسته به نرخ جهش فرض‌شده و روش کالیبراسیون در پژوهش‌های گوناگون فاصلهٔ چشمگیری (در حدود ۵ تا ۸ میلیون سال) دارند و خود کتاب هم می‌پذیرد که اگر فسیلی قدیمی‌تر از ۶ میلیون سال تأیید شود، کالیبراسیون ژنتیکی باید بازنگری شود.", "en": "These dates are approximate. Published estimates of the human–chimpanzee split vary widely (roughly 5–8 Mya) depending on the assumed mutation rate and calibration, and the book itself concedes that a confirmed fossil older than 6 Mya would force a recalibration.", "nl": "These dates are approximate. Published estimates of the human–chimpanzee split vary widely (roughly 5–8 Mya) depending on the assumed mutation rate and calibration, and the book itself concedes that a confirmed fossil older than 6 Mya would force a recalibration."}, "sources": [], "flags": ["contested", "editor-note"]}, {"text": {"fa": "نویسندگان می‌گویند دیرینهٔ میمون پایان میوسن که این رشته از آن آغاز می‌شود هنوز در فسیل‌ها شناخته نشده است. در میان نوادگان آن، انسان خردمند دورترین گونه از سازگاری اصلی با جنگل و درخت است و تنها بازماندهٔ شاخه‌ای که حدود ۶ میلیون سال پیش شروع شد.", "en": "They add that the late-Miocene ape at the root of this story has not yet been identified in the fossil record; among its descendants H. sapiens is the furthest from the ancestral forest, tree-living adaptation and the sole survivor of a lineage begun about 6 Mya.", "nl": "They add that the late-Miocene ape at the root of this story has not yet been identified in the fossil record; among its descendants H. sapiens is the furthest from the ancestral forest, tree-living adaptation and the sole survivor of a lineage begun about 6 Mya."}, "sources": ["src:64c357a843"], "flags": []}], "links": [{"to": "tabar:human-evolution", "rel": "part-of", "note": {"fa": "تکامل انسان (حوزهٔ کلی)", "en": "Human evolution (field overview)", "nl": "Human evolution (field overview)"}}, {"to": "tabar:out-of-africa", "rel": "see-also", "note": {"fa": "خاستگاه آفریقایی انسان خردمند", "en": "The African origin of Homo sapiens", "nl": "The African origin of Homo sapiens"}}, {"to": "tabar:mutation-selection-drift", "rel": "see-also", "note": {"fa": "جهش، انتخاب و رانش (پایهٔ ساعت مولکولی)", "en": "Mutation, selection and drift (basis of the molecular clock)", "nl": "Mutation, selection and drift (basis of the molecular clock)"}}, {"to": "tabar:earliest-bipeds-and-australopithecus", "rel": "see-also", "note": {"fa": "نخستین دوپایان و استرالوپیتکوس‌ها", "en": "The earliest bipeds and Australopithecus", "nl": "The earliest bipeds and Australopithecus"}}], "people": ["core:carl-linnaeus", "core:charles-darwin"], "sources": ["src:64c357a843", "src:ffef41cc65"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:out-of-africa", "kind": "concept", "title": {"fa": "خاستگاه آفریقایی انسان خردمند", "en": "The African origin of Homo sapiens", "nl": "De Afrikaanse oorsprong van Homo sapiens"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "همهٔ انسان‌های امروزی از جمعیتی برآمده‌اند که در آفریقا شکل گرفت و در ۵۰ تا ۷۰ هزار سال اخیر در جهان پخش شد؛ تنوع ژنتیکی بیرون آفریقا زیرمجموعه‌ای از تنوع درون آفریقاست.", "en": "All living humans descend from a population that formed in Africa and spread across the world in the last 50 to 70 thousand years; genetic diversity outside Africa is a subset of the diversity within it.", "nl": "Alle levende mensen stammen af van een bevolking die in Afrika ontstond en zich in de laatste 50 tot 70 duizend jaar over de wereld verspreidde; de genetische diversiteit buiten Afrika is een deelverzameling van die binnen Afrika."}, "points": [{"text": {"fa": "بیشترین تنوع ژنتیکی انسان در آفریقاست و هرچه از آفریقا دورتر می‌شویم تنوع کمتر می‌شود: اثر «بنیان‌گذار» پیاپی مهاجرت‌های کوچک.", "en": "Human genetic diversity is greatest in Africa and declines with distance from it: the serial \"founder effect\" of small migrating groups.", "nl": "Human genetic diversity is greatest in Africa and declines with distance from it: the serial \"founder effect\" of small migrating groups."}, "sources": ["src:50f6134be0", "src:3dd3045232"], "flags": []}, {"text": {"fa": "تصویر امروزی پیچیده‌تر از یک خروج واحد است: چند موج، بازگشت‌ها، و ساختار جمعیتی درون آفریقا («چندمنطقه‌ای آفریقایی»)، همراه با آمیزش با انسان‌های کهن بیرون آفریقا.", "en": "Today's picture is more complex than a single exit: several waves, back-migrations, and population structure within Africa (\"African multiregionalism\"), plus admixture with archaic humans outside Africa.", "nl": "Today's picture is more complex than a single exit: several waves, back-migrations, and population structure within Africa (\"African multiregionalism\"), plus admixture with archaic humans outside Africa."}, "sources": ["src:8b730d2385"], "flags": []}], "links": [{"to": "tabar:neanderthal-admixture", "rel": "see-also", "note": {"fa": "آمیزش با نئاندرتال و دنیسووا", "en": "Admixture with Neanderthals and Denisovans", "nl": "Admixture with Neanderthals and Denisovans"}}, {"to": "tabar:race-biology", "rel": "evidence-for", "note": {"fa": "چرا تنوع انسانی پیوسته است نه گسسته", "en": "Why human variation is continuous, not discrete", "nl": "Why human variation is continuous, not discrete"}}], "people": ["core:svante-p-bo", "core:sarah-tishkoff"], "sources": ["src:3dd3045232", "src:50f6134be0", "src:8b730d2385"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:cooking-hypothesis", "kind": "concept", "title": {"fa": "فرضیهٔ پختن: آتش و پیدایش انسان", "en": "The cooking hypothesis: fire and the origin of humans", "nl": "De kookhypothese: vuur en het ontstaan van de mens"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "ریچارد رانگهم می‌گوید گذار از «انسان‌های ابزارساز اولیه» به «هومو ارکتوس» (حدود ۱٫۹ تا ۱٫۸ میلیون سال پیش) را باید با مهار آتش و پختن غذا توضیح داد. به‌باور او پختن انرژی بیشتری از غذا بیرون می‌کشد و همین، بدن، مغز، وقت روزانه و زندگی اجتماعی ما را تغییر داده است. این فرضیه جذاب و پرنفوذ است، اما بخش‌های مهمش، به‌ویژه زمانِ آغاز پختن، همچنان محل بحث است.", "en": "Richard Wrangham argues that the transition from early tool-making hominins to Homo erectus (about 1.9–1.8 million years ago) is best explained by the control of fire and the cooking of food. Cooking, he says, extracts more energy from food and thereby reshaped our body, brain, daily time budget and social life. The idea is influential and stimulating, but key parts of it, above all the timing, remain debated.", "nl": "Richard Wrangham stelt dat de overgang naar Homo erectus (circa 1,9–1,8 miljoen jaar geleden) verklaard moet worden door vuurbeheersing en koken. Koken levert meer energie uit voedsel en zou lichaam, brein en sociaal leven hebben veranderd. De hypothese is invloedrijk maar omstreden, vooral wat betreft de datering."}, "points": [{"text": {"fa": "ادعای اصلی کتاب «آتش را گرفتیم» (۲۰۰۹): انسان‌ها با غذای پخته سازگار شده‌اند، همان‌طور که گاو با علف یا کک با خون. یعنی پختن فقط یک سنت فرهنگی یا نمادین نیست، بلکه بخشی از زیست‌شناسی ماست.", "en": "Core claim of Catching Fire (2009): humans are biologically adapted to cooked food, as cows are to grass or fleas to blood; cooking is not merely a cultural or symbolic habit but part of our biology.", "nl": "Core claim of Catching Fire (2009): humans are biologically adapted to cooked food, as cows are to grass or fleas to blood; cooking is not merely a cultural or symbolic habit but part of our biology."}, "sources": ["src:c12cd83ad0"], "flags": []}, {"text": {"fa": "نویسنده خود را در برابر دو دیدگاه قدیمی‌تر می‌گذارد: دیدگاه داروین که آتش را اختراعی دیرهنگام و بی‌اثر بر بدن می‌دانست، و تحلیل لوی‌استروس در «خام و پخته» که اهمیت پختن را بیشتر نمادین می‌دید.", "en": "He positions the idea against two older views: Darwin's, which treated fire as a late invention with little effect on the body, and Lévi-Strauss's The Raw and the Cooked, which saw cooking's significance as largely symbolic.", "nl": "He positions the idea against two older views: Darwin's, which treated fire as a late invention with little effect on the body, and Lévi-Strauss's The Raw and the Cooked, which saw cooking's significance as largely symbolic."}, "sources": ["src:c12cd83ad0"], "flags": []}, {"text": {"fa": "استدلال به‌صورت زنجیره است: پختن انرژی قابل‌جذب را بالا می‌برد؛ غذا نرم‌تر و دیرفاسدتر می‌شود؛ روده و دندان کوچک‌تر و مغز بزرگ‌تر می‌شود؛ زمان جویدن کم می‌شود؛ و غذای خانگی روابط زن و مرد را شکل می‌دهد. هر حلقه را باید جداگانه سنجید، چون درستیِ یک حلقه درستیِ بقیه را تضمین نمی‌کند.", "en": "The argument is a chain: cooking raises usable energy; food becomes softer and safer; guts and teeth shrink while the brain grows; chewing time falls; and household meals shape relations between the sexes. Each link must be judged separately, because one holding does not guarantee the rest.", "nl": "The argument is a chain: cooking raises usable energy; food becomes softer and safer; guts and teeth shrink while the brain grows; chewing time falls; and household meals shape relations between the sexes. Each link must be judged separately, because one holding does not guarantee the rest."}, "sources": ["src:c12cd83ad0"], "flags": []}, {"text": {"fa": "به گفتهٔ نویسنده، شواهد زیست‌شناختی (کوچک‌شدن دندان‌ها و روده، بزرگ‌شدن مغز و بدن در هومو ارکتوس) نشان می‌دهد پختن حدود ۱٫۸ میلیون سال پیش آغاز شده است. بیشتر باستان‌شناسان این تاریخ را با شواهد مستقیمِ آتش تأیید‌شده نمی‌دانند (نک. مدخل «بحث دربارهٔ زمان مهار آتش»).", "en": "Per the author, biological evidence (smaller teeth and guts, larger brain and body in Homo erectus) implies cooking began about 1.8 million years ago. Most archaeologists do not regard this as confirmed by direct fire evidence (see the entry on the fire-control dating debate).", "nl": "Per the author, biological evidence (smaller teeth and guts, larger brain and body in Homo erectus) implies cooking began about 1.8 million years ago. Most archaeologists do not regard this as confirmed by direct fire evidence (see the entry on the fire-control dating debate)."}, "sources": ["src:c12cd83ad0"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "نظر ویراستار: فرضیهٔ پختن یک فرضیهٔ زیست‌تکاملی قابل‌بحث است نه واقعیتی اثبات‌شده. چند پژوهش مستقل بخش‌هایی از آن را تأیید می‌کنند (انرژی بیشتر از غذای فراوری‌شده، کوچک‌بودن دستگاه گوارش)، اما دیگران توضیح‌های جایگزین داده‌اند، مثل فراوری مکانیکی گوشت با ابزار سنگی. زمان آغاز پختن و سهم آن در بزرگ‌شدن مغز هنوز بسته نشده است.", "en": "Editor's note: the cooking hypothesis is a debatable evolutionary hypothesis, not an established fact. Several independent studies support parts of it (extra energy from processed food, small digestive systems), but others offer alternatives such as mechanical processing of meat with stone tools. When cooking began, and how much it contributed to brain growth, is unresolved.", "nl": "Editor's note: the cooking hypothesis is a debatable evolutionary hypothesis, not an established fact. Several independent studies support parts of it (extra energy from processed food, small digestive systems), but others offer alternatives such as mechanical processing of meat with stone tools. When cooking began, and how much it contributed to brain growth, is unresolved."}, "sources": ["src:732c1fdbea", "src:c8517f2ad2", "src:c64b6db5f6"], "flags": ["contested", "editor-note"]}], "links": [{"to": "tabar:human-evolution", "rel": "part-of", "note": {"fa": "تکامل انسان", "en": "Human evolution", "nl": "Human evolution"}}, {"to": "tabar:cooking-energy-gain", "rel": "explains", "note": {"fa": "پختن چگونه انرژی غذا را بالا می‌برد", "en": "How cooking raises the energy yield of food", "nl": "How cooking raises the energy yield of food"}}, {"to": "tabar:fire-control-dating-debate", "rel": "contrasts", "note": {"fa": "بحث دربارهٔ زمان مهار آتش", "en": "The debate over when fire was controlled", "nl": "The debate over when fire was controlled"}}, {"to": "tabar:meat-eating-hunting-hypothesis", "rel": "contrasts", "note": {"fa": "فرضیهٔ گوشت‌خواری و «انسانِ شکارچی»", "en": "The meat-eating / Man-the-Hunter hypothesis", "nl": "The meat-eating / Man-the-Hunter hypothesis"}}], "people": ["core:richard-wrangham", "core:claude-l-vi-strauss", "core:charles-darwin"], "sources": ["src:732c1fdbea", "src:c12cd83ad0", "src:c64b6db5f6", "src:c8517f2ad2"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:epigenetics", "kind": "field", "title": {"fa": "اپی‌ژنتیک", "en": "Epigenetics", "nl": "Epigenetica"}, "aliases": [], "parent": "tabar:tabar", "field": null, "summary": {"fa": "محیط چگونه روی خواندنِ ژن‌ها اثر می‌گذارد و آیا این اثر به نسل بعد می‌رسد؟", "en": "How does environment affect how genes are read, and does that reach the next generation?", "nl": "Hoe beïnvloedt de omgeving het aflezen van genen, en bereikt dat de volgende generatie?"}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:many-humans-dragon-man-nesher-ramla-naledi-hobbits", "kind": "concept", "title": {"fa": "روزگار چند انسان: انسان اژدها، نشر رمله، ناله‌دی، «هابیت‌های» فلورس و لوزون", "en": "An age of many humans: Dragon Man, Nesher Ramla, Homo naledi, the Flores 'hobbits' and Luzon", "nl": "Een tijdperk van vele mensen: de Drakenmens, Nesher Ramla, Homo naledi, de 'hobbits' van Flores en Luzon"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "در صد تا سیصد هزار سال گذشته، انسان خردمند و نئاندرتال تنها انسان‌های روی زمین نبودند. «خداحافظ آفریقا» در اپیزود نهم چند شاخهٔ کم‌شناخته یا تازه‌کشف‌شده را معرفی می‌کند: جمجمهٔ بزرگ و کامل «مرد هاربین» یا «انسان اژدها» در چین (هومو لونگی) که شاید نخستین جمجمهٔ دنیسووایی باشد؛ «نشر رمله» در جنوب‌غرب آسیا که شاید همان جمعیت نیاییِ نئاندرتال‌ها و دنیسووایی‌ها بود — و اگر چنین باشد، فلات ایران در مسیر پراکنش هر دو بوده است؛ «هومو ناله‌دی» با مغزی کوچک در جنوب آفریقا؛ «هومو فلورسینسیس» (هابیت) در اندونزی؛ و «هومو لوزوننسیس» در فیلیپین. برنامه در کنار این، توضیح می‌دهد که معرفی یک گونهٔ تازه چه فرایند سخت‌گیرانه‌ای دارد و چرا «کوتوله‌های» افسانه‌ای امروز هیچ ربطی به هابیت‌های فلورس ندارند.", "en": "Over the last 100–300,000 years, Homo sapiens and Neanderthals were not alone. Episode 9 introduces several little-known or newly found branches: the large, complete 'Harbin' or 'Dragon Man' skull from China (Homo longi), possibly the first Denisovan skull; 'Nesher Ramla' in SW Asia, perhaps the ancestral population of Neanderthals and Denisovans — in which case the Iranian plateau lay on both their dispersal routes; small-brained Homo naledi in South Africa; Homo floresiensis ('hobbits') in Indonesia; and Homo luzonensis in the Philippines. It also explains how rigorous naming a new species is, and why modern legends of 'dwarfs' have nothing to do with the Flores hobbits.", "nl": "De afgelopen 100–300.000 jaar waren sapiens en Neanderthalers niet alleen. Aflevering 9 stelt voor: de complete 'Harbin'- of 'Drakenmens'-schedel uit China (Homo longi), mogelijk Denisovaans; 'Nesher Ramla' in Zuidwest-Azië, mogelijk de voorouderpopulatie van Neanderthalers en Denisovanen; Homo naledi in Zuid-Afrika; Homo floresiensis ('hobbits') en Homo luzonensis. Ook: hoe streng het benoemen van een nieuwe soort is."}, "points": [{"text": {"fa": "انسان اژدها (هاربین، هومو لونگی): یکی از کامل‌ترین و بزرگ‌ترین جمجمه‌های انسانی که تاکنون یافت شده — نه بازسازی‌شده از تکه‌ها، بلکه یکپارچه، به‌جز فک پایین و با تنها یک دندان آسیا در فک بالا. داستانش: در ۱۹۳۳ هنگام ساخت پلی روی رودخانه در هاربین پیدا شد، جدی گرفته نشد و — به روایت برنامه — در مخزن موزه فراموش شد تا چند سال پیش که دانشمندان چینی به آن برخوردند. سن آن حدود ۱۴۶ هزار سال برآورد شد. صورتی پهن، برآمدگیِ بسیار بزرگ ابرو و حفرهٔ بینیِ بزرگ (ویژگی‌های نئاندرتالی/دنیسووایی) دارد، اما حجم مغزش حدود ۱۴۲۰ سی‌سی — در محدودهٔ ما — است و برخی ویژگی‌های صورتش به انسان خردمند شبیه است؛ آمیزه‌ای از کهن و نو. کاشفانش در ۲۰۲۱ آن را گونه‌ای تازه، «هومو لونگی» (انسان اژدها)، نامیدند.", "en": "Dragon Man (Harbin, Homo longi): one of the most complete and largest human skulls ever found — not pieced together but intact, missing only the lower jaw, with a single molar in the upper jaw. Found in 1933 while a bridge was being built in Harbin, it was not taken seriously and — as the programme tells it — forgotten in storage until Chinese scientists came across it a few years ago. It is dated to about 146,000 years. It has a broad face, a huge brow ridge and large nasal cavity (Neanderthal/Denisovan traits), yet a brain of about 1,420 cc — within our range — and some sapiens-like facial features: a mix of old and new. Its discoverers named it a new species, Homo longi, in 2021.", "nl": "De Drakenmens (Harbin, Homo longi): een van de meest complete schedels ooit, gevonden in 1933 bij de bouw van een brug, decennia vergeten en ~146.000 jaar oud. Een breed gezicht en enorme wenkbrauwboog, maar een hersenvolume van ~1.420 cc. In 2021 als nieuwe soort benoemd."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "آیا این همان صورت دنیسووایی‌هاست؟ دندان آسیای آن به دندان‌های دنیسووایی بسیار شبیه است و فک بایشیای تبت (دنیسووایی) با این جمجمه چنان جور است که گویی صاحب همان فک باشد. پس پژوهشگران به بازسنجی جمجمه‌های چینیِ دهه‌های ۱۹۵۰ تا ۱۹۷۰ (مانند دالی، هوالونگ‌دونگ و جین‌نیوشان، با سن‌های ۲۰۰ تا ۳۰۰ هزار سال) پرداخته‌اند که پیش‌تر هایدلبرگ یا راست‌قامت طبقه‌بندی شده بودند و اکنون در محدودهٔ شباهتِ نزدیک با هومو لونگی قرار می‌گیرند. برنامه این را نمونهٔ کار همیشگی علم می‌داند: گزاره‌های علمی مدام بازسنجی و اعتبارسنجی می‌شوند. به گفتهٔ برنامه، دانشمندان چینی احتمال دنیسووایی بودن آن را بیش از ۸۰ درصد می‌دانستند و تنها DNA یا پروتئین باستانی می‌توانست تکلیف را روشن کند.", "en": "Is this the Denisovan face? Its molar closely resembles Denisovan teeth, and the Tibetan Baishiya jaw (Denisovan) fits the skull as if from the same individual. Researchers have therefore re-examined Chinese skulls from the 1950s–70s (Dali, Hualongdong, Jinniushan, 200–300 ka) once classed as heidelbergensis or erectus, which now fall close to Homo longi. The programme sees this as science's normal work: claims are constantly re-tested. Chinese scientists put the chance it was Denisovan above 80%, and only ancient DNA or proteins could settle it.", "nl": "Is dit het Denisovaanse gezicht? De kies lijkt sterk op Denisovaanse tanden en de Baishiya-kaak past erop. Oudere Chinese schedels worden nu herzien. Alleen oud DNA of eiwit kon het beslissen."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "یک گونهٔ تازه چگونه معرفی می‌شود؟ برخلاف فیلم‌ها که کاوشگر چیزی می‌یابد و فریاد «یافتم!» برمی‌آورد، در واقعیت کاشفان یافته را حتی عمومی هم نمی‌کنند و سال‌ها مطالعه آغاز می‌شود: باید مجوز گرفت، نمونه را با سبد بزرگی از نمونه‌های نگهداری‌شده در موزه‌های سراسر جهان مقایسه کرد، اندازه‌گیری کرد، نمودار کشید و با روش‌های آماریِ پیچیده — و امروز ژنتیک — نشان داد که ریخت، اندازه و ژنِ این نمونه با هیچ گروه شناخته‌شده‌ای جور نیست. وقتی ادعای گونه‌ای تازه در مجله‌ای مثل «نیچر» چاپ می‌شود، یعنی از فیلترهای سخت و نقدهای بسیار گذشته است. دربارهٔ نشر رمله، این کار سه تا چهار سال طول کشید.", "en": "How is a new species named? Unlike films where an excavator shouts 'Eureka!', finders do not even announce a discovery; years of study begin: permits, comparison with a large set of specimens held in museums worldwide, measurement, charts and complex statistics — and now genetics — to show the specimen's form, size and genes match no known group. A new-species claim published in a journal like Nature has passed tough filters and heavy criticism. For Nesher Ramla it took three to four years.", "nl": "Hoe wordt een nieuwe soort benoemd? Niet met 'Eureka!', maar met jaren vergelijken, meten en statistiek — en nu genetica. Voor Nesher Ramla duurde het drie tot vier jaar."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "نشر رمله، ریشه‌ای در جنوب‌غرب آسیا: در ۲۰۲۱ هرشکوویتس و همکاران بقایای نوعی انسان را از محوطهٔ نشر رمله در کرانهٔ شرقیِ مدیترانه — منطقه‌ای مورد مناقشه میان اسرائیلی‌ها و فلسطینی‌ها — گزارش کردند، با سن حدود ۱۴۰ تا ۱۲۰ هزار سال. آن‌ها می‌گویند برخی سنگواره‌های پیشینِ منطقه، تا حدود ۴۰۰ هزار سال پیش، هم به همین گروه تعلق دارند. ابزارها و معیشت نشر رمله چنان شبیه نئاندرتال‌ها بود که اگر بیست سال پیش بررسی می‌شد، نئاندرتال طبقه‌بندی می‌شد. پیشنهاد آن‌ها: این جمعیت همان گروه نیایی است که نئاندرتال‌ها و دنیسووایی‌ها از آن پدید آمدند؛ سپس نئاندرتال‌ها به غرب (اروپا) و دنیسووایی‌ها به شرق (آسیای مرکزی و جنوبی) رفتند.", "en": "Nesher Ramla, a root in SW Asia: in 2021 Hershkovitz and colleagues reported a human from Nesher Ramla on the eastern Mediterranean coast — a region contested between Israelis and Palestinians — dated about 140–120 ka, and argued that some earlier local fossils, back to ~400 ka, belong to the same group. Its tools and way of life were so Neanderthal-like that twenty years ago it would have been classed as Neanderthal. Their proposal: this was the ancestral population from which Neanderthals and Denisovans arose, Neanderthals then spreading west into Europe and Denisovans east into Central and South Asia.", "nl": "Nesher Ramla: in 2021 beschreven (~140–120.000 jaar); volgens de onderzoekers de voorouderpopulatie van Neanderthalers en Denisovanen, die vandaar naar het westen en oosten trokken."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "و ایران؟ اگر گونه‌زایی نئاندرتال و دنیسووا در جنوب‌غرب آسیا رخ داده باشد، فلات ایران درست در مسیر پراکنش هر دو بوده است. نئاندرتال‌ها را در ایران از پیش می‌شناسیم — از جمله یک دندان شیری از غار قلعه‌کرد با قدمت حدود ۱۷۰ هزار سال، دندان شیری دیگری از بawi‌یوان در کرمانشاه و دندانی کوچک از وزمه — و برنامه می‌گوید باید با جدیت بیشتری به دنبال ردِ دنیسووایی‌ها و نشر رمله‌ای‌ها هم در ایران بود. سناریوی تازه چنین است: راست‌قامت → هایدلبرگ → سه شاخه: نشر رمله، دنیسووا (؟) و انسان خردمند؛ و از نشر رمله، نئاندرتال‌های جنوب‌غرب آسیا و اروپا.", "en": "And Iran? If Neanderthal–Denisovan speciation happened in SW Asia, the Iranian plateau lay directly on both dispersal routes. Neanderthals are already known from Iran — including a milk tooth from Qaleh Kurd cave of about 170,000 years, another from Bawa Yawan (Kermanshah) and a small tooth from Wezmeh — and the programme urges a more serious search for Denisovans and Nesher Ramla-type humans there too. The new scenario: erectus → heidelbergensis → Nesher Ramla, Denisovans(?) and sapiens; and from Nesher Ramla, Neanderthals of SW Asia and Europe.", "nl": "En Iran? Als de splitsing in Zuidwest-Azië plaatsvond, lag het Iraanse plateau op beide routes. Neanderthalers zijn in Iran al bekend (Qaleh Kurd, ~170.000 jaar; Bawa Yawan; Wezmeh)."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "هومو ناله‌دی: در جنوب آفریقا، هم‌زمان با نئاندرتال‌ها و دنیسووایی‌ها، انسانی با قد حدود ۱۱۰ تا ۱۲۰ سانتی‌متر و مغزی بسیار کوچک می‌زیست — حدود ۲۵۰ تا ۳۰۰ هزار سال پیش. «هومو» (انسان) نامیده شد چون برخی ویژگی‌های صورتش بسیار مدرن بود و نسبت جمجمه به بدنش در محدودهٔ انسان‌ها، نه استرالوپیتکوس‌ها، بود. داستان کشف: غارنوردانی در انتهای یک سامانهٔ غار از گذرگاهی بسیار باریک گذشتند و به تالاری کوچک پر از سنگواره رسیدند. لی برگر، دیرین‌انسان‌شناس دانشگاهی در آفریقای جنوبی، برای کاوش آگهی داد و فقط کاوشگرانی (عمدتاً زن) با جثهٔ بسیار ظریف می‌توانستند از آن شکاف بگذرند. بقایای دست‌کم پانزده نفر و تقریباً یک اسکلت کامل بیرون آمد. به نظر می‌رسد استوا، جنگل‌های استوایی و صحرا مانع پراکنش آن‌ها شد و در همان جنوب جدا ماندند؛ ردی از آن‌ها در ژنوم ما شناخته نشده است.", "en": "Homo naledi: in southern Africa, contemporary with Neanderthals and Denisovans, lived a human about 1.1–1.2 m tall with a very small brain, about 250–300 ka. It is called Homo because parts of its face were very modern and its skull-to-body proportions fall within humans rather than australopiths. Discovery: cavers squeezed through an extremely narrow passage at the end of a cave system into a small chamber full of fossils. Palaeoanthropologist Lee Berger advertised for excavators and only very slim people (mostly women) could pass. At least fifteen individuals and a nearly complete skeleton emerged. The equator, rainforests and deserts seem to have confined them to the south; no trace of them is known in our genome.", "nl": "Homo naledi: in Zuid-Afrika, ~250–300.000 jaar geleden, ~1,1–1,2 m lang met een klein brein maar moderne gezichtstrekken. Grotverkenners vonden de fossielen achter een uiterst nauwe doorgang; Lee Berger zocht slanke opgravers. Minstens vijftien individuen."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "هابیت‌های فلورس: در ۲۰۰۴ از غار لیانگ‌بوای در جزیرهٔ فلورس اندونزی انسانی با قد زیر یک متر و مغزی حدود ۴۰۰ سی‌سی — کمتر حتی از برخی استرالوپیتکوس‌ها — گزارش شد که به یاد هابیت‌های تالکین «هابیت» نامیده شد. سه سناریو مطرح شد: (۱) افرادی بیمار با کوچکی مغز — که زود کنار رفت؛ (۲) نوادگان راست‌قامت که در جزیره گیر افتادند و دچار «کوتولگی جزیره‌ای» شدند؛ (۳) سناریویی تازه‌تر و «ترسناک»: بازماندگان یک خروج از آفریقا پیش از راست‌قامت، شاید از انسان ماهر، حدود ۲٫۵ میلیون سال پیش. برنامه به مقاله‌ای در «نیچر» (۲۰۱۹) اشاره می‌کند که یکی از نویسندگانش، متئو توکری، هم‌کلاسی قدیمی گوینده است. ابزار سنگی بسیار ساده داشتند، شکارهای کوچک و بیشتر گردآوری؛ و به گفتهٔ برنامه تا حدود ۷۰ هزار سال پیش زیستند و با رسیدن انسان خردمند منقرض شدند. در اسطوره‌های مردم امروز این جزایر از «کوتوله‌هایی در جنگل» سخن می‌رود؛ یک انسان‌شناس کانادایی حتی مدعی شده نیاکان آن‌ها هابیت‌ها را دیده‌اند — ادعایی که علمی‌بودنش روشن نیست.", "en": "The Flores hobbits: in 2004 a human under one metre tall with a brain of about 400 cc — smaller than some australopiths — was reported from Liang Bua cave on Flores, Indonesia, and nicknamed 'hobbit'. Three scenarios: (1) diseased individuals with microcephaly — soon dropped; (2) erectus descendants stranded on the island and shrunk by 'island dwarfism'; (3) a newer, 'frightening' scenario: survivors of an exit from Africa before erectus, perhaps by Homo habilis around 2.5 Mya — citing a 2019 Nature paper co-authored by Matteo Tocheri, an old classmate of the speaker. They had very simple stone tools, hunted small game and mostly gathered, surviving until about 70 ka, the programme says, then vanishing as sapiens arrived. Local myths speak of 'little people in the forest'; a Canadian anthropologist even claims islanders' ancestors saw them — scientifically unproven.", "nl": "De hobbits van Flores: in 2004 gemeld, minder dan een meter lang met een brein van ~400 cc. Drie scenario's: ziekte (verworpen), eilanddwerggroei van erectus, of een nog oudere uittocht uit Afrika. Volgens het programma overleefden ze tot ~70.000 jaar geleden. Lokale mythen spreken van 'kleine mensen in het bos'."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "«کوتوله‌های» ایران: برنامه به موج‌هایی از داستان‌ها در ایران اشاره می‌کند: «پیدا شدن کوتوله در کاوش مترو» یا این ادعا که مردم روستایی در شرق کشور «کوتوله‌اند». گوینده نام روستا را عمداً نمی‌آورد تا مردم برای دیدنشان نروند و آزارشان ندهند. پاسخ او: کوتاه‌قامتیِ نسبیِ مردم آن روستا (حدود ۱۵۰ سانتی‌متر) را به ازدواج‌های درون‌خانوادگی فراوان نسبت می‌دهد و تأکید می‌کند که همه انسان خردمندِ خردمندند و نسبت مغز به جثه‌شان هیچ فرقی با ما ندارد. کوتاه‌ترین انسانِ ثبت‌شده حدود ۵۰ و چند سانتی‌متر بود و از بیماری رنج می‌برد. هیچ جمعیت انسانیِ ۲۰ یا ۳۰ سانتی‌متری هرگز وجود نداشته و این ادعاها و فیلم‌ها سندیت علمی ندارند و ربطی به هابیت‌های فلورس ندارند.", "en": "Iran's 'dwarfs': the programme addresses waves of stories in Iran — 'dwarfs found during metro excavations', or the claim that a village in the east is a village of dwarfs. The speaker deliberately withholds the village's name to spare its people from curious visitors. He attributes their relatively short stature (~150 cm) to frequent consanguineous marriage and stresses they are fully modern humans with ordinary brain-to-body ratios. The shortest recorded human was a little over 50 cm and had a medical condition. No human population 20–30 cm tall has ever existed; such claims and videos have no scientific basis and nothing to do with the Flores hobbits.", "nl": "Iraanse 'dwergen': verhalen over dwergen in metro-opgravingen of een 'dwergendorp' in het oosten. De spreker noemt het dorp bewust niet om de bewoners te beschermen. Het zijn gewone moderne mensen; populaties van 20–30 cm hebben nooit bestaan."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "انسان لوزون: از جزیرهٔ لوزون فیلیپین گونه‌ای دیگر، «هومو لوزوننسیس»، تنها از روی چند دندان و چند قطعهٔ اندام معرفی شده، با قدمتی که برنامه حدود ۶۷ هزار سال می‌گوید. هنوز چیز زیادی از ریختش نمی‌دانیم. برنامه با «خبری خوب» این بخش را می‌بندد: همهٔ این انسان‌ها منقرض شدند و داستان از این پس ساده‌تر است — اینکه چگونه انسان خردمندِ خردمند بر آخرین دنیسووایی‌ها و نئاندرتال‌ها چیره شد. پرسش مسئولیت ما در انقراض آن‌ها به اپیزود بعد واگذار می‌شود.", "en": "Luzon man: from Luzon in the Philippines another species, Homo luzonensis, has been named from a few teeth and limb bones, dated — the programme says — to about 67,000 years. Little is known of its form. The section closes with 'good news': all these humans went extinct, and from here the story is simpler — how Homo sapiens sapiens prevailed over the last Denisovans and Neanderthals. The question of our responsibility for their extinction is left to the next episode.", "nl": "Homo luzonensis: benoemd op basis van enkele tanden en botten, ~67.000 jaar. Daarna wordt het verhaal eenvoudiger: hoe sapiens sapiens de laatste Denisovanen en Neanderthalers overvleugelde."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "نقد و به‌روزرسانی: (۱) در ۲۰۲۵ پروتئین‌های باستانی و DNA میتوکندریاییِ استخراج‌شده از جرمِ دندان جمجمهٔ هاربین (فو و همکاران) آن را دنیسووایی نشان داد؛ پس «انسان اژدها» اکنون نخستین جمجمهٔ شناخته‌شدهٔ دنیسووایی است، هرچند بر سر نام علمی (هومو لونگی یا ماندن در دنیسووا) بحث هست. داستانِ «فراموشیِ آن در مخزن موزه» در منابع دیگر چنین روایت شده که کارگری آن را در ۱۹۳۳ در چاهی پنهان کرد و خانواده‌اش در ۲۰۱۸ آن را به دانشگاه دادند. (۲) «نشر رمله» به‌عنوان گروهی جدا هنوز مورد پذیرش عام نیست؛ بسیاری آن را نئاندرتال‌های آغازین یا جمعیتی آمیخته می‌دانند و نقش آن در نیای دنیسووایی‌ها حدسی است. (۳) سن «هابیت‌ها» پس از بازتاریخ‌گذاری لیانگ‌بوا (۲۰۱۶) به ۱۰۰ تا ۶۰ هزار سال برای استخوان‌ها و حدود ۵۰ هزار سال برای ابزارها رسید؛ رابطه‌شان با رسیدن انسان خردمند هم‌زمانی است نه علیت اثبات‌شده. (۴) قدمت لوزون حداقل ۵۰ تا ۶۷ هزار سال است. (۵) دربارهٔ کوتاه‌قامتی آن روستا، پژوهش‌ها سوءتغذیهٔ طولانی و فقر را هم عامل اصلی می‌دانند، نه فقط ازدواج خویشاوندی.", "en": "Critique and update: (1) in 2025 ancient proteins and mitochondrial DNA from the Harbin skull's dental calculus (Fu et al.) showed it to be Denisovan; 'Dragon Man' is now the first known Denisovan skull, though its name (Homo longi or Denisovan) is debated. Other sources say a labourer hid it in a well in 1933 and his family gave it to a university in 2018, rather than it being forgotten in a museum. (2) Nesher Ramla as a distinct group is not widely accepted; many see it as early Neanderthals or a mixed population, and its role in Denisovan ancestry is speculative. (3) After the Liang Bua redating (2016), hobbit bones are 100–60 ka and tools about 50 ka; their disappearance coincides with sapiens arrival but causation is unproven. (4) Luzon is at least 50–67 ka. (5) For the eastern Iranian village, research also points to long-term malnutrition and poverty, not only consanguinity.", "nl": "Kritiek en update: (1) in 2025 toonden eiwitten en mtDNA uit tandsteen van de Harbin-schedel aan dat hij Denisovaans is. (2) Nesher Ramla als aparte groep is niet algemeen aanvaard. (3) Hobbitbotten zijn 100–60.000 jaar oud; samenhang met sapiens is niet bewezen. (4) Luzon: minstens 50–67.000 jaar. (5) Bij het Iraanse dorp spelen ook ondervoeding en armoede een rol."}, "sources": ["src:60e7838a5a"], "flags": ["editor-note", "contested"]}, {"text": {"fa": "یادداشت خوانش: بر پایهٔ رونوشت خودکار اپیزود نهمِ نسخهٔ پادکستیِ «خداحافظ آفریقا»، به‌طور کامل.", "en": "Reading note: based on the full automatic transcript of podcast episode 9.", "nl": "Leesnotitie: gebaseerd op het volledige transcript van podcastaflevering 9."}, "sources": ["src:60e7838a5a"], "flags": ["editor-note"]}], "links": [{"to": "tabar:denisovans-genome-first-human", "rel": "see-also", "note": {"fa": "دنیسووایی‌ها", "en": "the Denisovans", "nl": "de Denisovanen"}}, {"to": "tabar:human-family-tree-branching", "rel": "part-of", "note": {"fa": "درخت پرشاخه", "en": "the branching tree", "nl": "de vertakte stamboom"}}, {"to": "tabar:persian-plateau-hub", "rel": "see-also", "note": {"fa": "فلات ایران در مسیر پراکنش", "en": "the Iranian plateau on the routes", "nl": "het Iraanse plateau"}}, {"to": "tabar:first-out-of-africa-java-peking-dmanisi", "rel": "see-also", "note": {"fa": "خروج‌های کهن‌تر از آفریقا", "en": "earlier exits from Africa", "nl": "eerdere uittochten"}}, {"to": "tabar:caste-endogamy-founder-effect", "rel": "see-also", "note": {"fa": "ازدواج درون‌گروهی و اثر بنیان‌گذار", "en": "endogamy and founder effects", "nl": "endogamie en foundereffect"}}], "sources": ["src:60e7838a5a"], "people": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:transgenerational", "kind": "concept", "title": {"fa": "وراثت اپی‌ژنتیک بین‌نسلی", "en": "Transgenerational epigenetic inheritance", "nl": "Transgenerationele epigenetische overerving"}, "aliases": [], "parent": "tabar:epigenetics", "field": "tabar:epigenetics", "summary": {"fa": "ادعای محبوب: ترومای پدربزرگ در ژن‌های نوه «ثبت» می‌شود. در گیاهان و کرم‌ها مستند است؛ در موش‌ها شواهدی هست؛ در انسان، شواهد مستقیم ضعیف و مطالعات کوچک و تکرارنشده‌اند. اثرهای بین‌نسلی از راه رفتار و محیط واقعی‌اند، ولی لزوماً «اپی‌ژنتیک» نیستند.", "en": "The popular claim: grandfather's trauma is \"recorded\" in the grandchild's genes. Documented in plants and worms; some evidence in mice; in humans, direct evidence is weak and the studies small and unreplicated. Intergenerational effects via behaviour and environment are real, but not necessarily \"epigenetic\".", "nl": "De populaire claim: het trauma van opa wordt \"vastgelegd\" in de genen van het kleinkind. Gedocumenteerd bij planten en wormen; enig bewijs bij muizen; bij mensen is het directe bewijs zwak en zijn de studies klein en niet gerepliceerd. Intergenerationele effecten via gedrag en omgeving zijn echt, maar niet per se \"epigenetisch\"."}, "points": [{"text": {"fa": "هورستمکه (۲۰۱۸): برای ادعای وراثت اپی‌ژنتیک واقعی در انسان باید اثر در نسلی دیده شود که هیچ تماس مستقیمی با محرک نداشته (نسل سوم از مادر، نسل دوم از پدر)، و باید عوامل ژنتیکی، فرهنگی و اکولوژیک حذف شوند؛ تقریباً هیچ مطالعهٔ انسانی این شرط‌ها را برآورده نمی‌کند.", "en": "Horsthemke (2018): to claim real epigenetic inheritance in humans, the effect must appear in a generation with no direct exposure to the stimulus (third generation via mother, second via father), and genetic, cultural and ecological factors must be excluded; almost no human study meets these conditions.", "nl": "Horsthemke (2018): to claim real epigenetic inheritance in humans, the effect must appear in a generation with no direct exposure to the stimulus (third generation via mother, second via father), and genetic, cultural and ecological factors must be excluded; almost no human study meets these conditions."}, "sources": ["src:07fb5aa7b9"], "flags": ["unreplicated"]}, {"text": {"fa": "مطالعهٔ پرارجاع فرزندان بازماندگان هولوکاست (یهودا ۲۰۱۶) ۳۲ خانواده داشت و نتایجش در تحلیل‌های بعدی تضعیف شد؛ با این حال اثر تروما بر فرزندان از راه فرزندپروری و محیط به‌خوبی مستند است.", "en": "The much-cited study of Holocaust survivors' children (Yehuda 2016) had 32 families and its results weakened under later analysis; yet the effect of trauma on children through parenting and environment is well documented.", "nl": "The much-cited study of Holocaust survivors' children (Yehuda 2016) had 32 families and its results weakened under later analysis; yet the effect of trauma on children through parenting and environment is well documented."}, "sources": ["src:07fb5aa7b9"], "flags": ["unreplicated", "editor-note"]}], "links": [{"to": "tabar:epigenetic-marks", "rel": "part-of", "note": {"fa": "سازوکار پیشنهادی", "en": "The proposed mechanism", "nl": "The proposed mechanism"}}, {"to": "psy:ptsd", "rel": "bridges", "note": {"fa": "تروما در ویکی روان", "en": "Trauma in the psychology wiki", "nl": "Trauma in the psychology wiki"}}, {"to": "tabar:genetic-essentialism", "rel": "see-also", "note": {"fa": "چرا این ادعا این‌قدر جذاب است", "en": "Why this claim is so attractive", "nl": "Why this claim is so attractive"}}], "people": [], "sources": ["src:07fb5aa7b9"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:genealogy", "kind": "field", "title": {"fa": "تبارشناسی و شجره", "en": "Genealogy", "nl": "Genealogie"}, "aliases": [], "parent": "tabar:tabar", "field": null, "summary": {"fa": "شجره‌نامه‌ها، آزمون‌های تجاری تبار و ریاضیِ نیاکان مشترک: از یک نفر چند نیا داریم و چرا همهٔ ما خویشاوندیم؟", "en": "Family trees, commercial ancestry tests and the mathematics of common ancestors: how many ancestors do we have, and why are we all related?", "nl": "Stambomen, commerciële afstammingstests en de wiskunde van gemeenschappelijke voorouders: hoeveel voorouders hebben we, en waarom zijn we allemaal verwant?"}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:ancient-dna", "kind": "concept", "title": {"fa": "انقلاب دی‌ان‌ای باستانی", "en": "The ancient DNA revolution", "nl": "De oud-DNA-revolutie"}, "aliases": [], "parent": "tabar:population-genetics", "field": "tabar:population-genetics", "summary": {"fa": "از ۲۰۱۰ به بعد خواندن ژنوم از استخوان‌های هزاران‌ساله ممکن شد و تاریخ جمعیت‌ها را بازنویسی کرد: تقریباً هیچ جمعیت امروزی «خالص» نیست؛ همه حاصل چند موج مهاجرت و آمیزش‌اند.", "en": "From 2010 on, reading genomes from bones thousands of years old became possible and rewrote population history: almost no living population is \"pure\"; all are the product of several waves of migration and admixture.", "nl": "Vanaf 2010 werd het mogelijk genomen uit duizenden jaren oude botten te lezen, wat de bevolkingsgeschiedenis herschreef: vrijwel geen levende bevolking is \"zuiver\"; alle zijn het product van meerdere migratie- en vermengingsgolven."}, "points": [{"text": {"fa": "رایش: جمعیت‌های امروزی اروپا آمیزه‌ای از دست‌کم سه جمعیت کاملاً متفاوت‌اند (شکارچی‌گردآورندگان غربی، کشاورزان آناتولی، و دامداران استپ)؛ الگوی مشابه در بیشتر مناطق جهان دیده می‌شود.", "en": "Reich: today's European populations are a mixture of at least three very different populations (western hunter-gatherers, Anatolian farmers and steppe herders); a similar pattern appears in most regions of the world.", "nl": "Reich: today's European populations are a mixture of at least three very different populations (western hunter-gatherers, Anatolian farmers and steppe herders); a similar pattern appears in most regions of the world."}, "sources": ["src:8b730d2385"], "flags": []}, {"text": {"fa": "کشاورزی در خاور نزدیک از دو جمعیت کاملاً جدا آغاز شد: کشاورزان زاگرس و کشاورزان آناتولی/شام که از نظر ژنتیکی به اندازهٔ اروپاییان و شرق آسیایی‌های امروز با هم فرق داشتند.", "en": "Farming in the Near East began among two quite separate populations: Zagros farmers and Anatolian/Levantine farmers, genetically about as different as today's Europeans and East Asians.", "nl": "Farming in the Near East began among two quite separate populations: Zagros farmers and Anatolian/Levantine farmers, genetically about as different as today's Europeans and East Asians."}, "sources": ["src:519a39f1f8", "src:22aa9386b9"], "flags": []}, {"text": {"fa": "هشدار روش‌شناختی: نمونه‌های باستانی پراکنده‌اند و «جمعیت» در این مطالعات یک خوشهٔ آماری است، نه قوم یا زبان؛ پیوند دادنش به هویت‌های امروزی کار دانش نیست.", "en": "Methodological caution: ancient samples are sparse, and a \"population\" in these studies is a statistical cluster, not an ethnicity or a language; tying it to present-day identities is not science.", "nl": "Methodological caution: ancient samples are sparse, and a \"population\" in these studies is a statistical cluster, not an ethnicity or a language; tying it to present-day identities is not science."}, "sources": ["src:8b730d2385"], "flags": ["editor-note"]}], "links": [{"to": "tabar:zagros-neolithic", "rel": "evidence-for", "note": {"fa": "نمونهٔ ایران: کشاورزان زاگرس", "en": "The Iranian case: Zagros farmers", "nl": "The Iranian case: Zagros farmers"}}, {"to": "tabar:neanderthal-admixture", "rel": "see-also", "note": {"fa": "آمیزش با نئاندرتال‌ها", "en": "Admixture with Neanderthals", "nl": "Admixture with Neanderthals"}}, {"to": "atlas:archaeogen", "rel": "part-of", "note": {"fa": "پل باستان‌ژنتیک", "en": "The archaeogenetics bridge", "nl": "The archaeogenetics bridge"}}], "people": ["core:david-reich", "core:svante-p-bo"], "sources": ["src:22aa9386b9", "src:519a39f1f8", "src:8b730d2385"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:near-east-first-farmers-structure", "kind": "concept", "title": {"fa": "ساختار ژنتیکی نخستین کشاورزان خاور نزدیک", "en": "The genetic structure of the first farmers of the Near East", "nl": "De genetische structuur van de eerste boeren van het Nabije Oosten"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "لازاریدیس و همکاران (۲۰۱۶) با دی‌ان‌ای باستانی نشان دادند نخستین کشاورزان لوانت جنوبی و کوهستان زاگرس (ایران) دو جمعیت کاملاً متمایز بودند و هر یک از شکارگردآورندگان همان ناحیه ادامه می‌یافت. تفاوت میان این گروه‌ها در عصر مفرغ، با آمیختگی، تقریباً از میان رفت.", "en": "Lazaridis and colleagues (2016) showed with ancient DNA that the first farmers of the southern Levant and the Zagros Mountains (Iran) were two strongly distinct populations, each continuing from local hunter-gatherers. By the Bronze Age, mixing had almost erased the differences between them.", "nl": "Lazaridis e.a. (2016) tonen met oud-DNA dat de eerste boeren van de zuidelijke Levant en de Zagros twee sterk verschillende populaties waren, elk voortgekomen uit lokale jager-verzamelaars; in de Bronstijd waren de verschillen grotendeels verdwenen."}, "points": [{"text": {"fa": "داده: ژنوم باستانیِ ۴۴ نفر (از حدود ۱۲٬۰۰۰ تا ۱۴۰۰ پیش از میلاد) از ارمنستان، شمال‌غرب آناتولی، ایران، اسرائیل و اردن، شامل ناتوفی‌های شکارگردآورنده، کشاورزان پیش‌سفالینهٔ لوانت و کشاورزان گنج‌دره (حدود ۸۲۰۰ تا ۷۶۰۰ پیش از میلاد). برای مقایسه، ۲۸۱ فرد باستانی و ۲۵۸۳ نفر امروزی به کار رفت. دی‌ان‌ای از بخش گوش داخلی استخوان گیجگاهی گرفته و حدود ۱٫۲ میلیون نشانگر ژنومی با «غنی‌سازی» خوانده شد.", "en": "Data: genome-wide ancient DNA from 44 people (~12,000–1,400 BCE) from Armenia, northwestern Anatolia, Iran, Israel and Jordan, including Natufian hunter-gatherers, Levantine Pre-Pottery Neolithic farmers and farmers from Ganj Dareh (~8,200–7,600 BCE). For comparison, 281 ancient individuals and 2,583 present-day people were used. DNA came from the inner-ear part of the petrous bone and ~1.2 million genomic markers were enriched and read.", "nl": "Data: genome-wide ancient DNA from 44 people (~12,000–1,400 BCE) from Armenia, northwestern Anatolia, Iran, Israel and Jordan, including Natufian hunter-gatherers, Levantine Pre-Pottery Neolithic farmers and farmers from Ganj Dareh (~8,200–7,600 BCE). For comparison, 281 ancient individuals and 2,583 present-day people were used. DNA came from the inner-ear part of the petrous bone and ~1.2 million genomic markers were enriched and read."}, "sources": ["src:43526796e0"], "flags": []}, {"text": {"fa": "تفاوت شدید منطقه‌ای: چهار گروه کهن در گوشه‌های نمودار تحلیل مؤلفه‌های اصلی قرار گرفتند (شکارگردآورندگان غربی اروپا، شکارگردآورندگان شرقی، نوسنگی لوانت/ناتوفی، نوسنگی ایران). فاصلهٔ ژنتیکی (FST) میان آن‌ها ۰٫۰۸ تا ۰٫۱۵ بود، یعنی هم‌اندازهٔ فاصلهٔ امروزی غرب‌اوراسیاییان با چینی‌های هان (۰٫۰۹ تا ۰٫۱۳). در عصر مفرغ این فاصله به سطح امروز (کمتر از حدود ۰٫۰۲۵ برای ۹۵٪ جفت‌ها) رسید.", "en": "Strong regional differentiation: four ancient groups sat at the corners of a PCA plot (Western hunter-gatherers, Eastern hunter-gatherers, Levantine Neolithic/Natufian, Iranian Neolithic). Their genetic distance (FST) was 0.08–0.15, comparable to the present-day distance between West Eurasians and Han Chinese (0.09–0.13). By the Bronze Age it had dropped to today's low level (≤ about 0.025 for 95% of pairs).", "nl": "Strong regional differentiation: four ancient groups sat at the corners of a PCA plot (Western hunter-gatherers, Eastern hunter-gatherers, Levantine Neolithic/Natufian, Iranian Neolithic). Their genetic distance (FST) was 0.08–0.15, comparable to the present-day distance between West Eurasians and Han Chinese (0.09–0.13). By the Bronze Age it had dropped to today's low level (≤ about 0.025 for 95% of pairs)."}, "sources": ["src:43526796e0"], "flags": []}, {"text": {"fa": "پیوستگی با شکارگردآورندگان: در لوانت، کشاورزان نخستین با آلل‌های بیشتری با ناتوفی‌ها شریک بودند تا با کشاورزان ایران؛ در قفقاز و ایران، کشاورزان نخستین بیشتر به شکارگردآورندگان همان ناحیه شبیه بودند تا به کشاورزان لوانت. به این ترتیب در هر دو منطقه گذار به کشاورزی بدون جایگزینی کامل جمعیت رخ داده است، برخلاف الگوی گزارش‌شده برای اروپا.", "en": "Continuity with hunter-gatherers: in the Levant early farmers shared more alleles with Natufians than with Iranian farmers; in the Caucasus-Iran highlands early farmers resembled local hunter-gatherers more than Levantine farmers. Thus in both regions the shift to farming occurred without complete population replacement, unlike the pattern reported for Europe.", "nl": "Continuity with hunter-gatherers: in the Levant early farmers shared more alleles with Natufians than with Iranian farmers; in the Caucasus-Iran highlands early farmers resembled local hunter-gatherers more than Levantine farmers. Thus in both regions the shift to farming occurred without complete population replacement, unlike the pattern reported for Europe."}, "sources": ["src:43526796e0"], "flags": []}, {"text": {"fa": "ترکیب: کشاورزان لوانت حدود دو سوم تبارشان را از گروه‌های وابسته به ناتوفی و حدود یک سوم را از گروه‌های وابسته به کشاورزان آناتولی دارند. کشاورزان غرب ایران به شکارگردآورندهٔ احتمالاً میان‌سنگی غار هوتو (البرز) نزدیک‌اند و آلل‌ها را به یک اندازه با کشاورزان آناتولی و لوانت شریک‌اند، که نویسندگان آن را نشانهٔ انزوای درازمدت غرب ایران می‌دانند.", "en": "Composition: Levantine farmers trace about two thirds of their ancestry to Natufian-related groups and about one third to Anatolian-farmer-related groups. Western Iranian farmers cluster with the probably Mesolithic Hotu Cave individual (Alborz) and share alleles equally with Anatolian and Levantine farmers, which the authors read as long-term isolation of western Iran.", "nl": "Composition: Levantine farmers trace about two thirds of their ancestry to Natufian-related groups and about one third to Anatolian-farmer-related groups. Western Iranian farmers cluster with the probably Mesolithic Hotu Cave individual (Alborz) and share alleles equally with Anatolian and Levantine farmers, which the authors read as long-term isolation of western Iran."}, "sources": ["src:43526796e0"], "flags": []}, {"text": {"fa": "نتیجهٔ اصلی نویسندگان: گسترش کشاورزی در خاور نزدیک را نمی‌توان با پراکندن یک جمعیت کشاورز واحد که شکارگردآورندگان را جابه‌جا کند توضیح داد؛ ایده و فناوری سریع‌تر از مردم پخش شد. توجه: این تعمیم بر نمونه‌های اندک هر گروه (گاه چند نفر) و بر مدل‌های آماری آمیختگی استوار است و در پیش‌چاپی بدون داوری همتا آمده است.", "en": "Authors' main conclusion: the spread of farming in the Near East cannot be explained by one farming population dispersing and displacing hunter-gatherers; ideas and technology moved faster than people. Caution: this generalisation rests on small samples per group (sometimes a few individuals) and on statistical admixture models, and appears in a preprint without peer review.", "nl": "Authors' main conclusion: the spread of farming in the Near East cannot be explained by one farming population dispersing and displacing hunter-gatherers; ideas and technology moved faster than people. Caution: this generalisation rests on small samples per group (sometimes a few individuals) and on statistical admixture models, and appears in a preprint without peer review."}, "sources": ["src:43526796e0"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "دربارهٔ وضعیت متن: فایل بررسی‌شده نسخهٔ پیش‌چاپ ژوئن ۲۰۱۶ است. به‌نظر می‌رسد نسخهٔ داوری‌شدهٔ آن بعداً با عنوان دیگری در مجلهٔ Nature (۲۰۱۶، جلد ۵۳۶) منتشر شد و باید اعداد را با آن نسخه تطبیق داد. پژوهش‌های بعدی هم جزئیات تبار ایران و لوانت را دقیق‌تر کرده‌اند.", "en": "On the text's status: the file reviewed is the June 2016 preprint. A peer-reviewed version appeared later in Nature (2016, vol. 536) under a different title, to my knowledge; numbers should be checked against that version. Later studies have also refined the details of Iranian and Levantine ancestry.", "nl": "On the text's status: the file reviewed is the June 2016 preprint. A peer-reviewed version appeared later in Nature (2016, vol. 536) under a different title, to my knowledge; numbers should be checked against that version. Later studies have also refined the details of Iranian and Levantine ancestry."}, "sources": [], "flags": ["dated", "editor-note"]}], "links": [{"to": "tabar:zagros-neolithic", "rel": "explains", "note": {"fa": "کشاورزان نوسنگی زاگرس", "en": "Zagros Neolithic farmers", "nl": "Zagros Neolithic farmers"}}, {"to": "tabar:ancient-dna", "rel": "part-of", "note": {"fa": "انقلاب دی‌ان‌ای باستانی", "en": "The ancient DNA revolution", "nl": "The ancient DNA revolution"}}, {"to": "soc:goat-domestication-zagros", "rel": "bridges", "note": {"fa": "اهلی‌سازی بز در گنج‌دره (همان جایگاه)", "en": "Goat domestication at Ganj Dareh (same site)", "nl": "Goat domestication at Ganj Dareh (same site)"}}, {"to": "tabar:iranian-farmer-legacy", "rel": "see-also", "note": {"fa": "میراث کشاورزان ایرانی", "en": "Legacy of the Iranian farmers", "nl": "Legacy of the Iranian farmers"}}], "people": ["core:iosif-lazaridis", "core:david-reich", "core:ron-pinhasi"], "sources": ["src:43526796e0"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:forager-lifeways-diversity", "kind": "concept", "title": {"fa": "شیوهٔ زندگی شکارگر-خوراک‌جو: تنوع، احتیاط روش‌شناختی و بحث «جامعهٔ مرفه»", "en": "Forager lifeways: diversity, methodological caution and the 'affluent society' debate", "nl": "Leefwijze van jager-verzamelaars: diversiteit, methodologische voorzichtigheid en het 'welvaartsdebat'"}, "aliases": [], "parent": "tabar:genetics-society", "field": "tabar:genetics-society", "summary": {"fa": "هراری می‌گوید دربارهٔ زندگی نیاکان خوراک‌جوی ما کم می‌دانیم، قیاس با خوراک‌جویان امروزی محدودیت دارد، و هیچ «شیوهٔ زیست طبیعی» واحدی برای انسان خردمند وجود نداشت. او همچنین تصویری نسبتاً مثبت از زندگی خوراک‌جویان (کار کمتر و دانش گسترده) می‌دهد که خود محل بحث است.", "en": "Harari says we know little about our forager ancestors' lives, that analogies from today's foragers have limits, and that there was no single 'natural way of life' for Homo sapiens. He also paints a fairly positive picture of forager life (less work, broad knowledge), itself a debated view.", "nl": "Harari stelt dat we weinig weten over het leven van onze jager-verzamelaarsvoorouders, dat vergelijking met hedendaagse groepen beperkt is en dat er geen enkele 'natuurlijke leefwijze' bestond. Zijn vrij positieve beeld van het leven van verzamelaars is zelf omstreden."}, "points": [{"text": {"fa": "او به دو دلیل با «روان‌شناسی تکاملی» عامه‌پسند محتاط است: شواهد باستان‌شناختی عمدتاً استخوان و ابزار سنگی است و چوب، چرم و باور و رسم را حفظ نمی‌کند؛ و بحث میان فرضیهٔ «کمون باستانی» (بدون مالکیت و تک‌همسری) و فرضیهٔ «تک‌همسری و خانوادهٔ هسته‌ای همیشگی» بر شاهد سست بنا شده است.", "en": "He is cautious about popular evolutionary psychology for two reasons: archaeological evidence is mostly bone and stone tools and does not preserve wood, leather, belief or custom; and the debate between an 'ancient commune' (no property, no monogamy) and 'eternal monogamy and nuclear family' rests on thin evidence.", "nl": "He is cautious about popular evolutionary psychology for two reasons: archaeological evidence is mostly bone and stone tools and does not preserve wood, leather, belief or custom; and the debate between an 'ancient commune' (no property, no monogamy) and 'eternal monogamy and nuclear family' rests on thin evidence."}, "sources": ["src:64cc653b84"], "flags": []}, {"text": {"fa": "او سه محدودیت
