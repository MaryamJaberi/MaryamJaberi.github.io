: ["src:64cc653b84"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "بسیاری از باستان‌شناسان آفریقا (از جمله مک‌برتی و بروکس در مقالهٔ ۲۰۰۰) نشان داده‌اند که عناصر «رفتار مدرن» مثل رنگدانه، دانه‌های زینتی، ابزار تیغه‌ای و نقش‌های نمادین پیش از ۷۰ هزار سال و در آفریقا به‌تدریج و پراکنده ظاهر شدند؛ پس «انقلاب» ناگهانی کل تصویر نیست. همچنین شواهدی از نمادگرایی نئاندرتال‌ها (مثلاً نقاشی‌های غاری در ایبری با تاریخ‌گذاری ۲۰۱۸) تصویر نئاندرتالِ ناتوان از نماد و خیال را سست کرده است.", "en": "Many Africa-focused archaeologists (including McBrearty and Brooks in 2000) have shown that elements of 'modern behaviour', such as pigments, beads, blade tools and symbolic marks, appeared gradually and patchily in Africa well before 70,000 years ago, so a sudden 'revolution' is not the whole picture. Evidence of Neanderthal symbolism (e.g. Iberian cave art dated in 2018) has also weakened the image of Neanderthals as incapable of symbol and imagination.", "nl": "Many Africa-focused archaeologists (including McBrearty and Brooks in 2000) have shown that elements of 'modern behaviour', such as pigments, beads, blade tools and symbolic marks, appeared gradually and patchily in Africa well before 70,000 years ago, so a sudden 'revolution' is not the whole picture. Evidence of Neanderthal symbolism (e.g. Iberian cave art dated in 2018) has also weakened the image of Neanderthals as incapable of symbol and imagination."}, "sources": ["src:76f2aff731", "src:da10502659"], "flags": ["contested", "editor-note"]}], "links": [{"to": "tabar:out-of-africa", "rel": "see-also", "note": {"fa": "پراکنش انسان خردمند از آفریقا", "en": "Dispersal of Homo sapiens out of Africa", "nl": "Dispersal of Homo sapiens out of Africa"}}, {"to": "tabar:human-evolution", "rel": "part-of", "note": {"fa": "تکامل انسان", "en": "Human evolution", "nl": "Human evolution"}}, {"to": "psy:art-origins", "rel": "see-also", "note": {"fa": "ریشه‌های هنر", "en": "Origins of art", "nl": "Origins of art"}}, {"to": "soc:cohesion", "rel": "bridges", "note": {"fa": "پیوند با فرضیهٔ همکاری در گروه‌های بزرگ", "en": "Bridges to the hypothesis of cooperation in large groups", "nl": "Bridges to the hypothesis of cooperation in large groups"}}], "people": ["core:sally-mcbrearty", "core:alison-s-brooks"], "sources": ["src:64cc653b84", "src:76f2aff731", "src:da10502659"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:human-family-tree-branching", "kind": "concept", "title": {"fa": "درخت خانوادگی شاخه‌شاخهٔ انسان", "en": "The branching human family tree", "nl": "De vertakte menselijke stamboom"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "پیام ششم سند می‌گوید تبارنامهٔ انسان یک خط راست نیست، بلکه درختی شاخه‌دار و متنوع است، همانند درخت خانوادگی تقریباً همهٔ موجودات زندهٔ دیگر. در هر دوره چند گونهٔ انسان‌تبار هم‌زمان می‌زیسته‌اند.", "en": "Message 6 of the handout says the human lineage is not a straight line but a branching, diverse tree, like the family trees of virtually all other living things. Several hominin species often lived at the same time.", "nl": "Boodschap 6 stelt dat de menselijke afstamming geen rechte lijn is maar een vertakte, diverse boom, zoals bij bijna alle andere levende wezens."}, "points": [{"text": {"fa": "تصویر قدیمی «میمون به انسان» با صف راست گمراه‌کننده است. سند تأکید می‌کند درخت خانوادگی انسان شاخه‌ها و بن‌بست‌های فراوان دارد و بیشتر گونه‌های آن منقرض شده‌اند.", "en": "The old 'ape to human' march-of-progress picture is misleading. The handout stresses that the human tree has many branches and dead ends, and most of its species are extinct.", "nl": "The old 'ape to human' march-of-progress picture is misleading. The handout stresses that the human tree has many branches and dead ends, and most of its species are extinct."}, "sources": ["src:a85b75e91c"], "flags": []}, {"text": {"fa": "سند برای آموزش این ایده به ابزارهای تعاملی (درخت گونه‌ها، فسیل‌های سه‌بعدی و «جمجمهٔ اسرارآمیز») ارجاع می‌دهد تا بازدیدکنندگان خودشان ویژگی‌های فسیل‌ها را مقایسه کنند.", "en": "To teach the idea, the handout points to interactives (a species tree, 3D fossils and a 'mystery skull') so visitors compare fossil features themselves.", "nl": "To teach the idea, the handout points to interactives (a species tree, 3D fossils and a 'mystery skull') so visitors compare fossil features themselves."}, "sources": ["src:a85b75e91c"], "flags": []}, {"text": {"fa": "نمودار نمایشگاه از «۶ میلیون سال تکامل انسان» یاد می‌کند. این عدد رقم گرد آموزشی است؛ سن کهن‌ترین گونه‌های مدعی انسان‌تباری هنوز محل بحث است، و تعداد دقیق گونه‌ها و روابط میانشان میان پژوهشگران یکسان نیست.", "en": "The exhibit diagram speaks of '6 million years of human evolution'. That is a round outreach figure; the age of the earliest claimed hominins is still debated, and researchers do not agree on the exact number of species or their relationships.", "nl": "The exhibit diagram speaks of '6 million years of human evolution'. That is a round outreach figure; the age of the earliest claimed hominins is still debated, and researchers do not agree on the exact number of species or their relationships."}, "sources": [], "flags": ["contested", "editor-note"]}, {"text": {"fa": "دی‌ان‌ای باستانی نشان داده شاخه‌ها فقط جدا نمانده‌اند و گاه با هم آمیخته‌اند (مثلاً انسان خردمند با نئاندرتال‌ها). پس «درخت» در عمل بیشتر شبیه شبکه‌ای از شاخه‌هاست. این نکته در سند نیامده و از ما است.", "en": "Ancient DNA shows branches did not stay isolated but sometimes interbred (e.g. Homo sapiens with Neanderthals), so the 'tree' is in practice closer to a braided network. This is not in the handout; it is the editors' addition.", "nl": "Ancient DNA shows branches did not stay isolated but sometimes interbred (e.g. Homo sapiens with Neanderthals), so the 'tree' is in practice closer to a braided network. This is not in the handout; it is the editors' addition."}, "sources": [], "flags": ["editor-note"]}], "links": [{"to": "tabar:neanderthal-admixture", "rel": "see-also", "note": {"fa": "آمیزش با نئاندرتال‌ها و دنیسوواها", "en": "Admixture with Neanderthals and Denisovans", "nl": "Admixture with Neanderthals and Denisovans"}}, {"to": "tabar:out-of-africa", "rel": "see-also", "note": {"fa": "خاستگاه آفریقایی انسان خردمند", "en": "The African origin of Homo sapiens", "nl": "The African origin of Homo sapiens"}}, {"to": "tabar:human-evolution", "rel": "part-of", "note": {"fa": "تکامل انسان", "en": "Human evolution", "nl": "Human evolution"}}], "people": [], "sources": ["src:a85b75e91c"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:fire-control-dating-debate", "kind": "concept", "title": {"fa": "بحث دربارهٔ زمان مهار آتش و آغاز پختن", "en": "The debate over when fire was controlled and cooking began", "nl": "Het debat over wanneer vuur werd beheerst en koken begon"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "همه موافق‌اند که انسان‌ها دست‌کم چند صد هزار سال است آتش را مهار می‌کنند. اما تاریخ آغاز آن ناروشن است: شواهد مطمئنِ باستان‌شناختی تا حدود ۷۹۰ هزار سال پیش (گِشِر بنوت یعقوب در اسرائیل) می‌رسد و شواهد قدیمی‌تر مورد مناقشه است. رانگهم برای اینکه پختن را به ۱٫۸ میلیون سال پیش ببرد از زیست‌شناسی استفاده می‌کند، که بیشتر باستان‌شناسان آن را کافی نمی‌دانند.", "en": "Everyone agrees humans have controlled fire for at least several hundred thousand years. The start is unclear: secure archaeological evidence reaches back to about 790,000 years (Gesher Benot Ya'aqov, Israel), and older claims are disputed. Wrangham uses biology to push cooking to 1.8 million years ago, which most archaeologists regard as insufficient.", "nl": "Dat mensen minstens enkele honderdduizenden jaren vuur beheersen is onomstreden. Het begin is onduidelijk: betrouwbaar archeologisch bewijs gaat terug tot circa 790.000 jaar (Gesher Benot Ya'aqov); ouder bewijs is omstreden. Wrangham gebruikt biologie om koken naar 1,8 miljoen jaar terug te dateren, wat de meeste archeologen onvoldoende vinden."}, "points": [{"text": {"fa": "به گفتهٔ رانگهم، شواهد آتش در ۲۵۰ هزار سال اخیر فراوان است (لانه‌ها و اجاق‌های سنگی در غارها، حتی نئاندرتال‌ها). در ۴۰۰ هزار سال پیش اجاق در بیچز پیت (انگلستان) و آتش و گوشت در شونینگن (آلمان) دیده شده است. قدیمی‌ترین جای با اطمینان بالا، گِشِر بنوت یعقوب (۷۹۰ هزار سال پیش) با دانه‌های سوخته و سنگ چخماق گرمادیده است.", "en": "Per Wrangham, fire evidence is abundant in the last 250,000 years (hearths in caves, even among Neanderthals). Around 400,000 years ago there are fireplaces at Beeches Pit (England) and fire with meat at Schöningen (Germany). The oldest confident site is Gesher Benot Ya'aqov (about 790,000 years ago), with burnt seeds and heated flint.", "nl": "Per Wrangham, fire evidence is abundant in the last 250,000 years (hearths in caves, even among Neanderthals). Around 400,000 years ago there are fireplaces at Beeches Pit (England) and fire with meat at Schöningen (Germany). The oldest confident site is Gesher Benot Ya'aqov (about 790,000 years ago), with burnt seeds and heated flint."}, "sources": ["src:c12cd83ad0"], "flags": []}, {"text": {"fa": "سایت‌های قدیمی‌تر (۱ تا ۱٫۵ میلیون سال، مثل سوارتکرانس در آفریقای جنوبی و چسووانجا در کنیا) تکه‌هایی مثل استخوان سوخته و خاک گرمادیده دارند. رانگهم خودش می‌گوید معنایشان مناقشه‌برانگیز است و ممکن است آتش طبیعی (مثلاً صاعقه) بوده باشد.", "en": "Older sites (1–1.5 million years, such as Swartkrans in South Africa and Chesowanja in Kenya) show items like burnt bone and heated clay. Wrangham himself says their meaning is disputed, and natural fire such as lightning may explain them.", "nl": "Older sites (1–1.5 million years, such as Swartkrans in South Africa and Chesowanja in Kenya) show items like burnt bone and heated clay. Wrangham himself says their meaning is disputed, and natural fire such as lightning may explain them."}, "sources": ["src:c12cd83ad0"], "flags": []}, {"text": {"fa": "استدلال زیست‌شناختی او: اگر پختن حیاتی بود، تغییر بزرگ و سریعی در دندان و روده انتظار می‌رود، و تنها گذاری که با آن می‌خواند گذار هابیلین به هومو ارکتوس است. او می‌گوید جانوران ممکن است رژیم تازه را سریع با آناتومی خود وفق دهند و تأخیر طولانی میان مهار آتش و پختن ناباورپذیر است.", "en": "His biological argument: if cooking mattered, rapid, large changes in teeth and gut should follow, and the only transition that fits is habilines to Homo erectus. He says animals adapt anatomy quickly to a new diet and a long delay between fire control and cooking is implausible.", "nl": "His biological argument: if cooking mattered, rapid, large changes in teeth and gut should follow, and the only transition that fits is habilines to Homo erectus. He says animals adapt anatomy quickly to a new diet and a long delay between fire control and cooking is implausible."}, "sources": ["src:c12cd83ad0"], "flags": []}, {"text": {"fa": "نظر ویراستار: بیشتر باستان‌شناسان می‌گویند استفادهٔ پیوسته و روزمره از آتش (که برای سازگاری زیستی لازم است) هنوز پیش از ۴۰۰ هزار سال پیش اثبات نشده است؛ رُبروکس و ویلا (۲۰۱۱) برای اروپا همین را گفتند. در مقابل، برنا و همکاران (۲۰۱۲) در غار وندروک آفریقای جنوبی استخوان سوخته و خاکستر گیاهی حدود ۱ میلیون سال پیش گزارش کردند. نبودِ شواهد قدیمی‌تر را می‌توان به حفظ‌نشدن نسبت داد، اما این به معنای وجودشان هم نیست.", "en": "Editor's note: most archaeologists hold that habitual daily use of fire (needed for biological adaptation) is not demonstrated before about 400,000 years ago; Roebroeks and Villa (2011) argued this for Europe. In contrast, Berna and colleagues (2012) reported burnt bone and plant ash about 1 million years old in Wonderwerk Cave, South Africa. Absence of older evidence may be due to poor preservation, but that does not make it presence.", "nl": "Editor's note: most archaeologists hold that habitual daily use of fire (needed for biological adaptation) is not demonstrated before about 400,000 years ago; Roebroeks and Villa (2011) argued this for Europe. In contrast, Berna and colleagues (2012) reported burnt bone and plant ash about 1 million years old in Wonderwerk Cave, South Africa. Absence of older evidence may be due to poor preservation, but that does not make it presence."}, "sources": ["src:b5a5a6d8f7", "src:7df02a19b3"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "نظر ویراستار: فاصلهٔ ۱٫۸ میلیون تا ۷۹۰ هزار سال بین زمان پیشنهادی رانگهم و شواهد مطمئن، قابل توجه است. بعضی پژوهشگران (مثل گاولت، ۲۰۱۶) می‌گویند مهار آتش فرایندی تدریجی و پراکنده بود، نه یک «لحظهٔ اختراع»، و ممکن است در گروه‌های مختلف بارها آغاز و قطع شده باشد. پس اینکه پختن علت پیدایش هومو ارکتوس باشد هنوز فرضیه است.", "en": "Editor's note: the gap between Wrangham's 1.8 million years and secure evidence at 790,000 is large. Some researchers (e.g. Gowlett, 2016) see fire control as gradual and patchy rather than a single invention, possibly begun and lost many times in different groups. That cooking caused the origin of Homo erectus therefore remains a hypothesis.", "nl": "Editor's note: the gap between Wrangham's 1.8 million years and secure evidence at 790,000 is large. Some researchers (e.g. Gowlett, 2016) see fire control as gradual and patchy rather than a single invention, possibly begun and lost many times in different groups. That cooking caused the origin of Homo erectus therefore remains a hypothesis."}, "sources": ["src:86e6d9d7b8"], "flags": ["contested", "editor-note"]}], "links": [{"to": "tabar:cooking-hypothesis", "rel": "critiques", "note": {"fa": "فرضیهٔ پختن", "en": "The cooking hypothesis", "nl": "The cooking hypothesis"}}, {"to": "tabar:human-evolution", "rel": "part-of", "note": {"fa": "تکامل انسان", "en": "Human evolution", "nl": "Human evolution"}}, {"to": "tabar:out-of-africa", "rel": "see-also", "note": {"fa": "خاستگاه آفریقایی انسان خردمند", "en": "The African origin of Homo sapiens", "nl": "The African origin of Homo sapiens"}}], "people": ["core:naama-goren-inbar", "core:wil-roebroeks", "core:john-gowlett"], "sources": ["src:7df02a19b3", "src:86e6d9d7b8", "src:b5a5a6d8f7", "src:c12cd83ad0"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:mutation-selection-drift", "kind": "concept", "title": {"fa": "جهش، انتخاب و رانش", "en": "Mutation, selection and drift", "nl": "Mutatie, selectie en drift"}, "aliases": [], "parent": "tabar:basics", "field": "tabar:basics", "summary": {"fa": "جهش خام‌مایهٔ تنوع را می‌سازد، انتخاب طبیعی آن را بر اساس بقا و تولیدمثل غربال می‌کند، و رانش (شانس) در جمعیت‌های کوچک فراوانی ژن‌ها را بی‌دلیل بالا و پایین می‌برد. بیشتر تفاوت‌های ژنتیکی میان جمعیت‌ها حاصل رانش و مهاجرت‌اند، نه انتخاب.", "en": "Mutation makes the raw material of variation, natural selection sifts it by survival and reproduction, and drift (chance) in small populations pushes gene frequencies up and down for no reason. Most genetic differences between populations come from drift and migration, not selection.", "nl": "Mutatie levert de grondstof van variatie, natuurlijke selectie zeeft haar op overleving en voortplanting, en drift (toeval) duwt in kleine populaties genfrequenties zonder reden op en neer. De meeste genetische verschillen tussen populaties komen door drift en migratie, niet door selectie."}, "points": [{"text": {"fa": "کُنگ و همکاران (۲۰۱۲، ایسلند): هر نوزاد حدود ۶۰ جهش تازه دارد که در والدینش نبود، و تعدادشان با هر سال سنِ پدر حدود ۲ تا افزایش می‌یابد؛ سن پدر مهم‌ترین عامل جهش‌های نو است.", "en": "Kong et al. (2012, Iceland): each newborn carries about 60 new mutations absent in its parents, and the number rises by about 2 per year of the father's age; paternal age is the main driver of new mutations.", "nl": "Kong et al. (2012, Iceland): each newborn carries about 60 new mutations absent in its parents, and the number rises by about 2 per year of the father's age; paternal age is the main driver of new mutations."}, "sources": ["src:1a78fe1a85"], "flags": []}, {"text": {"fa": "فیلد و همکاران (۲۰۱۶): با روش جدید، نشانه‌های انتخاب طبیعی در بریتانیایی‌ها در فقط ۲ هزار سال اخیر یافت شد (تداوم لاکتاز، رنگ مو و چشم، قد)؛ تکامل انسان ادامه دارد، ولی اثرها کوچک و کند هستند.", "en": "Field et al. (2016): with a new method, signs of natural selection in Britons within just the last 2 thousand years were found (lactase persistence, hair and eye colour, height); human evolution continues, but the effects are small and slow.", "nl": "Field et al. (2016): with a new method, signs of natural selection in Britons within just the last 2 thousand years were found (lactase persistence, hair and eye colour, height); human evolution continues, but the effects are small and slow."}, "sources": ["src:116163adcf"], "flags": []}], "links": [{"to": "tabar:lactase-gene-culture", "rel": "evidence-for", "note": {"fa": "نمونهٔ انتخاب اخیر", "en": "A case of recent selection", "nl": "A case of recent selection"}}, {"to": "tabar:out-of-africa", "rel": "explains", "note": {"fa": "اثر بنیان‌گذار = رانش", "en": "Founder effect = drift", "nl": "Founder effect = drift"}}, {"to": "tabar:human-genome", "rel": "prerequisite", "note": {"fa": "ژنوم", "en": "The genome", "nl": "The genome"}}], "people": ["core:charles-darwin", "core:gregor-mendel"], "sources": ["src:116163adcf", "src:1a78fe1a85"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:iranian-farmer-legacy", "kind": "concept", "title": {"fa": "میراث کشاورزان ایرانی در استپ، لوانت و جنوب آسیا", "en": "The legacy of the Iranian farmers in the steppe, the Levant and South Asia", "nl": "De erfenis van de Iraanse boeren in de steppe, de Levant en Zuid-Azië"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "پژوهش لازاریدیس و همکاران نشان می‌دهد تبارِ وابسته به کشاورزان غرب ایران در هزاره‌های بعد به سوی شمال (استپ)، جنوب‌غرب (لوانت عصر مفرغ) و شرق (جنوب آسیا) پخش شد. در همان زمان کشاورزان وابسته به آناتولی به اروپا و کشاورزان وابسته به لوانت به شرق آفریقا رسیدند.", "en": "Lazaridis and colleagues show that ancestry related to the early farmers of western Iran spread in later millennia north (the steppe), south-west (Bronze Age Levant) and east (South Asia). Meanwhile Anatolian-related farmers reached Europe and Levant-related farmers East Africa.", "nl": "Volgens Lazaridis e.a. verspreidde de afstamming van de vroege boeren van West-Iran zich naar de steppe, de Bronstijd-Levant en Zuid-Azië, terwijl Anatolische boeren Europa bereikten."}, "points": [{"text": {"fa": "به سوی شمال: تبار وابسته به مس‌سنگی ایران حدود ۴۳٪ از تبار مردم عصر مفرغ نخستینِ استپ اوراسیا را تشکیل می‌داد. پیش‌تر این را بدون نمونهٔ باستانی و با فرض یک منبع شبیه ارمنی‌های امروزی حدس زده بودند.", "en": "Northward: ancestry related to Chalcolithic Iran made up about 43% of early Bronze Age steppe peoples. This had earlier been inferred without ancient samples, by assuming a source resembling present-day Armenians.", "nl": "Northward: ancestry related to Chalcolithic Iran made up about 43% of early Bronze Age steppe peoples. This had earlier been inferred without ancient samples, by assuming a source resembling present-day Armenians."}, "sources": ["src:43526796e0"], "flags": []}, {"text": {"fa": "به سوی جنوب‌غرب و غرب: همین خاستگاه حدود ۴۴٪ از تبار مردم عصر مفرغ لوانت جنوبی و حدود ۳۳٪ از مردم مس‌سنگی شمال‌غرب آناتولی را توضیح می‌دهد. کشاورزان نخستین اروپا به جمعیت وابسته به نوسنگی شمال‌غرب آناتولی می‌رسند و نه مستقیماً به کشاورزان لوانت. گروه‌های شرق آفریقا با آمیختگی غرب‌اوراسیایی در حدود ۱۰۰۰ پیش از میلاد بهتر با کشاورزان لوانتی مدل می‌شوند.", "en": "South-west and west: the same source explains about 44% of Bronze Age southern Levantine ancestry and about 33% of Chalcolithic northwestern Anatolians. The first European farmers descend from a population related to Neolithic northwestern Anatolians, not directly from Levantine farmers. East African groups with West Eurasian admixture around 1,000 BCE are better modelled by Levantine early farmers.", "nl": "South-west and west: the same source explains about 44% of Bronze Age southern Levantine ancestry and about 33% of Chalcolithic northwestern Anatolians. The first European farmers descend from a population related to Neolithic northwestern Anatolians, not directly from Levantine farmers. East African groups with West Eurasian admixture around 1,000 BCE are better modelled by Levantine early farmers."}, "sources": ["src:43526796e0"], "flags": []}, {"text": {"fa": "به سوی شرق: «شمالی‌های هندی نیاکانی» (ANI) را نمی‌توان از یک جمعیت باستانیِ تنها ساخت، اما می‌توان آن را آمیزهٔ تبار وابسته به کشاورزان غرب ایران و تبار وابسته به استپ عصر مفرغ مدل کرد. سهم تبار استپی در مالا (جنوب هند، ANI کم) حدود ۱۸٪ و در کالش (پاکستان) حدود ۵۰٪ برآورد شد.", "en": "Eastward: 'Ancestral North Indians' (ANI) cannot be modelled from any single ancient population but can be modelled as a mix of ancestry related to western Iranian farmers and to the Bronze Age steppe. Steppe-related ancestry was estimated at about 18% in the Mala (south India, little ANI) and about 50% in the Kalash (Pakistan).", "nl": "Eastward: 'Ancestral North Indians' (ANI) cannot be modelled from any single ancient population but can be modelled as a mix of ancestry related to western Iranian farmers and to the Bronze Age steppe. Steppe-related ancestry was estimated at about 18% in the Mala (south India, little ANI) and about 50% in the Kalash (Pakistan)."}, "sources": ["src:43526796e0"], "flags": []}, {"text": {"fa": "این‌ها برآوردهای مدل‌محورِ qpAdm هستند و مدل‌های جایگزین با منابع غایب (جمعیت‌های «شبح» نمونه‌برداری‌نشده) ممکن است عددها را عوض کنند؛ نویسندگان خودشان برای سنجش پایداری روشی برای جمعیت‌های شبح ساختند. جابه‌جایی «از ایران به استپ» نباید با فرض هر نوع زبان یا قوم خاصی خوانده شود، چون این مقاله دربارهٔ زبان یا هویت قومی چیزی نمی‌گوید.", "en": "These are model-based qpAdm estimates, and alternative models with absent sources (unsampled 'ghost' populations) could change the numbers; the authors built a ghost-population method to test robustness. 'Iran to steppe' must not be read as implying any particular language or ethnicity, since this paper says nothing on language or ethnic identity.", "nl": "These are model-based qpAdm estimates, and alternative models with absent sources (unsampled 'ghost' populations) could change the numbers; the authors built a ghost-population method to test robustness. 'Iran to steppe' must not be read as implying any particular language or ethnicity, since this paper says nothing on language or ethnic identity."}, "sources": ["src:43526796e0"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "برای ادامهٔ ماجرا (ورود تبار استپی به ایران و جنوب آسیا و رابطه‌اش با زبان‌های هندوایرانی) باید پژوهش‌های بعدی را دید؛ این مقاله فقط تصویر ۲۰۱۶ است.", "en": "For the continuation (steppe ancestry entering Iran and South Asia and its relation to the Indo-Iranian languages) later studies must be consulted; this paper gives only the 2016 picture.", "nl": "For the continuation (steppe ancestry entering Iran and South Asia and its relation to the Indo-Iranian languages) later studies must be consulted; this paper gives only the 2016 picture."}, "sources": [], "flags": ["dated", "editor-note"]}], "links": [{"to": "tabar:steppe-indo-iranian", "rel": "see-also", "note": {"fa": "تبار استپی و زبان‌های هندوایرانی", "en": "Steppe ancestry and the Indo-Iranian languages", "nl": "Steppe ancestry and the Indo-Iranian languages"}}, {"to": "tabar:iranian-genetic-diversity", "rel": "see-also", "note": {"fa": "تنوع ژنتیکی مردم ایران", "en": "Genetic diversity of the Iranian population", "nl": "Genetic diversity of the Iranian population"}}, {"to": "tabar:zagros-neolithic", "rel": "part-of", "note": {"fa": "کشاورزان نوسنگی زاگرس", "en": "Zagros Neolithic farmers", "nl": "Zagros Neolithic farmers"}}], "people": [], "sources": ["src:43526796e0"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:first-toolmakers-debate", "kind": "concept", "title": {"fa": "نخستین ابزارسازان: چه کسی و چرا", "en": "The first toolmakers: who and why", "nl": "De eerste gereedschapsmakers: wie en waarom"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "سال‌ها فرض می‌شد فقط جنس «انسان» (هومو) ابزار سنگی ساخته و این کار پاسخ به تغییر اقلیم و گسترش ساوانا بوده است. کشف لومکوی ۳ این فرض را زیر سؤال می‌برد، چون ابزارها حدود یک میلیون سال پیش از قدیمی‌ترین فسیل‌های هومو در همان منطقه‌اند. اما این‌که سازنده چه گونه‌ای بوده هنوز پاسخ روشنی ندارد.", "en": "For years it was assumed that only the genus Homo made stone tools, in response to climate change and spreading savannah. Lomekwi 3 challenges this, since the tools predate the oldest Homo fossils in the same region by nearly a million years. Which species made them is still open.", "nl": "Lang werd aangenomen dat alleen het geslacht Homo stenen werktuigen maakte, als reactie op klimaatverandering en savanne-uitbreiding. Lomekwi 3 stelt dat ter discussie; welke soort de makers waren, blijft onzeker."}, "points": [{"text": {"fa": "فرضِ رایج این بود که ساخت ابزار تیز سنگی «جهش شناختی» تنها خطّ تبار ما بوده و پایهٔ موفقیت تکاملی‌اش شد. نام Homo habilis («انسان توانا») هم همین‌جا از ۱۹۶۴ از همراهی فسیل‌ها با ابزارهای اولدوان در اولدووای آمده است.", "en": "The conventional view held that making sharp stone tools was a cognitive leap unique to our own lineage and the basis of its success. The name Homo habilis ('handy man') comes from the 1964 association of fossils with Oldowan tools at Olduvai Gorge.", "nl": "The conventional view held that making sharp stone tools was a cognitive leap unique to our own lineage and the basis of its success. The name Homo habilis ('handy man') comes from the 1964 association of fossils with Oldowan tools at Olduvai Gorge."}, "sources": ["src:23b2553ce8"], "flags": []}, {"text": {"fa": "نویسندگان می‌نویسند که در ترکانای غربی کهن‌ترین فسیل‌های منسوب به هومو حدود ۲٫۳۴ میلیون سال پیش‌اند و تنها گونهٔ شناخته‌شدهٔ هم‌زمان با لومکوی ۳ «کنیانتروپوس پلاتیوپس» است. این به معنای اثبات سازندگی آن گونه نیست؛ فسیل‌ها فقط در همان بازهٔ زمانی و مکانی یافت شده‌اند.", "en": "The authors note that the oldest Homo-attributed fossils in West Turkana are about 2.34 Ma and that the only known hominin species there at the time is Kenyanthropus platyops. That does not prove it was the toolmaker; the fossils merely share the same time and place.", "nl": "The authors note that the oldest Homo-attributed fossils in West Turkana are about 2.34 Ma and that the only known hominin species there at the time is Kenyanthropus platyops. That does not prove it was the toolmaker; the fossils merely share the same time and place."}, "sources": ["src:23b2553ce8"], "flags": []}, {"text": {"fa": "از دقت دست و هماهنگی لازم برای این کار، نویسندگان حدس می‌زنند مغز و دست پیشاهومو پیش از ۳٫۳ میلیون سال هم تغییراتی کرده بوده است. این استنباط است و هنوز مدرکی مستقیم ندارد؛ ریخت دست آسترالوپیتکوس آفارنسیس باید بیشتر سنجیده شود.", "en": "From the manual control the tools imply, the authors infer that changes in hand and brain may already have occurred before 3.3 Ma. This is inference without direct evidence; the hand anatomy of Australopithecus afarensis needs more study.", "nl": "From the manual control the tools imply, the authors infer that changes in hand and brain may already have occurred before 3.3 Ma. This is inference without direct evidence; the hand anatomy of Australopithecus afarensis needs more study."}, "sources": ["src:23b2553ce8"], "flags": ["editor-note", "contested"]}, {"text": {"fa": "پیش‌تر هم گفته شده بود که شاید پیش از ۲٫۶ میلیون سال ابزار به کار می‌رفته است. مثلاً استخوان‌های دارای اثر برش از دیکیکا (اتیوپی، حدود ۳٫۳۹ میلیون سال) را مک‌فرسون و همکاران (۲۰۱۰) نشانهٔ استفاده از ابزار سنگی دانستند، اما پژوهشگرانی این برداشت را رد کرده‌اند و اثرها را به لگدمال‌شدن جانوران و رسوب نسبت می‌دهند.", "en": "Earlier claims for pre-2.6 Ma tool use exist. For example, cut-marked bones from Dikika, Ethiopia (about 3.39 Ma) were read by McPherron and colleagues (2010) as evidence of stone-tool use, but other researchers dispute this and attribute the marks to trampling and sediment abrasion.", "nl": "Earlier claims for pre-2.6 Ma tool use exist. For example, cut-marked bones from Dikika, Ethiopia (about 3.39 Ma) were read by McPherron and colleagues (2010) as evidence of stone-tool use, but other researchers dispute this and attribute the marks to trampling and sediment abrasion."}, "sources": ["src:50b9020315"], "flags": ["contested"]}, {"text": {"fa": "بعدها برخی پژوهشگران دربارهٔ خود لومکوی ۳ هم پرسش‌هایی مطرح کرده‌اند، از جمله این‌که برخی قطعه‌ها ممکن است محصول شکستگی طبیعی باشند و شواهد بیشتری لازم است. پس این کشف را باید نتیجه‌ای قابل‌بحث دانست، نه حقیقتی قطعی. در همان سال هم فکّ ۲٫۸ میلیون‌سالهٔ لدی‌گراروی (اتیوپی) به هومو نسبت داده شد و پیشینهٔ جنس هومو را به عقب برد.", "en": "Some researchers have since questioned LOM3 itself, for example whether some pieces could be natural breakage, and called for more evidence, so the find is best treated as a debated result, not settled fact. Also in 2015, a 2.8-million-year-old jaw from Ledi-Geraru (Ethiopia) was attributed to Homo, pushing the genus back in time.", "nl": "Some researchers have since questioned LOM3 itself, for example whether some pieces could be natural breakage, and called for more evidence, so the find is best treated as a debated result, not settled fact. Also in 2015, a 2.8-million-year-old jaw from Ledi-Geraru (Ethiopia) was attributed to Homo, pushing the genus back in time."}, "sources": ["src:4cdd99d12a", "src:23b2553ce8"], "flags": ["contested", "editor-note"]}], "links": [{"to": "tabar:lomekwian-stone-technology", "rel": "see-also", "note": {"fa": "فناوری لومکوی", "en": "Lomekwian stone technology", "nl": "Lomekwian stone technology"}}, {"to": "tabar:out-of-africa", "rel": "bridges", "note": {"fa": "خاستگاه آفریقایی انسان خردمند", "en": "The African origin of Homo sapiens", "nl": "The African origin of Homo sapiens"}}, {"to": "tabar:social-brain-evolution", "rel": "bridges", "note": {"fa": "چرا مغز اجتماعی شدیم", "en": "Why our brains went social", "nl": "Why our brains went social"}}, {"to": "tabar:ochre-middle-stone-age", "rel": "see-also", "note": {"fa": "اُکر در عصر حجر میانی", "en": "Ochre in the Middle Stone Age", "nl": "Ochre in the Middle Stone Age"}}], "people": ["core:louis-leakey", "core:meave-leakey"], "sources": ["src:23b2553ce8", "src:4cdd99d12a", "src:50b9020315"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:t1-haplogroup-method-and-limits", "kind": "concept", "title": {"fa": "روش هاپلوگروه‌محور در بازسازی تاریخ جمعیت‌ها و محدودیت‌های آن", "en": "Haplogroup-based reconstruction of population history, and its limits", "nl": "Haplogroepen als methode om populatiegeschiedenis te reconstrueren"}, "aliases": [], "parent": "tabar:population-genetics", "field": "tabar:population-genetics", "summary": {"fa": "کتاب تاریخ جمعیت‌های انسانی را با ردگیری هاپلوگروه‌های کروموزوم Y و میتوکندری بازمی‌گوید. این مدخل منطق این روش و حدود اعتبارش را شرح می‌دهد.", "en": "The book retells human population history by tracing Y-chromosome and mitochondrial haplogroups. This entry explains the logic of the method and where it stops being reliable.", "nl": "Het boek vertelt de menselijke populatiegeschiedenis via Y-chromosoom- en mitochondriale haplogroepen; dit item beschrijft de methode en haar grenzen."}, "points": [{"text": {"fa": "هاپلوگروه مجموعه‌ای از گونه‌های ژنتیکی است که با هم و بدون بازآرایی به نسل بعد می‌رسند: بر کروموزوم Y از پدر به پسر و در میتوکندری از مادر به فرزندان. نویسنده با ردگیری آن‌ها شاخه‌های خویشاوندی جمعیت‌ها را بازسازی می‌کند.", "en": "A haplogroup is a set of genetic variants inherited together as a block: on the Y chromosome from father to son, in mitochondria from mother to children. The author traces these to rebuild the branching relatedness of populations.", "nl": "A haplogroup is a set of genetic variants inherited together as a block: on the Y chromosome from father to son, in mitochondria from mother to children. The author traces these to rebuild the branching relatedness of populations."}, "sources": ["src:93456bf0b8"], "flags": []}, {"text": {"fa": "زمان‌یابی بر «ساعت مولکولی» تکیه دارد: جهش‌های تصادفی در بخش‌های غیرکارکردی ژنوم با آهنگی تقریباً ثابت انباشته می‌شوند و از شمار آن‌ها می‌توان زمان جدایی دو شاخه را برآورد کرد.", "en": "Dating relies on a molecular clock: random mutations in non-functional stretches of the genome accumulate at a roughly steady rate, and their count lets one estimate when two branches split.", "nl": "Dating relies on a molecular clock: random mutations in non-functional stretches of the genome accumulate at a roughly steady rate, and their count lets one estimate when two branches split."}, "sources": ["src:93456bf0b8"], "flags": []}, {"text": {"fa": "به گفتهٔ نویسنده، ژنوم میتوکندری حدود شانزده‌هزار و پانصد جفت باز دارد و کروموزوم Y حدود شصت میلیون؛ از این رو ساعت Y دقیق‌تر است، در حالی که توالی میتوکندری کوچک‌تر و ناپایدارتر است و جهش‌های بیشتری نشان می‌دهد.", "en": "By the author's account the mitochondrial genome has about 16,500 base pairs and the Y chromosome about 60 million, so the Y clock is more precise, whereas the small mitochondrial sequence is less stable and shows more mutations.", "nl": "By the author's account the mitochondrial genome has about 16,500 base pairs and the Y chromosome about 60 million, so the Y clock is more precise, whereas the small mitochondrial sequence is less stable and shows more mutations."}, "sources": ["src:93456bf0b8"], "flags": []}, {"text": {"fa": "پیش از سال ۲۰۰۲ هر مرکز پژوهشی نام‌گذاری خودش را داشت و این سردرگمی می‌آفرید. کنسرسیومی نام‌گذاری استانده برای Y ساخت و کارافه و همکارانش در ۲۰۰۸ چارچوبی بازبینی‌شده با حدود ۳۱۱ شاخه و حدود ۶۰۰ نشانگر دوتایی پیشنهاد کردند.", "en": "Before 2002 each lab used its own naming, which caused confusion. A consortium standardised Y naming, and in 2008 Karafet and colleagues proposed a revised tree with about 311 branches and about 600 binary markers.", "nl": "Before 2002 each lab used its own naming, which caused confusion. A consortium standardised Y naming, and in 2008 Karafet and colleagues proposed a revised tree with about 311 branches and about 600 binary markers."}, "sources": ["src:93456bf0b8", "src:715fe250c8"], "flags": []}, {"text": {"fa": "هاپلوگروه فقط دو رشتهٔ باریک از نیاکان هر فرد (خط پدرِ پدر و خط مادرِ مادر) را نشان می‌دهد و از ترکیب کل ژنوم بی‌خبر است. از دههٔ ۲۰۱۰ به بعد DNA باستانی و داده‌های ژنوم کامل بسیاری از نتیجه‌گیری‌های مبتنی بر هاپلوگروه را اصلاح کرده‌اند؛ برابر دانستن هاپلوگروه با «قوم» یا «زبان» ساده‌سازی است.", "en": "A haplogroup follows only two thin strands of anyone's ancestry (the father's father line and the mother's mother line) and says nothing about the whole genome. Since the 2010s ancient DNA and whole-genome data have revised many haplogroup-only conclusions; equating a haplogroup with an 'ethnicity' or a 'language' is a simplification.", "nl": "A haplogroup follows only two thin strands of anyone's ancestry (the father's father line and the mother's mother line) and says nothing about the whole genome. Since the 2010s ancient DNA and whole-genome data have revised many haplogroup-only conclusions; equating a haplogroup with an 'ethnicity' or a 'language' is a simplification."}, "sources": [], "flags": ["contested", "editor-note"]}, {"text": {"fa": "کتاب چند نمونهٔ هاپلوگروه چهره‌های تاریخی و مشهور را هم می‌آورد؛ این نمونه‌ها اغلب بر داده‌های غیرمستقیم یا بازسازی‌های سست تکیه دارند و ارزش علمی محدودی دارند و نباید جدی گرفته شوند.", "en": "The book also lists haplogroups of famous historical figures; these often rest on indirect or weak reconstructions and carry little scientific weight.", "nl": "The book also lists haplogroups of famous historical figures; these often rest on indirect or weak reconstructions and carry little scientific weight."}, "sources": [], "flags": ["contested", "editor-note"]}], "links": [{"to": "tabar:haplogroups", "rel": "explains", "note": {"fa": "توضیح عمومی هاپلوگروه‌ها", "en": "General explanation of haplogroups", "nl": "General explanation of haplogroups"}}, {"to": "tabar:ancient-dna", "rel": "see-also", "note": {"fa": "داده‌های باستانی بسیاری از برداشت‌های هاپلوگروهی را اصلاح کرده‌اند", "en": "Ancient DNA has revised many haplogroup-only readings", "nl": "Ancient DNA has revised many haplogroup-only readings"}}, {"to": "tabar:population-genetics", "rel": "part-of", "note": {"fa": "روش‌های ژنومیک جمعیت", "en": "Population-genomics methods", "nl": "Population-genomics methods"}}], "people": ["core:tatiana-karafet", "core:bryan-sykes"], "sources": ["src:715fe250c8", "src:93456bf0b8"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:gwas-polygenic", "kind": "concept", "title": {"fa": "مطالعات گسترهٔ ژنوم و نمرهٔ چندژنی", "en": "GWAS and polygenic scores", "nl": "GWAS en polygene scores"}, "aliases": ["GWAS", "polygenic score", "PGS", "PRS"], "parent": "tabar:behavior-genetics", "field": "tabar:behavior-genetics", "summary": {"fa": "به جای جست‌وجوی «ژنِ» یک صفت، میلیون‌ها تفاوت کوچک در ژنوم صدها هزار نفر با صفت مقایسه می‌شود؛ حاصل، نمره‌ای است که اندکی پیش‌بینی می‌کند و خیلی سوءتعبیر می‌شود.", "en": "Instead of hunting for \"the gene\" of a trait, millions of tiny genome differences in hundreds of thousands of people are compared with the trait; the result is a score that predicts a little and is misread a lot.", "nl": "In plaats van te zoeken naar \"het gen\" van een eigenschap worden miljoenen kleine genoomverschillen bij honderdduizenden mensen vergeleken met de eigenschap; het resultaat is een score die weinig voorspelt en veel verkeerd wordt gelezen."}, "points": [{"text": {"fa": "مطالعهٔ ۱٫۱ میلیون نفر: ۱٬۲۷۱ واریانت مرتبط با سال‌های تحصیل؛ نمرهٔ چندژنی حاصل حدود ۱۱ تا ۱۳ درصد واریانس را در نمونه‌های مستقل توضیح می‌دهد.", "en": "Study of 1.1 million people: 1,271 variants associated with years of schooling; the resulting polygenic score explains about 11 to 13 percent of variance in independent samples.", "nl": "Study of 1.1 million people: 1,271 variants associated with years of schooling; the resulting polygenic score explains about 11 to 13 percent of variance in independent samples."}, "sources": ["src:69bb669df7"], "flags": []}, {"text": {"fa": "درون خانواده (مقایسهٔ خواهر و برادر) قدرت پیش‌بینی نمرهٔ تحصیل تقریباً نصف می‌شود: بخشی از آنچه «ژنتیکی» می‌نمود، اثر محیطِ خانواده و ژن‌های والدین بود («طبیعتِ تربیت»).", "en": "Within families (comparing siblings), the education score's predictive power roughly halves: part of what looked \"genetic\" was family environment and parental genes (\"the nature of nurture\").", "nl": "Within families (comparing siblings), the education score's predictive power roughly halves: part of what looked \"genetic\" was family environment and parental genes (\"the nature of nurture\")."}, "sources": ["src:4e5c76eea4", "src:0d7705b088"], "flags": []}, {"text": {"fa": "نمره‌های چندژنی ساخته‌شده روی جمعیت‌های اروپایی‌تبار در جمعیت‌های دیگر بسیار ضعیف‌تر کار می‌کنند؛ استفادهٔ بالینی زودهنگام می‌تواند نابرابری سلامت را بیشتر کند.", "en": "Polygenic scores built on European-ancestry populations work much worse in other populations; premature clinical use could widen health disparities.", "nl": "Polygenic scores built on European-ancestry populations work much worse in other populations; premature clinical use could widen health disparities."}, "sources": ["src:f02227bf85"], "flags": []}, {"text": {"fa": "«وراثت‌پذیری گمشده»: نمره‌های چندژنی هنوز بسیار کمتر از برآورد دوقلوها توضیح می‌دهند؛ دلایل احتمالی: واریانت‌های نادر، اثرهای بسیار کوچک، تعامل‌ها، و بیش‌برآورد دوقلوها.", "en": "\"Missing heritability\": polygenic scores still explain far less than twin estimates; likely reasons include rare variants, very small effects, interactions, and inflated twin estimates.", "nl": "\"Missing heritability\": polygenic scores still explain far less than twin estimates; likely reasons include rare variants, very small effects, interactions, and inflated twin estimates."}, "sources": ["src:88fc1feb66", "src:5cdd7ce079"], "flags": []}], "links": [{"to": "psy:psych-genetics", "rel": "evidence-for", "note": {"fa": "شکست ژن‌های کاندید افسردگی", "en": "The failure of candidate genes for depression", "nl": "The failure of candidate genes for depression"}}, {"to": "tabar:heritability", "rel": "measured-by", "note": {"fa": "برآورد وراثت‌پذیری از خودِ دی‌ان‌ای", "en": "Estimating heritability from DNA itself", "nl": "Estimating heritability from DNA itself"}}, {"to": "tabar:ancestry-tests", "rel": "see-also", "note": {"fa": "چرا پنل مرجع مهم است", "en": "Why the reference panel matters", "nl": "Why the reference panel matters"}}], "people": ["core:robert-plomin", "core:kathryn-paige-harden"], "sources": ["src:0d7705b088", "src:4e5c76eea4", "src:5cdd7ce079", "src:69bb669df7", "src:88fc1feb66", "src:f02227bf85"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:racial-bias-in-paleoanthropology", "kind": "concept", "title": {"fa": "سوگیری نژادی در تفسیر فسیل‌ها: خط موویوس، «بربرهای ژرمن» و انسان رودزیایی", "en": "Racial bias in reading fossils: the Movius Line, 'Germanic barbarians' and 'Rhodesian Man'", "nl": "Raciale vooringenomenheid bij het lezen van fossielen: de Movius-lijn, 'Germaanse barbaren' en de 'Rhodesische mens'"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "«خداحافظ آفریقا» در چند اپیزود نشان می‌دهد که پیش‌داوری نژادی چگونه تفسیر دانشمندانِ برجسته را از شواهد انسان‌شناختی کج کرده است: توضیحِ نبودِ تبردستی در شرق آسیا با «ناتوانی مغزی»، توضیح استخوان‌های نئاندرتال با «بربرهای ژرمن»، و نام‌گذاریِ یک فسیل به نام یک مستعمرهٔ نژادپرست. در هر سه مورد، شواهد بعدی تفسیرِ نژادی را رد کرد و توضیحی ساده‌تر و علمی‌تر جایش نشست. درس برنامه: حتی استادان دانشگاه‌های بزرگ از این خطا مصون نیستند و علم باید دائماً پیش‌فرض‌های خود را بیازماید.", "en": "Across several episodes the programme shows how racial prejudice distorted eminent scientists' readings of evidence: explaining the absence of hand-axes in East Asia by 'mental inferiority', explaining Neanderthal bones as 'Germanic barbarians', and naming a fossil after a racist colony. In each case later evidence refuted the racial reading and a simpler, scientific explanation replaced it. Lesson: even professors at top universities are not immune, and science must keep testing its assumptions.", "nl": "In verschillende afleveringen laat het programma zien hoe raciale vooroordelen de interpretatie van eminente wetenschappers vertekenden: het ontbreken van vuistbijlen in Oost-Azië verklaard door 'geestelijke minderwaardigheid', Neanderthalerbotten als 'Germaanse barbaren', en een fossiel genoemd naar een racistische kolonie. Telkens weerlegde later bewijs de raciale lezing."}, "points": [{"text": {"fa": "خط موویوس: تبردستی‌های آشولی در آفریقا، خاورمیانه، ایران و هند فراوان‌اند اما در شرق و جنوب‌شرق آسیا تقریباً پیدا نمی‌شدند. هالام موویوس، باستان‌شناس آمریکایی، در دهه‌های ۱۹۴۰ و ۱۹۵۰ خطی فرضی از شمال هند کشید: غربِ آن «فرهنگ تبردستی» و شرقِ آن ابزارهای ساده‌تر. به روایت گوینده، موویوس این تفاوت را با این ادعا توضیح داد که راست‌قامت‌های شرقِ خط از نظر مغزی توانِ ساختن تبردستی را نداشتند — و آن را به مردم امروز شرق آسیا هم تعمیم داد. گوینده موویوس را دارای دیدگاه‌های نژادپرستانه و هوادار جداسازی نژادی معرفی می‌کند.", "en": "The Movius Line: Acheulean hand-axes are common in Africa, the Middle East, Iran and India but were hardly found in East and Southeast Asia. In the 1940s–50s the American archaeologist Hallam Movius drew an imaginary line through northern India: hand-axe cultures to the west, simpler tools to the east. According to the speaker, Movius explained this by claiming erectus east of the line lacked the mental capacity to make hand-axes — and extended the claim to present-day East Asians. The speaker describes Movius as holding racist and pro-segregation views.", "nl": "De Movius-lijn: vuistbijlen zijn algemeen in Afrika, het Midden-Oosten, Iran en India maar werden nauwelijks gevonden in Oost- en Zuidoost-Azië. Hallam Movius trok in de jaren 1940–50 een denkbeeldige lijn door Noord-India. Volgens de spreker verklaarde Movius dit doordat erectus ten oosten ervan het verstandelijk vermogen miste — en trok hij dat door naar hedendaagse Oost-Aziaten."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "پاسخ: (۱) بعدها تبردستی آشولی در شبه‌جزیرهٔ کره (و جاهای دیگر شرق آسیا) هم پیدا شد. (۲) پژوهش‌های قوم‌نگاری نشان داد مردم آن منطقه برای تقریباً همهٔ ابزارهایشان به بامبو تکیه دارند: خانه، قایق، چاقو و نوک تیزِ برّنده از بامبو ساخته می‌شود، و وقتی چنین مادهٔ فراوان و کارآمدی هست، نیازی به سنگ‌تراشیِ پرزحمت نیست. ابزارهای بامبویی هم در لایه‌های باستانی باقی نمی‌مانند. پس «نبودِ تبردستی» ربطی به توان مغزی نداشت.", "en": "The answer: (1) Acheulean hand-axes were later found on the Korean peninsula and elsewhere in East Asia. (2) Ethnographic work showed that people there rely on bamboo for almost all tools — houses, boats, knives and sharp points — and with such an abundant material, laborious stone-knapping is unnecessary; bamboo tools also do not survive archaeologically. The absence of hand-axes had nothing to do with mental capacity.", "nl": "Het antwoord: (1) later werden vuistbijlen ook op het Koreaanse schiereiland gevonden. (2) Etnografisch onderzoek liet zien dat men daar vrijwel alle werktuigen van bamboe maakt; bamboe blijft archeologisch niet bewaard. Het ontbreken van vuistbijlen had niets met verstandelijk vermogen te maken."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "«بربرهای ژرمن»: پس از کشف استخوان‌های درهٔ نئاندر در ۱۸۵۶، کالبدشناسانِ برجسته هر توضیحی دادند جز اینکه با جمعیتی دیگر از انسان روبه‌رو هستند: سوارِ قزاقِ روس با ران خمیده از اسب‌سواری، بیمار مبتلا به راشیتیسم (کمبود ویتامین D)، کسی با سردردهای شدید که سینوس‌ها و ابروهایش برآمده شده بود، و نیز یکی از «قبایل بربر ژرمن» که با رومیان می‌جنگیدند و چون «وحشی و بدوی» بودند استخوان‌هایشان هم زمخت‌تر از «ما سفیدپوستان متمدن» بود. این آخری به گفتهٔ برنامه نمونهٔ آشکارِ نگاهِ برتری‌جویانهٔ اروپاییِ آن زمان بود و غلط درآمد.", "en": "'Germanic barbarians': after the Neander valley bones were found in 1856, eminent anatomists proposed anything but another human population — a Russian Cossack bow-legged from riding, a rickets sufferer (vitamin D deficiency), someone whose brow and sinuses swelled from terrible headaches, and a member of the 'barbarian Germanic tribes' who fought Rome and, being 'savage and primitive', had coarser bones than 'civilised white people'. The last, the programme says, plainly reflected the European supremacism of the time, and proved wrong.", "nl": "'Germaanse barbaren': na de vondst in het Neandertal in 1856 bedachten vooraanstaande anatomen van alles behalve een andere menselijke populatie — een Russische kozak met o-benen, een rachitispatiënt, iemand met zware hoofdpijn, en een lid van de 'barbaarse Germaanse stammen' met grovere botten dan 'beschaafde blanken'. Dat laatste weerspiegelde Europees superioriteitsdenken."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "انسان رودزیایی ← انسان بودویی: یکی از مشهورترین جمجمه‌های گروه هایدلبرگی در ۱۹۲۱ در بروکن‌هیل (کابوه) در کشوری پیدا شد که آن زمان «رودزیا» نام داشت — قلمرویی که سیسیل رودز در اواخر سدهٔ نوزدهم برای سفیدپوستان انگلیسی جدا کرد و در آن اکثریت سیاه‌پوست هیچ نقشی در تصمیم‌گیری نداشتند. به گفتهٔ برنامه، مقاله‌ای در سال گذشته (نسبت به زمان ضبط) پیشنهاد کرد که به دلیل همین پیشینهٔ شرم‌آور، نام «انسان رودزیایی» کنار گذاشته شود و هایدلبرگی‌های آفریقایی «هومو بودوئنسیس» نامیده شوند، به نام جمجمهٔ بودو در اتیوپی. (توضیح ویراستار: بروکن‌هیل امروز در زامبیا است، نه زیمبابوه که در رونوشت آمده.)", "en": "Rhodesian Man → Homo bodoensis: one of the best-known heidelbergensis-type skulls was found in 1921 at Broken Hill (Kabwe), in the territory then called Rhodesia — carved out by Cecil Rhodes in the late 19th century for white British settlers, where the Black majority had no say. The programme reports a paper (published the year before the recording) proposing to drop 'Rhodesian Man' because of this shameful history and to call African heidelbergensis 'Homo bodoensis', after the Bodo skull from Ethiopia. (Editor's note: Broken Hill is in present-day Zambia, not Zimbabwe as the transcript says.)", "nl": "Rhodesische mens → Homo bodoensis: een bekende schedel werd in 1921 gevonden bij Broken Hill (Kabwe), in het toenmalige Rhodesië van Cecil Rhodes, waar de zwarte meerderheid geen inspraak had. Een recent artikel stelde voor de naam te laten vallen en de Afrikaanse heidelbergensis 'Homo bodoensis' te noemen, naar de Bodo-schedel uit Ethiopië. (Broken Hill ligt in het huidige Zambia.)"}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "نقد و دقت: (۱) نسبت‌دادن دیدگاه‌های تفکیک‌نژادی به شخص موویوس ادعای گوینده است و ویراستار آن را در منبعی مستقل نسنجیده است؛ آنچه در ادبیات باستان‌شناسی پذیرفته شده این است که تفسیرهای اولیهٔ این خط بر نوعی «عقب‌ماندگی فرهنگی» شرق آسیا تکیه داشت. (۲) نام «هومو بودوئنسیس» (Roksandic و همکاران، ۲۰۲۱) پذیرش عام نیافته و منتقدان می‌گویند قواعد نام‌گذاری جانورشناسی تغییر نام به دلایل اخلاقی را پیش‌بینی نکرده و این گونهٔ تازه تعریف روشنی ندارد. (۳) بامبو توضیحی پذیرفتنی است اما تنها توضیح نیست؛ کمیابیِ سنگ خامِ مناسب و جمعیت‌های کم‌شمار نیز پیشنهاد شده‌اند.", "en": "Critique and precision: (1) attributing segregationist views personally to Movius is the speaker's claim and has not been independently checked by the editor; what the archaeological literature accepts is that early readings of the line relied on notions of East Asian 'cultural backwardness'. (2) 'Homo bodoensis' (Roksandic et al., 2021) has not been widely accepted; critics note that zoological naming rules do not provide for renaming on ethical grounds and that the new species is poorly defined. (3) Bamboo is a plausible explanation but not the only one; scarcity of suitable raw stone and small populations have also been proposed.", "nl": "Kritiek: (1) segregationistische opvattingen aan Movius persoonlijk toeschrijven is een bewering van de spreker, niet onafhankelijk gecontroleerd. (2) 'Homo bodoensis' (Roksandic e.a., 2021) is niet algemeen aanvaard. (3) Bamboe is plausibel maar niet de enige verklaring; ook gebrek aan geschikt gesteente en kleine populaties zijn voorgesteld."}, "sources": ["src:60e7838a5a"], "flags": ["editor-note", "contested"]}, {"text": {"fa": "یادداشت خوانش: این مدخل از سه اپیزود نسخهٔ رادیویی گرد آمده است: اپیزود سوم (خط موویوس)، اپیزود چهارم (انسان رودزیایی) و اپیزود پنجم (تفسیرهای اولیهٔ نئاندرتال). هر سه به‌طور کامل خوانده شده‌اند.", "en": "Reading note: compiled from three radio episodes — 3 (Movius Line), 4 (Rhodesian Man) and 5 (early Neanderthal interpretations) — all read in full.", "nl": "Leesnotitie: samengesteld uit drie radioafleveringen — 3, 4 en 5 — alle volledig gelezen."}, "sources": ["src:60e7838a5a"], "flags": ["editor-note"]}], "links": [{"to": "tabar:race-biology", "rel": "see-also", "note": {"fa": "نقد علمیِ مفهوم نژاد", "en": "scientific critique of 'race'", "nl": "wetenschappelijke kritiek op 'ras'"}}, {"to": "tabar:eugenics", "rel": "see-also", "note": {"fa": "پیامدهای سیاسیِ علمِ نژادی", "en": "political consequences of race science", "nl": "politieke gevolgen van rassenwetenschap"}}, {"to": "tabar:race-ancestry-reich-ethics", "rel": "see-also", "note": {"fa": "اخلاق سخن‌گفتن از تبار و تفاوت", "en": "ethics of talking about ancestry and difference", "nl": "ethiek van spreken over afkomst"}}, {"to": "tabar:first-out-of-africa-java-peking-dmanisi", "rel": "see-also", "note": {"fa": "زمینهٔ خط موویوس", "en": "context of the Movius Line", "nl": "context van de Movius-lijn"}}, {"to": "tabar:neanderthal-discovery-and-body", "rel": "see-also", "note": {"fa": "داستان کشف نئاندرتال", "en": "the Neanderthal discovery story", "nl": "het ontdekkingsverhaal van de Neanderthaler"}}, {"to": "tabar:homo-heidelbergensis-fire-and-campfire", "rel": "see-also", "note": {"fa": "انسان هایدلبرگ و جمجمهٔ بروکن‌هیل", "en": "Homo heidelbergensis and the Broken Hill skull", "nl": "Homo heidelbergensis en de Broken Hill-schedel"}}], "sources": ["src:60e7838a5a"], "people": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:race-biology", "kind": "concept", "title": {"fa": "آیا «نژاد» مقولهٔ زیست‌شناختی است؟", "en": "Is \"race\" a biological category?", "nl": "Is \"ras\" een biologische categorie?"}, "aliases": [], "parent": "tabar:genetics-society", "field": "tabar:genetics-society", "summary": {"fa": "حدود ۸۵ تا ۹۰ درصد تنوع ژنتیکی انسان درون جمعیت‌هاست، نه بین آن‌ها؛ تنوع، پیوسته و جغرافیایی است، نه گسسته. با این حال الگوریتم‌ها می‌توانند تبار قاره‌ای را از دی‌ان‌ای تشخیص دهند. هر دو واقعیت درست‌اند؛ «نژاد» اجتماعی مقوله‌ای واقعی با پیامد واقعی است، اما مرزهایش زیست‌شناختی نیست.", "en": "About 85 to 90 percent of human genetic variation lies within populations, not between them; variation is continuous and geographic, not discrete. Yet algorithms can infer continental ancestry from DNA. Both facts are true; social \"race\" is a real category with real consequences, but its boundaries are not biological.", "nl": "Zo'n 85 tot 90 procent van de menselijke genetische variatie ligt binnen populaties, niet ertussen; variatie is continu en geografisch, niet discreet. Toch kunnen algoritmen continentale afstamming uit DNA afleiden. Beide feiten kloppen; sociaal \"ras\" is een echte categorie met echte gevolgen, maar de grenzen ervan zijn niet biologisch."}, "points": [{"text": {"fa": "لوونتین (۱۹۷۲): حدود ۸۵ درصد تنوع ژنتیکی بین افراد درون یک جمعیت است، ۸ درصد بین جمعیت‌های یک «نژاد» و فقط ۶ درصد بین «نژاد»ها؛ نتیجه: طبقه‌بندی نژادی ارزش زیست‌شناختی اندکی دارد.", "en": "Lewontin (1972): about 85 percent of genetic variation is between individuals within a population, 8 percent between populations of one \"race\" and only 6 percent between \"races\"; conclusion: racial classification has little biological value.", "nl": "Lewontin (1972): about 85 percent of genetic variation is between individuals within a population, 8 percent between populations of one \"race\" and only 6 percent between \"races\"; conclusion: racial classification has little biological value."}, "sources": ["src:f5e4bb7bf1"], "flags": []}, {"text": {"fa": "ادواردز (۲۰۰۳، «مغالطهٔ لوونتین»): درست است که هر ژن به‌تنهایی کم اطلاع می‌دهد، ولی همبستگی میان هزاران ژن اجازه می‌دهد تبار قاره‌ای با دقت بالا تشخیص داده شود؛ روزنبرگ (۲۰۰۲) با ۳۷۷ نشانگر پنج تا شش خوشهٔ جغرافیایی یافت.", "en": "Edwards (2003, \"Lewontin's fallacy\"): true, each gene alone says little, but correlations among thousands of genes allow continental ancestry to be inferred with high accuracy; Rosenberg (2002) found five to six geographic clusters with 377 markers.", "nl": "Edwards (2003, \"Lewontin's fallacy\"): true, each gene alone says little, but correlations among thousands of genes allow continental ancestry to be inferred with high accuracy; Rosenberg (2002) found five to six geographic clusters with 377 markers."}, "sources": ["src:fa0bbed230", "src:50f6134be0"], "flags": ["contested"]}, {"text": {"fa": "جمع‌بندی انجمن انسان‌شناسان زیستی آمریکا (۲۰۱۹): خوشه‌های ژنتیکی وجود دارند ولی با «نژاد»های اجتماعی منطبق نیستند، مرز گسسته ندارند و به نمونه‌گیری وابسته‌اند؛ نژاد ساختهٔ اجتماعی با ریشهٔ تاریخی است، نه واحد زیستی.", "en": "The American Association of Biological Anthropologists' summary (2019): genetic clusters exist but do not map onto social \"races\", have no discrete boundaries and depend on sampling; race is a social construct with historical roots, not a biological unit.", "nl": "The American Association of Biological Anthropologists' summary (2019): genetic clusters exist but do not map onto social \"races\", have no discrete boundaries and depend on sampling; race is a social construct with historical roots, not a biological unit."}, "sources": ["src:58cd70ce2e"], "flags": []}, {"text": {"fa": "در ایران مفهوم «نژاد آریایی» میراث نژادشناسی اروپایی قرن نوزدهم است؛ دی‌ان‌ای باستانی نشان می‌دهد ایرانیان، مانند همهٔ جمعیت‌ها، آمیزه‌ای از چند لایهٔ تبارند.", "en": "In Iran the notion of an \"Aryan race\" is a legacy of nineteenth-century European raciology; ancient DNA shows Iranians, like all populations, are a blend of several ancestry layers.", "nl": "In Iran the notion of an \"Aryan race\" is a legacy of nineteenth-century European raciology; ancient DNA shows Iranians, like all populations, are a blend of several ancestry layers."}, "sources": ["src:73a4e45469", "src:02461bf7f4"], "flags": ["editor-note"]}], "links": [{"to": "tabar:out-of-africa", "rel": "explains", "note": {"fa": "چرا تنوع پیوسته است", "en": "Why variation is continuous", "nl": "Why variation is continuous"}}, {"to": "tabar:iq-heritability-debate", "rel": "see-also", "note": {"fa": "تفاوت میانگین گروه‌ها", "en": "Mean differences between groups", "nl": "Mean differences between groups"}}, {"to": "psy:dehumanization", "rel": "bridges", "note": {"fa": "انسان‌زدایی در ویکی روان", "en": "Dehumanization in the psychology wiki", "nl": "Dehumanization in the psychology wiki"}}, {"to": "tabar:eugenics", "rel": "see-also", "note": {"fa": "تاریخ تاریک", "en": "The dark history", "nl": "The dark history"}}], "people": ["core:richard-lewontin", "core:luigi-luca-cavalli-sforza"], "sources": ["src:02461bf7f4", "src:50f6134be0", "src:58cd70ce2e", "src:73a4e45469", "src:f5e4bb7bf1", "src:fa0bbed230"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:ochre-middle-stone-age", "kind": "concept", "title": {"fa": "کاربرد اُکر در عصر حجر میانیِ آفریقا", "en": "Ochre use in the African Middle Stone Age", "nl": "Het gebruik van oker in de Afrikaanse Middle Stone Age"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "گروه ROCEEH دادهٔ ۱۰۰ جایگاه آفریقایی را در پایگاه ROAD گرد آورد تا ببیند رنگدانهٔ سرخ اُکر چگونه در عصر حجر میانی به کار رفته است. روش «برش زمانی» سه مرحلهٔ جدا از هم را میان ۵۰۰٬۰۰۰ تا ۴۰٬۰۰۰ سال پیش نشان داد.", "en": "The ROCEEH team gathered data from 100 African sites in the ROAD database to see how red ochre was used in the Middle Stone Age. A 'time slice' method revealed three distinct phases between 500,000 and 40,000 years ago.", "nl": "Het ROCEEH-team verzamelde gegevens van 100 Afrikaanse vindplaatsen in de ROAD-databank; een 'time slice'-methode toonde drie fasen van okergebruik tussen 500.000 en 40.000 jaar geleden."}, "points": [{"text": {"fa": "پژوهش داده‌های ۱۰۰ جایگاه را وارد پایگاه ROAD کرد و هر گزارش را از نظر کیفیت قطعات اُکر، شیوهٔ کاوش، لایه‌نگاری و اعتبار تاریخ‌گذاری سنجید.", "en": "The project entered data from 100 sites into ROAD and evaluated each report for the quality of ochre finds, excavation method, stratigraphy and reliability of dating.", "nl": "The project entered data from 100 sites into ROAD and evaluated each report for the quality of ochre finds, excavation method, stratigraphy and reliability of dating."}, "sources": ["src:9d23cb01bc"], "flags": []}, {"text": {"fa": "برای کاهش اثر تاریخ‌های نامطمئن، ابزاری به نام «برش زمانی» ساخته شد که پنجره‌ای تحلیلی را روی محور زمان می‌لغزاند و شمار جایگاه‌ها و مجموعه‌های دارای اُکر (و برای مقایسه، ابزار سنگی) را می‌شمارد. نتیجه: سه مرحلهٔ متمایز استفاده از اُکر میان ۵۰۰٬۰۰۰ تا ۴۰٬۰۰۰ سال پیش.", "en": "To soften uncertain dates, a tool called 'time slice' slides an analytic window along time and counts localities and assemblages with ochre (and, for comparison, stone tools). Result: three distinct chronological phases of ochre use between 500,000 and 40,000 years ago.", "nl": "To soften uncertain dates, a tool called 'time slice' slides an analytic window along time and counts localities and assemblages with ochre (and, for comparison, stone tools). Result: three distinct chronological phases of ochre use between 500,000 and 40,000 years ago."}, "sources": ["src:9d23cb01bc"], "flags": []}, {"text": {"fa": "نویسندگان خودشان می‌گویند داده‌کاوی فقط گام نخست است و برای حرف زدن دربارهٔ تکامل رفتار فرهنگی باید نتایج با تفسیری جدا از خود داده‌ها، از جمله یافته‌های مربوط به رفتار آیینی در نخستی‌شناسی، علوم شناختی و انسان‌شناسی، سنجیده شود.", "en": "The authors themselves say data mining is only a first step: to speak about the evolution of cultural behaviour, results must be interpreted by means not based on the data alone, including findings on ritualised behaviour from primatology, cognitive science and anthropology.", "nl": "The authors themselves say data mining is only a first step: to speak about the evolution of cultural behaviour, results must be interpreted by means not based on the data alone, including findings on ritualised behaviour from primatology, cognitive science and anthropology."}, "sources": ["src:9d23cb01bc"], "flags": ["editor-note"]}, {"text": {"fa": "در مرور کلی همایش آمده است که اُکر از حدود ۱۴۰٬۰۰۰ سال پیش «عادی» می‌شود، ولی چکیدهٔ خود این پژوهش فقط از سه مرحله می‌گوید و این عدد را نمی‌آورد. این دو را نباید یکی گرفت. همچنین معنای اُکر (نماد؟ ماده‌ای کاربردی؟ آیین؟) در چکیده تعیین نشده و در پژوهش‌های دیگر بحث‌برانگیز است.", "en": "The conference overview says ochre becomes habitual from about 140,000 years ago, but the study's own abstract only reports three phases and does not give that figure; the two should not be conflated. Also, what ochre meant (symbol, functional material, ritual) is not settled in the abstract and is debated in other work.", "nl": "The conference overview says ochre becomes habitual from about 140,000 years ago, but the study's own abstract only reports three phases and does not give that figure; the two should not be conflated. Also, what ochre meant (symbol, functional material, ritual) is not settled in the abstract and is debated in other work."}, "sources": [], "flags": ["contested", "editor-note"]}], "links": [{"to": "tabar:out-of-africa", "rel": "see-also", "note": {"fa": "خاستگاه آفریقایی انسان خردمند", "en": "The African origin of Homo sapiens", "nl": "The African origin of Homo sapiens"}}, {"to": "tabar:brain-body-size-climate", "rel": "see-also", "note": {"fa": "اقلیم و اندازهٔ مغز و بدن در جنس انسان", "en": "Climate and brain and body size in Homo", "nl": "Climate and brain and body size in Homo"}}, {"to": "soc:fair-data-prehistory-databases", "rel": "part-of", "note": {"fa": "پایگاه‌های داده و اصول FAIR", "en": "Databases and FAIR principles", "nl": "Databases and FAIR principles"}}], "people": ["core:rimtautas-dapschauskas", "core:matthias-g-den", "core:christian-sommer", "core:andrew-w-kandel"], "sources": ["src:9d23cb01bc"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:cooking-energy-gain", "kind": "concept", "title": {"fa": "پختن چگونه انرژی غذا را بالا می‌برد", "en": "How cooking raises the energy yield of food", "nl": "Hoe koken de energieopbrengst van voedsel verhoogt"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "نکتهٔ مرکزی رانگهم این است که پختن فقط طعم و ایمنی را بهتر نمی‌کند، بلکه مقدار انرژیِ قابل‌جذب را بالا می‌برد. دو سازوکار شیمیایی اصلی ژلاتینه‌شدن نشاسته و واسرشته‌شدن پروتئین است، و سازوکار سوم نرم‌شدن ساختار غذا که هزینهٔ گوارش را کم می‌کند. شواهد آزمایشگاهی در جانوران و انسان تا حد زیادی این نکته را تأیید می‌کنند، هرچند اندازهٔ اثر برای همهٔ غذاها یکسان نیست.", "en": "Wrangham's central point is that cooking does not just improve taste and safety but raises the amount of usable energy. The main mechanisms are gelatinisation of starch, denaturation of protein, and softening of food structure, which lowers digestive cost. Laboratory evidence from animals and humans largely supports this, though the size of the effect differs by food.", "nl": "Wranghams kernpunt: koken maakt voedsel niet alleen smakelijker en veiliger maar verhoogt ook de opneembare energie, via gelatinisering van zetmeel, denaturatie van eiwit en zachtere structuur. Laboratoriumonderzoek ondersteunt dit grotendeels, al verschilt het effect per voedingsmiddel."}, "points": [{"text": {"fa": "نشاسته (مثل سیب‌زمینی و غلات) حدود نیمی از کالری روزانهٔ بیشتر مردم جهان را می‌سازد. نشاستهٔ خام در رودهٔ کوچک ناقص هضم می‌شود (در اندازه‌گیری روی بیماران ایلئوستومی، حدود نیمی از آن)، و بقیه به رودهٔ بزرگ می‌رسد و بازدهِ کمتری دارد. گرما دانه‌های نشاسته را متورم و شکسته می‌کند (ژلاتینه‌شدن) و هضم را بسیار آسان‌تر می‌کند.", "en": "Starch (potatoes, cereals) supplies roughly half the daily calories of most people. Raw starch is digested incompletely in the small intestine (in measurements on ileostomy patients, about half), and the rest reaches the large intestine with lower yield. Heat swells and ruptures the granules (gelatinisation), making digestion much easier.", "nl": "Starch (potatoes, cereals) supplies roughly half the daily calories of most people. Raw starch is digested incompletely in the small intestine (in measurements on ileostomy patients, about half), and the rest reaches the large intestine with lower yield. Heat swells and ruptures the granules (gelatinisation), making digestion much easier."}, "sources": ["src:c12cd83ad0"], "flags": []}, {"text": {"fa": "حرارت پروتئین‌ها را باز می‌کند (واسرشته‌شدن) و آنزیم‌های گوارشی راحت‌تر به آن‌ها می‌رسند. در مثال تخم‌مرغ، پروتئین پخته به‌مراتب کامل‌تر جذب می‌شود از پروتئین خام. این با باور رایجِ «تخم‌مرغ خام بهتر است» نمی‌خواند و نشان می‌دهد شهود ما اینجا راهنمای خوبی نیست.", "en": "Heat unfolds proteins (denaturation) so digestive enzymes reach them more easily. In the egg example, cooked protein is absorbed far more completely than raw. This contradicts the popular belief that raw eggs are better, and shows intuition is a poor guide here.", "nl": "Heat unfolds proteins (denaturation) so digestive enzymes reach them more easily. In the egg example, cooked protein is absorbed far more completely than raw. This contradicts the popular belief that raw eggs are better, and shows intuition is a poor guide here."}, "sources": ["src:c12cd83ad0"], "flags": []}, {"text": {"fa": "در حیوانات: موش‌های صحرایی با غذای نرم‌تر چاق‌تر شدند (مطالعهٔ اوکا و همکاران)، و در مارهای پیتون، گوشتِ ریزشده و پخته هزینهٔ گوارش را پایین آورد و انرژی خالص بیشتری برجا گذاشت (آزمایش‌های سکور و بوبک). نکته این است که فقط تغییر فیزیکی غذا هم می‌تواند اثر بگذارد.", "en": "In animals: rats given softer food became heavier (Oka and colleagues), and in Burmese pythons ground and cooked meat lowered the cost of digestion, leaving more net energy (Secor and Boback experiments). Physical change in food alone can have an effect.", "nl": "In animals: rats given softer food became heavier (Oka and colleagues), and in Burmese pythons ground and cooked meat lowered the cost of digestion, leaving more net energy (Secor and Boback experiments). Physical change in food alone can have an effect."}, "sources": ["src:c12cd83ad0"], "flags": []}, {"text": {"fa": "نظر ویراستار: نتایج به نوع غذا بستگی دارد. کارمودی، وینتراوب و رانگهم (۲۰۱۱) روی موش‌ها نشان دادند اثر فراوری روی غده‌ها و گوشت یکسان نیست، و خود رانگهم قبول دارد که اثر پختن بر پروتئین هنوز موضوع بحث است. پس عبارت «پختن همیشه انرژی را زیاد می‌کند» ساده‌تر از واقعیت است. همچنین بخش زیادی از شواهد از بیماران ایلئوستومی و آزمایش‌های حیوانی می‌آید و داده‌های کنترل‌شدهٔ بلندمدت روی انسان‌ها کم است.", "en": "Editor's note: results depend on the food. Carmody, Weintraub and Wrangham (2011) found in mice that processing effects differ for tubers and meat, and Wrangham concedes the effect of cooking on protein is still debated. 'Cooking always raises energy' is therefore simpler than reality. Much of the evidence also comes from ileostomy patients and animal experiments; controlled long-term human data are scarce.", "nl": "Editor's note: results depend on the food. Carmody, Weintraub and Wrangham (2011) found in mice that processing effects differ for tubers and meat, and Wrangham concedes the effect of cooking on protein is still debated. 'Cooking always raises energy' is therefore simpler than reality. Much of the evidence also comes from ileostomy patients and animal experiments; controlled long-term human data are scarce."}, "sources": ["src:c8517f2ad2", "src:732c1fdbea"], "flags": ["contested", "editor-note"]}], "links": [{"to": "tabar:cooking-hypothesis", "rel": "part-of", "note": {"fa": "فرضیهٔ پختن", "en": "The cooking hypothesis", "nl": "The cooking hypothesis"}}, {"to": "tabar:raw-food-diet-evidence", "rel": "see-also", "note": {"fa": "رژیم خام‌خواری و شواهدش", "en": "Raw-food diets and what they show", "nl": "Raw-food diets and what they show"}}, {"to": "tabar:cooked-diet-body-and-brain", "rel": "explains", "note": {"fa": "غذای پخته، روده و مغز", "en": "Cooked food, gut and brain", "nl": "Cooked food, gut and brain"}}], "people": ["core:rachel-n-carmody", "core:stephen-m-secor"], "sources": ["src:732c1fdbea", "src:c12cd83ad0", "src:c8517f2ad2"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:common-ancestors", "kind": "concept", "title": {"fa": "ریاضی نیاکان: چرا همه خویشاوندیم", "en": "The mathematics of ancestors: why we are all related", "nl": "De wiskunde van voorouders: waarom we allemaal verwant zijn"}, "aliases": ["pedigree collapse", "فروریزی شجره", "نیای مشترک"], "parent": "tabar:genealogy", "field": "tabar:genealogy", "summary": {"fa": "تعداد نیاکان شما در هر نسل دو برابر می‌شود و در ۳۰ نسل از جمعیت کل زمین در آن زمان بیشتر؛ پس شجره‌ها خیلی زود در هم می‌روند. مدل‌سازی نشان می‌دهد نیای مشترک همهٔ انسان‌های زنده فقط چند هزار سال پیش می‌زیسته است.", "en": "Your number of ancestors doubles each generation and within 30 generations exceeds the whole population of Earth at the time; so family trees collapse into each other quickly. Modelling shows the common ancestor of all living humans lived only a few thousand years ago.", "nl": "Uw aantal voorouders verdubbelt elke generatie en overschrijdt binnen 30 generaties de hele wereldbevolking van toen; stambomen vallen dus snel in elkaar. Modellering toont dat de gemeenschappelijke voorouder van alle levende mensen slechts enkele duizenden jaren geleden leefde."}, "points": [{"text": {"fa": "رودی، اولسن و چانگ (۲۰۰۴): با مدل‌سازی مهاجرت واقع‌بینانه، نیای مشترک همهٔ انسان‌های امروز حدود ۲ تا ۵ هزار سال پیش می‌زیسته و کمی عقب‌تر، هر کسی که آن زمان فرزندانی باقی گذاشته، نیای همهٔ ماست («نقطهٔ نیاکان یکسان»).", "en": "Rohde, Olson and Chang (2004): with realistic migration modelling, the common ancestor of all living humans lived about 2 to 5 thousand years ago, and a little earlier everyone who left descendants is an ancestor of all of us (the \"identical ancestors point\").", "nl": "Rohde, Olson and Chang (2004): with realistic migration modelling, the common ancestor of all living humans lived about 2 to 5 thousand years ago, and a little earlier everyone who left descendants is an ancestor of all of us (the \"identical ancestors point\")."}, "sources": ["src:fd409ac468"], "flags": []}, {"text": {"fa": "پیامد عملی: ادعای «از نسل فلان پادشاه یا پیامبر بودن» در این افق زمانی تقریباً دربارهٔ همه صادق است و دربارهٔ هیچ‌کس خاص نیست؛ شجره‌نامه‌های یک‌خطی تنها یکی از میلیون‌ها مسیر را دنبال می‌کنند.", "en": "Practical implication: claiming descent \"from such-and-such king or prophet\" within this horizon is roughly true of everyone and distinctive of no one; single-line pedigrees follow only one of millions of paths.", "nl": "Practical implication: claiming descent \"from such-and-such king or prophet\" within this horizon is roughly true of everyone and distinctive of no one; single-line pedigrees follow only one of millions of paths."}, "sources": ["src:fd409ac468"], "flags": ["editor-note"]}, {"text": {"fa": "از نظر ژنتیک، بعد از حدود ۷ تا ۸ نسل بیشتر نیاکان شما هیچ قطعه‌ای از دی‌ان‌ای به شما نداده‌اند: نیای شجره‌ای بودن با نیای ژنتیکی بودن فرق دارد.", "en": "Genetically, after about 7 to 8 generations most of your ancestors have passed you no DNA segment at all: being a genealogical ancestor differs from being a genetic ancestor.", "nl": "Genetically, after about 7 to 8 generations most of your ancestors have passed you no DNA segment at all: being a genealogical ancestor differs from being a genetic ancestor."}, "sources": ["src:9e55a626fc"], "flags": []}], "links": [{"to": "tabar:haplogroups", "rel": "see-also", "note": {"fa": "دو خط از هزاران", "en": "Two lines out of thousands", "nl": "Two lines out of thousands"}}, {"to": "tabar:ancestry-tests", "rel": "prerequisite", "note": {"fa": "برای فهم درصدهای آزمون تبار", "en": "For understanding ancestry-test percentages", "nl": "For understanding ancestry-test percentages"}}], "people": [], "sources": ["src:9e55a626fc", "src:fd409ac468"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}], "people": {"core:bernadette-modell": {"id": "core:bernadette-modell", "name": {"fa": "برنادت مودل", "en": "Bernadette Modell", "nl": "Bernadette Modell"}, "years": "", "note": {"fa": "برنامه‌های غربالگری تالاسمی"}, "wikidata": "Q29643282", "wikis": ["tabar"]}, "core:daniel-e-lieberman": {"id": "core:daniel-e-lieberman", "name": {"fa": "دانیل لیبرمن", "en": "Daniel E. Lieberman", "nl": "Daniel E. Lieberman"}, "years": "", "note": {"fa": "زیست‌شناس تکاملی هاروارد؛ پژوهشگر تکامل جویدن و دویدن"}, "wikidata": null, "wikis": ["tabar"]}, "core:mohamed-javad-shoaee": {"id": "core:mohamed-javad-shoaee", "name": {"fa": "محمدجواد شعاعی", "en": "Mohamed Javad Shoaee", "nl": "Mohamed Javad Shoaee"}, "years": "", "note": {"fa": "باستان‌شناس، مؤسسهٔ ماکس پلانک (ینا)"}, "wikidata": null, "wikis": ["tabar"]}, "core:bryan-sykes": {"id": "core:bryan-sykes", "name": {"fa": "برایان سایکس", "en": "Bryan Sykes", "nl": "Bryan Sykes"}, "years"
