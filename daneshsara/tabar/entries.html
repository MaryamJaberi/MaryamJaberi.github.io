: "The documented role of the Zagros in farming", "nl": "The documented role of the Zagros in farming"}}, {"to": "tabar:steppe-indo-iranian", "rel": "contrasts", "note": {"fa": "خاستگاه استپی هندوایرانی", "en": "The steppe origin of Indo-Iranian", "nl": "The steppe origin of Indo-Iranian"}}, {"to": "tabar:iranian-genetic-diversity", "rel": "see-also", "note": {"fa": "تنوع ژنتیکی ایرانیان", "en": "Genetic diversity of Iranians", "nl": "Genetic diversity of Iranians"}}, {"to": "tabar:genetic-essentialism", "rel": "see-also", "note": {"fa": "هشدار دربارهٔ ذات‌گرایی ژنتیکی", "en": "Caution about genetic essentialism", "nl": "Caution about genetic essentialism"}}], "people": ["core:shervin-vakili"], "sources": ["src:553bedc591", "src:58d5e5ecfa", "src:93456bf0b8"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:behavior-genetics", "kind": "field", "title": {"fa": "ژنتیک رفتاری", "en": "Behaviour genetics", "nl": "Gedragsgenetica"}, "aliases": [], "parent": "tabar:tabar", "field": null, "summary": {"fa": "چه سهمی از تفاوت‌های ما در شخصیت، هوش و سلامت روان به تفاوت‌های ژنتیکی برمی‌گردد و این عدد چه معنایی دارد؟", "en": "What share of our differences in personality, intelligence and mental health traces to genetic differences, and what does that number mean?", "nl": "Welk deel van onze verschillen in persoonlijkheid, intelligentie en mentale gezondheid gaat terug op genetische verschillen, en wat betekent dat getal?"}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:raw-food-diet-evidence", "kind": "concept", "title": {"fa": "رژیم خام‌خواری و شواهدش دربارهٔ نیاز ما به پختن", "en": "Raw-food diets and what they show about our need for cooking", "nl": "Rauwkostdiëten en wat ze zeggen over onze behoefte aan koken"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "رانگهم از رفتار خام‌خواران امروزی برای آزمودن فرضیه‌اش استفاده می‌کند: در مطالعهٔ گیسن آلمان، هرچه سهم غذای خام بیشتر بود وزن کمتر بود و در زنان قاعدگی بیشتر مختل می‌شد. او همچنین می‌گوید هیچ جامعهٔ انسانیِ شناخته‌شده‌ای بدون پختن زندگی نمی‌کند. این شواهد جالب‌اند، ولی مقطعی و غیرتجربی‌اند و توصیهٔ غذایی نیستند.", "en": "Wrangham uses modern raw-foodists to test his hypothesis: in Germany's Giessen study, the more raw food people ate the lower their weight, and women's menstrual cycles were more often disrupted. He also notes that no known human society lives without cooking. The evidence is interesting but observational, and it is not dietary advice.", "nl": "Wrangham gebruikt hedendaagse rauwkosters als toets: in de Duitse Giessen-studie hing meer rauw voedsel samen met lager gewicht en vaker gestoorde menstruatie. Er is geen bekende samenleving zonder koken. Het bewijs is observationeel en geen voedingsadvies."}, "points": [{"text": {"fa": "مطالعهٔ گیسن (کوبنیک و همکاران) با پرسش‌نامه ۵۱۳ نفر را بررسی کرد که ۷۰ تا ۱۰۰ درصد غذایشان خام بود. با بالارفتن سهم غذای خام، نمایهٔ توده بدنی پایین‌تر می‌آمد و نزدیک به ۳۰ درصدِ کاملاً خام‌خواران نشانه‌های کمبود مزمن انرژی داشتند. در زنانی که غذای شان کاملاً خام بود، حدود نیمی دچار قطع کامل قاعدگی بودند (بر پایهٔ گزارش کتاب).", "en": "The Giessen study (Koebnick and colleagues) surveyed 513 people eating 70–100 percent raw. As raw share rose, body mass index fell, and about 30 percent of strict raw-foodists showed signs of chronic energy deficiency. Among women eating fully raw, about half had lost their periods entirely (as reported in the book).", "nl": "The Giessen study (Koebnick and colleagues) surveyed 513 people eating 70–100 percent raw. As raw share rose, body mass index fell, and about 30 percent of strict raw-foodists showed signs of chronic energy deficiency. Among women eating fully raw, about half had lost their periods entirely (as reported in the book)."}, "sources": ["src:c12cd83ad0"], "flags": []}, {"text": {"fa": "آزمایش کوتاه «رژیم تکاملی» در باغ‌وحش پینتون (۲۰۰۶، ۹ داوطلب، ۱۲ روز) هم نشان داد کاهش وزن حدود ۴ کیلوگرم، با وجود خوردن تا ۵ کیلو غذای گیاهی در روز. پژوهشی کنترل‌شده نبود و تعداد افراد کم بود.", "en": "The short 'Evo Diet' experiment at Paignton Zoo (2006, nine volunteers, 12 days) found an average weight loss of about 4 kg despite eating up to 5 kg of plant food a day. It was not a controlled trial and the sample was tiny.", "nl": "The short 'Evo Diet' experiment at Paignton Zoo (2006, nine volunteers, 12 days) found an average weight loss of about 4 kg despite eating up to 5 kg of plant food a day. It was not a controlled trial and the sample was tiny."}, "sources": ["src:c12cd83ad0"], "flags": []}, {"text": {"fa": "رانگهم می‌گوید گزارش‌های «قوم‌هایی که غذای خام می‌خورند» (از سیری‌ها در مکزیک تا اینوئیت‌ها) در بررسی دقیق رد شد: همه پختن را برای وعدهٔ اصلی داشتند. ادوارد تایلور در ۱۸۷۰ نتیجه گرفت پختن در همهٔ جوامع شناخته‌شده هست.", "en": "Wrangham says reports of peoples eating raw (from the Seri of Mexico to the Inuit) fail on close inspection: all cooked their main meal. Edward Tylor concluded in 1870 that cooking is found in every known society.", "nl": "Wrangham says reports of peoples eating raw (from the Seri of Mexico to the Inuit) fail on close inspection: all cooked their main meal. Edward Tylor concluded in 1870 that cooking is found in every known society."}, "sources": ["src:c12cd83ad0"], "flags": []}, {"text": {"fa": "نظر ویراستار: وزن کم و کمبود انرژی در خام‌خواران با فرضیهٔ پختن سازگار است، اما ثابت نمی‌کند. این افراد انتخاب‌شده‌اند، رژیم‌شان اغلب کم‌کالری یا ناکافی در پروتئین و چربی است، و ورزش و عوامل دیگر هم دخیل‌اند. نتیجهٔ مطالعه به آدم‌های امروزی در محیط شهری مربوط است و مستقیم به اجدادمان تعمیم‌پذیر نیست. این مدخل توصیه‌ای دربارهٔ رژیم غذایی نیست.", "en": "Editor's note: low weight and energy deficiency in raw-foodists are consistent with the cooking hypothesis but do not prove it. These are self-selected people, often on low-calorie diets lacking protein or fat, and exercise and other factors matter. The findings concern modern urban people and do not transfer directly to our ancestors. This entry is not dietary advice.", "nl": "Editor's note: low weight and energy deficiency in raw-foodists are consistent with the cooking hypothesis but do not prove it. These are self-selected people, often on low-calorie diets lacking protein or fat, and exercise and other factors matter. The findings concern modern urban people and do not transfer directly to our ancestors. This entry is not dietary advice."}, "sources": [], "flags": ["contested", "editor-note"]}], "links": [{"to": "tabar:cooking-energy-gain", "rel": "see-also", "note": {"fa": "پختن چگونه انرژی غذا را بالا می‌برد", "en": "How cooking raises the energy yield of food", "nl": "How cooking raises the energy yield of food"}}, {"to": "tabar:cooking-hypothesis", "rel": "part-of", "note": {"fa": "فرضیهٔ پختن", "en": "The cooking hypothesis", "nl": "The cooking hypothesis"}}, {"to": "tabar:human-evolution", "rel": "part-of", "note": {"fa": "تکامل انسان", "en": "Human evolution", "nl": "Human evolution"}}], "people": ["core:corinna-koebnick", "core:edward-b-tylor"], "sources": ["src:c12cd83ad0"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:ghost-populations-mixture", "kind": "concept", "title": {"fa": "جمعیت‌های «روح»: ردیابی گروه‌های ناپدیدشده از رد ژنی‌شان", "en": "'Ghost' populations: tracing vanished groups through the DNA they left", "nl": "'Spookpopulaties': verdwenen groepen opsporen via hun DNA-sporen"}, "aliases": [], "parent": "tabar:population-genetics", "field": "tabar:population-genetics", "summary": {"fa": "رایش نشان می‌دهد با آزمون‌های آماری می‌توان وجود گروه‌هایی را که امروز به‌شکل ناآمیخته نمانده‌اند از روی ژنوم نوادگانشان تشخیص داد؛ مثل «اوراسیایی‌های شمالیِ باستان» و «اوراسیایی‌های پایه». نتیجهٔ بزرگ او این است که خوشه‌های ژنتیکی امروز خودشان آمیزهٔ گروه‌های بسیار متفاوت گذشته‌اند. این تصویر قوی و پرکاربرد است، اما نتیجهٔ مدل‌های آماری است و جای و زمان زندگی «ارواح» را فقط با DNA باستانی می‌توان دقیق کرد.", "en": "Reich shows that statistical tests can reveal groups that no longer exist in unmixed form, from the genomes of their descendants, such as the 'Ancient North Eurasians' and the 'Basal Eurasians'. His main conclusion is that today's genetic clusters are themselves mixtures of very different past groups. The picture is strong and widely used but is model-based; where and when the 'ghosts' lived can be pinned down only with ancient DNA.", "nl": "Reich laat zien dat statistische toetsen groepen kunnen opsporen die niet meer ongemengd bestaan, zoals de 'Oude Noord-Euraziaten' en de 'Basale Euraziaten'. Zijn kernconclusie: de huidige genetische clusters zijn zelf mengsels van sterk verschillende groepen uit het verleden. Het beeld is sterk maar modelgebaseerd."}, "points": [{"text": {"fa": "ایده: اگر چهار جمعیت فقط با یک درخت شاخه‌شاخه به هم مربوط بودند، یک آمارهٔ ساده (آزمون چهارجمعیتی) باید صفر شود. انحراف از صفر یعنی آمیزش، یعنی دست‌کم یکی از جمعیت‌ها آمیزه‌ای است. به این ترتیب می‌توان وجود جمعیتی را نتیجه گرفت که هیچ نمونهٔ ناآمیخته‌ای از آن در دست نیست؛ رایش به آن «روح» می‌گوید.", "en": "The idea: if four populations were related by a simple branching tree, a simple statistic (the four-population test) should be zero. A deviation from zero signals mixture, so at least one population is a mixture. This lets researchers infer a population for which no unmixed sample exists, which Reich calls a 'ghost'.", "nl": "The idea: if four populations were related by a simple branching tree, a simple statistic (the four-population test) should be zero. A deviation from zero signals mixture, so at least one population is a mixture. This lets researchers infer a population for which no unmixed sample exists, which Reich calls a 'ghost'."}, "sources": ["src:a4f00f41ff"], "flags": []}, {"text": {"fa": "نمونهٔ نخست: «اوراسیایی‌های شمالیِ باستان». نیک پترسون از روی داده‌های امروزی حدس زد که چنین گروهی هم به بومیان آمریکا و هم به اروپاییان شمالی تبار داده است. سپس ژنوم پسربچه‌ای ۲۴ هزارساله از مالتا در سیبری همین را تأیید کرد. حدود یک‌سوم تبار بومیان آمریکا از این گروه و باقی از شرق آسیایی‌هاست.", "en": "First example: the 'Ancient North Eurasians'. Nick Patterson inferred from modern data that such a group contributed to both Native Americans and northern Europeans. The genome of a roughly 24,000-year-old boy from Mal'ta in Siberia then confirmed it. About a third of Native American ancestry comes from this group and the rest from East Asians.", "nl": "First example: the 'Ancient North Eurasians'. Nick Patterson inferred from modern data that such a group contributed to both Native Americans and northern Europeans. The genome of a roughly 24,000-year-old boy from Mal'ta in Siberia then confirmed it. About a third of Native American ancestry comes from this group and the rest from East Asians."}, "sources": ["src:a4f00f41ff", "src:47eeb4b276"], "flags": []}, {"text": {"fa": "نمونهٔ دوم: «اوراسیایی‌های پایه». ایوسیف لازاریدیس با همین ابزار دید که شاخه‌ای زودجداشده در تبار کشاورزان خاور نزدیک هست. تا زمان نگارش کتاب هیچ نمونهٔ مستقیمی از آن‌ها در دست نبود و رایش خودش مکان زندگی‌شان را حدس می‌نامد (شمال آفریقا؟). مردم ایران و لوانت در ده هزار سال پیش و پیش‌تر، هرکدام حدود ۵۰ درصد از این تبار داشتند.", "en": "Second example: the 'Basal Eurasians'. Using the same tools Iosif Lazaridis found an early-split lineage in the ancestry of Near Eastern farmers. At the time of the book no direct sample existed, and Reich explicitly calls their homeland a speculation (North Africa?). People in Iran and the Levant 10,000+ years ago each had about 50 percent of this ancestry.", "nl": "Second example: the 'Basal Eurasians'. Using the same tools Iosif Lazaridis found an early-split lineage in the ancestry of Near Eastern farmers. At the time of the book no direct sample existed, and Reich explicitly calls their homeland a speculation (North Africa?). People in Iran and the Levant 10,000+ years ago each had about 50 percent of this ancestry."}, "sources": ["src:a4f00f41ff", "src:92e120a792", "src:519a39f1f8"], "flags": ["editor-note"]}, {"text": {"fa": "جمع‌بندی رایش: پیش از انقلاب ژنوم همه (از جمله خودش) فکر می‌کردند خوشه‌های بزرگ امروزی بازتاب انشعاب‌های بسیار قدیمی‌اند. اما در هر جمعیتی که بررسی شده (اروپایی، جنوب آسیایی، شرق آسیایی، آفریقایی) آمیختگی بنیادی دیده شده؛ به تعبیر او آمیزش در همهٔ سطوح تاریخ دیده می‌شود. این برداشت قوی است، ولی عبارتِ «هیچ جمعیت تنهِ ناآمیخته‌ای نبوده» نتیجهٔ مدل‌های برگزیده است و جای تفسیرهای دیگر هست.", "en": "Reich's conclusion: before the genome revolution everyone, himself included, assumed today's big clusters mirror very old splits. In every population examined (European, South Asian, East Asian, African) fundamental mixture appears; in his words mixture is visible at every level of the history. This reading is strong, but the claim that there was never an unmixed trunk population rests on chosen models and allows alternative interpretations.", "nl": "Reich's conclusion: before the genome revolution everyone, himself included, assumed today's big clusters mirror very old splits. In every population examined (European, South Asian, East Asian, African) fundamental mixture appears; in his words mixture is visible at every level of the history. This reading is strong, but the claim that there was never an unmixed trunk population rests on chosen models and allows alternative interpretations."}, "sources": ["src:a4f00f41ff"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "هشدارهای روش‌شناختی: آمارهٔ آمیزش نشان می‌دهد گروهی با آن ویژگی ژنتیکی وجود داشته، نه کجا و کِی زندگی می‌کرده یا چه نامی داشته است. مدل‌های آمیزش یکتا نیستند و با داده‌های بیشتر عوض می‌شوند. نام‌هایی مثل «اوراسیایی پایه» برچسب‌های مدلی‌اند، نه قوم یا ملتی واقعی.", "en": "Methodological cautions: a mixture statistic shows that a group with a certain genetic profile existed, not where or when it lived or what it was called. Mixture models are not unique and change with more data. Names such as 'Basal Eurasian' are model labels, not real peoples or nations.", "nl": "Methodological cautions: a mixture statistic shows that a group with a certain genetic profile existed, not where or when it lived or what it was called. Mixture models are not unique and change with more data. Names such as 'Basal Eurasian' are model labels, not real peoples or nations."}, "sources": [], "flags": ["contested", "editor-note"]}], "links": [{"to": "tabar:basal-eurasian-ancestry", "rel": "explains", "note": {"fa": "مدخل تفصیلی دربارهٔ اوراسیایی پایه", "en": "Detailed entry on Basal Eurasians", "nl": "Detailed entry on Basal Eurasians"}}, {"to": "tabar:ancient-dna", "rel": "part-of", "note": {"fa": "دی‌ان‌ای باستانی «ارواح» را نمونه‌دار می‌کند", "en": "Ancient DNA turns 'ghosts' into samples", "nl": "Ancient DNA turns 'ghosts' into samples"}}, {"to": "tabar:near-east-first-farmers-structure", "rel": "see-also", "note": {"fa": "ساختار جمعیت نخستین کشاورزان خاور نزدیک", "en": "Population structure of the first Near Eastern farmers", "nl": "Population structure of the first Near Eastern farmers"}}, {"to": "tabar:race-ancestry-reich-ethics", "rel": "see-also", "note": {"fa": "پیامد برای مفهوم نژاد", "en": "Implications for the idea of race", "nl": "Implications for the idea of race"}}], "people": ["core:nick-patterson", "core:iosif-lazaridis", "core:eske-willerslev"], "sources": ["src:47eeb4b276", "src:519a39f1f8", "src:92e120a792", "src:a4f00f41ff"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:medical-genetics", "kind": "field", "title": {"fa": "ژنتیک پزشکی و جامعه", "en": "Medical genetics & society", "nl": "Medische genetica & samenleving"}, "aliases": [], "parent": "tabar:tabar", "field": null, "summary": {"fa": "ازدواج خویشاوندی، غربالگری و مشاورهٔ ژنتیک: دانش ژنتیک در خدمت سلامت یک جامعه چه شکلی دارد؟", "en": "Consanguinity, screening and genetic counselling: what does genetics in the service of a society's health look like?", "nl": "Verwantschapshuwelijken, screening en genetische counseling: hoe ziet genetica in dienst van de volksgezondheid eruit?"}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:race-ancestry-reich-ethics", "kind": "concept", "title": {"fa": "نژاد، تبار و اخلاق: استدلال رایش دربارهٔ «تفاوت‌های میانگین» میان جمعیت‌ها", "en": "Race, ancestry and ethics: Reich's argument about 'average differences' between populations", "nl": "Ras, afstamming en ethiek: Reichs betoog over 'gemiddelde verschillen' tussen populaties"}, "aliases": [], "parent": "tabar:genetics-society", "field": "tabar:genetics-society", "summary": {"fa": "رایش می‌گوید اجماع ضدنژادیِ قرن بیستم درست بود که «نژاد زیستی» را رد کرد، اما به این برداشت تبدیل شد که تفاوت‌های ژنتیکی میان جمعیت‌ها را باید نادیده گرفت. او با آن موافق نیست و می‌گوید «تبار» را باید جایگزین «نژاد» کرد. در همان حال تصور قالبی نژادپرستانه را نادرست می‌داند. بسیاری از دانشمندان و انسان‌شناسان نظر او را پرمناقشه می‌دانند و بخشی از شواهدش (مثل انتخاب چندژنی ارتفاع) بعداً تضعیف شده است.", "en": "Reich argues that the twentieth-century consensus was right to reject 'biological race' but hardened into the notion that genetic differences between populations should be ignored. He disagrees and says 'ancestry' should replace 'race'. At the same time he regards racist stereotypes as baseless. Many scientists and anthropologists find his position contentious, and part of his evidence (such as polygenic selection on height) has since been weakened.", "nl": "Reich stelt dat de anti-racistische consensus terecht 'biologisch ras' verwierp, maar verhardde tot het idee dat genetische verschillen tussen populaties genegeerd moeten worden. Hij pleit ervoor 'afstamming' te gebruiken in plaats van 'ras'. Veel wetenschappers vinden zijn positie omstreden, en een deel van zijn bewijs is later verzwakt."}, "points": [{"text": {"fa": "پس‌زمینه: آشلی مونتاگیو (۱۹۴۲) نژاد را مفهومی اجتماعی دانست، و ریچارد لوونتین (۱۹۷۲) نشان داد حدود ۸۵ درصد تنوع پروتئینی خونی درون گروه‌ها و فقط حدود ۱۵ درصد میان «نژادهاست». رایش این را درست می‌داند، ولی می‌گوید همین یافته به «اصل مسلم» تبدیل شد که تفاوت‌های میان جمعیت‌ها در عمل ناچیز است و بررسی آن‌ها را باید کنار گذاشت.", "en": "Background: Ashley Montagu (1942) argued that race is a social concept, and Richard Lewontin (1972) showed that about 85 percent of blood-protein variation is within groups and only about 15 percent between 'races'. Reich considers this correct but says it hardened into an orthodoxy that differences between populations are negligible in practice and should not be studied.", "nl": "Background: Ashley Montagu (1942) argued that race is a social concept, and Richard Lewontin (1972) showed that about 85 percent of blood-protein variation is within groups and only about 15 percent between 'races'. Reich considers this correct but says it hardened into an orthodoxy that differences between populations are negligible in practice and should not be studied."}, "sources": ["src:a4f00f41ff", "src:f5e4bb7bf1"], "flags": []}, {"text": {"fa": "ادعای رایش: با ژنوم کامل می‌توان مردم را به خوشه‌هایی گروه‌بندی کرد که با دسته‌های نژادی آمریکایی هم‌خوانی دارد، و میانگین تفاوت‌های ژنتیکی نابدیهی میان جمعیت‌ها هست، مثل پوست، تحمل لاکتوز، سازگاری با ارتفاع و خطر بعضی بیماری‌ها. به گفتهٔ او «تبار» اصطلاحی دقیق‌تر از «نژاد» است. نقد: آ. ف. ادواردز (۲۰۰۳) نشان داده بود ترکیب ژن‌های بسیار می‌تواند گروه‌ها را متمایز کند، اما انسان‌شناسان می‌گویند این تفاوت‌ها شیب‌دار و ترکیبی‌اند و با مقوله‌های اجتماعی «نژاد» یکی نیستند.", "en": "Reich's claim: with genome-wide data people can be grouped into clusters that match American racial categories, and non-trivial average genetic differences exist, such as skin colour, lactose tolerance, altitude adaptation and risk of some diseases. In his words 'ancestry' is a more precise term than 'race'. Critique: A. W. F. Edwards (2003) had shown that combining many genes can distinguish groups, but anthropologists say these differences are graded and overlapping and do not coincide with socially defined 'races'.", "nl": "Reich's claim: with genome-wide data people can be grouped into clusters that match American racial categories, and non-trivial average genetic differences exist, such as skin colour, lactose tolerance, altitude adaptation and risk of some diseases. In his words 'ancestry' is a more precise term than 'race'. Critique: A. W. F. Edwards (2003) had shown that combining many genes can distinguish groups, but anthropologists say these differences are graded and overlapping and do not coincide with socially defined 'races'."}, "sources": ["src:a4f00f41ff", "src:fa0bbed230", "src:3a7bc7708c"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "بخش پرمناقشه: رایش می‌نویسد انتظار دارد تفاوت‌های میانگین در صفات چندژنی از جمله شاید ویژگی‌های شناختی هم یافت شود، ولی خودش می‌گوید هنوز پژوهش‌های کافی نیست و «حدس‌ها»ی نژادپرستانه را بی‌پایه می‌داند. پس ادعای او دربارهٔ صفات شناختی یک انتظار است، نه یافته. شواهد نمونه‌اش دربارهٔ انتخاب چندژنی ارتفاع بعداً با مدل‌های کنترل‌شده برای ساختار جمعیتی به‌شدت تضعیف شد، و نمرهٔ چندژنی در جمعیت‌هایی با تبار متفاوت از نمونهٔ آموزش، بدتر پیش‌بینی می‌کند.", "en": "The most contested part: Reich writes that he expects average differences in polygenic traits, perhaps including cognitive ones, but also says samples are not yet adequate, and calls racist guesses baseless. So his claim about cognitive traits is an expectation, not a finding. His example of polygenic selection on height was later strongly weakened by models that control for population structure, and polygenic scores predict worse in populations whose ancestry differs from the training sample.", "nl": "The most contested part: Reich writes that he expects average differences in polygenic traits, perhaps including cognitive ones, but also says samples are not yet adequate, and calls racist guesses baseless. So his claim about cognitive traits is an expectation, not a finding. His example of polygenic selection on height was later strongly weakened by models that control for population structure, and polygenic scores predict worse in populations whose ancestry differs from the training sample."}, "sources": ["src:a4f00f41ff", "src:27a78bd0f5", "src:04a1436337"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "رایش نظریه‌های «جنبهٔ ژنتیکی کلیشه‌های نژادی» را جدا رد می‌کند؛ نمونه‌اش نیکلاس وید (۲۰۱۴) را می‌آورد و می‌گوید بخش‌هایی از آن «کاملاً حدسی» است و منبع علمی جدی ندارد. او هم‌زمان معتقد است سکوت دانشمندان میدان را به حدس‌زنان می‌سپارد. موضع او این است که ژنوم باید روایتی مشترک از تاریخ بشر بدهد که جایگزین نژادپرستی و ناسیونالیسم شود؛ خود کتاب راه‌حل قطعی حقوقی یا سیاستی ارائه نمی‌دهد.", "en": "Reich firmly rejects 'genetic explanations of racial stereotypes', citing Nicholas Wade (2014) and calling parts of that book entirely speculative and without serious scientific backing. He also believes that scientific silence leaves the field to speculators. His stance is that the genome should offer a shared history of humanity as an alternative to racism and nationalism; the book itself offers no definitive legal or policy solution.", "nl": "Reich firmly rejects 'genetic explanations of racial stereotypes', citing Nicholas Wade (2014) and calling parts of that book entirely speculative and without serious scientific backing. He also believes that scientific silence leaves the field to speculators. His stance is that the genome should offer a shared history of humanity as an alternative to racism and nationalism; the book itself offers no definitive legal or policy solution."}, "sources": ["src:a4f00f41ff"], "flags": []}, {"text": {"fa": "پیامد اخلاقی دیگر: ده هزار سال پیش غرب اوراسیا چهار جمعیت بسیار متمایز داشت که به اندازهٔ اروپاییان و شرق آسیایی‌ها با هم فرق داشتند، و همهٔ آن‌ها بعداً در هم آمیختند. رایش این را نشان می‌دهد که «نژادها» عکس‌های لحظه‌ای ساختار جمعیتی‌اند، نه مقولات ثابت. او همچنین به اخلاق پژوهش روی بقایای انسانی (مثل کِنِویک و بازگرداندن به بومیان) و دقت پایین آزمون‌های تبارِ تجاری اشاره می‌کند. (نمونه: گزارش درصد نئاندرتال در یک آزمون تجاری که دقت کافی نداشت.)", "en": "Another ethical implication: ten thousand years ago West Eurasia had four very distinct populations, as different from each other as Europeans and East Asians, all later merged. Reich takes this to show that 'races' are snapshots of population structure, not fixed categories. He also raises the ethics of studying human remains (e.g. Kennewick and return to Native American tribes) and the poor accuracy of commercial ancestry tests (some Neanderthal percentage reports were unreliable).", "nl": "Another ethical implication: ten thousand years ago West Eurasia had four very distinct populations, as different from each other as Europeans and East Asians, all later merged. Reich takes this to show that 'races' are snapshots of population structure, not fixed categories. He also raises the ethics of studying human remains (e.g. Kennewick and return to Native American tribes) and the poor accuracy of commercial ancestry tests (some Neanderthal percentage reports were unreliable)."}, "sources": ["src:a4f00f41ff"], "flags": []}], "links": [{"to": "tabar:race-biology", "rel": "explains", "note": {"fa": "آیا نژاد مقوله‌ای زیستی است؟", "en": "Is race a biological category?", "nl": "Is race a biological category?"}}, {"to": "tabar:genetic-essentialism", "rel": "critiques", "note": {"fa": "ذات‌گرایی ژنتیکی", "en": "Genetic essentialism", "nl": "Genetic essentialism"}}, {"to": "tabar:ancestry-tests", "rel": "see-also", "note": {"fa": "محدودیت آزمون‌های تبار", "en": "Limits of ancestry tests", "nl": "Limits of ancestry tests"}}, {"to": "tabar:gwas-polygenic", "rel": "see-also", "note": {"fa": "نمرهٔ چندژنی و محدودیت‌ها", "en": "Polygenic scores and their limits", "nl": "Polygenic scores and their limits"}}], "people": ["core:richard-lewontin", "core:a-w-f-edwards", "core:ashley-montagu", "core:nicholas-wade"], "sources": ["src:04a1436337", "src:27a78bd0f5", "src:3a7bc7708c", "src:a4f00f41ff", "src:f5e4bb7bf1", "src:fa0bbed230"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:basal-eurasian-ancestry", "kind": "concept", "title": {"fa": "تبار «اوراسیایی پایه» و نئاندرتال‌ها", "en": "Basal Eurasian ancestry and Neanderthal ancestry", "nl": "Basaal-Euraziatische afstamming en Neanderthalers"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "«اوراسیایی پایه» نام یک شاخهٔ فرضی از انسان است که پیش از جدایی شرقی‌ها و شمالی‌های اوراسیا از دیگر غیرآفریقایی‌ها جدا شد. هنوز هیچ نمونهٔ ناآمیخته‌ای از آن پیدا نشده، اما لازاریدیس و همکاران با آماره‌های ژنتیکی نشان دادند حدود نیمی از تبار نخستین مردم خاور نزدیک از آن بود و این تبار با نئاندرتالِ کمتر همراه است.", "en": "'Basal Eurasian' is a hypothesised human lineage that split off before the East Asian and northern Eurasian lineages diverged from other non-Africans. No unmixed sample has been found, but Lazaridis and colleagues used genetic statistics to show about half the ancestry of the earliest Near Easterners came from it, and that it correlates with less Neanderthal ancestry.", "nl": "'Basaal-Euraziaten' zijn een veronderstelde afstammingslijn die zich vroeg afsplitste. Lazaridis e.a. schatten dat ongeveer de helft van de afstamming van de oudste Nabije-Oosterlingen daarvan kwam, samen met minder Neanderthaler-DNA."}, "points": [{"text": {"fa": "ردیابی: آماره‌ای که میزان شباهت هر گروه به نمونهٔ ۴۵٬۰۰۰ ساله اوست‌ایشیم (سیبری) را با چینی هان مقایسه می‌کند برای همهٔ خاور نزدیکی‌های باستانی و اروپاییان نوسنگی به‌طور معنادار منفی بود. این الگو با داشتن بخشی از تبار از شاخه‌ای که پیش از جدایی هان و اوست‌ایشیم جدا شده سازگار است.", "en": "Detection: a statistic comparing each group's similarity to the ~45,000-year-old Ust'-Ishim individual (Siberia) against Han Chinese was significantly negative for all ancient Near Easterners and Neolithic Europeans. This pattern fits having some ancestry from a lineage that split before Han and Ust'-Ishim diverged.", "nl": "Detection: a statistic comparing each group's similarity to the ~45,000-year-old Ust'-Ishim individual (Siberia) against Han Chinese was significantly negative for all ancient Near Easterners and Neolithic Europeans. This pattern fits having some ancestry from a lineage that split before Han and Ust'-Ishim diverged."}, "sources": ["src:43526796e0"], "flags": []}, {"text": {"fa": "سهم‌ها (با روش qpAdm): حدود ۶۶±۱۳٪ در نمونهٔ احتمالاً میان‌سنگی هوتو، ۴۸±۶٪ در نوسنگیان ایران و ۴۴±۸٪ در ناتوفی‌های لوانت. بنابراین این تبار در خاور نزدیک باستان گسترده بود. این برآوردها با خطای آماری زیاد گزارش شده‌اند.", "en": "Shares (by qpAdm): about 66±13% in the probably Mesolithic Hotu individual, 48±6% in Iranian Neolithic farmers and 44±8% in Levantine Natufians. This ancestry was therefore widespread in the ancient Near East. The estimates carry sizable statistical error.", "nl": "Shares (by qpAdm): about 66±13% in the probably Mesolithic Hotu individual, 48±6% in Iranian Neolithic farmers and 44±8% in Levantine Natufians. This ancestry was therefore widespread in the ancient Near East. The estimates carry sizable statistical error."}, "sources": ["src:43526796e0"], "flags": []}, {"text": {"fa": "نئاندرتال: هرچه سهم تبار اوراسیایی پایه بیشتر باشد، سهم آلل‌های مشترک با نئاندرتال کمتر است. نویسندگان از این برون‌یابی می‌گیرند که این شاخه نئاندرتالِ کمتر و شاید هیچ داشته؛ بازهٔ اطمینان ۹۵٪ از صفر تا ۶۰٪ است، یعنی بسیار گسترده. این می‌تواند توضیح دهد چرا غرب‌اوراسیاییان کمی نئاندرتال کمتر از شرق آسیاییان دارند.", "en": "Neanderthals: the larger the Basal Eurasian share, the smaller the share of alleles matching Neanderthals. By extrapolation the authors infer that lineage had less Neanderthal ancestry and possibly none; the 95% interval runs from 0 to 60%, i.e. very wide. This could explain why West Eurasians carry slightly less Neanderthal ancestry than East Asians.", "nl": "Neanderthals: the larger the Basal Eurasian share, the smaller the share of alleles matching Neanderthals. By extrapolation the authors infer that lineage had less Neanderthal ancestry and possibly none; the 95% interval runs from 0 to 60%, i.e. very wide. This could explain why West Eurasians carry slightly less Neanderthal ancestry than East Asians."}, "sources": ["src:43526796e0"], "flags": ["contested"]}, {"text": {"fa": "خاستگاه جغرافیایی نامعلوم است. نویسندگان دو توضیح را مطرح می‌کنند و انتخاب نمی‌کنند: یا این تبار پیش از نمونه‌های بررسی‌شده و پس از آمیختگی با نئاندرتال‌ها به خاور نزدیک آمیخته شد، یا اجدادش همیشه آنجا بودند اما در آمیختگی با نئاندرتال شرکت نکردند. گمانهٔ آفریقایی‌بودن (بر پایه جمجمه‌سنجی و تبار پدری E در ناتوفی‌ها) در داده‌های ژنوم‌گستر تأیید نشد، چون آفریقایی‌های زیرصحرا با ناتوفی‌ها آلل بیشتری شریک نیستند.", "en": "Geographic origin is unknown. The authors give two explanations without choosing: it either mixed into the Near East before the studied samples but after Neanderthal admixture, or its ancestors always lived there but missed the Neanderthal admixture. An African origin (suggested by craniometry and Y-haplogroup E in Natufians) found no support in genome-wide data, since sub-Saharan Africans share no extra alleles with Natufians.", "nl": "Geographic origin is unknown. The authors give two explanations without choosing: it either mixed into the Near East before the studied samples but after Neanderthal admixture, or its ancestors always lived there but missed the Neanderthal admixture. An African origin (suggested by craniometry and Y-haplogroup E in Natufians) found no support in genome-wide data, since sub-Saharan Africans share no extra alleles with Natufians."}, "sources": ["src:43526796e0"], "flags": ["contested"]}, {"text": {"fa": "جمع‌بندی ویراستار: «اوراسیایی پایه» یک نتیجهٔ مدل‌محور است نه یک جمعیت نمونه‌برداری‌شده. مقالهٔ ۲۰۲۴ دربارهٔ فلات ایران همین تبار را با مدل اقلیمی بررسی می‌کند و برای آن خاستگاهی در شمال آفریقا، عربستان یا لوانت پیشنهاد می‌دهد، که با ایران متفاوت است؛ این دو مقاله باید با هم خوانده شوند.", "en": "Editor's note: 'Basal Eurasian' is a model-based inference, not a sampled population. The 2024 Persian Plateau paper revisits the same lineage with a climate model and suggests an origin in North Africa, Arabia or the Levant, separate from Iran; the two papers should be read together.", "nl": "Editor's note: 'Basal Eurasian' is a model-based inference, not a sampled population. The 2024 Persian Plateau paper revisits the same lineage with a climate model and suggests an origin in North Africa, Arabia or the Levant, separate from Iran; the two papers should be read together."}, "sources": [], "flags": ["editor-note"]}], "links": [{"to": "tabar:neanderthal-admixture", "rel": "bridges", "note": {"fa": "آمیزش با نئاندرتال‌ها", "en": "Admixture with Neanderthals", "nl": "Admixture with Neanderthals"}}, {"to": "tabar:out-of-africa", "rel": "see-also", "note": {"fa": "خاستگاه آفریقایی انسان خردمند", "en": "African origin of Homo sapiens", "nl": "African origin of Homo sapiens"}}, {"to": "tabar:haplogroups", "rel": "see-also", "note": {"fa": "هاپلوگروه‌ها (مثل E)", "en": "Haplogroups (such as E)", "nl": "Haplogroups (such as E)"}}, {"to": "tabar:persian-plateau-hub", "rel": "contrasts", "note": {"fa": "فلات ایران به‌عنوان کانون", "en": "The Persian Plateau as Hub", "nl": "The Persian Plateau as Hub"}}], "people": ["core:iosif-lazaridis"], "sources": ["src:43526796e0"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:turkic-arrival-and-language-shift-azerbaijan-zare-shahmorsi", "kind": "concept", "title": {"fa": "ورود ترکان و جابه‌جایی زبانی در آذربایجان: روایت زارع شاهمرسی", "en": "Turkic arrival and language shift in Azerbaijan: Zare Shahmorsi's account", "nl": "Komst van de Turken en taalverschuiving in Azerbeidzjan: het verhaal van Zare Shahmorsi"}, "aliases": [], "parent": "tabar:genetics-society", "field": "tabar:genetics-society", "summary": {"fa": "نویسنده می‌گوید ترکی در سدهٔ پنجم هجری با سلجوقیان به‌صورت پایدار به آذربایجان آمد، نخست در روستاها جا افتاد و بی‌فشار رسمی جای زبان فهلوی (پهلوی آذربایجانی) را گرفت. این دیدگاهی است که با نظر پژوهشگرانی چون ریاحی و ذکا هم‌خوان است، اما بخشی از ادعاهای تاریخی‌اش محل مناقشه است.", "en": "The author argues that Turkic settled durably in Azerbaijan with the Seljuks in the 5th century AH, took root first in villages, and replaced the local Pahlavi/Fahlavi speech without official coercion. This broadly matches scholars such as Riyahi and Zoka, though some of his historical claims are disputed.", "nl": "De auteur stelt dat het Turks zich in de 11e eeuw met de Seltsjoeken blijvend in Azerbeidzjan vestigde, eerst op het platteland, en de lokale taal verving zonder officiële dwang. Dit sluit aan bij geleerden als Riyahi en Zoka, maar enkele historische beweringen zijn omstreden."}, "points": [{"text": {"fa": "زارع شاهمرسی تصویری از پراکندگی زبانی آذربایجان پیش از ترکی می‌دهد: بر پایهٔ گزارش‌های جغرافی‌نویسان سدهٔ چهارم (ابن‌حوقل، مقدسی و دیگران) مردم به زبان‌های گوناگون سخن می‌گفتند و زبان بومی «فهلوی/آذری» آمیخته‌ای از زبان‌های ایرانی با عناصر محلی بود.", "en": "Zare Shahmorsi sketches pre-Turkic Azerbaijan as linguistically fragmented: citing 4th-century AH geographers (Ibn Hawqal, al-Muqaddasi and others), he says people spoke many languages and the local Fahlavi/Azari speech was a blend of Iranian dialects with local elements.", "nl": "Zare Shahmorsi sketches pre-Turkic Azerbaijan as linguistically fragmented: citing 4th-century AH geographers (Ibn Hawqal, al-Muqaddasi and others), he says people spoke many languages and the local Fahlavi/Azari speech was a blend of Iranian dialects with local elements."}, "sources": ["src:6bd020e622"], "flags": []}, {"text": {"fa": "به نوشتهٔ او ترکان پیش از سلجوقیان هم گاه‌گاه به آذربایجان آمده بودند (نمونه‌هایی چون غلامان ترک عباسی و اسکان گروه‌هایی در زمان انوشیروان)، اما حضور آن‌ها گذرا بود؛ حضور ماندگار از آغاز سدهٔ پنجم هجری با سلجوقیان و ترکمانان اوغوز شروع شد.", "en": "He notes earlier, sporadic Turkic presence (Abbasid Turkic soldiers, groups settled under Anushirvan) but says it was transient; the lasting presence began in the early 5th century AH with the Seljuks and Oghuz Turkmen.", "nl": "He notes earlier, sporadic Turkic presence (Abbasid Turkic soldiers, groups settled under Anushirvan) but says it was transient; the lasting presence began in the early 5th century AH with the Seljuks and Oghuz Turkmen."}, "sources": ["src:6bd020e622"], "flags": []}, {"text": {"fa": "او با اتکا به گزارش‌ها و شعر قطران تبریزی نشان می‌دهد که امیران محلی (وهسودان و لشکری) در سدهٔ پنجم برای جنگ با گرجیان، ارمنیان و بیزانس از جنگجویان ترکمان کمک خواستند؛ پس از آن، پیروزی ملازگرد (۴۶۳ ق / ۱۰۷۱ م) و سیاست ملکشاه ترکان بیشتری را در شهرهای آذربایجان جایگیر کرد.", "en": "Drawing on local reports and the poet Qatran Tabrizi, he says local rulers (Vahsudan, Lashkari) called on Turkmen warriors against Georgians, Armenians and Byzantium; after Manzikert (1071) and under Malik-Shah more Turks settled in Azerbaijani towns.", "nl": "Drawing on local reports and the poet Qatran Tabrizi, he says local rulers (Vahsudan, Lashkari) called on Turkmen warriors against Georgians, Armenians and Byzantium; after Manzikert (1071) and under Malik-Shah more Turks settled in Azerbaijani towns."}, "sources": ["src:6bd020e622"], "flags": []}, {"text": {"fa": "استدلال اصلی او این است که ترکی را سلجوقیان به زور تحمیل نکردند: دیوان‌ها فارسی بود، منبع تاریخی برای اجبار زبانی نیست، ترکمانان چادرنشین نخست در چراگاه‌های روستایی ماندند و تغییر زبان از ده‌ها آغاز شد و شهرها دیرتر پذیرفتند؛ او این را با روند ترکی‌شدن آناتولی همسان می‌داند.", "en": "His central argument is that Turkic was not imposed by force: Seljuk chancery work was in Persian, no source attests linguistic coercion, nomadic Turkmen stayed first in rural pastures so the shift began in villages while towns resisted longer; he compares this with Anatolia.", "nl": "His central argument is that Turkic was not imposed by force: Seljuk chancery work was in Persian, no source attests linguistic coercion, nomadic Turkmen stayed first in rural pastures so the shift began in villages while towns resisted longer; he compares this with Anatolia."}, "sources": ["src:6bd020e622"], "flags": []}, {"text": {"fa": "او به پژوهشگرانی مانند ریاحی و ذکا ارجاع می‌دهد که پشتوانهٔ حکومتی ترکی و نیاز مردم به ارتباط با کارگزاران را عامل اصلی کنار رفتن فهلوی می‌دانند؛ ذکا فاصلهٔ حدود هفتاد سال میان پایان تیموریان و خیزش شاه اسماعیل را دورهٔ پس‌روی آذری می‌شمارد.", "en": "He cites Riyahi and Zoka, who attribute the retreat of Fahlavi mainly to the state backing of Turkic and people's need to deal with officials; Zoka dates a decisive stretch to the roughly seventy years between the late Timurids and Shah Ismail's rise.", "nl": "He cites Riyahi and Zoka, who attribute the retreat of Fahlavi mainly to the state backing of Turkic and people's need to deal with officials; Zoka dates a decisive stretch to the roughly seventy years between the late Timurids and Shah Ismail's rise."}, "sources": ["src:6bd020e622"], "flags": []}, {"text": {"fa": "خود نویسنده می‌پذیرد که بعضی روستاهای دورافتاده (مانند عنبران نزدیک اردبیل، هرزند و کرینگان) تا دوران صفوی گویشی ایرانی داشتند؛ این همان بقایای شناخته‌شدهٔ زبان‌های ایرانی آذربایجان است.", "en": "The author himself records a few remote villages (e.g. Anbaran near Ardabil, Harzand, Karingan) that kept an Iranian dialect into the Safavid era, which fits the known survivals of the older Iranian speech.", "nl": "The author himself records a few remote villages (e.g. Anbaran near Ardabil, Harzand, Karingan) that kept an Iranian dialect into the Safavid era, which fits the known survivals of the older Iranian speech."}, "sources": ["src:6bd020e622"], "flags": []}, {"text": {"fa": "بخش‌هایی از روایت او با دانش امروز هم‌خوان نیست: او مهاجرت سکاها در سدهٔ هفتم پیش از میلاد را نخستین مهاجرت «ترکان» به آذربایجان می‌شمارد، در حالی که سکاها به زبان‌های ایرانی سخن می‌گفتند و پیوند آن‌ها با ترکی بدون پشتوانهٔ پذیرفتهٔ پژوهشی است؛ نسبت‌دادن قدمت ۱۷۰۰ ساله به حاکمیت ترکان بر تیان‌شان نیز سنجیده‌نشده است.", "en": "Parts of his account do not match current scholarship: he counts the 7th-century BC Saka movement as the first 'Turkic' migration, yet the Scythians/Saka spoke Iranian languages, and his claim of Turkic rule near the Tian Shan from 1700 BC is unsupported.", "nl": "Parts of his account do not match current scholarship: he counts the 7th-century BC Saka movement as the first 'Turkic' migration, yet the Scythians/Saka spoke Iranian languages, and his claim of Turkic rule near the Tian Shan from 1700 BC is unsupported."}, "sources": ["src:6bd020e622"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "دیدگاه رایج پژوهشی: ترکی‌شدن آذربایجان بیشتر یک جابه‌جایی زبانی در درازای چند سده بود که با سلطهٔ سیاسی و نظامی ترک‌زبانان، کوچ ایلات و برتری اجتماعی-اداری زبان آنان پیش رفت؛ دربارهٔ سهم کوچ مردم در برابر تغییر زبان ساکنان بومی بحث ادامه دارد و روند در شهرها و نواحی مختلف زمان‌بندی متفاوتی داشت.", "en": "Mainstream view: Azerbaijan's Turkification was largely a language shift over several centuries, driven by Turkic military-political dominance, tribal migration and the social-administrative standing of Turkic; the balance between immigration and local language change is still debated and timing varied by place.", "nl": "Mainstream view: Azerbaijan's Turkification was largely a language shift over several centuries, driven by Turkic military-political dominance, tribal migration and the social-administrative standing of Turkic; the balance between immigration and local language change is still debated and timing varied by place."}, "sources": [], "flags": ["contested", "editor-note"]}], "links": [{"to": "tabar:steppe-indo-iranian", "rel": "contrasts", "note": {"fa": "تبار استپی و زبان‌های هندوایرانی: سکاها ایرانی‌زبان بودند", "en": "Steppe ancestry and Indo-Iranian languages: the Saka were Iranian-speaking", "nl": "Steppe ancestry and Indo-Iranian languages: the Saka were Iranian-speaking"}}, {"to": "soc:space", "rel": "see-also", "note": {"fa": "مهاجرت و کوچ به‌عنوان نیروی دگرگونی اجتماعی", "en": "Migration as a force of social change", "nl": "Migration as a force of social change"}}], "people": ["core:parviz-zare-shahmorsi", "core:qatran-tabrizi", "core:mohammad-amin-riyahi"], "sources": ["src:6bd020e622"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:azari-name-dispute-zare-shahmorsi", "kind": "concept", "title": {"fa": "مناقشهٔ «آذری»: انکار نام و نقد کسروی در کتاب زارع شاهمرسی", "en": "The 'Azari' dispute: denial of the name and critique of Kasravi in Zare Shahmorsi", "nl": "De 'Azari'-kwestie: ontkenning van de naam en kritiek op Kasravi bij Zare Shahmorsi"}, "aliases": [], "parent": "tabar:genetics-society", "field": "tabar:genetics-society", "summary": {"fa": "نویسنده می‌گوید در سدهٔ پنجم هجری زبانی با نام «آذری» وجود نداشت و این نام را ایران‌گرایان سدهٔ بیستم ساخته‌اند تا زبان کنونی مردم از ترکی جدا شود. پژوهش زبان‌شناختی امروز، این‌که یک زبان ایرانی بومی در آذربایجان رایج بوده را می‌پذیرد، هرچند دربارهٔ جزئیات و نام‌گذاری اختلاف هست.", "en": "The author claims that no language called 'Azari' existed in the 5th century AH and that the name was invented by 20th-century Iran-oriented writers to detach today's speech from Turkic. Modern linguistics does accept that a native Iranian language was spoken in Azerbaijan, though details and naming are debated.", "nl": "De auteur stelt dat er in de 11e eeuw geen taal 'Azari' bestond en dat de naam door Iraans-gerichte schrijvers uit de 20e eeuw is bedacht. De moderne taalkunde erkent wel een oorspronkelijke Iraanse taal in Azerbeidzjan, al lopen details en naamgeving uiteen."}, "points": [{"text": {"fa": "زارع شاهمرسی می‌گوید در متن‌های عربی «آذری/أذربی» صفتی است به‌معنای «منسوب به آذربایجان» (مثلاً پشمینهٔ آذری) و نه نام یک زبان؛ برای این کار به ابن‌اثیر، جوالیقی، مسکویه و دهخدا اشاره می‌کند.", "en": "He argues that in Arabic sources 'Adhari/Adharbi' is a relational adjective meaning 'of Azerbaijan' (e.g. Azari wool), not a language name, citing Ibn al-Athir, al-Jawaliqi, Miskawayh and Dehkhoda.", "nl": "He argues that in Arabic sources 'Adhari/Adharbi' is a relational adjective meaning 'of Azerbaijan' (e.g. Azari wool), not a language name, citing Ibn al-Athir, al-Jawaliqi, Miskawayh and Dehkhoda."}, "sources": ["src:6bd020e622"], "flags": []}, {"text": {"fa": "او نام‌هایی مانند «پهلوی» و «فهلویات» را در منابع کهن بازمی‌شمارد (ابن‌ندیم به نقل از ابن‌مقفع، خوارزمی، مقدسی، مستوفی) و می‌گوید زبان بومی آذربایجان در آن‌ها «پهلوی آذربایجانی»، آمیخته با زبان‌های محلی و کم‌فهم برای بیرونی‌ها بوده است؛ یاقوت هم از زبانی یاد می‌کند که فقط خود مردم می‌فهمیدند.", "en": "He lists the terms 'Pahlavi' and 'Fahlaviyyat' in older sources (Ibn al-Nadim quoting Ibn al-Muqaffa', al-Khwarazmi, al-Muqaddasi, Mostowfi) and says the local speech was a 'Pahlavi of Azerbaijan' mixed with local languages and hard for outsiders to follow; Yaqut also mentions a language only locals understood.", "nl": "He lists the terms 'Pahlavi' and 'Fahlaviyyat' in older sources (Ibn al-Nadim quoting Ibn al-Muqaffa', al-Khwarazmi, al-Muqaddasi, Mostowfi) and says the local speech was a 'Pahlavi of Azerbaijan' mixed with local languages and hard for outsiders to follow; Yaqut also mentions a language only locals understood."}, "sources": ["src:6bd020e622"], "flags": []}, {"text": {"fa": "او فرضیهٔ کسروی در رسالهٔ «آذری یا زبان باستان آذربایگان» را (ترکی زبانی عارضی و پیش از آن آذری ایرانی) شرح می‌دهد، دقت پژوهشی کسروی را می‌ستاید، اما می‌گوید کسروی واژه‌های تالشی و لاهیجی و خلخالی را به‌اشتباه بازماندهٔ «آذری باستان» گرفت و انگیزهٔ سیاسی ایران‌گرایانه داشت.", "en": "He summarises Kasravi's thesis (Turkic as an accidental later layer over an Iranian 'Azari'), praises Kasravi's research care, but says Kasravi wrongly took Talyshi, Lahiji and Khalkhali words for remnants of 'old Azari' and was driven by Iran-centred, anti-Pan-Turkist motives.", "nl": "He summarises Kasravi's thesis (Turkic as an accidental later layer over an Iranian 'Azari'), praises Kasravi's research care, but says Kasravi wrongly took Talyshi, Lahiji and Khalkhali words for remnants of 'old Azari' and was driven by Iran-centred, anti-Pan-Turkist motives."}, "sources": ["src:6bd020e622"], "flags": []}, {"text": {"fa": "او به شعر «روحی انارجانی» (نمونهٔ مکتوب از گویش تبریز) و رسالهٔ رضازاده ملک اشاره می‌کند، اما می‌گوید انتساب این متن‌ها به تبریز سدهٔ دهم محل تردید است و بقایای فهلوی در چند روستا نمی‌تواند زبان همگانی آن دوران را نشان دهد.", "en": "He refers to the Ruhi Anarjani text as a written sample of Tabriz speech and to Rezazadeh Malek's edition, but notes that the attribution to 10th-century Tabriz is doubtful and that a few surviving villages cannot show a general language.", "nl": "He refers to the Ruhi Anarjani text as a written sample of Tabriz speech and to Rezazadeh Malek's edition, but notes that the attribution to 10th-century Tabriz is doubtful and that a few surviving villages cannot show a general language."}, "sources": ["src:6bd020e622"], "flags": []}, {"text": {"fa": "نتیجهٔ او این است که نام «زبان آذری» را نباید برای زبان کنونی آذربایجان به کار برد. این نتیجه بخشی درست‌خوانده می‌شود: نام آذری برای ترکی کنونی در سدهٔ بیستم رواج یافت و گاهی مبهم است. اما گزارهٔ کلی «هرگز زبان ایرانی بومی آذربایجان نبود» با شواهد جور نیست.", "en": "He concludes that 'Azari' should not label the present-day language. That is partly fair, since the name for today's Turkic speech became common in the 20th century and is ambiguous, but the stronger claim that no native Iranian language existed does not fit the evidence.", "nl": "He concludes that 'Azari' should not label the present-day language. That is partly fair, since the name for today's Turkic speech became common in the 20th century and is ambiguous, but the stronger claim that no native Iranian language existed does not fit the evidence."}, "sources": ["src:6bd020e622"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "دیدگاه رایج در ایرانشناسی: زبانی ایرانی از شاخهٔ شمال‌غربی (که معمولاً «آذری کهن» می‌نامند و با تاتی و تالشی خویشاوند است) در آذربایجان رواج داشت و کم‌کم جای خود را به ترکی داد؛ نقل‌های قدیم، چند متن مکتوب و گویش‌های بازمانده این را پشتیبانی می‌کنند. اختلاف بر سر نام، قدمت و دامنهٔ آن است، نه بر سر وجودش.", "en": "Mainstream Iranian studies: a north-western Iranian language (usually called Old Azari, related to Tati and Talysh) was spoken in Azerbaijan and gradually gave way to Turkic; early reports, some written texts and surviving dialects support this. The dispute is about its name, age and extent, not its existence.", "nl": "Mainstream Iranian studies: a north-western Iranian language (usually called Old Azari, related to Tati and Talysh) was spoken in Azerbaijan and gradually gave way to Turkic; early reports, some written texts and surviving dialects support this. The dispute is about its name, age and extent, not its existence."}, "sources": ["src:ca183d8680"], "flags": ["editor-note"]}], "links": [{"to": "tabar:steppe-indo-iranian", "rel": "see-also", "note": {"fa": "زمینهٔ زبان‌های ایرانی و هندوایرانی", "en": "Background on Iranian and Indo-Iranian languages", "nl": "Background on Iranian and Indo-Iranian languages"}}, {"to": "soc:culture-roles-social-control", "rel": "see-also", "note": {"fa": "زبان و هویت قومی", "en": "Language and ethnic identity", "nl": "Language and ethnic identity"}}], "people": ["core:ahmad-kasravi", "core:yahya-zoka"], "sources": ["src:6bd020e622", "src:ca183d8680"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:human-origins-how-we-know", "kind": "concept", "title": {"fa": "دانستن خاستگاه انسان: کشف‌ها و فناوری‌های تازه", "en": "Knowing human origins: new discoveries and technologies", "nl": "Menselijke oorsprong kennen: nieuwe vondsten en technieken"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "پیام هفتم سند می‌گوید دانش ما از تکامل انسان ثابت نیست: پرسش‌های تازه، کشف‌های میدانی و ابزارهای نو سن فسیل‌ها، رخدادهای مهم و شناخت ما از انسان و شامپانزه را پیوسته بازبینی می‌کنند. بنابراین علم را باید پژوهش و پرسشگری دید.", "en": "Message 7 says our knowledge of human evolution is not fixed: new questions, field discoveries and new tools keep refining fossil ages, key milestones and our comparisons of humans and other apes. Science is presented as inquiry.", "nl": "Boodschap 7 stelt dat onze kennis van menselijke evolutie voortdurend wordt bijgesteld door nieuwe vragen, vondsten en technieken; wetenschap is onderzoek."}, "points": [{"text": {"fa": "سند چند راه تازه‌شدن دانش را می‌شمارد: تعیین سن دقیق‌تر فسیل‌ها و ابزارها، یافته‌های فسیلی و باستان‌شناختی جدید (مثلاً در دردهٔ ریفت آفریقا)، و فناوری‌های نو.", "en": "The handout lists ways knowledge is refreshed: more precise dating of fossils and artifacts, new fossil and archaeological finds (for example in Africa's Rift Valley), and new technologies.", "nl": "The handout lists ways knowledge is refreshed: more precise dating of fossils and artifacts, new fossil and archaeological finds (for example in Africa's Rift Valley), and new technologies."}, "sources": ["src:a85b75e91c"], "flags": []}, {"text": {"fa": "نمونه‌های فناوری که سند نام می‌برد: بازیابی دی‌ان‌ای از فسیل، بررسی ساختارهای ریز دندان و استخوان مربوط به رشد، سنجش ترکیب شیمیایی دندان و استخوان برای شناخت رژیم غذایی، و تخمین سن رسوبات.", "en": "Technology examples named: recovering DNA from fossils, examining microscopic tooth and bone structures tied to growth, measuring chemistry of teeth and bone to infer diet, and refining sediment ages.", "nl": "Technology examples named: recovering DNA from fossils, examining microscopic tooth and bone structures tied to growth, measuring chemistry of teeth and bone to infer diet, and refining sediment ages."}, "sources": ["src:a85b75e91c"], "flags": []}, {"text": {"fa": "پژوهش‌هایی مانند ردیابی چشم نوزادان و جعبه‌ابزار نخستی‌ها شباهت‌ها و تفاوت‌های انسان و میمون‌های بزرگ را روشن‌تر می‌کنند.", "en": "Work such as eye-tracking in infants and studies of primate tool kits sharpens the similarities and differences between humans and great apes.", "nl": "Work such as eye-tracking in infants and studies of primate tool kits sharpens the similarities and differences between humans and great apes."}, "sources": ["src:a85b75e91c"], "flags": []}, {"text": {"fa": "نکتهٔ سازنده برای خواننده: چون یافته‌ها پیوسته اصلاح می‌شوند، تاریخ‌ها و ادعاهای مطرح در نوشته‌های آموزشی (از جمله همین سند ۲۰۱۵) ممکن است امروز قدیمی باشند. برای هر عدد به پژوهش‌های تازه‌تر نگاه کنید.", "en": "A practical caution: because findings are constantly revised, dates and claims in outreach texts (this 2015 handout included) may be outdated today. Check newer research for any figure.", "nl": "A practical caution: because findings are constantly revised, dates and claims in outreach texts (this 2015 handout included) may be outdated today. Check newer research for any figure."}, "sources": [], "flags": ["dated", "editor-note"]}], "links": [{"to": "tabar:ancient-dna", "rel": "see-also", "note": {"fa": "انقلاب دی‌ان‌ای باستانی", "en": "The ancient DNA revolution", "nl": "The ancient DNA revolution"}}, {"to": "tabar:human-evolution", "rel": "part-of", "note": {"fa": "تکامل انسان", "en": "Human evolution", "nl": "Human evolution"}}, {"to": "tabar:neanderthal-admixture", "rel": "see-also", "note": {"fa": "آمیزش با نئاندرتال‌ها", "en": "Admixture with Neanderthals", "nl": "Admixture with Neanderthals"}}], "people": [], "sources": ["src:a85b75e91c"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:lactase-gene-culture", "kind": "concept", "title": {"fa": "تداوم لاکتاز: نمونهٔ هم‌تکاملی ژن و فرهنگ", "en": "Lactase persistence: a case of gene–culture coevolution", "nl": "Lactasepersistentie: een geval van gen-cultuur-co-evolutie"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "بیشتر پستانداران بعد از شیرخوارگی توان هضم شیر را از دست می‌دهند؛ در جمعیت‌هایی که دامداری کردند، جهش‌هایی که هضم شیر را تا بزرگسالی نگه می‌دارند در چند هزار سال رایج شد. فرهنگ (دامداری) ژن را انتخاب کرد.", "en": "Most mammals lose the ability to digest milk after infancy; in populations that kept cattle, mutations that keep milk digestion into adulthood became common within a few thousand years. Culture (herding) selected the gene.", "nl": "De meeste zoogdieren verliezen na de zuigelingentijd het vermogen melk te verteren; in bevolkingen die vee hielden, werden mutaties die melkvertering tot in de volwassenheid behouden binnen enkele duizenden jaren gangbaar. Cultuur (veeteelt) selecteerde het gen."}, "points": [{"text": {"fa": "تیشکوف و همکاران (۲۰۰۷): در شرق آفریقا جهش‌هایی متفاوت از جهش اروپایی، به‌طور مستقل، تداوم لاکتاز ایجاد کرده‌اند؛ تکامل همگرا زیر فشار یک شیوهٔ زندگی مشترک.", "en": "Tishkoff et al. (2007): in East Africa mutations different from the European one independently produced lactase persistence; convergent evolution under the pressure of a shared way of life.", "nl": "Tishkoff et al. (2007): in East Africa mutations different from the European one independently produced lactase persistence; convergent evolution under the pressure of a shared way of life."}, "sources": ["src:e6dfee157f"], "flags": []}, {"text": {"fa": "این یکی از قوی‌ترین نمونه‌های انتخاب طبیعی اخیر در انسان است و نشان می‌دهد تکامل انسان با کشاورزی متوقف نشد، بلکه شتاب گرفت.", "en": "This is one of the strongest examples of recent natural selection in humans and shows that human evolution did not stop with agriculture but accelerated.", "nl": "This is one of the strongest examples of recent natural selection in humans and shows that human evolution did not stop with agriculture but accelerated."}, "sources": ["src:d8fb384d44"], "flags": []}], "links": [{"to": "atlas:geneculture", "rel": "part-of", "note": {"fa": "پل هم‌تکاملی ژن و فرهنگ", "en": "The gene–culture coevolution bridge", "nl": "The gene–culture coevolution bridge"}}, {"to": "psy:cultural-evolution", "rel": "bridges", "note": {"fa": "تکامل فرهنگی", "en": "Cultural evolution", "nl": "Cultural evolution"}}], "people": ["core:sarah-tishkoff", "core:luigi-luca-cavalli-sforza"], "sources": ["src:d8fb384d44", "src:e6dfee157f"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:hominin-evolution-changing-environments", "kind": "concept", "title": {"fa": "نیاکان ما در جهانی دستخوش دگرگونی", "en": "Our ancestors in a changing world", "nl": "Onze voorouders in een veranderende wereld"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "به گفتهٔ برنامهٔ خاستگاه انسان در اسمیتسونین، نیاکان انسان در محیط‌هایی می‌زیستند که اقلیم و چشم‌انداز آن‌ها به‌شدت تغییر می‌کرد. بقا در برابر این دگرگونی‌ها یکی از نیروهای شکل‌دهندهٔ ویژگی‌های ما بوده است.", "en": "The Smithsonian Human Origins Program says human ancestors lived in surroundings whose climate and landscapes changed dramatically, and that coping with those changes helped shape our traits.", "nl": "Het Smithsonian Human Origins Program stelt dat menselijke voorouders leefden in sterk veranderende omgevingen en dat overleven daarin onze kenmerken mede vormde."}, "points": [{"text": {"fa": "پیام کلیدی سوم این سند می‌گوید نیاکان انسان با تغییرات شدید محیط روبه‌رو بودند و این تغییرات چالش‌های بقا ساخت. سند برای این موضوع به پژوهش‌های اقلیمی برنامه، دو ویدیو و یک پادکست دربارهٔ مجموعهٔ «انسان شدن» ارجاع می‌دهد.", "en": "Key message 3 of the handout says human ancestors faced dramatic environmental change, which created survival challenges. It points to the programme's climate research, two videos and a podcast on the 'Becoming Human' series.", "nl": "Key message 3 of the handout says human ancestors faced dramatic environmental change, which created survival challenges. It points to the programme's climate research, two videos and a podcast on the 'Becoming Human' series."}, "sources": ["src:a85b75e91c"], "flags": []}, {"text": {"fa": "در نقشهٔ نمایشگاه همراه این سند، «بدن‌های سازگار با اقلیم‌های گوناگون»، «پراکنش» و «ابزارسازی» کنار هم آمده‌اند؛ یعنی سازگاری فرهنگی و زیستی با محیط‌های تازه یک رشته دیده شده است.", "en": "In the travelling-exhibit plan attached to the handout, 'adapting to diverse climates', dispersal and toolmaking are grouped together, treating biological and cultural adaptation to new environments as one thread.", "nl": "In the travelling-exhibit plan attached to the handout, 'adapting to diverse climates', dispersal and toolmaking are grouped together, treating biological and cultural adaptation to new environments as one thread."}, "sources": ["src:a85b75e91c"], "flags": []}, {"text": {"fa": "پیوند میان نوسان اقلیم و تکامل انسان فرضیهٔ پرنفوذی است، ولی دقت آن محل بحث است. یکی از شناخته‌ترین صورت‌های آن «انتخاب برپایهٔ تغییرپذیری» است که ریک پاتس (۱۹۹۸) پیشنهاد کرد: پایداری گونه‌ها در برابر ناپایداری محیط. شواهد ریزمقیاس اقلیمی و ارتباطشان با رویدادهای فسیلی هنوز بررسی و گاه نقد می‌شود.", "en": "Linking climate variability to human evolution is an influential hypothesis, but how strongly it holds is debated. A well-known form is 'variability selection', proposed by Rick Potts (1998): selection favouring versatility under unstable environments. Fine-scale climate records and their match to fossil events are still being tested and sometimes challenged.", "nl": "Linking climate variability to human evolution is an influential hypothesis, but how strongly it holds is debated. A well-known form is 'variability selection', proposed by Rick Potts (1998): selection favouring versatility under unstable environments. Fine-scale climate records and their match to fossil events are still being tested and sometimes challenged."}, "sources": ["src:14c43ba99c"], "flags": ["contested", "editor-note"]}], "links": [{"to": "tabar:brain-body-size-climate", "rel": "see-also", "note": {"fa": "مغز، اندازهٔ بدن و اقلیم", "en": "Brain, body size and climate", "nl": "Brain, body size and climate"}}, {"to": "tabar:ochre-middle-stone-age", "rel": "see-also", "note": {"fa": "اخرا و عصر سنگ میانی", "en": "Ochre and the Middle Stone Age", "nl": "Ochre and the Middle Stone Age"}}, {"to": "tabar:out-of-africa", "rel": "see-also", "note": {"fa": "خاستگاه آفریقایی انسان خردمند", "en": "The African origin of Homo sapiens", "nl": "The African origin of Homo sapiens"}}], "people": ["core:richard-rick-potts"], "sources": ["src:14c43ba99c", "src:a85b75e91c"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:human-traits-gradual-mosaic", "kind": "concept", "title": {"fa": "ویژگی‌های انسانی یک‌جا پدید نیامدند", "en": "Human traits did not arise all at once", "nl": "Menselijke kenmerken ontstonden niet ineens"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "بر پایهٔ پیام‌های کلیدی برنامهٔ خاستگاه انسان در اسمیتسونین، ویژگی‌های ویژهٔ گونهٔ ما، مثل راه رفتن راست، مغز بزرگ و رفتار اجتماعی پیچیده، در گذر زمان و گام‌به‌گام روی هم انباشته شده‌اند. این ویژگی‌ها از ویژگی‌های نخستی‌های خویشاوند ما ریشه می‌گیرند و هر سازگاری هزینه‌ای هم داشته است.", "en": "According to the Smithsonian Human Origins Program's key messages, the distinctive features of our species, such as upright walking, large brains and elaborate social behaviour, built up step by step over time. They grow out of traits shared with our primate relatives, and every adaptation carried a cost.", "nl": "Volgens de kernboodschappen van het Smithsonian Human Origins Program zijn de kenmerken van onze soort, zoals rechtop lopen, grote hersenen en complex sociaal gedrag, stap voor stap opgebouwd uit eigenschappen die we met andere primaten delen."}, "points": [{"text": {"fa": "ویژگی‌هایی که امروز انسان را از دیگر جانوران جدا می‌کنند، مثل راه رفتن روی دو پا، کارکرد مغز، ساخت ابزار و زندگی اجتماعی پیچیده، با هم و ناگهانی ظاهر نشدند. شواهد فسیلی و باستان‌شناختی نشان می‌دهد هر کدام در زمان خودش و به‌تدریج شکل گرفته است.", "en": "The features that now set humans apart, such as walking on two legs, how the brain works, toolmaking and elaborate social life, did not appear together or suddenly. Fossil and archaeological evidence points to each emerging in its own time and gradually.", "nl": "The features that now set humans apart, such as walking on two legs, how the brain works, toolmaking and elaborate social life, did not appear together or suddenly. Fossil and archaeological evidence points to each emerging in its own time and gradually."}, "sources": ["src:a85b75e91c"], "flags": []}, {"text": {"fa": "سازگاری‌ها سود و زیان با هم دارند. برای نمونه، راست‌قامتی راه رفتن را ارزان‌تر کرد و دست‌ها را آزاد گذاشت، اما فشار تازه‌ای به ستون فقرات و زایمان آورد؛ مغز بزرگ هم انرژی بسیار می‌خواهد. این «سود در برابر هزینه» از نشانه‌های بنیادین تکامل شمرده می‌شود.", "en": "Adaptations bring benefits and costs together. Upright posture, for example, made walking cheaper and freed the hands but added strain on the spine and on childbirth; a big brain demands a lot of energy. This trade-off is presented as a hallmark of evolution.", "nl": "Adaptations bring benefits and costs together. Upright posture, for example, made walking cheaper and freed the hands but added strain on the spine and on childbirth; a big brain demands a lot of energy. This trade-off is presented as a hallmark of evolution."}, "sources": ["src:a85b75e91c"], "flags": []}, {"text": {"fa": "ویژگی‌های انسانی از هیچ پدید نیامده‌اند. میان ما و نخستی‌های زنده (مثل شامپانزه‌ها) پیوستگی هست: رفتارهایی مانند ابزارسازی ساده و روابط اجتماعی در خویشاوندان ما نیز دیده می‌شود، و تغییر از حالت «میمون‌مانند» به «انسان‌مانند» تدریجی بوده است.", "en": "Human traits did not come from nothing. There is continuity with living primates such as chimpanzees: simple toolmaking and rich social relations occur in our relatives too, and the shift from more ape-like to more human-like states was gradual.", "nl": "Human traits did not come from nothing. There is continuity with living primates such as chimpanzees: simple toolmaking and rich social relations occur in our relatives too, and the shift from more ape-like to more human-like states was gradual."}, "sources": ["src:a85b75e91c"], "flags": []}, {"text": {"fa": "«گام‌به‌گام» به این معنا نیست که سرعت تغییر همیشه یکسان بوده یا ویژگی‌ها پشت سر هم و در یک خط صاف رسیده‌اند. پژوهشگران امروز از «تکامل موزاییکی» سخن می‌گویند: بخش‌های مختلف بدن و مغز در گونه‌های مختلف با آهنگ‌های گوناگون تغییر کرده‌اند. این سند آموزشی کوتاه است و به این جزئیات نمی‌پردازد.", "en": "\"Step by step\" does not mean a constant rate or a single straight line. Researchers now speak of mosaic evolution: different body and brain parts changed at different paces in different species. This short educational handout does not go into that detail.", "nl": "\"Step by step\" does not mean a constant rate or a single straight line. Researchers now speak of mosaic evolution: different body and brain parts changed at different paces in different species. This short educational handout does not go into that detail."}, "sources": [], "flags": ["editor-note"]}], "links": [{"to": "tabar:human-evolution", "rel": "part-of", "note": {"fa": "تکامل انسان", "en": "Human evolution field", "nl": "Human evolution field"}}, {"to": "tabar:social-brain-evolution", "rel": "see-also", "note": {"fa": "چرا مغز اجتماعی شدیم", "en": "Why our brains went social", "nl": "Why our brains went social"}}, {"to": "psy:brain-mosaic", "rel": "see-also", "note": {"fa": "مغز موزاییکی", "en": "The mosaic brain", "nl": "The mosaic brain"}}, {"to": "tabar:mutation-selection-drift", "rel": "see-also", "note": {"fa": "جهش، انتخاب و رانش", "en": "Mutation, selection and drift", "nl": "Mutation, selection and drift"}}], "people": [], "sources": ["src:a85b75e91c"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:quaternary-climate-frameworks-dating", "kind": "concept", "title": {"fa": "چارچوب‌های اقلیمی کواترنری برای تاریخ‌گذاری پارینه‌سنگی", "en": "Quaternary climate frameworks for dating the Palaeolithic", "nl": "Kwartaire klimaatkaders voor de datering van het Paleolithicum"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "فصل ۲ نشان می‌دهد برای باستان‌شناسی پارینه‌سنگی، تغییرات اقلیم نخست یک چارچوب نسبی می‌دهد و روش‌های کمّی بعداً به آن تاریخ مطلق می‌افزایند. آیتکن دوره‌های یخچالی و میان‌یخچالی را با نام‌های منطقه‌ای معرفی می‌کند و هشدار می‌دهد تطبیق آنها بین مناطق دشوار است.", "en": "Chapter 2 shows that for Palaeolithic archaeology climatic change first supplies a relative framework, to which quantitative methods later add absolute dates. Aitken introduces glacial and interglacial stages under regional names and warns that correlating them between regions is difficult.", "nl": "Hoofdstuk 2 laat zien dat klimaatverandering voor het Paleolithicum eerst een relatief kader geeft, waaraan kwantitatieve methoden later absolute data toevoegen. Correlatie tussen regio's blijft lastig."}, "points": [{"text": {"fa": "کواترنری تقریباً دو میلیون سال اخیر است. پلیستوسن نخستین دورهٔ (عصر) آن است و پس از پلیوسن می‌آید؛ آغازش در فسیل‌ها با گذار ناگهانی از شرایط گرم به سرد دیده می‌شود، هرچند نشانه‌هایی از یخبندان در اواخر پلیوسن هم هست. دورهٔ کنونی، هولوسن، حدود ۱۰٬۰۰۰ سال پیش با پایان آخرین یخبندان آغاز شد.", "en": "The Quaternary is roughly the last 2 million years; the Pleistocene is its first epoch after the Pliocene, marked in the fossil record by an abrupt shift from warm to cold, though there is also evidence of late-Pliocene glaciation. The Holocene began about 10,000 years ago with the end of the last glaciation.", "nl": "The Quaternary is roughly the last 2 million years; the Pleistocene is its first epoch after the Pliocene, marked in the fossil record by an abrupt shift from warm to cold, though there is also evidence of late-Pliocene glaciation. The Holocene began about 10,000 years ago with the end of the last glaciation."}, "sources": ["src:97dc27875f"], "flags": []}, {"text": {"fa": "آیتکن «ساعت‌های اقلیمی» را راه‌های طبیعی زمان‌سنجی می‌نامد، در برابر ساعت‌های آزمایشگاهی. برای پارینه‌سنگی، تغییر اقلیم چارچوب می‌دهد و تاریخ دقیق را روش‌های کمّی می‌افزایند. نزدیک‌تر به امروز، حلقه‌های سالانهٔ درخت و لایه‌های سالانهٔ رسوب دریاچه‌های یخچالی برای کالیبره‌کردن مقیاس رادیوکربن بسیار مهم بوده‌اند.", "en": "Aitken calls climatic 'clocks' natural ways of telling time, as opposed to laboratory instruments. For the Palaeolithic, climate gives the framework and quantitative techniques add the dates; closer to the present, annual tree rings and annual glacial-lake sediment layers have been vital for calibrating the radiocarbon scale.", "nl": "Aitken calls climatic 'clocks' natural ways of telling time, as opposed to laboratory instruments. For the Palaeolithic, climate gives the framework and quantitative techniques add the dates; closer to the present, annual tree rings and annual glacial-lake sediment layers have been vital for calibrating the radiocarbon scale."}, "sources": ["src:97dc27875f"], "flags": []}, {"text": {"fa": "شواهد قدیمی‌تر یخچالی (تخته‌سنگ‌های جابه‌جاشده، خراش روی سنگ‌ها، ساحل‌های بالاآمده و رسوب‌های یخچالی) به چهار یخبندان بزرگ در آلپ انجامید: گونتس، میندل، ریس و وورم (که جدیدترین است). در آمریکای شمالی نام‌ها نبراسکان، کانزان، ایلینوین و ویسکانسین و در چین پویانگ، دا گو، لوشان و دالی بود. میان یخبندان‌ها دوره‌های گرم «میان‌یخچالی» و درون هر یخبندان دوره‌های گرم کوتاه «میان‌سردیک» (interstadial) آمده است.", "en": "Older glacial evidence (erratic boulders, scratch marks, raised beaches, glacial drift) led to four major Alpine ice ages: Günz, Mindel, Riss and Würm (the latest); North America used Nebraskan, Kansan, Illinoian, Wisconsinan and China Poyang, Da Gu, Lushan and Dali. Warm interglacials lie between glacials, and short warm interstadials lie within them.", "nl": "Older glacial evidence (erratic boulders, scratch marks, raised beaches, glacial drift) led to four major Alpine ice ages: Günz, Mindel, Riss and Würm (the latest); North America used Nebraskan, Kansan, Illinoian, Wisconsinan and China Poyang, Da Gu, Lushan and Dali. Warm interglacials lie between glacials, and short warm interstadials lie within them."}, "sources": ["src:97dc27875f"], "flags": []}, {"text": {"fa": "به گفتهٔ آیتکن، این چارچوب امروز بسیار پیچیده‌تر از چهار یخبندان است و انتقال آن از آلپ به مناطق دیگر مشکل دارد: ثبت رسوبی ناپیوسته است، بعضی مراحل در یک منطقه به‌کلی نیستند، و آنچه در یک جا میان‌یخچالی شمرده می‌شود ممکن است جای دیگر فقط میان‌سردیک باشد. هرچه به گذشته‌تر برویم همخوانی مناطق نامطمئن‌تر می‌شود. نام‌های فرهنگی (آشولی، موستری، اوریناسی و غیره) هم از جایگاه‌های اروپایی آمده‌اند و در جاهای دیگر برای مجموعه‌های مشابه به کار می‌روند.", "en": "Aitken says the framework is now much more complex than four glacials and its transfer beyond the Alps is problematic: the sedimentary record is discontinuous, phases may be missing in a region, and what is an interglacial in one place may be only an interstadial elsewhere; correlation grows less certain further back. Cultural labels (Acheulean, Mousterian, Aurignacian, etc.) derive from European sites but are used for similar assemblages elsewhere.", "nl": "Aitken says the framework is now much more complex than four glacials and its transfer beyond the Alps is problematic: the sedimentary record is discontinuous, phases may be missing in a region, and what is an interglacial in one place may be only an interstadial elsewhere; correlation grows less certain further back. Cultural labels (Acheulean, Mousterian, Aurignacian, etc.) derive from European sites but are used for similar assemblages elsewhere."}, "sources": ["src:97dc27875f"], "flags": ["contested"]}, {"text": {"fa": "یادداشت ویراستار: مدل چهار یخبندان آلپی با ثبت‌های ایزوتوپ اکسیژن در رسوب‌های دریا و نظریهٔ میلانکوویچ تقریباً کنار گذاشته شده و به‌جای آن چرخه‌های یخبندان بسیار بیشتری (مرحله‌های ایزوتوپی دریایی) به کار می‌رود. فهرست مطالب کتاب نشان می‌دهد فصل ۲ همین موضوع‌ها را دارد، اما متن آن بخش‌ها (ایزوتوپ اکسیژن، میلانکوویچ، گرده‌شناسی، لایه‌های سالانهٔ رسوب، دندروکرونولوژی) در پیش‌نمایش نیست.", "en": "Editor's note: the four-glacial Alpine model has largely been replaced by marine oxygen-isotope records and Milankovitch theory, which show many more glacial cycles (marine isotope stages). The book's contents list shows chapter 2 covers these topics (oxygen isotopes, Milankovitch, pollen, varves, dendrochronology), but the text of those sections is not in the preview.", "nl": "Editor's note: the four-glacial Alpine model has largely been replaced by marine oxygen-isotope records and Milankovitch theory, which show many more glacial cycles (marine isotope stages). The book's contents list shows chapter 2 covers these topics (oxygen isotopes, Milankovitch, pollen, varves, dendrochronology), but the text of those sections is not in the preview."}, "sources": [], "flags": ["editor-note"]}], "links": [{"to": "tabar:brain-body-size-climate", "rel": "see-also", "note": {"fa": "اقلیم و اندازهٔ مغز و بدن", "en": "Climate and brain/body size", "nl": "Climate and brain/body size"}}, {"to": "phil:science-based-dating-basic-principles", "rel": "part-of", "note": {"fa": "زمان‌سنجی علمی در باستان‌شناسی: اصول", "en": "Science-based dating in archaeology: principles", "nl": "Science-based dating in archaeology: principles"}}, {"to": "tabar:human-evolution", "rel": "see-also", "note": {"fa": "تکامل انسان (حوزهٔ کلی)", "en": "Human evolution (field overview)", "nl": "Human evolution (field overview)"}}], "people": [], "sources": ["src:97dc27875f"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:darwin-domestic-variation", "kind": "concept", "title": {"fa": "دگرگونی در اهلی‌سازی و گزینش مصنوعی نزد داروین", "en": "Variation under domestication and artificial selection in Darwin", "nl": "Variatie onder domesticatie en kunstmatige selectie bij Darwin"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "داروین کتاب را از پرورش‌دهندگان کبوتر، سگ و گیاه شروع می‌کند، چون نشان می‌دهد در مدت کوتاه و با انتخاب آدمی می‌توان از یک نیای مشترک نژادهای بسیار متفاوت ساخت. این «نمونهٔ کوچک‌شدهٔ» انتخاب، پایهٔ قیاس او برای طبیعت است. دربارهٔ علت دگرگونی‌ها خودش اعتراف می‌کند که چیز زیادی نمی‌داند.", "en": "Darwin opens with pigeon, dog and plant breeders because they show that, in a short time, human choice can turn one ancestral stock into strikingly different breeds. This miniature of selection is the base of his analogy for nature. About the causes of variation he openly admits deep ignorance.", "nl": "Darwin begint bij duiven-, honden- en plantenkwekers: in korte tijd kan menselijke keuze uit één voorouder zeer verschillende rassen maken. Dit is de basis van zijn analogie met de natuur; over de oorzaken van variatie bekent hij grote onwetendheid."}, "points": [{"text": {"fa": "داروین می‌گوید گونه‌های اهلی، مثل کبوترهای تزئینی با ظاهرهای بسیار گوناگون، همه از یک نیای وحشی (کبوتر صخره‌ای) آمده‌اند. تفاوت‌های بزرگ از تفاوت‌های کوچکِ روی‌هم‌انباشته ساخته شده، نه از جهش‌های ناگهانی.", "en": "He argues that domestic forms such as fancy pigeons, however different, all descend from one wild ancestor (the rock pigeon). Large differences are built from many small differences piling up, not from sudden leaps.", "nl": "He argues that domestic forms such as fancy pigeons, however different, all descend from one wild ancestor (the rock pigeon). Large differences are built from many small differences piling up, not from sudden leaps."}, "sources": ["src:84786f7bfa"], "flags": []}, {"text": {"fa": "او دو نوع گزینش را از هم جدا می‌کند: گزینش روشمند (پرورش‌دهنده آگاهانه گزینه‌ای را می‌خواهد) و گزینش ناخودآگاه (فقط بهترین‌ها را نگه می‌دارد و نتیجه آرام‌آرام می‌آید). دومی به رفتار طبیعت بسیار نزدیک‌تر است.", "en": "He separates methodical selection (the breeder deliberately aims at a goal) from unconscious selection (simply keeping the best animals, with change arriving slowly). The second is much closer to what nature does.", "nl": "He separates methodical selection (the breeder deliberately aims at a goal) from unconscious selection (simply keeping the best animals, with change arriving slowly). The second is much closer to what nature does."}, "sources": ["src:84786f7bfa"], "flags": []}, {"text": {"fa": "داروین می‌پذیرد که قانون‌های وراثت و علت پیدایش دگرگونی‌ها برایش «ناشناخته» است. او به اثر محیط، عادت و استفاده/ناستفاده ــ و به همبستگی رشد (تغییر یک عضو با تغییر عضو دیگر) ــ اشاره می‌کند، اما درباره مکانیزم دقیق نمی‌تواند چیزی بگوید.", "en": "Darwin concedes that the laws of inheritance and the causes of new variation are unknown to him. He points to conditions of life, habit, use and disuse, and correlated growth (one organ changing along with another), but cannot give the exact mechanism.", "nl": "Darwin concedes that the laws of inheritance and the causes of new variation are unknown to him. He points to conditions of life, habit, use and disuse, and correlated growth (one organ changing along with another), but cannot give the exact mechanism."}, "sources": ["src:84786f7bfa"], "flags": ["dated"]}, {"text": {"fa": "نکتهٔ علمیِ امروز: استدلال گزینش مصنوعی همچنان درست است و آزمایش‌های جدید (مثلاً اهلی‌سازی روباه نقره‌ای در روسیه و ژنوم سگ و کبوتر) آن را تأیید کرده‌اند. ولی «علتِ» تنوع اکنون روشن است: جهش‌های تصادفی در دی‌ان‌ای و بازترکیب ژن‌ها، نه اثر مستقیم عادت یا محیط بر ویژگی‌های ارثی.", "en": "Modern note: the artificial-selection argument still holds and has been confirmed by newer work (for example the Russian silver-fox domestication experiment and pigeon and dog genomes). The cause of variation is now clear: random mutation in DNA and gene recombination, not direct inheritance of habit or environment.", "nl": "Modern note: the artificial-selection argument still holds and has been confirmed by newer work (for example the Russian silver-fox domestication experiment and pigeon and dog genomes). The cause of variation is now clear: random mutation in DNA and gene recombination, not direct inheritance of habit or environment."}, "sources": ["src:7f2346c4be"], "flags": ["editor-note"]}], "links": [{"to": "tabar:mutation-selection-drift", "rel": "see-also", "note": {"fa": "جهش، انتخاب و رانش (علت امروزیِ تنوع)", "en": "Mutation, selection and drift (the modern cause of variation)", "nl": "Mutation, selection and drift (the modern cause of variation)"}}, {"to": "tabar:human-evolution", "rel": "part-of", "note": {"fa": "تکامل انسان", "en": "Human evolution", "nl": "Human evolution"}}, {"to": "tabar:heritability", "rel": "see-also", "note": {"fa": "وراثت‌پذیری", "en": "Heritability", "nl": "Heritability"}}], "people": ["core:charles-darwin"], "sources": ["src:7f2346c4be", "src:84786f7bfa"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:darwin-sexual-selection", "kind": "concept", "title": {"fa": "انتخاب جنسی (طرح نخست داروین)", "en": "Sexual selection (Darwin's first sketch)", "nl": "Seksuele selectie (Darwins eerste schets)"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "داروین انتخاب جنسی را دلیل ویژگی‌هایی می‌دانست که به زنده‌ماندن کمکی نمی‌کنند، مثل دم طاووس یا شاخ گوزن: سودشان در رقابت برای جفت است، نه در مبارزهٔ زنده‌ماندن. در چاپ ۱۸۵۹ فقط چند صفحه به آن داده شده است؛ بحث کامل‌تر را بعدها در «تبار انسان» (۱۸۷۱) آورد.", "en": "Darwin saw sexual selection as the
