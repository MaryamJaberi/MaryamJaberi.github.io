ل ناچیز است و بررسی آن‌ها را باید کنار گذاشت.", "en": "Background: Ashley Montagu (1942) argued that race is a social concept, and Richard Lewontin (1972) showed that about 85 percent of blood-protein variation is within groups and only about 15 percent between 'races'. Reich considers this correct but says it hardened into an orthodoxy that differences between populations are negligible in practice and should not be studied.", "nl": "Background: Ashley Montagu (1942) argued that race is a social concept, and Richard Lewontin (1972) showed that about 85 percent of blood-protein variation is within groups and only about 15 percent between 'races'. Reich considers this correct but says it hardened into an orthodoxy that differences between populations are negligible in practice and should not be studied."}, "sources": ["src:a4f00f41ff", "src:f5e4bb7bf1"], "flags": []}, {"text": {"fa": "ادعای رایش: با ژنوم کامل می‌توان مردم را به خوشه‌هایی گروه‌بندی کرد که با دسته‌های نژادی آمریکایی هم‌خوانی دارد، و میانگین تفاوت‌های ژنتیکی نابدیهی میان جمعیت‌ها هست، مثل پوست، تحمل لاکتوز، سازگاری با ارتفاع و خطر بعضی بیماری‌ها. به گفتهٔ او «تبار» اصطلاحی دقیق‌تر از «نژاد» است. نقد: آ. ف. ادواردز (۲۰۰۳) نشان داده بود ترکیب ژن‌های بسیار می‌تواند گروه‌ها را متمایز کند، اما انسان‌شناسان می‌گویند این تفاوت‌ها شیب‌دار و ترکیبی‌اند و با مقوله‌های اجتماعی «نژاد» یکی نیستند.", "en": "Reich's claim: with genome-wide data people can be grouped into clusters that match American racial categories, and non-trivial average genetic differences exist, such as skin colour, lactose tolerance, altitude adaptation and risk of some diseases. In his words 'ancestry' is a more precise term than 'race'. Critique: A. W. F. Edwards (2003) had shown that combining many genes can distinguish groups, but anthropologists say these differences are graded and overlapping and do not coincide with socially defined 'races'.", "nl": "Reich's claim: with genome-wide data people can be grouped into clusters that match American racial categories, and non-trivial average genetic differences exist, such as skin colour, lactose tolerance, altitude adaptation and risk of some diseases. In his words 'ancestry' is a more precise term than 'race'. Critique: A. W. F. Edwards (2003) had shown that combining many genes can distinguish groups, but anthropologists say these differences are graded and overlapping and do not coincide with socially defined 'races'."}, "sources": ["src:a4f00f41ff", "src:fa0bbed230", "src:3a7bc7708c"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "بخش پرمناقشه: رایش می‌نویسد انتظار دارد تفاوت‌های میانگین در صفات چندژنی از جمله شاید ویژگی‌های شناختی هم یافت شود، ولی خودش می‌گوید هنوز پژوهش‌های کافی نیست و «حدس‌ها»ی نژادپرستانه را بی‌پایه می‌داند. پس ادعای او دربارهٔ صفات شناختی یک انتظار است، نه یافته. شواهد نمونه‌اش دربارهٔ انتخاب چندژنی ارتفاع بعداً با مدل‌های کنترل‌شده برای ساختار جمعیتی به‌شدت تضعیف شد، و نمرهٔ چندژنی در جمعیت‌هایی با تبار متفاوت از نمونهٔ آموزش، بدتر پیش‌بینی می‌کند.", "en": "The most contested part: Reich writes that he expects average differences in polygenic traits, perhaps including cognitive ones, but also says samples are not yet adequate, and calls racist guesses baseless. So his claim about cognitive traits is an expectation, not a finding. His example of polygenic selection on height was later strongly weakened by models that control for population structure, and polygenic scores predict worse in populations whose ancestry differs from the training sample.", "nl": "The most contested part: Reich writes that he expects average differences in polygenic traits, perhaps including cognitive ones, but also says samples are not yet adequate, and calls racist guesses baseless. So his claim about cognitive traits is an expectation, not a finding. His example of polygenic selection on height was later strongly weakened by models that control for population structure, and polygenic scores predict worse in populations whose ancestry differs from the training sample."}, "sources": ["src:a4f00f41ff", "src:27a78bd0f5", "src:04a1436337"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "رایش نظریه‌های «جنبهٔ ژنتیکی کلیشه‌های نژادی» را جدا رد می‌کند؛ نمونه‌اش نیکلاس وید (۲۰۱۴) را می‌آورد و می‌گوید بخش‌هایی از آن «کاملاً حدسی» است و منبع علمی جدی ندارد. او هم‌زمان معتقد است سکوت دانشمندان میدان را به حدس‌زنان می‌سپارد. موضع او این است که ژنوم باید روایتی مشترک از تاریخ بشر بدهد که جایگزین نژادپرستی و ناسیونالیسم شود؛ خود کتاب راه‌حل قطعی حقوقی یا سیاستی ارائه نمی‌دهد.", "en": "Reich firmly rejects 'genetic explanations of racial stereotypes', citing Nicholas Wade (2014) and calling parts of that book entirely speculative and without serious scientific backing. He also believes that scientific silence leaves the field to speculators. His stance is that the genome should offer a shared history of humanity as an alternative to racism and nationalism; the book itself offers no definitive legal or policy solution.", "nl": "Reich firmly rejects 'genetic explanations of racial stereotypes', citing Nicholas Wade (2014) and calling parts of that book entirely speculative and without serious scientific backing. He also believes that scientific silence leaves the field to speculators. His stance is that the genome should offer a shared history of humanity as an alternative to racism and nationalism; the book itself offers no definitive legal or policy solution."}, "sources": ["src:a4f00f41ff"], "flags": []}, {"text": {"fa": "پیامد اخلاقی دیگر: ده هزار سال پیش غرب اوراسیا چهار جمعیت بسیار متمایز داشت که به اندازهٔ اروپاییان و شرق آسیایی‌ها با هم فرق داشتند، و همهٔ آن‌ها بعداً در هم آمیختند. رایش این را نشان می‌دهد که «نژادها» عکس‌های لحظه‌ای ساختار جمعیتی‌اند، نه مقولات ثابت. او همچنین به اخلاق پژوهش روی بقایای انسانی (مثل کِنِویک و بازگرداندن به بومیان) و دقت پایین آزمون‌های تبارِ تجاری اشاره می‌کند. (نمونه: گزارش درصد نئاندرتال در یک آزمون تجاری که دقت کافی نداشت.)", "en": "Another ethical implication: ten thousand years ago West Eurasia had four very distinct populations, as different from each other as Europeans and East Asians, all later merged. Reich takes this to show that 'races' are snapshots of population structure, not fixed categories. He also raises the ethics of studying human remains (e.g. Kennewick and return to Native American tribes) and the poor accuracy of commercial ancestry tests (some Neanderthal percentage reports were unreliable).", "nl": "Another ethical implication: ten thousand years ago West Eurasia had four very distinct populations, as different from each other as Europeans and East Asians, all later merged. Reich takes this to show that 'races' are snapshots of population structure, not fixed categories. He also raises the ethics of studying human remains (e.g. Kennewick and return to Native American tribes) and the poor accuracy of commercial ancestry tests (some Neanderthal percentage reports were unreliable)."}, "sources": ["src:a4f00f41ff"], "flags": []}], "links": [{"to": "tabar:race-biology", "rel": "explains", "note": {"fa": "آیا نژاد مقوله‌ای زیستی است؟", "en": "Is race a biological category?", "nl": "Is race a biological category?"}}, {"to": "tabar:genetic-essentialism", "rel": "critiques", "note": {"fa": "ذات‌گرایی ژنتیکی", "en": "Genetic essentialism", "nl": "Genetic essentialism"}}, {"to": "tabar:ancestry-tests", "rel": "see-also", "note": {"fa": "محدودیت آزمون‌های تبار", "en": "Limits of ancestry tests", "nl": "Limits of ancestry tests"}}, {"to": "tabar:gwas-polygenic", "rel": "see-also", "note": {"fa": "نمرهٔ چندژنی و محدودیت‌ها", "en": "Polygenic scores and their limits", "nl": "Polygenic scores and their limits"}}], "people": ["core:richard-lewontin", "core:a-w-f-edwards", "core:ashley-montagu", "core:nicholas-wade"], "sources": ["src:04a1436337", "src:27a78bd0f5", "src:3a7bc7708c", "src:a4f00f41ff", "src:f5e4bb7bf1", "src:fa0bbed230"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:basal-eurasian-ancestry", "kind": "concept", "title": {"fa": "تبار «اوراسیایی پایه» و نئاندرتال‌ها", "en": "Basal Eurasian ancestry and Neanderthal ancestry", "nl": "Basaal-Euraziatische afstamming en Neanderthalers"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "«اوراسیایی پایه» نام یک شاخهٔ فرضی از انسان است که پیش از جدایی شرقی‌ها و شمالی‌های اوراسیا از دیگر غیرآفریقایی‌ها جدا شد. هنوز هیچ نمونهٔ ناآمیخته‌ای از آن پیدا نشده، اما لازاریدیس و همکاران با آماره‌های ژنتیکی نشان دادند حدود نیمی از تبار نخستین مردم خاور نزدیک از آن بود و این تبار با نئاندرتالِ کمتر همراه است.", "en": "'Basal Eurasian' is a hypothesised human lineage that split off before the East Asian and northern Eurasian lineages diverged from other non-Africans. No unmixed sample has been found, but Lazaridis and colleagues used genetic statistics to show about half the ancestry of the earliest Near Easterners came from it, and that it correlates with less Neanderthal ancestry.", "nl": "'Basaal-Euraziaten' zijn een veronderstelde afstammingslijn die zich vroeg afsplitste. Lazaridis e.a. schatten dat ongeveer de helft van de afstamming van de oudste Nabije-Oosterlingen daarvan kwam, samen met minder Neanderthaler-DNA."}, "points": [{"text": {"fa": "ردیابی: آماره‌ای که میزان شباهت هر گروه به نمونهٔ ۴۵٬۰۰۰ ساله اوست‌ایشیم (سیبری) را با چینی هان مقایسه می‌کند برای همهٔ خاور نزدیکی‌های باستانی و اروپاییان نوسنگی به‌طور معنادار منفی بود. این الگو با داشتن بخشی از تبار از شاخه‌ای که پیش از جدایی هان و اوست‌ایشیم جدا شده سازگار است.", "en": "Detection: a statistic comparing each group's similarity to the ~45,000-year-old Ust'-Ishim individual (Siberia) against Han Chinese was significantly negative for all ancient Near Easterners and Neolithic Europeans. This pattern fits having some ancestry from a lineage that split before Han and Ust'-Ishim diverged.", "nl": "Detection: a statistic comparing each group's similarity to the ~45,000-year-old Ust'-Ishim individual (Siberia) against Han Chinese was significantly negative for all ancient Near Easterners and Neolithic Europeans. This pattern fits having some ancestry from a lineage that split before Han and Ust'-Ishim diverged."}, "sources": ["src:43526796e0"], "flags": []}, {"text": {"fa": "سهم‌ها (با روش qpAdm): حدود ۶۶±۱۳٪ در نمونهٔ احتمالاً میان‌سنگی هوتو، ۴۸±۶٪ در نوسنگیان ایران و ۴۴±۸٪ در ناتوفی‌های لوانت. بنابراین این تبار در خاور نزدیک باستان گسترده بود. این برآوردها با خطای آماری زیاد گزارش شده‌اند.", "en": "Shares (by qpAdm): about 66±13% in the probably Mesolithic Hotu individual, 48±6% in Iranian Neolithic farmers and 44±8% in Levantine Natufians. This ancestry was therefore widespread in the ancient Near East. The estimates carry sizable statistical error.", "nl": "Shares (by qpAdm): about 66±13% in the probably Mesolithic Hotu individual, 48±6% in Iranian Neolithic farmers and 44±8% in Levantine Natufians. This ancestry was therefore widespread in the ancient Near East. The estimates carry sizable statistical error."}, "sources": ["src:43526796e0"], "flags": []}, {"text": {"fa": "نئاندرتال: هرچه سهم تبار اوراسیایی پایه بیشتر باشد، سهم آلل‌های مشترک با نئاندرتال کمتر است. نویسندگان از این برون‌یابی می‌گیرند که این شاخه نئاندرتالِ کمتر و شاید هیچ داشته؛ بازهٔ اطمینان ۹۵٪ از صفر تا ۶۰٪ است، یعنی بسیار گسترده. این می‌تواند توضیح دهد چرا غرب‌اوراسیاییان کمی نئاندرتال کمتر از شرق آسیاییان دارند.", "en": "Neanderthals: the larger the Basal Eurasian share, the smaller the share of alleles matching Neanderthals. By extrapolation the authors infer that lineage had less Neanderthal ancestry and possibly none; the 95% interval runs from 0 to 60%, i.e. very wide. This could explain why West Eurasians carry slightly less Neanderthal ancestry than East Asians.", "nl": "Neanderthals: the larger the Basal Eurasian share, the smaller the share of alleles matching Neanderthals. By extrapolation the authors infer that lineage had less Neanderthal ancestry and possibly none; the 95% interval runs from 0 to 60%, i.e. very wide. This could explain why West Eurasians carry slightly less Neanderthal ancestry than East Asians."}, "sources": ["src:43526796e0"], "flags": ["contested"]}, {"text": {"fa": "خاستگاه جغرافیایی نامعلوم است. نویسندگان دو توضیح را مطرح می‌کنند و انتخاب نمی‌کنند: یا این تبار پیش از نمونه‌های بررسی‌شده و پس از آمیختگی با نئاندرتال‌ها به خاور نزدیک آمیخته شد، یا اجدادش همیشه آنجا بودند اما در آمیختگی با نئاندرتال شرکت نکردند. گمانهٔ آفریقایی‌بودن (بر پایه جمجمه‌سنجی و تبار پدری E در ناتوفی‌ها) در داده‌های ژنوم‌گستر تأیید نشد، چون آفریقایی‌های زیرصحرا با ناتوفی‌ها آلل بیشتری شریک نیستند.", "en": "Geographic origin is unknown. The authors give two explanations without choosing: it either mixed into the Near East before the studied samples but after Neanderthal admixture, or its ancestors always lived there but missed the Neanderthal admixture. An African origin (suggested by craniometry and Y-haplogroup E in Natufians) found no support in genome-wide data, since sub-Saharan Africans share no extra alleles with Natufians.", "nl": "Geographic origin is unknown. The authors give two explanations without choosing: it either mixed into the Near East before the studied samples but after Neanderthal admixture, or its ancestors always lived there but missed the Neanderthal admixture. An African origin (suggested by craniometry and Y-haplogroup E in Natufians) found no support in genome-wide data, since sub-Saharan Africans share no extra alleles with Natufians."}, "sources": ["src:43526796e0"], "flags": ["contested"]}, {"text": {"fa": "جمع‌بندی ویراستار: «اوراسیایی پایه» یک نتیجهٔ مدل‌محور است نه یک جمعیت نمونه‌برداری‌شده. مقالهٔ ۲۰۲۴ دربارهٔ فلات ایران همین تبار را با مدل اقلیمی بررسی می‌کند و برای آن خاستگاهی در شمال آفریقا، عربستان یا لوانت پیشنهاد می‌دهد، که با ایران متفاوت است؛ این دو مقاله باید با هم خوانده شوند.", "en": "Editor's note: 'Basal Eurasian' is a model-based inference, not a sampled population. The 2024 Persian Plateau paper revisits the same lineage with a climate model and suggests an origin in North Africa, Arabia or the Levant, separate from Iran; the two papers should be read together.", "nl": "Editor's note: 'Basal Eurasian' is a model-based inference, not a sampled population. The 2024 Persian Plateau paper revisits the same lineage with a climate model and suggests an origin in North Africa, Arabia or the Levant, separate from Iran; the two papers should be read together."}, "sources": [], "flags": ["editor-note"]}], "links": [{"to": "tabar:neanderthal-admixture", "rel": "bridges", "note": {"fa": "آمیزش با نئاندرتال‌ها", "en": "Admixture with Neanderthals", "nl": "Admixture with Neanderthals"}}, {"to": "tabar:out-of-africa", "rel": "see-also", "note": {"fa": "خاستگاه آفریقایی انسان خردمند", "en": "African origin of Homo sapiens", "nl": "African origin of Homo sapiens"}}, {"to": "tabar:haplogroups", "rel": "see-also", "note": {"fa": "هاپلوگروه‌ها (مثل E)", "en": "Haplogroups (such as E)", "nl": "Haplogroups (such as E)"}}, {"to": "tabar:persian-plateau-hub", "rel": "contrasts", "note": {"fa": "فلات ایران به‌عنوان کانون", "en": "The Persian Plateau as Hub", "nl": "The Persian Plateau as Hub"}}, {"to": "tabar:eurasian-waves-eec-wec", "rel": "see-also", "note": {"fa": "مدخل هم‌موضوع", "en": "Related entry", "nl": "Verwant lemma"}}], "people": ["core:iosif-lazaridis"], "sources": ["src:43526796e0"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:human-origins-how-we-know", "kind": "concept", "title": {"fa": "دانستن خاستگاه انسان: کشف‌ها و فناوری‌های تازه", "en": "Knowing human origins: new discoveries and technologies", "nl": "Menselijke oorsprong kennen: nieuwe vondsten en technieken"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "پیام هفتم سند می‌گوید دانش ما از تکامل انسان ثابت نیست: پرسش‌های تازه، کشف‌های میدانی و ابزارهای نو سن فسیل‌ها، رخدادهای مهم و شناخت ما از انسان و شامپانزه را پیوسته بازبینی می‌کنند. بنابراین علم را باید پژوهش و پرسشگری دید.", "en": "Message 7 says our knowledge of human evolution is not fixed: new questions, field discoveries and new tools keep refining fossil ages, key milestones and our comparisons of humans and other apes. Science is presented as inquiry.", "nl": "Boodschap 7 stelt dat onze kennis van menselijke evolutie voortdurend wordt bijgesteld door nieuwe vragen, vondsten en technieken; wetenschap is onderzoek."}, "points": [{"text": {"fa": "سند چند راه تازه‌شدن دانش را می‌شمارد: تعیین سن دقیق‌تر فسیل‌ها و ابزارها، یافته‌های فسیلی و باستان‌شناختی جدید (مثلاً در دردهٔ ریفت آفریقا)، و فناوری‌های نو.", "en": "The handout lists ways knowledge is refreshed: more precise dating of fossils and artifacts, new fossil and archaeological finds (for example in Africa's Rift Valley), and new technologies.", "nl": "The handout lists ways knowledge is refreshed: more precise dating of fossils and artifacts, new fossil and archaeological finds (for example in Africa's Rift Valley), and new technologies."}, "sources": ["src:a85b75e91c"], "flags": []}, {"text": {"fa": "نمونه‌های فناوری که سند نام می‌برد: بازیابی دی‌ان‌ای از فسیل، بررسی ساختارهای ریز دندان و استخوان مربوط به رشد، سنجش ترکیب شیمیایی دندان و استخوان برای شناخت رژیم غذایی، و تخمین سن رسوبات.", "en": "Technology examples named: recovering DNA from fossils, examining microscopic tooth and bone structures tied to growth, measuring chemistry of teeth and bone to infer diet, and refining sediment ages.", "nl": "Technology examples named: recovering DNA from fossils, examining microscopic tooth and bone structures tied to growth, measuring chemistry of teeth and bone to infer diet, and refining sediment ages."}, "sources": ["src:a85b75e91c"], "flags": []}, {"text": {"fa": "پژوهش‌هایی مانند ردیابی چشم نوزادان و جعبه‌ابزار نخستی‌ها شباهت‌ها و تفاوت‌های انسان و میمون‌های بزرگ را روشن‌تر می‌کنند.", "en": "Work such as eye-tracking in infants and studies of primate tool kits sharpens the similarities and differences between humans and great apes.", "nl": "Work such as eye-tracking in infants and studies of primate tool kits sharpens the similarities and differences between humans and great apes."}, "sources": ["src:a85b75e91c"], "flags": []}, {"text": {"fa": "نکتهٔ سازنده برای خواننده: چون یافته‌ها پیوسته اصلاح می‌شوند، تاریخ‌ها و ادعاهای مطرح در نوشته‌های آموزشی (از جمله همین سند ۲۰۱۵) ممکن است امروز قدیمی باشند. برای هر عدد به پژوهش‌های تازه‌تر نگاه کنید.", "en": "A practical caution: because findings are constantly revised, dates and claims in outreach texts (this 2015 handout included) may be outdated today. Check newer research for any figure.", "nl": "A practical caution: because findings are constantly revised, dates and claims in outreach texts (this 2015 handout included) may be outdated today. Check newer research for any figure."}, "sources": [], "flags": ["dated", "editor-note"]}], "links": [{"to": "tabar:ancient-dna", "rel": "see-also", "note": {"fa": "انقلاب دی‌ان‌ای باستانی", "en": "The ancient DNA revolution", "nl": "The ancient DNA revolution"}}, {"to": "tabar:human-evolution", "rel": "part-of", "note": {"fa": "تکامل انسان", "en": "Human evolution", "nl": "Human evolution"}}, {"to": "tabar:neanderthal-admixture", "rel": "see-also", "note": {"fa": "آمیزش با نئاندرتال‌ها", "en": "Admixture with Neanderthals", "nl": "Admixture with Neanderthals"}}], "people": [], "sources": ["src:a85b75e91c"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:lactase-gene-culture", "kind": "concept", "title": {"fa": "تداوم لاکتاز: نمونهٔ هم‌تکاملی ژن و فرهنگ", "en": "Lactase persistence: a case of gene–culture coevolution", "nl": "Lactasepersistentie: een geval van gen-cultuur-co-evolutie"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "بیشتر پستانداران بعد از شیرخوارگی توان هضم شیر را از دست می‌دهند؛ در جمعیت‌هایی که دامداری کردند، جهش‌هایی که هضم شیر را تا بزرگسالی نگه می‌دارند در چند هزار سال رایج شد. فرهنگ (دامداری) ژن را انتخاب کرد.", "en": "Most mammals lose the ability to digest milk after infancy; in populations that kept cattle, mutations that keep milk digestion into adulthood became common within a few thousand years. Culture (herding) selected the gene.", "nl": "De meeste zoogdieren verliezen na de zuigelingentijd het vermogen melk te verteren; in bevolkingen die vee hielden, werden mutaties die melkvertering tot in de volwassenheid behouden binnen enkele duizenden jaren gangbaar. Cultuur (veeteelt) selecteerde het gen."}, "points": [{"text": {"fa": "تیشکوف و همکاران (۲۰۰۷): در شرق آفریقا جهش‌هایی متفاوت از جهش اروپایی، به‌طور مستقل، تداوم لاکتاز ایجاد کرده‌اند؛ تکامل همگرا زیر فشار یک شیوهٔ زندگی مشترک.", "en": "Tishkoff et al. (2007): in East Africa mutations different from the European one independently produced lactase persistence; convergent evolution under the pressure of a shared way of life.", "nl": "Tishkoff et al. (2007): in East Africa mutations different from the European one independently produced lactase persistence; convergent evolution under the pressure of a shared way of life."}, "sources": ["src:e6dfee157f"], "flags": []}, {"text": {"fa": "این یکی از قوی‌ترین نمونه‌های انتخاب طبیعی اخیر در انسان است و نشان می‌دهد تکامل انسان با کشاورزی متوقف نشد، بلکه شتاب گرفت.", "en": "This is one of the strongest examples of recent natural selection in humans and shows that human evolution did not stop with agriculture but accelerated.", "nl": "This is one of the strongest examples of recent natural selection in humans and shows that human evolution did not stop with agriculture but accelerated."}, "sources": ["src:d8fb384d44"], "flags": []}], "links": [{"to": "atlas:geneculture", "rel": "part-of", "note": {"fa": "پل هم‌تکاملی ژن و فرهنگ", "en": "The gene–culture coevolution bridge", "nl": "The gene–culture coevolution bridge"}}, {"to": "psy:cultural-evolution", "rel": "bridges", "note": {"fa": "تکامل فرهنگی", "en": "Cultural evolution", "nl": "Cultural evolution"}}], "people": ["core:sarah-tishkoff", "core:luigi-luca-cavalli-sforza"], "sources": ["src:d8fb384d44", "src:e6dfee157f"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:hominin-evolution-changing-environments", "kind": "concept", "title": {"fa": "نیاکان ما در جهانی دستخوش دگرگونی", "en": "Our ancestors in a changing world", "nl": "Onze voorouders in een veranderende wereld"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "به گفتهٔ برنامهٔ خاستگاه انسان در اسمیتسونین، نیاکان انسان در محیط‌هایی می‌زیستند که اقلیم و چشم‌انداز آن‌ها به‌شدت تغییر می‌کرد. بقا در برابر این دگرگونی‌ها یکی از نیروهای شکل‌دهندهٔ ویژگی‌های ما بوده است.", "en": "The Smithsonian Human Origins Program says human ancestors lived in surroundings whose climate and landscapes changed dramatically, and that coping with those changes helped shape our traits.", "nl": "Het Smithsonian Human Origins Program stelt dat menselijke voorouders leefden in sterk veranderende omgevingen en dat overleven daarin onze kenmerken mede vormde."}, "points": [{"text": {"fa": "پیام کلیدی سوم این سند می‌گوید نیاکان انسان با تغییرات شدید محیط روبه‌رو بودند و این تغییرات چالش‌های بقا ساخت. سند برای این موضوع به پژوهش‌های اقلیمی برنامه، دو ویدیو و یک پادکست دربارهٔ مجموعهٔ «انسان شدن» ارجاع می‌دهد.", "en": "Key message 3 of the handout says human ancestors faced dramatic environmental change, which created survival challenges. It points to the programme's climate research, two videos and a podcast on the 'Becoming Human' series.", "nl": "Key message 3 of the handout says human ancestors faced dramatic environmental change, which created survival challenges. It points to the programme's climate research, two videos and a podcast on the 'Becoming Human' series."}, "sources": ["src:a85b75e91c"], "flags": []}, {"text": {"fa": "در نقشهٔ نمایشگاه همراه این سند، «بدن‌های سازگار با اقلیم‌های گوناگون»، «پراکنش» و «ابزارسازی» کنار هم آمده‌اند؛ یعنی سازگاری فرهنگی و زیستی با محیط‌های تازه یک رشته دیده شده است.", "en": "In the travelling-exhibit plan attached to the handout, 'adapting to diverse climates', dispersal and toolmaking are grouped together, treating biological and cultural adaptation to new environments as one thread.", "nl": "In the travelling-exhibit plan attached to the handout, 'adapting to diverse climates', dispersal and toolmaking are grouped together, treating biological and cultural adaptation to new environments as one thread."}, "sources": ["src:a85b75e91c"], "flags": []}, {"text": {"fa": "پیوند میان نوسان اقلیم و تکامل انسان فرضیهٔ پرنفوذی است، ولی دقت آن محل بحث است. یکی از شناخته‌ترین صورت‌های آن «انتخاب برپایهٔ تغییرپذیری» است که ریک پاتس (۱۹۹۸) پیشنهاد کرد: پایداری گونه‌ها در برابر ناپایداری محیط. شواهد ریزمقیاس اقلیمی و ارتباطشان با رویدادهای فسیلی هنوز بررسی و گاه نقد می‌شود.", "en": "Linking climate variability to human evolution is an influential hypothesis, but how strongly it holds is debated. A well-known form is 'variability selection', proposed by Rick Potts (1998): selection favouring versatility under unstable environments. Fine-scale climate records and their match to fossil events are still being tested and sometimes challenged.", "nl": "Linking climate variability to human evolution is an influential hypothesis, but how strongly it holds is debated. A well-known form is 'variability selection', proposed by Rick Potts (1998): selection favouring versatility under unstable environments. Fine-scale climate records and their match to fossil events are still being tested and sometimes challenged."}, "sources": ["src:14c43ba99c"], "flags": ["contested", "editor-note"]}], "links": [{"to": "tabar:brain-body-size-climate", "rel": "see-also", "note": {"fa": "مغز، اندازهٔ بدن و اقلیم", "en": "Brain, body size and climate", "nl": "Brain, body size and climate"}}, {"to": "tabar:ochre-middle-stone-age", "rel": "see-also", "note": {"fa": "اخرا و عصر سنگ میانی", "en": "Ochre and the Middle Stone Age", "nl": "Ochre and the Middle Stone Age"}}, {"to": "tabar:out-of-africa", "rel": "see-also", "note": {"fa": "خاستگاه آفریقایی انسان خردمند", "en": "The African origin of Homo sapiens", "nl": "The African origin of Homo sapiens"}}], "people": ["core:richard-rick-potts"], "sources": ["src:14c43ba99c", "src:a85b75e91c"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:human-traits-gradual-mosaic", "kind": "concept", "title": {"fa": "ویژگی‌های انسانی یک‌جا پدید نیامدند", "en": "Human traits did not arise all at once", "nl": "Menselijke kenmerken ontstonden niet ineens"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "بر پایهٔ پیام‌های کلیدی برنامهٔ خاستگاه انسان در اسمیتسونین، ویژگی‌های ویژهٔ گونهٔ ما، مثل راه رفتن راست، مغز بزرگ و رفتار اجتماعی پیچیده، در گذر زمان و گام‌به‌گام روی هم انباشته شده‌اند. این ویژگی‌ها از ویژگی‌های نخستی‌های خویشاوند ما ریشه می‌گیرند و هر سازگاری هزینه‌ای هم داشته است.", "en": "According to the Smithsonian Human Origins Program's key messages, the distinctive features of our species, such as upright walking, large brains and elaborate social behaviour, built up step by step over time. They grow out of traits shared with our primate relatives, and every adaptation carried a cost.", "nl": "Volgens de kernboodschappen van het Smithsonian Human Origins Program zijn de kenmerken van onze soort, zoals rechtop lopen, grote hersenen en complex sociaal gedrag, stap voor stap opgebouwd uit eigenschappen die we met andere primaten delen."}, "points": [{"text": {"fa": "ویژگی‌هایی که امروز انسان را از دیگر جانوران جدا می‌کنند، مثل راه رفتن روی دو پا، کارکرد مغز، ساخت ابزار و زندگی اجتماعی پیچیده، با هم و ناگهانی ظاهر نشدند. شواهد فسیلی و باستان‌شناختی نشان می‌دهد هر کدام در زمان خودش و به‌تدریج شکل گرفته است.", "en": "The features that now set humans apart, such as walking on two legs, how the brain works, toolmaking and elaborate social life, did not appear together or suddenly. Fossil and archaeological evidence points to each emerging in its own time and gradually.", "nl": "The features that now set humans apart, such as walking on two legs, how the brain works, toolmaking and elaborate social life, did not appear together or suddenly. Fossil and archaeological evidence points to each emerging in its own time and gradually."}, "sources": ["src:a85b75e91c"], "flags": []}, {"text": {"fa": "سازگاری‌ها سود و زیان با هم دارند. برای نمونه، راست‌قامتی راه رفتن را ارزان‌تر کرد و دست‌ها را آزاد گذاشت، اما فشار تازه‌ای به ستون فقرات و زایمان آورد؛ مغز بزرگ هم انرژی بسیار می‌خواهد. این «سود در برابر هزینه» از نشانه‌های بنیادین تکامل شمرده می‌شود.", "en": "Adaptations bring benefits and costs together. Upright posture, for example, made walking cheaper and freed the hands but added strain on the spine and on childbirth; a big brain demands a lot of energy. This trade-off is presented as a hallmark of evolution.", "nl": "Adaptations bring benefits and costs together. Upright posture, for example, made walking cheaper and freed the hands but added strain on the spine and on childbirth; a big brain demands a lot of energy. This trade-off is presented as a hallmark of evolution."}, "sources": ["src:a85b75e91c"], "flags": []}, {"text": {"fa": "ویژگی‌های انسانی از هیچ پدید نیامده‌اند. میان ما و نخستی‌های زنده (مثل شامپانزه‌ها) پیوستگی هست: رفتارهایی مانند ابزارسازی ساده و روابط اجتماعی در خویشاوندان ما نیز دیده می‌شود، و تغییر از حالت «میمون‌مانند» به «انسان‌مانند» تدریجی بوده است.", "en": "Human traits did not come from nothing. There is continuity with living primates such as chimpanzees: simple toolmaking and rich social relations occur in our relatives too, and the shift from more ape-like to more human-like states was gradual.", "nl": "Human traits did not come from nothing. There is continuity with living primates such as chimpanzees: simple toolmaking and rich social relations occur in our relatives too, and the shift from more ape-like to more human-like states was gradual."}, "sources": ["src:a85b75e91c"], "flags": []}, {"text": {"fa": "«گام‌به‌گام» به این معنا نیست که سرعت تغییر همیشه یکسان بوده یا ویژگی‌ها پشت سر هم و در یک خط صاف رسیده‌اند. پژوهشگران امروز از «تکامل موزاییکی» سخن می‌گویند: بخش‌های مختلف بدن و مغز در گونه‌های مختلف با آهنگ‌های گوناگون تغییر کرده‌اند. این سند آموزشی کوتاه است و به این جزئیات نمی‌پردازد.", "en": "\"Step by step\" does not mean a constant rate or a single straight line. Researchers now speak of mosaic evolution: different body and brain parts changed at different paces in different species. This short educational handout does not go into that detail.", "nl": "\"Step by step\" does not mean a constant rate or a single straight line. Researchers now speak of mosaic evolution: different body and brain parts changed at different paces in different species. This short educational handout does not go into that detail."}, "sources": [], "flags": ["editor-note"]}], "links": [{"to": "tabar:human-evolution", "rel": "part-of", "note": {"fa": "تکامل انسان", "en": "Human evolution field", "nl": "Human evolution field"}}, {"to": "tabar:social-brain-evolution", "rel": "see-also", "note": {"fa": "چرا مغز اجتماعی شدیم", "en": "Why our brains went social", "nl": "Why our brains went social"}}, {"to": "psy:brain-mosaic", "rel": "see-also", "note": {"fa": "مغز موزاییکی", "en": "The mosaic brain", "nl": "The mosaic brain"}}, {"to": "tabar:mutation-selection-drift", "rel": "see-also", "note": {"fa": "جهش، انتخاب و رانش", "en": "Mutation, selection and drift", "nl": "Mutation, selection and drift"}}], "people": [], "sources": ["src:a85b75e91c"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:quaternary-climate-frameworks-dating", "kind": "concept", "title": {"fa": "چارچوب‌های اقلیمی کواترنری برای تاریخ‌گذاری پارینه‌سنگی", "en": "Quaternary climate frameworks for dating the Palaeolithic", "nl": "Kwartaire klimaatkaders voor de datering van het Paleolithicum"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "فصل ۲ نشان می‌دهد برای باستان‌شناسی پارینه‌سنگی، تغییرات اقلیم نخست یک چارچوب نسبی می‌دهد و روش‌های کمّی بعداً به آن تاریخ مطلق می‌افزایند. آیتکن دوره‌های یخچالی و میان‌یخچالی را با نام‌های منطقه‌ای معرفی می‌کند و هشدار می‌دهد تطبیق آنها بین مناطق دشوار است.", "en": "Chapter 2 shows that for Palaeolithic archaeology climatic change first supplies a relative framework, to which quantitative methods later add absolute dates. Aitken introduces glacial and interglacial stages under regional names and warns that correlating them between regions is difficult.", "nl": "Hoofdstuk 2 laat zien dat klimaatverandering voor het Paleolithicum eerst een relatief kader geeft, waaraan kwantitatieve methoden later absolute data toevoegen. Correlatie tussen regio's blijft lastig."}, "points": [{"text": {"fa": "کواترنری تقریباً دو میلیون سال اخیر است. پلیستوسن نخستین دورهٔ (عصر) آن است و پس از پلیوسن می‌آید؛ آغازش در فسیل‌ها با گذار ناگهانی از شرایط گرم به سرد دیده می‌شود، هرچند نشانه‌هایی از یخبندان در اواخر پلیوسن هم هست. دورهٔ کنونی، هولوسن، حدود ۱۰٬۰۰۰ سال پیش با پایان آخرین یخبندان آغاز شد.", "en": "The Quaternary is roughly the last 2 million years; the Pleistocene is its first epoch after the Pliocene, marked in the fossil record by an abrupt shift from warm to cold, though there is also evidence of late-Pliocene glaciation. The Holocene began about 10,000 years ago with the end of the last glaciation.", "nl": "The Quaternary is roughly the last 2 million years; the Pleistocene is its first epoch after the Pliocene, marked in the fossil record by an abrupt shift from warm to cold, though there is also evidence of late-Pliocene glaciation. The Holocene began about 10,000 years ago with the end of the last glaciation."}, "sources": ["src:97dc27875f"], "flags": []}, {"text": {"fa": "آیتکن «ساعت‌های اقلیمی» را راه‌های طبیعی زمان‌سنجی می‌نامد، در برابر ساعت‌های آزمایشگاهی. برای پارینه‌سنگی، تغییر اقلیم چارچوب می‌دهد و تاریخ دقیق را روش‌های کمّی می‌افزایند. نزدیک‌تر به امروز، حلقه‌های سالانهٔ درخت و لایه‌های سالانهٔ رسوب دریاچه‌های یخچالی برای کالیبره‌کردن مقیاس رادیوکربن بسیار مهم بوده‌اند.", "en": "Aitken calls climatic 'clocks' natural ways of telling time, as opposed to laboratory instruments. For the Palaeolithic, climate gives the framework and quantitative techniques add the dates; closer to the present, annual tree rings and annual glacial-lake sediment layers have been vital for calibrating the radiocarbon scale.", "nl": "Aitken calls climatic 'clocks' natural ways of telling time, as opposed to laboratory instruments. For the Palaeolithic, climate gives the framework and quantitative techniques add the dates; closer to the present, annual tree rings and annual glacial-lake sediment layers have been vital for calibrating the radiocarbon scale."}, "sources": ["src:97dc27875f"], "flags": []}, {"text": {"fa": "شواهد قدیمی‌تر یخچالی (تخته‌سنگ‌های جابه‌جاشده، خراش روی سنگ‌ها، ساحل‌های بالاآمده و رسوب‌های یخچالی) به چهار یخبندان بزرگ در آلپ انجامید: گونتس، میندل، ریس و وورم (که جدیدترین است). در آمریکای شمالی نام‌ها نبراسکان، کانزان، ایلینوین و ویسکانسین و در چین پویانگ، دا گو، لوشان و دالی بود. میان یخبندان‌ها دوره‌های گرم «میان‌یخچالی» و درون هر یخبندان دوره‌های گرم کوتاه «میان‌سردیک» (interstadial) آمده است.", "en": "Older glacial evidence (erratic boulders, scratch marks, raised beaches, glacial drift) led to four major Alpine ice ages: Günz, Mindel, Riss and Würm (the latest); North America used Nebraskan, Kansan, Illinoian, Wisconsinan and China Poyang, Da Gu, Lushan and Dali. Warm interglacials lie between glacials, and short warm interstadials lie within them.", "nl": "Older glacial evidence (erratic boulders, scratch marks, raised beaches, glacial drift) led to four major Alpine ice ages: Günz, Mindel, Riss and Würm (the latest); North America used Nebraskan, Kansan, Illinoian, Wisconsinan and China Poyang, Da Gu, Lushan and Dali. Warm interglacials lie between glacials, and short warm interstadials lie within them."}, "sources": ["src:97dc27875f"], "flags": []}, {"text": {"fa": "به گفتهٔ آیتکن، این چارچوب امروز بسیار پیچیده‌تر از چهار یخبندان است و انتقال آن از آلپ به مناطق دیگر مشکل دارد: ثبت رسوبی ناپیوسته است، بعضی مراحل در یک منطقه به‌کلی نیستند، و آنچه در یک جا میان‌یخچالی شمرده می‌شود ممکن است جای دیگر فقط میان‌سردیک باشد. هرچه به گذشته‌تر برویم همخوانی مناطق نامطمئن‌تر می‌شود. نام‌های فرهنگی (آشولی، موستری، اوریناسی و غیره) هم از جایگاه‌های اروپایی آمده‌اند و در جاهای دیگر برای مجموعه‌های مشابه به کار می‌روند.", "en": "Aitken says the framework is now much more complex than four glacials and its transfer beyond the Alps is problematic: the sedimentary record is discontinuous, phases may be missing in a region, and what is an interglacial in one place may be only an interstadial elsewhere; correlation grows less certain further back. Cultural labels (Acheulean, Mousterian, Aurignacian, etc.) derive from European sites but are used for similar assemblages elsewhere.", "nl": "Aitken says the framework is now much more complex than four glacials and its transfer beyond the Alps is problematic: the sedimentary record is discontinuous, phases may be missing in a region, and what is an interglacial in one place may be only an interstadial elsewhere; correlation grows less certain further back. Cultural labels (Acheulean, Mousterian, Aurignacian, etc.) derive from European sites but are used for similar assemblages elsewhere."}, "sources": ["src:97dc27875f"], "flags": ["contested"]}, {"text": {"fa": "یادداشت ویراستار: مدل چهار یخبندان آلپی با ثبت‌های ایزوتوپ اکسیژن در رسوب‌های دریا و نظریهٔ میلانکوویچ تقریباً کنار گذاشته شده و به‌جای آن چرخه‌های یخبندان بسیار بیشتری (مرحله‌های ایزوتوپی دریایی) به کار می‌رود. فهرست مطالب کتاب نشان می‌دهد فصل ۲ همین موضوع‌ها را دارد، اما متن آن بخش‌ها (ایزوتوپ اکسیژن، میلانکوویچ، گرده‌شناسی، لایه‌های سالانهٔ رسوب، دندروکرونولوژی) در پیش‌نمایش نیست.", "en": "Editor's note: the four-glacial Alpine model has largely been replaced by marine oxygen-isotope records and Milankovitch theory, which show many more glacial cycles (marine isotope stages). The book's contents list shows chapter 2 covers these topics (oxygen isotopes, Milankovitch, pollen, varves, dendrochronology), but the text of those sections is not in the preview.", "nl": "Editor's note: the four-glacial Alpine model has largely been replaced by marine oxygen-isotope records and Milankovitch theory, which show many more glacial cycles (marine isotope stages). The book's contents list shows chapter 2 covers these topics (oxygen isotopes, Milankovitch, pollen, varves, dendrochronology), but the text of those sections is not in the preview."}, "sources": [], "flags": ["editor-note"]}], "links": [{"to": "tabar:brain-body-size-climate", "rel": "see-also", "note": {"fa": "اقلیم و اندازهٔ مغز و بدن", "en": "Climate and brain/body size", "nl": "Climate and brain/body size"}}, {"to": "phil:science-based-dating-basic-principles", "rel": "part-of", "note": {"fa": "زمان‌سنجی علمی در باستان‌شناسی: اصول", "en": "Science-based dating in archaeology: principles", "nl": "Science-based dating in archaeology: principles"}}, {"to": "tabar:human-evolution", "rel": "see-also", "note": {"fa": "تکامل انسان (حوزهٔ کلی)", "en": "Human evolution (field overview)", "nl": "Human evolution (field overview)"}}], "people": [], "sources": ["src:97dc27875f"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:darwin-domestic-variation", "kind": "concept", "title": {"fa": "دگرگونی در اهلی‌سازی و گزینش مصنوعی نزد داروین", "en": "Variation under domestication and artificial selection in Darwin", "nl": "Variatie onder domesticatie en kunstmatige selectie bij Darwin"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "داروین کتاب را از پرورش‌دهندگان کبوتر، سگ و گیاه شروع می‌کند، چون نشان می‌دهد در مدت کوتاه و با انتخاب آدمی می‌توان از یک نیای مشترک نژادهای بسیار متفاوت ساخت. این «نمونهٔ کوچک‌شدهٔ» انتخاب، پایهٔ قیاس او برای طبیعت است. دربارهٔ علت دگرگونی‌ها خودش اعتراف می‌کند که چیز زیادی نمی‌داند.", "en": "Darwin opens with pigeon, dog and plant breeders because they show that, in a short time, human choice can turn one ancestral stock into strikingly different breeds. This miniature of selection is the base of his analogy for nature. About the causes of variation he openly admits deep ignorance.", "nl": "Darwin begint bij duiven-, honden- en plantenkwekers: in korte tijd kan menselijke keuze uit één voorouder zeer verschillende rassen maken. Dit is de basis van zijn analogie met de natuur; over de oorzaken van variatie bekent hij grote onwetendheid."}, "points": [{"text": {"fa": "داروین می‌گوید گونه‌های اهلی، مثل کبوترهای تزئینی با ظاهرهای بسیار گوناگون، همه از یک نیای وحشی (کبوتر صخره‌ای) آمده‌اند. تفاوت‌های بزرگ از تفاوت‌های کوچکِ روی‌هم‌انباشته ساخته شده، نه از جهش‌های ناگهانی.", "en": "He argues that domestic forms such as fancy pigeons, however different, all descend from one wild ancestor (the rock pigeon). Large differences are built from many small differences piling up, not from sudden leaps.", "nl": "He argues that domestic forms such as fancy pigeons, however different, all descend from one wild ancestor (the rock pigeon). Large differences are built from many small differences piling up, not from sudden leaps."}, "sources": ["src:84786f7bfa"], "flags": []}, {"text": {"fa": "او دو نوع گزینش را از هم جدا می‌کند: گزینش روشمند (پرورش‌دهنده آگاهانه گزینه‌ای را می‌خواهد) و گزینش ناخودآگاه (فقط بهترین‌ها را نگه می‌دارد و نتیجه آرام‌آرام می‌آید). دومی به رفتار طبیعت بسیار نزدیک‌تر است.", "en": "He separates methodical selection (the breeder deliberately aims at a goal) from unconscious selection (simply keeping the best animals, with change arriving slowly). The second is much closer to what nature does.", "nl": "He separates methodical selection (the breeder deliberately aims at a goal) from unconscious selection (simply keeping the best animals, with change arriving slowly). The second is much closer to what nature does."}, "sources": ["src:84786f7bfa"], "flags": []}, {"text": {"fa": "داروین می‌پذیرد که قانون‌های وراثت و علت پیدایش دگرگونی‌ها برایش «ناشناخته» است. او به اثر محیط، عادت و استفاده/ناستفاده ــ و به همبستگی رشد (تغییر یک عضو با تغییر عضو دیگر) ــ اشاره می‌کند، اما درباره مکانیزم دقیق نمی‌تواند چیزی بگوید.", "en": "Darwin concedes that the laws of inheritance and the causes of new variation are unknown to him. He points to conditions of life, habit, use and disuse, and correlated growth (one organ changing along with another), but cannot give the exact mechanism.", "nl": "Darwin concedes that the laws of inheritance and the causes of new variation are unknown to him. He points to conditions of life, habit, use and disuse, and correlated growth (one organ changing along with another), but cannot give the exact mechanism."}, "sources": ["src:84786f7bfa"], "flags": ["dated"]}, {"text": {"fa": "نکتهٔ علمیِ امروز: استدلال گزینش مصنوعی همچنان درست است و آزمایش‌های جدید (مثلاً اهلی‌سازی روباه نقره‌ای در روسیه و ژنوم سگ و کبوتر) آن را تأیید کرده‌اند. ولی «علتِ» تنوع اکنون روشن است: جهش‌های تصادفی در دی‌ان‌ای و بازترکیب ژن‌ها، نه اثر مستقیم عادت یا محیط بر ویژگی‌های ارثی.", "en": "Modern note: the artificial-selection argument still holds and has been confirmed by newer work (for example the Russian silver-fox domestication experiment and pigeon and dog genomes). The cause of variation is now clear: random mutation in DNA and gene recombination, not direct inheritance of habit or environment.", "nl": "Modern note: the artificial-selection argument still holds and has been confirmed by newer work (for example the Russian silver-fox domestication experiment and pigeon and dog genomes). The cause of variation is now clear: random mutation in DNA and gene recombination, not direct inheritance of habit or environment."}, "sources": ["src:7f2346c4be"], "flags": ["editor-note"]}], "links": [{"to": "tabar:mutation-selection-drift", "rel": "see-also", "note": {"fa": "جهش، انتخاب و رانش (علت امروزیِ تنوع)", "en": "Mutation, selection and drift (the modern cause of variation)", "nl": "Mutation, selection and drift (the modern cause of variation)"}}, {"to": "tabar:human-evolution", "rel": "part-of", "note": {"fa": "تکامل انسان", "en": "Human evolution", "nl": "Human evolution"}}, {"to": "tabar:heritability", "rel": "see-also", "note": {"fa": "وراثت‌پذیری", "en": "Heritability", "nl": "Heritability"}}], "people": ["core:charles-darwin"], "sources": ["src:7f2346c4be", "src:84786f7bfa"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:neanderthal-genes-in-us-gifts-and-costs", "kind": "concept", "title": {"fa": "ژن‌های نئاندرتالی در ما: هدیه‌ها، هزینه‌ها و بازنگری در مفهوم «گونه»", "en": "Neanderthal genes in us: gifts, costs and rethinking 'species'", "nl": "Neanderthalergenen in ons: geschenken, kosten en een herziening van 'soort'"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "نئاندرتال‌ها به‌طور کامل ناپدید نشدند؛ بخشی از آن‌ها در خزانهٔ ژنتیکی انسان خردمند «حل شد». «خداحافظ آفریقا» توضیح می‌دهد که آمیزش چگونه رخ داد، چرا دورگه‌ها بیشتر به جمعیت خردمند پیوستند، و چه ژن‌هایی از نئاندرتال‌ها به ما رسیده است: برخی سودمند (پوست ضخیم‌تر برای سرما)، برخی دوپهلو (آسیب‌پذیری بیشتر در برابر کووید-۱۹ در کنار محافظت در برابر HIV) و برخی با هزینه‌های امروزی (حساسیت‌ها و برخی استعدادها). برنامه با تأکید هشدار می‌دهد که درصد DNA نئاندرتالیِ هیچ‌کس هیچ برتری‌ای به او نمی‌دهد و نباید دستاویز نژادپرستی شود، و نتیجه می‌گیرد که شاید ما و نئاندرتال‌ها دو زیرگونه بودیم، نه دو گونه.", "en": "Neanderthals did not vanish entirely; part of them 'dissolved' into the Homo sapiens gene pool. The programme explains how interbreeding happened, why hybrids mostly joined sapiens populations, and which Neanderthal genes reached us: some useful (thicker skin for cold), some double-edged (greater COVID-19 vulnerability alongside protection against HIV) and some with modern costs (allergies and certain predispositions). It stresses that nobody's percentage of Neanderthal DNA confers any superiority and must never feed racism, and concludes that we and Neanderthals may have been two subspecies, not two species.", "nl": "Neanderthalers verdwenen niet helemaal; een deel 'loste op' in de genenpoel van sapiens. Het programma legt uit hoe kruising verliep en welke genen ons bereikten: nuttige (dikkere huid tegen kou), tweesnijdende (meer COVID-risico, minder HIV-risico) en kostbare (allergieën). Niemands percentage Neanderthaler-DNA geeft enige superioriteit. Misschien waren we twee ondersoorten, geen twee soorten."}, "points": [{"text": {"fa": "انقراض شتاب‌گرفته: به گفتهٔ برنامه، وقتی انسان خردمندِ خردمند رسید، نئاندرتال‌ها در گروه‌هایی کوچک و دور از هم و به سختی زندگی می‌کردند؛ گوینده گمان می‌کند حتی بی‌حضور ما هم چند هزار سال بعد منقرض می‌شدند، اما حضور ما این انقراض را بسیار شتاب داد. پرسش این است: آیا آن‌ها صرفاً ناپدید شدند؟ پیش از ۲۰۱۰ پاسخ «آری، بی‌هیچ ردی در ژنوم ما» بود؛ امروز می‌دانیم بخشی از آن‌ها در ما مانده است.", "en": "An accelerated extinction: when Homo sapiens sapiens arrived, Neanderthals lived in small, scattered, struggling groups; the speaker thinks they might have died out within a few thousand years anyway, but our arrival sped it up greatly. Did they simply vanish? Before 2010 the answer was 'yes, leaving no trace in our genome'; today we know part of them remains in us.", "nl": "Een versneld uitsterven: Neanderthalers leefden in kleine, verspreide groepen; wij versnelden hun einde. Vóór 2010 dacht men dat ze geen spoor in ons genoom lieten; nu weten we beter."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "چقدر و کجا؟ به گفتهٔ برنامه، انسان‌های امروز بین ۱ تا ۴ درصد ژن نئاندرتالی دارند، به صورت تکه‌های کوچک و پراکنده در هر کروموزوم؛ و با کنار هم گذاشتن این تکه‌ها از مردم گوناگون، تاکنون حدود ۴۰ درصد ژنوم نئاندرتال بازیابی شده است. میزان آن در جمعیت‌ها متفاوت است: کمترین در مردم جنوب صحرای آفریقا؛ در شمال آفریقا و اروپا هست؛ و به گفتهٔ برنامه بیشترینش در جنوب و جنوب‌شرق آسیا — که برای پژوهشگران شگفت‌آور بود، چون انتظار داشتند جنوب‌غرب آسیا و اروپا، که نئاندرتال‌ها در آن‌ها می‌زیستند، بیشترین سهم را داشته باشند.", "en": "How much and where? The programme says living humans carry 1–4% Neanderthal DNA in small, scattered pieces on every chromosome; pooling these pieces across people has recovered about 40% of the Neanderthal genome. Levels vary: lowest in sub-Saharan Africans, present in North Africans and Europeans, and — the programme says — highest in South and Southeast Asia, which surprised researchers who expected SW Asia and Europe, the Neanderthal homeland, to lead.", "nl": "Hoeveel en waar? 1–4% volgens het programma, in kleine stukjes; samen is ~40% van het Neanderthalergenoom teruggevonden. Het minst in Afrika ten zuiden van de Sahara."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "آمیزش چگونه رخ داد؟ تبادل ژنتیکی یعنی رابطه‌ای میان یک انسان خردمند (مرد یا زن) و یک نئاندرتال برقرار شد و فرزندی بارور به دنیا آمد که خودش با نوع خود، با انسان‌های خردمند یا نئاندرتال‌های پیرامون فرزند آورد — تا به ما رسید. برنامه احتیاط می‌کند که واژهٔ «ازدواج» را با کلیشه‌های امروزی برای آن‌ها به کار نبرد. چون جمعیت نئاندرتال‌ها در زمان رویارویی بسیار کوچک شده بود، دورگه‌ها شانس بیشتری داشتند که با انسان‌های خردمند فرزند بیاورند تا با نئاندرتال‌ها؛ پس نئاندرتال‌ها با آناتومی ویژه‌شان حدود ۳۵ تا ۴۰ هزار سال پیش از میان رفتند، اما ردی کم‌رنگ در ما گذاشتند. این آمیزش دست‌کم دو تا سه بار و در جاهای گوناگون رخ داده: جنوب‌غرب آسیا، سیبری و اروپای شرقی.", "en": "How did interbreeding happen? A relationship formed between a sapiens man or woman and a Neanderthal, producing a fertile child who in turn had children with its own kind, with sapiens or with Neanderthals — down to us. The programme avoids projecting modern ideas of 'marriage'. Because Neanderthal populations had shrunk by then, hybrids were more likely to breed with sapiens than with Neanderthals; Neanderthals with their distinctive anatomy disappeared around 35–40 ka but left a faint trace in us. Admixture happened at least two or three times in different places: SW Asia, Siberia and eastern Europe.", "nl": "Hoe ging het? Een relatie tussen een sapiens en een Neanderthaler gaf een vruchtbaar kind. Omdat Neanderthalers weinig in aantal waren, sloten hybriden zich vooral bij sapiens aan. Minstens twee à drie keer: in Zuidwest-Azië, Siberië en Oost-Europa."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "هدیه: پوست ضخیم‌تر. نیاکان سیاه‌پوستِ ما که از آفریقا بیرون آمدند، با اقلیم شرق آفریقا سازگار بودند و ضخامت پوستِ لازم برای عرض‌های شمالی سرد را نداشتند. دو راه داشتند: صبر کنند تا انتخاب طبیعی جهش‌های تازه را برگزیند، یا «تقلب» کنند و ژن را از نئاندرتال‌ها بگیرند — و دومی رخ داد: ژن‌هایی که در انباشت کراتین در پوست و ضخیم‌تر شدن آن نقش دارند، از نئاندرتال‌ها به ما رسیده است.", "en": "A gift: thicker skin. Our dark-skinned ancestors who left Africa were adapted to East African climates and lacked the skin thickness useful at cold northern latitudes. They could wait for selection to favour new mutations, or 'cheat' and take the genes from Neanderthals — and the latter happened: genes involved in keratin accumulation and thicker skin reached us from Neanderthals.", "nl": "Een geschenk: dikkere huid. Genen voor keratine en een dikkere huid, nuttig in koude streken, kregen we van Neanderthalers."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "شمشیر دولبه: کووید و HIV. پژوهش‌ها نشان داده یک بخش ژنتیکیِ به‌ارث‌رسیده از نئاندرتال‌ها، در کسانی که آن را دارند، خطر بستری‌شدن بر اثر کووید-۱۹ را حدود دو برابر می‌کند و خطر مرگ را هم بالا می‌برد. چرا مانده است؟ پژوهش بعدی نشان داد همین بخش با تولید کمترِ گیرندهٔ مورد استفادهٔ ویروس HIV روی سطح سلول و در نتیجه محافظت بیشتر در برابر HIV همراه است. انتخاب طبیعی میان یک سود و یک زیان «مچ انداخته» و سود پیروز شده است.", "en": "A double-edged sword: COVID and HIV. Studies show a Neanderthal-derived genetic segment roughly doubles the risk of hospitalisation from COVID-19 and raises the risk of death. Why has it persisted? Later research found the same segment is associated with fewer cell-surface receptors used by HIV, and so more protection against HIV. Selection 'arm-wrestled' a benefit against a cost, and the benefit won.", "nl": "Tweesnijdend: hetzelfde Neanderthaler-segment verdubbelt ongeveer het risico op ziekenhuisopname bij COVID-19, maar beschermt tegen HIV."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "بارداری: به گفتهٔ برنامه، ژنی از نئاندرتال‌ها به ما رسیده که از یک سو احتمال سقط جنین را بسیار کاهش می‌دهد و از سوی دیگر با زودرس‌تر به دنیا آمدن نوزاد همراه است. برای نئاندرتال‌ها با جمجمهٔ کشیده و مغز بزرگ، زایمانِ کمی زودتر می‌توانست جان نوزاد و مادر را با هم نجات دهد؛ برای ما — به‌ویژه بیست هزار سال پیش — نوزادِ نارس دشواری‌ای جدی بود، اما کاهش سقط این را جبران می‌کرد. باز انتخاب طبیعی میان خوب و بد ترازو کرده است.", "en": "Pregnancy: according to the programme, a Neanderthal-derived gene greatly lowers the chance of miscarriage but is linked to earlier birth. For Neanderthals with long skulls and large brains, slightly earlier birth could save both baby and mother; for us — especially 20,000 years ago — a premature baby was a serious problem, offset by fewer miscarriages. Again selection weighed good against bad.", "nl": "Zwangerschap: een Neanderthalergen verlaagt de kans op miskraam sterk, maar zou samenhangen met vroegere geboorte."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "هزینه‌های امروزی: برنامه چند پیوند دیگر را برمی‌شمارد: رنگ موی قرمز (که برخی به نئاندرتال‌ها نسبت داده‌اند)، استعداد ژنتیکی بیشتر برای افسردگی (افسردگی پدیده‌ای پیچیده است و فقط عوامل محیطی در آن دخیل نیستند)، تاب‌آوری کمتر در برابر مواد مخدر و الکل در کسانی که برخی ژن‌های نئاندرتالی را بیشتر دارند، و حساسیت‌ها (آلرژی): سامانهٔ ایمنی هشدار بیماری می‌دهد — آبریزش بینی، خارش گلو، عطسه — در حالی که فرد بیمار نیست. به تعبیر گوینده، این «نرم‌افزار ژنتیکی» در نئاندرتال خوب کار می‌کرد، اما روی «سیستم‌عاملِ» انسان خردمند گاهی «باگ» می‌دهد چون هنوز کاملاً هم‌ساز نشده است.", "en": "Modern costs: the programme lists further links: red hair (attributed by some to Neanderthals), a higher genetic predisposition to depression (a complex condition not caused by environment alone), lower resilience to drugs and alcohol among carriers of some Neanderthal variants, and allergies — the immune system sounds a false alarm (runny nose, itchy throat, sneezing) when there is no illness. In the speaker's image, this 'genetic software' worked well in Neanderthals but sometimes 'bugs out' on the sapiens 'operating system' because it is not fully compatible yet.", "nl": "Moderne kosten: rood haar (soms toegeschreven aan Neanderthalers), aanleg voor depressie, minder weerbaarheid tegen drugs en alcohol, en allergieën. 'Software die op het sapiens-besturingssysteem soms een bug geeft.'"}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "نه دستاویز نژادپرستی: برنامه صریح هشدار می‌دهد: داشتن یا نداشتن ژن نئاندرتالی، یا اینکه کسی ۱ درصد داشته باشد یا ۴ درصد، هیچ برتری ویژه‌ای برای ما به‌عنوان انسان خردمند به ارمغان نمی‌آورد. برخی از این ژن‌ها به سود ما کار کرده‌اند و برخی در شرایط امروز کار خاصی برایمان نمی‌کنند. نباید با نگاهی نژادپرستانه به این داستان نگریست.", "en": "Not a pretext for racism: the programme warns plainly that having or lacking Neanderthal genes, or having 1% rather than 4%, confers no special advantage on anyone as a human being. Some of these genes helped us; others do nothing special in today's conditions. The story must not be read through a racist lens.", "nl": "Geen voorwendsel voor racisme: 1% of 4% Neanderthaler-DNA geeft niemand enig voordeel. Het verhaal mag niet racistisch gelezen worden."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "دو گونه یا دو زیرگونه؟ برنامه به تعریف «گونه» بازمی‌گردد: گروهی از جانداران که شبیه هم‌اند، با هم زادوولد می‌کنند و فرزندان زایا می‌آورند (مثل زرافه، گوریل، شامپانزه، سگ). پیش از ۲۰۱۰، ما (هومو ساپینس) و آن‌ها (هومو نئاندرتالنسیس) را دو گونه می‌دانستند. اما اکنون که می‌دانیم فرزندان زایا آوردیم و ژن‌هایشان هنوز در ماست، باید در این تعریف بازنگری کرد: شاید ما و نئاندرتال‌ها در حد دو زیرگونه از هم فاصله داشتیم. برخی دانشمندان پیشنهاد می‌کنند ما را «انسان خردمندِ خردمند» و آن‌ها را «انسان خردمندِ نئاندرتال» بنامیم.", "en": "Two species or two subspecies? The programme returns to the definition of species: organisms that resemble each other, interbreed and produce fertile offspring (giraffe, gorilla, chimpanzee, dog). Before 2010 we (Homo sapiens) and they (Homo neanderthalensis) were treated as two species. Now that we know we had fertile offspring whose genes we still carry, the definition needs rethinking: perhaps we were only as far apart as two subspecies. Some propose calling us Homo sapiens sapiens and them Homo sapiens neanderthalensis.", "nl": "Twee soorten of twee ondersoorten? Omdat we vruchtbare nakomelingen kregen, waren we misschien twee ondersoorten: Homo sapiens sapiens en Homo sapiens neanderthalensis."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "نقد و تصحیح: (۱) سهم DNA نئاندرتالی در غیرآفریقایی‌ها معمولاً حدود ۱٫۵ تا ۲٫۵ درصد برآورد می‌شود؛ «۴ درصد» برآوردی قدیمی‌تر است. بیشترین سهم در شرق آسیا (نه دقیقاً جنوب و جنوب‌شرق آسیا) گزارش شده و دلیلش احتمالاً پاک‌سازی ضعیف‌تر با انتخاب طبیعی، آمیزش‌های بیشتر یا رقیق‌شدن سهم در غرب اوراسیا با تبار «اوراسیایی پایه» است. آفریقایی‌ها هم اندکی DNA نئاندرتالی دارند، از راه بازگشت مهاجران به آفریقا. (۲) یافتهٔ کووید و HIV از زبرگ و پابو (۲۰۲۰، ۲۰۲۴) است. (۳) پیوند ژن گیرندهٔ پروژسترون نئاندرتالی با کاهش سقط و خونریزیِ بارداری گزارش شده؛ پیوندش با زایمان زودرس روشن نیست. (۴) ادعای «موی قرمز از نئاندرتال» رد شده است: نسخهٔ MC1R نئاندرتال‌ها با نسخه‌های رایجِ موی قرمز در انسان امروز فرق دارد و به ما نرسیده است. (۵) پیوندها با افسردگی و اعتیاد (سیمونتی و همکاران، ۲۰۱۶) اثرهایی کوچک و آماری‌اند، نه سرنوشت فردی. (۶) گذار از «دو گونه» به «دو زیرگونه» دیدگاهی است نه اجماع؛ آمیزش میان گونه‌های نزدیک در طبیعت (مثلاً گرگ و کایوت) رایج است و مفهوم زیستیِ گونه در انسان‌شناسی دیرینه کاربرد محدودی دارد.", "en": "Critique and correction: (1) Neanderthal ancestry outside Africa is usually estimated at ~1.5–2.5%; '4%' is an older figure. The highest share is reported in East Asia (not exactly South/Southeast Asia), probably due to weaker purifying selection, additional admixture or dilution in western Eurasia by 'Basal Eurasian' ancestry. Africans also carry a little Neanderthal DNA via back-migration. (2) The COVID and HIV findings are from Zeberg & Pääbo (2020, 2024). (3) A Neanderthal progesterone-receptor variant is linked to fewer miscarriages and less bleeding in pregnancy; a link to preterm birth is unclear. (4) The 'red hair from Neanderthals' claim has been refuted: the Neanderthal MC1R variant differs from those causing red hair today and did not pass to us. (5) Associations with depression and addiction (Simonti et al. 2016) are small statistical effects, not individual destiny. (6) Moving from 'two species' to 'two subspecies' is a view, not a consensus; hybridisation between close species is common (wolves and coyotes), and the biological species concept has limited use in palaeoanthropology.", "nl": "Kritiek: (1) Gangbaar is ~1,5–2,5%; het hoogst in Oost-Azië; ook Afrikanen dragen wat. (2) COVID/HIV: Zeberg & Pääbo. (3) Progesteronreceptor: minder miskramen; vroeggeboorte onduidelijk. (4) 'Rood haar van Neanderthalers' is weerlegd. (5) Depressie/verslaving: kleine statistische effecten. (6) 'Ondersoorten' is een standpunt, geen consensus."}, "sources": ["src:60e7838a5a"], "flags": ["editor-note", "contested"]}, {"text": {"fa": "یادداشت خوانش: بر پایهٔ رونوشت خودکار یکی از اپیزودهای نسخهٔ پادکستیِ «خداحافظ آفریقا» (پیش از اپیزود هشتم؛ شمارهٔ آن در رونوشت نیامده). آغاز رونوشت تکرار ماشینی است و چند جملهٔ نخست اپیزود از دست رفته است.", "en": "Reading note: based on the automatic transcript of a podcast episode preceding episode 8 (number not given). The opening is machine repetition and the first sentences are lost.", "nl": "Leesnotitie: gebaseerd op het transcript van een podcastaflevering vóór aflevering 8. Het begin ontbreekt."}, "sources": ["src:60e7838a5a"], "flags": ["editor-note"]}], "links": [{"to": "tabar:neanderthal-admixture", "rel": "part-of", "note": {"fa": "آمیزش با نئاندرتال‌ها", "en": "Neanderthal admixture", "nl": "Neanderthalervermenging"}}, {"to": "tabar:neanderthal-ancestry-selection", "rel": "see-also", "note": {"fa": "پاک‌سازی DNA نئاندرتالی با انتخاب طبیعی", "en": "selection against Neanderthal DNA", "nl": "selectie tegen Neanderthaler-DNA"}}, {"to": "tabar:basal-eurasian-ancestry", "rel": "explains", "note": {"fa": "چرا سهم نئاندرتالی در غرب اوراسیا کمتر است", "en": "why western Eurasia has less", "nl": "waarom West-Eurazië minder heeft"}}, {"to": "tabar:race-biology", "rel": "see-also", "note": {"fa": "نقد زیست‌شناسیِ نژاد", "en": "critique of race biology", "nl": "kritiek op rassenbiologie"}}, {"to": "tabar:medical-genetics", "rel": "see-also", "note": {"fa": "ژنتیک پزشکی", "en": "medical genetics", "nl": "medische genetica"}}, {"to": "tabar:neanderthal-hunting-language-burial", "rel": "see-also", "note": {"fa": "ذهن و زندگی نئاندرتال", "en": "Neanderthal mind and life", "nl": "geest en leven"}}], "sources": ["src:60e7838a5a"], "people": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:darwin-sexual-selection", "kind": "concept", "title": {"fa": "انتخاب جنسی (طرح نخست داروین)", "en": "Sexual selection (Darwin's first sketch)", "nl": "Seksuele selectie (Darwins eerste schets)"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "داروین انتخاب جنسی را دلیل ویژگی‌هایی می‌دانست که به زنده‌ماندن کمکی نمی‌کنند، مثل دم طاووس یا شاخ گوزن: سودشان در رقابت برای جفت است، نه در مبارزهٔ زنده‌ماندن. در چاپ ۱۸۵۹ فقط چند صفحه به آن داده شده است؛ بحث کامل‌تر را بعدها در «تبار انسان» (۱۸۷۱) آورد.", "en": "Darwin saw sexual selection as the reason for traits that do not help survival, like the peacock's tail or stag's antlers: their benefit lies in competing for mates. The 1859 edition gives it only a few pages; the full treatment came later in The Descent of Man (1871).", "nl": "Darwin zag seksuele selectie als verklaring voor eigenschappen die niet bijdragen aan overleven, zoals de pauwenstaart: ze helpen bij de strijd om partners. In 1859 beslaat het enkele pagina's; de uitwerking volgde in The Descent of Man (1871)."}, "points": [{"text": {"fa": "داروین می‌گوید این نوع انتخاب به مرگ بستگی ندارد، بلکه به تعداد فرزندان: نری که شاخ، رنگ یا آواز بهتری دارد جفت بیشتری می‌یابد. او دو سازوکار را از هم جدا می‌کند: رقابت مستقیم نرها با هم و گزینش جفت (معمولاً توسط ماده‌ها).", "en": "He says this kind of selection depends not on death but on number of offspring: a male with better weapons, colour or song gets more mates. He distinguishes direct competition among males from mate choice (usually by females).", "nl": "He says this kind of selection depends not on death but on number of offspring: a male with better weapons, colour or song gets more mates. He distinguishes direct competition among males from mate choice (usually by females)."}, "sources": ["src:84786f7bfa"], "flags": []}, {"text": {"fa": "در چاپ ۱۸۵۹ تأکید بیشتر روی رقابت نرها و نمونه‌هایی چون قوی‌شدن شاخ و ساختارهای نبرد است. دربارهٔ اینکه چرا ماده‌ها چنین ویژگی‌هایی را می‌پسندند توضیح مفصلی نمی‌دهد؛ این پرسش تا قرن بیستم بحث‌برانگیز ماند (والاس با گزینش جفت توسط ماده‌ها مخالف بود).", "en": "The 1859 text stresses male-male contest and weapon-like structures. It does not explain at length why females prefer such traits; this stayed controversial into the twentieth century (Wallace doubted female choice).", "nl": "The 1859 text stresses male-male contest and weapon-like structures. It does not explain at length why females prefer such traits; this stayed controversial into the twentieth century (Wallace doubted female choice)."}, "sources": ["src:84786f7bfa", "src:6a5d7431c4"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "پیشرفت بعدی: فیشر (۱۹۳۰) مدل «فرار» را پیشنهاد کرد که در آن ترجیح مادگان و صفت نرها هم‌زمان تقویت می‌شود، و زاهاوی (۱۹۷۵) «اصل معلولیت» را: صفت پرهزینه می‌تواند نشانهٔ صادقانهٔ کیفیت باشد. شواهد تجربی مفصل و دسته‌ای از آنها در کتاب آندرسون (۱۹۹۴) گردآوری شده است.", "en": "Later progress: Fisher (1930) proposed the runaway model, where female preference and male trait reinforce each other, and Zahavi (1975) the handicap principle: a costly trait can be an honest signal of quality. Empirical evidence is reviewed in Andersson (1994).", "nl": "Later progress: Fisher (1930) proposed the runaway model, where female preference and male trait reinforce each other, and Zahavi (1975) the handicap principle: a costly trait can be an honest signal of quality. Empirical evidence is reviewed in Andersson (1994)."}, "sources": ["src:40c28190f8", "src:43f08defcb"], "flags": ["editor-note"]}, {"text": {"fa": "هشدار: نتیجه‌گیری‌های سادهٔ «طبیعی بودنِ» رفتار جنسی در انسان از این نظریه محتاطانه باید باشد؛ نقش‌های جنسیتی انسان به فرهنگ، اقتصاد و تاریخ نیز وابسته است و پژوهش روان‌شناسی تکاملی در این زمینه دچار اختلاف نظر است.", "en": "Caution: simple conclusions about what is 'natural' in human sexual behaviour must be treated carefully; human gender roles also depend on culture, economy and history, and evolutionary-psychology work here is disputed.", "nl": "Caution: simple conclusions about what is 'natural' in human sexual behaviour must be treated carefully; human gender roles also depend on culture, economy and history, and evolutionary-psychology work here is disputed."}, "sources": [], "flags": ["contested", "editor-note"]}], "links": [{"to": "psy:evo-sex", "rel": "see-also", "note": {"fa": "تعارض جنسی و روان‌شناسی تکاملی", "en": "Sexual conflict (evolutionary psychology)", "nl": "Sexual conflict (evolutionary psychology)"}}, {"to": "psy:sex-gender", "rel": "see-also", "note": {"fa": "روان‌شناسی جنس و جنسیت", "en": "Psychology of sex and gender", "nl": "Psychology of sex and gender"}}, {"to": "tabar:human-evolution", "rel": "part-of", "note": {"fa": "تکامل انسان", "en": "Human evolution", "nl": "Human evolution"}}, {"to": "tabar:darwin-natural-selection", "rel": "see-also", "note": {"fa": "مدخل هم‌موضوع", "en": "Related entry", "nl": "Verwant lemma"}}], "people": ["core:charles-darwin", "core:amotz-zahavi"], "sources": ["src:40c28190f8", "src:43f08defcb", "src:6a5d7431c4", "src:84786f7bfa"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:twin-adoption", "kind": "concept", "title": {"fa": "مطالعات دوقلوها و فرزندخواندگی", "en": "Twin and adoption studies", "nl": "Tweeling- en adoptiestudies"}, "aliases": [], "parent": "tabar:behavior-genetics", "field": "tabar:behavior-genetics", "summary": {"fa": "دوقلوهای همسان در برابر ناهمسان، و فرزندخوانده‌ها در برابر خانوادهٔ زیستی و پرورشی: دو آزمایش طبیعی که ژن و محیط را از هم جدا می‌کنند.", "en": "Identical versus fraternal twins, and adoptees versus their biological and adoptive families: two natural experiments that pull genes and environment apart.", "nl": "Eeneiige versus twee-eiige tweelingen, en adoptiekinderen versus hun biologische en adoptiefamilie: twee natuurlijke experimenten die genen en omgeving uit elkaar halen."}, "points": [{"text": {"fa": "منطق: اگر دوقلوهای همسان (۱۰۰٪ ژن مشترک) در صفتی شبیه‌تر از ناهمسان‌ها (~۵۰٪) باشند، تفاوت را به ژن نسبت می‌دهیم؛ مشروط به فرض «محیط برابر».", "en": "Logic: if identical twins (100 percent shared genes) resemble each other more than fraternal twins (~50 percent), the difference is attributed to genes, given the \"equal environments\" assumption.", "nl": "Logic: if identical twins (100 percent shared genes) resemble each other more than fraternal twins (~50 percent), the difference is attributed to genes, given the \"equal environments\" assumption."}, "sources": ["src:1deae47297"], "flags": []}, {"text": {"fa": "فرزندخوانده‌ها در بزرگسالی در هوش و شخصیت به والدین زیستی که هرگز ندیده‌اند شبیه‌ترند تا به والدین پرورشی؛ این یکی از ده یافتهٔ تکرارشدهٔ ژنتیک رفتاری است.", "en": "Adult adoptees resemble biological parents they never met more than their adoptive parents in intelligence and personality; one of behaviour genetics' ten replicated findings.", "nl": "Adult adoptees resemble biological parents they never met more than their adoptive parents in intelligence and personality; one of behaviour genetics' ten replicated findings."}, "sources": ["src:1deae47297"], "flags": []}, {"text": {"fa": "نقد: فرض محیط برابر برای دوقلوهای همسان کامل برقرار نیست (با آنها شبیه‌تر رفتار می‌شود)، و این می‌تواند وراثت‌پذیری را کمی بیش‌برآورد کند.", "en": "Critique: the equal-environments assumption does not fully hold for identical twins (they are treated more alike), which may slightly inflate heritability.", "nl": "Critique: the equal-environments assumption does not fully hold for identical twins (they are treated more alike), which may slightly inflate heritability."}, "sources": ["src:ba8f3ee8f4"], "flags": ["editor-note"]}], "links": [{"to": "tabar:heritability", "rel": "measured-by", "note": {"fa": "ابزار اصلی برآورد وراثت‌پذیری", "en": "The main tool for estimating heritability", "nl": "The main tool for estimating heritability"}}, {"to": "tabar:gwas-polygenic", "rel": "contrasts", "note": {"fa": "روش جدیدتر: مستقیم از دی‌ان‌ای", "en": "The newer method: directly from DNA", "nl": "The newer method: directly from DNA"}}], "people": ["core:robert-plomin"], "sources": ["src:1deae47297", "src:ba8f3ee8f4"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:forager-sharing-reciprocity", "kind": "concept", "title": {"fa": "خودخواهی، هم‌رسانی و «مبادلهٔ پایاپای» در جوامع شکارگر-گردآورنده", "en": "Selfishness, sharing and delayed reciprocity among foragers", "nl": "Egoïsme, delen en uitgestelde wederkerigheid bij jagers-verzamelaars"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "در پاسخ به پرسش میزبان که «بدجنسی آدمیزاد از کجا آمده»، «خداحافظ آفریقا» استدلال می‌کند که آنچه «بدجنسی» می‌نامیم برداشت اجتماعی از رفتار خودخواهانه است، و در جهانی با منابع محدود، دسترسی بیشتر به منابع یعنی بقا و زادوولد بیشتر؛ پس همهٔ ما نوادگان کسانی هستیم که خودخواهی‌شان کارساز بود. اما انسان هیچ‌گاه تنها زندگی نکرده است: بقای فرد به جایگاهش در گروه وابسته است، و همین است که هم‌رسانیِ شکار در جوامع شکارگر-گردآورنده را توضیح می‌دهد — نه به‌عنوان فضیلتی متعالی، بلکه به‌عنوان «بیمهٔ» متقابل.", "en": "Answering the host's question 'where does human nastiness come from?', the programme argues that what we call nastiness is a social reading of selfish behaviour; in a world of scarce resources, more access meant more survival and offspring, so we all descend from people whose selfishness worked. But humans never lived alone: an individual's survival depends on standing in the group, which explains food-sharing among foragers — not as lofty virtue but as mutual insurance.", "nl": "Op de vraag 'waar komt menselijke gemeenheid vandaan?' stelt het programma dat wat we gemeenheid noemen een sociale lezing is van egoïstisch gedrag; bij schaarse middelen betekende meer toegang meer overleving. Maar mensen leefden nooit alleen: overleving hangt af van je plaats in de groep. Dat verklaart het delen van voedsel — niet als verheven deugd maar als wederzijdse verzekering."}, "points": [{"text": {"fa": "خودخواهی به‌عنوان رمز بقا: در بیشترِ زمانی که نیاکان ما روی زمین زیستند، منابع غذایی و زیست‌محیطی محدود بود. کسی که به منابع بیشتری دست می‌یافت بقای خود را تضمین می‌کرد و زادوولد بیشتری داشت. گوینده می‌پذیرد این گزاره شاید رنج‌آور باشد: «همهٔ ما نوادگان آدم‌هایی هستیم که در رقابت بر سر منابع موفق بودند.»", "en": "Selfishness as a key to survival: for most of human existence, food and environmental resources were limited. Whoever gained more secured survival and had more offspring. The speaker concedes it may be uncomfortable: 'we are all descendants of people who succeeded in competing for resources.'", "nl": "Egoïsme als sleutel tot overleving: middelen waren meestal schaars; wie meer verwierf, overleefde en kreeg meer nakomelingen. 'We stammen allemaal af van mensen die succesvol concurreerden.'"}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "اما «انسانِ تک‌نفره» وجود ندارد: گوینده گزارهٔ نخست را بی‌درنگ تعدیل می‌کند: آیا هرچه خودخواه‌تر، موفق‌تر؟ نه؛ چون انسان هویتی جدا از جمع ندارد و فقط در خانواده و جامعه معنا می‌یابد. شرط زندگی در جامعه این است که جمعی بیندیشی و از برخی خودخواهی‌هایت بگذری. فرد بدون گروه نمی‌تواند زندگی کند، زادوولد کند یا از خود مراقبت کند. به همین دلیل امروز هم آموزه‌ها و رفتارهای فرهنگی‌ای را رعایت می‌کنیم که چندان باب میل‌مان نیست.", "en": "But there is no 'solitary human': the speaker immediately qualifies: more selfish, more successful? No — humans have no identity apart from the group and gain meaning only in family and society. Living in society requires thinking collectively and giving up some selfishness; without the group one cannot live, reproduce or be cared for. That is why we still follow cultural norms we do not much like.", "nl": "Maar er bestaat geen 'solitaire mens': mensen krijgen pas betekenis in familie en samenleving. Samenleven vereist collectief denken en het opgeven van wat egoïsme. Daarom volgen we nog steeds culturele normen die ons niet altijd bevallen."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "هم‌رسانی (sharing) در جوامع شکارگر-گردآورنده: در گروه‌هایی که هنوز در آفریقا، جنوب‌شرق آسیا و آمازون به این شیوه زندگی می‌کنند، هر کس شکار یا گردآوری کند باید آخر روز آن را وسط بگذارد و میان همه تقسیم کند. دانشمندان مدت‌ها این را رفتاری متعالی و نشانهٔ تکامل ذهنی می‌دانستند. اما گفت‌وگو با تک‌تک افراد نشان داد شکارچیِ موفق چندان مایل نیست شکار خوبش را با دیگران قسمت کند؛ او فهمیده است که اگر امروز قسمت نکند، روزی که خودش دست‌خالی برگردد (به‌ویژه در پیری) سهمی به او نخواهد رسید.", "en": "Sharing among foragers: in groups still living this way in Africa, Southeast Asia and the Amazon, whatever is hunted or gathered goes to the middle and is divided. Scientists long saw this as lofty behaviour, a sign of mental evolution. But talking to individuals showed that a successful hunter is not keen to share; he has learned that if he does not share today, nothing will come to him on the day he returns empty-handed — especially in old age.", "nl": "Delen bij jagers-verzamelaars: wat gejaagd of verzameld wordt, wordt verdeeld. Lang gold dit als verheven gedrag, maar gesprekken lieten zien dat succesvolle jagers niet graag delen; ze weten alleen dat ze anders niets krijgen op dagen dat ze zelf met lege handen thuiskomen."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "تشبیه جشن تولد: برنامه این را «مبادلهٔ پایاپایِ تأخیری» (delayed reciprocity) می‌نامد و با هدیهٔ تولد توضیح می‌دهد: وقتی با هدیه به جشن تولد دوستی می‌روی، انتظار نداری همان لحظه هدیه بگیری، بلکه انتظار داری هنگام تولد خودت جبران شود. اگر در چند جشن بی‌هدیه شرکت کنی، به‌زودی دیگر دعوتت نمی‌کنند. خودخواهی رمز بقا بود، اما باید در بافتی اجتماعی معنای دیگری بیابد.", "en": "The birthday-party analogy: the programme calls this delayed reciprocity and illustrates it with birthday gifts: you bring a present not expecting one back on the spot but at your own birthday. Turn up empty-handed to several parties and soon you are no longer invited. Selfishness was the key to survival, but in a social context it takes on another meaning.", "nl": "De verjaardagsvergelijking: uitgestelde wederkerigheid is als verjaardagscadeaus — je verwacht iets terug op je eigen verjaardag. Wie steeds zonder cadeau komt, wordt niet meer uitgenodigd."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "نقد و تکمیل: (۱) قوم‌نگاری‌های مشهور (مثلاً لی دربارهٔ کونگ، یا وودبرن دربارهٔ هادزا) دو سازوکار دیگر را هم برجسته می‌کنند: «هم‌رسانیِ اجباری» یا «مالیاتِ تحمل‌شده» (دیگران سهمشان را مطالبه می‌کنند و امتناع پرهزینه است) و سازوکارهای برابری‌خواه برای خوار شمردنِ شکارچیِ مغرور؛ پس انگیزه فقط «بیمه» نیست. (۲) برخی پژوهشگران (مثلاً هاوکس) نشان داده‌اند شکارچیان موفق با شکار بزرگ بیشتر «اعتبار» و فرصت جفت‌یابی می‌خرند تا بیمه — که با بحث تبردستی‌های نمایشی در مدخل راست‌قامت هم‌خوان است. (۳) ارجاعِ برنامه به سیاستمداران معاصر در این مدخل نیامده است.", "en": "Critique and complement: (1) classic ethnographies (e.g. Lee on the !Kung, Woodburn on the Hadza) also stress 'demand sharing' or 'tolerated theft' (others claim their share and refusal is costly) and levelling mechanisms that mock a boastful hunter, so motivation is not only insurance. (2) Some researchers (e.g. Hawkes) argue successful hunters gain prestige and mating opportunities more than insurance — consistent with the display hand-axes in the erectus entry. (3) The programme's aside about contemporary politicians is not reproduced.", "nl": "Kritiek en aanvulling: (1) klassieke etnografieën (Lee, Woodburn) benadrukken ook 'vraaggestuurd delen' en nivelleringsmechanismen. (2) Hawkes stelt dat succesvolle jagers vooral prestige winnen. (3) Een terzijde over hedendaagse politici is weggelaten."}, "sources": ["src:60e7838a5a"], "flags": ["editor-note", "contested"]}, {"text": {"fa": "یادداشت خوانش: بر پایهٔ بخش پایانیِ رونوشت اپیزود سومِ نسخهٔ رادیویی «خداحافظ آفریقا» که به‌طور کامل خوانده شده است.", "en": "Reading note: based on the closing section of the automatic transcript of radio episode 3, read in full.", "nl": "Leesnotitie: gebaseerd op het slot van radioaflevering 3, volledig gelezen."}, "sources": ["src:60e7838a5a"], "flags": ["editor-note"]}], "links": [{"to": "tabar:forager-lifeways-diversity", "rel": "part-of", "note": {"fa": "بخشی از تنوع شیوه‌های زیست شکارگران", "en": "part of forager lifeway diversity", "nl": "onderdeel van de diversiteit van jagers-verzamelaars"}}, {"to": "tabar:homo-erectus-endurance-and-handaxe", "rel": "see-also", "note": {"fa": "رهبری و خودنمایی در جامعهٔ بی‌طبقه", "en": "leadership and display in classless groups", "nl": "leiderschap en vertoon in klasseloze groepen"}}, {"to": "tabar:social-brain-evolution", "rel": "see-also", "note": {"fa": "زندگی گروهی و مغز اجتماعی", "en": "group living and the social brain", "nl": "groepsleven en het sociale brein"}}], "sources": ["src:60e7838a5a"], "people": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:thalassemia-screening", "kind": "concept", "title": {"fa": "برنامهٔ ملی غربالگری تالاسمی ایران", "en": "Iran's national thalassaemia screening programme", "nl": "Het Iraanse nationale screeningsprogramma voor thalassemie"}, "aliases": [], "parent": "tabar:medical-genetics", "field": "tabar:medical-genetics", "summary": {"fa": "از ۱۹۹۷ غربالگری ناقلان تالاسمی پیش از ازدواج در ایران اجباری شد، همراه با مشاوره و بعدها تشخیص پیش از تولد. یکی از معدود برنامه‌های ژنتیک جمعیتی موفق در کشورهای با درآمد متوسط، و الگویی که در BMJ معرفی شد.", "en": "From 1997 premarital carrier screening for thalassaemia became mandatory in Iran, with counselling and later prenatal diagnosis. One of the few successful population-genetics programmes in a middle-income country, presented as a model in the BMJ.", "nl": "Vanaf 1997 werd premaritale dragerscreening voor thalassemie in Iran verplicht, met counseling en later prenatale diagnostiek. Een van de weinige geslaagde populatiegenetische programma's in een middeninkomensland, in de BMJ als model gepresenteerd."}, "points": [{"text": {"fa": "صمدوت و مودل (۲
