question", "nl": "The Indo-European language question"}}, {"to": "tabar:sex-bias-inequality-genome", "rel": "see-also", "note": {"fa": "گسترش مردانه و نابرابری", "en": "Male-biased expansion and inequality", "nl": "Male-biased expansion and inequality"}}], "people": ["core:iosif-lazaridis", "core:david-anthony", "core:gustaf-kossinna", "core:v-gordon-childe"], "sources": ["src:0ac39f77d9", "src:92e120a792", "src:a4f00f41ff", "src:f0cf216e27"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:iranian-genetic-diversity", "kind": "concept", "title": {"fa": "تنوع ژنتیکی مردم ایران", "en": "Genetic diversity of the Iranian population", "nl": "Genetische diversiteit van de Iraanse bevolking"}, "aliases": ["Iranome", "ایرانوم"], "parent": "tabar:population-genetics", "field": "tabar:population-genetics", "summary": {"fa": "ایرانیان یکی از ناهمگن‌ترین جمعیت‌های ژنتیکی خاورمیانه‌اند؛ گروه‌های بزرگ (فارس، کرد، لر، آذری، عرب) به هم نزدیک‌اند و چند گروه (بلوچ، ترکمن، سیستانی) تمایز بیشتری دارند؛ و بخش قابل توجهی از واریانت‌های ایرانی در پایگاه‌های داده جهانی غایب است.", "en": "Iranians are among the most genetically heterogeneous populations of the Middle East; the large groups (Persians, Kurds, Lurs, Azeris, Arabs) are close to one another while a few (Baloch, Turkmen, Sistani) are more distinct; and a notable share of Iranian variants is absent from global databases.", "nl": "Iraniërs behoren tot de genetisch meest heterogene bevolkingen van het Midden-Oosten; de grote groepen (Perzen, Koerden, Loeren, Azeri's, Arabieren) liggen dicht bij elkaar terwijl enkele (Beloetsji, Turkmenen, Sistani) meer afwijken; en een opmerkelijk deel van de Iraanse varianten ontbreekt in wereldwijde databanken."}, "points": [{"text": {"fa": "مهرجو و همکاران (۲۰۱۹): ۱٬۰۲۱ نفر از ۱۱ گروه قومی؛ ایرانیان خوشهٔ «ایرانی مرکزی» بزرگی تشکیل می‌دهند و تمایز بین‌گروهی در کل کم اما در بلوچ‌ها، ترکمن‌ها و سیستانی‌ها بیشتر است؛ نشانه‌هایی از انزوای تاریخی و آمیزش با همسایگان شرقی.", "en": "Mehrjoo et al. (2019): 1,021 people from 11 ethnic groups; Iranians form a large \"central Iranian\" cluster with low overall between-group differentiation, higher among Baloch, Turkmen and Sistani; signs of historical isolation and admixture with eastern neighbours.", "nl": "Mehrjoo et al. (2019): 1,021 people from 11 ethnic groups; Iranians form a large \"central Iranian\" cluster with low overall between-group differentiation, higher among Baloch, Turkmen and Sistani; signs of historical isolation and admixture with eastern neighbours."}, "sources": ["src:02461bf7f4"], "flags": []}, {"text": {"fa": "ایرانوم (۲۰۱۹): توالی اگزوم ۸۰۰ نفر از ۸ گروه قومی؛ درصد قابل توجهی از واریانت‌ها در پایگاه‌های بین‌المللی ثبت نشده بود؛ بدون مرجع بومی، تفسیر آزمایش‌های ژنتیک بالینی در ایران خطا دارد.", "en": "Iranome (2019): exome sequences of 800 people from 8 ethnic groups; a notable share of variants had not been recorded in international databases; without a local reference, interpreting clinical genetic tests in Iran is error-prone.", "nl": "Iranome (2019): exome sequences of 800 people from 8 ethnic groups; a notable share of variants had not been recorded in international databases; without a local reference, interpreting clinical genetic tests in Iran is error-prone."}, "sources": ["src:3c4d0940c4"], "flags": []}, {"text": {"fa": "فلات ایران در طول تاریخ چهارراه مهاجرت بوده؛ با این حال داده‌ها نشان می‌دهد لایهٔ اصلی تبار، پیوستگی طولانی با جمعیت‌های باستانی خود منطقه دارد، نه جایگزینی کامل.", "en": "The Iranian plateau has been a crossroads of migration throughout history; yet the data show that the main layer of ancestry has long continuity with the region's own ancient populations rather than full replacement.", "nl": "The Iranian plateau has been a crossroads of migration throughout history; yet the data show that the main layer of ancestry has long continuity with the region's own ancient populations rather than full replacement."}, "sources": ["src:02461bf7f4", "src:73a4e45469"], "flags": []}], "links": [{"to": "tabar:zagros-neolithic", "rel": "explains", "note": {"fa": "لایهٔ باستانی تبار ایرانیان", "en": "The ancient layer of Iranian ancestry", "nl": "The ancient layer of Iranian ancestry"}}, {"to": "tabar:gwas-polygenic", "rel": "applies-to", "note": {"fa": "چرا پنل مرجع بومی لازم است", "en": "Why a local reference panel is needed", "nl": "Why a local reference panel is needed"}}, {"to": "tabar:consanguinity", "rel": "see-also", "note": {"fa": "ساختار ازدواج و بار واریانت‌های مغلوب", "en": "Marriage structure and the load of recessive variants", "nl": "Marriage structure and the load of recessive variants"}}], "people": [], "sources": ["src:02461bf7f4", "src:3c4d0940c4", "src:73a4e45469"], "booklets": [], "origin": null, "iran": "iran:genetic-heterogeneity", "wikidata": null, "status": "draft"}, {"id": "tabar:meat-eating-hunting-hypothesis", "kind": "concept", "title": {"fa": "فرضیهٔ گوشت‌خواری و «انسانِ شکارچی»", "en": "The meat-eating / Man-the-Hunter hypothesis", "nl": "De vleeseterhypothese / «Man-the-Hunter»"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "از دههٔ ۱۹۵۰ دیدگاه رایج این بود که خوردن گوشت و شکار انسان را از میمون‌های انسان‌نما جدا کرد. رانگهم می‌گوید گوشت‌خواری گذار اول (به انسان‌های ابزارساز اولیه) را خوب توضیح می‌دهد، اما گذار دوم (به هومو ارکتوس با دهان و دندان کوچک) را نه، و برای آن به پختن نیاز است. منتقدان می‌گویند این تفکیک هنوز اثبات نشده است.", "en": "Since the 1950s the dominant view held that meat eating and hunting separated humans from apes. Wrangham argues that meat eating explains the first transition (to early tool-making habilines) but not the second (to Homo erectus with small mouth and teeth), which needs cooking. Critics say this separation is unproven.", "nl": "Sinds de jaren 1950 gold vleesconsumptie en jacht als de motor van menswording. Wrangham stelt dat vlees de eerste overgang verklaart maar niet de tweede (Homo erectus met kleine kaken), waarvoor koken nodig is. Critici vinden dit onbewezen."}, "points": [{"text": {"fa": "پایهٔ فرضیه: همهٔ جوامع شکارگر-گردآورِ شناخته‌شده بخش بزرگی از کالری‌شان را از گوشت می‌گیرند، و برش‌های ابزار سنگی روی استخوان‌ها گوشت‌خواری را تا حدود ۲٫۶ میلیون سال پیش نشان می‌دهد. شامپانزه‌ها هم گوشت می‌خورند، اما ماه‌ها بدون آن می‌گذرانند.", "en": "Basis of the hypothesis: all known hunter-gatherer societies draw a large share of calories from meat, and cut marks from stone tools on bones show butchery back to about 2.6 million years ago. Chimpanzees eat meat too, but may go months without it.", "nl": "Basis of the hypothesis: all known hunter-gatherer societies draw a large share of calories from meat, and cut marks from stone tools on bones show butchery back to about 2.6 million years ago. Chimpanzees eat meat too, but may go months without it."}, "sources": ["src:c12cd83ad0"], "flags": []}, {"text": {"fa": "رانگهم دو ایراد می‌گیرد: الف) این روایت نمی‌گوید شکار چگونه بدون غذای گردآوری‌شده ممکن بود، و گردآوری در جوامع امروزی بیشتر کار زنان است؛ ب) در فسیل‌ها دو گذار جدا دیده می‌شود (مرحلهٔ ابزارساز اولیه و بعد هومو ارکتوس) و یک علت برای هر دو قانع‌کننده نیست.", "en": "Wrangham raises two objections: (a) the story does not explain how hunting was possible without gathered food, and gathering in modern societies is mostly done by women; (b) the fossils show two separate transitions (early tool-making hominins, then Homo erectus), and a single cause for both is not convincing.", "nl": "Wrangham raises two objections: (a) the story does not explain how hunting was possible without gathered food, and gathering in modern societies is mostly done by women; (b) the fossils show two separate transitions (early tool-making hominins, then Homo erectus), and a single cause for both is not convincing."}, "sources": ["src:c12cd83ad0"], "flags": []}, {"text": {"fa": "استدلال او دربارهٔ دندان: هومو ارکتوس دهان و دندان کوچک و فک ضعیف داشت، یعنی برای جویدن گوشت خام و سخت مناسب نبود. پس هرچه گوشت‌خواری در آن دوره بیشتر شده باشد، کوچک‌شدن دندان‌ها را توضیح نمی‌دهد.", "en": "His argument from teeth: Homo erectus had a small mouth, small teeth and weak jaws, poorly suited to tough raw meat, so growing meat intake alone does not explain shrinking teeth.", "nl": "His argument from teeth: Homo erectus had a small mouth, small teeth and weak jaws, poorly suited to tough raw meat, so growing meat intake alone does not explain shrinking teeth."}, "sources": ["src:c12cd83ad0"], "flags": []}, {"text": {"fa": "نظر ویراستار: این استدلال را باید با پژوهش زینک و لیبرمن (۲۰۱۶) سنجید. آن‌ها آزمایش کردند که بریدن و کوبیدن گوشت و غده‌ها با ابزار سنگی، نیروی جویدن لازم را به‌طور چشمگیری کم می‌کند. به همین دلیل بعضی پژوهشگران می‌گویند فراوری مکانیکیِ بدون آتش هم می‌توانست دندان‌ها را کوچک کند و برای توضیح آن به پختن نیاز نیست.", "en": "Editor's note: this should be weighed against Zink and Lieberman (2016), who showed experimentally that slicing and pounding meat and tubers with stone tools greatly reduces chewing effort. Some researchers therefore argue that mechanical processing without fire could have allowed smaller teeth, so cooking is not required to explain them.", "nl": "Editor's note: this should be weighed against Zink and Lieberman (2016), who showed experimentally that slicing and pounding meat and tubers with stone tools greatly reduces chewing effort. Some researchers therefore argue that mechanical processing without fire could have allowed smaller teeth, so cooking is not required to explain them."}, "sources": ["src:c64b6db5f6"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "نظر ویراستار: عنوان «انسانِ شکارچی» از نظر فمینیستی و مردم‌شناختی هم نقد شده است، چون نقش گردآوری و کار زنان را کم‌اهمیت می‌گیرد. رانگهم خودش هم همین نکته را به‌عنوان نقطهٔ ضعف روایت قدیمی می‌آورد. بین کاوش‌گر لاشه و شکارچی فعال بودن در دورهٔ هابیلین‌ها هم شواهد قطعی نداریم.", "en": "Editor's note: the 'Man-the-Hunter' framing has also been criticised on feminist and anthropological grounds for downplaying gathering and women's work, a point Wrangham himself uses against it. Whether early habilines were scavengers or active hunters is not settled by the evidence.", "nl": "Editor's note: the 'Man-the-Hunter' framing has also been criticised on feminist and anthropological grounds for downplaying gathering and women's work, a point Wrangham himself uses against it. Whether early habilines were scavengers or active hunters is not settled by the evidence."}, "sources": [], "flags": ["contested", "editor-note"]}], "links": [{"to": "tabar:cooking-hypothesis", "rel": "contrasts", "note": {"fa": "فرضیهٔ پختن", "en": "The cooking hypothesis", "nl": "The cooking hypothesis"}}, {"to": "tabar:human-evolution", "rel": "part-of", "note": {"fa": "تکامل انسان", "en": "Human evolution", "nl": "Human evolution"}}, {"to": "tabar:cooked-diet-body-and-brain", "rel": "see-also", "note": {"fa": "غذای پخته، روده و مغز", "en": "Cooked food, gut and brain", "nl": "Cooked food, gut and brain"}}], "people": ["core:richard-wrangham", "core:adam-zink", "core:daniel-e-lieberman"], "sources": ["src:c12cd83ad0", "src:c64b6db5f6"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:persian-plateau-hub", "kind": "concept", "title": {"fa": "فلات ایران به‌عنوان «کانون» انسان خردمند پس از خروج از آفریقا", "en": "The Persian Plateau as a 'Hub' for Homo sapiens after Out of Africa", "nl": "Het Iraanse plateau als 'Hub' voor Homo sapiens na Out of Africa"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "شواهد ژنتیکی، فسیلی و باستان‌شناختی نشان می‌دهد انسان خردمند حدود ۷۰ تا ۶۰ هزار سال پیش از آفریقا بیرون آمد، اما تا حدود ۴۵ هزار سال پیش در سراسر اوراسیا پخش نشد. وانینی و همکاران (۲۰۲۴) پیشنهاد می‌کنند در این فاصلهٔ حدود ۲۰ هزار ساله، نیای همهٔ غیرآفریقایی‌های امروز در یک «کانون» زندگی می‌کرد و این کانون به احتمال زیاد فلات ایران بوده است. این فرضیه‌ای قوی اما هنوز مدل‌محور است.", "en": "Genetic, fossil and archaeological evidence indicates that Homo sapiens left Africa about 70–60 thousand years ago but did not spread across Eurasia until about 45 kya. Vallini and colleagues (2024) propose that during this gap of about 20,000 years the ancestors of all present-day non-Africans lived in a 'Hub', most probably the Persian Plateau. This is a strong but still model-based hypothesis.", "nl": "Vallini e.a. (2024) combineren oud-DNA en paleo-ecologische modellen en stellen dat de voorouders van alle huidige niet-Afrikanen tussen ca. 70–60 en 45 duizend jaar geleden op het Iraanse plateau leefden. Dit is een modelmatige hypothese, geen directe vondst."}, "points": [{"text": {"fa": "مسئله: بین خروج اصلی از آفریقا (حدود ۷۰ تا ۶۰ هزار سال پیش) و استقرار پایدار در اوراسیا (حدود ۴۵ هزار سال پیش) شکافی نزدیک به ۲۰ هزار سال هست که در آن تقریباً هیچ فسیل انسان خردمند در اوراسیا نداریم. نویسندگان این جمعیتِ میانی را «کانون» (Hub) می‌نامند؛ جایی که موج‌های بعدیِ مهاجرت از آن برخاستند.", "en": "The problem: between the main exit from Africa (~70–60 kya) and stable settlement of Eurasia (~45 kya) lies a gap of about 20,000 years with almost no Homo sapiens fossils in Eurasia. The authors call the population of this interval the 'Hub', from which later waves of migration emanated.", "nl": "The problem: between the main exit from Africa (~70–60 kya) and stable settlement of Eurasia (~45 kya) lies a gap of about 20,000 years with almost no Homo sapiens fossils in Eurasia. The authors call the population of this interval the 'Hub', from which later waves of migration emanated."}, "sources": ["src:3ec2e3a4ff"], "flags": []}, {"text": {"fa": "روش ژنتیکی: آن‌ها ژنوم‌های باستانی و امروزی را با دو نمونهٔ کهن مقایسه کردند، یعنی تیان‌یوان (چین، حدود ۴۰ هزار سال پیش) برای شاخهٔ شرق اوراسیا و کوستنکی ۱۴ (روسیه، حدود ۳۸ هزار سال پیش) برای شاخهٔ غرب اوراسیا. هر جمعیت را بر پایهٔ سهم «آلل‌های مشترک مشتق‌شده» با این دو نمونه نشان دادند و اثر آمیختگی با نئاندرتال‌ها و دنیسوواها، پیوند شرقی-غربی و تبار «اوراسیایی پایه» را تا حد ممکن تصحیح کردند.", "en": "Genetic method: ancient and present-day genomes were compared with two old reference individuals, Tianyuan (China, ~40 ky old) for the East Eurasian branch and Kostenki14 (Russia, ~38 ky old) for the West Eurasian branch. Each population was placed by its share of derived alleles with the two, correcting as far as possible for archaic admixture, East-West mixing and Basal Eurasian ancestry.", "nl": "Genetic method: ancient and present-day genomes were compared with two old reference individuals, Tianyuan (China, ~40 ky old) for the East Eurasian branch and Kostenki14 (Russia, ~38 ky old) for the West Eurasian branch. Each population was placed by its share of derived alleles with the two, correcting as far as possible for archaic admixture, East-West mixing and Basal Eurasian ancestry."}, "sources": ["src:3ec2e3a4ff"], "flags": []}, {"text": {"fa": "نتیجهٔ ژنتیکی: میان جمعیت‌های غرب اوراسیا، آن‌هایی که کمترین رانش مشترک با شاخهٔ غربی دارند و به «کانون» نزدیک‌ترند، تبارشان به شکارگردآورندگان و کشاورزان نخستین ایران («Iran HG»، همان تبار «نوسنگی ایران») می‌رسد. با فرض اینکه دست‌کم بخشی از پیوستگی جمعیتی در ۴۰ هزار سال گذشته حفظ شده، «ناحیهٔ کانونی» ژنتیکی میان کرانهٔ جنوبی دریای خزر و خلیج فارس (که آن زمان خشکی بود) قرار می‌گیرد.", "en": "Genetic result: among West Eurasian groups, those closest to the Hub (least drift shared with the West Eurasian wave) carry ancestry of the hunter-gatherers and early farmers of Iran ('Iran HG', the 'Iranian Neolithic' component). Assuming at least partial population continuity over the past 40,000 years, the genetic focal area lies between the southern Caspian shore and the Persian Gulf (then dry land).", "nl": "Genetic result: among West Eurasian groups, those closest to the Hub (least drift shared with the West Eurasian wave) carry ancestry of the hunter-gatherers and early farmers of Iran ('Iran HG', the 'Iranian Neolithic' component). Assuming at least partial population continuity over the past 40,000 years, the genetic focal area lies between the southern Caspian shore and the Persian Gulf (then dry land)."}, "sources": ["src:3ec2e3a4ff"], "flags": []}, {"text": {"fa": "آزمون مستقل با اقلیم باستان: مدل پراکنش گونه‌ای بر پایهٔ بازسازی‌های اقلیمی ۷۰ تا ۳۰ هزار سال پیش نشان داد این منطقه در بیشتر آن دوره برای سکونت انسان مناسب بوده و ظرفیت جمعیتی‌اش از دیگر نواحی غرب آسیا بیشتر بوده است. اما مدل اقلیمی فقط با یک نقطهٔ داده از خود ایران اعتبارسنجی شد و نویسندگان خودشان این را یادآوری می‌کنند.", "en": "Independent test with palaeoclimate: a species-distribution model built on climate reconstructions for 70–30 kya found the region suitable for human occupation for most of the period, with a higher carrying capacity than other West Asian regions. However, the climate data were validated locally with only a single data point from Iran, as the authors themselves note.", "nl": "Independent test with palaeoclimate: a species-distribution model built on climate reconstructions for 70–30 kya found the region suitable for human occupation for most of the period, with a higher carrying capacity than other West Asian regions. However, the climate data were validated locally with only a single data point from Iran, as the authors themselves note."}, "sources": ["src:3ec2e3a4ff"], "flags": ["contested"]}, {"text": {"fa": "حدود و ابهام‌ها: هنوز هیچ فسیل انسان خردمندِ همراه با ابزارهای پارینه‌سنگی میانی در فلات ایران یافت نشده و ژنوم باستانی مستقیم از آنجا برای ۷۰ تا ۴۵ هزار سال پیش در دست نیست. بخش شمال‌شرقی شبه‌جزیرهٔ عربستان را نمی‌توان کنار گذاشت، و نتیجه به فرض پیوستگی جمعیت بستگی دارد (جابه‌جایی‌های بعدی ممکن است ردپا را جابه‌جا یا رقیق کرده باشد). به همین دلیل «فلات ایران» محتمل‌ترین نامزد است، نه یک واقعیتِ اثبات‌شده.", "en": "Limits: no Homo sapiens fossil has yet been found with Middle Palaeolithic tools on the Persian Plateau, and no direct ancient genome from there exists for 70–45 kya. Northeastern Arabia cannot be excluded, and the result depends on assuming population continuity (later movements may have shifted or diluted the signal). The Plateau is thus the most likely candidate, not a proven fact.", "nl": "Limits: no Homo sapiens fossil has yet been found with Middle Palaeolithic tools on the Persian Plateau, and no direct ancient genome from there exists for 70–45 kya. Northeastern Arabia cannot be excluded, and the result depends on assuming population continuity (later movements may have shifted or diluted the signal). The Plateau is thus the most likely candidate, not a proven fact."}, "sources": ["src:3ec2e3a4ff"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "این یک مقالهٔ تک‌گروهی و هنوز بدون تکرار مستقل است و فرضیهٔ «کانون» پیش‌تر در پژوهش‌های همین گروه مطرح شده بود. نتیجه‌گیری‌ها را باید فرضیهٔ کاری دانست تا زمانی که نمونه‌های باستانی تازه یا کاوش‌های هدفمند در ایران آن را تأیید یا رد کنند.", "en": "This is a single-group study not yet independently replicated, and the 'Hub' idea had been proposed earlier by related work. Treat the conclusions as a working hypothesis until new ancient samples or targeted excavation in Iran confirm or refute it.", "nl": "This is a single-group study not yet independently replicated, and the 'Hub' idea had been proposed earlier by related work. Treat the conclusions as a working hypothesis until new ancient samples or targeted excavation in Iran confirm or refute it."}, "sources": [], "flags": ["unreplicated", "editor-note"]}], "links": [{"to": "tabar:out-of-africa", "rel": "part-of", "note": {"fa": "خاستگاه آفریقایی انسان خردمند", "en": "African origin of Homo sapiens", "nl": "African origin of Homo sapiens"}}, {"to": "tabar:neanderthal-admixture", "rel": "see-also", "note": {"fa": "آمیزش با نئاندرتال‌ها و دنیسوواها", "en": "Admixture with Neanderthals and Denisovans", "nl": "Admixture with Neanderthals and Denisovans"}}, {"to": "tabar:zagros-neolithic", "rel": "see-also", "note": {"fa": "کشاورزان نوسنگی زاگرس (تبار «Iran HG» از آنجاست)", "en": "Zagros Neolithic farmers (source of the 'Iran HG' ancestry)", "nl": "Zagros Neolithic farmers (source of the 'Iran HG' ancestry)"}}, {"to": "soc:persian-plateau-palaeolithic-record", "rel": "see-also", "note": {"fa": "شواهد باستان‌شناختی و اقلیمی فلات ایران", "en": "Archaeological and climatic record of the Persian Plateau", "nl": "Archaeological and climatic record of the Persian Plateau"}}], "people": ["core:leonardo-vallini", "core:luca-pagani", "core:mohamed-javad-shoaee"], "sources": ["src:3ec2e3a4ff"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:nature-of-nurture", "kind": "concept", "title": {"fa": "ژن‌های والدین به‌عنوان محیط فرزند", "en": "Genetic nurture", "nl": "Genetische opvoeding"}, "aliases": [], "parent": "tabar:behavior-genetics", "field": "tabar:behavior-genetics", "summary": {"fa": "ژن‌هایی که والدین به فرزند نمی‌دهند هم روی او اثر می‌گذارند: از راه رفتار و محیطی که همان ژن‌ها در والدین می‌سازند. مرز ژن و محیط این‌جا محو می‌شود.", "en": "Even the genes parents do not pass on affect the child, through the behaviour and environment those genes create in the parents. Here the boundary between gene and environment dissolves.", "nl": "Ook de genen die ouders niet doorgeven, beïnvloeden het kind, via het gedrag en de omgeving die die genen bij de ouders scheppen. Hier vervaagt de grens tussen gen en omgeving."}, "points": [{"text": {"fa": "کُنگ و همکاران (۲۰۱۸، ایسلند): آللِ‌های والدین که به فرزند منتقل نشده بودند، حدود ۳۰ درصدِ اثرِ آلل‌های منتقل‌شده را روی تحصیلات فرزند داشتند.", "en": "Kong et al. (2018, Iceland): parental alleles not transmitted to the child had about 30 percent of the effect on the child's education that transmitted alleles had.", "nl": "Kong et al. (2018, Iceland): parental alleles not transmitted to the child had about 30 percent of the effect on the child's education that transmitted alleles had."}, "sources": ["src:0d7705b088"], "flags": []}, {"text": {"fa": "پیامد: بخشی از «وراثت‌پذیری» صفات اجتماعی در واقع از راه محیط عمل می‌کند؛ نمره‌های چندژنی بین خانواده‌ها این دو را قاطی می‌کنند.", "en": "Implication: part of the \"heritability\" of social traits actually operates through environment; between-family polygenic scores mix the two.", "nl": "Implication: part of the \"heritability\" of social traits actually operates through environment; between-family polygenic scores mix the two."}, "sources": ["src:4e5c76eea4"], "flags": []}], "links": [{"to": "tabar:gwas-polygenic", "rel": "critiques", "note": {"fa": "چرا نمرهٔ چندژنی درون خانواده ضعیف‌تر است", "en": "Why polygenic scores weaken within families", "nl": "Why polygenic scores weaken within families"}}, {"to": "tabar:gene-environment", "rel": "part-of", "note": {"fa": "نوعی همبستگی منفعل ژن–محیط", "en": "A kind of passive gene–environment correlation", "nl": "A kind of passive gene–environment correlation"}}], "people": [], "sources": ["src:0d7705b088", "src:4e5c76eea4"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:basics", "kind": "field", "title": {"fa": "مبانی", "en": "Basics", "nl": "Grondslagen"}, "aliases": [], "parent": "tabar:tabar", "field": null, "summary": {"fa": "ژنوم، جهش، انتخاب و رانش: چهار مفهومی که بقیهٔ این ویکی روی آن‌ها ایستاده است.", "en": "Genome, mutation, selection and drift: the four concepts the rest of this wiki stands on.", "nl": "Genoom, mutatie, selectie en drift: de vier begrippen waarop de rest van deze wiki rust."}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:steppe-indo-iranian", "kind": "concept", "title": {"fa": "تبار استپی و زبان‌های هندوایرانی", "en": "Steppe ancestry and the Indo-Iranian languages", "nl": "Steppe-afstamming en de Indo-Iraanse talen"}, "aliases": [], "parent": "tabar:population-genetics", "field": "tabar:population-genetics", "summary": {"fa": "ژنتیک نشان می‌دهد در هزارهٔ دوم پیش از میلاد تباری از استپ اوراسیا به جنوب و میانهٔ آسیا رسید؛ این را با گسترش زبان‌های هندوایرانی پیوند می‌دهند. پیوند ژن و زبان اما استنباط است، نه مشاهده، و میان باستان‌شناسان و زبان‌شناسان محل بحث.", "en": "Genetics shows that in the second millennium BCE ancestry from the Eurasian steppe reached South and Central Asia; this is linked to the spread of Indo-Iranian languages. The gene–language link, however, is inference not observation, and is debated among archaeologists and linguists.", "nl": "Genetica toont dat in het tweede millennium v.Chr. afstamming uit de Euraziatische steppe Zuid- en Centraal-Azië bereikte; dit wordt gekoppeld aan de verspreiding van de Indo-Iraanse talen. De koppeling gen–taal is echter een gevolgtrekking, geen waarneming, en omstreden onder archeologen en taalkundigen."}, "points": [{"text": {"fa": "نراسیمهان و همکاران (۲۰۱۹): ۵۲۳ ژنوم باستانی از آسیای میانه و جنوبی؛ تبار استپی (یامنایا/سینتاشتا) در نیمهٔ دوم هزارهٔ دوم پیش از میلاد در منطقه ظاهر می‌شود و با تبار «کشاورزان ایرانی» و شکارچیان جنوب آسیا می‌آمیزد.", "en": "Narasimhan et al. (2019): 523 ancient genomes from Central and South Asia; steppe ancestry (Yamnaya/Sintashta) appears in the region in the second half of the second millennium BCE and mixes with \"Iranian farmer\" and South Asian hunter-gatherer ancestry.", "nl": "Narasimhan et al. (2019): 523 ancient genomes from Central and South Asia; steppe ancestry (Yamnaya/Sintashta) appears in the region in the second half of the second millennium BCE and mixes with \"Iranian farmer\" and South Asian hunter-gatherer ancestry."}, "sources": ["src:73a4e45469"], "flags": []}, {"text": {"fa": "همین مطالعه تأکید می‌کند تبار «ایرانیِ» جنوب آسیا از جمعیت زاگرس آمده، نه از مهاجرت هم‌زمان با کشاورزی؛ یعنی چند لایهٔ زمانی متفاوت.", "en": "The same study stresses that the \"Iranian\" ancestry of South Asia came from Zagros-related population, not from a migration contemporary with farming; several distinct time layers.", "nl": "The same study stresses that the \"Iranian\" ancestry of South Asia came from Zagros-related population, not from a migration contemporary with farming; several distinct time layers."}, "sources": ["src:73a4e45469"], "flags": []}, {"text": {"fa": "نقد: ژن زبان نمی‌گوید. تطبیق خوشهٔ ژنتیکی با «آریایی‌ها» یا یک زبان، فرضیه است و تاریخ سوءاستفاده‌های سیاسی از آن طولانی است. این صفحه پیوند ژن–زبان را «مطرح‌شده» می‌داند، نه اثبات‌شده.", "en": "Critique: genes do not speak a language. Matching a genetic cluster to \"the Aryans\" or to a language is a hypothesis, and the history of its political misuse is long. This page treats the gene–language link as proposed, not proven.", "nl": "Critique: genes do not speak a language. Matching a genetic cluster to \"the Aryans\" or to a language is a hypothesis, and the history of its political misuse is long. This page treats the gene–language link as proposed, not proven."}, "sources": ["src:8b730d2385"], "flags": ["contested", "editor-note"]}], "links": [{"to": "tabar:ancient-dna", "rel": "part-of", "note": {"fa": "یافته‌ای از دی‌ان‌ای باستانی", "en": "A finding from ancient DNA", "nl": "A finding from ancient DNA"}}, {"to": "tabar:race-biology", "rel": "see-also", "note": {"fa": "خطر سوءاستفادهٔ هویتی از خوشه‌های ژنتیکی", "en": "The risk of identity misuse of genetic clusters", "nl": "The risk of identity misuse of genetic clusters"}}], "people": ["core:david-reich"], "sources": ["src:73a4e45469", "src:8b730d2385"], "booklets": [], "origin": null, "iran": "iran:steppe-ancestry", "wikidata": null, "status": "draft"}, {"id": "tabar:race-versus-culture-levi-strauss", "kind": "concept", "title": {"fa": "جدایی نژاد از فرهنگ: خطای بنیادین نژادپرستی در روایت لوی‌استروس", "en": "Separating race from culture: racism's founding confusion in Lévi-Strauss", "nl": "Ras en cultuur scheiden: de grondfout van het racisme volgens Lévi-Strauss"}, "aliases": [], "parent": "tabar:genetics-society", "field": "tabar:genetics-society", "summary": {"fa": "لوی‌استروس در رسالهٔ یونسکو (۱۹۵۲) می‌گوید خطای اصلی نظریهٔ نژادی آن است که تفاوت زیستی گروه‌ها (به فرض وجود) را با تفاوت‌های روانی، اجتماعی و فرهنگی یکی می‌گیرد. او حتی «نژادگرایی وارونه» را هم رد می‌کند: نسبت‌دادن سهم ویژهٔ فرهنگی به هر نژاد، باز همان خطاست.", "en": "In his 1952 UNESCO essay Lévi-Strauss argues that racism's basic mistake is to merge supposed biological group differences with psychological, social and cultural ones. He also rejects the 'reverse' move of assigning each race its own cultural contribution.", "nl": "In zijn UNESCO-essay uit 1952 stelt Lévi-Strauss dat de kernfout van het racisme is dat biologische groepsverschillen worden vermengd met psychologische, sociale en culturele verschillen. Ook de omgekeerde stap, elk ras een eigen cultuurbijdrage toeschrijven, wijst hij af."}, "points": [{"text": {"fa": "کتاب بر آن است که هیچ برتری یا فروتری عقلانی نژادی را نمی‌توان با علم امروز (زمان نگارش) اثبات کرد.", "en": "The book holds that no intellectual superiority or inferiority of one race over another can be established by science (as of writing).", "nl": "The book holds that no intellectual superiority or inferiority of one race over another can be established by science (as of writing)."}, "sources": ["src:429130b6be"], "flags": []}, {"text": {"fa": "نویسنده گوبینو را مثال می‌آورد: او نابرابری نژادها را کیفی می‌دید و فساد جامعه را از آمیختگی نژادها می‌دانست؛ لوی‌استروس این را همان خلط زیست‌شناسی با فرهنگ می‌شمارد.", "en": "He takes Gobineau as the example: Gobineau saw races as qualitatively unequal and blamed social decline on racial mixing; Lévi-Strauss calls this a confusion of biology with culture.", "nl": "He takes Gobineau as the example: Gobineau saw races as qualitatively unequal and blamed social decline on racial mixing; Lévi-Strauss calls this a confusion of biology with culture."}, "sources": ["src:429130b6be"], "flags": []}, {"text": {"fa": "او هشدار می‌دهد که اثبات «سهم ویژهٔ هر گروه نژادی در تمدن» هم دوباره نظریهٔ نژادی را از در پشتی وارد می‌کند، چون ویژگی فرهنگی را به زیست‌شناسی گره می‌زند.", "en": "He warns that proving a 'special contribution of each racial group' to civilisation re-admits racial theory by the back door, since it ties culture to biology.", "nl": "He warns that proving a 'special contribution of each racial group' to civilisation re-admits racial theory by the back door, since it ties culture to biology."}, "sources": ["src:429130b6be"], "flags": []}, {"text": {"fa": "استدلال اصلی او این است که تفاوت فرهنگ‌ها را باید با تاریخ، تماس و همکاری جوامع توضیح داد، نه با سرشت زیستی.", "en": "His main claim is that cultural differences must be explained by history, contact and cooperation among societies, not by biological nature.", "nl": "His main claim is that cultural differences must be explained by history, contact and cooperation among societies, not by biological nature."}, "sources": ["src:429130b6be"], "flags": []}, {"text": {"fa": "دیدگاه رایج امروز: اجماع زیست‌شناسی و ژنتیک جمعیت نیز دسته‌بندی‌های «نژادی» کلاسیک را مقوله‌های زیستی دقیق نمی‌داند؛ تنوع ژنتیکی انسان پیوسته است و بیشترِ آن درون هر جمعیت است. این از کتاب نیست و به دانش روز بازمی‌گردد.", "en": "Current mainstream view: biology and population genetics do not treat classic 'racial' categories as sharp biological kinds; human genetic variation is largely continuous and mostly lies within populations. This is not from the book but from present-day science.", "nl": "Current mainstream view: biology and population genetics do not treat classic 'racial' categories as sharp biological kinds; human genetic variation is largely continuous and mostly lies within populations. This is not from the book but from present-day science."}, "sources": ["src:2e6fa65e13"], "flags": ["editor-note"]}], "links": [{"to": "tabar:race-biology", "rel": "see-also", "note": {"fa": "آیا «نژاد» مقولهٔ زیست‌شناختی است؟", "en": "Is race a biological category?", "nl": "Is race a biological category?"}}, {"to": "tabar:eugenics", "rel": "see-also", "note": {"fa": "به‌نژادی و تاریخ تاریک ژنتیک", "en": "Eugenics", "nl": "Eugenics"}}, {"to": "tabar:genetic-essentialism", "rel": "see-also", "note": {"fa": "ذات‌گرایی ژنتیکی", "en": "Genetic essentialism", "nl": "Genetic essentialism"}}, {"to": "soc:culture-concept-functions", "rel": "bridges", "note": {"fa": "مفهوم فرهنگ", "en": "The concept of culture", "nl": "The concept of culture"}}], "people": ["core:claude-l-vi-strauss", "core:arthur-de-gobineau"], "sources": ["src:2e6fa65e13", "src:429130b6be"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:darwin-natural-selection", "kind": "concept", "title": {"fa": "انتخاب طبیعی: هستهٔ استدلال داروین", "en": "Natural selection: the core of Darwin's argument", "nl": "Natuurlijke selectie: de kern van Darwins betoog"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "اگر جانداران کمی با هم فرق داشته باشند، فرق‌ها تا حدی به فرزندان برسد، و همه نتوانند زنده بمانند، آنگاه ویژگی‌های سودمند به‌طور میانگین در نسل‌ها بیشتر می‌شوند. داروین این فرایند را «انتخاب طبیعی» نامید و گفت با زمان بسیار طولانی می‌تواند ساختارها و گونه‌های تازه بسازد و همهٔ جانداران را به نیاکان مشترک برساند.", "en": "If organisms differ slightly, some differences are inherited, and not all can survive, then useful traits become more common over generations. Darwin called this natural selection and argued that over very long times it can build new structures and species and link all life to common ancestors.", "nl": "Als organismen licht verschillen, sommige verschillen erfelijk zijn en niet alle individuen overleven, worden nuttige eigenschappen algemener. Darwin noemde dit natuurlijke selectie en betoogde dat het over lange tijd nieuwe structuren en soorten kan vormen."}, "points": [{"text": {"fa": "استدلال سه پایه دارد: (۱) افراد یک جمعیت از نظر ویژگی‌ها فرق دارند؛ (۲) بخشی از این فرق‌ها به فرزندان می‌رسد؛ (۳) بیش از توان محیط زاده می‌شوند. نتیجه: کسانی که ویژگی‌هایشان در آن محیط کمی سودمندتر است، به‌طور میانگین بیشتر فرزند می‌گذارند و ویژگی‌ها در جمعیت جابه‌جا می‌شود.", "en": "The argument has three legs: (1) individuals in a population differ; (2) some of these differences are inherited; (3) more are born than the environment can support. Result: those whose traits are slightly more useful in that setting leave more offspring on average, and the population shifts.", "nl": "The argument has three legs: (1) individuals in a population differ; (2) some of these differences are inherited; (3) more are born than the environment can support. Result: those whose traits are slightly more useful in that setting leave more offspring on average, and the population shifts."}, "sources": ["src:84786f7bfa"], "flags": []}, {"text": {"fa": "داروین انتخاب طبیعی را «دستی ناظر» می‌داند که هر روز و هر ساعت در سراسر جهان تفاوت‌های کوچک را بررسی می‌کند؛ ولی تأکید می‌کند که این فرایند کور و بدون هدف از پیش‌تعیین‌شده است و لزوماً جانداران را «پیشرفته‌تر» نمی‌کند، فقط با محیطشان سازگارتر می‌کند. او همچنین از «درخت زندگی» و شاخه‌شدن گونه‌ها به‌جای یک نردبان خطی سخن می‌گوید.", "en": "Darwin pictures natural selection as constantly scrutinising small differences everywhere, but it has no preset goal and does not necessarily make organisms 'higher'; it only fits them better to their surroundings. He speaks of a 'tree of life' with branching lineages rather than a straight ladder.", "nl": "Darwin pictures natural selection as constantly scrutinising small differences everywhere, but it has no preset goal and does not necessarily make organisms 'higher'; it only fits them better to their surroundings. He speaks of a 'tree of life' with branching lineages rather than a straight ladder."}, "sources": ["src:84786f7bfa"], "flags": []}, {"text": {"fa": "تأیید: انتخاب طبیعی امروز مستقیم دیده شده است، مثلاً تغییر اندازهٔ نوک سهره‌های گالاپاگوس طی خشکسالی‌ها (پژوهش پیتر و رزمری گرانت) و مقاومت باکتری‌ها به آنتی‌بیوتیک. ژنتیک جمعیت در قرن بیستم (فیشر، رایت، هالدین) نشان داد انتخاب با وراثت مندلی هماهنگ است («ترکیب نوین»).", "en": "Confirmed: natural selection has been observed directly, for example in Galápagos finch beak sizes across droughts (the Grants' long-term study) and in antibiotic resistance of bacteria. Twentieth-century population genetics (Fisher, Wright, Haldane) showed selection fits Mendelian heredity (the 'modern synthesis').", "nl": "Confirmed: natural selection has been observed directly, for example in Galápagos finch beak sizes across droughts (the Grants' long-term study) and in antibiotic resistance of bacteria. Twentieth-century population genetics (Fisher, Wright, Haldane) showed selection fits Mendelian heredity (the 'modern synthesis')."}, "sources": ["src:9bfbba7cbd"], "flags": []}, {"text": {"fa": "اصلاح مهم: انتخاب تنها نیروی تکامل نیست. رانش ژنتیکی (تصادف در جمعیت‌های کوچک)، جریان ژن و جهش هم بر ترکیب ژنی اثر دارند؛ بخش بزرگی از تغییر در سطح مولکولی خنثی است (نظریهٔ خنثای کیمورا، ۱۹۶۸). همچنین هر ویژگی لزوماً «سازگاری» نیست؛ گولد و لوونتین (۱۹۷۹) از «تبیین‌های سازگاری‌گرایانه»ی بی‌پشتوانه انتقاد کردند.", "en": "Important correction: selection is not the only evolutionary force. Genetic drift (chance in small populations), gene flow and mutation also shape gene pools; much molecular change is neutral (Kimura's neutral theory, 1968). Nor is every trait an adaptation; Gould and Lewontin (1979) criticised unsupported 'just-so' adaptationist stories.", "nl": "Important correction: selection is not the only evolutionary force. Genetic drift (chance in small populations), gene flow and mutation also shape gene pools; much molecular change is neutral (Kimura's neutral theory, 1968). Nor is every trait an adaptation; Gould and Lewontin (1979) criticised unsupported 'just-so' adaptationist stories."}, "sources": ["src:a2a563ebeb", "src:992abe0681"], "flags": ["editor-note"]}], "links": [{"to": "tabar:mutation-selection-drift", "rel": "explains", "note": {"fa": "جهش، انتخاب و رانش (چارچوب امروزی)", "en": "Mutation, selection and drift (modern framework)", "nl": "Mutation, selection and drift (modern framework)"}}, {"to": "tabar:human-evolution", "rel": "part-of", "note": {"fa": "تکامل انسان", "en": "Human evolution", "nl": "Human evolution"}}, {"to": "tabar:lactase-gene-culture", "rel": "see-also", "note": {"fa": "تداوم لاکتاز؛ نمونه‌ای از انتخاب در انسان", "en": "Lactase persistence: an example of selection in humans", "nl": "Lactase persistence: an example of selection in humans"}}, {"to": "tabar:race-biology", "rel": "see-also", "note": {"fa": "آیا «نژاد» مقولهٔ زیست‌شناختی است؟", "en": "Is race a biological category?", "nl": "Is race a biological category?"}}], "people": ["core:charles-darwin", "core:alfred-russel-wallace", "core:ronald-a-fisher"], "sources": ["src:84786f7bfa", "src:992abe0681", "src:9bfbba7cbd", "src:a2a563ebeb"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:iq-heritability-debate", "kind": "concept", "title": {"fa": "بحث وراثت‌پذیری هوش و اثر فلین", "en": "The IQ heritability debate and the Flynn effect", "nl": "Het debat over erfelijkheid van IQ en het Flynn-effect"}, "aliases": [], "parent": "tabar:behavior-genetics", "field": "tabar:behavior-genetics", "summary": {"fa": "از مقالهٔ جنجالی جنسن (۱۹۶۹) تا اثر فلین: هوش درون جمعیت‌ها بسیار وراثت‌پذیر است و با این حال نمره‌های هوش در یک قرن حدود سه نمره در دهه بالا رفت. این دو واقعیت با هم سازگارند و درس مهمی دربارهٔ وراثت‌پذیری می‌دهند.", "en": "From Jensen's controversial 1969 article to the Flynn effect: IQ within populations is highly heritable, and yet IQ scores rose about three points per decade over a century. Both facts are compatible and teach an important lesson about heritability.", "nl": "Van Jensens omstreden artikel uit 1969 tot het Flynn-effect: IQ is binnen populaties sterk erfelijk, en toch stegen IQ-scores een eeuw lang met zo'n drie punten per decennium. Beide feiten zijn verenigbaar en leren iets belangrijks over erfelijkheid."}, "points": [{"text": {"fa": "جنسن (۱۹۶۹) استدلال کرد وراثت‌پذیری هوش حدود ۰٫۸ است و برنامه‌های جبرانی آموزشی اثر کمی داشته‌اند؛ و فرضیهٔ سهم ژنتیکی در تفاوت میانگین گروه‌های نژادی را مطرح کرد. مقاله یکی از پرمناقشه‌ترین متون تاریخ روان‌شناسی شد.", "en": "Jensen (1969) argued that IQ heritability is about 0.8 and compensatory education had little effect, and raised the hypothesis of a genetic share in mean differences between racial groups. The article became one of the most contested texts in psychology.", "nl": "Jensen (1969) argued that IQ heritability is about 0.8 and compensatory education had little effect, and raised the hypothesis of a genetic share in mean differences between racial groups. The article became one of the most contested texts in psychology."}, "sources": ["src:c25a1254f7"], "flags": ["contested"]}, {"text": {"fa": "خطای منطقی مرکزی که منتقدان نشان دادند: وراثت‌پذیری بالا درون گروه هیچ چیز دربارهٔ علت تفاوت بین گروه‌ها نمی‌گوید (مثال بذرهای یکسان در دو خاک متفاوت).", "en": "The central logical error critics pointed out: high heritability within a group says nothing about the cause of differences between groups (the same seeds in two different soils).", "nl": "The central logical error critics pointed out: high heritability within a group says nothing about the cause of differences between groups (the same seeds in two different soils)."}, "sources": ["src:ba8f3ee8f4"], "flags": []}, {"text": {"fa": "اثر فلین: در ۱۴ کشور نمرهٔ هوش خام در یک نسل ۵ تا ۲۵ نمره بالا رفت؛ فراتحلیل ۲۰۱۵ (۴ میلیون نفر، ۳۱ کشور): حدود ۳ نمره در دهه، با کند شدن در دهه‌های اخیر. ژن‌ها در یک نسل عوض نمی‌شوند؛ پس این محیط است.", "en": "The Flynn effect: in 14 nations raw IQ scores rose 5 to 25 points in a generation; a 2015 meta-analysis (4 million people, 31 countries): about 3 points per decade, slowing recently. Genes do not change in a generation; this is environment.", "nl": "The Flynn effect: in 14 nations raw IQ scores rose 5 to 25 points in a generation; a 2015 meta-analysis (4 million people, 31 countries): about 3 points per decade, slowing recently. Genes do not change in a generation; this is environment."}, "sources": ["src:ba9f6ce267", "src:81bc3ff922"], "flags": []}, {"text": {"fa": "جمع‌بندی امروزی: وراثت‌پذیری هوش در بزرگسالی حدود ۰٫۵ تا ۰٫۸ و در کودکی کمتر است؛ نمره‌های چندژنی هنوز فقط چند درصد را پیش‌بینی می‌کنند؛ و تفاوت میانگین گروه‌ها توضیح ژنتیکی اثبات‌شده ندارد.", "en": "Current summary: adult IQ heritability is about 0.5 to 0.8 and lower in childhood; polygenic scores still predict only a few percent; and mean differences between groups have no demonstrated genetic explanation.", "nl": "Current summary: adult IQ heritability is about 0.5 to 0.8 and lower in childhood; polygenic scores still predict only a few percent; and mean differences between groups have no demonstrated genetic explanation."}, "sources": ["src:5cdd7ce079", "src:65b756684e"], "flags": []}], "links": [{"to": "tabar:gene-environment", "rel": "prerequisite", "note": {"fa": "تعامل ژن و محیط", "en": "Gene–environment interplay", "nl": "Gene–environment interplay"}}, {"to": "tabar:race-biology", "rel": "see-also", "note": {"fa": "آیا نژاد مقولهٔ زیستی است؟", "en": "Is race a biological category?", "nl": "Is race a biological category?"}}, {"to": "psy:p-psychometrics", "rel": "bridges", "note": {"fa": "روان‌سنجی هوش در ویکی روان", "en": "Psychometrics of intelligence in the psychology wiki", "nl": "Psychometrics of intelligence in the psychology wiki"}}], "people": ["core:arthur-jensen", "core:james-flynn", "core:eric-turkheimer"], "sources": ["src:5cdd7ce079", "src:65b756684e", "src:81bc3ff922", "src:ba8f3ee8f4", "src:ba9f6ce267", "src:c25a1254f7"], "booklets": [], "origin": "course:arthur-jensen", "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:t1-europe-three-ancestry-layers", "kind": "concept", "title": {"fa": "سه لایهٔ تبار اروپاییان: شکارچیان، کشاورزان و دامداران استپ", "en": "Three ancestry layers of Europeans: hunter-gatherers, farmers and steppe herders", "nl": "Drie afstammingslagen van Europeanen: jagers-verzamelaars, boeren en steppeherders"}, "aliases": [], "parent": "tabar:population-genetics", "field": "tabar:population-genetics", "summary": {"fa": "بر پایهٔ DNA باستانی که کتاب از آن بهره می‌برد، اروپاییان امروز آمیزه‌ای از سه موج جمعیتی‌اند که هر کدام ژنتیک و فرهنگ تازه‌ای آوردند.", "en": "Drawing on ancient DNA, the book presents today's Europeans as a blend of three population waves, each bringing new genetics and culture.", "nl": "Op basis van oud DNA zijn Europeanen een mengsel van drie golven."}, "points": [{"text": {"fa": "نخستین انسان‌های خردمند اروپا (کرومانیون‌ها و فرهنگ اورینیاکی، حدود ۴۵ هزار سال پیش به گفتهٔ نویسنده) شکارچی‌گردآورنده بودند؛ بیشتر شاخه‌های پدری آن‌ها در اروپا کم‌رنگ یا نابود شد اما برخی تبارهای مادری مانند U5 مدت‌ها ماندگار بودند.", "en": "Europe's first modern humans (Cro-Magnons and the Aurignacian culture, about 45,000 years ago by the author's dating) were hunter-gatherers; most of their paternal lines faded or vanished in Europe, but some maternal lines such as U5 persisted for a long time.", "nl": "Europe's first modern humans (Cro-Magnons and the Aurignacian culture, about 45,000 years ago by the author's dating) were hunter-gatherers; most of their paternal lines faded or vanished in Europe, but some maternal lines such as U5 persisted for a long time."}, "sources": ["src:93456bf0b8"], "flags": []}, {"text": {"fa": "«مرد چدار» از سامرست انگلستان (حدود ۹ هزار سال پیش) هاپلوگروه U5a داشت و بنا بر پژوهشی که کتاب نقل می‌کند پوست تیره و موی فرفری سیاه داشته؛ حدود ده درصد از ویژگی‌های ژنتیکی بریتانیایی‌های امروز به این گروه برمی‌گردد.", "en": "'Cheddar Man' from Somerset (about 9,000 years ago) carried haplogroup U5a and, according to the study the book cites, had dark skin and dark curly hair; roughly ten percent of present British genetic makeup traces to this group.", "nl": "'Cheddar Man' from Somerset (about 9,000 years ago) carried haplogroup U5a and, according to the study the book cites, had dark skin and dark curly hair; roughly ten percent of present British genetic makeup traces to this group."}, "sources": ["src:93456bf0b8"], "flags": []}, {"text": {"fa": "حدود ۹ هزار سال پیش موج کشاورزان از آسیای غربی آغاز شد و شیوهٔ یکجانشینی و دامداری را به اروپا آورد. نزدیک‌ترین ژنوم امروزی به این کشاورزان نخستین ساکنان ساردینیا هستند و این کشاورزان هنوز ژن‌های گوارش شیر را نداشتند.", "en": "Around 9,000 years ago a wave of farmers from western Asia began and brought settled farming and herding to Europe. The closest modern genome to these first farmers is found in Sardinia, and they still lacked the genes for digesting milk as adults.", "nl": "Around 9,000 years ago a wave of farmers from western Asia began and brought settled farming and herding to Europe. The closest modern genome to these first farmers is found in Sardinia, and they still lacked the genes for digesting milk as adults."}, "sources": ["src:93456bf0b8"], "flags": []}, {"text": {"fa": "دور سوم حدود ۲۵۰۰ پیش از میلاد از استپ‌های میان دریای سیاه و خزر برخاست (فرهنگ یمنا و سپس ریسمانی‌خمره‌ای). نویسنده آن را با گسترش هندواروپایی‌زبانان و هاپلوگروه‌های R1a و R1b پیوند می‌دهد؛ این پیوند با DNA باستانی همخوان است.", "en": "The third wave rose around 2500 BCE from the steppes between the Black and Caspian Seas (Yamnaya, then Corded Ware). The author links it with the spread of Indo-European speakers and haplogroups R1a and R1b; this link agrees with ancient DNA.", "nl": "The third wave rose around 2500 BCE from the steppes between the Black and Caspian Seas (Yamnaya, then Corded Ware). The author links it with the spread of Indo-European speakers and haplogroups R1a and R1b; this link agrees with ancient DNA."}, "sources": ["src:93456bf0b8", "src:553bedc591"], "flags": []}, {"text": {"fa": "نویسنده شاخه‌های R1b و R1a را به‌طور مستقیم با سلت‌ها، ایتالیایی‌ها، ژرمن‌ها و اسلاوها برابر می‌گیرد؛ این برابری هاپلوگروه با زبان یا قوم بیش از حد ساده است و داده‌های جدید روابط پیچیده‌تر و آمیختگی‌های بیشتری را نشان می‌دهند.", "en": "The author equates specific R1b and R1a branches directly with Celts, Italics, Germanic and Slavic peoples; equating a haplogroup with a language or people is too simple, and newer data show more complex relationships and more mixing.", "nl": "The author equates specific R1b and R1a branches directly with Celts, Italics, Germanic and Slavic peoples; equating a haplogroup with a language or people is too simple, and newer data show more complex relationships and more mixing."}, "sources": [], "flags": ["contested", "editor-note"]}], "links": [{"to": "tabar:ancient-dna", "rel": "explains", "note": {"fa": "داده‌های باستانی پشتوانهٔ این الگوی سه‌لایه‌اند", "en": "Ancient DNA underpins this three-layer pattern", "nl": "Ancient DNA underpins this three-layer pattern"}}, {"to": "tabar:steppe-indo-iranian", "rel": "see-also", "note": {"fa": "تبار استپی", "en": "Steppe ancestry", "nl": "Steppe ancestry"}}, {"to": "tabar:lactase-gene-culture", "rel": "see-also", "note": {"fa": "گوارش شیر و هم‌تکاملی", "en": "Milk digestion and coevolution", "nl": "Milk digestion and coevolution"}}, {"to": "tabar:zagros-neolithic", "rel": "contrasts", "note": {"fa": "کشاورزان نخستین اروپا اصلاً آناتولی‌تبارند", "en": "Europe's first farmers were mainly Anatolian-descended", "nl": "Europe's first farmers were mainly Anatolian-descended"}}], "people": [], "sources": ["src:553bedc591", "src:93456bf0b8"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:sex-bias-inequality-genome", "kind": "concept", "title": {"fa": "جنسیت و قدرت در ژنوم: چرا Y و X تاریخ نابرابری را می‌گویند", "en": "Sex and power in the genome: how Y and X record the history of inequality", "nl": "Sekse en macht in het genoom: hoe Y en X de geschiedenis van ongelijkheid vastleggen"}, "aliases": [], "parent": "tabar:population-genetics", "field": "tabar:population-genetics", "summary": {"fa": "چون مردان قدرتمند می‌توانند فرزندان بسیار بیشتری از زنان داشته باشند، مقایسهٔ کروموزوم Y، دی‌ان‌ای میتوکندری و کروموزوم X با بقیهٔ ژنوم می‌تواند نابرابری جنسیتی و طبقاتی گذشته را آشکار کند. رایش نمونه‌هایی از برده‌داری در آمریکا تا گسترش یامنایا می‌آورد. ولی این روش گرایش‌هایی را نشان می‌دهد نه نیات یا خشونت افراد، و بسیاری از تفسیرهای تاریخی (مثل ژنگیزخان) حدسی‌اند.", "en": "Because powerful men can have many more children than women, comparing the Y chromosome, mitochondrial DNA and X chromosome with the rest of the genome can reveal past gender and class inequality. Reich gives examples from slavery in the Americas to the Yamnaya expansion. But the method shows tendencies, not individual intent or violence, and several historical interpretations (such as Genghis Khan) are speculative.", "nl": "Omdat machtige mannen veel meer kinderen kunnen krijgen dan vrouwen, kan vergelijking van Y-chromosoom, mtDNA en X-chromosoom met de rest van het genoom ongelijkheid in het verleden zichtbaar maken. De methode toont tendensen, geen individuele intenties of geweld, en veel historische duidingen zijn speculatief."}, "points": [{"text": {"fa": "اصل کار: زنان دو نسخه از X و هر مرد یک نسخه دارد؛ پس X بیشتر تاریخ زنان را نشان می‌دهد و Y فقط مردان را. اگر نسبت تبار گروهی روی X با بقیهٔ ژنوم فرق کند، آمیزش جنسیت‌دار بوده است. در آفریقایی‌تبارهای آمریکا میانگین تبار اروپایی در بیشتر ژنوم ۲۷ و روی X ۲۳ درصد است؛ بر آن اساس تبار اروپایی از سمت مردان حدود چهار برابر زنان بود.", "en": "Principle: women carry two X chromosomes and men one, so X reflects more of female history, while Y reflects men only. If a group's ancestry proportion on the X differs from the rest of the genome, mixing was sex-biased. In African Americans average European ancestry is 27 percent in most of the genome but 23 percent on the X; on this basis European male contribution was about four times the female one.", "nl": "Principle: women carry two X chromosomes and men one, so X reflects more of female history, while Y reflects men only. If a group's ancestry proportion on the X differs from the rest of the genome, mixing was sex-biased. In African Americans average European ancestry is 27 percent in most of the genome but 23 percent on the X; on this basis European male contribution was about four times the female one."}, "sources": ["src:a4f00f41ff", "src:3809330727"], "flags": []}, {"text": {"fa": "«خوشهٔ ستاره‌ای» Y: حدود ۸ درصد مردان قلمرو سابق مغولان نوع Y مشابهی دارند که به ۱۳۰۰ تا ۷۰۰ سال پیش برمی‌گردد. این را به ژنگیزخان و خانواده‌اش نسبت داده‌اند. توجه: انتساب به یک فرد معین حدسی است؛ دقیق‌تر این است که یک تبار مردانه با نفوذ ناگهانی رشد کرد.", "en": "Y 'star clusters': about 8 percent of men in the former Mongol territory carry a similar Y type dating to 1,300–700 years ago, which has been attributed to Genghis Khan and his family. Note: attribution to a particular person is speculative; more precisely, one male lineage expanded abruptly with social power.", "nl": "Y 'star clusters': about 8 percent of men in the former Mongol territory carry a similar Y type dating to 1,300–700 years ago, which has been attributed to Genghis Khan and his family. Note: attribution to a particular person is speculative; more precisely, one male lineage expanded abruptly with social power."}, "sources": ["src:a4f00f41ff", "src:14b8d34102"], "flags": ["editor-note"]}, {"text": {"fa": "تنگنای Y در عصر مفرغ: در بسیاری از مناطق جهان حدود ۵ هزار سال پیش تنوع کروموزوم Y ناگهان کاهش یافت، در حالی که کل ژنوم رشد جمعیت را نشان می‌دهد. رایش می‌گوید این با پیدایش جوامع طبقاتی هم‌زمان است: چند مرد با ثروت و قدرت و بازماندگان پسر خود Y را غالب کردند. توضیح دیگر (مثلاً شبکه‌های پدرتباری و انتقال فرهنگی) هم پیشنهاد شده و بحث باز است.", "en": "Bronze Age Y bottleneck: in many regions Y-chromosome diversity fell abruptly around 5,000 years ago while the whole genome shows population growth. Reich links this to the rise of stratified societies: a few men with wealth and power and sons who inherited their position made their Y types dominant. Other explanations (e.g. patrilineal networks and cultural transmission) have been proposed and the debate is open.", "nl": "Bronze Age Y bottleneck: in many regions Y-chromosome diversity fell abruptly around 5,000 years ago while the whole genome shows population growth. Reich links this to the rise of stratified societies: a few men with wealth and power and sons who inherited their position made their Y types dominant. Other explanations (e.g. patrilineal networks and cultural transmission) have been proposed and the debate is open."}, "sources": ["src:a4f00f41ff", "src:c66dbb344a"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "گسترش یامنایا: در ایبری تقریباً ۹۰ درصد مردان دارای تبار استپی Y استپی داشتند در حالی که تبار استپی کل جمعیت کمتر بود. پژوهش‌های روی کروموزوم X در کوچ نوسنگی-عصر مفرغ هم نشان داد در مهاجرت استپی نسبت مردان به زنان بسیار بالا بوده است (گلدبرگ و همکاران ۲۰۱۷). ولی «مردانه بودن» الزاماً به معنای جنگ و ربایش نیست؛ ازدواج، پیمان یا پایگاه اجتماعی بالا هم ممکن است. رایش گسترش را «کاملاً مسالمت‌آمیز» نمی‌داند؛ این تفسیر خود اوست.", "en": "Yamnaya expansion: in Iberia about 90 percent of males with steppe ancestry carried steppe-type Y chromosomes, while steppe ancestry in the population overall was lower. Work on the X chromosome likewise showed a strongly male-biased steppe migration (Goldberg et al. 2017). But male bias does not necessarily mean war and abduction; marriage, alliances or high status could also produce it. Reich does not regard the expansion as entirely peaceful; that is his own interpretation.", "nl": "Yamnaya expansion: in Iberia about 90 percent of males with steppe ancestry carried steppe-type Y chromosomes, while steppe ancestry in the population overall was lower. Work on the X chromosome likewise showed a strongly male-biased steppe migration (Goldberg et al. 2017). But male bias does not necessarily mean war and abduction; marriage, alliances or high status could also produce it. Reich does not regard the expansion as entirely peaceful; that is his own interpretation."}, "sources": ["src:a4f00f41ff", "src:69044afa96", "src:f0cf216e27"], "flags": ["contested", "editor-note"]}], "links": [{"to": "tabar:haplogroups", "rel": "explains", "note": {"fa": "کروموزوم Y و هاپلوگروه‌ها", "en": "Y chromosome and haplogroups", "nl": "Y chromosome and haplogroups"}}, {"to": "tabar:europe-three-streams-yamnaya", "rel": "see-also", "note": {"fa": "گسترش یامنایا در اروپا", "en": "Yamnaya expansion in Europe", "nl": "Yamnaya expansion in Europe"}}, {"to": "tabar:genetic-essentialism", "rel": "contrasts", "note": {"fa": "خطر ذات‌گرایی ژنتیکی در تفسیر تاریخ", "en": "Risk of genetic essentialism in reading history", "nl": "Risk of genetic essentialism in reading history"}}, {"to": "tabar:common-ancestors", "rel": "see-also", "note": {"fa": "چرا همه خویشاوندیم", "en": "Why we are all related", "nl": "Why we are all related"}}], "people": ["core:katarzyna-bryc", "core:chris-tyler-smith", "core:orlando-patterson"], "sources": ["src:14b8d34102", "src:3809330727", "src:69044afa96", "src:a4f00f41ff", "src:c66dbb344a", "src:f0cf216e27"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:brain-body-size-climate", "kind": "concept", "title": {"fa": "اقلیم و اندازهٔ مغز و بدن در جنس انسان (هوموها)", "en": "Climate and brain and body size in the genus Homo", "nl": "Klimaat en brein- en lichaamsgrootte in het geslacht Homo"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "مانوئل ویل و همکارانش ۲۰۸ فسیل انسان‌سان از یک میلیون سال گذشته را با مدل اقلیمی سنجیدند. دما اندازهٔ بدن را در همهٔ گونه‌ها خوب پیش‌بینی کرد (قاعدهٔ برگمان)، اما اقلیم فقط بخشی از الگوی اندازهٔ مغز را توضیح داد.", "en": "Manuel Will and colleagues combined 208 Homo fossils from the last million years with a climate model. Temperature predicted body size well across taxa (Bergmann's rule), but climate explained only part of the pattern in brain size.", "nl": "Will en collega's combineerden 208 Homo-fossielen van het laatste miljoen jaar met een klimaatmodel: temperatuur voorspelde lichaamsgrootte goed (regel van Bergmann), maar verklaarde slechts deels de hersengrootte."}, "points": [{"text": {"fa": "پژوهش برای نخستین بار یک مجموعهٔ بزرگ فسیل (۲۰۸ نمونه) با مختصات جغرافیایی را به یک شبیه‌ساز مدل اقلیمی جهانی گره می‌زند تا برای هر فسیل مقدارهای محیطی همان زمان و مکان به دست آید، و فرضیه‌ها را با آمار رسمی می‌آزماید.", "en": "For the first time, a large fossil dataset (n=208) with spatial coordinates is linked to a global climate-model emulator so each fossil gets the environment of its own time and place, and hypotheses are tested in a formal statistical framework.", "nl": "For the first time, a large fossil dataset (n=208) with spatial coordinates is linked to a global climate-model emulator so each fossil gets the environment of its own time and place, and hypotheses are tested in a formal statistical framework."}, "sources": ["src:9d23cb01bc"], "flags": []}, {"text": {"fa": "دما اندازهٔ بدن را در همهٔ گونه‌های بررسی‌شدهٔ هومو مطابق قاعدهٔ برگمان پیش‌بینی می‌کند (گرم‌تر، بدن کوچک‌تر)؛ نویسندگان آن را احتمالاً اثر مستقیم اقلیم بر فیزیولوژی می‌دانند.", "en": "Temperature predicted body size in all studied Homo taxa following Bergmann's rule (warmer, smaller bodies), which the authors consider likely a direct effect of climate on physiology.", "nl": "Temperature predicted body size in all studied Homo taxa following Bergmann's rule (warmer, smaller bodies), which the authors consider likely a direct effect of climate on physiology."}, "sources": ["src:9d23cb01bc"], "flags": []}, {"text": {"fa": "تولید اولیهٔ خالص (فراوانی گیاه) و تغییرپذیری درازمدت بارش اندازهٔ مغز را در انسان‌های باستانی خوب پیش‌بینی می‌کرد، اما در انسان امروزی نه. نویسندگان این اثر را غیرمستقیم می‌دانند، مثلاً از راه توان شناختی و احتمال انقراض.", "en": "Net primary productivity and long-term variability of precipitation predicted brain size in archaic humans but not in modern humans. The authors think these effects were indirect, acting for example through cognitive ability and extinction risk.", "nl": "Net primary productivity and long-term variability of precipitation predicted brain size in archaic humans but not in modern humans. The authors think these effects were indirect, acting for example through cognitive ability and extinction risk."}, "sources": ["src:9d23cb01bc"], "flags": []}, {"text": {"fa": "خود نویسندگان تأکید می‌کنند که اقلیم بخشی از الگوی زمانی را توضیح می‌دهد و علت‌های دیگر (جمعیت‌شناختی، اجتماعی، تغذیه‌ای، فناورانه) هم کنار هم عمل کرده‌اند. «اقلیم، مغز را بزرگ کرد» نتیجهٔ این پژوهش نیست. خوانندگان باید بدانند که این فقط چکیده‌ای کوتاه است و مدل، پیش‌فرض‌ها و عدم‌قطعیت‌ها در مقالهٔ کامل بررسی می‌شود.", "en": "The authors stress that climate explains only part of the temporal pattern and that demographic, social, dietary and technological causes also interacted. 'Climate made brains bigger' is not this study's conclusion. This is only a short abstract; the model, assumptions and uncertainties belong to the full paper.", "nl": "The authors stress that climate explains only part of the temporal pattern and that demographic, social, dietary and technological causes also interacted. 'Climate made brains bigger' is not this study's conclusion. This is only a short abstract; the model, assumptions and uncertainties belong to the full paper."}, "sources": ["src:9d23cb01bc"], "flags": ["contested", "editor-note"]}], "links": [{"to": "tabar:out-of-africa", "rel": "see-also", "note": {"fa": "خاستگاه آفریقایی انسان خردمند", "en": "The African origin of Homo sapiens", "nl": "The African origin of Homo sapiens"}}, {"to": "tabar:social-brain-evolution", "rel": "contrasts", "note": {"fa": "تبیین اجتماعی تکامل مغز", "en": "The social explanation of brain evolution", "nl": "The social explanation of brain evolution"}}, {"to": "tabar:neanderthal-admixture", "rel": "see-also", "note": {"fa": "نئاندرتال‌ها و دنیسوواها", "en": "Neanderthals and Denisovans", "nl": "Neanderthals and Denisovans"}}], "people": ["core:manuel-will", "core:mario-krapp", "core:jay-t-stock", "core:andrea-manica"], "sources": ["src:9d23cb01bc"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:caste-endogamy-founder-effect", "kind": "concept", "title": {"fa": "درون‌همسری، کاست و «اثر بنیان‌گذار» در هند", "en": "Endogamy, caste and the 'founder effect' in India", "nl": "Endogamie, kaste en het 'founder-effect' in India"}, "aliases": [], "parent": "tabar:medical-genetics", "field": "tabar:medical-genetics", "summary": {"fa": "رایش نشان می‌دهد بسیاری از گروه‌های هندی (جاتی) از جمعیت‌های کوچک بنیان‌گذار پدید آمده و هزاران سال از هم جدا مانده‌اند. در نتیجه تفاوت ژنتیکی گروه‌های همسایه گاه چند برابر تفاوت شمال و جنوب اروپاست و بیماری‌های ارثی نادر در هر گروه شایع می‌شود. این تصویر پزشکی کاربردی دارد، اما پرسش «درون‌همسری در هند چقدر قدیمی است؟» میان مورخان محل بحث است.", "en": "Reich shows that many Indian groups (jati) arose from small founder populations and have stayed apart for thousands of years. As a result, genetic differences between neighbouring groups can be several times larger than between northern and southern Europeans, and rare inherited diseases become frequent in particular groups. The picture has practical medical uses, but how old strict endogamy in India is remains debated among historians.", "nl": "Reich toont dat veel Indiase groepen (jati) uit kleine stichterpopulaties zijn ontstaan en duizenden jaren gescheiden bleven. Daardoor kunnen genetische verschillen tussen buurgroepen groter zijn dan tussen Noord- en Zuid-Europeanen en worden zeldzame erfelijke ziekten in bepaalde groepen frequent. Hoe oud strikte endogamie is, blijft omstreden onder historici."}, "points": [{"text": {"fa": "اندازه‌گیری: تفاوت ژنتیکی جاتی‌های همسایه دست‌کم سه برابر تفاوت گروه‌های اروپایی در همان فاصلهٔ جغرافیایی است. رایش از طول قطعه‌های دی‌ان‌ای یکسان میان دو فرد درون یک گروه می‌فهمد که حدود یک‌سوم گروه‌های هندی تنگنای جمعیتی شدیدتر یا برابر با فنلاندی‌ها و یهودیان اشکنازی داشته‌اند.", "en": "Measurement: genetic differences between neighbouring jati are at least three times those between European groups at similar geographic distances. From the length of identical DNA stretches shared by two people in one group, Reich infers that about a third of Indian groups went through population bottlenecks as strong as or stronger than those of Finns and Ashkenazi Jews.", "nl": "Measurement: genetic differences between neighbouring jati are at least three times those between European groups at similar geographic distances. From the length of identical DNA stretches shared by two people in one group, Reich infers that about a third of Indian groups went through population bottlenecks as strong as or stronger than those of Finns and Ashkenazi Jews."}, "sources": ["src:a4f00f41ff", "src:bd34217cdc"], "flags": []}, {"text": {"fa": "نمونه: گروه وَیسیا در آندرا پرادش، با حدود پنج میلیون نفر، تنگنایی دارد که او میان ۳ تا ۲ هزار سال پیش تاریخ می‌گذارد. یعنی گروه با وجود زندگی کنار دیگر گروه‌ها هزاران سال همسرگیری بیرونی نداشته است. اگر فقط یک درصد از افراد هر نسل از بیرون می‌آمدند، نشانهٔ تنگنا از میان می‌رفت.", "en": "Example: the Vysya of Andhra Pradesh, about five million people, show a bottleneck he dates to between 3,000 and 2,000 years ago. This means that despite living alongside other groups, they took essentially no outside spouses for thousands of years; even 1 percent mixing per generation would have erased the signal.", "nl": "Example: the Vysya of Andhra Pradesh, about five million people, show a bottleneck he dates to between 3,000 and 2,000 years ago. This means that despite living alongside other groups, they took essentially no outside spouses for thousands of years; even 1 percent mixing per generation would have erased the signal."}, "sources": ["src:a4f00f41ff"], "flags": []}, {"text": {"fa": "پیامد پزشکی: در گروهی با اثر بنیان‌گذار، جهش‌های مغلوب نادر شایع می‌شوند و بیماری‌های ارثی تظاهر می‌کنند. رایش مثال واکنش خطرناک به یک داروی بی‌حسی در بخشی از وَیسیاها را می‌آورد (کمبود آنزیم بوتیریل‌کولین‌استراز). او پیشنهاد می‌کند با نمونه‌گیری کوچک از گروه‌های درون‌همسر ژن‌های بیماری‌های نادر پیدا شود.", "en": "Medical consequence: in groups with founder effects, rare recessive mutations become common and inherited diseases show up. Reich cites a dangerous reaction to a muscle relaxant used in surgery among some Vysya (butyrylcholinesterase deficiency). He proposes that small samples from endogamous groups could be used to find genes for rare diseases.", "nl": "Medical consequence: in groups with founder effects, rare recessive mutations become common and inherited diseases show up. Reich cites a dangerous reaction to a muscle relaxant used in surgery among some Vysya (butyrylcholinesterase deficiency). He proposes that small samples from endogamous groups could be used to find genes for rare diseases."}, "sources": ["src:a4f00f41ff"], "flags": []}, {"text": {"fa": "نظر مخالف دربارهٔ قدمت: نیکلاس دیرکس و برخی مورخان استدلال کرده‌اند که کاست سخت‌شدهٔ امروزی تا حد زیادی ساختهٔ دورهٔ استعمار بریتانیا است. رایش می‌گوید داده‌های ژنتیکی با این ادعا نمی‌خوانند، چون تنگناها دست‌کم ۳ تا ۲ هزار سال قدمت دارند. اما ژنتیک تنها می‌گوید ازدواج بیرونی نادر بود، نه اینکه نظام ورنه-جاتی و تبعیض اجتماعی به همان شکل امروز وجود داشته است؛ مورخان به تمایز میان این دو تأکید می‌کنند.", "en": "Opposing view on age: Nicholas Dirks and some historians argued that today's rigid caste system is largely a product of British colonial rule. Reich says the genetic data, with bottlenecks 3,000–2,000 years old, do not fit this claim. But genetics only shows that outside marriage was rare, not that the varna-jati system and its social discrimination existed in today's form; historians stress this distinction.", "nl": "Opposing view on age: Nicholas Dirks and some historians argued that today's rigid caste system is largely a product of British colonial rule. Reich says the genetic data, with bottlenecks 3,000–2,000 years old, do not fit this claim. But genetics only shows that outside marriage was rare, not that the varna-jati system and its social discrimination existed in today's form; historians stress this distinction."}, "sources": ["src:a4f00f41ff", "src:8ec5a0cf13", "src:bd34217cdc"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "همتای ایرانی: رایش به برنامهٔ غربالگری ناقلان در جامعهٔ یهودیان ارتدکس هم اشاره می‌کند که با آزمایش ناقل و معرفی‌نکردن دو ناقل به هم، بیماری‌هایی مثل تی‌سَکس را بسیار کم کرده است. او خودش از محدودیت‌های ازدواج «ناراحت» است. در ایران نیز غربالگری پیش از ازدواج برای تالاسمی اجرا می‌شود؛ ملاحظات اخلاقی (اختیار زوج، برچسب‌زنی) باید همیشه در نظر باشد.", "en": "Parallel: Reich also mentions carrier-screening in the Orthodox Jewish community, where testing and not introducing two carriers to each other has made diseases such as Tay-Sachs very rare. He himself is uncomfortable with restrictions on marriage. Iran runs premarital thalassaemia screening; ethical considerations (couples' autonomy, stigma) should always be kept in view.", "nl": "Parallel: Reich also mentions carrier-screening in the Orthodox Jewish community, where testing and not introducing two carriers to each other has made diseases such as Tay-Sachs very rare. He himself is uncomfortable with restrictions on marriage. Iran runs premarital thalassaemia screening; ethical considerations (couples' autonomy, stigma) should always be kept in view."}, "sources": ["src:a4f00f41ff"], "flags": ["contested", "editor-note"]}], "links": [{"to": "tabar:consanguinity", "rel": "bridges", "note": {"fa": "ازدواج خویشاوندی و بیماری‌های مغلوب", "en": "Consanguinity and recessive disease", "nl": "Consanguinity and recessive disease"}}, {"to": "tabar:thalassemia-screening", "rel": "see-also", "note": {"fa": "غربالگری تالاسمی در ایران", "en": "Thalassaemia screening in Iran", "nl": "Thalassaemia screening in Iran"}}, {"to": "tabar:india-two-migrations-ani-asi", "rel": "see-also", "note": {"fa": "تاریخ جمعیتی هند", "en": "India's population history", "nl": "India's population history"}}, {"to": "tabar:medical-genetics", "rel": "part-of", "note": {"fa": "ژنتیک پزشکی و جامعه", "en": "Medical genetics and society", "nl": "Medical genetics and society"}}], "people": ["core:nicholas-dirks", "core:kumarasamy-thangaraj"], "sources": ["src:8ec5a0cf13", "src:a4f00f41ff", "src:bd34217cdc"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:what-does-it-mean-to-be-human-science", "kind": "concept", "title": {"fa": "«انسان بودن» در علم و در زبان روزمره", "en": "'Being human' in science and in everyday language", "nl": "'Mens zijn' in de wetenschap en in het dagelijks taalgebruik"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "پیام هشتم سند می‌گوید علم تکامل دگرگونی بسیاری از ویژگی‌های تعریف‌کنندهٔ گونهٔ انسان خردمند را بررسی می‌کند، اما واژهٔ «انسان» در گفتار عمومی بسیار گسترده‌تر از آنچه علم بدان می‌پردازد به کار می‌رود. پرسش «انسان بودن یعنی چه؟» هم علمی است و هم فلسفی و فرهنگی.", "en": "Message 8 says evolutionary science tracks changes in many defining qualities of Homo sapiens, yet the everyday word 'human' is far broader than what science deals with. 'What does it mean to be human?' is scientific, philosophical and cultural at once.", "nl": "Boodschap 8 stelt dat de evolutiewetenschap veel bepalende kenmerken van Homo sapiens onderzoekt, terwijl 'mens' in het dagelijks gebruik veel breder is."}, "points": [{"text": {"fa": "علم می‌تواند بگوید کدام ویژگی‌های زیستی و رفتاری ما چه زمانی پدید آمدند، ولی نمی‌تواند به‌تنهایی مرز ارزشی یا معنایی «انسان بودن» را تعیین کند. سند این تمایز را صریح می‌گوید.", "en": "Science can say when particular biological and behavioural traits arose, but cannot alone fix the value-laden or meaning-laden boundary of 'being human'. The handout states this distinction openly.", "nl": "Science can say when particular biological and behavioural traits arose, but cannot alone fix the value-laden or meaning-laden boundary of 'being human'. The handout states this distinction openly."}, "sources": ["src:a85b75e91c"], "flags": []}, {"text": {"fa": "برنامه در وب‌سایت خود پاسخ‌های مردم به پرسش «انسان بودن یعنی چه؟» را گرد می‌آورد و منبعی دربارهٔ رابطهٔ علم و دین دارد؛ یعنی نگاه آموزشی آن گفت‌وگو با دیدگاه‌های گوناگون است، نه فقط بیان یافته‌های فسیلی.", "en": "The programme's website collects public answers to 'What does it mean to be human?' and offers resources on science and religion, so its approach is dialogue with varied views, not only reporting fossils.", "nl": "The programme's website collects public answers to 'What does it mean to be human?' and offers resources on science and religion, so its approach is dialogue with varied views, not only reporting fossils."}, "sources": ["src:a85b75e91c"], "flags": []}, {"text": {"fa": "این سند کوتاهِ آموزشیِ یک نهاد (نه مقالهٔ داوری‌شده) است؛ ادعاهای آن خلاصه‌اند و برای جزئیات باید به پژوهش‌های اصلی رجوع کرد. به همین دلیل منبع آن در رتبهٔ دوم (آموزشی/عمومی) قرار گرفته است.", "en": "This is a short institutional outreach document, not a peer-reviewed paper; its claims are summaries and details should be checked in primary research. That is why it is ranked as tier 2 (educational/public).", "nl": "This is a short institutional outreach document, not a peer-reviewed paper; its claims are summaries and details should be checked in primary research. That is why it is ranked as tier 2 (educational/public)."}, "sources": [], "flags": ["editor-note"]}], "links": [{"to": "tabar:human-evolution", "rel": "part-of", "note": {"fa": "تکامل انسان", "en": "Human evolution", "nl": "Human evolution"}}, {"to": "tabar:race-biology", "rel": "see-also", "note": {"fa": "آیا «نژاد» مقولهٔ زیست‌شناختی است؟", "en": "Is race a biological category?", "nl": "Is race a biological category?"}}, {"to": "tabar:social-brain-evolution", "rel": "see-also", "note": {"fa": "چرا مغز اجتماعی شدیم", "en": "Why our brains went social", "nl": "Why our brains went social"}}], "people": [], "sources": ["src:a85b75e91c"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:t1-iran-centred-eurasia-thesis", "kind": "concept", "title": {"fa": "ایران‌زمین به‌مثابه کانون جمعیتی اوراسیا: دیدگاه وکیلی و نقد آن", "en": "The Iranian plateau as a population hub of Eurasia: Vakili's thesis and its critique", "nl": "Het Iraanse plateau als bevolkingscentrum van Eurazië: de these van Vakili"}, "aliases": [], "parent": "tabar:population-genetics", "field": "tabar:population-genetics", "summary": {"fa": "چارچوب تفسیری کتاب این است که ایران‌زمین بارها منشأ موج‌های جمعیتی به سوی اروپا، هند و دیگر نقاط بوده است. این برداشت دیدگاه نویسنده است و در بخش‌هایی با اجماع دانشگاهی ناهمخوان.", "en": "The book's interpretive frame is that the Iranian plateau repeatedly seeded population waves toward Europe, India and elsewhere. This is the author's viewpoint and in places departs from academic consensus.", "nl": "Het interpretatieve kader van het boek: het Iraanse plateau als herhaalde bron van migratiegolven. Dit is het standpunt van de auteur."}, "points": [{"text": {"fa": "به گفتهٔ نویسنده، اوراسیا را باید به‌جای دوگانهٔ آسیا و اروپا به سه قلمرو تمدنی بخش کرد: قلمرو خاوری (تمدن چین)، قلمرو میانی (ایران‌زمین) و قلمرو باختری (اروپا). او ایران‌زمین را مرکز میانی می‌داند.", "en": "The author argues Eurasia should be divided not into Asia and Europe but into three civilisational realms: eastern (Chinese), middle (the Iranian plateau) and western (Europe), with Iran at the centre.", "nl": "The author argues Eurasia should be divided not into Asia and Europe but into three civilisational realms: eastern (Chinese), middle (the Iranian plateau) and western (Europe), with Iran at the centre."}, "sources": ["src:93456bf0b8"], "flags": ["contested"]}, {"text": {"fa": "او می‌گوید کرانهٔ خلیج فارس هنگام خشکی اقلیم و پایین رفتن آب پناهگاه جمعیت‌های نخستین بیرون‌آمده از آفریقا بوده و موج‌های بعدی از غرب ایران به سوی اروپا و آسیا برخاسته‌اند.", "en": "He says the Persian Gulf shore served as a refuge for the first out-of-Africa populations when climate dried and sea levels fell, and later waves set out from western Iran toward Europe and Asia.", "nl": "He says the Persian Gulf shore served as a refuge for the first out-of-Africa populations when climate dried and sea levels fell, and later waves set out from western Iran toward Europe and Asia."}, "sources": ["src:93456bf0b8"], "flags": ["contested"]}, {"text": {"fa": "نویسنده کشاورزان نوسنگی اروپا و گسترش فناوری آهن به اروپا را به ایران‌زمین نسبت می‌دهد و می‌گوید دستهٔ استپی هندواروپایی از شمال ایران‌زمین برخاسته و خویشاوند «آریایی‌های» ایرانی بوده است؛ او واژهٔ «هندواروپایی» را هم برساختهٔ عصر استعمار می‌خواند.", "en": "He attributes Europe's Neolithic farmers and the spread of iron technology to the Iranian plateau and says the steppe Indo-European group rose from northern Iran and was kin to Iranian 'Aryans'; he also calls the label 'Indo-European' a colonial-era construct.", "nl": "He attributes Europe's Neolithic farmers and the spread of iron technology to the Iranian plateau and says the steppe Indo-European group rose from northern Iran and was kin to Iranian 'Aryans'; he also calls the label 'Indo-European' a colonial-era construct."}, "sources": ["src:93456bf0b8"], "flags": ["contested"]}, {"text": {"fa": "نوشته‌های نویسنده در چارچوب نظریهٔ شخصی «زروان» است و دو واژهٔ «ایران‌هراسی» و «پارس‌نژندی» را برای نقد آنچه خوانش‌های نادیده‌گیرندهٔ ایران می‌داند به‌کار می‌برد. این لحن گاه جدلی است و نباید با خود یافته‌های ژنتیکی یکی گرفته شود.", "en": "The writing sits within the author's personal 'Zurvan' theory and uses the terms 'Iranophobia' and 'Persian-neurosis' to criticise what he sees as readings that ignore Iran. The tone is at times polemical and should not be mistaken for the genetic findings themselves.", "nl": "The writing sits within the author's personal 'Zurvan' theory and uses the terms 'Iranophobia' and 'Persian-neurosis' to criticise what he sees as readings that ignore Iran. The tone is at times polemical and should not be mistaken for the genetic findings themselves."}, "sources": ["src:93456bf0b8"], "flags": ["contested"]}, {"text": {"fa": "دیدگاه رایج: ایران‌زمین (به‌ویژه زاگرس) در پیدایش کشاورزی و در پراکندگی انسان نقش مهمی داشته و تبار «کشاورزان ایرانی» در ژنوم آسیای جنوبی و استپ سهمی دارد. اما کشاورزان نخست اروپا عمدتاً از آناتولی آمده‌اند، خاستگاه یمنا استپ پونتی‌ـ‌خزری است نه شمال ایران، و تأثیر ایرانی تنها یکی از اجزای تبار آن‌هاست؛ پس تصویر «همه‌چیز از ایران» ساده‌سازی بزرگ است.", "en": "Mainstream view: the Iranian plateau (especially the Zagros) was important in the origins of farming and in human dispersal, and 'Iranian farmer' ancestry contributes to South Asian and steppe genomes. But Europe's first farmers came mainly from Anatolia, Yamnaya originated in the Pontic-Caspian steppe rather than northern Iran, and Iranian-related ancestry is only one component; 'everything from Iran' is a large oversimplification.", "nl": "Mainstream view: the Iranian plateau (especially the Zagros) was important in the origins of farming and in human dispersal, and 'Iranian farmer' ancestry contributes to South Asian and steppe genomes. But Europe's first farmers came mainly from Anatolia, Yamnaya originated in the Pontic-Caspian steppe rather than northern Iran, and Iranian-related ancestry is only one component; 'everything from Iran' is a large oversimplification."}, "sources": ["src:553bedc591", "src:58d5e5ecfa"], "flags": ["contested", "editor-note"]}], "links": [{"to": "tabar:zagros-neolithic", "rel": "contrasts", "note": {"fa": "نقش واقعی زاگرس در کشاورزی", "en"
