قیاس با خوراک‌جویان امروزی را می‌شمارد: آن‌ها از جوامع کشاورز و صنعتی اطراف‌شان اثر پذیرفته‌اند؛ بیشترشان در زیستگاه‌های سخت و کم‌جمعیتی چون کالاهاری مانده‌اند؛ و میان خود جوامع خوراک‌جو تنوع بسیار است. مثال او از استرالیای پیش از استعمار است: چند صد قبیله با زبان، دین و هنجارهای متفاوت.", "en": "He lists three limits to analogy with today's foragers: they have been influenced by surrounding farming and industrial societies; most survive in harsh, sparsely populated habitats like the Kalahari; and foraging societies differ greatly from one another. His example is pre-colonial Australia: several hundred tribes with different languages, religions and norms.", "nl": "He lists three limits to analogy with today's foragers: they have been influenced by surrounding farming and industrial societies; most survive in harsh, sparsely populated habitats like the Kalahari; and foraging societies differ greatly from one another. His example is pre-colonial Australia: several hundred tribes with different languages, religions and norms."}, "sources": ["src:64cc653b84"], "flags": []}, {"text": {"fa": "نتیجهٔ او این است که پس از انقلاب شناختی «شیوهٔ زیست طبیعی» واحدی برای انسان خردمند وجود نداشت، بلکه گزینه‌های فرهنگی متنوعی در گسترهٔ امکانات زیستی بود. این هشدار روش‌شناختی مهمی است، چون بحث‌های داغ دربارهٔ «طبیعت انسان» را نسبی می‌کند.", "en": "His conclusion is that after the cognitive revolution there was no single 'natural way of life' for Homo sapiens, only varied cultural options within biological limits. This is a useful methodological warning, since it relativises heated debates about 'human nature'.", "nl": "His conclusion is that after the cognitive revolution there was no single 'natural way of life' for Homo sapiens, only varied cultural options within biological limits. This is a useful methodological warning, since it relativises heated debates about 'human nature'."}, "sources": ["src:64cc653b84"], "flags": []}, {"text": {"fa": "او می‌گوید خوراک‌جویان معمولاً گروه‌هایی از چند ده تا چند صد نفر بودند، بیشتر خانه‌به‌دوش بودند، با گروه‌های همسایه بیشتر کالاهای تجملی (صدف، کهربا، رنگدانه) رد و بدل می‌کردند تا کالای ضروری، و سگ تنها حیوان اهلی پیش از انقلاب کشاورزی بود. تاریخ دقیق اهلی شدن سگ را متخصصان یکسان نمی‌دانند و برآوردها از حدود ۱۵ هزار تا بسیار پیش‌تر می‌رسد.", "en": "He says foragers typically lived in bands of tens to a few hundred, were mostly nomadic, traded mainly luxury goods (shells, amber, pigments) rather than necessities with neighbours, and the dog was the only domesticated animal before agriculture. Specialists do not agree on the date of dog domestication, and estimates range from about 15,000 years ago to considerably earlier.", "nl": "He says foragers typically lived in bands of tens to a few hundred, were mostly nomadic, traded mainly luxury goods (shells, amber, pigments) rather than necessities with neighbours, and the dog was the only domesticated animal before agriculture. Specialists do not agree on the date of dog domestication, and estimates range from about 15,000 years ago to considerably earlier."}, "sources": ["src:64cc653b84"], "flags": ["contested"]}, {"text": {"fa": "هراری می‌نویسد خوراک‌جویان دانش و مهارت متنوع‌تر و عمیق‌تری از انسان صنعتی داشتند و هفته‌ای حدود ۳۵ تا ۴۵ ساعت کار می‌کردند، با زندگی دلپذیرتر از کشاورز و کارگر. این تصویر به بحث قدیمی «جامعهٔ مرفه اولیه» (سالینز) برمی‌گردد که برآوردهای ساعت کار آن از چند مطالعهٔ میدانی کوچک (مثل کالاهاری) می‌آید و معیار «کار» و نمونه‌گیری‌اش محل نقد است؛ و نمی‌تواند به همهٔ خوراک‌جویان باستان تعمیم یابد.", "en": "Harari writes that foragers had more varied and deeper knowledge than industrial people, worked about 35 to 45 hours a week, and led a more pleasant life than farmers and workers. This links to the old 'original affluent society' debate (Sahlins), whose working-hours estimates come from a few small field studies (e.g. in the Kalahari); the definition of 'work' and the sampling are criticised, and results cannot be generalised to all ancient foragers.", "nl": "Harari writes that foragers had more varied and deeper knowledge than industrial people, worked about 35 to 45 hours a week, and led a more pleasant life than farmers and workers. This links to the old 'original affluent society' debate (Sahlins), whose working-hours estimates come from a few small field studies (e.g. in the Kalahari); the definition of 'work' and the sampling are criticised, and results cannot be generalised to all ancient foragers."}, "sources": ["src:64cc653b84", "src:73e2b82f26"], "flags": ["contested", "editor-note"]}], "links": [{"to": "psy:anthropology", "rel": "see-also", "note": {"fa": "انسان‌شناسی تکاملی", "en": "Evolutionary anthropology", "nl": "Evolutionary anthropology"}}, {"to": "tabar:human-evolution", "rel": "part-of", "note": {"fa": "تکامل انسان", "en": "Human evolution", "nl": "Human evolution"}}, {"to": "psy:dog-cognition", "rel": "see-also", "note": {"fa": "شناخت اجتماعی سگ‌ها", "en": "Dog social cognition", "nl": "Dog social cognition"}}, {"to": "tabar:social-brain-evolution", "rel": "see-also", "note": {"fa": "مغز اجتماعی", "en": "The social brain", "nl": "The social brain"}}], "people": ["core:marshall-sahlins"], "sources": ["src:64cc653b84", "src:73e2b82f26"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:earliest-bipeds-and-australopithecus", "kind": "concept", "title": {"fa": "نخستین دوپایان و استرالوپیتکوس‌ها (شاخ آفریقا، شکاف بزرگ آفریقا)", "en": "The earliest bipeds and Australopithecus", "nl": "De vroegste tweebenigen en Australopithecus"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "کتاب شمار گونه‌های منقرض‌شدهٔ انسان و پیش‌انسان را در ۶ تا ۷ میلیون سال گذشته حدود بیست می‌داند و می‌گوید بخش بزرگی از این تاریخ در پیرامون شکاف بزرگ آفریقا گذشته است. سه نامزدِ نخستین دوپا (ساحل‌انتروپوس، اورورین و اردی‌پیتکوس) هنوز مبهم‌اند و استرالوپیتکوس‌ها بسیار بهتر شناخته شده‌اند.", "en": "The book counts about twenty extinct human and proto-human species over the last 6–7 million years, much of this history unfolding around the Great Rift Valley. Three candidate early bipeds (Sahelanthropus, Orrorin, Ardipithecus) remain ambiguous, while Australopithecus is far better known.", "nl": "Het boek telt zo'n twintig uitgestorven mens- en voormenssoorten in 6–7 miljoen jaar, vooral rond de Grote Slenkdal. Sahelanthropus, Orrorin en Ardipithecus blijven onzeker; Australopithecus is veel beter bekend."}, "points": [{"text": {"fa": "بر پایهٔ فسیل‌های ۶ تا ۷ میلیون سال اخیر، حدود بیست گونهٔ منقرض‌شدهٔ انسان یا پیش‌انسان شناخته می‌شود. کهن‌ترین‌ها در جنوب‌شرقی آفریقا (اتیوپی، کنیا، تانزانیا، آفریقای جنوبی) و دو مورد در چاد پیدا شده‌اند. نویسندگان می‌گویند بین ۶ و ۲ میلیون سال پیش بیشتر تاریخ ما در پیرامون «شکاف بزرگ آفریقا» گذشت؛ منطقه‌ای که خشک‌شدن تدریجی اقلیم در آن جنگل‌ها را تکه‌تکه کرد (پس از حدود ۶ میلیون سال پیش) و سپس علفزارهای گسترده پدید آورد (حدود ۳ میلیون سال پیش).", "en": "About twenty extinct human or proto-human species are known from the last 6–7 Myr, the oldest across eastern and southern Africa plus two from Chad. Between 6 and 2 Mya the story is centred on the Great Rift Valley, where progressive drying fragmented forests (after ~6 Mya) and later produced wide grasslands (~3 Mya).", "nl": "About twenty extinct human or proto-human species are known from the last 6–7 Myr, the oldest across eastern and southern Africa plus two from Chad. Between 6 and 2 Mya the story is centred on the Great Rift Valley, where progressive drying fragmented forests (after ~6 Mya) and later produced wide grasslands (~3 Mya)."}, "sources": ["src:64c357a843"], "flags": []}, {"text": {"fa": "سه سردستهٔ نخستین نامزدهای دوپایی: «ساحل‌انتروپوس چادنسیس» (جمجمهٔ چاد با نام «توماِی»، معرفی‌شده در ۲۰۰۲، سن ۷ تا ۶٫۵ میلیون سال با روش زیست‌زمان‌شناسی)، «اورورین توگننسیس» (تپه‌های توگن کنیا، حدود ۶ میلیون سال؛ بخش‌هایی از استخوان ران نشانهٔ راه‌رفتن دوپا است) و «اردی‌پیتکوس» (آواش میانی اتیوپی؛ گونهٔ کدابا ۵٫۸ تا ۵٫۲ و گونهٔ رامیدوس حدود ۴٫۴ میلیون سال، با اسکلت نسبتاً کامل «آردی» که در ۲۰۰۹ در یک شمارهٔ ویژهٔ ساینس منتشر شد).", "en": "Three genera are the first candidate bipeds: Sahelanthropus tchadensis (the 2002 Chad skull 'Toumaï', 7–6.5 Mya by faunal dating), Orrorin tugenensis (Tugen Hills, Kenya, ~6 Mya; femur fragments suggest bipedalism) and Ardipithecus (Middle Awash, Ethiopia; kadabba 5.8–5.2 Mya, ramidus ~4.4 Mya, with the partial skeleton 'Ardi' described in a 2009 special issue of Science).", "nl": "Three genera are the first candidate bipeds: Sahelanthropus tchadensis (the 2002 Chad skull 'Toumaï', 7–6.5 Mya by faunal dating), Orrorin tugenensis (Tugen Hills, Kenya, ~6 Mya; femur fragments suggest bipedalism) and Ardipithecus (Middle Awash, Ethiopia; kadabba 5.8–5.2 Mya, ramidus ~4.4 Mya, with the partial skeleton 'Ardi' described in a 2009 special issue of Science)."}, "sources": ["src:64c357a843", "src:66b0791be1", "src:90aae08571"], "flags": []}, {"text": {"fa": "به گفتهٔ خود نویسندگان، همهٔ دیرین‌انسان‌شناسان نمی‌پذیرند که جمجمهٔ توماِی نیای خط انسانی باشد. اگر سن آن تأیید شود از حد ساعت مولکولی (حدود ۶ میلیون سال) هم قدیمی‌تر درمی‌آید و کالیبراسیون ژنتیکی را زیر پرسش می‌برد. دربارهٔ اورورین و اردی‌پیتکوس کدابا نیز به‌دلیل کمیِ نمونه‌ها بهتر است داوری را به تعویق انداخت.", "en": "By the authors' own account, not all paleoanthropologists accept the Chad skull as ancestral to humans; if its age were confirmed it would exceed the molecular-clock limit and challenge the genetic calibration. For Orrorin and Ar. kadabba the samples are too small for firm judgement.", "nl": "By the authors' own account, not all paleoanthropologists accept the Chad skull as ancestral to humans; if its age were confirmed it would exceed the molecular-clock limit and challenge the genetic calibration. For Orrorin and Ar. kadabba the samples are too small for firm judgement."}, "sources": ["src:64c357a843"], "flags": ["contested"]}, {"text": {"fa": "استرالوپیتکوس بسیار بهتر از پیشینیانش شناخته شده است. دست‌کم چهار گونهٔ قابل‌اعتماد: آنامنسیس (۴٫۲ تا ۳٫۹ میلیون سال، کنیا و اتیوپی)، آفارنسیس (هَدار در اتیوپی و لائتولی در تانزانیا، حدود ۴ تا ۳ میلیون سال؛ شامل اسکلت مشهور «لوسی» و ردپاهای سه دوپا در خاکستر آتشفشانی لائتولی که بیش از ۳٫۵ میلیون سال قدمت دارد)، آفریکانوس و سدیبا. دو مورد دیگر (باهرالغزالی و گارهی) نامطمئن یا بحث‌برانگیزند. پیش‌نمایش در همین‌جا به پایان می‌رسد و جزئیات آفریکانوس و سدیبا را نشان نمی‌دهد.", "en": "Australopithecus is far better known than earlier forms: at least four reliable species — A. anamensis (4.2–3.9 Mya, Kenya/Ethiopia), A. afarensis (Hadar, Laetoli; ~4.0–3.0 Mya; includes 'Lucy' and the >3.5 Mya Laetoli footprints), A. africanus and A. sediba — with uncertain (A. bahrelghazali) and controversial (A. garhi) cases. The preview ends here, before details of africanus and sediba.", "nl": "Australopithecus is far better known than earlier forms: at least four reliable species — A. anamensis (4.2–3.9 Mya, Kenya/Ethiopia), A. afarensis (Hadar, Laetoli; ~4.0–3.0 Mya; includes 'Lucy' and the >3.5 Mya Laetoli footprints), A. africanus and A. sediba — with uncertain (A. bahrelghazali) and controversial (A. garhi) cases. The preview ends here, before details of africanus and sediba."}, "sources": ["src:64c357a843"], "flags": []}, {"text": {"fa": "یادداشت ویراستار: ارزیابی «آردی» هنوز بحث دارد. گروه کاشف آن را نزدیک به ریشهٔ تبار انسان می‌دانند، اما برخی پژوهشگران دربارهٔ اینکه آیا اردی‌پیتکوس واقعاً از نیاکان مستقیم انسان است و چگونه راه می‌رفته تردید دارند. این کتاب فقط روایت گروه کاشف را خلاصه می‌کند.", "en": "Editor's note: the interpretation of 'Ardi' remains debated. Its describers place it near the root of the human lineage, but some researchers question whether Ardipithecus is a direct ancestor and how it moved; the book only summarises the describers' view.", "nl": "Editor's note: the interpretation of 'Ardi' remains debated. Its describers place it near the root of the human lineage, but some researchers question whether Ardipithecus is a direct ancestor and how it moved; the book only summarises the describers' view."}, "sources": [], "flags": ["contested", "editor-note"]}], "links": [{"to": "tabar:primates-ape-ancestry-molecular-clock", "rel": "see-also", "note": {"fa": "ما نخستی‌ایم: ریشهٔ میمونی انسان و ساعت مولکولی", "en": "We are primates: ape ancestry and the molecular clock", "nl": "We are primates: ape ancestry and the molecular clock"}}, {"to": "tabar:brain-body-size-climate", "rel": "see-also", "note": {"fa": "اقلیم و اندازهٔ مغز و بدن", "en": "Climate and brain/body size", "nl": "Climate and brain/body size"}}, {"to": "tabar:out-of-africa", "rel": "see-also", "note": {"fa": "خاستگاه آفریقایی انسان خردمند", "en": "The African origin of Homo sapiens", "nl": "The African origin of Homo sapiens"}}], "people": [], "sources": ["src:64c357a843", "src:66b0791be1", "src:90aae08571"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:neanderthal-ancestry-selection", "kind": "concept", "title": {"fa": "سرنوشت دی‌ان‌ای نئاندرتال: زمان آمیزش و پاک‌سازی با انتخاب طبیعی", "en": "The fate of Neanderthal DNA: timing of mixture and purging by selection", "nl": "Het lot van Neanderthaler-DNA: tijdstip van vermenging en zuivering door selectie"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "مردم بیرون از آفریقا حدود ۲ درصد از ژنوم خود را از نئاندرتال‌ها دارند. دیوید رایش در کتابش می‌گوید این آمیزش حدود ۵۴ تا ۴۹ هزار سال پیش رخ داد و بعدها انتخاب طبیعی بخش بزرگی از این دی‌ان‌ای را از ژنوم ما حذف کرد؛ به‌ویژه از کروموزوم X و ژن‌های بیضه. تفسیر «کم‌باروری دورگه‌ها» و جزئیات زمانی هنوز میان پژوهشگران محل بحث است.", "en": "People outside Africa carry about 2 percent Neanderthal DNA. David Reich argues that the mixing happened roughly 54,000–49,000 years ago and that natural selection later removed much of this DNA, especially from the X chromosome and testis genes. The 'reduced hybrid fertility' interpretation and the exact timing are still debated.", "nl": "Mensen buiten Afrika dragen zo'n 2 procent Neanderthaler-DNA. Reich stelt dat de vermenging ca. 54.000–49.000 jaar geleden plaatsvond en dat natuurlijke selectie later veel van dit DNA verwijderde, vooral van het X-chromosoom en testisgenen. De verklaring via verminderde vruchtbaarheid van hybriden is nog omstreden."}, "points": [{"text": {"fa": "امروز در همهٔ مردم بیرون از آفریقا حدود ۱٫۵ تا ۲٫۱ درصد از ژنوم از نئاندرتال‌ها آمده است؛ سهم در شرق آسیایی‌ها کمی بیشتر از اروپایی‌هاست. به گفتهٔ رایش بخشی از این تفاوت از «رقیق‌شدن» می‌آید: کشاورزان خاور نزدیک که بعدها به اروپا رفتند بخش بزرگی از تبارشان از شاخه‌ای (اوراسیایی پایه) بود که نئاندرتال کمتری داشت.", "en": "Today everyone outside Africa carries roughly 1.5–2.1 percent Neanderthal-derived DNA, slightly more in East Asians than in Europeans. Reich says part of the difference is dilution: the Near Eastern farmers who later moved into Europe derived a large part of their ancestry from a lineage (Basal Eurasian) with little Neanderthal ancestry.", "nl": "Today everyone outside Africa carries roughly 1.5–2.1 percent Neanderthal-derived DNA, slightly more in East Asians than in Europeans. Reich says part of the difference is dilution: the Near Eastern farmers who later moved into Europe derived a large part of their ancestry from a lineage (Basal Eurasian) with little Neanderthal ancestry."}, "sources": ["src:a4f00f41ff"], "flags": []}, {"text": {"fa": "زمان آمیزش را از طول تکه‌های دی‌ان‌ای نئاندرتال در ژنوم‌ها برآورد می‌کنند: هرچه آمیزش دورتر باشد، تکه‌ها در اثر نوترکیبی کوتاه‌تر شده‌اند. تکه‌های یک انسان سیبریایی ۴۵ هزارساله حدود هفت برابر درازتر از امروزی‌هاست و تاریخ حدود ۵۴ تا ۴۹ هزار سال پیش را می‌دهد. مکان آمیزش از ژنتیک روشن نمی‌شود؛ رایش خاور نزدیک را «محتمل‌ترین حدس» می‌داند.", "en": "The timing comes from the length of Neanderthal-derived stretches: the older the mixture, the shorter the stretches after repeated recombination. Stretches in a 45,000-year-old Siberian individual are about seven times longer than in people today and point to roughly 54,000–49,000 years ago. Genetics cannot show where it happened; Reich calls the Near East the most plausible guess.", "nl": "The timing comes from the length of Neanderthal-derived stretches: the older the mixture, the shorter the stretches after repeated recombination. Stretches in a 45,000-year-old Siberian individual are about seven times longer than in people today and point to roughly 54,000–49,000 years ago. Genetics cannot show where it happened; Reich calls the Near East the most plausible guess."}, "sources": ["src:a4f00f41ff"], "flags": ["editor-note"]}, {"text": {"fa": "فرد ۴۰ هزارساله‌ای از غار اوآزه (رومانی) ۶ تا ۹ درصد تبار نئاندرتال داشت و قطعه‌های درازی از آن، یعنی یک نیای نئاندرتال در چهار تا شش نسل پیشین. اما او خویشاوند ویژهٔ اروپاییان امروز نبود؛ پس به گفتهٔ رایش گروهش یک شاخهٔ بن‌بست بود که نسلی از آن نمانده است.", "en": "A 40,000-year-old individual from Oase Cave (Romania) had 6–9 percent Neanderthal ancestry in long unbroken stretches, implying a Neanderthal ancestor four to six generations back. He was not specially related to present-day Europeans, so, according to Reich, his group was an evolutionary dead end.", "nl": "A 40,000-year-old individual from Oase Cave (Romania) had 6–9 percent Neanderthal ancestry in long unbroken stretches, implying a Neanderthal ancestor four to six generations back. He was not specially related to present-day Europeans, so, according to Reich, his group was an evolutionary dead end."}, "sources": ["src:a4f00f41ff", "src:f76f4eccd9"], "flags": []}, {"text": {"fa": "نقشهٔ ژنوم نشان می‌دهد در بیش از نیمی از ژنوم هیچ‌کس تبار نئاندرتال شناسایی نشده و در بعضی نقاط نادر بیش از ۵۰ درصد است. کمبود تبار نئاندرتال به‌ویژه روی کروموزوم X و کنار ژن‌هایی که در بیضه فعال‌اند دیده می‌شود. رایش و همکارانش این را نشانهٔ کم‌باروری نرهای دورگه می‌گیرند؛ الگوی مشابهی در موش‌های دورگه هم دیده شده است. در نمونه‌های باستانی هم سهم نئاندرتال از حدود ۳ تا ۶ درصد به ۲ درصد کاهش یافته است.", "en": "Mapping shows that in more than half of the genome no one carries Neanderthal ancestry, while a few spots exceed 50 percent. The deficit is clearest on the X chromosome and near genes active in the testis. Reich and colleagues read this as reduced fertility of hybrid males, a pattern also seen in hybrid mice. Ancient samples show Neanderthal ancestry falling from about 3–6 percent to about 2 percent.", "nl": "Mapping shows that in more than half of the genome no one carries Neanderthal ancestry, while a few spots exceed 50 percent. The deficit is clearest on the X chromosome and near genes active in the testis. Reich and colleagues read this as reduced fertility of hybrid males, a pattern also seen in hybrid mice. Ancient samples show Neanderthal ancestry falling from about 3–6 percent to about 2 percent."}, "sources": ["src:a4f00f41ff", "src:4601b387da"], "flags": []}, {"text": {"fa": "دربارهٔ علت و شدت این پاک‌سازی توافق کامل نیست. رایش دلیل دیگری هم می‌آورد: نئاندرتال‌ها جمعیت کوچک‌تری بودند و جهش‌های کمی زیان‌آور در ژنومشان جمع شده بود. پژوهشگران دیگر می‌گویند همین «بار جهش‌های زیان‌آور» به‌تنهایی بخش بزرگی از الگو را توضیح می‌دهد، و برخی برآوردها می‌گویند بیشترِ انتخاب در همان هزاره‌های نخست رخ داد نه به‌صورت کاهش پیوسته. کم‌باروری دورگه‌ها هم استنباط است، نه مشاهدهٔ مستقیم. پژوهش‌های بعدی هم مقدار کمی تبار نئاندرتالی در آفریقایی‌ها یافته‌اند (برگشت مهاجران به آفریقا)، پس «بیرون آفریقا» ساده‌سازی است.", "en": "The cause and strength of this purging are not settled. Reich also invokes a second factor: Neanderthals had small populations and accumulated mildly harmful mutations. Other researchers argue this 'genetic load' alone explains much of the pattern, and some estimates say most selection happened in the first millennia rather than as a steady decline. Hybrid infertility is an inference, not a direct observation. Later work also found a small Neanderthal-derived fraction in Africans (back-migration), so 'outside Africa only' is a simplification.", "nl": "The cause and strength of this purging are not settled. Reich also invokes a second factor: Neanderthals had small populations and accumulated mildly harmful mutations. Other researchers argue this 'genetic load' alone explains much of the pattern, and some estimates say most selection happened in the first millennia rather than as a steady decline. Hybrid infertility is an inference, not a direct observation. Later work also found a small Neanderthal-derived fraction in Africans (back-migration), so 'outside Africa only' is a simplification."}, "sources": ["src:a7e0528793", "src:c3725a9f74", "src:ddfafeba8c"], "flags": ["contested", "editor-note"]}], "links": [{"to": "tabar:neanderthal-admixture", "rel": "explains", "note": {"fa": "ادامه و جزئیات مدخل پایه دربارهٔ آمیزش با نئاندرتال‌ها", "en": "Extends the base entry on admixture with Neanderthals", "nl": "Extends the base entry on admixture with Neanderthals"}}, {"to": "tabar:basal-eurasian-ancestry", "rel": "bridges", "note": {"fa": "تبار اوراسیایی پایه کمترین نئاندرتال را داشت", "en": "Basal Eurasian ancestry carried the least Neanderthal ancestry", "nl": "Basal Eurasian ancestry carried the least Neanderthal ancestry"}}, {"to": "tabar:mutation-selection-drift", "rel": "see-also", "note": {"fa": "انتخاب و رانش در جمعیت کوچک", "en": "Selection and drift in small populations", "nl": "Selection and drift in small populations"}}, {"to": "tabar:ancient-dna", "rel": "see-also", "note": {"fa": "ابزار پژوهش: دی‌ان‌ای باستانی", "en": "The tool: ancient DNA", "nl": "The tool: ancient DNA"}}], "people": ["core:david-reich", "core:svante-p-bo", "core:sriram-sankararaman"], "sources": ["src:4601b387da", "src:a4f00f41ff", "src:a7e0528793", "src:c3725a9f74", "src:ddfafeba8c", "src:f76f4eccd9"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:cooked-diet-body-and-brain", "kind": "concept", "title": {"fa": "غذای پخته، روده کوچک و مغز بزرگ", "en": "Cooked food, a small gut and a big brain", "nl": "Gekookt voedsel, kleine darm en groot brein"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "انسان‌ها نسبت به اندازهٔ بدن، دهان، دندان و روده‌ای کوچک و مغزی بزرگ دارند. بر پایهٔ «فرضیهٔ بافت پرهزینه» (آیلو و ویلر، ۱۹۹۵) روده و مغز هر دو انرژی‌بَرند و کوچک‌شدن روده بخشی از هزینهٔ مغز بزرگ را پرداخته است. رانگهم می‌گوید پختن این امکان را فراهم کرد و زمان جویدن را از چند ساعت به حدود یک ساعت رساند. هر سه ادعا محل بحث‌اند.", "en": "Relative to body size, humans have a small mouth, small teeth and a short gut, and a large brain. By the expensive tissue hypothesis (Aiello and Wheeler, 1995) gut and brain both cost much energy, and a shrinking gut helped pay for a large brain. Wrangham argues cooking made this possible and cut chewing time from hours to about one. All three claims are debated.", "nl": "Mensen hebben relatief kleine mond, tanden en darmen en een groot brein. Volgens de «expensive tissue»-hypothese (Aiello & Wheeler, 1995) werd het grote brein deels betaald door een kleinere darm. Wrangham ziet koken als voorwaarde en stelt dat kauwtijd sterk daalde. Alle drie de claims zijn omstreden."}, "points": [{"text": {"fa": "مقایسهٔ ما با شامپانزه: دهانهٔ دهان و ماهیچه‌های جویدن ما کوچک‌ترند، دندان‌هایمان کوچک‌تر است و معده، روده‌ی کوچک و به‌ویژه رودهٔ بزرگمان نسبت به وزن بدن کوتاه‌تر است. به گفتهٔ رانگهم این ترکیب برای غذای نرم و پرانرژی طراحی شده و با غذای خام فیبردار سازگار نیست.", "en": "Compared with chimpanzees, our mouth opening and chewing muscles are smaller, our teeth smaller, and our stomach and especially large intestine relatively shorter for body weight. Wrangham says this package is designed for soft, energy-dense food and not for raw fibrous food.", "nl": "Compared with chimpanzees, our mouth opening and chewing muscles are smaller, our teeth smaller, and our stomach and especially large intestine relatively shorter for body weight. Wrangham says this package is designed for soft, energy-dense food and not for raw fibrous food."}, "sources": ["src:c12cd83ad0"], "flags": []}, {"text": {"fa": "فرضیهٔ بافت پرهزینه: مغز انسان حدود ۲٫۵ درصد وزن بدن است ولی تقریباً ۲۰ درصد انرژیِ حالت استراحت را می‌گیرد. میزان سوخت‌وساز پایه‌ی ما نسبت به وزن در حد پیش‌بینی‌شده برای پرایمات‌هاست، پس آیلو و ویلر نتیجه گرفتند که انرژی مغز از کوچک‌شدن بافت دیگری، یعنی روده، تأمین شده است.", "en": "The expensive tissue hypothesis: the human brain is about 2.5 percent of body weight but uses roughly 20 percent of resting energy. Our basal metabolic rate is as expected for a primate our size, so Aiello and Wheeler concluded the brain's energy was paid for by shrinking another tissue, the gut.", "nl": "The expensive tissue hypothesis: the human brain is about 2.5 percent of body weight but uses roughly 20 percent of resting energy. Our basal metabolic rate is as expected for a primate our size, so Aiello and Wheeler concluded the brain's energy was paid for by shrinking another tissue, the gut."}, "sources": ["src:c12cd83ad0", "src:232013ea8d"], "flags": []}, {"text": {"fa": "رانگهم می‌گوید جهش مغزی در هومو ارکتوس (افزایش ۴۲ درصدی ظرفیت جمجمه نسبت به هابیلین‌ها طبق کتاب) به پختن مربوط است. همچنین براورد او این است که زمان جویدن در انسان حدود ۸ درصد روز است، در حالی که میمون‌های انسان‌نما حدود نیمی از روز می‌جوند. با غذای خام و گیاهی، انسان حدود ۵ ساعت جویدن لازم داشت و این با شکار و گردآوری جور درنمی‌آید.", "en": "Wrangham links the brain jump in Homo erectus (a 42 percent increase in cranial capacity over habilines, per the book) to cooking. He estimates human chewing at about 8 percent of the day against roughly half the day in great apes, and that a raw plant diet would need around five hours of chewing, which is hard to reconcile with hunting and gathering.", "nl": "Wrangham links the brain jump in Homo erectus (a 42 percent increase in cranial capacity over habilines, per the book) to cooking. He estimates human chewing at about 8 percent of the day against roughly half the day in great apes, and that a raw plant diet would need around five hours of chewing, which is hard to reconcile with hunting and gathering."}, "sources": ["src:c12cd83ad0"], "flags": []}, {"text": {"fa": "نظر ویراستار: فرضیهٔ بافت پرهزینه خودش مورد مناقشه است. ناوارته، ون شایک و ایسلر (۲۰۱۱) در بررسی پستانداران همبستگی منفی میان اندازهٔ مغز و اندازهٔ دستگاه گوارش پیدا نکردند و ارتباط را با چربی بدن می‌دیدند. در مقابل، فونسکا-آزودو و هرکولانو-هوزل (۲۰۱۲) با شمارش نورون‌ها استدلال کردند که تغذیهٔ مغزِ بزرگ با غذای خام شدنی نیست، که با رانگهم هم‌سو است. این هم هنوز به نتیجه نرسیده است.", "en": "Editor's note: the expensive tissue hypothesis is itself contested. Navarrete, van Schaik and Isler (2011) found no negative correlation between brain size and digestive-tissue size across mammals and pointed to body fat instead. Conversely, Fonseca-Azevedo and Herculano-Houzel (2012), using neuron counts, argued a large brain could not be fuelled on raw food, which supports Wrangham. The question remains open.", "nl": "Editor's note: the expensive tissue hypothesis is itself contested. Navarrete, van Schaik and Isler (2011) found no negative correlation between brain size and digestive-tissue size across mammals and pointed to body fat instead. Conversely, Fonseca-Azevedo and Herculano-Houzel (2012), using neuron counts, argued a large brain could not be fuelled on raw food, which supports Wrangham. The question remains open."}, "sources": ["src:983881b4b4", "src:c6648d6a35"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "نظر ویراستار: برآوردهای مربوط به اندازهٔ روده‌ی هومو ارکتوس غیرمستقیم است، چون روده فسیل نمی‌شود و از شکل قفسه سینه و لگن حدس زده می‌شود. نمونه‌های فسیلی کم‌اند و رده‌بندی گونه‌هایی مثل هومو هابیلیس خود محل اختلاف است. همچنین عوامل دیگری (پیچیدگی اجتماعی، اقلیم، پرورش مشترک کودکان) در بزرگ‌شدن مغز نقش داشته‌اند.", "en": "Editor's note: estimates of Homo erectus gut size are indirect, since guts do not fossilise and are inferred from rib cage and pelvis shape. Fossil samples are small and the classification of species such as Homo habilis is itself disputed. Other factors (social complexity, climate, shared child care) also contributed to brain growth.", "nl": "Editor's note: estimates of Homo erectus gut size are indirect, since guts do not fossilise and are inferred from rib cage and pelvis shape. Fossil samples are small and the classification of species such as Homo habilis is itself disputed. Other factors (social complexity, climate, shared child care) also contributed to brain growth."}, "sources": [], "flags": ["contested", "editor-note"]}], "links": [{"to": "tabar:cooking-hypothesis", "rel": "part-of", "note": {"fa": "فرضیهٔ پختن", "en": "The cooking hypothesis", "nl": "The cooking hypothesis"}}, {"to": "psy:n-human-brain", "rel": "see-also", "note": {"fa": "مغز انسان و شمار نورون‌ها", "en": "The human brain's neuron count", "nl": "The human brain's neuron count"}}, {"to": "tabar:social-brain-evolution", "rel": "contrasts", "note": {"fa": "جهش اجتماعی: چرا مغز اجتماعی شدیم", "en": "The social leap: why our brains went social", "nl": "The social leap: why our brains went social"}}, {"to": "tabar:brain-body-size-climate", "rel": "see-also", "note": {"fa": "اقلیم و اندازهٔ مغز و بدن در جنس انسان", "en": "Climate and brain and body size in Homo", "nl": "Climate and brain and body size in Homo"}}], "people": ["core:leslie-c-aiello", "core:peter-wheeler", "core:suzana-herculano-houzel"], "sources": ["src:232013ea8d", "src:983881b4b4", "src:c12cd83ad0", "src:c6648d6a35"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:lomekwi-3-site", "kind": "concept", "title": {"fa": "جایگاه لومکوی ۳ در ترکانای غربی (کنیا)", "en": "The Lomekwi 3 site, West Turkana, Kenya", "nl": "De vindplaats Lomekwi 3, West-Turkana, Kenia"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "لومکوی ۳ جایگاهی باستان‌شناختی در غرب دریاچهٔ ترکانا در شمال کنیاست. گروه هارمند و همکاران (۲۰۱۵) در آن ابزارهای سنگیِ برجا و فسیل‌هایی از دورهٔ پلیوسن یافتند و عمر ابزارها را حدود ۳٫۳ میلیون سال برآورد کردند. این تاریخ از کهن‌ترین ابزارهای سنگی شناخته‌شدهٔ پیش از آن، یعنی ابزارهای اولدوان با حدود ۲٫۶ میلیون سال، بسیار قدیمی‌تر است.", "en": "Lomekwi 3 (LOM3) is an archaeological site west of Lake Turkana in northern Kenya. Harmand and colleagues (2015) report in situ stone artefacts and Pliocene fossils there, and estimate the artefacts at about 3.3 million years, far older than the previously earliest known tools, the Oldowan at about 2.6 million years.", "nl": "Lomekwi 3 ligt ten westen van het Turkanameer in Noord-Kenia. Harmand e.a. (2015) melden er stenen artefacten ter plaatse uit het Plioceen, geschat op circa 3,3 miljoen jaar, ruim ouder dan het Oldowan (circa 2,6 miljoen jaar)."}, "points": [{"text": {"fa": "کاوش در این جایگاه از ۲۰۱۱ آغاز شد و تا پایان فصل ۲۰۱۲ حدود ۱۳ متر مربع را در بر گرفت. مجموعهٔ کنونی ۱۴۹ قطعهٔ سنگی دارد، از جمله ۸۳ هستهٔ سنگی، ۳۵ تراشه، ۷ سندان یا قطعهٔ ثابت، ۷ کوبه و چند قطعهٔ دیگر. بخشی از این‌ها روی سطح زمین پیدا شد و بخشی در لایه‌های رسوبی برجا.", "en": "Excavation began in 2011 and by the end of 2012 covered about 13 m². The current assemblage is 149 stone pieces: 83 cores, 35 flakes, 7 anvils or passive elements, 7 percussors and a few other items. Some lay on the surface and some were found in place in the sediment.", "nl": "Excavation began in 2011 and by the end of 2012 covered about 13 m². The current assemblage is 149 stone pieces: 83 cores, 35 flakes, 7 anvils or passive elements, 7 percussors and a few other items. Some lay on the surface and some were found in place in the sediment."}, "sources": ["src:23b2553ce8"], "flags": []}, {"text": {"fa": "تاریخ ۳٫۳ میلیون سال از چند چیز می‌آید: خاکستر آتشفشانی‌ای که با روش پرتوسنجی تاریخ‌گذاری شده (توفِ تورُتو، حدود ۳٫۳۱ میلیون سال)، موقعیت لایه‌ها در جدول وارونگی میدان مغناطیسی زمین، و برآورد نرخ رسوب‌گذاری. ابزارها حدود ۱۰ متر بالاتر از آن توف قرار دارند، پس جوان‌تر از آن‌اند. این تاریخ برآوردی درون‌یابی‌شده است، نه اندازه‌گیریِ مستقیمِ خود ابزارها.", "en": "The 3.3-million-year age rests on a radiometrically dated volcanic ash (the Toroto Tuff, about 3.31 Ma), the site's position in the geomagnetic polarity record, and estimated sedimentation rates. The tools lie about 10 m above that ash, so they are younger than it. The date is an interpolation, not a direct measurement of the tools themselves.", "nl": "The 3.3-million-year age rests on a radiometrically dated volcanic ash (the Toroto Tuff, about 3.31 Ma), the site's position in the geomagnetic polarity record, and estimated sedimentation rates. The tools lie about 10 m above that ash, so they are younger than it. The date is an interpolation, not a direct measurement of the tools themselves."}, "sources": ["src:23b2553ce8"], "flags": []}, {"text": {"fa": "نویسندگان با سه دلیل می‌گویند قطعه‌ها تقریباً در جای اصلی خود مانده‌اند: قطعه‌ها از ریزتراشه تا سنگ‌های بسیار بزرگ دیده می‌شوند؛ از سنگ‌ریزه‌هایی که آب آن رسوبات را آورده سنگین‌ترند؛ و لبه‌هایشان کم‌سایش است. یک تراشهٔ سطحی هم به هسته‌ای از لایهٔ برجا جفت می‌شود.", "en": "The authors give three reasons to think the pieces are close to where they were left: pieces range from tiny flake fragments to very large cobbles; they are heavier than the water that laid the sediment could carry; and their edges are little worn. One surface flake also refits onto a core from the in situ layer.", "nl": "The authors give three reasons to think the pieces are close to where they were left: pieces range from tiny flake fragments to very large cobbles; they are heavier than the water that laid the sediment could carry; and their edges are little worn. One surface flake also refits onto a core from the in situ layer."}, "sources": ["src:23b2553ce8"], "flags": []}, {"text": {"fa": "بررسی ایزوتوپ‌های کربن در گرهک‌های خاک نشان می‌دهد این‌جا در آن زمان محیطی بیشتر درختی و بوته‌زاری بوده (حدود ۴۷ درصد پوشش چوبی، با خطای حدود ۹ درصد)، نه علفزار باز. این با فرضِ قدیمیِ پیوند ابزارسازی با گسترش ساوانا نمی‌خواند.", "en": "Carbon-isotope analysis of soil nodules indicates a wooded, bushy setting at the time (about 47% woody cover, give or take 9%), not open grassland. This sits poorly with the older assumption that tool-making followed the spread of savannah.", "nl": "Carbon-isotope analysis of soil nodules indicates a wooded, bushy setting at the time (about 47% woody cover, give or take 9%), not open grassland. This sits poorly with the older assumption that tool-making followed the spread of savannah."}, "sources": ["src:23b2553ce8"], "flags": ["editor-note"]}, {"text": {"fa": "سنگ‌های مادّه عمدتاً بازالت و فونولیت بودند و از بسترهای رودخانه‌ای قدیمیِ نزدیک تأمین می‌شدند؛ کم‌تر از ۱۰۰ متر دورتر منبع سنگ‌ریزه و قلوه‌سنگ در همه اندازه‌ها بود و بزرگ‌ترین‌ها به‌طور پیوسته انتخاب شده‌اند.", "en": "Raw materials were mainly basalt and phonolite from nearby ancient channels. A conglomerate source lay less than 100 m away, and the largest blocks were consistently chosen.", "nl": "Raw materials were mainly basalt and phonolite from nearby ancient channels. A conglomerate source lay less than 100 m away, and the largest blocks were consistently chosen."}, "sources": ["src:23b2553ce8"], "flags": []}], "links": [{"to": "tabar:human-evolution", "rel": "part-of", "note": {"fa": "تکامل انسان", "en": "Human evolution", "nl": "Human evolution"}}, {"to": "tabar:lomekwian-stone-technology", "rel": "explains", "note": {"fa": "فناوری لومکوی", "en": "Lomekwian stone technology", "nl": "Lomekwian stone technology"}}, {"to": "tabar:first-toolmakers-debate", "rel": "see-also", "note": {"fa": "نخستین ابزارسازان: چه کسی و چرا", "en": "The first toolmakers: who and why", "nl": "The first toolmakers: who and why"}}], "people": ["core:sonia-harmand", "core:h-l-ne-roche"], "sources": ["src:23b2553ce8"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:neanderthal-discovery-and-body", "kind": "concept", "title": {"fa": "نئاندرتال: داستان کشف، بدن سازگار با یخبندان و زندگی پرمخاطره", "en": "The Neanderthal: discovery story, an ice-age body and a dangerous life", "nl": "De Neanderthaler: ontdekkingsverhaal, een ijstijdlichaam en een gevaarlijk leven"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "نئاندرتال، مشهورترین انسانِ دیگر، از حدود ۳۰۰ تا ۳۵۰ هزار سال پیش تا حدود ۳۷ تا ۴۰ هزار سال پیش از اروپای غربی تا آسیای جنوب‌غربی و مرکزی زندگی می‌کرد. «خداحافظ آفریقا» داستان کشفِ ۱۸۵۶ در درهٔ نئاندر و سال‌ها انکارِ اینکه این استخوان‌ها از جمعیتی دیگر از انسان باشند را روایت می‌کند، و سپس بدنِ نئاندرتال را شرح می‌دهد: مغزی حتی بزرگ‌تر از ما، قد کوتاه‌تر، اندام‌های ستبر و عضلانی، قفسهٔ سینهٔ بزرگ و بینی پهن که با سرمای دوره‌های یخبندان سازگار بود، و اسکلت‌هایی که تقریباً همه شکستگیِ جوش‌خورده دارند — نشانهٔ شکارِ تن‌به‌تنِ جانوران بزرگ.", "en": "The Neanderthal, the best-known other human, lived from about 300–350 ka to about 37–40 ka, from western Europe to SW and Central Asia. The programme recounts the 1856 Neander valley discovery and the years of denial that the bones belonged to another human population, then describes the Neanderthal body: a brain even larger than ours, shorter stature, thick muscular limbs, a big chest and broad nose suited to ice-age cold, and skeletons almost all bearing healed fractures — a sign of close-quarters hunting of large animals.", "nl": "De Neanderthaler leefde van ongeveer 300–350.000 tot 37–40.000 jaar geleden, van West-Europa tot Zuidwest- en Centraal-Azië. Het programma vertelt over de vondst in het Neandertal (1856) en de jarenlange ontkenning, en beschrijft het lichaam: een brein groter dan het onze, kleinere lengte, dikke gespierde ledematen, een brede borstkas en neus aangepast aan de ijstijd, en skeletten vol genezen breuken."}, "points": [{"text": {"fa": "کشف: در ۱۸۵۶ در درهٔ نئاندر نزدیک دوسلدورف آلمان («تال» یعنی دره؛ نئاندرتال یعنی «انسانِ درهٔ نئاندر»)، کارگران معدن سنگ آهک دهانهٔ غاری را گشودند و استخوان‌های زمختی یافتند: بخشی از کاسهٔ سر، استخوان ران، کتف. کارگران آن‌ها را استخوان جانور (مثلاً خرس غارزی) پنداشتند، اما رئیس معدن آن‌ها را دور نریخت و به یوهان کارل فولروت، معلم طبیعی‌دانِ محلی، خبر داد. فولروت دید که استخوان‌ها از انسان‌اند اما با هیچ انسانی که دیده بود شباهت ندارند، و با هرمان شافهاوزن، کالبدشناس دانشگاه بن، گزارش اولیه را منتشر کرد.", "en": "Discovery: in 1856 in the Neander valley near Düsseldorf ('Tal' = valley; Neanderthal = 'man of the Neander valley'), limestone quarry workers opened a cave and found robust bones — part of a skullcap, a femur, a shoulder blade. The workers took them for animal (e.g. cave bear) bones, but the quarry owner kept them and alerted Johann Carl Fuhlrott, a local naturalist teacher. Fuhlrott saw they were human yet unlike any human he knew, and published the first report with Hermann Schaaffhausen, an anatomist at Bonn.", "nl": "Ontdekking: in 1856 openden steengroevearbeiders in het Neandertal bij Düsseldorf een grot met robuuste botten. Ze dachten aan holenberen, maar de eigenaar waarschuwde de plaatselijke onderwijzer-natuuronderzoeker Johann Carl Fuhlrott, die met de Bonnse anatoom Hermann Schaaffhausen het eerste verslag publiceerde."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "ذهنیتِ ۱۸۵۶: برنامه تأکید می‌کند که در آن زمان هیچ فسیلی از انسانی جز خردمند کشف نشده بود — نه راست‌قامت، نه انسان‌ریخت‌های آفریقا. داروین حدس زده بود انسان‌های پیش از ما وجود داشته‌اند و خاستگاه احتمالاً آفریقاست، اما در میانهٔ عصر ویکتوریایی و زیر سیطرهٔ نگرش کلیسایی با احتیاط سخن می‌گفت. پس فرضِ «یک نوع دیگر از انسان» اصلاً در میان گزینه‌ها نبود؛ همان‌قدر عجیب بود که امروز کسی بگوید گونهٔ زندهٔ دیگری از انسان یافته است.", "en": "The 1856 mindset: no fossil of any non-sapiens human had yet been found — no erectus, no African hominins. Darwin had guessed that earlier humans existed and that Africa was the likely origin, but in mid-Victorian times, under church influence, he spoke cautiously. 'Another kind of human' was simply not among the options — as strange as someone today announcing a living second human species.", "nl": "De denkwereld van 1856: er was nog geen fossiel van een andere mensensoort gevonden. Darwin vermoedde eerdere mensen en een Afrikaanse oorsprong, maar sprak voorzichtig. 'Een andere soort mens' was geen optie — even vreemd als nu een tweede levende mensensoort aankondigen."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "از انکار تا پذیرش: کالبدشناسان برجسته توضیحاتی چون سوار قزاق، راشیتیسم، سردرد مزمن و «بربرهای ژرمن» پیشنهاد کردند (نک. مدخل سوگیری نژادی). سپس توماس هاکسلی، زیست‌شناس و دوست داروین، متوجه شد دو جمجمهٔ دیگر که پیش‌تر کشف و در گوشهٔ موزه رها شده بودند — یکی از اِنگیس در بلژیک و دیگری از غاری در جبل‌الطارق — همان ویژگی‌ها را دارند؛ پس با یک جمعیت روبه‌روییم، نه یک فرد بیمار. سرانجام ویلیام کینگ ایرلندی برای نخستین بار گفت این‌ها «نوع دیگری از انسان» بوده‌اند. واکنش جامعهٔ علمی نخست منفی بود، اما با یافته‌های فراوان‌تر در فرانسه، آلمان، ایتالیا و خاورمیانه، دیگر جای «اما و اگر» نماند.", "en": "From denial to acceptance: leading anatomists proposed a Cossack, rickets, chronic headache and 'Germanic barbarians' (see the entry on racial bias). Then Thomas Huxley, biologist and Darwin's friend, realised that two skulls found earlier and left in museum corners — one from Engis in Belgium, one from a Gibraltar cave — shared the same traits: a population, not one sick individual. The Irishman William King finally declared them 'another kind of human'. The initial reaction was negative, but as finds multiplied in France, Germany, Italy and the Middle East, doubt vanished.", "nl": "Van ontkenning naar aanvaarding: anatomen opperden een kozak, rachitis, hoofdpijn en 'Germaanse barbaren'. Thomas Huxley zag dat twee eerder gevonden schedels — uit Engis (België) en Gibraltar — dezelfde kenmerken hadden: een populatie. De Ier William King noemde ze als eerste 'een andere soort mens'. Met meer vondsten verdween de twijfel."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "داروین و جمجمهٔ جبل‌الطارق: داروین هرگز دربارهٔ فسیل‌های انسانی چیزی ننوشت و در این زمینه به هاکسلی ارجاع می‌داد. اما در یادداشتی آورده است که هنگامی که بیمار بود و در خانهٔ خواهرِ همسرش در لندن استراحت می‌کرد، دو دانشمند جمجمهٔ جبل‌الطارق را برایش آوردند؛ او آن را دید اما تشخیص خاصی نداد. به تعبیر برنامه، بزرگ‌ترین زیست‌شناس تاریخ جمجمهٔ یک نئاندرتال را در دست گرفت و رودررو نگاهش کرد، بی‌آنکه بفهمد به چه نگاه می‌کند.", "en": "Darwin and the Gibraltar skull: Darwin never wrote about human fossils and deferred to Huxley. But a note records that while ill and resting at his sister-in-law's house in London, two scientists brought him the Gibraltar skull; he looked at it without drawing any conclusion. The greatest biologist of all held a Neanderthal skull face to face without realising what he was looking at.", "nl": "Darwin en de Gibraltar-schedel: Darwin schreef nooit over menselijke fossielen. Toch kreeg hij, ziek en logerend in Londen, de Gibraltar-schedel te zien — zonder te beseffen wat het was."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "جمعیت و پراکنش: نئاندرتال‌ها از حدود ۳۰۰ تا ۳۵۰ هزار سال پیش تا حدود ۳۷ تا ۳۸ هزار سال پیش در پهنه‌ای از اروپای غربی تا آسیای جنوب‌غربی و آسیای مرکزی زندگی کردند و در آفریقا هیچ نمونه‌ای از آن‌ها نداریم. برآوردی که برنامه نقل می‌کند: در برخی دوره‌ها تنها حدود ۳۰ تا ۴۰ هزار نفر در کل این پهنه — جمعیتی تُنُک و پراکنده. آن‌ها بی‌گمان سخن می‌گفتند و با نیاکان مستقیم ما (کرومانیون‌ها) هزاران سال هم‌زمان بودند و آمیزش ژنتیکی داشتند؛ همهٔ ما (به‌جز بیشترِ آفریقایی‌های جنوب صحرا) اندکی DNA نئاندرتالی داریم.", "en": "Population and range: Neanderthals lived from about 300–350 ka to about 37–38 ka across western Europe, SW Asia and Central Asia; none are known from Africa. An estimate cited: at times only about 30–40,000 people across the whole range — thin and scattered. They certainly spoke, overlapped for thousands of years with our direct ancestors (Cro-Magnons) and interbred; most of us outside sub-Saharan Africa carry some Neanderthal DNA.", "nl": "Populatie en verspreiding: van ~300–350.000 tot ~37–38.000 jaar geleden, van West-Europa tot Centraal-Azië; niet in Afrika. Soms slechts 30–40.000 mensen in het hele gebied. Ze spraken, leefden duizenden jaren naast Cro-Magnons en kruisten met hen."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "غول یا افسانه؟ میزبان از دوستی جامعه‌شناس نقل می‌کند که «غول»ها در اسطوره‌ها خاطرهٔ رویارویی نیاکان ما با نئاندرتال‌اند. پاسخ گوینده درسی روش‌شناختی است: درست است که هم‌زمان بودند، اما چنین گزاره‌هایی آزمون‌پذیر نیستند و دانشمند باید بگوید «نمی‌دانم». افزون بر این، نئاندرتال‌ها ۱۰ تا ۱۵ سانتی‌متر کوتاه‌تر از ما بودند و با تصویرِ دیو یا غولِ تنومند جور درنمی‌آیند.", "en": "Ogres or myth? The host cites a sociologist friend who believes mythical ogres ('ghouls') preserve memories of encounters with Neanderthals. The speaker's answer is a lesson in method: they did coexist, but such claims are untestable, so a scientist must say 'I don't know'. Besides, Neanderthals were 10–15 cm shorter than us and do not fit the image of a giant.", "nl": "Reuzen of mythe? De presentator citeert een socioloog die mythische reuzen als herinnering aan Neanderthalers ziet. De spreker: zulke beweringen zijn niet toetsbaar, dus 'ik weet het niet'. Bovendien waren Neanderthalers 10–15 cm kleiner dan wij."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "مغز بزرگ‌تر، نه لزوماً پیچیده‌تر: میانگین حجم مغز نئاندرتال از ما بیشتر بود و برخی نمونه‌ها تا حدود ۱۷۳۰ سی‌سی می‌رسند. برنامه تأکید می‌کند که برای پیچیدگی، مغزی بزرگ لازم است، اما مهم‌تر از حجم، سازمان‌یابی نواحی مغز و پیوندهای میان آن‌هاست (پیوندهای سیناپسی). پیوند دیگری هم هست: اندازهٔ مغز با کانال زایمان رابطه‌ای «بهینه‌شده» دارد. لگن زنان پهن‌تر است تا سر نوزاد بگذرد؛ اگر مغز نوزاد کوچک‌تر باشد، دورهٔ رشد پس از تولد بسیار طولانی می‌شود و اگر بزرگ‌تر، جان مادر در زایمان به خطر می‌افتد — زایمان انسان همین حالا هم بسیار دردناک است و به همکاری دیگران نیاز دارد. لگنِ زنان نئاندرتال، متناسب با مغز بزرگ‌ترشان، پهن‌تر بود.", "en": "Bigger brain, not necessarily more complex: average Neanderthal brain volume exceeded ours, some reaching about 1,730 cc. Complexity needs a large brain, but organisation of brain regions and their connections matter more than volume. Brain size is also 'optimised' against the birth canal: women's pelvises are wider so the infant's head can pass; a smaller brain would mean a very long period of post-natal growth, a larger one would endanger the mother — human birth is already painful and needs help. Neanderthal women, matching their larger brains, had wider pelvises.", "nl": "Groter brein, niet per se complexer: Neanderthalerhersenen waren gemiddeld groter (tot ~1.730 cc). Organisatie en verbindingen tellen meer dan volume. Hersengrootte is ook 'geoptimaliseerd' tegen het geboortekanaal; Neanderthalervrouwen hadden een breder bekken."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "بدنِ یخبندان: نئاندرتال‌ها تقریباً تمام عمر گونه‌شان را در چرخه‌های یخچالی و میان‌یخچالی گذراندند — به گفتهٔ برنامه در سردترین دوره‌ها دمای مرداد در فلات مرکزی ایران شاید به حدود سه درجه بالای صفر می‌رسید. بدنشان با این سرما سازگار بود: ساق و بازوی کوتاه‌تر، استخوان‌های ستبر با جای اتصال عضلات قوی (که نشان می‌دهد عضلات نیرومندی داشتند)، قفسهٔ سینه و حجم شُش بسیار بیشتر از ما، و حفرهٔ بینی بزرگ و برجسته که هوای سرد را پیش از رسیدن به شُش‌ها گرم می‌کرد. برخی دانشمندان می‌گویند در سربالایی از ما بهتر راه می‌رفتند.", "en": "An ice-age body: Neanderthals spent nearly their whole existence in glacial–interglacial cycles — in the coldest phases, the programme says, August temperatures on Iran's central plateau may have been about 3 °C. Their bodies fit the cold: shorter forearms and shins, thick bones with strong muscle attachments, a much larger chest and lung volume, and a big projecting nose that warmed cold air before it reached the lungs. Some scientists think they walked uphill better than we do.", "nl": "Een ijstijdlichaam: Neanderthalers leefden vrijwel steeds in ijstijdcycli. Hun lichaam paste bij de kou: kortere onderarmen en schenen, dikke botten met sterke spieraanhechting, een grote borstkas en longinhoud, en een grote neus die koude lucht opwarmde."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "زندگی پرمخاطره: به گفتهٔ برنامه تقریباً هیچ اسکلت نئاندرتالی بدون شکستگیِ جوش‌خورده پیدا نمی‌شود: در بازو، کتف، ترقوه و ران. تفسیر رایج این است که آن‌ها از فاصلهٔ بسیار نزدیک شکار می‌کردند و با جانور «دست به گریبان» می‌شدند. نیزه و ابزار سنگیِ دسته‌دار داشتند، اما بررسی‌ها نشان می‌دهد بیشترِ این ابزارها پرتابی نبودند و در دست می‌ماندند. شکار آن‌ها جانورانی چون خرس غارزی، کرگدن پشمالو، ماموت و گوزن غول‌پیکرِ منقرض‌شده بود که طبیعتاً به‌شدت مقاومت می‌کردند. (برنامه یادآوری می‌کند که دایناسورها حدود ۶۶ میلیون سال پیش منقرض شده‌اند و تصویرِ کارتونیِ هم‌زمانیِ انسان و دایناسور نادرست است.)", "en": "A dangerous life: almost no Neanderthal skeleton lacks healed fractures — arm, shoulder blade, collarbone, thigh. The usual reading is close-range hunting, grappling with prey. They had spears and hafted stone points, but studies suggest most were thrust, not thrown. Prey included cave bears, woolly rhinos, mammoths and the extinct giant deer, all of which fought back. (The programme notes that dinosaurs died out some 66 million years ago, and cartoon images of humans with dinosaurs are wrong.)", "nl": "Een gevaarlijk leven: vrijwel elk Neanderthalerskelet vertoont genezen breuken. Ze jaagden van dichtbij met stootlansen op holenberen, wolharige neushoorns, mammoeten en reuzenherten."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "نقد و به‌روزرسانی: (۱) برآوردهای جمعیت نئاندرتال بسیار نامطمئن‌اند و بسته به روش (ژنتیک یا شمار محوطه‌ها) از چند هزار تا چند ده‌هزار نفر متغیرند. (۲) فرضیهٔ «شکستگی‌ها به دلیل شکار نزدیک» (برگر و ترینکاوس، ۱۹۹۵ با مقایسه با سوارکاران رودئو) را مطالعه‌های بعدی (مثلاً بیر و همکاران، ۲۰۱۸) زیر پرسش برده‌اند: الگوی آسیب سر و تنهٔ نئاندرتال‌ها با انسان‌های خردمندِ هم‌دوره تفاوت چندانی ندارد. (۳) پهنای لگن زنان نئاندرتال از یک اسکلت کامل (تابون) بازسازی شده و نتیجه‌گیری کلی از آن محتاطانه است. (۴) DNA نئاندرتالی در آفریقایی‌ها هم به مقدار کم (از راه مهاجرت‌های برگشتی) یافت شده است.", "en": "Critique and update: (1) Neanderthal population estimates are very uncertain, ranging from a few thousand to tens of thousands depending on method. (2) The 'fractures from close hunting' hypothesis (Berger & Trinkaus 1995, comparing rodeo riders) has been challenged (e.g. Beier et al. 2018): Neanderthal head and trunk injury patterns differ little from contemporary sapiens. (3) The wide female pelvis is reconstructed from a single fairly complete skeleton (Tabun), so generalisation is cautious. (4) Small amounts of Neanderthal DNA have also been found in Africans, via back-migration.", "nl": "Kritiek en update: (1) populatieschattingen zijn zeer onzeker. (2) De 'breuken door jacht'-hypothese (Berger & Trinkaus 1995) is betwist (Beier e.a. 2018). (3) Het brede bekken is gereconstrueerd uit één skelet (Tabun). (4) Ook Afrikanen dragen kleine hoeveelheden Neanderthaler-DNA via terugmigratie."}, "sources": ["src:60e7838a5a"], "flags": ["editor-note", "contested"]}, {"text": {"fa": "یادداشت خوانش: بر پایهٔ رونوشت خودکار اپیزود پنجمِ نسخهٔ رادیویی (کامل). گوینده می‌گوید چند اپیزود بعدی به زبان، شکار، مراقبت و آمیزش نئاندرتال‌ها با انسان خردمند می‌پردازد؛ از این اپیزودها فقط بخشی دربارهٔ آمیزش در دست بود که در مدخل‌های «آمیزش نئاندرتال» به آن پیوند داده شده است.", "en": "Reading note: based on the automatic transcript of radio episode 5 (in full). The speaker says later episodes cover Neanderthal language, hunting, care and interbreeding; of these only part on interbreeding was available and is linked from the admixture entries.", "nl": "Leesnotitie: gebaseerd op radioaflevering 5 (volledig). Latere afleveringen over taal, jacht en kruising waren grotendeels niet beschikbaar."}, "sources": ["src:60e7838a5a"], "flags": ["editor-note"]}], "links": [{"to": "tabar:neanderthal-admixture", "rel": "see-also", "note": {"fa": "آمیزش با انسان خردمند", "en": "interbreeding with Homo sapiens", "nl": "kruising met Homo sapiens"}}, {"to": "tabar:neanderthal-interbreeding-replacement", "rel": "see-also", "note": {"fa": "جایگزینی یا آمیزش", "en": "replacement or admixture", "nl": "vervanging of vermenging"}}, {"to": "tabar:brain-body-size-climate", "rel": "explains", "note": {"fa": "اندازهٔ بدن و مغز در برابر اقلیم", "en": "body and brain size versus climate", "nl": "lichaams- en hersengrootte tegenover klimaat"}}, {"to": "tabar:racial-bias-in-paleoanthropology", "rel": "see-also", "note": {"fa": "تفسیرهای نژادی اولیه", "en": "early racial interpretations", "nl": "vroege raciale interpretaties"}}, {"to": "tabar:homo-heidelbergensis-fire-and-campfire", "rel": "see-also", "note": {"fa": "نیاکان و DNA سیما", "en": "ancestry and the Sima DNA", "nl": "afstamming en het Sima-DNA"}}, {"to": "tabar:darwin-difficulties-fossil-record", "rel": "see-also", "note": {"fa": "داروین و کمبود فسیل انسانی", "en": "Darwin and the missing human fossils", "nl": "Darwin en ontbrekende mensfossielen"}}], "sources": ["src:60e7838a5a"], "people": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:social-brain-evolution", "kind": "concept", "title": {"fa": "جهش اجتماعی: چرا مغز اجتماعی شدیم", "en": "The social leap: why our brains went social", "nl": "De sociale sprong: waarom ons brein sociaal werd"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "فون هیپل استدلال می‌کند بزرگ‌ترین تغییر تکاملی انسان نه ابزار، که همکاری بود: نیاکان ما وقتی از جنگل به ساوانا رانده شدند، با سنگ‌پرانیِ گروهی و تقسیم کار زنده ماندند و مغزی ساختند که برای زندگی در گروه طراحی شده است؛ با همهٔ شادی‌ها و رنج‌هایش.", "en": "Von Hippel argues that humanity's biggest evolutionary change was not tools but cooperation: when our ancestors were pushed from forest to savanna they survived by group stone-throwing and division of labour, building a brain designed for group life, with all its joys and pains.", "nl": "Von Hippel betoogt dat de grootste evolutionaire verandering van de mens niet gereedschap was maar samenwerking: toen onze voorouders van bos naar savanne werden gedreven, overleefden ze door groepsgewijs stenen gooien en arbeidsdeling, en bouwden een brein ontworpen voor groepsleven, met al zijn vreugden en pijnen."}, "points": [{"text": {"fa": "فرضیهٔ مرکزی کتاب: ایستادن روی دو پا دست‌ها را آزاد کرد، پرتاب دقیقِ گروهی شکارچیان را دور نگه داشت، و «انتخاب طبیعی» شروع کرد به پاداش دادن به کسانی که بهتر هماهنگ می‌شدند. این یک روایت تکاملیِ قابل دفاع اما آزمون‌ناپذیر به معنای دقیق است.", "en": "The book's central hypothesis: standing upright freed the hands, accurate group throwing kept predators away, and natural selection began rewarding those who coordinated better. A defensible evolutionary narrative, but not strictly testable.", "nl": "The book's central hypothesis: standing upright freed the hands, accurate group throwing kept predators away, and natural selection began rewarding those who coordinated better. A defensible evolutionary narrative, but not strictly testable."}, "sources": ["src:4fb5cf55a3"], "flags": ["editor-note"]}, {"text": {"fa": "پیامدهای روان‌شناختی که کتاب می‌شمرد: شادی ما از پیوند و جایگاه اجتماعی می‌آید، نه از ثروت مطلق؛ خودفریبی برای قانع کردن دیگران تکامل یافته؛ و نوآوری محصول «مغز جمعی» است.", "en": "Psychological consequences the book draws: our happiness comes from social bonds and standing, not absolute wealth; self-deception evolved to persuade others; innovation is the product of the \"collective brain\".", "nl": "Psychological consequences the book draws: our happiness comes from social bonds and standing, not absolute wealth; self-deception evolved to persuade others; innovation is the product of the \"collective brain\"."}, "sources": ["src:4fb5cf55a3", "src:d8fb384d44"], "flags": []}, {"text": {"fa": "این تز با نظریهٔ تکامل فرهنگی هنریک و فرضیهٔ خوداهلی‌سازی رنگهام هم‌خوان است؛ هر سه ریشهٔ ویژگی انسان را در زندگی گروهی می‌بینند.", "en": "The thesis agrees with Henrich's cultural evolution theory and Wrangham's self-domestication hypothesis; all three locate the root of human distinctiveness in group life.", "nl": "The thesis agrees with Henrich's cultural evolution theory and Wrangham's self-domestication hypothesis; all three locate the root of human distinctiveness in group life."}, "sources": ["src:d8fb384d44"], "flags": []}], "links": [{"to": "psy:cultural-evolution", "rel": "bridges", "note": {"fa": "تکامل فرهنگی و مغز جمعی", "en": "Cultural evolution and the collective brain", "nl": "Cultural evolution and the collective brain"}}, {"to": "psy:self-domestication", "rel": "bridges", "note": {"fa": "خوداهلی‌سازی", "en": "Self-domestication", "nl": "Self-domestication"}}, {"to": "psy:happiness-origins", "rel": "bridges", "note": {"fa": "خاستگاه شادی", "en": "The origins of happiness", "nl": "The origins of happiness"}}, {"to": "psy:evo-sex", "rel": "see-also", "note": {"fa": "روان‌شناسی تکاملی در ویکی روان", "en": "Evolutionary psychology in the psychology wiki", "nl": "Evolutionary psychology in the psychology wiki"}}], "people": ["core:william-von-hippel", "core:joseph-henrich", "core:richard-wrangham"], "sources": ["src:4fb5cf55a3", "src:d8fb384d44"], "booklets": [], "origin": "book:social-leap", "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:zagros-neolithic", "kind": "concept", "title": {"fa": "کشاورزان نوسنگی زاگرس", "en": "Zagros Neolithic farmers", "nl": "Neolithische boeren van de Zagros"}, "aliases": ["گنج دره", "Ganj Dareh", "Wezmeh"], "parent": "tabar:population-genetics", "field": "tabar:population-genetics", "summary": {"fa": "ژنوم افراد ۹ تا ۱۰ هزار سال پیش از غرب ایران نشان داد کشاورزی در زاگرس به دست جمعیتی جدا از کشاورزان آناتولی آغاز شد؛ جمعیتی که به تبار ایرانیان امروز، جنوب آسیا و قفقاز کمک کرده است.", "en": "Genomes of people from western Iran 9 to 10 thousand years ago showed that farming in the Zagros began among a population separate from Anatolian farmers; a population that contributed to the ancestry of today's Iranians, South Asians and the Caucasus.", "nl": "Genomen van mensen uit West-Iran van 9 tot 10 duizend jaar geleden toonden dat de landbouw in de Zagros begon bij een bevolking los van de Anatolische boeren; een bevolking die bijdroeg aan de afstamming van hedendaagse Iraniërs, Zuid-Aziaten en de Kaukasus."}, "points": [{"text": {"fa": "بروشکی و همکاران (۲۰۱۶): چهار ژنوم از گنج دره و غار وزمه (کرمانشاه) و ابدول حسین (لرستان)، ۷ تا ۱۰ هزار سال پیش؛ شباهت ژنتیکی‌شان به کشاورزان آناتولی بسیار کم بود.", "en": "Broushaki et al. (2016): four genomes from Ganj Dareh and Wezmeh Cave (Kermanshah) and Abdul Hosein (Lorestan), 7 to 10 thousand years old; their genetic similarity to Anatolian farmers was very low.", "nl": "Broushaki et al. (2016): four genomes from Ganj Dareh and Wezmeh Cave (Kermanshah) and Abdul Hosein (Lorestan), 7 to 10 thousand years old; their genetic similarity to Anatolian farmers was very low."}, "sources": ["src:22aa9386b9"], "flags": []}, {"text": {"fa": "نتیجه: کشاورزی در هلال حاصلخیز دو خاستگاه جمعیتی داشت و در زاگرس احتمالاً به‌صورت مستقل یا از راه انتقال ایده (نه مهاجرت مردم) پدید آمد.", "en": "Conclusion: farming in the Fertile Crescent had two population origins and in the Zagros likely arose independently or through the spread of ideas rather than people.", "nl": "Conclusion: farming in the Fertile Crescent had two population origins and in the Zagros likely arose independently or through the spread of ideas rather than people."}, "sources": ["src:22aa9386b9", "src:519a39f1f8"], "flags": []}, {"text": {"fa": "این تبار زاگرسی بعدها در شکل‌گیری جمعیت‌های دشت ایران، جنوب آسیا (به‌ویژه در تبار «ایرانیِ باستان» مردم هند و پاکستان) و قفقاز سهم داشت.", "en": "This Zagros ancestry later contributed to the populations of the Iranian plateau, South Asia (notably the \"ancient Iranian\" ancestry of people in India and Pakistan) and the Caucasus.", "nl": "This Zagros ancestry later contributed to the populations of the Iranian plateau, South Asia (notably the \"ancient Iranian\" ancestry of people in India and Pakistan) and the Caucasus."}, "sources": ["src:73a4e45469", "src:519a39f1f8"], "flags": []}], "links": [{"to": "tabar:ancient-dna", "rel": "part-of", "note": {"fa": "یکی از یافته‌های انقلاب دی‌ان‌ای باستانی", "en": "One finding of the ancient DNA revolution", "nl": "One finding of the ancient DNA revolution"}}, {"to": "tabar:iranian-genetic-diversity", "rel": "explains", "note": {"fa": "بخشی از ریشهٔ تنوع ژنتیکی ایرانیان امروز", "en": "Part of the root of today's Iranian genetic diversity", "nl": "Part of the root of today's Iranian genetic diversity"}}, {"to": "soc:neolithic-institutions-before-farming", "rel": "see-also", "note": {"fa": "ادعایی دربارهٔ نقش نهادها در گذار به کشاورزی", "en": "A claim about the role of institutions in the transition to farming", "nl": "Een stelling over de rol van instituties in de overgang naar landbouw"}}], "people": [], "sources": ["src:22aa9386b9", "src:519a39f1f8", "src:73a4e45469"], "booklets": [], "origin": null, "iran": "iran:zagros-neolithic", "wikidata": null, "status": "draft"}, {"id": "tabar:eurasian-waves-eec-wec", "kind": "concept", "title": {"fa": "دو موج گسترش از کانون: شرق اوراسیایی و غرب اوراسیایی", "en": "Two expansions from the Hub: East and West Eurasian Core", "nl": "Twee uitbreidingen vanuit de Hub: Oost- en West-Euraziatische kern"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "بر پایهٔ مدل مقاله، نیاکان امروزیِ شرق و غرب اوراسیا در یک زمان از کانون بیرون نیامدند. موج اول (حدود ۴۵ هزار سال پیش) تبار «هستهٔ شرق اوراسیایی» را پراکند و موج دوم (حدود ۳۸ هزار سال پیش) تبار «هستهٔ غرب اوراسیایی» را. دومی بخش بزرگی از نخستین را در اروپا و غرب آسیا جذب کرد.", "en": "In the paper's model the ancestors of present-day East and West Eurasians did not leave the Hub at the same time. A first expansion (~45 kya) spread the 'East Eurasian Core' ancestry and a second (~38 kya) the 'West Eurasian Core' ancestry, which largely absorbed the first in Europe and West Asia.", "nl": "Volgens het model verlieten de voorouders van Oost- en West-Euraziërs de Hub niet tegelijk: een eerste golf (~45 kya) en een tweede (~38 kya), die de eerste in West-Eurazië grotendeels opnam."}, "points": [{"text": {"fa": "موج نخست (حدود ۴۵ هزار سال پیش) را نویسندگان «هستهٔ شرق اوراسیایی» (EEC) می‌نامند. نسل‌هایش در نمونه‌هایی مانند باچو کیرو (بلغارستان) و تیان‌یوان (چین) و در بیشتر مردم امروز شرق آسیا و اقیانوسیه دیده می‌شود. این موج با ابزارسازی «پارینه‌سنگی بالایی آغازین» (IUP) پیوند داده شده است.", "en": "The authors name the first expansion (~45 kya) the 'East Eurasian Core' (EEC). Its descendants appear in samples such as Bacho Kiro (Bulgaria) and Tianyuan (China) and in most present-day East Asians and Oceanians. It is linked to the Initial Upper Palaeolithic (IUP) toolkit.", "nl": "The authors name the first expansion (~45 kya) the 'East Eurasian Core' (EEC). Its descendants appear in samples such as Bacho Kiro (Bulgaria) and Tianyuan (China) and in most present-day East Asians and Oceanians. It is linked to the Initial Upper Palaeolithic (IUP) toolkit."}, "sources": ["src:3ec2e3a4ff"], "flags": []}, {"text": {"fa": "موج دوم (حدود ۳۸ هزار سال پیش) «هستهٔ غرب اوراسیایی» (WEC) است که در نمونه‌هایی مانند کوستنکی ۱۴ و سونگیر و در اروپاییان و غرب آسیاییان بعدی دیده می‌شود. به گفتهٔ مقاله این موج در اروپا بیشتر مردم پیشین را جذب کرد و تبار نخستین تقریباً فقط در شرق اوراسیا و اقیانوسیه باقی ماند.", "en": "The second expansion (~38 kya) is the 'West Eurasian Core' (WEC), seen in Kostenki14, Sunghir and later Europeans and West Asians. According to the paper it largely absorbed the earlier population in Europe, so the first lineage survives mainly in East Eurasia and Oceania.", "nl": "The second expansion (~38 kya) is the 'West Eurasian Core' (WEC), seen in Kostenki14, Sunghir and later Europeans and West Asians. According to the paper it largely absorbed the earlier population in Europe, so the first lineage survives mainly in East Eurasia and Oceania."}, "sources": ["src:3ec2e3a4ff"], "flags": []}, {"text": {"fa": "کانون خودش «ساقهٔ ساده» نبوده که شرق و غرب از آن جدا شوند؛ جمعیتِ ماندهٔ کانون پس از جدایی موج اول مدتی با تبار غربی رانش مشترک جمع کرد. نویسندگان صریحاً می‌گویند تصویر درست مجموعه‌ای از گسترش‌ها و انقراض‌های محلی است. این مطالعه برای بازسازی گسترش‌های قدیمی‌تر (مثل مورد زلاتی‌کونی) طراحی نشده بود.", "en": "The Hub itself was not a simple stem from which East and West split: the population remaining after the first expansion accumulated shared drift with the western lineage. The authors stress a picture of multiple expansions and local extinctions, and the study was not designed to reconstruct older ones (such as the Zlatý kůň lineage).", "nl": "The Hub itself was not a simple stem from which East and West split: the population remaining after the first expansion accumulated shared drift with the western lineage. The authors stress a picture of multiple expansions and local extinctions, and the study was not designed to reconstruct older ones (such as the Zlatý kůň lineage)."}, "sources": ["src:3ec2e3a4ff"], "flags": []}, {"text": {"fa": "نویسندگان فقط فرضیه می‌دهند که چرا ۲۰ هزار سال طول کشید: بازیابی جمعیت پس از گلوگاه خروج از آفریقا، سازگاری با محیط‌های تازه یا نوآوری فناورانه، تغییر پیوستگی زیستگاه‌ها و تعامل با گروه‌های باستانیِ محلی (نئاندرتال‌ها). این‌ها گمانه‌اند و در داده آزموده نشده‌اند.", "en": "The authors only hypothesise why it took ~20,000 years: demographic recovery after the Out-of-Africa bottleneck, adaptation or technological innovation, changing habitat connectivity, and interaction with local archaic groups (Neanderthals). These are conjectures not tested in the data.", "nl": "The authors only hypothesise why it took ~20,000 years: demographic recovery after the Out-of-Africa bottleneck, adaptation or technological innovation, changing habitat connectivity, and interaction with local archaic groups (Neanderthals). These are conjectures not tested in the data."}, "sources": ["src:3ec2e3a4ff"], "flags": ["contested", "editor-note"]}], "links": [{"to": "tabar:persian-plateau-hub", "rel": "part-of", "note": {"fa": "فلات ایران به‌عنوان کانون", "en": "The Persian Plateau as Hub", "nl": "The Persian Plateau as Hub"}}, {"to": "tabar:ancient-dna", "rel": "see-also", "note": {"fa": "انقلاب دی‌ان‌ای باستانی", "en": "The ancient DNA revolution", "nl": "The ancient DNA revolution"}}, {"to": "tabar:neanderthal-admixture", "rel": "see-also", "note": {"fa": "آمیزش با نئاندرتال‌ها", "en": "Admixture with Neanderthals", "nl": "Admixture with Neanderthals"}}, {"to": "tabar:basal-eurasian-ancestry", "rel": "see-also", "note": {"fa": "مدخل هم‌موضوع", "en": "Related entry", "nl": "Verwant lemma"}}], "people": [], "sources": ["src:3ec2e3a4ff"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:origins-of-war-chagha-sofla", "kind": "concept", "title": {"fa": "خاستگاه جنگ: خشونت همیشه بود، جنگ با کشاورزی پایدار شد (از تالهایم تا چغاسفلی)", "en": "The origins of war: violence was always there, war became sustainable with farming (from Talheim to Chagha Sofla)", "nl": "De oorsprong van oorlog: geweld was er altijd, oorlog werd duurzaam met de landbouw (van Talheim tot Chagha Sofla)"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "«خداحافظ آفریقا» میان خشونت، نزاع و پرخاشگری — که در همهٔ نخستی‌های گروه‌زی و از جمله نیاکان ما همیشه بوده — و «جنگ» به معنای کنش جمعیِ برنامه‌ریزی‌شده، پایدار و سازمان‌یافته با لجستیک تمایز می‌گذارد. استدلال برنامه این است که جنگ سازمان‌یافته پیش از یکجانشینی به سختی ممکن بود (جمعیت‌های کم، تحرک بالا، قلمروهای انعطاف‌پذیر)، اما با کشاورزی — مازاد، جمعیت‌های بزرگ، مالکیتِ زمین و خانه، مرزها و ایدئولوژی‌های متمایز — شرایطی پدید آمد که جنگ را پایدار کرد. شواهد: گورهای جمعی تالهایم آلمان و شلتس-آسپارن اتریش، ریزشِ تنوع کروموزوم Y حدود ۷ تا ۹ هزار سال پیش، و نمونه‌ای ایرانی: گور جمعی چغاسفلی نزدیک بهبهان، حدود ۶۰۰۰ سال پیش، که گوینده خودش جمجمه‌هایش را بررسی کرده است.", "en": "The programme distinguishes violence, conflict and aggression — always present in social primates, including our ancestors — from 'war': a planned, sustained, organised collective action with logistics. It argues organised war was hardly possible before sedentism (small populations, high mobility, flexible territories), but farming — surplus, large populations, ownership of land and houses, boundaries and rival ideologies — created conditions that made war sustainable. Evidence: the mass graves of Talheim (Germany) and Schletz-Asparn (Austria), a crash in Y-chromosome diversity 7–9,000 years ago, and an Iranian case: the mass grave at Chagha Sofla near Behbahan, about 6,000 years ago, whose skulls the speaker himself studied.", "nl": "Het programma onderscheidt geweld en agressie — altijd aanwezig bij groepslevende primaten — van 'oorlog': gepland, duurzaam, georganiseerd collectief handelen met logistiek. Vóór de landbouw was georganiseerde oorlog nauwelijks mogelijk; met overschot, grote populaties, grondbezit, grenzen en ideologieën werd oorlog duurzaam. Bewijs: Talheim, Schletz-Asparn, een ineenstorting van Y-chromosoomdiversiteit 7–9.000 jaar geleden, en het massagraf van Chagha Sofla bij Behbahan (~6.000 jaar)."}, "points": [{"text": {"fa": "ریشهٔ نخستی‌وار: به گفتهٔ برنامه، در بسیاری از پستانداران نسبت کشته‌شدن به دست هم‌نوع بسیار کم است، اما در شامپانزه‌ها تا حدود ۲ درصد می‌رسد و در انسان هم به‌طور میانگین حدود ۲ تا ۲٫۵ درصد — به شکلی شگفت‌آور همانند. پس سازوکاری زیستیِ مشابه در کار است. ما پستانداری میان‌جثه و نخستی‌ای گروه‌زی هستیم و همهٔ نخستی‌های گروه‌زی وقتی قلمروهایشان به هم می‌رسد یا بر سر جفت و رهبری رقابت می‌کنند، پرخاشگری و زدوخورد دارند. اما نزاع لزوماً به «جنگ» تبدیل نمی‌شود.", "en": "A primate root: in many mammals the share killed by their own kind is tiny, but in chimpanzees it reaches about 2%, and in humans on average about 2–2.5% — strikingly similar, suggesting a shared biological mechanism. We are mid-sized, group-living primates, and all such primates fight when territories touch or over mates and leadership. But fighting does not necessarily become 'war'.", "nl": "Een primatenwortel: bij chimpansees sterft ~2% door soortgenoten, bij mensen gemiddeld ~2–2,5%. Alle groepslevende primaten vechten om territorium, partners en leiderschap — maar vechten is nog geen oorlog."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "چه چیزی جنگ است؟ برنامه ویژگی‌های جنگ را چنین برمی‌شمارد: کنشی جمعی میان شمار زیادی از انسان‌ها، برنامه‌ریزی، وجود دشمن یا دشمنانی مشخص، تداوم، و از همه مهم‌تر سازمان‌دهی و لجستیک — که همه به گروه‌های انسانیِ بزرگ نیاز دارند. پس «هر جنگی خشونت است، اما هر خشونتی جنگ نیست». پیش از یکجانشینی، خشونت بی‌گمان بود: کهن‌ترین شاهدِ قطعی، به گفتهٔ برنامه، جمجمه‌ای ۴۳۰ هزارساله از اسپانیا (سیما د لوس اوئسوس) است که بر اثر ضربه‌های جسمی سخت مرده (مقاله‌ای در PLOS One، ۲۰۱۵). چگونه می‌دانیم آسیب پس از مرگ نبوده؟ استخوانِ زنده بر اثر ضربه فرو می‌رود و له می‌شود؛ استخوانِ خشک‌شده از هم می‌پاشد. با «تقلبِ شامپانزه» هم می‌توان نتیجه گرفت که خشونت در هایدلبرگ، راست‌قامت، انسان ماهر و استرالوپیتکوس‌ها هم بوده است. در غار شانیدر هم نئاندرتالی (شانیدر ۳) هست که سرپیکانی سنگی به دنده‌اش خورده و احتمالاً او را کشته است. شواهد آدم‌خواری هم هست، که لزوماً خشونت نیست.", "en": "What counts as war? A collective action involving many people, planning, a defined enemy or enemies, continuity, and above all organisation and logistics — all requiring large groups. So 'every war is violence, but not every violence is war'. Before sedentism violence certainly existed: the earliest definite case, the programme says, is a 430,000-year-old skull from Spain (Sima de los Huesos) killed by blows (PLOS One, 2015). How do we know the damage was not post-mortem? Living bone dents and crushes under a blow; dry bone shatters. The 'chimpanzee shortcut' suggests violence among heidelbergensis, erectus, habilis and australopiths too. At Shanidar a Neanderthal (Shanidar 3) has a stone point wound in a rib that likely killed him. There is also evidence of cannibalism, not necessarily violence.", "nl": "Wat is oorlog? Collectief, gepland, met een vijand, duurzaam en vooral georganiseerd met logistiek. 'Elke oorlog is geweld, maar niet elk geweld is oorlog.' Het oudste zekere geval: een 430.000 jaar oude schedel uit Spanje (PLOS One, 2015). Levend bot deukt in, droog bot versplintert. Shanidar 3 had een wond van een stenen punt."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "چرا پیش از کشاورزی جنگ سازمان‌یافته نبود؟ (۱) جمعیت‌ها کم بودند — مثلاً در برهه‌ای در کل اروپا حدود ۴۰ هزار نئاندرتال؛ احتمال برخورد بسیار کم بود. (۲) تحرک بالا بود و گروه‌ها می‌توانستند از هم دوری کنند. (۳) منابع متغیر و قلمروها انعطاف‌پذیر بودند. پس شکارگران نه از سر «صلح‌جوییِ ذاتی»، بلکه از سر جبر زیست‌محیطی آگاهانه از درگیری پرهیز می‌کردند. مالکیت هم بود اما محدود: مالکِ آنچه می‌توانستی حمل کنی — لباس، چوب‌دست، نیزه، چند سرپیکان، شاید آویزی از دندان ببر دندان‌خنجری؛ و قلمروهایی در دره‌ها و پیرامون غار، اما نه خط‌کشی‌شده و ثابت. مثال قوم‌نگاری: اسکیموها (اینوئیت‌ها) به‌شدت خشونت‌گریزند و نزاع‌ها را با کلمات حل می‌کنند؛ انسان‌شناسان نخستین آن را صلح‌جویی ذاتی پنداشتند، اما بعدها روشن شد که حساب سود و زیان در کار است: درگیری فیزیکی و شکستن دسته، شمار شکارچیان را کم می‌کرد و معیشت را به خطر می‌انداخت.", "en": "Why no organised war before farming? (1) Small populations — at times perhaps 40,000 Neanderthals in all Europe; encounters were rare. (2) High mobility let groups avoid one another. (3) Variable resources and flexible territories. So foragers avoided conflict not from innate peacefulness but from ecological necessity. Property existed but was limited to what one could carry — clothes, a staff, a spear, a few points, perhaps a sabre-tooth pendant; territories around valleys and caves existed but were not fixed or demarcated. An ethnographic example: the Inuit strongly avoid violence and settle disputes verbally; early anthropologists saw innate peacefulness, but later work showed a cost–benefit logic: fights that split a band cut the number of hunters and endangered survival.", "nl": "Waarom geen georganiseerde oorlog vóór de landbouw? Kleine, mobiele populaties met flexibele territoria. Bezit beperkte zich tot wat je kon dragen. De Inuit vermijden geweld, niet uit aard maar uit kosten-batenafweging: een gesplitste groep heeft te weinig jagers."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "کشاورزی و شرایط جنگ: در ۹۹ درصد زمانی که نیاکان ما زیستند، گروه‌های کوچکِ شکارگر و گردآورنده و لاشه‌خوار بودند؛ فقط در یک درصدِ پایانی — از حدود ۱۲ هزار سال پیش — تولید خوراک افزوده شد. تولید خوراک (به‌ویژه غلات، که از یک دانه چهل یا پنجاه برابر برداشت می‌شود) مازاد ساخت، جمعیت‌ها ناگهان بسیار بزرگ شدند و تحرک کم شد. مالکیت پررنگ شد: کشتزار، چراگاه، خانه — «اموال غیرمنقول» که نمی‌توان حملشان کرد. جمعیت‌ها به هم رسیدند، قلمروها مماس شدند و برخی چیزهایی داشتند که دیگران نداشتند. افزون بر این، ایدئولوژی‌ها: داستان‌هایی که هر گروه برای توضیح «از کجا آمده‌ایم، این‌جا چه می‌کنیم و به کجا می‌رویم» می‌ساخت؛ کافی بود داستانِ این دره با داستانِ درهٔ کناری فرق کند تا مرزی نادیدنی و ایدئولوژیک میانشان کشیده شود. برنامه یادآوری می‌کند که ما نخستی‌های دسته‌ای هستیم و هویت دسته نه فقط از معیارهای خودش، بلکه از تمایز با دسته‌های دیگر ساخته می‌شود. جمع‌بندی: «شاید کشاورزی جنگ را اختراع نکرده باشد، اما احتمالاً شرایطی را پدید آورد که جنگ‌ها بتوانند پایدار باشند.»", "en": "Farming and the conditions for war: for 99% of their existence our ancestors were small foraging and scavenging bands; only in the last 1% — from about 12,000 years ago — was food production added. Food production (especially cereals, yielding forty or fifty times the seed) created surplus, populations grew suddenly and mobility fell. Property expanded: fields, pastures, houses — 'immovable property' that cannot be carried. Populations met, territories touched, and some had what others lacked. Ideologies too: each group's story of 'where we came from, what we do here, where we go'; differing stories in neighbouring valleys drew an invisible ideological boundary. We are band-living primates whose group identity is defined partly by contrast with other groups. The summary: 'farming may not have invented war, but it probably created the conditions for war to become sustainable.'", "nl": "Landbouw en de voorwaarden voor oorlog: pas in de laatste 1% van onze geschiedenis kwam voedselproductie. Overschot, grote populaties, onroerend bezit en verschillende ideologieën trokken onzichtbare grenzen. 'De landbouw vond oorlog misschien niet uit, maar schiep de voorwaarden om hem duurzaam te maken.'"}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "شواهد جنگ در پیش از تاریخ: بیشتر رویدادها پیش از نگارش رخ داده‌اند؛ در جنوب‌غرب آسیا نگارش حدود ۵۵۰۰ سال پیش آغاز شد، اما نخست برای حساب‌وکتاب اقتصادی بود و ثبت رویدادها (و اغلب با افتخار، جنگ‌ها) دو سه هزار سال بعد آغاز شد. پیش از آن باستان‌شناس به دنبال الگوست، نه تک‌مورد: استخوان‌های آسیب‌دیده، جمجمه‌های شکسته، سرپیکان‌های فرورفته در استخوان، گورهای جمعی، و استحکامات دفاعی (گاه به بلندی ۶ تا ۸ متر). یک دست شکسته می‌تواند تصادف باشد، اما گوری جمعی که فقط مردان یا فقط زنان در آن‌اند، با زخم‌های مشابه و بی‌تدفینِ معمول، الگوی جنگ است. برنامه همچنین از نقاشی‌های صخره‌ایِ ۱۰ تا ۱۱ هزارساله‌ای یاد می‌کند که گروه‌هایی در حال نبرد را نشان می‌دهند.", "en": "Evidence of prehistoric war: most of it predates writing; in SW Asia writing began about 5,500 years ago but at first for accounting, and recording events (often proudly, wars) began two or three thousand years later. Before that archaeologists look for patterns, not single cases: injured bones, broken skulls, points embedded in bone, mass graves and fortifications (sometimes 6–8 m high). A broken arm may be an accident, but a mass grave of only men or only women, with similar wounds and no normal burial, is a pattern of war. The programme also mentions rock art 10–11,000 years old showing groups in combat.", "nl": "Bewijs: schrift begon ~5.500 jaar geleden, eerst voor boekhouding. Daarvoor zoekt men patronen: gebroken schedels, ingeslagen pijlpunten, massagraven, verdedigingswerken van 6–8 m. Ook rotskunst van 10–11.000 jaar toont gevechten."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "کروموزوم Y: مقاله‌ای در ۲۰۱۸ به رهبری زنگ و همکاران نشان داد در بازهٔ ۷ تا ۹ هزار سال پیش، تنوع کروموزوم Y — که فقط مردان حمل می‌کنند — در بخش‌هایی از جنوب‌غرب آسیا و اروپا (و جاهای دیگر) به‌شدت کاهش یافت؛ گویی شمار زیادی از مردان مردند یا تبارشان قطع شد. برنامه استدلال می‌کند که هیچ رویداد اقلیمی یا طبیعی‌ای را نمی‌شناسیم که فقط بر یک جنس اثر بگذارد، مگر جنگ و نزاع‌های بزرگ و پیچیده؛ و این بازه با بزرگ شدن جمعیت‌ها و پررنگ شدن مالکیت هم‌راستاست. اما برنامه خودش یادآوری می‌کند که چنین مقاله‌هایی همیشه سناریوهای دیگری هم دارند: پژوهش گویون و همکاران (۲۰۲۴) می‌گوید جابه‌جایی مردان میان گروه‌ها (ساختار تبار پدری) هم می‌توانسته این افت را بسازد.", "en": "The Y chromosome: a 2018 paper led by Zeng and colleagues showed that 7–9,000 years ago Y-chromosome diversity — carried only by men — fell sharply in parts of SW Asia and Europe (and elsewhere), as if many men died or their lineages ended. The programme argues no climatic or natural event affects only one sex, except wars and large conflicts, and the timing matches growing populations and property. But it notes that such papers always face alternatives: Guyon et al. (2024) argue that patrilineal clan struc
