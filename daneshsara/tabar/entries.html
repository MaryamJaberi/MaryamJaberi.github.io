ture and male movements between groups could also produce the drop.", "nl": "Het Y-chromosoom: Zeng e.a. (2018) vonden 7–9.000 jaar geleden een sterke daling van Y-diversiteit, mogelijk door oorlog. Guyon e.a. (2024) stellen dat patrilineaire clanstructuren dit ook kunnen verklaren."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "تالهایم، شلتس-آسپارن و چغاسفلی: (۱) تالهایم در جنوب آلمان، حدود ۷ هزار سال پیش: گوری جمعی با ۳۴ مرد و زن و کودک با ضربه‌های بسیار مشابه به جمجمه — از کهن‌ترین شواهد کشتار گروهی. (۲) شلتس-آسپارن در اتریش، حدود ۶ تا ۷ هزار سال پیش: سکونتگاهی با استحکامات دفاعی که بقایای ده‌ها انسان با ردِ ضربه و شکستگی در خندق‌های پیرامونش یافت شده؛ آثار محاصره و حمله. (۳) چغاسفلی نزدیک بهبهان در خوزستان، حدود ۶۰۰۰ سال پیش: تپه‌ای بزرگ که کاوش‌های عباس مقدم از حدود ده سال پیش نشان داد نیایشگاهی بزرگ داشته و کنارش گورهای بزرگی بوده؛ در یکی از آن‌ها بیش از پنجاه نفر روی هم تلمبار شده‌اند. گوینده خودش جمجمه‌ها و بقایای این محوطه را بررسی کرده است. برخی افراد جمجمه‌های کشیده داشتند — دستکاری جمجمه، رسمی که در بسیاری از نقاط جهان دیده می‌شود و احتمالاً نشانهٔ جایگاه یا گروهی خاص بود. بیشترِ افراد آن گور زنان و کودکان‌اند و ردِ ضربه‌های تیز و کوبنده بر جمجمه‌ها آشکار است. پرسش این است که مردان کجا بودند؟ بهترین سناریوی گوینده: مردان بیرون از سکونتگاه با گروهی دیگر جنگیدند و احتمالاً شکست خوردند؛ گروه پیروز وارد شد و کشتار کرد؛ و بعدها خویشاوندان آمدند و کشته‌شدگان را در این گور به خاک سپردند. به گفتهٔ برنامه، چغاسفلی یکی از متقن‌ترین شواهد خشونت و نوعی جنگ در ایران است.", "en": "Talheim, Schletz-Asparn and Chagha Sofla: (1) Talheim, southern Germany, about 7,000 years ago: a mass grave of 34 men, women and children with very similar skull blows — among the oldest evidence of group massacre. (2) Schletz-Asparn, Austria, about 6–7,000 years ago: a fortified settlement with dozens of people bearing blow and fracture marks in the surrounding ditches; signs of siege and attack. (3) Chagha Sofla near Behbahan, Khuzestan, about 6,000 years ago: a large mound where Abbas Moghaddam's excavations over the last decade revealed a large shrine and big graves; in one more than fifty people were heaped together. The speaker studied its skulls and remains himself. Some individuals had elongated skulls — cranial modification, practised in many parts of the world and probably marking status or group. Most in that grave were women and children, with clear sharp and blunt-force wounds. Where were the men? His best scenario: they fought elsewhere and probably lost; the victors entered and massacred; relatives later buried the dead in this grave. The programme calls Chagha Sofla one of the clearest pieces of evidence for violence and a form of war in Iran.", "nl": "Talheim (Duitsland, ~7.000 jaar): 34 doden met gelijksoortige schedelwonden. Schletz-Asparn (Oostenrijk, ~6–7.000 jaar): versterkte nederzetting met tientallen doden in de grachten. Chagha Sofla bij Behbahan (~6.000 jaar): een groot heiligdom en een graf met meer dan vijftig mensen, vooral vrouwen en kinderen met wonden; sommigen met kunstmatig verlengde schedels. De spreker onderzocht de schedels zelf. Waarschijnlijk vochten de mannen elders, verloren, en werd de nederzetting uitgemoord."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "هابز یا روسو؟ این پرسش قرن‌ها فیلسوفان را درگیر کرده: آیا چنان‌که هابز (و به گفتهٔ برنامه کانت) می‌گفت، انسان در وضع طبیعی مستعد شر بود و تمدن او را رام کرد، یا چنان‌که روسو می‌گفت، انسانِ وضع طبیعی صلح‌جو، خیرخواه و ساده‌زیست بود و تمدن خشونت را پدید آورد؟ پاسخ برنامه از دل شواهد: «هیچ‌کدام و هر دو». بسته به شرایط، جغرافیا، جمعیت و منابع، انسان‌ها همواره این توان را داشتند که گاه جنگجو و گاه صلح‌طلب باشند. اپیزود با پرسشی باز تمام می‌شود: آیا امروز جنگ‌طلبیِ انسان نسبت به سده‌ها و هزاره‌های گذشته کاهش یافته، یا هنوز مانند نیاکانمان بر سر منابع، ایدئولوژی و مالکیت می‌جنگیم؟", "en": "Hobbes or Rousseau? Philosophers have long asked whether, as Hobbes (and, the programme says, Kant) held, humans in the state of nature were prone to evil and tamed by civilisation, or, as Rousseau held, were peaceful, kind and simple until civilisation brought violence. The evidence-based answer: 'neither and both'. Depending on conditions, geography, population and resources, humans always had the capacity to be warlike or peaceable. The episode ends with an open question: has human warfare declined compared with past centuries and millennia, or do we still fight over resources, ideology and property like our ancestors?", "nl": "Hobbes of Rousseau? 'Geen van beide en allebei': afhankelijk van omstandigheden konden mensen strijdlustig of vreedzaam zijn. Open vraag: is oorlog vandaag afgenomen?"}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "نقد و دقت: (۱) جمجمهٔ ۴۳۰ هزارسالهٔ اسپانیا (جمجمهٔ ۱۷ سیما د لوس اوئسوس، سالا و همکاران، ۲۰۱۵) از جمعیتی نیاییِ نئاندرتال‌هاست، نه نئاندرتالِ کامل. (۲) پژوهش زنگ و همکاران در Nature Communications (۲۰۱۸) منتشر شد؛ تفسیر «جنگ» یکی از چند تفسیر است و خود پژوهشگران نقش ساختار قبیله‌ای پدرتباری را مهم دانستند. (۳) «ضربهٔ شمشیر» در رونوشت دربارهٔ چغاسفلی دقیق نیست: شمشیر فلزی هزاره‌ها بعد پدید آمد؛ احتمالاً منظور ضربهٔ ابزار تیز یا کوبنده است. تاریخ‌گذاری و تفسیر گورهای چغاسفلی هنوز در حال انتشار و بحث است. (۴) دربارهٔ «۲ درصد مرگ خشونت‌آمیز» (گومز و همکاران، نیچر، ۲۰۱۶) باید گفت این میانگین در جوامع انسانی بسیار متغیر است و در برخی جوامع پیش‌ازدولت بسیار بالاتر گزارش شده است. (۵) بحث «جنگ پیش از کشاورزی» داغ است: یافته‌های ناتاروک کنیا (حدود ۱۰ هزار سال، گروهی از شکارگران) و جبل صحابه در سودان (حدود ۱۳ هزار سال) نشان می‌دهد خشونت گروهی پیش از کشاورزی هم رخ می‌داد؛ دیدگاه‌های رقیب از «جنگ همیشه بوده» (کیلی، پینکر) تا «جنگ پدیده‌ای نوسنگی است» (فرگوسن، فرای) گسترده است. (۶) حل نزاع در اینوئیت‌ها بیشتر با «دوئل آوازی» و هجو توصیف شده است.", "en": "Critique and precision: (1) the 430,000-year-old Spanish skull (Sima de los Huesos Cranium 17, Sala et al. 2015) belongs to a Neanderthal-ancestral population, not a full Neanderthal. (2) Zeng et al. appeared in Nature Communications (2018); 'war' is one of several readings, and the authors themselves stressed patrilineal clan structure. (3) 'Sword wounds' in the transcript about Chagha Sofla is inaccurate — metal swords appeared millennia later; probably sharp or blunt implements are meant. The dating and interpretation of the Chagha Sofla graves are still being published and debated. (4) The '2% violent death' figure (Gómez et al., Nature 2016) varies greatly across human societies and is much higher in some pre-state groups. (5) 'War before farming' is hotly debated: Nataruk, Kenya (~10,000 years, foragers) and Jebel Sahaba, Sudan (~13,000 years) show group violence before farming; views range from 'war has always existed' (Keeley, Pinker) to 'war is a Neolithic phenomenon' (Ferguson, Fry). (6) Inuit conflict resolution is usually described as song duels and satire.", "nl": "Kritiek: (1) de 430.000 jaar oude schedel is pre-Neanderthaler. (2) Zeng e.a. verscheen in Nature Communications; 'oorlog' is één lezing. (3) 'Zwaardwonden' bij Chagha Sofla klopt niet: zwaarden kwamen millennia later. (4) Het 2%-cijfer varieert sterk. (5) Nataruk en Jebel Sahaba tonen groepsgeweld vóór de landbouw; het debat loopt van Keeley/Pinker tot Ferguson/Fry. (6) Inuit gebruiken vooral zangduels."}, "sources": ["src:60e7838a5a"], "flags": ["editor-note", "contested"]}, {"text": {"fa": "یادداشت خوانش: بر پایهٔ رونوشت خودکار یکی از اپیزودهای پادکستیِ «خداحافظ آفریقا» دربارهٔ آغاز جنگ (شمارهٔ آن در رونوشت نیامده؛ پس از اپیزودهای اهلی‌سازی و کشت گیاهان). چند جملهٔ آغازین اپیزود در رونوشت از دست رفته است.", "en": "Reading note: based on the automatic transcript of a podcast episode on the origins of war (number not given; after the domestication and plant episodes). The opening sentences are lost.", "nl": "Leesnotitie: gebaseerd op het transcript van een podcastaflevering over de oorsprong van oorlog (nummer onbekend). De eerste zinnen ontbreken."}, "sources": ["src:60e7838a5a"], "flags": ["editor-note"]}], "links": [{"to": "phil:hobbes-locke-state-of-nature-contrast", "rel": "bridges", "note": {"fa": "وضع طبیعی نزد هابز و لاک", "en": "Hobbes and Locke on the state of nature", "nl": "Hobbes en Locke over de natuurtoestand"}}, {"to": "phil:hobbes-three-causes-of-conflict-leviathan", "rel": "see-also", "note": {"fa": "سه علت نزاع در «لویاتان»", "en": "three causes of conflict in Leviathan", "nl": "drie oorzaken van conflict"}}, {"to": "tabar:forager-sharing-reciprocity", "rel": "see-also", "note": {"fa": "خودخواهی و هم‌رسانی در شکارگران", "en": "selfishness and sharing among foragers", "nl": "egoïsme en delen"}}, {"to": "tabar:animal-domestication-zagros-goat-pig-taboo", "rel": "see-also", "note": {"fa": "اهلی‌سازی و دام به‌عنوان دارایی", "en": "domestication and livestock as wealth", "nl": "domesticatie en vee als bezit"}}, {"to": "tabar:sex-bias-inequality-genome", "rel": "see-also", "note": {"fa": "نابرابری جنسیتی در ژنوم", "en": "sex bias and inequality in the genome", "nl": "seksebias in het genoom"}}, {"to": "tabar:haplogroups", "rel": "see-also", "note": {"fa": "هاپلوگروه‌های کروموزوم Y", "en": "Y-chromosome haplogroups", "nl": "Y-haplogroepen"}}, {"to": "tabar:near-east-first-farmers-structure", "rel": "see-also", "note": {"fa": "نخستین کشاورزان", "en": "the first farmers", "nl": "de eerste boeren"}}], "sources": ["src:60e7838a5a"], "people": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:india-two-migrations-ani-asi", "kind": "concept", "title": {"fa": "تاریخ جمعیتی هند: دو موج مهاجرت و نقش تبار کشاورزان ایرانی", "en": "Population history of India: two migrations and the role of Iranian-farmer ancestry", "nl": "Bevolkingsgeschiedenis van India: twee migraties en de rol van Iraanse-boerenafstamming"}, "aliases": [], "parent": "tabar:population-genetics", "field": "tabar:population-genetics", "summary": {"fa": "رایش و همکارانش نشان دادند تقریباً همهٔ گروه‌های هندی آمیزه‌ای از سه تبارند: شکارگردآورندگان جنوب آسیا (شبیه مردم جزایر آندامان)، تبار مرتبط با کشاورزان باستانی ایران و تبار دامداران استپ. این تاریخ شبیه اروپاست: نخست کشاورزان از غرب، سپس دامداران استپی. آنچه این مدل می‌گوید هرگز «تهاجم آریایی» به معنای فتح خشونت‌آمیز را اثبات نمی‌کند.", "en": "Reich and colleagues showed that almost every Indian group is a mix of three ancestries: South Asian hunter-gatherers (resembling Andamanese Islanders), ancestry related to ancient Iranian farmers, and steppe pastoralist ancestry. The history parallels Europe: first farmers from the west, then steppe herders. The model does not prove an 'Aryan invasion' in the sense of violent conquest.", "nl": "Reich en collega's toonden aan dat bijna elke Indiase groep een mengsel is van drie afstammingen: Zuid-Aziatische jager-verzamelaars, afstamming verwant aan oude Iraanse boeren en steppeherders. De geschiedenis loopt parallel aan Europa. Het model bewijst geen gewelddadige 'Arische invasie'."}, "points": [{"text": {"fa": "پس از ۲۰۰۹ رایش و همکارانش هند را «شیب (کلاین) هندی» توصیف کردند که از «شمال‌هندیانِ نیایی» (ANI) تا «جنوب‌هندیانِ نیایی» (ASI) می‌رسد: همهٔ گروه‌های هندی به نسبت‌های مختلف آمیزهٔ این دو هستند و ANI بیشتر با اروپا و خاورمیانه خویشاوند بود. این دو «جمعیت نیایی» از ابتدا مدل آماری بودند، نه گروه‌های دیده‌شده.", "en": "From 2009 Reich and colleagues described India as an 'Indian cline' from 'Ancestral North Indians' (ANI) to 'Ancestral South Indians' (ASI): every Indian group is a mix of these two in different proportions, with ANI more related to Europe and the Middle East. These two 'ancestral populations' were statistical models from the start, not observed groups.", "nl": "From 2009 Reich and colleagues described India as an 'Indian cline' from 'Ancestral North Indians' (ANI) to 'Ancestral South Indians' (ASI): every Indian group is a mix of these two in different proportions, with ANI more related to Europe and the Middle East. These two 'ancestral populations' were statistical models from the start, not observed groups."}, "sources": ["src:734b5345d2"], "flags": []}, {"text": {"fa": "پس از ۲۰۱۶ با دی‌ان‌ای کشاورزان باستانی ایران، مدل اصلاح شد: هر دو ANI و ASI دارای تبار مرتبط با کشاورزان ایرانی هستند. به برآورد پترسون ANI حدود نیمی از تبار دامداران استپ و نیمی از تبار کشاورزان مرتبط با ایران است و ASI حدود ۲۵ درصد کشاورز مرتبط با ایران و ۷۵ درصد شکارگردآورندهٔ بومی. کشاورزی غرب آسیا (گندم و جو) پس از ۹ هزار سال پیش به دره سند رسید.", "en": "After 2016, with DNA from ancient Iranian farmers, the model was revised: both ANI and ASI carry Iranian-farmer-related ancestry. In Patterson's estimate ANI is about half steppe and half Iranian-farmer-related, while ASI is about 25 percent Iranian-farmer-related and 75 percent local hunter-gatherer. West Asian farming (wheat and barley) reached the Indus Valley after 9,000 years ago.", "nl": "After 2016, with DNA from ancient Iranian farmers, the model was revised: both ANI and ASI carry Iranian-farmer-related ancestry. In Patterson's estimate ANI is about half steppe and half Iranian-farmer-related, while ASI is about 25 percent Iranian-farmer-related and 75 percent local hunter-gatherer. West Asian farming (wheat and barley) reached the Indus Valley after 9,000 years ago."}, "sources": ["src:a4f00f41ff", "src:519a39f1f8"], "flags": []}, {"text": {"fa": "توجه: «تبار مرتبط با کشاورزان ایرانی» یعنی تباری که به نمونه‌های باستانی زاگرس نزدیک است، نه اینکه از مردم کشور امروزی ایران آمده باشد. مطالعهٔ ۲۰۱۹ نارسیمهان و همکاران نمونه‌هایی از جایگاه‌های فلات ایران و آسیای میانه را با «پیرامون سند» و گروه‌های نخستین جنوب آسیا مقایسه کرد و تصویر پیچیده‌تری داد؛ مثلاً ASI و ANI دقیقاً به شکل دو جمعیت مجزای واقعی تلقی نمی‌شوند.", "en": "Note: 'Iranian-farmer-related' means ancestry close to ancient Zagros samples, not that it came from the people of the modern state of Iran. The 2019 study by Narasimhan and colleagues compared samples from sites on the Iranian plateau and Central Asia with the 'Indus Periphery' and early South Asian groups and drew a more complex picture; for example, ANI and ASI are no longer treated as two distinct real populations.", "nl": "Note: 'Iranian-farmer-related' means ancestry close to ancient Zagros samples, not that it came from the people of the modern state of Iran. The 2019 study by Narasimhan and colleagues compared samples from sites on the Iranian plateau and Central Asia with the 'Indus Periphery' and early South Asian groups and drew a more complex picture; for example, ANI and ASI are no longer treated as two distinct real populations."}, "sources": ["src:eb0de616f2"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "دربارهٔ تهاجم آریایی: رایش می‌گوید آمیختگی دلیل دگرگونی جمعیتی بزرگ نزدیک زمان زوال تمدن دره سند است، اما نه اثبات جنگ و ویرانی. در باستان‌شناسی نشانهٔ روشنی از سوزاندن شهرها نیست و زوال تدریجی بود. همین نظریه هم ناسیونالیست‌های اروپایی و نازی‌ها را جذب کرد و هم در هند حساس است چون اگر درست باشد اجزایی از فرهنگ هند «از بیرون» آمده‌اند.", "en": "On the 'Aryan invasion': Reich says the mixture proves major demographic change around the time of the Indus Valley decline but not war or destruction. Archaeology shows no clear layers of burned cities and the decline was gradual. The idea attracted European nationalists and the Nazis and is also sensitive in India, since if correct some elements of Indian culture came 'from outside'.", "nl": "On the 'Aryan invasion': Reich says the mixture proves major demographic change around the time of the Indus Valley decline but not war or destruction. Archaeology shows no clear layers of burned cities and the decline was gradual. The idea attracted European nationalists and the Nazis and is also sensitive in India, since if correct some elements of Indian culture came 'from outside'."}, "sources": ["src:a4f00f41ff"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "مدل چندان قطعی نیست: زمان دقیق ورود تبار استپی (در هزارهٔ دوم پیش از میلاد) و انتساب زبان‌های دراویدی به شکل‌گیری ASI از حدس‌های ارائه‌شده‌اند. رایش خودش می‌گوید همبستگی ASI و زبان‌های دراویدی بالاست و «به نظر می‌رسد» ارتباط داشته باشد؛ این استنباط است، نه یافتهٔ مستقیم.", "en": "The model is not final: the exact time of arrival of steppe ancestry (second millennium BCE) and the link between Dravidian languages and the formation of ASI are proposals. Reich himself says the correlation of ASI with Dravidian languages is high and a link 'seems likely'; this is inference, not a direct finding.", "nl": "The model is not final: the exact time of arrival of steppe ancestry (second millennium BCE) and the link between Dravidian languages and the formation of ASI are proposals. Reich himself says the correlation of ASI with Dravidian languages is high and a link 'seems likely'; this is inference, not a direct finding."}, "sources": ["src:a4f00f41ff"], "flags": ["editor-note"]}], "links": [{"to": "tabar:iranian-farmer-legacy", "rel": "explains", "note": {"fa": "میراث کشاورزان ایرانی در هند", "en": "Legacy of Iranian farmers in India", "nl": "Legacy of Iranian farmers in India"}}, {"to": "tabar:steppe-indo-iranian", "rel": "part-of", "note": {"fa": "وارد شدن تبار استپی", "en": "Arrival of steppe ancestry", "nl": "Arrival of steppe ancestry"}}, {"to": "tabar:caste-endogamy-founder-effect", "rel": "see-also", "note": {"fa": "درون‌همسری در هند", "en": "Endogamy in India", "nl": "Endogamy in India"}}, {"to": "tabar:zagros-neolithic", "rel": "see-also", "note": {"fa": "کشاورزان زاگرس", "en": "Zagros farmers", "nl": "Zagros farmers"}}], "people": ["core:david-reich", "core:kumarasamy-thangaraj", "core:priya-moorjani"], "sources": ["src:519a39f1f8", "src:734b5345d2", "src:a4f00f41ff", "src:eb0de616f2"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:neanderthal-interbreeding-replacement", "kind": "concept", "title": {"fa": "آمیزش یا جایگزینی: سرنوشت نئاندرتال‌ها و دنیسووایی‌ها در روایت هراری", "en": "Interbreeding or replacement: the fate of Neanderthals and Denisovans in Harari's telling", "nl": "Kruising of vervanging: het lot van neanderthalers en denisovanen bij Harari"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "هراری دو نظریهٔ رقیب دربارهٔ برخورد انسان خردمند با دیگر انسان‌ها را معرفی می‌کند و می‌گوید نتایج دی‌ان‌ای در ۲۰۱۰ نظریهٔ آمیزش را تا حدی تأیید کرد بی‌آنکه جایگزینی را رد کند. بخش علمی او با پژوهش‌های ۲۰۱۰ هم‌خوان است، اما حدس‌هایش دربارهٔ کشتار و «پاکسازی قومی» فرضی‌اند.", "en": "Harari presents two rival theories about how Homo sapiens met other humans and says the 2010 DNA results partly supported interbreeding without refuting replacement. His scientific core matches the 2010 research, but his remarks on massacre and 'ethnic cleansing' are speculative.", "nl": "Harari presenteert twee rivaliserende theorieën over de ontmoeting van Homo sapiens met andere mensen en stelt dat het DNA-onderzoek van 2010 kruising deels bevestigde zonder vervanging te weerleggen. Zijn opmerkingen over massamoord zijn speculatief."}, "points": [{"text": {"fa": "او تا نیمهٔ فصل نخست توضیح می‌دهد که در دورانی همزمان چندین گونهٔ انسانی (نئاندرتال، راست‌قامت، سولوئنسیس، فلورسی‌ینسیس، دنیسووا و جز آن) روی زمین می‌زیسته‌اند و تکامل انسان خطی نبوده است؛ او دست‌کم شش گونه را برای ۱۰۰ هزار سال پیش می‌شمارد. این تصویر شاخه‌شاخه با دانش امروز هماهنگ است، هرچند فهرست گونه‌ها و تاریخ انقراض‌ها (مثلاً فلورسی‌ینسیس) بعدها بازنگری شده است.", "en": "In the first chapter he explains that several human species (Neanderthal, erectus, soloensis, floresiensis, Denisova and others) coexisted and that human evolution was not linear; he counts at least six species 100,000 years ago. This branching picture fits current knowledge, though species lists and extinction dates (e.g. floresiensis) have since been revised.", "nl": "In the first chapter he explains that several human species (Neanderthal, erectus, soloensis, floresiensis, Denisova and others) coexisted and that human evolution was not linear; he counts at least six species 100,000 years ago. This branching picture fits current knowledge, though species lists and extinction dates (e.g. floresiensis) have since been revised."}, "sources": ["src:64cc653b84"], "flags": []}, {"text": {"fa": "«نظریهٔ آمیزش» می‌گوید مهاجران آفریقایی با جمعیت‌های محلی آمیختند؛ «نظریهٔ جایگزینی» می‌گوید جمعیت‌ها جدا ماندند و انسان خردمند بی‌ادغام جایگزین شد. هراری یادآوری می‌کند که این بحث پیامد سیاسی دارد، چون آمیزش گسترده می‌توانست خوراک نظریه‌های نژادپرستانه شود و برای همین جایگزینی مدتی از نظر سیاسی «درست‌تر» شمرده می‌شد.", "en": "The 'interbreeding theory' says African migrants mixed with local populations; the 'replacement theory' says the populations stayed separate and sapiens replaced them without merging. Harari notes the debate has political stakes, since wide interbreeding could feed racist theories, which is why replacement was for a time seen as more 'politically correct'.", "nl": "The 'interbreeding theory' says African migrants mixed with local populations; the 'replacement theory' says the populations stayed separate and sapiens replaced them without merging. Harari notes the debate has political stakes, since wide interbreeding could feed racist theories, which is why replacement was for a time seen as more 'politically correct'."}, "sources": ["src:64cc653b84"], "flags": []}, {"text": {"fa": "به نوشتهٔ او نتایج ۲۰۱۰ نشان داد یک تا چهار درصد دی‌ان‌ای انسان‌های امروزی در اروپا و خاورمیانه از نئاندرتال‌هاست و تا شش درصد دی‌ان‌ای ملانزیایی‌ها و بومیان استرالیا از دنیسووایی‌ها. هراری همین‌جا یادآوری می‌کند که پژوهش ادامه دارد و ممکن است برآوردها تغییر کند؛ درصدها از پژوهشی به پژوهش دیگر و بین جمعیت‌ها فرق می‌کنند.", "en": "He writes that the 2010 results showed 1-4% of the DNA of present-day people in Europe and the Middle East comes from Neanderthals, and up to 6% of Melanesian and Aboriginal Australian DNA from Denisovans. He adds that research continues and estimates may change; percentages vary between studies and populations.", "nl": "He writes that the 2010 results showed 1-4% of the DNA of present-day people in Europe and the Middle East comes from Neanderthals, and up to 6% of Melanesian and Aboriginal Australian DNA from Denisovans. He adds that research continues and estimates may change; percentages vary between studies and populations."}, "sources": ["src:64cc653b84", "src:7e2b22db3b", "src:892c33567f"], "flags": []}, {"text": {"fa": "او نتیجه می‌گیرد که دیدگاه آمیزش «تا حدی» محق است، اما چون سهم ژنی کم است نمی‌توان از «ادغام» سخن گفت: تماس‌ها نادر بود و تنها چند ژن به نسل‌های بعد رسید. این جمع‌بندی با تصویر رایج «جایگزینی نشتی» همخوان است.", "en": "He concludes the interbreeding view is right 'at least in part', but with such small gene shares one cannot speak of 'merging': contacts were rare and only a few genes were passed on. This summary accords with the common picture of 'leaky replacement'.", "nl": "He concludes the interbreeding view is right 'at least in part', but with such small gene shares one cannot speak of 'merging': contacts were rare and only a few genes were passed on. This summary accords with the common picture of 'leaky replacement'."}, "sources": ["src:64cc653b84", "src:7e2b22db3b"], "flags": []}, {"text": {"fa": "هراری دو علت محتمل برای ناپدید شدن نئاندرتال‌ها می‌آورد: برتری رقابتی انسان خردمند و کاهش تدریجی جمعیت آن‌ها، یا خشونت و «اولین پاکسازی قومی تاریخ». هر دو حدس‌اند؛ شاهد مستقیم کشتار گسترده وجود ندارد و پژوهشگران عوامل دیگر (اقلیم، جمعیت اندک، درون‌آمیزی) را هم مطرح می‌کنند. توصیف نئاندرتال‌ها به‌عنوان «کم‌ابتکار» و ناتوان در تجارت دوربرد نیز با یافته‌های تازه‌تر دربارهٔ فرهنگ آن‌ها هماهنگ نیست.", "en": "Harari offers two likely causes of Neanderthal disappearance: sapiens' competitive edge and the gradual shrinking of their numbers, or violence and 'the first and most significant ethnic cleansing'. Both are conjecture; there is no direct evidence of mass killing, and researchers also propose other factors (climate, small populations, inbreeding). His portrayal of Neanderthals as less inventive and lacking long-distance trade also sits uneasily with newer findings on their culture.", "nl": "Harari offers two likely causes of Neanderthal disappearance: sapiens' competitive edge and the gradual shrinking of their numbers, or violence and 'the first and most significant ethnic cleansing'. Both are conjecture; there is no direct evidence of mass killing, and researchers also propose other factors (climate, small populations, inbreeding). His portrayal of Neanderthals as less inventive and lacking long-distance trade also sits uneasily with newer findings on their culture."}, "sources": ["src:64cc653b84", "src:da10502659"], "flags": ["contested", "editor-note"]}], "links": [{"to": "tabar:neanderthal-admixture", "rel": "explains", "note": {"fa": "روایت عامه‌پسند از آمیزش با نئاندرتال‌ها", "en": "Popular account of Neanderthal admixture", "nl": "Popular account of Neanderthal admixture"}}, {"to": "tabar:ancient-dna", "rel": "see-also", "note": {"fa": "انقلاب دی‌ان‌ای باستانی", "en": "The ancient DNA revolution", "nl": "The ancient DNA revolution"}}, {"to": "tabar:out-of-africa", "rel": "see-also", "note": {"fa": "خاستگاه آفریقایی انسان خردمند", "en": "The African origin of Homo sapiens", "nl": "The African origin of Homo sapiens"}}], "people": ["core:svante-p-bo"], "sources": ["src:64cc653b84", "src:7e2b22db3b", "src:892c33567f", "src:da10502659"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:population-genetics", "kind": "field", "title": {"fa": "ژنومیک جمعیت و تبار", "en": "Population genomics & ancestry", "nl": "Populatiegenomica & afstamming"}, "aliases": [], "parent": "tabar:tabar", "field": null, "summary": {"fa": "دی‌ان‌ای مردم امروز و استخوان‌های باستانی چه می‌گویند دربارهٔ مهاجرت‌ها، آمیزش‌ها و شکل‌گیری جمعیت‌ها؟", "en": "What do the DNA of living people and ancient bones tell about migrations, admixtures and the making of populations?", "nl": "Wat vertellen het DNA van levende mensen en oude botten over migraties, vermengingen en het ontstaan van bevolkingen?"}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:eugenics", "kind": "concept", "title": {"fa": "به‌نژادی: تاریخ تاریک ژنتیک", "en": "Eugenics: the dark history of genetics", "nl": "Eugenetica: de donkere geschiedenis van de genetica"}, "aliases": [], "parent": "tabar:genetics-society", "field": "tabar:genetics-society", "summary": {"fa": "گالتون در ۱۸۸۳ واژهٔ eugenics را ساخت: «بهبود نژاد» با کنترل تولیدمثل. در نیمهٔ اول قرن بیستم به عقیم‌سازی اجباری ده‌ها هزار نفر در آمریکا و اسکاندیناوی و به نسل‌کشی نازی انجامید. ژنتیک امروز با همین سابقه زندگی می‌کند و هر بحث «ژن و جامعه» باید آن را به یاد داشته باشد.", "en": "Galton coined \"eugenics\" in 1883: \"improving the race\" by controlling reproduction. In the first half of the twentieth century it led to the forced sterilisation of tens of thousands in the US and Scandinavia and to Nazi genocide. Genetics lives with this record today, and every \"genes and society\" debate must remember it.", "nl": "Galton muntte in 1883 het woord \"eugenetica\": \"het ras verbeteren\" door de voortplanting te sturen. In de eerste helft van de twintigste eeuw leidde het tot gedwongen sterilisatie van tienduizenden in de VS en Scandinavië en tot de nazi-genocide. De genetica leeft vandaag met dit verleden, en elk debat over \"genen en samenleving\" moet het onthouden."}, "points": [{"text": {"fa": "کولز (۱۹۸۵): جنبش به‌نژادی در آمریکا و بریتانیا جریانی «پیشرو» و علمی‌نما بود؛ قوانین عقیم‌سازی در بیش از ۳۰ ایالت آمریکا تصویب شد و دیوان عالی در ۱۹۲۷ (پروندهٔ باک علیه بل) آن را تأیید کرد.", "en": "Kevles (1985): the eugenics movement in the US and Britain was a \"progressive\", science-flavoured current; sterilisation laws passed in over 30 US states and the Supreme Court upheld them in 1927 (Buck v. Bell).", "nl": "Kevles (1985): the eugenics movement in the US and Britain was a \"progressive\", science-flavoured current; sterilisation laws passed in over 30 US states and the Supreme Court upheld them in 1927 (Buck v. Bell)."}, "sources": ["src:34537dde7a"], "flags": []}, {"text": {"fa": "درس برای امروز: هاردن استدلال می‌کند پذیرفتن نقش ژن‌ها در تفاوت‌های اجتماعی لزوماً به‌نژادی نیست؛ می‌تواند، برعکس، پایه‌ای برای برابری‌خواهی باشد («بخت‌آزمایی ژنتیکی» را نباید با شایستگی اشتباه گرفت). این موضع خودش محل بحث است.", "en": "A lesson for today: Harden argues that accepting the role of genes in social differences is not necessarily eugenic; it can, conversely, ground egalitarianism (the \"genetic lottery\" must not be mistaken for merit). That position is itself debated.", "nl": "A lesson for today: Harden argues that accepting the role of genes in social differences is not necessarily eugenic; it can, conversely, ground egalitarianism (the \"genetic lottery\" must not be mistaken for merit). That position is itself debated."}, "sources": ["src:b1c0eba86d"], "flags": ["contested"]}], "links": [{"to": "tabar:race-biology", "rel": "see-also", "note": {"fa": "نژاد و زیست‌شناسی", "en": "Race and biology", "nl": "Race and biology"}}, {"to": "atlas:genethics", "rel": "part-of", "note": {"fa": "پل اخلاق ژنتیک", "en": "The genetic ethics bridge", "nl": "The genetic ethics bridge"}}, {"to": "psy:degeneration", "rel": "bridges", "note": {"fa": "نظریهٔ انحطاط در ویکی روان", "en": "Degeneration theory in the psychology wiki", "nl": "Degeneration theory in the psychology wiki"}}], "people": ["core:francis-galton", "core:kathryn-paige-harden"], "sources": ["src:34537dde7a", "src:b1c0eba86d"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:tabar", "kind": "root", "title": {"fa": "تبار و ژنتیک", "en": "Lineage & Genetics", "nl": "Afstamming & genetica"}, "aliases": [], "parent": null, "field": null, "summary": {"fa": "از کجا آمده‌ایم و چه‌قدر از آنچه هستیم به ارث رسیده؟ این ویکی ژنتیک رفتاری، تاریخ ژنومیِ جمعیت‌ها، تکامل انسان، اپی‌ژنتیک و تبارشناسی را کنار هم می‌گذارد؛ با تأکید بر اینکه «وراثتی» به معنی «تغییرناپذیر» نیست.", "en": "Where do we come from, and how much of who we are is inherited? This wiki brings together behaviour genetics, the genomic history of populations, human evolution, epigenetics and genealogy, stressing that \"heritable\" does not mean \"unchangeable\".", "nl": "Waar komen we vandaan, en hoeveel van wie we zijn is geërfd? Deze wiki brengt gedragsgenetica, de genomische geschiedenis van bevolkingen, menselijke evolutie, epigenetica en genealogie samen, met de nadruk dat \"erfelijk\" niet \"onveranderlijk\" betekent."}, "points": [], "links": [{"to": "psy:psych-genetics", "rel": "bridges", "note": {"fa": "ژنتیک روان‌پزشکی در ویکی روان", "en": "Psychiatric genetics in the psychology wiki", "nl": "Psychiatric genetics in the psychology wiki"}}, {"to": "psy:cultural-evolution", "rel": "bridges", "note": {"fa": "تکامل فرهنگی", "en": "Cultural evolution", "nl": "Cultural evolution"}}, {"to": "psy:anthropology", "rel": "bridges", "note": {"fa": "انسان‌شناسی", "en": "Anthropology", "nl": "Anthropology"}}], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:darwin-biogeography", "kind": "concept", "title": {"fa": "پراکنش جغرافیایی جانداران و جزیره‌ها نزد داروین", "en": "Geographical distribution and islands in Darwin", "nl": "Geografische verspreiding en eilanden bij Darwin"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "داروین استدلال می‌کند که الگوی پراکنش جانداران را فقط «نیای مشترک + پراکنده‌شدن + دگرگونی» توضیح می‌دهد، نه آفرینش جداگانهٔ هر گونه در هر محل. شباهت جانداران جزیره‌ها به نزدیک‌ترین قاره، و نبود پستانداران بومی در بسیاری از جزیره‌های اقیانوسی، از شاهدهای اصلی او بود.", "en": "Darwin argues that only 'common descent + dispersal + modification' explains how life is distributed, not separate creation of each species in each place. The resemblance of island life to the nearest mainland, and the lack of native land mammals on many oceanic islands, were key evidence.", "nl": "Darwin betoogt dat alleen gemeenschappelijke afstamming, verspreiding en wijziging de verspreiding van leven verklaart, niet aparte schepping per plek. De gelijkenis van eilandfauna met het naburige vasteland was een belangrijk bewijs."}, "points": [{"text": {"fa": "جاندارانِ جاهای با اقلیم یکسان اما جدا از هم (مثل نیمکرهٔ شمالی و جنوبی) بسیار با هم فرق دارند، ولی در یک قاره، حتی با اقلیم‌های گوناگون، شبیه‌اند. این یعنی «نسب و مهاجرت» مهم‌تر از فقط اقلیم است. نمونه: رئا (شترمرغ آمریکایی) در آمریکای جنوبی به‌جای شترمرغ واقعی.", "en": "Life in similar climates but far apart (such as northern and southern hemispheres) differs greatly, yet within a continent, even across climates, forms resemble each other. So ancestry and migration matter more than climate alone. Example: the rhea in South America rather than a true ostrich.", "nl": "Life in similar climates but far apart (such as northern and southern hemispheres) differs greatly, yet within a continent, even across climates, forms resemble each other. So ancestry and migration matter more than climate alone. Example: the rhea in South America rather than a true ostrich."}, "sources": ["src:84786f7bfa"], "flags": []}, {"text": {"fa": "داروین آزمایش کرد که آیا بذر پس از ماندن در آب شور می‌روید و نتیجه گرفت پراکندن بذر و جانوران ازراه آب، باد، پرندگان و یخ‌های شناور ممکن است. جزیره‌های اقیانوسی گونه‌های بومی خاص خود را دارند (که او با دگرگونی پس از رسیدن نخستین مهاجران توضیح می‌دهد)، ولی غالباً پستاندار خشکی‌زی بومی ندارند. دوران یخبندان را هم برای توضیح حضور گیاهان قطبی روی قلهٔ کوه‌ها به کار برد.", "en": "Darwin experimented to see whether seeds still sprout after soaking in salt water and concluded that dispersal by water, wind, birds and floating ice is possible. Oceanic islands have their own endemic species (explained as change after the first colonists arrived) but usually no native land mammals. He also used the Ice Age to explain arctic plants on mountaintops.", "nl": "Darwin experimented to see whether seeds still sprout after soaking in salt water and concluded that dispersal by water, wind, birds and floating ice is possible. Oceanic islands have their own endemic species (explained as change after the first colonists arrived) but usually no native land mammals. He also used the Ice Age to explain arctic plants on mountaintops."}, "sources": ["src:84786f7bfa"], "flags": []}, {"text": {"fa": "اصلاح: داروین فرضِ «پل‌های خشکی» میان قاره‌ها را نمی‌پسندید و بیشتر بر پراکنده‌شدن تکیه داشت، ولی امروز می‌دانیم خیلی از الگوهای پراکنش با جابه‌جایی قاره‌ها (زمین‌ساخت صفحه‌ای، به پیشنهاد وگنر ۱۹۱۵ و پذیرش در دههٔ ۱۹۶۰) توضیح داده می‌شود، مثل ربط میان جانداران قاره‌های جنوبی. بنابراین پراکنده‌شدن تنها توضیح نیست؛ جدا‌ماندن جمعیت‌ها بر اثر شکافتن زیستگاه («واریکانس») هم نقش دارد.", "en": "Correction: Darwin rejected hypothetical 'land bridges' and relied on dispersal, but we now know many distribution patterns are explained by drifting continents (plate tectonics, proposed by Wegener in 1915 and accepted in the 1960s), as with links among southern-continent life. Dispersal across water is not the sole explanation; vicariance matters too.", "nl": "Correction: Darwin rejected hypothetical 'land bridges' and relied on dispersal, but we now know many distribution patterns are explained by drifting continents (plate tectonics, proposed by Wegener in 1915 and accepted in the 1960s), as with links among southern-continent life. Dispersal across water is not the sole explanation; vicariance matters too."}, "sources": ["src:81e1e7ae28"], "flags": ["dated", "editor-note"]}, {"text": {"fa": "یک افسانهٔ رایج: «سهره‌های داروین» در متن ۱۸۵۹ نقش مرکزی ندارند. در سفر بیگل (۱۸۳۱–۱۸۳۶) مشاهدهٔ گالاپاگوس به او کمک کرد، اما نقش سهره‌ها در داستان تکامل بیشتر به پژوهش‌های بعدی (لاک، گرانت‌ها) برمی‌گردد.", "en": "A common myth: 'Darwin's finches' play no central role in the 1859 text. The Galápagos on the Beagle voyage (1831–1836) helped him, but the finches' fame in the evolution story owes more to later research (Lack, the Grants).", "nl": "A common myth: 'Darwin's finches' play no central role in the 1859 text. The Galápagos on the Beagle voyage (1831–1836) helped him, but the finches' fame in the evolution story owes more to later research (Lack, the Grants)."}, "sources": ["src:84786f7bfa", "src:9bfbba7cbd"], "flags": ["contested", "editor-note"]}], "links": [{"to": "tabar:out-of-africa", "rel": "see-also", "note": {"fa": "خاستگاه آفریقایی انسان خردمند؛ نمونهٔ پراکنش انسان", "en": "African origin of Homo sapiens: human dispersal", "nl": "African origin of Homo sapiens: human dispersal"}}, {"to": "tabar:population-genetics", "rel": "see-also", "note": {"fa": "ژنومیک جمعیت و تبار", "en": "Population genomics and ancestry", "nl": "Population genomics and ancestry"}}, {"to": "tabar:human-evolution", "rel": "part-of", "note": {"fa": "تکامل انسان", "en": "Human evolution", "nl": "Human evolution"}}], "people": ["core:alfred-wegener", "core:joseph-dalton-hooker"], "sources": ["src:81e1e7ae28", "src:84786f7bfa", "src:9bfbba7cbd"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:homo-heidelbergensis-fire-and-campfire", "kind": "concept", "title": {"fa": "انسان هایدلبرگ، مهار آتش و پیدایش «دورِ آتش»", "en": "Homo heidelbergensis, the control of fire and the birth of the campfire circle", "nl": "Homo heidelbergensis, de beheersing van vuur en het ontstaan van de kring rond het kampvuur"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "انسان هایدلبرگ حدود ۸۰۰ تا ۹۰۰ هزار سال پیش، به احتمال زیاد در آفریقا و از نسل راست‌قامت، پدید آمد: آمیزه‌ای عجیب از ویژگی‌های کهن (فک زمخت، ابروی برجسته) و نو (دندان‌های کوچک، پیشانی در حال شکل‌گیری، مغزی نزدیک به اندازهٔ ما). «خداحافظ آفریقا» این انسان را با مهارِ پایدارِ آتش پیوند می‌دهد و زنجیره‌ای از پیامدها را شرح می‌دهد: پختنِ خوراک و کوچک‌شدن دندان‌ها، کوتاه‌شدن روده و آزادشدن انرژی برای مغز، خواب عمیق و امن در کنار آتش، و حلقهٔ شبانهٔ دورِ آتش که قصه‌گویی، موسیقی و فرهنگ شفاهی در آن شکل گرفت. شواهد آدم‌خواری و چاهِ پر از استخوانِ «سیما د لوس اوئسوس» در اسپانیا هم از همین انسان است.", "en": "Homo heidelbergensis arose about 800–900 ka, probably in Africa from erectus — a strange mix of old (massive jaw, huge brow ridge) and new traits (small teeth, an emerging forehead, a brain close to ours in size). The programme ties it to sustained control of fire and traces the consequences: cooked food and smaller teeth, a shorter gut freeing energy for the brain, deep safe sleep by the fire, and the nightly circle where storytelling, music and oral culture took shape. Evidence of cannibalism and the bone pit of Sima de los Huesos in Spain also belong to this human.", "nl": "Homo heidelbergensis ontstond rond 800–900.000 jaar geleden, waarschijnlijk in Afrika uit erectus: een mengsel van oude (zware kaak, enorme wenkbrauwboog) en nieuwe kenmerken (kleine tanden, een opkomend voorhoofd, bijna ons hersenvolume). Het programma koppelt deze mens aan duurzame vuurbeheersing: gekookt voedsel en kleinere tanden, een kortere darm die energie vrijmaakt voor het brein, diepe veilige slaap bij het vuur, en de avondkring waarin verhalen, muziek en mondelinge cultuur ontstonden."}, "points": [{"text": {"fa": "نام و ریخت: بیشتر نام‌های گونه‌های انسانی از نخستین محل کشف می‌آیند. در ۱۹۰۷ در روستای ماوئر نزدیک هایدلبرگ آلمان، به‌طور تصادفی یک فک پایین پیدا شد: بدنهٔ فک مثل راست‌قامت زمخت و کهن بود، اما دندان‌هایش ظریف و کوچک. ویژگی‌های دیگری که برنامه برمی‌شمارد: حفرهٔ بینیِ بزرگ مثل راست‌قامت؛ گونه‌ها (زیر حدقهٔ چشم) «شکسته» مثل انسان امروزی؛ برآمدگی بالای ابرو بسیار برجسته‌تر حتی از راست‌قامت؛ اما پیشانی دیگر آن‌قدر عقب‌رفته نیست — یعنی لوب پیشانیِ مغز، جایگاه ادراکات عالی، در حال بزرگ‌شدن است. حجم مغز حدود ۱۳۰۰ تا ۱۴۰۰ سی‌سی بود، بسیار نزدیک به میانگین ما. از استخوان‌های اندام کمتر چیزی مانده؛ ساق پای باکس‌گروو انگلیس (حدود ۵۰۰ هزار سال) و چند استخوان دیگر نشان می‌دهد قدشان شبیه ما و وزن مردان حدود ۸۰ تا ۹۰ کیلوگرم بود، با بدنی بسیار عضلانی.", "en": "Name and form: most species names come from the first find-spot. In 1907, at Mauer near Heidelberg, a lower jaw turned up by chance: its body massive and archaic like erectus, its teeth small and delicate. Other traits listed: a large nasal opening like erectus; cheekbones 'angled' like modern humans; an enormous brow ridge, larger even than erectus; but a forehead no longer so receding — the frontal lobe, seat of higher cognition, is growing. Brain size was about 1,300–1,400 cc, close to ours. Few limb bones survive; a shin from Boxgrove, England (~500 ka) and others suggest modern stature and males of 80–90 kg, very muscular.", "nl": "Naam en vorm: in 1907 werd bij Mauer nabij Heidelberg toevallig een onderkaak gevonden: massief en archaïsch als bij erectus, maar met kleine, fijne tanden. Verder: een grote neusopening, moderne jukbeenderen, een enorme wenkbrauwboog, maar een minder terugwijkend voorhoofd — de frontale kwab groeit. Hersenvolume ~1.300–1.400 cc. Een scheenbeen uit Boxgrove (~500.000 jaar) wijst op moderne lengte en mannen van 80–90 kg."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "روند کلی و معمای دندان‌ها: در طول تکامل انسان چند روند پایدار دیده می‌شود: مغز بزرگ‌تر، جثه درشت‌تر، قد بلندتر، و دندان‌ها کوچک‌تر و ظریف‌تر. کوچک‌شدن دندان پاسخ انتخاب طبیعی به رژیم غذایی است: تا وقتی خوراک سفت بود، دندان‌درشت‌ها بیشتر می‌ماندند و زادوولد می‌کردند؛ وقتی فشار از روی دندان برداشته شد، دندان‌کوچک‌ها هم توانستند فرزند بیاورند. پرسش این است که چه چیزی این فشار را برداشت؟ پاسخ برنامه: آتش.", "en": "General trends and the riddle of teeth: across human evolution brains grow, bodies grow, stature rises and teeth shrink. Tooth reduction is natural selection responding to diet: while food was tough, big-toothed individuals survived and bred better; once the pressure was lifted, small-toothed ones could breed too. What lifted it? The programme's answer: fire.", "nl": "Algemene trends en het raadsel van de tanden: in de menselijke evolutie groeien hersenen en lichaam en worden tanden kleiner. Tandverkleining is natuurlijke selectie als reactie op voeding: zodra de druk wegviel, konden ook mensen met kleine tanden zich voortplanten. Wat haalde de druk weg? Vuur."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "آتش: از نگهداری تا مهار: کهن‌ترین نشانه‌های استفاده از آتش، لایه‌های خاکستر در محوطه‌های جنوب آفریقا، حدود ۱ تا ۱٫۲ میلیون سال پیش و از آنِ راست‌قامت است. اما به گفتهٔ برنامه احتمالاً راست‌قامت فقط آتشی را که عوامل طبیعی افروخته بودند نگه می‌داشت و نمی‌دانیم خودش می‌توانست روشمندانه آتش بیافروزد یا نه. دربارهٔ انسان هایدلبرگ اما شواهد مهار آتش روشن‌تر است: استخوان‌های سوختهٔ جانوران، اجاق‌های سنگ‌چین، لایه‌های ضخیم خاکستر که نشان می‌دهد سال‌به‌سال در یک جا آتش افروخته‌اند، و زندگی در عرض‌های شمالی‌ای که بدون آتش بسیار دشوار بود.", "en": "Fire: from keeping to controlling: the earliest traces — ash layers at southern African sites, about 1–1.2 Mya — belong to erectus, who probably only maintained naturally lit fires; whether erectus could make fire at will is unknown. For heidelbergensis the evidence of control is clearer: burnt animal bones, stone-lined hearths, thick ash layers showing repeated fires year after year in one place, and life in northern latitudes that would have been very hard without fire.", "nl": "Vuur: van bewaren naar beheersen: de vroegste sporen — aslagen in zuidelijk Afrika, ~1–1,2 miljoen jaar — horen bij erectus, die waarschijnlijk alleen natuurlijk ontstaan vuur onderhield. Bij heidelbergensis is beheersing duidelijker: verbrande dierenbotten, met stenen omzoomde haarden, dikke aslagen van jaar na jaar, en leven op noordelijke breedten."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "روده، مغز و آتش: پختن، گوشت و الیاف گیاهی را نرم‌تر و جذبشان را آسان‌تر می‌کند. گیاه‌خواران روده‌های بسیار بلند دارند تا فرصت جذب کافی باشد؛ گوشت‌خواران روده‌های کوتاه‌تر؛ و طول رودهٔ ما همه‌چیزخواران میان این دو است. استدلال برنامه: وقتی اندامی پرهزینه مانند روده کوچک می‌شود، کالری‌ای که صرف نگهداری‌اش می‌شد می‌تواند به اندام پرهزینهٔ دیگری برسد که در همین دوره بزرگ می‌شود: مغز. پس کوتاه‌شدن روده، خوراکِ پخته و بزرگ‌شدن مغز با هم پیوند مستقیم دارند.", "en": "Gut, brain and fire: cooking softens meat and plant fibre and makes them easier to absorb. Herbivores have very long guts, carnivores shorter ones, and ours lies between. The programme's argument: when a costly organ like the gut shrinks, the energy once spent on it can go to another costly organ growing in the same period — the brain. Shorter gut, cooked food and bigger brain are directly linked.", "nl": "Darm, brein en vuur: koken maakt vlees en plantenvezels zachter en beter opneembaar. Herbivoren hebben zeer lange darmen, carnivoren kortere, en de onze ligt ertussen. Krimpt een duur orgaan als de darm, dan komt energie vrij voor een ander duur orgaan dat in dezelfde periode groeit: het brein."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "خواب، امنیت و «یکپارچه‌سازی» مغز: به گفتهٔ برنامه، آتش برای نخستین بار به انسان‌ها خواب عمیق و آرام داد. پیش از آن باید روی درخت می‌خوابیدند که امن هم نبود (پلنگ و مار به درخت می‌روند)، اما هیچ جانوری به آتش نزدیک نمی‌شود و هیچ جانوری جز انسان آتش را مهار نکرده است. خوابِ بریده‌بریده به خواب عمیق و دوره‌های REM (حرکت سریع چشم) تبدیل شد. گوینده خواب‌دیدن را به «یکپارچه‌سازی» (دیفرگمنت) هارد کامپیوتر تشبیه می‌کند: اطلاعات انباشته در طول روز مرتب و دسته‌بندی می‌شود و ذهن فردا تازه‌تر فکر می‌کند.", "en": "Sleep, safety and brain 'defragmentation': fire, the programme says, gave humans deep, restful sleep for the first time. Before, they slept in trees, which was not safe (leopards and snakes climb), but no animal approaches fire and none besides humans controls it. Broken sleep became deep sleep with REM phases. The speaker compares dreaming to defragmenting a hard drive: the day's information is sorted so the mind thinks more freshly the next day.", "nl": "Slaap, veiligheid en 'defragmentatie': vuur gaf mensen voor het eerst diepe, rustige slaap. Vroeger sliepen ze in bomen, wat niet veilig was; geen dier nadert vuur. Onderbroken slaap werd diepe slaap met REM-fasen. De spreker vergelijkt dromen met het defragmenteren van een harde schijf."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "دورِ آتش و زایش فرهنگ: هنوز هم وقتی به کمپ می‌رویم آتش روشن می‌کنیم و شب دورش می‌نشینیم، حتی وقتی به گرمایش نیاز نداریم؛ برنامه این را نشانهٔ میراثی بسیار کهن می‌داند که با نگاه‌کردن به شعله‌ها حس امنیتِ نیاکانی را بیدار می‌کند. دورِ آتش یکی از مهم‌ترین جاها برای تبادل فرهنگ بود: قصه‌ها شکل می‌گرفت، موسیقی پدید می‌آمد و فرهنگ شفاهی نسل به نسل منتقل می‌شد. به تعبیر برنامه، انسان هایدلبرگ کنار آتش بی‌آنکه بداند مغزش را برای پردازش‌های پیچیده‌ای آماده می‌کرد که بعدها بسیار به کارش آمد: هم فرصت فکرکردن یافت و هم «سخت‌افزار» لازم برای آن در مغزش شکل گرفت.", "en": "The campfire circle and the birth of culture: we still light a fire when camping and sit round it at night even when we need no warmth — a very old legacy, the programme says, that rekindles an ancestral sense of safety. The fireside was a key place of cultural exchange: stories took shape, music emerged, oral culture passed down. Heidelbergensis, unknowingly, was readying the brain for complex processing: gaining both the time to think and the neural 'hardware' for it.", "nl": "De kring rond het vuur en het ontstaan van cultuur: we steken nog steeds een kampvuur aan, ook zonder kou — een oude erfenis die een voorouderlijk gevoel van veiligheid wekt. Rond het vuur ontstonden verhalen, muziek en mondelinge overlevering. Heidelbergensis bereidde zo onbewust het brein voor op complexe verwerking."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "اول شکم، بعد اندیشه: میزبان و مهمان این بحث را به هرم نیازهای مزلو پیوند می‌دهند: تا وقتی ذهن درگیر تأمین خوراک و امنیت است، فرصتی برای اندیشیدن به چیزهای فراتر نمی‌ماند. گوینده از مستندی دربارهٔ یک گروه شکارگر-گردآورندهٔ آفریقایی یاد می‌کند که از رهبرشان پرسیده بودند مهم‌ترین دغدغهٔ زندگی‌ات چیست و پاسخ داده بود: گوشت و عسل؛ «بعدش؟» — «همین؛ اگر فراهم باشد، خوشحالم.» میزبان نتیجهٔ اجتماعی می‌گیرد: جامعه‌ای که آسایش و امنیت پایه را فراهم کند، به مردمش فرصت اندیشیدن می‌دهد.", "en": "First the stomach, then thought: host and guest link this to Maslow's hierarchy: while the mind is absorbed by food and safety, there is no room for more. The speaker recalls a documentary in which a forager leader, asked his main concern in life, answered 'meat and honey' — 'and then?' — 'that's it; if I have them, I'm happy.' The host draws a social lesson: a society that secures basic comfort and safety gives its people room to think.", "nl": "Eerst de maag, dan het denken: de gesprekspartners verbinden dit met Maslows piramide. Een leider van een jagers-verzamelaarsgroep noemde in een documentaire 'vlees en honing' als grootste zorg — 'en daarna?' — 'dat is alles'. Een samenleving die basisveiligheid biedt, geeft mensen ruimte om te denken."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "آدم‌خواری و چاه استخوان‌ها: برنامه شواهد هم‌نوع‌خواری را در این انسان یادآور می‌شود: همان ردهای برش ابزار سنگی و سوختگی که روی استخوان جانوران دیده می‌شود، روی استخوان انسان‌های این دوره هم هست؛ و نمونهٔ بودو در اتیوپی روی گونه‌اش ردِ برش دارد. دلایلِ ممکن گوناگون است: جنگ و نزاع، یا اضطرار و قحطی که به خوردن مردگانِ خود می‌انجامد — نه لزوماً شکار انسان یا عادتی روزمره. محوطهٔ «سیما د لوس اوئسوس» (چاه استخوان‌ها) در آتاپوئرکای اسپانیا، حدود ۳۰۰ تا ۴۰۰ هزار سال پیش، چاهی بود که دست‌کم حدود سی جسدِ هم‌سن‌وسال‌های گوناگون در آن انداخته یا افتاده بودند. این انسان در آفریقا، اروپا و آسیا (مثلاً دالی در چین) هم یافت شده است.", "en": "Cannibalism and the bone pit: the programme notes evidence of cannibalism — the same stone-tool cut marks and burning seen on animal bones appear on human bones of this period, and the Bodo skull from Ethiopia has cut marks on the cheek. Possible reasons vary: conflict, or emergency and famine leading people to eat their own dead — not necessarily hunting people or routine practice. Sima de los Huesos ('pit of bones') at Atapuerca, Spain, about 300–400 ka, held at least some thirty bodies of various ages. This human is also known from Africa, Europe and Asia (e.g. Dali in China).", "nl": "Kannibalisme en de bottenput: dezelfde snijsporen en brandsporen als op dierenbotten komen voor op mensenbotten; de Bodo-schedel heeft snijsporen. Mogelijke redenen: conflict, of nood en hongersnood. Sima de los Huesos bij Atapuerca (~300–400.000 jaar) bevatte minstens zo'n dertig lichamen van verschillende leeftijden."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "جایگاه در درخت خانوادگی: پیش‌تر انسان هایدلبرگ را نیای مشترک نئاندرتال و انسان خردمند می‌دانستند: شاخه‌ای به نئاندرتال و شاخه‌ای به ما. اما DNA باستانیِ استخراج‌شده از استخوان‌های سیما د لوس اوئسوس — که خوشبختانه پیش از سنگواره‌شدن، هنوز استخوان بودند — نشان داد جدایی نئاندرتال و انسان خردمند بسیار کهن‌تر از تصور پیشین است: به گفتهٔ برنامه حدود ۵۰۰ تا ۷۰۰ هزار سال پیش، نه حدود ۳۰۰ هزار سال. پس هایدلبرگ (به معنای قدیمیِ ۳۰۰ هزارساله) نمی‌تواند نیای هر دو باشد. برخی، از جمله کریس استرینگر (موزهٔ تاریخ طبیعی لندن)، «هومو آنتسسور» (انسان پیشگام، حدود ۱٫۲ تا ۱٫۴ میلیون سال، از اسپانیا) یا جمعیتی میان راست‌قامت و هایدلبرگ را نیای مشترک نئاندرتال، دنیسووا و انسان خردمند می‌دانند؛ همهٔ دانشمندان این را نمی‌پذیرند. برنامه همچنین با تشبیه «ریل فرسودهٔ قطار» توضیح می‌دهد که DNA با گذر زمان تکه‌تکه می‌شود و در اقلیم گرم ایران و جنوب‌غرب آسیا حتی از استخوان‌های چندهزارساله هم استخراج DNA بسیار دشوار است.", "en": "Place in the family tree: heidelbergensis was long seen as the common ancestor of Neanderthals and us. But ancient DNA from Sima de los Huesos — bones that luckily had not yet fossilised — showed the Neanderthal–sapiens split was much older than thought: about 500–700 ka, the programme says, not ~300 ka. So heidelbergensis in the old sense cannot be ancestral to both. Some, including Chris Stringer (Natural History Museum, London), propose Homo antecessor (~1.2–1.4 Mya, Spain) or a population between erectus and heidelbergensis as the shared ancestor of Neanderthals, Denisovans and us; not all agree. Using a 'worn railway track' image, the programme explains that DNA fragments over time, and that in the hot climate of Iran and SW Asia even a few-thousand-year-old bone rarely yields DNA.", "nl": "Plaats in de stamboom: heidelbergensis gold lang als gemeenschappelijke voorouder van Neanderthalers en ons. Oud DNA uit Sima de los Huesos toonde echter dat de splitsing veel ouder is (~500–700.000 jaar). Sommigen, onder wie Chris Stringer, zien Homo antecessor of een tussenpopulatie als gemeenschappelijke voorouder; niet iedereen is het eens. DNA valt met de tijd uiteen; in het hete klimaat van Iran levert zelfs een paar duizend jaar oud bot zelden DNA op."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "نقد: (۱) «فرضیهٔ آشپزی» (رنگم) و پیوند روده-مغز (آیلو و ویلر، «فرضیهٔ بافت پرهزینه») پرنفوذند اما بحث‌برانگیز: زمانِ آغازِ مهار آتشِ روزمره هنوز مورد اختلاف است و برخی پژوهشگران استفادهٔ عادی از آتش را دیرتر (حدود ۴۰۰ هزار سال پیش یا حتی کمتر) می‌دانند. (۲) پیوند دادن خواب REM با آتش حدسی جذاب است و شاهد مستقیم ندارد؛ تشبیه «دیفرگمنت» هم ساده‌سازی کارکرد خواب است که هنوز در علوم اعصاب بحث‌برانگیز است. (۳) جایگاه انسان هایدلبرگ به‌عنوان یک گونهٔ واحد مورد تردید جدی است و برخی آن را «سبد زباله‌ای» برای فسیل‌های میانهٔ پلیستوسن می‌دانند. (۴) سن سیما د لوس اوئسوس امروز معمولاً حدود ۴۳۰ هزار سال گزارش می‌شود و افراد آن به نئاندرتال‌های اولیه نزدیک‌ترند.", "en": "Critique: (1) the cooking hypothesis (Wrangham) and the gut–brain link (Aiello & Wheeler's expensive-tissue hypothesis) are influential but contested; when habitual fire use began is still debated, with some placing it much later (~400 ka or less). (2) Linking REM sleep to fire is an attractive guess without direct evidence, and the 'defrag' metaphor simplifies a still-debated function of sleep. (3) Whether heidelbergensis is a single species is seriously doubted; some call it a 'wastebasket' for Middle Pleistocene fossils. (4) Sima de los Huesos is now usually dated to ~430 ka, and its people are closer to early Neanderthals.", "nl": "Kritiek: (1) de kookhypothese en de darm-breinkoppeling zijn invloedrijk maar omstreden; wanneer gewoon vuurgebruik begon is onzeker. (2) REM-slaap koppelen aan vuur is een aantrekkelijke gok zonder direct bewijs. (3) Of heidelbergensis één soort is, wordt ernstig betwijfeld. (4) Sima de los Huesos wordt nu meestal op ~430.000 jaar gedateerd; de individuen staan dichter bij vroege Neanderthalers."}, "sources": ["src:60e7838a5a"], "flags": ["editor-note", "contested"]}, {"text": {"fa": "یادداشت خوانش: بر پایهٔ رونوشت خودکار اپیزود چهارم (کامل) و نیمهٔ نخست اپیزود پنجمِ نسخهٔ رادیویی. بخشی از گفت‌وگوی میزبان دربارهٔ سلامت گوارش و توصیه‌های شخصی در این مدخل نیامده است. رونوشت خطای آوانویسی فراوان دارد (مثلاً «هایدلبرگ» گاه «دلبرگ» ثبت شده).", "en": "Reading note: based on the automatic transcripts of episode 4 (in full) and the first half of episode 5 of the radio version. Part of the host's talk on digestive health and personal advice is omitted. The transcript has many transcription errors.", "nl": "Leesnotitie: gebaseerd op aflevering 4 (volledig) en de eerste helft van aflevering 5. Persoonlijke gezondheidsadviezen van de presentator zijn weggelaten."}, "sources": ["src:60e7838a5a"], "flags": ["editor-note"]}], "links": [{"to": "tabar:fire-control-dating-debate", "rel": "see-also", "note": {"fa": "بحث بر سر زمان مهار آتش", "en": "debate over when fire was controlled", "nl": "debat over de datering van vuurbeheersing"}}, {"to": "tabar:cooking-hypothesis", "rel": "explains", "note": {"fa": "فرضیهٔ آشپزی و کوچک‌شدن دندان", "en": "the cooking hypothesis and smaller teeth", "nl": "de kookhypothese en kleinere tanden"}}, {"to": "tabar:cooked-diet-body-and-brain", "rel": "see-also", "note": {"fa": "خوراکِ پخته، بدن و مغز", "en": "cooked diet, body and brain", "nl": "gekookt dieet, lichaam en brein"}}, {"to": "tabar:ancient-dna", "rel": "see-also", "note": {"fa": "DNA باستانی و بازنگری درخت خانوادگی", "en": "ancient DNA and the revised tree", "nl": "oud DNA en de herziene stamboom"}}, {"to": "tabar:neanderthal-discovery-and-body", "rel": "see-also", "note": {"fa": "شاخهٔ بعدی: نئاندرتال", "en": "next branch: the Neanderthal", "nl": "volgende tak: de Neanderthaler"}}, {"to": "tabar:homo-erectus-endurance-and-handaxe", "rel": "see-also", "note": {"fa": "نیای احتمالی", "en": "probable ancestor", "nl": "waarschijnlijke voorouder"}}], "sources": ["src:60e7838a5a"], "people": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:denisovans-genome-first-human", "kind": "concept", "title": {"fa": "دنیسووایی‌ها: نخستین انسانی که از روی DNA شناخته شد", "en": "The Denisovans: the first human identified from DNA", "nl": "De Denisovanen: de eerste mens die via DNA werd ontdekt"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "دنیسووایی‌ها، «خواهرخواندهٔ» نئاندرتال‌ها، حدود ۳۰۰ تا ۴۰ هزار سال پیش در آسیای مرکزی، جنوبی و جنوب‌شرقی می‌زیستند. آن‌ها نخستین انسانی‌اند که پیش از یافتن اسکلت، از روی DNA یک بند انگشتِ کوچک کشف شدند (۲۰۰۹ تا ۲۰۱۰). «خداحافظ آفریقا» داستان کشف را از غار دنیسووا در کوه‌های آلتای تا فک پایینِ تبت، فک تایوان و دندان‌های لائوس دنبال می‌کند؛ روش‌های تازه‌ای را شرح می‌دهد که این انقلاب را ممکن کردند — شناسایی خرده‌استخوان‌ها با «زومز» و استخراج DNA از خاک غار — و از «دنی»، نخستین دورگهٔ واقعیِ کشف‌شده (پدر دنیسووایی، مادر نئاندرتال)، و از میراث ژنتیکی دنیسووایی‌ها در مردم امروزِ اقیانوسیه و تبت سخن می‌گوید. برنامه امیدوار است با همین روش‌ها ردِ دنیسووایی‌ها در غارهای ایران، مانند قلعه‌کرد قزوین، هم جست‌وجو شود.", "en": "Denisovans, the 'sister group' of Neanderthals, lived about 300–40 ka across Central, South and Southeast Asia. They are the first humans discovered from DNA — from a tiny finger bone — before any skeleton (2009–2010). The programme follows the story from Denisova cave in the Altai to a jaw in Tibet, a jaw off Taiwan and teeth from Laos; explains the new methods behind the revolution — identifying bone fragments with ZooMS and extracting DNA from cave sediments; and tells of 'Denny', the first true hybrid found (Denisovan father, Neanderthal mother), and of Denisovan genetic legacy in today's Oceanians and Tibetans. It hopes the same methods will be used to search Iranian caves such as Qaleh Kurd.", "nl": "Denisovanen, de 'zustergroep' van de Neanderthalers, leefden ~300–40.000 jaar geleden in Centraal-, Zuid- en Zuidoost-Azië. Ze zijn de eerste mensen die via DNA — uit een vingerkootje — werden ontdekt. Het programma volgt het verhaal van de Denisovagrot tot Tibet, Taiwan en Laos, legt ZooMS en sediment-DNA uit, vertelt over 'Denny', de eerste echte hybride, en over Denisovaans erfgoed in Oceanië en Tibet."}, "points": [{"text": {"fa": "درختی پرشاخه، نه نردبان: برنامه این اپیزود را با یادآوری این نکته آغاز می‌کند که داستانِ خطیِ «این به آن تبدیل شد تا به انسان خردمند رسیدیم» دیگر پذیرفتنی نیست. با درختی پرشاخه روبه‌روییم که همهٔ شاخه‌هایش به ما نرسیده‌اند، و در برهه‌هایی — مثلاً صد هزار سال پیش — چند نوع انسان در جغرافیاهای گوناگون و گاه در یک جغرافیا کنار هم می‌زیستند؛ به شوخیِ یکی از دانشمندان، شبیه «سرزمین میانه» در «ارباب حلقه‌ها» با هابیت‌ها و الف‌ها و آدم‌ها.", "en": "A bushy tree, not a ladder: the linear story 'this turned into that until we arrived' no longer holds. We face a branching tree whose branches did not all lead to us, and at times — say 100,000 years ago — several kinds of humans lived in different and sometimes the same regions; as one scientist joked, rather like Middle-earth with its hobbits, elves and men.", "nl": "Een vertakte boom, geen ladder: rond 100.000 jaar geleden leefden meerdere mensensoorten naast elkaar — 'zoals Midden-aarde met hobbits, elfen en mensen', grapte een wetenschapper."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "بند انگشت دختری نُه‌ساله: در دههٔ ۱۹۷۰ دانشمندان روس غار دنیسووا را در جنوب سیبری (کوه‌های آلتای) کاوش کرده بودند و ابزارهایی شبیه دست‌افزارهای نئاندرتالی (پارینه‌سنگی میانی) و بندِ انتهاییِ انگشت کوچک یک انسان یافتند — که امروز می‌دانیم از دختری حدود نُه‌ساله بود. در ۲۰۰۸ این استخوان دو نیم شد و برای دو آزمایشگاه فرستاده شد؛ یکی مؤسسهٔ ماکس پلانک در لایپزیگ به سرپرستی سوانته پابو، برندهٔ نوبل پزشکی ۲۰۲۲. مقایسهٔ DNA میتوکندریایی آن با نئاندرتال و انسان خردمند (نیچر، ۲۰۱۰) نشان داد نه این است نه آن: انسانی تازه. برای نخستین بار، انسانی پیش از یافتن اسکلتش از روی ژن شناخته شد. سپس DNA هسته‌ای کامل هم، به لطف حفظ‌شدگی خوبِ استخوان‌ها در سرمای آن منطقه، استخراج شد.", "en": "A nine-year-old girl's finger bone: in the 1970s Russian scientists had excavated Denisova cave in southern Siberia (Altai), finding Middle Palaeolithic tools like Neanderthal ones and the tip of a human little finger — now known to belong to a girl of about nine. In 2008 it was split and sent to two labs, one being the Max Planck Institute in Leipzig under Svante Pääbo, 2022 Nobel laureate in medicine. Its mitochondrial DNA (Nature, 2010) matched neither Neanderthals nor modern humans: a new human, the first identified from genes before its skeleton. The full nuclear genome followed, thanks to good preservation in the cold.", "nl": "Het vingerkootje van een meisje van negen: in de Denisovagrot (Altai) vond men in de jaren 1970 werktuigen en een vingerkootje. Mitochondriaal DNA (Nature, 2010, team van Svante Pääbo) paste noch bij Neanderthalers noch bij ons: een nieuwe mens, ontdekt via genen vóór een skelet. Later volgde het volledige kerngenoom."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "میراث در ما: مقایسهٔ ژنوم دنیسووایی با مردم سراسر جهان نشان داد که مردم اقیانوسیه (به‌ویژه پاپوآ و برخی جزایر اقیانوس آرام) تا حدود ۵ درصد DNA دنیسووایی دارند — بیش از هر جای دیگر؛ یعنی نیاکانشان با دنیسووایی‌ها آمیخته‌اند. ردِ کمتری از این میراث در بومیان آمریکا هم دیده می‌شود، که برنامه آن را به داستانِ رسیدن انسان به آمریکا در اپیزودهای پایانی پیوند می‌دهد. نمونهٔ شاخص سودمندی: ژنی به نام EPAS1 که در تنظیم پاسخ بدن به کمبود اکسیژن (و تولید گلبول قرمز) نقش دارد، در تبتی‌هایی که در ارتفاع بالا زندگی می‌کنند نسخه‌ای ویژه دارد که به آن‌ها در هوای کم‌اکسیژن تاب‌آوری می‌دهد؛ این نسخه از دنیسووایی‌ها به نیاکان تبتی‌ها رسیده است.", "en": "A legacy in us: comparing the Denisovan genome with people worldwide showed that Oceanians (especially Papuans and some Pacific islanders) carry up to about 5% Denisovan DNA — more than anyone else — meaning their ancestors mixed with Denisovans. Smaller traces occur in Native Americans, which the programme links to later episodes on peopling the Americas. A clear benefit: a variant of EPAS1, which regulates the body's response to low oxygen, helps high-altitude Tibetans cope with thin air; it came to their ancestors from Denisovans.", "nl": "Een erfenis in ons: Oceaniërs (vooral Papoea's) dragen tot ~5% Denisovaans DNA. Een gunstig voorbeeld: een variant van EPAS1 helpt Tibetanen op grote hoogte; die kwam van de Denisovanen."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "زومز: مشکل این بود که از دنیسووایی‌ها چیزی جز چند دندان و یک بند انگشت در دست نبود — «همه‌اش در کف یک دست جا می‌شد». تام هایام (که زمانی رئیس آزمایشگاه تاریخ‌گذاری دانشگاه آکسفورد بود) پیشنهاد کرد خرده‌استخوان‌هایی را بررسی کنند که آن‌قدر ریزند که جانورشناسان نمی‌توانند بگویند از کدام جانورند و ممکن است برخی‌شان انسانی باشند. این یعنی حدود ۱۳۵ هزار تکهٔ کوچک‌تر از یک بند انگشت. روشی تازه به نام ZooMS (جانورشناسی با طیف‌سنجی جرمی) از کلاژنِ هر استخوان «اثر انگشتی» از قله‌ها و دره‌ها می‌سازد که برای هر گونه یکتاست؛ با تطبیق آن با نمونه‌های شناخته‌شده معلوم می‌شود تکه از خرس غارزی بوده، از گوزن، یا از انسان.", "en": "ZooMS: little was known of Denisovans beyond a few teeth and a finger bone — 'all of it fitted in the palm of a hand'. Tom Higham (once head of Oxford's radiocarbon lab) proposed examining bone fragments too small for zoologists to identify, some of which might be human — about 135,000 pieces smaller than a fingertip. A new method, ZooMS (zooarchaeology by mass spectrometry), produces from each bone's collagen a fingerprint of peaks unique to each species; matching it to known samples reveals whether a fragment came from a cave bear, a deer or a human.", "nl": "ZooMS: van Denisovanen was weinig meer dan een paar tanden en een vingerkootje — 'het paste in een handpalm'. Tom Higham stelde voor ~135.000 onherkenbare botsplinters te onderzoeken. ZooMS maakt uit collageen een soortspecifieke 'vingerafdruk'."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "«دنی»، نخستین دورگه: از میان این خرده‌استخوان‌ها، تکه‌ای انسانی یافتند که «دنی» نام گرفت. ژنوم کاملش (نیچر، ۲۰۱۸) شگفتی‌ساز بود: او دختری بود که مادرش نئاندرتال و پدرش دنیسووایی بود — برای نخستین بار در تاریخ علم، یک دورگهٔ نسل اولِ واقعی پیش چشم پژوهشگران بود: نیمی از ژن‌هایش نئاندرتالی و نیمی دنیسووایی. به گفتهٔ برنامه، تا امروز از راه این خرده‌استخوان‌ها بیش از بیست فرد شناسایی شده است.", "en": "'Denny', the first hybrid: among the fragments one was human and was named 'Denny'. Her full genome (Nature, 2018) was astonishing: a girl whose mother was a Neanderthal and father a Denisovan — for the first time a true first-generation hybrid lay before scientists, half Neanderthal, half Denisovan. Over twenty individuals have so far been identified from such fragments, the programme says.", "nl": "'Denny', de eerste hybride: een botsplinter bleek van een meisje met een Neanderthaler-moeder en een Denisovaanse vader (Nature, 2018) — de eerste echte eerste-generatiehybride."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "DNA از خاک: گام بعدی در مؤسسهٔ ماکس پلانک، استخراج DNA از خودِ لایه‌های خاک بود: ذرات DNA جانورانی که در آن خاک زیستند، کشته یا قصابی شدند. تحلیل لایه‌های غار دنیسووا نشان داد که از حدود ۲۵۰ تا ۴۰ هزار سال پیش، دنیسووایی‌ها، نئاندرتال‌ها و انسان‌های خردمند به‌تناوب در این غار زیسته‌اند: گاهی هم‌زمان، گاهی جایگزین هم — مثلاً نئاندرتال‌ها رفتند، حدود ۵۰ هزار سال پیش انسان‌های خردمند آمدند، دوباره رفتند و آخرین نئاندرتال‌ها بازگشتند. چنین داستانی بدون این روش هرگز دانستنی نبود.", "en": "DNA from dirt: next, the Max Planck team extracted DNA from the sediment layers themselves — traces from animals that lived, died or were butchered there. The Denisova cave layers showed that from about 250 to 40 ka Denisovans, Neanderthals and modern humans used the cave in turn — sometimes together, sometimes replacing one another: Neanderthals left, sapiens arrived about 50 ka, left again, and the last Neanderthals returned. This could never have been known without the method.", "nl": "DNA uit grond: uit sedimentlagen bleek dat Denisovanen, Neanderthalers en moderne mensen de grot tussen ~250.000 en 40.000 jaar geleden afwisselend gebruikten."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "فک تبت، فک تایوان، دندان‌های لائوس: در دههٔ ۱۹۸۰ راهبی بودایی در غاری در فلات تبت (بایشیا)، که در پایانِ نیایش مشتی خاک از غار بیرون می‌ریخت، فک پایینی شبیه فک انسان یافت؛ رئیس صومعه آن را حدود چهل سال نگه داشت تا در ۲۰۱۹ پژوهشگران متوجهش شدند و تحلیل‌ها نشان داد از دنیسووایی‌هاست — در ارتفاعی بیش از ۳۰۰۰ متر. فکی که در ۲۰۰۸ در تور ماهیگیری نزدیک تایوان (پنگهو) بالا آمد، بعدها در ردیف دنیسووایی‌ها قرار گرفت؛ و دندان‌هایی که در ۲۰۲۲ در لائوس یافت شد هم همین‌طور. پس قلمرو آن‌ها از ارتفاعات تبت تا مناطق استوایی و گرمسیر جنوب‌شرق آسیا بود. با یاری ژنتیک (شباهت ژن‌های مرتبط با بدن به نئاندرتال‌ها) آن‌ها را «نئاندرتال آسیایی» توصیف می‌کنند: ابروی برجسته، بینی بزرگ، قفسهٔ سینهٔ پهن، قد کوتاه‌تر و بدنی ورزیده.", "en": "A Tibetan jaw, a Taiwanese jaw, Laotian teeth: in the 1980s a Buddhist monk in a cave on the Tibetan plateau (Baishiya), who ended his prayers by tossing out a handful of cave earth, found a human-looking jaw; the monastery's head kept it for some forty years until researchers noticed it in 2019 and analysis showed it was Denisovan — at over 3,000 m altitude. A jaw dredged up in a fishing net off Taiwan (Penghu) in 2008 was later assigned to Denisovans, as were teeth found in Laos in 2022. Their range thus spanned the Tibetan highlands to tropical Southeast Asia. With genetic help they are described as 'Asian Neanderthals': heavy brows, a big nose, a broad chest, shorter and stocky.", "nl": "Een kaak uit Tibet, een uit Taiwan, tanden uit Laos: een monnik vond in de jaren 1980 een kaak in een Tibetaanse grot (Baishiya), in 2019 als Denisovaans herkend — op meer dan 3.000 m. Een kaak uit een visnet bij Taiwan en tanden uit Laos volgden. Ze worden beschreven als 'Aziatische Neanderthalers'."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "ایران در جست‌وجو: هنوز شاهدی از دنیسووایی‌ها در غرب آسیا نداریم، اما برنامه تأکید می‌کند که این به معنای نبودنشان نیست؛ پازل در حال کامل شدن است. گوینده می‌گوید امیدوار است در فصل تازهٔ کاوش غار قلعه‌کرد قزوین، با یک تیم فرانسوی، برای نخستین بار در ایران از ZooMS و DNA رسوبات استفاده شود، چون سن این غار به اندازه‌ای هست که نئاندرتال‌ها، دنیسووایی‌ها و انسان‌های کهن‌تر می‌توانستند در آن زیسته باشند. همچنین برخی جمجمه‌ها و کاسه‌سرهای جنوب‌شرق آسیا که سال‌ها «راست‌قامت» طبقه‌بندی شده بودند، اکنون شاید دنیسووایی باشند — نمونه‌ای از اینکه داده‌های تازه چگونه یافته‌های کهنه را از نو معنا می‌کنند.", "en": "Iran in the search: there is no Denisovan evidence in western Asia yet, but absence of evidence is not evidence of absence. The speaker hopes to use ZooMS and sediment DNA for the first time in Iran in a new excavation season at Qaleh Kurd cave (Qazvin) with a French team, since the cave is old enough to have hosted Neanderthals, Denisovans and earlier humans. Some Southeast Asian skulls long classed as erectus may also prove Denisovan — showing how new data reinterpret old finds.", "nl": "Iran in de zoektocht: er is nog geen Denisovaans bewijs in West-Azië, maar dat bewijst niet hun afwezigheid. De spreker hoopt ZooMS en sediment-DNA voor het eerst in Iran toe te passen in de grot Qaleh Kurd (Qazvin)."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "نقد و دقت: (۱) DNA میتوکندریایی دنیسووا در ۲۰۱۰ (کراوزه و همکاران) و ژنوم هسته‌ای در ۲۰۱۰ (رایش و همکاران) و نسخهٔ پرپوشش در ۲۰۱۲ منتشر شد؛ ارقام سال در رونوشت تقریبی‌اند. (۲) سهم دنیسووایی در پاپوآ‌ها معمولاً ۳ تا ۶ درصد برآورد می‌شود و شواهد نشان می‌دهد چند جمعیتِ متفاوتِ دنیسووایی با نیاکان ما آمیخته‌اند. (۳) فک بایشیا با پروتئین‌های باستانی (نه DNA) دنیسووایی شناخته شد و تاریخ آن حدود ۱۶۰ هزار سال است؛ انتساب فک پنگهو (۲۰۲۵) نیز بر پروتئین‌شناسی استوار است. (۴) «نئاندرتال آسیایی» توصیفی ساده‌شده است؛ ریخت دنیسووایی‌ها هنوز بسیار ناقص شناخته شده و بخش زیادی از آن از روی ژن حدس زده می‌شود.", "en": "Critique and precision: (1) Denisovan mtDNA was published in 2010 (Krause et al.), the nuclear genome in 2010 (Reich et al.) and a high-coverage version in 2012; years in the transcript are approximate. (2) Papuan Denisovan ancestry is usually put at 3–6%, and evidence suggests several distinct Denisovan populations mixed with our ancestors. (3) The Baishiya jaw was identified through ancient proteins, not DNA, and is about 160,000 years old; the Penghu jaw's attribution (2025) also rests on proteomics. (4) 'Asian Neanderthal' is a simplification; Denisovan anatomy is still very incompletely known and much is inferred from genes.", "nl": "Kritiek: (1) mtDNA 2010, kerngenoom 2010, hoge dekking 2012. (2) Papoea's: 3–6%; meerdere Denisovaanse populaties. (3) De Baishiya-kaak werd via eiwitten geïdentificeerd (~160.000 jaar). (4) 'Aziatische Neanderthaler' is een vereenvoudiging."}, "sources": ["src:60e7838a5a"], "flags": ["editor-note", "contested"]}, {"text": {"fa": "یادداشت خوانش: بر پایهٔ رونوشت خودکار اپیزود هشتمِ نسخهٔ پادکستیِ «خداحافظ آفریقا»، به‌طور کامل.", "en": "Reading note: based on the full automatic transcript of podcast episode 8.", "nl": "Leesnotitie: gebaseerd op het volledige transcript van podcastaflevering 8."}, "sources": ["src:60e7838a5a"], "flags": ["editor-note"]}], "links": [{"to": "tabar:neanderthal-admixture", "rel": "see-also", "note": {"fa": "آمیزش با نئاندرتال‌ها و دنیسووایی‌ها", "en": "admixture with Neanderthals and Denisovans", "nl": "vermenging"}}, {"to": "tabar:ancient-dna", "rel": "explains", "note": {"fa": "DNA باستانی", "en": "ancient DNA", "nl": "oud DNA"}}, {"to": "tabar:many-humans-dragon-man-nesher-ramla-naledi-hobbits", "rel": "see-also", "note": {"fa": "انسان اژدها و دیگر انسان‌های هم‌روزگار", "en": "Dragon Man and other contemporaries", "nl": "de Drakenmens en andere tijdgenoten"}}, {"to": "tabar:human-family-tree-branching", "rel": "part-of", "note": {"fa": "درخت پرشاخهٔ انسان", "en": "the branching human tree", "nl": "de vertakte stamboom"}}, {"to": "tabar:ghost-populations-mixture", "rel": "see-also", "note": {"fa": "جمعیت‌های «روح»", "en": "'ghost' populations", "nl": "'spook'-populaties"}}], "sources": ["src:60e7838a5a"], "people": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:homo-erectus-endurance-and-handaxe", "kind": "concept", "title": {"fa": "انسان راست‌قامت / انسان کارگر: بدن دونده، مغز بزرگ، تبردستی آشولی", "en": "Homo erectus / ergaster: the runner's body, the big brain and the Acheulean hand-axe", "nl": "Homo erectus / ergaster: het loperslichaam, het grote brein en de Acheuleaanse vuistbijl"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "حدود دو میلیون سال پیش، در آفریقایی که دریاچه‌ها و علفزارهایش در حال خشک‌شدن بودند، نوعی انسان پدید آمد که از نظر قامت و تناسب اندام نخستین بار شبیه ما بود: بلند و لاغر، با دست‌های کوتاه‌تر، بدنی کم‌مو و توانا در عرق‌کردن، و مغزی تقریباً دو برابرِ نیاکانش. «خداحافظ آفریقا» می‌گوید این مغزِ پرهزینه با پروتینِ گوشت تغذیه می‌شد و گوشت از راه «شکار پیگیرانه» (دنبال‌کردن شکار تا از گرما از پا بیفتد) به دست می‌آمد. ابزار شاخص این انسان، تبردستی بادامی‌شکل آشولی، به گفتهٔ برنامه نشان می‌دهد سازنده‌اش شکل نهایی را پیش از تراش در ذهن می‌دید و احتمالاً آن را با آموزش و ارتباطِ کلامیِ ساده به دیگران منتقل می‌کرد. تبردستی‌های غول‌پیکرِ بی‌استفاده هم به «خودنمایی» تعبیر شده‌اند.", "en": "Around two million years ago, as East African lakes and grasslands dried, a human form appeared whose stature and proportions first resemble ours: tall, lean, shorter-armed, largely hairless, able to sweat, with a brain roughly double its predecessors'. The programme argues this costly brain ran on meat protein obtained by persistence hunting, and that the Acheulean hand-axe shows the maker held the final shape in mind and passed the skill on by teaching; giant unused hand-axes are read as display.", "nl": "Rond twee miljoen jaar geleden verscheen in een uitdrogend Oost-Afrika een mensvorm die als eerste in lengte en lichaamsbouw op ons lijkt: lang, slank, kortere armen, vrijwel onbehaard, met zweetklieren en een brein dat ongeveer twee keer zo groot was als dat van zijn voorgangers. Volgens het programma draaide dit dure brein op vlees, verkregen via uithoudingsjacht, en laat de Acheuleaanse vuistbijl zien dat de maker de eindvorm vooraf voor ogen had en de techniek doorgaf door onderwijs."}, "points": [{"text": {"fa": "زمینهٔ اقلیمی: به گفتهٔ برنامه، حدود ۲ میلیون سال پیش آفریقای شرقی و جنوبی پر از علفزار و دریاچه‌های پراکنده بود و هم‌زمان چند گونهٔ انسان‌ریخت در آن زندگی می‌کردند؛ برخلاف امروز که همهٔ انسان‌ها از یک گونه‌اند، از گینهٔ نو تا منهتن. تغییری بزرگ در اقلیم (که برنامه آن را به «کج‌شدن محور زمین» نسبت می‌دهد) بسیاری از دریاچه‌ها و علفزارها را خشکاند و جانورانی را که منبع پروتین انسان‌ریخت‌ها بودند پراکند یا نابود کرد. در همین محیطِ پرنوسان، انسان راست‌قامت/کارگر ظاهر شد. نیای مستقیم آن هنوز معلوم نیست؛ گوینده حدس می‌زند چند حلقهٔ فسیلیِ میان او و پیشینیانش هنوز پیدا نشده است.", "en": "Climate setting: about 2 Mya East and southern Africa held grasslands and scattered lakes, with several hominin species living side by side — unlike today, when all humans are one species. A major climatic shift (which the programme attributes to the 'tilting of Earth's axis') dried many lakes and grasslands and scattered the animals that supplied hominin protein. In this unstable setting Homo erectus/ergaster appears; its direct ancestor is still unknown, and the speaker suspects fossil links are still missing.", "nl": "Klimaat: rond 2 miljoen jaar geleden had Oost- en Zuid-Afrika graslanden en verspreide meren, en leefden meerdere mensachtige soorten naast elkaar. Een grote klimaatverschuiving (door het programma toegeschreven aan het 'kantelen van de aardas') deed meren en graslanden verdrogen en verjoeg de prooidieren. In deze wisselvallige omgeving verschijnt Homo erectus/ergaster; zijn directe voorouder is nog onbekend."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "بدن تازه: قد از حدود ۱۱۰ تا ۱۲۰ سانتی‌متر در استرالوپیتکوس‌ها به حدود ۱۷۰ سانتی‌متر رسید؛ دست‌ها که در انسان ماهر و استرالوپیتکوس‌ها نسبت به بدن بلند بودند و مچشان برای گذراندن وقت روی درخت مناسب بود، کوتاه و با بدن متناسب شدند؛ موی بدن تا حد زیادی از دست رفت و پوست به احتمال زیاد تیره بود (رنگ‌دانه به‌عنوان سازگاری با تابش شدید خورشید). جمجمه کشیده (به تعبیر گوینده «مثل توپ راگبی») و با برآمدگی برجستهٔ بالای ابرو بود و دوپاییِ کاملاً «حرفه‌ای» داشت.", "en": "A new body: stature rose from about 1.1–1.2 m in australopiths to roughly 1.7 m; arms, long relative to the body in Homo habilis and australopiths (whose wrists still suited tree-climbing), became proportionate; body hair was largely lost and skin was probably dark, as an adaptation to strong sunlight. The skull was long and low ('like a rugby ball') with a heavy brow ridge, and bipedalism was fully committed.", "nl": "Een nieuw lichaam: de lengte steeg van ongeveer 1,1–1,2 m bij australopitheken tot circa 1,7 m; de lange armen (bij Homo habilis en australopitheken nog geschikt voor klimmen) werden proportioneel; lichaamshaar verdween grotendeels en de huid was waarschijnlijk donker. De schedel was lang en laag met een zware wenkbrauwboog; de tweebenigheid was volledig."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "مسئلهٔ انرژی مغز: حجم مغز از حدود ۶۰۰ سی‌سیِ انسان ماهر (هومو هابیلیس) به حدود ۱۱۰۰ تا ۱۲۰۰ سی‌سی رسید، یعنی نزدیک دوسوم مغز امروزی (میانگین حدود ۱۵۰۰ سی‌سی). مغز شامپانزه حدود ۴۵۰ تا ۵۰۰ سی‌سی است و با جمع‌آوری گیاه و کمی گوشت سیر می‌شود؛ اما در ما حدود ۲۰ درصد کالری بدن صرف مغز می‌شود، حتی در خواب. استدلال برنامه: طبیعت «انرژیِ هدررفته» را تحمل نمی‌کند، پس اگر این مغز نگه داشته شده، کالری کافی به آن می‌رسیده؛ و تأمین چنین کالری‌ای فقط با دانه و میوه و برگ عملاً ممکن نبود. نتیجه: سهم پروتین و چربیِ جانوری در خوراک باید زیاد بوده باشد.", "en": "The energy problem: brain volume rose from about 600 cc in Homo habilis to roughly 1,100–1,200 cc, close to two-thirds of today's ~1,500 cc. A chimpanzee's 450–500 cc brain can run on foraged plants plus some meat, but in us about 20% of the body's energy goes to the brain, even during sleep. Nature does not tolerate wasted energy, the programme argues, so if this brain persisted it was being fed, and plants alone could hardly supply it: animal protein and fat must have been a large share of the diet.", "nl": "Het energieprobleem: het hersenvolume steeg van ongeveer 600 cc (Homo habilis) naar 1.100–1.200 cc, bijna twee derde van onze ~1.500 cc. Bij ons gaat zo'n 20% van de lichaamsenergie naar het brein, zelfs in de slaap. Plantaardig voedsel alleen kon dat nauwelijks leveren; dierlijk eiwit en vet moeten dus een groot deel van het dieet hebben gevormd."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "شکار پیگیرانه (persistence hunting): تبردستی آشولی ابزار پرتابی نیست و با آن نمی‌شد از دور شکار کرد. پاسخ برنامه این است که بدنِ این انسان برای راه‌پیمایی و دو
