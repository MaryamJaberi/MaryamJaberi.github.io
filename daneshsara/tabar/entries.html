minderde vruchtbaarheid van hybriden is nog omstreden."}, "points": [{"text": {"fa": "امروز در همهٔ مردم بیرون از آفریقا حدود ۱٫۵ تا ۲٫۱ درصد از ژنوم از نئاندرتال‌ها آمده است؛ سهم در شرق آسیایی‌ها کمی بیشتر از اروپایی‌هاست. به گفتهٔ رایش بخشی از این تفاوت از «رقیق‌شدن» می‌آید: کشاورزان خاور نزدیک که بعدها به اروپا رفتند بخش بزرگی از تبارشان از شاخه‌ای (اوراسیایی پایه) بود که نئاندرتال کمتری داشت.", "en": "Today everyone outside Africa carries roughly 1.5–2.1 percent Neanderthal-derived DNA, slightly more in East Asians than in Europeans. Reich says part of the difference is dilution: the Near Eastern farmers who later moved into Europe derived a large part of their ancestry from a lineage (Basal Eurasian) with little Neanderthal ancestry.", "nl": "Today everyone outside Africa carries roughly 1.5–2.1 percent Neanderthal-derived DNA, slightly more in East Asians than in Europeans. Reich says part of the difference is dilution: the Near Eastern farmers who later moved into Europe derived a large part of their ancestry from a lineage (Basal Eurasian) with little Neanderthal ancestry."}, "sources": ["src:a4f00f41ff"], "flags": []}, {"text": {"fa": "زمان آمیزش را از طول تکه‌های دی‌ان‌ای نئاندرتال در ژنوم‌ها برآورد می‌کنند: هرچه آمیزش دورتر باشد، تکه‌ها در اثر نوترکیبی کوتاه‌تر شده‌اند. تکه‌های یک انسان سیبریایی ۴۵ هزارساله حدود هفت برابر درازتر از امروزی‌هاست و تاریخ حدود ۵۴ تا ۴۹ هزار سال پیش را می‌دهد. مکان آمیزش از ژنتیک روشن نمی‌شود؛ رایش خاور نزدیک را «محتمل‌ترین حدس» می‌داند.", "en": "The timing comes from the length of Neanderthal-derived stretches: the older the mixture, the shorter the stretches after repeated recombination. Stretches in a 45,000-year-old Siberian individual are about seven times longer than in people today and point to roughly 54,000–49,000 years ago. Genetics cannot show where it happened; Reich calls the Near East the most plausible guess.", "nl": "The timing comes from the length of Neanderthal-derived stretches: the older the mixture, the shorter the stretches after repeated recombination. Stretches in a 45,000-year-old Siberian individual are about seven times longer than in people today and point to roughly 54,000–49,000 years ago. Genetics cannot show where it happened; Reich calls the Near East the most plausible guess."}, "sources": ["src:a4f00f41ff"], "flags": ["editor-note"]}, {"text": {"fa": "فرد ۴۰ هزارساله‌ای از غار اوآزه (رومانی) ۶ تا ۹ درصد تبار نئاندرتال داشت و قطعه‌های درازی از آن، یعنی یک نیای نئاندرتال در چهار تا شش نسل پیشین. اما او خویشاوند ویژهٔ اروپاییان امروز نبود؛ پس به گفتهٔ رایش گروهش یک شاخهٔ بن‌بست بود که نسلی از آن نمانده است.", "en": "A 40,000-year-old individual from Oase Cave (Romania) had 6–9 percent Neanderthal ancestry in long unbroken stretches, implying a Neanderthal ancestor four to six generations back. He was not specially related to present-day Europeans, so, according to Reich, his group was an evolutionary dead end.", "nl": "A 40,000-year-old individual from Oase Cave (Romania) had 6–9 percent Neanderthal ancestry in long unbroken stretches, implying a Neanderthal ancestor four to six generations back. He was not specially related to present-day Europeans, so, according to Reich, his group was an evolutionary dead end."}, "sources": ["src:a4f00f41ff", "src:f76f4eccd9"], "flags": []}, {"text": {"fa": "نقشهٔ ژنوم نشان می‌دهد در بیش از نیمی از ژنوم هیچ‌کس تبار نئاندرتال شناسایی نشده و در بعضی نقاط نادر بیش از ۵۰ درصد است. کمبود تبار نئاندرتال به‌ویژه روی کروموزوم X و کنار ژن‌هایی که در بیضه فعال‌اند دیده می‌شود. رایش و همکارانش این را نشانهٔ کم‌باروری نرهای دورگه می‌گیرند؛ الگوی مشابهی در موش‌های دورگه هم دیده شده است. در نمونه‌های باستانی هم سهم نئاندرتال از حدود ۳ تا ۶ درصد به ۲ درصد کاهش یافته است.", "en": "Mapping shows that in more than half of the genome no one carries Neanderthal ancestry, while a few spots exceed 50 percent. The deficit is clearest on the X chromosome and near genes active in the testis. Reich and colleagues read this as reduced fertility of hybrid males, a pattern also seen in hybrid mice. Ancient samples show Neanderthal ancestry falling from about 3–6 percent to about 2 percent.", "nl": "Mapping shows that in more than half of the genome no one carries Neanderthal ancestry, while a few spots exceed 50 percent. The deficit is clearest on the X chromosome and near genes active in the testis. Reich and colleagues read this as reduced fertility of hybrid males, a pattern also seen in hybrid mice. Ancient samples show Neanderthal ancestry falling from about 3–6 percent to about 2 percent."}, "sources": ["src:a4f00f41ff", "src:4601b387da"], "flags": []}, {"text": {"fa": "دربارهٔ علت و شدت این پاک‌سازی توافق کامل نیست. رایش دلیل دیگری هم می‌آورد: نئاندرتال‌ها جمعیت کوچک‌تری بودند و جهش‌های کمی زیان‌آور در ژنومشان جمع شده بود. پژوهشگران دیگر می‌گویند همین «بار جهش‌های زیان‌آور» به‌تنهایی بخش بزرگی از الگو را توضیح می‌دهد، و برخی برآوردها می‌گویند بیشترِ انتخاب در همان هزاره‌های نخست رخ داد نه به‌صورت کاهش پیوسته. کم‌باروری دورگه‌ها هم استنباط است، نه مشاهدهٔ مستقیم. پژوهش‌های بعدی هم مقدار کمی تبار نئاندرتالی در آفریقایی‌ها یافته‌اند (برگشت مهاجران به آفریقا)، پس «بیرون آفریقا» ساده‌سازی است.", "en": "The cause and strength of this purging are not settled. Reich also invokes a second factor: Neanderthals had small populations and accumulated mildly harmful mutations. Other researchers argue this 'genetic load' alone explains much of the pattern, and some estimates say most selection happened in the first millennia rather than as a steady decline. Hybrid infertility is an inference, not a direct observation. Later work also found a small Neanderthal-derived fraction in Africans (back-migration), so 'outside Africa only' is a simplification.", "nl": "The cause and strength of this purging are not settled. Reich also invokes a second factor: Neanderthals had small populations and accumulated mildly harmful mutations. Other researchers argue this 'genetic load' alone explains much of the pattern, and some estimates say most selection happened in the first millennia rather than as a steady decline. Hybrid infertility is an inference, not a direct observation. Later work also found a small Neanderthal-derived fraction in Africans (back-migration), so 'outside Africa only' is a simplification."}, "sources": ["src:a7e0528793", "src:c3725a9f74", "src:ddfafeba8c"], "flags": ["contested", "editor-note"]}], "links": [{"to": "tabar:neanderthal-admixture", "rel": "explains", "note": {"fa": "ادامه و جزئیات مدخل پایه دربارهٔ آمیزش با نئاندرتال‌ها", "en": "Extends the base entry on admixture with Neanderthals", "nl": "Extends the base entry on admixture with Neanderthals"}}, {"to": "tabar:basal-eurasian-ancestry", "rel": "bridges", "note": {"fa": "تبار اوراسیایی پایه کمترین نئاندرتال را داشت", "en": "Basal Eurasian ancestry carried the least Neanderthal ancestry", "nl": "Basal Eurasian ancestry carried the least Neanderthal ancestry"}}, {"to": "tabar:mutation-selection-drift", "rel": "see-also", "note": {"fa": "انتخاب و رانش در جمعیت کوچک", "en": "Selection and drift in small populations", "nl": "Selection and drift in small populations"}}, {"to": "tabar:ancient-dna", "rel": "see-also", "note": {"fa": "ابزار پژوهش: دی‌ان‌ای باستانی", "en": "The tool: ancient DNA", "nl": "The tool: ancient DNA"}}], "people": ["core:david-reich", "core:svante-p-bo", "core:sriram-sankararaman"], "sources": ["src:4601b387da", "src:a4f00f41ff", "src:a7e0528793", "src:c3725a9f74", "src:ddfafeba8c", "src:f76f4eccd9"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:cooked-diet-body-and-brain", "kind": "concept", "title": {"fa": "غذای پخته، روده کوچک و مغز بزرگ", "en": "Cooked food, a small gut and a big brain", "nl": "Gekookt voedsel, kleine darm en groot brein"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "انسان‌ها نسبت به اندازهٔ بدن، دهان، دندان و روده‌ای کوچک و مغزی بزرگ دارند. بر پایهٔ «فرضیهٔ بافت پرهزینه» (آیلو و ویلر، ۱۹۹۵) روده و مغز هر دو انرژی‌بَرند و کوچک‌شدن روده بخشی از هزینهٔ مغز بزرگ را پرداخته است. رانگهم می‌گوید پختن این امکان را فراهم کرد و زمان جویدن را از چند ساعت به حدود یک ساعت رساند. هر سه ادعا محل بحث‌اند.", "en": "Relative to body size, humans have a small mouth, small teeth and a short gut, and a large brain. By the expensive tissue hypothesis (Aiello and Wheeler, 1995) gut and brain both cost much energy, and a shrinking gut helped pay for a large brain. Wrangham argues cooking made this possible and cut chewing time from hours to about one. All three claims are debated.", "nl": "Mensen hebben relatief kleine mond, tanden en darmen en een groot brein. Volgens de «expensive tissue»-hypothese (Aiello & Wheeler, 1995) werd het grote brein deels betaald door een kleinere darm. Wrangham ziet koken als voorwaarde en stelt dat kauwtijd sterk daalde. Alle drie de claims zijn omstreden."}, "points": [{"text": {"fa": "مقایسهٔ ما با شامپانزه: دهانهٔ دهان و ماهیچه‌های جویدن ما کوچک‌ترند، دندان‌هایمان کوچک‌تر است و معده، روده‌ی کوچک و به‌ویژه رودهٔ بزرگمان نسبت به وزن بدن کوتاه‌تر است. به گفتهٔ رانگهم این ترکیب برای غذای نرم و پرانرژی طراحی شده و با غذای خام فیبردار سازگار نیست.", "en": "Compared with chimpanzees, our mouth opening and chewing muscles are smaller, our teeth smaller, and our stomach and especially large intestine relatively shorter for body weight. Wrangham says this package is designed for soft, energy-dense food and not for raw fibrous food.", "nl": "Compared with chimpanzees, our mouth opening and chewing muscles are smaller, our teeth smaller, and our stomach and especially large intestine relatively shorter for body weight. Wrangham says this package is designed for soft, energy-dense food and not for raw fibrous food."}, "sources": ["src:c12cd83ad0"], "flags": []}, {"text": {"fa": "فرضیهٔ بافت پرهزینه: مغز انسان حدود ۲٫۵ درصد وزن بدن است ولی تقریباً ۲۰ درصد انرژیِ حالت استراحت را می‌گیرد. میزان سوخت‌وساز پایه‌ی ما نسبت به وزن در حد پیش‌بینی‌شده برای پرایمات‌هاست، پس آیلو و ویلر نتیجه گرفتند که انرژی مغز از کوچک‌شدن بافت دیگری، یعنی روده، تأمین شده است.", "en": "The expensive tissue hypothesis: the human brain is about 2.5 percent of body weight but uses roughly 20 percent of resting energy. Our basal metabolic rate is as expected for a primate our size, so Aiello and Wheeler concluded the brain's energy was paid for by shrinking another tissue, the gut.", "nl": "The expensive tissue hypothesis: the human brain is about 2.5 percent of body weight but uses roughly 20 percent of resting energy. Our basal metabolic rate is as expected for a primate our size, so Aiello and Wheeler concluded the brain's energy was paid for by shrinking another tissue, the gut."}, "sources": ["src:c12cd83ad0", "src:232013ea8d"], "flags": []}, {"text": {"fa": "رانگهم می‌گوید جهش مغزی در هومو ارکتوس (افزایش ۴۲ درصدی ظرفیت جمجمه نسبت به هابیلین‌ها طبق کتاب) به پختن مربوط است. همچنین براورد او این است که زمان جویدن در انسان حدود ۸ درصد روز است، در حالی که میمون‌های انسان‌نما حدود نیمی از روز می‌جوند. با غذای خام و گیاهی، انسان حدود ۵ ساعت جویدن لازم داشت و این با شکار و گردآوری جور درنمی‌آید.", "en": "Wrangham links the brain jump in Homo erectus (a 42 percent increase in cranial capacity over habilines, per the book) to cooking. He estimates human chewing at about 8 percent of the day against roughly half the day in great apes, and that a raw plant diet would need around five hours of chewing, which is hard to reconcile with hunting and gathering.", "nl": "Wrangham links the brain jump in Homo erectus (a 42 percent increase in cranial capacity over habilines, per the book) to cooking. He estimates human chewing at about 8 percent of the day against roughly half the day in great apes, and that a raw plant diet would need around five hours of chewing, which is hard to reconcile with hunting and gathering."}, "sources": ["src:c12cd83ad0"], "flags": []}, {"text": {"fa": "نظر ویراستار: فرضیهٔ بافت پرهزینه خودش مورد مناقشه است. ناوارته، ون شایک و ایسلر (۲۰۱۱) در بررسی پستانداران همبستگی منفی میان اندازهٔ مغز و اندازهٔ دستگاه گوارش پیدا نکردند و ارتباط را با چربی بدن می‌دیدند. در مقابل، فونسکا-آزودو و هرکولانو-هوزل (۲۰۱۲) با شمارش نورون‌ها استدلال کردند که تغذیهٔ مغزِ بزرگ با غذای خام شدنی نیست، که با رانگهم هم‌سو است. این هم هنوز به نتیجه نرسیده است.", "en": "Editor's note: the expensive tissue hypothesis is itself contested. Navarrete, van Schaik and Isler (2011) found no negative correlation between brain size and digestive-tissue size across mammals and pointed to body fat instead. Conversely, Fonseca-Azevedo and Herculano-Houzel (2012), using neuron counts, argued a large brain could not be fuelled on raw food, which supports Wrangham. The question remains open.", "nl": "Editor's note: the expensive tissue hypothesis is itself contested. Navarrete, van Schaik and Isler (2011) found no negative correlation between brain size and digestive-tissue size across mammals and pointed to body fat instead. Conversely, Fonseca-Azevedo and Herculano-Houzel (2012), using neuron counts, argued a large brain could not be fuelled on raw food, which supports Wrangham. The question remains open."}, "sources": ["src:983881b4b4", "src:c6648d6a35"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "نظر ویراستار: برآوردهای مربوط به اندازهٔ روده‌ی هومو ارکتوس غیرمستقیم است، چون روده فسیل نمی‌شود و از شکل قفسه سینه و لگن حدس زده می‌شود. نمونه‌های فسیلی کم‌اند و رده‌بندی گونه‌هایی مثل هومو هابیلیس خود محل اختلاف است. همچنین عوامل دیگری (پیچیدگی اجتماعی، اقلیم، پرورش مشترک کودکان) در بزرگ‌شدن مغز نقش داشته‌اند.", "en": "Editor's note: estimates of Homo erectus gut size are indirect, since guts do not fossilise and are inferred from rib cage and pelvis shape. Fossil samples are small and the classification of species such as Homo habilis is itself disputed. Other factors (social complexity, climate, shared child care) also contributed to brain growth.", "nl": "Editor's note: estimates of Homo erectus gut size are indirect, since guts do not fossilise and are inferred from rib cage and pelvis shape. Fossil samples are small and the classification of species such as Homo habilis is itself disputed. Other factors (social complexity, climate, shared child care) also contributed to brain growth."}, "sources": [], "flags": ["contested", "editor-note"]}], "links": [{"to": "tabar:cooking-hypothesis", "rel": "part-of", "note": {"fa": "فرضیهٔ پختن", "en": "The cooking hypothesis", "nl": "The cooking hypothesis"}}, {"to": "psy:n-human-brain", "rel": "see-also", "note": {"fa": "مغز انسان و شمار نورون‌ها", "en": "The human brain's neuron count", "nl": "The human brain's neuron count"}}, {"to": "tabar:social-brain-evolution", "rel": "contrasts", "note": {"fa": "جهش اجتماعی: چرا مغز اجتماعی شدیم", "en": "The social leap: why our brains went social", "nl": "The social leap: why our brains went social"}}, {"to": "tabar:brain-body-size-climate", "rel": "see-also", "note": {"fa": "اقلیم و اندازهٔ مغز و بدن در جنس انسان", "en": "Climate and brain and body size in Homo", "nl": "Climate and brain and body size in Homo"}}], "people": ["core:leslie-c-aiello", "core:peter-wheeler", "core:suzana-herculano-houzel"], "sources": ["src:232013ea8d", "src:983881b4b4", "src:c12cd83ad0", "src:c6648d6a35"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:lomekwi-3-site", "kind": "concept", "title": {"fa": "جایگاه لومکوی ۳ در ترکانای غربی (کنیا)", "en": "The Lomekwi 3 site, West Turkana, Kenya", "nl": "De vindplaats Lomekwi 3, West-Turkana, Kenia"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "لومکوی ۳ جایگاهی باستان‌شناختی در غرب دریاچهٔ ترکانا در شمال کنیاست. گروه هارمند و همکاران (۲۰۱۵) در آن ابزارهای سنگیِ برجا و فسیل‌هایی از دورهٔ پلیوسن یافتند و عمر ابزارها را حدود ۳٫۳ میلیون سال برآورد کردند. این تاریخ از کهن‌ترین ابزارهای سنگی شناخته‌شدهٔ پیش از آن، یعنی ابزارهای اولدوان با حدود ۲٫۶ میلیون سال، بسیار قدیمی‌تر است.", "en": "Lomekwi 3 (LOM3) is an archaeological site west of Lake Turkana in northern Kenya. Harmand and colleagues (2015) report in situ stone artefacts and Pliocene fossils there, and estimate the artefacts at about 3.3 million years, far older than the previously earliest known tools, the Oldowan at about 2.6 million years.", "nl": "Lomekwi 3 ligt ten westen van het Turkanameer in Noord-Kenia. Harmand e.a. (2015) melden er stenen artefacten ter plaatse uit het Plioceen, geschat op circa 3,3 miljoen jaar, ruim ouder dan het Oldowan (circa 2,6 miljoen jaar)."}, "points": [{"text": {"fa": "کاوش در این جایگاه از ۲۰۱۱ آغاز شد و تا پایان فصل ۲۰۱۲ حدود ۱۳ متر مربع را در بر گرفت. مجموعهٔ کنونی ۱۴۹ قطعهٔ سنگی دارد، از جمله ۸۳ هستهٔ سنگی، ۳۵ تراشه، ۷ سندان یا قطعهٔ ثابت، ۷ کوبه و چند قطعهٔ دیگر. بخشی از این‌ها روی سطح زمین پیدا شد و بخشی در لایه‌های رسوبی برجا.", "en": "Excavation began in 2011 and by the end of 2012 covered about 13 m². The current assemblage is 149 stone pieces: 83 cores, 35 flakes, 7 anvils or passive elements, 7 percussors and a few other items. Some lay on the surface and some were found in place in the sediment.", "nl": "Excavation began in 2011 and by the end of 2012 covered about 13 m². The current assemblage is 149 stone pieces: 83 cores, 35 flakes, 7 anvils or passive elements, 7 percussors and a few other items. Some lay on the surface and some were found in place in the sediment."}, "sources": ["src:23b2553ce8"], "flags": []}, {"text": {"fa": "تاریخ ۳٫۳ میلیون سال از چند چیز می‌آید: خاکستر آتشفشانی‌ای که با روش پرتوسنجی تاریخ‌گذاری شده (توفِ تورُتو، حدود ۳٫۳۱ میلیون سال)، موقعیت لایه‌ها در جدول وارونگی میدان مغناطیسی زمین، و برآورد نرخ رسوب‌گذاری. ابزارها حدود ۱۰ متر بالاتر از آن توف قرار دارند، پس جوان‌تر از آن‌اند. این تاریخ برآوردی درون‌یابی‌شده است، نه اندازه‌گیریِ مستقیمِ خود ابزارها.", "en": "The 3.3-million-year age rests on a radiometrically dated volcanic ash (the Toroto Tuff, about 3.31 Ma), the site's position in the geomagnetic polarity record, and estimated sedimentation rates. The tools lie about 10 m above that ash, so they are younger than it. The date is an interpolation, not a direct measurement of the tools themselves.", "nl": "The 3.3-million-year age rests on a radiometrically dated volcanic ash (the Toroto Tuff, about 3.31 Ma), the site's position in the geomagnetic polarity record, and estimated sedimentation rates. The tools lie about 10 m above that ash, so they are younger than it. The date is an interpolation, not a direct measurement of the tools themselves."}, "sources": ["src:23b2553ce8"], "flags": []}, {"text": {"fa": "نویسندگان با سه دلیل می‌گویند قطعه‌ها تقریباً در جای اصلی خود مانده‌اند: قطعه‌ها از ریزتراشه تا سنگ‌های بسیار بزرگ دیده می‌شوند؛ از سنگ‌ریزه‌هایی که آب آن رسوبات را آورده سنگین‌ترند؛ و لبه‌هایشان کم‌سایش است. یک تراشهٔ سطحی هم به هسته‌ای از لایهٔ برجا جفت می‌شود.", "en": "The authors give three reasons to think the pieces are close to where they were left: pieces range from tiny flake fragments to very large cobbles; they are heavier than the water that laid the sediment could carry; and their edges are little worn. One surface flake also refits onto a core from the in situ layer.", "nl": "The authors give three reasons to think the pieces are close to where they were left: pieces range from tiny flake fragments to very large cobbles; they are heavier than the water that laid the sediment could carry; and their edges are little worn. One surface flake also refits onto a core from the in situ layer."}, "sources": ["src:23b2553ce8"], "flags": []}, {"text": {"fa": "بررسی ایزوتوپ‌های کربن در گرهک‌های خاک نشان می‌دهد این‌جا در آن زمان محیطی بیشتر درختی و بوته‌زاری بوده (حدود ۴۷ درصد پوشش چوبی، با خطای حدود ۹ درصد)، نه علفزار باز. این با فرضِ قدیمیِ پیوند ابزارسازی با گسترش ساوانا نمی‌خواند.", "en": "Carbon-isotope analysis of soil nodules indicates a wooded, bushy setting at the time (about 47% woody cover, give or take 9%), not open grassland. This sits poorly with the older assumption that tool-making followed the spread of savannah.", "nl": "Carbon-isotope analysis of soil nodules indicates a wooded, bushy setting at the time (about 47% woody cover, give or take 9%), not open grassland. This sits poorly with the older assumption that tool-making followed the spread of savannah."}, "sources": ["src:23b2553ce8"], "flags": ["editor-note"]}, {"text": {"fa": "سنگ‌های مادّه عمدتاً بازالت و فونولیت بودند و از بسترهای رودخانه‌ای قدیمیِ نزدیک تأمین می‌شدند؛ کم‌تر از ۱۰۰ متر دورتر منبع سنگ‌ریزه و قلوه‌سنگ در همه اندازه‌ها بود و بزرگ‌ترین‌ها به‌طور پیوسته انتخاب شده‌اند.", "en": "Raw materials were mainly basalt and phonolite from nearby ancient channels. A conglomerate source lay less than 100 m away, and the largest blocks were consistently chosen.", "nl": "Raw materials were mainly basalt and phonolite from nearby ancient channels. A conglomerate source lay less than 100 m away, and the largest blocks were consistently chosen."}, "sources": ["src:23b2553ce8"], "flags": []}], "links": [{"to": "tabar:human-evolution", "rel": "part-of", "note": {"fa": "تکامل انسان", "en": "Human evolution", "nl": "Human evolution"}}, {"to": "tabar:lomekwian-stone-technology", "rel": "explains", "note": {"fa": "فناوری لومکوی", "en": "Lomekwian stone technology", "nl": "Lomekwian stone technology"}}, {"to": "tabar:first-toolmakers-debate", "rel": "see-also", "note": {"fa": "نخستین ابزارسازان: چه کسی و چرا", "en": "The first toolmakers: who and why", "nl": "The first toolmakers: who and why"}}], "people": ["core:sonia-harmand", "core:h-l-ne-roche"], "sources": ["src:23b2553ce8"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:social-brain-evolution", "kind": "concept", "title": {"fa": "جهش اجتماعی: چرا مغز اجتماعی شدیم", "en": "The social leap: why our brains went social", "nl": "De sociale sprong: waarom ons brein sociaal werd"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "فون هیپل استدلال می‌کند بزرگ‌ترین تغییر تکاملی انسان نه ابزار، که همکاری بود: نیاکان ما وقتی از جنگل به ساوانا رانده شدند، با سنگ‌پرانیِ گروهی و تقسیم کار زنده ماندند و مغزی ساختند که برای زندگی در گروه طراحی شده است؛ با همهٔ شادی‌ها و رنج‌هایش.", "en": "Von Hippel argues that humanity's biggest evolutionary change was not tools but cooperation: when our ancestors were pushed from forest to savanna they survived by group stone-throwing and division of labour, building a brain designed for group life, with all its joys and pains.", "nl": "Von Hippel betoogt dat de grootste evolutionaire verandering van de mens niet gereedschap was maar samenwerking: toen onze voorouders van bos naar savanne werden gedreven, overleefden ze door groepsgewijs stenen gooien en arbeidsdeling, en bouwden een brein ontworpen voor groepsleven, met al zijn vreugden en pijnen."}, "points": [{"text": {"fa": "فرضیهٔ مرکزی کتاب: ایستادن روی دو پا دست‌ها را آزاد کرد، پرتاب دقیقِ گروهی شکارچیان را دور نگه داشت، و «انتخاب طبیعی» شروع کرد به پاداش دادن به کسانی که بهتر هماهنگ می‌شدند. این یک روایت تکاملیِ قابل دفاع اما آزمون‌ناپذیر به معنای دقیق است.", "en": "The book's central hypothesis: standing upright freed the hands, accurate group throwing kept predators away, and natural selection began rewarding those who coordinated better. A defensible evolutionary narrative, but not strictly testable.", "nl": "The book's central hypothesis: standing upright freed the hands, accurate group throwing kept predators away, and natural selection began rewarding those who coordinated better. A defensible evolutionary narrative, but not strictly testable."}, "sources": ["src:4fb5cf55a3"], "flags": ["editor-note"]}, {"text": {"fa": "پیامدهای روان‌شناختی که کتاب می‌شمرد: شادی ما از پیوند و جایگاه اجتماعی می‌آید، نه از ثروت مطلق؛ خودفریبی برای قانع کردن دیگران تکامل یافته؛ و نوآوری محصول «مغز جمعی» است.", "en": "Psychological consequences the book draws: our happiness comes from social bonds and standing, not absolute wealth; self-deception evolved to persuade others; innovation is the product of the \"collective brain\".", "nl": "Psychological consequences the book draws: our happiness comes from social bonds and standing, not absolute wealth; self-deception evolved to persuade others; innovation is the product of the \"collective brain\"."}, "sources": ["src:4fb5cf55a3", "src:d8fb384d44"], "flags": []}, {"text": {"fa": "این تز با نظریهٔ تکامل فرهنگی هنریک و فرضیهٔ خوداهلی‌سازی رنگهام هم‌خوان است؛ هر سه ریشهٔ ویژگی انسان را در زندگی گروهی می‌بینند.", "en": "The thesis agrees with Henrich's cultural evolution theory and Wrangham's self-domestication hypothesis; all three locate the root of human distinctiveness in group life.", "nl": "The thesis agrees with Henrich's cultural evolution theory and Wrangham's self-domestication hypothesis; all three locate the root of human distinctiveness in group life."}, "sources": ["src:d8fb384d44"], "flags": []}], "links": [{"to": "psy:cultural-evolution", "rel": "bridges", "note": {"fa": "تکامل فرهنگی و مغز جمعی", "en": "Cultural evolution and the collective brain", "nl": "Cultural evolution and the collective brain"}}, {"to": "psy:self-domestication", "rel": "bridges", "note": {"fa": "خوداهلی‌سازی", "en": "Self-domestication", "nl": "Self-domestication"}}, {"to": "psy:happiness-origins", "rel": "bridges", "note": {"fa": "خاستگاه شادی", "en": "The origins of happiness", "nl": "The origins of happiness"}}, {"to": "psy:evo-sex", "rel": "see-also", "note": {"fa": "روان‌شناسی تکاملی در ویکی روان", "en": "Evolutionary psychology in the psychology wiki", "nl": "Evolutionary psychology in the psychology wiki"}}], "people": ["core:william-von-hippel", "core:joseph-henrich", "core:richard-wrangham"], "sources": ["src:4fb5cf55a3", "src:d8fb384d44"], "booklets": [], "origin": "book:social-leap", "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:zagros-neolithic", "kind": "concept", "title": {"fa": "کشاورزان نوسنگی زاگرس", "en": "Zagros Neolithic farmers", "nl": "Neolithische boeren van de Zagros"}, "aliases": ["گنج دره", "Ganj Dareh", "Wezmeh"], "parent": "tabar:population-genetics", "field": "tabar:population-genetics", "summary": {"fa": "ژنوم افراد ۹ تا ۱۰ هزار سال پیش از غرب ایران نشان داد کشاورزی در زاگرس به دست جمعیتی جدا از کشاورزان آناتولی آغاز شد؛ جمعیتی که به تبار ایرانیان امروز، جنوب آسیا و قفقاز کمک کرده است.", "en": "Genomes of people from western Iran 9 to 10 thousand years ago showed that farming in the Zagros began among a population separate from Anatolian farmers; a population that contributed to the ancestry of today's Iranians, South Asians and the Caucasus.", "nl": "Genomen van mensen uit West-Iran van 9 tot 10 duizend jaar geleden toonden dat de landbouw in de Zagros begon bij een bevolking los van de Anatolische boeren; een bevolking die bijdroeg aan de afstamming van hedendaagse Iraniërs, Zuid-Aziaten en de Kaukasus."}, "points": [{"text": {"fa": "بروشکی و همکاران (۲۰۱۶): چهار ژنوم از گنج دره و غار وزمه (کرمانشاه) و ابدول حسین (لرستان)، ۷ تا ۱۰ هزار سال پیش؛ شباهت ژنتیکی‌شان به کشاورزان آناتولی بسیار کم بود.", "en": "Broushaki et al. (2016): four genomes from Ganj Dareh and Wezmeh Cave (Kermanshah) and Abdul Hosein (Lorestan), 7 to 10 thousand years old; their genetic similarity to Anatolian farmers was very low.", "nl": "Broushaki et al. (2016): four genomes from Ganj Dareh and Wezmeh Cave (Kermanshah) and Abdul Hosein (Lorestan), 7 to 10 thousand years old; their genetic similarity to Anatolian farmers was very low."}, "sources": ["src:22aa9386b9"], "flags": []}, {"text": {"fa": "نتیجه: کشاورزی در هلال حاصلخیز دو خاستگاه جمعیتی داشت و در زاگرس احتمالاً به‌صورت مستقل یا از راه انتقال ایده (نه مهاجرت مردم) پدید آمد.", "en": "Conclusion: farming in the Fertile Crescent had two population origins and in the Zagros likely arose independently or through the spread of ideas rather than people.", "nl": "Conclusion: farming in the Fertile Crescent had two population origins and in the Zagros likely arose independently or through the spread of ideas rather than people."}, "sources": ["src:22aa9386b9", "src:519a39f1f8"], "flags": []}, {"text": {"fa": "این تبار زاگرسی بعدها در شکل‌گیری جمعیت‌های دشت ایران، جنوب آسیا (به‌ویژه در تبار «ایرانیِ باستان» مردم هند و پاکستان) و قفقاز سهم داشت.", "en": "This Zagros ancestry later contributed to the populations of the Iranian plateau, South Asia (notably the \"ancient Iranian\" ancestry of people in India and Pakistan) and the Caucasus.", "nl": "This Zagros ancestry later contributed to the populations of the Iranian plateau, South Asia (notably the \"ancient Iranian\" ancestry of people in India and Pakistan) and the Caucasus."}, "sources": ["src:73a4e45469", "src:519a39f1f8"], "flags": []}], "links": [{"to": "tabar:ancient-dna", "rel": "part-of", "note": {"fa": "یکی از یافته‌های انقلاب دی‌ان‌ای باستانی", "en": "One finding of the ancient DNA revolution", "nl": "One finding of the ancient DNA revolution"}}, {"to": "tabar:iranian-genetic-diversity", "rel": "explains", "note": {"fa": "بخشی از ریشهٔ تنوع ژنتیکی ایرانیان امروز", "en": "Part of the root of today's Iranian genetic diversity", "nl": "Part of the root of today's Iranian genetic diversity"}}], "people": [], "sources": ["src:22aa9386b9", "src:519a39f1f8", "src:73a4e45469"], "booklets": [], "origin": null, "iran": "iran:zagros-neolithic", "wikidata": null, "status": "draft"}, {"id": "tabar:eurasian-waves-eec-wec", "kind": "concept", "title": {"fa": "دو موج گسترش از کانون: شرق اوراسیایی و غرب اوراسیایی", "en": "Two expansions from the Hub: East and West Eurasian Core", "nl": "Twee uitbreidingen vanuit de Hub: Oost- en West-Euraziatische kern"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "بر پایهٔ مدل مقاله، نیاکان امروزیِ شرق و غرب اوراسیا در یک زمان از کانون بیرون نیامدند. موج اول (حدود ۴۵ هزار سال پیش) تبار «هستهٔ شرق اوراسیایی» را پراکند و موج دوم (حدود ۳۸ هزار سال پیش) تبار «هستهٔ غرب اوراسیایی» را. دومی بخش بزرگی از نخستین را در اروپا و غرب آسیا جذب کرد.", "en": "In the paper's model the ancestors of present-day East and West Eurasians did not leave the Hub at the same time. A first expansion (~45 kya) spread the 'East Eurasian Core' ancestry and a second (~38 kya) the 'West Eurasian Core' ancestry, which largely absorbed the first in Europe and West Asia.", "nl": "Volgens het model verlieten de voorouders van Oost- en West-Euraziërs de Hub niet tegelijk: een eerste golf (~45 kya) en een tweede (~38 kya), die de eerste in West-Eurazië grotendeels opnam."}, "points": [{"text": {"fa": "موج نخست (حدود ۴۵ هزار سال پیش) را نویسندگان «هستهٔ شرق اوراسیایی» (EEC) می‌نامند. نسل‌هایش در نمونه‌هایی مانند باچو کیرو (بلغارستان) و تیان‌یوان (چین) و در بیشتر مردم امروز شرق آسیا و اقیانوسیه دیده می‌شود. این موج با ابزارسازی «پارینه‌سنگی بالایی آغازین» (IUP) پیوند داده شده است.", "en": "The authors name the first expansion (~45 kya) the 'East Eurasian Core' (EEC). Its descendants appear in samples such as Bacho Kiro (Bulgaria) and Tianyuan (China) and in most present-day East Asians and Oceanians. It is linked to the Initial Upper Palaeolithic (IUP) toolkit.", "nl": "The authors name the first expansion (~45 kya) the 'East Eurasian Core' (EEC). Its descendants appear in samples such as Bacho Kiro (Bulgaria) and Tianyuan (China) and in most present-day East Asians and Oceanians. It is linked to the Initial Upper Palaeolithic (IUP) toolkit."}, "sources": ["src:3ec2e3a4ff"], "flags": []}, {"text": {"fa": "موج دوم (حدود ۳۸ هزار سال پیش) «هستهٔ غرب اوراسیایی» (WEC) است که در نمونه‌هایی مانند کوستنکی ۱۴ و سونگیر و در اروپاییان و غرب آسیاییان بعدی دیده می‌شود. به گفتهٔ مقاله این موج در اروپا بیشتر مردم پیشین را جذب کرد و تبار نخستین تقریباً فقط در شرق اوراسیا و اقیانوسیه باقی ماند.", "en": "The second expansion (~38 kya) is the 'West Eurasian Core' (WEC), seen in Kostenki14, Sunghir and later Europeans and West Asians. According to the paper it largely absorbed the earlier population in Europe, so the first lineage survives mainly in East Eurasia and Oceania.", "nl": "The second expansion (~38 kya) is the 'West Eurasian Core' (WEC), seen in Kostenki14, Sunghir and later Europeans and West Asians. According to the paper it largely absorbed the earlier population in Europe, so the first lineage survives mainly in East Eurasia and Oceania."}, "sources": ["src:3ec2e3a4ff"], "flags": []}, {"text": {"fa": "کانون خودش «ساقهٔ ساده» نبوده که شرق و غرب از آن جدا شوند؛ جمعیتِ ماندهٔ کانون پس از جدایی موج اول مدتی با تبار غربی رانش مشترک جمع کرد. نویسندگان صریحاً می‌گویند تصویر درست مجموعه‌ای از گسترش‌ها و انقراض‌های محلی است. این مطالعه برای بازسازی گسترش‌های قدیمی‌تر (مثل مورد زلاتی‌کونی) طراحی نشده بود.", "en": "The Hub itself was not a simple stem from which East and West split: the population remaining after the first expansion accumulated shared drift with the western lineage. The authors stress a picture of multiple expansions and local extinctions, and the study was not designed to reconstruct older ones (such as the Zlatý kůň lineage).", "nl": "The Hub itself was not a simple stem from which East and West split: the population remaining after the first expansion accumulated shared drift with the western lineage. The authors stress a picture of multiple expansions and local extinctions, and the study was not designed to reconstruct older ones (such as the Zlatý kůň lineage)."}, "sources": ["src:3ec2e3a4ff"], "flags": []}, {"text": {"fa": "نویسندگان فقط فرضیه می‌دهند که چرا ۲۰ هزار سال طول کشید: بازیابی جمعیت پس از گلوگاه خروج از آفریقا، سازگاری با محیط‌های تازه یا نوآوری فناورانه، تغییر پیوستگی زیستگاه‌ها و تعامل با گروه‌های باستانیِ محلی (نئاندرتال‌ها). این‌ها گمانه‌اند و در داده آزموده نشده‌اند.", "en": "The authors only hypothesise why it took ~20,000 years: demographic recovery after the Out-of-Africa bottleneck, adaptation or technological innovation, changing habitat connectivity, and interaction with local archaic groups (Neanderthals). These are conjectures not tested in the data.", "nl": "The authors only hypothesise why it took ~20,000 years: demographic recovery after the Out-of-Africa bottleneck, adaptation or technological innovation, changing habitat connectivity, and interaction with local archaic groups (Neanderthals). These are conjectures not tested in the data."}, "sources": ["src:3ec2e3a4ff"], "flags": ["contested", "editor-note"]}], "links": [{"to": "tabar:persian-plateau-hub", "rel": "part-of", "note": {"fa": "فلات ایران به‌عنوان کانون", "en": "The Persian Plateau as Hub", "nl": "The Persian Plateau as Hub"}}, {"to": "tabar:ancient-dna", "rel": "see-also", "note": {"fa": "انقلاب دی‌ان‌ای باستانی", "en": "The ancient DNA revolution", "nl": "The ancient DNA revolution"}}, {"to": "tabar:neanderthal-admixture", "rel": "see-also", "note": {"fa": "آمیزش با نئاندرتال‌ها", "en": "Admixture with Neanderthals", "nl": "Admixture with Neanderthals"}}], "people": [], "sources": ["src:3ec2e3a4ff"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:india-two-migrations-ani-asi", "kind": "concept", "title": {"fa": "تاریخ جمعیتی هند: دو موج مهاجرت و نقش تبار کشاورزان ایرانی", "en": "Population history of India: two migrations and the role of Iranian-farmer ancestry", "nl": "Bevolkingsgeschiedenis van India: twee migraties en de rol van Iraanse-boerenafstamming"}, "aliases": [], "parent": "tabar:population-genetics", "field": "tabar:population-genetics", "summary": {"fa": "رایش و همکارانش نشان دادند تقریباً همهٔ گروه‌های هندی آمیزه‌ای از سه تبارند: شکارگردآورندگان جنوب آسیا (شبیه مردم جزایر آندامان)، تبار مرتبط با کشاورزان باستانی ایران و تبار دامداران استپ. این تاریخ شبیه اروپاست: نخست کشاورزان از غرب، سپس دامداران استپی. آنچه این مدل می‌گوید هرگز «تهاجم آریایی» به معنای فتح خشونت‌آمیز را اثبات نمی‌کند.", "en": "Reich and colleagues showed that almost every Indian group is a mix of three ancestries: South Asian hunter-gatherers (resembling Andamanese Islanders), ancestry related to ancient Iranian farmers, and steppe pastoralist ancestry. The history parallels Europe: first farmers from the west, then steppe herders. The model does not prove an 'Aryan invasion' in the sense of violent conquest.", "nl": "Reich en collega's toonden aan dat bijna elke Indiase groep een mengsel is van drie afstammingen: Zuid-Aziatische jager-verzamelaars, afstamming verwant aan oude Iraanse boeren en steppeherders. De geschiedenis loopt parallel aan Europa. Het model bewijst geen gewelddadige 'Arische invasie'."}, "points": [{"text": {"fa": "پس از ۲۰۰۹ رایش و همکارانش هند را «شیب (کلاین) هندی» توصیف کردند که از «شمال‌هندیانِ نیایی» (ANI) تا «جنوب‌هندیانِ نیایی» (ASI) می‌رسد: همهٔ گروه‌های هندی به نسبت‌های مختلف آمیزهٔ این دو هستند و ANI بیشتر با اروپا و خاورمیانه خویشاوند بود. این دو «جمعیت نیایی» از ابتدا مدل آماری بودند، نه گروه‌های دیده‌شده.", "en": "From 2009 Reich and colleagues described India as an 'Indian cline' from 'Ancestral North Indians' (ANI) to 'Ancestral South Indians' (ASI): every Indian group is a mix of these two in different proportions, with ANI more related to Europe and the Middle East. These two 'ancestral populations' were statistical models from the start, not observed groups.", "nl": "From 2009 Reich and colleagues described India as an 'Indian cline' from 'Ancestral North Indians' (ANI) to 'Ancestral South Indians' (ASI): every Indian group is a mix of these two in different proportions, with ANI more related to Europe and the Middle East. These two 'ancestral populations' were statistical models from the start, not observed groups."}, "sources": ["src:734b5345d2"], "flags": []}, {"text": {"fa": "پس از ۲۰۱۶ با دی‌ان‌ای کشاورزان باستانی ایران، مدل اصلاح شد: هر دو ANI و ASI دارای تبار مرتبط با کشاورزان ایرانی هستند. به برآورد پترسون ANI حدود نیمی از تبار دامداران استپ و نیمی از تبار کشاورزان مرتبط با ایران است و ASI حدود ۲۵ درصد کشاورز مرتبط با ایران و ۷۵ درصد شکارگردآورندهٔ بومی. کشاورزی غرب آسیا (گندم و جو) پس از ۹ هزار سال پیش به دره سند رسید.", "en": "After 2016, with DNA from ancient Iranian farmers, the model was revised: both ANI and ASI carry Iranian-farmer-related ancestry. In Patterson's estimate ANI is about half steppe and half Iranian-farmer-related, while ASI is about 25 percent Iranian-farmer-related and 75 percent local hunter-gatherer. West Asian farming (wheat and barley) reached the Indus Valley after 9,000 years ago.", "nl": "After 2016, with DNA from ancient Iranian farmers, the model was revised: both ANI and ASI carry Iranian-farmer-related ancestry. In Patterson's estimate ANI is about half steppe and half Iranian-farmer-related, while ASI is about 25 percent Iranian-farmer-related and 75 percent local hunter-gatherer. West Asian farming (wheat and barley) reached the Indus Valley after 9,000 years ago."}, "sources": ["src:a4f00f41ff", "src:519a39f1f8"], "flags": []}, {"text": {"fa": "توجه: «تبار مرتبط با کشاورزان ایرانی» یعنی تباری که به نمونه‌های باستانی زاگرس نزدیک است، نه اینکه از مردم کشور امروزی ایران آمده باشد. مطالعهٔ ۲۰۱۹ نارسیمهان و همکاران نمونه‌هایی از جایگاه‌های فلات ایران و آسیای میانه را با «پیرامون سند» و گروه‌های نخستین جنوب آسیا مقایسه کرد و تصویر پیچیده‌تری داد؛ مثلاً ASI و ANI دقیقاً به شکل دو جمعیت مجزای واقعی تلقی نمی‌شوند.", "en": "Note: 'Iranian-farmer-related' means ancestry close to ancient Zagros samples, not that it came from the people of the modern state of Iran. The 2019 study by Narasimhan and colleagues compared samples from sites on the Iranian plateau and Central Asia with the 'Indus Periphery' and early South Asian groups and drew a more complex picture; for example, ANI and ASI are no longer treated as two distinct real populations.", "nl": "Note: 'Iranian-farmer-related' means ancestry close to ancient Zagros samples, not that it came from the people of the modern state of Iran. The 2019 study by Narasimhan and colleagues compared samples from sites on the Iranian plateau and Central Asia with the 'Indus Periphery' and early South Asian groups and drew a more complex picture; for example, ANI and ASI are no longer treated as two distinct real populations."}, "sources": ["src:eb0de616f2"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "دربارهٔ تهاجم آریایی: رایش می‌گوید آمیختگی دلیل دگرگونی جمعیتی بزرگ نزدیک زمان زوال تمدن دره سند است، اما نه اثبات جنگ و ویرانی. در باستان‌شناسی نشانهٔ روشنی از سوزاندن شهرها نیست و زوال تدریجی بود. همین نظریه هم ناسیونالیست‌های اروپایی و نازی‌ها را جذب کرد و هم در هند حساس است چون اگر درست باشد اجزایی از فرهنگ هند «از بیرون» آمده‌اند.", "en": "On the 'Aryan invasion': Reich says the mixture proves major demographic change around the time of the Indus Valley decline but not war or destruction. Archaeology shows no clear layers of burned cities and the decline was gradual. The idea attracted European nationalists and the Nazis and is also sensitive in India, since if correct some elements of Indian culture came 'from outside'.", "nl": "On the 'Aryan invasion': Reich says the mixture proves major demographic change around the time of the Indus Valley decline but not war or destruction. Archaeology shows no clear layers of burned cities and the decline was gradual. The idea attracted European nationalists and the Nazis and is also sensitive in India, since if correct some elements of Indian culture came 'from outside'."}, "sources": ["src:a4f00f41ff"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "مدل چندان قطعی نیست: زمان دقیق ورود تبار استپی (در هزارهٔ دوم پیش از میلاد) و انتساب زبان‌های دراویدی به شکل‌گیری ASI از حدس‌های ارائه‌شده‌اند. رایش خودش می‌گوید همبستگی ASI و زبان‌های دراویدی بالاست و «به نظر می‌رسد» ارتباط داشته باشد؛ این استنباط است، نه یافتهٔ مستقیم.", "en": "The model is not final: the exact time of arrival of steppe ancestry (second millennium BCE) and the link between Dravidian languages and the formation of ASI are proposals. Reich himself says the correlation of ASI with Dravidian languages is high and a link 'seems likely'; this is inference, not a direct finding.", "nl": "The model is not final: the exact time of arrival of steppe ancestry (second millennium BCE) and the link between Dravidian languages and the formation of ASI are proposals. Reich himself says the correlation of ASI with Dravidian languages is high and a link 'seems likely'; this is inference, not a direct finding."}, "sources": ["src:a4f00f41ff"], "flags": ["editor-note"]}], "links": [{"to": "tabar:iranian-farmer-legacy", "rel": "explains", "note": {"fa": "میراث کشاورزان ایرانی در هند", "en": "Legacy of Iranian farmers in India", "nl": "Legacy of Iranian farmers in India"}}, {"to": "tabar:steppe-indo-iranian", "rel": "part-of", "note": {"fa": "وارد شدن تبار استپی", "en": "Arrival of steppe ancestry", "nl": "Arrival of steppe ancestry"}}, {"to": "tabar:caste-endogamy-founder-effect", "rel": "see-also", "note": {"fa": "درون‌همسری در هند", "en": "Endogamy in India", "nl": "Endogamy in India"}}, {"to": "tabar:zagros-neolithic", "rel": "see-also", "note": {"fa": "کشاورزان زاگرس", "en": "Zagros farmers", "nl": "Zagros farmers"}}], "people": ["core:david-reich", "core:kumarasamy-thangaraj", "core:priya-moorjani"], "sources": ["src:519a39f1f8", "src:734b5345d2", "src:a4f00f41ff", "src:eb0de616f2"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:neanderthal-interbreeding-replacement", "kind": "concept", "title": {"fa": "آمیزش یا جایگزینی: سرنوشت نئاندرتال‌ها و دنیسووایی‌ها در روایت هراری", "en": "Interbreeding or replacement: the fate of Neanderthals and Denisovans in Harari's telling", "nl": "Kruising of vervanging: het lot van neanderthalers en denisovanen bij Harari"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "هراری دو نظریهٔ رقیب دربارهٔ برخورد انسان خردمند با دیگر انسان‌ها را معرفی می‌کند و می‌گوید نتایج دی‌ان‌ای در ۲۰۱۰ نظریهٔ آمیزش را تا حدی تأیید کرد بی‌آنکه جایگزینی را رد کند. بخش علمی او با پژوهش‌های ۲۰۱۰ هم‌خوان است، اما حدس‌هایش دربارهٔ کشتار و «پاکسازی قومی» فرضی‌اند.", "en": "Harari presents two rival theories about how Homo sapiens met other humans and says the 2010 DNA results partly supported interbreeding without refuting replacement. His scientific core matches the 2010 research, but his remarks on massacre and 'ethnic cleansing' are speculative.", "nl": "Harari presenteert twee rivaliserende theorieën over de ontmoeting van Homo sapiens met andere mensen en stelt dat het DNA-onderzoek van 2010 kruising deels bevestigde zonder vervanging te weerleggen. Zijn opmerkingen over massamoord zijn speculatief."}, "points": [{"text": {"fa": "او تا نیمهٔ فصل نخست توضیح می‌دهد که در دورانی همزمان چندین گونهٔ انسانی (نئاندرتال، راست‌قامت، سولوئنسیس، فلورسی‌ینسیس، دنیسووا و جز آن) روی زمین می‌زیسته‌اند و تکامل انسان خطی نبوده است؛ او دست‌کم شش گونه را برای ۱۰۰ هزار سال پیش می‌شمارد. این تصویر شاخه‌شاخه با دانش امروز هماهنگ است، هرچند فهرست گونه‌ها و تاریخ انقراض‌ها (مثلاً فلورسی‌ینسیس) بعدها بازنگری شده است.", "en": "In the first chapter he explains that several human species (Neanderthal, erectus, soloensis, floresiensis, Denisova and others) coexisted and that human evolution was not linear; he counts at least six species 100,000 years ago. This branching picture fits current knowledge, though species lists and extinction dates (e.g. floresiensis) have since been revised.", "nl": "In the first chapter he explains that several human species (Neanderthal, erectus, soloensis, floresiensis, Denisova and others) coexisted and that human evolution was not linear; he counts at least six species 100,000 years ago. This branching picture fits current knowledge, though species lists and extinction dates (e.g. floresiensis) have since been revised."}, "sources": ["src:64cc653b84"], "flags": []}, {"text": {"fa": "«نظریهٔ آمیزش» می‌گوید مهاجران آفریقایی با جمعیت‌های محلی آمیختند؛ «نظریهٔ جایگزینی» می‌گوید جمعیت‌ها جدا ماندند و انسان خردمند بی‌ادغام جایگزین شد. هراری یادآوری می‌کند که این بحث پیامد سیاسی دارد، چون آمیزش گسترده می‌توانست خوراک نظریه‌های نژادپرستانه شود و برای همین جایگزینی مدتی از نظر سیاسی «درست‌تر» شمرده می‌شد.", "en": "The 'interbreeding theory' says African migrants mixed with local populations; the 'replacement theory' says the populations stayed separate and sapiens replaced them without merging. Harari notes the debate has political stakes, since wide interbreeding could feed racist theories, which is why replacement was for a time seen as more 'politically correct'.", "nl": "The 'interbreeding theory' says African migrants mixed with local populations; the 'replacement theory' says the populations stayed separate and sapiens replaced them without merging. Harari notes the debate has political stakes, since wide interbreeding could feed racist theories, which is why replacement was for a time seen as more 'politically correct'."}, "sources": ["src:64cc653b84"], "flags": []}, {"text": {"fa": "به نوشتهٔ او نتایج ۲۰۱۰ نشان داد یک تا چهار درصد دی‌ان‌ای انسان‌های امروزی در اروپا و خاورمیانه از نئاندرتال‌هاست و تا شش درصد دی‌ان‌ای ملانزیایی‌ها و بومیان استرالیا از دنیسووایی‌ها. هراری همین‌جا یادآوری می‌کند که پژوهش ادامه دارد و ممکن است برآوردها تغییر کند؛ درصدها از پژوهشی به پژوهش دیگر و بین جمعیت‌ها فرق می‌کنند.", "en": "He writes that the 2010 results showed 1-4% of the DNA of present-day people in Europe and the Middle East comes from Neanderthals, and up to 6% of Melanesian and Aboriginal Australian DNA from Denisovans. He adds that research continues and estimates may change; percentages vary between studies and populations.", "nl": "He writes that the 2010 results showed 1-4% of the DNA of present-day people in Europe and the Middle East comes from Neanderthals, and up to 6% of Melanesian and Aboriginal Australian DNA from Denisovans. He adds that research continues and estimates may change; percentages vary between studies and populations."}, "sources": ["src:64cc653b84", "src:7e2b22db3b", "src:892c33567f"], "flags": []}, {"text": {"fa": "او نتیجه می‌گیرد که دیدگاه آمیزش «تا حدی» محق است، اما چون سهم ژنی کم است نمی‌توان از «ادغام» سخن گفت: تماس‌ها نادر بود و تنها چند ژن به نسل‌های بعد رسید. این جمع‌بندی با تصویر رایج «جایگزینی نشتی» همخوان است.", "en": "He concludes the interbreeding view is right 'at least in part', but with such small gene shares one cannot speak of 'merging': contacts were rare and only a few genes were passed on. This summary accords with the common picture of 'leaky replacement'.", "nl": "He concludes the interbreeding view is right 'at least in part', but with such small gene shares one cannot speak of 'merging': contacts were rare and only a few genes were passed on. This summary accords with the common picture of 'leaky replacement'."}, "sources": ["src:64cc653b84", "src:7e2b22db3b"], "flags": []}, {"text": {"fa": "هراری دو علت محتمل برای ناپدید شدن نئاندرتال‌ها می‌آورد: برتری رقابتی انسان خردمند و کاهش تدریجی جمعیت آن‌ها، یا خشونت و «اولین پاکسازی قومی تاریخ». هر دو حدس‌اند؛ شاهد مستقیم کشتار گسترده وجود ندارد و پژوهشگران عوامل دیگر (اقلیم، جمعیت اندک، درون‌آمیزی) را هم مطرح می‌کنند. توصیف نئاندرتال‌ها به‌عنوان «کم‌ابتکار» و ناتوان در تجارت دوربرد نیز با یافته‌های تازه‌تر دربارهٔ فرهنگ آن‌ها هماهنگ نیست.", "en": "Harari offers two likely causes of Neanderthal disappearance: sapiens' competitive edge and the gradual shrinking of their numbers, or violence and 'the first and most significant ethnic cleansing'. Both are conjecture; there is no direct evidence of mass killing, and researchers also propose other factors (climate, small populations, inbreeding). His portrayal of Neanderthals as less inventive and lacking long-distance trade also sits uneasily with newer findings on their culture.", "nl": "Harari offers two likely causes of Neanderthal disappearance: sapiens' competitive edge and the gradual shrinking of their numbers, or violence and 'the first and most significant ethnic cleansing'. Both are conjecture; there is no direct evidence of mass killing, and researchers also propose other factors (climate, small populations, inbreeding). His portrayal of Neanderthals as less inventive and lacking long-distance trade also sits uneasily with newer findings on their culture."}, "sources": ["src:64cc653b84", "src:da10502659"], "flags": ["contested", "editor-note"]}], "links": [{"to": "tabar:neanderthal-admixture", "rel": "explains", "note": {"fa": "روایت عامه‌پسند از آمیزش با نئاندرتال‌ها", "en": "Popular account of Neanderthal admixture", "nl": "Popular account of Neanderthal admixture"}}, {"to": "tabar:ancient-dna", "rel": "see-also", "note": {"fa": "انقلاب دی‌ان‌ای باستانی", "en": "The ancient DNA revolution", "nl": "The ancient DNA revolution"}}, {"to": "tabar:out-of-africa", "rel": "see-also", "note": {"fa": "خاستگاه آفریقایی انسان خردمند", "en": "The African origin of Homo sapiens", "nl": "The African origin of Homo sapiens"}}], "people": ["core:svante-p-bo"], "sources": ["src:64cc653b84", "src:7e2b22db3b", "src:892c33567f", "src:da10502659"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:population-genetics", "kind": "field", "title": {"fa": "ژنومیک جمعیت و تبار", "en": "Population genomics & ancestry", "nl": "Populatiegenomica & afstamming"}, "aliases": [], "parent": "tabar:tabar", "field": null, "summary": {"fa": "دی‌ان‌ای مردم امروز و استخوان‌های باستانی چه می‌گویند دربارهٔ مهاجرت‌ها، آمیزش‌ها و شکل‌گیری جمعیت‌ها؟", "en": "What do the DNA of living people and ancient bones tell about migrations, admixtures and the making of populations?", "nl": "Wat vertellen het DNA van levende mensen en oude botten over migraties, vermengingen en het ontstaan van bevolkingen?"}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:eugenics", "kind": "concept", "title": {"fa": "به‌نژادی: تاریخ تاریک ژنتیک", "en": "Eugenics: the dark history of genetics", "nl": "Eugenetica: de donkere geschiedenis van de genetica"}, "aliases": [], "parent": "tabar:genetics-society", "field": "tabar:genetics-society", "summary": {"fa": "گالتون در ۱۸۸۳ واژهٔ eugenics را ساخت: «بهبود نژاد» با کنترل تولیدمثل. در نیمهٔ اول قرن بیستم به عقیم‌سازی اجباری ده‌ها هزار نفر در آمریکا و اسکاندیناوی و به نسل‌کشی نازی انجامید. ژنتیک امروز با همین سابقه زندگی می‌کند و هر بحث «ژن و جامعه» باید آن را به یاد داشته باشد.", "en": "Galton coined \"eugenics\" in 1883: \"improving the race\" by controlling reproduction. In the first half of the twentieth century it led to the forced sterilisation of tens of thousands in the US and Scandinavia and to Nazi genocide. Genetics lives with this record today, and every \"genes and society\" debate must remember it.", "nl": "Galton muntte in 1883 het woord \"eugenetica\": \"het ras verbeteren\" door de voortplanting te sturen. In de eerste helft van de twintigste eeuw leidde het tot gedwongen sterilisatie van tienduizenden in de VS en Scandinavië en tot de nazi-genocide. De genetica leeft vandaag met dit verleden, en elk debat over \"genen en samenleving\" moet het onthouden."}, "points": [{"text": {"fa": "کولز (۱۹۸۵): جنبش به‌نژادی در آمریکا و بریتانیا جریانی «پیشرو» و علمی‌نما بود؛ قوانین عقیم‌سازی در بیش از ۳۰ ایالت آمریکا تصویب شد و دیوان عالی در ۱۹۲۷ (پروندهٔ باک علیه بل) آن را تأیید کرد.", "en": "Kevles (1985): the eugenics movement in the US and Britain was a \"progressive\", science-flavoured current; sterilisation laws passed in over 30 US states and the Supreme Court upheld them in 1927 (Buck v. Bell).", "nl": "Kevles (1985): the eugenics movement in the US and Britain was a \"progressive\", science-flavoured current; sterilisation laws passed in over 30 US states and the Supreme Court upheld them in 1927 (Buck v. Bell)."}, "sources": ["src:34537dde7a"], "flags": []}, {"text": {"fa": "درس برای امروز: هاردن استدلال می‌کند پذیرفتن نقش ژن‌ها در تفاوت‌های اجتماعی لزوماً به‌نژادی نیست؛ می‌تواند، برعکس، پایه‌ای برای برابری‌خواهی باشد («بخت‌آزمایی ژنتیکی» را نباید با شایستگی اشتباه گرفت). این موضع خودش محل بحث است.", "en": "A lesson for today: Harden argues that accepting the role of genes in social differences is not necessarily eugenic; it can, conversely, ground egalitarianism (the \"genetic lottery\" must not be mistaken for merit). That position is itself debated.", "nl": "A lesson for today: Harden argues that accepting the role of genes in social differences is not necessarily eugenic; it can, conversely, ground egalitarianism (the \"genetic lottery\" must not be mistaken for merit). That position is itself debated."}, "sources": ["src:b1c0eba86d"], "flags": ["contested"]}], "links": [{"to": "tabar:race-biology", "rel": "see-also", "note": {"fa": "نژاد و زیست‌شناسی", "en": "Race and biology", "nl": "Race and biology"}}, {"to": "atlas:genethics", "rel": "part-of", "note": {"fa": "پل اخلاق ژنتیک", "en": "The genetic ethics bridge", "nl": "The genetic ethics bridge"}}, {"to": "psy:degeneration", "rel": "bridges", "note": {"fa": "نظریهٔ انحطاط در ویکی روان", "en": "Degeneration theory in the psychology wiki", "nl": "Degeneration theory in the psychology wiki"}}], "people": ["core:francis-galton", "core:kathryn-paige-harden"], "sources": ["src:34537dde7a", "src:b1c0eba86d"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:tabar", "kind": "root", "title": {"fa": "تبار و ژنتیک", "en": "Lineage & Genetics", "nl": "Afstamming & genetica"}, "aliases": [], "parent": null, "field": null, "summary": {"fa": "از کجا آمده‌ایم و چه‌قدر از آنچه هستیم به ارث رسیده؟ این ویکی ژنتیک رفتاری، تاریخ ژنومیِ جمعیت‌ها، تکامل انسان، اپی‌ژنتیک و تبارشناسی را کنار هم می‌گذارد؛ با تأکید بر اینکه «وراثتی» به معنی «تغییرناپذیر» نیست.", "en": "Where do we come from, and how much of who we are is inherited? This wiki brings together behaviour genetics, the genomic history of populations, human evolution, epigenetics and genealogy, stressing that \"heritable\" does not mean \"unchangeable\".", "nl": "Waar komen we vandaan, en hoeveel van wie we zijn is geërfd? Deze wiki brengt gedragsgenetica, de genomische geschiedenis van bevolkingen, menselijke evolutie, epigenetica en genealogie samen, met de nadruk dat \"erfelijk\" niet \"onveranderlijk\" betekent."}, "points": [], "links": [{"to": "psy:psych-genetics", "rel": "bridges", "note": {"fa": "ژنتیک روان‌پزشکی در ویکی روان", "en": "Psychiatric genetics in the psychology wiki", "nl": "Psychiatric genetics in the psychology wiki"}}, {"to": "psy:cultural-evolution", "rel": "bridges", "note": {"fa": "تکامل فرهنگی", "en": "Cultural evolution", "nl": "Cultural evolution"}}, {"to": "psy:anthropology", "rel": "bridges", "note": {"fa": "انسان‌شناسی", "en": "Anthropology", "nl": "Anthropology"}}], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:darwin-biogeography", "kind": "concept", "title": {"fa": "پراکنش جغرافیایی جانداران و جزیره‌ها نزد داروین", "en": "Geographical distribution and islands in Darwin", "nl": "Geografische verspreiding en eilanden bij Darwin"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "داروین استدلال می‌کند که الگوی پراکنش جانداران را فقط «نیای مشترک + پراکنده‌شدن + دگرگونی» توضیح می‌دهد، نه آفرینش جداگانهٔ هر گونه در هر محل. شباهت جانداران جزیره‌ها به نزدیک‌ترین قاره، و نبود پستانداران بومی در بسیاری از جزیره‌های اقیانوسی، از شاهدهای اصلی او بود.", "en": "Darwin argues that only 'common descent + dispersal + modification' explains how life is distributed, not separate creation of each species in each place. The resemblance of island life to the nearest mainland, and the lack of native land mammals on many oceanic islands, were key evidence.", "nl": "Darwin betoogt dat alleen gemeenschappelijke afstamming, verspreiding en wijziging de verspreiding van leven verklaart, niet aparte schepping per plek. De gelijkenis van eilandfauna met het naburige vasteland was een belangrijk bewijs."}, "points": [{"text": {"fa": "جاندارانِ جاهای با اقلیم یکسان اما جدا از هم (مثل نیمکرهٔ شمالی و جنوبی) بسیار با هم فرق دارند، ولی در یک قاره، حتی با اقلیم‌های گوناگون، شبیه‌اند. این یعنی «نسب و مهاجرت» مهم‌تر از فقط اقلیم است. نمونه: رئا (شترمرغ آمریکایی) در آمریکای جنوبی به‌جای شترمرغ واقعی.", "en": "Life in similar climates but far apart (such as northern and southern hemispheres) differs greatly, yet within a continent, even across climates, forms resemble each other. So ancestry and migration matter more than climate alone. Example: the rhea in South America rather than a true ostrich.", "nl": "Life in similar climates but far apart (such as northern and southern hemispheres) differs greatly, yet within a continent, even across climates, forms resemble each other. So ancestry and migration matter more than climate alone. Example: the rhea in South America rather than a true ostrich."}, "sources": ["src:84786f7bfa"], "flags": []}, {"text": {"fa": "داروین آزمایش کرد که آیا بذر پس از ماندن در آب شور می‌روید و نتیجه گرفت پراکندن بذر و جانوران ازراه آب، باد، پرندگان و یخ‌های شناور ممکن است. جزیره‌های اقیانوسی گونه‌های بومی خاص خود را دارند (که او با دگرگونی پس از رسیدن نخستین مهاجران توضیح می‌دهد)، ولی غالباً پستاندار خشکی‌زی بومی ندارند. دوران یخبندان را هم برای توضیح حضور گیاهان قطبی روی قلهٔ کوه‌ها به کار برد.", "en": "Darwin experimented to see whether seeds still sprout after soaking in salt water and concluded that dispersal by water, wind, birds and floating ice is possible. Oceanic islands have their own endemic species (explained as change after the first colonists arrived) but usually no native land mammals. He also used the Ice Age to explain arctic plants on mountaintops.", "nl": "Darwin experimented to see whether seeds still sprout after soaking in salt water and concluded that dispersal by water, wind, birds and floating ice is possible. Oceanic islands have their own endemic species (explained as change after the first colonists arrived) but usually no native land mammals. He also used the Ice Age to explain arctic plants on mountaintops."}, "sources": ["src:84786f7bfa"], "flags": []}, {"text": {"fa": "اصلاح: داروین فرضِ «پل‌های خشکی» میان قاره‌ها را نمی‌پسندید و بیشتر بر پراکنده‌شدن تکیه داشت، ولی امروز می‌دانیم خیلی از الگوهای پراکنش با جابه‌جایی قاره‌ها (زمین‌ساخت صفحه‌ای، به پیشنهاد وگنر ۱۹۱۵ و پذیرش در دههٔ ۱۹۶۰) توضیح داده می‌شود، مثل ربط میان جانداران قاره‌های جنوبی. بنابراین پراکنده‌شدن تنها توضیح نیست؛ جدا‌ماندن جمعیت‌ها بر اثر شکافتن زیستگاه («واریکانس») هم نقش دارد.", "en": "Correction: Darwin rejected hypothetical 'land bridges' and relied on dispersal, but we now know many distribution patterns are explained by drifting continents (plate tectonics, proposed by Wegener in 1915 and accepted in the 1960s), as with links among southern-continent life. Dispersal across water is not the sole explanation; vicariance matters too.", "nl": "Correction: Darwin rejected hypothetical 'land bridges' and relied on dispersal, but we now know many distribution patterns are explained by drifting continents (plate tectonics, proposed by Wegener in 1915 and accepted in the 1960s), as with links among southern-continent life. Dispersal across water is not the sole explanation; vicariance matters too."}, "sources": ["src:81e1e7ae28"], "flags": ["dated", "editor-note"]}, {"text": {"fa": "یک افسانهٔ رایج: «سهره‌های داروین» در متن ۱۸۵۹ نقش مرکزی ندارند. در سفر بیگل (۱۸۳۱–۱۸۳۶) مشاهدهٔ گالاپاگوس به او کمک کرد، اما نقش سهره‌ها در داستان تکامل بیشتر به پژوهش‌های بعدی (لاک، گرانت‌ها) برمی‌گردد.", "en": "A common myth: 'Darwin's finches' play no central role in the 1859 text. The Galápagos on the Beagle voyage (1831–1836) helped him, but the finches' fame in the evolution story owes more to later research (Lack, the Grants).", "nl": "A common myth: 'Darwin's finches' play no central role in the 1859 text. The Galápagos on the Beagle voyage (1831–1836) helped him, but the finches' fame in the evolution story owes more to later research (Lack, the Grants)."}, "sources": ["src:84786f7bfa", "src:9bfbba7cbd"], "flags": ["contested", "editor-note"]}], "links": [{"to": "tabar:out-of-africa", "rel": "see-also", "note": {"fa": "خاستگاه آفریقایی انسان خردمند؛ نمونهٔ پراکنش انسان", "en": "African origin of Homo sapiens: human dispersal", "nl": "African origin of Homo sapiens: human dispersal"}}, {"to": "tabar:population-genetics", "rel": "see-also", "note": {"fa": "ژنومیک جمعیت و تبار", "en": "Population genomics and ancestry", "nl": "Population genomics and ancestry"}}, {"to": "tabar:human-evolution", "rel": "part-of", "note": {"fa": "تکامل انسان", "en": "Human evolution", "nl": "Human evolution"}}], "people": ["core:alfred-wegener", "core:joseph-dalton-hooker"], "sources": ["src:81e1e7ae28", "src:84786f7bfa", "src:9bfbba7cbd"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:human-genome", "kind": "concept", "title": {"fa": "ژنوم انسان: ۹۹٫۹ درصد مشترک", "en": "The human genome: 99.9 percent shared", "nl": "Het menselijk genoom: 99,9 procent gedeeld"}, "aliases": [], "parent": "tabar:basics", "field": "tabar:basics", "summary": {"fa": "حدود ۳ میلیارد حرف، نزدیک به ۲۰ هزار ژن پروتئین‌ساز، و دو انسان تصادفی در حدود یک حرف از هر هزار حرف با هم فرق دارند. همین یک‌دهم درصد، همهٔ تفاوت‌های ارثی ما را می‌سازد.", "en": "About 3 billion letters, close to 20 thousand protein-coding genes, and two random humans differ in about one letter in a thousand. That tenth of a percent carries all our inherited differences.", "nl": "Zo'n 3 miljard letters, bijna 20 duizend eiwitcoderende genen, en twee willekeurige mensen verschillen in ongeveer één letter op duizend. Dat tiende procent draagt al onze erfelijke verschillen."}, "points": [{"text": {"fa": "کنسرسیوم ژنوم انسان (۲۰۰۱): پیش‌نویس ژنوم، تعداد ژن‌ها بسیار کمتر از ۱۰۰ هزارِ پیش‌بینی‌شده (امروز حدود ۲۰ هزار)؛ بیش از ۹۸ درصد ژنوم پروتئین نمی‌سازد و بخشی از آن تنظیم‌کنندهٔ ژن‌هاست.", "en": "Human Genome Consortium (2001): the draft genome had far fewer genes than the 100 thousand predicted (today about 20 thousand); over 98 percent of the genome does not code for protein, and part of it regulates genes.", "nl": "Human Genome Consortium (2001): the draft genome had far fewer genes than the 100 thousand predicted (today about 20 thousand); over 98 percent of the genome does not code for protein, and part of it regulates genes."}, "sources": ["src:788a171c8d"], "flags": []}, {"text": {"fa": "پروژهٔ ۱۰۰۰ ژنوم (۲۰۱۵، ۲٬۵۰۴ نفر از ۲۶ جمعیت): هر فرد حدود ۴ تا ۵ میلیون جایگاه متفاوت با ژنوم مرجع دارد؛ بیشتر واریانت‌های شایع در همهٔ قاره‌ها یافت می‌شوند و واریانت‌های نادر جغرافیایی‌ترند.", "en": "The 1000 Genomes Project (2015, 2,504 people from 26 populations): each person differs from the reference at about 4 to 5 million sites; most common variants are found on every continent, while rare variants are more geographically specific.", "nl": "The 1000 Genomes Project (2015, 2,504 people from 26 populations): each person differs from the reference at about 4 to 5 million sites; most common variants are found on every continent, while rare variants are more geographically specific."}, "sources": ["src:7a7e4a41da"], "flags": []}], "links": [{"to": "tabar:race-biology", "rel": "explains", "note": {"fa": "چرا تنوع درون‌جمعیتی بیشتر است", "en": "Why within-population variation dominates", "nl": "Why within-population variation dominates"}}, {"to": "tabar:mutation-selection-drift", "rel": "see-also", "note": {"fa": "نیروهایی که این تنوع را می‌سازند", "en": "The forces that make this variation", "nl": "The forces that make this variation"}}], "people": [], "sources": ["src:788a171c8d", "src:7a7e4a41da"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:t1-americas-founding-lineages", "kind": "concept", "title": {"fa": "تبارهای بنیان‌گذار بومیان آمریکا: Q و پنج خوشهٔ میتوکندریایی", "en": "Founding lineages of Native Americans: Y-haplogroup Q and the mitochondrial clusters", "nl": "Stichtende lijnen van de oorspronkelijke bevolking van Amerika"}, "aliases": [], "parent": "tabar:population-genetics", "field": "tabar:population-genetics", "summary": {"fa": "داده‌های هاپلوگروهی نشان می‌دهند بومیان آمریکا از سیبری و از راه برینگیا آمده‌اند. هاپلوگروه Q در مردان و چند خوشهٔ میتوکندریایی در زنان نشانهٔ این پیوندند.", "en": "Haplogroup data show Native Americans came from Siberia via Beringia, with Y-haplogroup Q in men and a few mitochondrial clusters in women marking the link.", "nl": "Haplogroepdata tonen dat de eerste Amerikanen uit Siberië kwamen via Beringia."}, "points": [{"text": {"fa": "نویسنده می‌گوید بومیان آمریکا از سیبری و از راه باریکهٔ برینگ در چند موج، میان حدود ۲۵ تا ۱۲ هزار سال پیش، به آلاسکا و شمال آمریکا رسیده‌اند و داده‌های ژنتیکی این نظریه را کاملاً تایید می‌کنند.", "en": "The author says Native Americans arrived from Siberia across the Bering land bridge in several waves, between about 25,000 and 12,000 years ago, and that genetic data fully confirm this.", "nl": "The author says Native Americans arrived from Siberia across the Bering land bridge in several waves, between about 25,000 and 12,000 years ago, and that genetic data fully confirm this."}, "sources": ["src:93456bf0b8"], "flags": []}, {"text": {"fa": "بیشتر مردان بومی آمریکا هاپلوگروه Q را دارند؛ شاخهٔ Q-M3 در آمریکای مرکزی و جنوبی بسیار فراوان (بیش از ۹۰ درصد در برخی گروه‌ها) و Q-M242 در آسیای مرکزی و سیبری تکامل یافته و در میان ترک‌زبانان آلتایی و قوم کت هم دیده می‌شود. شاخهٔ Q-M3 مشخصهٔ بومیان آمریکاست.", "en": "Most Native American men carry haplogroup Q; the Q-M3 branch is very frequent in Central and South America (over 90 percent in some groups), while Q-M242 evolved in Central Asia and Siberia and also occurs among Altaic Turkic speakers and the Ket. Q-M3 is the Native American signature.", "nl": "Most Native American men carry haplogroup Q; the Q-M3 branch is very frequent in Central and South America (over 90 percent in some groups), while Q-M242 evolved in Central Asia and Siberia and also occurs among Altaic Turkic speakers and the Ket. Q-M3 is the Native American signature."}, "sources": ["src:93456bf0b8"], "flags": []}, {"text": {"fa": "در خط مادری، بومیان آمریکا به چهار خوشهٔ اصلی A، B، C و D (و X در گروه‌های شمالی مانند الگونکین‌ها و اوجیبوا) برمی‌گردند. «مرد کنویک» (حدود ۸۵۰۰ سال، واشینگتن) و نمونهٔ ساقاق گرینلند (حدود ۴ هزار سال) از نمونه‌های باستانی ذکرشده‌اند.", "en": "On the maternal side Native Americans trace to four main clusters A, B, C and D (plus X in northern groups such as the Algonquian and Ojibwe). 'Kennewick Man' (about 8,500 years old, Washington) and the Saqqaq sample from Greenland (about 4,000 years old) are among the ancient samples discussed.", "nl": "On the maternal side Native Americans trace to four main clusters A, B, C and D (plus X in northern groups such as the Algonquian and Ojibwe). 'Kennewick Man' (about 8,500 years old, Washington) and the Saqqaq sample from Greenland (about 4,000 years old) are among the ancient samples discussed."}, "sources": ["src:93456bf0b8"], "flags": []}, {"text": {"fa": "فرضیهٔ آمدن مهاجران از اروپا (فرهنگ سولوترین) برای توضیح خوشهٔ X را نویسنده رد می‌کند؛ بسامد X در سیبری و آلتایی و دادهٔ ژنتیکی این فرضیه را ناکارآمد می‌کنند.", "en": "The author rejects the hypothesis of European migrants (Solutrean) as an explanation for cluster X; X frequencies in the Altai and genetic data make that idea untenable.", "nl": "The author rejects the hypothesis of European migrants (Solutrean) as an explanation for cluster X; X frequencies in the Altai and genetic data make that idea untenable."}, "sources": ["src:93456bf0b8"], "flags": []}, {"text": {"fa": "کار تازه‌تر دربارهٔ DNA باستانی (از جمله پژوهش‌های ۲۰۱۵) نشان می‌دهد تاریخ ورود و شمار امواج پیچیده‌تر از الگوی ساده است و بخشی از نیاکان بومیان آمریکا به «اوراسیای شمالی باستان» می‌رسد؛ پس مسیر کتاب خلاصه‌ای از زمان نگارش آن است.", "en": "Newer ancient-DNA work (including 2015 studies) shows the timing and number of waves are more complicated than a simple model and that part of Native American ancestry reaches back to Ancient North Eurasians; the book's account is a snapshot of its time of writing.", "nl": "Newer ancient-DNA work (including 2015 studies) shows the timing and number of waves are more complicated than a simple model and that part of Native American ancestry reaches back to Ancient North Eurasians; the book's account is a snapshot of its time of writing."}, "sources": ["src:dae84752d4", "src:8fec492450"], "flags": ["contested", "editor-note"]}], "links": [{"to": "tabar:ancient-dna", "rel": "see-also", "note": {"fa": "DNA باستانی و بازنگری مسیر آمریکا", "en": "Ancient DNA and the revised peopling of the Americas", "nl": "Ancient DNA and the revised peopling of the Americas"}}, {"to": "tabar:haplogroups", "rel": "explains", "note": {"fa": "هاپلوگروه Q و M3", "en": "Haplogroup Q and M3", "nl": "Haplogroup Q and M3"}}, {"to": "tabar:out-of-africa", "rel": "part-of", "note": {"fa": "ادامهٔ پراکندگی انسان از آفریقا", "en": "Continuation of the dispersal out of Africa", "nl": "Continuation of the dispersal out of Africa"}}], "people": [], "sources": ["src:8fec492450", "src:93456bf0b8", "src:dae84752d4"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:europe-three-streams-yamnaya", "kind": "concept", "title": {"fa": "اروپا از سه جریان ساخته شد: شکارگردآورندگان، کشاورزان آناتولی و دامداران استپ (یامنایا)", "en": "Europe built from three streams: hunter-gatherers, Anatolian farmers and steppe herders (Yamnaya)", "nl": "Europa uit drie stromen: jager-verzamelaars, Anatolische boeren en steppeherders (Yamnaya)"}, "aliases": [], "parent": "tabar:population-genetics", "field": "tabar:population-genetics", "summary": {"fa": "بر پایهٔ ژنوم‌های باستانی، اروپاییان امروز از سه گروه بسیار متفاوت پدید آمده‌اند که طی حدود نه هزار سال به هم رسیدند. آخرین جریان، دامداران یامنایا از استپ، حدود ۵ هزار سال پیش با فرهنگ طناب‌نقش (Corded Ware) دگرگونی بزرگی در ترکیب ژنتیکی اروپای مرکزی ایجاد کرد. خود یامنایا آمیزه‌ای از شکارگردآورندگان اروپای شرقی و تباری «مرتبط با ایران و ارمنستان» بودند؛ این برچسب جغرافیایی بیش از حد دقیق نیست.", "en": "Based on ancient genomes, present-day Europeans descend from three very different groups that came together over about nine thousand years. The last stream, Yamnaya herders from the steppe, transformed the genetics of central Europe around 5,000 years ago with the Corded Ware culture. The Yamnaya themselves were a mix of eastern European hunter-gatherers and ancestry 'related to Iran and Armenia'; this geographic label is imprecise.", "nl": "Op basis van oud DNA stammen Europeanen af van drie sterk verschillende groepen die over ca. negenduizend jaar samenkwamen. De laatste stroom, Yamnaya-herders van de steppe, veranderde rond 5000 jaar geleden de genetica van Midden-Europa. De Yamnaya waren zelf een mengsel met afstamming 'verwant aan Iran en Armenië'; dat geografische label is onnauwkeurig."}, "points": [{"text": {"fa": "جریان نخست شکارگردآورندگان اروپایی‌اند. جریان دوم کشاورزانی از آناتولی (ترکیهٔ امروز) که پس از حدود ۹ هزار سال پیش رسیدند و در اروپای غربی و مرکزی بیش از ۹۰ درصد تبارشان را از مهاجران حفظ کردند. کشاورزان اولیه از نظر ژنتیکی به ساردینی‌های امروز شبیه‌اند. این بخش را بسیاری از پژوهش‌ها تکرار کرده‌اند.", "en": "The first stream is European hunter-gatherers. The second is farmers from Anatolia (present-day Turkey), who arrived after about 9,000 years ago and in western and central Europe kept more than 90 percent of ancestry from the migrants. Early farmers resemble present-day Sardinians genetically. This part has been replicated by many studies.", "nl": "The first stream is European hunter-gatherers. The second is farmers from Anatolia (present-day Turkey), who arrived after about 9,000 years ago and in western and central Europe kept more than 90 percent of ancestry from the migrants. Early farmers resemble present-day Sardinians genetically. This part has been replicated by many studies."}, "sources": ["src:a4f00f41ff", "src:92e120a792"], "flags": []}, {"text": {"fa": "جریان سوم دامداران یامنایا از استپ شمال دریای سیاه و خزر است که با ارابه و اسب حدود ۵ هزار سال پیش گسترش یافتند. رایش می‌گوید در آلمان مردم فرهنگ طناب‌نقش حدود سه‌چهارم تبارشان را از گروه‌های مرتبط با یامنایا داشتند و این تبار از آن پس در همهٔ شمال اروپا ماند. پیش از این داده‌ها بیشتر باستان‌شناسان فکر می‌کردند فرهنگ یامنایا بیشتر با تقلید و تجارت پخش شد، نه با جابه‌جایی انبوه مردم.", "en": "The third stream is Yamnaya herders from the steppe north of the Black and Caspian seas who spread with wagons and horses about 5,000 years ago. Reich states that people of the Corded Ware culture in Germany derived about three quarters of their ancestry from Yamnaya-related groups, and that this ancestry persists across northern Europe. Before these data most archaeologists thought Yamnaya culture spread by imitation and trade, not mass movement of people.", "nl": "The third stream is Yamnaya herders from the steppe north of the Black and Caspian seas who spread with wagons and horses about 5,000 years ago. Reich states that people of the Corded Ware culture in Germany derived about three quarters of their ancestry from Yamnaya-related groups, and that this ancestry persists across northern Europe. Before these data most archaeologists thought Yamnaya culture spread by imitation and trade, not mass movement of people."}, "sources": ["src:a4f00f41ff", "src:0ac39f77d9"], "flags": []}, {"text": {"fa": "خود یامنایا حدود نیمی از تبارشان را از شکارگردآورندگان اروپای شرقی و نیم دیگر را از تباری داشتند که به مردم باستانی و امروزی ایران و ارمنستان نزدیک است؛ احتمالاً از راه قفقاز. توجه: «مرتبط با ایران» به معنای مهاجرت مستقیم از فلات ایران نیست؛ پژوهش‌های بعدی این تبار را بیشتر به شکارگردآورندگان قفقاز نسبت می‌دهند که خود به کشاورزان باستانی ایران نزدیک بودند.", "en": "The Yamnaya themselves derived about half their ancestry from eastern European hunter-gatherers and the other half from ancestry close to ancient and present-day people of Iran and Armenia, probably via the Caucasus. Note: 'Iran-related' does not mean direct migration from the Iranian plateau; later work links this ancestry mainly to Caucasus hunter-gatherers, who were themselves close to ancient Iranian farmers.", "nl": "The Yamnaya themselves derived about half their ancestry from eastern European hunter-gatherers and the other half from ancestry close to ancient and present-day people of Iran and Armenia, probably via the Caucasus. Note: 'Iran-related' does not mean direct migration from the Iranian plateau; later work links this ancestry mainly to Caucasus hunter-gatherers, who were themselves close to ancient Iranian farmers."}, "sources": ["src:a4f00f41ff", "src:0ac39f77d9"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "فرایند نیرومند بود، ولی یکدست نبود. در شبه‌جزیرهٔ ایبری حدود ۳۰ درصد جمعیت جایگزین شد، اما در مردان با تبار یامنایا حدود ۹۰ درصد کروموزوم Y از نوع استپی بود که پیش‌تر در آنجا نبود. رایش از این نتیجه می‌گیرد که مردان وابسته به قدرت در رقابت بر سر همسر پیروز بودند و گسترش «کاملاً مسالمت‌آمیز» نبود. (ادامه در مدخل دربارهٔ جنسیت و نابرابری.)", "en": "The process was powerful but not uniform. In Iberia about 30 percent of the population was replaced, yet around 90 percent of males with Yamnaya ancestry carried a steppe-type Y chromosome that was previously absent. Reich infers that men with power outcompeted local men for mates and that the spread was not entirely peaceful. (More in the entry on sex bias and inequality.)", "nl": "The process was powerful but not uniform. In Iberia about 30 percent of the population was replaced, yet around 90 percent of males with Yamnaya ancestry carried a steppe-type Y chromosome that was previously absent. Reich infers that men with power outcompeted local men for mates and that the spread was not entirely peaceful. (More in the entry on sex bias and inequality.)"}, "sources": ["src:a4f00f41ff", "src:f0cf216e27"], "flags": ["editor-note"]}, {"text": {"fa": "رایش یادآوری می‌کند این یافته ریشه‌های ایدئولوژیک دارد: گوستاو کوسینا، باستان‌شناس آلمانی، فرهنگ طناب‌نقش را پایهٔ ادعای ناسیونالیستی آلمان کرد و نازی‌ها از آن استفاده کردند. پس از جنگ، باستان‌شناسان نسبت به هر تبیین مبتنی بر مهاجرت بدگمان شدند. به نظر او ژنتیک نشان می‌دهد مهاجرت واقعاً رخ داده، اما آمیختگی هم نشان می‌دهد «خلوص» تباری در کار نبوده است.", "en": "Reich points out the ideological background: the German archaeologist Gustaf Kossinna made the Corded Ware culture a basis for German nationalist claims, and the Nazis used his work. After the war archaeologists became wary of migration explanations. In his view genetics shows migration did happen, but the resulting mixture also shows there was no 'purity' of ancestry.", "nl": "Reich points out the ideological background: the German archaeologist Gustaf Kossinna made the Corded Ware culture a basis for German nationalist claims, and the Nazis used his work. After the war archaeologists became wary of migration explanations. In his view genetics shows migration did happen, but the resulting mixture also shows there was no 'purity' of ancestry."}, "sources": ["src:a4f00f41ff"], "flags": []}], "links": [{"to": "tabar:steppe-indo-iranian", "rel": "see-also", "note": {"fa": "همین تبار استپی در جنوب و میانهٔ آسیا", "en": "The same steppe ancestry in South and Central Asia", "nl": "The same steppe ancestry in South and Central Asia"}}, {"to": "tabar:iranian-farmer-legacy", "rel": "bridges", "note": {"fa": "تبار «ایرانی» در یامنایا", "en": "The 'Iran-related' component in Yamnaya", "nl": "The 'Iran-related' component in Yamnaya"}}, {"to": "tabar:indo-european-origin-debate", "rel": "see-also", "note": {"fa": "پرسش زبان هندواروپایی", "en": "The Indo-European language
