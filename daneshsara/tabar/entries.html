بیش از ۳۰۰ هزار زوج: ۳۸٫۶ درصد خویشاوندی، ۲۷٫۹ درصد دخترعمو/پسرعمو و معادل‌ها؛ تفاوت زیاد بین استان‌ها. داده مربوط به اوایل دههٔ ۱۳۸۰ است و روند کاهشی گزارش شده.", "en": "In a national sample of over 300,000 couples: 38.6% consanguineous, 27.9% first cousins or equivalents; large provincial variation. Data from the early 2000s; a declining trend has been reported."}, "year": 2004, "method": "national survey", "grade": "A", "contested": false, "source": [{"title": "Saadat, M., Ansari-Lari, M., & Farhud, D. D. (2004). Consanguineous marriage in Iran. Annals of Human Biology, 31(2), 263–269.", "url": "https://doi.org/10.1080/03014460310001652211"}], "fields": ["medgen"], "concepts": ["tabar:consanguinity"], "capability": [2], "viz": {"kind": "bars", "unit": {"fa": "درصد زوج‌ها"}, "label": {"fa": "ازدواج خویشاوندی، نمونهٔ ملی اوایل دههٔ ۱۳۸۰"}, "bars": [{"fa": "هر نوع خویشاوندی", "v": 38.6, "self": true}, {"fa": "عموزاده/دایی‌زاده و معادل‌ها", "v": 27.9}], "note": {"fa": "ستون دوم زیرمجموعهٔ ستون اول است. داده مربوط به بیش از بیست سال پیش است و روند کاهشی گزارش شده، ولی پیمایش ملی تازه‌ای با همین وسعت منتشر نشده."}}, "roots": {"fa": "ازدواج خویشاوندی در ایران ریشهٔ یک‌لایه ندارد. در بخش‌هایی از کشور الگوی ایلی و عشیره‌ای، نگه داشتن زمین و دارایی در خانواده، و اعتماد بیشتر به خویشاوند در نبود نهاد واسط، همه در آن سهم دارند. در برخی مناطق هم فاصلهٔ جغرافیایی و کوچکی جامعهٔ محلی انتخاب را محدود می‌کرده است.\nاین الگو مختص ایران نیست و در نوار وسیعی از شمال آفریقا تا جنوب آسیا دیده می‌شود، پس توضیح‌هایی که آن را به یک ویژگی فرهنگی خاص ایران نسبت می‌دهند دقیق نیستند."}, "now": {"fa": "داده‌ای که اینجا آمده مربوط به اوایل دههٔ ۱۳۸۰ است و پیمایش ملی تازه‌ای با همین وسعت منتشر نشده. گزارش‌های موضعی روند کاهشی را نشان می‌دهند، به‌ویژه در شهرها و میان تحصیل‌کرده‌ها، ولی اندازهٔ این کاهش در سطح ملی معلوم نیست. پیامد بهداشتی‌اش در همین ویکی، در یادداشت غربالگری تالاسمی، دیده می‌شود."}}, "iran:steppe-ancestry": {"id": "iran:steppe-ancestry", "domain": "tabar", "question": {"fa": "آیا ژنتیک «ورود آریایی‌ها» را تأیید می‌کند؟", "en": "Does genetics confirm \"the arrival of the Aryans\"?"}, "finding": {"fa": "تبار استپی در هزارهٔ دوم پیش از میلاد به آسیای میانه و جنوبی می‌رسد و با تبار کشاورزان ایرانی می‌آمیزد؛ پیوندش با زبان‌های هندوایرانی استنباط است و میان باستان‌شناسان و زبان‌شناسان محل بحث. نمونه‌های باستانی از خود فلات ایران هنوز کم‌اند.", "en": "Steppe ancestry reaches Central and South Asia in the second millennium BCE and mixes with Iranian-farmer ancestry; its link to Indo-Iranian languages is inference and debated among archaeologists and linguists. Ancient samples from the Iranian plateau itself remain few."}, "year": 2019, "method": "ancient DNA, 523 genomes (region-wide)", "grade": "B", "contested": true, "critique": "ژن زبان نمی‌گوید؛ تطبیق خوشهٔ ژنتیکی با قوم یا زبان فرضیه است.", "source": [{"title": "Narasimhan, V. M., et al. (2019). The formation of human populations in South and Central Asia. Science, 365(6457), eaat7487.", "url": "https://doi.org/10.1126/science.aat7487"}], "fields": ["archaeogen"], "concepts": ["tabar:steppe-indo-iranian"], "capability": [7], "viz": {"kind": "none", "note": {"fa": "برای این یافته سری زمانی یا عدد قابل‌رسم منتشرشده‌ای در دست نیست؛ به‌جای نمودار، متن و منبع را بخوانید."}}}, "iran:zagros-neolithic": {"id": "iran:zagros-neolithic", "domain": "tabar", "question": {"fa": "کشاورزان نخستین زاگرس از نظر ژنتیکی که بودند؟", "en": "Who were the first Zagros farmers, genetically?"}, "finding": {"fa": "چهار ژنوم ۷ تا ۱۰ هزار ساله از کرمانشاه و لرستان: جمعیتی جدا از کشاورزان آناتولی، با پیوستگی به مردم امروز ایران، جنوب آسیا و قفقاز.", "en": "Four 7–10-thousand-year-old genomes from Kermanshah and Lorestan: a population separate from Anatolian farmers, continuous with today's Iranians, South Asians and the Caucasus."}, "year": 2016, "method": "ancient DNA, 4 genomes", "grade": "A", "contested": false, "source": [{"title": "Broushaki, F., et al. (2016). Early Neolithic genomes from the eastern Fertile Crescent. Science, 353(6298), 499–503.", "url": "https://doi.org/10.1126/science.aaf7943"}, {"title": "Lazaridis, I., et al. (2016). Genomic insights into the origin of farming in the ancient Near East. Nature, 536, 419–424.", "url": "https://doi.org/10.1038/nature19310"}], "fields": ["archaeogen"], "concepts": ["tabar:zagros-neolithic"], "capability": [7], "viz": {"kind": "none", "note": {"fa": "برای این یافته سری زمانی یا عدد قابل‌رسم منتشرشده‌ای در دست نیست؛ به‌جای نمودار، متن و منبع را بخوانید."}}}, "iran:thalassemia-screening": {"id": "iran:thalassemia-screening", "domain": "tabar", "question": {"fa": "آیا غربالگری ملی تالاسمی در ایران کار کرد؟", "en": "Did Iran's national thalassaemia screening work?"}, "finding": {"fa": "غربالگری پیش از ازدواج از ۱۹۹۷ همراه با مشاوره و تشخیص پیش از تولد؛ کاهش چشمگیر تولد نوزادان مبتلا در استان‌های هدف در سال‌های اول.", "en": "Premarital screening since 1997 with counselling and prenatal diagnosis; a marked fall in affected births in target provinces in the first years."}, "year": 2004, "method": "programme evaluation", "grade": "A", "contested": false, "source": [{"title": "Samavat, A., & Modell, B. (2004). Iranian national thalassaemia screening programme. BMJ, 329(7475), 1134–1137.", "url": "https://doi.org/10.1136/bmj.329.7475.1134"}], "fields": ["medgen"], "concepts": ["tabar:thalassemia-screening"], "capability": [2], "viz": {"kind": "none", "note": {"fa": "برای این یافته سری زمانی یا عدد قابل‌رسم منتشرشده‌ای در دست نیست؛ به‌جای نمودار، متن و منبع را بخوانید."}}, "roots": {"fa": "تالاسمی در ایران به دو دلیل شایع بود: فراوانی بالای ناقلان در نوار ساحلی شمال و جنوب، و ازدواج خویشاوندی که احتمال هم‌زمان بودن دو ناقل را بالا می‌برد. برنامهٔ ملی غربالگری پیش از ازدواج از ۱۳۷۶ اجباری شد و با آزمایش ساده و مشاورهٔ ژنتیک، زوج‌های پرخطر شناسایی می‌شوند.\nاین یکی از کم‌شمار نمونه‌هایی است که یک سیاست بهداشتی در ایران اثر بزرگ و قابل اندازه‌گیری داشته و در ادبیات جهانی هم به آن ارجاع می‌دهند."}, "now": {"fa": "برنامه همچنان اجرا می‌شود و تولد موارد جدید به‌شدت کاهش یافته. دو مسئلهٔ باقی‌مانده: مراقبت بلندمدت از بیمارانی که از پیش متولد شده‌اند و به تزریق خون و داروی منظم نیاز دارند، و پرسش‌های اخلاقی دربارهٔ غربالگری اجباری و تصمیم‌گیری زوج‌ها، که در ویکی فلسفه به آن پرداخته می‌شود."}}, "iran:genetic-heterogeneity": {"id": "iran:genetic-heterogeneity", "domain": "tabar", "question": {"fa": "ساختار ژنتیکی گروه‌های قومی ایران چگونه است؟", "en": "What is the genetic structure of Iran's ethnic groups?"}, "finding": {"fa": "۱٬۰۲۱ نفر از ۱۱ گروه: خوشهٔ بزرگ مرکزی (فارس، کرد، لر، آذری، عرب و…) با تمایز کم، و تمایز بیشتر در بلوچ، ترکمن و سیستانی.", "en": "1,021 people from 11 groups: a large central cluster (Persians, Kurds, Lurs, Azeris, Arabs, …) with low differentiation, more distinct Baloch, Turkmen and Sistani."}, "year": 2019, "method": "genome-wide array, 1,021 individuals", "grade": "A", "contested": false, "source": [{"title": "Mehrjoo, Z., et al. (2019). Distinct genetic variation and heterogeneity of the Iranian population. PLOS Genetics, 15(9), e1008385.", "url": "https://doi.org/10.1371/journal.pgen.1008385"}], "fields": ["popgen"], "concepts": ["tabar:iranian-genetic-diversity"], "capability": [7], "viz": {"kind": "none", "note": {"fa": "برای این یافته سری زمانی یا عدد قابل‌رسم منتشرشده‌ای در دست نیست؛ به‌جای نمودار، متن و منبع را بخوانید."}}}}, "ext": {"soc:millat-to-nation-meaning-shift-iran-two-views": {"title": {"fa": "از «ملت» به «نیشن»: معنای ایران و امر ملی در یک گفت‌وگوی دو نفره", "en": "From millat to 'nation': what 'Iran' and 'the national' mean, in a two-speaker dialogue", "nl": "Van 'millat' naar 'natie': wat 'Iran' en 'het nationale' betekenen"}, "url": "../soc/#millat-to-nation-meaning-shift-iran-two-views"}, "psy:p-psychometrics": {"title": {"fa": "روان‌سنجی", "en": "Psychometrics", "nl": "Psychometrie"}, "url": "../psy/tools/graph.html#p-psychometrics"}, "psy:dehumanization": {"title": {"fa": "انسانیت‌زدایی", "en": "Dehumanization", "nl": "Ontmenselijking"}, "url": "../psy/tool
