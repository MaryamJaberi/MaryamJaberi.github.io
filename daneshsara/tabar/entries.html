reason for traits that do not help survival, like the peacock's tail or stag's antlers: their benefit lies in competing for mates. The 1859 edition gives it only a few pages; the full treatment came later in The Descent of Man (1871).", "nl": "Darwin zag seksuele selectie als verklaring voor eigenschappen die niet bijdragen aan overleven, zoals de pauwenstaart: ze helpen bij de strijd om partners. In 1859 beslaat het enkele pagina's; de uitwerking volgde in The Descent of Man (1871)."}, "points": [{"text": {"fa": "داروین می‌گوید این نوع انتخاب به مرگ بستگی ندارد، بلکه به تعداد فرزندان: نری که شاخ، رنگ یا آواز بهتری دارد جفت بیشتری می‌یابد. او دو سازوکار را از هم جدا می‌کند: رقابت مستقیم نرها با هم و گزینش جفت (معمولاً توسط ماده‌ها).", "en": "He says this kind of selection depends not on death but on number of offspring: a male with better weapons, colour or song gets more mates. He distinguishes direct competition among males from mate choice (usually by females).", "nl": "He says this kind of selection depends not on death but on number of offspring: a male with better weapons, colour or song gets more mates. He distinguishes direct competition among males from mate choice (usually by females)."}, "sources": ["src:84786f7bfa"], "flags": []}, {"text": {"fa": "در چاپ ۱۸۵۹ تأکید بیشتر روی رقابت نرها و نمونه‌هایی چون قوی‌شدن شاخ و ساختارهای نبرد است. دربارهٔ اینکه چرا ماده‌ها چنین ویژگی‌هایی را می‌پسندند توضیح مفصلی نمی‌دهد؛ این پرسش تا قرن بیستم بحث‌برانگیز ماند (والاس با گزینش جفت توسط ماده‌ها مخالف بود).", "en": "The 1859 text stresses male-male contest and weapon-like structures. It does not explain at length why females prefer such traits; this stayed controversial into the twentieth century (Wallace doubted female choice).", "nl": "The 1859 text stresses male-male contest and weapon-like structures. It does not explain at length why females prefer such traits; this stayed controversial into the twentieth century (Wallace doubted female choice)."}, "sources": ["src:84786f7bfa", "src:6a5d7431c4"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "پیشرفت بعدی: فیشر (۱۹۳۰) مدل «فرار» را پیشنهاد کرد که در آن ترجیح مادگان و صفت نرها هم‌زمان تقویت می‌شود، و زاهاوی (۱۹۷۵) «اصل معلولیت» را: صفت پرهزینه می‌تواند نشانهٔ صادقانهٔ کیفیت باشد. شواهد تجربی مفصل و دسته‌ای از آنها در کتاب آندرسون (۱۹۹۴) گردآوری شده است.", "en": "Later progress: Fisher (1930) proposed the runaway model, where female preference and male trait reinforce each other, and Zahavi (1975) the handicap principle: a costly trait can be an honest signal of quality. Empirical evidence is reviewed in Andersson (1994).", "nl": "Later progress: Fisher (1930) proposed the runaway model, where female preference and male trait reinforce each other, and Zahavi (1975) the handicap principle: a costly trait can be an honest signal of quality. Empirical evidence is reviewed in Andersson (1994)."}, "sources": ["src:40c28190f8", "src:43f08defcb"], "flags": ["editor-note"]}, {"text": {"fa": "هشدار: نتیجه‌گیری‌های سادهٔ «طبیعی بودنِ» رفتار جنسی در انسان از این نظریه محتاطانه باید باشد؛ نقش‌های جنسیتی انسان به فرهنگ، اقتصاد و تاریخ نیز وابسته است و پژوهش روان‌شناسی تکاملی در این زمینه دچار اختلاف نظر است.", "en": "Caution: simple conclusions about what is 'natural' in human sexual behaviour must be treated carefully; human gender roles also depend on culture, economy and history, and evolutionary-psychology work here is disputed.", "nl": "Caution: simple conclusions about what is 'natural' in human sexual behaviour must be treated carefully; human gender roles also depend on culture, economy and history, and evolutionary-psychology work here is disputed."}, "sources": [], "flags": ["contested", "editor-note"]}], "links": [{"to": "psy:evo-sex", "rel": "see-also", "note": {"fa": "تعارض جنسی و روان‌شناسی تکاملی", "en": "Sexual conflict (evolutionary psychology)", "nl": "Sexual conflict (evolutionary psychology)"}}, {"to": "psy:sex-gender", "rel": "see-also", "note": {"fa": "روان‌شناسی جنس و جنسیت", "en": "Psychology of sex and gender", "nl": "Psychology of sex and gender"}}, {"to": "tabar:human-evolution", "rel": "part-of", "note": {"fa": "تکامل انسان", "en": "Human evolution", "nl": "Human evolution"}}], "people": ["core:charles-darwin", "core:amotz-zahavi"], "sources": ["src:40c28190f8", "src:43f08defcb", "src:6a5d7431c4", "src:84786f7bfa"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:twin-adoption", "kind": "concept", "title": {"fa": "مطالعات دوقلوها و فرزندخواندگی", "en": "Twin and adoption studies", "nl": "Tweeling- en adoptiestudies"}, "aliases": [], "parent": "tabar:behavior-genetics", "field": "tabar:behavior-genetics", "summary": {"fa": "دوقلوهای همسان در برابر ناهمسان، و فرزندخوانده‌ها در برابر خانوادهٔ زیستی و پرورشی: دو آزمایش طبیعی که ژن و محیط را از هم جدا می‌کنند.", "en": "Identical versus fraternal twins, and adoptees versus their biological and adoptive families: two natural experiments that pull genes and environment apart.", "nl": "Eeneiige versus twee-eiige tweelingen, en adoptiekinderen versus hun biologische en adoptiefamilie: twee natuurlijke experimenten die genen en omgeving uit elkaar halen."}, "points": [{"text": {"fa": "منطق: اگر دوقلوهای همسان (۱۰۰٪ ژن مشترک) در صفتی شبیه‌تر از ناهمسان‌ها (~۵۰٪) باشند، تفاوت را به ژن نسبت می‌دهیم؛ مشروط به فرض «محیط برابر».", "en": "Logic: if identical twins (100 percent shared genes) resemble each other more than fraternal twins (~50 percent), the difference is attributed to genes, given the \"equal environments\" assumption.", "nl": "Logic: if identical twins (100 percent shared genes) resemble each other more than fraternal twins (~50 percent), the difference is attributed to genes, given the \"equal environments\" assumption."}, "sources": ["src:1deae47297"], "flags": []}, {"text": {"fa": "فرزندخوانده‌ها در بزرگسالی در هوش و شخصیت به والدین زیستی که هرگز ندیده‌اند شبیه‌ترند تا به والدین پرورشی؛ این یکی از ده یافتهٔ تکرارشدهٔ ژنتیک رفتاری است.", "en": "Adult adoptees resemble biological parents they never met more than their adoptive parents in intelligence and personality; one of behaviour genetics' ten replicated findings.", "nl": "Adult adoptees resemble biological parents they never met more than their adoptive parents in intelligence and personality; one of behaviour genetics' ten replicated findings."}, "sources": ["src:1deae47297"], "flags": []}, {"text": {"fa": "نقد: فرض محیط برابر برای دوقلوهای همسان کامل برقرار نیست (با آنها شبیه‌تر رفتار می‌شود)، و این می‌تواند وراثت‌پذیری را کمی بیش‌برآورد کند.", "en": "Critique: the equal-environments assumption does not fully hold for identical twins (they are treated more alike), which may slightly inflate heritability.", "nl": "Critique: the equal-environments assumption does not fully hold for identical twins (they are treated more alike), which may slightly inflate heritability."}, "sources": ["src:ba8f3ee8f4"], "flags": ["editor-note"]}], "links": [{"to": "tabar:heritability", "rel": "measured-by", "note": {"fa": "ابزار اصلی برآورد وراثت‌پذیری", "en": "The main tool for estimating heritability", "nl": "The main tool for estimating heritability"}}, {"to": "tabar:gwas-polygenic", "rel": "contrasts", "note": {"fa": "روش جدیدتر: مستقیم از دی‌ان‌ای", "en": "The newer method: directly from DNA", "nl": "The newer method: directly from DNA"}}], "people": ["core:robert-plomin"], "sources": ["src:1deae47297", "src:ba8f3ee8f4"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:thalassemia-screening", "kind": "concept", "title": {"fa": "برنامهٔ ملی غربالگری تالاسمی ایران", "en": "Iran's national thalassaemia screening programme", "nl": "Het Iraanse nationale screeningsprogramma voor thalassemie"}, "aliases": [], "parent": "tabar:medical-genetics", "field": "tabar:medical-genetics", "summary": {"fa": "از ۱۹۹۷ غربالگری ناقلان تالاسمی پیش از ازدواج در ایران اجباری شد، همراه با مشاوره و بعدها تشخیص پیش از تولد. یکی از معدود برنامه‌های ژنتیک جمعیتی موفق در کشورهای با درآمد متوسط، و الگویی که در BMJ معرفی شد.", "en": "From 1997 premarital carrier screening for thalassaemia became mandatory in Iran, with counselling and later prenatal diagnosis. One of the few successful population-genetics programmes in a middle-income country, presented as a model in the BMJ.", "nl": "Vanaf 1997 werd premaritale dragerscreening voor thalassemie in Iran verplicht, met counseling en later prenatale diagnostiek. Een van de weinige geslaagde populatiegenetische programma's in een middeninkomensland, in de BMJ als model gepresenteerd."}, "points": [{"text": {"fa": "صمدوت و مودل (۲۰۰۴): زوج‌های هر دو ناقل، مشاوره می‌گیرند و می‌توانند ازدواج نکنند، ازدواج کنند و تشخیص پیش از تولد انجام دهند، یا خطر را بپذیرند؛ در سال‌های اول، تولد نوزادان مبتلا در استان‌های هدف به‌طور چشمگیری کاهش یافت.", "en": "Samavat and Modell (2004): couples who are both carriers receive counselling and may not marry, marry and use prenatal diagnosis, or accept the risk; in the first years the birth of affected infants fell markedly in the target provinces.", "nl": "Samavat and Modell (2004): couples who are both carriers receive counselling and may not marry, marry and use prenatal diagnosis, or accept the risk; in the first years the birth of affected infants fell markedly in the target provinces."}, "sources": ["src:0aa129f24c"], "flags": []}, {"text": {"fa": "درس‌های برنامه: ادغام در نظام بهداشت اولیه، حمایت رهبران مذهبی از مجوز سقط درمانی (فتوای ۱۹۹۷)، و احترام به انتخاب زوج به جای ممنوعیت.", "en": "Lessons of the programme: integration in primary health care, religious leaders' support for a therapeutic abortion permit (1997 ruling), and respect for the couple's choice rather than prohibition.", "nl": "Lessons of the programme: integration in primary health care, religious leaders' support for a therapeutic abortion permit (1997 ruling), and respect for the couple's choice rather than prohibition."}, "sources": ["src:0aa129f24c"], "flags": []}], "links": [{"to": "tabar:consanguinity", "rel": "applies-to", "note": {"fa": "چرا غربالگری در ایران اهمیت ویژه دارد", "en": "Why screening matters especially in Iran", "nl": "Why screening matters especially in Iran"}}, {"to": "atlas:genethics", "rel": "bridges", "note": {"fa": "پل اخلاق ژنتیک", "en": "The genetic ethics bridge", "nl": "The genetic ethics bridge"}}], "people": ["core:bernadette-modell"], "sources": ["src:0aa129f24c"], "booklets": [], "origin": null, "iran": "iran:thalassemia-screening", "wikidata": null, "status": "draft"}, {"id": "tabar:gene-environment", "kind": "concept", "title": {"fa": "تعامل و همبستگی ژن و محیط", "en": "Gene–environment interplay", "nl": "Samenspel van gen en omgeving"}, "aliases": [], "parent": "tabar:behavior-genetics", "field": "tabar:behavior-genetics", "summary": {"fa": "ژن و محیط دو ستون جدا نیستند: ژن‌ها محیط را انتخاب و برمی‌انگیزند، و محیط تعیین می‌کند ژن‌ها چقدر بروز کنند. این است که «چند درصد ژن، چند درصد محیط» سؤال بدی است.", "en": "Genes and environment are not two separate columns: genes select and evoke environments, and environments set how much genes express. That is why \"what percent genes, what percent environment\" is a bad question.", "nl": "Genen en omgeving zijn geen twee aparte kolommen: genen selecteren en roepen omgevingen op, en omgevingen bepalen hoeveel genen tot uiting komen. Daarom is \"hoeveel procent genen, hoeveel procent omgeving\" een slechte vraag."}, "points": [{"text": {"fa": "سه نوع همبستگی ژن–محیط: منفعل (والدین هم ژن می‌دهند هم محیط)، برانگیزاننده (کودک کنجکاو پاسخ‌های غنی‌تری می‌گیرد)، و فعال (آدم‌ها محیطی را انتخاب می‌کنند که با گرایش‌هایشان جور است).", "en": "Three kinds of gene–environment correlation: passive (parents give both genes and environment), evocative (a curious child draws richer responses), and active (people choose environments that fit their dispositions).", "nl": "Three kinds of gene–environment correlation: passive (parents give both genes and environment), evocative (a curious child draws richer responses), and active (people choose environments that fit their dispositions)."}, "sources": ["src:6104f13aa6"], "flags": []}, {"text": {"fa": "ترکهایمر (۲۰۰۳): در کودکان خانواده‌های فقیر آمریکایی وراثت‌پذیری هوش نزدیک صفر و در خانواده‌های مرفه بالا بود؛ محرومیت نمی‌گذارد تفاوت‌های ژنتیکی بروز کنند.", "en": "Turkheimer (2003): among children of poor US families the heritability of IQ was near zero, among affluent families high; deprivation keeps genetic differences from showing.", "nl": "Turkheimer (2003): among children of poor US families the heritability of IQ was near zero, among affluent families high; deprivation keeps genetic differences from showing."}, "sources": ["src:bf306944ea"], "flags": []}, {"text": {"fa": "تکرار: فراتحلیل ۲۰۱۶ این تعامل را در آمریکا تأیید کرد ولی در اروپای غربی و استرالیا نه؛ احتمالاً چون سیستم‌های رفاهی کف محیط را بالا می‌برند. یافته‌ای وابسته به بافت، نه قانون جهانی.", "en": "Replication: a 2016 meta-analysis confirmed the interaction in the US but not in Western Europe or Australia, probably because welfare systems raise the environmental floor. A context-dependent finding, not a universal law.", "nl": "Replication: a 2016 meta-analysis confirmed the interaction in the US but not in Western Europe or Australia, probably because welfare systems raise the environmental floor. A context-dependent finding, not a universal law."}, "sources": ["src:65b756684e"], "flags": ["contested"]}], "links": [{"to": "tabar:heritability", "rel": "explains", "note": {"fa": "چرا وراثت‌پذیری یک عدد ثابت نیست", "en": "Why heritability is not a fixed number", "nl": "Why heritability is not a fixed number"}}, {"to": "tabar:iq-heritability-debate", "rel": "prerequisite", "note": {"fa": "بدون این مفهوم بحث هوش گمراه‌کننده است", "en": "Without this concept the IQ debate misleads", "nl": "Without this concept the IQ debate misleads"}}], "people": ["core:eric-turkheimer"], "sources": ["src:6104f13aa6", "src:65b756684e", "src:bf306944ea"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:darwin-inheritance-gap", "kind": "concept", "title": {"fa": "خلأ وراثت در نظریهٔ داروین: وراثت آمیخته و ارث اکتسابی", "en": "The inheritance gap in Darwin's theory: blending and acquired characters", "nl": "De erfelijkheidskloof in Darwins theorie: vermenging en verworven eigenschappen"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "نظریهٔ داروین به وراثت نیاز داشت، اما در ۱۸۵۹ هیچ نظریهٔ درستی برای آن وجود نداشت. داروین بیشتر به «دیدگاه رایج زمانه» تکیه کرد: آمیزش والدین ویژگی‌ها را کم‌وبیش مخلوط می‌کند و استفاده یا ناستفادهٔ یک عضو می‌تواند به نسل بعد برسد. هر دو بخش با ژنتیک مندلی کنار گذاشته یا اصلاح شدند.", "en": "Darwin's theory needed heredity, but in 1859 no correct theory of it existed. He leaned on the common views of his day: parental traits roughly mix, and use or disuse of an organ can be passed on. Mendelian genetics later discarded or corrected both.", "nl": "Darwins theorie had erfelijkheid nodig, maar in 1859 bestond er geen juiste theorie. Hij leunde op gangbare ideeën: vermenging van ouderlijke eigenschappen en erfelijkheid van gebruik en niet-gebruik. De Mendeliaanse genetica verwierp of corrigeerde beide."}, "points": [{"text": {"fa": "داروین در «خاستگاه گونه‌ها» (چاپ نخست) می‌پذیرد که قانون‌های وراثت «ناشناخته» است و از «آمیزش و درهم‌شدن» ویژگی‌ها هم به‌عنوان یک خطر برای ماندگاری تفاوت‌های کوچک حرف می‌زند. فلیمینگ جنکین در ۱۸۶۷ استدلال کرد که اگر وراثت واقعاً آمیخته باشد، یک ویژگی تازه در جمعیت بزرگ رقیق می‌شود و از میان می‌رود.", "en": "In the first edition Darwin admits the laws of inheritance are unknown and treats the 'blending' of traits through crossing as a threat to small differences persisting. Fleeming Jenkin argued in 1867 that under true blending a new trait would be diluted away in a large population.", "nl": "In the first edition Darwin admits the laws of inheritance are unknown and treats the 'blending' of traits through crossing as a threat to small differences persisting. Fleeming Jenkin argued in 1867 that under true blending a new trait would be diluted away in a large population."}, "sources": ["src:84786f7bfa"], "flags": ["dated"]}, {"text": {"fa": "پاسخ درست را مندل (۱۸۶۶) پیش‌تر یافته بود، ولی دانش او تا حدود ۱۹۰۰ جدی گرفته نشد: وراثت «ذره‌ای» است. ژن‌ها مخلوط نمی‌شوند و بدون تغییر منتقل می‌شوند، پس تنوع در جمعیت حفظ می‌شود و انتخاب بر آن عمل می‌کند. بدین ترتیب «وراثت آمیخته» به‌عنوان نظریهٔ عمومی وراثت رد شد.", "en": "The right answer had been found by Mendel (1866) but was not taken seriously until about 1900: inheritance is particulate. Genes do not blend and are passed on intact, so variation is preserved for selection to act on. Blending as a general theory of heredity was thereby rejected.", "nl": "The right answer had been found by Mendel (1866) but was not taken seriously until about 1900: inheritance is particulate. Genes do not blend and are passed on intact, so variation is preserved for selection to act on. Blending as a general theory of heredity was thereby rejected."}, "sources": ["src:1de9de3693"], "flags": ["dated"]}, {"text": {"fa": "داروین استفاده/ناستفاده را هم در کنار انتخاب طبیعی علت دگرگونی می‌دانست (مثلاً کوچک‌شدن چشم موش کور). دیدگاه «ارث اکتسابی» نزدیک به لامارک است. این فرض اکنون در شکل کلاسیک خود رد شده است؛ وایسمان (۱۸۹۳) میان سلول‌های جنسی و بدنی فرق گذاشت و اثر مستقیم یک‌عمرِ فرد بر ژن‌ها نشان داده نشد. داروین در کتاب بعدی (۱۸۶۸) فرضیهٔ «پانژنز» را ارائه داد که ذره‌های ریز از همهٔ اندام‌ها به سلول جنسی می‌رسند؛ این فرضیه شواهدی نیافت.", "en": "Darwin also counted use and disuse alongside natural selection as a cause of change (for example, reduced eyes in burrowing animals). Such 'acquired inheritance' is close to Lamarck's view. In its classic form it is now rejected; Weismann (1893) separated germ cells from body cells, and direct passing of a lifetime's effects to genes was not shown. In a later book (1868) Darwin proposed 'pangenesis', where tiny particles travel from all organs to the sex cells; it found no support.", "nl": "Darwin also counted use and disuse alongside natural selection as a cause of change (for example, reduced eyes in burrowing animals). Such 'acquired inheritance' is close to Lamarck's view. In its classic form it is now rejected; Weismann (1893) separated germ cells from body cells, and direct passing of a lifetime's effects to genes was not shown. In a later book (1868) Darwin proposed 'pangenesis', where tiny particles travel from all organs to the sex cells; it found no support."}, "sources": ["src:84786f7bfa", "src:636e24d0d2", "src:f1896c7feb"], "flags": ["dated"]}, {"text": {"fa": "نکتهٔ امروزی: پژوهش‌های اپی‌ژنتیک نشان داده‌اند در موارد محدود برخی نشانه‌های شیمیایی روی دی‌ان‌ای می‌تواند به نسل بعد برسد، ولی این به‌هیچ‌وجه بازگشت به لامارک در انسان نیست و شواهد برای وراثت بین‌نسلی در پستانداران هنوز محدود و بحث‌برانگیز است.", "en": "Modern note: epigenetics shows that in limited cases some chemical marks on DNA can pass to the next generation, but this is not a return to Lamarck in humans, and evidence for transgenerational inheritance in mammals remains limited and debated.", "nl": "Modern note: epigenetics shows that in limited cases some chemical marks on DNA can pass to the next generation, but this is not a return to Lamarck in humans, and evidence for transgenerational inheritance in mammals remains limited and debated."}, "sources": [], "flags": ["contested", "editor-note"]}], "links": [{"to": "tabar:epigenetics", "rel": "see-also", "note": {"fa": "اپی‌ژنتیک", "en": "Epigenetics", "nl": "Epigenetics"}}, {"to": "tabar:transgenerational", "rel": "contrasts", "note": {"fa": "وراثت اپی‌ژنتیک بین‌نسلی", "en": "Transgenerational epigenetic inheritance", "nl": "Transgenerational epigenetic inheritance"}}, {"to": "tabar:epigenetic-marks", "rel": "see-also", "note": {"fa": "نشانه‌های اپی‌ژنتیک", "en": "Epigenetic marks", "nl": "Epigenetic marks"}}, {"to": "tabar:mutation-selection-drift", "rel": "see-also", "note": {"fa": "جهش، انتخاب و رانش", "en": "Mutation, selection and drift", "nl": "Mutation, selection and drift"}}], "people": ["core:gregor-mendel", "core:august-weismann", "core:jean-baptiste-lamarck", "core:fleeming-jenkin"], "sources": ["src:1de9de3693", "src:636e24d0d2", "src:84786f7bfa", "src:f1896c7feb"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:genetic-essentialism", "kind": "concept", "title": {"fa": "ذات‌گرایی ژنتیکی", "en": "Genetic essentialism", "nl": "Genetisch essentialisme"}, "aliases": [], "parent": "tabar:genetics-society", "field": "tabar:genetics-society", "summary": {"fa": "گرایش ذهن به اینکه ژن را «ذات» پنهان و تغییرناپذیر بداند: اگر چیزی ژنتیکی است، پس طبیعی، ثابت، سرنوشت و مرزبندی‌کننده است. این سوگیری شناختی مستند است و نحوهٔ خبررسانی علمی آن را تشدید یا تضعیف می‌کند.", "en": "The mind's tendency to treat genes as a hidden, unchangeable \"essence\": if something is genetic, then it is natural, fixed, fated and boundary-drawing. This cognitive bias is documented, and the way science is reported amplifies or dampens it.", "nl": "De neiging van de geest om genen te zien als een verborgen, onveranderlijke \"essentie\": als iets genetisch is, dan is het natuurlijk, vast, lotsbestemd en grensbepalend. Deze cognitieve bias is gedocumenteerd, en de manier waarop wetenschap wordt bericht versterkt of dempt haar."}, "points": [{"text": {"fa": "دار-نیمرود و هاینه (۲۰۱۱): خواندن توضیح ژنتیکی برای یک رفتار (مثلاً چاقی یا تفاوت ریاضی زن و مرد) باعث می‌شود افراد آن را تغییرناپذیرتر بدانند، کمتر خود را مسئول بدانند و کلیشه‌ها را بیشتر بپذیرند، حتی وقتی وراثت‌پذیری واقعی ناچیز است.", "en": "Dar-Nimrod and Heine (2011): reading a genetic explanation for a behaviour (e.g. obesity or sex differences in maths) makes people see it as more fixed, feel less responsible and accept stereotypes more, even when real heritability is negligible.", "nl": "Dar-Nimrod and Heine (2011): reading a genetic explanation for a behaviour (e.g. obesity or sex differences in maths) makes people see it as more fixed, feel less responsible and accept stereotypes more, even when real heritability is negligible."}, "sources": ["src:d5508c7aeb"], "flags": []}, {"text": {"fa": "پادزهر: هر بار که عدد وراثت‌پذیری می‌بینید، سه سؤال بپرسید: در کدام جمعیت؟ در کدام محیط؟ و آیا دربارهٔ تغییرپذیری چیزی می‌گوید؟ (پاسخ سومی همیشه «نه» است.)", "en": "Antidote: whenever you see a heritability figure, ask three questions: in which population? In which environment? And does it say anything about changeability? (The third answer is always \"no\".)", "nl": "Antidote: whenever you see a heritability figure, ask three questions: in which population? In which environment? And does it say anything about changeability? (The third answer is always \"no\".)"}, "sources": ["src:ba8f3ee8f4", "src:b1c0eba86d"], "flags": []}], "links": [{"to": "tabar:heritability", "rel": "critiques", "note": {"fa": "سوءبرداشت از وراثت‌پذیری", "en": "Misreading heritability", "nl": "Misreading heritability"}}, {"to": "psy:cognitive-biases", "rel": "bridges", "note": {"fa": "سوگیری‌های شناختی در ویکی روان", "en": "Cognitive biases in the psychology wiki", "nl": "Cognitive biases in the psychology wiki"}}, {"to": "psy:mindsets", "rel": "bridges", "note": {"fa": "ذهنیت رشد در برابر ثابت", "en": "Growth versus fixed mindset", "nl": "Growth versus fixed mindset"}}], "people": [], "sources": ["src:b1c0eba86d", "src:ba8f3ee8f4", "src:d5508c7aeb"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:epigenetic-marks", "kind": "concept", "title": {"fa": "نشانه‌های اپی‌ژنتیک", "en": "Epigenetic marks", "nl": "Epigenetische merktekens"}, "aliases": [], "parent": "tabar:epigenetics", "field": "tabar:epigenetics", "summary": {"fa": "متیل شدن دی‌ان‌ای و تغییر هیستون‌ها تعیین می‌کنند کدام ژن‌ها در کدام سلول خوانده شوند؛ این نشانه‌ها با تغذیه، استرس و سن تغییر می‌کنند. اپی‌ژنتیک واقعی و مهم است، اما بیشتر آنچه در رسانه‌ها «اپی‌ژنتیک» خوانده می‌شود، گمانه است.", "en": "DNA methylation and histone changes determine which genes are read in which cell; these marks change with nutrition, stress and age. Epigenetics is real and important, but much of what the media call \"epigenetics\" is speculation.", "nl": "DNA-methylering en histonveranderingen bepalen welke genen in welke cel worden afgelezen; deze merktekens veranderen met voeding, stress en leeftijd. Epigenetica is echt en belangrijk, maar veel van wat de media \"epigenetica\" noemen, is speculatie."}, "points": [{"text": {"fa": "قحطی هلند (زمستان ۱۹۴۴–۴۵): افرادی که در اوایل بارداری در معرض قحطی بودند، شش دهه بعد متیل شدن کمتری در ژن IGF2 داشتند؛ شاهدی که محیط پیش از تولد ردی ماندگار در تنظیم ژن می‌گذارد.", "en": "The Dutch Hunger Winter (1944–45): people exposed to famine in early gestation had less methylation of the IGF2 gene six decades later; evidence that the prenatal environment leaves a lasting trace in gene regulation.", "nl": "The Dutch Hunger Winter (1944–45): people exposed to famine in early gestation had less methylation of the IGF2 gene six decades later; evidence that the prenatal environment leaves a lasting trace in gene regulation."}, "sources": ["src:540fb9c6d0"], "flags": []}, {"text": {"fa": "«ساعت اپی‌ژنتیک» از الگوی متیل شدن سن زیستی را برآورد می‌کند و با سلامت و مرگ‌ومیر همبسته است؛ ابزار پژوهشی امیدبخش، هنوز نه ابزار بالینی.", "en": "The \"epigenetic clock\" estimates biological age from methylation patterns and correlates with health and mortality; a promising research tool, not yet a clinical one.", "nl": "The \"epigenetic clock\" estimates biological age from methylation patterns and correlates with health and mortality; a promising research tool, not yet a clinical one."}, "sources": ["src:07fb5aa7b9"], "flags": ["editor-note"]}], "links": [{"to": "tabar:transgenerational", "rel": "see-also", "note": {"fa": "آیا به نسل بعد می‌رسد؟", "en": "Does it reach the next generation?", "nl": "Does it reach the next generation?"}}, {"to": "psy:n-stress", "rel": "bridges", "note": {"fa": "استرس و مغز در ویکی روان", "en": "Stress and the brain in the psychology wiki", "nl": "Stress and the brain in the psychology wiki"}}], "people": ["core:bas-heijmans"], "sources": ["src:07fb5aa7b9", "src:540fb9c6d0"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:ancestry-tests", "kind": "concept", "title": {"fa": "آزمون‌های تجاری تبار", "en": "Commercial ancestry tests", "nl": "Commerciële afstammingstests"}, "aliases": [], "parent": "tabar:genealogy", "field": "tabar:genealogy", "summary": {"fa": "«۴۲ درصد ایرانی، ۱۸ درصد قفقازی…» این درصدها مقایسهٔ دی‌ان‌ای شما با پنل مرجعِ شرکت است، نه واقعیتی ثابت؛ با تغییر پنل، عدد عوض می‌شود. برای یافتن خویشاوند زنده دقیق‌اند، برای «هویت» گمراه‌کننده.", "en": "\"42 percent Iranian, 18 percent Caucasian…\" These percentages compare your DNA to the company's reference panel, not a fixed reality; change the panel and the number changes. Accurate for finding living relatives, misleading for \"identity\".", "nl": "\"42 procent Iraans, 18 procent Kaukasisch…\" Deze percentages vergelijken uw DNA met het referentiepanel van het bedrijf, geen vaststaande werkelijkheid; verander het panel en het getal verandert. Nauwkeurig om levende verwanten te vinden, misleidend voor \"identiteit\"."}, "points": [{"text": {"fa": "رویال و همکاران (۲۰۱۰، انجمن ژنتیک انسانی آمریکا): استنباط تبار به پنل مرجع، الگوریتم و تعریف «جمعیت» وابسته است؛ درصدها را نباید با هویت قومی یا سلامت یکی گرفت.", "en": "Royal et al. (2010, American Society of Human Genetics): ancestry inference depends on the reference panel, the algorithm and the definition of \"population\"; percentages must not be equated with ethnic identity or health.", "nl": "Royal et al. (2010, American Society of Human Genetics): ancestry inference depends on the reference panel, the algorithm and the definition of \"population\"; percentages must not be equated with ethnic identity or health."}, "sources": ["src:9e55a626fc"], "flags": []}, {"text": {"fa": "ارلیش و همکاران (۲۰۱۸): با پایگاه‌دادهٔ ۱٫۲۸ میلیون نفر، حدود ۶۰ درصد آمریکاییانِ اروپایی‌تبار از راه خویشاوند دور (پسرعموی درجهٔ سه) قابل شناسایی‌اند، حتی اگر خودشان آزمایش نداده باشند؛ همین روش قاتل زنجیره‌ای «گلدن استیت» را در ۲۰۱۸ لو داد.", "en": "Erlich et al. (2018): with a database of 1.28 million people, about 60 percent of European-ancestry Americans can be identified via a distant relative (third cousin) even if they never tested; the same method exposed the \"Golden State Killer\" in 2018.", "nl": "Erlich et al. (2018): with a database of 1.28 million people, about 60 percent of European-ancestry Americans can be identified via a distant relative (third cousin) even if they never tested; the same method exposed the \"Golden State Killer\" in 2018."}, "sources": ["src:b4623b437c"], "flags": []}, {"text": {"fa": "برای ایرانیان: پنل‌های مرجع شرکت‌ها از خاورمیانه نمونهٔ کمی دارند، پس برچسب‌ها («ایرانی/قفقازی/عرب») درشت و ناپایدارند.", "en": "For Iranians: companies' reference panels have few Middle Eastern samples, so the labels (\"Iranian/Caucasian/Arab\") are coarse and unstable.", "nl": "For Iranians: companies' reference panels have few Middle Eastern samples, so the labels (\"Iranian/Caucasian/Arab\") are coarse and unstable."}, "sources": ["src:3c4d0940c4"], "flags": ["editor-note"]}], "links": [{"to": "tabar:haplogroups", "rel": "part-of", "note": {"fa": "خطوط مادری و پدری در گزارش", "en": "Maternal and paternal lines in the report", "nl": "Maternal and paternal lines in the report"}}, {"to": "tabar:common-ancestors", "rel": "prerequisite", "note": {"fa": "ریاضی نیاکان", "en": "The mathematics of ancestors", "nl": "The mathematics of ancestors"}}, {"to": "tabar:race-biology", "rel": "see-also", "note": {"fa": "خوشه در برابر نژاد", "en": "Cluster versus race", "nl": "Cluster versus race"}}], "people": ["core:yaniv-erlich"], "sources": ["src:3c4d0940c4", "src:9e55a626fc", "src:b4623b437c"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:consanguinity", "kind": "concept", "title": {"fa": "ازدواج خویشاوندی", "en": "Consanguineous marriage", "nl": "Verwantschapshuwelijk"}, "aliases": [], "parent": "tabar:medical-genetics", "field": "tabar:medical-genetics", "summary": {"fa": "ازدواج با خویشاوند نزدیک در ایران و بسیاری از کشورهای خاورمیانه و جنوب آسیا رایج است. احتمال بیماری مغلوب در فرزندان دخترعمو/پسرعمو از حدود ۲ تا ۳ درصد به ۴ تا ۶ درصد می‌رسد؛ کم نیست، ولی «فاجعه» هم نیست، و با مشاورهٔ ژنتیک قابل مدیریت است.", "en": "Marriage to a close relative is common in Iran and many countries of the Middle East and South Asia. The chance of a recessive disorder in children of first cousins rises from about 2 to 3 percent to 4 to 6 percent; not trivial, not a \"catastrophe\", and manageable with genetic counselling.", "nl": "Trouwen met een naaste verwant is gangbaar in Iran en veel landen in het Midden-Oosten en Zuid-Azië. De kans op een recessieve aandoening bij kinderen van volle neven en nichten stijgt van zo'n 2 à 3 procent naar 4 à 6 procent; niet te verwaarlozen, geen \"ramp\", en beheersbaar met genetische counseling."}, "points": [{"text": {"fa": "سعادت و همکاران (۲۰۰۴): در نمونهٔ ملی بیش از ۳۰۰ هزار زوج ایرانی، ۳۸٫۶ درصد ازدواج‌ها خویشاوندی و ۲۷٫۹ درصد بین دخترعمو/پسرعمو و معادل‌ها بود؛ با تفاوت زیاد بین استان‌ها.", "en": "Saadat et al. (2004): in a national sample of over 300 thousand Iranian couples, 38.6 percent of marriages were consanguineous and 27.9 percent between first cousins or equivalents, with large provincial differences.", "nl": "Saadat et al. (2004): in a national sample of over 300 thousand Iranian couples, 38.6 percent of marriages were consanguineous and 27.9 percent between first cousins or equivalents, with large provincial differences."}, "sources": ["src:38e3f2042a"], "flags": []}, {"text": {"fa": "سازوکار: هر فرد چند واریانت مغلوب بیماری‌زا حمل می‌کند؛ خویشاوندان احتمال بیشتری دارند همان واریانت را از نیای مشترک داشته باشند. برای همین سهم بیماری‌های مغلوب نادر در جمعیت‌های با ازدواج خویشاوندی بالاست.", "en": "Mechanism: everyone carries a few recessive disease variants; relatives are likelier to share the same variant from a common ancestor. That is why rare recessive disorders are over-represented in populations with high consanguinity.", "nl": "Mechanism: everyone carries a few recessive disease variants; relatives are likelier to share the same variant from a common ancestor. That is why rare recessive disorders are over-represented in populations with high consanguinity."}, "sources": ["src:38e3f2042a", "src:3c4d0940c4"], "flags": []}, {"text": {"fa": "نگاه متوازن: ازدواج خویشاوندی کارکردهای اجتماعی و اقتصادی دارد و در ایران رو به کاهش است؛ پاسخ علمی نه تحقیر، که غربالگری ناقلان و مشاورهٔ پیش از ازدواج است.", "en": "A balanced view: consanguinity has social and economic functions and is declining in Iran; the scientific answer is not stigma but carrier screening and premarital counselling.", "nl": "A balanced view: consanguinity has social and economic functions and is declining in Iran; the scientific answer is not stigma but carrier screening and premarital counselling."}, "sources": ["src:0aa129f24c"], "flags": ["editor-note"]}], "links": [{"to": "tabar:thalassemia-screening", "rel": "applies-to", "note": {"fa": "نمونهٔ موفق غربالگری در ایران", "en": "A successful screening example in Iran", "nl": "A successful screening example in Iran"}}, {"to": "tabar:iranian-genetic-diversity", "rel": "see-also", "note": {"fa": "واریانت‌های بومی و پایگاه مرجع", "en": "Local variants and a reference database", "nl": "Local variants and a reference database"}}], "people": [], "sources": ["src:0aa129f24c", "src:38e3f2042a", "src:3c4d0940c4"], "booklets": [], "origin": null, "iran": "iran:consanguinity", "wikidata": null, "status": "draft"}, {"id": "tabar:t1-africa-deep-lineages-bottleneck", "kind": "concept", "title": {"fa": "ریشه‌های آفریقایی تبارنامهٔ انسان: شاخه‌های کهن و تنگنای خروج", "en": "African roots of the human family tree: deep lineages and the exit bottleneck", "nl": "Afrikaanse wortels van de menselijke stamboom: diepe lijnen en de flessenhals"}, "aliases": [], "parent": "tabar:population-genetics", "field": "tabar:population-genetics", "summary": {"fa": "بر پایهٔ هاپلوگروه‌ها، کهن‌ترین شاخه‌های هر دو تبار پدری و مادری در آفریقا یافت می‌شوند و جمعیت بیرون‌آمده از آفریقا از تنگنایی کوچک گذشته است.", "en": "On haplogroup evidence the oldest branches of both paternal and maternal ancestry sit in Africa, and the population that left passed through a small bottleneck.", "nl": "Volgens haplogroepen liggen de oudste takken in Afrika en passeerde de uittocht een kleine flessenhals."}, "points": [{"text": {"fa": "نویسنده می‌گوید در آفریقا بودنِ زادگاه انسان خردمند تردیدی ندارد. دو شاخهٔ کهن کروموزوم Y یعنی A و BT در آفریقا بیشترین تنوع را دارند و همهٔ مردان بیرون از آفریقا از شاخهٔ BT برآمده‌اند.", "en": "The author states that Africa as the homeland of Homo sapiens is beyond doubt. The two oldest Y branches, A and BT, show the greatest diversity in Africa, and all men outside Africa descend from BT.", "nl": "The author states that Africa as the homeland of Homo sapiens is beyond doubt. The two oldest Y branches, A and BT, show the greatest diversity in Africa, and all men outside Africa descend from BT."}, "sources": ["src:93456bf0b8"], "flags": []}, {"text": {"fa": "هاپلوگروه A00 در ۲۰۱۳ از یک مرد آفریقایی‌تبار آمریکایی کشف شد و بسامد بالایی از آن در مردان قوم بانگوا در کامرون یافت می‌شود. به گفتهٔ نویسنده، این شاخه فراتر از قدمت فسیل‌های شناخته‌شدهٔ انسان خردمند باستانی به عقب می‌رود.", "en": "Haplogroup A00 was discovered in 2013 in an African American man and occurs at high frequency in the Bangwa of Cameroon. The author says its age reaches back beyond the known fossils of early Homo sapiens.", "nl": "Haplogroup A00 was discovered in 2013 in an African American man and occurs at high frequency in the Bangwa of Cameroon. The author says its age reaches back beyond the known fossils of early Homo sapiens."}, "sources": ["src:93456bf0b8", "src:17bec11581"], "flags": []}, {"text": {"fa": "به نقل از پژوهشی در ۲۰۱۵، نیای مشترک مردانهٔ همهٔ انسان‌های امروز («آدم کروموزوم Y») حدود ۲۵۴ هزار سال پیش زیسته است.", "en": "Citing a 2015 study, the common male ancestor of all living men ('Y-chromosomal Adam') lived about 254,000 years ago.", "nl": "Citing a 2015 study, the common male ancestor of all living men ('Y-chromosomal Adam') lived about 254,000 years ago."}, "sources": ["src:93456bf0b8"], "flags": []}, {"text": {"fa": "پیش از خروج از آفریقا دست‌کم چهارده شاخهٔ متمایز میتوکندریایی در این قاره وجود داشته است؛ کوچندگان بیرون از آفریقا فقط بخش کوچکی از این تنوع را با خود بردند و نویسنده شمار بنیانگذاران را در حد حدود هزار و پانصد زن و مرد بالغ می‌داند.", "en": "Before the exit at least fourteen distinct mitochondrial lineages existed in Africa; those who left carried only a small part of this diversity, and the author puts the founder group at about 1,500 adult men and women.", "nl": "Before the exit at least fourteen distinct mitochondrial lineages existed in Africa; those who left carried only a small part of this diversity, and the author puts the founder group at about 1,500 adult men and women."}, "sources": ["src:93456bf0b8"], "flags": []}, {"text": {"fa": "رقم‌های اندازهٔ جمعیت بنیانگذار به مدل و فرضیات بستگی دارند و برآوردهای دیگری هم هست؛ زمان خروج در نوشته‌های جدیدتر هم دقیق‌تر شده و هم محل بحث است. این اعداد را تقریبی بخوانید.", "en": "Founder-size figures depend on models and assumptions and other estimates exist; exit timing has also been refined and remains debated in newer literature. Read these numbers as approximate.", "nl": "Founder-size figures depend on models and assumptions and other estimates exist; exit timing has also been refined and remains debated in newer literature. Read these numbers as approximate."}, "sources": [], "flags": ["contested", "editor-note"]}, {"text": {"fa": "نویسنده کوچ‌های برگشتی را هم یادآور می‌شود: برخی شاخه‌های اوراسیایی به آفریقا بازگشته‌اند و گسترش بانتوها از حدود پنج هزار سال پیش بر ترکیب جمعیتی جنوب و شرق قاره اثر گذاشته است. پس تصویر آفریقا «جدا از جهان» نیست.", "en": "The author also notes back-migrations: some Eurasian lineages returned to Africa, and the Bantu expansion from about 5,000 years ago reshaped southern and eastern Africa. Africa was not isolated from the rest of the world.", "nl": "The author also notes back-migrations: some Eurasian lineages returned to Africa, and the Bantu expansion from about 5,000 years ago reshaped southern and eastern Africa. Africa was not isolated from the rest of the world."}, "sources": ["src:93456bf0b8"], "flags": []}], "links": [{"to": "tabar:out-of-africa", "rel": "explains", "note": {"fa": "شواهد هاپلوگروهی خاستگاه آفریقایی", "en": "Haplogroup evidence for the African origin", "nl": "Haplogroup evidence for the African origin"}}, {"to": "tabar:human-evolution", "rel": "part-of", "note": {"fa": "تکامل انسان", "en": "Human evolution", "nl": "Human evolution"}}, {"to": "tabar:haplogroups", "rel": "see-also", "note": {"fa": "هاپلوگروه‌ها", "en": "Haplogroups", "nl": "Haplogroups"}}], "people": [], "sources": ["src:17bec11581", "src:93456bf0b8"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:heritability", "kind": "concept", "title": {"fa": "وراثت‌پذیری", "en": "Heritability", "nl": "Erfelijkheid"}, "aliases": ["heritability", "وراثت پذیری"], "parent": "tabar:behavior-genetics", "field": "tabar:behavior-genetics", "summary": {"fa": "وراثت‌پذیری نسبتی از تفاوت‌های یک صفت در یک جمعیت است که به تفاوت‌های ژنتیکی برمی‌گردد؛ دربارهٔ یک فرد، یا دربارهٔ تغییرپذیری، هیچ نمی‌گوید.", "en": "Heritability is the share of differences in a trait within a population that traces to genetic differences; it says nothing about an individual, nor about changeability.", "nl": "Erfelijkheid is het aandeel van de verschillen in een eigenschap binnen een populatie dat teruggaat op genetische verschillen; het zegt niets over een individu, noch over veranderbaarheid."}, "points": [{"text": {"fa": "فراتحلیل ۵۰ سال مطالعهٔ دوقلوها (۱۴٬۵۵۸٬۹۰۳ جفت دوقلو، ۱۷٬۸۰۴ صفت): همهٔ صفات انسانی وراثت‌پذیرند؛ میانگین ۴۹ درصد.", "en": "Meta-analysis of 50 years of twin studies (14,558,903 twin pairs, 17,804 traits): all human traits are heritable; the average is 49 percent.", "nl": "Meta-analysis of 50 years of twin studies (14,558,903 twin pairs, 17,804 traits): all human traits are heritable; the average is 49 percent."}, "sources": ["src:06c7402bec"], "flags": []}, {"text": {"fa": "وراثت‌پذیری ۵۰ درصد یعنی نیمی از تفاوت‌های بین افراد در آن جمعیت و آن محیط ژنتیکی است، نه اینکه نیمی از صفتِ یک نفر ژنتیکی است.", "en": "Heritability of 50 percent means half the differences between people in that population and environment are genetic, not that half of one person's trait is genetic.", "nl": "Heritability of 50 percent means half the differences between people in that population and environment are genetic, not that half of one person's trait is genetic."}, "sources": ["src:ba8f3ee8f4"], "flags": []}, {"text": {"fa": "مثال کلاسیک: قد بسیار وراثت‌پذیر است و با این حال میانگین قد در یک قرن ده‌ها سانتی‌متر بالا رفته؛ وراثت‌پذیری بالا با تغییر محیطی بزرگ سازگار است.", "en": "Classic example: height is highly heritable, yet average height rose by many centimetres in a century; high heritability is compatible with large environmental change.", "nl": "Classic example: height is highly heritable, yet average height rose by many centimetres in a century; high heritability is compatible with large environmental change."}, "sources": ["src:1deae47297"], "flags": []}, {"text": {"fa": "«قانون اول» ترکهایمر: همهٔ صفات رفتاری انسان وراثت‌پذیرند. قانون دوم: اثر بزرگ شدن در یک خانواده کوچک‌تر از اثر ژن‌هاست. قانون سوم: بخش بزرگی از واریانس را نه ژن توضیح می‌دهد نه خانواده.", "en": "Turkheimer's first law: all human behavioural traits are heritable. Second: the effect of being raised in the same family is smaller than the effect of genes. Third: a large share of variance is explained by neither genes nor families.", "nl": "Turkheimer's first law: all human behavioural traits are heritable. Second: the effect of being raised in the same family is smaller than the effect of genes. Third: a large share of variance is explained by neither genes nor families."}, "sources": ["src:ba8f3ee8f4"], "flags": []}], "links": [{"to": "tabar:twin-adoption", "rel": "measured-by", "note": {"fa": "با مطالعهٔ دوقلوها و فرزندخواندگی برآورد می‌شود", "en": "Estimated with twin and adoption studies", "nl": "Estimated with twin and adoption studies"}}, {"to": "tabar:gene-environment", "rel": "explains", "note": {"fa": "چرا عدد وراثت‌پذیری در محیط‌های مختلف فرق می‌کند", "en": "Why the heritability figure differs across environments", "nl": "Why the heritability figure differs across environments"}}, {"to": "tabar:genetic-essentialism", "rel": "critiques", "note": {"fa": "سوءبرداشت رایج: «ژنتیکی یعنی سرنوشت»", "en": "Common misreading: \"genetic means destiny\"", "nl": "Common misreading: \"genetic means destiny\""}}], "people": ["core:robert-plomin", "core:eric-turkheimer"], "sources": ["src:06c7402bec", "src:1deae47297", "src:ba8f3ee8f4"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:darwin-difficulties-fossil-record", "kind": "concept", "title": {"fa": "دشواری‌های نظریه و ناکامل بودن سابقهٔ فسیلی", "en": "Difficulties of the theory and the imperfect fossil record", "nl": "Moeilijkheden van de theorie en het onvolledige fossielenarchief"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "داروین پیش از منتقدان، خودش بزرگ‌ترین اعتراض‌ها را فهرست می‌کند: میانه‌شکل‌های گم‌شده، پیدایش اندام‌های کامل مثل چشم، و غریزه‌های پیچیده. پاسخ او این است که سابقهٔ زمین‌شناختی بسیار ناکامل است. بخشی از این استدلال با یافته‌های بعدی تأیید شد، اما برخی برآوردهایش دربارهٔ زمان نادرست بود.", "en": "Darwin lists the biggest objections himself: missing intermediates, the origin of perfect organs such as the eye, and complex instincts. His answer is that the geological record is very incomplete. Later finds supported part of this, but some of his time estimates were wrong.", "nl": "Darwin noemt zelf de grootste bezwaren: ontbrekende tussenvormen, de oorsprong van volmaakte organen zoals het oog, en complexe instincten. Zijn antwoord: het geologische archief is zeer onvolledig. Latere vondsten steunden dit deels."}, "points": [{"text": {"fa": "اگر گونه‌ها آرام دگرگون شده‌اند، باید بی‌شمار شکل‌های میانی ببینیم. داروین می‌گوید نیافتن آنها طبیعی است: فسیل شدن نادر است، رسوب‌ها ناپیوسته‌اند و بیشتر دورهٔ زندگی هر گونه ثبت نشده. او همچنین یادآوری می‌کند که میانه‌شکل‌ها «مستقیماً بین دو گونهٔ امروزی» نیستند، بلکه بین هر یک و نیای مشترک‌شان‌اند.", "en": "If species change gradually we should find countless intermediates. Darwin says their absence is expected: fossilisation is rare, deposition is discontinuous, and most of each species's history went unrecorded. He adds that intermediates lie not directly between two living species but between each and their common ancestor.", "nl": "If species change gradually we should find countless intermediates. Darwin says their absence is expected: fossilisation is rare, deposition is discontinuous, and most of each species's history went unrecorded. He adds that intermediates lie not directly between two living species but between each and their common ancestor."}, "sources": ["src:84786f7bfa"], "flags": []}, {"text": {"fa": "برای چشم، داروین می‌گوید اگر سلسله‌ای از چشم‌های ساده تا پیچیده در جانداران زنده دیده شود و هر مرحله کمی سودمند باشد، پیدایش چشم با انتخاب ممکن است. تأیید: نیلسون و پلگر (۱۹۹۴) با مدل ریاضی برآورد کردند چشم از یک نقطهٔ حساس به نور تا چشم عدسی‌دار در حدود چند صدهزار نسل ممکن است.", "en": "For the eye, Darwin argues that if a series from simple to complex eyes exists among living animals and each step is slightly useful, selection can build an eye. Support: Nilsson and Pelger (1994) modelled a light-sensitive patch becoming a lens eye in a geologically very short time.", "nl": "For the eye, Darwin argues that if a series from simple to complex eyes exists among living animals and each step is slightly useful, selection can build an eye. Support: Nilsson and Pelger (1994) modelled a light-sensitive patch becoming a lens eye in a geologically very short time."}, "sources": ["src:84786f7bfa", "src:c220e1653f"], "flags": []}, {"text": {"fa": "از زمان داروین فسیل‌های میانی بسیاری یافت شده است: «آرکئوپتریکس» (۱۸۶۱، پس از چاپ نخست) میان خزندگان و پرندگان، فسیل‌های نهنگ‌های پایه‌ای با پا، و «تیکتالیک» (۲۰۰۶) میان ماهی و چهارپا. بنابراین یکی از دشوارترین اعتراض‌های ۱۸۵۹ امروز بسیار ضعیف‌تر است.", "en": "Since Darwin many transitional fossils have turned up: Archaeopteryx (1861, after the first edition) between reptiles and birds, early whales with legs, and Tiktaalik (2006) between fish and tetrapods. One of the hardest objections of 1859 is therefore much weaker today.", "nl": "Since Darwin many transitional fossils have turned up: Archaeopteryx (1861, after the first edition) between reptiles and birds, early whales with legs, and Tiktaalik (2006) between fish and tetrapods. One of the hardest objections of 1859 is therefore much weaker today."}, "sources": ["src:2a0ed82834"], "flags": []}, {"text": {"fa": "آنچه نادرست یا ناقص بود: داروین در چاپ نخست برای فرسایش ناحیهٔ ویلد در انگلستان حدود ۳۰۰ میلیون سال حساب کرد (بعداً حذف شد) و با برآوردهای فیزیکدانان از عمر زمین درگیر شد؛ عمر واقعی زمین حدود ۴٫۵ میلیارد سال است. همچنین «تعادل نقطه‌ای» (الدرج و گولد، ۱۹۷۲) نشان داد بسیاری از گونه‌ها مدت طولانی بدون تغییر می‌مانند و تغییر عمدتاً در بازه‌های کوتاه رخ می‌دهد؛ این بحث هنوز دربارهٔ شدت آن ادامه دارد.", "en": "What was wrong or incomplete: in the first edition Darwin calculated about 300 million years for the erosion of the Weald in England (later dropped) and struggled with physicists' estimates of the earth's age; the real age is about 4.5 billion years. Also, 'punctuated equilibrium' (Eldredge and Gould, 1972) argued that many species stay unchanged for long periods with change concentrated in short bursts; how strong this effect is remains debated.", "nl": "What was wrong or incomplete: in the first edition Darwin calculated about 300 million years for the erosion of the Weald in England (later dropped) and struggled with physicists' estimates of the earth's age; the real age is about 4.5 billion years. Also, 'punctuated equilibrium' (Eldredge and Gould, 1972) argued that many species stay unchanged for long periods with change concentrated in short bursts; how strong this effect is remains debated."}, "sources": ["src:84786f7bfa", "src:f554732c6d"], "flags": ["dated", "contested"]}], "links": [{"to": "tabar:human-evolution", "rel": "part-of", "note": {"fa": "تکامل انسان", "en": "Human evolution", "nl": "Human evolution"}}, {"to": "tabar:ancient-dna", "rel": "see-also", "note": {"fa": "دی‌ان‌ای باستانی؛ شواهد مولکولیِ تازه", "en": "Ancient DNA: new molecular evidence", "nl": "Ancient DNA: new molecular evidence"}}, {"to": "phil:paradigms", "rel": "see-also", "note": {"fa": "پارادایم‌ها و انقلاب‌های علمی", "en": "Paradigms and scientific revolutions", "nl": "Paradigms and scientific revolutions"}}], "people": ["core:charles-lyell", "core:niles-eldredge", "core:stephen-jay-gould"], "sources": ["src:2a0ed82834", "src:84786f7bfa", "src:c220e1653f", "src:f554732c6d"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:haplogroups", "kind": "concept", "title": {"fa": "هاپلوگروه‌ها: مادرتبار و پدرتبار", "en": "Haplogroups: maternal and paternal lines", "nl": "Haplogroepen: moeder- en vaderlijn"}, "aliases": ["mtDNA", "Y-DNA", "حوای میتوکندریایی", "آدم کروموزوم Y"], "parent": "tabar:population-genetics", "field": "tabar:population-genetics", "summary": {"fa": "دی‌ان‌ای میتوکندری فقط از مادر و کروموزوم Y فقط از پدر می‌رسد؛ پس دو «خطِ» تبار را بی‌آمیزش دنبال می‌کنند. خوب برای ردگیری مهاجرت‌های کهن، ضعیف برای گفتن «شما کی هستید»: فقط دو نیا از هزاران نیای شما.", "en": "Mitochondrial DNA comes only from the mother and the Y chromosome only from the father, so they trace two unmixed \"lines\" of descent. Good for tracking ancient migrations, poor at telling \"who you are\": just two of your thousands of ancestors.", "nl": "Mitochondriaal DNA komt alleen van de moeder en het Y-chromosoom alleen van de vader, dus volgen ze twee onvermengde \"lijnen\" van afstamming. Goed om oude migraties te volgen, slecht om te zeggen \"wie u bent\": slechts twee van uw duizenden voorouders."}, "points": [{"text": {"fa": "کان، استونکینگ و ویلسون (۱۹۸۷): همهٔ دی‌ان‌ای‌های میتوکندری امروزی به یک زن در آفریقا، حدود ۲۰۰ هزار سال پیش می‌رسند («حوای میتوکندریایی»)؛ او تنها زن زمان خود نبود، فقط تنها کسی است که خطِ مادری‌اش ناگسسته مانده.", "en": "Cann, Stoneking and Wilson (1987): all present-day mitochondrial DNA traces to one woman in Africa about 200 thousand years ago (\"mitochondrial Eve\"); she was not the only woman of her time, merely the only one whose maternal line survived unbroken.", "nl": "Cann, Stoneking and Wilson (1987): all present-day mitochondrial DNA traces to one woman in Africa about 200 thousand years ago (\"mitochondrial Eve\"); she was not the only woman of her time, merely the only one whose maternal line survived unbroken."}, "sources": ["src:3dd3045232"], "flags": []}, {"text": {"fa": "کروموزوم Y همین کار را برای خط پدری می‌کند و به دلیل جهش آهسته و نبودِ نوترکیبی نشانگر خوبی برای مهاجرت‌های مردان است.", "en": "The Y chromosome does the same for the paternal line and, due to slow mutation and no recombination, is a good marker of male migrations.", "nl": "The Y chromosome does the same for the paternal line and, due to slow mutation and no recombination, is a good marker of male migrations."}, "sources": ["src:9e723d4592"], "flags": []}, {"text": {"fa": "ده نسل عقب‌تر شما تا ۱٬۰۲۴ نیا دارید؛ هاپلوگروه فقط دربارهٔ ۲ نفر از آن‌ها حرف می‌زند. «هاپلوگروه R1a دارم پس آریایی‌ام» خطای رایج است.", "en": "Ten generations back you have up to 1,024 ancestors; a haplogroup speaks about 2 of them. \"I have haplogroup R1a so I am Aryan\" is a common error.", "nl": "Ten generations back you have up to 1,024 ancestors; a haplogroup speaks about 2 of them. \"I have haplogroup R1a so I am Aryan\" is a common error."}, "sources": ["src:9e55a626fc"], "flags": ["editor-note"]}], "links": [{"to": "tabar:ancestry-tests", "rel": "part-of", "note": {"fa": "یکی از سه چیزی که آزمون‌های تبار گزارش می‌کنند", "en": "One of three things ancestry tests report", "nl": "One of three things ancestry tests report"}}, {"to": "tabar:common-ancestors", "rel": "see-also", "note": {"fa": "ریاضی نیاکان", "en": "The mathematics of ancestors", "nl": "The mathematics of ancestors"}}], "people": [], "sources": ["src:3dd3045232", "src:9e55a626fc", "src:9e723d4592"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:neanderthal-admixture", "kind": "concept", "title": {"fa": "آمیزش با نئاندرتال‌ها و دنیسوواها", "en": "Admixture with Neanderthals and Denisovans", "nl": "Vermenging met Neanderthalers en Denisovamensen"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "انسان خردمند با خویشاوندان کهن خود فرزند آورد: همهٔ مردم بیرون آفریقا حدود ۱ تا ۲ درصد دی‌ان‌ای نئاندرتال دارند و مردم اقیانوسیه تا چند درصد دی‌ان‌ای دنیسووا. «ما» و «آن‌ها» گونه‌های کاملاً جدا نبودند.", "en": "Homo sapiens had children with its archaic relatives: everyone outside Africa carries about 1 to 2 percent Neanderthal DNA, and people of Oceania up to several percent Denisovan DNA. \"Us\" and \"them\" were not fully separate species.", "nl": "Homo sapiens kreeg kinderen met zijn archaïsche verwanten: iedereen buiten Afrika draagt zo'n 1 tot 2 procent Neanderthaler-DNA, en mensen uit Oceanië tot enkele procenten Denisova-DNA. \"Wij\" en \"zij\" waren geen volledig gescheiden soorten."}, "points": [{"text": {"fa": "گرین و همکاران (۲۰۱۰): پیش‌نویس ژنوم نئاندرتال از استخوان‌های غار ویندیا (کرواسی)؛ مردم اوراسیا ۱ تا ۴ درصد (برآورد بعدی: حدود ۲ درصد) با نئاندرتال‌ها اشتراک دارند و آفریقایی‌ها تقریباً هیچ.", "en": "Green et al. (2010): draft Neanderthal genome from Vindija Cave (Croatia) bones; Eurasians share 1 to 4 percent (later estimate: about 2 percent) with Neanderthals, Africans almost none.", "nl": "Green et al. (2010): draft Neanderthal genome from Vindija Cave (Croatia) bones; Eurasians share 1 to 4 percent (later estimate: about 2 percent) with Neanderthals, Africans almost none."}, "sources": ["src:ca65b3b7c6"], "flags": []}, {"text": {"fa": "رایش و همکاران (۲۰۱۰): از یک بند انگشت در غار دنیسووا (سیبری) گروهی ناشناختهٔ انسان‌های کهن کشف شد که ۴ تا ۶ درصد ژنوم مردم ملانزی را می‌سازد.", "en": "Reich et al. (2010): from one finger bone in Denisova Cave (Siberia), an unknown archaic human group was discovered that makes up 4 to 6 percent of Melanesian genomes.", "nl": "Reich et al. (2010): from one finger bone in Denisova Cave (Siberia), an unknown archaic human group was discovered that makes up 4 to 6 percent of Melanesian genomes."}, "sources": ["src:3c51e5e6aa"], "flags": []}, {"text": {"fa": "پابو برای این کار نوبل پزشکی ۲۰۲۲ را گرفت. بعضی واریانت‌های نئاندرتالی امروز با ایمنی، پوست و حتی شدت کووید-۱۹ پیوند دارند.", "en": "Pääbo received the 2022 Nobel Prize in Medicine for this work. Some Neanderthal variants are today linked to immunity, skin and even COVID-19 severity.", "nl": "Pääbo received the 2022 Nobel Prize in Medicine for this work. Some Neanderthal variants are today linked to immunity, skin and even COVID-19 severity."}, "sources": ["src:8b730d2385"], "flags": []}], "links": [{"to": "tabar:out-of-africa", "rel": "part-of", "note": {"fa": "بخشی از داستان خروج از آفریقا", "en": "Part of the out-of-Africa story", "nl": "Part of the out-of-Africa story"}}, {"to": "tabar:ancient-dna", "rel": "evidence-for", "note": {"fa": "نخستین پیروزی بزرگ دی‌ان‌ای باستانی", "en": "The first major triumph of ancient DNA", "nl": "The first major triumph of ancient DNA"}}], "people": ["core:svante-p-bo", "core:david-reich"], "sources": ["src:3c51e5e6aa", "src:8b730d2385", "src:ca65b3b7c6"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:lomekwian-stone-technology", "kind": "concept", "title": {"fa": "فناوری لومکوی: ابزارسازی پیش از اولدوان", "en": "Lomekwian stone technology: tool-making before the Oldowan", "nl": "Lomekwiaanse steentechnologie: gereedschapsmaken vóór het Oldowan"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "گروه هارمند برای ابزارهای لومکوی ۳ نام «لومکوی» را پیشنهاد می‌کند. این ابزارها درشت‌تر و خام‌ترند و بیشتر با شیوه‌هایی ساخته شده‌اند که با روش رایج در اولدوان فرق دارد. پیشنهاد نویسندگان این است که این مجموعه مرحله‌ای جدا، پیش از اولدوان، را نشان می‌دهد.", "en": "Harmand's team proposes the name 'Lomekwian' for the LOM3 tools. They are larger and cruder than Oldowan pieces and were made mostly with techniques different from the usual Oldowan method. The authors argue the assemblage marks a separate stage before the Oldowan.", "nl": "Het team van Harmand stelt de naam 'Lomekwiaan' voor. De werktuigen zijn groter en ruwer dan Oldowan-stukken en werden met andere technieken gemaakt; volgens de auteurs vormen ze een aparte fase vóór het Oldowan."}, "points": [{"text": {"fa": "اولدوان نام مجموعه‌ای از ابزارهای سنگی است که نخست در دره اولدووای (تانزانیا) شناخته شد و کهن‌ترین نمونه‌هایش حدود ۲٫۶ میلیون سال عمر دارند. در اولدوان معمولاً سنگ را با دست و ضربهٔ آزاد می‌شکستند و تراشه‌های تیز می‌گرفتند. نویسندگان یادآوری می‌کنند که تعریف «اولدوان» از ۱۹۳۴ تا امروز یکسان نبوده است.", "en": "The Oldowan is a set of stone tools first recognised at Olduvai Gorge (Tanzania), with the oldest examples at about 2.6 Ma. Makers usually struck flakes from cores by free-hand percussion. The authors note that the definition of 'Oldowan' has varied since 1934.", "nl": "The Oldowan is a set of stone tools first recognised at Olduvai Gorge (Tanzania), with the oldest examples at about 2.6 Ma. Makers usually struck flakes from cores by free-hand percussion. The authors note that the definition of 'Oldowan' has varied since 1934."}, "sources": ["src:23b2553ce8"], "flags": []}, {"text": {"fa": "به گزارش مقاله، سازندگان لومکوی ۳ بیشتر دو شیوه به کار می‌بردند: «چکش ایستا» (هسته روی سندان و کوبیدن بر آن) و «دوقطبی» (هسته میان کوبه و سندان). بازسازی‌های آزمایشی با همان سنگ‌های محلی این را پشتیبانی می‌کند. این شیوه‌ها در اولدوان کمتر دیده شده‌اند و به حرکت کوبیدن مغزها روی سنگ نزد شمپانزه‌ها شبیه‌ترند تا به ضربهٔ آزادِ اولدوان.", "en": "Per the paper, the LOM3 knappers mostly used two methods: the 'passive hammer' (striking a core against a stationary anvil) and the 'bipolar' technique (core held between hammer and anvil). Replication experiments with local stone support this. Both are rarely documented in the Oldowan and resemble primate hammer-and-anvil nut-cracking more than Oldowan free-hand percussion.", "nl": "Per the paper, the LOM3 knappers mostly used two methods: the 'passive hammer' (striking a core against a stationary anvil) and the 'bipolar' technique (core held between hammer and anvil). Replication experiments with local stone support this. Both are rarely documented in the Oldowan and resemble primate hammer-and-anvil nut-cracking more than Oldowan free-hand percussion."}, "sources": ["src:23b2553ce8"], "flags": []}, {"text": {"fa": "نمونه‌ها بزرگ‌اند: میانگین وزن هسته‌ها حدود ۳٫۱ کیلوگرم است و سنگین‌ترین قطعه‌ها تا ۱۵ کیلوگرم می‌رسند. بسیاری از ضربه‌ها خوب نتیجه نداده و تراشه‌ها با شکستگی پله‌ای یا لولایی تمام شده‌اند، یعنی سازندگان ظاهراً هنوز شکستن سنگ را کمتر از سازندگان اولدوان می‌شناختند. با این حال تراشه‌های پیاپی و هدفمند هم گرفته‌اند.", "en": "The pieces are large: cores average about 3.1 kg and the heaviest pieces reach 15 kg. Many blows failed, leaving step and hinge terminations, which suggests the knappers understood stone fracture less well than Oldowan makers, yet they did detach series of flakes on purpose.", "nl": "The pieces are large: cores average about 3.1 kg and the heaviest pieces reach 15 kg. Many blows failed, leaving step and hinge terminations, which suggests the knappers understood stone fracture less well than Oldowan makers, yet they did detach series of flakes on purpose."}, "sources": ["src:23b2553ce8"], "flags": []}, {"text": {"fa": "یک قطعه ممکن است چند کار انجام داده باشد: سندان، هسته برای تراشه‌گیری، و ابزار کوبیدن. نویسندگان از این «تنوع کارکرد» نتیجه می‌گیرند که فناوری در آغاز یکدست و تک‌منظوره نبوده است. آن‌ها همچنین استدلال می‌کنند که الگوی شکستگی، تصادفی و طبیعی نیست و با تراشه‌های ناخواستهٔ محل‌های مغزشکنی شمپانزه‌ها فرق دارد.", "en": "A single piece may have served several tasks: anvil, core, and pounding tool. The authors take this diversity as a sign that early technology was not uniformly single-purpose. They also argue the fracture pattern is not natural breakage and differs from the accidental flakes at chimpanzee nut-cracking sites.", "nl": "A single piece may have served several tasks: anvil, core, and pounding tool. The authors take this diversity as a sign that early technology was not uniformly single-purpose. They also argue the fracture pattern is not natural breakage and differs from the accidental flakes at chimpanzee nut-cracking sites."}, "sources": ["src:23b2553ce8"], "flags": []}, {"text": {"fa": "به گفتهٔ نویسندگان، نیازی نیست «لومکوی» حتماً پیش‌اولدوان باشد؛ آن‌ها پیشنهاد می‌کنند این مجموعه شاید گام میانی میان استفادهٔ ضربه‌ای ساده از سنگ و تراشه‌گیری اولدوانی باشد. این یک تفسیر است و هنوز با نمونه‌های دیگری که مستقل تأیید شده باشند آزموده نشده، چون جایگاهی هم‌عمر در این منطقه گزارش نشده بود.", "en": "The authors suggest, as interpretation, that the Lomekwian may be an intermediate step between simple percussive use of stone and Oldowan flaking. This has not yet been tested against other independently confirmed assemblages of similar age, since none had been reported.", "nl": "The authors suggest, as interpretation, that the Lomekwian may be an intermediate step between simple percussive use of stone and Oldowan flaking. This has not yet been tested against other independently confirmed assemblages of similar age, since none had been reported."}, "sources": ["src:23b2553ce8"], "flags": ["editor-note", "contested"]}], "links": [{"to": "tabar:lomekwi-3-site", "rel": "part-of", "note": {"fa": "جایگاه لومکوی ۳", "en": "The Lomekwi 3 site", "nl": "The Lomekwi 3 site"}}, {"to": "tabar:first-toolmakers-debate", "rel": "see-also", "note": {"fa": "نخستین ابزارسازان: چه کسی و چرا", "en": "The first toolmakers: who and why", "nl": "The first toolmakers: who and why"}}, {"to": "tabar:human-evolution", "rel": "part-of", "note": {"fa": "تکامل انسان", "en": "Human evolution", "nl": "Human evolution"}}, {"to": "tabar:social-brain-evolution", "rel": "bridges", "note": {"fa": "مغز و جهش اجتماعی", "en": "Brain and social leap", "nl": "Brain and social leap"}}], "people": ["core:jason-e-lewis"], "sources": ["src:23b2553ce8"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:human-evolution", "kind": "field", "title": {"fa": "تکامل انسان", "en": "Human evolution", "nl": "Menselijke evolutie"}, "aliases": [], "parent": "tabar:tabar", "field": null, "summary": {"fa": "انسان خردمند چگونه پدید آمد، با چه خویشاوندانی آمیخت و چرا این‌قدر اجتماعی شد؟", "en": "How did Homo sapiens arise, whom did it mix with, and why did it become so social?", "nl": "Hoe ontstond Homo sapiens, met wie vermengde hij zich en waarom werd hij zo sociaal?"}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:cognitive-revolution-debate", "kind": "concept", "title": {"fa": "«انقلاب شناختی» ۷۰ هزار سال پیش: ادعای هراری و نقد آن", "en": "The 'Cognitive Revolution' of ~70,000 years ago: Harari's claim and its critique", "nl": "De 'cognitieve revolutie' van ~70.000 jaar geleden: Harari's stelling en kritiek"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "هراری می‌گوید در حدود ۷۰ هزار سال پیش جهش‌های ژنتیکی «سیم‌کشی» مغز انسان خردمند را تغییر داد و زبان و تخیل تازه‌ای پدید آمد که نابودی رقبا و گسترش جهانی را ممکن کرد. این روایتِ «انقلاب ناگهانی» در باستان‌شناسی امروز بحث‌برانگیز است و بسیاری شواهد را تدریجی‌تر می‌دانند.", "en": "Harari claims that around 70,000 years ago genetic mutations 'rewired' the Homo sapiens brain, producing a new language and imagination that allowed it to replace rivals and spread worldwide. This 'sudden revolution' narrative is contested in current archaeology, where many read the evidence as more gradual.", "nl": "Harari stelt dat rond 70.000 jaar geleden genetische mutaties de hersenen van Homo sapiens 'herbedraadden', wat nieuwe taal en verbeelding opleverde. Dit narratief van een plotselinge revolutie is omstreden; veel onderzoekers zien het bewijs als geleidelijker."}, "points": [{"text": {"fa": "بر اساس کتاب، انسان خردمند حدود ۱۵۰ هزار سال پیش از نظر کالبدی شبیه ما بود، ولی تا حدود ۷۰ هزار سال پیش دستاورد فرهنگی ویژه‌ای نداشت. در بازهٔ ۷۰ تا ۳۰ هزار سال پیش قایق، تیر و کمان، سوزن، نخستین آثار هنری (مثل مرد شیرنمای اشتادل)، نشانه‌های دین و تجارت دوربرد و گسترش به استرالیا دیده می‌شود.", "en": "According to the book, Homo sapiens looked anatomically like us by about 150,000 years ago but showed no special cultural achievement until about 70,000. The period 70,000-30,000 years ago brings boats, bow and arrow, needles, early art (such as the Lion-Man of Stadel), signs of religion and long-distance trade, and the settling of Australia.", "nl": "According to the book, Homo sapiens looked anatomically like us by about 150,000 years ago but showed no special cultural achievement until about 70,000. The period 70,000-30,000 years ago brings boats, bow and arrow, needles, early art (such as the Lion-Man of Stadel), signs of religion and long-distance trade, and the settling of Australia."}, "sources": ["src:64cc653b84"], "flags": []}, {"text": {"fa": "هراری می‌گوید رایج‌ترین نظریه این است که جهش‌های ژنتیکی اتفاقی ساختار درونی مغز را عوض کرد؛ او این را «جهش درخت دانش» می‌نامد و صریح می‌پذیرد که علت آن را نمی‌دانیم. او در این‌جا مدعی است که چنین نظریه‌ای «پذیرفته‌ترین» است، اما ادعایش دربارهٔ یک جهش مشخص شاهد ژنتیکی مستقیم ندارد.", "en": "Harari says the most common theory is that random genetic mutations changed the brain's internal wiring, which he calls the 'Tree of Knowledge mutation', and he openly admits the cause is unknown. His claim that this is the most accepted theory is not backed by direct genetic evidence for any specific mutation.", "nl": "Harari says the most common theory is that random genetic mutations changed the brain's internal wiring, which he calls the 'Tree of Knowledge mutation', and he openly admits the cause is unknown. His claim that this is the most accepted theory is not backed by direct genetic evidence for any specific mutation."}, "sources": ["src:64cc653b84"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "او ادعا می‌کند انسان‌های خردمند پیش از آن کم‌توانی شناختی داشتند و حتی یادگیری انگلیسی یا فهم تکامل برایشان ناممکن بود. شاهدش بیشتر ناکامی مهاجرت حدود ۱۰۰ هزار سال پیش به خاورمیانه است که چند تبیین دیگر (اقلیم، بیماری، رقابت) هم دارد.", "en": "He suggests earlier sapiens had limited cognitive abilities, to the point of being unable to learn English or grasp evolution. His main evidence is the failed migration into the Middle East around 100,000 years ago, which has other explanations (climate, disease, competition).", "nl": "He suggests earlier sapiens had limited cognitive abilities, to the point of being unable to learn English or grasp evolution. His main evidence is the failed migration into the Middle East around 100,000 years ago, which has other explanations (climate, disease, competition)."}, "sources": ["src:64cc653b84"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "بسیاری از باستان‌شناسان آفریقا (از جمله مک‌برتی و بروکس در مقالهٔ ۲۰۰۰) نشان داده‌اند که عناصر «رفتار مدرن» مثل رنگدانه، دانه‌های زینتی، ابزار تیغه‌ای و نقش‌های نمادین پیش از ۷۰ هزار سال و در آفریقا به‌تدریج و پراکنده ظاهر شدند؛ پس «انقلاب» ناگهانی کل تصویر نیست. همچنین شواهدی از نمادگرایی نئاندرتال‌ها (مثلاً نقاشی‌های غاری در ایبری با تاریخ‌گذاری ۲۰۱۸) تصویر نئاندرتالِ ناتوان از نماد و خیال را سست کرده است.", "en": "Many Africa-focused archaeologists (including McBrearty and Brooks in 2000) have shown that elements of 'modern behaviour', such as pigments, beads, blade tools and symbolic marks, appeared gradually and patchily in Africa well before 70,000 years ago, so a sudden 'revolution' is not the whole picture. Evidence of Neanderthal symbolism (e.g. Iberian cave art dated in 2018) has also weakened the image of Neanderthals as incapable of symbol and imagination.", "nl": "Many Africa-focused archaeologists (including McBrearty and Brooks in 2000) have shown that elements of 'modern behaviour', such as pigments, beads, blade tools and symbolic marks, appeared gradually and patchily in Africa well before 70,000 years ago, so a sudden 'revolution' is not the whole picture. Evidence of Neanderthal symbolism (e.g. Iberian cave art dated in 2018) has also weakened the image of Neanderthals as incapable of symbol and imagination."}, "sources": ["src:76f2aff731", "src:da10502659"], "flags": ["contested", "editor-note"]}], "links": [{"to": "tabar:out-of-africa", "rel": "see-also", "note": {"fa": "پراکنش انسان خردمند از آفریقا", "en": "Dispersal of Homo sapiens out of Africa", "nl": "Dispersal of Homo sapiens out of Africa"}}, {"to": "tabar:human-evolution", "rel": "part-of", "note": {"fa": "تکامل انسان", "en": "Human evolution", "nl": "Human evolution"}}, {"to": "psy:art-origins", "rel": "see-also", "note": {"fa": "ریشه‌های هنر", "en": "Origins of art", "nl": "Origins of art"}}, {"to": "soc:cohesion", "rel": "bridges", "note": {"fa": "پیوند با فرضیهٔ همکاری در گروه‌های بزرگ", "en": "Bridges to the hypothesis of cooperation in large groups", "nl": "Bridges to the hypothesis of cooperation in large groups"}}], "people": ["core:sally-mcbrearty", "core:alison-s-brooks"], "sources": ["src:64cc653b84", "src:76f2aff731", "src:da10502659"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:human-family-tree-branching", "kind": "concept", "title": {"fa": "درخت خانوادگی شاخه‌شاخهٔ انسان", "en": "The branching human family tree", "nl": "De vertakte menselijke stamboom"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "پیام ششم سند می‌گوید تبارنامهٔ انسان یک خط راست نیست، بلکه درختی شاخه‌دار و متنوع است، همانند درخت خانوادگی تقریباً همهٔ موجودات زندهٔ دیگر. در هر دوره چند گونهٔ انسان‌تبار هم‌زمان می‌زیسته‌اند.", "en": "Message 6 of the handout says the human lineage is not a straight line but a branching, diverse tree, like the family trees of virtually all other living things. Several hominin species often lived at the same time.", "nl": "Boodschap 6 stelt dat de menselijke afstamming geen rechte lijn is maar een vertakte, diverse boom, zoals bij bijna alle andere levende wezens."}, "points": [{"text": {"fa": "تصویر قدیمی «میمون به انسان» با صف راست گمراه‌کننده است. سند تأکید می‌کند درخت خانوادگی انسان شاخه‌ها و بن‌بست‌های فراوان دارد و بیشتر گونه‌های آن منقرض شده‌اند.", "en": "The old 'ape to human' march-of-progress picture is misleading. The handout stresses that the human tree has many branches and dead ends, and most of its species are extinct.", "nl": "The old 'ape to human' march-of-progress picture is misleading. The handout stresses that the human tree has many branches and dead ends, and most of its species are extinct."}, "sources": ["src:a85b75e91c"], "flags": []}, {"text": {"fa": "سند برای آموزش این ایده به ابزارهای تعاملی (درخت گونه‌ها، فسیل‌های سه‌بعدی و «جمجمهٔ اسرارآمیز») ارجاع می‌دهد تا بازدیدکنندگان خودشان ویژگی‌های فسیل‌ها را مقایسه کنند.", "en": "To teach the idea, the handout points to interactives (a species tree, 3D fossils and a 'mystery skull') so visitors compare fossil features themselves.", "nl": "To teach the idea, the handout points to interactives (a species tree, 3D fossils and a 'mystery skull') so visitors compare fossil features themselves."}, "sources": ["src:a85b75e91c"], "flags": []}, {"text": {"fa": "نمودار نمایشگاه از «۶ میلیون سال تکامل انسان» یاد می‌کند. این عدد رقم گرد آموزشی است؛ سن کهن‌ترین گونه‌های مدعی انسان‌تباری هنوز محل بحث است، و تعداد دقیق گونه‌ها و روابط میانشان میان پژوهشگران یکسان نیست.", "en": "The exhibit diagram speaks of '6 million years of human evolution'. That is a round outreach figure; the age of the earliest claimed hominins is still debated, and researchers do not agree on the exact number of species or their relationships.", "nl": "The exhibit diagram speaks of '6 million years of human evolution'. That is a round outreach figure; the age of the earliest claimed hominins is still debated, and researchers do not agree on the exact number of species or their relationships."}, "sources": [], "flags": ["contested", "editor-note"]}, {"text": {"fa": "دی‌ان‌ای باستانی نشان داده شاخه‌ها فقط جدا نمانده‌اند و گاه با هم آمیخته‌اند (مثلاً انسان خردمند با نئاندرتال‌ها). پس «درخت» در عمل بیشتر شبیه شبکه‌ای از شاخه‌هاست. این نکته در سند نیامده و از ما است.", "en": "Ancient DNA shows branches did not stay isolated but sometimes interbred (e.g. Homo sapiens with Neanderthals), so the 'tree' is in practice closer to a braided network. This is not in the handout; it is the editors' addition.", "nl": "Ancient DNA shows branches did not stay isolated but sometimes interbred (e.g. Homo sapiens with Neanderthals), so the 'tree' is in practice closer to a braided network. This is not in the handout; it is the editors' addition."}, "sources": [], "flags": ["editor-note"]}], "links": [{"to": "tabar:neanderthal-admixture", "rel": "see-also", "note": {"fa": "آمیزش با نئاندرتال‌ها و دنیسوواها", "en": "Admixture with Neanderthals and Denisovans", "nl": "Admixture with Neanderthals and Denisovans"}}, {"to": "tabar:out-of-africa", "rel": "see-also", "note": {"fa": "خاستگاه آفریقایی انسان خردمند", "en": "The African origin of Homo sapiens", "nl": "The African origin of Homo sapiens"}}, {"to": "tabar:human-evolution", "rel": "part-of", "note": {"fa": "تکامل انسان", "en": "Human evolution", "nl": "Human evolution"}}], "people": [], "sources": ["src:a85b75e91c"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:fire-control-dating-debate", "kind": "concept", "title": {"fa": "بحث دربارهٔ زمان مهار آتش و آغاز پختن", "en": "The debate over when fire was controlled and cooking began", "nl": "Het debat over wanneer vuur werd beheerst en koken begon"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "همه موافق‌اند که انسان‌ها دست‌کم چند صد هزار سال است آتش را مهار می‌کنند. اما تاریخ آغاز آن ناروشن است: شواهد مطمئنِ باستان‌شناختی تا حدود ۷۹۰ هزار سال پیش (گِشِر بنوت یعقوب در اسرائیل) می‌رسد و شواهد قدیمی‌تر مورد مناقشه است. رانگهم برای اینکه پختن را به ۱٫۸ میلیون سال پیش ببرد از زیست‌شناسی استفاده می‌کند، که بیشتر باستان‌شناسان آن را کافی نمی‌دانند.", "en": "Everyone agrees humans have controlled fire for at least several hundred thousand years. The start is unclear: secure archaeological evidence reaches back to about 790,000 years (Gesher Benot Ya'aqov, Israel), and older claims are disputed. Wrangham uses biology to push cooking to 1.8 million years ago, which most archaeologists regard as insufficient.", "nl": "Dat mensen minstens enkele honderdduizenden jaren vuur beheersen is onomstreden. Het begin is onduidelijk: betrouwbaar archeologisch bewijs gaat terug tot circa 790.000 jaar (Gesher Benot Ya'aqov); ouder bewijs is omstreden. Wrangham gebruikt biologie om koken naar 1,8 miljoen jaar terug te dateren, wat de meeste archeologen onvoldoende vinden."}, "points": [{"text": {"fa": "به گفتهٔ رانگهم، شواهد آتش در ۲۵۰ هزار سال اخیر فراوان است (لانه‌ها و اجاق‌های سنگی در غارها، حتی نئاندرتال‌ها). در ۴۰۰ هزار سال پیش اجاق در بیچز پیت (انگلستان) و آتش و گوشت در شونینگن (آلمان) دیده شده است. قدیمی‌ترین جای با اطمینان بالا، گِشِر بنوت یعقوب (۷۹۰ هزار سال پیش) با دانه‌های سوخته و سنگ چخماق گرمادیده است.", "en": "Per Wrangham, fire evidence is abundant in the last 250,000 years (hearths in caves, even among Neanderthals). Around 400,000 years ago there are fireplaces at Beeches Pit (England) and fire with meat at Schöningen (Germany). The oldest confident site is Gesher Benot Ya'aqov (about 790,000 years ago), with burnt seeds and heated flint.", "nl": "Per Wrangham, fire evidence is abundant in the last 250,000 years (hearths in caves, even among Neanderthals). Around 400,000 years ago there are fireplaces at Beeches Pit (England) and fire with meat at Schöningen (Germany). The oldest confident site is Gesher Benot Ya'aqov (about 790,000 years ago), with burnt seeds and heated flint."}, "sources": ["src:c12cd83ad0"], "flags": []}, {"text": {"fa": "سایت‌های قدیمی‌تر (۱ تا ۱٫۵ میلیون سال، مثل سوارتکرانس در آفریقای جنوبی و چسووانجا در کنیا) تکه‌هایی مثل استخوان سوخته و خاک گرمادیده دارند. رانگهم خودش می‌گوید معنایشان مناقشه‌برانگیز است و ممکن است آتش طبیعی (مثلاً صاعقه) بوده باشد.", "en": "Older sites (1–1.5 million years, such as Swartkrans in South Africa and Chesowanja in Kenya) show items like burnt bone and heated clay. Wrangham himself says their meaning is disputed, and natural fire such as lightning may explain them.", "nl": "Older sites (1–1.5 million years, such as Swartkrans in South Africa and Chesowanja in Kenya) show items like burnt bone and heated clay. Wrangham himself says their meaning is disputed, and natural fire such as lightning may explain them."}, "sources": ["src:c12cd83ad0"], "flags": []}, {"text": {"fa": "استدلال زیست‌شناختی او: اگر پختن حیاتی بود، تغییر بزرگ و سریعی در دندان و روده انتظار می‌رود، و تنها گذاری که با آن می‌خواند گذار هابیلین به هومو ارکتوس است. او می‌گوید جانوران ممکن است رژیم تازه را سریع با آناتومی خود وفق دهند و تأخیر طولانی میان مهار آتش و پختن ناباورپذیر است.", "en": "His biological argument: if cooking mattered, rapid, large changes in teeth and gut should follow, and the only transition that fits is habilines to Homo erectus. He says animals adapt anatomy quickly to a new diet and a long delay between fire control and cooking is implausible.", "nl": "His biological argument: if cooking mattered, rapid, large changes in teeth and gut should follow, and the only transition that fits is habilines to Homo erectus. He says animals adapt anatomy quickly to a new diet and a long delay between fire control and cooking is implausible."}, "sources": ["src:c12cd83ad0"], "flags": []}, {"text": {"fa": "نظر ویراستار: بیشتر باستان‌شناسان می‌گویند استفادهٔ پیوسته و روزمره از آتش (که برای سازگاری زیستی لازم است) هنوز پیش از ۴۰۰ هزار سال پیش اثبات نشده است؛ رُبروکس و ویلا (۲۰۱۱) برای اروپا همین را گفتند. در مقابل، برنا و همکاران (۲۰۱۲) در غار وندروک آفریقای جنوبی استخوان سوخته و خاکستر گیاهی حدود ۱ میلیون سال پیش گزارش کردند. نبودِ شواهد قدیمی‌تر را می‌توان به حفظ‌نشدن نسبت داد، اما این به معنای وجودشان هم نیست.", "en": "Editor's note: most archaeologists hold that habitual daily use of fire (needed for biological adaptation) is not demonstrated before about 400,000 years ago; Roebroeks and Villa (2011) argued this for Eur
