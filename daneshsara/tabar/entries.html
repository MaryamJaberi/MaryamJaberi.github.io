15 meta-analysis (4 million people, 31 countries): about 3 points per decade, slowing recently. Genes do not change in a generation; this is environment."}, "sources": ["src:ba9f6ce267", "src:81bc3ff922"], "flags": []}, {"text": {"fa": "جمع‌بندی امروزی: وراثت‌پذیری هوش در بزرگسالی حدود ۰٫۵ تا ۰٫۸ و در کودکی کمتر است؛ نمره‌های چندژنی هنوز فقط چند درصد را پیش‌بینی می‌کنند؛ و تفاوت میانگین گروه‌ها توضیح ژنتیکی اثبات‌شده ندارد.", "en": "Current summary: adult IQ heritability is about 0.5 to 0.8 and lower in childhood; polygenic scores still predict only a few percent; and mean differences between groups have no demonstrated genetic explanation.", "nl": "Current summary: adult IQ heritability is about 0.5 to 0.8 and lower in childhood; polygenic scores still predict only a few percent; and mean differences between groups have no demonstrated genetic explanation."}, "sources": ["src:5cdd7ce079", "src:65b756684e"], "flags": []}], "links": [{"to": "tabar:gene-environment", "rel": "prerequisite", "note": {"fa": "تعامل ژن و محیط", "en": "Gene–environment interplay", "nl": "Gene–environment interplay"}}, {"to": "tabar:race-biology", "rel": "see-also", "note": {"fa": "آیا نژاد مقولهٔ زیستی است؟", "en": "Is race a biological category?", "nl": "Is race a biological category?"}}, {"to": "psy:p-psychometrics", "rel": "bridges", "note": {"fa": "روان‌سنجی هوش در ویکی روان", "en": "Psychometrics of intelligence in the psychology wiki", "nl": "Psychometrics of intelligence in the psychology wiki"}}], "people": ["core:arthur-jensen", "core:james-flynn", "core:eric-turkheimer"], "sources": ["src:5cdd7ce079", "src:65b756684e", "src:81bc3ff922", "src:ba8f3ee8f4", "src:ba9f6ce267", "src:c25a1254f7"], "booklets": [], "origin": "course:arthur-jensen", "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:t1-europe-three-ancestry-layers", "kind": "concept", "title": {"fa": "سه لایهٔ تبار اروپاییان: شکارچیان، کشاورزان و دامداران استپ", "en": "Three ancestry layers of Europeans: hunter-gatherers, farmers and steppe herders", "nl": "Drie afstammingslagen van Europeanen: jagers-verzamelaars, boeren en steppeherders"}, "aliases": [], "parent": "tabar:population-genetics", "field": "tabar:population-genetics", "summary": {"fa": "بر پایهٔ DNA باستانی که کتاب از آن بهره می‌برد، اروپاییان امروز آمیزه‌ای از سه موج جمعیتی‌اند که هر کدام ژنتیک و فرهنگ تازه‌ای آوردند.", "en": "Drawing on ancient DNA, the book presents today's Europeans as a blend of three population waves, each bringing new genetics and culture.", "nl": "Op basis van oud DNA zijn Europeanen een mengsel van drie golven."}, "points": [{"text": {"fa": "نخستین انسان‌های خردمند اروپا (کرومانیون‌ها و فرهنگ اورینیاکی، حدود ۴۵ هزار سال پیش به گفتهٔ نویسنده) شکارچی‌گردآورنده بودند؛ بیشتر شاخه‌های پدری آن‌ها در اروپا کم‌رنگ یا نابود شد اما برخی تبارهای مادری مانند U5 مدت‌ها ماندگار بودند.", "en": "Europe's first modern humans (Cro-Magnons and the Aurignacian culture, about 45,000 years ago by the author's dating) were hunter-gatherers; most of their paternal lines faded or vanished in Europe, but some maternal lines such as U5 persisted for a long time.", "nl": "Europe's first modern humans (Cro-Magnons and the Aurignacian culture, about 45,000 years ago by the author's dating) were hunter-gatherers; most of their paternal lines faded or vanished in Europe, but some maternal lines such as U5 persisted for a long time."}, "sources": ["src:93456bf0b8"], "flags": []}, {"text": {"fa": "«مرد چدار» از سامرست انگلستان (حدود ۹ هزار سال پیش) هاپلوگروه U5a داشت و بنا بر پژوهشی که کتاب نقل می‌کند پوست تیره و موی فرفری سیاه داشته؛ حدود ده درصد از ویژگی‌های ژنتیکی بریتانیایی‌های امروز به این گروه برمی‌گردد.", "en": "'Cheddar Man' from Somerset (about 9,000 years ago) carried haplogroup U5a and, according to the study the book cites, had dark skin and dark curly hair; roughly ten percent of present British genetic makeup traces to this group.", "nl": "'Cheddar Man' from Somerset (about 9,000 years ago) carried haplogroup U5a and, according to the study the book cites, had dark skin and dark curly hair; roughly ten percent of present British genetic makeup traces to this group."}, "sources": ["src:93456bf0b8"], "flags": []}, {"text": {"fa": "حدود ۹ هزار سال پیش موج کشاورزان از آسیای غربی آغاز شد و شیوهٔ یکجانشینی و دامداری را به اروپا آورد. نزدیک‌ترین ژنوم امروزی به این کشاورزان نخستین ساکنان ساردینیا هستند و این کشاورزان هنوز ژن‌های گوارش شیر را نداشتند.", "en": "Around 9,000 years ago a wave of farmers from western Asia began and brought settled farming and herding to Europe. The closest modern genome to these first farmers is found in Sardinia, and they still lacked the genes for digesting milk as adults.", "nl": "Around 9,000 years ago a wave of farmers from western Asia began and brought settled farming and herding to Europe. The closest modern genome to these first farmers is found in Sardinia, and they still lacked the genes for digesting milk as adults."}, "sources": ["src:93456bf0b8"], "flags": []}, {"text": {"fa": "دور سوم حدود ۲۵۰۰ پیش از میلاد از استپ‌های میان دریای سیاه و خزر برخاست (فرهنگ یمنا و سپس ریسمانی‌خمره‌ای). نویسنده آن را با گسترش هندواروپایی‌زبانان و هاپلوگروه‌های R1a و R1b پیوند می‌دهد؛ این پیوند با DNA باستانی همخوان است.", "en": "The third wave rose around 2500 BCE from the steppes between the Black and Caspian Seas (Yamnaya, then Corded Ware). The author links it with the spread of Indo-European speakers and haplogroups R1a and R1b; this link agrees with ancient DNA.", "nl": "The third wave rose around 2500 BCE from the steppes between the Black and Caspian Seas (Yamnaya, then Corded Ware). The author links it with the spread of Indo-European speakers and haplogroups R1a and R1b; this link agrees with ancient DNA."}, "sources": ["src:93456bf0b8", "src:553bedc591"], "flags": []}, {"text": {"fa": "نویسنده شاخه‌های R1b و R1a را به‌طور مستقیم با سلت‌ها، ایتالیایی‌ها، ژرمن‌ها و اسلاوها برابر می‌گیرد؛ این برابری هاپلوگروه با زبان یا قوم بیش از حد ساده است و داده‌های جدید روابط پیچیده‌تر و آمیختگی‌های بیشتری را نشان می‌دهند.", "en": "The author equates specific R1b and R1a branches directly with Celts, Italics, Germanic and Slavic peoples; equating a haplogroup with a language or people is too simple, and newer data show more complex relationships and more mixing.", "nl": "The author equates specific R1b and R1a branches directly with Celts, Italics, Germanic and Slavic peoples; equating a haplogroup with a language or people is too simple, and newer data show more complex relationships and more mixing."}, "sources": [], "flags": ["contested", "editor-note"]}], "links": [{"to": "tabar:ancient-dna", "rel": "explains", "note": {"fa": "داده‌های باستانی پشتوانهٔ این الگوی سه‌لایه‌اند", "en": "Ancient DNA underpins this three-layer pattern", "nl": "Ancient DNA underpins this three-layer pattern"}}, {"to": "tabar:steppe-indo-iranian", "rel": "see-also", "note": {"fa": "تبار استپی", "en": "Steppe ancestry", "nl": "Steppe ancestry"}}, {"to": "tabar:lactase-gene-culture", "rel": "see-also", "note": {"fa": "گوارش شیر و هم‌تکاملی", "en": "Milk digestion and coevolution", "nl": "Milk digestion and coevolution"}}, {"to": "tabar:zagros-neolithic", "rel": "contrasts", "note": {"fa": "کشاورزان نخستین اروپا اصلاً آناتولی‌تبارند", "en": "Europe's first farmers were mainly Anatolian-descended", "nl": "Europe's first farmers were mainly Anatolian-descended"}}, {"to": "tabar:europe-three-streams-yamnaya", "rel": "see-also", "note": {"fa": "مدخل هم‌موضوع", "en": "Related entry", "nl": "Verwant lemma"}}], "people": [], "sources": ["src:553bedc591", "src:93456bf0b8"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:sex-bias-inequality-genome", "kind": "concept", "title": {"fa": "جنسیت و قدرت در ژنوم: چرا Y و X تاریخ نابرابری را می‌گویند", "en": "Sex and power in the genome: how Y and X record the history of inequality", "nl": "Sekse en macht in het genoom: hoe Y en X de geschiedenis van ongelijkheid vastleggen"}, "aliases": [], "parent": "tabar:population-genetics", "field": "tabar:population-genetics", "summary": {"fa": "چون مردان قدرتمند می‌توانند فرزندان بسیار بیشتری از زنان داشته باشند، مقایسهٔ کروموزوم Y، دی‌ان‌ای میتوکندری و کروموزوم X با بقیهٔ ژنوم می‌تواند نابرابری جنسیتی و طبقاتی گذشته را آشکار کند. رایش نمونه‌هایی از برده‌داری در آمریکا تا گسترش یامنایا می‌آورد. ولی این روش گرایش‌هایی را نشان می‌دهد نه نیات یا خشونت افراد، و بسیاری از تفسیرهای تاریخی (مثل ژنگیزخان) حدسی‌اند.", "en": "Because powerful men can have many more children than women, comparing the Y chromosome, mitochondrial DNA and X chromosome with the rest of the genome can reveal past gender and class inequality. Reich gives examples from slavery in the Americas to the Yamnaya expansion. But the method shows tendencies, not individual intent or violence, and several historical interpretations (such as Genghis Khan) are speculative.", "nl": "Omdat machtige mannen veel meer kinderen kunnen krijgen dan vrouwen, kan vergelijking van Y-chromosoom, mtDNA en X-chromosoom met de rest van het genoom ongelijkheid in het verleden zichtbaar maken. De methode toont tendensen, geen individuele intenties of geweld, en veel historische duidingen zijn speculatief."}, "points": [{"text": {"fa": "اصل کار: زنان دو نسخه از X و هر مرد یک نسخه دارد؛ پس X بیشتر تاریخ زنان را نشان می‌دهد و Y فقط مردان را. اگر نسبت تبار گروهی روی X با بقیهٔ ژنوم فرق کند، آمیزش جنسیت‌دار بوده است. در آفریقایی‌تبارهای آمریکا میانگین تبار اروپایی در بیشتر ژنوم ۲۷ و روی X ۲۳ درصد است؛ بر آن اساس تبار اروپایی از سمت مردان حدود چهار برابر زنان بود.", "en": "Principle: women carry two X chromosomes and men one, so X reflects more of female history, while Y reflects men only. If a group's ancestry proportion on the X differs from the rest of the genome, mixing was sex-biased. In African Americans average European ancestry is 27 percent in most of the genome but 23 percent on the X; on this basis European male contribution was about four times the female one.", "nl": "Principle: women carry two X chromosomes and men one, so X reflects more of female history, while Y reflects men only. If a group's ancestry proportion on the X differs from the rest of the genome, mixing was sex-biased. In African Americans average European ancestry is 27 percent in most of the genome but 23 percent on the X; on this basis European male contribution was about four times the female one."}, "sources": ["src:a4f00f41ff", "src:3809330727"], "flags": []}, {"text": {"fa": "«خوشهٔ ستاره‌ای» Y: حدود ۸ درصد مردان قلمرو سابق مغولان نوع Y مشابهی دارند که به ۱۳۰۰ تا ۷۰۰ سال پیش برمی‌گردد. این را به ژنگیزخان و خانواده‌اش نسبت داده‌اند. توجه: انتساب به یک فرد معین حدسی است؛ دقیق‌تر این است که یک تبار مردانه با نفوذ ناگهانی رشد کرد.", "en": "Y 'star clusters': about 8 percent of men in the former Mongol territory carry a similar Y type dating to 1,300–700 years ago, which has been attributed to Genghis Khan and his family. Note: attribution to a particular person is speculative; more precisely, one male lineage expanded abruptly with social power.", "nl": "Y 'star clusters': about 8 percent of men in the former Mongol territory carry a similar Y type dating to 1,300–700 years ago, which has been attributed to Genghis Khan and his family. Note: attribution to a particular person is speculative; more precisely, one male lineage expanded abruptly with social power."}, "sources": ["src:a4f00f41ff", "src:14b8d34102"], "flags": ["editor-note"]}, {"text": {"fa": "تنگنای Y در عصر مفرغ: در بسیاری از مناطق جهان حدود ۵ هزار سال پیش تنوع کروموزوم Y ناگهان کاهش یافت، در حالی که کل ژنوم رشد جمعیت را نشان می‌دهد. رایش می‌گوید این با پیدایش جوامع طبقاتی هم‌زمان است: چند مرد با ثروت و قدرت و بازماندگان پسر خود Y را غالب کردند. توضیح دیگر (مثلاً شبکه‌های پدرتباری و انتقال فرهنگی) هم پیشنهاد شده و بحث باز است.", "en": "Bronze Age Y bottleneck: in many regions Y-chromosome diversity fell abruptly around 5,000 years ago while the whole genome shows population growth. Reich links this to the rise of stratified societies: a few men with wealth and power and sons who inherited their position made their Y types dominant. Other explanations (e.g. patrilineal networks and cultural transmission) have been proposed and the debate is open.", "nl": "Bronze Age Y bottleneck: in many regions Y-chromosome diversity fell abruptly around 5,000 years ago while the whole genome shows population growth. Reich links this to the rise of stratified societies: a few men with wealth and power and sons who inherited their position made their Y types dominant. Other explanations (e.g. patrilineal networks and cultural transmission) have been proposed and the debate is open."}, "sources": ["src:a4f00f41ff", "src:c66dbb344a"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "گسترش یامنایا: در ایبری تقریباً ۹۰ درصد مردان دارای تبار استپی Y استپی داشتند در حالی که تبار استپی کل جمعیت کمتر بود. پژوهش‌های روی کروموزوم X در کوچ نوسنگی-عصر مفرغ هم نشان داد در مهاجرت استپی نسبت مردان به زنان بسیار بالا بوده است (گلدبرگ و همکاران ۲۰۱۷). ولی «مردانه بودن» الزاماً به معنای جنگ و ربایش نیست؛ ازدواج، پیمان یا پایگاه اجتماعی بالا هم ممکن است. رایش گسترش را «کاملاً مسالمت‌آمیز» نمی‌داند؛ این تفسیر خود اوست.", "en": "Yamnaya expansion: in Iberia about 90 percent of males with steppe ancestry carried steppe-type Y chromosomes, while steppe ancestry in the population overall was lower. Work on the X chromosome likewise showed a strongly male-biased steppe migration (Goldberg et al. 2017). But male bias does not necessarily mean war and abduction; marriage, alliances or high status could also produce it. Reich does not regard the expansion as entirely peaceful; that is his own interpretation.", "nl": "Yamnaya expansion: in Iberia about 90 percent of males with steppe ancestry carried steppe-type Y chromosomes, while steppe ancestry in the population overall was lower. Work on the X chromosome likewise showed a strongly male-biased steppe migration (Goldberg et al. 2017). But male bias does not necessarily mean war and abduction; marriage, alliances or high status could also produce it. Reich does not regard the expansion as entirely peaceful; that is his own interpretation."}, "sources": ["src:a4f00f41ff", "src:69044afa96", "src:f0cf216e27"], "flags": ["contested", "editor-note"]}], "links": [{"to": "tabar:haplogroups", "rel": "explains", "note": {"fa": "کروموزوم Y و هاپلوگروه‌ها", "en": "Y chromosome and haplogroups", "nl": "Y chromosome and haplogroups"}}, {"to": "tabar:europe-three-streams-yamnaya", "rel": "see-also", "note": {"fa": "گسترش یامنایا در اروپا", "en": "Yamnaya expansion in Europe", "nl": "Yamnaya expansion in Europe"}}, {"to": "tabar:genetic-essentialism", "rel": "contrasts", "note": {"fa": "خطر ذات‌گرایی ژنتیکی در تفسیر تاریخ", "en": "Risk of genetic essentialism in reading history", "nl": "Risk of genetic essentialism in reading history"}}, {"to": "tabar:common-ancestors", "rel": "see-also", "note": {"fa": "چرا همه خویشاوندیم", "en": "Why we are all related", "nl": "Why we are all related"}}], "people": ["core:katarzyna-bryc", "core:chris-tyler-smith", "core:orlando-patterson"], "sources": ["src:14b8d34102", "src:3809330727", "src:69044afa96", "src:a4f00f41ff", "src:c66dbb344a", "src:f0cf216e27"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:brain-body-size-climate", "kind": "concept", "title": {"fa": "اقلیم و اندازهٔ مغز و بدن در جنس انسان (هوموها)", "en": "Climate and brain and body size in the genus Homo", "nl": "Klimaat en brein- en lichaamsgrootte in het geslacht Homo"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "مانوئل ویل و همکارانش ۲۰۸ فسیل انسان‌سان از یک میلیون سال گذشته را با مدل اقلیمی سنجیدند. دما اندازهٔ بدن را در همهٔ گونه‌ها خوب پیش‌بینی کرد (قاعدهٔ برگمان)، اما اقلیم فقط بخشی از الگوی اندازهٔ مغز را توضیح داد.", "en": "Manuel Will and colleagues combined 208 Homo fossils from the last million years with a climate model. Temperature predicted body size well across taxa (Bergmann's rule), but climate explained only part of the pattern in brain size.", "nl": "Will en collega's combineerden 208 Homo-fossielen van het laatste miljoen jaar met een klimaatmodel: temperatuur voorspelde lichaamsgrootte goed (regel van Bergmann), maar verklaarde slechts deels de hersengrootte."}, "points": [{"text": {"fa": "پژوهش برای نخستین بار یک مجموعهٔ بزرگ فسیل (۲۰۸ نمونه) با مختصات جغرافیایی را به یک شبیه‌ساز مدل اقلیمی جهانی گره می‌زند تا برای هر فسیل مقدارهای محیطی همان زمان و مکان به دست آید، و فرضیه‌ها را با آمار رسمی می‌آزماید.", "en": "For the first time, a large fossil dataset (n=208) with spatial coordinates is linked to a global climate-model emulator so each fossil gets the environment of its own time and place, and hypotheses are tested in a formal statistical framework.", "nl": "For the first time, a large fossil dataset (n=208) with spatial coordinates is linked to a global climate-model emulator so each fossil gets the environment of its own time and place, and hypotheses are tested in a formal statistical framework."}, "sources": ["src:9d23cb01bc"], "flags": []}, {"text": {"fa": "دما اندازهٔ بدن را در همهٔ گونه‌های بررسی‌شدهٔ هومو مطابق قاعدهٔ برگمان پیش‌بینی می‌کند (گرم‌تر، بدن کوچک‌تر)؛ نویسندگان آن را احتمالاً اثر مستقیم اقلیم بر فیزیولوژی می‌دانند.", "en": "Temperature predicted body size in all studied Homo taxa following Bergmann's rule (warmer, smaller bodies), which the authors consider likely a direct effect of climate on physiology.", "nl": "Temperature predicted body size in all studied Homo taxa following Bergmann's rule (warmer, smaller bodies), which the authors consider likely a direct effect of climate on physiology."}, "sources": ["src:9d23cb01bc"], "flags": []}, {"text": {"fa": "تولید اولیهٔ خالص (فراوانی گیاه) و تغییرپذیری درازمدت بارش اندازهٔ مغز را در انسان‌های باستانی خوب پیش‌بینی می‌کرد، اما در انسان امروزی نه. نویسندگان این اثر را غیرمستقیم می‌دانند، مثلاً از راه توان شناختی و احتمال انقراض.", "en": "Net primary productivity and long-term variability of precipitation predicted brain size in archaic humans but not in modern humans. The authors think these effects were indirect, acting for example through cognitive ability and extinction risk.", "nl": "Net primary productivity and long-term variability of precipitation predicted brain size in archaic humans but not in modern humans. The authors think these effects were indirect, acting for example through cognitive ability and extinction risk."}, "sources": ["src:9d23cb01bc"], "flags": []}, {"text": {"fa": "خود نویسندگان تأکید می‌کنند که اقلیم بخشی از الگوی زمانی را توضیح می‌دهد و علت‌های دیگر (جمعیت‌شناختی، اجتماعی، تغذیه‌ای، فناورانه) هم کنار هم عمل کرده‌اند. «اقلیم، مغز را بزرگ کرد» نتیجهٔ این پژوهش نیست. خوانندگان باید بدانند که این فقط چکیده‌ای کوتاه است و مدل، پیش‌فرض‌ها و عدم‌قطعیت‌ها در مقالهٔ کامل بررسی می‌شود.", "en": "The authors stress that climate explains only part of the temporal pattern and that demographic, social, dietary and technological causes also interacted. 'Climate made brains bigger' is not this study's conclusion. This is only a short abstract; the model, assumptions and uncertainties belong to the full paper.", "nl": "The authors stress that climate explains only part of the temporal pattern and that demographic, social, dietary and technological causes also interacted. 'Climate made brains bigger' is not this study's conclusion. This is only a short abstract; the model, assumptions and uncertainties belong to the full paper."}, "sources": ["src:9d23cb01bc"], "flags": ["contested", "editor-note"]}], "links": [{"to": "tabar:out-of-africa", "rel": "see-also", "note": {"fa": "خاستگاه آفریقایی انسان خردمند", "en": "The African origin of Homo sapiens", "nl": "The African origin of Homo sapiens"}}, {"to": "tabar:social-brain-evolution", "rel": "contrasts", "note": {"fa": "تبیین اجتماعی تکامل مغز", "en": "The social explanation of brain evolution", "nl": "The social explanation of brain evolution"}}, {"to": "tabar:neanderthal-admixture", "rel": "see-also", "note": {"fa": "نئاندرتال‌ها و دنیسوواها", "en": "Neanderthals and Denisovans", "nl": "Neanderthals and Denisovans"}}], "people": ["core:manuel-will", "core:mario-krapp", "core:jay-t-stock", "core:andrea-manica"], "sources": ["src:9d23cb01bc"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:caste-endogamy-founder-effect", "kind": "concept", "title": {"fa": "درون‌همسری، کاست و «اثر بنیان‌گذار» در هند", "en": "Endogamy, caste and the 'founder effect' in India", "nl": "Endogamie, kaste en het 'founder-effect' in India"}, "aliases": [], "parent": "tabar:medical-genetics", "field": "tabar:medical-genetics", "summary": {"fa": "رایش نشان می‌دهد بسیاری از گروه‌های هندی (جاتی) از جمعیت‌های کوچک بنیان‌گذار پدید آمده و هزاران سال از هم جدا مانده‌اند. در نتیجه تفاوت ژنتیکی گروه‌های همسایه گاه چند برابر تفاوت شمال و جنوب اروپاست و بیماری‌های ارثی نادر در هر گروه شایع می‌شود. این تصویر پزشکی کاربردی دارد، اما پرسش «درون‌همسری در هند چقدر قدیمی است؟» میان مورخان محل بحث است.", "en": "Reich shows that many Indian groups (jati) arose from small founder populations and have stayed apart for thousands of years. As a result, genetic differences between neighbouring groups can be several times larger than between northern and southern Europeans, and rare inherited diseases become frequent in particular groups. The picture has practical medical uses, but how old strict endogamy in India is remains debated among historians.", "nl": "Reich toont dat veel Indiase groepen (jati) uit kleine stichterpopulaties zijn ontstaan en duizenden jaren gescheiden bleven. Daardoor kunnen genetische verschillen tussen buurgroepen groter zijn dan tussen Noord- en Zuid-Europeanen en worden zeldzame erfelijke ziekten in bepaalde groepen frequent. Hoe oud strikte endogamie is, blijft omstreden onder historici."}, "points": [{"text": {"fa": "اندازه‌گیری: تفاوت ژنتیکی جاتی‌های همسایه دست‌کم سه برابر تفاوت گروه‌های اروپایی در همان فاصلهٔ جغرافیایی است. رایش از طول قطعه‌های دی‌ان‌ای یکسان میان دو فرد درون یک گروه می‌فهمد که حدود یک‌سوم گروه‌های هندی تنگنای جمعیتی شدیدتر یا برابر با فنلاندی‌ها و یهودیان اشکنازی داشته‌اند.", "en": "Measurement: genetic differences between neighbouring jati are at least three times those between European groups at similar geographic distances. From the length of identical DNA stretches shared by two people in one group, Reich infers that about a third of Indian groups went through population bottlenecks as strong as or stronger than those of Finns and Ashkenazi Jews.", "nl": "Measurement: genetic differences between neighbouring jati are at least three times those between European groups at similar geographic distances. From the length of identical DNA stretches shared by two people in one group, Reich infers that about a third of Indian groups went through population bottlenecks as strong as or stronger than those of Finns and Ashkenazi Jews."}, "sources": ["src:a4f00f41ff", "src:bd34217cdc"], "flags": []}, {"text": {"fa": "نمونه: گروه وَیسیا در آندرا پرادش، با حدود پنج میلیون نفر، تنگنایی دارد که او میان ۳ تا ۲ هزار سال پیش تاریخ می‌گذارد. یعنی گروه با وجود زندگی کنار دیگر گروه‌ها هزاران سال همسرگیری بیرونی نداشته است. اگر فقط یک درصد از افراد هر نسل از بیرون می‌آمدند، نشانهٔ تنگنا از میان می‌رفت.", "en": "Example: the Vysya of Andhra Pradesh, about five million people, show a bottleneck he dates to between 3,000 and 2,000 years ago. This means that despite living alongside other groups, they took essentially no outside spouses for thousands of years; even 1 percent mixing per generation would have erased the signal.", "nl": "Example: the Vysya of Andhra Pradesh, about five million people, show a bottleneck he dates to between 3,000 and 2,000 years ago. This means that despite living alongside other groups, they took essentially no outside spouses for thousands of years; even 1 percent mixing per generation would have erased the signal."}, "sources": ["src:a4f00f41ff"], "flags": []}, {"text": {"fa": "پیامد پزشکی: در گروهی با اثر بنیان‌گذار، جهش‌های مغلوب نادر شایع می‌شوند و بیماری‌های ارثی تظاهر می‌کنند. رایش مثال واکنش خطرناک به یک داروی بی‌حسی در بخشی از وَیسیاها را می‌آورد (کمبود آنزیم بوتیریل‌کولین‌استراز). او پیشنهاد می‌کند با نمونه‌گیری کوچک از گروه‌های درون‌همسر ژن‌های بیماری‌های نادر پیدا شود.", "en": "Medical consequence: in groups with founder effects, rare recessive mutations become common and inherited diseases show up. Reich cites a dangerous reaction to a muscle relaxant used in surgery among some Vysya (butyrylcholinesterase deficiency). He proposes that small samples from endogamous groups could be used to find genes for rare diseases.", "nl": "Medical consequence: in groups with founder effects, rare recessive mutations become common and inherited diseases show up. Reich cites a dangerous reaction to a muscle relaxant used in surgery among some Vysya (butyrylcholinesterase deficiency). He proposes that small samples from endogamous groups could be used to find genes for rare diseases."}, "sources": ["src:a4f00f41ff"], "flags": []}, {"text": {"fa": "نظر مخالف دربارهٔ قدمت: نیکلاس دیرکس و برخی مورخان استدلال کرده‌اند که کاست سخت‌شدهٔ امروزی تا حد زیادی ساختهٔ دورهٔ استعمار بریتانیا است. رایش می‌گوید داده‌های ژنتیکی با این ادعا نمی‌خوانند، چون تنگناها دست‌کم ۳ تا ۲ هزار سال قدمت دارند. اما ژنتیک تنها می‌گوید ازدواج بیرونی نادر بود، نه اینکه نظام ورنه-جاتی و تبعیض اجتماعی به همان شکل امروز وجود داشته است؛ مورخان به تمایز میان این دو تأکید می‌کنند.", "en": "Opposing view on age: Nicholas Dirks and some historians argued that today's rigid caste system is largely a product of British colonial rule. Reich says the genetic data, with bottlenecks 3,000–2,000 years old, do not fit this claim. But genetics only shows that outside marriage was rare, not that the varna-jati system and its social discrimination existed in today's form; historians stress this distinction.", "nl": "Opposing view on age: Nicholas Dirks and some historians argued that today's rigid caste system is largely a product of British colonial rule. Reich says the genetic data, with bottlenecks 3,000–2,000 years old, do not fit this claim. But genetics only shows that outside marriage was rare, not that the varna-jati system and its social discrimination existed in today's form; historians stress this distinction."}, "sources": ["src:a4f00f41ff", "src:8ec5a0cf13", "src:bd34217cdc"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "همتای ایرانی: رایش به برنامهٔ غربالگری ناقلان در جامعهٔ یهودیان ارتدکس هم اشاره می‌کند که با آزمایش ناقل و معرفی‌نکردن دو ناقل به هم، بیماری‌هایی مثل تی‌سَکس را بسیار کم کرده است. او خودش از محدودیت‌های ازدواج «ناراحت» است. در ایران نیز غربالگری پیش از ازدواج برای تالاسمی اجرا می‌شود؛ ملاحظات اخلاقی (اختیار زوج، برچسب‌زنی) باید همیشه در نظر باشد.", "en": "Parallel: Reich also mentions carrier-screening in the Orthodox Jewish community, where testing and not introducing two carriers to each other has made diseases such as Tay-Sachs very rare. He himself is uncomfortable with restrictions on marriage. Iran runs premarital thalassaemia screening; ethical considerations (couples' autonomy, stigma) should always be kept in view.", "nl": "Parallel: Reich also mentions carrier-screening in the Orthodox Jewish community, where testing and not introducing two carriers to each other has made diseases such as Tay-Sachs very rare. He himself is uncomfortable with restrictions on marriage. Iran runs premarital thalassaemia screening; ethical considerations (couples' autonomy, stigma) should always be kept in view."}, "sources": ["src:a4f00f41ff"], "flags": ["contested", "editor-note"]}], "links": [{"to": "tabar:consanguinity", "rel": "bridges", "note": {"fa": "ازدواج خویشاوندی و بیماری‌های مغلوب", "en": "Consanguinity and recessive disease", "nl": "Consanguinity and recessive disease"}}, {"to": "tabar:thalassemia-screening", "rel": "see-also", "note": {"fa": "غربالگری تالاسمی در ایران", "en": "Thalassaemia screening in Iran", "nl": "Thalassaemia screening in Iran"}}, {"to": "tabar:india-two-migrations-ani-asi", "rel": "see-also", "note": {"fa": "تاریخ جمعیتی هند", "en": "India's population history", "nl": "India's population history"}}, {"to": "tabar:medical-genetics", "rel": "part-of", "note": {"fa": "ژنتیک پزشکی و جامعه", "en": "Medical genetics and society", "nl": "Medical genetics and society"}}], "people": ["core:nicholas-dirks", "core:kumarasamy-thangaraj"], "sources": ["src:8ec5a0cf13", "src:a4f00f41ff", "src:bd34217cdc"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:what-does-it-mean-to-be-human-science", "kind": "concept", "title": {"fa": "«انسان بودن» در علم و در زبان روزمره", "en": "'Being human' in science and in everyday language", "nl": "'Mens zijn' in de wetenschap en in het dagelijks taalgebruik"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "پیام هشتم سند می‌گوید علم تکامل دگرگونی بسیاری از ویژگی‌های تعریف‌کنندهٔ گونهٔ انسان خردمند را بررسی می‌کند، اما واژهٔ «انسان» در گفتار عمومی بسیار گسترده‌تر از آنچه علم بدان می‌پردازد به کار می‌رود. پرسش «انسان بودن یعنی چه؟» هم علمی است و هم فلسفی و فرهنگی.", "en": "Message 8 says evolutionary science tracks changes in many defining qualities of Homo sapiens, yet the everyday word 'human' is far broader than what science deals with. 'What does it mean to be human?' is scientific, philosophical and cultural at once.", "nl": "Boodschap 8 stelt dat de evolutiewetenschap veel bepalende kenmerken van Homo sapiens onderzoekt, terwijl 'mens' in het dagelijks gebruik veel breder is."}, "points": [{"text": {"fa": "علم می‌تواند بگوید کدام ویژگی‌های زیستی و رفتاری ما چه زمانی پدید آمدند، ولی نمی‌تواند به‌تنهایی مرز ارزشی یا معنایی «انسان بودن» را تعیین کند. سند این تمایز را صریح می‌گوید.", "en": "Science can say when particular biological and behavioural traits arose, but cannot alone fix the value-laden or meaning-laden boundary of 'being human'. The handout states this distinction openly.", "nl": "Science can say when particular biological and behavioural traits arose, but cannot alone fix the value-laden or meaning-laden boundary of 'being human'. The handout states this distinction openly."}, "sources": ["src:a85b75e91c"], "flags": []}, {"text": {"fa": "برنامه در وب‌سایت خود پاسخ‌های مردم به پرسش «انسان بودن یعنی چه؟» را گرد می‌آورد و منبعی دربارهٔ رابطهٔ علم و دین دارد؛ یعنی نگاه آموزشی آن گفت‌وگو با دیدگاه‌های گوناگون است، نه فقط بیان یافته‌های فسیلی.", "en": "The programme's website collects public answers to 'What does it mean to be human?' and offers resources on science and religion, so its approach is dialogue with varied views, not only reporting fossils.", "nl": "The programme's website collects public answers to 'What does it mean to be human?' and offers resources on science and religion, so its approach is dialogue with varied views, not only reporting fossils."}, "sources": ["src:a85b75e91c"], "flags": []}, {"text": {"fa": "این سند کوتاهِ آموزشیِ یک نهاد (نه مقالهٔ داوری‌شده) است؛ ادعاهای آن خلاصه‌اند و برای جزئیات باید به پژوهش‌های اصلی رجوع کرد. به همین دلیل منبع آن در رتبهٔ دوم (آموزشی/عمومی) قرار گرفته است.", "en": "This is a short institutional outreach document, not a peer-reviewed paper; its claims are summaries and details should be checked in primary research. That is why it is ranked as tier 2 (educational/public).", "nl": "This is a short institutional outreach document, not a peer-reviewed paper; its claims are summaries and details should be checked in primary research. That is why it is ranked as tier 2 (educational/public)."}, "sources": [], "flags": ["editor-note"]}], "links": [{"to": "tabar:human-evolution", "rel": "part-of", "note": {"fa": "تکامل انسان", "en": "Human evolution", "nl": "Human evolution"}}, {"to": "tabar:race-biology", "rel": "see-also", "note": {"fa": "آیا «نژاد» مقولهٔ زیست‌شناختی است؟", "en": "Is race a biological category?", "nl": "Is race a biological category?"}}, {"to": "tabar:social-brain-evolution", "rel": "see-also", "note": {"fa": "چرا مغز اجتماعی شدیم", "en": "Why our brains went social", "nl": "Why our brains went social"}}, {"to": "phil:science", "rel": "see-also", "note": {"fa": "مدخل هم‌موضوع", "en": "Related entry", "nl": "Verwant lemma"}}], "people": [], "sources": ["src:a85b75e91c"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:t1-iran-centred-eurasia-thesis", "kind": "concept", "title": {"fa": "ایران‌زمین به‌مثابه کانون جمعیتی اوراسیا: دیدگاه وکیلی و نقد آن", "en": "The Iranian plateau as a population hub of Eurasia: Vakili's thesis and its critique", "nl": "Het Iraanse plateau als bevolkingscentrum van Eurazië: de these van Vakili"}, "aliases": [], "parent": "tabar:population-genetics", "field": "tabar:population-genetics", "summary": {"fa": "چارچوب تفسیری کتاب این است که ایران‌زمین بارها منشأ موج‌های جمعیتی به سوی اروپا، هند و دیگر نقاط بوده است. این برداشت دیدگاه نویسنده است و در بخش‌هایی با اجماع دانشگاهی ناهمخوان.", "en": "The book's interpretive frame is that the Iranian plateau repeatedly seeded population waves toward Europe, India and elsewhere. This is the author's viewpoint and in places departs from academic consensus.", "nl": "Het interpretatieve kader van het boek: het Iraanse plateau als herhaalde bron van migratiegolven. Dit is het standpunt van de auteur."}, "points": [{"text": {"fa": "به گفتهٔ نویسنده، اوراسیا را باید به‌جای دوگانهٔ آسیا و اروپا به سه قلمرو تمدنی بخش کرد: قلمرو خاوری (تمدن چین)، قلمرو میانی (ایران‌زمین) و قلمرو باختری (اروپا). او ایران‌زمین را مرکز میانی می‌داند.", "en": "The author argues Eurasia should be divided not into Asia and Europe but into three civilisational realms: eastern (Chinese), middle (the Iranian plateau) and western (Europe), with Iran at the centre.", "nl": "The author argues Eurasia should be divided not into Asia and Europe but into three civilisational realms: eastern (Chinese), middle (the Iranian plateau) and western (Europe), with Iran at the centre."}, "sources": ["src:93456bf0b8"], "flags": ["contested"]}, {"text": {"fa": "او می‌گوید کرانهٔ خلیج فارس هنگام خشکی اقلیم و پایین رفتن آب پناهگاه جمعیت‌های نخستین بیرون‌آمده از آفریقا بوده و موج‌های بعدی از غرب ایران به سوی اروپا و آسیا برخاسته‌اند.", "en": "He says the Persian Gulf shore served as a refuge for the first out-of-Africa populations when climate dried and sea levels fell, and later waves set out from western Iran toward Europe and Asia.", "nl": "He says the Persian Gulf shore served as a refuge for the first out-of-Africa populations when climate dried and sea levels fell, and later waves set out from western Iran toward Europe and Asia."}, "sources": ["src:93456bf0b8"], "flags": ["contested"]}, {"text": {"fa": "نویسنده کشاورزان نوسنگی اروپا و گسترش فناوری آهن به اروپا را به ایران‌زمین نسبت می‌دهد و می‌گوید دستهٔ استپی هندواروپایی از شمال ایران‌زمین برخاسته و خویشاوند «آریایی‌های» ایرانی بوده است؛ او واژهٔ «هندواروپایی» را هم برساختهٔ عصر استعمار می‌خواند.", "en": "He attributes Europe's Neolithic farmers and the spread of iron technology to the Iranian plateau and says the steppe Indo-European group rose from northern Iran and was kin to Iranian 'Aryans'; he also calls the label 'Indo-European' a colonial-era construct.", "nl": "He attributes Europe's Neolithic farmers and the spread of iron technology to the Iranian plateau and says the steppe Indo-European group rose from northern Iran and was kin to Iranian 'Aryans'; he also calls the label 'Indo-European' a colonial-era construct."}, "sources": ["src:93456bf0b8"], "flags": ["contested"]}, {"text": {"fa": "نوشته‌های نویسنده در چارچوب نظریهٔ شخصی «زروان» است و دو واژهٔ «ایران‌هراسی» و «پارس‌نژندی» را برای نقد آنچه خوانش‌های نادیده‌گیرندهٔ ایران می‌داند به‌کار می‌برد. این لحن گاه جدلی است و نباید با خود یافته‌های ژنتیکی یکی گرفته شود.", "en": "The writing sits within the author's personal 'Zurvan' theory and uses the terms 'Iranophobia' and 'Persian-neurosis' to criticise what he sees as readings that ignore Iran. The tone is at times polemical and should not be mistaken for the genetic findings themselves.", "nl": "The writing sits within the author's personal 'Zurvan' theory and uses the terms 'Iranophobia' and 'Persian-neurosis' to criticise what he sees as readings that ignore Iran. The tone is at times polemical and should not be mistaken for the genetic findings themselves."}, "sources": ["src:93456bf0b8"], "flags": ["contested"]}, {"text": {"fa": "دیدگاه رایج: ایران‌زمین (به‌ویژه زاگرس) در پیدایش کشاورزی و در پراکندگی انسان نقش مهمی داشته و تبار «کشاورزان ایرانی» در ژنوم آسیای جنوبی و استپ سهمی دارد. اما کشاورزان نخست اروپا عمدتاً از آناتولی آمده‌اند، خاستگاه یمنا استپ پونتی‌ـ‌خزری است نه شمال ایران، و تأثیر ایرانی تنها یکی از اجزای تبار آن‌هاست؛ پس تصویر «همه‌چیز از ایران» ساده‌سازی بزرگ است.", "en": "Mainstream view: the Iranian plateau (especially the Zagros) was important in the origins of farming and in human dispersal, and 'Iranian farmer' ancestry contributes to South Asian and steppe genomes. But Europe's first farmers came mainly from Anatolia, Yamnaya originated in the Pontic-Caspian steppe rather than northern Iran, and Iranian-related ancestry is only one component; 'everything from Iran' is a large oversimplification.", "nl": "Mainstream view: the Iranian plateau (especially the Zagros) was important in the origins of farming and in human dispersal, and 'Iranian farmer' ancestry contributes to South Asian and steppe genomes. But Europe's first farmers came mainly from Anatolia, Yamnaya originated in the Pontic-Caspian steppe rather than northern Iran, and Iranian-related ancestry is only one component; 'everything from Iran' is a large oversimplification."}, "sources": ["src:553bedc591", "src:58d5e5ecfa"], "flags": ["contested", "editor-note"]}], "links": [{"to": "tabar:zagros-neolithic", "rel": "contrasts", "note": {"fa": "نقش واقعی زاگرس در کشاورزی", "en": "The documented role of the Zagros in farming", "nl": "The documented role of the Zagros in farming"}}, {"to": "tabar:steppe-indo-iranian", "rel": "contrasts", "note": {"fa": "خاستگاه استپی هندوایرانی", "en": "The steppe origin of Indo-Iranian", "nl": "The steppe origin of Indo-Iranian"}}, {"to": "tabar:iranian-genetic-diversity", "rel": "see-also", "note": {"fa": "تنوع ژنتیکی ایرانیان", "en": "Genetic diversity of Iranians", "nl": "Genetic diversity of Iranians"}}, {"to": "tabar:genetic-essentialism", "rel": "see-also", "note": {"fa": "هشدار دربارهٔ ذات‌گرایی ژنتیکی", "en": "Caution about genetic essentialism", "nl": "Caution about genetic essentialism"}}], "people": ["core:shervin-vakili"], "sources": ["src:553bedc591", "src:58d5e5ecfa", "src:93456bf0b8"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:behavior-genetics", "kind": "field", "title": {"fa": "ژنتیک رفتاری", "en": "Behaviour genetics", "nl": "Gedragsgenetica"}, "aliases": [], "parent": "tabar:tabar", "field": null, "summary": {"fa": "چه سهمی از تفاوت‌های ما در شخصیت، هوش و سلامت روان به تفاوت‌های ژنتیکی برمی‌گردد و این عدد چه معنایی دارد؟", "en": "What share of our differences in personality, intelligence and mental health traces to genetic differences, and what does that number mean?", "nl": "Welk deel van onze verschillen in persoonlijkheid, intelligentie en mentale gezondheid gaat terug op genetische verschillen, en wat betekent dat getal?"}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:origins-of-ritual-religion-shaman", "kind": "concept", "title": {"fa": "خاستگاه آیین و باور به نادیدنی‌ها: از شامپانزه‌های سنگ‌انداز تا شمن پارینه‌سنگی و کاهن نوسنگی", "en": "Origins of ritual and belief in the unseen: from stone-throwing chimpanzees to the Palaeolithic shaman and the Neolithic priest", "nl": "De oorsprong van ritueel en geloof in het onzichtbare: van stenen gooiende chimpansees tot de paleolithische sjamaan en de neolithische priester"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "اپیزود ۲۹ «خداحافظ آفریقا» می‌پرسد مغز انسان از کی شروع کرد به باور کردن چیزهایی که دیده نمی‌شوند، و صرفاً از منظر شواهد باستان‌شناختی و روان‌شناسی تکاملی پاسخ می‌دهد. سه مفهوم را جدا می‌کند — باور فراطبیعی، آیین و دین سازمان‌یافته — و می‌گوید انسان‌های پارینه‌سنگی احتمالاً باورهای معنوی و آیین داشتند اما «دین» به معنای امروزی نه. سه فرضیهٔ تکاملی را برمی‌شمارد: سامانهٔ بیش‌فعالِ تشخیص عامل، تعمیم «نظریهٔ ذهن» به طبیعت (جان‌انگاری)، و ترس از مرگ. سپس شواهد را مرور می‌کند — اُخرا، صدف‌های سوراخ‌شده، حکاکی‌های بلومبوس، تدفین‌ها، هنر غارها — و از شمن پاره‌وقتِ شکارگران تا کاهن تمام‌وقت و قربانی و مالیات دینیِ پس از کشاورزی را دنبال می‌کند.", "en": "Episode 29 asks when the human brain began believing in things it cannot see, answering solely from archaeology and evolutionary psychology. It distinguishes supernatural belief, ritual and organised religion, and argues Palaeolithic people probably had spiritual beliefs and rituals but not 'religion' in today's sense. It sets out three evolutionary hypotheses — a hyperactive agency-detection system, extending 'theory of mind' to nature (animism), and fear of death — then reviews the evidence (ochre, perforated shells, Blombos engravings, burials, cave art) and traces the shift from the part-time shaman of foragers to the full-time priest, sacrifice and religious taxes after farming.", "nl": "Aflevering 29 vraagt wanneer het brein begon te geloven in het onzichtbare, vanuit archeologie en evolutiepsychologie. Ze onderscheidt bovennatuurlijk geloof, ritueel en georganiseerde religie, noemt drie hypothesen (hyperactieve detectie van actoren, animisme via 'theory of mind', doodsangst), bespreekt het bewijs (oker, schelpkralen, Blombos, begrafenissen, grotkunst) en volgt de weg van de deeltijdsjamaan naar de voltijdpriester."}, "points": [{"text": {"fa": "سه مفهوم: (۱) باور فراطبیعی — اعتقاد به موجودات یا نیروهایی که با چشم دیده نمی‌شوند: ارواح، ارواح نیاکان، نیروهای طبیعت، جانوران مقدس؛ وجود چنین باوری لزوماً به معنای دین‌داری آن جامعه نیست. (۲) آیین — رفتارهای تکرارشونده‌ای که هدف عملیِ مستقیمی ندارند: دفن مردگان، رنگ کردن جسد، رقص‌های گروهی، آوازهای آیینی. (۳) دین — که معمولاً خدایان مشخص، اسطوره‌های منسجم، روحانی یا کاهن، مکان‌های مقدس، قوانین اخلاقی و مناسک رسمی دارد و این‌ها را پس از انقلاب کشاورزی می‌بینیم. به گفتهٔ برنامه، تقریباً هیچ باستان‌شناسی امروز باور ندارد که دین به معنای امروزی در پارینه‌سنگی وجود داشت.", "en": "Three concepts: (1) supernatural belief — in invisible beings or forces: spirits, ancestor spirits, natural forces, sacred animals; such belief does not by itself make a society religious. (2) Ritual — repeated behaviours with no direct practical aim: burying the dead, colouring corpses, group dances, ritual songs. (3) Religion — usually with defined gods, coherent myths, priests, sacred places, moral codes and formal rites, which appear after the agricultural revolution. Almost no archaeologist today believes religion in that sense existed in the Palaeolithic.", "nl": "Drie begrippen: bovennatuurlijk geloof, ritueel (herhaald gedrag zonder direct praktisch doel) en religie (goden, mythen, priesters, heilige plaatsen, regels), die pas na de landbouwrevolutie verschijnt."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "شامپانزه‌های سنگ‌انداز: پژوهشی که در ۲۰۱۶ منتشر شد نشان داد برخی شامپانزه‌های غرب آفریقا (در گینه، گینه‌بیسائو، لیبریا و ساحل عاج) رفتاری تکرارشونده و شبه‌آیینی دارند: در زمانی خاص دور درختی خاص جمع می‌شوند، معمولاً نرهای بالغ، فریاد می‌کشند و بارها به تنه یا ریشه‌های برجستهٔ آن سنگ پرتاب می‌کنند یا سنگ‌ها را در حفره‌های تنه می‌گذارند — بارها و بارها با همان درخت. چون این رفتار در شامپانزه‌های مرکز و شرق آفریقا دیده نشده، احتمالاً «محلی» یا فرهنگی است. فرضیه‌ها: نمایش قدرت نرها، لذت از صدای برخورد سنگ با تنه، نشانه‌گذاری مسیر یا مکان، و — جذاب‌ترین — رفتاری شبه‌آیینی. هیچ مدرک مستقیمی از دین یا مناسک در شامپانزه‌ها نیست، اما این شاید ابتدایی‌ترین رفتار آیینی‌وار باشد که در موجودی جز انسان ثبت شده است.", "en": "Stone-throwing chimpanzees: a study published in 2016 found that some West African chimpanzees (Guinea, Guinea-Bissau, Liberia, Côte d'Ivoire) show a repeated, ritual-like behaviour: at certain times, mostly adult males gather at a particular tree, call out and repeatedly throw stones at its trunk or buttress roots, or place stones in hollows — again and again at the same tree. Because it has not been seen in central or eastern chimpanzees, it is probably local or cultural. Hypotheses: male display, enjoying the sound, marking places or paths, and — most intriguingly — a ritual-like act. There is no direct evidence of religion in chimpanzees, but this may be the most basic ritual-like behaviour recorded in a non-human.", "nl": "Stenen gooiende chimpansees: een studie uit 2016 beschreef West-Afrikaanse chimpansees die steeds bij dezelfde boom stenen gooien. Het lijkt lokaal/cultureel. Hypothesen: imponeren, geluid, markering — of iets ritueelachtigs."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "فرضیهٔ یکم — سامانهٔ بیش‌فعالِ تشخیص عامل: فرض کنید چهل هزار سال پیش صدای خش‌خشی از پشت بوته‌ای می‌شنوید: یا باد است یا جانوری درنده. اگر باد را شیر بپندارید، فقط می‌ترسید؛ اگر شیر را باد بپندارید، می‌میرید. پس ما نوادگانِ کسانی هستیم که به سمت «مثبتِ کاذب» سوق داده شدند: مغزی که همیشه فرض می‌کند پشت هر رویدادی عاملی هست. همین سازوکار بعدها برای رعد و برق، زلزله، بیماری و خشکسالی هم عامل‌های نادیده تراشید: «کاری کرده‌ام که خدایان یا ارواح نیاکان آزرده شده‌اند». به گفتهٔ برنامه، مغز پارینه‌سنگیِ ما از عدم‌قطعیت بیزار است و پاسخ فوری می‌خواهد؛ پس به کسی که می‌گوید «نمی‌دانم» یا «علم هنوز نمی‌داند» باید بهای بیشتری داد، چون پاسخی علمی و درست می‌دهد. این خطای سودمند جزو «خطاهای شناختی» است که هنوز با ما هست.", "en": "Hypothesis 1 — a hyperactive agency-detection system: imagine hearing a rustle behind a bush forty thousand years ago: wind or a predator. Mistake wind for a lion and you are only frightened; mistake a lion for wind and you die. So we descend from those biased towards false positives — a brain that always assumes an agent behind events. The same mechanism later assigned invisible agents to thunder, earthquakes, disease and drought: 'I did something that angered the gods or the ancestors.' Our Palaeolithic brain hates uncertainty and wants an immediate answer, so we should value those who say 'I don't know' or 'science doesn't know yet' — they answer scientifically. This useful error is among the cognitive biases we still carry.", "nl": "Hypothese 1 — hyperactieve detectie van actoren: wind voor een leeuw houden kost alleen schrik; een leeuw voor wind houden kost je leven. We stammen af van wie te vaak een actor zag. Hetzelfde mechanisme gaf later donder en ziekte een onzichtbare oorzaak. Wie 'ik weet het niet' zegt, verdient juist waardering."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "فرضیهٔ دوم — نظریهٔ ذهن و جان‌انگاری: ما (و تا حدی سگ‌ها، شامپانزه‌ها و بونوبوها) می‌توانیم از روی چهرهٔ دیگری حالش را بخوانیم. نیاکان ما این توانایی را به جانوران، کوه‌ها، رودها و مردگان هم تعمیم دادند: اگر رود طغیان می‌کرد، «حالش خوب نبود»؛ اگر کوه آتشفشان می‌کرد، از خشم یا غم بود. این روح‌انگاری برای همه‌چیز سرچشمهٔ یکی از کهن‌ترین باورهای شناخته‌شده است: آنیمیسم یا جان‌انگاری، که هنوز در قبایلی در گینهٔ نو، آمازون و آفریقا دیده می‌شود. جان‌انگاری رابطه‌ای دوطرفه است: هم رود پیام می‌فرستد و هم فرد با رود و کوه و جانوران سخن می‌گوید؛ همه‌چیز دارای قصد و نیت پنداشته می‌شود.", "en": "Hypothesis 2 — theory of mind and animism: we (and to a degree dogs, chimpanzees and bonobos) can read another's state from their face. Our ancestors extended this to animals, mountains, rivers and the dead: a flooding river was 'unwell', an erupting mountain angry or grieving. This is the root of one of the oldest known beliefs, animism, still found among groups in New Guinea, the Amazon and Africa. Animism is two-way: the river sends messages and people speak to rivers, mountains and animals; everything has intentions.", "nl": "Hypothese 2 — 'theory of mind' en animisme: het vermogen om andermans gemoed te lezen werd uitgebreid tot rivieren, bergen en doden. Animisme is tweerichtingsverkeer: alles heeft bedoelingen."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "فرضیهٔ سوم — ترس از مرگ: ما تنها موجودی هستیم که به مرگ آیندهٔ خود آگاهیم؛ برنامه این را به سیم‌کشی عصبیِ بخش پیش‌پیشانیِ مغز نسبت می‌دهد که داستان‌سازی پیچیده را هم ممکن کرد. از سوی دیگر، سازوکارهای بدن ما را از اندیشیدن به آن دور می‌کنند: با وجود دیدن مرگ صدها نفر در رسانه‌ها یا از دست دادن عزیزان، در ذهن خود معمولاً باور نمی‌کنیم که «من هم می‌میرم». اما این آگاهی اضطرابی شدید می‌سازد و باور به روح، جهان پس از مرگ و نیاکان آن را کاهش می‌دهد. برنامه تأکید می‌کند که این توضیح‌ها فقط از منظر انسان‌شناسی پیش از تاریخ و روان‌شناسی تکاملی‌اند و دیگر رشته‌ها رویکردهای دیگری دارند.", "en": "Hypothesis 3 — fear of death: we alone know we will die, which the programme links to the prefrontal wiring that also enables complex storytelling. Yet our bodies steer us away from the thought: despite seeing hundreds of deaths in the media or losing loved ones, we rarely truly believe 'I too will die'. Still, the awareness creates intense anxiety, eased by belief in souls, an afterlife and ancestors. The programme stresses these explanations come only from prehistoric anthropology and evolutionary psychology; other fields take other approaches.", "nl": "Hypothese 3 — doodsangst: alleen wij weten dat we zullen sterven. Geloof in een ziel, een hiernamaals en voorouders verzacht die angst. Het programma benadrukt dat dit één perspectief is."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "شواهد: (۱) اُخرا — گِلِ قرمزِ اکسید آهن که با چربی، خون یا ادرار مخلوط می‌شد و رنگ می‌ساخت؛ کهن‌ترین استفاده از آن حدود ۳۰۰ هزار سال پیش است و انسان‌ها گاه فاصله‌های بسیار دور را برای تهیه‌اش می‌پیمودند: برای آرایش بدن، هویت گروهی، آیین و نماد خون و زندگی. پوشاندن اجساد پارینه‌سنگی با اُخرا از وجود مناسک خبر می‌دهد. (۲) زیورآلات — صدف‌های سوراخ‌شده از حدود ۱۲۰ تا ۱۴۰ هزار سال پیش؛ حمل چیزی بی‌کاربرد عملی، آغاز اندیشهٔ نمادین است. (۳) حکاکی‌های انتزاعی — در غار بلومبوس در آفریقای جنوبی، نقش‌های هندسی روی تکه‌های اُخرا، احتمالاً از نخستین نشانه‌های اندیشهٔ انتزاعی. (۴) تدفین — چرا مردگان را دفن کردند؟ احترام؛ جلوگیری از جذب شکارچیان یا بیماری؛ و شاید باور به ادامهٔ زندگی، با توجه به حالت جنینیِ جسد و ابزار و استخوان جانوران کنارش. در غار شانیدر در کردستان عراق، بقایای ده نئاندرتال یافت شد که دست‌کم چهارتایشان به‌طور قطعی دفن شده بودند؛ رالف سولکی در دههٔ ۱۹۵۰ از گرده‌های گل روی گورها سخن گفت و کتاب «مردمان گل» را نوشت، اما امروز می‌دانیم این گرده‌ها کار نوعی زنبور وحشی یا جوندگان بوده است. از حدود ۴۰ هزار سال پیش در گورهای انسان خردمندِ خردمند گردنبند، ابزار، پوشش اُخرا و اشیای عاج ماموت می‌بینیم — گویی مرده هنوز به چیزی نیاز داشت. (۵) هنر غارها — حدود ۴۰ هزار سال پیش «انفجاری هنری» رخ می‌دهد و بیشتر جانوران نقاشی می‌شوند، نه انسان یا درخت یا منظره.", "en": "Evidence: (1) ochre — red iron-oxide earth mixed with fat, blood or urine to make paint; earliest use about 300,000 years ago, sometimes carried long distances, for body decoration, group identity, ritual and as a symbol of blood and life; coating the dead with it implies rites. (2) Ornaments — perforated shells from about 120–140,000 years ago; carrying something with no practical use marks the start of symbolic thought. (3) Abstract engravings — geometric patterns on ochre pieces at Blombos cave, South Africa. (4) Burial — why? respect; avoiding scavengers or disease; perhaps belief in continued life, given the foetal posture and tools and animal bones placed alongside. At Shanidar cave (Iraqi Kurdistan) ten Neanderthals were found, at least four definitely buried; Ralph Solecki in the 1950s spoke of flower pollen on the graves and wrote 'Shanidar: The First Flower People', but the pollen is now attributed to burrowing bees or rodents. From about 40 ka sapiens graves hold necklaces, tools, ochre and mammoth-ivory objects — as if the dead still needed things. (5) Cave art — about 40 ka an 'artistic explosion', mostly animals rather than people, trees or landscapes.", "nl": "Bewijs: (1) oker (~300.000 jaar) voor lichaamsversiering, identiteit en ritueel; (2) doorboorde schelpen (~120–140.000 jaar); (3) geometrische gravures in Blombos; (4) begrafenissen — in Shanidar minstens vier begraven Neanderthalers; Solecki's 'bloemen' zijn waarschijnlijk van bijen; vanaf ~40.000 jaar grafgiften bij sapiens; (5) grotkunst, vooral dieren."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "شمن: در گروه‌های شکارگر-گردآورنده شخصیتی مرموز بود که ادعا می‌کرد با ارواح در ارتباط است، بیماری را درمان می‌کند، فصل‌ها را پیش‌بینی می‌کند، شکار خوب می‌آورد و از رویدادهای ناگوار جلوگیری می‌کند: شمن. شمن‌ها ساده‌ترین شکلِ آن چیزی‌اند که بعدها کاهن و کاهنهٔ معابد شد، با یک فرق مهم: شمن پارینه‌سنگی «پاره‌وقت» بود، چون هنوز مازاد خوراکی نبود که به‌عنوان نذر به او داده شود و او هم باید در شکار و گردآوری سهم می‌داشت. هنگام نیاز، با پوشیدن پوست جانور یا گذاشتن شاخ گوزن و بز بر سر، خواندن اوراد، سوزاندن گیاهان در آتش (آنچه امروز «دود و اسپند» می‌گوییم) و رقص، به «خلسه» می‌رفت. برنامه تأکید می‌کند که مغز ما اندامی باورپذیر است که به‌سادگی خودش را فریب می‌دهد؛ پس شمن احتمالاً حقه‌باز نبود، بلکه خودش باور داشت. نیاکان ما هم مثل ما خواب می‌دیدند و درگذشتگان را در خواب در همان دشت‌های پر از شکار می‌دیدند؛ شمن خواب‌ها را تعبیر می‌کرد. جانوران برای شکارگران فقط خوراک نبودند: برخی خویشاوند، روح محافظ یا نیا پنداشته می‌شدند و شمن در خلسه با آن‌ها سخن می‌گفت. برخی پژوهشگران نقاشی‌های غار را حاصل همین تجربه‌های خلسه یا «جادوی شکار» می‌دانند — اجازه‌گرفتن از جانور پیش از شکار؛ مخالفان می‌گویند هیچ مدرک مستقیمی نیست. آزمایشی در چند سال گذشته نشان داد چراغ پیه‌سوز در انتهای غار اکسیژن را می‌کاهد و پژوهشگران خودشان دچار حالتی شبه‌خلسه شدند.", "en": "The shaman: forager groups had a mysterious figure claiming contact with spirits, the power to heal, predict seasons, bring good hunting and avert misfortune — the shaman, the simplest form of what later became temple priests, with one key difference: the Palaeolithic shaman was part-time, since there was no food surplus to give as offerings and he too had to hunt and gather. When needed, wearing an animal skin or antlers or horns, chanting, burning plants in the fire and dancing, he entered trance. The programme stresses the brain is a credulous organ that easily fools itself, so the shaman was probably not a fraud but a believer. Our ancestors, like us, dreamed of the dead in the same game-filled plains; the shaman interpreted dreams. Animals were not just food: some were kin, guardian spirits or ancestors, and in trance the shaman spoke with them. Some researchers see cave art as the product of such trance or 'hunting magic' — asking an animal's permission before the hunt; critics note there is no direct evidence. A recent experiment found a tallow lamp at the back of a cave lowered oxygen and gave the researchers a trance-like state.", "nl": "De sjamaan: een deeltijdfiguur die contact met geesten claimde, genas, seizoenen voorspelde en goede jacht bracht — de voorloper van de priester. Er was nog geen overschot om hem te onderhouden. Via dierenhuiden, gezang, kruiden en dans ging hij in trance. Het brein bedriegt zichzelf makkelijk; de sjamaan geloofde waarschijnlijk zelf. Sommigen zien grotkunst als product van trance of 'jachtmagie'."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "کارکرد تکاملی: اگر این باورها نادرست‌اند، چرا ماندند؟ پاسخ برنامه: (۱) همکاری — اگر همه باور داشته باشند ارواح نیاکان مراقب‌اند، احتمال تقلب و رفتار ناهنجار کمتر می‌شود؛ (۲) کاستن از اضطراب و قابل‌تحمل‌تر کردن مرگ، که رنجی مدام تکرارشونده بود؛ (۳) اعتماد — آیین‌های مشترک اعتماد می‌سازند؛ (۴) انتقال فرهنگ — داستان‌ها از این راه نسل به نسل می‌رسند.", "en": "Evolutionary function: if these beliefs are false, why did they persist? (1) cooperation — if everyone believes ancestor spirits are watching, cheating and deviance decline; (2) reduced anxiety, making death, a constantly recurring pain, more bearable; (3) trust — shared rituals build it; (4) cultural transmission — stories pass down the generations this way.", "nl": "Evolutionaire functie: samenwerking (de voorouders kijken mee), minder angst, vertrouwen door gedeelde rituelen, en doorgifte van cultuur."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "پس از کشاورزی: کشاورزی نقطهٔ عطفی در شکل باورها بود: یکجانشینی، روستاهای بزرگ‌شونده، مالکیت، افزایش نابرابری و شکل‌گیری حکومت‌ها؛ و در پی آن معابد ساخته شدند، شمن‌های پاره‌وقت به کاهنان تمام‌وقت بدل شدند، خدایان رسمی پدید آمدند و قربانی‌ها، مالیات‌های دینی و قوانین دینی شکل گرفتند. دلیلش، به گفتهٔ برنامه: شکارگر با دیدن تغییر اقلیم جابه‌جا می‌شد، اما کشاورز «همهٔ تخم‌مرغ‌هایش را در یک سبد گذاشته» و به زمین بسته است؛ اگر باران نبارد، همه‌چیز را از دست می‌دهد، پس باید خدایان را با قربانی راضی نگه دارد. جمع‌بندی برنامه: نخستین انسان‌ها خدا را به معنای امروزی نمی‌شناختند، اما ذهنشان جهانی می‌ساخت که فقط از سنگ و استخوان و آتش نبود؛ توانایی تصور ارواح و نیروهای نامرئی محصول همان مغزی بود که زبان، هنر و همکاری را پدید آورد — «توانایی تجسم نادیدنی‌ها».", "en": "After farming: agriculture was a turning point — sedentism, growing villages, property, rising inequality and states; then temples, full-time priests replacing part-time shamans, official gods, sacrifices, religious taxes and religious law. Why? A forager moved when the climate changed, but a farmer 'has put all his eggs in one basket' and is tied to the land; if the rain fails he loses everything, so he must keep the gods content with sacrifices. The programme's summary: the first humans did not know God in today's sense, but their minds built a world not made only of stone, bone and fire; imagining spirits and invisible forces came from the same brain that produced language, art and cooperation — 'the ability to imagine the unseen'.", "nl": "Na de landbouw: sedentair leven, bezit, ongelijkheid en staten brachten tempels, voltijdpriesters, officiële goden, offers en religieuze belastingen. De boer is aan zijn land gebonden en moet de goden tevreden houden. Kern: het vermogen 'het onzichtbare voor te stellen'."}, "sources": ["src:60e7838a5a"], "flags": []}, {"text": {"fa": "نقد و دقت: (۱) پژوهش «پرتاب سنگ» شامپانزه‌ها (کوهلر و همکاران) در «Scientific Reports» در ۲۰۱۶ منتشر شد، نه «نیچر». (۲) فرضیهٔ «سامانهٔ بیش‌فعال تشخیص عامل» (جاستین برت، استوارت گاتری) و رویکرد شناختی به دین (پاسکال بویه) تأثیرگذار، اما در آزمون تجربی نتایجی ناهمسان داشته‌اند؛ برخی پژوهش‌ها پیوند مستقیمی میان حساسیت تشخیص عامل و باور دینی نیافته‌اند. (۳) «ترس از مرگ» به‌عنوان ریشهٔ دین، نزدیک به «نظریهٔ مدیریت وحشت» است که آن هم در بحران تکرارپذیری روان‌شناسی زیر پرسش رفته. (۴) دیدگاه‌های رقیب مهمی هم هست: دورکیم (دین به‌عنوان نیایش خودِ جامعه و «شور جمعی»)، نظریهٔ «خدایان بزرگِ ناظر» (آرا نورنزایان) که دین اخلاقی را پیامد جوامع بزرگ می‌داند، و نظریه‌های نشانه‌پردازیِ پرهزینه. (۵) «کهن‌ترین استفادهٔ اُخرا حدود ۳۰۰ هزار سال» با یافته‌های کاپتورین در کنیا هم‌خوان است؛ برخی شواهد کهن‌ترند و تفسیر «آیینی» آن‌ها مورد بحث است.", "en": "Critique and precision: (1) the chimpanzee stone-throwing study (Kühl et al.) appeared in Scientific Reports in 2016, not Nature. (2) The hyperactive agency-detection hypothesis (Justin Barrett, Stewart Guthrie) and the cognitive science of religion (Pascal Boyer) are influential but have had mixed experimental support; some studies find no direct link between agency-detection sensitivity and religious belief. (3) Fear of death as religion's root resembles Terror Management Theory, itself questioned in psychology's replication crisis. (4) Important rival views exist: Durkheim (religion as society worshipping itself, 'collective effervescence'), the 'Big Gods' theory (Ara Norenzayan) tying moralising religion to large societies, and costly-signalling theories. (5) Ochre use ~300,000 years ago fits Kapthurin (Kenya); some evidence is older, and its 'ritual' reading is debated.", "nl": "Kritiek: (1) de chimpanseestudie verscheen in Scientific Reports (2016). (2) De agency-detectiehypothese heeft wisselende empirische steun. (3) Doodsangst als wortel lijkt op Terror Management Theory, die onder de replicatiecrisis lijdt. (4) Alternatieven: Durkheim, 'Big Gods' (Norenzayan), costly signalling. (5) De rituele lezing van oker is omstreden."}, "sources": ["src:60e7838a5a"], "flags": ["editor-note", "contested"]}, {"text": {"fa": "یادداشت خوانش: بر پایهٔ رونوشت خودکار اپیزود ۲۹ نسخهٔ پادکستیِ «خداحافظ آفریقا»، به‌طور کامل. گوینده تأکید می‌کند که فقط از منظر انسان‌شناسی پیش از تاریخ و روان‌شناسی تکاملی سخن می‌گوید و دربارهٔ درستی یا نادرستیِ باورهای دینی داوری نمی‌کند؛ این مدخل نیز چنین است.", "en": "Reading note: based on the full automatic transcript of podcast episode 29. The speaker stresses he speaks only from prehistoric anthropology and evolutionary psychology and does not judge the truth of religious beliefs; nor does this entry.", "nl": "Leesnotitie: gebaseerd op het volledige transcript van aflevering 29. De spreker oordeelt niet over de waarheid van religieuze overtuigingen; dit lemma evenmin."}, "sources": ["src:60e7838a5a"], "flags": ["editor-note"]}], "links": [{"to": "soc:durkheim-sacred-society", "rel": "bridges", "note": {"fa": "دورکیم: دین و جامعه", "en": "Durkheim: religion and society", "nl": "Durkheim: religie en samenleving"}}, {"to": "soc:collective-effervescence-ritual", "rel": "bridges", "note": {"fa": "شور جمعی و آیین", "en": "collective effervescence and ritual", "nl": "collectieve bruisendheid"}}, {"to": "soc:death-awareness-ritual-afterlife-roles", "rel": "bridges", "note": {"fa": "مرگ‌آگاهی و نقش‌های پس از مرگ", "en": "death awareness and afterlife roles", "nl": "doodsbewustzijn"}}, {"to": "soc:archaic-hunt-ritual-logic-theological-stage", "rel": "see-also", "note": {"fa": "منطق آیین شکار کهن", "en": "archaic hunting-ritual logic", "nl": "archaïsche jachtrituelen"}}, {"to": "psy:cognitive-biases", "rel": "bridges", "note": {"fa": "خطاهای شناختی", "en": "cognitive biases", "nl": "cognitieve biases"}}, {"to": "phil:arda-viraf-soul-journey-and-stations", "rel": "see-also", "note": {"fa": "سفر روان در «ارداویراف‌نامه»", "en": "the soul's journey in the Arda Viraf", "nl": "de zielsreis in de Arda Viraf"}}, {"to": "tabar:sapiens-sapiens-dog-art-animism", "rel": "see-also", "note": {"fa": "هنر غارها و جان‌انگاری", "en": "cave art and animism", "nl": "grotkunst en animisme"}}, {"to": "tabar:ochre-middle-stone-age", "rel": "evidence-for", "note": {"fa": "اُخرا در عصر سنگ میانه", "en": "ochre in the Middle Stone Age", "nl": "oker in de Middle Stone Age"}}, {"to": "tabar:neanderthal-hunting-language-burial", "rel": "see-also", "note": {"fa": "تدفین نئاندرتال‌ها", "en": "Neanderthal burial", "nl": "Neanderthalerbegrafenissen"}}], "sources": ["src:60e7838a5a"], "people": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:raw-food-diet-evidence", "kind": "concept", "title": {"fa": "رژیم خام‌خواری و شواهدش دربارهٔ نیاز ما به پختن", "en": "Raw-food diets and what they show about our need for cooking", "nl": "Rauwkostdiëten en wat ze zeggen over onze behoefte aan koken"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "رانگهم از رفتار خام‌خواران امروزی برای آزمودن فرضیه‌اش استفاده می‌کند: در مطالعهٔ گیسن آلمان، هرچه سهم غذای خام بیشتر بود وزن کمتر بود و در زنان قاعدگی بیشتر مختل می‌شد. او همچنین می‌گوید هیچ جامعهٔ انسانیِ شناخته‌شده‌ای بدون پختن زندگی نمی‌کند. این شواهد جالب‌اند، ولی مقطعی و غیرتجربی‌اند و توصیهٔ غذایی نیستند.", "en": "Wrangham uses modern raw-foodists to test his hypothesis: in Germany's Giessen study, the more raw food people ate the lower their weight, and women's menstrual cycles were more often disrupted. He also notes that no known human society lives without cooking. The evidence is interesting but observational, and it is not dietary advice.", "nl": "Wrangham gebruikt hedendaagse rauwkosters als toets: in de Duitse Giessen-studie hing meer rauw voedsel samen met lager gewicht en vaker gestoorde menstruatie. Er is geen bekende samenleving zonder koken. Het bewijs is observationeel en geen voedingsadvies."}, "points": [{"text": {"fa": "مطالعهٔ گیسن (کوبنیک و همکاران) با پرسش‌نامه ۵۱۳ نفر را بررسی کرد که ۷۰ تا ۱۰۰ درصد غذایشان خام بود. با بالارفتن سهم غذای خام، نمایهٔ توده بدنی پایین‌تر می‌آمد و نزدیک به ۳۰ درصدِ کاملاً خام‌خواران نشانه‌های کمبود مزمن انرژی داشتند. در زنانی که غذای شان کاملاً خام بود، حدود نیمی دچار قطع کامل قاعدگی بودند (بر پایهٔ گزارش کتاب).", "en": "The Giessen study (Koebnick and colleagues) surveyed 513 people eating 70–100 percent raw. As raw share rose, body mass index fell, and about 30 percent of strict raw-foodists showed signs of chronic energy deficiency. Among women eating fully raw, about half had lost their periods entirely (as reported in the book).", "nl": "The Giessen study (Koebnick and colleagues) surveyed 513 people eating 70–100 percent raw. As raw share rose, body mass index fell, and about 30 percent of strict raw-foodists showed signs of chronic energy deficiency. Among women eating fully raw, about half had lost their periods entirely (as reported in the book)."}, "sources": ["src:c12cd83ad0"], "flags": []}, {"text": {"fa": "آزمایش کوتاه «رژیم تکاملی» در باغ‌وحش پینتون (۲۰۰۶، ۹ داوطلب، ۱۲ روز) هم نشان داد کاهش وزن حدود ۴ کیلوگرم، با وجود خوردن تا ۵ کیلو غذای گیاهی در روز. پژوهشی کنترل‌شده نبود و تعداد افراد کم بود.", "en": "The short 'Evo Diet' experiment at Paignton Zoo (2006, nine volunteers, 12 days) found an average weight loss of about 4 kg despite eating up to 5 kg of plant food a day. It was not a controlled trial and the sample was tiny.", "nl": "The short 'Evo Diet' experiment at Paignton Zoo (2006, nine volunteers, 12 days) found an average weight loss of about 4 kg despite eating up to 5 kg of plant food a day. It was not a controlled trial and the sample was tiny."}, "sources": ["src:c12cd83ad0"], "flags": []}, {"text": {"fa": "رانگهم می‌گوید گزارش‌های «قوم‌هایی که غذای خام می‌خورند» (از سیری‌ها در مکزیک تا اینوئیت‌ها) در بررسی دقیق رد شد: همه پختن را برای وعدهٔ اصلی داشتند. ادوارد تایلور در ۱۸۷۰ نتیجه گرفت پختن در همهٔ جوامع شناخته‌شده هست.", "en": "Wrangham says reports of peoples eating raw (from the Seri of Mexico to the Inuit) fail on close inspection: all cooked their main meal. Edward Tylor concluded in 1870 that cooking is found in every known society.", "nl": "Wrangham says reports of peoples eating raw (from the Seri of Mexico to the Inuit) fail on close inspection: all cooked their main meal. Edward Tylor concluded in 1870 that cooking is found in every known society."}, "sources": ["src:c12cd83ad0"], "flags": []}, {"text": {"fa": "نظر ویراستار: وزن کم و کمبود انرژی در خام‌خواران با فرضیهٔ پختن سازگار است، اما ثابت نمی‌کند. این افراد انتخاب‌شده‌اند، رژیم‌شان اغلب کم‌کالری یا ناکافی در پروتئین و چربی است، و ورزش و عوامل دیگر هم دخیل‌اند. نتیجهٔ مطالعه به آدم‌های امروزی در محیط شهری مربوط است و مستقیم به اجدادمان تعمیم‌پذیر نیست. این مدخل توصیه‌ای دربارهٔ رژیم غذایی نیست.", "en": "Editor's note: low weight and energy deficiency in raw-foodists are consistent with the cooking hypothesis but do not prove it. These are self-selected people, often on low-calorie diets lacking protein or fat, and exercise and other factors matter. The findings concern modern urban people and do not transfer directly to our ancestors. This entry is not dietary advice.", "nl": "Editor's note: low weight and energy deficiency in raw-foodists are consistent with the cooking hypothesis but do not prove it. These are self-selected people, often on low-calorie diets lacking protein or fat, and exercise and other factors matter. The findings concern modern urban people and do not transfer directly to our ancestors. This entry is not dietary advice."}, "sources": [], "flags": ["contested", "editor-note"]}], "links": [{"to": "tabar:cooking-energy-gain", "rel": "see-also", "note": {"fa": "پختن چگونه انرژی غذا را بالا می‌برد", "en": "How cooking raises the energy yield of food", "nl": "How cooking raises the energy yield of food"}}, {"to": "tabar:cooking-hypothesis", "rel": "part-of", "note": {"fa": "فرضیهٔ پختن", "en": "The cooking hypothesis", "nl": "The cooking hypothesis"}}, {"to": "tabar:human-evolution", "rel": "part-of", "note": {"fa": "تکامل انسان", "en": "Human evolution", "nl": "Human evolution"}}], "people": ["core:corinna-koebnick", "core:edward-b-tylor"], "sources": ["src:c12cd83ad0"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:ghost-populations-mixture", "kind": "concept", "title": {"fa": "جمعیت‌های «روح»: ردیابی گروه‌های ناپدیدشده از رد ژنی‌شان", "en": "'Ghost' populations: tracing vanished groups through the DNA they left", "nl": "'Spookpopulaties': verdwenen groepen opsporen via hun DNA-sporen"}, "aliases": [], "parent": "tabar:population-genetics", "field": "tabar:population-genetics", "summary": {"fa": "رایش نشان می‌دهد با آزمون‌های آماری می‌توان وجود گروه‌هایی را که امروز به‌شکل ناآمیخته نمانده‌اند از روی ژنوم نوادگانشان تشخیص داد؛ مثل «اوراسیایی‌های شمالیِ باستان» و «اوراسیایی‌های پایه». نتیجهٔ بزرگ او این است که خوشه‌های ژنتیکی امروز خودشان آمیزهٔ گروه‌های بسیار متفاوت گذشته‌اند. این تصویر قوی و پرکاربرد است، اما نتیجهٔ مدل‌های آماری است و جای و زمان زندگی «ارواح» را فقط با DNA باستانی می‌توان دقیق کرد.", "en": "Reich shows that statistical tests can reveal groups that no longer exist in unmixed form, from the genomes of their descendants, such as the 'Ancient North Eurasians' and the 'Basal Eurasians'. His main conclusion is that today's genetic clusters are themselves mixtures of very different past groups. The picture is strong and widely used but is model-based; where and when the 'ghosts' lived can be pinned down only with ancient DNA.", "nl": "Reich laat zien dat statistische toetsen groepen kunnen opsporen die niet meer ongemengd bestaan, zoals de 'Oude Noord-Euraziaten' en de 'Basale Euraziaten'. Zijn kernconclusie: de huidige genetische clusters zijn zelf mengsels van sterk verschillende groepen uit het verleden. Het beeld is sterk maar modelgebaseerd."}, "points": [{"text": {"fa": "ایده: اگر چهار جمعیت فقط با یک درخت شاخه‌شاخه به هم مربوط بودند، یک آمارهٔ ساده (آزمون چهارجمعیتی) باید صفر شود. انحراف از صفر یعنی آمیزش، یعنی دست‌کم یکی از جمعیت‌ها آمیزه‌ای است. به این ترتیب می‌توان وجود جمعیتی را نتیجه گرفت که هیچ نمونهٔ ناآمیخته‌ای از آن در دست نیست؛ رایش به آن «روح» می‌گوید.", "en": "The idea: if four populations were related by a simple branching tree, a simple statistic (the four-population test) should be zero. A deviation from zero signals mixture, so at least one population is a mixture. This lets researchers infer a population for which no unmixed sample exists, which Reich calls a 'ghost'.", "nl": "The idea: if four populations were related by a simple branching tree, a simple statistic (the four-population test) should be zero. A deviation from zero signals mixture, so at least one population is a mixture. This lets researchers infer a population for which no unmixed sample exists, which Reich calls a 'ghost'."}, "sources": ["src:a4f00f41ff"], "flags": []}, {"text": {"fa": "نمونهٔ نخست: «اوراسیایی‌های شمالیِ باستان». نیک پترسون از روی داده‌های امروزی حدس زد که چنین گروهی هم به بومیان آمریکا و هم به اروپاییان شمالی تبار داده است. سپس ژنوم پسربچه‌ای ۲۴ هزارساله از مالتا در سیبری همین را تأیید کرد. حدود یک‌سوم تبار بومیان آمریکا از این گروه و باقی از شرق آسیایی‌هاست.", "en": "First example: the 'Ancient North Eurasians'. Nick Patterson inferred from modern data that such a group contributed to both Native Americans and northern Europeans. The genome of a roughly 24,000-year-old boy from Mal'ta in Siberia then confirmed it. About a third of Native American ancestry comes from this group and the rest from East Asians.", "nl": "First example: the 'Ancient North Eurasians'. Nick Patterson inferred from modern data that such a group contributed to both Native Americans and northern Europeans. The genome of a roughly 24,000-year-old boy from Mal'ta in Siberia then confirmed it. About a third of Native American ancestry comes from this group and the rest from East Asians."}, "sources": ["src:a4f00f41ff", "src:47eeb4b276"], "flags": []}, {"text": {"fa": "نمونهٔ دوم: «اوراسیایی‌های پایه». ایوسیف لازاریدیس با همین ابزار دید که شاخه‌ای زودجداشده در تبار کشاورزان خاور نزدیک هست. تا زمان نگارش کتاب هیچ نمونهٔ مستقیمی از آن‌ها در دست نبود و رایش خودش مکان زندگی‌شان را حدس می‌نامد (شمال آفریقا؟). مردم ایران و لوانت در ده هزار سال پیش و پیش‌تر، هرکدام حدود ۵۰ درصد از این تبار داشتند.", "en": "Second example: the 'Basal Eurasians'. Using the same tools Iosif Lazaridis found an early-split lineage in the ancestry of Near Eastern farmers. At the time of the book no direct sample existed, and Reich explicitly calls their homeland a speculation (North Africa?). People in Iran and the Levant 10,000+ years ago each had about 50 percent of this ancestry.", "nl": "Second example: the 'Basal Eurasians'. Using the same tools Iosif Lazaridis found an early-split lineage in the ancestry of Near Eastern farmers. At the time of the book no direct sample existed, and Reich explicitly calls their homeland a speculation (North Africa?). People in Iran and the Levant 10,000+ years ago each had about 50 percent of this ancestry."}, "sources": ["src:a4f00f41ff", "src:92e120a792", "src:519a39f1f8"], "flags": ["editor-note"]}, {"text": {"fa": "جمع‌بندی رایش: پیش از انقلاب ژنوم همه (از جمله خودش) فکر می‌کردند خوشه‌های بزرگ امروزی بازتاب انشعاب‌های بسیار قدیمی‌اند. اما در هر جمعیتی که بررسی شده (اروپایی، جنوب آسیایی، شرق آسیایی، آفریقایی) آمیختگی بنیادی دیده شده؛ به تعبیر او آمیزش در همهٔ سطوح تاریخ دیده می‌شود. این برداشت قوی است، ولی عبارتِ «هیچ جمعیت تنهِ ناآمیخته‌ای نبوده» نتیجهٔ مدل‌های برگزیده است و جای تفسیرهای دیگر هست.", "en": "Reich's conclusion: before the genome revolution everyone, himself included, assumed today's big clusters mirror very old splits. In every population examined (European, South Asian, East Asian, African) fundamental mixture appears; in his words mixture is visible at every level of the history. This reading is strong, but the claim that there was never an unmixed trunk population rests on chosen models and allows alternative interpretations.", "nl": "Reich's conclusion: before the genome revolution everyone, himself included, assumed today's big clusters mirror very old splits. In every population examined (European, South Asian, East Asian, African) fundamental mixture appears; in his words mixture is visible at every level of the history. This reading is strong, but the claim that there was never an unmixed trunk population rests on chosen models and allows alternative interpretations."}, "sources": ["src:a4f00f41ff"], "flags": ["contested", "editor-note"]}, {"text": {"fa": "هشدارهای روش‌شناختی: آمارهٔ آمیزش نشان می‌دهد گروهی با آن ویژگی ژنتیکی وجود داشته، نه کجا و کِی زندگی می‌کرده یا چه نامی داشته است. مدل‌های آمیزش یکتا نیستند و با داده‌های بیشتر عوض می‌شوند. نام‌هایی مثل «اوراسیایی پایه» برچسب‌های مدلی‌اند، نه قوم یا ملتی واقعی.", "en": "Methodological cautions: a mixture statistic shows that a group with a certain genetic profile existed, not where or when it lived or what it was called. Mixture models are not unique and change with more data. Names such as 'Basal Eurasian' are model labels, not real peoples or nations.", "nl": "Methodological cautions: a mixture statistic shows that a group with a certain genetic profile existed, not where or when it lived or what it was called. Mixture models are not unique and change with more data. Names such as 'Basal Eurasian' are model labels, not real peoples or nations."}, "sources": [], "flags": ["contested", "editor-note"]}], "links": [{"to": "tabar:basal-eurasian-ancestry", "rel": "explains", "note": {"fa": "مدخل تفصیلی دربارهٔ اوراسیایی پایه", "en": "Detailed entry on Basal Eurasians", "nl": "Detailed entry on Basal Eurasians"}}, {"to": "tabar:ancient-dna", "rel": "part-of", "note": {"fa": "دی‌ان‌ای باستانی «ارواح» را نمونه‌دار می‌کند", "en": "Ancient DNA turns 'ghosts' into samples", "nl": "Ancient DNA turns 'ghosts' into samples"}}, {"to": "tabar:near-east-first-farmers-structure", "rel": "see-also", "note": {"fa": "ساختار جمعیت نخستین کشاورزان خاور نزدیک", "en": "Population structure of the first Near Eastern farmers", "nl": "Population structure of the first Near Eastern farmers"}}, {"to": "tabar:race-ancestry-reich-ethics", "rel": "see-also", "note": {"fa": "پیامد برای مفهوم نژاد", "en": "Implications for the idea of race", "nl": "Implications for the idea of race"}}], "people": ["core:nick-patterson", "core:iosif-lazaridis", "core:eske-willerslev"], "sources": ["src:47eeb4b276", "src:519a39f1f8", "src:92e120a792", "src:a4f00f41ff"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:medical-genetics", "kind": "field", "title": {"fa": "ژنتیک پزشکی و جامعه", "en": "Medical genetics & society", "nl": "Medische genetica & samenleving"}, "aliases": [], "parent": "tabar:tabar", "field": null, "summary": {"fa": "ازدواج خویشاوندی، غربالگری و مشاورهٔ ژنتیک: دانش ژنتیک در خدمت سلامت یک جامعه چه شکلی دارد؟", "en": "Consanguinity, screening and genetic counselling: what does genetics in the service of a society's health look like?", "nl": "Verwantschapshuwelijken, screening en genetische counseling: hoe ziet genetica in dienst van de volksgezondheid eruit?"}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:race-ancestry-reich-ethics", "kind": "concept", "title": {"fa": "نژاد، تبار و اخلاق: استدلال رایش دربارهٔ «تفاوت‌های میانگین» میان جمعیت‌ها", "en": "Race, ancestry and ethics: Reich's argument about 'average differences' between populations", "nl": "Ras, afstamming en ethiek: Reichs betoog over 'gemiddelde verschillen' tussen populaties"}, "aliases": [], "parent": "tabar:genetics-society", "field": "tabar:genetics-society", "summary": {"fa": "رایش می‌گوید اجماع ضدنژادیِ قرن بیستم درست بود که «نژاد زیستی» را رد کرد، اما به این برداشت تبدیل شد که تفاوت‌های ژنتیکی میان جمعیت‌ها را باید نادیده گرفت. او با آن موافق نیست و می‌گوید «تبار» را باید جایگزین «نژاد» کرد. در همان حال تصور قالبی نژادپرستانه را نادرست می‌داند. بسیاری از دانشمندان و انسان‌شناسان نظر او را پرمناقشه می‌دانند و بخشی از شواهدش (مثل انتخاب چندژنی ارتفاع) بعداً تضعیف شده است.", "en": "Reich argues that the twentieth-century consensus was right to reject 'biological race' but hardened into the notion that genetic differences between populations should be ignored. He disagrees and says 'ancestry' should replace 'race'. At the same time he regards racist stereotypes as baseless. Many scientists and anthropologists find his position contentious, and part of his evidence (such as polygenic selection on height) has since been weakened.", "nl": "Reich stelt dat de anti-racistische consensus terecht 'biologisch ras' verwierp, maar verhardde tot het idee dat genetische verschillen tussen populaties genegeerd moeten worden. Hij pleit ervoor 'afstamming' te gebruiken in plaats van 'ras'. Veel wetenschappers vinden zijn positie omstreden, en een deel van zijn bewijs is later verzwakt."}, "points": [{"text": {"fa": "پس‌زمینه: آشلی مونتاگیو (۱۹۴۲) نژاد را مفهومی اجتماعی دانست، و ریچارد لوونتین (۱۹۷۲) نشان داد حدود ۸۵ درصد تنوع پروتئینی خونی درون گروه‌ها و فقط حدود ۱۵ درصد میان «نژادهاست». رایش این را درست می‌داند، ولی می‌گوید همین یافته به «اصل مسلم» تبدیل شد که تفاوت‌های میان جمعیت‌ها در عم
