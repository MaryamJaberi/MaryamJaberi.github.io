<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>تبار و ژنتیک — دانش‌سرا</title>
<link rel="stylesheet" href="../core/design/tokens.css">
<style>
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);min-height:var(--header-h)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--ink)}
.brand svg{width:26px;height:26px;color:var(--primary)}
.crumbs{font-size:var(--small);color:var(--ink-2)}.crumbs a{color:var(--ink-2)}
.lang{display:flex;gap:2px;border:1px solid var(--line-strong);border-radius:var(--r-full);padding:2px}
.lang button{font:inherit;font-size:var(--chip);padding:4px 10px;border:0;border-radius:var(--r-full);background:transparent;color:var(--ink-2);cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
main{padding-block:var(--s6) var(--s16)}
.hero{display:grid;gap:var(--s3);margin-bottom:var(--s6)}
.hero h1{margin:0}
.hero p{color:var(--ink-2);font-size:1.05rem;max-width:70ch;margin:0}
.draft{display:inline-flex;align-items:center;gap:8px;font-size:var(--chip);padding:4px 12px;border-radius:var(--r-full);background:var(--warn-bg,#FBF1D9);color:var(--warn-ink,#6B4E00);border:1px solid var(--warn-line,#E8D39A)}
.search{display:flex;gap:8px;margin:var(--s4) 0}
.search input{font:inherit;flex:1;min-width:0;padding:10px 14px;border-radius:var(--r-md);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink)}
.fields{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:var(--s6)}
.fields button{font:inherit;font-size:var(--small);padding:6px 14px;border-radius:var(--r-full);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer}
.fields button[aria-pressed=true]{background:var(--primary);color:#fff;border-color:var(--primary)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--s4)}
.grid .card{padding:var(--s5);display:grid;gap:8px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.grid .card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.grid h3{margin:0;font-size:var(--h4)}
.grid p{margin:0;color:var(--ink-2);font-size:var(--small);line-height:1.75;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.kick{font-size:var(--chip);color:var(--primary);font-weight:700}
.sub{color:var(--ink-3);font-size:var(--small);direction:ltr;text-align:start;unicode-bidi:isolate}
[dir=rtl] .sub{text-align:right}
.fsec{margin-bottom:var(--s8)} .fsec h2{font-size:var(--h3);margin:0 0 var(--s1)} .fsec>p{margin:0 0 var(--s4);color:var(--ink-2);max-width:70ch}
article.detail{display:grid;gap:var(--s5);max-width:78ch}
article.detail h1{margin:0}
article.detail .lead{font-size:1.1rem;line-height:1.9;margin:0}
.back{font:inherit;font-size:var(--small);border:0;background:transparent;color:var(--primary);cursor:pointer;padding:0;text-align:start}
.pts{display:grid;gap:var(--s3);margin:0;padding:0;list-style:none}
.pts li{padding:var(--s4) var(--s5);border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);line-height:1.85;position:relative}
.pts li .ref{font-size:var(--chip);color:var(--ink-3);display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.flag{font-size:var(--chip);padding:1px 8px;border-radius:var(--r-full);border:1px solid}
.flag.unreplicated{color:#8A2E2E;border-color:#E3B4B4;background:#FBEDED}
.flag.contested{color:#6B4E00;border-color:#E8D39A;background:#FBF1D9}
.flag.dated{color:var(--ink-2);border-color:var(--line-strong)}
.flag.editor-note{color:var(--primary);border-color:var(--primary)}
h2.sec{font-size:var(--small);color:var(--ink-2);font-weight:600;margin:var(--s2) 0 0;text-transform:uppercase;letter-spacing:.04em}
.links{display:grid;gap:6px}
.links a{display:flex;gap:10px;align-items:baseline;padding:8px 12px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--ink)}
.links a:hover{border-color:var(--primary)}
.links .rel{font-size:var(--chip);color:var(--primary);min-width:7em}
.links .nt{font-size:var(--small);color:var(--ink-2)}
.links .ext{font-size:var(--chip);color:var(--ink-3)}
.ppl{display:flex;flex-wrap:wrap;gap:6px}
.ppl span{font-size:var(--small);padding:4px 10px;border-radius:var(--r-full);border:1px solid var(--line-strong);background:var(--surface)}
.ppl small{color:var(--ink-3)}
.iran{border-inline-start:4px solid var(--primary);padding:var(--s4) var(--s5);border-radius:var(--r-md);background:var(--surface);display:grid;gap:8px}
.iran .q{font-weight:700}
.grade{display:inline-block;font-size:var(--chip);padding:1px 8px;border-radius:var(--r-full);background:var(--ink);color:var(--paper)}
ol.src{direction:ltr;text-align:left;padding-inline-start:1.4em;margin:0;display:grid;gap:6px;font-size:var(--small);color:var(--ink-2);line-height:1.7}
ol.src a{color:var(--primary)}
.status{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:var(--small);color:var(--ink-3)}
footer.foot{border-top:1px solid var(--line);padding-block:var(--s8);color:var(--ink-3);font-size:var(--small)}
@media (prefers-color-scheme: dark){:root:not([data-theme=light]) .flag.unreplicated{background:#3A1F1F;color:#F2B8B8;border-color:#6B3A3A} :root:not([data-theme=light]) .flag.contested,:root:not([data-theme=light]) .draft{background:#3A3010;color:#F0D78A;border-color:#6B5A2A}}
:root[data-theme=dark] .flag.unreplicated{background:#3A1F1F;color:#F2B8B8;border-color:#6B3A3A} :root[data-theme=dark] .flag.contested,:root[data-theme=dark] .draft{background:#3A3010;color:#F0D78A;border-color:#6B5A2A}
</style>

<script>
const D = {"wiki": "tabar", "order": ["tabar:behavior-genetics", "tabar:population-genetics", "tabar:human-evolution", "tabar:epigenetics", "tabar:medical-genetics", "tabar:genealogy", "tabar:genetics-society"], "concepts": [{"id": "tabar:heritability", "kind": "concept", "title": {"fa": "وراثت‌پذیری", "en": "Heritability", "nl": "Erfelijkheid"}, "aliases": ["heritability", "وراثت پذیری"], "parent": "tabar:behavior-genetics", "field": "tabar:behavior-genetics", "summary": {"fa": "وراثت‌پذیری نسبتی از تفاوت‌های یک صفت در یک جمعیت است که به تفاوت‌های ژنتیکی برمی‌گردد؛ دربارهٔ یک فرد، یا دربارهٔ تغییرپذیری، هیچ نمی‌گوید.", "en": "Heritability is the share of differences in a trait within a population that traces to genetic differences; it says nothing about an individual, nor about changeability.", "nl": "Erfelijkheid is het aandeel van de verschillen in een eigenschap binnen een populatie dat teruggaat op genetische verschillen; het zegt niets over een individu, noch over veranderbaarheid."}, "points": [{"text": {"fa": "فراتحلیل ۵۰ سال مطالعهٔ دوقلوها (۱۴٬۵۵۸٬۹۰۳ جفت دوقلو، ۱۷٬۸۰۴ صفت): همهٔ صفات انسانی وراثت‌پذیرند؛ میانگین ۴۹ درصد.", "en": "Meta-analysis of 50 years of twin studies (14,558,903 twin pairs, 17,804 traits): all human traits are heritable; the average is 49 percent.", "nl": "Meta-analysis of 50 years of twin studies (14,558,903 twin pairs, 17,804 traits): all human traits are heritable; the average is 49 percent."}, "sources": ["src:06c7402bec"], "flags": []}, {"text": {"fa": "وراثت‌پذیری ۵۰ درصد یعنی نیمی از تفاوت‌های بین افراد در آن جمعیت و آن محیط ژنتیکی است، نه اینکه نیمی از صفتِ یک نفر ژنتیکی است.", "en": "Heritability of 50 percent means half the differences between people in that population and environment are genetic, not that half of one person's trait is genetic.", "nl": "Heritability of 50 percent means half the differences between people in that population and environment are genetic, not that half of one person's trait is genetic."}, "sources": ["src:ba8f3ee8f4"], "flags": []}, {"text": {"fa": "مثال کلاسیک: قد بسیار وراثت‌پذیر است و با این حال میانگین قد در یک قرن ده‌ها سانتی‌متر بالا رفته؛ وراثت‌پذیری بالا با تغییر محیطی بزرگ سازگار است.", "en": "Classic example: height is highly heritable, yet average height rose by many centimetres in a century; high heritability is compatible with large environmental change.", "nl": "Classic example: height is highly heritable, yet average height rose by many centimetres in a century; high heritability is compatible with large environmental change."}, "sources": ["src:1deae47297"], "flags": []}, {"text": {"fa": "«قانون اول» ترکهایمر: همهٔ صفات رفتاری انسان وراثت‌پذیرند. قانون دوم: اثر بزرگ شدن در یک خانواده کوچک‌تر از اثر ژن‌هاست. قانون سوم: بخش بزرگی از واریانس را نه ژن توضیح می‌دهد نه خانواده.", "en": "Turkheimer's first law: all human behavioural traits are heritable. Second: the effect of being raised in the same family is smaller than the effect of genes. Third: a large share of variance is explained by neither genes nor families.", "nl": "Turkheimer's first law: all human behavioural traits are heritable. Second: the effect of being raised in the same family is smaller than the effect of genes. Third: a large share of variance is explained by neither genes nor families."}, "sources": ["src:ba8f3ee8f4"], "flags": []}], "links": [{"to": "tabar:twin-adoption", "rel": "measured-by", "note": {"fa": "با مطالعهٔ دوقلوها و فرزندخواندگی برآورد می‌شود", "en": "Estimated with twin and adoption studies", "nl": "Estimated with twin and adoption studies"}}, {"to": "tabar:gene-environment", "rel": "explains", "note": {"fa": "چرا عدد وراثت‌پذیری در محیط‌های مختلف فرق می‌کند", "en": "Why the heritability figure differs across environments", "nl": "Why the heritability figure differs across environments"}}, {"to": "tabar:genetic-essentialism", "rel": "critiques", "note": {"fa": "سوءبرداشت رایج: «ژنتیکی یعنی سرنوشت»", "en": "Common misreading: \"genetic means destiny\"", "nl": "Common misreading: \"genetic means destiny\""}}], "people": ["core:robert-plomin", "core:eric-turkheimer"], "sources": ["src:06c7402bec", "src:1deae47297", "src:ba8f3ee8f4"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:human-evolution", "kind": "field", "title": {"fa": "تکامل انسان", "en": "Human evolution", "nl": "Menselijke evolutie"}, "aliases": [], "parent": "tabar:tabar", "field": null, "summary": {"fa": "انسان خردمند چگونه پدید آمد، با چه خویشاوندانی آمیخت و چرا این‌قدر اجتماعی شد؟", "en": "How did Homo sapiens arise, whom did it mix with, and why did it become so social?", "nl": "Hoe ontstond Homo sapiens, met wie vermengde hij zich en waarom werd hij zo sociaal?"}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:thalassemia-screening", "kind": "concept", "title": {"fa": "برنامهٔ ملی غربالگری تالاسمی ایران", "en": "Iran's national thalassaemia screening programme", "nl": "Het Iraanse nationale screeningsprogramma voor thalassemie"}, "aliases": [], "parent": "tabar:medical-genetics", "field": "tabar:medical-genetics", "summary": {"fa": "از ۱۹۹۷ غربالگری ناقلان تالاسمی پیش از ازدواج در ایران اجباری شد، همراه با مشاوره و بعدها تشخیص پیش از تولد. یکی از معدود برنامه‌های ژنتیک جمعیتی موفق در کشورهای با درآمد متوسط، و الگویی که در BMJ معرفی شد.", "en": "From 1997 premarital carrier screening for thalassaemia became mandatory in Iran, with counselling and later prenatal diagnosis. One of the few successful population-genetics programmes in a middle-income country, presented as a model in the BMJ.", "nl": "Vanaf 1997 werd premaritale dragerscreening voor thalassemie in Iran verplicht, met counseling en later prenatale diagnostiek. Een van de weinige geslaagde populatiegenetische programma's in een middeninkomensland, in de BMJ als model gepresenteerd."}, "points": [{"text": {"fa": "صمدوت و مودل (۲۰۰۴): زوج‌های هر دو ناقل، مشاوره می‌گیرند و می‌توانند ازدواج نکنند، ازدواج کنند و تشخیص پیش از تولد انجام دهند، یا خطر را بپذیرند؛ در سال‌های اول، تولد نوزادان مبتلا در استان‌های هدف به‌طور چشمگیری کاهش یافت.", "en": "Samavat and Modell (2004): couples who are both carriers receive counselling and may not marry, marry and use prenatal diagnosis, or accept the risk; in the first years the birth of affected infants fell markedly in the target provinces.", "nl": "Samavat and Modell (2004): couples who are both carriers receive counselling and may not marry, marry and use prenatal diagnosis, or accept the risk; in the first years the birth of affected infants fell markedly in the target provinces."}, "sources": ["src:0aa129f24c"], "flags": []}, {"text": {"fa": "درس‌های برنامه: ادغام در نظام بهداشت اولیه، حمایت رهبران مذهبی از مجوز سقط درمانی (فتوای ۱۹۹۷)، و احترام به انتخاب زوج به جای ممنوعیت.", "en": "Lessons of the programme: integration in primary health care, religious leaders' support for a therapeutic abortion permit (1997 ruling), and respect for the couple's choice rather than prohibition.", "nl": "Lessons of the programme: integration in primary health care, religious leaders' support for a therapeutic abortion permit (1997 ruling), and respect for the couple's choice rather than prohibition."}, "sources": ["src:0aa129f24c"], "flags": []}], "links": [{"to": "tabar:consanguinity", "rel": "applies-to", "note": {"fa": "چرا غربالگری در ایران اهمیت ویژه دارد", "en": "Why screening matters especially in Iran", "nl": "Why screening matters especially in Iran"}}, {"to": "atlas:genethics", "rel": "bridges", "note": {"fa": "پل اخلاق ژنتیک", "en": "The genetic ethics bridge", "nl": "The genetic ethics bridge"}}], "people": ["core:bernadette-modell"], "sources": ["src:0aa129f24c"], "booklets": [], "origin": null, "iran": "iran:thalassemia-screening", "wikidata": null, "status": "draft"}, {"id": "tabar:epigenetic-marks", "kind": "concept", "title": {"fa": "نشانه‌های اپی‌ژنتیک", "en": "Epigenetic marks", "nl": "Epigenetische merktekens"}, "aliases": [], "parent": "tabar:epigenetics", "field": "tabar:epigenetics", "summary": {"fa": "متیل شدن دی‌ان‌ای و تغییر هیستون‌ها تعیین می‌کنند کدام ژن‌ها در کدام سلول خوانده شوند؛ این نشانه‌ها با تغذیه، استرس و سن تغییر می‌کنند. اپی‌ژنتیک واقعی و مهم است، اما بیشتر آنچه در رسانه‌ها «اپی‌ژنتیک» خوانده می‌شود، گمانه است.", "en": "DNA methylation and histone changes determine which genes are read in which cell; these marks change with nutrition, stress and age. Epigenetics is real and important, but much of what the media call \"epigenetics\" is speculation.", "nl": "DNA-methylering en histonveranderingen bepalen welke genen in welke cel worden afgelezen; deze merktekens veranderen met voeding, stress en leeftijd. Epigenetica is echt en belangrijk, maar veel van wat de media \"epigenetica\" noemen, is speculatie."}, "points": [{"text": {"fa": "قحطی هلند (زمستان ۱۹۴۴–۴۵): افرادی که در اوایل بارداری در معرض قحطی بودند، شش دهه بعد متیل شدن کمتری در ژن IGF2 داشتند؛ شاهدی که محیط پیش از تولد ردی ماندگار در تنظیم ژن می‌گذارد.", "en": "The Dutch Hunger Winter (1944–45): people exposed to famine in early gestation had less methylation of the IGF2 gene six decades later; evidence that the prenatal environment leaves a lasting trace in gene regulation.", "nl": "The Dutch Hunger Winter (1944–45): people exposed to famine in early gestation had less methylation of the IGF2 gene six decades later; evidence that the prenatal environment leaves a lasting trace in gene regulation."}, "sources": ["src:540fb9c6d0"], "flags": []}, {"text": {"fa": "«ساعت اپی‌ژنتیک» از الگوی متیل شدن سن زیستی را برآورد می‌کند و با سلامت و مرگ‌ومیر همبسته است؛ ابزار پژوهشی امیدبخش، هنوز نه ابزار بالینی.", "en": "The \"epigenetic clock\" estimates biological age from methylation patterns and correlates with health and mortality; a promising research tool, not yet a clinical one.", "nl": "The \"epigenetic clock\" estimates biological age from methylation patterns and correlates with health and mortality; a promising research tool, not yet a clinical one."}, "sources": ["src:07fb5aa7b9"], "flags": ["editor-note"]}], "links": [{"to": "tabar:transgenerational", "rel": "see-also", "note": {"fa": "آیا به نسل بعد می‌رسد؟", "en": "Does it reach the next generation?", "nl": "Does it reach the next generation?"}}, {"to": "psy:n-stress", "rel": "bridges", "note": {"fa": "استرس و مغز در ویکی روان", "en": "Stress and the brain in the psychology wiki", "nl": "Stress and the brain in the psychology wiki"}}], "people": ["core:bas-heijmans"], "sources": ["src:07fb5aa7b9", "src:540fb9c6d0"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:tabar", "kind": "root", "title": {"fa": "تبار و ژنتیک", "en": "Lineage & Genetics", "nl": "Afstamming & genetica"}, "aliases": [], "parent": null, "field": null, "summary": {"fa": "از کجا آمده‌ایم و چه‌قدر از آنچه هستیم به ارث رسیده؟ این ویکی ژنتیک رفتاری، تاریخ ژنومیِ جمعیت‌ها، تکامل انسان، اپی‌ژنتیک و تبارشناسی را کنار هم می‌گذارد؛ با تأکید بر اینکه «وراثتی» به معنی «تغییرناپذیر» نیست.", "en": "Where do we come from, and how much of who we are is inherited? This wiki brings together behaviour genetics, the genomic history of populations, human evolution, epigenetics and genealogy, stressing that \"heritable\" does not mean \"unchangeable\".", "nl": "Waar komen we vandaan, en hoeveel van wie we zijn is geërfd? Deze wiki brengt gedragsgenetica, de genomische geschiedenis van bevolkingen, menselijke evolutie, epigenetica en genealogie samen, met de nadruk dat \"erfelijk\" niet \"onveranderlijk\" betekent."}, "points": [], "links": [{"to": "psy:psych-genetics", "rel": "bridges", "note": {"fa": "ژنتیک روان‌پزشکی در ویکی روان", "en": "Psychiatric genetics in the psychology wiki", "nl": "Psychiatric genetics in the psychology wiki"}}, {"to": "psy:cultural-evolution", "rel": "bridges", "note": {"fa": "تکامل فرهنگی", "en": "Cultural evolution", "nl": "Cultural evolution"}}, {"to": "psy:anthropology", "rel": "bridges", "note": {"fa": "انسان‌شناسی", "en": "Anthropology", "nl": "Anthropology"}}], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:nature-of-nurture", "kind": "concept", "title": {"fa": "ژن‌های والدین به‌عنوان محیط فرزند", "en": "Genetic nurture", "nl": "Genetische opvoeding"}, "aliases": [], "parent": "tabar:behavior-genetics", "field": "tabar:behavior-genetics", "summary": {"fa": "ژن‌هایی که والدین به فرزند نمی‌دهند هم روی او اثر می‌گذارند: از راه رفتار و محیطی که همان ژن‌ها در والدین می‌سازند. مرز ژن و محیط این‌جا محو می‌شود.", "en": "Even the genes parents do not pass on affect the child, through the behaviour and environment those genes create in the parents. Here the boundary between gene and environment dissolves.", "nl": "Ook de genen die ouders niet doorgeven, beïnvloeden het kind, via het gedrag en de omgeving die die genen bij de ouders scheppen. Hier vervaagt de grens tussen gen en omgeving."}, "points": [{"text": {"fa": "کُنگ و همکاران (۲۰۱۸، ایسلند): آللِ‌های والدین که به فرزند منتقل نشده بودند، حدود ۳۰ درصدِ اثرِ آلل‌های منتقل‌شده را روی تحصیلات فرزند داشتند.", "en": "Kong et al. (2018, Iceland): parental alleles not transmitted to the child had about 30 percent of the effect on the child's education that transmitted alleles had.", "nl": "Kong et al. (2018, Iceland): parental alleles not transmitted to the child had about 30 percent of the effect on the child's education that transmitted alleles had."}, "sources": ["src:0d7705b088"], "flags": []}, {"text": {"fa": "پیامد: بخشی از «وراثت‌پذیری» صفات اجتماعی در واقع از راه محیط عمل می‌کند؛ نمره‌های چندژنی بین خانواده‌ها این دو را قاطی می‌کنند.", "en": "Implication: part of the \"heritability\" of social traits actually operates through environment; between-family polygenic scores mix the two.", "nl": "Implication: part of the \"heritability\" of social traits actually operates through environment; between-family polygenic scores mix the two."}, "sources": ["src:4e5c76eea4"], "flags": []}], "links": [{"to": "tabar:gwas-polygenic", "rel": "critiques", "note": {"fa": "چرا نمرهٔ چندژنی درون خانواده ضعیف‌تر است", "en": "Why polygenic scores weaken within families", "nl": "Why polygenic scores weaken within families"}}, {"to": "tabar:gene-environment", "rel": "part-of", "note": {"fa": "نوعی همبستگی منفعل ژن–محیط", "en": "A kind of passive gene–environment correlation", "nl": "A kind of passive gene–environment correlation"}}], "people": [], "sources": ["src:0d7705b088", "src:4e5c76eea4"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:lactase-gene-culture", "kind": "concept", "title": {"fa": "تداوم لاکتاز: نمونهٔ هم‌تکاملی ژن و فرهنگ", "en": "Lactase persistence: a case of gene–culture coevolution", "nl": "Lactasepersistentie: een geval van gen-cultuur-co-evolutie"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "بیشتر پستانداران بعد از شیرخوارگی توان هضم شیر را از دست می‌دهند؛ در جمعیت‌هایی که دامداری کردند، جهش‌هایی که هضم شیر را تا بزرگسالی نگه می‌دارند در چند هزار سال رایج شد. فرهنگ (دامداری) ژن را انتخاب کرد.", "en": "Most mammals lose the ability to digest milk after infancy; in populations that kept cattle, mutations that keep milk digestion into adulthood became common within a few thousand years. Culture (herding) selected the gene.", "nl": "De meeste zoogdieren verliezen na de zuigelingentijd het vermogen melk te verteren; in bevolkingen die vee hielden, werden mutaties die melkvertering tot in de volwassenheid behouden binnen enkele duizenden jaren gangbaar. Cultuur (veeteelt) selecteerde het gen."}, "points": [{"text": {"fa": "تیشکوف و همکاران (۲۰۰۷): در شرق آفریقا جهش‌هایی متفاوت از جهش اروپایی، به‌طور مستقل، تداوم لاکتاز ایجاد کرده‌اند؛ تکامل همگرا زیر فشار یک شیوهٔ زندگی مشترک.", "en": "Tishkoff et al. (2007): in East Africa mutations different from the European one independently produced lactase persistence; convergent evolution under the pressure of a shared way of life.", "nl": "Tishkoff et al. (2007): in East Africa mutations different from the European one independently produced lactase persistence; convergent evolution under the pressure of a shared way of life."}, "sources": ["src:e6dfee157f"], "flags": []}, {"text": {"fa": "این یکی از قوی‌ترین نمونه‌های انتخاب طبیعی اخیر در انسان است و نشان می‌دهد تکامل انسان با کشاورزی متوقف نشد، بلکه شتاب گرفت.", "en": "This is one of the strongest examples of recent natural selection in humans and shows that human evolution did not stop with agriculture but accelerated.", "nl": "This is one of the strongest examples of recent natural selection in humans and shows that human evolution did not stop with agriculture but accelerated."}, "sources": ["src:d8fb384d44"], "flags": []}], "links": [{"to": "atlas:geneculture", "rel": "part-of", "note": {"fa": "پل هم‌تکاملی ژن و فرهنگ", "en": "The gene–culture coevolution bridge", "nl": "The gene–culture coevolution bridge"}}, {"to": "psy:cultural-evolution", "rel": "bridges", "note": {"fa": "تکامل فرهنگی", "en": "Cultural evolution", "nl": "Cultural evolution"}}], "people": ["core:sarah-tishkoff", "core:luigi-luca-cavalli-sforza"], "sources": ["src:d8fb384d44", "src:e6dfee157f"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:genealogy", "kind": "field", "title": {"fa": "تبارشناسی و شجره", "en": "Genealogy", "nl": "Genealogie"}, "aliases": [], "parent": "tabar:tabar", "field": null, "summary": {"fa": "شجره‌نامه‌ها، آزمون‌های تجاری تبار و ریاضیِ نیاکان مشترک: از یک نفر چند نیا داریم و چرا همهٔ ما خویشاوندیم؟", "en": "Family trees, commercial ancestry tests and the mathematics of common ancestors: how many ancestors do we have, and why are we all related?", "nl": "Stambomen, commerciële afstammingstests en de wiskunde van gemeenschappelijke voorouders: hoeveel voorouders hebben we, en waarom zijn we allemaal verwant?"}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:iranian-genetic-diversity", "kind": "concept", "title": {"fa": "تنوع ژنتیکی مردم ایران", "en": "Genetic diversity of the Iranian population", "nl": "Genetische diversiteit van de Iraanse bevolking"}, "aliases": ["Iranome", "ایرانوم"], "parent": "tabar:population-genetics", "field": "tabar:population-genetics", "summary": {"fa": "ایرانیان یکی از ناهمگن‌ترین جمعیت‌های ژنتیکی خاورمیانه‌اند؛ گروه‌های بزرگ (فارس، کرد، لر، آذری، عرب) به هم نزدیک‌اند و چند گروه (بلوچ، ترکمن، سیستانی) تمایز بیشتری دارند؛ و بخش قابل توجهی از واریانت‌های ایرانی در پایگاه‌های داده جهانی غایب است.", "en": "Iranians are among the most genetically heterogeneous populations of the Middle East; the large groups (Persians, Kurds, Lurs, Azeris, Arabs) are close to one another while a few (Baloch, Turkmen, Sistani) are more distinct; and a notable share of Iranian variants is absent from global databases.", "nl": "Iraniërs behoren tot de genetisch meest heterogene bevolkingen van het Midden-Oosten; de grote groepen (Perzen, Koerden, Loeren, Azeri's, Arabieren) liggen dicht bij elkaar terwijl enkele (Beloetsji, Turkmenen, Sistani) meer afwijken; en een opmerkelijk deel van de Iraanse varianten ontbreekt in wereldwijde databanken."}, "points": [{"text": {"fa": "مهرجو و همکاران (۲۰۱۹): ۱٬۰۲۱ نفر از ۱۱ گروه قومی؛ ایرانیان خوشهٔ «ایرانی مرکزی» بزرگی تشکیل می‌دهند و تمایز بین‌گروهی در کل کم اما در بلوچ‌ها، ترکمن‌ها و سیستانی‌ها بیشتر است؛ نشانه‌هایی از انزوای تاریخی و آمیزش با همسایگان شرقی.", "en": "Mehrjoo et al. (2019): 1,021 people from 11 ethnic groups; Iranians form a large \"central Iranian\" cluster with low overall between-group differentiation, higher among Baloch, Turkmen and Sistani; signs of historical isolation and admixture with eastern neighbours.", "nl": "Mehrjoo et al. (2019): 1,021 people from 11 ethnic groups; Iranians form a large \"central Iranian\" cluster with low overall between-group differentiation, higher among Baloch, Turkmen and Sistani; signs of historical isolation and admixture with eastern neighbours."}, "sources": ["src:02461bf7f4"], "flags": []}, {"text": {"fa": "ایرانوم (۲۰۱۹): توالی اگزوم ۸۰۰ نفر از ۸ گروه قومی؛ درصد قابل توجهی از واریانت‌ها در پایگاه‌های بین‌المللی ثبت نشده بود؛ بدون مرجع بومی، تفسیر آزمایش‌های ژنتیک بالینی در ایران خطا دارد.", "en": "Iranome (2019): exome sequences of 800 people from 8 ethnic groups; a notable share of variants had not been recorded in international databases; without a local reference, interpreting clinical genetic tests in Iran is error-prone.", "nl": "Iranome (2019): exome sequences of 800 people from 8 ethnic groups; a notable share of variants had not been recorded in international databases; without a local reference, interpreting clinical genetic tests in Iran is error-prone."}, "sources": ["src:3c4d0940c4"], "flags": []}, {"text": {"fa": "فلات ایران در طول تاریخ چهارراه مهاجرت بوده؛ با این حال داده‌ها نشان می‌دهد لایهٔ اصلی تبار، پیوستگی طولانی با جمعیت‌های باستانی خود منطقه دارد، نه جایگزینی کامل.", "en": "The Iranian plateau has been a crossroads of migration throughout history; yet the data show that the main layer of ancestry has long continuity with the region's own ancient populations rather than full replacement.", "nl": "The Iranian plateau has been a crossroads of migration throughout history; yet the data show that the main layer of ancestry has long continuity with the region's own ancient populations rather than full replacement."}, "sources": ["src:02461bf7f4", "src:73a4e45469"], "flags": []}], "links": [{"to": "tabar:zagros-neolithic", "rel": "explains", "note": {"fa": "لایهٔ باستانی تبار ایرانیان", "en": "The ancient layer of Iranian ancestry", "nl": "The ancient layer of Iranian ancestry"}}, {"to": "tabar:gwas-polygenic", "rel": "applies-to", "note": {"fa": "چرا پنل مرجع بومی لازم است", "en": "Why a local reference panel is needed", "nl": "Why a local reference panel is needed"}}, {"to": "tabar:consanguinity", "rel": "see-also", "note": {"fa": "ساختار ازدواج و بار واریانت‌های مغلوب", "en": "Marriage structure and the load of recessive variants", "nl": "Marriage structure and the load of recessive variants"}}], "people": [], "sources": ["src:02461bf7f4", "src:3c4d0940c4", "src:73a4e45469"], "booklets": [], "origin": null, "iran": "iran:genetic-heterogeneity", "wikidata": null, "status": "draft"}, {"id": "tabar:medical-genetics", "kind": "field", "title": {"fa": "ژنتیک پزشکی و جامعه", "en": "Medical genetics & society", "nl": "Medische genetica & samenleving"}, "aliases": [], "parent": "tabar:tabar", "field": null, "summary": {"fa": "ازدواج خویشاوندی، غربالگری و مشاورهٔ ژنتیک: دانش ژنتیک در خدمت سلامت یک جامعه چه شکلی دارد؟", "en": "Consanguinity, screening and genetic counselling: what does genetics in the service of a society's health look like?", "nl": "Verwantschapshuwelijken, screening en genetische counseling: hoe ziet genetica in dienst van de volksgezondheid eruit?"}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:social-brain-evolution", "kind": "concept", "title": {"fa": "جهش اجتماعی: چرا مغز اجتماعی شدیم", "en": "The social leap: why our brains went social", "nl": "De sociale sprong: waarom ons brein sociaal werd"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "فون هیپل استدلال می‌کند بزرگ‌ترین تغییر تکاملی انسان نه ابزار، که همکاری بود: نیاکان ما وقتی از جنگل به ساوانا رانده شدند، با سنگ‌پرانیِ گروهی و تقسیم کار زنده ماندند و مغزی ساختند که برای زندگی در گروه طراحی شده است؛ با همهٔ شادی‌ها و رنج‌هایش.", "en": "Von Hippel argues that humanity's biggest evolutionary change was not tools but cooperation: when our ancestors were pushed from forest to savanna they survived by group stone-throwing and division of labour, building a brain designed for group life, with all its joys and pains.", "nl": "Von Hippel betoogt dat de grootste evolutionaire verandering van de mens niet gereedschap was maar samenwerking: toen onze voorouders van bos naar savanne werden gedreven, overleefden ze door groepsgewijs stenen gooien en arbeidsdeling, en bouwden een brein ontworpen voor groepsleven, met al zijn vreugden en pijnen."}, "points": [{"text": {"fa": "فرضیهٔ مرکزی کتاب: ایستادن روی دو پا دست‌ها را آزاد کرد، پرتاب دقیقِ گروهی شکارچیان را دور نگه داشت، و «انتخاب طبیعی» شروع کرد به پاداش دادن به کسانی که بهتر هماهنگ می‌شدند. این یک روایت تکاملیِ قابل دفاع اما آزمون‌ناپذیر به معنای دقیق است.", "en": "The book's central hypothesis: standing upright freed the hands, accurate group throwing kept predators away, and natural selection began rewarding those who coordinated better. A defensible evolutionary narrative, but not strictly testable.", "nl": "The book's central hypothesis: standing upright freed the hands, accurate group throwing kept predators away, and natural selection began rewarding those who coordinated better. A defensible evolutionary narrative, but not strictly testable."}, "sources": ["src:4fb5cf55a3"], "flags": ["editor-note"]}, {"text": {"fa": "پیامدهای روان‌شناختی که کتاب می‌شمرد: شادی ما از پیوند و جایگاه اجتماعی می‌آید، نه از ثروت مطلق؛ خودفریبی برای قانع کردن دیگران تکامل یافته؛ و نوآوری محصول «مغز جمعی» است.", "en": "Psychological consequences the book draws: our happiness comes from social bonds and standing, not absolute wealth; self-deception evolved to persuade others; innovation is the product of the \"collective brain\".", "nl": "Psychological consequences the book draws: our happiness comes from social bonds and standing, not absolute wealth; self-deception evolved to persuade others; innovation is the product of the \"collective brain\"."}, "sources": ["src:4fb5cf55a3", "src:d8fb384d44"], "flags": []}, {"text": {"fa": "این تز با نظریهٔ تکامل فرهنگی هنریک و فرضیهٔ خوداهلی‌سازی رنگهام هم‌خوان است؛ هر سه ریشهٔ ویژگی انسان را در زندگی گروهی می‌بینند.", "en": "The thesis agrees with Henrich's cultural evolution theory and Wrangham's self-domestication hypothesis; all three locate the root of human distinctiveness in group life.", "nl": "The thesis agrees with Henrich's cultural evolution theory and Wrangham's self-domestication hypothesis; all three locate the root of human distinctiveness in group life."}, "sources": ["src:d8fb384d44"], "flags": []}], "links": [{"to": "psy:cultural-evolution", "rel": "bridges", "note": {"fa": "تکامل فرهنگی و مغز جمعی", "en": "Cultural evolution and the collective brain", "nl": "Cultural evolution and the collective brain"}}, {"to": "psy:self-domestication", "rel": "bridges", "note": {"fa": "خوداهلی‌سازی", "en": "Self-domestication", "nl": "Self-domestication"}}, {"to": "psy:happiness-origins", "rel": "bridges", "note": {"fa": "خاستگاه شادی", "en": "The origins of happiness", "nl": "The origins of happiness"}}, {"to": "psy:evo-sex", "rel": "see-also", "note": {"fa": "روان‌شناسی تکاملی در ویکی روان", "en": "Evolutionary psychology in the psychology wiki", "nl": "Evolutionary psychology in the psychology wiki"}}], "people": ["core:william-von-hippel", "core:joseph-henrich", "core:richard-wrangham"], "sources": ["src:4fb5cf55a3", "src:d8fb384d44"], "booklets": [], "origin": "book:social-leap", "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:common-ancestors", "kind": "concept", "title": {"fa": "ریاضی نیاکان: چرا همه خویشاوندیم", "en": "The mathematics of ancestors: why we are all related", "nl": "De wiskunde van voorouders: waarom we allemaal verwant zijn"}, "aliases": ["pedigree collapse", "فروریزی شجره", "نیای مشترک"], "parent": "tabar:genealogy", "field": "tabar:genealogy", "summary": {"fa": "تعداد نیاکان شما در هر نسل دو برابر می‌شود و در ۳۰ نسل از جمعیت کل زمین در آن زمان بیشتر؛ پس شجره‌ها خیلی زود در هم می‌روند. مدل‌سازی نشان می‌دهد نیای مشترک همهٔ انسان‌های زنده فقط چند هزار سال پیش می‌زیسته است.", "en": "Your number of ancestors doubles each generation and within 30 generations exceeds the whole population of Earth at the time; so family trees collapse into each other quickly. Modelling shows the common ancestor of all living humans lived only a few thousand years ago.", "nl": "Uw aantal voorouders verdubbelt elke generatie en overschrijdt binnen 30 generaties de hele wereldbevolking van toen; stambomen vallen dus snel in elkaar. Modellering toont dat de gemeenschappelijke voorouder van alle levende mensen slechts enkele duizenden jaren geleden leefde."}, "points": [{"text": {"fa": "رودی، اولسن و چانگ (۲۰۰۴): با مدل‌سازی مهاجرت واقع‌بینانه، نیای مشترک همهٔ انسان‌های امروز حدود ۲ تا ۵ هزار سال پیش می‌زیسته و کمی عقب‌تر، هر کسی که آن زمان فرزندانی باقی گذاشته، نیای همهٔ ماست («نقطهٔ نیاکان یکسان»).", "en": "Rohde, Olson and Chang (2004): with realistic migration modelling, the common ancestor of all living humans lived about 2 to 5 thousand years ago, and a little earlier everyone who left descendants is an ancestor of all of us (the \"identical ancestors point\").", "nl": "Rohde, Olson and Chang (2004): with realistic migration modelling, the common ancestor of all living humans lived about 2 to 5 thousand years ago, and a little earlier everyone who left descendants is an ancestor of all of us (the \"identical ancestors point\")."}, "sources": ["src:fd409ac468"], "flags": []}, {"text": {"fa": "پیامد عملی: ادعای «از نسل فلان پادشاه یا پیامبر بودن» در این افق زمانی تقریباً دربارهٔ همه صادق است و دربارهٔ هیچ‌کس خاص نیست؛ شجره‌نامه‌های یک‌خطی تنها یکی از میلیون‌ها مسیر را دنبال می‌کنند.", "en": "Practical implication: claiming descent \"from such-and-such king or prophet\" within this horizon is roughly true of everyone and distinctive of no one; single-line pedigrees follow only one of millions of paths.", "nl": "Practical implication: claiming descent \"from such-and-such king or prophet\" within this horizon is roughly true of everyone and distinctive of no one; single-line pedigrees follow only one of millions of paths."}, "sources": ["src:fd409ac468"], "flags": ["editor-note"]}, {"text": {"fa": "از نظر ژنتیک، بعد از حدود ۷ تا ۸ نسل بیشتر نیاکان شما هیچ قطعه‌ای از دی‌ان‌ای به شما نداده‌اند: نیای شجره‌ای بودن با نیای ژنتیکی بودن فرق دارد.", "en": "Genetically, after about 7 to 8 generations most of your ancestors have passed you no DNA segment at all: being a genealogical ancestor differs from being a genetic ancestor.", "nl": "Genetically, after about 7 to 8 generations most of your ancestors have passed you no DNA segment at all: being a genealogical ancestor differs from being a genetic ancestor."}, "sources": ["src:9e55a626fc"], "flags": []}], "links": [{"to": "tabar:haplogroups", "rel": "see-also", "note": {"fa": "دو خط از هزاران", "en": "Two lines out of thousands", "nl": "Two lines out of thousands"}}, {"to": "tabar:ancestry-tests", "rel": "prerequisite", "note": {"fa": "برای فهم درصدهای آزمون تبار", "en": "For understanding ancestry-test percentages", "nl": "For understanding ancestry-test percentages"}}], "people": [], "sources": ["src:9e55a626fc", "src:fd409ac468"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:genetic-essentialism", "kind": "concept", "title": {"fa": "ذات‌گرایی ژنتیکی", "en": "Genetic essentialism", "nl": "Genetisch essentialisme"}, "aliases": [], "parent": "tabar:genetics-society", "field": "tabar:genetics-society", "summary": {"fa": "گرایش ذهن به اینکه ژن را «ذات» پنهان و تغییرناپذیر بداند: اگر چیزی ژنتیکی است، پس طبیعی، ثابت، سرنوشت و مرزبندی‌کننده است. این سوگیری شناختی مستند است و نحوهٔ خبررسانی علمی آن را تشدید یا تضعیف می‌کند.", "en": "The mind's tendency to treat genes as a hidden, unchangeable \"essence\": if something is genetic, then it is natural, fixed, fated and boundary-drawing. This cognitive bias is documented, and the way science is reported amplifies or dampens it.", "nl": "De neiging van de geest om genen te zien als een verborgen, onveranderlijke \"essentie\": als iets genetisch is, dan is het natuurlijk, vast, lotsbestemd en grensbepalend. Deze cognitieve bias is gedocumenteerd, en de manier waarop wetenschap wordt bericht versterkt of dempt haar."}, "points": [{"text": {"fa": "دار-نیمرود و هاینه (۲۰۱۱): خواندن توضیح ژنتیکی برای یک رفتار (مثلاً چاقی یا تفاوت ریاضی زن و مرد) باعث می‌شود افراد آن را تغییرناپذیرتر بدانند، کمتر خود را مسئول بدانند و کلیشه‌ها را بیشتر بپذیرند، حتی وقتی وراثت‌پذیری واقعی ناچیز است.", "en": "Dar-Nimrod and Heine (2011): reading a genetic explanation for a behaviour (e.g. obesity or sex differences in maths) makes people see it as more fixed, feel less responsible and accept stereotypes more, even when real heritability is negligible.", "nl": "Dar-Nimrod and Heine (2011): reading a genetic explanation for a behaviour (e.g. obesity or sex differences in maths) makes people see it as more fixed, feel less responsible and accept stereotypes more, even when real heritability is negligible."}, "sources": ["src:d5508c7aeb"], "flags": []}, {"text": {"fa": "پادزهر: هر بار که عدد وراثت‌پذیری می‌بینید، سه سؤال بپرسید: در کدام جمعیت؟ در کدام محیط؟ و آیا دربارهٔ تغییرپذیری چیزی می‌گوید؟ (پاسخ سومی همیشه «نه» است.)", "en": "Antidote: whenever you see a heritability figure, ask three questions: in which population? In which environment? And does it say anything about changeability? (The third answer is always \"no\".)", "nl": "Antidote: whenever you see a heritability figure, ask three questions: in which population? In which environment? And does it say anything about changeability? (The third answer is always \"no\".)"}, "sources": ["src:ba8f3ee8f4", "src:b1c0eba86d"], "flags": []}], "links": [{"to": "tabar:heritability", "rel": "critiques", "note": {"fa": "سوءبرداشت از وراثت‌پذیری", "en": "Misreading heritability", "nl": "Misreading heritability"}}, {"to": "psy:cognitive-biases", "rel": "bridges", "note": {"fa": "سوگیری‌های شناختی در ویکی روان", "en": "Cognitive biases in the psychology wiki", "nl": "Cognitive biases in the psychology wiki"}}, {"to": "psy:mindsets", "rel": "bridges", "note": {"fa": "ذهنیت رشد در برابر ثابت", "en": "Growth versus fixed mindset", "nl": "Growth versus fixed mindset"}}], "people": [], "sources": ["src:b1c0eba86d", "src:ba8f3ee8f4", "src:d5508c7aeb"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:population-genetics", "kind": "field", "title": {"fa": "ژنومیک جمعیت و تبار", "en": "Population genomics & ancestry", "nl": "Populatiegenomica & afstamming"}, "aliases": [], "parent": "tabar:tabar", "field": null, "summary": {"fa": "دی‌ان‌ای مردم امروز و استخوان‌های باستانی چه می‌گویند دربارهٔ مهاجرت‌ها، آمیزش‌ها و شکل‌گیری جمعیت‌ها؟", "en": "What do the DNA of living people and ancient bones tell about migrations, admixtures and the making of populations?", "nl": "Wat vertellen het DNA van levende mensen en oude botten over migraties, vermengingen en het ontstaan van bevolkingen?"}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:zagros-neolithic", "kind": "concept", "title": {"fa": "کشاورزان نوسنگی زاگرس", "en": "Zagros Neolithic farmers", "nl": "Neolithische boeren van de Zagros"}, "aliases": ["گنج دره", "Ganj Dareh", "Wezmeh"], "parent": "tabar:population-genetics", "field": "tabar:population-genetics", "summary": {"fa": "ژنوم افراد ۹ تا ۱۰ هزار سال پیش از غرب ایران نشان داد کشاورزی در زاگرس به دست جمعیتی جدا از کشاورزان آناتولی آغاز شد؛ جمعیتی که به تبار ایرانیان امروز، جنوب آسیا و قفقاز کمک کرده است.", "en": "Genomes of people from western Iran 9 to 10 thousand years ago showed that farming in the Zagros began among a population separate from Anatolian farmers; a population that contributed to the ancestry of today's Iranians, South Asians and the Caucasus.", "nl": "Genomen van mensen uit West-Iran van 9 tot 10 duizend jaar geleden toonden dat de landbouw in de Zagros begon bij een bevolking los van de Anatolische boeren; een bevolking die bijdroeg aan de afstamming van hedendaagse Iraniërs, Zuid-Aziaten en de Kaukasus."}, "points": [{"text": {"fa": "بروشکی و همکاران (۲۰۱۶): چهار ژنوم از گنج دره و غار وزمه (کرمانشاه) و ابدول حسین (لرستان)، ۷ تا ۱۰ هزار سال پیش؛ شباهت ژنتیکی‌شان به کشاورزان آناتولی بسیار کم بود.", "en": "Broushaki et al. (2016): four genomes from Ganj Dareh and Wezmeh Cave (Kermanshah) and Abdul Hosein (Lorestan), 7 to 10 thousand years old; their genetic similarity to Anatolian farmers was very low.", "nl": "Broushaki et al. (2016): four genomes from Ganj Dareh and Wezmeh Cave (Kermanshah) and Abdul Hosein (Lorestan), 7 to 10 thousand years old; their genetic similarity to Anatolian farmers was very low."}, "sources": ["src:22aa9386b9"], "flags": []}, {"text": {"fa": "نتیجه: کشاورزی در هلال حاصلخیز دو خاستگاه جمعیتی داشت و در زاگرس احتمالاً به‌صورت مستقل یا از راه انتقال ایده (نه مهاجرت مردم) پدید آمد.", "en": "Conclusion: farming in the Fertile Crescent had two population origins and in the Zagros likely arose independently or through the spread of ideas rather than people.", "nl": "Conclusion: farming in the Fertile Crescent had two population origins and in the Zagros likely arose independently or through the spread of ideas rather than people."}, "sources": ["src:22aa9386b9", "src:519a39f1f8"], "flags": []}, {"text": {"fa": "این تبار زاگرسی بعدها در شکل‌گیری جمعیت‌های دشت ایران، جنوب آسیا (به‌ویژه در تبار «ایرانیِ باستان» مردم هند و پاکستان) و قفقاز سهم داشت.", "en": "This Zagros ancestry later contributed to the populations of the Iranian plateau, South Asia (notably the \"ancient Iranian\" ancestry of people in India and Pakistan) and the Caucasus.", "nl": "This Zagros ancestry later contributed to the populations of the Iranian plateau, South Asia (notably the \"ancient Iranian\" ancestry of people in India and Pakistan) and the Caucasus."}, "sources": ["src:73a4e45469", "src:519a39f1f8"], "flags": []}], "links": [{"to": "tabar:ancient-dna", "rel": "part-of", "note": {"fa": "یکی از یافته‌های انقلاب دی‌ان‌ای باستانی", "en": "One finding of the ancient DNA revolution", "nl": "One finding of the ancient DNA revolution"}}, {"to": "tabar:iranian-genetic-diversity", "rel": "explains", "note": {"fa": "بخشی از ریشهٔ تنوع ژنتیکی ایرانیان امروز", "en": "Part of the root of today's Iranian genetic diversity", "nl": "Part of the root of today's Iranian genetic diversity"}}], "people": [], "sources": ["src:22aa9386b9", "src:519a39f1f8", "src:73a4e45469"], "booklets": [], "origin": null, "iran": "iran:zagros-neolithic", "wikidata": null, "status": "draft"}, {"id": "tabar:steppe-indo-iranian", "kind": "concept", "title": {"fa": "تبار استپی و زبان‌های هندوایرانی", "en": "Steppe ancestry and the Indo-Iranian languages", "nl": "Steppe-afstamming en de Indo-Iraanse talen"}, "aliases": [], "parent": "tabar:population-genetics", "field": "tabar:population-genetics", "summary": {"fa": "ژنتیک نشان می‌دهد در هزارهٔ دوم پیش از میلاد تباری از استپ اوراسیا به جنوب و میانهٔ آسیا رسید؛ این را با گسترش زبان‌های هندوایرانی پیوند می‌دهند. پیوند ژن و زبان اما استنباط است، نه مشاهده، و میان باستان‌شناسان و زبان‌شناسان محل بحث.", "en": "Genetics shows that in the second millennium BCE ancestry from the Eurasian steppe reached South and Central Asia; this is linked to the spread of Indo-Iranian languages. The gene–language link, however, is inference not observation, and is debated among archaeologists and linguists.", "nl": "Genetica toont dat in het tweede millennium v.Chr. afstamming uit de Euraziatische steppe Zuid- en Centraal-Azië bereikte; dit wordt gekoppeld aan de verspreiding van de Indo-Iraanse talen. De koppeling gen–taal is echter een gevolgtrekking, geen waarneming, en omstreden onder archeologen en taalkundigen."}, "points": [{"text": {"fa": "نراسیمهان و همکاران (۲۰۱۹): ۵۲۳ ژنوم باستانی از آسیای میانه و جنوبی؛ تبار استپی (یامنایا/سینتاشتا) در نیمهٔ دوم هزارهٔ دوم پیش از میلاد در منطقه ظاهر می‌شود و با تبار «کشاورزان ایرانی» و شکارچیان جنوب آسیا می‌آمیزد.", "en": "Narasimhan et al. (2019): 523 ancient genomes from Central and South Asia; steppe ancestry (Yamnaya/Sintashta) appears in the region in the second half of the second millennium BCE and mixes with \"Iranian farmer\" and South Asian hunter-gatherer ancestry.", "nl": "Narasimhan et al. (2019): 523 ancient genomes from Central and South Asia; steppe ancestry (Yamnaya/Sintashta) appears in the region in the second half of the second millennium BCE and mixes with \"Iranian farmer\" and South Asian hunter-gatherer ancestry."}, "sources": ["src:73a4e45469"], "flags": []}, {"text": {"fa": "همین مطالعه تأکید می‌کند تبار «ایرانیِ» جنوب آسیا از جمعیت زاگرس آمده، نه از مهاجرت هم‌زمان با کشاورزی؛ یعنی چند لایهٔ زمانی متفاوت.", "en": "The same study stresses that the \"Iranian\" ancestry of South Asia came from Zagros-related population, not from a migration contemporary with farming; several distinct time layers.", "nl": "The same study stresses that the \"Iranian\" ancestry of South Asia came from Zagros-related population, not from a migration contemporary with farming; several distinct time layers."}, "sources": ["src:73a4e45469"], "flags": []}, {"text": {"fa": "نقد: ژن زبان نمی‌گوید. تطبیق خوشهٔ ژنتیکی با «آریایی‌ها» یا یک زبان، فرضیه است و تاریخ سوءاستفاده‌های سیاسی از آن طولانی است. این صفحه پیوند ژن–زبان را «مطرح‌شده» می‌داند، نه اثبات‌شده.", "en": "Critique: genes do not speak a language. Matching a genetic cluster to \"the Aryans\" or to a language is a hypothesis, and the history of its political misuse is long. This page treats the gene–language link as proposed, not proven.", "nl": "Critique: genes do not speak a language. Matching a genetic cluster to \"the Aryans\" or to a language is a hypothesis, and the history of its political misuse is long. This page treats the gene–language link as proposed, not proven."}, "sources": ["src:8b730d2385"], "flags": ["contested", "editor-note"]}], "links": [{"to": "tabar:ancient-dna", "rel": "part-of", "note": {"fa": "یافته‌ای از دی‌ان‌ای باستانی", "en": "A finding from ancient DNA", "nl": "A finding from ancient DNA"}}, {"to": "tabar:race-biology", "rel": "see-also", "note": {"fa": "خطر سوءاستفادهٔ هویتی از خوشه‌های ژنتیکی", "en": "The risk of identity misuse of genetic clusters", "nl": "The risk of identity misuse of genetic clusters"}}], "people": ["core:david-reich"], "sources": ["src:73a4e45469", "src:8b730d2385"], "booklets": [], "origin": null, "iran": "iran:steppe-ancestry", "wikidata": null, "status": "draft"}, {"id": "tabar:ancient-dna", "kind": "concept", "title": {"fa": "انقلاب دی‌ان‌ای باستانی", "en": "The ancient DNA revolution", "nl": "De oud-DNA-revolutie"}, "aliases": [], "parent": "tabar:population-genetics", "field": "tabar:population-genetics", "summary": {"fa": "از ۲۰۱۰ به بعد خواندن ژنوم از استخوان‌های هزاران‌ساله ممکن شد و تاریخ جمعیت‌ها را بازنویسی کرد: تقریباً هیچ جمعیت امروزی «خالص» نیست؛ همه حاصل چند موج مهاجرت و آمیزش‌اند.", "en": "From 2010 on, reading genomes from bones thousands of years old became possible and rewrote population history: almost no living population is \"pure\"; all are the product of several waves of migration and admixture.", "nl": "Vanaf 2010 werd het mogelijk genomen uit duizenden jaren oude botten te lezen, wat de bevolkingsgeschiedenis herschreef: vrijwel geen levende bevolking is \"zuiver\"; alle zijn het product van meerdere migratie- en vermengingsgolven."}, "points": [{"text": {"fa": "رایش: جمعیت‌های امروزی اروپا آمیزه‌ای از دست‌کم سه جمعیت کاملاً متفاوت‌اند (شکارچی‌گردآورندگان غربی، کشاورزان آناتولی، و دامداران استپ)؛ الگوی مشابه در بیشتر مناطق جهان دیده می‌شود.", "en": "Reich: today's European populations are a mixture of at least three very different populations (western hunter-gatherers, Anatolian farmers and steppe herders); a similar pattern appears in most regions of the world.", "nl": "Reich: today's European populations are a mixture of at least three very different populations (western hunter-gatherers, Anatolian farmers and steppe herders); a similar pattern appears in most regions of the world."}, "sources": ["src:8b730d2385"], "flags": []}, {"text": {"fa": "کشاورزی در خاور نزدیک از دو جمعیت کاملاً جدا آغاز شد: کشاورزان زاگرس و کشاورزان آناتولی/شام که از نظر ژنتیکی به اندازهٔ اروپاییان و شرق آسیایی‌های امروز با هم فرق داشتند.", "en": "Farming in the Near East began among two quite separate populations: Zagros farmers and Anatolian/Levantine farmers, genetically about as different as today's Europeans and East Asians.", "nl": "Farming in the Near East began among two quite separate populations: Zagros farmers and Anatolian/Levantine farmers, genetically about as different as today's Europeans and East Asians."}, "sources": ["src:519a39f1f8", "src:22aa9386b9"], "flags": []}, {"text": {"fa": "هشدار روش‌شناختی: نمونه‌های باستانی پراکنده‌اند و «جمعیت» در این مطالعات یک خوشهٔ آماری است، نه قوم یا زبان؛ پیوند دادنش به هویت‌های امروزی کار دانش نیست.", "en": "Methodological caution: ancient samples are sparse, and a \"population\" in these studies is a statistical cluster, not an ethnicity or a language; tying it to present-day identities is not science.", "nl": "Methodological caution: ancient samples are sparse, and a \"population\" in these studies is a statistical cluster, not an ethnicity or a language; tying it to present-day identities is not science."}, "sources": ["src:8b730d2385"], "flags": ["editor-note"]}], "links": [{"to": "tabar:zagros-neolithic", "rel": "evidence-for", "note": {"fa": "نمونهٔ ایران: کشاورزان زاگرس", "en": "The Iranian case: Zagros farmers", "nl": "The Iranian case: Zagros farmers"}}, {"to": "tabar:neanderthal-admixture", "rel": "see-also", "note": {"fa": "آمیزش با نئاندرتال‌ها", "en": "Admixture with Neanderthals", "nl": "Admixture with Neanderthals"}}, {"to": "atlas:archaeogen", "rel": "part-of", "note": {"fa": "پل باستان‌ژنتیک", "en": "The archaeogenetics bridge", "nl": "The archaeogenetics bridge"}}], "people": ["core:david-reich", "core:svante-p-bo"], "sources": ["src:22aa9386b9", "src:519a39f1f8", "src:8b730d2385"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:consanguinity", "kind": "concept", "title": {"fa": "ازدواج خویشاوندی", "en": "Consanguineous marriage", "nl": "Verwantschapshuwelijk"}, "aliases": [], "parent": "tabar:medical-genetics", "field": "tabar:medical-genetics", "summary": {"fa": "ازدواج با خویشاوند نزدیک در ایران و بسیاری از کشورهای خاورمیانه و جنوب آسیا رایج است. احتمال بیماری مغلوب در فرزندان دخترعمو/پسرعمو از حدود ۲ تا ۳ درصد به ۴ تا ۶ درصد می‌رسد؛ کم نیست، ولی «فاجعه» هم نیست، و با مشاورهٔ ژنتیک قابل مدیریت است.", "en": "Marriage to a close relative is common in Iran and many countries of the Middle East and South Asia. The chance of a recessive disorder in children of first cousins rises from about 2 to 3 percent to 4 to 6 percent; not trivial, not a \"catastrophe\", and manageable with genetic counselling.", "nl": "Trouwen met een naaste verwant is gangbaar in Iran en veel landen in het Midden-Oosten en Zuid-Azië. De kans op een recessieve aandoening bij kinderen van volle neven en nichten stijgt van zo'n 2 à 3 procent naar 4 à 6 procent; niet te verwaarlozen, geen \"ramp\", en beheersbaar met genetische counseling."}, "points": [{"text": {"fa": "سعادت و همکاران (۲۰۰۴): در نمونهٔ ملی بیش از ۳۰۰ هزار زوج ایرانی، ۳۸٫۶ درصد ازدواج‌ها خویشاوندی و ۲۷٫۹ درصد بین دخترعمو/پسرعمو و معادل‌ها بود؛ با تفاوت زیاد بین استان‌ها.", "en": "Saadat et al. (2004): in a national sample of over 300 thousand Iranian couples, 38.6 percent of marriages were consanguineous and 27.9 percent between first cousins or equivalents, with large provincial differences.", "nl": "Saadat et al. (2004): in a national sample of over 300 thousand Iranian couples, 38.6 percent of marriages were consanguineous and 27.9 percent between first cousins or equivalents, with large provincial differences."}, "sources": ["src:38e3f2042a"], "flags": []}, {"text": {"fa": "سازوکار: هر فرد چند واریانت مغلوب بیماری‌زا حمل می‌کند؛ خویشاوندان احتمال بیشتری دارند همان واریانت را از نیای مشترک داشته باشند. برای همین سهم بیماری‌های مغلوب نادر در جمعیت‌های با ازدواج خویشاوندی بالاست.", "en": "Mechanism: everyone carries a few recessive disease variants; relatives are likelier to share the same variant from a common ancestor. That is why rare recessive disorders are over-represented in populations with high consanguinity.", "nl": "Mechanism: everyone carries a few recessive disease variants; relatives are likelier to share the same variant from a common ancestor. That is why rare recessive disorders are over-represented in populations with high consanguinity."}, "sources": ["src:38e3f2042a", "src:3c4d0940c4"], "flags": []}, {"text": {"fa": "نگاه متوازن: ازدواج خویشاوندی کارکردهای اجتماعی و اقتصادی دارد و در ایران رو به کاهش است؛ پاسخ علمی نه تحقیر، که غربالگری ناقلان و مشاورهٔ پیش از ازدواج است.", "en": "A balanced view: consanguinity has social and economic functions and is declining in Iran; the scientific answer is not stigma but carrier screening and premarital counselling.", "nl": "A balanced view: consanguinity has social and economic functions and is declining in Iran; the scientific answer is not stigma but carrier screening and premarital counselling."}, "sources": ["src:0aa129f24c"], "flags": ["editor-note"]}], "links": [{"to": "tabar:thalassemia-screening", "rel": "applies-to", "note": {"fa": "نمونهٔ موفق غربالگری در ایران", "en": "A successful screening example in Iran", "nl": "A successful screening example in Iran"}}, {"to": "tabar:iranian-genetic-diversity", "rel": "see-also", "note": {"fa": "واریانت‌های بومی و پایگاه مرجع", "en": "Local variants and a reference database", "nl": "Local variants and a reference database"}}], "people": [], "sources": ["src:0aa129f24c", "src:38e3f2042a", "src:3c4d0940c4"], "booklets": [], "origin": null, "iran": "iran:consanguinity", "wikidata": null, "status": "draft"}, {"id": "tabar:transgenerational", "kind": "concept", "title": {"fa": "وراثت اپی‌ژنتیک بین‌نسلی", "en": "Transgenerational epigenetic inheritance", "nl": "Transgenerationele epigenetische overerving"}, "aliases": [], "parent": "tabar:epigenetics", "field": "tabar:epigenetics", "summary": {"fa": "ادعای محبوب: ترومای پدربزرگ در ژن‌های نوه «ثبت» می‌شود. در گیاهان و کرم‌ها مستند است؛ در موش‌ها شواهدی هست؛ در انسان، شواهد مستقیم ضعیف و مطالعات کوچک و تکرارنشده‌اند. اثرهای بین‌نسلی از راه رفتار و محیط واقعی‌اند، ولی لزوماً «اپی‌ژنتیک» نیستند.", "en": "The popular claim: grandfather's trauma is \"recorded\" in the grandchild's genes. Documented in plants and worms; some evidence in mice; in humans, direct evidence is weak and the studies small and unreplicated. Intergenerational effects via behaviour and environment are real, but not necessarily \"epigenetic\".", "nl": "De populaire claim: het trauma van opa wordt \"vastgelegd\" in de genen van het kleinkind. Gedocumenteerd bij planten en wormen; enig bewijs bij muizen; bij mensen is het directe bewijs zwak en zijn de studies klein en niet gerepliceerd. Intergenerationele effecten via gedrag en omgeving zijn echt, maar niet per se \"epigenetisch\"."}, "points": [{"text": {"fa": "هورستمکه (۲۰۱۸): برای ادعای وراثت اپی‌ژنتیک واقعی در انسان باید اثر در نسلی دیده شود که هیچ تماس مستقیمی با محرک نداشته (نسل سوم از مادر، نسل دوم از پدر)، و باید عوامل ژنتیکی، فرهنگی و اکولوژیک حذف شوند؛ تقریباً هیچ مطالعهٔ انسانی این شرط‌ها را برآورده نمی‌کند.", "en": "Horsthemke (2018): to claim real epigenetic inheritance in humans, the effect must appear in a generation with no direct exposure to the stimulus (third generation via mother, second via father), and genetic, cultural and ecological factors must be excluded; almost no human study meets these conditions.", "nl": "Horsthemke (2018): to claim real epigenetic inheritance in humans, the effect must appear in a generation with no direct exposure to the stimulus (third generation via mother, second via father), and genetic, cultural and ecological factors must be excluded; almost no human study meets these conditions."}, "sources": ["src:07fb5aa7b9"], "flags": ["unreplicated"]}, {"text": {"fa": "مطالعهٔ پرارجاع فرزندان بازماندگان هولوکاست (یهودا ۲۰۱۶) ۳۲ خانواده داشت و نتایجش در تحلیل‌های بعدی تضعیف شد؛ با این حال اثر تروما بر فرزندان از راه فرزندپروری و محیط به‌خوبی مستند است.", "en": "The much-cited study of Holocaust survivors' children (Yehuda 2016) had 32 families and its results weakened under later analysis; yet the effect of trauma on children through parenting and environment is well documented.", "nl": "The much-cited study of Holocaust survivors' children (Yehuda 2016) had 32 families and its results weakened under later analysis; yet the effect of trauma on children through parenting and environment is well documented."}, "sources": ["src:07fb5aa7b9"], "flags": ["unreplicated", "editor-note"]}], "links": [{"to": "tabar:epigenetic-marks", "rel": "part-of", "note": {"fa": "سازوکار پیشنهادی", "en": "The proposed mechanism", "nl": "The proposed mechanism"}}, {"to": "psy:ptsd", "rel": "bridges", "note": {"fa": "تروما در ویکی روان", "en": "Trauma in the psychology wiki", "nl": "Trauma in the psychology wiki"}}, {"to": "tabar:genetic-essentialism", "rel": "see-also", "note": {"fa": "چرا این ادعا این‌قدر جذاب است", "en": "Why this claim is so attractive", "nl": "Why this claim is so attractive"}}], "people": [], "sources": ["src:07fb5aa7b9"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:twin-adoption", "kind": "concept", "title": {"fa": "مطالعات دوقلوها و فرزندخواندگی", "en": "Twin and adoption studies", "nl": "Tweeling- en adoptiestudies"}, "aliases": [], "parent": "tabar:behavior-genetics", "field": "tabar:behavior-genetics", "summary": {"fa": "دوقلوهای همسان در برابر ناهمسان، و فرزندخوانده‌ها در برابر خانوادهٔ زیستی و پرورشی: دو آزمایش طبیعی که ژن و محیط را از هم جدا می‌کنند.", "en": "Identical versus fraternal twins, and adoptees versus their biological and adoptive families: two natural experiments that pull genes and environment apart.", "nl": "Eeneiige versus twee-eiige tweelingen, en adoptiekinderen versus hun biologische en adoptiefamilie: twee natuurlijke experimenten die genen en omgeving uit elkaar halen."}, "points": [{"text": {"fa": "منطق: اگر دوقلوهای همسان (۱۰۰٪ ژن مشترک) در صفتی شبیه‌تر از ناهمسان‌ها (~۵۰٪) باشند، تفاوت را به ژن نسبت می‌دهیم؛ مشروط به فرض «محیط برابر».", "en": "Logic: if identical twins (100 percent shared genes) resemble each other more than fraternal twins (~50 percent), the difference is attributed to genes, given the \"equal environments\" assumption.", "nl": "Logic: if identical twins (100 percent shared genes) resemble each other more than fraternal twins (~50 percent), the difference is attributed to genes, given the \"equal environments\" assumption."}, "sources": ["src:1deae47297"], "flags": []}, {"text": {"fa": "فرزندخوانده‌ها در بزرگسالی در هوش و شخصیت به والدین زیستی که هرگز ندیده‌اند شبیه‌ترند تا به والدین پرورشی؛ این یکی از ده یافتهٔ تکرارشدهٔ ژنتیک رفتاری است.", "en": "Adult adoptees resemble biological parents they never met more than their adoptive parents in intelligence and personality; one of behaviour genetics' ten replicated findings.", "nl": "Adult adoptees resemble biological parents they never met more than their adoptive parents in intelligence and personality; one of behaviour genetics' ten replicated findings."}, "sources": ["src:1deae47297"], "flags": []}, {"text": {"fa": "نقد: فرض محیط برابر برای دوقلوهای همسان کامل برقرار نیست (با آنها شبیه‌تر رفتار می‌شود)، و این می‌تواند وراثت‌پذیری را کمی بیش‌برآورد کند.", "en": "Critique: the equal-environments assumption does not fully hold for identical twins (they are treated more alike), which may slightly inflate heritability.", "nl": "Critique: the equal-environments assumption does not fully hold for identical twins (they are treated more alike), which may slightly inflate heritability."}, "sources": ["src:ba8f3ee8f4"], "flags": ["editor-note"]}], "links": [{"to": "tabar:heritability", "rel": "measured-by", "note": {"fa": "ابزار اصلی برآورد وراثت‌پذیری", "en": "The main tool for estimating heritability", "nl": "The main tool for estimating heritability"}}, {"to": "tabar:gwas-polygenic", "rel": "contrasts", "note": {"fa": "روش جدیدتر: مستقیم از دی‌ان‌ای", "en": "The newer method: directly from DNA", "nl": "The newer method: directly from DNA"}}], "people": ["core:robert-plomin"], "sources": ["src:1deae47297", "src:ba8f3ee8f4"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:gwas-polygenic", "kind": "concept", "title": {"fa": "مطالعات گسترهٔ ژنوم و نمرهٔ چندژنی", "en": "GWAS and polygenic scores", "nl": "GWAS en polygene scores"}, "aliases": ["GWAS", "polygenic score", "PGS", "PRS"], "parent": "tabar:behavior-genetics", "field": "tabar:behavior-genetics", "summary": {"fa": "به جای جست‌وجوی «ژنِ» یک صفت، میلیون‌ها تفاوت کوچک در ژنوم صدها هزار نفر با صفت مقایسه می‌شود؛ حاصل، نمره‌ای است که اندکی پیش‌بینی می‌کند و خیلی سوءتعبیر می‌شود.", "en": "Instead of hunting for \"the gene\" of a trait, millions of tiny genome differences in hundreds of thousands of people are compared with the trait; the result is a score that predicts a little and is misread a lot.", "nl": "In plaats van te zoeken naar \"het gen\" van een eigenschap worden miljoenen kleine genoomverschillen bij honderdduizenden mensen vergeleken met de eigenschap; het resultaat is een score die weinig voorspelt en veel verkeerd wordt gelezen."}, "points": [{"text": {"fa": "مطالعهٔ ۱٫۱ میلیون نفر: ۱٬۲۷۱ واریانت مرتبط با سال‌های تحصیل؛ نمرهٔ چندژنی حاصل حدود ۱۱ تا ۱۳ درصد واریانس را در نمونه‌های مستقل توضیح می‌دهد.", "en": "Study of 1.1 million people: 1,271 variants associated with years of schooling; the resulting polygenic score explains about 11 to 13 percent of variance in independent samples.", "nl": "Study of 1.1 million people: 1,271 variants associated with years of schooling; the resulting polygenic score explains about 11 to 13 percent of variance in independent samples."}, "sources": ["src:69bb669df7"], "flags": []}, {"text": {"fa": "درون خانواده (مقایسهٔ خواهر و برادر) قدرت پیش‌بینی نمرهٔ تحصیل تقریباً نصف می‌شود: بخشی از آنچه «ژنتیکی» می‌نمود، اثر محیطِ خانواده و ژن‌های والدین بود («طبیعتِ تربیت»).", "en": "Within families (comparing siblings), the education score's predictive power roughly halves: part of what looked \"genetic\" was family environment and parental genes (\"the nature of nurture\").", "nl": "Within families (comparing siblings), the education score's predictive power roughly halves: part of what looked \"genetic\" was family environment and parental genes (\"the nature of nurture\")."}, "sources": ["src:4e5c76eea4", "src:0d7705b088"], "flags": []}, {"text": {"fa": "نمره‌های چندژنی ساخته‌شده روی جمعیت‌های اروپایی‌تبار در جمعیت‌های دیگر بسیار ضعیف‌تر کار می‌کنند؛ استفادهٔ بالینی زودهنگام می‌تواند نابرابری سلامت را بیشتر کند.", "en": "Polygenic scores built on European-ancestry populations work much worse in other populations; premature clinical use could widen health disparities.", "nl": "Polygenic scores built on European-ancestry populations work much worse in other populations; premature clinical use could widen health disparities."}, "sources": ["src:f02227bf85"], "flags": []}, {"text": {"fa": "«وراثت‌پذیری گمشده»: نمره‌های چندژنی هنوز بسیار کمتر از برآورد دوقلوها توضیح می‌دهند؛ دلایل احتمالی: واریانت‌های نادر، اثرهای بسیار کوچک، تعامل‌ها، و بیش‌برآورد دوقلوها.", "en": "\"Missing heritability\": polygenic scores still explain far less than twin estimates; likely reasons include rare variants, very small effects, interactions, and inflated twin estimates.", "nl": "\"Missing heritability\": polygenic scores still explain far less than twin estimates; likely reasons include rare variants, very small effects, interactions, and inflated twin estimates."}, "sources": ["src:88fc1feb66", "src:5cdd7ce079"], "flags": []}], "links": [{"to": "psy:psych-genetics", "rel": "evidence-for", "note": {"fa": "شکست ژن‌های کاندید افسردگی", "en": "The failure of candidate genes for depression", "nl": "The failure of candidate genes for depression"}}, {"to": "tabar:heritability", "rel": "measured-by", "note": {"fa": "برآورد وراثت‌پذیری از خودِ دی‌ان‌ای", "en": "Estimating heritability from DNA itself", "nl": "Estimating heritability from DNA itself"}}, {"to": "tabar:ancestry-tests", "rel": "see-also", "note": {"fa": "چرا پنل مرجع مهم است", "en": "Why the reference panel matters", "nl": "Why the reference panel matters"}}], "people": ["core:robert-plomin", "core:kathryn-paige-harden"], "sources": ["src:0d7705b088", "src:4e5c76eea4", "src:5cdd7ce079", "src:69bb669df7", "src:88fc1feb66", "src:f02227bf85"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:iq-heritability-debate", "kind": "concept", "title": {"fa": "بحث وراثت‌پذیری هوش و اثر فلین", "en": "The IQ heritability debate and the Flynn effect", "nl": "Het debat over erfelijkheid van IQ en het Flynn-effect"}, "aliases": [], "parent": "tabar:behavior-genetics", "field": "tabar:behavior-genetics", "summary": {"fa": "از مقالهٔ جنجالی جنسن (۱۹۶۹) تا اثر فلین: هوش درون جمعیت‌ها بسیار وراثت‌پذیر است و با این حال نمره‌های هوش در یک قرن حدود سه نمره در دهه بالا رفت. این دو واقعیت با هم سازگارند و درس مهمی دربارهٔ وراثت‌پذیری می‌دهند.", "en": "From Jensen's controversial 1969 article to the Flynn effect: IQ within populations is highly heritable, and yet IQ scores rose about three points per decade over a century. Both facts are compatible and teach an important lesson about heritability.", "nl": "Van Jensens omstreden artikel uit 1969 tot het Flynn-effect: IQ is binnen populaties sterk erfelijk, en toch stegen IQ-scores een eeuw lang met zo'n drie punten per decennium. Beide feiten zijn verenigbaar en leren iets belangrijks over erfelijkheid."}, "points": [{"text": {"fa": "جنسن (۱۹۶۹) استدلال کرد وراثت‌پذیری هوش حدود ۰٫۸ است و برنامه‌های جبرانی آموزشی اثر کمی داشته‌اند؛ و فرضیهٔ سهم ژنتیکی در تفاوت میانگین گروه‌های نژادی را مطرح کرد. مقاله یکی از پرمناقشه‌ترین متون تاریخ روان‌شناسی شد.", "en": "Jensen (1969) argued that IQ heritability is about 0.8 and compensatory education had little effect, and raised the hypothesis of a genetic share in mean differences between racial groups. The article became one of the most contested texts in psychology.", "nl": "Jensen (1969) argued that IQ heritability is about 0.8 and compensatory education had little effect, and raised the hypothesis of a genetic share in mean differences between racial groups. The article became one of the most contested texts in psychology."}, "sources": ["src:c25a1254f7"], "flags": ["contested"]}, {"text": {"fa": "خطای منطقی مرکزی که منتقدان نشان دادند: وراثت‌پذیری بالا درون گروه هیچ چیز دربارهٔ علت تفاوت بین گروه‌ها نمی‌گوید (مثال بذرهای یکسان در دو خاک متفاوت).", "en": "The central logical error critics pointed out: high heritability within a group says nothing about the cause of differences between groups (the same seeds in two different soils).", "nl": "The central logical error critics pointed out: high heritability within a group says nothing about the cause of differences between groups (the same seeds in two different soils)."}, "sources": ["src:ba8f3ee8f4"], "flags": []}, {"text": {"fa": "اثر فلین: در ۱۴ کشور نمرهٔ هوش خام در یک نسل ۵ تا ۲۵ نمره بالا رفت؛ فراتحلیل ۲۰۱۵ (۴ میلیون نفر، ۳۱ کشور): حدود ۳ نمره در دهه، با کند شدن در دهه‌های اخیر. ژن‌ها در یک نسل عوض نمی‌شوند؛ پس این محیط است.", "en": "The Flynn effect: in 14 nations raw IQ scores rose 5 to 25 points in a generation; a 2015 meta-analysis (4 million people, 31 countries): about 3 points per decade, slowing recently. Genes do not change in a generation; this is environment.", "nl": "The Flynn effect: in 14 nations raw IQ scores rose 5 to 25 points in a generation; a 2015 meta-analysis (4 million people, 31 countries): about 3 points per decade, slowing recently. Genes do not change in a generation; this is environment."}, "sources": ["src:ba9f6ce267", "src:81bc3ff922"], "flags": []}, {"text": {"fa": "جمع‌بندی امروزی: وراثت‌پذیری هوش در بزرگسالی حدود ۰٫۵ تا ۰٫۸ و در کودکی کمتر است؛ نمره‌های چندژنی هنوز فقط چند درصد را پیش‌بینی می‌کنند؛ و تفاوت میانگین گروه‌ها توضیح ژنتیکی اثبات‌شده ندارد.", "en": "Current summary: adult IQ heritability is about 0.5 to 0.8 and lower in childhood; polygenic scores still predict only a few percent; and mean differences between groups have no demonstrated genetic explanation.", "nl": "Current summary: adult IQ heritability is about 0.5 to 0.8 and lower in childhood; polygenic scores still predict only a few percent; and mean differences between groups have no demonstrated genetic explanation."}, "sources": ["src:5cdd7ce079", "src:65b756684e"], "flags": []}], "links": [{"to": "tabar:gene-environment", "rel": "prerequisite", "note": {"fa": "تعامل ژن و محیط", "en": "Gene–environment interplay", "nl": "Gene–environment interplay"}}, {"to": "tabar:race-biology", "rel": "see-also", "note": {"fa": "آیا نژاد مقولهٔ زیستی است؟", "en": "Is race a biological category?", "nl": "Is race a biological category?"}}, {"to": "psy:p-psychometrics", "rel": "bridges", "note": {"fa": "روان‌سنجی هوش در ویکی روان", "en": "Psychometrics of intelligence in the psychology wiki", "nl": "Psychometrics of intelligence in the psychology wiki"}}], "people": ["core:arthur-jensen", "core:james-flynn", "core:eric-turkheimer"], "sources": ["src:5cdd7ce079", "src:65b756684e", "src:81bc3ff922", "src:ba8f3ee8f4", "src:ba9f6ce267", "src:c25a1254f7"], "booklets": [], "origin": "course:arthur-jensen", "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:behavior-genetics", "kind": "field", "title": {"fa": "ژنتیک رفتاری", "en": "Behaviour genetics", "nl": "Gedragsgenetica"}, "aliases": [], "parent": "tabar:tabar", "field": null, "summary": {"fa": "چه سهمی از تفاوت‌های ما در شخصیت، هوش و سلامت روان به تفاوت‌های ژنتیکی برمی‌گردد و این عدد چه معنایی دارد؟", "en": "What share of our differences in personality, intelligence and mental health traces to genetic differences, and what does that number mean?", "nl": "Welk deel van onze verschillen in persoonlijkheid, intelligentie en mentale gezondheid gaat terug op genetische verschillen, en wat betekent dat getal?"}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:out-of-africa", "kind": "concept", "title": {"fa": "خاستگاه آفریقایی انسان خردمند", "en": "The African origin of Homo sapiens", "nl": "De Afrikaanse oorsprong van Homo sapiens"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "همهٔ انسان‌های امروزی از جمعیتی برآمده‌اند که در آفریقا شکل گرفت و در ۵۰ تا ۷۰ هزار سال اخیر در جهان پخش شد؛ تنوع ژنتیکی بیرون آفریقا زیرمجموعه‌ای از تنوع درون آفریقاست.", "en": "All living humans descend from a population that formed in Africa and spread across the world in the last 50 to 70 thousand years; genetic diversity outside Africa is a subset of the diversity within it.", "nl": "Alle levende mensen stammen af van een bevolking die in Afrika ontstond en zich in de laatste 50 tot 70 duizend jaar over de wereld verspreidde; de genetische diversiteit buiten Afrika is een deelverzameling van die binnen Afrika."}, "points": [{"text": {"fa": "بیشترین تنوع ژنتیکی انسان در آفریقاست و هرچه از آفریقا دورتر می‌شویم تنوع کمتر می‌شود: اثر «بنیان‌گذار» پیاپی مهاجرت‌های کوچک.", "en": "Human genetic diversity is greatest in Africa and declines with distance from it: the serial \"founder effect\" of small migrating groups.", "nl": "Human genetic diversity is greatest in Africa and declines with distance from it: the serial \"founder effect\" of small migrating groups."}, "sources": ["src:50f6134be0", "src:3dd3045232"], "flags": []}, {"text": {"fa": "تصویر امروزی پیچیده‌تر از یک خروج واحد است: چند موج، بازگشت‌ها، و ساختار جمعیتی درون آفریقا («چندمنطقه‌ای آفریقایی»)، همراه با آمیزش با انسان‌های کهن بیرون آفریقا.", "en": "Today's picture is more complex than a single exit: several waves, back-migrations, and population structure within Africa (\"African multiregionalism\"), plus admixture with archaic humans outside Africa.", "nl": "Today's picture is more complex than a single exit: several waves, back-migrations, and population structure within Africa (\"African multiregionalism\"), plus admixture with archaic humans outside Africa."}, "sources": ["src:8b730d2385"], "flags": []}], "links": [{"to": "tabar:neanderthal-admixture", "rel": "see-also", "note": {"fa": "آمیزش با نئاندرتال و دنیسووا", "en": "Admixture with Neanderthals and Denisovans", "nl": "Admixture with Neanderthals and Denisovans"}}, {"to": "tabar:race-biology", "rel": "evidence-for", "note": {"fa": "چرا تنوع انسانی پیوسته است نه گسسته", "en": "Why human variation is continuous, not discrete", "nl": "Why human variation is continuous, not discrete"}}], "people": ["core:svante-p-bo", "core:sarah-tishkoff"], "sources": ["src:3dd3045232", "src:50f6134be0", "src:8b730d2385"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:genetics-society", "kind": "field", "title": {"fa": "ژن، نژاد و اخلاق", "en": "Genes, race & ethics", "nl": "Genen, ras & ethiek"}, "aliases": [], "parent": "tabar:tabar", "field": null, "summary": {"fa": "آیا «نژاد» مقولهٔ زیست‌شناختی است؟ ژنتیک چه خطاهای فکری می‌سازد و چه سابقهٔ تاریکی دارد؟", "en": "Is \"race\" a biological category? What thinking errors does genetics invite, and what dark history does it carry?", "nl": "Is \"ras\" een biologische categorie? Welke denkfouten lokt genetica uit, en welke donkere geschiedenis draagt ze mee?"}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:race-biology", "kind": "concept", "title": {"fa": "آیا «نژاد» مقولهٔ زیست‌شناختی است؟", "en": "Is \"race\" a biological category?", "nl": "Is \"ras\" een biologische categorie?"}, "aliases": [], "parent": "tabar:genetics-society", "field": "tabar:genetics-society", "summary": {"fa": "حدود ۸۵ تا ۹۰ درصد تنوع ژنتیکی انسان درون جمعیت‌هاست، نه بین آن‌ها؛ تنوع، پیوسته و جغرافیایی است، نه گسسته. با این حال الگوریتم‌ها می‌توانند تبار قاره‌ای را از دی‌ان‌ای تشخیص دهند. هر دو واقعیت درست‌اند؛ «نژاد» اجتماعی مقوله‌ای واقعی با پیامد واقعی است، اما مرزهایش زیست‌شناختی نیست.", "en": "About 85 to 90 percent of human genetic variation lies within populations, not between them; variation is continuous and geographic, not discrete. Yet algorithms can infer continental ancestry from DNA. Both facts are true; social \"race\" is a real category with real consequences, but its boundaries are not biological.", "nl": "Zo'n 85 tot 90 procent van de menselijke genetische variatie ligt binnen populaties, niet ertussen; variatie is continu en geografisch, niet discreet. Toch kunnen algoritmen continentale afstamming uit DNA afleiden. Beide feiten kloppen; sociaal \"ras\" is een echte categorie met echte gevolgen, maar de grenzen ervan zijn niet biologisch."}, "points": [{"text": {"fa": "لوونتین (۱۹۷۲): حدود ۸۵ درصد تنوع ژنتیکی بین افراد درون یک جمعیت است، ۸ درصد بین جمعیت‌های یک «نژاد» و فقط ۶ درصد بین «نژاد»ها؛ نتیجه: طبقه‌بندی نژادی ارزش زیست‌شناختی اندکی دارد.", "en": "Lewontin (1972): about 85 percent of genetic variation is between individuals within a population, 8 percent between populations of one \"race\" and only 6 percent between \"races\"; conclusion: racial classification has little biological value.", "nl": "Lewontin (1972): about 85 percent of genetic variation is between individuals within a population, 8 percent between populations of one \"race\" and only 6 percent between \"races\"; conclusion: racial classification has little biological value."}, "sources": ["src:f5e4bb7bf1"], "flags": []}, {"text": {"fa": "ادواردز (۲۰۰۳، «مغالطهٔ لوونتین»): درست است که هر ژن به‌تنهایی کم اطلاع می‌دهد، ولی همبستگی میان هزاران ژن اجازه می‌دهد تبار قاره‌ای با دقت بالا تشخیص داده شود؛ روزنبرگ (۲۰۰۲) با ۳۷۷ نشانگر پنج تا شش خوشهٔ جغرافیایی یافت.", "en": "Edwards (2003, \"Lewontin's fallacy\"): true, each gene alone says little, but correlations among thousands of genes allow continental ancestry to be inferred with high accuracy; Rosenberg (2002) found five to six geographic clusters with 377 markers.", "nl": "Edwards (2003, \"Lewontin's fallacy\"): true, each gene alone says little, but correlations among thousands of genes allow continental ancestry to be inferred with high accuracy; Rosenberg (2002) found five to six geographic clusters with 377 markers."}, "sources": ["src:fa0bbed230", "src:50f6134be0"], "flags": ["contested"]}, {"text": {"fa": "جمع‌بندی انجمن انسان‌شناسان زیستی آمریکا (۲۰۱۹): خوشه‌های ژنتیکی وجود دارند ولی با «نژاد»های اجتماعی منطبق نیستند، مرز گسسته ندارند و به نمونه‌گیری وابسته‌اند؛ نژاد ساختهٔ اجتماعی با ریشهٔ تاریخی است، نه واحد زیستی.", "en": "The American Association of Biological Anthropologists' summary (2019): genetic clusters exist but do not map onto social \"races\", have no discrete boundaries and depend on sampling; race is a social construct with historical roots, not a biological unit.", "nl": "The American Association of Biological Anthropologists' summary (2019): genetic clusters exist but do not map onto social \"races\", have no discrete boundaries and depend on sampling; race is a social construct with historical roots, not a biological unit."}, "sources": ["src:58cd70ce2e"], "flags": []}, {"text": {"fa": "در ایران مفهوم «نژاد آریایی» میراث نژادشناسی اروپایی قرن نوزدهم است؛ دی‌ان‌ای باستانی نشان می‌دهد ای
