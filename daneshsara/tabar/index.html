رانیان، مانند همهٔ جمعیت‌ها، آمیزه‌ای از چند لایهٔ تبارند.", "en": "In Iran the notion of an \"Aryan race\" is a legacy of nineteenth-century European raciology; ancient DNA shows Iranians, like all populations, are a blend of several ancestry layers.", "nl": "In Iran the notion of an \"Aryan race\" is a legacy of nineteenth-century European raciology; ancient DNA shows Iranians, like all populations, are a blend of several ancestry layers."}, "sources": ["src:73a4e45469", "src:02461bf7f4"], "flags": ["editor-note"]}], "links": [{"to": "tabar:out-of-africa", "rel": "explains", "note": {"fa": "چرا تنوع پیوسته است", "en": "Why variation is continuous", "nl": "Why variation is continuous"}}, {"to": "tabar:iq-heritability-debate", "rel": "see-also", "note": {"fa": "تفاوت میانگین گروه‌ها", "en": "Mean differences between groups", "nl": "Mean differences between groups"}}, {"to": "psy:dehumanization", "rel": "bridges", "note": {"fa": "انسان‌زدایی در ویکی روان", "en": "Dehumanization in the psychology wiki", "nl": "Dehumanization in the psychology wiki"}}, {"to": "tabar:eugenics", "rel": "see-also", "note": {"fa": "تاریخ تاریک", "en": "The dark history", "nl": "The dark history"}}], "people": ["core:richard-lewontin", "core:luigi-luca-cavalli-sforza"], "sources": ["src:02461bf7f4", "src:50f6134be0", "src:58cd70ce2e", "src:73a4e45469", "src:f5e4bb7bf1", "src:fa0bbed230"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:neanderthal-admixture", "kind": "concept", "title": {"fa": "آمیزش با نئاندرتال‌ها و دنیسوواها", "en": "Admixture with Neanderthals and Denisovans", "nl": "Vermenging met Neanderthalers en Denisovamensen"}, "aliases": [], "parent": "tabar:human-evolution", "field": "tabar:human-evolution", "summary": {"fa": "انسان خردمند با خویشاوندان کهن خود فرزند آورد: همهٔ مردم بیرون آفریقا حدود ۱ تا ۲ درصد دی‌ان‌ای نئاندرتال دارند و مردم اقیانوسیه تا چند درصد دی‌ان‌ای دنیسووا. «ما» و «آن‌ها» گونه‌های کاملاً جدا نبودند.", "en": "Homo sapiens had children with its archaic relatives: everyone outside Africa carries about 1 to 2 percent Neanderthal DNA, and people of Oceania up to several percent Denisovan DNA. \"Us\" and \"them\" were not fully separate species.", "nl": "Homo sapiens kreeg kinderen met zijn archaïsche verwanten: iedereen buiten Afrika draagt zo'n 1 tot 2 procent Neanderthaler-DNA, en mensen uit Oceanië tot enkele procenten Denisova-DNA. \"Wij\" en \"zij\" waren geen volledig gescheiden soorten."}, "points": [{"text": {"fa": "گرین و همکاران (۲۰۱۰): پیش‌نویس ژنوم نئاندرتال از استخوان‌های غار ویندیا (کرواسی)؛ مردم اوراسیا ۱ تا ۴ درصد (برآورد بعدی: حدود ۲ درصد) با نئاندرتال‌ها اشتراک دارند و آفریقایی‌ها تقریباً هیچ.", "en": "Green et al. (2010): draft Neanderthal genome from Vindija Cave (Croatia) bones; Eurasians share 1 to 4 percent (later estimate: about 2 percent) with Neanderthals, Africans almost none.", "nl": "Green et al. (2010): draft Neanderthal genome from Vindija Cave (Croatia) bones; Eurasians share 1 to 4 percent (later estimate: about 2 percent) with Neanderthals, Africans almost none."}, "sources": ["src:ca65b3b7c6"], "flags": []}, {"text": {"fa": "رایش و همکاران (۲۰۱۰): از یک بند انگشت در غار دنیسووا (سیبری) گروهی ناشناختهٔ انسان‌های کهن کشف شد که ۴ تا ۶ درصد ژنوم مردم ملانزی را می‌سازد.", "en": "Reich et al. (2010): from one finger bone in Denisova Cave (Siberia), an unknown archaic human group was discovered that makes up 4 to 6 percent of Melanesian genomes.", "nl": "Reich et al. (2010): from one finger bone in Denisova Cave (Siberia), an unknown archaic human group was discovered that makes up 4 to 6 percent of Melanesian genomes."}, "sources": ["src:3c51e5e6aa"], "flags": []}, {"text": {"fa": "پابو برای این کار نوبل پزشکی ۲۰۲۲ را گرفت. بعضی واریانت‌های نئاندرتالی امروز با ایمنی، پوست و حتی شدت کووید-۱۹ پیوند دارند.", "en": "Pääbo received the 2022 Nobel Prize in Medicine for this work. Some Neanderthal variants are today linked to immunity, skin and even COVID-19 severity.", "nl": "Pääbo received the 2022 Nobel Prize in Medicine for this work. Some Neanderthal variants are today linked to immunity, skin and even COVID-19 severity."}, "sources": ["src:8b730d2385"], "flags": []}], "links": [{"to": "tabar:out-of-africa", "rel": "part-of", "note": {"fa": "بخشی از داستان خروج از آفریقا", "en": "Part of the out-of-Africa story", "nl": "Part of the out-of-Africa story"}}, {"to": "tabar:ancient-dna", "rel": "evidence-for", "note": {"fa": "نخستین پیروزی بزرگ دی‌ان‌ای باستانی", "en": "The first major triumph of ancient DNA", "nl": "The first major triumph of ancient DNA"}}], "people": ["core:svante-p-bo", "core:david-reich"], "sources": ["src:3c51e5e6aa", "src:8b730d2385", "src:ca65b3b7c6"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:ancestry-tests", "kind": "concept", "title": {"fa": "آزمون‌های تجاری تبار", "en": "Commercial ancestry tests", "nl": "Commerciële afstammingstests"}, "aliases": [], "parent": "tabar:genealogy", "field": "tabar:genealogy", "summary": {"fa": "«۴۲ درصد ایرانی، ۱۸ درصد قفقازی…» این درصدها مقایسهٔ دی‌ان‌ای شما با پنل مرجعِ شرکت است، نه واقعیتی ثابت؛ با تغییر پنل، عدد عوض می‌شود. برای یافتن خویشاوند زنده دقیق‌اند، برای «هویت» گمراه‌کننده.", "en": "\"42 percent Iranian, 18 percent Caucasian…\" These percentages compare your DNA to the company's reference panel, not a fixed reality; change the panel and the number changes. Accurate for finding living relatives, misleading for \"identity\".", "nl": "\"42 procent Iraans, 18 procent Kaukasisch…\" Deze percentages vergelijken uw DNA met het referentiepanel van het bedrijf, geen vaststaande werkelijkheid; verander het panel en het getal verandert. Nauwkeurig om levende verwanten te vinden, misleidend voor \"identiteit\"."}, "points": [{"text": {"fa": "رویال و همکاران (۲۰۱۰، انجمن ژنتیک انسانی آمریکا): استنباط تبار به پنل مرجع، الگوریتم و تعریف «جمعیت» وابسته است؛ درصدها را نباید با هویت قومی یا سلامت یکی گرفت.", "en": "Royal et al. (2010, American Society of Human Genetics): ancestry inference depends on the reference panel, the algorithm and the definition of \"population\"; percentages must not be equated with ethnic identity or health.", "nl": "Royal et al. (2010, American Society of Human Genetics): ancestry inference depends on the reference panel, the algorithm and the definition of \"population\"; percentages must not be equated with ethnic identity or health."}, "sources": ["src:9e55a626fc"], "flags": []}, {"text": {"fa": "ارلیش و همکاران (۲۰۱۸): با پایگاه‌دادهٔ ۱٫۲۸ میلیون نفر، حدود ۶۰ درصد آمریکاییانِ اروپایی‌تبار از راه خویشاوند دور (پسرعموی درجهٔ سه) قابل شناسایی‌اند، حتی اگر خودشان آزمایش نداده باشند؛ همین روش قاتل زنجیره‌ای «گلدن استیت» را در ۲۰۱۸ لو داد.", "en": "Erlich et al. (2018): with a database of 1.28 million people, about 60 percent of European-ancestry Americans can be identified via a distant relative (third cousin) even if they never tested; the same method exposed the \"Golden State Killer\" in 2018.", "nl": "Erlich et al. (2018): with a database of 1.28 million people, about 60 percent of European-ancestry Americans can be identified via a distant relative (third cousin) even if they never tested; the same method exposed the \"Golden State Killer\" in 2018."}, "sources": ["src:b4623b437c"], "flags": []}, {"text": {"fa": "برای ایرانیان: پنل‌های مرجع شرکت‌ها از خاورمیانه نمونهٔ کمی دارند، پس برچسب‌ها («ایرانی/قفقازی/عرب») درشت و ناپایدارند.", "en": "For Iranians: companies' reference panels have few Middle Eastern samples, so the labels (\"Iranian/Caucasian/Arab\") are coarse and unstable.", "nl": "For Iranians: companies' reference panels have few Middle Eastern samples, so the labels (\"Iranian/Caucasian/Arab\") are coarse and unstable."}, "sources": ["src:3c4d0940c4"], "flags": ["editor-note"]}], "links": [{"to": "tabar:haplogroups", "rel": "part-of", "note": {"fa": "خطوط مادری و پدری در گزارش", "en": "Maternal and paternal lines in the report", "nl": "Maternal and paternal lines in the report"}}, {"to": "tabar:common-ancestors", "rel": "prerequisite", "note": {"fa": "ریاضی نیاکان", "en": "The mathematics of ancestors", "nl": "The mathematics of ancestors"}}, {"to": "tabar:race-biology", "rel": "see-also", "note": {"fa": "خوشه در برابر نژاد", "en": "Cluster versus race", "nl": "Cluster versus race"}}], "people": ["core:yaniv-erlich"], "sources": ["src:3c4d0940c4", "src:9e55a626fc", "src:b4623b437c"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:epigenetics", "kind": "field", "title": {"fa": "اپی‌ژنتیک", "en": "Epigenetics", "nl": "Epigenetica"}, "aliases": [], "parent": "tabar:tabar", "field": null, "summary": {"fa": "محیط چگونه روی خواندنِ ژن‌ها اثر می‌گذارد و آیا این اثر به نسل بعد می‌رسد؟", "en": "How does environment affect how genes are read, and does that reach the next generation?", "nl": "Hoe beïnvloedt de omgeving het aflezen van genen, en bereikt dat de volgende generatie?"}, "points": [], "links": [], "people": [], "sources": [], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:gene-environment", "kind": "concept", "title": {"fa": "تعامل و همبستگی ژن و محیط", "en": "Gene–environment interplay", "nl": "Samenspel van gen en omgeving"}, "aliases": [], "parent": "tabar:behavior-genetics", "field": "tabar:behavior-genetics", "summary": {"fa": "ژن و محیط دو ستون جدا نیستند: ژن‌ها محیط را انتخاب و برمی‌انگیزند، و محیط تعیین می‌کند ژن‌ها چقدر بروز کنند. این است که «چند درصد ژن، چند درصد محیط» سؤال بدی است.", "en": "Genes and environment are not two separate columns: genes select and evoke environments, and environments set how much genes express. That is why \"what percent genes, what percent environment\" is a bad question.", "nl": "Genen en omgeving zijn geen twee aparte kolommen: genen selecteren en roepen omgevingen op, en omgevingen bepalen hoeveel genen tot uiting komen. Daarom is \"hoeveel procent genen, hoeveel procent omgeving\" een slechte vraag."}, "points": [{"text": {"fa": "سه نوع همبستگی ژن–محیط: منفعل (والدین هم ژن می‌دهند هم محیط)، برانگیزاننده (کودک کنجکاو پاسخ‌های غنی‌تری می‌گیرد)، و فعال (آدم‌ها محیطی را انتخاب می‌کنند که با گرایش‌هایشان جور است).", "en": "Three kinds of gene–environment correlation: passive (parents give both genes and environment), evocative (a curious child draws richer responses), and active (people choose environments that fit their dispositions).", "nl": "Three kinds of gene–environment correlation: passive (parents give both genes and environment), evocative (a curious child draws richer responses), and active (people choose environments that fit their dispositions)."}, "sources": ["src:6104f13aa6"], "flags": []}, {"text": {"fa": "ترکهایمر (۲۰۰۳): در کودکان خانواده‌های فقیر آمریکایی وراثت‌پذیری هوش نزدیک صفر و در خانواده‌های مرفه بالا بود؛ محرومیت نمی‌گذارد تفاوت‌های ژنتیکی بروز کنند.", "en": "Turkheimer (2003): among children of poor US families the heritability of IQ was near zero, among affluent families high; deprivation keeps genetic differences from showing.", "nl": "Turkheimer (2003): among children of poor US families the heritability of IQ was near zero, among affluent families high; deprivation keeps genetic differences from showing."}, "sources": ["src:bf306944ea"], "flags": []}, {"text": {"fa": "تکرار: فراتحلیل ۲۰۱۶ این تعامل را در آمریکا تأیید کرد ولی در اروپای غربی و استرالیا نه؛ احتمالاً چون سیستم‌های رفاهی کف محیط را بالا می‌برند. یافته‌ای وابسته به بافت، نه قانون جهانی.", "en": "Replication: a 2016 meta-analysis confirmed the interaction in the US but not in Western Europe or Australia, probably because welfare systems raise the environmental floor. A context-dependent finding, not a universal law.", "nl": "Replication: a 2016 meta-analysis confirmed the interaction in the US but not in Western Europe or Australia, probably because welfare systems raise the environmental floor. A context-dependent finding, not a universal law."}, "sources": ["src:65b756684e"], "flags": ["contested"]}], "links": [{"to": "tabar:heritability", "rel": "explains", "note": {"fa": "چرا وراثت‌پذیری یک عدد ثابت نیست", "en": "Why heritability is not a fixed number", "nl": "Why heritability is not a fixed number"}}, {"to": "tabar:iq-heritability-debate", "rel": "prerequisite", "note": {"fa": "بدون این مفهوم بحث هوش گمراه‌کننده است", "en": "Without this concept the IQ debate misleads", "nl": "Without this concept the IQ debate misleads"}}], "people": ["core:eric-turkheimer"], "sources": ["src:6104f13aa6", "src:65b756684e", "src:bf306944ea"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:haplogroups", "kind": "concept", "title": {"fa": "هاپلوگروه‌ها: مادرتبار و پدرتبار", "en": "Haplogroups: maternal and paternal lines", "nl": "Haplogroepen: moeder- en vaderlijn"}, "aliases": ["mtDNA", "Y-DNA", "حوای میتوکندریایی", "آدم کروموزوم Y"], "parent": "tabar:population-genetics", "field": "tabar:population-genetics", "summary": {"fa": "دی‌ان‌ای میتوکندری فقط از مادر و کروموزوم Y فقط از پدر می‌رسد؛ پس دو «خطِ» تبار را بی‌آمیزش دنبال می‌کنند. خوب برای ردگیری مهاجرت‌های کهن، ضعیف برای گفتن «شما کی هستید»: فقط دو نیا از هزاران نیای شما.", "en": "Mitochondrial DNA comes only from the mother and the Y chromosome only from the father, so they trace two unmixed \"lines\" of descent. Good for tracking ancient migrations, poor at telling \"who you are\": just two of your thousands of ancestors.", "nl": "Mitochondriaal DNA komt alleen van de moeder en het Y-chromosoom alleen van de vader, dus volgen ze twee onvermengde \"lijnen\" van afstamming. Goed om oude migraties te volgen, slecht om te zeggen \"wie u bent\": slechts twee van uw duizenden voorouders."}, "points": [{"text": {"fa": "کان، استونکینگ و ویلسون (۱۹۸۷): همهٔ دی‌ان‌ای‌های میتوکندری امروزی به یک زن در آفریقا، حدود ۲۰۰ هزار سال پیش می‌رسند («حوای میتوکندریایی»)؛ او تنها زن زمان خود نبود، فقط تنها کسی است که خطِ مادری‌اش ناگسسته مانده.", "en": "Cann, Stoneking and Wilson (1987): all present-day mitochondrial DNA traces to one woman in Africa about 200 thousand years ago (\"mitochondrial Eve\"); she was not the only woman of her time, merely the only one whose maternal line survived unbroken.", "nl": "Cann, Stoneking and Wilson (1987): all present-day mitochondrial DNA traces to one woman in Africa about 200 thousand years ago (\"mitochondrial Eve\"); she was not the only woman of her time, merely the only one whose maternal line survived unbroken."}, "sources": ["src:3dd3045232"], "flags": []}, {"text": {"fa": "کروموزوم Y همین کار را برای خط پدری می‌کند و به دلیل جهش آهسته و نبودِ نوترکیبی نشانگر خوبی برای مهاجرت‌های مردان است.", "en": "The Y chromosome does the same for the paternal line and, due to slow mutation and no recombination, is a good marker of male migrations.", "nl": "The Y chromosome does the same for the paternal line and, due to slow mutation and no recombination, is a good marker of male migrations."}, "sources": ["src:9e723d4592"], "flags": []}, {"text": {"fa": "ده نسل عقب‌تر شما تا ۱٬۰۲۴ نیا دارید؛ هاپلوگروه فقط دربارهٔ ۲ نفر از آن‌ها حرف می‌زند. «هاپلوگروه R1a دارم پس آریایی‌ام» خطای رایج است.", "en": "Ten generations back you have up to 1,024 ancestors; a haplogroup speaks about 2 of them. \"I have haplogroup R1a so I am Aryan\" is a common error.", "nl": "Ten generations back you have up to 1,024 ancestors; a haplogroup speaks about 2 of them. \"I have haplogroup R1a so I am Aryan\" is a common error."}, "sources": ["src:9e55a626fc"], "flags": ["editor-note"]}], "links": [{"to": "tabar:ancestry-tests", "rel": "part-of", "note": {"fa": "یکی از سه چیزی که آزمون‌های تبار گزارش می‌کنند", "en": "One of three things ancestry tests report", "nl": "One of three things ancestry tests report"}}, {"to": "tabar:common-ancestors", "rel": "see-also", "note": {"fa": "ریاضی نیاکان", "en": "The mathematics of ancestors", "nl": "The mathematics of ancestors"}}], "people": [], "sources": ["src:3dd3045232", "src:9e55a626fc", "src:9e723d4592"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}, {"id": "tabar:eugenics", "kind": "concept", "title": {"fa": "به‌نژادی: تاریخ تاریک ژنتیک", "en": "Eugenics: the dark history of genetics", "nl": "Eugenetica: de donkere geschiedenis van de genetica"}, "aliases": [], "parent": "tabar:genetics-society", "field": "tabar:genetics-society", "summary": {"fa": "گالتون در ۱۸۸۳ واژهٔ eugenics را ساخت: «بهبود نژاد» با کنترل تولیدمثل. در نیمهٔ اول قرن بیستم به عقیم‌سازی اجباری ده‌ها هزار نفر در آمریکا و اسکاندیناوی و به نسل‌کشی نازی انجامید. ژنتیک امروز با همین سابقه زندگی می‌کند و هر بحث «ژن و جامعه» باید آن را به یاد داشته باشد.", "en": "Galton coined \"eugenics\" in 1883: \"improving the race\" by controlling reproduction. In the first half of the twentieth century it led to the forced sterilisation of tens of thousands in the US and Scandinavia and to Nazi genocide. Genetics lives with this record today, and every \"genes and society\" debate must remember it.", "nl": "Galton muntte in 1883 het woord \"eugenetica\": \"het ras verbeteren\" door de voortplanting te sturen. In de eerste helft van de twintigste eeuw leidde het tot gedwongen sterilisatie van tienduizenden in de VS en Scandinavië en tot de nazi-genocide. De genetica leeft vandaag met dit verleden, en elk debat over \"genen en samenleving\" moet het onthouden."}, "points": [{"text": {"fa": "کولز (۱۹۸۵): جنبش به‌نژادی در آمریکا و بریتانیا جریانی «پیشرو» و علمی‌نما بود؛ قوانین عقیم‌سازی در بیش از ۳۰ ایالت آمریکا تصویب شد و دیوان عالی در ۱۹۲۷ (پروندهٔ باک علیه بل) آن را تأیید کرد.", "en": "Kevles (1985): the eugenics movement in the US and Britain was a \"progressive\", science-flavoured current; sterilisation laws passed in over 30 US states and the Supreme Court upheld them in 1927 (Buck v. Bell).", "nl": "Kevles (1985): the eugenics movement in the US and Britain was a \"progressive\", science-flavoured current; sterilisation laws passed in over 30 US states and the Supreme Court upheld them in 1927 (Buck v. Bell)."}, "sources": ["src:34537dde7a"], "flags": []}, {"text": {"fa": "درس برای امروز: هاردن استدلال می‌کند پذیرفتن نقش ژن‌ها در تفاوت‌های اجتماعی لزوماً به‌نژادی نیست؛ می‌تواند، برعکس، پایه‌ای برای برابری‌خواهی باشد («بخت‌آزمایی ژنتیکی» را نباید با شایستگی اشتباه گرفت). این موضع خودش محل بحث است.", "en": "A lesson for today: Harden argues that accepting the role of genes in social differences is not necessarily eugenic; it can, conversely, ground egalitarianism (the \"genetic lottery\" must not be mistaken for merit). That position is itself debated.", "nl": "A lesson for today: Harden argues that accepting the role of genes in social differences is not necessarily eugenic; it can, conversely, ground egalitarianism (the \"genetic lottery\" must not be mistaken for merit). That position is itself debated."}, "sources": ["src:b1c0eba86d"], "flags": ["contested"]}], "links": [{"to": "tabar:race-biology", "rel": "see-also", "note": {"fa": "نژاد و زیست‌شناسی", "en": "Race and biology", "nl": "Race and biology"}}, {"to": "atlas:genethics", "rel": "part-of", "note": {"fa": "پل اخلاق ژنتیک", "en": "The genetic ethics bridge", "nl": "The genetic ethics bridge"}}, {"to": "psy:degeneration", "rel": "bridges", "note": {"fa": "نظریهٔ انحطاط در ویکی روان", "en": "Degeneration theory in the psychology wiki", "nl": "Degeneration theory in the psychology wiki"}}], "people": ["core:francis-galton", "core:kathryn-paige-harden"], "sources": ["src:34537dde7a", "src:b1c0eba86d"], "booklets": [], "origin": null, "iran": null, "wikidata": null, "status": "draft"}], "people": {"core:richard-wrangham": {"id": "core:richard-wrangham", "name": {"fa": "ریچارد رنگهام", "en": "Richard Wrangham", "nl": "Richard Wrangham"}, "years": "", "note": {"fa": "هاروارد"}, "wikidata": null, "wikis": ["psy"]}, "core:richard-lewontin": {"id": "core:richard-lewontin", "name": {"fa": "ریچار   const ppl = (c.people || []).map(id => D.people[id]).filter(Boolean).map(p => `<span>${esc(tx(p.name))}${p.years ? ` <small>${fa(p.years)}</small>` : ""}${L === "fa" && p.note && p.note.fa ? ` <small>— ${esc(p.note.fa)}</small>` : ""}</span>`).join("");
  const ir = c.iran && D.iran[c.iran];
  const iran = ir ? `<h2 class="sec">${T("iran")}</h2><div class="iran"><div class="q">${esc(tx(ir.question))}</div><div>${esc(tx(ir.finding))}</div><div class="status"><span class="grade">${T("grade")} ${esc(ir.grade)}</span><span>${fa(ir.year)}</span>${ir.method ? `<span>${T("method")}: ${esc(ir.method)}</span>` : ""}${ir.contested ? `<span class="flag contested">${T("contested")}</span>` : ""}</div>${ir.critique ? `<div class="nt"><b>${T("critique")}:</b> ${esc(ir.critique)}</div>` : ""}<div class="ref" dir="ltr" style="font-size:var(--chip);color:var(--ink-3);text-align:left">${(ir.source || []).map(s => s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>` : esc(s.title)).join("<br>")}</div></div>` : "";
  const srcs = srcIds.map((id, i) => { const s = D.sources[id]; if (!s) return ""; return `<li>${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.cite)}</a>` : esc(s.cite)} <small>(${T("tier")} ${fa(s.tier)})</small></li>`; }).join("");
  return `<article class="detail"><button class="back" data-back>${T("back")}</button>
   <div><div class="kick">${f ? esc(tx(f.title)) : ""}</div><h1>${esc(tx(c.title))}</h1>${L === "fa" && c.title.en ? `<div class="sub">${esc(c.title.en)}${c.title.nl && c.title.nl !== c.title.en ? ` · ${esc(c.title.nl)}` : ""}</div>` : ""}</div>
   <p class="lead">${esc(tx(c.summary))}</p>
   ${pts ? `<h2 class="sec">${T("points")}</h2><ol class="pts">${pts}</ol>` : ""}
   ${iran}
   ${links ? `<h2 class="sec">${T("links")}</h2><div class="links">${links}</div>` : ""}
   ${ppl ? `<h2 class="sec">${T("people")}</h2><div class="ppl">${ppl}</div>` : ""}
   ${srcs ? `<h2 class="sec">${T("sources")}</h2><ol class="src">${srcs}</ol>` : ""}
   <div class="status"><span class="draft">⚑ ${T(c.status)}</span>${c.origin ? `<span>${esc(c.origin)}</span>` : ""}</div></article>`;
}
function render(){
  const h = location.hash.slice(1); const c = h && BY[D.wiki + ":" + h];
  document.getElementById("main").innerHTML = c ? detail(c) : list();
  if (c) window.scrollTo({top: 0}); else { const i = document.getElementById("q"); if (i && q) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }
}
document.addEventListener("click", ev => {
  const g = ev.target.closest("[data-go]"); if (g) { location.hash = g.dataset.go.split(":")[1]; return; }
  if (ev.target.closest("[data-back]")) { history.pushState(null, "", location.pathname); render(); return; }
  const f = ev.target.closest("[data-f]"); if (f) { fieldSel = f.dataset.f || null; render(); }
});
document.addEventListener("keydown", ev => { if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches("[data-go]")) { ev.preventDefault(); ev.target.click(); } });
document.addEventListener("input", ev => { if (ev.target.id === "q") { q = ev.target.value; render(); } });
window.addEventListener("hashchange", render);
function i18n(){ document.documentElement.lang = L; document.documentElement.dir = L === "fa" ? "rtl" : "ltr"; document.querySelectorAll("[data-i]").forEach(el => el.textContent = T(el.dataset.i)); document.getElementById("wname").textContent = tx(ROOT.title); document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === L)); document.title = tx(ROOT.title) + " — " + (L === "fa" ? "دانش‌سرا" : "Daneshsara"); render(); }
document.querySelector(".lang").addEventListener("click", ev => { const b = ev.target.closest("[data-l]"); if (!b) return; L = b.dataset.l; try { localStorage.setItem("ds-lang", L); } catch(_) {} i18n(); });
i18n();
</script>
